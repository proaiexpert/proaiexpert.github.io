name: Temporary OG/favicon closeout patch

on:
  push:
    branches:
      - audit/og-favicon-final-closeout-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply targeted closeout patch
        run: python scripts/_temp-og-favicon-closeout.py
      - name: Verify source authority
        run: python scripts/apply-social-preview-defaults.py --mode check-source --root .
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Close OG and favicon source authority gaps [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
