name: Temporary OG/favicon final QA

on:
  push:
    branches:
      - audit/og-favicon-final-closeout-20260911

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify committed source authority
        run: python scripts/apply-social-preview-defaults.py --mode source --root .

      - name: Verify old root favicon files are absent
        shell: bash
        run: |
          test ! -e favicon.svg
          test ! -e favicon-16x16.png
          test ! -e favicon-32x32.png
          test -f favicon.ico
          test -f apple-touch-icon.png

      - name: Verify approved OG assets are committed
        shell: bash
        run: |
          test -f assets/social/proai-home-og-en-r1-1.png
          test -f assets/social/proai-home-og-ru-r1-1.png
          test ! -d .ai/social-preview-assets
          test ! -d assets/insights/og

      - name: Build site with Jekyll
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Normalize generated output guardrail
        run: python scripts/apply-social-preview-defaults.py --mode site --root _site

      - name: Verify generated output
        run: python scripts/apply-social-preview-defaults.py --mode check --root _site

      - name: Verify representative generated routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          en = 'https://proai-expert.com/assets/social/proai-home-og-en-r1-1.png'
          ru = 'https://proai-expert.com/assets/social/proai-home-og-ru-r1-1.png'
          icon = '/favicon.ico?v=20260910-r2'
          apple = '/apple-touch-icon.png?v=20260910-r2'
          routes = {
              'index.html': en,
              'ru/index.html': ru,
              'about/index.html': en,
              'ru/about/index.html': ru,
              'ai-systems/index.html': en,
              'ru/ai-systems/index.html': ru,
              'websites-branding/index.html': en,
              'ru/websites-branding/index.html': ru,
              'insights/index.html': en,
              'ru/insights/index.html': ru,
              'contact/index.html': en,
              'ru/contact/index.html': ru,
              'case-studies/index.html': en,
              'ru/case-studies/index.html': ru,
              'insights/does-your-service-business-need-a-multilingual-website/index.html': en,
              'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html': ru,
          }
          for route, image in routes.items():
              p = Path('_site') / route
              assert p.is_file(), route
              text = p.read_text(encoding='utf-8')
              assert text.count(f'<meta property="og:image" content="{image}">') == 1, route
              assert text.count(f'<meta name="twitter:image" content="{image}">') == 1, route
              assert text.count('<meta property="og:image:width" content="1200">') == 1, route
              assert text.count('<meta property="og:image:height" content="630">') == 1, route
              assert text.count('<meta name="twitter:card" content="summary_large_image">') == 1, route
              assert text.count(icon) == 1, route
              assert text.count(apple) == 1, route
              assert 'proai-home-en-desktop.png' not in text, route
              assert 'proai-home-ru-desktop.png' not in text, route
              assert '/assets/insights/og/' not in text, route
              assert '/favicon.svg' not in text, route
              assert '/favicon-16x16.png' not in text, route
              assert '/favicon-32x32.png' not in text, route
          print(f'Representative generated-route QA passed for {len(routes)} routes.')
          PY
