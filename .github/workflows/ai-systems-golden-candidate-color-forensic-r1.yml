name: AI Systems Golden Candidate Color Forensic R1
on:
  push:
    branches:
      - qa/ai-systems-golden-candidate-color-forensic-r1
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://ai-golden-recovery-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-golden-recovery-r1/
    steps:
      - uses: actions/checkout@v4
      - name: Trace color cascade in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p /tmp/colorqa && cd /tmp/colorqa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core --no-save --silent
          CHROME="$CHROME" node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
          const p=await b.newPage();await p.setViewport({width:1440,height:1100});await p.goto(process.env.URL,{waitUntil:'domcontentloaded',timeout:45000});await p.waitForFunction(()=>document.querySelector('.ai-r3-cta .ai-r3-btn--primary'),{timeout:20000});await new Promise(r=>setTimeout(r,1500));
          const cdp=await p.createCDPSession();await cdp.send('DOM.enable');await cdp.send('CSS.enable');const {root}=await cdp.send('DOM.getDocument',{depth:-1,pierce:true});
          for(const sel of ['.ai-r3-hero .ai-r3-btn--primary','.ai-r3-cta .ai-r3-btn--primary','.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)']){
            const {nodeId}=await cdp.send('DOM.querySelector',{nodeId:root.nodeId,selector:sel});const computed=await p.$eval(sel,e=>{const s=getComputedStyle(e);return{color:s.color,webkitTextFillColor:s.webkitTextFillColor,bg:s.background,border:s.border,borderRadius:s.borderRadius}});console.log('ELEMENT '+sel+' '+JSON.stringify(computed));
            const m=await cdp.send('CSS.getMatchedStylesForNode',{nodeId});
            for(const x of m.matchedCSSRules||[]){const r=x.rule,props=(r.style?.cssProperties||[]).filter(q=>['color','-webkit-text-fill-color','background','background-color','background-image','border-radius'].includes(q.name));if(props.length)console.log('RULE '+sel+' selector='+JSON.stringify((r.selectorList?.selectors||[]).map(s=>s.text).join(', '))+' origin='+r.origin+' props='+JSON.stringify(props.map(q=>({name:q.name,value:q.value,important:q.important||false,disabled:q.disabled||false}))));}
            console.log('INLINE '+JSON.stringify(m.inlineStyle?.cssProperties||[]));
          }
          await b.close();
          NODE
