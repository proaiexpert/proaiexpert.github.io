name: AI Systems Golden Micro Polish Existing Mirror R1

on:
  push:
    branches:
      - qa/ai-systems-golden-micro-polish-existing-mirror-r1

permissions:
  contents: read

jobs:
  chrome-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORIGIN: https://ai-golden-recovery-preview.proaiexpert-github-io.pages.dev
      EN_URL: https://ai-golden-recovery-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-golden-recovery-r1/
      RU_URL: https://ai-golden-recovery-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-golden-recovery-r1/ru/
    steps:
      - uses: actions/checkout@v4

      - name: Wait for candidate mirror content
        shell: bash
        run: |
          set -euo pipefail
          CSS="$ORIGIN/owner-preview/ai-systems-golden-recovery-r1/ai-systems-golden-recovery-r1.css?v=1"
          for i in $(seq 1 36); do
            EN=$(curl -L -sS -o /dev/null --max-time 15 -w '%{http_code}' "$EN_URL" || true)
            RU=$(curl -L -sS -o /dev/null --max-time 15 -w '%{http_code}' "$RU_URL" || true)
            BODY=$(curl -L -sS --max-time 15 "$CSS" || true)
            if [ "$EN" = "200" ] && [ "$RU" = "200" ] && printf '%s' "$BODY" | grep -q 'Golden Micro Polish R1'; then
              echo "candidate mirror ready: EN=$EN RU=$RU"
              exit 0
            fi
            echo "attempt=$i EN=$EN RU=$RU candidate_css=no"
            sleep 5
          done
          echo "candidate mirror did not expose micro-polish CSS" >&2
          exit 1

      - name: Prepare Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          mkdir -p /tmp/microqa && cd /tmp/microqa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core --no-save --silent

      - name: Run real Chrome viewport and interaction QA
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/microqa
          cat > qa.mjs <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const out=process.env.GITHUB_WORKSPACE+'/qa-evidence';
          fs.mkdirSync(out,{recursive:true});
          const cases=[
            ['en-desktop','en',process.env.EN_URL,1440,1100,true],
            ['ru-desktop','ru',process.env.RU_URL,1440,1100,true],
            ['en-mobile-390','en',process.env.EN_URL,390,844,true],
            ['ru-mobile-390','ru',process.env.RU_URL,390,844,true],
            ['en-landscape-844x390','en',process.env.EN_URL,844,390,false],
            ['ru-landscape-844x390','ru',process.env.RU_URL,844,390,false]
          ];
          const expected={
            en:{hero:'AI systems that do the work. You keep the decisions that matter.',test:'7 / 7 reference tests passing',imp:'8.36K',footer:'Build the system that knows when to act — and when to stop.',summary:'Process architecture, automation, agents, APIs and custom engineering for businesses that need more than another isolated AI tool.',sections:['01 · OPERATIONAL REGISTER','02 · ENGINEERING DEPTH','03 · VERIFIED PROAI REFERENCE IMPLEMENTATION','04 · PROCESS BEFORE TECHNOLOGY','05 · HUMAN CONTROL','06 · EVIDENCE BY CLASS','07 · INTEGRATIONS + CUSTOM LOGIC','08 · START WITH THE BOTTLENECK']},
            ru:{hero:'AI-системы, которые выполняют работу. Важные решения остаются за вами.',test:'7 / 7 reference-тестов проходят',imp:'8,36K',footer:'Строим системы, которые знают, когда действовать — и когда остановиться.',summary:'Архитектура процессов, автоматизация, агенты, API и собственная разработка для бизнеса, которому уже мало ещё одного изолированного AI-инструмента.',sections:['01 · КОНТУР УПРАВЛЕНИЯ','02 · ГЛУБИНА ИНЖЕНЕРИИ','03 · ПРОВЕРЕННАЯ РЕФЕРЕНСНАЯ РЕАЛИЗАЦИЯ PROAI','04 · СНАЧАЛА ПРОЦЕСС','05 · КОНТРОЛЬ ЧЕЛОВЕКОМ','06 · ДОКАЗАТЕЛЬСТВА ПО КЛАССАМ','07 · ИНТЕГРАЦИИ + СОБСТВЕННАЯ ЛОГИКА','08 · НАЧИНАЕМ С УЗКОГО МЕСТА']}
          };
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
          const num=v=>Number.parseFloat(v)||0;
          const styleOf=async(page,sel)=>page.$eval(sel,e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return{text:(e.textContent||'').replace(/\s+/g,' ').trim(),color:s.color,bg:s.backgroundColor,bgImg:s.backgroundImage,borderWidth:s.borderTopWidth,borderColor:s.borderTopColor,radius:s.borderRadius,opacity:s.opacity,blend:s.mixBlendMode,outlineWidth:s.outlineWidth,outlineStyle:s.outlineStyle,outlineColor:s.outlineColor,textDecoration:s.textDecorationLine,cursor:s.cursor,w:r.width,h:r.height,clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,display:s.display,visibility:s.visibility}});

          async function forceState(page,sel,state){
            const cdp=await page.createCDPSession();
            await cdp.send('DOM.enable'); await cdp.send('CSS.enable');
            const {root}=await cdp.send('DOM.getDocument',{depth:-1,pierce:true});
            const {nodeId}=await cdp.send('DOM.querySelector',{nodeId:root.nodeId,selector:sel});
            if(!nodeId)return {missing:true};
            const pseudos=state==='default'?[]:state==='hover'?['hover']:state==='focus-visible'?['focus','focus-visible']:state==='active'?['active']:['visited'];
            await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:pseudos});
            await new Promise(r=>setTimeout(r,120));
            const v=await styleOf(page,sel);
            await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:[]});
            await cdp.detach();
            return v;
          }

          async function run(c){
            const [name,lang,url,width,height,fullPage]=c;
            const page=await browser.newPage();
            await page.setViewport({width,height,deviceScaleFactor:1});
            const responses=[],requestFailures=[],consoleErrors=[],pageErrors=[];
            page.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            let http=0,navError='';
            try{
              const nav=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              http=nav?.status()||0;
              await page.waitForFunction(()=>document.querySelector('.home-footer-golden-r3')&&document.querySelector('.ai-golden-recovery-hero__neutral'),{timeout:20000});
              await new Promise(r=>setTimeout(r,1600));
            }catch(e){navError=String(e)}

            const exp=expected[lang];
            const data=await page.evaluate(async()=>{
              const q=s=>document.querySelector(s),vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};
              const text=(document.body?.innerText||'').replace(/\s+/g,' ').trim(),html=document.documentElement.outerHTML;
              const fs=[...document.querySelectorAll('.ai-r3-evidence-card')].find(e=>(e.innerText||'').includes('Financial Stream'));
              const footer=q('.home-footer-golden-r3');
              const links=[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href),scripts=[...document.querySelectorAll('script[src]')].map(x=>x.src);
              const linked=await Promise.all([...new Set([...links,...scripts])].map(async u=>{try{const r=await fetch(u,{cache:'no-store'});return{url:u,status:r.status}}catch(e){return{url:u,status:0,error:String(e)}}}));
              const pills=[...document.querySelectorAll('.ai-r3-btn')].filter(vis).map(e=>({text:e.textContent.trim(),radius:parseFloat(getComputedStyle(e).borderRadius)||0})).filter(x=>x.radius>=100);
              return{text,html,liquid:html.includes('{%')||html.includes('{{'),yaml:/^\s*---(?:\r?\n|\s)/.test(document.body?.innerText||''),header:vis(q('.site-header')),hero:vis(q('.ai-r3-hero')),heroText:(q('#ai-r3-hero-title')?.innerText||'').replace(/\s+/g,' ').trim(),neutral:vis(q('.ai-golden-recovery-hero__neutral')),test:(q('.ai-r3-test-result')?.innerText||'').replace(/\s+/g,' ').trim(),fs:(fs?.innerText||'').replace(/\s+/g,' ').trim(),footer:vis(footer),footerText:(footer?.innerText||'').replace(/\s+/g,' ').trim(),pills,linked,overflow:document.documentElement.scrollWidth-window.innerWidth};
            });

            const hp=await styleOf(page,'.ai-r3-hero .ai-r3-btn--primary');
            const hs=await styleOf(page,'.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)');
            const s8=await styleOf(page,'.ai-r3-cta .ai-r3-btn--primary');
            const fail=[],check=(ok,msg)=>{if(!ok)fail.push(msg)};
            check(http===200,`HTTP=${http}`);check(!navError,`NAV=${navError}`);check(!data.liquid,'RAW_LIQUID');check(!data.yaml,'YAML');check(data.header,'HEADER');check(data.hero&&data.heroText===exp.hero,`HERO=${data.heroText}`);check(data.neutral,'NEUTRAL');exp.sections.forEach(s=>check(data.text.includes(s),`SECTION=${s}`));check(data.test===exp.test,`TEST=${data.test}`);check(data.fs.includes('EN + RU'),'FS_EN_RU');check(data.fs.includes(exp.imp),`FS_IMP=${data.fs}`);check(/\b52\b/.test(data.fs),'FS_52');check(!/63\s*(?:Organic|clicks)|57\s*(?:Organic|clicks)|7\.24K|50\s*(?:indexed|pages|страниц)/i.test(data.fs),`FS_STALE=${data.fs}`);check(data.footer&&data.footerText.includes(exp.footer)&&data.footerText.includes(exp.summary),'FOOTER');check(data.overflow===0,`OVERFLOW=${data.overflow}`);check(data.pills.length===0,`PILLS=${JSON.stringify(data.pills)}`);
            check(num(hp.radius)===9,`HP_RADIUS=${hp.radius}`);check(hp.h>=49.5,`HP_HEIGHT=${hp.h}`);check(hp.bgImg!=='none',`HP_BG=${hp.bgImg}`);check(hp.color==='rgb(242, 240, 235)'||hp.color==='rgb(255, 255, 255)',`HP_COLOR=${hp.color}`);
            check(num(hs.radius)===0,`HS_RADIUS=${hs.radius}`);check(num(hs.borderWidth)===0,`HS_BORDER=${hs.borderWidth}`);check(hs.bgImg==='none',`HS_BG=${hs.bgImg}`);check(hs.h>=43.5,`HS_HEIGHT=${hs.h}`);if(width<=520)check(hs.w<width*.75,`HS_MOBILE_WIDTH=${hs.w}`);
            check(num(s8.radius)===9,`S8_RADIUS=${s8.radius}`);check(s8.h>=49.5,`S8_HEIGHT=${s8.h}`);check(s8.bgImg!=='none',`S8_BG=${s8.bgImg}`);check(s8.color==='rgb(242, 240, 235)'||s8.color==='rgb(255, 255, 255)',`S8_COLOR=${s8.color}`);
            const linkedBad=data.linked.filter(x=>x.status!==200);check(linkedBad.length===0,`LINKED=${JSON.stringify(linkedBad)}`);const localBad=responses.filter(x=>x.url.startsWith(process.env.ORIGIN)&&['document','stylesheet','script','font','image'].includes(x.type)&&x.status>=400);check(localBad.length===0,`ASSET_HTTP=${JSON.stringify(localBad)}`);check(requestFailures.length===0,`REQUEST_FAIL=${JSON.stringify(requestFailures)}`);check(consoleErrors.length===0,`CONSOLE=${JSON.stringify(consoleErrors)}`);check(pageErrors.length===0,`PAGE_ERROR=${JSON.stringify(pageErrors)}`);

            const stateAudit={};
            if(width===1440||width===390){
              const targets={heroPrimary:'.ai-r3-hero .ai-r3-btn--primary',heroSecondary:'.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)',section08:'.ai-r3-cta .ai-r3-btn--primary',headerCta:'.site-header__cta',headerLocale:'.site-header__locale',footerCta:'.home-footer-golden-r3__action',footerEmail:'.home-footer-golden-r3__contact a[href^="mailto:"]',footerSocial:'.home-footer-golden-r3__social-rail a',footerLocale:'.home-footer-golden-r3__locale a',mobileMenu:'.site-header__menu-toggle'};
              for(const [key,sel] of Object.entries(targets)){
                const exists=await page.$(sel);if(!exists)continue;
                const visible=await page.$eval(sel,e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'});
                if(!visible)continue;
                stateAudit[key]={};
                const states=key==='mobileMenu'?['default','hover','focus-visible','active']:['default','hover','focus-visible','active','visited'];
                for(const state of states){
                  const v=await forceState(page,sel,state);stateAudit[key][state]=v;
                  check(Number(v.opacity)>=.5,`${key} ${state} opacity=${v.opacity}`);check(v.scrollWidth<=Math.ceil(v.clientWidth)+3,`${key} ${state} clip=${v.scrollWidth}/${v.clientWidth}`);if(state==='focus-visible')check(num(v.outlineWidth)>=1&&v.outlineStyle!=='none',`${key} focus=${v.outlineWidth} ${v.outlineStyle}`);
                }
              }
              for(const [key,selector] of [['heroPrimary','.ai-r3-hero .ai-r3-btn--primary'],['section08','.ai-r3-cta .ai-r3-btn--primary']]){
                const states=stateAudit[key]||{};for(const [state,v] of Object.entries(states)){check(num(v.radius)===9,`${key} ${state} radius=${v.radius}`);check(v.bgImg!=='none',`${key} ${state} bg=${v.bgImg}`);check(v.color==='rgb(242, 240, 235)'||v.color==='rgb(255, 255, 255)',`${key} ${state} color=${v.color}`)}
              }
              for(const [state,v] of Object.entries(stateAudit.heroSecondary||{})){check(num(v.radius)===0,`heroSecondary ${state} radius=${v.radius}`);check(num(v.borderWidth)===0,`heroSecondary ${state} border=${v.borderWidth}`);check(v.bgImg==='none',`heroSecondary ${state} bg=${v.bgImg}`)}
            }

            await page.screenshot({path:`${out}/${name}.png`,fullPage});
            if(width===1440){
              for(const [label,sel] of [['hero-primary','.ai-r3-hero .ai-r3-btn--primary'],['hero-secondary','.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)'],['section08','.ai-r3-cta .ai-r3-btn--primary']]){
                for(const state of ['default','hover','focus-visible','active']){
                  await forceState(page,sel,state);
                  const el=await page.$(sel);if(el)await el.screenshot({path:`${out}/${name}-${label}-${state}.png`});
                }
              }
            }
            const result={name,http,pass:fail.length===0,fail,missingCss:data.linked.filter(x=>/\.css(?:\?|$)/.test(x.url)&&x.status!==200),missingJs:data.linked.filter(x=>/\.m?js(?:\?|$)/.test(x.url)&&x.status!==200),overflow:data.overflow,pills:data.pills,consoleErrors,pageErrors,requestFailures,hp,hs,s8,stateAudit};
            console.log(`CASE ${name} ${result.pass?'PASS':'FAIL'} HTTP=${http} CSS=${result.missingCss.length} JS=${result.missingJs.length} OVERFLOW=${result.overflow} PILLS=${result.pills.length}`);fail.forEach(x=>console.log(`FAIL ${name}: ${x}`));await page.close();return result;
          }

          const results=[];for(const c of cases)results.push(await run(c));await browser.close();const report={generatedAt:new Date().toISOString(),pass:results.every(x=>x.pass),results};fs.writeFileSync(`${out}/qa-report.json`,JSON.stringify(report,null,2));fs.writeFileSync(`${out}/qa-summary.txt`,results.map(r=>`${r.name}: ${r.pass?'PASS':'FAIL'} HTTP=${r.http} CSS=${r.missingCss.length} JS=${r.missingJs.length} overflow=${r.overflow} pills=${r.pills.length}`).join('\n')+`\nOVERALL: ${report.pass?'PASS':'FAIL'}\n`);console.log(JSON.stringify(report,null,2));if(!report.pass)process.exit(1);
          NODE
          node qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-golden-micro-polish-existing-mirror-r1
          path: qa-evidence/
          if-no-files-found: warn
