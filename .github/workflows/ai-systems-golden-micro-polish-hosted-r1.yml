name: AI Systems Golden Micro Polish Hosted R1

on:
  push:
    branches:
      - qa/ai-systems-golden-micro-polish-hosted-r1

permissions:
  contents: read

jobs:
  hosted-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ORIGIN: https://ai-golden-micro-polish-preview.proaiexpert-github-io.pages.dev
      EN_URL: https://ai-golden-micro-polish-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-golden-recovery-r1/
      RU_URL: https://ai-golden-micro-polish-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-golden-recovery-r1/ru/
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare mirror
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            EN=$(curl -L -sS -o /dev/null --max-time 15 -w '%{http_code}' "$EN_URL" || true)
            RU=$(curl -L -sS -o /dev/null --max-time 15 -w '%{http_code}' "$RU_URL" || true)
            echo "attempt=$i EN=$EN RU=$RU"
            if [ "$EN" = "200" ] && [ "$RU" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Prepare Chrome QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          mkdir -p /tmp/microqa && cd /tmp/microqa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core --no-save --silent

      - name: Verify page, CTA geometry, interaction states
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/microqa
          cat > qa.mjs <<'NODE'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const cases=[
            ['en-desktop','en',process.env.EN_URL,1440,1100,true],
            ['ru-desktop','ru',process.env.RU_URL,1440,1100,true],
            ['en-mobile-390','en',process.env.EN_URL,390,844,true],
            ['ru-mobile-390','ru',process.env.RU_URL,390,844,true],
            ['en-landscape-844x390','en',process.env.EN_URL,844,390,false],
            ['ru-landscape-844x390','ru',process.env.RU_URL,844,390,false]
          ];
          const tokens={
            en:{hero:'AI systems that do the work. You keep the decisions that matter.',test:'7 / 7 reference tests passing',imp:'8.36K',footer:'Build the system that knows when to act — and when to stop.',summary:'Process architecture, automation, agents, APIs and custom engineering for businesses that need more than another isolated AI tool.',sections:['01 · OPERATIONAL REGISTER','02 · ENGINEERING DEPTH','03 · VERIFIED PROAI REFERENCE IMPLEMENTATION','04 · PROCESS BEFORE TECHNOLOGY','05 · HUMAN CONTROL','06 · EVIDENCE BY CLASS','07 · INTEGRATIONS + CUSTOM LOGIC','08 · START WITH THE BOTTLENECK']},
            ru:{hero:'AI-системы, которые выполняют работу. Важные решения остаются за вами.',test:'7 / 7 reference-тестов проходят',imp:'8,36K',footer:'Строим системы, которые знают, когда действовать — и когда остановиться.',summary:'Архитектура процессов, автоматизация, агенты, API и собственная разработка для бизнеса, которому уже мало ещё одного изолированного AI-инструмента.',sections:['01 · КОНТУР УПРАВЛЕНИЯ','02 · ГЛУБИНА ИНЖЕНЕРИИ','03 · ПРОВЕРЕННАЯ РЕФЕРЕНСНАЯ РЕАЛИЗАЦИЯ PROAI','04 · СНАЧАЛА ПРОЦЕСС','05 · КОНТРОЛЬ ЧЕЛОВЕКОМ','06 · ДОКАЗАТЕЛЬСТВА ПО КЛАССАМ','07 · ИНТЕГРАЦИИ + СОБСТВЕННАЯ ЛОГИКА','08 · НАЧИНАЕМ С УЗКОГО МЕСТА']}
          };
          const controls=[
            ['header-brand','.site-header__brand','a'],['header-nav','.site-header__nav-link','a'],['header-cta','.site-header__cta','a'],['header-locale','.site-header__locale','a'],['mobile-menu','.site-header__menu-toggle','button'],
            ['hero-primary','.ai-r3-hero .ai-r3-btn--primary','a'],['hero-secondary','.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)','a'],['section08-cta','.ai-r3-cta .ai-r3-btn--primary','a'],
            ['footer-cta','.home-footer-golden-r3__action','a'],['footer-email','.home-footer-golden-r3__contact a[href^="mailto:"]','a'],['footer-telegram','.home-footer-golden-r3__contact a[href^="https://t.me/"]','a'],['footer-capability','.home-footer-golden-r3__capabilities a','a'],['footer-signature','.home-footer-golden-r3__signature','a'],['footer-logo','.home-footer-golden-r3__logo','a'],['footer-social','.home-footer-golden-r3__social-rail a','a'],['footer-locale','.home-footer-golden-r3__locale a','a']
          ];
          const out=process.env.GITHUB_WORKSPACE+'/micro-polish-qa-artifacts'; fs.mkdirSync(out,{recursive:true});
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});

          const parseNum=v=>Number.parseFloat(v)||0;
          const colorAlpha=v=>{const m=v.match(/rgba?\([^,]+,[^,]+,[^,]+(?:,\s*([\d.]+))?\)/);return m?(m[1]===undefined?1:Number(m[1])):1};
          const inspectState=async(page,cdp,root,name,selector,type)=>{
            const {nodeId}=await cdp.send('DOM.querySelector',{nodeId:root.nodeId,selector});
            if(!nodeId)return {name,selector,missing:true,states:{}};
            const visible=await page.$eval(selector,e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'}).catch(()=>false);
            const states={};
            const defs=type==='a'?[['default',[]],['hover',['hover']],['focus-visible',['focus','focus-visible']],['active',['active']],['visited',['visited']]]:[['default',[]],['hover',['hover']],['focus-visible',['focus','focus-visible']],['active',['active']]];
            for(const [state,pseudo] of defs){
              let forceError=''; try{await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:pseudo})}catch(e){forceError=String(e)}
              await new Promise(r=>setTimeout(r,40));
              const d=await page.$eval(selector,e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return{text:(e.textContent||'').replace(/\s+/g,' ').trim(),color:s.color,backgroundColor:s.backgroundColor,backgroundImage:s.backgroundImage,borderColor:s.borderTopColor,borderWidth:s.borderTopWidth,borderStyle:s.borderTopStyle,borderRadius:s.borderRadius,opacity:s.opacity,mixBlendMode:s.mixBlendMode,outlineWidth:s.outlineWidth,outlineStyle:s.outlineStyle,outlineColor:s.outlineColor,textDecoration:s.textDecorationLine,cursor:s.cursor,width:r.width,height:r.height,clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,clientHeight:e.clientHeight,scrollHeight:e.scrollHeight,display:s.display,visibility:s.visibility}});
              states[state]={...d,forceError};
            }
            await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:[]}).catch(()=>{});
            return {name,selector,visible,states};
          };

          const run=async([name,lang,url,width,height,fullPage])=>{
            const page=await browser.newPage(); await page.setViewport({width,height,deviceScaleFactor:1});
            const responses=[],requestFailures=[],consoleErrors=[],pageErrors=[];
            page.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            page.on('requestfailed',r=>requestFailures.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())}); page.on('pageerror',e=>pageErrors.push(String(e)));
            let navError='',http=0;
            try{const nav=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});http=nav?.status()||0;await page.waitForFunction(()=>document.querySelector('.home-footer-golden-r3')&&document.querySelector('.ai-golden-recovery-hero__neutral'),{timeout:20000});await new Promise(r=>setTimeout(r,1400))}catch(e){navError=String(e)}
            const exp=tokens[lang];
            const d=await page.evaluate(async()=>{
              const q=s=>document.querySelector(s),vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'};
              const text=(document.body?.innerText||'').replace(/\s+/g,' ').trim(),html=document.documentElement.outerHTML;
              const fs=[...document.querySelectorAll('.ai-r3-evidence-card')].find(x=>(x.innerText||'').includes('Financial Stream'));
              const h1=q('#ai-r3-hero-title'),heroPrimary=q('.ai-r3-hero .ai-r3-btn--primary'),heroSecondary=q('.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)'),sectionCta=q('.ai-r3-cta .ai-r3-btn--primary'),footer=q('.home-footer-golden-r3');
              const style=e=>{if(!e)return null;const s=getComputedStyle(e),r=e.getBoundingClientRect();return{radius:s.borderRadius,borderWidth:s.borderTopWidth,bg:s.backgroundColor,bgImg:s.backgroundImage,color:s.color,height:r.height,width:r.width,minHeight:s.minHeight,opacity:s.opacity}};
              const sheets=[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href),scripts=[...document.querySelectorAll('script[src]')].map(x=>x.src);
              const linked=await Promise.all([...new Set([...sheets,...scripts])].map(async u=>{try{const r=await fetch(u,{cache:'no-store'});return{url:u,status:r.status}}catch(e){return{url:u,status:0,error:String(e)}}}));
              const pills=[...document.querySelectorAll('.ai-r3-btn')].filter(vis).map(e=>({text:e.textContent.trim(),radius:parseFloat(getComputedStyle(e).borderRadius)||0})).filter(x=>x.radius>=100);
              return{text,html,liquid:html.includes('{%')||html.includes('{{'),yaml:/^\s*---(?:\r?\n|\s)/.test(document.body?.innerText||''),header:vis(q('.site-header')),hero:vis(q('.ai-r3-hero')),heroText:(h1?.innerText||'').replace(/\s+/g,' ').trim(),neutral:vis(q('.ai-golden-recovery-hero__neutral')),test:(q('.ai-r3-test-result')?.innerText||'').replace(/\s+/g,' ').trim(),fs:(fs?.innerText||'').replace(/\s+/g,' ').trim(),footer:vis(footer),footerText:(footer?.innerText||'').replace(/\s+/g,' ').trim(),heroPrimary:style(heroPrimary),heroSecondary:style(heroSecondary),sectionCta:style(sectionCta),linked,pills,overflow:document.documentElement.scrollWidth-window.innerWidth};
            });
            const cdp=await page.createCDPSession(); await cdp.send('DOM.enable'); await cdp.send('CSS.enable'); const {root}=await cdp.send('DOM.getDocument',{depth:-1,pierce:true});
            const interaction=[]; for(const c of controls)interaction.push(await inspectState(page,cdp,root,...c));
            await page.screenshot({path:`${out}/${name}.png`,fullPage});
            const fail=[],ck=(v,m)=>{if(!v)fail.push(m)};
            ck(http===200,`HTTP=${http}`);ck(!navError,`NAV=${navError}`);ck(!d.liquid,'RAW_LIQUID');ck(!d.yaml,'YAML');ck(d.header,'HEADER');ck(d.hero&&d.heroText===exp.hero,`HERO=${d.heroText}`);ck(d.neutral,'NEUTRAL');exp.sections.forEach(s=>ck(d.text.includes(s),`SECTION=${s}`));ck(d.test===exp.test,`TEST=${d.test}`);ck(d.fs.includes('EN + RU'),'FS_EN_RU');ck(d.fs.includes(exp.imp),`FS_IMP=${d.fs}`);ck(/\b52\b/.test(d.fs),'FS_52');ck(!/63\s*(?:Organic|clicks)|57\s*(?:Organic|clicks)|7\.24K|50\s*(?:indexed|pages|страниц)/i.test(d.fs),`FS_STALE=${d.fs}`);ck(d.footer&&d.footerText.includes(exp.footer)&&d.footerText.includes(exp.summary),'FOOTER');ck(d.overflow<=2,`OVERFLOW=${d.overflow}`);
            ck(parseNum(d.heroPrimary?.radius)===9,`HERO_PRIMARY_RADIUS=${d.heroPrimary?.radius}`);ck(d.heroPrimary?.height>=49.5,`HERO_PRIMARY_HEIGHT=${d.heroPrimary?.height}`);ck(d.heroPrimary?.bgImg!=='none',`HERO_PRIMARY_BG=${d.heroPrimary?.bgImg}`);ck(colorAlpha(d.heroPrimary?.color||'')>.9,`HERO_PRIMARY_COLOR=${d.heroPrimary?.color}`);
            ck(parseNum(d.heroSecondary?.radius)===0,`HERO_SECONDARY_RADIUS=${d.heroSecondary?.radius}`);ck(parseNum(d.heroSecondary?.borderWidth)===0,`HERO_SECONDARY_BORDER=${d.heroSecondary?.borderWidth}`);ck(d.heroSecondary?.bgImg==='none',`HERO_SECONDARY_BG=${d.heroSecondary?.bgImg}`);ck(d.heroSecondary?.height>=43.5,`HERO_SECONDARY_HEIGHT=${d.heroSecondary?.height}`);if(width<=520)ck(d.heroSecondary?.width<width*.75,`MOBILE_SECONDARY_WIDTH=${d.heroSecondary?.width}`);
            ck(parseNum(d.sectionCta?.radius)===9,`SECTION08_RADIUS=${d.sectionCta?.radius}`);ck(d.sectionCta?.height>=49.5,`SECTION08_HEIGHT=${d.sectionCta?.height}`);ck(d.sectionCta?.bgImg!=='none',`SECTION08_BG=${d.sectionCta?.bgImg}`);ck(d.pills.length===0,`PILLS=${JSON.stringify(d.pills)}`);
            const linkedBad=d.linked.filter(x=>x.status!==200);ck(linkedBad.length===0,`LINKED=${JSON.stringify(linkedBad)}`);const localBad=responses.filter(x=>x.url.startsWith(process.env.ORIGIN)&&['document','stylesheet','script','font','image'].includes(x.type)&&x.status>=400);ck(localBad.length===0,`ASSET_HTTP=${JSON.stringify(localBad)}`);ck(requestFailures.length===0,`REQUEST_FAILURE=${JSON.stringify(requestFailures)}`);ck(consoleErrors.length===0,`CONSOLE=${JSON.stringify(consoleErrors)}`);ck(pageErrors.length===0,`PAGE_ERROR=${JSON.stringify(pageErrors)}`);
            for(const ctrl of interaction.filter(x=>x.visible&&!x.missing)){
              for(const [state,s] of Object.entries(ctrl.states)){
                ck(colorAlpha(s.color)>.45,`INTERACTION_COLOR ${ctrl.name} ${state} ${s.color}`);ck(Number(s.opacity)>=.5,`INTERACTION_OPACITY ${ctrl.name} ${state} ${s.opacity}`);ck(s.scrollWidth<=Math.ceil(s.clientWidth)+3,`INTERACTION_CLIP ${ctrl.name} ${state} ${s.scrollWidth}/${s.clientWidth}`);
                if(state==='focus-visible')ck(parseNum(s.outlineWidth)>=1&&s.outlineStyle!=='none',`FOCUS ${ctrl.name} ${s.outlineWidth} ${s.outlineStyle}`);
              }
            }
            const heroP=interaction.find(x=>x.name==='hero-primary');const heroS=interaction.find(x=>x.name==='hero-secondary');const sec=interaction.find(x=>x.name==='section08-cta');
            for(const ctrl of [heroP,sec].filter(Boolean))for(const state of ['default','hover','focus-visible','active','visited']){const s=ctrl.states[state];if(!s)continue;ck(parseNum(s.borderRadius)===9,`STATE_RADIUS ${ctrl.name} ${state} ${s.borderRadius}`);ck(s.backgroundImage!=='none',`STATE_BG ${ctrl.name} ${state}`);ck(colorAlpha(s.color)>.9,`STATE_COLOR ${ctrl.name} ${state} ${s.color}`)}
            for(const state of ['default','hover','focus-visible','active','visited']){const s=heroS?.states[state];if(!s)continue;ck(parseNum(s.borderRadius)===0,`SECONDARY_RADIUS ${state} ${s.borderRadius}`);ck(parseNum(s.borderWidth)===0,`SECONDARY_BORDER ${state} ${s.borderWidth}`);ck(s.backgroundImage==='none',`SECONDARY_BG ${state} ${s.backgroundImage}`)}
            const result={name,lang,width,height,http,pass:fail.length===0,fail,missingCss:d.linked.filter(x=>/\.css(?:\?|$)/.test(x.url)&&x.status!==200),missingJs:d.linked.filter(x=>/\.m?js(?:\?|$)/.test(x.url)&&x.status!==200),overflow:d.overflow,pills:d.pills,interaction,consoleErrors,pageErrors,requestFailures,heroPrimary:d.heroPrimary,heroSecondary:d.heroSecondary,sectionCta:d.sectionCta};
            console.log(`CASE ${name} ${result.pass?'PASS':'FAIL'} HTTP=${http} CSS=${result.missingCss.length} JS=${result.missingJs.length} OVERFLOW=${result.overflow} PILLS=${result.pills.length}`);fail.forEach(x=>console.log(`FAIL ${name}: ${x}`));await page.close();return result;
          };

          const results=[];for(const c of cases)results.push(await run(c));await browser.close();const report={generatedAt:new Date().toISOString(),pass:results.every(x=>x.pass),results};fs.writeFileSync(`${out}/qa-report.json`,JSON.stringify(report,null,2));fs.writeFileSync(`${out}/qa-summary.txt`,results.map(x=>`${x.name}: ${x.pass?'PASS':'FAIL'} HTTP=${x.http} CSS=${x.missingCss.length} JS=${x.missingJs.length} overflow=${x.overflow} pills=${x.pills.length}`).join('\n')+`\nOVERALL: ${report.pass?'PASS':'FAIL'}\n`);console.log(JSON.stringify(report,null,2));if(!report.pass)process.exit(1);
          NODE
          node qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-golden-micro-polish-hosted-r1
          path: micro-polish-qa-artifacts/
          if-no-files-found: warn
