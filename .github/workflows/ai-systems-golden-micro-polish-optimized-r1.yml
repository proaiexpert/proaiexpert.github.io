name: AI Systems Golden Micro Polish Optimized R1

on:
  push:
    branches:
      - qa/ai-systems-golden-micro-polish-optimized-r1

permissions:
  contents: read

jobs:
  chrome-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORIGIN: https://ai-golden-recovery-preview.proaiexpert-github-io.pages.dev
      EN_URL: https://ai-golden-recovery-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-golden-recovery-r1/
      RU_URL: https://ai-golden-recovery-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-golden-recovery-r1/ru/
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          CSS="$ORIGIN/owner-preview/ai-systems-golden-recovery-r1/ai-systems-golden-recovery-r1.css?v=1"
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' "$EN_URL")" = 200
          test "$(curl -L -sS -o /dev/null -w '%{http_code}' "$RU_URL")" = 200
          curl -L -sS "$CSS" | grep -q 'Golden Micro Polish R1'
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core --no-save --silent
      - name: Verify hosted candidate in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/qa
          cat > qa.mjs <<'NODE'
          import fs from 'node:fs'; import puppeteer from 'puppeteer-core';
          const out=process.env.GITHUB_WORKSPACE+'/qa-evidence-optimized';fs.mkdirSync(out,{recursive:true});
          const cases=[['en-desktop','en',process.env.EN_URL,1440,1100],['ru-desktop','ru',process.env.RU_URL,1440,1100],['en-mobile-390','en',process.env.EN_URL,390,844],['ru-mobile-390','ru',process.env.RU_URL,390,844],['en-landscape','en',process.env.EN_URL,844,390],['ru-landscape','ru',process.env.RU_URL,844,390]];
          const ex={en:{hero:'AI systems that do the work. You keep the decisions that matter.',test:'7 / 7 reference tests passing',imp:'8.36K',footer:'Build the system that knows when to act — and when to stop.',summary:'Process architecture, automation, agents, APIs and custom engineering for businesses that need more than another isolated AI tool.',sections:['01 · OPERATIONAL REGISTER','02 · ENGINEERING DEPTH','03 · VERIFIED PROAI REFERENCE IMPLEMENTATION','04 · PROCESS BEFORE TECHNOLOGY','05 · HUMAN CONTROL','06 · EVIDENCE BY CLASS','07 · INTEGRATIONS + CUSTOM LOGIC','08 · START WITH THE BOTTLENECK']},ru:{hero:'AI-системы, которые выполняют работу. Важные решения остаются за вами.',test:'7 / 7 reference-тестов проходят',imp:'8,36K',footer:'Строим системы, которые знают, когда действовать — и когда остановиться.',summary:'Архитектура процессов, автоматизация, агенты, API и собственная разработка для бизнеса, которому уже мало ещё одного изолированного AI-инструмента.',sections:['01 · КОНТУР УПРАВЛЕНИЯ','02 · ГЛУБИНА ИНЖЕНЕРИИ','03 · ПРОВЕРЕННАЯ РЕФЕРЕНСНАЯ РЕАЛИЗАЦИЯ PROAI','04 · СНАЧАЛА ПРОЦЕСС','05 · КОНТРОЛЬ ЧЕЛОВЕКОМ','06 · ДОКАЗАТЕЛЬСТВА ПО КЛАССАМ','07 · ИНТЕГРАЦИИ + СОБСТВЕННАЯ ЛОГИКА','08 · НАЧИНАЕМ С УЗКОГО МЕСТА']}};
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']});
          const n=x=>parseFloat(x)||0;
          async function viewport([name,lang,url,w,h]){const p=await browser.newPage();await p.setViewport({width:w,height:h});const bad=[],ce=[],pe=[],rf=[];p.on('response',r=>{if(r.url().startsWith(process.env.ORIGIN)&&['document','stylesheet','script','font','image'].includes(r.request().resourceType())&&r.status()>=400)bad.push({url:r.url(),status:r.status()})});p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});p.on('pageerror',e=>pe.push(String(e)));p.on('requestfailed',r=>rf.push({url:r.url(),error:r.failure()?.errorText}));const nav=await p.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await p.waitForFunction(()=>document.querySelector('.home-footer-golden-r3')&&document.querySelector('.ai-golden-recovery-hero__neutral'),{timeout:20000});await new Promise(r=>setTimeout(r,900));const d=await p.evaluate(async()=>{const q=s=>document.querySelector(s),v=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'},st=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return{radius:s.borderRadius,border:s.borderTopWidth,bg:s.backgroundColor,bgi:s.backgroundImage,color:s.color,w:r.width,h:r.height}};const text=(document.body.innerText||'').replace(/\s+/g,' ').trim(),html=document.documentElement.outerHTML,fs=[...document.querySelectorAll('.ai-r3-evidence-card')].find(e=>(e.innerText||'').includes('Financial Stream')),footer=q('.home-footer-golden-r3');const assets=[...document.querySelectorAll('link[rel="stylesheet"],script[src]')].map(x=>x.href||x.src);const statuses=await Promise.all([...new Set(assets)].map(async u=>{try{const r=await fetch(u,{cache:'no-store'});return{u,s:r.status}}catch{return{u,s:0}}}));return{text,liquid:html.includes('{%')||html.includes('{{'),yaml:/^\s*---/.test(document.body.innerText||''),header:v(q('.site-header')),hero:v(q('.ai-r3-hero')),heroText:(q('#ai-r3-hero-title')?.innerText||'').replace(/\s+/g,' ').trim(),neutral:v(q('.ai-golden-recovery-hero__neutral')),test:(q('.ai-r3-test-result')?.innerText||'').replace(/\s+/g,' ').trim(),fs:(fs?.innerText||'').replace(/\s+/g,' ').trim(),footer:v(footer),footerText:(footer?.innerText||'').replace(/\s+/g,' ').trim(),hp:st(q('.ai-r3-hero .ai-r3-btn--primary')),hs:st(q('.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)')),s8:st(q('.ai-r3-cta .ai-r3-btn--primary')),pills:[...document.querySelectorAll('.ai-r3-btn')].filter(v).map(e=>({text:e.textContent.trim(),radius:parseFloat(getComputedStyle(e).borderRadius)||0})).filter(x=>x.radius>=100),overflow:document.documentElement.scrollWidth-innerWidth,statuses};});const e=ex[lang],fail=[],ck=(x,m)=>{if(!x)fail.push(m)};ck(nav.status()===200,'HTTP');ck(!d.liquid,'LIQUID');ck(!d.yaml,'YAML');ck(d.header,'HEADER');ck(d.hero&&d.heroText===e.hero,'HERO');ck(d.neutral,'NEUTRAL');e.sections.forEach(s=>ck(d.text.includes(s),`SECTION ${s}`));ck(d.test===e.test,`TEST ${d.test}`);ck(d.fs.includes('EN + RU')&&d.fs.includes(e.imp)&&/\b52\b/.test(d.fs),'FS');ck(!/63\s*(?:Organic|clicks)|57\s*(?:Organic|clicks)|7\.24K|50\s*(?:indexed|pages|страниц)/i.test(d.fs),'FS_STALE');ck(d.footer&&d.footerText.includes(e.footer)&&d.footerText.includes(e.summary),'FOOTER');ck(n(d.hp.radius)===9&&d.hp.h>=49.5&&d.hp.bgi!=='none'&&['rgb(242, 240, 235)','rgb(255, 255, 255)'].includes(d.hp.color),`HP ${JSON.stringify(d.hp)}`);ck(n(d.hs.radius)===0&&n(d.hs.border)===0&&d.hs.bgi==='none'&&d.hs.h>=43.5,`HS ${JSON.stringify(d.hs)}`);if(w===390)ck(d.hs.w<w*.75,`HS_WIDTH ${d.hs.w}`);ck(n(d.s8.radius)===9&&d.s8.h>=49.5&&d.s8.bgi!=='none'&&['rgb(242, 240, 235)','rgb(255, 255, 255)'].includes(d.s8.color),`S8 ${JSON.stringify(d.s8)}`);ck(d.pills.length===0,`PILLS ${JSON.stringify(d.pills)}`);ck(d.overflow===0,`OVERFLOW ${d.overflow}`);ck(d.statuses.every(x=>x.s===200),`LINKED ${JSON.stringify(d.statuses.filter(x=>x.s!==200))}`);ck(bad.length===0,`BAD ${JSON.stringify(bad)}`);ck(ce.length===0,`CONSOLE ${JSON.stringify(ce)}`);ck(pe.length===0,`PAGEERROR ${JSON.stringify(pe)}`);ck(rf.length===0,`REQUEST ${JSON.stringify(rf)}`);await p.screenshot({path:`${out}/${name}.png`,fullPage:w!==844});await p.close();console.log(`CASE ${name} ${fail.length?'FAIL':'PASS'} HTTP=${nav.status()} CSS=${d.statuses.filter(x=>/\.css(?:\?|$)/.test(x.u)&&x.s!==200).length} JS=${d.statuses.filter(x=>/\.m?js(?:\?|$)/.test(x.u)&&x.s!==200).length} OVERFLOW=${d.overflow} PILLS=${d.pills.length}`);fail.forEach(x=>console.log(`FAIL ${name}: ${x}`));return{name,pass:!fail.length,fail,http:nav.status(),overflow:d.overflow,pills:d.pills,missingCss:d.statuses.filter(x=>/\.css(?:\?|$)/.test(x.u)&&x.s!==200),missingJs:d.statuses.filter(x=>/\.m?js(?:\?|$)/.test(x.u)&&x.s!==200),consoleErrors:ce,pageErrors:pe,requestFailures:rf,hp:d.hp,hs:d.hs,s8:d.s8};}
          const views=await Promise.all(cases.map(viewport));
          async function interaction(url,w,h,label){const p=await browser.newPage();await p.setViewport({width:w,height:h});await p.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await p.waitForFunction(()=>document.querySelector('.home-footer-golden-r3'),{timeout:20000});await new Promise(r=>setTimeout(r,700));const cdp=await p.createCDPSession();await cdp.send('DOM.enable');await cdp.send('CSS.enable');const {root}=await cdp.send('DOM.getDocument',{depth:-1,pierce:true});const targets=[['header-cta','.site-header__cta'],['header-locale','.site-header__locale'],['hero-primary','.ai-r3-hero .ai-r3-btn--primary'],['hero-secondary','.ai-r3-hero .ai-r3-btn:not(.ai-r3-btn--primary)'],['section08','.ai-r3-cta .ai-r3-btn--primary'],['footer-cta','.home-footer-golden-r3__action'],['footer-email','.home-footer-golden-r3__contact a[href^="mailto:"]'],['footer-telegram','.home-footer-golden-r3__contact a[href^="https://t.me/"]'],['footer-capability','.home-footer-golden-r3__capabilities a'],['footer-social','.home-footer-golden-r3__social-rail a'],['footer-locale','.home-footer-golden-r3__locale a'],['mobile-menu','.site-header__menu-toggle']];const result=[],fail=[];for(const [name,sel] of targets){const {nodeId}=await cdp.send('DOM.querySelector',{nodeId:root.nodeId,selector:sel});if(!nodeId)continue;const visible=await p.$eval(sel,e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'});if(!visible)continue;const states={};for(const state of (name==='mobile-menu'?['default','hover','focus-visible','active']:['default','hover','focus-visible','active','visited'])){const pseudo=state==='default'?[]:state==='hover'?['hover']:state==='focus-visible'?['focus','focus-visible']:state==='active'?['active']:['visited'];await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:pseudo});await new Promise(r=>setTimeout(r,70));const x=await p.$eval(sel,e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return{color:s.color,bg:s.backgroundColor,bgi:s.backgroundImage,border:s.borderTopWidth,radius:s.borderRadius,opacity:s.opacity,outlineWidth:s.outlineWidth,outlineStyle:s.outlineStyle,decoration:s.textDecorationLine,w:r.width,h:r.height,clientWidth:e.clientWidth,scrollWidth:e.scrollWidth}});states[state]=x;if(Number(x.opacity)<.5)fail.push(`${name} ${state} opacity`);if(x.scrollWidth>Math.ceil(x.clientWidth)+3)fail.push(`${name} ${state} clipping`);if(state==='focus-visible'&&(n(x.outlineWidth)<1||x.outlineStyle==='none'))fail.push(`${name} focus missing`);if(['hero-primary','section08'].includes(name)){if(n(x.radius)!==9)fail.push(`${name} ${state} radius=${x.radius}`);if(x.bgi==='none')fail.push(`${name} ${state} background none`);if(!['rgb(242, 240, 235)','rgb(255, 255, 255)'].includes(x.color))fail.push(`${name} ${state} color=${x.color}`)}if(name==='hero-secondary'){if(n(x.radius)!==0||n(x.border)!==0||x.bgi!=='none')fail.push(`hero-secondary ${state} boxed`);if(state==='hover'&&x.decoration!=='underline')fail.push('hero-secondary hover underline missing')}}await cdp.send('CSS.forcePseudoState',{nodeId,forcedPseudoClasses:[]});result.push({name,states});}await cdp.detach();await p.close();console.log(`INTERACTION ${label} ${fail.length?'FAIL':'PASS'} controls=${result.length}`);fail.forEach(x=>console.log(`FAIL INTERACTION ${label}: ${x}`));return{label,pass:!fail.length,fail,controls:result};}
          const interactions=await Promise.all([interaction(process.env.EN_URL,1440,1100,'desktop'),interaction(process.env.EN_URL,390,844,'mobile')]);await browser.close();const report={pass:views.every(x=>x.pass)&&interactions.every(x=>x.pass),views,interactions};fs.writeFileSync(`${out}/qa-report.json`,JSON.stringify(report,null,2));console.log('OVERALL='+(report.pass?'PASS':'FAIL'));if(!report.pass)process.exit(1);
          NODE
          node qa.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-golden-micro-polish-optimized-r1
          path: qa-evidence-optimized/
          if-no-files-found: warn
