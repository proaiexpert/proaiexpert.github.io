name: AI Systems R4.1 Owner Preview QA

on:
  push:
    branches:
      - agent/ai-systems-golden-r4-trace-threshold-r1-1-premium-polish

permissions:
  contents: read

jobs:
  preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Reference runtime tests
        run: node --test tests/controlled-agent-reference.test.mjs

      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core@1.56.1

      - name: Owner-preview rendered QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Chrome: $CHROME"
          python3 -m http.server 4173 --directory . >/tmp/r41-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          mkdir -p r41-preview-evidence

          cat > r41-preview-qa.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const executablePath=process.env.CHROME_PATH;
          const base='http://127.0.0.1:4173';
          const cases=[
            ['en-1440','/owner-preview/ai-systems-r4-trace-threshold-r1/',1440,1000,false],
            ['ru-1440','/owner-preview/ai-systems-r4-trace-threshold-r1/ru/',1440,1000,false],
            ['en-1280','/owner-preview/ai-systems-r4-trace-threshold-r1/',1280,900,false],
            ['ru-1280','/owner-preview/ai-systems-r4-trace-threshold-r1/ru/',1280,900,false],
            ['en-430','/owner-preview/ai-systems-r4-trace-threshold-r1/',430,932,true],
            ['ru-430','/owner-preview/ai-systems-r4-trace-threshold-r1/ru/',430,932,true],
            ['en-393','/owner-preview/ai-systems-r4-trace-threshold-r1/',393,852,true],
            ['ru-393','/owner-preview/ai-systems-r4-trace-threshold-r1/ru/',393,852,true],
            ['en-390','/owner-preview/ai-systems-r4-trace-threshold-r1/',390,844,true],
            ['ru-390','/owner-preview/ai-systems-r4-trace-threshold-r1/ru/',390,844,true],
            ['en-375','/owner-preview/ai-systems-r4-trace-threshold-r1/',375,812,true],
            ['ru-375','/owner-preview/ai-systems-r4-trace-threshold-r1/ru/',375,812,true],
            ['en-landscape','/owner-preview/ai-systems-r4-trace-threshold-r1/',844,390,true],
            ['ru-landscape','/owner-preview/ai-systems-r4-trace-threshold-r1/ru/',844,390,true],
          ];
          const critical=new Set(['en-430','ru-390','en-landscape','ru-landscape']);

          async function load(page,path){
            await page.route('https://fonts.googleapis.com/**',r=>r.abort());
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            const res=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:10000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res?.status()||'none'));
            await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true',null,{timeout:6000});
          }

          async function runtimePos(page,p){
            return page.evaluate(p0=>{
              const story=document.querySelector('[data-r4-runtime-story]');
              const r=story.getBoundingClientRect();
              const top=scrollY+r.top;
              const travel=Math.max(1,r.height-innerHeight);
              const y=Math.round(top+travel*p0);
              scrollTo(0,y);
              return {top,travel,y};
            },p);
          }

          async function geometry(page,id,width,height,mobile){
            return page.evaluate(({id,width,height,mobile})=>{
              const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
              const r=s=>q(s)?.getBoundingClientRect()||null,st=s=>q(s)?getComputedStyle(q(s)):null;
              const portrait=mobile&&height>width,landscape=mobile&&width>height;
              return {
                id,width,height,portrait,landscape,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                runtimeValid:q('[data-r4-runtime]')?.dataset.runtimeValid,
                ledger:qa('[data-runtime-event-index]').length,
                source:r('.ai-r4-runtime__source'),
                trace:r('.ai-r4-runtime__trace'),
                code:r('.ai-r4-code'),
                activeSource:r('.ai-r4-code-block.is-active'),
                active:r('.ai-r4-runtime__active'),
                title:r('[data-runtime-active-title]'),
                detail:r('[data-runtime-active-detail]'),
                gate:r('.ai-r4-runtime-gate'),
                decisions:qa('.ai-r4-decision').map(d=>({label:d.querySelector('span')?.getBoundingClientRect()||null,title:d.querySelector('strong')?.getBoundingClientRect()||null})),
                authorityOpacity:parseFloat(st('.ai-r4-authority-zone--action')?.opacity||'0'),
                spineRail:r('.ai-r4-spine__rail'),
                spineGrid:st('.ai-r4-spine__core')?.gridTemplateColumns||'',
                spineNodes:qa('.ai-r4-spine-node').map(el=>{const s=getComputedStyle(el);return {background:s.backgroundColor,borders:[s.borderTopWidth,s.borderRightWidth,s.borderBottomWidth,s.borderLeftWidth]}}),
                gateFont:parseFloat(st('.ai-r4-runtime-gate__label')?.fontSize||'0'),
                statusFont:parseFloat(st('.ai-r4-runtime__status')?.fontSize||'0'),
                eventFont:parseFloat(st('.ai-r4-runtime-event strong')?.fontSize||'0'),
                headingOverflow:qa('h1,h2,h3').filter(el=>{const b=el.getBoundingClientRect();return b.left<-1||b.right>innerWidth+1||el.scrollWidth>el.clientWidth+3}).map(el=>(el.textContent||'').trim().slice(0,70)),
              };
            },{id,width,height,mobile});
          }

          function overlap(a,b,t=1){return a&&b&&!(a.right<=b.left+t||a.left>=b.right-t||a.bottom<=b.top+t||a.top>=b.bottom-t)}
          function validate(g){
            const e=[];
            if(g.overflow>1)e.push('overflow:'+g.overflow);
            if(g.runtimeValid!=='true')e.push('runtime-invalid');
            if(g.ledger!==17)e.push('trace:'+g.ledger);
            if(g.headingOverflow.length)e.push('heading:'+g.headingOverflow.join('|'));
            if(g.portrait&&overlap(g.source,g.trace))e.push('runtime-source-trace-overlap');
            if(g.landscape&&overlap(g.source,g.trace))e.push('runtime-source-trace-overlap');
            if(g.active&&g.title&&(g.title.top<g.active.top-1||g.title.bottom>g.active.bottom+1))e.push('title-outside-zone');
            if(g.active&&g.detail&&(g.detail.top<g.active.top-1||g.detail.bottom>g.active.bottom+1))e.push('detail-outside-zone');
            if(g.active&&g.gate&&g.active.bottom>g.gate.top+1)e.push('active-gate-overlap');
            if(g.code&&g.activeSource&&(g.activeSource.top<g.code.top-1||g.activeSource.bottom>g.code.bottom+1||g.activeSource.left<g.code.left-1||g.activeSource.right>g.code.right+1))e.push('source-outside-code-zone');
            if(g.decisions.some(x=>overlap(x.label,x.title,0)))e.push('pearl-collision');
            if(g.authorityOpacity<.70)e.push('authority-dim:'+g.authorityOpacity);
            if(g.portrait){
              const boxed=g.spineNodes.filter(n=>n.background!=='rgba(0, 0, 0, 0)'||n.borders.some(v=>parseFloat(v)>0));
              if(boxed.length)e.push('spine-boxes:'+boxed.length);
              if(!(g.spineRail&&g.spineRail.height>g.spineRail.width*20))e.push('spine-not-vertical');
              if(g.spineGrid.trim().split(/\s+/).length>1)e.push('spine-columns:'+g.spineGrid);
            }
            if(g.landscape&&(g.gateFont<6.4||g.statusFont<6.2||g.eventFont<6.8))e.push('microtype:'+g.gateFont+'/'+g.statusFont+'/'+g.eventFont);
            return e;
          }

          async function sweep(page){
            const states=[],collisions=[];
            for(let i=0;i<=36;i++){
              await runtimePos(page,i/36);await page.waitForTimeout(20);
              const s=await page.evaluate(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeState||'');
              states.push(s);
              if(i%4===0){
                const c=await page.evaluate(()=>({
                  code:document.querySelector('.ai-r4-code')?.getBoundingClientRect()||null,
                  src:document.querySelector('.ai-r4-code-block.is-active')?.getBoundingClientRect()||null,
                  active:document.querySelector('.ai-r4-runtime__active')?.getBoundingClientRect()||null,
                  title:document.querySelector('[data-runtime-active-title]')?.getBoundingClientRect()||null,
                  gate:document.querySelector('.ai-r4-runtime-gate')?.getBoundingClientRect()||null
                }));
                if(c.code&&c.src&&(c.src.top<c.code.top-1||c.src.bottom>c.code.bottom+1))collisions.push('source');
                if(c.active&&c.title&&(c.title.top<c.active.top-1||c.title.bottom>c.active.bottom+1))collisions.push('title');
                if(c.active&&c.gate&&c.active.bottom>c.gate.top+1)collisions.push('gate');
              }
            }
            const unique=[...new Set(states)],required=['tool-failure','retry','fallback','machine-stopped','authority-approved','action'];
            const missing=required.filter(x=>!unique.includes(x));
            const stop=states.filter(x=>x==='machine-stopped').length;
            await runtimePos(page,.08);await page.waitForTimeout(280);await runtimePos(page,.18);await page.waitForTimeout(35);
            const motion=await page.evaluate(()=>({ghost:document.querySelectorAll('.ai-r4-runtime__active-ghost').length,titleAnimations:document.querySelector('[data-runtime-active-title]')?.getAnimations?.().length||0,sourceAnimations:[...document.querySelectorAll('.ai-r4-code-block')].reduce((n,e)=>n+(e.getAnimations?.().length||0),0)}));
            await page.waitForTimeout(350);
            const stale=await page.locator('.ai-r4-runtime__active-ghost').count();
            await runtimePos(page,.90);await page.waitForTimeout(50);await runtimePos(page,.16);await page.waitForTimeout(80);
            const backward=await page.evaluate(()=>({valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,ledger:document.querySelectorAll('[data-runtime-event-index]').length,state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState}));
            await runtimePos(page,.05);await runtimePos(page,.78);await page.waitForTimeout(80);
            const fast=await page.evaluate(()=>({valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,ledger:document.querySelectorAll('[data-runtime-event-index]').length,state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState}));
            return {unique,missing,stop,collisions:[...new Set(collisions)],motion,stale,backward,fast};
          }

          const browser=await chromium.launch({headless:true,executablePath});
          const results=[];
          for(const [id,path,width,height,mobile] of cases){
            const ctx=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile});
            const page=await ctx.newPage();
            const pageErrors=[],localFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>{if(r.url().startsWith(base))localFailures.push(r.url())});
            await load(page,path);
            await runtimePos(page,.03);await page.waitForTimeout(60);
            const g=await geometry(page,id,width,height,mobile);
            const hard=validate(g);
            let runtime=null;
            if(critical.has(id)){
              runtime=await sweep(page);
              if(runtime.missing.length)hard.push('missing:'+runtime.missing.join(','));
              if(runtime.stop<2)hard.push('stop-plateau:'+runtime.stop);
              if(runtime.collisions.length)hard.push('runtime-collision:'+runtime.collisions.join(','));
              if(!(runtime.motion.ghost||runtime.motion.titleAnimations||runtime.motion.sourceAnimations))hard.push('motion-not-observed');
              if(runtime.stale)hard.push('stale-ghost');
              if(runtime.backward.valid!=='true'||runtime.backward.ledger!==17)hard.push('backward-invalid');
              if(runtime.fast.valid!=='true'||runtime.fast.ledger!==17)hard.push('fast-invalid');
            }
            if(pageErrors.length)hard.push('page-errors:'+pageErrors.join('|'));
            if(localFailures.length)hard.push('local-failures:'+localFailures.join('|'));

            const result={id,g,runtime,pageErrors,localFailures,hard};
            console.log('R41_PREVIEW',JSON.stringify(result));results.push(result);
            await ctx.close();
          }

          // Portrait -> landscape while inside runtime.
          const co=await browser.newContext({viewport:{width:430,height:932},isMobile:true,hasTouch:true});
          const po=await co.newPage();await load(po,cases[4][1]);await runtimePos(po,.62);await po.waitForTimeout(100);
          const before=await po.evaluate(()=>({state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState,ledger:document.querySelectorAll('[data-runtime-event-index]').length}));
          await po.setViewportSize({width:844,height:390});await po.waitForTimeout(180);
          const after=await po.evaluate(()=>({state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState,valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,ledger:document.querySelectorAll('[data-runtime-event-index]').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          const orientationHard=[];if(after.valid!=='true'||after.ledger!==17||after.overflow>1||!after.state)orientationHard.push('orientation-invalid');
          console.log('R41_ORIENTATION',JSON.stringify({before,after,orientationHard}));await co.close();

          // Reload + keyboard on RU narrow portrait.
          const cr=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const pr=await cr.newPage();await load(pr,cases[9][1]);await runtimePos(pr,.56);await pr.waitForTimeout(80);
          const y0=await pr.evaluate(()=>scrollY);await pr.reload({waitUntil:'domcontentloaded',timeout:10000});await pr.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true',null,{timeout:6000});await pr.waitForTimeout(80);
          const reload=await pr.evaluate(()=>({y:scrollY,state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState,valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,ledger:document.querySelectorAll('[data-runtime-event-index]').length}));
          const reloadHard=[];if(reload.valid!=='true'||reload.ledger!==17)reloadHard.push('reload-invalid');if(y0>500&&reload.y<100)reloadHard.push('reload-position-lost');
          await pr.evaluate(()=>scrollTo(0,0));const focus=[];for(let i=0;i<9;i++){await pr.keyboard.press('Tab');focus.push(await pr.evaluate(()=>{const e=document.activeElement,s=e?getComputedStyle(e):null;return{tag:e?.tagName||'',outline:s?.outlineStyle||'',w:e?.getBoundingClientRect?.().width||0}}))}
          if(!focus.some(x=>x.w>0&&x.outline!=='none'))reloadHard.push('focus-invisible');
          console.log('R41_RELOAD',JSON.stringify({reload,focus,reloadHard}));await cr.close();

          // Reduced motion.
          const reducedHard=[];
          for(const [id,path,width,height,mobile] of [['red-en',cases[0][1],1440,1000,false],['red-ru',cases[9][1],390,844,true]]){
            const cx=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile,reducedMotion:'reduce'});
            const px=await cx.newPage();await load(px,path);
            const m=await px.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,pos:getComputedStyle(document.querySelector('.ai-r4-runtime__sticky')).position,sources:[...document.querySelectorAll('[data-source-anchor]')].filter(e=>getComputedStyle(e).display!=='none'&&parseFloat(getComputedStyle(e).opacity)>0).length,ledger:document.querySelectorAll('[data-runtime-event-index]').length,ghosts:document.querySelectorAll('.ai-r4-runtime__active-ghost').length}));
            const h=[];if(m.overflow>1)h.push('overflow');if(m.pos==='sticky')h.push('sticky');if(m.sources!==17)h.push('sources:'+m.sources);if(m.ledger!==17)h.push('ledger');if(m.ghosts)h.push('ghosts');
            console.log('R41_REDUCED',JSON.stringify({id,m,h}));reducedHard.push(...h.map(x=>id+':'+x));await cx.close();
          }

          await browser.close();
          const failures=[
            ...results.flatMap(r=>r.hard.map(x=>r.id+':'+x)),
            ...orientationHard.map(x=>'orientation:'+x),
            ...reloadHard.map(x=>'reload:'+x),
            ...reducedHard.map(x=>'reduced:'+x),
          ];
          fs.writeFileSync('r41-preview-evidence/results.json',JSON.stringify({results,orientationHard,reloadHard,reducedHard,failures},null,2));
          if(failures.length){console.error('R41_FAILURES',JSON.stringify(failures));process.exit(1)}
          console.log('R41_OWNER_PREVIEW_PASS');
          EOF

          CHROME_PATH="$CHROME" node r41-preview-qa.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-r4-1-owner-preview-evidence
          path: r41-preview-evidence/
          if-no-files-found: warn
