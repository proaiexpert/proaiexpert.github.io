name: AI Systems R4.1 Retry Reachability

on:
  push:
    branches:
      - ai-systems-r4-preview

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save playwright-core@1.56.1
      - name: Verify RETRY at 430
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4173 --directory . >/tmp/r41-retry-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 1
          cat > retry.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const ctx=await browser.newContext({viewport:{width:430,height:932},isMobile:true,hasTouch:true});
          const page=await ctx.newPage();
          await page.route('https://fonts.googleapis.com/**',r=>r.abort());
          await page.route('https://fonts.gstatic.com/**',r=>r.abort());
          await page.goto('http://127.0.0.1:4173/owner-preview/ai-systems-r4-trace-threshold-r1/',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true');
          const seen=new Set();
          for(let i=0;i<=160;i++){
            await page.evaluate(p=>{
              const s=document.querySelector('[data-r4-runtime-story]');
              const r=s.getBoundingClientRect();
              const top=scrollY+r.top;
              const travel=Math.max(1,r.height-innerHeight);
              scrollTo(0,Math.round(top+travel*p));
            },i/160);
            await page.waitForTimeout(20);
            seen.add(await page.evaluate(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeState||''));
          }
          const ledger=[...document.querySelectorAll('[data-runtime-event-index]')].map(el=>el.textContent||'');
          const out={seen:[...seen],retrySeen:seen.has('retry'),ledgerCount:ledger.length,valid:await page.evaluate(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid)};
          console.log('R41_RETRY',JSON.stringify(out));
          await browser.close();
          if(!out.retrySeen||out.ledgerCount!==17||out.valid!=='true')process.exit(1);
          EOF
          CHROME_PATH="$CHROME" node retry.mjs
