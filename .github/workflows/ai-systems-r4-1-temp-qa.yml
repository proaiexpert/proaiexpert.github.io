name: AI Systems R4.1 Temporary QA

on:
  push:
    branches:
      - agent/ai-systems-golden-r4-trace-threshold-r1-1-premium-polish

permissions:
  contents: read

jobs:
  r4-1-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Reference runtime tests
        run: node --test tests/controlled-agent-reference.test.mjs

      - name: Build candidate
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit

      - name: Rendered composition and motion QA
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/r4-1-http.log 2>&1 &
          sleep 2
          mkdir -p r4-1-qa-artifacts
          cat > r4-1-qa.mjs <<'EOF'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';

          const base = 'http://127.0.0.1:4173';
          const chromiumCases = [
            ['en-1440','/ai-systems/',1440,1000,false],
            ['ru-1440','/ru/ai-systems/',1440,1000,false],
            ['en-1280','/ai-systems/',1280,900,false],
            ['ru-1280','/ru/ai-systems/',1280,900,false],
            ['en-430','/ai-systems/',430,932,true],
            ['ru-430','/ru/ai-systems/',430,932,true],
            ['en-393','/ai-systems/',393,852,true],
            ['ru-393','/ru/ai-systems/',393,852,true],
            ['en-390','/ai-systems/',390,844,true],
            ['ru-390','/ru/ai-systems/',390,844,true],
            ['en-375','/ai-systems/',375,812,true],
            ['ru-375','/ru/ai-systems/',375,812,true],
            ['en-landscape','/ai-systems/',844,390,true],
            ['ru-landscape','/ru/ai-systems/',844,390,true],
          ];

          const webkitCases = [
            ['wk-en-430','/ai-systems/',430,932,true],
            ['wk-ru-390','/ru/ai-systems/',390,844,true],
            ['wk-en-landscape','/ai-systems/',844,390,true],
            ['wk-ru-landscape','/ru/ai-systems/',844,390,true],
          ];

          function intersects(a,b,pad=0){
            return !(a.right <= b.left + pad || a.left >= b.right - pad || a.bottom <= b.top + pad || a.top >= b.bottom - pad);
          }

          async function metrics(page, isPortrait, isLandscape){
            return page.evaluate(({isPortrait,isLandscape}) => {
              const q=s=>document.querySelector(s);
              const rect=s=>q(s)?.getBoundingClientRect();
              const style=s=>q(s)?getComputedStyle(q(s)):null;
              const decisions=[...document.querySelectorAll('.ai-r4-decision')].map(d=>{
                const a=d.querySelector('span')?.getBoundingClientRect();
                const b=d.querySelector('strong')?.getBoundingClientRect();
                return {a,b};
              });
              const h=[...document.querySelectorAll('h1,h2,h3')].map(el=>({
                text:(el.textContent||'').trim().slice(0,60),
                left:el.getBoundingClientRect().left,
                right:el.getBoundingClientRect().right,
                scrollWidth:el.scrollWidth,
                clientWidth:el.clientWidth,
              }));
              const spineNodes=[...document.querySelectorAll('.ai-r4-spine-node')].map(el=>{
                const s=getComputedStyle(el);
                return {
                  bg:s.backgroundColor,
                  bl:s.borderLeftWidth,br:s.borderRightWidth,bt:s.borderTopWidth,bb:s.borderBottomWidth,
                  width:el.getBoundingClientRect().width,
                };
              });
              return {
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                runtimeValid:q('[data-r4-runtime]')?.dataset.runtimeValid,
                ledger:document.querySelectorAll('[data-runtime-event-index]').length,
                source:rect('.ai-r4-runtime__source'),
                trace:rect('.ai-r4-runtime__trace'),
                code:rect('.ai-r4-code'),
                activeSource:rect('.ai-r4-code-block.is-active'),
                active:rect('.ai-r4-runtime__active'),
                title:rect('[data-runtime-active-title]'),
                detail:rect('[data-runtime-active-detail]'),
                gate:rect('.ai-r4-runtime-gate'),
                ledgerWrap:rect('.ai-r4-runtime__ledger-wrap'),
                authorityActionOpacity:parseFloat(style('.ai-r4-authority-zone--action')?.opacity||'0'),
                authorityActionColor:style('.ai-r4-authority-zone--action strong')?.color,
                spineRail:rect('.ai-r4-spine__rail'),
                spineCore:rect('.ai-r4-spine__core'),
                spineGrid:style('.ai-r4-spine__core')?.gridTemplateColumns,
                spineNodes,
                pearlDecisions:decisions,
                headings:h,
                gateLabelFont:parseFloat(style('.ai-r4-runtime-gate__label')?.fontSize||'0'),
                statusFont:parseFloat(style('.ai-r4-runtime__status')?.fontSize||'0'),
                eventFont:parseFloat(style('.ai-r4-runtime-event strong')?.fontSize||'0'),
                isPortrait,isLandscape,
              };
            }, {isPortrait,isLandscape});
          }

          function validateGeometry(m,id){
            const hard=[];
            if(m.overflow>1) hard.push('horizontal-overflow:'+m.overflow);
            if(m.runtimeValid!=='true') hard.push('runtime-invalid');
            if(m.ledger!==17) hard.push('trace-count:'+m.ledger);
            if(m.headings.some(h=>h.left < -1 || h.right > (m.isLandscape?844:2000)+2 || h.scrollWidth > h.clientWidth+3)) {
              // viewport-right is checked separately in-browser below; scrollWidth catches clipping.
              if(m.headings.some(h=>h.scrollWidth > h.clientWidth+3)) hard.push('clipped-heading');
            }
            if(m.source && m.trace){
              if(m.isPortrait && m.source.bottom > m.trace.top+1) hard.push('runtime-source-trace-overlap');
              if(m.isLandscape && m.source.right > m.trace.left+1) hard.push('runtime-source-trace-overlap');
            }
            if(m.active && m.title && (m.title.top < m.active.top-1 || m.title.bottom > m.active.bottom+1)) hard.push('runtime-title-outside-zone');
            if(m.active && m.detail && (m.detail.top < m.active.top-1 || m.detail.bottom > m.active.bottom+1)) hard.push('runtime-detail-outside-zone');
            if(m.active && m.gate && m.active.bottom > m.gate.top+1) hard.push('runtime-active-gate-overlap');
            if(m.code && m.activeSource && (
              m.activeSource.left < m.code.left-1 || m.activeSource.right > m.code.right+1 ||
              m.activeSource.top < m.code.top-1 || m.activeSource.bottom > m.code.bottom+1
            )) hard.push('active-source-outside-code-zone');
            if(m.pearlDecisions.some(x=>x.a&&x.b&&!(x.a.right<=x.b.left || x.a.bottom<=x.b.top || x.a.left>=x.b.right || x.a.top>=x.b.bottom))) hard.push('pearl-label-title-collision');
            if(m.authorityActionOpacity < .64) hard.push('authority-future-too-dim:'+m.authorityActionOpacity);
            if(m.isPortrait){
              const boxed=m.spineNodes.filter(n=>n.bg!=='rgba(0, 0, 0, 0)' || parseFloat(n.bl)+parseFloat(n.br)+parseFloat(n.bt)+parseFloat(n.bb)>0);
              if(boxed.length) hard.push('control-spine-boxed-stations:'+boxed.length);
              if(!(m.spineRail && m.spineRail.height > m.spineRail.width*20)) hard.push('control-spine-not-vertical');
              if(m.spineGrid && !/^\d+(\.\d+)?px$/.test(m.spineGrid.trim())) {
                // One-column grid resolves to one px token; multiple columns contain spaces.
                if(m.spineGrid.trim().split(/\s+/).length>1) hard.push('control-spine-not-single-column');
              }
            }
            if(m.isLandscape && (m.gateLabelFont<6.4 || m.statusFont<6.2 || m.eventFont<6.8)) {
              hard.push(`landscape-micro-type:${m.gateLabelFont}/${m.statusFont}/${m.eventFont}`);
            }
            return hard;
          }

          async function runtimeSweep(page, width, height, portrait, landscape){
            const story=page.locator('[data-r4-runtime-story]');
            const handle=await story.elementHandle();
            const box=await story.boundingBox();
            if(!box||!handle) throw new Error('runtime-story-missing');
            const top=await page.evaluate(el=>window.scrollY+el.getBoundingClientRect().top,handle);
            const travel=Math.max(1,box.height-height);
            const states=[];
            const ys=[];
            const overlapErrors=[];
            for(let i=0;i<=120;i++){
              const y=Math.round(top+travel*(i/120));
              await page.evaluate(v=>window.scrollTo(0,v),y);
              await page.waitForTimeout(18);
              const state=await page.evaluate(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeState||'');
              states.push(state);ys.push(y);
              if(i%4===0){
                const m=await metrics(page,portrait,landscape);
                overlapErrors.push(...validateGeometry(m,'sweep').filter(x=>x.includes('runtime-')));
              }
            }
            const required=['tool-failure','retry','fallback','machine-stopped','authority-approved','action'];
            const missing=required.filter(s=>!states.includes(s));
            const stopSamples=states.filter(s=>s==='machine-stopped').length;

            let transitionObserved=false;
            for(let i=1;i<states.length;i++){
              if(states[i]!==states[i-1]){
                await page.evaluate(v=>window.scrollTo(0,v),ys[i-1]);
                await page.waitForTimeout(330);
                await page.evaluate(v=>window.scrollTo(0,v),ys[i]);
                await page.waitForTimeout(35);
                transitionObserved=await page.evaluate(()=>Boolean(
                  document.querySelector('.ai-r4-runtime__active-ghost') ||
                  document.querySelector('[data-runtime-active-title]')?.getAnimations?.().length
                ));
                if(transitionObserved) break;
              }
            }
            await page.waitForTimeout(380);
            const staleGhost=await page.locator('.ai-r4-runtime__active-ghost').count();

            // backward + fast scroll
            await page.evaluate(v=>window.scrollTo(0,v),top+travel);
            await page.waitForTimeout(80);
            await page.evaluate(v=>window.scrollTo(0,v),top);
            await page.waitForTimeout(100);
            const backward=await page.evaluate(()=>({
              state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState||'',
              valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              ledger:document.querySelectorAll('[data-runtime-event-index]').length,
            }));
            await page.evaluate(([a,b])=>{window.scrollTo(0,a);window.scrollTo(0,b)},[top,top+travel*.76]);
            await page.waitForTimeout(120);
            const fast=await page.evaluate(()=>({
              state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState||'',
              valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              ledger:document.querySelectorAll('[data-runtime-event-index]').length,
              ghost:document.querySelectorAll('.ai-r4-runtime__active-ghost').length,
            }));

            return {top,travel,states:[...new Set(states)],missing,stopSamples,transitionObserved,staleGhost,backward,fast,overlapErrors:[...new Set(overlapErrors)]};
          }

          async function runCase(browserType, browser, c, screenshot=false){
            const [id,path,width,height,mobile]=c;
            const context=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile});
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.abort());
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            const pageErrors=[],localFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>{if(r.url().startsWith(base))localFailures.push(r.url()+':'+(r.failure()?.errorText||''))});
            const res=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:25000});
            if(!res||res.status()!==200) throw new Error(id+':http-'+(res?.status()||'none'));
            await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true',null,{timeout:10000});

            const portrait=mobile&&height>width;
            const landscape=mobile&&width>height;
            const initial=await metrics(page,portrait,landscape);
            const hard=validateGeometry(initial,id);

            const viewportHeadingOverflow=await page.evaluate(()=>[...document.querySelectorAll('h1,h2,h3')].filter(el=>{
              const r=el.getBoundingClientRect(); return r.left<-1||r.right>innerWidth+1;
            }).map(el=>(el.textContent||'').trim().slice(0,80)));
            if(viewportHeadingOverflow.length) hard.push('heading-outside-viewport:'+viewportHeadingOverflow.join('|'));

            // Force closed authority just for latent-plane readability measurement.
            const closedOpacity=await page.evaluate(()=>{
              const a=document.querySelector('[data-r4-authority]');
              if(!a)return 0;
              const prev=a.dataset.authorityState;
              a.dataset.authorityState='closed';
              const value=parseFloat(getComputedStyle(document.querySelector('.ai-r4-authority-zone--action')).opacity||'0');
              a.dataset.authorityState=prev;
              return value;
            });
            if(closedOpacity<.70) hard.push('authority-closed-action-too-dim:'+closedOpacity);

            const sweep=await runtimeSweep(page,width,height,portrait,landscape);
            if(sweep.missing.length) hard.push('missing-runtime-states:'+sweep.missing.join(','));
            if(sweep.stopSamples<8) hard.push('machine-stop-plateau-short:'+sweep.stopSamples);
            if(!sweep.transitionObserved) hard.push('runtime-transition-not-observed');
            if(sweep.staleGhost) hard.push('runtime-transition-ghost-stale');
            if(sweep.backward.valid!=='true'||sweep.backward.ledger!==17) hard.push('backward-runtime-regression');
            if(sweep.fast.valid!=='true'||sweep.fast.ledger!==17) hard.push('fast-scroll-runtime-regression');
            if(sweep.overlapErrors.length) hard.push(...sweep.overlapErrors);

            // Reload in runtime.
            await page.evaluate(v=>window.scrollTo(0,v),sweep.top+sweep.travel*.58);
            await page.waitForTimeout(80);
            const beforeReloadY=await page.evaluate(()=>window.scrollY);
            await page.reload({waitUntil:'domcontentloaded',timeout:25000});
            await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true',null,{timeout:10000});
            await page.waitForTimeout(100);
            const reload=await page.evaluate(()=>({
              y:window.scrollY,
              valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState||'',
              ledger:document.querySelectorAll('[data-runtime-event-index]').length,
            }));
            if(reload.valid!=='true'||reload.ledger!==17) hard.push('runtime-reload-invalid');
            if(beforeReloadY>500&&reload.y<100) hard.push('runtime-reload-lost-position');

            // Keyboard focus.
            await page.evaluate(()=>window.scrollTo(0,0));
            const focused=[];
            for(let i=0;i<9;i++){
              await page.keyboard.press('Tab');
              focused.push(await page.evaluate(()=>{
                const e=document.activeElement; const s=e?getComputedStyle(e):null;
                return {tag:e?.tagName||'',href:e?.getAttribute?.('href')||'',outline:s?.outlineStyle||'',width:e?.getBoundingClientRect?.().width||0};
              }));
            }
            if(!focused.some(x=>x.width>0&&x.outline!=='none')) hard.push('keyboard-focus-not-visible');

            if(pageErrors.length) hard.push('page-errors');
            if(localFailures.length) hard.push('same-origin-request-failures');

            if(screenshot){
              await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:25000});
              await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true',null,{timeout:10000});
              await page.screenshot({path:`r4-1-qa-artifacts/${browserType}-${id}-top.png`,fullPage:false});
              for(const [selector,suffix] of [
                ['[data-r4-runtime]','runtime'],
                ['[data-r4-pearl]','pearl'],
                ['[data-r4-authority]','authority'],
                ['[data-r4-spine]','spine'],
              ]){
                const loc=page.locator(selector);
                await loc.scrollIntoViewIfNeeded();
                await page.waitForTimeout(180);
                await page.screenshot({path:`r4-1-qa-artifacts/${browserType}-${id}-${suffix}.png`,fullPage:false});
              }
            }

            const result={browserType,id,width,height,initial,closedOpacity,sweep,reload,focused,pageErrors,localFailures,hard};
            console.log('R41_QA',JSON.stringify(result));
            await context.close();
            return result;
          }

          async function orientationCheck(browser){
            const context=await browser.newContext({viewport:{width:430,height:932},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.abort());
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.goto(base+'/ai-systems/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true');
            const story=page.locator('[data-r4-runtime-story]');
            const box=await story.boundingBox();
            const top=await page.evaluate(el=>window.scrollY+el.getBoundingClientRect().top,await story.elementHandle());
            const travel=Math.max(1,box.height-932);
            await page.evaluate(v=>window.scrollTo(0,v),top+travel*.66);
            await page.waitForTimeout(160);
            const before=await page.evaluate(()=>({y:scrollY,state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState,ledger:document.querySelectorAll('[data-runtime-event-index]').length}));
            await page.setViewportSize({width:844,height:390});
            await page.waitForTimeout(260);
            const after=await page.evaluate(()=>({
              y:scrollY,state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState,
              valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              ledger:document.querySelectorAll('[data-runtime-event-index]').length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
            }));
            const hard=[];
            if(after.valid!=='true'||after.ledger!==17||after.overflow>1||!after.state) hard.push('orientation-runtime-invalid');
            console.log('R41_ORIENTATION',JSON.stringify({before,after,hard}));
            await context.close();
            return hard;
          }

          async function reducedCheck(browser){
            const out=[];
            for(const [id,path,width,height,mobile] of [
              ['reduced-en-desktop','/ai-systems/',1440,1000,false],
              ['reduced-ru-390','/ru/ai-systems/',390,844,true],
            ]){
              const context=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile,reducedMotion:'reduce'});
              const page=await context.newPage();
              await page.route('https://fonts.googleapis.com/**',r=>r.abort());
              await page.route('https://fonts.gstatic.com/**',r=>r.abort());
              await page.goto(base+path,{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true');
              const m=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                pos:getComputedStyle(document.querySelector('.ai-r4-runtime__sticky')).position,
                sourceVisible:[...document.querySelectorAll('[data-source-anchor]')].filter(el=>getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&parseFloat(getComputedStyle(el).opacity)>0).length,
                ledger:document.querySelectorAll('[data-runtime-event-index]').length,
                ghosts:document.querySelectorAll('.ai-r4-runtime__active-ghost').length,
              }));
              const hard=[];
              if(m.overflow>1)hard.push('overflow');
              if(m.pos==='sticky')hard.push('still-sticky');
              if(m.sourceVisible!==17)hard.push('source-incomplete:'+m.sourceVisible);
              if(m.ledger!==17)hard.push('trace-incomplete');
              if(m.ghosts)hard.push('motion-ghost-present');
              console.log('R41_REDUCED',JSON.stringify({id,m,hard}));
              out.push(...hard.map(x=>id+':'+x));
              await context.close();
            }
            return out;
          }

          const results=[];
          const chrome=await chromium.launch({headless:true});
          for(const c of chromiumCases){
            const shot=['en-1440','en-430','ru-390','ru-landscape'].includes(c[0]);
            results.push(await runCase('chromium',chrome,c,shot));
          }
          const orientationFailures=await orientationCheck(chrome);
          const reducedFailures=await reducedCheck(chrome);
          await chrome.close();

          const wk=await webkit.launch({headless:true});
          for(const c of webkitCases) results.push(await runCase('webkit',wk,c,false));
          await wk.close();

          const failures=[
            ...results.flatMap(r=>r.hard.map(x=>r.browserType+':'+r.id+':'+x)),
            ...orientationFailures.map(x=>'orientation:'+x),
            ...reducedFailures.map(x=>'reduced:'+x),
          ];
          fs.writeFileSync('r4-1-qa-artifacts/results.json',JSON.stringify({results,orientationFailures,reducedFailures,failures},null,2));
          if(failures.length){
            console.error('R41_QA_FAILURES',JSON.stringify(failures));
            process.exit(1);
          }
          console.log('R41_QA_PASS',results.map(r=>r.browserType+':'+r.id).join(', '));
          EOF
          node r4-1-qa.mjs

      - name: Upload R4.1 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-r4-1-qa-evidence
          path: r4-1-qa-artifacts/
          if-no-files-found: warn
