name: AI Systems R4 Final Cloudflare Probe

on:
  push:
    branches:
      - ai-systems-r4-preview

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify final EN and RU Owner preview URLs
        shell: bash
        run: |
          set -euo pipefail
          EN="https://ai-systems-r4-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-r4-trace-threshold-r1/"
          RU="https://ai-systems-r4-preview.proaiexpert-github-io.pages.dev/owner-preview/ai-systems-r4-trace-threshold-r1/ru/"
          for i in $(seq 1 30); do
            en_code=$(curl -L -sS -o /tmp/en.html -w "%{http_code}" --max-time 15 "$EN" || true)
            ru_code=$(curl -L -sS -o /tmp/ru.html -w "%{http_code}" --max-time 15 "$RU" || true)
            css_code=$(curl -L -sS -o /tmp/r4.css -w "%{http_code}" --max-time 15 "https://ai-systems-r4-preview.proaiexpert-github-io.pages.dev/assets/css/ai-systems-golden-r4.css?v=trace-threshold-r1" || true)
            if [ "$en_code" = "200" ] && [ "$ru_code" = "200" ] && [ "$css_code" = "200" ] \
              && grep -Fq "AI systems that do the work." /tmp/en.html \
              && grep -Fq "AI-системы, которые выполняют работу." /tmp/ru.html \
              && grep -Fq ".ai-r4-code-block{display:block!important;opacity:1!important}" /tmp/r4.css; then
              echo "FINAL_CLOUDFLARE_PREVIEW_PASS"
              echo "EN=$EN"
              echo "RU=$RU"
              exit 0
            fi
            echo "attempt=$i en=$en_code ru=$ru_code css=$css_code"
            sleep 10
          done
          exit 1
