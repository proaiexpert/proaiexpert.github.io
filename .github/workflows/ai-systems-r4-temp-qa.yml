name: AI Systems R4 Temporary QA

on:
  push:
    branches:
      - agent/ai-systems-golden-r4-trace-threshold-r1

permissions:
  contents: read

jobs:
  r4-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Reference runtime tests
        run: node --test tests/controlled-agent-reference.test.mjs

      - name: Build candidate with Jekyll
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Rendered viewport QA
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/r4-http.log 2>&1 &
          echo $! >/tmp/r4-http.pid
          sleep 2
          cat > ./r4-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'http://127.0.0.1:4173';
          const cases = [
            { id:'en-1440', path:'/ai-systems/', width:1440, height:1000, lang:'en' },
            { id:'ru-1440', path:'/ru/ai-systems/', width:1440, height:1000, lang:'ru' },
            { id:'en-1280', path:'/ai-systems/', width:1280, height:900, lang:'en' },
            { id:'ru-1280', path:'/ru/ai-systems/', width:1280, height:900, lang:'ru' },
            { id:'en-portrait', path:'/ai-systems/', width:430, height:932, lang:'en', mobile:true },
            { id:'ru-portrait', path:'/ru/ai-systems/', width:430, height:932, lang:'ru', mobile:true },
            { id:'en-landscape', path:'/ai-systems/', width:844, height:390, lang:'en', mobile:true },
            { id:'ru-landscape', path:'/ru/ai-systems/', width:844, height:390, lang:'ru', mobile:true },
          ];

          fs.mkdirSync('r4-qa-artifacts', { recursive:true });
          const browser = await chromium.launch({ headless:true });
          const results = [];

          async function exercise(c, reduced=false) {
            const context = await browser.newContext({
              viewport:{ width:c.width, height:c.height },
              isMobile:Boolean(c.mobile),
              hasTouch:Boolean(c.mobile),
              reducedMotion:reduced ? 'reduce' : 'no-preference',
            });
            const page = await context.newPage();
            await page.route('https://fonts.googleapis.com/**', route => route.abort());
            await page.route('https://fonts.gstatic.com/**', route => route.abort());
            const consoleErrors = [];
            const pageErrors = [];
            const localFailures = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('requestfailed', req => {
              if (req.url().startsWith(base)) localFailures.push(req.url() + ' :: ' + (req.failure()?.errorText || 'failed'));
            });

            const response = await page.goto(base + c.path, { waitUntil:'domcontentloaded', timeout:20000 });
            if (!response || response.status() !== 200) throw new Error(c.id + ' HTTP ' + (response?.status() ?? 'none'));

            await page.waitForFunction(() => document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid === 'true', null, { timeout:10000 });

            const initial = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
              runtimeValid: document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              testResult: document.querySelector('[data-test-result]')?.textContent?.trim(),
              ledgerCount: document.querySelectorAll('[data-runtime-event-index]').length,
              bodyLang: document.documentElement.lang,
              hasHeroTemporary: Boolean(document.querySelector('[data-temporary-visual-authority]')),
            }));

            const story = await page.locator('[data-r4-runtime-story]').boundingBox();
            if (!story) throw new Error(c.id + ' runtime story missing');
            const scrollStart = await page.evaluate(el => window.scrollY + el.getBoundingClientRect().top, await page.locator('[data-r4-runtime-story]').elementHandle());
            const travel = Math.max(1, story.height - c.height);
            const runtimeStates = [];
            const ledgerCounts = [];
            const scrollDrift = [];
            for (let i=0; i<=50; i++) {
              const y = Math.round(scrollStart + travel * (i/50));
              await page.evaluate(y0 => window.scrollTo(0, y0), y);
              await page.waitForTimeout(22);
              const sample = await page.evaluate(() => ({
                y: window.scrollY,
                state: document.querySelector('[data-r4-runtime]')?.dataset.runtimeState || '',
                count: document.querySelectorAll('[data-runtime-event-index]').length,
                activeSource: document.querySelectorAll('[data-source-anchor].is-active').length,
              }));
              runtimeStates.push(sample.state);
              ledgerCounts.push(sample.count);
              scrollDrift.push(Math.abs(sample.y - y));
            }

            const machineStopSamples = runtimeStates.filter(s => s === 'machine-stopped').length;
            const requiredStates = ['tool-failure','retry','fallback','machine-stopped','authority-approved','action'];
            const missingStates = requiredStates.filter(s => !runtimeStates.includes(s));
            const immutableLedger = new Set(ledgerCounts).size === 1;

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(40);
            const focusSeen = [];
            for (let i=0; i<10; i++) {
              await page.keyboard.press('Tab');
              focusSeen.push(await page.evaluate(() => {
                const e=document.activeElement;
                return e ? (e.tagName + ':' + (e.getAttribute('href') || e.getAttribute('aria-label') || e.textContent || '').trim().slice(0,40)) : '';
              }));
            }

            const pearl = page.locator('[data-r4-pearl]');
            await pearl.scrollIntoViewIfNeeded();
            await page.waitForTimeout(80);
            const pearlLive = await pearl.evaluate(el => el.classList.contains('is-r4-pearl-live'));

            const authority = page.locator('[data-r4-authority]');
            await authority.scrollIntoViewIfNeeded();
            await page.waitForTimeout(80);

            await page.screenshot({ path:`r4-qa-artifacts/${c.id}${reduced?'-reduced':''}.png`, fullPage:false });

            let orientation = null;
            if (c.id === 'en-portrait' && !reduced) {
              await page.locator('[data-r4-runtime]').scrollIntoViewIfNeeded();
              await page.waitForTimeout(50);
              const before = await page.evaluate(() => ({ y:window.scrollY, state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState }));
              await page.setViewportSize({ width:844, height:390 });
              await page.waitForTimeout(160);
              const after = await page.evaluate(() => ({ y:window.scrollY, state:document.querySelector('[data-r4-runtime]')?.dataset.runtimeState, overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth }));
              orientation = { before, after, scrollJump:Math.abs(after.y-before.y) };
            }

            const finalMetrics = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
              runtimeValid: document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              runtimeEventCount: document.querySelectorAll('[data-runtime-event-index]').length,
              reducedRuntimePosition: getComputedStyle(document.querySelector('.ai-r4-runtime__sticky')).position,
              reducedRuntimeStoryHeight: getComputedStyle(document.querySelector('[data-r4-runtime-story]')).height,
            }));

            const result = {
              id:c.id + (reduced?'-reduced':''),
              initial, finalMetrics, machineStopSamples, missingStates, immutableLedger,
              maxScrollDrift:Math.max(...scrollDrift), pearlLive, focusSeen,
              consoleErrors, pageErrors, localFailures, orientation
            };
            const hardErrors = [];
            if (initial.overflow > 1 || finalMetrics.overflow > 1) hardErrors.push('horizontal-overflow');
            if (initial.runtimeValid !== 'true') hardErrors.push('runtime-invalid');
            if (initial.ledgerCount < 15) hardErrors.push('trace-incomplete');
            if (!immutableLedger) hardErrors.push('trace-reran-or-ledger-mutated');
            if (!reduced && machineStopSamples < 4) hardErrors.push('machine-stop-plateau-too-short');
            if (!reduced && missingStates.length) hardErrors.push('missing-runtime-states:' + missingStates.join(','));
            if (pageErrors.length) hardErrors.push('page-errors');
            if (localFailures.length) hardErrors.push('same-origin-request-failures');
            if (!pearlLive) hardErrors.push('pearl-transition-not-registered');
            if (reduced && finalMetrics.reducedRuntimePosition === 'sticky') hardErrors.push('reduced-motion-still-sticky');
            result.hardErrors = hardErrors;
            results.push(result);
            console.log('R4_QA', JSON.stringify(result));
            await context.close();
          }

          for (const c of cases) await exercise(c, false);
          await exercise({ id:'en-desktop', path:'/ai-systems/', width:1440, height:1000, lang:'en' }, true);
          await exercise({ id:'ru-portrait', path:'/ru/ai-systems/', width:430, height:932, lang:'ru', mobile:true }, true);

          await browser.close();
          fs.writeFileSync('r4-qa-artifacts/results.json', JSON.stringify(results, null, 2));

          const failures = results.flatMap(r => r.hardErrors.map(e => r.id + ':' + e));
          if (failures.length) {
            console.error('R4_QA_FAILURES', failures);
            process.exit(1);
          }
          console.log('R4_QA_PASS', results.map(r => r.id).join(', '));
          EOF
          node ./r4-qa.mjs

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-systems-r4-rendered-qa
          path: r4-qa-artifacts/
          if-no-files-found: warn
