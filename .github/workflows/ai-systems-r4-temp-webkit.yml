name: AI Systems R4 Temporary WebKit QA

on:
  push:
    branches:
      - agent/ai-systems-golden-r4-trace-threshold-r1

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build candidate
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
      - name: Install WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: WebKit phone QA
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/r4-webkit-http.log 2>&1 &
          sleep 2
          cat > r4-webkit-qa.mjs <<'EOF'
          import { webkit } from 'playwright';
          const base='http://127.0.0.1:4173';
          const cases=[
            ['en-portrait','/ai-systems/',430,932],
            ['ru-portrait','/ru/ai-systems/',430,932],
            ['en-landscape','/ai-systems/',844,390],
            ['ru-landscape','/ru/ai-systems/',844,390],
          ];
          const browser=await webkit.launch({headless:true});
          for (const [id,path,width,height] of cases){
            const ctx=await browser.newContext({viewport:{width,height},isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.abort());
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            const pageErrors=[]; const localFailures=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>{if(r.url().startsWith(base)) localFailures.push(r.url())});
            const res=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForFunction(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid==='true',null,{timeout:10000});
            const initial=await page.evaluate(()=>({
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              ledger:document.querySelectorAll('[data-runtime-event-index]').length
            }));
            const story=page.locator('[data-r4-runtime-story]');
            const box=await story.boundingBox();
            const top=await page.evaluate(el=>window.scrollY+el.getBoundingClientRect().top,await story.elementHandle());
            const travel=Math.max(1,box.height-height);
            const states=[];
            for(let i=0;i<=120;i++){
              await page.evaluate(y=>window.scrollTo(0,y),Math.round(top+travel*(i/120)));
              await page.waitForTimeout(34);
              states.push(await page.evaluate(()=>document.querySelector('[data-r4-runtime]')?.dataset.runtimeState||''));
            }
            const needed=['tool-failure','retry','fallback','machine-stopped','authority-approved','action'];
            const missing=needed.filter(x=>!states.includes(x));
            const stop=states.filter(x=>x==='machine-stopped').length; const unique=[...new Set(states)];
            const final=await page.evaluate(()=>({
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              valid:document.querySelector('[data-r4-runtime]')?.dataset.runtimeValid,
              ledger:document.querySelectorAll('[data-runtime-event-index]').length
            }));
            const hard=[];
            if(initial.overflow>1||final.overflow>1) hard.push('overflow');
            if(initial.valid!=='true'||final.valid!=='true') hard.push('runtime');
            if(initial.ledger!==17||final.ledger!==17) hard.push('trace');
            if(missing.length) hard.push('missing:'+missing.join(','));
            if(stop<3) hard.push('machine-stop-plateau');
            if(pageErrors.length) hard.push('page-errors');
            if(localFailures.length) hard.push('local-request-failures');
            console.log('WEBKIT_QA',JSON.stringify({id,initial,final,stop,unique,missing,pageErrors,localFailures,hard}));
            if(hard.length){await browser.close();process.exit(1)}
            await ctx.close();
          }
          await browser.close();
          console.log('WEBKIT_QA_PASS');
          EOF
          node r4-webkit-qa.mjs
