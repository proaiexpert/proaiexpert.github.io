name: Apply article linking and visual refinement

on:
  push:
    branches:
      - premium-article-linking-visual-refinement-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-article-linking-visual-refinement-v1
          fetch-depth: 0

      - name: Apply scoped article refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected fragment in {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          ru_proposal = 'ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html'
          en_proposal = 'insights/how-to-evaluate-a-website-proposal/index.html'
          ru_multi = 'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html'
          en_multi = 'insights/does-your-service-business-need-a-multilingual-website/index.html'
          css = Path('assets/css/premium-article-hotfix-v1.css')

          replace_once(ru_proposal,'<p>Платформа важна из-за модели эксплуатации, а не потому, что одно название универсально лучше другого.</p>','<p>Платформа важна из-за модели эксплуатации, а не потому, что одно название универсально лучше другого. До выбора технологии полезно отдельно определить <a href="/ru/websites-branding/">архитектуру сайта, объём проектирования и путь клиента до обращения</a>.</p>')
          replace_once(ru_proposal,'<p>То же относится к CRM, автоматизации электронной почты, чатам, платёжным системам и другим внешним сервисам.</p>','<p>То же относится к CRM, автоматизации электронной почты, чатам, платёжным системам и другим внешним сервисам. Отдельно проверьте, <a href="/ru/insights/chto-proiskhodit-posle-zayavki/">что должно происходить после формы, звонка или сообщения</a>: кто фиксирует контекст, кто отвечает и как запускается follow-up.</p>')
          replace_once(ru_proposal,'<section class="premium-module" data-module="portfolio-evidence"><h2 id="section-11">8. Как проверять портфолио и доказательства</h2>','<section class="premium-module" data-module="portfolio-evidence"><h2 id="section-11">8. Как проверять портфолио и доказательства</h2><p class="premium-context-link">Начните с <a href="/ru/case-studies/">кейсов ProAI Expert</a>: сравнивайте не только внешний вид, но и сформулированную задачу, реализованный механизм, границы доказательств и реальный следующий шаг пользователя.</p>')
          replace_once(ru_proposal,'<p class="premium-related-insight"><strong>Связанный материал</strong><a href="/ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/">Сайт для русскоязычного бизнеса в США: какой вариант выбрать</a></p>','<div class="premium-related-insights"><strong>Связанные материалы</strong><a href="/ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/">Сайт для русскоязычного бизнеса в США: какой вариант выбрать</a><a href="/ru/insights/chto-proiskhodit-posle-zayavki/">Что происходит после заявки: как сервисному бизнесу не терять обращения</a></div>')

          replace_once(en_proposal,'<p>The platform matters because of the operating model, not because one product name is universally better.</p>','<p>The platform matters because of the operating model, not because one product name is universally better. Before choosing technology, define the <a href="/websites-branding/">website architecture, design scope, and customer path to inquiry</a>.</p>')
          replace_once(en_proposal,'<p>The same applies to CRM, email automation, chat, payment systems, and other external services.</p>','<p>The same applies to CRM, email automation, chat, payment systems, and other external services. Also verify <a href="/insights/what-happens-after-a-lead-arrives/">what should happen after a form submission, call, or message</a>: who captures context, who responds, and how follow-up begins.</p>')
          replace_once(en_proposal,'<section class="premium-module" data-module="portfolio-evidence"><h2 id="section-11">8. How to evaluate portfolio evidence</h2>','<section class="premium-module" data-module="portfolio-evidence"><h2 id="section-11">8. How to evaluate portfolio evidence</h2><p class="premium-context-link">Start with the <a href="/case-studies/">ProAI Expert case studies</a>: compare not only visual polish, but the stated problem, implemented mechanism, evidence boundaries, and the user’s real next step.</p>')
          replace_once(en_proposal,'<p class="premium-related-insight"><strong>Related insight</strong><a href="/insights/does-your-service-business-need-a-multilingual-website/">Does Your U.S. Service Business Need a Multilingual Website?</a></p>','<div class="premium-related-insights"><strong>Related materials</strong><a href="/insights/does-your-service-business-need-a-multilingual-website/">Does Your U.S. Service Business Need a Multilingual Website?</a><a href="/insights/what-happens-after-a-lead-arrives/">What Happens After a Lead Arrives?</a></div>')

          replace_once(ru_multi,'<p>Правильная система не обязана быть самой большой. Она должна честно соответствовать спросу и возможностям бизнеса.</p>','<p>Правильная система не обязана быть самой большой. Она должна честно соответствовать спросу и возможностям бизнеса. Когда модель выбрана, её нужно перевести в <a href="/ru/websites-branding/">понятную архитектуру сайта, контента и пути до обращения</a>.</p>')
          replace_once(en_multi,'<p>The right system does not need to be the largest. It needs to match demand and operating capacity honestly.</p>','<p>The right system does not need to be the largest. It needs to match demand and operating capacity honestly. Once the model is chosen, translate it into a <a href="/websites-branding/">clear website, content, and inquiry architecture</a>.</p>')

          addition = '''\n\n/* Editorial linking + visual refinement v1 */\n.page-article .premium-content a:not(.btn),\n.page-article .premium-context-link a { color:#79e8ff; text-decoration-color:rgba(121,232,255,.42); text-decoration-thickness:1px; text-underline-offset:4px; }\n.page-article .premium-content a:not(.btn):hover,\n.page-article .premium-context-link a:hover { color:#c7f7ff; text-decoration-color:currentColor; }\n.page-article .premium-context-link { margin:14px 0 22px; padding:15px 17px; border-left:3px solid rgba(93,226,255,.75); border-radius:0 12px 12px 0; background:linear-gradient(90deg,rgba(93,226,255,.075),rgba(93,226,255,.015)); }\n.page-article [data-module="financial-stream-evidence"] { border-color:rgba(93,226,255,.28)!important; background:radial-gradient(circle at 88% 12%,rgba(184,182,236,.14),transparent 34%),linear-gradient(145deg,rgba(93,226,255,.085),rgba(10,16,24,.94))!important; box-shadow:inset 0 1px 0 rgba(255,255,255,.035); }\n.page-article [data-module="financial-stream-evidence"] h2 { color:#c9f7ff!important; }\n.page-article [data-module="performance-boundary"] { border-color:rgba(240,192,96,.22)!important; background:linear-gradient(145deg,rgba(240,192,96,.055),rgba(10,16,24,.94))!important; }\n.page-article [data-module="performance-boundary"] h2 { color:#f2d59b!important; }\n.page-article [data-module="decision-sequence"] { border-color:rgba(184,182,236,.28)!important; background:linear-gradient(145deg,rgba(184,182,236,.075),rgba(10,16,24,.94))!important; }\n.page-article [data-module="decision-sequence"] h2 { color:#d8d6ff!important; }\n.page-article h2#section-10 { color:#7ce8ff!important; }\n.page-article h2#section-10 + p { padding:16px 18px; border:1px solid rgba(93,226,255,.16); border-radius:14px; background:linear-gradient(135deg,rgba(93,226,255,.055),rgba(184,182,236,.028)); }\n@media (max-width:640px){ .page-article .premium-context-link{padding:14px 15px;} .page-article [data-module="financial-stream-evidence"],.page-article [data-module="performance-boundary"],.page-article [data-module="decision-sequence"]{padding:20px 18px!important;} }\n'''
          current = css.read_text(encoding='utf-8')
          if 'Editorial linking + visual refinement v1' in current:
              raise SystemExit('CSS refinement already present')
          css.write_text(current + addition, encoding='utf-8')
          PY

      - name: Validate refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            'ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html': ['/ru/websites-branding/', '/ru/insights/chto-proiskhodit-posle-zayavki/', '/ru/case-studies/', 'premium-related-insights'],
            'insights/how-to-evaluate-a-website-proposal/index.html': ['/websites-branding/', '/insights/what-happens-after-a-lead-arrives/', '/case-studies/', 'premium-related-insights'],
            'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html': ['/ru/websites-branding/', '/ru/case-studies/financial-stream/'],
            'insights/does-your-service-business-need-a-multilingual-website/index.html': ['/websites-branding/', '/case-studies/financial-stream/'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, (path, needle)
          css = Path('assets/css/premium-article-hotfix-v1.css').read_text(encoding='utf-8')
          for needle in ['financial-stream-evidence', 'performance-boundary', 'decision-sequence', 'premium-context-link']:
              assert needle in css, needle
          print('Refinement validation passed.')
          PY

      - name: Commit production files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProAI Expert Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-article-linking-visual-refinement.yml
          git add assets/css/premium-article-hotfix-v1.css insights/how-to-evaluate-a-website-proposal/index.html ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html insights/does-your-service-business-need-a-multilingual-website/index.html ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html
          git commit -m "refine: strengthen article linking and editorial hierarchy"
          git push origin HEAD:premium-article-linking-visual-refinement-v1
