            assert text.count('premium-author-byline') == 1, path_str
            assert text.count('premium-article-hotfix-v1.css') == 1, path_str
            assert text.count('premium-article-hotfix-v1.js') == 1, path_str
            assert '<main id="main-content" tabindex="-1"' in text, path_str
            assert '"author": {' in text and '"@type": "Person"' in text, path_str
            assert 'ProAI_Founder_Portrait_2x3.webp' in text, path_str
          ru_multi = Path(targets[1][0]).read_text(encoding='utf-8')
          assert 'Публичная ссылка на портфолио-кейс остаётся заблокированной' not in ru_multi
          assert '/ru/case-studies/financial-stream/' in ru_multi
          assert '/ru/insights/chto-proiskhodit-posle-zayavki/' in ru_multi
          en_multi = Path(targets[0][0]).read_text(encoding='utf-8')
          assert '/case-studies/financial-stream/' in en_multi
          assert '/insights/what-happens-after-a-lead-arrives/' in en_multi
