      - name: Validate syntax and scoped output
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/premium-article-hotfix-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          files = [
            'insights/does-your-service-business-need-a-multilingual-website/index.html',
            'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html',
            'insights/how-to-evaluate-a-website-proposal/index.html',
            'ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html',
          ]
          for file in files:
            text = Path(file).read_text(encoding='utf-8')
            blocks = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', text, flags=re.S)
            if len(blocks) != 1:
              raise SystemExit(f'{file}: expected one JSON-LD block, found {len(blocks)}')
            data = json.loads(blocks[0])
            if data['author']['@type'] != 'Person' or data['publisher']['@type'] != 'Organization':
              raise SystemExit(f'{file}: author/publisher schema mismatch')
            if text.count('<address class="premium-author-byline"') != 1:
              raise SystemExit(f'{file}: visible author mismatch')
          print('Static validation passed for four article routes.')
          PY

