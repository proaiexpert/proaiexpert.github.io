name: Apply premium article hotfix

on:
  push:
    branches:
      - premium-articles-mobile-author-hotfix-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: premium-articles-mobile-author-hotfix-v1
          fetch-depth: 0

      - name: Apply scoped article hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          CSS_PATH = Path('assets/css/premium-article-hotfix-v1.css')
          JS_PATH = Path('assets/js/premium-article-hotfix-v1.js')

          CSS = r'''/* Premium article mobile + author hotfix v1 */
          .page-article .premium-exec-summary blockquote {
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            background: none !important;
            font-style: normal !important;
          }
          .page-article .premium-exec-summary blockquote p {
            width: 100%;
            max-width: none;
            margin: 0;
          }
          .page-article main#main-content[tabindex="-1"]:focus { outline: none; }
          .page-article .skip-link:focus,
          .page-article .skip-link:focus-visible { top: 8px !important; }

          .premium-author-byline {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr);
            gap: 16px;
            align-items: center;
            margin: -12px 0 30px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 15px;
            background: linear-gradient(145deg, rgba(93,226,255,.045), rgba(184,182,236,.025));
            color: inherit;
            font-style: normal;
          }
          .premium-author-portrait {
            display: block;
            width: 64px;
            height: 76px;
            border: 1px solid rgba(93,226,255,.32);
            border-radius: 13px;
            object-fit: cover;
            object-position: center 22%;
            background: #091017;
          }
          .premium-author-content { display: grid; min-width: 0; gap: 3px; }
          .premium-author-label {
            color: var(--cyan, #5de2ff);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .13em;
            text-transform: uppercase;
          }
          .premium-author-name { color: #fff; font-size: 17px; line-height: 1.2; }
          .premium-author-role { color: rgba(255,255,255,.72); font-size: 13px; }
          .premium-author-scope { color: rgba(255,255,255,.58); font-size: 13px; line-height: 1.45; }
          .premium-author-link {
            width: max-content;
            min-height: 44px;
            margin-top: 3px;
            display: inline-flex;
            align-items: center;
            color: var(--cyan, #5de2ff);
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
          }
          .premium-author-link:focus-visible {
            outline: 2px solid var(--cyan, #5de2ff);
            outline-offset: 4px;
            border-radius: 3px;
          }

          .premium-related-insights {
            display: grid;
            gap: 12px;
            margin: 44px 0 0;
            padding: 20px 0 0;
            border-top: 1px solid rgba(255,255,255,.12);
          }
          .premium-related-insights > strong {
            color: var(--cyan, #5de2ff);
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
          }
          .premium-related-insights a {
            color: #fff;
            font-weight: 750;
            line-height: 1.45;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
          }
          .premium-case-link a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            color: var(--cyan, #5de2ff);
            font-weight: 800;
            text-decoration: none;
          }

          @media (max-width: 1200px), ((max-height: 540px) and (orientation: landscape)) {
            .page-article .global-header { z-index: 12000 !important; }
            .page-article .global-header .site-nav.is-open,
            .page-article .global-header .site-nav.premium-hotfix-open {
              position: fixed !important;
              z-index: 11999 !important;
              inset: var(--header-h, 78px) 0 0 !important;
              width: 100% !important;
              height: calc(100dvh - var(--header-h, 78px)) !important;
              min-height: 0 !important;
              max-height: none !important;
              display: flex !important;
              flex-direction: column !important;
              justify-content: flex-start !important;
              align-items: stretch !important;
              gap: 0 !important;
              padding: 18px max(20px, env(safe-area-inset-left)) calc(26px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-right)) !important;
              overflow-x: hidden !important;
              overflow-y: auto !important;
              opacity: 1 !important;
              visibility: visible !important;
              pointer-events: auto !important;
              background: linear-gradient(180deg, #05070b, #030407) !important;
              border: 0 !important;
              box-shadow: 0 24px 80px rgba(0,0,0,.65) !important;
              -webkit-overflow-scrolling: touch;
            }
            .page-article .global-header .site-nav.is-open a,
            .page-article .global-header .site-nav.premium-hotfix-open a {
              width: 100% !important;
              min-height: 52px !important;
              display: flex !important;
              align-items: center !important;
              padding: 10px 14px !important;
              border: 0 !important;
              border-bottom: 1px solid rgba(255,255,255,.08) !important;
              border-radius: 8px !important;
              color: rgba(255,255,255,.82) !important;
              background: transparent !important;
              font-size: clamp(19px, 4.8vw, 26px) !important;
              font-weight: 620 !important;
              line-height: 1.12 !important;
              letter-spacing: -.025em !important;
              text-decoration: none !important;
              text-transform: none !important;
              text-shadow: none !important;
              outline: none;
            }
            .page-article .global-header .site-nav.is-open a.is-active,
            .page-article .global-header .site-nav.is-open a[aria-current="page"],
            .page-article .global-header .site-nav.premium-hotfix-open a.is-active,
            .page-article .global-header .site-nav.premium-hotfix-open a[aria-current="page"] {
              color: var(--cyan, #5de2ff) !important;
              background: rgba(93,226,255,.065) !important;
              box-shadow: inset 3px 0 0 var(--cyan, #5de2ff) !important;
            }
            .page-article .global-header .site-nav.is-open a:focus:not(:focus-visible),
            .page-article .global-header .site-nav.premium-hotfix-open a:focus:not(:focus-visible) {
              outline: none !important;
              box-shadow: none !important;
            }
            .page-article .global-header .site-nav.is-open a:focus-visible,
            .page-article .global-header .site-nav.premium-hotfix-open a:focus-visible {
              outline: 2px solid var(--cyan, #5de2ff) !important;
              outline-offset: -4px !important;
              box-shadow: none !important;
            }
            body.page-article.premium-hotfix-menu-open { overflow: hidden !important; }
          }

          @media (max-width: 640px) {
            .premium-author-byline {
              grid-template-columns: 54px minmax(0, 1fr);
              gap: 13px;
              margin: -4px 0 26px;
              padding: 14px;
            }
            .premium-author-portrait { width: 54px; height: 64px; border-radius: 11px; }
            .premium-author-name { font-size: 16px; }
            .premium-author-scope { font-size: 12px; }
            .page-article .premium-exec-summary { padding: 20px 18px !important; }
          }

          @media (max-height: 540px) and (orientation: landscape) {
            .page-article .global-header .site-nav.is-open,
            .page-article .global-header .site-nav.premium-hotfix-open {
              display: grid !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              align-content: start !important;
              gap: 5px 12px !important;
              padding-top: 12px !important;
              padding-bottom: calc(14px + env(safe-area-inset-bottom)) !important;
            }
            .page-article .global-header .site-nav.is-open a,
            .page-article .global-header .site-nav.premium-hotfix-open a {
              min-height: 43px !important;
              padding: 7px 11px !important;
              font-size: clamp(16px, 2.6vw, 20px) !important;
            }
            .page-article main#main-content {
              position: relative !important;
              z-index: 1 !important;
              padding-top: 96px !important;
            }
            .page-article .premium-article-shell {
              width: 100% !important;
              max-width: 100% !important;
              padding-inline: max(24px, env(safe-area-inset-left)) !important;
            }
            .page-article .premium-article-header,
            .page-article .premium-meta,
            .page-article .premium-author-byline,
            .page-article .premium-exec-summary,
            .page-article .premium-layout,
            .page-article .premium-content,
            .page-article .premium-module,
            .page-article .premium-cta {
              position: static !important;
              inset: auto !important;
              width: 100% !important;
              min-width: 0 !important;
              max-width: 100% !important;
              height: auto !important;
              min-height: 0 !important;
              transform: none !important;
              overflow: visible !important;
            }
            .page-article .premium-layout,
            .page-article .premium-content { display: block !important; }
            .page-article .premium-layout > aside,
            .page-article .premium-toc,
            .page-article .premium-toc-mobile { display: none !important; }
            .page-article .premium-article-header { margin-bottom: 28px !important; }
            .page-article .premium-article-h1 {
              margin-bottom: 18px !important;
              font-size: clamp(30px, 5.8vw, 44px) !important;
              line-height: 1.06 !important;
              overflow-wrap: anywhere;
            }
            .page-article .premium-meta {
              display: flex !important;
              flex-wrap: wrap !important;
              gap: 7px 13px !important;
              margin-bottom: 20px !important;
            }
            .page-article .premium-author-byline {
              grid-template-columns: 54px minmax(0, 1fr) !important;
              margin: 0 0 20px !important;
              padding: 13px !important;
            }
            .page-article .premium-author-portrait { width: 54px !important; height: 64px !important; }
            .page-article .premium-exec-summary {
              display: block !important;
              margin: 0 0 24px !important;
              padding: 18px 20px !important;
            }
            .page-article .premium-content h2 {
              margin: 38px 0 16px !important;
              font-size: clamp(27px, 4.5vw, 36px) !important;
              line-height: 1.14 !important;
            }
            .page-article .premium-content h3 {
              margin: 28px 0 12px !important;
              font-size: clamp(21px, 3.4vw, 27px) !important;
            }
            .page-article .premium-content p,
            .page-article .premium-content li {
              font-size: 16px !important;
              line-height: 1.65 !important;
            }
            .page-article .premium-module {
              display: block !important;
              margin: 30px 0 !important;
              padding: 20px !important;
            }
          }
          '''

          JS = r'''(function () {
            const toggle = document.querySelector('.mobile-menu-toggle');
            const nav = document.querySelector('#site-navigation');
            const body = document.body;
            const main = document.querySelector('#main-content');
            const skip = document.querySelector('.skip-link');
            const mobile = window.matchMedia('(max-width: 1200px), ((max-height: 540px) and (orientation: landscape))');
            if (!toggle || !nav || toggle.dataset.premiumHotfixBound === 'true') return;
            toggle.dataset.premiumHotfixBound = 'true';

            let lockedY = 0;
            const items = () => [...nav.querySelectorAll('a[href]')];

            function lock() {
              lockedY = window.scrollY || 0;
              body.style.position = 'fixed';
              body.style.top = `-${lockedY}px`;
              body.style.left = '0';
              body.style.right = '0';
              body.style.width = '100%';
            }

            function unlock() {
              body.style.position = '';
              body.style.top = '';
              body.style.left = '';
              body.style.right = '';
              body.style.width = '';
              window.scrollTo(0, lockedY);
            }

            function setOpen(open, focusFirst) {
              nav.classList.toggle('is-open', open);
              nav.classList.toggle('premium-hotfix-open', open);
              body.classList.toggle('menu-open', open);
              body.classList.toggle('mobile-nav-open', open);
              body.classList.toggle('premium-hotfix-menu-open', open);
              toggle.classList.toggle('is-open', open);
              toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
              if (open) {
                lock();
                if (focusFirst) requestAnimationFrame(() => items()[0]?.focus({preventScroll: true}));
              } else {
                unlock();
              }
            }

            toggle.addEventListener('click', (event) => {
              if (!mobile.matches) return;
              event.preventDefault();
              event.stopImmediatePropagation();
              const open = toggle.getAttribute('aria-expanded') !== 'true';
              setOpen(open, event.detail === 0);
            }, true);

            nav.addEventListener('click', (event) => {
              if (mobile.matches && event.target.closest('a[href]')) setOpen(false, false);
            }, true);

            document.addEventListener('keydown', (event) => {
              if (!mobile.matches || toggle.getAttribute('aria-expanded') !== 'true') return;
              if (event.key === 'Escape') {
                event.preventDefault();
                setOpen(false, false);
                toggle.focus();
                return;
              }
              if (event.key !== 'Tab') return;
              const focusable = items();
              if (!focusable.length) return;
              const first = focusable[0];
              const last = focusable[focusable.length - 1];
              if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                toggle.focus();
              } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                toggle.focus();
              } else if (event.shiftKey && document.activeElement === toggle) {
                event.preventDefault();
                last.focus();
              } else if (!event.shiftKey && document.activeElement === toggle) {
                event.preventDefault();
                first.focus();
              }
            }, true);

            mobile.addEventListener('change', (event) => {
              if (!event.matches && toggle.getAttribute('aria-expanded') === 'true') setOpen(false, false);
            });
            window.addEventListener('pagehide', () => {
              if (toggle.getAttribute('aria-expanded') === 'true') setOpen(false, false);
            });

            if (skip && main) {
              skip.addEventListener('click', () => {
                window.setTimeout(() => main.focus({preventScroll: true}), 0);
              });
            }
            document.documentElement.classList.add('premium-article-hotfix-ready');
          })();
          '''

          CSS_PATH.parent.mkdir(parents=True, exist_ok=True)
          JS_PATH.parent.mkdir(parents=True, exist_ok=True)
          CSS_PATH.write_text(CSS.strip() + '\n', encoding='utf-8')
          JS_PATH.write_text(JS.strip() + '\n', encoding='utf-8')

          def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
            return text.replace(old, new, 1)

          def person_author(lang):
            if lang == 'ru':
              obj = {
                '@type': 'Person',
                'name': 'Игорь Горб',
                'alternateName': 'Ihor Horb',
                'jobTitle': 'Основатель',
                'url': 'https://proai-expert.com/ru/about/',
                'sameAs': ['https://www.linkedin.com/in/ihorhorb/'],
                'image': 'https://proai-expert.com/ru/about/ProAI_Founder_Portrait_2x3.webp',
                'worksFor': {'@type': 'Organization', 'name': 'ProAI Expert', 'url': 'https://proai-expert.com/'}
              }
            else:
              obj = {
                '@type': 'Person',
                'name': 'Ihor Horb',
                'alternateName': 'Игорь Горб',
                'jobTitle': 'Founder',
                'url': 'https://proai-expert.com/about/',
                'sameAs': ['https://www.linkedin.com/in/ihorhorb/'],
                'image': 'https://proai-expert.com/ru/about/ProAI_Founder_Portrait_2x3.webp',
                'worksFor': {'@type': 'Organization', 'name': 'ProAI Expert', 'url': 'https://proai-expert.com/'}
              }
            dumped = json.dumps(obj, ensure_ascii=False, indent=2)
            return '  "author": ' + dumped.replace('\n', '\n  ') + ','

          def author_block(lang):
            if lang == 'ru':
              return '''      <address class="premium-author-byline" aria-label="Автор материала">
                <img class="premium-author-portrait" src="/ru/about/ProAI_Founder_Portrait_2x3.webp" width="64" height="76" alt="Игорь Горб, основатель ProAI Expert" decoding="async"/>
                <div class="premium-author-content">
                  <span class="premium-author-label">АВТОР МАТЕРИАЛА</span>
                  <strong class="premium-author-name">Игорь Горб</strong>
                  <span class="premium-author-role">Основатель ProAI Expert</span>
                  <span class="premium-author-scope">AI-системы, автоматизация, стратегия сайтов и операционные процессы сервисного бизнеса.</span>
                  <a class="premium-author-link" href="/ru/about/" rel="author">Об авторе</a>
                </div>
              </address>
'''
            return '''      <address class="premium-author-byline" aria-label="Article author">
                <img class="premium-author-portrait" src="/ru/about/ProAI_Founder_Portrait_2x3.webp" width="64" height="76" alt="Ihor Horb, Founder of ProAI Expert" decoding="async"/>
                <div class="premium-author-content">
                  <span class="premium-author-label">WRITTEN BY</span>
                  <strong class="premium-author-name">Ihor Horb</strong>
                  <span class="premium-author-role">Founder, ProAI Expert</span>
                  <span class="premium-author-scope">AI systems, automation, website strategy, and service-business operations.</span>
                  <a class="premium-author-link" href="/about/" rel="author">View profile</a>
                </div>
              </address>
'''

          targets = [
            ('insights/does-your-service-business-need-a-multilingual-website/index.html', 'en', 'multilingual'),
            ('ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html', 'ru', 'multilingual'),
            ('insights/how-to-evaluate-a-website-proposal/index.html', 'en', 'proposal'),
            ('ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html', 'ru', 'proposal'),
          ]

          for path_str, lang, kind in targets:
            path = Path(path_str)
            text = path.read_text(encoding='utf-8')
            text = replace_once(
              text,
              '<link rel="stylesheet" href="/assets/css/premium-insights-v1.css?v=20260802.5">',
              '<link rel="stylesheet" href="/assets/css/premium-insights-v1.css?v=20260802.5">\n<link rel="stylesheet" href="/assets/css/premium-article-hotfix-v1.css?v=20260802.1">',
              f'{path}: css hook'
            )
            text = replace_once(
              text,
              '<script src="/assets/js/premium-insights-v1.js?v=20260802.5"></script>',
              '<script src="/assets/js/premium-article-hotfix-v1.js?v=20260802.1"></script>\n<script src="/assets/js/premium-insights-v1.js?v=20260802.5"></script>',
              f'{path}: js hook'
            )
            text = replace_once(
              text,
              '<main id="main-content" style=',
              '<main id="main-content" tabindex="-1" style=',
              f'{path}: focus target'
            )
            text = replace_once(
              text,
              '  "author": { "@type": "Organization", "name": "ProAI Expert" },',
              person_author(lang),
              f'{path}: person author'
            )
            text = text.replace('  "dateModified": "2026-08-01",', '  "dateModified": "2026-08-02",', 1)
            match = re.search(r'(<div class="premium-meta">.*?</div>\s*)(<div class="premium-exec-summary")', text, flags=re.S)
            if not match:
              raise SystemExit(f'{path}: premium meta injection point missing')
            text = text[:match.start()] + match.group(1) + author_block(lang) + '      ' + match.group(2) + text[match.end():]

            if kind == 'multilingual' and lang == 'ru':
              intro = '<p>Для одной компании правильным решением будет сайт только на английском. Для другой — английская основа с одной русской страницей, формой или разделом частых вопросов (FAQ). Третьей действительно нужны полноценные RU/EN-версии со связанными страницами услуг, доказательствами и путями до обращения.</p>'
              text = replace_once(text, intro, intro + '\n<p>Это решение является частью более широкой <a href="/ru/websites-branding/">архитектуры сайта, позиционирования и пути до обращения</a>, а не отдельной задачи перевода.</p>', f'{path}: websites link')
              tech = '<p>Эти элементы помогают пользователям и системам найти правильный контент. Они не заменяют полезность страницы, реальный спрос или обслуживание.</p>'
              text = replace_once(text, tech, tech + '\n<p>Если двуязычную систему реализует внешний подрядчик, отдельно проверьте, включены ли в предложение локализованные маршруты, метаданные, формы, <code>hreflang</code>, поддержка и правила обновления. См. руководство <a href="/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/">как проверить подрядчика и предложение на разработку сайта</a>.</p>', f'{path}: proposal link')
              continuity = '<p><strong>понятная услуга + честное языковое обещание + релевантное доказательство + рабочий контакт + предсказуемый первый ответ</strong></p>'
              text = replace_once(text, continuity, continuity + '\n<p>После формы или звонка система должна сохранить язык клиента, назначить ответственного и обеспечить последовательный follow-up. Подробнее — <a href="/ru/insights/chto-proiskhodit-posle-zayavki/">что происходит после заявки и как сервисному бизнесу не терять обращения</a>.</p>', f'{path}: lead response link')
              old_case = '<section class="premium-module" data-module="financial-stream-evidence"><h2 id="section-11">Пример полноценной RU/EN-системы: Financial Stream</h2><p>В Financial Stream реализованы отдельные EN/RU-маршруты, соответствующие структуры услуг, единая система бренда и несколько способов обращения.</p><p>Этот пример показывает устройство двуязычной архитектуры. Он не используется как доказательство трафика, позиций, количества заявок, конверсии, выручки или окупаемости инвестиций (ROI). Публичная ссылка на портфолио-кейс остаётся заблокированной до отдельной проверки доказательной базы.</p><hr></section>'
              new_case = '<section class="premium-module" data-module="financial-stream-evidence"><h2 id="section-11">Пример полноценной RU/EN-системы: Financial Stream</h2><p>В Financial Stream реализованы отдельные EN/RU-маршруты, соответствующие структуры услуг, единая система бренда и несколько способов обращения. Ключевые страницы, формы и клиентские пути локализованы как связанные части одной системы.</p><p>Этот пример показывает устройство двуязычной архитектуры. Он не используется как доказательство трафика, позиций, количества заявок, конверсии, выручки или окупаемости инвестиций (ROI).</p><p class="premium-case-link"><a href="/ru/case-studies/financial-stream/">Посмотреть кейс Financial Stream →</a></p><hr></section>'
              text = replace_once(text, old_case, new_case, f'{path}: Financial Stream case')
              old_related = '<p class="premium-related-insight"><strong>Связанный материал</strong><a href="/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/">Как проверить подрядчика и предложение на разработку сайта</a></p>'
              new_related = '<div class="premium-related-insights"><strong>Связанные материалы</strong><a href="/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/">Как проверить подрядчика и предложение на разработку сайта</a><a href="/ru/insights/chto-proiskhodit-posle-zayavki/">Что происходит после заявки: как сервисному бизнесу не терять обращения</a></div>'
              text = replace_once(text, old_related, new_related, f'{path}: related links')

            if kind == 'multilingual' and lang == 'en':
              intro = '<p>Some companies have a bilingual owner or employee but receive almost every inquiry in English. Others repeatedly hear from customers who need one service explained in Spanish, Russian, Vietnamese, Mandarin, or another language. A third group has enough demand, staff capacity, and content needs to justify complete language versions.</p>'
              text = replace_once(text, intro, intro + '\n<p>The language decision belongs inside a broader <a href="/websites-branding/">website strategy, positioning, and inquiry journey</a> rather than being treated as a translation task in isolation.</p>', f'{path}: websites link')
              tech = '<p>These technical elements help users and systems reach the right content. They do not create demand or guarantee rankings.</p>'
              text = replace_once(text, tech, tech + '\n<p>If an external provider is implementing the system, verify that localized routes, metadata, forms, <code>hreflang</code>, support, and update rules are included in writing. Use the guide on <a href="/insights/how-to-evaluate-a-website-proposal/">how to evaluate a website proposal before signing</a>.</p>', f'{path}: proposal link')
              marker = '<section class="premium-module" data-module="performance-boundary">'
