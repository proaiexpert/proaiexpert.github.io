name: Apply Premium Core R2 second pass

on:
  push:
    branches:
      - agent/hero-premium-core-2-r1
    paths:
      - tools/apply_premium_core_r2_second_pass.py
      - .github/workflows/apply-premium-core-r2-second-pass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hero-premium-core-2-r1
          fetch-depth: 0
      - name: Apply asserted R2 geometry patch
        run: python3 tools/apply_premium_core_r2_second_pass.py
      - name: Validate JavaScript syntax
        run: node --check assets/js/hero-premium-core-2-r2.js
      - name: Guard production routes
        run: |
          set -euo pipefail
          if git diff --name-only | grep -Eq '^(index\.html|ru/index\.html)$'; then
            echo 'Production route changed unexpectedly' >&2
            exit 1
          fi
      - name: Commit second-pass shader refinement
        run: |
          set -euo pipefail
          git config user.name 'ProAI Hero Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/hero-premium-core-2-r2.js
          git diff --cached --quiet && { echo 'No second-pass changes to commit'; exit 1; }
          git commit -m 'Refine Premium Core R2 silhouette and internal intelligence'
          git push origin HEAD:agent/hero-premium-core-2-r1
