name: Build ProAI favicon system R1

on:
  push:
    branches:
      - favicon-system-r1
    paths:
      - scripts/build-favicon-system-r1.mjs
      - .github/workflows/build-favicon-system-r1.yml
      - assets/brand/proai-logo-r341/proai-header-r111-static-cube-320.png
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image tooling
        run: npm install --no-save sharp@0.34.3 png-to-ico@2.1.8

      - name: Build favicon system
        run: node scripts/build-favicon-system-r1.mjs

      - name: Validate required files
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root=Path('artifacts/favicon-system-r1')
          expected={
            'favicon-16x16.png':(16,16),
            'favicon-32x32.png':(32,32),
            'favicon-48x48.png':(48,48),
            'apple-touch-icon.png':(180,180),
            'android-chrome-192x192.png':(192,192),
            'android-chrome-512x512.png':(512,512),
          }
          for name, dims in expected.items():
            data=(root/name).read_bytes()
            assert data[:8]==b'\x89PNG\r\n\x1a\n', name
            got=struct.unpack('>II',data[16:24])
            assert got==dims,(name,got,dims)
            print(name,got,len(data))
          for name in ['favicon.svg','favicon.ico','site.webmanifest','favicon-qa-preview.png']:
            p=root/name
            assert p.exists() and p.stat().st_size>0,name
            print(name,p.stat().st_size)
          PY

      - name: Upload owner approval artifact
        uses: actions/upload-artifact@v4
        with:
          name: proai-favicon-system-r1-owner-review
          path: artifacts/favicon-system-r1/
          if-no-files-found: error
          retention-days: 7
