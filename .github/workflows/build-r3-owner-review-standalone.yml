name: Build R3 Owner Review Standalone

on:
  push:
    branches:
      - agent/hero-r3-owner-review-artifact
    paths-ignore:
      - PROAI_HERO_R3_OWNER_REVIEW.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate self-contained owner review HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          ROOT = Path('.')
          OUT = ROOT / 'PROAI_HERO_R3_OWNER_REVIEW.html'
          SOURCE_HEAD = '60d5261cbdab32608a9aa8a7c78a2f369f02e713'

          def b64(path):
              return base64.b64encode((ROOT / path).read_bytes()).decode('ascii')

          def concat_b64(paths):
              return ''.join(''.join((ROOT / p).read_text().split()) for p in paths)

          font_b64 = b64('assets/fonts/inter-variable-latin.woff2')
          core_avif = b64('assets/img/hero-c-shape/core-static-master-isolated.avif')
          core_webp = b64('assets/img/hero-c-shape/core-static-master-isolated.webp')
          env_avif = concat_b64([
              '_includes/hero-c-shape-r2/env-avif-01.b64',
              '_includes/hero-c-shape-r2/env-avif-02.b64',
              '_includes/hero-c-shape-r2/env-avif-03.b64',
          ])
          env_webp = concat_b64([
              '_includes/hero-c-shape-r2/env-webp-01.b64',
              '_includes/hero-c-shape-r2/env-webp-02.b64',
              '_includes/hero-c-shape-r2/env-webp-03.b64',
              '_includes/hero-c-shape-r2/env-webp-04.b64',
              '_includes/hero-c-shape-r2/env-webp-05.b64',
              '_includes/hero-c-shape-r2/env-webp-06a.b64',
              '_includes/hero-c-shape-r2/env-webp-06b.b64',
              '_includes/hero-c-shape-r2/env-webp-07.b64',
          ])

          css_files = [
              'assets/css/header-system-v1.css',
              'assets/css/hero-c-shape-a-plus.css',
              'assets/css/hero-c-shape-grounding-r2.css',
              'assets/css/hero-c-shape-owner-candidate-r3.css',
          ]
          css = '\n\n'.join((ROOT / p).read_text() for p in css_files)
          css = css.replace('/assets/fonts/inter-variable-latin.woff2', f'data:font/woff2;base64,{font_b64}')
          transparent = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='
          css = css.replace('/assets/img/hero-c-shape/scene-grounded-static-master.avif', transparent)
          css = css.replace('/assets/img/hero-c-shape/scene-grounded-static-master-mobile.avif', transparent)
          css += '''
          .review-locale[hidden] { display: none !important; }
          .review-locale { min-height: 100svh; }
          .review-locale .site-header__locale { cursor: pointer; }
          '''

          environment_markup = f'''<picture class="hero-cshape__layer hero-cshape__layer--environment">
            <source srcset="data:image/avif;base64,{env_avif}" type="image/avif" width="735" height="780">
            <source srcset="data:image/webp;base64,{env_webp}" type="image/webp" width="735" height="780">
            <img data-ground-layer-image data-ground-layer="environment" src="data:image/webp;base64,{env_webp}" width="735" height="780" alt="" decoding="async">
          </picture>'''

          core_markup = f'''<picture class="hero-cshape__layer hero-cshape__layer--core">
            <source srcset="data:image/avif;base64,{core_avif}" type="image/avif" width="900" height="760">
            <source srcset="data:image/webp;base64,{core_webp}" type="image/webp" width="900" height="760">
            <img data-ground-layer-image data-ground-layer="core" src="data:image/webp;base64,{core_webp}" width="900" height="760" alt="" decoding="async" fetchpriority="high">
          </picture>'''

          def extract_main(path, locale):
              src = (ROOT / path).read_text()
              match = re.search(r'(<main id="main-content".*?</main>)', src, flags=re.S)
              if not match:
                  raise RuntimeError(f'Main not found in {path}')
              main = match.group(1)
              main = main.replace('{% include hero-c-shape-r2/environment-r2.html %}', environment_markup)
              main = re.sub(r'<picture class="hero-cshape__layer hero-cshape__layer--core">.*?</picture>', core_markup, main, flags=re.S)
              main = re.sub(r'href="[^"]*"', 'href="#"', main)
              main = main.replace('id="main-content"', f'id="main-content-{locale}"')
              main = main.replace('id="hero-cshape-title"', f'id="hero-cshape-title-{locale}"')
              main = main.replace('aria-labelledby="hero-cshape-title"', f'aria-labelledby="hero-cshape-title-{locale}"')
              return main

          en_main = extract_main('hero-a-plus-c-shape-preview/index.html', 'en')
          ru_main = extract_main('ru/hero-a-plus-c-shape-preview/index.html', 'ru')

          def header(locale):
              if locale == 'en':
                  items = [('Home','/'),('AI Systems','/ai-systems/'),('Websites & Branding','/websites-branding/'),('Case Studies','/case-studies/'),('About','/about/'),('Insights','/insights/'),('Contact','/contact/')]
                  aria='Primary navigation'; brand='ProAI Expert homepage'; menu='Open menu'; close='Close menu'; switch='RU'; target='ru'; cta='Discuss Project'
              else:
                  items = [('Главная','/ru/'),('AI-системы','/ru/ai-systems/'),('Сайты и брендинг','/ru/websites-branding/'),('Кейсы','/ru/case-studies/'),('О нас','/ru/about/'),('Материалы','/ru/insights/'),('Контакты','/ru/contact/')]
                  aria='Основная навигация'; brand='Главная страница ProAI Expert'; menu='Открыть меню'; close='Закрыть меню'; switch='EN'; target='en'; cta='Обсудить проект'
              links=''.join(f'<a href="#"{(" class=\"is-active\" aria-current=\"page\"" if i==0 else "")}>{label}</a>' for i,(label,_) in enumerate(items))
              return f'''<header class="site-header site-header--standard" data-site-header>
                <div class="site-header__shell">
                  <a class="site-header__brand" href="#" aria-label="{brand}">
                    <span class="site-header__cube-wrap" aria-hidden="true"><span class="site-header__cube"><span class="site-header__cube-face site-header__cube-face--front"></span><span class="site-header__cube-face site-header__cube-face--back"></span><span class="site-header__cube-face site-header__cube-face--right"></span><span class="site-header__cube-face site-header__cube-face--left"></span><span class="site-header__cube-face site-header__cube-face--top"></span><span class="site-header__cube-face site-header__cube-face--bottom"></span></span></span>
                    <span class="site-header__wordmark">PROAI <strong>EXPERT</strong></span>
                  </a>
                  <nav class="site-header__nav" aria-label="{aria}" id="site-header-navigation-{locale}">{links}</nav>
                  <div class="site-header__actions">
                    <a class="site-header__locale" href="#" data-review-locale="{target}" lang="{target}" hreflang="{target}">{switch}</a>
                    <a class="site-header__cta" href="#">{cta}</a>
                    <button class="site-header__menu-toggle" type="button" aria-expanded="false" aria-controls="site-header-navigation-{locale}" aria-label="{menu}" data-open-label="{menu}" data-close-label="{close}"><span></span><span></span><span></span></button>
                  </div>
                </div>
              </header>'''

          hero_js = (ROOT / 'assets/js/hero-c-shape-a-plus.js').read_text()

          review_js = r'''
          (() => {
            'use strict';
            const views = Array.from(document.querySelectorAll('[data-review-view]'));
            const body = document.body;
            const html = document.documentElement;

            const setupHeader = (root) => {
              const header = root.querySelector('[data-site-header]');
              if (!header) return;
              const toggle = header.querySelector('.site-header__menu-toggle');
              const nav = header.querySelector('.site-header__nav');
              if (!toggle || !nav) return;
              const openLabel = toggle.dataset.openLabel || 'Open menu';
              const closeLabel = toggle.dataset.closeLabel || 'Close menu';
              const setOpen = (open) => {
                toggle.setAttribute('aria-expanded', String(open));
                toggle.setAttribute('aria-label', open ? closeLabel : openLabel);
                nav.classList.toggle('is-open', open);
                body.classList.toggle('menu-open', open);
              };
              toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-expanded') !== 'true'));
              nav.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });
              document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') { setOpen(false); toggle.focus(); } });
              root._closeHeader = () => setOpen(false);
            };

            views.forEach(setupHeader);

            const setLocale = (locale) => {
              views.forEach(view => {
                const active = view.dataset.reviewView === locale;
                view.hidden = !active;
                if (!active && view._closeHeader) view._closeHeader();
              });
              body.classList.toggle('hero-cshape-page--en', locale === 'en');
              body.classList.toggle('hero-cshape-page--ru', locale === 'ru');
              html.lang = locale;
              document.title = locale === 'en'
                ? 'ProAI Expert — Hero R3 Owner Review — EN'
                : 'ProAI Expert — Hero R3 Owner Review — RU';
              body.classList.remove('menu-open');
              window.scrollTo({ top: 0, behavior: 'auto' });
            };

            document.addEventListener('click', (event) => {
              const switcher = event.target.closest('[data-review-locale]');
              if (switcher) {
                event.preventDefault();
                setLocale(switcher.dataset.reviewLocale);
                return;
              }
              const inertLink = event.target.closest('a[href="#"]');
              if (inertLink) event.preventDefault();
            });

            const syncScrollState = () => {
              document.querySelectorAll('[data-site-header]').forEach(header => header.classList.toggle('is-scrolled', window.scrollY > 12));
            };
            syncScrollState();
            window.addEventListener('scroll', syncScrollState, { passive: true });
            window.addEventListener('resize', () => {
              if (!window.matchMedia('(max-width: 1200px)').matches) {
                views.forEach(view => view._closeHeader && view._closeHeader());
              }
            });
          })();
          '''

          html = f'''<!doctype html>
          <html lang="en" class="hero-cshape-has-js">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow">
            <meta name="generator" content="ProAI Expert Hero R3 standalone owner review from {SOURCE_HEAD}">
            <title>ProAI Expert — Hero R3 Owner Review — EN</title>
            <style>{css}</style>
          </head>
          <body class="hero-cshape-page hero-cshape-page--en">
            <div class="review-locale" data-review-view="en">
              <a class="hero-cshape-skip" href="#main-content-en">Skip to main content</a>
              {header('en')}
              {en_main}
            </div>
            <div class="review-locale" data-review-view="ru" hidden>
              <a class="hero-cshape-skip" href="#main-content-ru">Перейти к содержанию</a>
              {header('ru')}
              {ru_main}
            </div>
            <script>{hero_js}</script>
            <script>{review_js}</script>
          </body>
          </html>'''

          # Guardrails: standalone must not depend on repository-root asset URLs.
          forbidden = ['/assets/css/', '/assets/js/', '/assets/fonts/', '/assets/img/', '{% include', '{% assign']
          leftovers = [token for token in forbidden if token in html]
          if leftovers:
              raise RuntimeError(f'External/Liquid dependencies remain: {leftovers}')

          required_copy = [
              'From first impression to follow-through —', 'one connected system.',
              'AI SYSTEMS · AUTOMATION · PREMIUM WEBSITES',
              'От первого впечатления до результата —', 'одна система.',
              'AI-СИСТЕМЫ · АВТОМАТИЗАЦИЯ · ПРЕМИАЛЬНЫЕ САЙТЫ',
              'TRUST', 'INQUIRY', 'RESPONSE', 'OUTCOME',
              'ДОВЕРИЕ', 'ОБРАЩЕНИЕ', 'ОТВЕТ', 'РЕЗУЛЬТАТ'
          ]
          missing = [s for s in required_copy if s not in html]
          if missing:
              raise RuntimeError(f'Required R3 copy missing: {missing}')

          OUT.write_text(html, encoding='utf-8')
          print(f'Wrote {OUT} ({OUT.stat().st_size:,} bytes)')
          PY

      - name: Verify standalone artifact
        shell: bash
        run: |
          test -s PROAI_HERO_R3_OWNER_REVIEW.html
          ! grep -q '/assets/' PROAI_HERO_R3_OWNER_REVIEW.html
          ! grep -q '{% include' PROAI_HERO_R3_OWNER_REVIEW.html
          grep -q 'data:image/avif;base64,' PROAI_HERO_R3_OWNER_REVIEW.html
          grep -q 'data:image/webp;base64,' PROAI_HERO_R3_OWNER_REVIEW.html
          grep -q 'data:font/woff2;base64,' PROAI_HERO_R3_OWNER_REVIEW.html
          grep -q 'data-review-locale="ru"' PROAI_HERO_R3_OWNER_REVIEW.html
          grep -q 'data-review-locale="en"' PROAI_HERO_R3_OWNER_REVIEW.html

      - name: Commit generated review file
        shell: bash
        run: |
          if git diff --quiet -- PROAI_HERO_R3_OWNER_REVIEW.html && git ls-files --error-unmatch PROAI_HERO_R3_OWNER_REVIEW.html >/dev/null 2>&1; then
            echo 'Artifact already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROAI_HERO_R3_OWNER_REVIEW.html
          git commit -m 'Generate single-file R3 owner review'
          git push
