name: Capture Financial Stream social proof

on:
  push:
    branches:
      - agent/prepare-fs-social-proof-post
    paths:
      - '.github/workflows/capture-fs-social-proof.yml'
      - 'scripts/capture-fs-social-proof.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/capture-fs-social-proof.yml'
      - 'scripts/capture-fs-social-proof.mjs'
      - 'docs/social-media/financial-stream-2026-08-07/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prepare-fs-social-proof-post
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture production screenshots
        run: node scripts/capture-fs-social-proof.mjs

      - name: Commit screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/social-media/financial-stream-2026-08-07/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Capture Financial Stream social proof screenshots"
            git push origin HEAD:agent/prepare-fs-social-proof-post
          fi

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-stream-social-proof-screenshots
          path: docs/social-media/financial-stream-2026-08-07/screenshots/*.jpg
