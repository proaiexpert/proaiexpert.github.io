name: Connected System CSS Preview — EN/RU Chromium and WebKit QA
on:
  pull_request:
    paths:
      - "assets/css/homepage-connected-system-r142-bundled-preview.css"
      - "index.html"
      - "ru/index.html"
      - "scripts/qa/connected-system-css-preview.mjs"
      - ".github/workflows/connected-system-css-preview-qa.yml"
permissions:
  contents: read
jobs:
  cross-browser-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Compile actual EN/RU pages
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          python3 scripts/apply-social-preview-defaults.py --mode source --root .
          jekyll build --source . --destination _site
      - name: Verify Connected System CSS and mobile states in Chromium/WebKit
        run: node scripts/qa/connected-system-css-preview.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-system-css-preview-qa
          path: connected-system-css-preview-evidence/
          if-no-files-found: warn
