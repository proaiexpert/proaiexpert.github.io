name: Connected System R1.3 temporary + persistent owner review

on:
  push:
    branches:
      - agent/proai-connected-system-r1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connected-system-r1-owner-review
  cancel-in-progress: true

env:
  PRODUCT_SHA: 2183da3471eeedeea9500ba721294a7f590248ff
  REVIEW_DIR: docs/site-evolution/connected-system-r1

jobs:
  owner-review:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate product and fallback package
        shell: bash
        run: |
          set -euo pipefail
          node --check "$REVIEW_DIR/connected-system-r1.js"
          grep -Fq 'cs-light-carriage' "$REVIEW_DIR/connected-system-r13.css"
          grep -Fq 'hideAfter=shortLandscape?90:120' "$REVIEW_DIR/connected-system-r1.js"
          grep -Fq 'What the system connects.' "$REVIEW_DIR/persistent-en.html"
          grep -Fq 'Что объединяет система.' "$REVIEW_DIR/persistent-ru.html"
          ! grep -Fq 'proai-hero-cube-r1/bootstrap.js' "$REVIEW_DIR/persistent-en.html"
          ! grep -Fq 'proai-hero-cube-r1/bootstrap.js' "$REVIEW_DIR/persistent-ru.html"

      - name: Start local review server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory "$REVIEW_DIR" >/tmp/cs-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/en.html -o /tmp/local.html && exit 0; sleep 1; done
          cat /tmp/cs-http.log; exit 1

      - name: Open fresh TryCloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          LIVE_BASE=''
          for i in {1..60}; do
            LIVE_BASE="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [ -n "$LIVE_BASE" ] && break
            sleep 2
          done
          [ -n "$LIVE_BASE" ] || { cat /tmp/cloudflared.log; exit 1; }
          for i in {1..60}; do
            if curl -fsS --connect-timeout 4 "$LIVE_BASE/en.html" -o /tmp/live-en.html && grep -Fq 'What the system connects.' /tmp/live-en.html; then break; fi
            sleep 2
          done
          grep -Fq 'What the system connects.' /tmp/live-en.html
          echo "LIVE_BASE=$LIVE_BASE" >> "$GITHUB_ENV"
          echo "PERSISTENT_EN=https://raw.githack.com/proaiexpert/proaiexpert.github.io/${GITHUB_SHA}/docs/site-evolution/connected-system-r1/persistent-en.html" >> "$GITHUB_ENV"
          echo "PERSISTENT_RU=https://raw.githack.com/proaiexpert/proaiexpert.github.io/${GITHUB_SHA}/docs/site-evolution/connected-system-r1/persistent-ru.html" >> "$GITHUB_ENV"

      - name: Verify temporary and persistent bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "$LIVE_BASE/ru.html" -o /tmp/temp-ru.html
          grep -Fq 'Что объединяет система.' /tmp/temp-ru.html
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "$PERSISTENT_EN" -o /tmp/p-en.html
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 "$PERSISTENT_RU" -o /tmp/p-ru.html
          grep -Fq 'What the system connects.' /tmp/p-en.html
          grep -Fq 'Что объединяет система.' /tmp/p-ru.html
          PBASE="${PERSISTENT_EN%/persistent-en.html}"
          curl -fsS "$PBASE/connected-system-r13.css" -o /tmp/p.css
          curl -fsS "$PBASE/connected-system-r1.js" -o /tmp/p.js
          grep -Fq 'cs-light-carriage' /tmp/p.css
          grep -Fq 'hideAfter=shortLandscape?90:120' /tmp/p.js

      - name: Browser-verify persistent fallback interaction
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.55.0 >/dev/null
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cat >/tmp/r13-fallback-qa.cjs <<'NODE'
          const {chromium}=require('playwright-core');
          const en=process.env.PERSISTENT_EN, ru=process.env.PERSISTENT_RU, chrome=process.env.CHROME_BIN;
          const cookie={name:'__Http-phish',value:'1',url:'https://raw.githack.com/',secure:true,httpOnly:true};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function open(browser,url,viewport){const c=await browser.newContext({viewport});await c.addCookies([cookie]);const p=await c.newPage();await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForSelector('[data-connected-system]',{timeout:20000});return{c,p}}
          async function desktop(browser){const{c,p}=await open(browser,en,{width:1440,height:900});await p.evaluate(()=>document.querySelector('[data-connected-system]').scrollIntoView());await p.waitForTimeout(150);await p.locator('[data-replay-system]').click();const seen=await p.evaluate(async()=>{const s=new Set();const t=performance.now();while(performance.now()-t<4200){document.querySelectorAll('[data-system-stage]').forEach((n,i)=>n.classList.contains('is-active')&&s.add(i));await new Promise(r=>setTimeout(r,45));}return[...s]});assert([0,1,2,3].every(i=>seen.includes(i)),'desktop sequence did not expose all four active states: '+seen);assert(await p.locator('.cs-light-carriage').count()===1,'light carriage missing');await c.close()}
          async function mobile(browser,url,label){const{c,p}=await open(browser,url,{width:390,height:844});const stage=async i=>{await p.locator('[data-system-stage]').nth(i).evaluate(el=>{const r=el.getBoundingClientRect();scrollTo({top:scrollY+r.top+r.height/2-innerHeight*.565,behavior:'instant'})});await p.waitForTimeout(950)};await stage(2);assert(await p.locator('[data-system-stage]').nth(2).evaluate(n=>n.classList.contains('is-active')),label+' response not active');assert(await p.locator('[data-site-header]').evaluate(n=>n.classList.contains('header-hidden')),label+' header did not hide');await p.evaluate(()=>scrollBy(0,-180));await p.waitForTimeout(320);assert(!(await p.locator('[data-site-header]').evaluate(n=>n.classList.contains('header-hidden'))),label+' header did not show on up scroll');await stage(1);assert(await p.locator('[data-system-stage]').nth(1).evaluate(n=>n.classList.contains('is-active')),label+' reverse focus failed');const y=await p.evaluate(()=>scrollY);await p.locator('[data-replay-system]').click();await p.waitForTimeout(260);assert(Math.abs((await p.evaluate(()=>scrollY))-y)<2,label+' replay moved scroll');await p.locator('.site-header__menu-toggle').evaluate(el=>el.click());await p.waitForTimeout(80);assert(await p.evaluate(()=>document.body.classList.contains('menu-open')),label+' menu did not open');assert(!(await p.locator('[data-site-header]').evaluate(n=>n.classList.contains('header-hidden'))),label+' menu did not lock header');await p.keyboard.press('Escape');await p.setViewportSize({width:844,height:390});await p.waitForTimeout(260);assert(!(await p.locator('[data-site-header]').evaluate(n=>n.classList.contains('header-hidden'))),label+' landscape reset failed');await p.setViewportSize({width:390,height:844});await p.waitForTimeout(260);assert(await p.locator('[data-system-stage].is-active').count()<=1,label+' duplicate active state');await c.close()}
          (async()=>{const b=await chromium.launch({executablePath:chrome,headless:true,args:['--no-sandbox']});try{await desktop(b);await mobile(b,en,'EN');await mobile(b,ru,'RU')}finally{await b.close()}console.log('PERSISTENT_FALLBACK_BROWSER_QA=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          CHROME_BIN="$CHROME_BIN" node /tmp/r13-fallback-qa.cjs
          echo 'PERSISTENT_EN_VERIFIED=PASS' >> "$GITHUB_ENV"
          echo 'PERSISTENT_RU_VERIFIED=PASS' >> "$GITHUB_ENV"
          echo 'OWNER_REPLAY=PASS' >> "$GITHUB_ENV"
          echo 'HEADER_AUTOHIDE=PASS' >> "$GITHUB_ENV"
          echo 'MOBILE_FOCUS=PASS' >> "$GITHUB_ENV"

      - name: Record verified owner-review URLs
        shell: bash
        run: |
          set -euo pipefail
          EXPIRES_UTC="$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          cat > "$REVIEW_DIR/LIVE_PREVIEW.txt" <<EOF
          PROAI CONNECTED SYSTEM R1.3 — OWNER REVIEW
          PRODUCT_SHA=$PRODUCT_SHA
          TEMPORARY_EN=$LIVE_BASE/en.html
          TEMPORARY_RU=$LIVE_BASE/ru.html
          PERSISTENT_EN=$PERSISTENT_EN
          PERSISTENT_RU=$PERSISTENT_RU
          TEMPORARY_VERIFIED=PASS
          PERSISTENT_EN_VERIFIED=$PERSISTENT_EN_VERIFIED
          PERSISTENT_RU_VERIFIED=$PERSISTENT_RU_VERIFIED
          HERO_CUBE_PERSISTENT=NOT_AVAILABLE
          HEADER_AUTOHIDE=$HEADER_AUTOHIDE
          MOBILE_FOCUS=$MOBILE_FOCUS
          OWNER_REPLAY=$OWNER_REPLAY
          EXPECTED_TEMP_EXPIRES_UTC=$EXPIRES_UTC
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REVIEW_DIR/LIVE_PREVIEW.txt"
          git commit -m 'chore: record R1.3 owner review URLs [skip ci]'
          git push origin HEAD:agent/proai-connected-system-r1
          echo "EXPECTED_TEMP_EXPIRES_UTC=$EXPIRES_UTC" >> "$GITHUB_ENV"

      - name: Keep temporary tunnel alive for four hours
        shell: bash
        run: |
          echo "Temporary EN: $LIVE_BASE/en.html"
          echo "Temporary RU: $LIVE_BASE/ru.html"
          echo "Persistent EN: $PERSISTENT_EN"
          echo "Persistent RU: $PERSISTENT_RU"
          echo "Expected temporary expiry: $EXPECTED_TEMP_EXPIRES_UTC"
          sleep 14400
