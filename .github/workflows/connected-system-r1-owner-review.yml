name: Connected System R1.3 temporary + persistent owner review

on:
  push:
    branches:
      - agent/proai-connected-system-r1
    paths-ignore:
      - '.github/scripts/connected-system-r13-browser-qa.cjs'
      - '.github/workflows/connected-system-r131-desktop-qa.yml'
      - '.github/workflows/connected-system-r1-owner-review.yml'
      - 'docs/site-evolution/connected-system-r1/review-r131/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connected-system-r1-owner-review
  cancel-in-progress: true

env:
  PRODUCT_SHA: 2183da3471eeedeea9500ba721294a7f590248ff
  REVIEW_DIR: docs/site-evolution/connected-system-r1

jobs:
  owner-review:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate product and fallback package
        shell: bash
        run: |
          set -euo pipefail
          node --check "$REVIEW_DIR/connected-system-r1.js"
          grep -Fq 'cs-light-carriage' "$REVIEW_DIR/connected-system-r13.css"
          grep -Fq 'hideAfter=shortLandscape?90:120' "$REVIEW_DIR/connected-system-r1.js"
