name: CTA Normalization R1 QA

on:
  push:
    branches:
      - review/homepage-cta-normalization-r1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6

      - name: Build site with Jekyll
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Verify CTA system and generated output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          en = Path('_site/index.html').read_text(encoding='utf-8')
          ru = Path('_site/ru/index.html').read_text(encoding='utf-8')
          en_contact = Path('_site/contact/index.html').read_text(encoding='utf-8')
          ru_contact = Path('_site/ru/contact/index.html').read_text(encoding='utf-8')
          css = Path('_site/assets/css/homepage-cta-normalization-r1.css').read_text(encoding='utf-8')

          assert 'href="/contact/#project-intake">Discuss Your Project</a>' in en
          assert 'href="/ru/contact/#project-intake">Обсудить проект</a>' in ru
          assert 'href="/case-studies/">View Work <span aria-hidden="true">→</span></a>' in en
          assert 'href="/ru/case-studies/">Посмотреть проекты <span aria-hidden="true">→</span></a>' in ru

          assert en.count('Discuss Project') >= 2
          assert ru.count('Обсудить проект') >= 4
          assert en.count('href="/contact/#project-intake"') >= 4
          assert ru.count('href="/ru/contact/#project-intake"') >= 4
          assert en.count('site-header__mobile-cta') == 1
          assert ru.count('site-header__mobile-cta') == 1

          assert 'Request a Review' not in en
          assert 'Запросить разбор' not in ru
          assert 'Смотреть проекты' not in ru
          assert 'id="project-intake"' in en_contact
          assert 'id="project-intake"' in ru_contact

          css_href = '/assets/css/homepage-cta-normalization-r1.css?v=20260902.1'
          assert en.count(css_href) == 1
          assert ru.count(css_href) == 1
          assert en.index('/assets/css/header-system-v1.css') < en.index(css_href)
          assert en.index('/assets/css/homepage-hero-signature-r3.css') < en.index(css_href)
          assert ru.index('/assets/css/header-system-v1.css') < ru.index(css_href)
          assert ru.index('/assets/css/homepage-hero-signature-r3.css') < ru.index(css_href)

          assert 'body.proai-golden-r12 .site-header__cta' in css
          assert 'body.proai-golden-r12 .site-header__mobile-cta' in css
          assert 'min-height: 52px' in css
          assert 'min-height: 48px' in css
          assert '@media (prefers-reduced-motion: reduce)' in css
          assert '#5de2ff' not in css.lower()
          assert 'cyan' not in css.lower()
          assert 'animation:' not in css.lower()

          assert '{% include' not in en
          assert '{% include' not in ru

          print('CTA Normalization R1 generated-output QA: PASS')
          PY

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cta-normalization-r1-site
          path: _site
          retention-days: 1
