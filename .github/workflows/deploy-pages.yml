name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
      - validation/footer-workflow-contract-repair-r1-auto
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Verify ProAI Cube integrity
        shell: bash
        run: node scripts/verify-proai-cube-integrity-r2.mjs

      - name: Materialize social preview assets and normalize source
        shell: bash
        run: python scripts/apply-social-preview-defaults.py --mode source --root .

      - name: Build site with Jekyll
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Normalize generated social preview metadata
        shell: bash
        run: python scripts/apply-social-preview-defaults.py --mode site --root _site

      - name: Verify social preview metadata
        shell: bash
        run: python scripts/apply-social-preview-defaults.py --mode check --root _site

      - name: Verify canonical Site Shell generated output
        shell: bash
        run: python scripts/validate-site-shell-r1.py --source-root . --site-root _site

      - name: Verify Golden Footer contract generated output
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          commercial = [
              'about/index.html', 'ru/about/index.html',
              'contact/index.html', 'ru/contact/index.html',
              'ai-systems/index.html', 'ru/ai-systems/index.html',
              'websites-branding/index.html', 'ru/websites-branding/index.html',
          ]
          portfolio = [
              'case-studies/index.html', 'ru/case-studies/index.html',
              'case-studies/financial-stream/index.html', 'ru/case-studies/financial-stream/index.html',
              'case-studies/alina-horb/index.html', 'ru/case-studies/alina-horb/index.html',
              'case-studies/local-repair-pro/index.html', 'ru/case-studies/local-repair-pro/index.html',
          ]
          editorial = [
              'insights/index.html', 'ru/insights/index.html',
              'insights/what-happens-after-a-lead-arrives/index.html',
              'ru/insights/chto-proiskhodit-posle-zayavki/index.html',
              'insights/ai-agent-or-automation-what-your-business-actually-needs/index.html',
              'insights/ai-ready-website-for-business/index.html',
              'insights/ai-search-optimization-for-service-businesses/index.html',
              'insights/does-your-service-business-need-a-multilingual-website/index.html',
              'insights/how-much-does-a-business-website-cost-in-2026-a-strategic-budget-view/index.html',
              'insights/how-to-evaluate-a-website-proposal/index.html',
              'insights/process-clarity-comes-before-scalable-automation/index.html',
              'insights/website-builder-or-custom-website-what-a-service-business-should-choose/index.html',
              'insights/what-a-premium-website-really-means-for-a-service-business/index.html',
              'insights/where-automation-delivers-its-first-real-roi/index.html',
              'insights/why-service-business-websites-fail-to-convert-high-intent-visitors/index.html',
              'ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/index.html',
              'ru/insights/ai-ready-sayt-dlya-biznesa/index.html',
              'ru/insights/ai-search-optimization-dlya-servisnogo-biznesa/index.html',
              'ru/insights/arkhitektura-konversii-gde-sayt-teryaet-klienta-eshche-do-pervogo-kontakta/index.html',
              'ru/insights/arkhitektura-vkhodyashchego-potoka-poryadok-v-zayavkakh/index.html',
              'ru/insights/chto-znachit-premialnyy-sayt-dlya-servisnogo-biznesa/index.html',
              'ru/insights/ekonomika-proekta-pochemu-otsenka-po-stranitsam-oshibochna/index.html',
              'ru/insights/gde-avtomatizatsiya-daet-pervuyu-realnuyu-polzu-biznesu/index.html',
              'ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html',
              'ru/insights/konstruktor-sayta-ili-sayt-na-zakaz-chto-vybrat-servisnomu-biznesu/index.html',
              'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html',
          ]
          golden_homepage = ['index.html', 'ru/index.html']

          families = {
              'commercial': commercial,
              'portfolio': portfolio,
              'editorial': editorial,
          }
          required_parts = (
              'home-footer-golden-r3__main',
              'home-footer-golden-r3__cta',
              'home-footer-golden-r3__summary',
              'home-footer-golden-r3__capabilities',
              'home-footer-golden-r3__signature',
              'home-footer-golden-r3__signature-text',
              'home-footer-golden-r3__bottom',
              'home-footer-golden-r3__logo',
              'home-footer-golden-r3__social-rail',
              'home-footer-golden-r3__locale',
              'home-footer-golden-r3__copyright',
          )
          golden_css = (
              '/assets/css/home-footer-golden-r3.css',
              '/assets/css/home-footer-golden-r3-1.css',
              '/assets/css/home-footer-golden-r3-2-polish.css',
              '/assets/css/home-footer-golden-r3-3-micro-polish.css',
              '/assets/css/home-footer-signature-r4.css',
          )
          golden_js = (
              '/assets/js/home-footer-golden-r3.js',
              '/assets/js/home-footer-signature-r4.js',
          )
          canonical_destinations = (
              'mailto:hello@proai-expert.com',
              'https://t.me/proAiexpert',
              'https://github.com/proaiexpert',
          )
          unresolved_liquid = (
              '{% include footer-system/',
              '{% include home-footer-golden-r3',
              '{{ footer_',
          )

          def assert_golden_footer(route, text, expected_family=None, require_canonical=False):
              if expected_family is not None:
                  assert text.count(f'data-footer-family="{expected_family}"') == 1, (route, expected_family)
              if require_canonical:
                  assert text.count('data-site-footer-canonical="golden-r1"') == 1, route
              assert text.count('data-home-footer-golden-r3') == 1, route
              for part in required_parts:
                  assert text.count(part) >= 1, (route, part)
              for href in golden_css:
                  assert text.count(href) == 1, (route, href)
              for src in golden_js:
                  assert text.count(src) == 1, (route, src)
              for destination in canonical_destinations:
                  assert destination in text, (route, destination)
              for token in unresolved_liquid:
                  assert token not in text, (route, token)
              assert not re.search(r'class=["\'][^"\']*\bsite-footer\b', text, re.IGNORECASE), route
              assert '/assets/css/footer-system-v1.css' not in text, route

          inner_count = 0
          en_count = 0
          ru_count = 0
          for family, routes in families.items():
              for route in routes:
                  text = (Path('_site') / route).read_text(encoding='utf-8')
                  assert_golden_footer(route, text, expected_family=family, require_canonical=True)
                  inner_count += 1
                  if route.startswith('ru/'):
                      ru_count += 1
                  else:
                      en_count += 1

          homepage_count = 0
          for route in golden_homepage:
              text = (Path('_site') / route).read_text(encoding='utf-8')
              assert_golden_footer(route, text)
              homepage_count += 1
              if route.startswith('ru/'):
                  ru_count += 1
              else:
                  en_count += 1

          inner_expected = sum(len(routes) for routes in families.values())
          total_count = inner_count + homepage_count
          total_expected = inner_expected + len(golden_homepage)
          assert inner_count == inner_expected, (inner_count, inner_expected)
          assert homepage_count == len(golden_homepage), (homepage_count, len(golden_homepage))
          assert total_count == total_expected, (total_count, total_expected)

          print(f'Golden Footer contract verified for {inner_count} inner routes.')
          print(f'Golden Homepage Footer verified for {homepage_count} routes.')
          print(f'Language coverage: EN={en_count}, RU={ru_count}.')
          print(f'Footer verification passed for {total_count} routes total.')
          PY

      - name: Upload generated site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
