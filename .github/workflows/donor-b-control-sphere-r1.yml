name: Donor B Control Sphere R1

on:
  push:
    branches:
      - agent/proai-ai-systems-donor-b-control-sphere-r1

permissions:
  contents: write

jobs:
  build-qa-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-ai-systems-donor-b-control-sphere-r1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Acquire exact donor
        run: |
          git clone https://github.com/achrefelouafi/GeometryPainterThreeJS.git /tmp/donor
          cd /tmp/donor
          git checkout --detach 79c7556ab8c5d7bcf92fa92d7fc8063db298b5e1
          test "$(git rev-parse HEAD)" = "79c7556ab8c5d7bcf92fa92d7fc8063db298b5e1"
          npm ci

      - name: Apply isolated PROAI sphere patch
        run: |
          cp tools/donor-b-control-sphere-r1/patch.py /tmp/donor/patch.py
          cd /tmp/donor
          python3 patch.py
          git diff -- src/app.ts index.html > /tmp/control-sphere-source.patch
          git diff --name-only | tee /tmp/modified-source.txt
          test "$(cat /tmp/modified-source.txt | sort | tr '\n' ' ')" = "index.html src/app.ts "

      - name: TypeScript and production build
        run: |
          cd /tmp/donor
          npm run build -- --base=./
          test -f dist/index.html
          ! grep -R "localhost\|127.0.0.1" dist --include='*.html' --include='*.js'

      - name: Install QA browser
        run: |
          mkdir -p /tmp/proai-qa
          cd /tmp/proai-qa
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.55.0 >/dev/null
          npx playwright install chromium

      - name: Real Chromium runtime QA
        env:
          DONOR_DIR: /tmp/donor
        run: |
          cd /tmp/donor
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          echo $! >/tmp/preview.pid
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          cat >/tmp/proai-qa/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out = process.env.DONOR_DIR;
          const browser = await chromium.launch({headless:true,args:['--enable-unsafe-webgpu','--use-angle=swiftshader','--disable-gpu-sandbox']});
          const consoleErrors=[];
          const pageErrors=[];
          async function wire(page){
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));
          }
          const ctx = await browser.newContext({viewport:{width:1440,height:900}});
          const page = await ctx.newPage(); await wire(page);
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__PROAI_QA?.geometry==='SphereGeometry(1,96,64)');
          await page.waitForTimeout(1200);
          const rest = await page.evaluate(()=>window.__PROAI_QA);
          await page.screenshot({path:`${out}/RUNTIME-DESKTOP-REST-1440x900.png`});
          const rot0 = rest.autoY; await page.waitForTimeout(1300); const rot1=(await page.evaluate(()=>window.__PROAI_QA)).autoY;
          await page.mouse.move(840,390); await page.waitForTimeout(1400);
          const engaged = await page.evaluate(()=>window.__PROAI_QA);
          await page.screenshot({path:`${out}/RUNTIME-DESKTOP-ENGAGED-1440x900.png`});
          await page.mouse.move(1430,890); await page.waitForTimeout(1800);
          const returned = await page.evaluate(()=>window.__PROAI_QA);
          const mctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const mp=await mctx.newPage(); await wire(mp); await mp.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await mp.waitForFunction(()=>window.__PROAI_QA); await mp.waitForTimeout(900); const mobile=await mp.evaluate(()=>window.__PROAI_QA); await mp.screenshot({path:`${out}/RUNTIME-MOBILE-390x844.png`});
          const sctx=await browser.newContext({viewport:{width:320,height:700},isMobile:true,hasTouch:true});
          const sp=await sctx.newPage(); await wire(sp); await sp.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await sp.waitForFunction(()=>window.__PROAI_QA); await sp.waitForTimeout(700); await sp.screenshot({path:`${out}/RUNTIME-MOBILE-320x700.png`});
          const rctx=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'}); const rp=await rctx.newPage(); await wire(rp); await rp.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await rp.waitForFunction(()=>window.__PROAI_QA); const rr0=await rp.evaluate(()=>window.__PROAI_QA); await rp.waitForTimeout(1200); const rr1=await rp.evaluate(()=>window.__PROAI_QA);
          const report={rest,engaged,returned,mobile,rotationDelta:rot1-rot0,reducedMotionDelta:rr1.autoY-rr0.autoY,consoleErrors,pageErrors};
          fs.writeFileSync(`${out}/QA-RUNTIME.json`,JSON.stringify(report,null,2));
          if(!(engaged.engaged>0.75)) throw new Error('engaged state did not activate');
          if(!(returned.engaged<0.15)) throw new Error('engaged state did not decay');
          if(!(rot1-rot0>0.01)) throw new Error('autonomous rotation did not advance');
          if(Math.abs(rr1.autoY-rr0.autoY)>0.001) throw new Error('reduced motion rotation not frozen');
          if(pageErrors.length) throw new Error('page runtime errors: '+pageErrors.join('; '));
          await browser.close();
          EOF
          cd /tmp/proai-qa
          DONOR_DIR=/tmp/donor node qa.mjs

      - name: Package immutable LAB
        run: |
          rm -rf labs/donor-b-control-sphere-r1
          mkdir -p labs/donor-b-control-sphere-r1/source
          cp -R /tmp/donor/dist/* labs/donor-b-control-sphere-r1/
          cp /tmp/donor/RUNTIME-*.png labs/donor-b-control-sphere-r1/
          cp /tmp/donor/QA-RUNTIME.json labs/donor-b-control-sphere-r1/
          cp /tmp/donor/LICENSE labs/donor-b-control-sphere-r1/LICENSE.donor.txt
          cp /tmp/donor/src/app.ts labs/donor-b-control-sphere-r1/source/app.ts
          cp /tmp/donor/index.html labs/donor-b-control-sphere-r1/source/index.source.html
          cp /tmp/control-sphere-source.patch labs/donor-b-control-sphere-r1/SOURCE-PATCH.diff
          cat >labs/donor-b-control-sphere-r1/DONOR-PROVENANCE.md <<'EOF'
          # DONOR PROVENANCE — CONTROL SPHERE R1
          
          DONOR: Geometry Painter — Chiro Visuals
          
          DONOR SHA: 79c7556ab8c5d7bcf92fa92d7fc8063db298b5e1
          
          LICENSE: MIT
          
          SOURCE SPHERE GEOMETRY: UNCHANGED — SphereGeometry(1, 96, 64)
          
          NEW GEOMETRY: NONE added to the sphere/control object. Existing donor floor/backdrop studio geometry retained.
          
          DONOR MODES USED: NONE / SPHERE BASE ONLY
          
          MATERIAL: PROAI ADAPTED
          
          STUDIO LIGHTING: PROAI ADAPTED using donor PMREM/light architecture
          
          ROTATION: ADDED / ADAPTED
          
          POINTER LIGHT RESPONSE: ADDED / ADAPTED
          
          FISSURE: NOT USED
          CRYSTALS: NOT USED
          AURORA: NOT USED
          REEF: NOT USED
          
          EXACT MODIFIED DONOR SOURCE FILES:
          - src/app.ts
          - index.html
          
          BUILD:
          - npm ci
          - npm run build -- --base=./
          
          DEPENDENCY UPGRADES: NONE
          EOF
          cat >labs/donor-b-control-sphere-r1/SECURITY-WARNINGS.txt <<'EOF'
          Known reproduction-gate findings carried forward without remediation:
          1 moderate
          1 high
          0 critical
          No npm update/upgrade/audit-fix performed.
          EOF

      - name: Commit isolated review package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/donor-b-control-sphere-r1
          git commit -m "lab: package donor B control sphere R1 review"
          git push origin HEAD:agent/proai-ai-systems-donor-b-control-sphere-r1
          git rev-parse HEAD | tee /tmp/review-sha

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: donor-b-control-sphere-r1-evidence
          path: |
            /tmp/donor/RUNTIME-*.png
            /tmp/donor/QA-RUNTIME.json
            /tmp/preview.log
          retention-days: 7
