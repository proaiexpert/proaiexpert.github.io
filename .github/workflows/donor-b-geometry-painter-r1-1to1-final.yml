name: Donor B Geometry Painter R1 1to1 Final Gate

on:
  push:
    branches:
      - agent/proai-ai-systems-donor-b-geometry-painter-r1-1to1
    paths:
      - .github/workflows/donor-b-geometry-painter-r1-1to1-final.yml

permissions:
  contents: write

jobs:
  reproduce-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated ProAI branch
        uses: actions/checkout@v4
        with:
          ref: agent/proai-ai-systems-donor-b-geometry-painter-r1-1to1

      - name: Clone exact donor and verify authority
        run: |
          rm -rf /tmp/geometry-painter
          git clone https://github.com/achrefelouafi/GeometryPainterThreeJS.git /tmp/geometry-painter
          cd /tmp/geometry-painter
          git checkout --detach 79c7556ab8c5d7bcf92fa92d7fc8063db298b5e1
          test "$(git rev-parse HEAD)" = "79c7556ab8c5d7bcf92fa92d7fc8063db298b5e1"
          grep -q '^MIT License$' LICENSE
          test -f package-lock.json
          for f in src/modes/crystals.ts src/modes/fissures.ts src/modes/aurora.ts src/modes/reef.ts; do test -f "$f"; done
          ! grep -R -E '(patreon|private registry|npm.pkg.github.com|api[_-]?key|secret[_-]?key)' package.json package-lock.json src README.md
          git status --porcelain | test ! -s /dev/stdin

      - name: Locked install and security record
        working-directory: /tmp/geometry-painter
        run: |
          npm ci 2>&1 | tee /tmp/npm-ci.log
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE' > /tmp/security-summary.txt
          const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8')); const v=j.metadata?.vulnerabilities||{};
          for(const k of ['total','info','low','moderate','high','critical']) console.log(`${k}=${v[k]??0}`);
          NODE
          cat /tmp/security-summary.txt
          git status --porcelain | test ! -s /dev/stdin

      - name: Original dev runtime smoke
        working-directory: /tmp/geometry-painter
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/dev.log 2>&1 &
          DEV_PID=$!; trap 'kill $DEV_PID || true' EXIT
          for i in {1..40}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl --ignore-gpu-blocklist --window-size=1440,900 --virtual-time-budget=6000 --screenshot=/tmp/DEV-RUNTIME-1440x900.png http://127.0.0.1:4173/
          test $(stat -c%s /tmp/DEV-RUNTIME-1440x900.png) -gt 50000
          kill $DEV_PID; wait $DEV_PID || true; trap - EXIT

      - name: Original production build then nested transport build
        working-directory: /tmp/geometry-painter
        run: |
          rm -rf dist
          npm run build
          test -f dist/index.html
          find dist -type f -name '*.js' | grep -q .
          find dist -type f -name '*.css' | grep -q .
          cp -a dist /tmp/original-dist
          git status --porcelain | test ! -s /dev/stdin
          rm -rf dist
          npm run build -- --base=./
          grep -q 'src="\./assets/' dist/index.html
          grep -q 'href="\./assets/' dist/index.html
          ! grep -R -E '(localhost|127\.0\.0\.1)' dist
          git status --porcelain | test ! -s /dev/stdin

      - name: Write corrected CDP harness
        run: |
          cat > /tmp/runtime-qa.mjs <<'NODE'
          import fs from 'node:fs'; import path from 'node:path';
          const port=Number(process.argv[2]), outDir=process.argv[3], width=Number(process.argv[4]), height=Number(process.argv[5]);
          const expectedUrl=process.argv[6], modes=process.argv.slice(7); fs.mkdirSync(outDir,{recursive:true});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let tabs=[]; for(let i=0;i<50;i++){try{tabs=await (await fetch(`http://127.0.0.1:${port}/json`)).json();}catch{}; if(tabs.some(t=>t.type==='page'&&t.url.includes(expectedUrl)))break; await sleep(200);}
          const tab=tabs.find(t=>t.type==='page'&&t.url.includes(expectedUrl)); if(!tab) throw new Error(`No preview page target; saw ${tabs.map(t=>t.url).join(', ')}`);
          const ws=new WebSocket(tab.webSocketDebuggerUrl); await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let id=0; const pending=new Map(), fatal=[];
          ws.onmessage=ev=>{const m=JSON.parse(ev.data); if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);return;} if(m.method==='Runtime.exceptionThrown')fatal.push(`exception:${m.params.exceptionDetails.text}`); if(m.method==='Log.entryAdded'&&m.params.entry.level==='error')fatal.push(`console:${m.params.entry.text}`);};
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));});
          const evaluate=async expression=>{const x=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true}); if(x.exceptionDetails)throw new Error(x.exceptionDetails.text); return x.result?.result?.value;};
          await send('Runtime.enable'); await send('Log.enable'); await send('Page.enable'); await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:false});
          for(let i=0;i<100;i++){const ok=await evaluate(`!!document.querySelector('canvas') && !!document.querySelector('.lil-gui select')`); if(ok)break; if(i===99)throw new Error(`Renderer/UI did not initialize; body=${await evaluate('document.body.innerText.slice(0,500)')}`); await sleep(250);}
          const backend=await evaluate(`({webgpu:!!navigator.gpu,canvas:!!document.querySelector('canvas'),url:location.href,modeOptions:[...document.querySelectorAll('.lil-gui select')].flatMap(s=>[...s.options].map(o=>o.value))})`); fs.writeFileSync(path.join(outDir,'backend.json'),JSON.stringify(backend,null,2));
          async function clickClear(){await evaluate(`(()=>{const b=[...document.querySelectorAll('.lil-gui button')].find(x=>x.textContent?.includes('Clear all'));if(b)b.click();})()`);await sleep(300);}
          async function setMode(mode){const v=await evaluate(`(()=>{const s=[...document.querySelectorAll('.lil-gui select')].find(x=>[...x.options].some(o=>o.value===${JSON.stringify(mode)}));if(!s)return null;s.value=${JSON.stringify(mode)};s.dispatchEvent(new Event('change',{bubbles:true}));return s.value;})()`);if(v!==mode)throw new Error(`Mode activation failed: ${mode}`);await sleep(500);}
          async function paint(){const r=await evaluate(`(()=>{const q=document.querySelector('canvas').getBoundingClientRect();return{x:q.left,y:q.top,w:q.width,h:q.height}})()`);const pts=[];for(let i=0;i<36;i++){const t=i/35;pts.push({x:r.x+r.w*(0.37+0.22*t),y:r.y+r.h*(0.48+0.07*Math.sin(t*Math.PI*1.7))});}await send('Input.dispatchMouseEvent',{type:'mousePressed',x:pts[0].x,y:pts[0].y,button:'left',buttons:1,clickCount:1});for(const p of pts.slice(1)){await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:p.x,y:p.y,button:'left',buttons:1});await sleep(20);}const e=pts.at(-1);await send('Input.dispatchMouseEvent',{type:'mouseReleased',x:e.x,y:e.y,button:'left',buttons:0,clickCount:1});await sleep(2600);}
          async function shot(name){const s=await send('Page.captureScreenshot',{format:'png',fromSurface:true});const f=path.join(outDir,name);fs.writeFileSync(f,Buffer.from(s.data,'base64'));if(fs.statSync(f).size<50000)throw new Error(`Screenshot too small ${name}`);}
          for(const mode of modes){await clickClear();await setMode(mode);await paint();const safe=mode.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'');await shot(`RUNTIME-${safe}-${width}x${height}.png`);}
          fs.writeFileSync(path.join(outDir,'fatal-console.json'),JSON.stringify(fatal,null,2)); if(fatal.length)throw new Error(fatal.join(' | ')); ws.close();
          NODE

      - name: Real production browser QA all original modes
        working-directory: /tmp/geometry-painter
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!; trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..40}; do curl --fail --silent http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          FLAGS='--headless=new --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl --ignore-gpu-blocklist'
          $CHROME $FLAGS --remote-debugging-port=9222 --window-size=1440,900 http://127.0.0.1:4174/ > /tmp/chrome-desktop.log 2>&1 &
          C1=$!; node /tmp/runtime-qa.mjs 9222 /tmp/qa-desktop 1440 900 '127.0.0.1:4174' 'Crystals' 'Molten fissures' 'Aurora silk' 'Bioluminescent reef'; kill $C1; wait $C1 || true
          $CHROME $FLAGS --remote-debugging-port=9223 --window-size=390,844 http://127.0.0.1:4174/ > /tmp/chrome-mobile.log 2>&1 &
          C2=$!; node /tmp/runtime-qa.mjs 9223 /tmp/qa-mobile 390 844 '127.0.0.1:4174' 'Crystals'; kill $C2; wait $C2 || true
          kill $PREVIEW_PID; wait $PREVIEW_PID || true; trap - EXIT

      - name: Package 1to1 review with provenance
        run: |
          TARGET=labs/donor-b-geometry-painter-r1
          rm -rf "$TARGET"; mkdir -p "$TARGET"
          cp -a /tmp/geometry-painter/dist/. "$TARGET/"
          cp /tmp/geometry-painter/LICENSE "$TARGET/LICENSE.donor.txt"
          cp /tmp/qa-desktop/RUNTIME-CRYSTALS-1440x900.png "$TARGET/RUNTIME-CRYSTALS-1440x900.png"
          cp /tmp/qa-desktop/RUNTIME-MOLTEN-FISSURES-1440x900.png "$TARGET/RUNTIME-MOLTEN-FISSURES-1440x900.png"
          cp /tmp/qa-desktop/RUNTIME-AURORA-SILK-1440x900.png "$TARGET/RUNTIME-AURORA-SILK-1440x900.png"
          cp /tmp/qa-desktop/RUNTIME-BIOLUMINESCENT-REEF-1440x900.png "$TARGET/RUNTIME-BIOLUMINESCENT-REEF-1440x900.png"
          cp /tmp/qa-mobile/RUNTIME-CRYSTALS-390x844.png "$TARGET/RUNTIME-MOBILE-390x844.png"
          cp /tmp/qa-desktop/backend.json "$TARGET/QA-BACKEND-DESKTOP.json"
          cp /tmp/qa-mobile/backend.json "$TARGET/QA-BACKEND-MOBILE.json"
          cp /tmp/qa-desktop/fatal-console.json "$TARGET/QA-CONSOLE-DESKTOP.json"
          cp /tmp/qa-mobile/fatal-console.json "$TARGET/QA-CONSOLE-MOBILE.json"
          cp /tmp/security-summary.txt "$TARGET/SECURITY-WARNINGS.txt"
          cat > "$TARGET/DONOR-PROVENANCE.md" <<'EOF'
          # Donor provenance

          DONOR: Geometry Painter — Chiro Visuals

          SOURCE: https://github.com/achrefelouafi/GeometryPainterThreeJS

          DONOR SHA: 79c7556ab8c5d7bcf92fa92d7fc8063db298b5e1

          LICENSE: MIT

          ORIGINAL LIVE: https://tympanus.net/Tutorials/GeometryPainterThreeJS/

          INSTALL COMMAND: npm ci

          DEV COMMAND: npm run dev

          BUILD COMMAND: npm run build

          RENDERER: Three.js WebGPURenderer; WebGL2 fallback documented by donor and exercised by software-rendering QA when native WebGPU is unavailable.

          MAJOR MODES:
          1. Crystals
          2. Molten fissures
          3. Aurora silk
          4. Bioluminescent reef

          VISUAL MODIFICATIONS: NONE

          GEOMETRY MODIFICATIONS: NONE

          MATERIAL MODIFICATIONS: NONE

          CAMERA MODIFICATIONS: NONE

          MOTION MODIFICATIONS: NONE

          BEHAVIORAL MODIFICATIONS: NONE

          INFRASTRUCTURE-ONLY MODIFICATIONS: NONE to donor source. The immutable nested review package is a second Vite build invocation using `npm run build -- --base=./`, which changes emitted asset URLs only; original `npm run build` is separately verified first.
          EOF

      - name: Commit isolated immutable package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/donor-b-geometry-painter-r1
          git diff --cached --check
          git commit -m 'lab: package donor B Geometry Painter R1 1to1 runtime review'
          git push origin HEAD:agent/proai-ai-systems-donor-b-geometry-painter-r1-1to1
