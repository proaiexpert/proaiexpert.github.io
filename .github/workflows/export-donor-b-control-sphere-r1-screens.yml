name: Export Donor B Control Sphere R1 Screens

on:
  push:
    branches: [agent/proai-ai-systems-donor-b-control-sphere-r1]
    paths: [.github/workflows/export-donor-b-control-sphere-r1-screens.yml]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93efbac918ec7502019cf215f67bc814ab344e8a
      - uses: actions/upload-artifact@v4
        with:
          name: donor-b-control-sphere-r1-screens
          path: |
            labs/donor-b-control-sphere-r1/RUNTIME-DESKTOP-REST-1440x900.png
            labs/donor-b-control-sphere-r1/RUNTIME-DESKTOP-ENGAGED-1440x900.png
            labs/donor-b-control-sphere-r1/RUNTIME-MOBILE-390x844.png
            labs/donor-b-control-sphere-r1/RUNTIME-MOBILE-320x700.png
          retention-days: 7
