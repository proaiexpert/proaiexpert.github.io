name: Favicon R2 final production integration QA

on:
  push:
    branches: [favicon-r2-production-final-20260911]
    paths:
      - '.github/workflows/favicon-r2-final-integration-temp.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: favicon-r2-production-final-20260911
          fetch-depth: 0

      - name: Install QA tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil unzip fonts-dejavu-core

      - name: Wire Favicon R2 into existing production normalizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-social-preview-defaults.py')
          text = p.read_text(encoding='utf-8')
          if 'import subprocess\n' not in text:
              text = text.replace('import sys\n', 'import sys\nimport subprocess\n', 1)
          helper = '''\n\ndef run_favicon_r2(mode: str, root: Path) -> None:\n    script = Path(__file__).with_name("apply-favicon-r2.py")\n    subprocess.run(\n        [sys.executable, str(script), "--mode", mode, "--root", str(root)],\n        check=True,\n    )\n'''
          if 'def run_favicon_r2(' not in text:
              marker = '\ndef sha256_bytes(data: bytes) -> str:\n'
              if marker not in text:
                  raise SystemExit('favicon helper insertion anchor not found')
              text = text.replace(marker, helper + marker, 1)
          old = '''    if args.mode == "source":\n        materialized = materialize_assets(root, cleanup_bootstrap=True)\n        changed = normalize_source(root)\n        print(f"Source social preview normalization complete: {changed} HTML files changed; {materialized} assets materialized.")\n    elif args.mode == "site":\n        changed = normalize_generated(root)\n        print(f"Generated-site social preview normalization complete: {changed} HTML files changed.")\n    else:\n        check_site(root)\n'''
          new = '''    if args.mode == "source":\n        materialized = materialize_assets(root, cleanup_bootstrap=True)\n        changed = normalize_source(root)\n        run_favicon_r2("source", root)\n        print(f"Source social preview normalization complete: {changed} HTML files changed; {materialized} assets materialized.")\n    elif args.mode == "site":\n        changed = normalize_generated(root)\n        run_favicon_r2("site", root)\n        print(f"Generated-site social preview normalization complete: {changed} HTML files changed.")\n    else:\n        check_site(root)\n        run_favicon_r2("check", root)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'run_favicon_r2("source", root)' not in text:
              raise SystemExit('main favicon wiring anchor not found')
          p.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply-social-preview-defaults.py scripts/apply-favicon-r2.py
          grep -F 'run_favicon_r2("source", root)' scripts/apply-social-preview-defaults.py
          grep -F 'run_favicon_r2("site", root)' scripts/apply-social-preview-defaults.py
          grep -F 'run_favicon_r2("check", root)' scripts/apply-social-preview-defaults.py

      - name: Download Owner-approved R2 masters
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10185221383/zip > /tmp/r2-artifact.zip
          mkdir -p /tmp/r2-artifact /tmp/r2-inner
          unzip -q /tmp/r2-artifact.zip -d /tmp/r2-artifact
          unzip -q /tmp/r2-artifact/ProAI_Favicon_R2_Owner_Review.zip -d /tmp/r2-inner
          test -f /tmp/r2-inner/favicon-master-r2-2048.png
          test -f /tmp/r2-inner/favicon-micro-r2-64.png

      - name: Create exactly two production icon files
        run: |
          python3 - <<'PY'
          from PIL import Image
          micro = Image.open('/tmp/r2-inner/favicon-micro-r2-64.png').convert('RGBA')
          micro.save('favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48)])

          high = Image.open('/tmp/r2-inner/favicon-master-r2-2048.png').convert('RGBA')
          bbox = high.getchannel('A').getbbox()
          if not bbox:
              raise SystemExit('Approved high-res master has no visible pixels')
          cube = high.crop(bbox)
          max_side = 148
          scale = min(max_side / cube.width, max_side / cube.height)
          cube = cube.resize(
              (max(1, round(cube.width * scale)), max(1, round(cube.height * scale))),
              Image.Resampling.LANCZOS,
          )
          apple = Image.new('RGBA',(180,180),(5,6,7,255))
          apple.alpha_composite(cube, ((180-cube.width)//2,(180-cube.height)//2))
          apple.convert('RGB').save('apple-touch-icon.png', format='PNG', optimize=True)

          ico = Image.open('favicon.ico')
          sizes = set(ico.ico.sizes())
          assert {(16,16),(32,32),(48,48)}.issubset(sizes), sizes
          a = Image.open('apple-touch-icon.png')
          assert a.size == (180,180), a.size
          assert a.mode == 'RGB', a.mode
          assert a.getpixel((0,0)) == (5,6,7), a.getpixel((0,0))
          print('ICO sizes:', sorted(sizes))
          print('Apple icon:', a.size, a.mode, a.getpixel((0,0)))
          PY

      - name: Migrate all current source references and remove legacy assets
        run: |
          python3 scripts/apply-favicon-r2.py --mode source --root .
          rm -f favicon.svg favicon-16x16.png favicon-32x32.png
          python3 scripts/apply-favicon-r2.py --mode check --root .
          python3 - <<'PY'
          from pathlib import Path
          import re
          bad=[]
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules','vendor','_site'} for part in p.parts):
                  continue
              t=p.read_text(encoding='utf-8')
              for tag in re.findall(r'<link\b[^>]*>', t, flags=re.I):
                  low=tag.lower()
                  if 'rel=' in low and 'icon' in low and '20260910-r2' not in low:
                      bad.append(f'{p}: {tag}')
          if bad:
              raise SystemExit('Legacy icon references remain:\n'+'\n'.join(bad[:100]))
          print('No legacy favicon references remain in source HTML.')
          PY

      - name: Build generated-site QA from latest main baseline
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          python3 scripts/apply-favicon-r2.py --mode site --root _site
          python3 scripts/apply-favicon-r2.py --mode check --root _site

      - name: Representative EN/RU route QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          routes=['index.html','ru/index.html','about/index.html','ru/about/index.html']
          icon='/favicon.ico?v=20260910-r2'
          apple='/apple-touch-icon.png?v=20260910-r2'
          for route in routes:
              t=(Path('_site')/route).read_text(encoding='utf-8')
              assert t.count(icon)==1, route
              assert t.count(apple)==1, route
              assert 'favicon.svg' not in t, route
              assert 'favicon-16x16.png' not in t, route
              assert 'favicon-32x32.png' not in t, route
          print('Representative routes PASS:', ', '.join(routes))
          PY

      - name: Create visual QA sheet
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          ico=Image.open('favicon.ico'); ico.size=(32,32); icon=ico.convert('RGBA')
          apple=Image.open('apple-touch-icon.png').convert('RGB')
          canvas=Image.new('RGB',(1200,500),(9,12,17)); d=ImageDraw.Draw(canvas)
          f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',28)
          s=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',20)
          d.text((40,30),'Favicon R2 — final production QA',font=f,fill=(240,242,245))
          d.rounded_rectangle((40,100,560,190),18,fill=(31,34,39),outline=(78,84,92),width=2)
          canvas.paste(icon,(70,129),icon); d.text((120,126),'ProAI Expert',font=f,fill=(240,242,245))
          d.rounded_rectangle((620,100,1140,190),18,fill=(245,246,248),outline=(190,195,202),width=2)
          canvas.paste(icon,(650,129),icon); d.text((700,126),'ProAI Expert',font=f,fill=(22,25,29))
          canvas.paste(apple,(60,250)); d.text((270,275),'Apple Touch Icon — 180×180',font=f,fill=(240,242,245))
          d.text((270,320),'Opaque #050607 · approved high-res R2 cube',font=s,fill=(180,188,198))
          canvas.save('/tmp/favicon-r2-final-production-qa.png')
          PY

      - name: Commit only favicon task changes
        run: |
          rm -rf _site
          git config user.name 'ProAI Expert Automation'
          git config user.email 'proai.expert2026@gmail.com'
          git add favicon.ico apple-touch-icon.png scripts/apply-social-preview-defaults.py
          git add -u -- favicon.svg favicon-16x16.png favicon-32x32.png
          git add -- ':(glob)**/*.html' '*.html'
          if git diff --cached --name-only | grep -E '^(\.ai/social-preview-assets/|assets/social/)'; then
            echo 'Unexpected social-preview file staged' >&2; exit 1
          fi
          if git diff --cached --name-only | grep '^\.github/'; then
            echo 'Unexpected workflow file staged' >&2; exit 1
          fi
          git status --short
          git commit -m 'Integrate Owner-approved Favicon R2'
          git push origin HEAD:favicon-r2-production-final-20260911

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: favicon-r2-final-production-qa
          path: /tmp/favicon-r2-final-production-qa.png
          retention-days: 7
