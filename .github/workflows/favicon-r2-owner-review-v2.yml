name: Build Favicon R2 Owner Review V2

on:
  push:
    branches: [favicon-r2-owner-review]
    paths:
      - '.github/workflows/favicon-r2-owner-review-v2.yml'
      - 'scripts/render-favicon-r2-owner-review.mjs'
      - 'scripts/build-favicon-r2-qa.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install render tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y imagemagick python3-pil fonts-dejavu-core zip

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/proai-r2-http.log 2>&1 &
          sleep 2

      - name: Render production GLB high-res master
        run: |
          mkdir -p owner-review
          node scripts/render-favicon-r2-owner-review.mjs
          mv owner-review/favicon-master-r2-2048-transparent.png owner-review/favicon-master-r2-2048.png

      - name: Build micro master and QA test sizes
        run: |
          convert owner-review/favicon-master-r2-2048.png -filter Lanczos -resize 64x64 -unsharp 0x0.35+0.45+0.015 owner-review/favicon-micro-r2-64.png
          convert owner-review/favicon-micro-r2-64.png -filter Lanczos -resize 32x32 owner-review/favicon-test-r2-32.png
          convert owner-review/favicon-micro-r2-64.png -filter Lanczos -resize 16x16 owner-review/favicon-test-r2-16.png
          convert owner-review/favicon-master-r2-2048.png -filter Lanczos -resize 180x180 owner-review/favicon-test-r2-180.png
          python3 scripts/build-favicon-r2-qa.py

      - name: Write README and validate exact dimensions
        run: |
          test "$(identify -format '%wx%h' owner-review/favicon-master-r2-2048.png)" = "2048x2048"
          test "$(identify -format '%wx%h' owner-review/favicon-micro-r2-64.png)" = "64x64"
          test "$(identify -format '%wx%h' owner-review/favicon-test-r2-16.png)" = "16x16"
          test "$(identify -format '%wx%h' owner-review/favicon-test-r2-32.png)" = "32x32"
          test "$(identify -format '%wx%h' owner-review/favicon-test-r2-180.png)" = "180x180"
          test "$(identify -format '%wx%h' owner-review/ProAI_Favicon_R2_QA_Preview.png)" = "1600x1180"
          GLB_SHA=$(sha256sum assets/models/proai-cube/proai-cube-r1.glb | awk '{print toupper($1)}')
          RUNTIME_SHA=$(sha256sum assets/brand/proai-logo-r341/live-runtime.js | awk '{print toupper($1)}')
          cat > owner-review/README.txt <<EOF
          PROAI EXPERT — FAVICON R2 OWNER REVIEW

          STATUS
          Owner-review package only. Nothing in this package has been deployed or merged to production.
          No favicon.ico, manifest, Android/PWA production formats, SVG replacement, or HTML changes are included.

          SOURCE GLB
          assets/models/proai-cube/proai-cube-r1.glb
          SHA256: $GLB_SHA

          CAMERA / LOOKDEV AUTHORITY
          assets/brand/proai-logo-r341/live.html
          assets/brand/proai-logo-r341/live-runtime.js
          Runtime SHA256: $RUNTIME_SHA

          Static production header signature camera:
          yaw 288°
          pitch 4.5°
          roll -0.3°
          FOV 27°

          Production header micro lookdev:
          exposure 0.92
          PMREM sigma 0.11
          graphite / gunmetal / black-chrome / smoked-core material family
          production RectArea light-card setup and header lighting intensities

          HOW THE MASTER FILES WERE OBTAINED
          favicon-master-r2-2048.png:
          - rendered directly from the production GLB through the current production live.html/live-runtime.js WebGL path;
          - static HOME pose using production premiumHybrid/header micro lookdev;
          - renderer backing canvas is 2048×2048 at device pixel ratio 4;
          - PNG captured directly from that WebGL canvas; no old raster source used.

          favicon-micro-r2-64.png:
          - produced from the new 2048×2048 direct production-GLB master;
          - downsampled to 64×64 with Lanczos and restrained micro sharpening for 16/32px legibility;
          - this is a downsample, never an upscale from an old small raster.

          CONFIRMATION
          NO raster upscale from the old 320px static cube source was used for either R2 master.
          assets/brand/proai-logo-r341/*static-cube-320.png was not used as a pixel source.

          EXACT FILE DIMENSIONS
          favicon-master-r2-2048.png — 2048×2048
          favicon-micro-r2-64.png — 64×64
          favicon-test-r2-16.png — 16×16
          favicon-test-r2-32.png — 32×32
          favicon-test-r2-180.png — 180×180
          ProAI_Favicon_R2_QA_Preview.png — 1600×1180
          README.txt — text

          OWNER GATE
          Do not create production favicon formats or deploy until Owner approves these R2 masters.
          EOF

      - name: Build requested ZIP
        run: |
          cd owner-review
          zip -9 ProAI_Favicon_R2_Owner_Review.zip \
            favicon-master-r2-2048.png \
            favicon-micro-r2-64.png \
            ProAI_Favicon_R2_QA_Preview.png \
            favicon-test-r2-16.png \
            favicon-test-r2-32.png \
            favicon-test-r2-180.png \
            README.txt

      - name: Upload owner artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proai-favicon-r2-owner-review-final
          path: |
            owner-review/ProAI_Favicon_R2_Owner_Review.zip
            owner-review/ProAI_Favicon_R2_QA_Preview.png
          retention-days: 7
          if-no-files-found: error
