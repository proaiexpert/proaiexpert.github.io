name: Footer System PR1 migration

on:
  push:
    branches:
      - agent/footer-system-pr1-commercial-secondary
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply migration and run full QA
        shell: bash
        run: bash .github/footer-pr1-run.sh

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: footer-pr1-qa
          path: /tmp/footer-pr1-qa
          retention-days: 14
