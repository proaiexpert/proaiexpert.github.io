name: Footer System PR1 migration

on:
  push:
    branches:
      - agent/footer-system-pr1-commercial-secondary
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Repair and instrument migration runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/footer-pr1-migrate.py')
          text = path.read_text(encoding='utf-8')

          old = "f'lang=\"{lang}\" variant=\"{variant}\" locale_href=\"{locale_href}\" %}'"
          new = "f'lang=\"{lang}\" variant=\"{variant}\" locale_href=\"{locale_href}\" ' + '%}'"
          if old not in text:
              raise SystemExit('Expected migration delimiter was not found')
          text = text.replace(old, new, 1)

          old_check = '''    if ".f-" in value:
        raise RuntimeError(f"{relative_path}: legacy .f-* selector remains")'''
          new_check = '''    if ".f-" in value:
        contexts = []
        for match in re.finditer(r".{0,120}\\.f-[A-Za-z0-9_-]+.{0,120}", value, flags=re.S):
            contexts.append(match.group(0).replace("\\n", " "))
        print(json.dumps({"path": relative_path, "legacy_contexts": contexts[:20]}, ensure_ascii=False, indent=2))
        raise RuntimeError(f"{relative_path}: legacy .f-* selector remains")'''
          if old_check not in text:
              raise SystemExit('Expected legacy assertion was not found')
          text = text.replace(old_check, new_check, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply migration and run full QA
        shell: bash
        run: bash .github/footer-pr1-run.sh

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footer-pr1-qa
          path: /tmp/footer-pr1-qa
          if-no-files-found: ignore
          retention-days: 14
