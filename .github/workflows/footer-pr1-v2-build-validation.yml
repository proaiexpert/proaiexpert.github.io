name: Validate Footer System PR1 on current main

on:
  push:
    branches:
      - agent/footer-system-pr1-commercial-secondary-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Verify production scope
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/deploy-pages.yml',
              '_data/footer.yml',
              '_data/social-links.yml',
              '_includes/footer-system/bottom.html',
              '_includes/footer-system/brand-zone.html',
              '_includes/footer-system/commercial.html',
              '_includes/footer-system/footer.html',
              'about/index.html',
              'ai-systems/index.html',
              'assets/css/footer-system-v1.css',
              'contact/index.html',
              'ru/about/index.html',
              'ru/ai-systems/index.html',
              'ru/contact/index.html',
              'ru/websites-branding/index.html',
              'websites-branding/index.html',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          ).splitlines())
          actual.discard('.github/workflows/footer-pr1-v2-build-validation.yml')
          assert actual == expected, (sorted(actual - expected), sorted(expected - actual))
          print('Production scope verified:', len(actual), 'files')
          PY

      - name: Verify Header System source parity
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          pages = [
              'about/index.html', 'ru/about/index.html',
              'contact/index.html', 'ru/contact/index.html',
              'ai-systems/index.html', 'ru/ai-systems/index.html',
              'websites-branding/index.html', 'ru/websites-branding/index.html',
          ]
          for path in pages:
              base = subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)
              head = Path(path).read_text(encoding='utf-8')
              base_header = re.search(r'<header\b.*?</header>', base, flags=re.I | re.S)
              head_header = re.search(r'<header\b.*?</header>', head, flags=re.I | re.S)
              assert base_header and head_header, path
              assert base_header.group(0) == head_header.group(0), path
          print('Header markup parity verified for 8 pages.')
          PY

      - name: Build with production Jekyll version
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Verify generated Footer System output
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          routes = {
              'about/index.html': ('en', '/ru/about/'),
              'ru/about/index.html': ('ru', '/about/'),
              'contact/index.html': ('en', '/ru/contact/'),
              'ru/contact/index.html': ('ru', '/contact/'),
              'ai-systems/index.html': ('en', '/ru/ai-systems/'),
              'ru/ai-systems/index.html': ('ru', '/ai-systems/'),
              'websites-branding/index.html': ('en', '/ru/websites-branding/'),
              'ru/websites-branding/index.html': ('ru', '/websites-branding/'),
          }

          for route, (lang, locale_href) in routes.items():
              text = (Path('_site') / route).read_text(encoding='utf-8')
              footer_match = re.search(r'<footer\b.*?</footer>', text, flags=re.I | re.S)
              assert footer_match, route
              footer = footer_match.group(0)
              assert text.count('data-footer-family="commercial"') == 1, route
              assert text.count('site-footer__brand-zone') == 1, route
              assert text.count('site-footer__watermark') == 1, route
              assert '{% include footer-system/' not in text, route
              assert '{{ footer_' not in text, route
              assert f'href="{locale_href}"' in footer, route
              assert 'Privacy' not in footer and 'Terms' not in footer, route
              assert 'https://github.com/proaiexpert' in footer, route
              assert 'https://x.com/proaiexpert' in footer, route
              assert 'https://www.linkedin.com/in/ihorhorb/' in footer, route
              if lang == 'en':
                  assert 't.me/' not in footer, route
              else:
                  assert footer.count('https://t.me/proAiexpert') == 2, route
          print('Generated Footer System output verified for 8 routes.')
          PY

      - name: Verify deployment consumes generated output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          assert 'jekyll build --source . --destination _site' in workflow
          assert 'path: _site' in workflow
          assert 'Verify Footer System generated output' in workflow
          assert 'path: .' not in workflow
          print('Pages workflow generated-output contract verified.')
          PY

      - name: Upload generated route samples
        uses: actions/upload-artifact@v4
        with:
          name: footer-pr1-v2-generated-output
          path: |
            _site/about/index.html
            _site/ru/about/index.html
            _site/contact/index.html
            _site/ru/contact/index.html
            _site/ai-systems/index.html
            _site/ru/ai-systems/index.html
            _site/websites-branding/index.html
            _site/ru/websites-branding/index.html
            _site/assets/css/footer-system-v1.css
          retention-days: 14
