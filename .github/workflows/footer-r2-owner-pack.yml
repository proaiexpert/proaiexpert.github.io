name: Footer R2 Owner Review Packaging

on: push

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout R2 review branch
        uses: actions/checkout@v4
        with:
          ref: agent/proai-home-footer-watermark-r2
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Generate and verify Owner review package
        run: python docs/site-evolution/reviews/home-footer-watermark-r2/package_r2_review.py
      - name: Commit media and remove temporary tooling
        run: |
          rm -f .github/workflows/footer-r2-owner-pack.yml
          rm -f docs/site-evolution/reviews/home-footer-watermark-r2/package_r2_review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/reviews/home-footer-watermark-r2/media .github/workflows/footer-r2-owner-pack.yml docs/site-evolution/reviews/home-footer-watermark-r2/package_r2_review.py
          git commit -m 'review: package Footer R2 owner media'
          git push origin HEAD:agent/proai-home-footer-watermark-r2
