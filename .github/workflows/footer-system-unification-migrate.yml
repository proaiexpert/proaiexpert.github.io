name: Footer System Unification Migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/footer-system-unification-final' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/footer-system-unification-final
          fetch-depth: 0
      - name: Install migration runtime
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Apply centralized Footer System migration
        shell: bash
        run: |
          python scripts/footer_system_unification_migrate.py
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/footer-system-v1.css')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Commit production migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data _includes assets/css docs insights ru/insights
          git diff --cached --check
          git commit -m "Unify Commercial Portfolio and Editorial footers"
          git push origin HEAD:agent/footer-system-unification-final
