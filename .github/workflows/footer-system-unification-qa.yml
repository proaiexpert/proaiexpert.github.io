name: Footer System Unification QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  qa:
    if: github.head_ref == 'agent/footer-system-unification-final'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: agent/footer-system-unification-final
          fetch-depth: 0

      - name: Verify final source scope
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          required = {
              '.github/workflows/deploy-pages.yml',
              '_data/footer.yml', '_data/social-links.yml',
              '_includes/footer-commercial-v1.html',
              '_includes/footer-system/commercial.html',
              '_includes/footer-system/contact-links.html',
              '_includes/footer-system/editorial.html',
              '_includes/footer-system/footer.html',
              '_includes/footer-system/portfolio.html',
              '_includes/lead-hub-en-01.html', '_includes/lead-hub-ru-01.html',
              '_includes/lead-response-en-01.html', '_includes/lead-response-en-07.html',
              '_includes/lead-response-ru-02.html', '_includes/lead-response-ru-10.html',
              '_includes/lead-response-ru-11.html',
              'assets/css/footer-system-v1.css',
              'docs/FOOTER_SYSTEM_HANDOFF.md', 'docs/FOOTER_SYSTEM_SPEC.md',
          }
          assert required <= changed, sorted(required - changed)
          assert '.github/workflows/footer-system-unification-qa.yml' in changed
          assert not any(p.startswith('scripts/footer_system_unification') for p in changed)
          assert not any('unification-audit' in p or 'unification-migrate' in p for p in changed)
          assert 'index.html' not in changed and 'ru/index.html' not in changed
          assert not any(p.startswith(('about/', 'contact/', 'ai-systems/', 'websites-branding/', 'case-studies/', 'ru/about/', 'ru/contact/', 'ru/ai-systems/', 'ru/websites-branding/', 'ru/case-studies/')) for p in changed)
          print('Final source scope passed:', len(changed), 'files')
          PY

      - name: Install build and browser runtimes
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Build baseline and PR site
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          git worktree add /tmp/footer-unification-base origin/main
          jekyll build --source /tmp/footer-unification-base --destination /tmp/footer-unification-base-site
          jekyll build --source . --destination /tmp/footer-unification-head-site

      - name: Verify generated Footer System contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          commercial = [
              'index.html', 'ru/index.html',
              'about/index.html', 'ru/about/index.html',
              'contact/index.html', 'ru/contact/index.html',
              'ai-systems/index.html', 'ru/ai-systems/index.html',
              'websites-branding/index.html', 'ru/websites-branding/index.html',
          ]
          portfolio = [
              'case-studies/index.html', 'ru/case-studies/index.html',
              'case-studies/financial-stream/index.html', 'ru/case-studies/financial-stream/index.html',
              'case-studies/alina-horb/index.html', 'ru/case-studies/alina-horb/index.html',
              'case-studies/local-repair-pro/index.html', 'ru/case-studies/local-repair-pro/index.html',
          ]
          editorial = [
              'insights/index.html', 'ru/insights/index.html',
              'insights/what-happens-after-a-lead-arrives/index.html',
              'ru/insights/chto-proiskhodit-posle-zayavki/index.html',
              'insights/ai-agent-or-automation-what-your-business-actually-needs/index.html',
              'insights/ai-ready-website-for-business/index.html',
              'insights/ai-search-optimization-for-service-businesses/index.html',
              'insights/does-your-service-business-need-a-multilingual-website/index.html',
              'insights/how-much-does-a-business-website-cost-in-2026-a-strategic-budget-view/index.html',
              'insights/how-to-evaluate-a-website-proposal/index.html',
              'insights/process-clarity-comes-before-scalable-automation/index.html',
              'insights/website-builder-or-custom-website-what-a-service-business-should-choose/index.html',
              'insights/what-a-premium-website-really-means-for-a-service-business/index.html',
              'insights/where-automation-delivers-its-first-real-roi/index.html',
              'insights/why-service-business-websites-fail-to-convert-high-intent-visitors/index.html',
              'ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/index.html',
              'ru/insights/ai-ready-sayt-dlya-biznesa/index.html',
              'ru/insights/ai-search-optimization-dlya-servisnogo-biznesa/index.html',
              'ru/insights/arkhitektura-konversii-gde-sayt-teryaet-klienta-eshche-do-pervogo-kontakta/index.html',
              'ru/insights/arkhitektura-vkhodyashchego-potoka-poryadok-v-zayavkakh/index.html',
              'ru/insights/chto-znachit-premialnyy-sayt-dlya-servisnogo-biznesa/index.html',
              'ru/insights/ekonomika-proekta-pochemu-otsenka-po-stranitsam-oshibochna/index.html',
              'ru/insights/gde-avtomatizatsiya-daet-pervuyu-realnuyu-polzu-biznesu/index.html',
              'ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html',
              'ru/insights/konstruktor-sayta-ili-sayt-na-zakaz-chto-vybrat-servisnomu-biznesu/index.html',
              'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html',
          ]
          root = Path('/tmp/footer-unification-head-site')
          count = 0
          for family, routes in {'commercial': commercial, 'portfolio': portfolio, 'editorial': editorial}.items():
              for route in routes:
                  text = (root / route).read_text(encoding='utf-8')
                  assert text.count(f'data-footer-family="{family}"') == 1, route
                  assert text.count('site-footer__brand-zone') == 1, route
                  assert text.count('site-footer__watermark') == 1, route
                  assert text.count('site-footer__logo') == 1, route
                  assert '<span>PROAI</span><strong>EXPERT</strong>' in text, route
                  assert '{% include footer-system/' not in text, route
                  assert '{{ footer_' not in text, route
                  assert 'mailto:hello@proai-expert.com' in text, route
                  assert text.count('https://t.me/proAiexpert') >= 2, route
                  assert 'https://github.com/proaiexpert' in text, route
                  assert 'vk.com' not in text.lower(), route
                  assert text.index('site-footer-contact-') < text.index('site-footer__services'), route
                  count += 1
          print('Generated contract passed for', count, 'routes')
          PY

      - name: Run browser QA across all routes and three viewports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p footer-system-unification-qa/screenshots
          python -m http.server 4173 --directory /tmp/footer-unification-head-site >/tmp/footer-head.log 2>&1 &
          HEAD_SERVER=$!
          python -m http.server 4174 --directory /tmp/footer-unification-base-site >/tmp/footer-base.log 2>&1 &
          BASE_SERVER=$!
          trap 'kill $HEAD_SERVER $BASE_SERVER 2>/dev/null || true' EXIT
          sleep 2
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright

          routes = [
              '/', '/ru/', '/about/', '/ru/about/', '/contact/', '/ru/contact/',
              '/ai-systems/', '/ru/ai-systems/', '/websites-branding/', '/ru/websites-branding/',
              '/case-studies/', '/ru/case-studies/',
              '/case-studies/financial-stream/', '/ru/case-studies/financial-stream/',
              '/case-studies/alina-horb/', '/ru/case-studies/alina-horb/',
              '/case-studies/local-repair-pro/', '/ru/case-studies/local-repair-pro/',
              '/insights/', '/ru/insights/',
              '/insights/what-happens-after-a-lead-arrives/', '/ru/insights/chto-proiskhodit-posle-zayavki/',
              '/insights/ai-agent-or-automation-what-your-business-actually-needs/',
              '/insights/ai-ready-website-for-business/',
              '/insights/ai-search-optimization-for-service-businesses/',
              '/insights/does-your-service-business-need-a-multilingual-website/',
              '/insights/how-much-does-a-business-website-cost-in-2026-a-strategic-budget-view/',
              '/insights/how-to-evaluate-a-website-proposal/',
              '/insights/process-clarity-comes-before-scalable-automation/',
              '/insights/website-builder-or-custom-website-what-a-service-business-should-choose/',
              '/insights/what-a-premium-website-really-means-for-a-service-business/',
              '/insights/where-automation-delivers-its-first-real-roi/',
              '/insights/why-service-business-websites-fail-to-convert-high-intent-visitors/',
              '/ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/',
              '/ru/insights/ai-ready-sayt-dlya-biznesa/',
              '/ru/insights/ai-search-optimization-dlya-servisnogo-biznesa/',
              '/ru/insights/arkhitektura-konversii-gde-sayt-teryaet-klienta-eshche-do-pervogo-kontakta/',
              '/ru/insights/arkhitektura-vkhodyashchego-potoka-poryadok-v-zayavkakh/',
              '/ru/insights/chto-znachit-premialnyy-sayt-dlya-servisnogo-biznesa/',
              '/ru/insights/ekonomika-proekta-pochemu-otsenka-po-stranitsam-oshibochna/',
              '/ru/insights/gde-avtomatizatsiya-daet-pervuyu-realnuyu-polzu-biznesu/',
              '/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/',
              '/ru/insights/konstruktor-sayta-ili-sayt-na-zakaz-chto-vybrat-servisnomu-biznesu/',
              '/ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/',
          ]
          viewports = {
              'laptop': {'width': 1440, 'height': 900},
              'portrait': {'width': 390, 'height': 844},
              'landscape': {'width': 844, 'height': 390},
          }
          screenshot_routes = {
              '/', '/ru/', '/about/', '/ru/about/',
              '/case-studies/financial-stream/', '/ru/case-studies/financial-stream/',
              '/insights/', '/ru/insights/',
              '/insights/ai-ready-website-for-business/', '/ru/insights/ai-ready-sayt-dlya-biznesa/',
          }
          expected_socials = {
              'https://www.linkedin.com/in/ihorhorb/',
              'https://github.com/proaiexpert',
              'https://x.com/proaiexpert',
              'https://t.me/proAiexpert',
          }

          def metrics(page, footer=True):
              return page.evaluate('''(footer) => {
                const rect = n => { const r=n.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,right:r.right,bottom:r.bottom,left:r.left}; };
                const header=document.querySelector('[data-global-header], .global-header, header');
                const hs=header ? getComputedStyle(header) : null;
                const out={documentOverflow:document.documentElement.scrollWidth-window.innerWidth,header:header?rect(header):null,headerStyle:hs?{position:hs.position,height:hs.height,paddingLeft:hs.paddingLeft,paddingRight:hs.paddingRight,backgroundColor:hs.backgroundColor,borderBottomWidth:hs.borderBottomWidth}:null};
                if (footer) {
                  const f=document.querySelector('[data-footer-family]');
                  const groups=[...f.querySelectorAll('.site-footer__details > .site-footer__detail-group')];
                  out.footerCount=document.querySelectorAll('[data-footer-family]').length;
                  out.footerOverflow=f.scrollWidth-f.clientWidth;
                  out.main=rect(f.querySelector('.site-footer__main'));
                  out.brand=rect(f.querySelector('.site-footer__brand-zone'));
                  out.bottom=rect(f.querySelector('.site-footer__bottom'));
                  out.family=f.dataset.footerFamily;
                  out.groupCount=groups.length;
                  out.firstGroupMail=groups[0] ? !!groups[0].querySelector('a[href^="mailto:"]') : false;
                  out.secondGroupServices=groups[1] ? groups[1].classList.contains('site-footer__services') : false;
                  out.telegram=[...f.querySelectorAll('a[href="https://t.me/proAiexpert"]')].map(a=>({height:a.getBoundingClientRect().height,text:a.textContent.trim()}));
                  out.socials=[...f.querySelectorAll('.site-footer__socials a')].map(a=>a.getAttribute('href'));
                  out.github=f.querySelectorAll('a[href="https://github.com/proaiexpert"]').length;
                  out.watermark=f.querySelectorAll('.site-footer__watermark').length;
                  out.logo=f.querySelector('.site-footer__logo')?.textContent.replace(/\s+/g,'').trim();
                  out.legacyElements=f.querySelectorAll('.f-backmark,.f-socials,.f-bottom,.f-top').length;
                  out.links=[...f.querySelectorAll('a')].map(a=>({href:a.getAttribute('href'),height:a.getBoundingClientRect().height}));
                }
                return out;
              }''', footer)

          output=Path('footer-system-unification-qa')
          results=[]; failures=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for route in routes:
                  for viewport_name,viewport in viewports.items():
                      context=browser.new_context(viewport=viewport,reduced_motion='reduce')
                      head=context.new_page(); base=context.new_page()
                      rec={'route':route,'viewport':viewport_name}
                      try:
                          head.goto('http://127.0.0.1:4173'+route,wait_until='domcontentloaded')
                          base.goto('http://127.0.0.1:4174'+route,wait_until='domcontentloaded')
                          head.wait_for_timeout(250); base.wait_for_timeout(250)
                          hm=metrics(head,True); bm=metrics(base,False)
                          assert hm['footerCount']==1, hm
                          assert hm['footerOverflow']<=1, hm
                          assert hm['documentOverflow']<=max(1,bm['documentOverflow']+1),(hm,bm)
                          assert hm['main']['bottom']<=hm['brand']['top']+1,hm
                          assert hm['brand']['bottom']<=hm['bottom']['top']+1,hm
                          assert hm['groupCount']==2 and hm['firstGroupMail'] and hm['secondGroupServices'],hm
                          assert len(hm['telegram'])>=2,hm
                          assert set(hm['socials'])==expected_socials,(route,hm['socials'])
                          assert hm['github']>=1 and hm['watermark']==1 and hm['logo']=='PROAIEXPERT',hm
                          assert hm['legacyElements']==0,hm
                          for item in hm['telegram']:
                              assert item['height']>=43.5,item
                          for item in hm['links']:
                              if item['href'] in expected_socials:
                                  assert item['height']>=43.5,item
                          assert hm['header'] is not None and bm['header'] is not None
                          for key in ('x','y','width','height'):
                              assert abs(hm['header'][key]-bm['header'][key])<=1,(route,key,hm,bm)
                          assert hm['headerStyle']==bm['headerStyle'],(route,hm,bm)
                          action=head.locator('.site-footer__primary-action')
                          if action.count():
                              action.first.focus()
                              focus=action.first.evaluate('(n)=>{const s=getComputedStyle(n);return {style:s.outlineStyle,width:s.outlineWidth}}')
                              assert focus['style']!='none' and focus['width']!='0px',focus
                          if route in screenshot_routes:
                              slug=route.strip('/').replace('/','-') or 'home'
                              head.locator('[data-footer-family]').screenshot(path=str(output/'screenshots'/f'{slug}-{viewport_name}.png'))
                          rec.update({'status':'passed','head':hm,'baselineDocumentOverflow':bm['documentOverflow']})
                      except Exception as exc:
                          rec.update({'status':'failed','error':repr(exc)})
                          failures.append(rec)
                      finally:
                          results.append(rec); head.close(); base.close(); context.close()
              browser.close()
          (output/'results.json').write_text(json.dumps(results,indent=2,ensure_ascii=False),encoding='utf-8')
          (output/'summary.json').write_text(json.dumps({'failures':failures,'count':len(results)},indent=2,ensure_ascii=False),encoding='utf-8')
          if failures:
              print(json.dumps(failures[:12],indent=2,ensure_ascii=False))
              raise SystemExit(f'Browser QA failed: {len(failures)} combinations')
          print('Browser QA passed:',len(results),'route/viewport combinations')
          PY

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footer-system-unification-qa
          path: footer-system-unification-qa
          if-no-files-found: error
          retention-days: 14
