name: Golden Assembly R1 Owner Review

on:
  push:
    branches:
      - agent/proai-home-golden-assembly-r1-owner-review

permissions:
  contents: write

concurrency:
  group: golden-assembly-r1-owner-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GOLDEN_DOC_HEAD: 1a9acebef0c6dfee38b0b1c8371b4356d085ecfd
      GOLDEN_PRODUCT_SHA: 6968afc698fc583b4573cf8056476ad984fa52d7
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      EVIDENCE_DIR: docs/site-evolution/review/proai-home-golden-assembly-r1
    steps:
      - name: Checkout review-only branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Golden lock and review-only delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proai-review
          git merge-base --is-ancestor "$GOLDEN_DOC_HEAD" HEAD
          test -z "$(git diff --name-only "$GOLDEN_DOC_HEAD"..HEAD | grep -v '^\.github/workflows/golden-assembly-r1-owner-review.yml$' || true)"
          test -z "$(git diff --name-only "$GOLDEN_PRODUCT_SHA".."$GOLDEN_DOC_HEAD" | grep -v '^docs/site-evolution/PROAI_HOME_GOLDEN_COMPONENT_MANIFEST.md$' || true)"
          test "$(git hash-object assets/js/header-system-v1.js)" = "bb107dd6054ba5210b4f77568e04014cdb239c55"
          test "$(git hash-object assets/css/header-system-v1.css)" = "1e7651d5014b4b7b2e6f3d6a662b5431a7692f71"
          test "$(git hash-object assets/css/homepage-hero-signature-r3.css)" = "5dde833560aac0958875842a598f622942597b74"
          test "$(git hash-object assets/js/proai-hero-cube-r1/bootstrap.js)" = "b46b26164efc000daef8ecb3416039008db7cd79"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "bab6b00e73b20fc2a51aeb00cb7fc08f16129e72"
          test "$(sha256sum assets/models/proai-cube/rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          test "$(git hash-object assets/js/homepage-connected-system-r13.js)" = "8fba38d49366bb69b7e06f9527dd4d07d8d05279"
          test "$(git hash-object assets/css/homepage-connected-system-r13.css)" = "b99dfc19739070fee88d47c94c202d60feab7619"
          test "$(git hash-object _includes/homepage-connected-system-en.html)" = "6bf4b0c236ab9063b7588faf5c59f660f64b71aa"
          test "$(git hash-object _includes/homepage-connected-system-ru.html)" = "92081f9f98f43a9f794d2c5a49b7bce19aafae16"
          test "$(git hash-object assets/css/homepage-two-worlds-r22.css)" = "63e9d73d4ecad2c339ac42a61b0cdf39663894b2"
          test "$(git hash-object assets/js/homepage-two-worlds-r22.js)" = "1983ba4bef7816501a7605293a95b828d3748b06"
          printf 'REVIEW_WORKFLOW_HEAD=%s\nGOLDEN_DOC_HEAD=%s\nGOLDEN_PRODUCT_SHA=%s\n' "$(git rev-parse HEAD)" "$GOLDEN_DOC_HEAD" "$GOLDEN_PRODUCT_SHA" > /tmp/proai-review/identity.txt

      - name: Build with normal repository Jekyll path
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          test -s _site/index.html
          test -s _site/ru/index.html
          mkdir -p _site/__review
          cp /tmp/proai-review/identity.txt _site/__review/identity.txt

      - name: Start exact built site locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4000 --bind 127.0.0.1 --directory _site >/tmp/proai-review/http.log 2>&1 &
          echo $! >/tmp/proai-review/http.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4000/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4000/ru/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/proai-review/http.log
          exit 1

      - name: Install Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p /tmp/proai-review/node
          cd /tmp/proai-review/node
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.16.0 >/dev/null

      - name: Create runtime-only browser harness
        shell: bash
        run: |
          cat > /tmp/proai-review/node/review.cjs <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          const base=process.argv[2].replace(/\/$/,'');
          const mode=process.argv[3];
          const output=process.argv[4];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fatal=[];
          const consoleErrors=[];
          const vps=[[1440,900],[1366,768],[1024,768],[430,932],[390,844]];

          function errors(page,label){
            page.on('pageerror',e=>fatal.push(`${label}: pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error'){const t=`${label}: console: ${m.text()}`;consoleErrors.push(t);if(/GLB load failed|initialization failed|Uncaught|TypeError|ReferenceError|SyntaxError/i.test(t))fatal.push(t);}});
            page.on('requestfailed',r=>{if(/\.(js|css|glb)(\?|$)/i.test(r.url()))fatal.push(`${label}: requestfailed: ${r.url()} ${r.failure()?.errorText||''}`);});
          }
          async function browser(){return puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-gpu-blocklist','--enable-webgl','--enable-unsafe-swiftshader','--use-angle=swiftshader']});}
          async function cubeReady(page){await page.waitForFunction(()=>document.querySelector('.proai-hero-object-slot[data-proai-hero-object]')?.dataset.cubeMounted==='true'&&window.__PROAI_HERO_CUBE_R1?.runtime?.ready===true,{timeout:25000});}
          async function goto(page,route,w=1440,h=900,label='page'){
            errors(page,label);await page.setViewport({width:w,height:h,deviceScaleFactor:1});await page.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'no-preference'}]);await page.goto(base+route,{waitUntil:'networkidle0',timeout:45000});await cubeReady(page);
          }
          async function state(page){return page.evaluate(()=>{
            const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>4&&r.height>4&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0;};
            const runtime=window.__PROAI_HERO_CUBE_R1;
            return {header:vis(document.querySelector('[data-site-header]')),hero:vis(document.querySelector('#hero')),cube:vis(document.querySelector('#cube-canvas')),connected:vis(document.querySelector('[data-connected-system]')),twoWorlds:vis(document.querySelector('[data-tw-r2]')),cubeReady:runtime?.runtime?.ready===true,cubeGlb:runtime?.glbSha256||null,semantic:Boolean(window.__PROAI_SEMANTIC_CUBE||window.__PROAI_CUBE_SEMANTIC_R1),overflow:document.documentElement.scrollWidth>innerWidth+2,counts:{header:document.querySelectorAll('[data-site-header]').length,cube:document.querySelectorAll('#cube-canvas').length,connected:document.querySelectorAll('[data-connected-system]').length,connectedScript:[...document.scripts].filter(s=>/\/assets\/js\/homepage-connected-system-r13\.js(?:\?|$)/.test(s.src)).length,twoWorlds:document.querySelectorAll('[data-tw-r2]').length}};
          });}
          async function responsive(b){const out={};for(const route of ['/','/ru/']){out[route]=[];for(const [w,h] of vps){const p=await b.newPage();await goto(p,route,w,h,`responsive:${route}:${w}x${h}`);out[route].push({w,h,...await state(p)});await p.close();}}return out;}
          async function headerAutoHide(b){const p=await b.newPage();await goto(p,'/',390,844,'header-auto-hide');await p.evaluate(()=>scrollTo(0,250));await sleep(420);const hidden=await p.$eval('[data-site-header]',e=>e.classList.contains('header-hidden'));await p.evaluate(()=>scrollBy(0,-90));await sleep(420);const shown=await p.$eval('[data-site-header]',e=>!e.classList.contains('header-hidden'));await p.close();return{hiddenOnDown:hidden,revealedOnUp:shown,pass:hidden&&shown};}
          async function cubeMotion(b){const p=await b.newPage();await goto(p,'/',1440,900,'cube-motion');const start=await p.evaluate(()=>window.__PROAI_HERO_CUBE_R1.runtime.getDiagnostics());const seen=new Map();let pair=null,negative=null,pitchRoll=null,moving=false;const until=Date.now()+46000;while(Date.now()<until){const x=await p.evaluate(()=>{const r=window.__PROAI_HERO_CUBE_R1.runtime,d=r.getDiagnostics(),q=r.getReviewPresentationSample(d.presentation.simTimeMs/1000);return{d,q,t:performance.now()};});if(x.d.presentation.cumulativeYawDeg-start.presentation.cumulativeYawDeg>1)moving=true;if(!pitchRoll&&Math.abs(x.q.pitchDeg)>.8&&Math.abs(x.q.rollDeg)>.08)pitchRoll=x.q;if(!negative&&x.d.presentation.yawVelocityDegPerSec<-1)negative={simTimeMs:x.d.presentation.simTimeMs,velocityDegPerSec:x.d.presentation.yawVelocityDegPerSec,signedYawDeg:x.d.presentation.signedYawDeg};for(const t of x.d.activeTurns)if(!seen.has(t.id))seen.set(t.id,x.t);if(!pair&&x.d.activeTurns.length===2){const[a,c]=x.d.activeTurns;if(a.axis===c.axis&&a.layer!==c.layer)pair={axis:a.axis,layers:[a.layer,c.layer],staggerMs:Math.abs((seen.get(c.id)||x.t)-(seen.get(a.id)||x.t)),turns:[a.id,c.id]};}if(moving&&negative&&pitchRoll&&pair)break;await sleep(25);}await p.screenshot({path:'_site/__review/screenshot-1-desktop-hero-en.png'});const end=await p.evaluate(()=>window.__PROAI_HERO_CUBE_R1.runtime.getDiagnostics());await p.close();return{moving,signedYawObserved:!!negative,negative,pitchRollObserved:!!pitchRoll,pitchRoll,pairedStaggerObserved:!!pair,pair,startYaw:start.presentation.cumulativeYawDeg,endYaw:end.presentation.cumulativeYawDeg};}
          async function connectedTiming(b){const p=await b.newPage();await goto(p,'/',1440,900,'connected-timing');await p.evaluate(()=>{const sec=document.querySelector('[data-connected-system]'),st=[...sec.querySelectorAll('[data-system-stage]')];window.__ct={start:performance.now(),active:[],seen:{}};st.forEach((e,i)=>new MutationObserver(()=>{if(e.classList.contains('is-active')&&!window.__ct.seen[i]){window.__ct.seen[i]=1;window.__ct.active.push({i,t:performance.now()});}}).observe(e,{attributes:true,attributeFilter:['class']}));sec.scrollIntoView({block:'center'});});await p.waitForFunction(()=>window.__ct?.active.length===4,{timeout:13000});const r=await p.evaluate(()=>{const a=window.__ct.active.map(x=>x.t-window.__ct.start);return{activeMs:a,firstActiveMs:a[0],gaps:a.slice(1).map((x,i)=>x-a[i])};});r.pass=Math.abs(r.firstActiveMs-760)<=130&&r.gaps.every(x=>Math.abs(x-1900)<=90);await p.close();return r;}
          async function ruRhythm(b){const p=await b.newPage();await goto(p,'/ru/',1440,900,'ru-rhythm');await p.evaluate(()=>document.querySelector('[data-connected-system]').scrollIntoView({block:'center'}));await sleep(7600);const r=await p.evaluate(()=>{const m=[...document.querySelectorAll('[data-connected-system] [data-system-stage]')].map(e=>{const s=e.getBoundingClientRect(),c=e.querySelector('.cs-components').getBoundingClientRect();return{h:s.height,componentsTop:c.top-s.top,client:e.clientHeight,scroll:e.scrollHeight};});const spread=k=>Math.max(...m.map(x=>x[k]))-Math.min(...m.map(x=>x[k]));return{metrics:m,heightSpread:spread('h'),componentsTopSpread:spread('componentsTop'),noClip:m.every(x=>x.scroll<=x.client+2)};});r.pass=r.noClip&&r.heightSpread<=3&&r.componentsTopSpread<=6;await p.screenshot({path:'_site/__review/screenshot-2-desktop-connected-ru.png'});await p.close();return r;}
          async function mobileShot(b){const p=await b.newPage();await goto(p,'/',390,844,'mobile-shot');await p.screenshot({path:'_site/__review/screenshot-3-mobile-home-en.png'});await p.close();}
          async function publicRoute(b,route){const p=await b.newPage();await goto(p,route,1440,900,`public:${route}`);const top=await state(p);await p.evaluate(()=>document.querySelector('[data-connected-system]').scrollIntoView({block:'center'}));await sleep(350);const connectedInView=await p.evaluate(()=>{const r=document.querySelector('[data-connected-system]').getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;});await p.evaluate(()=>document.querySelector('[data-tw-r2]').scrollIntoView({block:'center'}));await sleep(350);const twInView=await p.evaluate(()=>{const r=document.querySelector('[data-tw-r2]').getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;});await p.close();return{...top,connectedInView,twInView};}

          (async()=>{const b=await browser(),r={mode,base,consoleErrors,fatalErrors:fatal};try{if(mode==='local'){r.responsive=await responsive(b);r.headerAutoHide=await headerAutoHide(b);r.cube=await cubeMotion(b);r.connected=await connectedTiming(b);r.ruRhythm=await ruRhythm(b);await mobileShot(b);const all=[...r.responsive['/'],...r.responsive['/ru/']],ok=x=>x.header&&x.hero&&x.cube&&x.connected&&x.twoWorlds&&x.cubeReady&&!x.semantic&&!x.overflow&&x.cubeGlb==='DBB7FC4156F8C9ED2481DD76443DFFB9A45ECB5493463F99BFFB34DD3B59C79B';r.localENPass=r.responsive['/'].every(ok);r.localRUPass=r.responsive['/ru/'].every(ok);r.duplicates={header:Math.max(...all.map(x=>x.counts.header)),cube:Math.max(...all.map(x=>x.counts.cube)),connected:Math.max(...all.map(x=>x.counts.connected)),connectedScript:Math.max(...all.map(x=>x.counts.connectedScript)),twoWorlds:Math.max(...all.map(x=>x.counts.twoWorlds))};r.pass=r.localENPass&&r.localRUPass&&r.headerAutoHide.pass&&r.cube.moving&&r.cube.signedYawObserved&&r.cube.pitchRollObserved&&r.cube.pairedStaggerObserved&&r.connected.pass&&r.ruRhythm.pass&&Object.values(r.duplicates).every(x=>x===1)&&fatal.length===0;}else{r.en=await publicRoute(b,'/');r.ru=await publicRoute(b,'/ru/');const ok=x=>x.header&&x.hero&&x.cube&&x.connected&&x.twoWorlds&&x.cubeReady&&!x.semantic&&x.connectedInView&&x.twInView;r.enPass=ok(r.en);r.ruPass=ok(r.ru);r.pass=r.enPass&&r.ruPass&&fatal.length===0;}}finally{await b.close();fs.writeFileSync(output,JSON.stringify(r,null,2));}if(!r.pass)process.exit(2);})().catch(e=>{fatal.push(`harness: ${e.stack||e}`);fs.writeFileSync(output,JSON.stringify({mode,base,consoleErrors,fatalErrors:fatal,pass:false},null,2));process.exit(3);});
          NODE

      - name: Local Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/proai-review/node/review.cjs http://127.0.0.1:4000 local _site/__review/local-result.json

      - name: Publish exact built site through TryCloudflare
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/proai-review/cloudflared
          chmod +x /tmp/proai-review/cloudflared
          /tmp/proai-review/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4000 >/tmp/proai-review/cloudflared.log 2>&1 &
          echo $! >/tmp/proai-review/cloudflared.pid
          PUBLIC_BASE=""
          for i in $(seq 1 60); do
            PUBLIC_BASE="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/proai-review/cloudflared.log | head -1 || true)"
            [ -n "$PUBLIC_BASE" ] && curl -fsS "$PUBLIC_BASE/" >/dev/null 2>&1 && curl -fsS "$PUBLIC_BASE/ru/" >/dev/null 2>&1 && break
            sleep 1
          done
          test -n "$PUBLIC_BASE"
          curl -fsS "$PUBLIC_BASE/" >/dev/null
          curl -fsS "$PUBLIC_BASE/ru/" >/dev/null
          echo "PUBLIC_BASE=$PUBLIC_BASE" >> "$GITHUB_ENV"
          printf '%s\n' "$PUBLIC_BASE" > _site/__review/public-base.txt

      - name: Public Chromium URL gate
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/proai-review/node/review.cjs "$PUBLIC_BASE" public _site/__review/public-result.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          local=json.loads(Path('_site/__review/local-result.json').read_text())
          public=json.loads(Path('_site/__review/public-result.json').read_text())
          result={'publicBase':os.environ['PUBLIC_BASE'],'local':local,'public':public,'screenshots':{
            'screenshot1':os.environ['PUBLIC_BASE']+'/__review/screenshot-1-desktop-hero-en.png',
            'screenshot2':os.environ['PUBLIC_BASE']+'/__review/screenshot-2-desktop-connected-ru.png',
            'screenshot3':os.environ['PUBLIC_BASE']+'/__review/screenshot-3-mobile-home-en.png'}}
          Path('_site/__review/review-result.json').write_text(json.dumps(result,indent=2))
          PY

      - name: Record review evidence on review-only branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp _site/__review/review-result.json "$EVIDENCE_DIR/review-result.json"
          cp _site/__review/public-base.txt "$EVIDENCE_DIR/public-base.txt"
          cp _site/__review/screenshot-1-desktop-hero-en.png "$EVIDENCE_DIR/screenshot-1-desktop-hero-en.png"
          cp _site/__review/screenshot-2-desktop-connected-ru.png "$EVIDENCE_DIR/screenshot-2-desktop-connected-ru.png"
          cp _site/__review/screenshot-3-mobile-home-en.png "$EVIDENCE_DIR/screenshot-3-mobile-home-en.png"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE_DIR"
          git commit -m "review: record Golden Assembly R1 owner evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git rev-parse HEAD > /tmp/proai-review/evidence-commit.txt

      - name: Upload review evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-assembly-r1-owner-review-evidence
          path: |
            _site/__review/
            /tmp/proai-review/cloudflared.log
          if-no-files-found: error

      - name: Hold temporary owner review endpoint
        shell: bash
        run: sleep 7200
