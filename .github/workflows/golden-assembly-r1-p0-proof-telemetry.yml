name: Golden Assembly R1 P0 Proof Telemetry

on:
  push:
    branches:
      - agent/proai-home-golden-assembly-r1-p0-local-proof

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve proof run and publish status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROOF_HEAD: 95a46d9db78c4da823f7e7c8db15aff198a34c43
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          api=os.environ['GITHUB_API_URL']; repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          proof_head=os.environ['PROOF_HEAD']; current=os.environ['GITHUB_SHA']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def post(url,data):
              req=urllib.request.Request(url,data=json.dumps(data).encode(),headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          run=None
          for _ in range(60):
              runs=get(f'{api}/repos/{repo}/actions/runs?head_sha={proof_head}&per_page=20').get('workflow_runs',[])
              candidates=[r for r in runs if r.get('path')=='.github/workflows/golden-assembly-r1-p0-local-proof.yml']
              if candidates:
                  run=sorted(candidates,key=lambda r:r.get('created_at',''))[-1]
                  if run.get('status')=='completed':break
              time.sleep(10)
          if not run: raise SystemExit('proof run not found')
          artifacts=get(f"{api}/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts',[])
          art=next((a for a in artifacts if a.get('name')=='proai-home-golden-assembly-r1-wiring-proof'),None)
          state='success' if run.get('conclusion')=='success' and art else 'failure'
          desc=f"proof run {run['id']} conclusion={run.get('conclusion')} artifact={art.get('id') if art else 'NONE'}"
          target=run.get('html_url') or f"https://github.com/{repo}/actions/runs/{run['id']}"
          post(f'{api}/repos/{repo}/statuses/{current}',{'state':state,'context':'proai/p0-wiring-proof','description':desc[:140],'target_url':target})
          print(json.dumps({'run_id':run['id'],'status':run.get('status'),'conclusion':run.get('conclusion'),'artifact_id':art.get('id') if art else None,'artifact_name':art.get('name') if art else None},indent=2))
          if state!='success': raise SystemExit(2)
          PY
