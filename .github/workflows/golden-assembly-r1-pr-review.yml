name: Golden Assembly R1.2 Exact Recovery Browser Review

on:
  pull_request:
    branches:
      - review/proai-home-golden-assembly-r1-ci-base

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'agent/proai-home-golden-assembly-r1-2-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout R1.2 recovery head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run traced exact-recovery final review
        shell: bash
        run: bash docs/site-evolution/reviews/proai-home-golden-assembly-r1-2/run-final-review-v2.sh

      - name: Upload final or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proai-home-golden-r1-2-pr-review-${{ github.sha }}
          path: |
            docs/site-evolution/reviews/proai-home-golden-assembly-r1-2
            docs/site-evolution/PROAI_HOME_GOLDEN_ASSEMBLY_R1_MANIFEST.md
          if-no-files-found: warn
          retention-days: 30
