name: Golden Assembly R1 PR Browser Review

on:
  pull_request:
    branches:
      - review/proai-home-golden-assembly-r1-ci-base

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Golden head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Build Jekyll site
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Verify generated Golden structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for route in ('index.html','ru/index.html'):
              text=(Path('_site')/route).read_text(encoding='utf-8')
              head=text.split('</head>',1)[0]
              assert text.count('data-connected-system') == 1, route
              assert text.count('data-tw-golden-r1') == 1, route
              assert 'data-tw-tech-r2' not in text, route
              assert 'id="core-split"' not in text, route
              assert 'id="section-trigger"' not in text, route
              assert 'data-fs-showcase-r11' not in text, route
              assert text.count('data-home-tech-r2') == 1, route
              assert text.count('data-footer-watermark-r2') >= 1, route
              assert 'homepage-two-worlds-r2.js' not in text, route
              assert 'homepage-two-worlds-r21.js' not in text, route
              assert 'homepage-two-worlds-r22.js' not in text, route
              assert 'bootstrap-golden-r1.js' in text, route
              assert 'body { background-color: var(--bg); color: white; font-family: var(--font); overflow-x: hidden; }' not in head, route
              assert 'html, body { overflow-x: clip !important; }' not in head, route
          print('Generated Golden structure: PASS')
          PY

      - name: Install browser runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start generated Golden site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/golden-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/golden-http.log
          exit 1

      - name: Browser QA and screenshots
        id: qa
        continue-on-error: true
        shell: bash
        run: node docs/site-evolution/reviews/proai-home-golden-assembly-r1/run-qa.mjs

      - name: Generate immutable Owner review files
        if: always()
        shell: bash
        run: python docs/site-evolution/reviews/proai-home-golden-assembly-r1/generate-owner-review.py

      - name: Verify generated Owner review harness
        id: live_review
        continue-on-error: true
        if: always()
        shell: bash
        run: |
          python3 -m http.server 4174 --directory . >/tmp/golden-review-http.log 2>&1 &
          sleep 1
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const result={generatedAt:new Date().toISOString(),en:false,ru:false,cube:false,errors:[]};
          for(const lang of ['en','ru']){
            const context=await browser.newContext({viewport:{width:1366,height:768}});
            const page=await context.newPage();
            page.on('pageerror',e=>result.errors.push(String(e)));
            await page.goto(`http://127.0.0.1:4174/docs/site-evolution/reviews/proai-home-golden-assembly-r1/index.html?lang=${lang}`,{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>document.querySelectorAll('[data-connected-system]').length===1&&document.querySelectorAll('[data-home-tech-r2]').length===1,{timeout:20000});
            result[lang]=true;
            if(lang==='en'){
              try{
                await page.waitForFunction(()=>document.querySelector('.proai-hero-object-slot')?.dataset.cubeMounted==='true',{timeout:20000});
                result.cube=true;
              }catch{}
            }
            await context.close();
          }
          await browser.close();
          result.pass=result.en&&result.ru&&result.cube;
          fs.writeFileSync('docs/site-evolution/reviews/proai-home-golden-assembly-r1/live-review-check.json',JSON.stringify(result,null,2));
          if(!result.pass)process.exit(1);
          JS

      - name: Commit review evidence to isolated product branch
        if: always()
        shell: bash
        run: |
          git config user.name "proai-golden-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/site-evolution/reviews/proai-home-golden-assembly-r1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "review: add Golden Assembly R1 browser evidence [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Enforce review gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.qa.outcome }}" = "success"
          test "${{ steps.live_review.outcome }}" = "success"
