name: Golden Assembly R1.2 Final Authority Browser Review

on:
  pull_request:
    branches:
      - review/proai-home-golden-assembly-r1-ci-base

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'qa/proai-home-golden-r1-2-final-owner-correction'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout R1.2 final-authority QA head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Golden R1.2 final-authority browser review
        shell: bash
        run: bash docs/site-evolution/reviews/proai-home-golden-assembly-r1-2/run-final-authority-review.sh

      - name: Upload final or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proai-home-golden-r1-2-final-authority-${{ github.sha }}
          path: |
            docs/site-evolution/reviews/proai-home-golden-assembly-r1-2
          if-no-files-found: warn
          retention-days: 30
