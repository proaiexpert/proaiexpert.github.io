name: Patch isolated Hybrid Core responsive overflow

on:
  push:
    branches:
      - agent/hero-hybrid-connected-core-prototype-r1
    paths:
      - .github/workflows/hero-hybrid-core-patch-overflow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-isolated-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated prototype branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hero-hybrid-connected-core-prototype-r1

      - name: Patch responsive overflow and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hero-hybrid-connected-core-preview/index.html')
          text = p.read_text()
          old = '.hybrid-preview::after{left:16%;top:48%;width:90vw;height:50vh;min-width:0;min-height:0}'
          new = '.hybrid-preview::after{left:5%;top:48%;width:90%;height:50vh;min-width:0;min-height:0}'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          elif new not in text:
              raise SystemExit('Expected isolated mobile glow rule not found')

          landscape = '.hybrid-hero{display:grid;min-height:100svh;grid-template-columns:minmax(0,46fr) minmax(0,54fr);'
          if landscape not in text:
              raise SystemExit('Short-landscape grid override is missing')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-hybrid-connected-core-preview/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix isolated Hybrid Core responsive overflow"
            git push origin HEAD:agent/hero-hybrid-connected-core-prototype-r1
          fi
