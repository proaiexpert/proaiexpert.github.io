name: Hero Layered 2.5D Static R1 owner review

on:
  push:
    branches:
      - agent/hero-layered-25d-static-r1
    paths:
      - .github/hero-layered-25d-r1-run.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  render-layered-static-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hero-layered-25d-static-r1

      - name: Guard production homepage routes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if git diff --name-only origin/main...HEAD | grep -Eq '^(index\.html|ru/index\.html)$'; then
            echo 'Production homepage route changed — forbidden in owner-review branch.' >&2
            exit 1
          fi

      - name: Download exact recovered R4.6 owner-review artifact
        uses: actions/download-artifact@v4
        with:
          name: PROAI_HERO_RECOVERY_OWNER_REVIEW
          path: recovery-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: proaiexpert/proaiexpert.github.io
          run-id: 31351101048

      - name: Validate immutable recovery input
        shell: bash
        run: |
          set -euo pipefail
          test -s recovery-artifact/R46_DESKTOP_STATIC.png
          python3 - <<'PY'
          import hashlib, struct
          from pathlib import Path
          p=Path('recovery-artifact/R46_DESKTOP_STATIC.png')
          b=p.read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('Recovery input is not PNG')
          if struct.unpack('>II', b[16:24]) != (1440,900): raise SystemExit('Recovery input is not 1440x900')
          digest=hashlib.sha256(b).hexdigest()
          expected='98529b39fb4e951638379431f1a746b1a3d89e6b6d69e10ff2f1b53e8e80f315'
          if digest != expected: raise SystemExit(f'Recovery SHA mismatch: {digest}')
          print('Recovery input validated:', digest)
          PY

      - name: Setup deterministic raster dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fontconfig
          python3 -m pip install --disable-pip-version-check --quiet \
            pillow==12.3.0 numpy opencv-python-headless==4.13.0.92

      - name: Generate registered layered R1 scene
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/proai-hero-layered-r1
          python3 tools/hero_layered_25d_static_r1.py \
            recovery-artifact/R46_DESKTOP_STATIC.png \
            /tmp/proai-hero-layered-r1
          rm -rf assets/hero-layered-25d-r1
          mkdir -p assets/hero-layered-25d-r1 docs/site-evolution/review-artifacts
          cp -a /tmp/proai-hero-layered-r1/assets/hero-layered-25d-r1/. assets/hero-layered-25d-r1/
          cp /tmp/proai-hero-layered-r1/qa.json assets/hero-layered-25d-r1/qa.json
          cp /tmp/proai-hero-layered-r1/PROAI_HERO_LAYERED_25D_STATIC_R1.png \
            docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R1.png

      - name: Record deterministic scene manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('assets/hero-layered-25d-r1')
          files={}
          for p in sorted(root.glob('*')):
              if p.is_file() and p.name != 'manifest.json':
                  b=p.read_bytes()
                  files[p.name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          manifest={
              'status':'PENDING OWNER REVIEW',
              'source_branch':'agent/hero-recovery-approved-composition-owner-look',
              'recovery_handoff_commit':'3067fa02631de98d98d9b6bc8a1d0ea880ad5a41',
              'recovered_visual_checkpoint':'8bab1bbddbaadf70d88fd72c77e08d2d0ac77429',
              'recovery_artifact':{
                  'run_id':31351101048,
                  'name':'PROAI_HERO_RECOVERY_OWNER_REVIEW',
                  'file':'R46_DESKTOP_STATIC.png',
                  'sha256':'98529b39fb4e951638379431f1a746b1a3d89e6b6d69e10ff2f1b53e8e80f315'
              },
              'registration':{'canvas':[1440,900],'right_field_x':695,'header_height':87,'core_scale':0.955},
              'segmentation':'explicit registered polygon masks; no luminance/content-alpha material reconstruction',
              'occlusion':'external_output_impulses are composited below front_metal_shell; foreground_occlusion_mask retained',
              'depth_map':'depth_map.png',
              'neutral_renderer':'/assets/js/hero-layered-25d-r1.js',
              'preview_route':'/hero-layered-25d-static-preview/',
              'motion_implemented':False,
              'files':files,
          }
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Automated R1 QA gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p=Path('docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R1.png')
          b=p.read_bytes()[:24]
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('Candidate is not PNG')
          if struct.unpack('>II', b[16:24]) != (1440,900): raise SystemExit('Candidate is not 1440x900')
          qa=json.loads(Path('assets/hero-layered-25d-r1/qa.json').read_text())
          assert qa['linear_scale_reduction_percent'] == 4.5
          assert qa['rail_pitch_px'] == 70
          assert qa['rail_rows_y'] == [400,470,540,610]
          assert qa['rail_labels'] == ['01 TRUST','02 INQUIRY','03 RESPONSE','04 RESULT']
          assert qa['header_pixel_lock'] is True
          assert qa['left_copy_cta_pixel_lock'] is True
          assert qa['production_files_touched'] is False
          assert qa['motion_implemented'] is False
          assert 'no luminance/content-alpha material key' in qa['segmentation_method']
          assert 'below explicit front_metal_shell' in qa['occlusion_method']
          expected={
            'rear_atmosphere.png','rear_body_graphite.png','internal_chamber_depth.png',
            'internal_cyan_volume.png','collector_emitter_zone.png','front_metal_shell.png',
            'foreground_occlusion_mask.png','contact_shadow_floor_response.png',
            'external_output_impulses.png','rail_ui.png','depth_map.png'
          }
          assert expected.issubset({x.name for x in Path('assets/hero-layered-25d-r1').glob('*.png')})
          print('Layered R1 deterministic QA: PASS')
          PY
          if grep -Eq 'requestAnimationFrame|pointermove|mousemove|touchmove' assets/js/hero-layered-25d-r1.js; then
            echo 'Motion/pointer implementation detected — forbidden in static R1.' >&2
            exit 1
          fi
          COUNT="$(find docs/site-evolution/review-artifacts -maxdepth 1 -type f -name 'PROAI_HERO_LAYERED_25D_STATIC_R1*.png' | wc -l | tr -d ' ')"
          test "$COUNT" = "1"
          git fetch origin main --quiet
          if git diff --name-only origin/main...HEAD | grep -Eq '^(index\.html|ru/index\.html)$'; then
            echo 'Production homepage route changed — forbidden.' >&2
            exit 1
          fi

      - name: Commit exact R1 candidate and registered scene assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/hero-layered-25d-r1 \
            docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R1.png
          if git diff --cached --quiet; then
            CANDIDATE_COMMIT="$(git rev-parse HEAD)"
          else
            git commit -m "Save Hero Layered 2.5D Static R1 candidate"
            CANDIDATE_COMMIT="$(git rev-parse HEAD)"
            git push origin HEAD:agent/hero-layered-25d-static-r1
          fi
          printf '%s\n' "$CANDIDATE_COMMIT" > /tmp/proai-hero-r1-candidate-commit.txt

      - name: Record PENDING OWNER REVIEW status
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_COMMIT="$(cat /tmp/proai-hero-r1-candidate-commit.txt)"
          PNG_PATH='docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R1.png'
          PNG_SHA256="$(sha256sum "$PNG_PATH" | awk '{print $1}')"
          INDEX_BLOB="$(git hash-object index.html)"
          RU_INDEX_BLOB="$(git hash-object ru/index.html)"
          cat > docs/site-evolution/PROAI_HERO_LAYERED_25D_STATIC_R1_STATUS.md <<EOF
          # ProAI Expert Hero — Layered 2.5D Static R1 — Status

          Date: 2026-08-10  
          Working branch: \`agent/hero-layered-25d-static-r1\`  
          Status: **PENDING OWNER REVIEW**

          ## Canonical recovery source

          - Frozen recovered composition branch: \`agent/hero-recovery-approved-composition-owner-look\`
          - Recovery handoff commit: \`3067fa02631de98d98d9b6bc8a1d0ea880ad5a41\`
          - Underlying recovered visual checkpoint: \`8bab1bbddbaadf70d88fd72c77e08d2d0ac77429\`
          - Recovery workflow run: \`31351101048\`
          - Recovery artifact: \`PROAI_HERO_RECOVERY_OWNER_REVIEW / R46_DESKTOP_STATIC.png\`
          - Recovery PNG SHA-256: \`98529b39fb4e951638379431f1a746b1a3d89e6b6d69e10ff2f1b53e8e80f315\`

          ## R1 owner-review result

          - Candidate: \`${PNG_PATH}\`
          - Candidate commit SHA: \`${CANDIDATE_COMMIT}\`
          - Candidate PNG SHA-256: \`${PNG_SHA256}\`
          - Dimensions: \`1440 × 900\`
          - Core scale: \`95.5%\` of recovered registration (\`4.5%\` linear reduction)
          - Preview route: \`/hero-layered-25d-static-preview/\`
          - Deterministic generator: \`tools/hero_layered_25d_static_r1.py\`
          - Neutral WebGL2 compositor: \`assets/js/hero-layered-25d-r1.js\`
          - Isolated preview CSS: \`assets/css/hero-layered-25d-r1.css\`

          ## Registered scene assets

          - \`assets/hero-layered-25d-r1/rear_atmosphere.png\`
          - \`assets/hero-layered-25d-r1/rear_body_graphite.png\`
          - \`assets/hero-layered-25d-r1/internal_chamber_depth.png\`
          - \`assets/hero-layered-25d-r1/internal_cyan_volume.png\`
          - \`assets/hero-layered-25d-r1/collector_emitter_zone.png\`
          - \`assets/hero-layered-25d-r1/front_metal_shell.png\`
          - \`assets/hero-layered-25d-r1/foreground_occlusion_mask.png\`
          - \`assets/hero-layered-25d-r1/contact_shadow_floor_response.png\`
          - \`assets/hero-layered-25d-r1/external_output_impulses.png\`
          - \`assets/hero-layered-25d-r1/rail_ui.png\`
          - \`assets/hero-layered-25d-r1/depth_map.png\`
          - QA: \`assets/hero-layered-25d-r1/qa.json\`
          - Manifest/hashes: \`assets/hero-layered-25d-r1/manifest.json\`

          ## Method / QA summary

          - The approved C-shape geometry/perspective/silhouette and two-column Hero concept were not redesigned.
          - Header and complete left H1/copy/CTA field are pixel-locked to the recovered \`1440 × 900\` source frame.
          - Material separation uses explicit registered spatial masks; no luminance/content-alpha material reconstruction is used.
          - External impulses are rendered below the explicit \`front_metal_shell\`; the retained foreground occlusion mask prevents traces from reading as lines painted across solid metal.
          - Internal chamber, cyan volume, collector/emitter and front shell are separate registered depth layers; depth support is retained in \`depth_map.png\`.
          - Rail is one calm four-row system at fixed \`70 px\` pitch: \`01 TRUST / 02 INQUIRY / 03 RESPONSE / 04 RESULT\`.
          - One owner-review R1 PNG only: PASS.
          - Candidate dimensions \`1440 × 900\`: PASS.
          - Header pixel-lock: PASS.
          - Left H1/copy/CTA pixel-lock: PASS.
          - Output-to-row registration: PASS.
          - Static-only implementation: PASS; no animation loop, pointer/touch motion, parallax, tilt, particles or motion timeline.
          - Deterministic full-frame and enlarged-crop visual preflight was performed before repository execution; automated GitHub QA passed. Final visual approval remains exclusively with the owner.

          ## Production safety

          - \`/index.html\` blob at R1 execution: \`${INDEX_BLOB}\`
          - \`/ru/index.html\` blob at R1 execution: \`${RU_INDEX_BLOB}\`
          - Production Homepage routes were not modified by this R1 pass.
          - No merge performed.
          - No deploy performed.
          - No production PR opened.
          - Motion not started.

          **PENDING OWNER REVIEW**
          EOF
          git add docs/site-evolution/PROAI_HERO_LAYERED_25D_STATIC_R1_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Document Hero Layered 2.5D Static R1 status"
            git push origin HEAD:agent/hero-layered-25d-static-r1
          fi
