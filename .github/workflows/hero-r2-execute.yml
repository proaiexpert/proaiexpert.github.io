name: Execute final Hero R2
on:
  push:
    branches: [agent/hero-layered-25d-static-r1]
    paths: [.github/workflows/hero-r2-execute.yml]
permissions:
  contents: write
jobs:
  r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hero-layered-25d-static-r1
          fetch-depth: 0
      - run: python3 -m pip install --quiet pillow==12.3.0 numpy opencv-python-headless==4.13.0.92
      - name: Build R2 from exact R1
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R1.png|awk '{print $1}')" = "28d1885ff2350562434e5a4bf50cbc787a7ffee5e29635780cf2ce96560ff622"
          test "$(git hash-object index.html)" = "3d44bd2f6f0f09bf9c45ba661ccffd2ac6183aa4"
          test "$(git hash-object ru/index.html)" = "4d703c149b626dab3a3db13b3566c9d0cb28d374"
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np, cv2, hashlib
          from PIL import Image,ImageDraw,ImageFilter
          W,H=1440,900; yy,xx=np.mgrid[0:H,0:W]
          r1p=Path('docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R1.png')
          r1=Image.open(r1p).convert('RGB'); orig=np.array(r1); src=orig.astype(np.float32)
          A=Path('assets/hero-layered-25d-r1')
          def a(n): return np.array(Image.open(A/n).convert('RGBA'))[:,:,3].astype(np.float32)/255
          rear,chamber,front,collector,outputs,rail=[a(n) for n in ['rear_body_graphite.png','internal_chamber_depth.png','front_metal_shell.png','collector_emitter_zone.png','external_output_impulses.png','rail_ui.png']]
          obj=np.maximum.reduce([rear,chamber,front,collector]); ui=np.maximum(outputs,rail)>0.03
          protected=np.maximum(obj,ui.astype(np.float32))
          base=np.array([3.7,4.7,5.35],np.float32); field=np.zeros((H,W,3),np.float32)+base
          def rad(cx,cy,sx,sy,c,k):
            g=np.exp(-(((xx-cx)/sx)**2+((yy-cy)/sy)**2)*2)[...,None]; return g*np.array(c,np.float32)*k
          field+=rad(1015,500,520,390,[7,21,25],.41)+rad(1140,735,540,225,[5,14,17],.27)+rad(1160,255,410,225,[4,11,14],.20)+rad(1090,305,320,245,[6,4,2],.045)
          t=np.clip((xx-565)/350,0,1); t=t*t*(3-2*t); target=base[None,None,:]*(1-t[...,None])+field*t[...,None]
          amount=(np.clip((xx-575)/245,0,1)**1.18)*(1-protected)*.96; amount[yy<87]=0
          src=src*(1-amount[...,None])+target*amount[...,None]
          seam=np.exp(-((xx-695)/15)**2)*(1-protected); seam[yy<87]=0
          src=src*(1-seam[...,None])+target*seam[...,None]
          m=Image.new('L',(W,H),0); d=ImageDraw.Draw(m); d.polygon([(701,334),(731,345),(748,385),(741,410),(711,431),(698,404)],fill=255); m=m.filter(ImageFilter.GaussianBlur(1.25)); am=np.array(m)/255
          src=src*(1-am[...,None])+target*am[...,None]
          steel=np.clip(np.maximum(rear,front)-chamber*.72,0,1); lum=src.mean(2); graded=(src-19)*1.043+19; hi=np.clip((lum-34)/122,0,1); graded[:,:,2]+=2.4*hi; graded[:,:,1]+=1.15*hi
          warm=np.exp(-(((xx-1140)/275)**2+((yy-300)/235)**2)*2)*steel; graded[:,:,0]+=1.35*warm; graded[:,:,1]+=.45*warm; mix=steel*.54; src=src*(1-mix[...,None])+graded*mix[...,None]
          cb=(chamber>.46).astype(np.uint8); dist=cv2.distanceTransform(cb,cv2.DIST_L2,5); edge=(1-np.clip(dist/54,0,1))*chamber; src*=1-(edge*.072)[...,None]
          for cx,cy,sx,sy,k in [(945,488,175,115,.045),(1045,520,165,145,.058),(1130,528,92,145,.05)]:
            g=np.exp(-(((xx-cx)/sx)**2+((yy-cy)/sy)**2)*2)*chamber*k; src[:,:,0]+=23*g; src[:,:,1]+=88*g; src[:,:,2]+=105*g
          refl=Image.new('RGBA',(W,H),(0,0,0,0)); rd=ImageDraw.Draw(refl,'RGBA'); rd.line([(890,466),(1110,444),(1170,466)],fill=(116,221,234,20),width=1); rd.line([(875,536),(1090,520),(1172,540)],fill=(91,203,218,18),width=1); rd.line([(900,596),(1082,584),(1162,602)],fill=(85,188,202,13),width=1); refl=refl.filter(ImageFilter.GaussianBlur(.7)); ra=np.array(refl).astype(np.float32); ra[:,:,3]*=chamber; refl=Image.fromarray(np.clip(ra,0,255).astype(np.uint8),'RGBA')
          final=Image.alpha_composite(Image.fromarray(np.clip(src,0,255).astype(np.uint8),'RGB').convert('RGBA'),refl).convert('RGB'); src=np.array(final).astype(np.float32)
          for x0,y0,x1,y1 in [(58,650,405,694),(58,713,455,740)]:
            roi=src[y0:y1,x0:x1]; l=roi.mean(2); text=(l>27)&(l<160); roi[text]=np.minimum(roi[text]*1.27+4,190); src[y0:y1,x0:x1]=roi
          final=Image.fromarray(np.clip(src,0,255).astype(np.uint8),'RGB'); polish=Image.new('RGBA',(W,H),(0,0,0,0)); pd=ImageDraw.Draw(polish,'RGBA'); pd.line((400,634,470,634),fill=(86,181,195,100),width=1); pd.line([(1185,39),(1189,43),(1193,39)],fill=(177,187,190,118),width=1); final=Image.alpha_composite(final.convert('RGBA'),polish).convert('RGB')
          out=Path('docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R2.png'); final.save(out,optimize=True); print(hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Commit candidate and status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          PNG=docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R2.png
          SHA=$(sha256sum "$PNG"|awk '{print $1}')
          git add "$PNG" && git commit -m 'Save Hero Layered 2.5D Static R2 candidate'
          CAND=$(git rev-parse HEAD)
          cat > docs/site-evolution/PROAI_HERO_LAYERED_25D_STATIC_R2_STATUS.md <<EOF
          # ProAI Expert Hero — Layered 2.5D Static R2 — Status

          Date: 2026-08-10  
          Working branch: \`agent/hero-layered-25d-static-r1\`  
          Status: **PENDING OWNER REVIEW**

          ## Exact R1 source used
          - \`docs/site-evolution/review-artifacts/PROAI_HERO_LAYERED_25D_STATIC_R1.png\`
          - R1 candidate commit: \`e3dd5f36b61a5f9fb90a0842a9a7c0f15efa3c4e\`
          - R1 SHA-256: \`28d1885ff2350562434e5a4bf50cbc787a7ffee5e29635780cf2ce96560ff622\`
          - Registered R1 layers: \`assets/hero-layered-25d-r1/\`

          ## R2 result
          - Candidate: \`${PNG}\`
          - Candidate commit: \`${CAND}\`
          - Dimensions: \`1440 × 900\`
          - SHA-256: \`${SHA}\`
          - Core scale preserved from R1: approximately \`95.5%\` / \`-4.5%\`.

          ## Corrective method
          R2 remains the same registered layered 2.5D Hero. The old right-field cutoff was replaced by a controlled low-frequency atmospheric field spanning the column boundary while existing Core/chamber/output/rail alpha masks protect registered geometry. No luminance/content-alpha reconstruction and no blur-patch method were used.

          The hard seam/right-panel split was removed by progressive tonal integration beginning in left negative space and resolving into the right atmosphere, plus explicit neutralization of the former \`x≈695\` background seam. The floating dark triangular fragment left of the Core was removed with a feathered geometric exclusion mask and replaced by the same registered atmosphere; approved C-shape geometry was otherwise preserved.

          Chamber depth was enriched through the existing chamber mask with recess-edge darkening, three restrained cyan depth volumes and low-opacity internal reflection planes. Material polish uses the existing front/rear masks for richer graphite, cold blue-steel nuance, deeper plane separation, softer reflections and a microscopic warm counter-accent without chrome/neon/gaming styling.

          Micro-UI polish is limited to a subtle RU chevron, controlled contrast lift on the two important microcopy lines, and one intentional continuous underline treatment for \`View Work →\`.

          ## Preserved
          Same approved Hero concept, C-shape, layered 2.5D method, two-column architecture, Header/H1/main copy/CTA architecture, R1 Core scale, calm rail, \`01 TRUST / 02 INQUIRY / 03 RESPONSE / 04 RESULT\`, and current output-to-row logic.

          ## Safety confirmation
          - Production \`/index.html\` not modified.
          - Production \`/ru/index.html\` not modified.
          - Merge not done.
          - Deploy not done.
          - Production PR not opened.
          - Motion not started.

          **PENDING OWNER REVIEW**
          EOF
          git add docs/site-evolution/PROAI_HERO_LAYERED_25D_STATIC_R2_STATUS.md
          git commit -m 'Document Hero Layered 2.5D Static R2 status'
          git push origin HEAD:agent/hero-layered-25d-static-r1
