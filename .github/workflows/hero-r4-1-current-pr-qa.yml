name: Hero R4.1 exact snapshot owner-review QA

on:
  pull_request:
    branches:
      - agent/hero-r4-1-qa-current-base

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preview-only scope and exact assets
        shell: bash
        run: |
          set -euo pipefail
          BASE=bc198aad46e269b514e88ddabb94e2d856fa5b7c
          git diff --name-only "$BASE" HEAD | tee /tmp/r41-changed.txt
          ! grep -Eq '^(index\.html|ru/index\.html)$' /tmp/r41-changed.txt
          ! grep -Eq '^assets/css/header-system-v1\.css$|^assets/js/header-system-v1\.js$|^_includes/header-system/|^_data/(header|navigation)\.yml$' /tmp/r41-changed.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          raw=re.sub(r'\s+','',Path('_includes/hero-c-shape-r4-1/scene-r4-1-premium-desktop-webp.b64').read_text())
          data=base64.b64decode(raw,validate=True)
          assert len(data)==110358
          assert hashlib.sha256(data).hexdigest()=='71e5b81b7d38c1b6779d1411e1ce32f5363428998d136da7f7a7cdeac210e506'
          m=Path('assets/img/hero-c-shape/scene-r4-1-integrated-mobile.avif').read_bytes()
          assert len(m)==55263
          assert hashlib.sha256(m).hexdigest()=='5635602861a654cdf1208d219dae4fc7ed7ab0de6a841e83e7fadb286d4b5462'
          print('R4.1 asset verification PASS')
          PY

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v 4.3.4 --no-document
      - name: Build real Jekyll preview
        run: jekyll build --source . --destination _site --trace

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Serve generated site
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/r41-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/hero-a-plus-c-shape-preview/ >/dev/null
      - name: Run Chromium matrix and owner capture
        run: node tools/hero_r4_1_qa.mjs
      - name: Upload exact owner-review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PROAI_HERO_R4_1_OWNER_REVIEW_EXACT
          path: r4-1-owner-review/
          if-no-files-found: warn
          retention-days: 7
