name: Hero R4.1 owner review QA

on:
  push:
    branches:
      - agent/hero-r4-1-premium-owner-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout R4.1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preview-only scope against locked R4 checkpoint
        run: |
          BASE=bc198aad46e269b514e88ddabb94e2d856fa5b7c
          git diff --name-only "$BASE" HEAD | tee /tmp/r41-changed.txt
          if grep -Eq '^(index\.html|ru/index\.html)$' /tmp/r41-changed.txt; then
            echo 'Production homepage route changed — forbidden.' >&2
            exit 1
          fi
          if grep -Eq '^assets/css/header-system-v1\.css$|^assets/js/header-system-v1\.js$|^_includes/header-system/|^_data/(header|navigation)\.yml$' /tmp/r41-changed.txt; then
            echo 'Canonical shared Header source changed — forbidden for R4.1.' >&2
            exit 1
          fi

      - name: Verify exact R4.1 scene asset payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re
          src = Path('_includes/hero-c-shape-r4-1/scene-r4-1-premium-desktop-webp.b64').read_text(encoding='utf-8')
          raw = re.sub(r'\s+', '', src)
          data = base64.b64decode(raw, validate=True)
          assert len(data) == 110358, len(data)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '71e5b81b7d38c1b6779d1411e1ce32f5363428998d136da7f7a7cdeac210e506', digest
          print('desktop WebP:', len(data), digest)
          p = Path('assets/img/hero-c-shape/scene-r4-1-integrated-mobile.avif')
          mobile = p.read_bytes()
          md = hashlib.sha256(mobile).hexdigest()
          assert len(mobile) == 55263, len(mobile)
          assert md == '5635602861a654cdf1208d219dae4fc7ed7ab0de6a841e83e7fadb286d4b5462', md
          print('mobile AVIF:', len(mobile), md)
          PY

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll -v 4.3.4 --no-document

      - name: Build real Jekyll preview
        run: jekyll build --source . --destination _site --trace

      - name: Verify generated Header and preview payload
        run: |
          test -f _site/hero-a-plus-c-shape-preview/index.html
          test -f _site/ru/hero-a-plus-c-shape-preview/index.html
          grep -q 'site-header__cube-face--front' _site/hero-a-plus-c-shape-preview/index.html
          grep -q 'PROAI <strong>EXPERT</strong>' _site/hero-a-plus-c-shape-preview/index.html
          grep -q 'hero-r41__signal-svg' _site/hero-a-plus-c-shape-preview/index.html
          grep -q 'data-r41-collector' _site/hero-a-plus-c-shape-preview/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Serve Jekyll output
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/r41-http.log 2>&1 &
          echo $! > /tmp/r41-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/hero-a-plus-c-shape-preview/ > /dev/null

      - name: Run responsive Chromium QA and capture owner package
        run: node tools/hero_r4_1_qa.mjs

      - name: Upload owner-review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PROAI_HERO_R4_1_OWNER_REVIEW
          path: r4-1-owner-review/
          if-no-files-found: warn
          retention-days: 7

      - name: Print local server log on failure
        if: failure()
        run: cat /tmp/r41-http.log || true
