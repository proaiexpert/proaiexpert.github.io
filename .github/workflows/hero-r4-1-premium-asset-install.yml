name: Install verified Hero R4.1 premium desktop scene

on:
  pull_request:
    branches:
      - agent/hero-r4-1-premium-asset-base

permissions:
  contents: write

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary asset payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify transfer chunks and premium desktop AVIF
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            c6169dbbcacf7579bb8b0833ca72cd90556922f7799f841a118afa4663ad4e31
            4d271b7c2490ac65d26ac77ce2a0a227dd98e47d465c4bbf60a7246afd08c16f
            306f3f50c45825a7798c14bd9303a590ca8537b2a5515e41bdd80db07439296f
            985d1617da2fe3e239a6d64b1231e29d7627b288bc98446af2ccab7141514765
            40b26ea189fdc0deffbf6fa925c15046b7617e01b56d9c7a606527c2d4230e88
            fd4c8c1e7e587396f508061ae6c377e96f80a06cf2ee80b4ca23886578241f3d
          )
          for i in 1 2 3 4 5 6; do
            f=$(printf '.r41-asset/desktop-%02d.b64' "$i")
            actual=$(sha256sum "$f" | awk '{print $1}')
            chars=$(wc -c < "$f" | tr -d ' ')
            echo "$f chars=$chars sha256=$actual expected=${expected[$((i-1))]}"
            test "$actual" = "${expected[$((i-1))]}"
          done
          cat .r41-asset/desktop-*.b64 | tr -d '\r\n ' | base64 -d > /tmp/scene-r4-1-premium-desktop.avif
          bytes=$(wc -c < /tmp/scene-r4-1-premium-desktop.avif | tr -d ' ')
          digest=$(sha256sum /tmp/scene-r4-1-premium-desktop.avif | awk '{print $1}')
          echo "decoded bytes=$bytes sha256=$digest"
          test "$bytes" = "71437"
          test "$digest" = "8fec9e0116d133ca0d13bc1e3211b2a5ea761cda6dfd47d35469fbb9a3449765"
          file /tmp/scene-r4-1-premium-desktop.avif

      - name: Install exact binary on R4.1 target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/hero-r4-1-premium-owner-polish
          git checkout -B agent/hero-r4-1-premium-owner-polish origin/agent/hero-r4-1-premium-owner-polish
          cp /tmp/scene-r4-1-premium-desktop.avif assets/img/hero-c-shape/scene-r4-1-integrated-desktop.avif
          git config user.name 'proai-r4-1-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/img/hero-c-shape/scene-r4-1-integrated-desktop.avif
          if git diff --cached --quiet; then
            echo 'Premium desktop asset already installed.'
            exit 0
          fi
          git commit -m 'Install verified R4.1 premium desktop scene asset'
          git push origin HEAD:agent/hero-r4-1-premium-owner-polish
