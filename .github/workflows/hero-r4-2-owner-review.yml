name: Hero R4.4 lean owner review

on:
  push:
    branches:
      - agent/hero-r4-4-premium-static-ui-material-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout R4.4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard production routes
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -Eq '^(index\.html|ru/index\.html)$'; then
            echo 'Production homepage route changed — forbidden in owner-review branch.' >&2
            exit 1
          fi

      - name: Setup Ruby and build Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v 4.3.4 --no-document
      - run: jekyll build --source . --destination _site --trace

      - name: Setup Node and browser
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/r44-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/hero-a-plus-c-shape-preview/ > /dev/null

      - name: Capture only the three owner-review outputs
        run: node tools/hero_r4_2_preview.mjs

      - name: Upload lean owner-review package
        uses: actions/upload-artifact@v4
        with:
          name: PROAI_HERO_R4_4_LEAN_OWNER_REVIEW
          path: |
            r4-4-owner-review/R44_DESKTOP_STATIC.png
            r4-4-owner-review/R44_MOBILE_STATIC.png
            r4-4-owner-review/R44_DESKTOP_MOTION.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/r44-http.log || true
