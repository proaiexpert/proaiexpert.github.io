name: Hero R4.5 layered owner review

on:
  push:
    branches:
      - agent/hero-r4-5-layered-2-5d-compositor
    paths-ignore:
      - .github/r45-owner-review-last-run.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  owner-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout R4.5 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hero-r4-5-layered-2-5d-compositor

      - name: Guard production homepage routes
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -Eq '^(index\.html|ru/index\.html)$'; then
            echo 'Production homepage route changed — forbidden in owner-review branch.' >&2
            exit 1
          fi

      - name: Record this Actions run id for deterministic retrieval
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/r45-owner-review-last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/r45-owner-review-last-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Hero R4.5 owner review run"
            git push origin HEAD:agent/hero-r4-5-layered-2-5d-compositor
          fi

      - name: Setup Ruby and build Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v 4.3.4 --no-document
      - run: jekyll build --source . --destination _site --trace

      - name: Setup Node and browser
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/r45-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/hero-a-plus-c-shape-preview/ > /dev/null

      - name: Capture exactly three R4.5 owner-review outputs
        run: node tools/hero_r4_5_preview.mjs

      - name: Validate dimensions and motion duration
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          expected = {
              Path('r4-5-owner-review/R45_DESKTOP_STATIC.png'): (1440, 900),
              Path('r4-5-owner-review/R45_MOBILE_STATIC.png'): (390, 844),
          }
          for p, dims in expected.items():
              data = p.read_bytes()[:24]
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Not a PNG: {p}')
              w, h = struct.unpack('>II', data[16:24])
              if (w, h) != dims:
                  raise SystemExit(f'Wrong PNG dimensions for {p}: {(w,h)} != {dims}')
          PY
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 r4-5-owner-review/R45_DESKTOP_MOTION.mp4)" = "1440x900"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 r4-5-owner-review/R45_DESKTOP_MOTION.mp4)"
          python3 - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 12.0 <= d <= 15.9:
              raise SystemExit(f'Unexpected motion duration: {d:.3f}s')
          print(f'Validated motion duration: {d:.3f}s')
          PY

      - name: Upload R4.5 owner-review package
        uses: actions/upload-artifact@v4
        with:
          name: PROAI_HERO_R4_5_OWNER_REVIEW
          path: |
            r4-5-owner-review/R45_DESKTOP_STATIC.png
            r4-5-owner-review/R45_DESKTOP_MOTION.mp4
            r4-5-owner-review/R45_MOBILE_STATIC.png
          if-no-files-found: error
          retention-days: 7

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/r45-http.log || true