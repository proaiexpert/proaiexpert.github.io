name: Hero R4.5 internal parallax A-B

on:
  push:
    branches:
      - agent/hero-r4-5-layered-2-5d-compositor
    paths:
      - .github/workflows/hero-r4-5-parallax-ab.yml
      - tools/hero_r4_5_parallax_ab.mjs
      - _includes/hero-c-shape-r4-5/**
      - hero-a-plus-c-shape-preview/index.html

permissions:
  contents: read

jobs:
  parallax-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v 4.3.4 --no-document
      - run: jekyll build --source . --destination _site --trace
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory _site >/tmp/r45-ab-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/hero-a-plus-c-shape-preview/ >/dev/null
      - run: node tools/hero_r4_5_parallax_ab.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: R45_INTERNAL_PARALLAX_AB
          path: r45-internal-parallax-ab/*.png
          if-no-files-found: error
          retention-days: 1