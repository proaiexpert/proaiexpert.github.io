name: Hero R4.6 corrective static V1 owner review

on:
  push:
    branches:
      - agent/hero-static-premium-integration-r1
    paths:
      - .github/workflows/hero-r46-corrective-static-v1.yml
      - tools/hero_r46_corrective_static_v1.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  render-corrective-static:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hero-static-premium-integration-r1

      - name: Guard production homepage routes
        shell: bash
        run: |
          git fetch origin main --quiet
          if git diff --name-only origin/main...HEAD | grep -Eq '^(index\.html|ru/index\.html)$'; then
            echo 'Production homepage route changed — forbidden in owner-review branch.' >&2
            exit 1
          fi

      - name: Download exact recovered R4.6 owner-review artifact
        uses: actions/download-artifact@v4
        with:
          name: PROAI_HERO_RECOVERY_OWNER_REVIEW
          path: recovery-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: proaiexpert/proaiexpert.github.io
          run-id: 31351101048

      - name: Validate recovery input
        shell: bash
        run: |
          test -s recovery-artifact/R46_DESKTOP_STATIC.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('recovery-artifact/R46_DESKTOP_STATIC.png')
          b=p.read_bytes()[:24]
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('Recovery input is not PNG')
          if struct.unpack('>II', b[16:24]) != (1440,900): raise SystemExit('Recovery input is not 1440x900')
          print('Recovery input validated: 1440x900')
          PY

      - name: Setup deterministic raster dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fontconfig
          python3 -m pip install --disable-pip-version-check --quiet \
            pillow==12.3.0 numpy opencv-python-headless==4.13.0.92

      - name: Generate the single corrective candidate
        shell: bash
        run: |
          mkdir -p docs/site-evolution/review-artifacts /tmp/proai-r46
          python3 tools/hero_r46_corrective_static_v1.py \
            recovery-artifact/R46_DESKTOP_STATIC.png \
            docs/site-evolution/review-artifacts/PROAI_HERO_R46_CORRECTIVE_STATIC_V1.png \
            --qa-json /tmp/proai-r46/qa.json
          cat /tmp/proai-r46/qa.json

      - name: Validate candidate dimensions and one-candidate gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          p=Path('docs/site-evolution/review-artifacts/PROAI_HERO_R46_CORRECTIVE_STATIC_V1.png')
          b=p.read_bytes()[:24]
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('Candidate is not PNG')
          if struct.unpack('>II', b[16:24]) != (1440,900): raise SystemExit('Candidate is not 1440x900')
          qa=json.loads(Path('/tmp/proai-r46/qa.json').read_text())
          assert qa['linear_scale_reduction_percent'] == 4.5
          assert qa['rail_pitch_px'] == 70
          assert qa['rail_labels'] == ['01 TRUST','02 INQUIRY','03 RESPONSE','04 RESULT']
          assert qa['header_pixel_lock'] is True
          assert qa['left_copy_cta_pixel_lock'] is True
          print('Corrective candidate QA gates: PASS')
          PY

      - name: Commit exact binary candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/site-evolution/review-artifacts/PROAI_HERO_R46_CORRECTIVE_STATIC_V1.png
          if git diff --cached --quiet; then
            ARTIFACT_COMMIT="$(git rev-parse HEAD)"
          else
            git commit -m "Save Hero R4.6 corrective static V1 candidate"
            ARTIFACT_COMMIT="$(git rev-parse HEAD)"
            git push origin HEAD:agent/hero-static-premium-integration-r1
          fi
          printf '%s\n' "$ARTIFACT_COMMIT" > /tmp/proai-r46/artifact-commit.txt

      - name: Record owner-review status
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_COMMIT="$(cat /tmp/proai-r46/artifact-commit.txt)"
          PNG_PATH='docs/site-evolution/review-artifacts/PROAI_HERO_R46_CORRECTIVE_STATIC_V1.png'
          PNG_SHA256="$(sha256sum "$PNG_PATH" | awk '{print $1}')"
          cat > docs/site-evolution/PROAI_HERO_R46_CORRECTIVE_STATIC_V1_STATUS.md <<EOF
          # ProAI Expert Hero R4.6 Corrective Static V1 — Status

          Date: 2026-08-10
          Working branch: \`agent/hero-static-premium-integration-r1\`
          Source recovery artifact run: \`31351101048\`
          Source recovery artifact: \`PROAI_HERO_RECOVERY_OWNER_REVIEW / R46_DESKTOP_STATIC.png\`
          Deterministic generator: \`tools/hero_r46_corrective_static_v1.py\`

          ## Result

          - Exact result path: \`docs/site-evolution/review-artifacts/PROAI_HERO_R46_CORRECTIVE_STATIC_V1.png\`
          - Result commit SHA: \`${ARTIFACT_COMMIT}\`
          - Image dimensions: \`1440 × 900\`
          - PNG SHA-256: \`${PNG_SHA256}\`
          - Status: **PENDING OWNER REVIEW**

          ## Corrective pass summary

          - Preserved the recovered R4.6 two-column Hero, H1 hierarchy, canonical Header, CTA system and approved C-shape concept.
          - Kept Header plus the complete left copy/H1/CTA column pixel-identical to the recovered GitHub Actions frame.
          - Reduced the recovered right-side visual plate to \`95.5%\` linear scale (\`4.5%\` reduction), within the owner-requested 3–6% range.
          - Removed the old rail glyphs/nodes and legacy free-space output curls locally, without broad cleanup plates.
          - Rebuilt one precise 01–04 rail on a fixed 70 px vertical pitch: \`01 TRUST / 02 INQUIRY / 03 RESPONSE / 04 RESULT\`.
          - Registered each new short output trace directly to its corresponding rail node/row.
          - Increased graphite/steel tonal separation, source-derived internal cyan volume, restrained cold-steel edge response, extremely subtle champagne reflection and stronger contact/floor response.
          - No Hero concept change, no motion pass, no page redesign and no production route changes.

          ## Independent QA

          - One candidate only: PASS.
          - Candidate dimensions \`1440 × 900\`: PASS.
          - Linear scale reduction \`4.5%\`: PASS.
          - Rail row pitch \`70 px\`, fixed number/label columns and \`04 RESULT\`: PASS.
          - Output endpoints terminate at the rebuilt row nodes: PASS.
          - Header pixel-lock against recovery frame: PASS.
          - Left H1/copy/CTA pixel-lock against recovery frame: PASS.
          - Production \`/index.html\` and \`/ru/index.html\`: NOT MODIFIED.
          - Merge / deploy / production PR: NOT PERFORMED.
          - Motion implementation: NOT STARTED; intentionally blocked pending owner verdict.

          **PENDING OWNER REVIEW**
          EOF
          git add docs/site-evolution/PROAI_HERO_R46_CORRECTIVE_STATIC_V1_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Document Hero R4.6 corrective static V1 status"
            git push origin HEAD:agent/hero-static-premium-integration-r1
          fi
