name: Hero R5 WebGL owner review

on:
  push:
    branches:
      - agent/hero-r5-webgl-proof
    paths-ignore:
      - .github/r5-owner-review-last-run.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  owner-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout R5 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hero-r5-webgl-proof

      - name: Guard production homepage routes
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -Eq '^(index\.html|ru/index\.html)$'; then
            echo 'Production homepage route changed — forbidden in owner-review branch.' >&2
            exit 1
          fi

      - name: Record run id
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > .github/r5-owner-review-last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/r5-owner-review-last-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Hero R5 owner review run"
            git push origin HEAD:agent/hero-r5-webgl-proof
          fi

      - name: Build Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v 4.3.4 --no-document
      - run: jekyll build --source . --destination _site --trace

      - name: Setup browser and ffmpeg
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Serve preview
        run: |
          python3 -m http.server 4173 --directory _site > /tmp/r5-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/hero-r5-webgl-proof/ > /dev/null

      - name: Capture R5 owner outputs
        run: node tools/hero_r5_webgl_preview.mjs

      - name: Validate outputs
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for p,dims in {Path('r5-owner-review/R5_DESKTOP_STATIC.png'):(1440,900),Path('r5-owner-review/R5_MOBILE_STATIC.png'):(390,844)}.items():
              d=p.read_bytes()[:24]
              if d[:8]!=b'\x89PNG\r\n\x1a\n': raise SystemExit(f'Not PNG: {p}')
              wh=struct.unpack('>II',d[16:24])
              if wh!=dims: raise SystemExit(f'Wrong dimensions {p}: {wh}')
          PY
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 r5-owner-review/R5_DESKTOP_MOTION.mp4)" = "1440x900"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 r5-owner-review/R5_DESKTOP_MOTION.mp4)"
          python3 - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 12.0 <= d <= 15.5: raise SystemExit(f'Unexpected duration {d}')
          PY

      - name: Upload R5 owner review
        uses: actions/upload-artifact@v4
        with:
          name: PROAI_HERO_R5_WEBGL_OWNER_REVIEW
          path: |
            r5-owner-review/R5_DESKTOP_STATIC.png
            r5-owner-review/R5_DESKTOP_MOTION.mp4
            r5-owner-review/R5_MOBILE_STATIC.png
          if-no-files-found: error
          retention-days: 7

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/r5-http.log || true
