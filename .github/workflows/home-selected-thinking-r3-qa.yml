name: Home Selected Thinking R3 QA

on:
  push:
    branches:
      - agent/home-selected-thinking-quiet-editorial-r3

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Source guard
        run: |
          python - <<'PY'
          from pathlib import Path
          for loc,src in [('en','_includes/home-selected-thinking-r2-en.html'),('ru','_includes/home-selected-thinking-r2-ru.html')]:
            c=Path(src).read_text()
            assert 'st-r2__trace' not in c
            assert c.count('<article')==3
            assert c.count('href="{{')>=4
            assert 'site.data.insights' in c
            assert '<h2 id="selected-thinking-r2-title">' in c
          css=Path('assets/css/home-selected-thinking-r2.css').read_text()
          assert 'st-r2__trace' not in css
          for p in ['index.html','ru/index.html']:
            c=Path(p).read_text()
            assert 'home-selected-thinking-r2.css?v=quiet-editorial-r3' in c
            assert 'home-selected-thinking-r2.js' not in c
          print('HOME SOURCE CONTRACT PASS')
          PY

      - name: Build and site shell
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site

      - name: Install browsers
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit

      - name: Browser visual and functional contract
        shell: bash
        run: |
          mkdir -p home-r3-qa
          python -m http.server 4175 --directory _site >/tmp/home-r3-server.log 2>&1 &
          python - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:4175'
          for i in range(40):
            try: urllib.request.urlopen(base,timeout=1); break
            except Exception: time.sleep(.25)
          devices=[
            ('desktop-1280',1280,900,False),('desktop-1440',1440,900,False),
            ('desktop-1600',1600,1000,False),('desktop-1920',1920,1080,False),
            ('portrait-430',430,932,True),('portrait-390',390,844,True),
            ('portrait-375',375,812,True),('portrait-360',360,800,True),
            ('portrait-320',320,700,True),('landscape-844',844,390,True),
            ('landscape-932',932,430,True)
          ]
          failures=[];rows=[]
          with sync_playwright() as p:
            for name,engine in [('chromium',p.chromium),('webkit',p.webkit)]:
              browser=engine.launch()
              for loc,path in [('en','/'),('ru','/ru/')]:
                for v,w,h,touch in devices:
                  ctx=browser.new_context(viewport={'width':w,'height':h},is_mobile=touch,has_touch=touch,reduced_motion='reduce')
                  page=ctx.new_page()
                  page.goto(base+path,wait_until='domcontentloaded',timeout=30000)
                  page.locator('#selected-thinking-r2').wait_for()
                  page.evaluate('document.fonts.ready')
                  page.wait_for_timeout(100)
                  d=page.evaluate("""()=>{
                    const el=document.getElementById('selected-thinking-r2');
                    const b=el.getBoundingClientRect();
                    const links=[...el.querySelectorAll('article h3 a')];
                    const bb=[...el.querySelectorAll('article')].map(x=>x.getBoundingClientRect());
                    return {
                      pageOverflow:document.documentElement.scrollWidth-innerWidth,
                      componentOverflow:el.scrollWidth-el.clientWidth,
                      width:b.width,height:b.height,
                      headings:links.length,allLinksValid:links.every(x=>!!x.getAttribute('href')&&x.getAttribute('href').startsWith('/')),
                      articlesVisible:bb.every(x=>x.width>0&&x.height>50),
                      noTrace:!el.querySelector('.st-r2__trace'),
                      noMotionScript:!document.querySelector('script[src*="home-selected-thinking-r2.js"]'),
                      footer:!!document.querySelector('.proai-inner-golden-r1,footer'),
                      leadTitleSize:parseFloat(getComputedStyle(el.querySelector('.st-r2__lead-title')).fontSize),
                      noJsContent:el.innerText.length>250
                    }
                  }""")
                  row={'browser':name,'locale':loc,'viewport':v,**d};rows.append(row)
                  if d['pageOverflow']>1:failures.append(str(row)+':page overflow')
                  if d['componentOverflow']>1:failures.append(str(row)+':component overflow')
                  if d['headings']!=3 or not d['allLinksValid'] or not d['articlesVisible'] or not d['noTrace'] or not d['noMotionScript'] or not d['noJsContent']:
                    failures.append(str(row)+':contract')
                  if name=='chromium' and v in ['desktop-1440','portrait-390','landscape-844']:
                    page.screenshot(path=f'home-r3-qa/{loc}-{v}-full.png',full_page=True,animations='disabled',timeout=60000)
                  ctx.close()
              browser.close()
            browser=p.chromium.launch()
            ctx=browser.new_context(viewport={'width':1440,'height':900},java_script_enabled=False)
            page=ctx.new_page()
            for loc,path in [('en','/'),('ru','/ru/')]:
              page.goto(base+path,wait_until='domcontentloaded')
              if page.locator('#selected-thinking-r2 article').count()!=3:
                failures.append('No JS failure '+loc)
            ctx.close();browser.close()
          Path('home-r3-qa/results.json').write_text(json.dumps({'failures':failures,'rows':rows},ensure_ascii=False,indent=2))
          print(json.dumps({'failures':failures,'rows':len(rows)},ensure_ascii=False))
          if failures:raise SystemExit(1)
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-selected-thinking-r3-visual-qa
          path: home-r3-qa/
          retention-days: 14
