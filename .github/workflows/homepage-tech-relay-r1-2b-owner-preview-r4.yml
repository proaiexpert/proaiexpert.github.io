name: Homepage Technology Z-Relay R1.2B Final Owner Preview

on:
  push:
    branches:
      - review/homepage-tech-relay-signal-r1-2b-owner-preview-r4

permissions:
  contents: read
  statuses: write

env:
  PRODUCT_SHA: ba41083fc4091207fae5253967bbe7d13eba0e07
  QA_BASE: http://127.0.0.1:4173

jobs:
  visual_qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba41083fc4091207fae5253967bbe7d13eba0e07
          fetch-depth: 1
      - name: Verify exact product
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - name: Build and prepare Chrome
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          npm install --no-save --package-lock=false playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable); echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Start exact site
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/r12b-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$QA_BASE/" >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1
      - name: Portrait runtime and required visual evidence
        shell: bash
        run: |
          set -euo pipefail
          cat >.r12b-final.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const base=process.env.QA_BASE.replace(/\/$/,'');
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--disable-dev-shm-usage','--ignore-gpu-blocklist']});
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function ready(page){await page.evaluate(()=>new Promise((res,rej)=>{const s=document.querySelector('[data-home-tech-r2]');const f=()=>{if(s?.dataset.techR2SignalReady==='true'){mo.disconnect();clearTimeout(t);res(true)}};const mo=new MutationObserver(f);mo.observe(s,{attributes:true});const t=setTimeout(()=>{mo.disconnect();rej(new Error('ready timeout'))},15000);f()}))}
          async function ratio(page,n){return page.evaluate(n=>{const s=document.querySelector('[data-home-tech-r2]'),r=s.getBoundingClientRect(),b=innerHeight*.92,target=Math.max(0,scrollY+r.top-(b-r.height*n));scrollTo({top:target,behavior:'instant'});const a=s.getBoundingClientRect(),v=Math.max(0,Math.min(a.bottom,b)-Math.max(a.top,0));return v/a.height},n)}
          async function waitState(page,x){await page.evaluate(x=>new Promise((res,rej)=>{const s=document.querySelector('[data-home-tech-r2]');const f=()=>{if(s.dataset.techR2State===x){mo.disconnect();clearTimeout(t);res(true)}};const mo=new MutationObserver(f);mo.observe(s,{attributes:true,attributeFilter:['class','data-tech-r2-state']});const t=setTimeout(()=>{mo.disconnect();rej(new Error(x+' timeout'))},30000);f()}),x)}
          async function logos(page,eager=false){if(eager)await page.evaluate(()=>document.querySelectorAll('[data-home-tech-r2] img').forEach(i=>{i.loading='eager';i.decoding='sync'}));await page.evaluate(()=>new Promise((res,rej)=>{const a=[...document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__mark img')],ok=()=>a.length===10&&a.every(i=>i.complete&&i.naturalWidth>0);if(ok())return res(true);const p=setInterval(()=>{if(ok()){clearInterval(p);clearTimeout(t);res(true)}},100),t=setTimeout(()=>{clearInterval(p);rej(new Error('logo timeout'))},15000)}))}
          async function arm(page,sel,name,freeze=false){await page.evaluate(({sel,name,freeze})=>{const match=e=>e.target?.matches?.(sel)&&e.animationName===name;window.__s=new Promise((res,rej)=>{const h=e=>{if(!match(e))return;document.removeEventListener('animationstart',h,true);clearTimeout(t);const a=e.target.getAnimations()[0];if(freeze&&a){a.pause();a.currentTime=Number(a.effect.getTiming().duration)*.42}res({name:e.animationName,inline:e.target.style.animationDuration})};document.addEventListener('animationstart',h,true);const t=setTimeout(()=>rej(new Error('start timeout')),30000)});if(!freeze)window.__e=new Promise((res,rej)=>{const h=e=>{if(!match(e))return;document.removeEventListener('animationend',h,true);clearTimeout(t);res({name:e.animationName,elapsed:e.elapsedTime})};document.addEventListener('animationend',h,true);const t=setTimeout(()=>rej(new Error('end timeout')),35000)})},{sel,name,freeze})}
          async function shot(page,path){const c=await page.context().newCDPSession(page),x=await c.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});fs.writeFileSync(path,Buffer.from(x.data,'base64'));await c.detach()}
          async function layout(page){await logos(page);const x=await page.evaluate(()=>{const d=document.documentElement,s=document.querySelector('[data-home-tech-r2]');return{d:[d.clientWidth,d.scrollWidth],s:[s.clientWidth,s.scrollWidth],n:s.querySelectorAll('.home-tech-r2__identity').length}});assert(x.d[1]<=x.d[0]+1&&x.s[1]<=x.s[0]+1&&x.n===10,'layout '+JSON.stringify(x))}

          // Portrait EN runtime: no screenshot interference.
          {
            const c=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),p=await c.newPage();
            await p.goto(base+'/',{waitUntil:'domcontentloaded',timeout:20000});await p.waitForSelector('[data-home-tech-r2]');await ready(p);
            const sel='.home-tech-r2__relay--mobile .home-tech-r2__relay-signal';await arm(p,sel,'home-tech-r2-signal-pass-mobile');await ratio(p,.68);const s=await p.evaluate(async()=>await window.__s),e=await p.evaluate(async()=>await window.__e);assert(e.elapsed>1.10&&e.elapsed<1.22,'portrait elapsed '+e.elapsed);await waitState(p,'settled');await layout(p);
            const m=await p.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]'),r=s.querySelector('.home-tech-r2__relay--mobile'),b=r.querySelector('.home-tech-r2__relay-base');return{mode:s.dataset.techR2RelayMode,v:r.getAttribute('viewBox'),d:b.getAttribute('d')}});assert(m.mode==='portrait'&&m.v==='0 0 400 520'&&m.d==='M200 0 V520','portrait mode '+JSON.stringify(m));console.log('PORTRAIT_RUNTIME_PASS '+JSON.stringify({s,e,m}));await c.close();
          }

          // Landscape idle and active screenshots; eager is QA-only.
          {
            const c=await browser.newContext({viewport:{width:844,height:390},hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),p=await c.newPage();await p.goto(base+'/',{waitUntil:'domcontentloaded',timeout:20000});await p.waitForSelector('[data-home-tech-r2]');await ready(p);await logos(p,true);await ratio(p,.48);await shot(p,'/tmp/r12b-landscape-idle-844x390-en.png');const sel='.home-tech-r2__relay--mobile .home-tech-r2__relay-signal';await arm(p,sel,'home-tech-r2-signal-pass-landscape',true);await ratio(p,.68);const s=await p.evaluate(async()=>await window.__s);assert(s.inline==='1680ms','landscape visual '+JSON.stringify(s));await shot(p,'/tmp/r12b-landscape-active-844x390-en.png');console.log('LANDSCAPE_VISUAL_PASS');await c.close();
          }

          // Portrait active screenshot; eager is QA-only.
          {
            const c=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),p=await c.newPage();await p.goto(base+'/',{waitUntil:'domcontentloaded',timeout:20000});await p.waitForSelector('[data-home-tech-r2]');await ready(p);await logos(p,true);await ratio(p,.48);const sel='.home-tech-r2__relay--mobile .home-tech-r2__relay-signal';await arm(p,sel,'home-tech-r2-signal-pass-mobile',true);await ratio(p,.68);await p.evaluate(async()=>await window.__s);await shot(p,'/tmp/r12b-portrait-active-390x844-en.png');console.log('PORTRAIT_VISUAL_PASS');await c.close();
          }
          await browser.close();
          for(const f of ['/tmp/r12b-landscape-idle-844x390-en.png','/tmp/r12b-landscape-active-844x390-en.png','/tmp/r12b-portrait-active-390x844-en.png'])assert(fs.existsSync(f)&&fs.statSync(f).size>1000,'missing '+f);
          console.log('R12B_FINAL_GATE=PASS');
          NODE
          QA_BASE="$QA_BASE" CHROME_PATH="$CHROME_PATH" node .r12b-final.mjs
          rm -f .r12b-final.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: technology-r12b-final-site
          path: _site
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: technology-r12b-final-visual-evidence
          path: /tmp/r12b-*.png
          retention-days: 1

  preview:
    needs: visual_qa
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      INFRA_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: technology-r12b-final-site
          path: _site
      - name: Publish HTTPS Owner preview
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/r12b-preview.log 2>&1 & P=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared; chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/cloudflared.log 2>&1 & T=$!; trap 'kill "$T" 2>/dev/null||true;kill "$P" 2>/dev/null||true' EXIT
          URL=''; for i in $(seq 1 90); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log|tail -1||true); [ -n "$URL" ]&&break; sleep 1; done; test -n "$URL"
          READY=0; for i in $(seq 1 90); do if curl -fsSL --max-time 10 "$URL/" >/tmp/en && curl -fsSL --max-time 10 "$URL/ru/" >/tmp/ru; then READY=1;break;fi;sleep 1;done;test "$READY" -eq 1
          grep -q '04 / TECHNOLOGY ECOSYSTEM' /tmp/en; grep -q '04 / ТЕХНОЛОГИЧЕСКАЯ ЭКОСИСТЕМА' /tmp/ru
          gh api --method POST "repos/$REPO/statuses/$INFRA_SHA" -f state=success -f target_url="$URL" -f context='owner-preview/technology-z-relay-r1-2b' -f description='R1.2B QA PASS; Owner preview live' >/dev/null
          echo "OWNER_REVIEW_URL=$URL"
          sleep 7200
