name: Homepage Technology Z-Relay R1.3 Final Review Gate

on:
  push:
    branches:
      - review/homepage-tech-relay-signal-r1-3-owner-preview-r3

permissions:
  contents: read
  statuses: write

env:
  PRODUCT_SHA: 7b0942a042ef23e10cd74592208eeae94479b45e
  QA_BASE: http://127.0.0.1:4173

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b0942a042ef23e10cd74592208eeae94479b45e
          fetch-depth: 1

      - name: Verify exact product and frozen desktop entry source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          node --check assets/js/home-technology-transition-r2.js
          grep -Fq "var DESKTOP_SIGNAL_DURATION = 1900;" assets/js/home-technology-transition-r2.js
          grep -Fq "var DESKTOP_HANDOFF_DELAY = 1680;" assets/js/home-technology-transition-r2.js
          grep -Fq "signal.style.animationDuration = DESKTOP_SIGNAL_DURATION + 'ms';" assets/js/home-technology-transition-r2.js
          grep -Fq "var LOCAL_RESPONSE_DURATION = 740;" assets/js/home-technology-transition-r2.js

      - name: Build exact product
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          npm install --no-save --package-lock=false playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          if command -v ffmpeg >/dev/null 2>&1; then echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"; fi

      - name: Start exact generated site
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/r13-r3-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$QA_BASE/" >/dev/null && curl -fsS "$QA_BASE/ru/" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run desktop hover matrix and frozen regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r13-evidence /tmp/r13-frames
          cat >.r13-r3.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const base=process.env.QA_BASE.replace(/\/$/,'');
          const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--disable-dev-shm-usage','--ignore-gpu-blocklist']});
          const brands=['openai','claude','gemini','n8n','make','twilio','vercel','gmail','zapier','github'];
          const offsets=['-.44','-.37','-.30','-.23','-.16','-.68','-.73','-.78','-.83','-.88'];
          const LANDSCAPE='M332 0 V18 Q332 34 314 34 H300 Q280 34 280 54 V244 Q280 262 298 262 H354 Q372 262 372 280 V300';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function ready(page){
            await page.waitForSelector('[data-home-tech-r2]',{timeout:10000});
            await page.evaluate(()=>new Promise((resolve,reject)=>{
              const s=document.querySelector('[data-home-tech-r2]');
              const check=()=>{if(s?.dataset.techR2SignalReady==='true'){mo.disconnect();clearTimeout(to);resolve(true);return true;}return false;};
              const mo=new MutationObserver(check);mo.observe(s,{attributes:true});
              const to=setTimeout(()=>{mo.disconnect();reject(new Error('signal ready timeout'));},15000);check();
            }));
          }

          async function visibleRatio(page,ratio){
            return page.evaluate(ratio=>{
              const s=document.querySelector('[data-home-tech-r2]'),r=s.getBoundingClientRect(),limit=innerHeight*.92;
              scrollTo({top:Math.max(0,scrollY+r.top-(limit-r.height*ratio)),behavior:'instant'});
              const a=s.getBoundingClientRect(),visible=Math.max(0,Math.min(a.bottom,limit)-Math.max(a.top,0));
              return visible/a.height;
            },ratio);
          }

          async function waitState(page,target){
            await page.evaluate(target=>new Promise((resolve,reject)=>{
              const s=document.querySelector('[data-home-tech-r2]');
              const check=()=>{if(s?.dataset.techR2State===target){mo.disconnect();clearTimeout(to);resolve(true);return true;}return false;};
              const mo=new MutationObserver(check);mo.observe(s,{attributes:true,attributeFilter:['class','data-tech-r2-state']});
              const to=setTimeout(()=>{mo.disconnect();reject(new Error(target+' timeout'));},30000);check();
            }),target);
          }

          async function pointer(page,index,type){
            await page.evaluate(({index,type})=>{
              const el=document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__identity')[index];
              if(!el)throw new Error('identity '+index+' missing');
              el.dispatchEvent(new PointerEvent(type,{pointerType:'mouse',isPrimary:true,bubbles:false}));
            },{index,type});
          }

          async function screenshot(page,path){
            const cdp=await page.context().newCDPSession(page);
            const shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
            fs.writeFileSync(path,Buffer.from(shot.data,'base64'));
            await cdp.detach();
          }

          function diagnostics(page){
            const d={errors:[],failed:[]};
            page.on('pageerror',e=>d.errors.push(String(e?.stack||e)));
            page.on('requestfailed',r=>{if(/home-technology-transition-r2|\/assets\/brand\/platforms\//.test(r.url()))d.failed.push(r.url());});
            return d;
          }

          async function desktop(lang,visual){
            const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:false,isMobile:false,reducedMotion:'no-preference'});
            const page=await context.newPage(),d=diagnostics(page);
            await page.goto(base+(lang==='EN'?'/':'/ru/'),{waitUntil:'domcontentloaded',timeout:20000});
            await ready(page);

            const media=await page.evaluate(()=>({fine:matchMedia('(hover:hover) and (pointer:fine)').matches,desktop:matchMedia('(min-width:701px)').matches}));
            assert(media.fine&&media.desktop,lang+' fine desktop media '+JSON.stringify(media));

            const pre=await visibleRatio(page,.48);await sleep(120);
            assert(pre<.55,lang+' pretrigger ratio '+pre);
            assert(await page.evaluate(()=>!document.querySelector('[data-home-tech-r2]').dataset.techR2State),lang+' premature assembly');

            await visibleRatio(page,.68);
            await page.waitForFunction(()=>document.querySelector('[data-home-tech-r2]')?.dataset.techR2State==='assembling',{timeout:5000});
            const initial=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]'),h=s.querySelector('.home-tech-r2__handoff span');return{handoff:h.style.animationDelay,coreCount:s.querySelectorAll('.home-tech-r2__relay-local-core').length};});
            assert(initial.handoff==='1680ms'&&initial.coreCount===1,lang+' initial lock '+JSON.stringify(initial));
            await waitState(page,'settled');

            const order=await page.evaluate(()=>[...document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__identity')].map(x=>x.dataset.brand));
            assert(JSON.stringify(order)===JSON.stringify(brands),lang+' vendor order '+JSON.stringify(order));

            for(let i=0;i<10;i++){
              await pointer(page,i,'pointerenter');
              const snap=await page.evaluate(()=>{
                const s=document.querySelector('[data-home-tech-r2]');
                const tail=s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-signal');
                const core=s.querySelector('.home-tech-r2__relay-local-core');
                const active=s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-active');
                return {active:s.classList.contains('is-local-active'),offset:s.style.getPropertyValue('--tech-r2-local-offset'),tailDash:tail.style.strokeDasharray,coreDash:core.style.strokeDasharray,tailDuration:tail.getAnimations()[0]?.effect?.getTiming?.().duration,coreDuration:core.getAnimations()[0]?.effect?.getTiming?.().duration,localCount:(s.__techR2LocalAnimations||[]).length,coreCount:s.querySelectorAll('.home-tech-r2__relay-local-core').length,globalOpacity:Number(getComputedStyle(active).opacity),globalAnimations:active.getAnimations().length};
              });
              assert(snap.active&&snap.offset===offsets[i],lang+' '+brands[i]+' mapping '+JSON.stringify(snap));
              assert(snap.tailDash==='.18 2'&&snap.coreDash==='.065 2',lang+' '+brands[i]+' single-segment layers '+JSON.stringify(snap));
              assert(Number(snap.tailDuration)===740&&Number(snap.coreDuration)===740&&snap.localCount===2&&snap.coreCount===1,lang+' '+brands[i]+' pulse timing '+JSON.stringify(snap));
              assert(snap.globalOpacity<=.25&&snap.globalAnimations===0,lang+' '+brands[i]+' global path overactivation '+JSON.stringify(snap));

              if(visual&&i===2){
                await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');s.scrollIntoView({block:'center',behavior:'instant'});(s.__techR2LocalAnimations||[]).forEach(a=>{a.pause();a.currentTime=320;});});
                await screenshot(page,'/tmp/r13-evidence/r13-hover-gemini-en.png');
              }

              await pointer(page,i,'pointerleave');await sleep(260);
              const clean=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]'),tail=s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-signal'),core=s.querySelector('.home-tech-r2__relay-local-core');return{active:s.classList.contains('is-local-active'),n:(s.__techR2LocalAnimations||[]).length,tail:Number(getComputedStyle(tail).opacity),core:Number(getComputedStyle(core).opacity)};});
              assert(!clean.active&&clean.n===0&&clean.tail<=.01&&clean.core<=.01,lang+' '+brands[i]+' stale cleanup '+JSON.stringify(clean));
            }

            let previous=null;
            for(const i of [0,2,5,9]){if(previous!==null)await pointer(page,previous,'pointerleave');await pointer(page,i,'pointerenter');previous=i;await sleep(90);}
            const rapid=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');return{offset:s.style.getPropertyValue('--tech-r2-local-offset'),n:(s.__techR2LocalAnimations||[]).length,cores:s.querySelectorAll('.home-tech-r2__relay-local-core').length};});
            assert(rapid.offset==='-.88'&&rapid.n===2&&rapid.cores===1,lang+' rapid transition '+JSON.stringify(rapid));
            await sleep(800);
            const rapidClean=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');return{active:s.classList.contains('is-local-active'),n:(s.__techR2LocalAnimations||[]).length};});
            assert(!rapidClean.active&&rapidClean.n===0,lang+' rapid cleanup '+JSON.stringify(rapidClean));

            const layout=await page.evaluate(()=>{const de=document.documentElement,s=document.querySelector('[data-home-tech-r2]');return{doc:[de.clientWidth,de.scrollWidth],tech:[s.clientWidth,s.scrollWidth],count:s.querySelectorAll('.home-tech-r2__identity').length};});
            assert(layout.doc[1]<=layout.doc[0]+1&&layout.tech[1]<=layout.tech[0]+1&&layout.count===10,lang+' layout '+JSON.stringify(layout));
            assert(d.errors.length===0&&d.failed.length===0,lang+' diagnostics '+JSON.stringify(d));
            console.log('DESKTOP_PASS '+lang);

            if(visual){
              await page.evaluate(()=>document.querySelector('[data-home-tech-r2]').scrollIntoView({block:'center',behavior:'instant'}));
              const cdp=await context.newCDPSession(page);let frameNo=0;
              cdp.on('Page.screencastFrame',async e=>{try{frameNo++;fs.writeFileSync(`/tmp/r13-frames/frame-${String(frameNo).padStart(5,'0')}.jpg`,Buffer.from(e.data,'base64'));await cdp.send('Page.screencastFrameAck',{sessionId:e.sessionId});}catch{}});
              await cdp.send('Page.startScreencast',{format:'jpeg',quality:82,maxWidth:1440,maxHeight:900,everyNthFrame:1});
              let last=null;for(const i of [0,2,5,9]){if(last!==null)await pointer(page,last,'pointerleave');await pointer(page,i,'pointerenter');last=i;await sleep(520);}if(last!==null)await pointer(page,last,'pointerleave');await sleep(320);
              await cdp.send('Page.stopScreencast');await sleep(250);await cdp.detach();
              console.log('SCREENCAST_FRAMES '+frameNo);
            }
            await context.close();
          }

          async function mobile(label,w,h,landscape){
            const context=await browser.newContext({viewport:{width:w,height:h},hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),page=await context.newPage(),d=diagnostics(page);
            await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:20000});await ready(page);await visibleRatio(page,.68);await waitState(page,'settled');
            const x=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]'),m=s.querySelector('.home-tech-r2__relay--mobile'),desk=s.querySelector('.home-tech-r2__relay--desktop'),b=m.querySelector('.home-tech-r2__relay-base'),de=document.documentElement;return{mode:s.dataset.techR2RelayMode,viewBox:m.getAttribute('viewBox'),path:b.getAttribute('d'),mobile:getComputedStyle(m).display,desktop:getComputedStyle(desk).display,core:s.querySelectorAll('.home-tech-r2__relay-local-core').length,local:s.dataset.techR2LocalReady||'',count:s.querySelectorAll('.home-tech-r2__identity').length,overflow:de.scrollWidth-de.clientWidth};});
            if(landscape)assert(x.mode==='landscape'&&x.viewBox==='0 0 560 300'&&x.path===LANDSCAPE&&x.mobile!=='none'&&x.desktop==='none',label+' landscape lock '+JSON.stringify(x));
            else assert(x.mode==='portrait'&&x.viewBox==='0 0 400 520'&&x.path==='M200 0 V520',label+' portrait lock '+JSON.stringify(x));
            assert(x.core===0&&x.local!=='true'&&x.count===10&&x.overflow<=1&&d.errors.length===0&&d.failed.length===0,label+' mobile regression '+JSON.stringify({x,d}));
            console.log('MOBILE_PASS '+label);await context.close();
          }

          async function reduced(){
            const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:false,isMobile:false,reducedMotion:'reduce'}),page=await context.newPage();
            await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:20000});await ready(page);await waitState(page,'settled');
            const x=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');return{state:s.dataset.techR2State,core:s.querySelectorAll('.home-tech-r2__relay-local-core').length,local:s.dataset.techR2LocalReady||''};});
            assert(x.state==='settled'&&x.core===0&&x.local!=='true','reduced motion '+JSON.stringify(x));console.log('REDUCED_PASS');await context.close();
          }

          await desktop('EN',true);
          await desktop('RU',false);
          await mobile('PORTRAIT_390x844',390,844,false);
          await mobile('LANDSCAPE_844x390',844,390,true);
          await reduced();
          await browser.close();
          assert(fs.existsSync('/tmp/r13-evidence/r13-hover-gemini-en.png')&&fs.statSync('/tmp/r13-evidence/r13-hover-gemini-en.png').size>1000,'hover screenshot missing');
          console.log('R13_FINAL_QA=PASS');
          NODE
          QA_BASE="$QA_BASE" CHROME_PATH="$CHROME_PATH" node .r13-r3.mjs
          rm -f .r13-r3.mjs
          if [ -n "${FFMPEG_PATH:-}" ] && compgen -G '/tmp/r13-frames/frame-*.jpg' >/dev/null; then
            "$FFMPEG_PATH" -y -loglevel error -framerate 24 -pattern_type glob -i '/tmp/r13-frames/frame-*.jpg' -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/r13-evidence/r13-hover-preview.mp4 || true
          fi
          ls -l /tmp/r13-evidence

      - uses: actions/upload-artifact@v4
        with:
          name: technology-r13-owner-site
          path: _site
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: technology-r13-visual-evidence
          path: /tmp/r13-evidence
          if-no-files-found: error
          retention-days: 1

  preview:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      INFRA_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: technology-r13-owner-site
          path: _site

      - name: Publish fresh HTTPS Owner preview
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/r13-preview.log 2>&1 & P=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/cloudflared.log 2>&1 & T=$!
          trap 'kill "$T" 2>/dev/null||true;kill "$P" 2>/dev/null||true' EXIT
          URL=''; for i in $(seq 1 90); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log|tail -1||true); [ -n "$URL" ]&&break; sleep 1; done; test -n "$URL"
          OK=0; for i in $(seq 1 90); do if curl -fsSL --max-time 10 "$URL/" >/tmp/en && curl -fsSL --max-time 10 "$URL/ru/" >/tmp/ru; then OK=1;break;fi;sleep 1;done; test "$OK" -eq 1
          grep -q '04 / TECHNOLOGY ECOSYSTEM' /tmp/en
          grep -q '04 / ТЕХНОЛОГИЧЕСКАЯ ЭКОСИСТЕМА' /tmp/ru
          gh api --method POST "repos/$REPO/statuses/$INFRA_SHA" -f state=success -f target_url="$URL" -f context='owner-preview/technology-z-relay-r1-3' -f description='R1.3 QA PASS; Owner visual review live' >/dev/null
          echo "OWNER_REVIEW_URL=$URL"
          sleep 7200
