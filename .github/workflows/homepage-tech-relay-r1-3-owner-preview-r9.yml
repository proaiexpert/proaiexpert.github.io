name: Homepage Technology Z-Relay R1.3 Fresh Owner Preview R9

on:
  push:
    branches:
      - review/homepage-tech-relay-signal-r1-3-owner-preview-r9

permissions:
  contents: read
  statuses: write

env:
  PRODUCT_SHA: 7b0942a042ef23e10cd74592208eeae94479b45e
  SOURCE_RUN_ID: '33460013667'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      INFRA_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact R1.3 owner site artifact
        uses: actions/download-artifact@v4
        with:
          name: technology-r13-owner-site
          path: _site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33460013667

      - name: Verify exact R1.3 artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCT_SHA" = "7b0942a042ef23e10cd74592208eeae94479b45e"
          test -f _site/index.html
          test -f _site/ru/index.html
          grep -R -Fq "home-technology-transition-r2.js" _site

      - name: Publish one fresh HTTPS Owner preview
        shell: bash
        run: |
          set -euo pipefail

          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/r13-r9-server.log 2>&1 &
          SERVER_OK=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:4173/ru/ >/dev/null 2>&1; then
              SERVER_OK=1
              break
            fi
            sleep 1
          done
          test "$SERVER_OK" = "1"

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          FINAL_URL=''
          for attempt in $(seq 1 6); do
            LOG="/tmp/r13-r9-cloudflared-${attempt}.log"
            nohup /tmp/cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate >"$LOG" 2>&1 &
            TUNNEL_PID=$!

            URL=''
            for i in $(seq 1 60); do
              URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$LOG" | head -1 || true)
              [ -n "$URL" ] && break
              sleep 1
            done

            if [ -n "$URL" ]; then
              EN_OK=0
              RU_OK=0
              for i in $(seq 1 90); do
                if curl -fsSL --connect-timeout 5 --max-time 15 "$URL/" >/dev/null 2>&1; then EN_OK=1; fi
                if curl -fsSL --connect-timeout 5 --max-time 15 "$URL/ru/" >/dev/null 2>&1; then RU_OK=1; fi
                if [ "$EN_OK" = "1" ] && [ "$RU_OK" = "1" ]; then
                  FINAL_URL="$URL"
                  break
                fi
                sleep 2
              done
            fi

            if [ -n "$FINAL_URL" ]; then
              break
            fi

            kill "$TUNNEL_PID" >/dev/null 2>&1 || true
            sleep 3
          done

          test -n "$FINAL_URL"
          curl -fsSL "$FINAL_URL/" >/dev/null
          curl -fsSL "$FINAL_URL/ru/" >/dev/null

          api="https://api.github.com/repos/$REPO/statuses/$INFRA_SHA"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "{\"state\":\"success\",\"target_url\":\"$FINAL_URL\",\"description\":\"Exact R1.3 Owner Preview live\",\"context\":\"owner-preview/technology-z-relay-r1-3-fresh\"}"

          echo "OWNER_REVIEW_URL=$FINAL_URL"
          sleep 7200
