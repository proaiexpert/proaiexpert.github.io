name: Homepage Technology Z-Relay R1 Owner Preview R2

on:
  push:
    branches:
      - review/homepage-tech-relay-signal-r1-preview-r2

permissions:
  contents: read
  statuses: write

concurrency:
  group: homepage-tech-relay-r1-owner-preview-r2
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref == 'refs/heads/review/homepage-tech-relay-signal-r1-preview-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PRODUCT_SHA: 9794ad94235311d0002e6c005e31b3e447cc6048
      INFRA_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact approved product
        uses: actions/checkout@v4
        with:
          ref: 9794ad94235311d0002e6c005e31b3e447cc6048
          fetch-depth: 1

      - name: Verify frozen product identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "PRODUCT_SHA_VERIFIED=$PRODUCT_SHA"

      - name: Build exact Jekyll runtime and install browser QA
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start generated Jekyll site
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/proai-tech-preview-server.log 2>&1 &
          echo $! >/tmp/proai-tech-preview-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/local-en.html && \
               curl -fsS http://127.0.0.1:4173/ru/ -o /tmp/local-ru.html && \
               grep -q '04 / TECHNOLOGY ECOSYSTEM' /tmp/local-en.html && \
               grep -q '04 / ТЕХНОЛОГИЧЕСКАЯ ЭКОСИСТЕМА' /tmp/local-ru.html; then
              echo 'LOCAL_JEKYLL_RUNTIME_PASS'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/proai-tech-preview-server.log
          exit 1

      - name: Publish HTTPS preview and run browser QA
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local target="$2"
            local description="$3"
            gh api --method POST "repos/$REPO/statuses/$INFRA_SHA" \
              -f state="$state" \
              -f target_url="$target" \
              -f context='owner-preview/technology-z-relay-r1' \
              -f description="$description" >/dev/null
          }

          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/cloudflared-tech-preview.log 2>&1 &
          TUNNEL_PID=$!
          trap 'rm -f .technology-runtime-qa.mjs; kill "$TUNNEL_PID" 2>/dev/null || true; kill "$(cat /tmp/proai-tech-preview-server.pid 2>/dev/null)" 2>/dev/null || true' EXIT

          URL=''
          for i in $(seq 1 90); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-tech-preview.log | tail -1 || true)
            if [ -n "$URL" ]; then break; fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              cat /tmp/cloudflared-tech-preview.log
              exit 1
            fi
            sleep 1
          done
          test -n "$URL"
          echo "OWNER_REVIEW_URL=$URL"
          post_status pending "$URL" 'Preview live; runtime QA running'

          PUBLIC_OK=0
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 15 "$URL/" -o /tmp/public-en.html && \
               curl -fsSL --max-time 15 "$URL/ru/" -o /tmp/public-ru.html && \
               grep -q '04 / TECHNOLOGY ECOSYSTEM' /tmp/public-en.html && \
               grep -q '04 / ТЕХНОЛОГИЧЕСКАЯ ЭКОСИСТЕМА' /tmp/public-ru.html; then
              PUBLIC_OK=1
              break
            fi
            sleep 1
          done
          if [ "$PUBLIC_OK" -ne 1 ]; then
            post_status failure "$URL" 'Public Jekyll runtime failed'
            exit 1
          fi
          echo 'PUBLIC_JEKYLL_RUNTIME_PASS'

          cat >.technology-runtime-qa.mjs <<'NODE'
          import { chromium } from 'playwright';

          const base = process.env.PUBLIC_URL.replace(/\/$/, '');
          const origin = new URL(base).origin;
          const brands = ['openai','claude','gemini','n8n','make','twilio','vercel','gmail','zapier','github'];
          const names = ['OpenAI','Claude','Gemini','n8n','Make','Twilio','Vercel','Gmail','Zapier','GitHub'];
          const offsets = [-0.44,-0.37,-0.30,-0.23,-0.16,-0.68,-0.73,-0.78,-0.83,-0.88];
          const logoPaths = new Set(brands.map((b) => `/assets/brand/platforms/${b}-mark.svg`));

          function check(value, message) {
            if (!value) throw new Error(message);
          }

          function watch(page, label) {
            const d = { label, pageErrors: [], badSameOrigin: [], logoResponses: new Map() };
            page.on('pageerror', (error) => d.pageErrors.push(String(error)));
            page.on('response', (response) => {
              const u = new URL(response.url());
              if (u.origin === origin && response.status() >= 400) d.badSameOrigin.push({ url: response.url(), status: response.status() });
              if (u.origin === origin && logoPaths.has(u.pathname)) d.logoResponses.set(u.pathname, response.status());
            });
            return d;
          }

          async function openPage(page, route) {
            await page.goto(`${base}${route}`, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForSelector('[data-home-tech-r2]', { timeout: 30000 });
            await page.waitForTimeout(1500);
          }

          async function regression(page, label) {
            const r = await page.evaluate(() => {
              const selectors = {
                hero: '#hero', cube: '#cube-canvas', connected: '[data-connected-system]',
                twoWorlds: '[data-tw-r2]', technology: '[data-home-tech-r2]',
                financialStream: '[data-fs-showcase-r11]', selectedThinking: '[data-selected-thinking-r1]',
                selectedWork: '[data-selected-work-r11]', footer: '[data-home-footer-golden-r3]'
              };
              const counts = Object.fromEntries(Object.entries(selectors).map(([k,s]) => [k, document.querySelectorAll(s).length]));
              const canvas = document.querySelector('#cube-canvas');
              const rect = canvas?.getBoundingClientRect();
              let webgl = false;
              try { webgl = Boolean(canvas?.getContext('webgl2') || canvas?.getContext('webgl')); } catch (_) {}
              return {
                counts,
                cube: { rectW: rect?.width || 0, rectH: rect?.height || 0, bufferW: canvas?.width || 0, bufferH: canvas?.height || 0, webgl },
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth
              };
            });
            for (const [key,count] of Object.entries(r.counts)) check(count === 1, `${label}: ${key} count=${count}`);
            check(r.cube.rectW > 20 && r.cube.rectH > 20, `${label}: cube canvas invisible`);
            check(r.cube.bufferW > 20 && r.cube.bufferH > 20, `${label}: cube canvas buffer unavailable`);
            check(r.cube.webgl, `${label}: cube WebGL unavailable`);
            check(r.overflow <= 1, `${label}: horizontal overflow=${r.overflow}`);
          }

          async function scrollTech(page) {
            await page.evaluate(() => document.querySelector('[data-home-tech-r2]').scrollIntoView({ block: 'center', behavior: 'auto' }));
          }

          async function onePass(page, label, mode) {
            await scrollTech(page);
            await page.waitForFunction(() => document.querySelector('[data-home-tech-r2]')?.dataset.techR2State === 'assembling', null, { timeout: 2500 });
            await page.waitForTimeout(300);
            const mid = await page.evaluate((mode) => {
              const s = document.querySelector('[data-home-tech-r2]');
              const relay = s.querySelector(mode === 'mobile' ? '.home-tech-r2__relay--mobile' : '.home-tech-r2__relay--desktop');
              const signal = relay.querySelector('.home-tech-r2__relay-signal');
              const cs = getComputedStyle(signal);
              return {
                state: s.dataset.techR2State, assembling: s.classList.contains('is-assembling'), signalReady: s.dataset.techR2SignalReady,
                signalCount: s.querySelectorAll('.home-tech-r2__relay-signal').length, relayDisplay: getComputedStyle(relay).display,
                animation: cs.animationName, iterations: cs.animationIterationCount, opacity: Number(cs.opacity)
              };
            }, mode);
            check(mid.state === 'assembling' && mid.assembling, `${label}: assembly state missing`);
            check(mid.signalReady === 'true' && mid.signalCount === 2, `${label}: relay signal install failed`);
            check(mid.relayDisplay !== 'none', `${label}: intended relay hidden`);
            check(mid.animation.includes(mode === 'mobile' ? 'home-tech-r2-signal-pass-mobile' : 'home-tech-r2-signal-pass'), `${label}: signal animation missing: ${mid.animation}`);
            check(mid.iterations !== 'infinite', `${label}: signal loops`);
            check(mid.opacity > 0, `${label}: signal not visible during pass`);

            await page.waitForFunction(() => document.querySelector('[data-home-tech-r2]')?.dataset.techR2State === 'settled', null, { timeout: 5000 });
            await page.waitForTimeout(150);
            const settled = await page.evaluate((mode) => {
              const s = document.querySelector('[data-home-tech-r2]');
              const relay = s.querySelector(mode === 'mobile' ? '.home-tech-r2__relay--mobile' : '.home-tech-r2__relay--desktop');
              const signal = getComputedStyle(relay.querySelector('.home-tech-r2__relay-signal'));
              const active = getComputedStyle(relay.querySelector('.home-tech-r2__relay-active'));
              return { state: s.dataset.techR2State, assembling: s.classList.contains('is-assembling'), settled: s.classList.contains('is-settled'), signalOpacity: Number(signal.opacity), signalAnimation: signal.animationName, activeOpacity: Number(active.opacity) };
            }, mode);
            check(settled.state === 'settled' && settled.settled && !settled.assembling, `${label}: did not settle`);
            check(settled.signalOpacity <= 0.01 && settled.signalAnimation === 'none', `${label}: travelling signal persists after pass`);
            check(settled.activeOpacity <= 0.30, `${label}: settled relay too active ${settled.activeOpacity}`);

            await page.waitForTimeout(1200);
            const quiet = await page.evaluate((mode) => {
              const s = document.querySelector('[data-home-tech-r2]');
              const relay = s.querySelector(mode === 'mobile' ? '.home-tech-r2__relay--mobile' : '.home-tech-r2__relay--desktop');
              const signal = getComputedStyle(relay.querySelector('.home-tech-r2__relay-signal'));
              return { state: s.dataset.techR2State, opacity: Number(signal.opacity), animation: signal.animationName };
            }, mode);
            check(quiet.state === 'settled' && quiet.opacity <= 0.01 && quiet.animation === 'none', `${label}: signal restarted/persisted`);
          }

          async function logos(page, d, label) {
            await page.waitForFunction(() => {
              const imgs = [...document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__mark img')];
              return imgs.length === 10 && imgs.every((img) => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
            }, null, { timeout: 30000 });
            const list = await page.evaluate(() => [...document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__identity')].map((item) => {
              const img = item.querySelector('img'); const name = item.querySelector('.home-tech-r2__name'); const rect = img.getBoundingClientRect();
              return { brand: item.dataset.brand, name: name?.textContent?.trim(), complete: img.complete, nw: img.naturalWidth, nh: img.naturalHeight, vw: rect.width, vh: rect.height, nameW: name?.clientWidth || 0, nameScroll: name?.scrollWidth || 0 };
            }));
            check(list.length === 10, `${label}: logo count=${list.length}`);
            check(JSON.stringify(list.map(x=>x.brand)) === JSON.stringify(brands), `${label}: brand order mismatch`);
            check(JSON.stringify(list.map(x=>x.name)) === JSON.stringify(names), `${label}: vendor names mismatch`);
            for (const x of list) {
              check(x.complete && x.nw > 0 && x.nh > 0, `${label}: broken logo ${x.brand}`);
              check(x.vw > 0 && x.vh > 0, `${label}: invisible logo ${x.brand}`);
              check(x.nameW > 0 && x.nameScroll <= x.nameW + 1, `${label}: truncated name ${x.brand}`);
            }
            check(d.logoResponses.size === 10, `${label}: logo network count=${d.logoResponses.size} ${JSON.stringify([...d.logoResponses.entries()])}`);
            for (const path of logoPaths) {
              const status = d.logoResponses.get(path);
              check(status >= 200 && status < 400, `${label}: logo HTTP failure ${path} ${status}`);
            }
          }

          async function desktopLocal(page, label) {
            check(await page.evaluate(() => matchMedia('(hover: hover) and (pointer: fine)').matches), `${label}: fine pointer unavailable`);
            const items = page.locator('[data-home-tech-r2] .home-tech-r2__identity');
            for (let i=0; i<10; i++) {
              await items.nth(i).hover();
              await page.waitForFunction(() => document.querySelector('[data-home-tech-r2]').classList.contains('is-local-active'), null, { timeout: 1500 });
              const local = await page.evaluate(() => {
                const s = document.querySelector('[data-home-tech-r2]');
                const signal = getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-signal'));
                const active = getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-active'));
                return { offset: parseFloat(s.style.getPropertyValue('--tech-r2-local-offset')), assembling: s.classList.contains('is-assembling'), animation: signal.animationName, activeOpacity: Number(active.opacity) };
              });
              check(Math.abs(local.offset - offsets[i]) < 0.001, `${label}: local position ${i} mismatch ${local.offset}`);
              check(!local.assembling, `${label}: global assembly restarted on hover ${i}`);
              check(local.animation.includes('home-tech-r2-local-relay-catch'), `${label}: local response missing ${i}`);
              check(local.activeOpacity <= 0.35, `${label}: local hover over-activates full relay ${i}`);
              await page.locator('[data-home-tech-r2] .home-tech-r2__heading').hover();
              await page.waitForFunction(() => !document.querySelector('[data-home-tech-r2]').classList.contains('is-local-active'), null, { timeout: 1500 });
            }
          }

          async function mobileForm(page, label) {
            const s = await page.evaluate(() => {
              const section = document.querySelector('[data-home-tech-r2]');
              return {
                desktop: getComputedStyle(section.querySelector('.home-tech-r2__relay--desktop')).display,
                mobile: getComputedStyle(section.querySelector('.home-tech-r2__relay--mobile')).display,
                fine: matchMedia('(hover: hover) and (pointer: fine)').matches,
                coarse: matchMedia('(hover: none), (pointer: coarse)').matches,
                localReady: section.dataset.techR2LocalReady || '',
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth
              };
            });
            check(s.desktop === 'none' && s.mobile !== 'none', `${label}: wrong mobile relay form`);
            check(!s.fine && s.coarse, `${label}: wrong touch media state`);
            check(s.localReady !== 'true', `${label}: desktop hover listeners installed on touch`);
            check(s.overflow <= 1, `${label}: horizontal overflow=${s.overflow}`);
            await page.locator('[data-home-tech-r2] .home-tech-r2__identity').first().tap();
            await page.waitForTimeout(100);
            check(!await page.evaluate(() => document.querySelector('[data-home-tech-r2]').classList.contains('is-local-active')), `${label}: fake touch hover activation`);
          }

          async function reduced(page, label) {
            await scrollTech(page);
            await page.waitForFunction(() => document.querySelector('[data-home-tech-r2]')?.dataset.techR2State === 'settled', null, { timeout: 2500 });
            const s = await page.evaluate(() => {
              const section = document.querySelector('[data-home-tech-r2]');
              const identity = getComputedStyle(section.querySelector('.home-tech-r2__identity'));
              const signal = getComputedStyle(section.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-signal'));
              const material = getComputedStyle(section.querySelector('.home-tech-r2__material'));
              return { reduce: matchMedia('(prefers-reduced-motion: reduce)').matches, state: section.dataset.techR2State, assembling: section.classList.contains('is-assembling'), local: section.classList.contains('is-local-active'), signalAnimation: signal.animationName, signalOpacity: Number(signal.opacity), identityAnimation: identity.animationName, identityOpacity: Number(identity.opacity), materialAnimation: material.animationName, overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth };
            });
            check(s.reduce && s.state === 'settled' && !s.assembling && !s.local, `${label}: reduced-motion state wrong`);
            check(s.signalAnimation === 'none' && s.signalOpacity <= 0.01, `${label}: travelling signal active under reduce`);
            check(s.identityAnimation === 'none' && s.identityOpacity >= 0.99, `${label}: identities not static/visible under reduce`);
            check(s.materialAnimation === 'none', `${label}: material animation active under reduce`);
            check(s.overflow <= 1, `${label}: reduced-motion overflow=${s.overflow}`);
          }

          function finish(d) {
            check(d.pageErrors.length === 0, `${d.label}: JS errors ${JSON.stringify(d.pageErrors)}`);
            check(d.badSameOrigin.length === 0, `${d.label}: same-origin HTTP errors ${JSON.stringify(d.badSameOrigin)}`);
          }

          const browser = await chromium.launch({ headless: true });
          const summary = { desktop: {}, mobile: {}, reducedMotion: {} };

          for (const route of ['/', '/ru/']) {
            const label = route === '/' ? 'EN desktop' : 'RU desktop';
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1, reducedMotion: 'no-preference', hasTouch: false, isMobile: false });
            const page = await context.newPage(); const d = watch(page,label);
            await openPage(page,route); await regression(page,label); await onePass(page,label,'desktop'); await logos(page,d,label); await desktopLocal(page,label); finish(d);
            summary.desktop[label] = 'PASS'; await context.close();
          }

          for (const width of [430,390,375,360,320]) {
            for (const route of ['/', '/ru/']) {
              const lang = route === '/' ? 'EN' : 'RU'; const label = `${lang} mobile ${width}`;
              const context = await browser.newContext({ viewport: { width, height: 900 }, deviceScaleFactor: 1, reducedMotion: 'no-preference', hasTouch: true, isMobile: true });
              const page = await context.newPage(); const d = watch(page,label);
              await openPage(page,route); await regression(page,label); await onePass(page,label,'mobile'); await logos(page,d,label); await mobileForm(page,label); finish(d);
              summary.mobile[label] = 'PASS'; await context.close();
            }
          }

          for (const route of ['/', '/ru/']) {
            const label = route === '/' ? 'EN reduced-motion' : 'RU reduced-motion';
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1, reducedMotion: 'reduce', hasTouch: false, isMobile: false });
            const page = await context.newPage(); const d = watch(page,label);
            await openPage(page,route); await regression(page,label); await reduced(page,label); await logos(page,d,label); finish(d);
            summary.reducedMotion[label] = 'PASS'; await context.close();
          }

          await browser.close();
          console.log('TECHNOLOGY_RUNTIME_QA_PASS', JSON.stringify(summary));
          NODE

          if ! PUBLIC_URL="$URL" node .technology-runtime-qa.mjs; then
            post_status failure "$URL" 'Technology runtime QA failed'
            exit 1
          fi
          rm -f .technology-runtime-qa.mjs

          post_status success "$URL" 'Runtime QA PASS; preview live'
          echo 'TECHNOLOGY_RUNTIME=PASS'
          echo 'LOGOS=PASS_10_OF_10'
          echo 'EN=PASS'
          echo 'RU=PASS'
          echo 'DESKTOP=PASS'
          echo 'MOBILE_430=PASS'
          echo 'MOBILE_390=PASS'
          echo 'MOBILE_375=PASS'
          echo 'MOBILE_360=PASS'
          echo 'MOBILE_320=PASS'
          echo 'REDUCED_MOTION=PASS'
          echo 'REGRESSION_BOUNDARY=PASS'
          echo "OWNER_REVIEW_URL=$URL"
          echo 'REVIEW_WINDOW_SECONDS=3600'

          sleep 3600
