name: Homepage Technology Z-Relay R1 Desktop Local Closeout

on:
  push:
    branches:
      - review/homepage-tech-relay-signal-r1-preview-r5

permissions:
  contents: read
  statuses: write

concurrency:
  group: homepage-tech-relay-r1-owner-preview-r5
  cancel-in-progress: true

env:
  PRODUCT_SHA: 9794ad94235311d0002e6c005e31b3e447cc6048
  QA_BASE: http://127.0.0.1:4173

jobs:
  desktop_local_qa:
    runs-on: ubuntu-latest
    outputs:
      qa_rc: ${{ steps.local.outputs.qa_rc }}
    steps:
      - name: Checkout exact approved product
        uses: actions/checkout@v4
        with:
          ref: 9794ad94235311d0002e6c005e31b3e447cc6048
          fetch-depth: 1

      - name: Verify exact approved product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "PRODUCT_SHA_VERIFIED=$PRODUCT_SHA"

      - name: Build exact product and prepare Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          npm install --no-save --package-lock=false playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Start exact generated Jekyll site
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/proai-tech-preview-server.log 2>&1 &
          echo $! >/tmp/proai-tech-preview-server.pid
          for i in $(seq 1 30); do
            if curl -fsS "$QA_BASE/" -o /tmp/en.html && curl -fsS "$QA_BASE/ru/" -o /tmp/ru.html; then
              grep -q '04 / TECHNOLOGY ECOSYSTEM' /tmp/en.html
              grep -q '04 / ТЕХНОЛОГИЧЕСКАЯ ЭКОСИСТЕМА' /tmp/ru.html
              echo LOCAL_JEKYLL_RUNTIME_PASS
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run raw-pointer desktop local response closeout
        id: local
        shell: bash
        run: |
          set -euo pipefail
          cat >.technology-desktop-local-closeout.mjs <<'NODE'
          import { chromium } from 'playwright-core';

          const base=process.env.QA_BASE.replace(/\/$/,'');
          const origin=new URL(base).origin;
          const chromePath=process.env.CHROME_PATH;
          const brands=['openai','claude','gemini','n8n','make','twilio','vercel','gmail','zapier','github'];
          const offsets=[-.44,-.37,-.30,-.23,-.16,-.68,-.73,-.78,-.83,-.88];
          const logoPaths=new Set(brands.map(b=>`/assets/brand/platforms/${b}-mark.svg`));
          const techAssets=new Set(['/assets/css/home-technology-transition-r2.css','/assets/css/home-technology-transition-r2-golden-mobile.css','/assets/js/home-technology-transition-r2.js',...logoPaths]);
          const results={};
          function assert(v,m){if(!v)throw new Error(m);}

          async function stage(page,lang,name,fn){
            const label=`${lang}_${name}`;
            console.log(`STAGE_START ${label}`);
            try{const x=await fn();console.log(`STAGE_PASS ${label} ${JSON.stringify(x??{})}`);return x;}
            catch(e){console.log(`STAGE_FAIL ${label} ${String(e?.message||e)}`);throw new Error(`${label}: ${String(e?.message||e)}`);}
          }

          async function waitSettled(page){
            return page.evaluate(async()=>{
              const s=document.querySelector('[data-home-tech-r2]');
              if(!s)throw new Error('Technology section missing');
              if(s.dataset.techR2State==='settled')return{state:'settled',existing:true};
              return new Promise((resolve,reject)=>{
                const check=()=>{if(s.dataset.techR2State==='settled'){mo.disconnect();clearTimeout(to);resolve({state:'settled',existing:false,time:performance.now()});}};
                const mo=new MutationObserver(check);
                mo.observe(s,{attributes:true,attributeFilter:['class','data-tech-r2-state']});
                const to=setTimeout(()=>{mo.disconnect();reject(new Error('settled precondition observer timeout'));},25000);
                check();
              });
            });
          }

          async function run(lang){
            const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:false,isMobile:false,reducedMotion:'no-preference'});
            const page=await context.newPage();
            const diag={techErrors:[],techBad:[]};
            page.on('pageerror',e=>{const t=String(e?.stack||e||'');if(/home-technology-transition-r2|techR2|home-tech-r2/i.test(t))diag.techErrors.push(t);});
            page.on('response',r=>{const u=new URL(r.url());if(u.origin===origin&&techAssets.has(u.pathname)&&r.status()>=400)diag.techBad.push({url:r.url(),status:r.status()});});
            page.on('requestfailed',r=>{const u=new URL(r.url());if(u.origin===origin&&techAssets.has(u.pathname))diag.techBad.push({url:r.url(),failure:r.failure()?.errorText||'requestfailed'});});
            try{
              await stage(page,lang,'DESKTOP_LOCAL_SETUP',async()=>{
                await page.goto(`${base}${lang==='EN'?'/':'/ru/'}`,{waitUntil:'domcontentloaded',timeout:15000});
                await page.waitForSelector('[data-home-tech-r2]',{state:'attached',timeout:10000});
                const ready=await page.evaluate(async()=>{
                  const s=document.querySelector('[data-home-tech-r2]');
                  if(s.dataset.techR2SignalReady==='true'&&s.dataset.techR2LocalReady==='true')return true;
                  return new Promise((resolve,reject)=>{
                    const check=()=>{if(s.dataset.techR2SignalReady==='true'&&s.dataset.techR2LocalReady==='true'){mo.disconnect();clearTimeout(to);resolve(true);}};
                    const mo=new MutationObserver(check);mo.observe(s,{attributes:true});
                    const to=setTimeout(()=>{mo.disconnect();reject(new Error('Technology listeners install timeout'));},12000);check();
                  });
                });
                const media=await page.evaluate(()=>({fine:matchMedia('(hover:hover) and (pointer:fine)').matches,w:innerWidth,h:innerHeight}));
                if(!media.fine)throw new Error('TEST_HARNESS_FALSE_NEGATIVE: fine-pointer media false');
                return{ready,media};
              });

              await stage(page,lang,'DESKTOP_LOCAL_PRECONDITION',async()=>{
                const moved=await page.evaluate(()=>{
                  const s=document.querySelector('[data-home-tech-r2]');
                  const target=Math.max(0,window.scrollY+s.getBoundingClientRect().top-Math.round(innerHeight*.25));
                  window.scrollTo({top:target,behavior:'instant'});
                  const r=s.getBoundingClientRect();return{target,scrollY:window.scrollY,top:r.top,bottom:r.bottom};
                });
                assert(Math.abs(moved.scrollY-moved.target)<=2,`${lang}: viewport entry mismatch`);
                const settled=await waitSettled(page);
                const state=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');return{state:s.dataset.techR2State,assembling:s.classList.contains('is-assembling'),settled:s.classList.contains('is-settled'),desktop:getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop')).display,mobile:getComputedStyle(s.querySelector('.home-tech-r2__relay--mobile')).display};});
                assert(state.state==='settled'&&state.settled&&!state.assembling,`${lang}: local precondition not settled`);
                return{moved,settled,state};
              });

              await stage(page,lang,'DESKTOP_FINE_POINTER',async()=>{
                const x=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');return{fine:matchMedia('(hover:hover) and (pointer:fine)').matches,localReady:s.dataset.techR2LocalReady||''};});
                if(!x.fine)throw new Error('TEST_HARNESS_FALSE_NEGATIVE: fine-pointer media false');
                assert(x.localReady==='true',`${lang}: local listeners not installed`);
                return x;
              });

              await stage(page,lang,'DESKTOP_LOCAL_RESPONSE',async()=>{
                const geometry=await page.evaluate(()=>[...document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__identity')].map(i=>{const r=i.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;const hit=document.elementFromPoint(x,y);return{brand:i.dataset.brand,left:r.left,top:r.top,width:r.width,height:r.height,x,y,hitBrand:hit?.closest?.('.home-tech-r2__identity')?.dataset?.brand||'',hitTag:hit?.tagName||''};}));
                assert(geometry.length===10,`${lang}: identity geometry count ${geometry.length}`);
                assert(JSON.stringify(geometry.map(x=>x.brand))===JSON.stringify(brands),`${lang}: identity order mismatch`);
                const out=[];
                for(let i=0;i<10;i++){
                  const g=geometry[i];
                  assert(g.width>0&&g.height>0,`${lang}: ${brands[i]} zero geometry`);
                  assert(g.hitBrand===brands[i],`${lang}: ${brands[i]} center hit ${g.hitBrand||g.hitTag}`);
                  await page.mouse.move(g.x,g.y);
                  const active=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]'),sig=getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-signal')),act=getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-active'));return{local:s.classList.contains('is-local-active'),rawOffset:s.style.getPropertyValue('--tech-r2-local-offset'),offset:parseFloat(s.style.getPropertyValue('--tech-r2-local-offset')),animation:sig.animationName,assembling:s.classList.contains('is-assembling'),globalOpacity:Number(act.opacity)};});
                  assert(active.local,`${lang}: ${brands[i]} did not activate`);
                  assert(Math.abs(active.offset-offsets[i])<.001,`${lang}: ${brands[i]} offset ${active.rawOffset}`);
                  assert(active.animation.includes('home-tech-r2-local-relay-catch'),`${lang}: ${brands[i]} animation ${active.animation}`);
                  assert(!active.assembling,`${lang}: ${brands[i]} restarted assembly`);
                  assert(active.globalOpacity<=.35,`${lang}: ${brands[i]} global opacity ${active.globalOpacity}`);
                  await page.mouse.move(2,2);
                  const cleared=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');return{local:s.classList.contains('is-local-active'),offset:s.style.getPropertyValue('--tech-r2-local-offset')};});
                  assert(!cleared.local&&cleared.offset==='',`${lang}: ${brands[i]} pointer leave did not clear`);
                  const row={brand:brands[i],offset:active.offset,hit:g.hitBrand,localAnimation:active.animation,globalOpacity:active.globalOpacity,leaveCleared:true};
                  out.push(row);console.log(`LOCAL_PASS ${lang} ${brands[i]} ${JSON.stringify(row)}`);
                }
                return out;
              });

              await stage(page,lang,'DESKTOP_LAYOUT',async()=>{
                const x=await page.evaluate(()=>{const d=document.documentElement,s=document.querySelector('[data-home-tech-r2]');return{docClient:d.clientWidth,docScroll:d.scrollWidth,techClient:s.clientWidth,techScroll:s.scrollWidth,count:s.querySelectorAll('.home-tech-r2__identity').length,desktop:getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop')).display,mobile:getComputedStyle(s.querySelector('.home-tech-r2__relay--mobile')).display};});
                assert(x.docScroll<=x.docClient+1,`${lang}: document overflow ${x.docScroll-x.docClient}`);
                assert(x.techScroll<=x.techClient+1,`${lang}: Technology overflow ${x.techScroll-x.techClient}`);
                assert(x.count===10,`${lang}: identity count ${x.count}`);
                assert(x.desktop!=='none'&&x.mobile==='none',`${lang}: relay visibility wrong`);
                return x;
              });

              await stage(page,lang,'DESKTOP_REGRESSION',async()=>{
                const x=await page.evaluate(()=>{const selectors={hero:'#hero',cubeMount:'#proai-hero-cube-mount',cubeCanvas:'#cube-canvas',connected:'[data-connected-system]',twoWorlds:'[data-tw-r2]',financial:'[data-fs-showcase-r11]',thinking:'[data-selected-thinking-r1]',work:'[data-selected-work-r11]',footer:'[data-home-footer-golden-r3]'};const counts=Object.fromEntries(Object.entries(selectors).map(([k,v])=>[k,document.querySelectorAll(v).length]));const cubeRuntime=[...document.scripts].some(s=>/proai-hero-cube-r1\/bootstrap-golden-r1-2\.js/.test(s.src));return{counts,cubeRuntime};});
                for(const[k,v]of Object.entries(x.counts))assert(v===1,`${lang}: ${k} count ${v}`);
                assert(x.cubeRuntime,`${lang}: cube runtime missing`);
                return x;
              });

              await stage(page,lang,'DESKTOP_NETWORK',async()=>{assert(diag.techBad.length===0,`${lang}: Technology asset failures ${JSON.stringify(diag.techBad)}`);return{techBad:diag.techBad};});
              await stage(page,lang,'DESKTOP_JS_ERRORS',async()=>{assert(diag.techErrors.length===0,`${lang}: Technology JS errors ${JSON.stringify(diag.techErrors)}`);return{techErrors:diag.techErrors};});
              results[lang]={status:'PASS'};console.log(`DESKTOP_LOCAL_PASS ${lang}`);
            }catch(e){results[lang]={status:'FAIL',error:String(e?.message||e)};console.log(`DESKTOP_LOCAL_FAIL ${lang} ${results[lang].error}`);}
            finally{await context.close();}
          }

          const browser=await chromium.launch({executablePath:chromePath,headless:true,args:['--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist']});
          for(const lang of ['EN','RU'])await run(lang);
          await browser.close();
          console.log('DESKTOP_LOCAL_RESULTS '+JSON.stringify(results));
          process.exit(Object.values(results).every(x=>x.status==='PASS')?0:2);
          NODE

          set +e
          QA_BASE="$QA_BASE" CHROME_PATH="$CHROME_PATH" node .technology-desktop-local-closeout.mjs
          QA_RC=$?
          set -e
          rm -f .technology-desktop-local-closeout.mjs
          echo "qa_rc=$QA_RC" >> "$GITHUB_OUTPUT"
          if [ "$QA_RC" -eq 0 ]; then echo DESKTOP_LOCAL_RUNTIME=PASS; else echo DESKTOP_LOCAL_RUNTIME=FAIL; fi

      - name: Upload exact generated site for Owner preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technology-r5-generated-site
          path: _site
          retention-days: 1

  preview:
    needs: desktop_local_qa
    if: needs.desktop_local_qa.outputs.qa_rc == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      INFRA_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact generated site
        uses: actions/download-artifact@v4
        with:
          name: technology-r5-generated-site
          path: _site

      - name: Publish HTTPS Owner preview and hold review window
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/proai-tech-preview-server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          trap 'kill "$TUNNEL_PID" 2>/dev/null || true; kill "$SERVER_PID" 2>/dev/null || true' EXIT
          post_status(){ gh api --method POST "repos/$REPO/statuses/$INFRA_SHA" -f state="$1" -f target_url="$2" -f context='owner-preview/technology-z-relay-r1' -f description="$3" >/dev/null; }
          URL=''
          for i in $(seq 1 90); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -1 || true)
            [ -n "$URL" ] && break
            kill -0 "$TUNNEL_PID" 2>/dev/null || { cat /tmp/cloudflared.log; exit 1; }
            sleep 1
          done
          test -n "$URL"
          READY=0
          for i in $(seq 1 90); do
            if curl -fsSL --max-time 10 "$URL/" -o /tmp/public-en.html && curl -fsSL --max-time 10 "$URL/ru/" -o /tmp/public-ru.html; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          echo "OWNER_REVIEW_URL=$URL"
          post_status success "$URL" 'Desktop Chrome QA PASS; Owner preview live'
          echo REVIEW_WINDOW_SECONDS=7200
          sleep 7200
