name: Homepage Technology Z-Relay R1 Owner Preview R5

on:
  push:
    branches:
      - review/homepage-tech-relay-signal-r1-preview-r5

permissions:
  contents: read
  statuses: write

concurrency:
  group: homepage-tech-relay-r1-owner-preview-r5
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref == 'refs/heads/review/homepage-tech-relay-signal-r1-preview-r5'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      PRODUCT_SHA: 9794ad94235311d0002e6c005e31b3e447cc6048
      INFRA_SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact approved product
        uses: actions/checkout@v4
        with:
          ref: 9794ad94235311d0002e6c005e31b3e447cc6048
          fetch-depth: 1

      - name: Verify exact approved product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "PRODUCT_SHA_VERIFIED=$PRODUCT_SHA"

      - name: Build Jekyll and prepare Chrome QA
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          npm install --no-save --package-lock=false playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Start exact generated Jekyll site
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >/tmp/proai-tech-preview-server.log 2>&1 &
          echo $! >/tmp/proai-tech-preview-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/en.html && \
               curl -fsS http://127.0.0.1:4173/ru/ -o /tmp/ru.html && \
               grep -q '04 / TECHNOLOGY ECOSYSTEM' /tmp/en.html && \
               grep -q '04 / ТЕХНОЛОГИЧЕСКАЯ ЭКОСИСТЕМА' /tmp/ru.html; then
              echo LOCAL_JEKYLL_RUNTIME_PASS
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Publish HTTPS preview, run Google Chrome runtime QA, hold Owner preview
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            gh api --method POST "repos/$REPO/statuses/$INFRA_SHA" \
              -f state="$1" -f target_url="$2" \
              -f context='owner-preview/technology-z-relay-r1' \
              -f description="$3" >/dev/null
          }

          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          trap 'rm -f .technology-r5-qa.mjs; kill "$TUNNEL_PID" 2>/dev/null || true; kill "$(cat /tmp/proai-tech-preview-server.pid 2>/dev/null)" 2>/dev/null || true' EXIT

          URL=''
          for i in $(seq 1 90); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -1 || true)
            [ -n "$URL" ] && break
            kill -0 "$TUNNEL_PID" 2>/dev/null || { cat /tmp/cloudflared.log; exit 1; }
            sleep 1
          done
          test -n "$URL"
          echo "OWNER_REVIEW_URL=$URL"
          post_status pending "$URL" 'Preview live; Chrome runtime QA running'

          READY=0
          for i in $(seq 1 90); do
            if curl -fsSL --max-time 20 "$URL/" -o /tmp/public-en.html && curl -fsSL --max-time 20 "$URL/ru/" -o /tmp/public-ru.html; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1

          for brand in openai claude gemini n8n make twilio vercel gmail zapier github; do
            curl -fsSL --retry 4 --retry-delay 1 --max-time 20 "$URL/assets/brand/platforms/${brand}-mark.svg" -o "/tmp/${brand}.svg"
            test -s "/tmp/${brand}.svg"
          done
          echo PUBLIC_NETWORK_LOGOS_PASS_10_OF_10

          cat >.technology-r5-qa.mjs <<'NODE'
          import { chromium } from 'playwright-core';

          const base = process.env.PUBLIC_URL.replace(/\/$/, '');
          const origin = new URL(base).origin;
          const chromePath = process.env.CHROME_PATH;
          const brands = ['openai','claude','gemini','n8n','make','twilio','vercel','gmail','zapier','github'];
          const names = ['OpenAI','Claude','Gemini','n8n','Make','Twilio','Vercel','Gmail','Zapier','GitHub'];
          const offsets = [-.44,-.37,-.30,-.23,-.16,-.68,-.73,-.78,-.83,-.88];
          const logoPaths = new Set(brands.map(b => `/assets/brand/platforms/${b}-mark.svg`));
          const results = {};

          function assert(v, m) { if (!v) throw new Error(m); }
          function record(key, fn) {
            return (async () => {
              try { await fn(); results[key] = { status:'PASS' }; console.log(`CASE_PASS ${key}`); }
              catch (e) { results[key] = { status:'FAIL', error:String(e?.message || e) }; console.log(`CASE_FAIL ${key} ${String(e?.message || e)}`); }
            })();
          }

          const browser = await chromium.launch({ executablePath: chromePath, headless:true, args:['--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist'] });

          async function setup(page, label) {
            const diag = { errors:[], bad:[], logoStatus:new Map() };
            page.on('pageerror', e => diag.errors.push(String(e)));
            page.on('response', r => {
              const u = new URL(r.url());
              if (u.origin === origin && r.status() >= 400) diag.bad.push({url:r.url(),status:r.status()});
              if (u.origin === origin && logoPaths.has(u.pathname)) diag.logoStatus.set(u.pathname, r.status());
            });
            await page.addInitScript(() => {
              window.__techEvents = [];
              document.addEventListener('animationstart', e => {
                if (e.target?.classList?.contains('home-tech-r2__relay-signal')) window.__techEvents.push({type:'start',name:e.animationName,elapsed:e.elapsedTime});
              }, true);
              document.addEventListener('animationend', e => {
                if (e.target?.classList?.contains('home-tech-r2__relay-signal')) window.__techEvents.push({type:'end',name:e.animationName,elapsed:e.elapsedTime});
              }, true);
            });
            await page.goto(`${base}${label === 'EN' ? '/' : '/ru/'}`, { waitUntil:'load', timeout:120000 });
            await page.waitForSelector('[data-home-tech-r2]', { timeout:30000 });
            await page.waitForFunction(() => document.querySelector('[data-home-tech-r2]')?.dataset.techR2SignalReady === 'true', null, {timeout:10000});
            return diag;
          }

          async function enterTech(page) {
            await page.evaluate(() => {
              const s = document.querySelector('[data-home-tech-r2]');
              const y = window.scrollY + s.getBoundingClientRect().top - Math.round(innerHeight * .25);
              window.scrollTo({top:Math.max(0,y),behavior:'instant'});
            });
            await page.waitForFunction(() => {
              const r = document.querySelector('[data-home-tech-r2]').getBoundingClientRect();
              return r.top < innerHeight && r.bottom > 0;
            }, null, {timeout:5000});
          }

          async function logos(page, diag, label) {
            await page.waitForFunction(() => {
              const imgs=[...document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__mark img')];
              return imgs.length===10 && imgs.every(i=>i.complete && i.naturalWidth>0 && i.naturalHeight>0);
            }, null, {timeout:30000});
            const x=await page.evaluate(() => [...document.querySelectorAll('[data-home-tech-r2] .home-tech-r2__identity')].map(i=>{
              const img=i.querySelector('img'), name=i.querySelector('.home-tech-r2__name'), r=img.getBoundingClientRect();
              return {brand:i.dataset.brand,name:name.textContent.trim(),complete:img.complete,nw:img.naturalWidth,nh:img.naturalHeight,vw:r.width,vh:r.height,cw:name.clientWidth,sw:name.scrollWidth};
            }));
            assert(x.length===10,`${label}: DOM logo count ${x.length}`);
            assert(JSON.stringify(x.map(i=>i.brand))===JSON.stringify(brands),`${label}: brand order mismatch`);
            assert(JSON.stringify(x.map(i=>i.name))===JSON.stringify(names),`${label}: names mismatch`);
            for(const i of x){assert(i.complete&&i.nw>0&&i.nh>0,`${label}: broken ${i.brand}`);assert(i.vw>0&&i.vh>0,`${label}: invisible ${i.brand}`);assert(i.sw<=i.cw+1,`${label}: truncated ${i.brand}`);}
            assert(diag.logoStatus.size===10,`${label}: browser network logo count ${diag.logoStatus.size}`);
            for(const p of logoPaths){const s=diag.logoStatus.get(p);assert(s>=200&&s<400,`${label}: logo request ${p} status ${s}`);}
          }

          async function firstPass(page, mode, label) {
            await enterTech(page);
            const expected=mode==='mobile'?'home-tech-r2-signal-pass-mobile':'home-tech-r2-signal-pass';
            await page.waitForFunction(() => ['assembling','settled'].includes(document.querySelector('[data-home-tech-r2]')?.dataset.techR2State), null, {timeout:5000});
            await page.waitForFunction(n => window.__techEvents.some(e=>e.type==='start'&&e.name===n), expected, {timeout:5000});
            await page.waitForFunction(n => window.__techEvents.some(e=>e.type==='end'&&e.name===n), expected, {timeout:5000});
            await page.waitForFunction(() => document.querySelector('[data-home-tech-r2]')?.dataset.techR2State==='settled', null, {timeout:5000});
            const s=await page.evaluate((expected,mode)=>{
              const section=document.querySelector('[data-home-tech-r2]');
              const relay=section.querySelector(mode==='mobile'?'.home-tech-r2__relay--mobile':'.home-tech-r2__relay--desktop');
              const signal=getComputedStyle(relay.querySelector('.home-tech-r2__relay-signal'));
              const active=getComputedStyle(relay.querySelector('.home-tech-r2__relay-active'));
              return {starts:window.__techEvents.filter(e=>e.type==='start'&&e.name===expected),ends:window.__techEvents.filter(e=>e.type==='end'&&e.name===expected),state:section.dataset.techR2State,assembling:section.classList.contains('is-assembling'),settled:section.classList.contains('is-settled'),signalOpacity:Number(signal.opacity),signalAnimation:signal.animationName,activeOpacity:Number(active.opacity),relayDisplay:getComputedStyle(relay).display};
            },expected,mode);
            assert(s.relayDisplay!=='none',`${label}: intended relay hidden`);
            assert(s.starts.length===1&&s.ends.length===1,`${label}: pass start/end ${s.starts.length}/${s.ends.length}`);
            assert(s.ends[0].elapsed>1&&s.ends[0].elapsed<2,`${label}: pass duration ${s.ends[0].elapsed}`);
            assert(s.state==='settled'&&s.settled&&!s.assembling,`${label}: did not settle`);
            assert(s.signalOpacity<=.01&&s.signalAnimation==='none',`${label}: signal persists`);
            assert(s.activeOpacity<=.30,`${label}: settled relay too active ${s.activeOpacity}`);
            await page.waitForTimeout(1200);
            const count=await page.evaluate(n=>window.__techEvents.filter(e=>e.type==='start'&&e.name===n).length,expected);
            assert(count===1,`${label}: signal loop/restart ${count}`);
          }

          async function desktopLocal(page,label){
            assert(await page.evaluate(()=>matchMedia('(hover:hover) and (pointer:fine)').matches),`${label}: fine pointer media not active`);
            const items=page.locator('[data-home-tech-r2] .home-tech-r2__identity');
            for(let i=0;i<10;i++){
              await items.nth(i).hover();
              await page.waitForFunction(()=>document.querySelector('[data-home-tech-r2]').classList.contains('is-local-active'),null,{timeout:1500});
              const x=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]'),sig=getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-signal')),act=getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-active'));return{offset:parseFloat(s.style.getPropertyValue('--tech-r2-local-offset')),animation:sig.animationName,assembling:s.classList.contains('is-assembling'),active:Number(act.opacity)}});
              assert(Math.abs(x.offset-offsets[i])<.001,`${label}: local offset ${i+1} ${x.offset}`);
              assert(x.animation.includes('home-tech-r2-local-relay-catch'),`${label}: no local response ${i+1}`);
              assert(!x.assembling,`${label}: assembly restarted ${i+1}`);
              assert(x.active<=.35,`${label}: global relay overactivated ${i+1}`);
              await page.mouse.move(2,2);
              await page.waitForFunction(()=>!document.querySelector('[data-home-tech-r2]').classList.contains('is-local-active'),null,{timeout:1500});
            }
          }

          async function regression(page,label){
            await page.waitForTimeout(500);
            const x=await page.evaluate(()=>{
              const selectors={hero:'#hero',cube:'#cube-canvas',connected:'[data-connected-system]',twoWorlds:'[data-tw-r2]',technology:'[data-home-tech-r2]',financial:'[data-fs-showcase-r11]',thinking:'[data-selected-thinking-r1]',work:'[data-selected-work-r11]',footer:'[data-home-footer-golden-r3]'};
              const counts=Object.fromEntries(Object.entries(selectors).map(([k,v])=>[k,document.querySelectorAll(v).length]));
              const c=document.querySelector('#cube-canvas'),r=c.getBoundingClientRect();
              return{counts,cube:{rw:r.width,rh:r.height,bw:c.width,bh:c.height},overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            for(const[k,v]of Object.entries(x.counts)) assert(v===1,`${label}: ${k} count ${v}`);
            assert(x.cube.rw>20&&x.cube.rh>20&&x.cube.bw>20&&x.cube.bh>20,`${label}: cube canvas not initialized`);
            assert(x.overflow<=1,`${label}: horizontal overflow ${x.overflow}`);
          }

          async function finishDiag(diag,label){assert(diag.errors.length===0,`${label}: JS errors ${JSON.stringify(diag.errors)}`);assert(diag.bad.length===0,`${label}: same-origin failures ${JSON.stringify(diag.bad)}`);}

          for(const routeLabel of ['EN','RU']){
            await record(`${routeLabel}_DESKTOP`,async()=>{
              const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:false,isMobile:false,reducedMotion:'no-preference'});const page=await context.newPage();const d=await setup(page,routeLabel);
              await firstPass(page,'desktop',`${routeLabel} desktop`);await logos(page,d,`${routeLabel} desktop`);await desktopLocal(page,`${routeLabel} desktop`);await regression(page,`${routeLabel} desktop`);await finishDiag(d,`${routeLabel} desktop`);await context.close();
            });
          }

          for(const width of [430,390,375,360,320]){
            for(const routeLabel of ['EN','RU']){
              await record(`${routeLabel}_MOBILE_${width}`,async()=>{
                const context=await browser.newContext({viewport:{width,height:900},hasTouch:true,isMobile:true,reducedMotion:'no-preference'});const page=await context.newPage();const d=await setup(page,routeLabel);
                await firstPass(page,'mobile',`${routeLabel} mobile ${width}`);await logos(page,d,`${routeLabel} mobile ${width}`);
                const m=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]');return{desktop:getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop')).display,mobile:getComputedStyle(s.querySelector('.home-tech-r2__relay--mobile')).display,fine:matchMedia('(hover:hover) and (pointer:fine)').matches,localReady:s.dataset.techR2LocalReady||''}});
                assert(m.desktop==='none'&&m.mobile!=='none',`${routeLabel} mobile ${width}: wrong relay form`);assert(!m.fine&&m.localReady!=='true',`${routeLabel} mobile ${width}: fake desktop hover setup`);
                await page.locator('[data-home-tech-r2] .home-tech-r2__identity').first().tap();await page.waitForTimeout(100);assert(!await page.evaluate(()=>document.querySelector('[data-home-tech-r2]').classList.contains('is-local-active')),`${routeLabel} mobile ${width}: fake hover after tap`);
                await regression(page,`${routeLabel} mobile ${width}`);await finishDiag(d,`${routeLabel} mobile ${width}`);await context.close();
              });
            }
          }

          for(const routeLabel of ['EN','RU']){
            await record(`${routeLabel}_REDUCED_MOTION`,async()=>{
              const context=await browser.newContext({viewport:{width:1440,height:900},hasTouch:false,isMobile:false,reducedMotion:'reduce'});const page=await context.newPage();const d=await setup(page,routeLabel);await enterTech(page);
              await page.waitForFunction(()=>document.querySelector('[data-home-tech-r2]')?.dataset.techR2State==='settled',null,{timeout:3000});
              const r=await page.evaluate(()=>{const s=document.querySelector('[data-home-tech-r2]'),sig=getComputedStyle(s.querySelector('.home-tech-r2__relay--desktop .home-tech-r2__relay-signal')),id=getComputedStyle(s.querySelector('.home-tech-r2__identity')),mat=getComputedStyle(s.querySelector('.home-tech-r2__material'));return{reduce:matchMedia('(prefers-reduced-motion:reduce)').matches,assembling:s.classList.contains('is-assembling'),local:s.classList.contains('is-local-active'),events:window.__techEvents.length,sigAnim:sig.animationName,sigOpacity:Number(sig.opacity),sigTrans:sig.transitionDuration,idAnim:id.animationName,idOpacity:Number(id.opacity),idTrans:id.transitionDuration,matAnim:mat.animationName,matTrans:mat.transitionDuration}});
              assert(r.reduce&&!r.assembling&&!r.local,`${routeLabel} reduce: state wrong`);assert(r.events===0&&r.sigAnim==='none'&&r.sigOpacity<=.01,`${routeLabel} reduce: signal active`);assert(r.idAnim==='none'&&r.idOpacity>=.99,`${routeLabel} reduce: identity animation/visibility`);assert(r.matAnim==='none',`${routeLabel} reduce: material animation`);assert(r.sigTrans==='0s'&&r.idTrans==='0s'&&r.matTrans==='0s',`${routeLabel} reduce: transitions remain`);
              await logos(page,d,`${routeLabel} reduced motion`);await regression(page,`${routeLabel} reduced motion`);await finishDiag(d,`${routeLabel} reduced motion`);await context.close();
            });
          }

          await browser.close();
          console.log('QA_RESULTS '+JSON.stringify(results));
          const failed=Object.entries(results).filter(([,v])=>v.status!=='PASS');
          if(failed.length) process.exit(2);
          NODE

          set +e
          PUBLIC_URL="$URL" CHROME_PATH="$CHROME_PATH" node .technology-r5-qa.mjs
          QA_RC=$?
          set -e
          rm -f .technology-r5-qa.mjs

          if [ "$QA_RC" -eq 0 ]; then
            post_status success "$URL" 'Runtime QA PASS; preview live'
            echo TECHNOLOGY_RUNTIME=PASS
          else
            post_status failure "$URL" 'Chrome runtime QA failed; preview kept live'
            echo TECHNOLOGY_RUNTIME=FAIL
          fi
          echo "OWNER_REVIEW_URL=$URL"
          echo REVIEW_WINDOW_SECONDS=7200
          sleep 7200
          exit "$QA_RC"
