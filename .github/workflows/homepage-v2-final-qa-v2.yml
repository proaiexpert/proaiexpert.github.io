name: Homepage V2 Final QA v2

on:
  push:
    branches:
      - qa/homepage-v2-final-8b1d
    paths-ignore:
      - qa-results/homepage-v2-final-v2/**

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout QA control branch
        uses: actions/checkout@v6
        with:
          path: control

      - name: Checkout exact production head
        uses: actions/checkout@v6
        with:
          ref: 8b1de793b82832a0595a17bee85f901911633979
          path: site

      - name: Verify provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          cd site
          test "$(git rev-parse HEAD)" = '8b1de793b82832a0595a17bee85f901911633979'
          git diff --exit-code

      - name: Production-equivalent Jekyll build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p control/qa-output-v2
          set -o pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          cd site
          {
            gem install --user-install jekyll -v 4.3.4 --no-document
            gem install --user-install webrick --no-document
            jekyll build --source . --destination _site
          } 2>&1 | tee ../control/qa-output-v2/jekyll.log

      - name: Validate generated EN/RU output
        id: generated
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd site
          python3 - <<'PY' 2>&1 | tee ../control/qa-output-v2/generated.log
          from pathlib import Path
          from collections import Counter
          import html, re, sys

          expected_sections=['hero','connected-journey','directions','financial-stream','ways-to-start','delivery','founder','selected-work','insights','private-review']
          expected_contacts={
            'en':[
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake'],
            'ru':[
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake']}
          cfg={
            'en':(Path('_site/index.html'),'en','https://proai-expert.com/','en_US'),
            'ru':(Path('_site/ru/index.html'),'ru','https://proai-expert.com/ru/','ru_RU')}
          remote_subsite={'/handyman-vancouver-portland-demo/'}
          errors=[]
          def check(v,m):
            if not v: errors.append(m)
          def tags(t,n): return re.findall(rf'<{n}\b[^>]*>',t,re.I)
          def attr(t,n):
            m=re.search(rf'\b{n}=["\']([^"\']*)["\']',t,re.I)
            return html.unescape(m.group(1)) if m else None

          for loc,(path,lang,canonical,ogloc) in cfg.items():
            check(path.is_file(),f'{loc}: generated file missing')
            if not path.is_file(): continue
            text=path.read_text(encoding='utf-8')
            check('{%' not in text and '{{' not in text,f'{loc}: unresolved Liquid')
            check(len(re.findall(r'<!doctype\s+html',text,re.I))==1,f'{loc}: doctype count')
            for n in ('html','head','body','main'):
              check(len(re.findall(rf'<{n}\b',text,re.I))==1,f'{loc}: {n} count')
            ht=tags(text,'html')
            check(ht and attr(ht[0],'lang')==lang,f'{loc}: html lang')
            links=tags(text,'link')
            check([attr(x,'href') for x in links if attr(x,'rel')=='canonical']==[canonical],f'{loc}: canonical')
            check({(attr(x,'hreflang'),attr(x,'href')) for x in links if attr(x,'rel')=='alternate'}=={('en','https://proai-expert.com/'),('ru','https://proai-expert.com/ru/'),('x-default','https://proai-expert.com/')},f'{loc}: hreflang')
            metas=tags(text,'meta')
            check([attr(x,'content') for x in metas if attr(x,'property')=='og:locale']==[ogloc],f'{loc}: og locale')
            check(text.count('/assets/css/header-system-v1.css?v=20260804.1')==1,f'{loc}: header CSS')
            check(text.count('/assets/css/homepage-v2.css?v=20260805.1')==1,f'{loc}: Homepage CSS')
            check(text.count('/assets/css/footer-system-v1.css?v=20260804.1')==1,f'{loc}: footer base CSS')
            check('/assets/js/header-system-v1.js?v=20260804.1' in text,f'{loc}: shared header JS')
            ids=re.findall(r'\bid=["\']([^"\']+)["\']',text,re.I)
            dup=sorted(i for i,c in Counter(ids).items() if c>1)
            check(not dup,f'{loc}: duplicate ids {dup}')
            actual=[]
            for x in tags(text,'section'):
              if 'hpv2-section' in (attr(x,'class') or '').split(): actual.append(attr(x,'id'))
            check(actual==expected_sections,f'{loc}: section order {actual}')
            hrefs=[attr(x,'href') for x in tags(text,'a') if attr(x,'href')]
            hp_contacts=[h for h in hrefs if h.startswith('/contact/?') or h.startswith('/ru/contact/?')]
            check(hp_contacts==expected_contacts[loc],f'{loc}: Homepage Contact mappings {hp_contacts}')
            check('source_context=' not in text,f'{loc}: source_context present')
            check(re.findall(r'selected_direction=([^&#"\']+)',html.unescape(text))==['websites_branding','ai_systems_automation','both'],f'{loc}: selected_direction values')

            assets=set()
            for tn,an in [('img','src'),('source','srcset'),('script','src'),('link','href')]:
              for x in tags(text,tn):
                v=attr(x,an)
                if not v: continue
                for candidate in v.split(','):
                  u=candidate.strip().split()[0]
                  if u.startswith('/') and re.search(r'\.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)(?:\?|$)',u,re.I): assets.add(u.split('?',1)[0])
            missing_assets=sorted(u for u in assets if not Path('_site'+u).is_file())
            check(not missing_assets,f'{loc}: missing local assets {missing_assets}')

            routes=set()
            for h in hrefs:
              if not h.startswith('/') or h.startswith('//'): continue
              r=h.split('#',1)[0].split('?',1)[0]
              if not r or r in remote_subsite or re.search(r'\.[a-z0-9]{2,5}$',r,re.I): continue
              routes.add(r)
            missing=[]
            for r in sorted(routes):
              candidates=[Path('_site/index.html')] if r=='/' else ([Path('_site'+r+'index.html')] if r.endswith('/') else [Path('_site'+r),Path('_site'+r+'/index.html')])
              if not any(c.exists() for c in candidates): missing.append(r)
            check(not missing,f'{loc}: missing internal routes {missing}')

          if errors:
            print('GENERATED VALIDATION: FAIL')
            for e in errors: print(' -',e)
            sys.exit(1)
          print('GENERATED VALIDATION: PASS')
          PY

      - name: Validate live external targets
        id: external
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > control/qa-output-v2/external.log
          for url in \
            'https://financialstreamllc.com/' \
            'https://alinahorb.com/' \
            'https://proai-expert.com/handyman-vancouver-portland-demo/'
          do
            code="$(curl -L --max-time 20 -sS -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url" | tee -a control/qa-output-v2/external.log
            case "$code" in 2*|3*) ;; *) exit 1;; esac
          done

      - name: Install Playwright Chromium
        id: install
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd control
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Start generated site
        id: server
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --directory site/_site > control/qa-output-v2/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Browser QA matrix
        id: browser
        if: steps.server.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cat > control/final-v2.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const matrix=[
            ['EN-1440','/',1440,900],['RU-1440','/ru/',1440,900],
            ['EN-390','/',390,844],['RU-390','/ru/',390,844],
            ['EN-320','/',320,568],['RU-320','/ru/',320,568],
            ['EN-844x390','/',844,390],['RU-844x390','/ru/',844,390]
          ];
          const expected=['hero','connected-journey','directions','financial-stream','ways-to-start','delivery','founder','selected-work','insights','private-review'];
          const browser=await chromium.launch();
          const report=[];
          let fatal=false;

          async function settle(page){
            await page.evaluate(async()=>{
              for(const img of document.images) img.loading='eager';
              for(let y=0;y<document.documentElement.scrollHeight;y+=Math.max(260,Math.floor(innerHeight*.6))){
                scrollTo(0,y); await new Promise(r=>setTimeout(r,80));
              }
              await Promise.all([...document.images].map(img=>new Promise(resolve=>{
                if(img.complete){resolve();return;}
                const done=()=>resolve();
                img.addEventListener('load',done,{once:true});
                img.addEventListener('error',done,{once:true});
                setTimeout(done,5000);
              })));
              await Promise.all([...document.images].map(img=>img.decode().catch(()=>{})));
              scrollTo(0,0);
            });
            await page.waitForTimeout(300);
          }

          async function testMenu(page){
            const toggle=page.locator('.site-header__menu-toggle');
            if(!(await toggle.isVisible())) return {applicable:false,issues:[]};
            const issues=[];
            await toggle.click();
            await page.waitForTimeout(240);
            if(await toggle.getAttribute('aria-expanded')!=='true') issues.push('toggle did not open menu');
            if(!(await page.locator('.site-header__nav').evaluate(e=>e.classList.contains('is-open')))) issues.push('nav missing is-open');
            if(!(await page.locator('body').evaluate(e=>e.classList.contains('menu-open')))) issues.push('body missing menu-open');

            await page.keyboard.press('Escape');
            await page.waitForTimeout(40);
            if(await toggle.getAttribute('aria-expanded')!=='false') issues.push('Escape did not close');
            if(!(await toggle.evaluate(e=>document.activeElement===e))) issues.push('Escape did not return focus');

            await toggle.click();
            await page.evaluate(()=>document.body.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})));
            await page.waitForTimeout(40);
            if(await toggle.getAttribute('aria-expanded')!=='false') issues.push('outside event did not close');

            await toggle.click();
            await page.evaluate(()=>{
              const a=document.querySelector('.site-header__nav a');
              a.addEventListener('click',e=>e.preventDefault(),{once:true,capture:true});
              a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
            });
            await page.waitForTimeout(40);
            if(await toggle.getAttribute('aria-expanded')!=='false') issues.push('nav link event did not close');
            return {applicable:true,issues};
          }

          async function testSkip(page){
            await page.evaluate(()=>{
              window.scrollTo(0,0);
              document.body.setAttribute('tabindex','-1');
              document.body.focus();
            });
            await page.keyboard.press('Tab');
            await page.waitForTimeout(220);
            const skip=page.locator('.skip-link');
            const focused=await skip.evaluate(e=>document.activeElement===e);
            const box=await skip.boundingBox();
            const visible=!!box && box.y>=0 && box.height>0;
            if(focused) await page.keyboard.press('Enter');
            await page.waitForTimeout(40);
            const mainFocused=await page.locator('#main-content').evaluate(e=>document.activeElement===e);
            await page.evaluate(()=>document.body.removeAttribute('tabindex'));
            return {focused,visible,mainFocused,issues:[...(!focused?['skip not first keyboard target']:[]),...(!visible?['skip not visible after focus']:[]),...(!mainFocused?['skip did not focus main']:[])]};
          }

          for(const [name,path,width,height] of matrix){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            const consoleErrors=[],pageErrors=[],requestFailures=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>requestFailures.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            const response=await page.goto(`http://127.0.0.1:4173${path}`,{waitUntil:'networkidle'});
            await settle(page);

            const state=await page.evaluate(()=>{
              const vis=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const overflow=[...document.querySelectorAll('body *')].filter(vis).map(el=>{const r=el.getBoundingClientRect();return {el,left:r.left,right:r.right,width:r.width}}).filter(x=>x.left<-1||x.right>innerWidth+1).map(x=>({tag:x.el.tagName,id:x.el.id||'',cls:typeof x.el.className==='string'?x.el.className.slice(0,100):'',left:+x.left.toFixed(1),right:+x.right.toFixed(1),width:+x.width.toFixed(1)}));
              const broken=[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.currentSrc||i.getAttribute('src'));
              const sections=[...document.querySelectorAll('main.hpv2 > section.hpv2-section')].map(x=>x.id);
              return {sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,overflow,broken,sections};
            });

            const touch=await page.evaluate(()=>{
              const vis=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              return [...document.querySelectorAll('a[href],button')]
                .filter(vis)
                .filter(el=>!el.classList.contains('skip-link'))
                .map(el=>{const r=el.getBoundingClientRect();return {text:(el.innerText||el.getAttribute('aria-label')||'').trim().slice(0,70),w:+r.width.toFixed(1),h:+r.height.toFixed(1),cls:typeof el.className==='string'?el.className.slice(0,100):''}})
                .filter(x=>x.w<44||x.h<44);
            });

            const menu=await testMenu(page);
            const skip=await testSkip(page);
            const issues=[];
            if(!response?.ok()) issues.push('HTTP route failed');
            if(JSON.stringify(state.sections)!==JSON.stringify(expected)) issues.push(`section order ${JSON.stringify(state.sections)}`);
            if(state.sw>state.cw) issues.push(`horizontal scroll ${state.sw}>${state.cw}`);
            if(state.overflow.length) issues.push(`viewport overflow ${JSON.stringify(state.overflow)}`);
            if(state.broken.length) issues.push(`broken images ${JSON.stringify(state.broken)}`);
            if(touch.length) issues.push(`touch targets ${JSON.stringify(touch)}`);
            issues.push(...menu.issues.map(x=>`menu: ${x}`));
            issues.push(...skip.issues.map(x=>`skip: ${x}`));
            if(consoleErrors.length) issues.push(`console ${JSON.stringify(consoleErrors)}`);
            if(pageErrors.length) issues.push(`page errors ${JSON.stringify(pageErrors)}`);
            if(requestFailures.length) issues.push(`request failures ${JSON.stringify(requestFailures)}`);
            if(issues.length) fatal=true;
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.screenshot({path:`control/qa-output-v2/${name}.png`,fullPage:true});
            report.push({name,issues,state,touch,menu,skip});
            await context.close();
          }

          const contactCases=[
            ['EN-Hero','/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake','private_review','homepage','homepage_hero','not_sure'],
            ['EN-Web','/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake','private_review','homepage','homepage_ways_to_start','websites_branding'],
            ['EN-AI','/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake','private_review','homepage','homepage_ways_to_start','ai_systems_automation'],
            ['EN-Both','/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake','private_review','homepage','homepage_ways_to_start','both'],
            ['EN-Final','/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake','private_review','homepage','homepage_final','not_sure'],
            ['RU-Hero','/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake','private_review','homepage','homepage_hero','not_sure'],
            ['RU-Web','/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake','private_review','homepage','homepage_ways_to_start','websites_branding'],
            ['RU-AI','/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake','private_review','homepage','homepage_ways_to_start','ai_systems_automation'],
            ['RU-Both','/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake','private_review','homepage','homepage_ways_to_start','both'],
            ['RU-Final','/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake','private_review','homepage','homepage_final','not_sure']
          ];
          for(const [name,path,intent,sourcePage,sourceCta,direction] of contactCases){
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto(`http://127.0.0.1:4173${path}`,{waitUntil:'networkidle'});
            await page.waitForTimeout(120);
            const values=await page.evaluate(()=>({intent:document.querySelector('#intent')?.value,sourcePage:document.querySelector('#source_page')?.value,sourceCta:document.querySelector('#source_cta')?.value,direction:document.querySelector('#selected_direction')?.value,contextHidden:document.querySelector('#privateReviewContext')?.getAttribute('aria-hidden'),hash:location.hash}));
            const issues=[];
            if(values.intent!==intent)issues.push(`intent=${values.intent}`);
            if(values.sourcePage!==sourcePage)issues.push(`sourcePage=${values.sourcePage}`);
            if(values.sourceCta!==sourceCta)issues.push(`sourceCta=${values.sourceCta}`);
            if(values.direction!==direction)issues.push(`direction=${values.direction}`);
            if(values.contextHidden!=='false')issues.push(`privateReviewContext=${values.contextHidden}`);
            if(values.hash!=='#project-intake')issues.push(`hash=${values.hash}`);
            if(issues.length)fatal=true;
            report.push({name,issues,values});
            await context.close();
          }

          for(const [name,opts] of [
            ['reduced-motion',{viewport:{width:390,height:844},reducedMotion:'reduce'}],
            ['forced-colors',{viewport:{width:390,height:844},forcedColors:'active'}]
          ]){
            const context=await browser.newContext(opts);
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const issues=[];
            if(name==='reduced-motion'){
              const v=await page.evaluate(()=>({scroll:getComputedStyle(document.documentElement).scrollBehavior,transition:getComputedStyle(document.querySelector('.hpv2-button')).transitionDuration,cube:getComputedStyle(document.querySelector('.site-header__cube')).animationName}));
              if(!(v.scroll==='auto'&&v.transition.split(',').every(x=>parseFloat(x)===0)&&v.cube==='none')) issues.push(JSON.stringify(v));
            }else{
              const v=await page.evaluate(()=>{const b=getComputedStyle(document.querySelector('.hpv2-button--primary')),s=getComputedStyle(document.querySelector('.hpv2-status'));return {bb:parseFloat(b.borderWidth),bs:b.borderStyle,sb:parseFloat(s.borderLeftWidth),ss:s.borderLeftStyle}});
              if(!(v.bb>0&&v.bs!=='none'&&v.sb>0&&v.ss!=='none')) issues.push(JSON.stringify(v));
            }
            if(issues.length)fatal=true;
            report.push({name,issues});
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('control/qa-output-v2/browser-results.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          process.exit(fatal?1:0);
          JS
          set -o pipefail
          node control/final-v2.mjs 2>&1 | tee control/qa-output-v2/browser.log

      - name: Upload QA evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-v2-final-v2-${{ github.sha }}
          path: control/qa-output-v2/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist result on QA branch
        if: always()
        shell: bash
        env:
          PROVENANCE: ${{ steps.provenance.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          EXTERNAL: ${{ steps.external.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SERVER: ${{ steps.server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          cd control
          mkdir -p qa-results/homepage-v2-final-v2
          {
            echo '# Homepage V2 Final QA v2'
            echo
            echo 'Production head tested: 8b1de793b82832a0595a17bee85f901911633979'
            echo "Provenance: $PROVENANCE"
            echo "Jekyll 4.3.4 build: $BUILD"
            echo "Generated validation: ${GENERATED:-skipped}"
            echo "Live external targets: ${EXTERNAL:-skipped}"
            echo "Chromium install: ${INSTALL:-skipped}"
            echo "Local server: ${SERVER:-skipped}"
            echo "Browser QA: ${BROWSER:-skipped}"
            echo "Artifact ID: ${ARTIFACT_ID:-none}"
            echo "Artifact URL: ${ARTIFACT_URL:-none}"
            echo
            echo '## Generated'; echo '```'; cat qa-output-v2/generated.log 2>/dev/null || true; echo '```'
            echo; echo '## External'; echo '```'; cat qa-output-v2/external.log 2>/dev/null || true; echo '```'
            echo; echo '## Browser'; echo '```json'; cat qa-output-v2/browser-results.json 2>/dev/null || true; echo '```'
          } > qa-results/homepage-v2-final-v2/latest.md
          git config user.name 'github-actions[bot]'
