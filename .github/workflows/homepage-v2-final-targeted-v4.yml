name: Homepage V2 Final Targeted QA v4

on:
  push:
    branches:
      - qa/homepage-v2-technical-2026-08-07
    paths-ignore:
      - qa-results/homepage-v2-v4/**

permissions:
  contents: write

jobs:
  targeted-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v6
        with:
          path: control

      - name: Checkout exact production head
        uses: actions/checkout@v6
        with:
          ref: 2eef87720d17ee30abc6cd4ac215c158940b2de0
          path: site

      - name: Verify production head
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          cd site
          test "$(git rev-parse HEAD)" = '2eef87720d17ee30abc6cd4ac215c158940b2de0'
          git diff --exit-code

      - name: Production-equivalent Jekyll build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p control/qa-output-v4
          set -o pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          cd site
          {
            gem install --user-install jekyll -v 4.3.4 --no-document
            gem install --user-install webrick --no-document
            jekyll build --source . --destination _site
          } 2>&1 | tee ../control/qa-output-v4/jekyll.log

      - name: Generated smoke validation
        id: generated
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd site
          python3 - <<'PY' 2>&1 | tee ../control/qa-output-v4/generated.log
          from pathlib import Path
          import re, sys
          errors=[]
          def check(v,m):
            if not v: errors.append(m)
          for loc,path,lang,canonical in [
            ('en',Path('_site/index.html'),'en','https://proai-expert.com/'),
            ('ru',Path('_site/ru/index.html'),'ru','https://proai-expert.com/ru/')]:
            check(path.exists(),f'{loc}: output missing')
            if not path.exists(): continue
            t=path.read_text(encoding='utf-8')
            check('{%' not in t and '{{' not in t,f'{loc}: unresolved Liquid')
            check(len(re.findall(r'<!doctype\s+html',t,re.I))==1,f'{loc}: doctype')
            check(re.search(rf'<html\b[^>]*\blang=["\']{lang}["\']',t,re.I) is not None,f'{loc}: lang')
            check(f'<link rel="canonical" href="{canonical}">' in t,f'{loc}: canonical')
            check(t.count('/assets/css/homepage-v2.css?v=20260805.1')==1,f'{loc}: homepage CSS')
            check(t.count('/assets/css/footer-system-v1.css?v=20260804.1')==1,f'{loc}: footer base CSS')
            check('/assets/js/header-system-v1.js?v=20260804.1' in t,f'{loc}: header JS')
            check(t.count('class="hpv2-section')==10,f'{loc}: 10 blocks')
            check('source_context=' not in t,f'{loc}: homepage source_context')
            check(t.count('source_cta=homepage_')==5,f'{loc}: 5 Homepage Contact URLs')
          if errors:
            print('GENERATED SMOKE: FAIL'); [print(' -',e) for e in errors]; sys.exit(1)
          print('GENERATED SMOKE: PASS')
          PY

      - name: Install Playwright Chromium
        id: install
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd control
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Serve generated site
        id: server
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --directory site/_site > control/qa-output-v4/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Recheck touch targets and smoke both locales
        id: browser
        if: steps.server.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cat > control/qa-v4.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const matrix=[['EN-1440','/',1440,900],['RU-1440','/ru/',1440,900],['EN-390','/',390,844],['RU-390','/ru/',390,844],['EN-320','/',320,568],['RU-320','/ru/',320,568],['EN-844x390','/',844,390],['RU-844x390','/ru/',844,390]];
          const expected=['hero','connected-journey','directions','financial-stream','ways-to-start','delivery','founder','selected-work','insights','private-review'];
          const browser=await chromium.launch(); const report=[]; let fatal=false;
          async function settle(page){
            await page.evaluate(async()=>{
              [...document.images].forEach(i=>i.loading='eager');
              for(let y=0;y<document.documentElement.scrollHeight;y+=Math.max(260,Math.floor(innerHeight*.65))){scrollTo(0,y);await new Promise(r=>setTimeout(r,70));}
              await Promise.all([...document.images].map(i=>new Promise(resolve=>{if(i.complete)return resolve();const done=()=>resolve();i.addEventListener('load',done,{once:true});i.addEventListener('error',done,{once:true});setTimeout(done,5000)})));
              await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));scrollTo(0,0);
            });
            await page.waitForTimeout(250);
          }
          async function menuSmoke(page){
            const t=page.locator('.site-header__menu-toggle');if(!(await t.isVisible()))return[];const issues=[];
            await t.click();await page.waitForTimeout(220);if(await t.getAttribute('aria-expanded')!=='true')issues.push('open');await page.keyboard.press('Escape');await page.waitForTimeout(30);if(await t.getAttribute('aria-expanded')!=='false')issues.push('escape close');if(!(await t.evaluate(e=>document.activeElement===e)))issues.push('escape focus');return issues;
          }
          for(const [name,path,width,height] of matrix){
            const c=await browser.newContext({viewport:{width,height}}),p=await c.newPage();const consoleErrors=[],pageErrors=[],requestFailures=[];
            p.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});p.on('pageerror',e=>pageErrors.push(String(e)));p.on('requestfailed',r=>requestFailures.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            const response=await p.goto(`http://127.0.0.1:4173${path}`,{waitUntil:'networkidle'});await settle(p);
            const state=await p.evaluate(()=>{const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};const over=[...document.querySelectorAll('body *')].filter(vis).map(e=>{const r=e.getBoundingClientRect();return{e,l:r.left,r:r.right,w:r.width}}).filter(x=>x.l<-1||x.r>innerWidth+1).map(x=>({tag:x.e.tagName,id:x.e.id||'',cls:typeof x.e.className==='string'?x.e.className.slice(0,80):'',left:+x.l.toFixed(1),right:+x.r.toFixed(1),width:+x.w.toFixed(1)}));return{sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,over,broken:[...document.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.currentSrc||i.src),sections:[...document.querySelectorAll('main.hpv2 > section.hpv2-section')].map(e=>e.id)}});
            const touch=await p.evaluate(()=>{const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};return[...document.querySelectorAll('a[href],button')].filter(vis).filter(e=>!e.classList.contains('skip-link')).map(e=>{const r=e.getBoundingClientRect();return{text:(e.innerText||e.getAttribute('aria-label')||'').trim().slice(0,60),w:+r.width.toFixed(1),h:+r.height.toFixed(1),cls:typeof e.className==='string'?e.className.slice(0,80):''}}).filter(x=>x.w<44||x.h<44)});
            const menu=await menuSmoke(p);const issues=[];if(!response?.ok())issues.push('http');if(JSON.stringify(state.sections)!==JSON.stringify(expected))issues.push('sections');if(state.sw>state.cw)issues.push(`scroll ${state.sw}>${state.cw}`);if(state.over.length)issues.push(`overflow ${JSON.stringify(state.over)}`);if(state.broken.length)issues.push(`broken ${JSON.stringify(state.broken)}`);if(touch.length)issues.push(`touch ${JSON.stringify(touch)}`);if(menu.length)issues.push(`menu ${JSON.stringify(menu)}`);if(consoleErrors.length)issues.push(`console ${JSON.stringify(consoleErrors)}`);if(pageErrors.length)issues.push(`pageErrors ${JSON.stringify(pageErrors)}`);if(requestFailures.length)issues.push(`requestFailures ${JSON.stringify(requestFailures)}`);if(issues.length)fatal=true;await p.screenshot({path:`control/qa-output-v4/${name}.png`,fullPage:true});report.push({name,issues,state,touch,menu});await c.close();
          }
          for(const [name,path] of [['EN-contact','/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake'],['RU-contact','/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake']]){const c=await browser.newContext({viewport:{width:390,height:844}}),p=await c.newPage();await p.goto(`http://127.0.0.1:4173${path}`,{waitUntil:'networkidle'});const v=await p.evaluate(()=>({intent:document.querySelector('#intent')?.value,page:document.querySelector('#source_page')?.value,cta:document.querySelector('#source_cta')?.value,hash:location.hash,hidden:document.querySelector('#privateReviewContext')?.getAttribute('aria-hidden')}));const issues=[];if(v.intent!=='private_review'||v.page!=='homepage'||v.cta!=='homepage_final'||v.hash!=='#project-intake'||v.hidden!=='false')issues.push(JSON.stringify(v));if(issues.length)fatal=true;report.push({name,issues,values:v});await c.close();}
          for(const [name,opts] of [['reduced-motion',{viewport:{width:390,height:844},reducedMotion:'reduce'}],['forced-colors',{viewport:{width:390,height:844},forcedColors:'active'}]]){const c=await browser.newContext(opts),p=await c.newPage();await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});const issues=[];if(name==='reduced-motion'){const v=await p.evaluate(()=>({scroll:getComputedStyle(document.documentElement).scrollBehavior,transition:getComputedStyle(document.querySelector('.hpv2-button')).transitionDuration,cube:getComputedStyle(document.querySelector('.site-header__cube')).animationName}));if(!(v.scroll==='auto'&&v.transition.split(',').every(x=>parseFloat(x)===0)&&v.cube==='none'))issues.push(JSON.stringify(v));}else{const v=await p.evaluate(()=>{const b=getComputedStyle(document.querySelector('.hpv2-button--primary')),s=getComputedStyle(document.querySelector('.hpv2-status'));return{bb:parseFloat(b.borderWidth),bs:b.borderStyle,sb:parseFloat(s.borderLeftWidth),ss:s.borderLeftStyle}});if(!(v.bb>0&&v.bs!=='none'&&v.sb>0&&v.ss!=='none'))issues.push(JSON.stringify(v));}if(issues.length)fatal=true;report.push({name,issues});await c.close();}
          await browser.close();fs.writeFileSync('control/qa-output-v4/results.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));process.exit(fatal?1:0);
          JS
          set -o pipefail
          node control/qa-v4.mjs 2>&1 | tee control/qa-output-v4/browser.log

      - name: Upload evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-v2-final-v4-${{ github.sha }}
          path: control/qa-output-v4/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist result
        if: always()
        shell: bash
        env:
          PROVENANCE: ${{ steps.provenance.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SERVER: ${{ steps.server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          cd control
          mkdir -p qa-results/homepage-v2-v4
          {
            echo '# Homepage V2 Final Targeted QA v4';echo
            echo 'Production head tested: 2eef87720d17ee30abc6cd4ac215c158940b2de0'
            echo "Provenance: $PROVENANCE";echo "Build: $BUILD";echo "Generated: ${GENERATED:-skipped}";echo "Install: ${INSTALL:-skipped}";echo "Server: ${SERVER:-skipped}";echo "Browser: ${BROWSER:-skipped}";echo "Artifact ID: ${ARTIFACT_ID:-none}";echo "Artifact URL: ${ARTIFACT_URL:-none}";echo
            echo '## Generated';echo '```';cat qa-output-v4/generated.log 2>/dev/null||true;echo '```';echo;echo '## Results';echo '```json';cat qa-output-v4/results.json 2>/dev/null||true;echo '```'
          } > qa-results/homepage-v2-v4/latest.md
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-results/homepage-v2-v4/latest.md
          git commit -m 'Record Homepage V2 final targeted QA v4' || exit 0
          git push origin HEAD:qa/homepage-v2-technical-2026-08-07

      - name: Enforce gate
        if: always()
        shell: bash
        env:
          PROVENANCE: ${{ steps.provenance.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SERVER: ${{ steps.server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          for v in "$PROVENANCE" "$BUILD" "$GENERATED" "$INSTALL" "$SERVER" "$BROWSER";do [ "$v" = success ]||exit 1;done
