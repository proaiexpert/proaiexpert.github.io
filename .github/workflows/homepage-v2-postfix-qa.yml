name: Homepage V2 Post-Fix Technical QA

on:
  push:
    branches:
      - qa/homepage-v2-postfix-c791
    paths-ignore:
      - qa-results/homepage-v2-postfix/**

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production-derived QA branch
        uses: actions/checkout@v6

      - name: Production-equivalent Jekyll build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qa-output-postfix
          set -o pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          {
            gem install --user-install jekyll -v 4.3.4 --no-document
            gem install --user-install webrick --no-document
            jekyll build --source . --destination _site
          } 2>&1 | tee qa-output-postfix/jekyll.log

      - name: Validate generated HTML contracts
        id: generated
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee qa-output-postfix/generated.log
          from pathlib import Path
          from collections import Counter
          import html,re,sys

          expected_sections=['hero','connected-journey','directions','financial-stream','ways-to-start','delivery','founder','selected-work','insights','private-review']
          expected_contacts={
            'en':[
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake'],
            'ru':[
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake']}
          config={
            'en':(Path('_site/index.html'),'en','https://proai-expert.com/','en_US'),
            'ru':(Path('_site/ru/index.html'),'ru','https://proai-expert.com/ru/','ru_RU')}
          remote_subsite={'/handyman-vancouver-portland-demo/'}
          errors=[]
          def check(v,m):
            if not v: errors.append(m)
          def tags(t,n): return re.findall(rf'<{n}\b[^>]*>',t,re.I)
          def attr(t,n):
            m=re.search(rf'\b{n}=["\']([^"\']*)["\']',t,re.I)
            return html.unescape(m.group(1)) if m else None

          for loc,(path,lang,canonical,ogloc) in config.items():
            check(path.is_file(),f'{loc}: generated file missing')
            if not path.is_file(): continue
            text=path.read_text(encoding='utf-8')
            check('{%' not in text and '{{' not in text,f'{loc}: unresolved Liquid')
            check(len(re.findall(r'<!doctype\s+html',text,re.I))==1,f'{loc}: doctype count')
            for n in ('html','head','body','main'): check(len(re.findall(rf'<{n}\b',text,re.I))==1,f'{loc}: {n} count')
            ht=tags(text,'html'); check(ht and attr(ht[0],'lang')==lang,f'{loc}: html lang')
            links=tags(text,'link')
            check([attr(x,'href') for x in links if attr(x,'rel')=='canonical']==[canonical],f'{loc}: canonical')
            check({(attr(x,'hreflang'),attr(x,'href')) for x in links if attr(x,'rel')=='alternate'}=={('en','https://proai-expert.com/'),('ru','https://proai-expert.com/ru/'),('x-default','https://proai-expert.com/')},f'{loc}: hreflang')
            metas=tags(text,'meta'); check([attr(x,'content') for x in metas if attr(x,'property')=='og:locale']==[ogloc],f'{loc}: og locale')
            check(text.count('/assets/css/homepage-v2.css?v=20260805.1')==1,f'{loc}: Homepage V2 CSS')
            check('/assets/js/header-system-v1.js?v=20260804.1' in text,f'{loc}: header JS')
            ids=re.findall(r'\bid=["\']([^"\']+)["\']',text,re.I)
            check(not [i for i,c in Counter(ids).items() if c>1],f'{loc}: duplicate ids')
            sections=[]
            for x in tags(text,'section'):
              if 'hpv2-section' in (attr(x,'class') or '').split(): sections.append(attr(x,'id'))
            check(sections==expected_sections,f'{loc}: section order {sections}')
            hrefs=[attr(x,'href') for x in tags(text,'a') if attr(x,'href')]
            contacts=[h for h in hrefs if h.startswith('/contact/?') or h.startswith('/ru/contact/?')]
            check(contacts==expected_contacts[loc],f'{loc}: contact mappings {contacts}')
            check('source_context=' not in text,f'{loc}: source_context present')
            check(re.findall(r'selected_direction=([^&#"\']+)',html.unescape(text))==['websites_branding','ai_systems_automation','both'],f'{loc}: selected_direction values')

            assets=set()
            for tn,an in [('img','src'),('source','srcset'),('script','src'),('link','href')]:
              for x in tags(text,tn):
                v=attr(x,an)
                if not v: continue
                for candidate in v.split(','):
                  u=candidate.strip().split()[0]
                  if u.startswith('/') and re.search(r'\.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)(?:\?|$)',u,re.I): assets.add(u.split('?',1)[0])
            missing_assets=sorted(u for u in assets if not Path('_site'+u).is_file())
            check(not missing_assets,f'{loc}: missing assets {missing_assets}')

            routes=set()
            for h in hrefs:
              if not h.startswith('/') or h.startswith('//'): continue
              r=h.split('#',1)[0].split('?',1)[0]
              if not r or r in remote_subsite or re.search(r'\.[a-z0-9]{2,5}$',r,re.I): continue
              routes.add(r)
            missing=[]
            for r in sorted(routes):
              candidates=[Path('_site/index.html')] if r=='/' else ([Path('_site'+r+'index.html')] if r.endswith('/') else [Path('_site'+r),Path('_site'+r+'/index.html')])
              if not any(c.exists() for c in candidates): missing.append(r)
            check(not missing,f'{loc}: missing internal routes {missing}')

          if errors:
            print('GENERATED VALIDATION: FAIL')
            for e in errors: print(' -',e)
            sys.exit(1)
          print('GENERATED VALIDATION: PASS')
          PY

      - name: Validate external/live targets
        id: external
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          : > qa-output-postfix/external-links.log
          for url in \
            'https://financialstreamllc.com/' \
            'https://alinahorb.com/' \
            'https://proai-expert.com/handyman-vancouver-portland-demo/'
          do
            code="$(curl -L --max-time 20 -sS -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url" | tee -a qa-output-postfix/external-links.log
            case "$code" in 2*|3*) ;; *) exit 1;; esac
          done

      - name: Install Chromium runtime
        id: install
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Start generated site
        id: server
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          nohup python3 -m http.server 4173 --directory _site > qa-output-postfix/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Browser QA matrix
        id: browser
        if: steps.server.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cat > homepage-v2-postfix.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const matrix=[
            ['EN-1440','/',1440,900],['RU-1440','/ru/',1440,900],
            ['EN-390','/',390,844],['RU-390','/ru/',390,844],
            ['EN-320','/',320,568],['RU-320','/ru/',320,568],
            ['EN-844x390','/',844,390],['RU-844x390','/ru/',844,390]
          ];
          const expected=['hero','connected-journey','directions','financial-stream','ways-to-start','delivery','founder','selected-work','insights','private-review'];
          const browser=await chromium.launch();
          const report=[];
          let failedOverall=false;

          async function settleImages(page){
            await page.locator('img').evaluateAll(async imgs=>{
              await Promise.all(imgs.map(img=>new Promise(resolve=>{
                img.loading='eager';
                if(img.complete){ resolve(); return; }
                const done=()=>resolve();
                img.addEventListener('load',done,{once:true});
                img.addEventListener('error',done,{once:true});
                setTimeout(done,5000);
              })));
            });
            await page.evaluate(async()=>{
              for(let y=0;y<document.documentElement.scrollHeight;y+=Math.max(260,Math.floor(innerHeight*.65))){
                scrollTo(0,y); await new Promise(r=>setTimeout(r,70));
              }
              await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
              scrollTo(0,0);
            });
            await page.waitForTimeout(250);
          }

          for(const [name,path,width,height] of matrix){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            const consoleErrors=[],pageErrors=[],requestFailures=[];
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>requestFailures.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
            const resp=await page.goto(`http://127.0.0.1:4173${path}`,{waitUntil:'networkidle'});
            await settleImages(page);

            const state=await page.evaluate(()=>{
              const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const overflow=[...document.querySelectorAll('body *')].filter(visible).map(el=>{const r=el.getBoundingClientRect();return {el,left:r.left,right:r.right,width:r.width}}).filter(x=>x.left<-1||x.right>innerWidth+1).map(x=>({tag:x.el.tagName,id:x.el.id||'',cls:typeof x.el.className==='string'?x.el.className.slice(0,100):'',left:+x.left.toFixed(1),right:+x.right.toFixed(1),width:+x.width.toFixed(1)}));
              const broken=[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src'));
              const sections=[...document.querySelectorAll('main.hpv2 > section.hpv2-section')].map(x=>x.id);
              return {scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,overflow,broken,sections};
            });

            let touch=[]; let menu='n/a'; let skip='fail';
            if(width<=844){
              touch=await page.evaluate(()=>{
                const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
                return [...document.querySelectorAll('a[href],button')].filter(visible).filter(el=>!el.classList.contains('skip-link')).map(el=>{const r=el.getBoundingClientRect();return {text:(el.innerText||el.getAttribute('aria-label')||'').trim().slice(0,70),w:+r.width.toFixed(1),h:+r.height.toFixed(1),cls:typeof el.className==='string'?el.className.slice(0,100):''}}).filter(x=>x.w<44||x.h<44);
              });
              try{
                const toggle=page.locator('.site-header__menu-toggle');
                await toggle.click(); const a=await toggle.getAttribute('aria-expanded');
                await page.keyboard.press('Escape'); const b=await toggle.getAttribute('aria-expanded'); const focused=await toggle.evaluate(e=>document.activeElement===e);
                await toggle.click(); await page.locator('main').click({position:{x:5,y:5}}); const c=await toggle.getAttribute('aria-expanded');
                menu=(a==='true'&&b==='false'&&focused&&c==='false')?'pass':'fail';
              }catch(e){menu=`fail:${e.message}`}
            }
            try{
              await page.evaluate(()=>scrollTo(0,0)); await page.locator('body').press('Tab');
              const s=page.locator('.skip-link'); const focused=await s.evaluate(e=>document.activeElement===e); const box=await s.boundingBox();
              if(focused) await page.keyboard.press('Enter'); const mainFocused=await page.locator('#main-content').evaluate(e=>document.activeElement===e);
              skip=(focused&&box&&box.y>=0&&mainFocused)?'pass':'fail';
            }catch(e){skip=`fail:${e.message}`}

            const issues=[];
            if(!resp?.ok()) issues.push('HTTP route failed');
            if(JSON.stringify(state.sections)!==JSON.stringify(expected)) issues.push(`section order ${JSON.stringify(state.sections)}`);
            if(state.scrollWidth>state.clientWidth) issues.push(`horizontal scroll ${state.scrollWidth}>${state.clientWidth}`);
            if(state.overflow.length) issues.push(`content overflow ${JSON.stringify(state.overflow)}`);
            if(state.broken.length) issues.push(`broken images ${JSON.stringify(state.broken)}`);
            if(touch.length) issues.push(`touch targets ${JSON.stringify(touch)}`);
            if(menu!=='n/a'&&menu!=='pass') issues.push(`menu ${menu}`);
            if(skip!=='pass') issues.push(`skip ${skip}`);
            if(consoleErrors.length) issues.push(`console ${JSON.stringify(consoleErrors)}`);
            if(pageErrors.length) issues.push(`page errors ${JSON.stringify(pageErrors)}`);
            if(requestFailures.length) issues.push(`request failures ${JSON.stringify(requestFailures)}`);
            if(issues.length) failedOverall=true;
            await page.screenshot({path:`qa-output-postfix/${name}.png`,fullPage:true});
            report.push({name,issues,state,touch,menu,skip});
            await context.close();
          }

          for(const mode of [
            ['reduced-motion',{viewport:{width:390,height:844},reducedMotion:'reduce'}],
            ['forced-colors',{viewport:{width:390,height:844},forcedColors:'active'}]
          ]){
            const [name,opts]=mode; const context=await browser.newContext(opts); const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); let issues=[];
            if(name==='reduced-motion'){
              const v=await page.evaluate(()=>({scroll:getComputedStyle(document.documentElement).scrollBehavior,transition:getComputedStyle(document.querySelector('.hpv2-button')).transitionDuration,cube:getComputedStyle(document.querySelector('.site-header__cube')).animationName}));
              if(!(v.scroll==='auto'&&v.transition.split(',').every(x=>parseFloat(x)===0)&&v.cube==='none')) issues.push(JSON.stringify(v));
            }else{
              const v=await page.evaluate(()=>{const b=getComputedStyle(document.querySelector('.hpv2-button--primary')),s=getComputedStyle(document.querySelector('.hpv2-status'));return {buttonBorder:parseFloat(b.borderWidth),buttonStyle:b.borderStyle,statusBorder:parseFloat(s.borderLeftWidth),statusStyle:s.borderLeftStyle}});
              if(!(v.buttonBorder>0&&v.buttonStyle!=='none'&&v.statusBorder>0&&v.statusStyle!=='none')) issues.push(JSON.stringify(v));
            }
            if(issues.length) failedOverall=true; report.push({name,issues}); await context.close();
          }

          await browser.close();
          fs.writeFileSync('qa-output-postfix/browser-results.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          process.exit(failedOverall?1:0);
          JS
          set -o pipefail
          node homepage-v2-postfix.mjs 2>&1 | tee qa-output-postfix/browser.log

      - name: Upload QA evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-v2-postfix-${{ github.sha }}
          path: qa-output-postfix/
          if-no-files-found: warn
          retention-days: 14

      - name: Record QA result on QA branch
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.build.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          EXTERNAL: ${{ steps.external.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SERVER: ${{ steps.server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          mkdir -p qa-results/homepage-v2-postfix
          {
            echo '# Homepage V2 Post-Fix Technical QA'
            echo
            echo "Tested QA commit: $GITHUB_SHA"
            echo 'Production parent: c791a6e5e4c1e15bd0328cd890a7f055fe589019'
            echo "Jekyll build: $BUILD"
            echo "Generated validation: ${GENERATED:-skipped}"
            echo "External/live targets: ${EXTERNAL:-skipped}"
            echo "Playwright install: ${INSTALL:-skipped}"
            echo "Local server: ${SERVER:-skipped}"
            echo "Browser matrix: ${BROWSER:-skipped}"
            echo "Artifact ID: ${ARTIFACT_ID:-none}"
            echo "Artifact URL: ${ARTIFACT_URL:-none}"
            echo
            echo '## Generated validation'; echo '```'; cat qa-output-postfix/generated.log 2>/dev/null || true; echo '```'
            echo
            echo '## External links'; echo '```'; cat qa-output-postfix/external-links.log 2>/dev/null || true; echo '```'
            echo
            echo '## Browser result'; echo '```json'; cat qa-output-postfix/browser-results.json 2>/dev/null || true; echo '```'
          } > qa-results/homepage-v2-postfix/latest.md
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-results/homepage-v2-postfix/latest.md
          git commit -m 'Record Homepage V2 post-fix QA result' || exit 0
          git push origin HEAD:qa/homepage-v2-postfix-c791

      - name: Enforce gate
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.build.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          EXTERNAL: ${{ steps.external.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SERVER: ${{ steps.server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          for v in "$BUILD" "$GENERATED" "$EXTERNAL" "$INSTALL" "$SERVER" "$BROWSER"; do [ "$v" = success ] || exit 1; done
