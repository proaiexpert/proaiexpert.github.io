name: Homepage V2 Technical QA R2

on:
  push:
    branches:
      - qa/homepage-v2-technical-2026-08-07-r2
    paths-ignore:
      - qa-results/homepage-v2-r2/**

permissions:
  contents: write

jobs:
  technical-qa-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v6

      - name: Apply candidate CSS correction locally
        id: patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/css/homepage-v2.css')
          s = p.read_text(encoding='utf-8')

          old1 = '''.hpv2-proof-copy h2 {
  font-size: clamp(40px, 4.5vw, 66px);
}'''
          new1 = '''.hpv2-proof-copy {
  min-width: 0;
}

.hpv2-proof-copy h2 {
  font-size: clamp(40px, 4.5vw, 66px);
}'''
          assert s.count(old1) == 1, f'proof-copy anchor count: {s.count(old1)}'
          s = s.replace(old1, new1, 1)

          old2 = '''  .lang-ru .hpv2-hero h1 {
    max-width: none;
    font-size: clamp(38px, 11.6vw, 55px);
    line-height: 1;
  }'''
          new2 = '''  .lang-ru .hpv2-hero h1 {
    max-width: none;
    font-size: clamp(38px, 11.6vw, 55px);
    line-height: 1;
  }

  .lang-ru .hpv2-proof-copy h2 {
    font-size: clamp(32px, 9.75vw, 38px);
  }'''
          assert s.count(old2) == 1, f'RU mobile anchor count: {s.count(old2)}'
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          echo '--- candidate diff ---'
          git diff -- assets/css/homepage-v2.css

      - name: Production-equivalent Jekyll build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qa-output
          set -o pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          {
            gem install --user-install jekyll -v 4.3.4 --no-document
            gem install --user-install webrick --no-document
            jekyll build --source . --destination _site
          } 2>&1 | tee qa-output/jekyll-build.log

      - name: Validate generated EN/RU contracts
        id: generated
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee qa-output/generated-validation.log
          from pathlib import Path
          from collections import Counter
          import html, re, sys

          sections_expected = ['hero','connected-journey','directions','financial-stream','ways-to-start','delivery','founder','selected-work','insights','private-review']
          contact_expected = {
            'en': [
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake',
              '/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake'],
            'ru': [
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_hero#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=websites_branding#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=ai_systems_automation#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_ways_to_start&selected_direction=both#project-intake',
              '/ru/contact/?intent=private_review&source_page=homepage&source_cta=homepage_final#project-intake']}
          meta_expected = {
            'en': (Path('_site/index.html'),'en','https://proai-expert.com/','en_US'),
            'ru': (Path('_site/ru/index.html'),'ru','https://proai-expert.com/ru/','ru_RU')}
          externally_hosted_routes = {'/handyman-vancouver-portland-demo/'}
          errors=[]
          def check(v,m):
            if not v: errors.append(m)
          def tags(text,name): return re.findall(rf'<{name}\b[^>]*>',text,re.I)
          def attr(tag,name):
            m=re.search(rf'\b{name}=["\']([^"\']*)["\']',tag,re.I)
            return html.unescape(m.group(1)) if m else None

          for loc,(path,lang,canonical,ogloc) in meta_expected.items():
            check(path.exists(),f'{loc}: generated page missing')
            if not path.exists(): continue
            text=path.read_text(encoding='utf-8')
            check('{%' not in text and '{{' not in text,f'{loc}: unresolved Liquid')
            check(len(re.findall(r'<!doctype\s+html',text,re.I))==1,f'{loc}: doctype count')
            for name in ('html','head','body','main'):
              check(len(re.findall(rf'<{name}\b',text,re.I))==1,f'{loc}: {name} count')
            html_tags=tags(text,'html')
            check(html_tags and attr(html_tags[0],'lang')==lang,f'{loc}: html lang')
            links=tags(text,'link')
            cans=[attr(t,'href') for t in links if attr(t,'rel')=='canonical']
            check(cans==[canonical],f'{loc}: canonical {cans}')
            alts={(attr(t,'hreflang'),attr(t,'href')) for t in links if attr(t,'rel')=='alternate'}
            check(alts=={('en','https://proai-expert.com/'),('ru','https://proai-expert.com/ru/'),('x-default','https://proai-expert.com/')},f'{loc}: hreflang {alts}')
            metas=tags(text,'meta')
            ogs=[attr(t,'content') for t in metas if attr(t,'property')=='og:locale']
            check(ogs==[ogloc],f'{loc}: og locale {ogs}')
            check(text.count('/assets/css/homepage-v2.css?v=20260805.1')==1,f'{loc}: V2 CSS link')
            check('/assets/js/header-system-v1.js?v=20260804.1' in text,f'{loc}: header JS')
            ids=re.findall(r'\bid=["\']([^"\']+)["\']',text,re.I)
            dup=sorted(k for k,v in Counter(ids).items() if v>1)
            check(not dup,f'{loc}: duplicate ids {dup}')
            sec=[]
            for t in tags(text,'section'):
              if 'hpv2-section' in (attr(t,'class') or '').split(): sec.append(attr(t,'id'))
            check(sec==sections_expected,f'{loc}: section order {sec}')
            hrefs=[attr(t,'href') for t in tags(text,'a') if attr(t,'href')]
            contacts=[h for h in hrefs if h.startswith('/contact/?') or h.startswith('/ru/contact/?')]
            check(contacts==contact_expected[loc],f'{loc}: contacts {contacts}')
            check('source_context=' not in text,f'{loc}: source_context present')
            selected=re.findall(r'selected_direction=([^&#"\']+)',html.unescape(text))
            check(selected==['websites_branding','ai_systems_automation','both'],f'{loc}: selected directions {selected}')

            asset_urls=set()
            for tagname,aname in [('img','src'),('source','srcset'),('script','src'),('link','href')]:
              for t in tags(text,tagname):
                val=attr(t,aname)
                if not val: continue
                for candidate in val.split(','):
                  url=candidate.strip().split()[0]
                  if url.startswith('/') and re.search(r'\.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)(?:\?|$)',url,re.I): asset_urls.add(url.split('?',1)[0])
            missing=[u for u in sorted(asset_urls) if not Path('_site'+u).is_file()]
            check(not missing,f'{loc}: missing assets {missing}')

            routes=set()
            for href in hrefs:
              if not href.startswith('/') or href.startswith('//'): continue
              route=href.split('#',1)[0].split('?',1)[0]
              if not route or route in externally_hosted_routes or re.search(r'\.[a-z0-9]{2,5}$',route,re.I): continue
              routes.add(route)
            missing_routes=[]
            for route in sorted(routes):
              c=Path('_site/index.html') if route=='/' else Path('_site'+route+'index.html') if route.endswith('/') else Path('_site'+route)
              if not c.exists() and not (Path('_site'+route+'/index.html')).exists(): missing_routes.append(route)
            check(not missing_routes,f'{loc}: missing routes {missing_routes}')

          if errors:
            print('GENERATED VALIDATION: FAIL')
            for e in errors: print(' -',e)
            sys.exit(1)
          print('GENERATED VALIDATION: PASS')
          PY

      - name: Install Chromium QA runtime
        id: install
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.62.0
          npx playwright install --with-deps chromium

      - name: Write browser QA
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          cat > homepage-v2-r2.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');
          const matrix=[
            ['EN-1440','/',1440,900],['RU-1440','/ru/',1440,900],
            ['EN-390','/',390,844],['RU-390','/ru/',390,844],
            ['EN-320','/',320,568],['RU-320','/ru/',320,568],
            ['EN-844x390','/',844,390],['RU-844x390','/ru/',844,390]
          ];
          const expected=['hero','connected-journey','directions','financial-stream','ways-to-start','delivery','founder','selected-work','insights','private-review'];

          for(const [name,path,width,height] of matrix){
            test(name,async({browser})=>{
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              const consoleErrors=[],pageErrors=[],failed=[];
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||'failed'}`));
              const response=await page.goto(`http://127.0.0.1:4173${path}`,{waitUntil:'networkidle'});
              expect(response&&response.ok()).toBeTruthy();
              expect(await page.locator('main.hpv2 > section.hpv2-section').evaluateAll(n=>n.map(x=>x.id))).toEqual(expected);

              await page.locator('img').evaluateAll(imgs=>imgs.forEach(img=>img.loading='eager'));
              await page.evaluate(async()=>{
                const step=Math.max(260,Math.floor(innerHeight*.65));
                for(let y=0;y<document.documentElement.scrollHeight;y+=step){scrollTo(0,y);await new Promise(r=>setTimeout(r,55));}
                await Promise.all([...document.images].map(img=>img.decode().catch(()=>{})));
                scrollTo(0,0);
              });
              await page.waitForTimeout(250);

              const m=await page.evaluate(()=>{
                const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
                const overflow=[...document.querySelectorAll('body *')].filter(visible).map(el=>{const r=el.getBoundingClientRect();return {el,left:r.left,right:r.right,width:r.width}}).filter(x=>x.left < -1 || x.right > innerWidth+1).map(x=>({tag:x.el.tagName,id:x.el.id||'',cls:typeof x.el.className==='string'?x.el.className.slice(0,120):'',left:+x.left.toFixed(1),right:+x.right.toFixed(1),width:+x.width.toFixed(1)}));
                const broken=[...document.images].filter(img=>!img.complete||img.naturalWidth===0).map(img=>img.getAttribute('src'));
                return {scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,overflow,broken};
              });
              expect(m.scrollWidth,JSON.stringify(m.overflow,null,2)).toBeLessThanOrEqual(m.clientWidth);
              expect(m.overflow,'Visible content crosses viewport').toEqual([]);
              expect(m.broken,'Broken/undecoded images').toEqual([]);

              if(width<=844){
                const small=await page.evaluate(()=>{
                  const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
                  return [...document.querySelectorAll('a[href],button')].filter(visible).filter(el=>!el.classList.contains('skip-link')).map(el=>{const r=el.getBoundingClientRect();return {text:(el.innerText||el.getAttribute('aria-label')||'').trim().slice(0,70),w:+r.width.toFixed(1),h:+r.height.toFixed(1),cls:el.className||''}}).filter(x=>x.w<44||x.h<44);
                });
                expect(small,'Touch targets under 44x44').toEqual([]);
                const toggle=page.locator('.site-header__menu-toggle');
                await expect(toggle).toBeVisible();
                await toggle.click();
                await expect(toggle).toHaveAttribute('aria-expanded','true');
                await page.keyboard.press('Escape');
                await expect(toggle).toHaveAttribute('aria-expanded','false');
                await expect(toggle).toBeFocused();
                await toggle.click();
                await page.evaluate(()=>document.querySelector('main').click());
                await expect(toggle).toHaveAttribute('aria-expanded','false');
              }

              await page.evaluate(()=>scrollTo(0,0));
              await page.locator('body').press('Tab');
              await expect(page.locator('.skip-link')).toBeFocused();
              const box=await page.locator('.skip-link').boundingBox();
              expect(box&&box.y>=0).toBeTruthy();
              await page.keyboard.press('Enter');
              await expect(page.locator('#main-content')).toBeFocused();

              await page.screenshot({path:`qa-output/${name}.png`,fullPage:true});
              expect(consoleErrors,'Console errors').toEqual([]);
              expect(pageErrors,'Page errors').toEqual([]);
              expect(failed,'Failed requests').toEqual([]);
              await context.close();
            });
          }

          test('reduced-motion',async({browser})=>{
            const c=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'}),p=await c.newPage();
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const v=await p.evaluate(()=>({scroll:getComputedStyle(document.documentElement).scrollBehavior,trans:getComputedStyle(document.querySelector('.hpv2-button')).transitionDuration,cube:getComputedStyle(document.querySelector('.site-header__cube')).animationName}));
            expect(v.scroll).toBe('auto');expect(v.trans.split(',').every(x=>parseFloat(x)===0)).toBeTruthy();expect(v.cube).toBe('none');await c.close();
          });

          test('forced-colors',async({browser})=>{
            const c=await browser.newContext({viewport:{width:390,height:844},forcedColors:'active'}),p=await c.newPage();
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const v=await p.evaluate(()=>{const b=getComputedStyle(document.querySelector('.hpv2-button--primary')),s=getComputedStyle(document.querySelector('.hpv2-status'));return {bb:b.borderWidth,bs:b.borderStyle,sb:s.borderLeftWidth,ss:s.borderLeftStyle}});
            expect(parseFloat(v.bb)).toBeGreaterThan(0);expect(v.bs).not.toBe('none');expect(parseFloat(v.sb)).toBeGreaterThan(0);expect(v.ss).not.toBe('none');await c.close();
          });
          JS

      - name: Start generated site
        id: server
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p qa-output
          nohup python3 -m http.server 4173 --directory _site > qa-output/http-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Run browser QA matrix
        id: browser
        if: steps.server.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test homepage-v2-r2.spec.js --browser=chromium --reporter=line 2>&1 | tee qa-output/playwright.log

      - name: Upload QA evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-v2-technical-qa-r2-${{ github.sha }}
          path: |
            qa-output/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist result on QA branch
        if: always()
        shell: bash
        env:
          PATCH: ${{ steps.patch.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SERVER: ${{ steps.server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          mkdir -p qa-results/homepage-v2-r2
          {
            echo '# Homepage V2 Technical QA R2'
            echo
            echo "Tested QA commit: $GITHUB_SHA"
            echo 'Production parent: 58b68a060de341b9b34727ae17325ba5abaa07b4'
            echo 'Candidate correction: proof-copy min-width:0 + RU proof H2 mobile clamp'
            echo "Patch: $PATCH"
            echo "Jekyll 4.3.4 build: $BUILD"
            echo "Generated validation: ${GENERATED:-skipped}"
            echo "Playwright install: ${INSTALL:-skipped}"
            echo "Local server: ${SERVER:-skipped}"
            echo "Browser QA: ${BROWSER:-skipped}"
            echo "Artifact ID: ${ARTIFACT_ID:-none}"
            echo "Artifact URL: ${ARTIFACT_URL:-none}"
            echo
            echo '## Generated validation'
            echo '```'; cat qa-output/generated-validation.log 2>/dev/null || true; echo '```'
            echo
            echo '## Browser QA tail'
            echo '```'; tail -n 220 qa-output/playwright.log 2>/dev/null || true; echo '```'
          } > qa-results/homepage-v2-r2/latest.md
          git restore assets/css/homepage-v2.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-results/homepage-v2-r2/latest.md
          git commit -m 'Record Homepage V2 QA R2 result' || exit 0
          git push origin HEAD:qa/homepage-v2-technical-2026-08-07-r2

      - name: Enforce QA gate
        if: always()
        shell: bash
        env:
          PATCH: ${{ steps.patch.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GENERATED: ${{ steps.generated.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SERVER: ${{ steps.server.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          for value in "$PATCH" "$BUILD" "$GENERATED" "$INSTALL" "$SERVER" "$BROWSER"; do [ "$value" = success ] || exit 1; done
