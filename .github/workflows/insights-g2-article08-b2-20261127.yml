          const visual=await p.evaluate(()=>{
                const arch=document.querySelector('.g2__architecture'),table=document.querySelector('.g2__scroll--main'),r=table.querySelector('th[scope="row"]'),cards=[...arch.querySelectorAll('.g2__level')];
                return {svg:[...arch.querySelectorAll('svg')].map(e=>({w:e.getBoundingClientRect().width,label:e.getAttribute('aria-label'),text:e.querySelectorAll('text').length})),colors:cards.map(e=>getComputedStyle(e).borderTopColor),criterion:getComputedStyle(r).position,header:getComputedStyle(r).backgroundColor,alias:document.querySelectorAll('#comparison-framework').length,approval:!!document.querySelector('.g2__approval-note'),cta:!!document.querySelector('.insight-v2-article-cta'),geometry:{w:table.clientWidth,h:table.getBoundingClientRect().height,scroll:table.scrollWidth,table:table.querySelector('table').getBoundingClientRect().height}};
              });
              check(visual.svg.length===3&&visual.svg.every(x=>x.w>120&&x.label&&x.text>=4)&&new Set(visual.colors).size===3,label+' diagram and semantic palette',JSON.stringify(visual));
              check(visual.criterion==='sticky'&&visual.alias===1&&visual.approval&&visual.cta,label+' local UX and historical alias');
           const contrast=await p.evaluate(()=>{
             const rgb=s=>s.match(/[\d.]+/g).slice(0,3).map(Number);
             const lum=v=>v.map(x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}).reduce((n,x,i)=>n+x*[.2126,.7152,.0722][i],0);
             const ratio=(a,b)=>(Math.max(lum(a),lum(b))+.05)/(Math.min(lum(a),lum(b))+.05);
             const h=[...document.querySelectorAll('.g2__scroll--main thead th')].slice(1).map(e=>ratio(rgb(getComputedStyle(e).color),rgb(getComputedStyle(e).backgroundColor)));
             const cell=[...document.querySelectorAll('.g2__scroll--main tbody tr:first-child td')].map(e=>ratio(rgb(getComputedStyle(e).color),rgb(getComputedStyle(e).backgroundColor)));
             return {header:h,cell};
           });
           check([...contrast.header,...contrast.cell].every(x=>x>=4.5),label+' matrix text contrast >=4.5',JSON.stringify(contrast));
           if(width===1440){
             const card=p.locator('.g2__level').first();
             await card.hover();
             check(await card.evaluate(e=>getComputedStyle(e).borderLeftColor===getComputedStyle(e).borderTopColor),label+' hover border');
             const cta=p.locator('.insight-v2-article-cta__action').first();
