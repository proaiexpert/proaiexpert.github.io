          for p in ['_data/insights.yml','sitemap.xml']:assert git('show',reviewed+':'+p)==Path(p).read_text()
          for lang,route in R.items():
           src=Path(route.strip('/')+'/index.html').read_text();oldsrc=git('show',reviewed+':'+route.strip('/')+'/index.html')
