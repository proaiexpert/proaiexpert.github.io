          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          def inv(s):return [(el.findtext('s:loc',namespaces=ns),el.findtext('s:lastmod',namespaces=ns)) for el in ET.fromstring(s).findall('s:url',ns)]
          a,b=inv(old),inv(new);assert len(a)==len(b)==46
