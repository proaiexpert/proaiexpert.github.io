          python - <<'PY'
          import os, subprocess, re, json, time, urllib.request
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          repo=os.environ['GITHUB_REPOSITORY']
          base=None
          for i in range(40):
           p=subprocess.run(['gh','api',f'repos/{repo}/commits/{sha}/check-runs'],capture_output=True,text=True)
           if p.returncode==0:
            for c in json.loads(p.stdout).get('check_runs',[]):
             if c['name']=='Cloudflare Pages' and c['conclusion']=='success':
              m=re.search(r'https://[a-f0-9]{8}\.proaiexpert-github-io\.pages\.dev',c.get('output',{}).get('summary',''))
              if m:base=m.group()
           if base:break
           time.sleep(10)
          assert base,'Cloudflare immutable deployment not confirmed'
          print('G2_IMMUTABLE_BASE='+base,flush=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PREVIEW_BASE='+base+'\n')
