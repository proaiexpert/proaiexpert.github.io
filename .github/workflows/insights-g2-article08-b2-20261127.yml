             check(await cta.evaluate(e=>getComputedStyle(e).outlineStyle!=='none'),label+' CTA keyboard focus');
             check(await card.evaluate(e=>getComputedStyle(e).transitionDuration==='0s'),label+' reduced motion transition');
           }
              if(width===390||width===1440){
