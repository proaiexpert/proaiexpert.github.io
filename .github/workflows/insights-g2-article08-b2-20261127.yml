           assert article['author']['@type']=='Organization' and article['author']['name']=='ProAI Expert'
           assert article['datePublished']=='2026-04-05' and article['dateModified']=='2026-11-27' and article['image']['url']==og
           assert any(x['@type']=='BreadcrumbList' for x in graph)
           print('G2_COMPILED_'+lang+'_PASS')
          for p in ['insights/where-automation-delivers-its-first-real-roi/index.html','ru/insights/gde-avtomatizatsiya-daet-pervuyu-realnuyu-polzu-biznesu/index.html']:
           assert Path(p).read_text()==git('show',base+':'+p)
           html=Path('_site',p).read_text();assert 'data-g1-calculator' in html and 'data-home-footer-golden-r3' in html and 'article07-first-automation-roi-hero.webp' in html
          for p in ['insights/index.html','ru/insights/index.html','insights/process-clarity-comes-before-scalable-automation/index.html','insights/ai-search-optimization-for-service-businesses/index.html','insights/why-service-business-websites-fail-to-convert-high-intent-visitors/index.html','insights/how-much-does-a-business-website-cost-in-2026-a-strategic-budget-view/index.html','insights/repair-redesign-or-rebuild-your-business-website/index.html']:
           assert 'data-home-footer-golden-r3' in Path('_site',p).read_text()
          print('G2_SCOPE_4_FILES_SITEMAP_46_PARITY_SCHEMA_LINKS_ARTICLE07_REGRESSION_PASS')
