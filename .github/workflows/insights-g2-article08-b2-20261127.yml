          set -euo pipefail
          dest='agent/insights-g2-article08-b2-compiled-20261127'
          if git ls-remote --heads origin "refs/heads/$dest" | grep -q .; then echo 'Immutable branch exists; refusing overwrite'; exit 1; fi
          tmp="$(mktemp -d)"
          cp -a _site/. "$tmp/"
          rm -f "$tmp/CNAME"
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > "$tmp/_headers"
          touch "$tmp/.nojekyll"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan "$dest"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$tmp"/. .
          git add -A
          git commit -m 'preview: Article08 compiled Jekyll from 7ace021c846d6c94733716638d57c583f3d652d9'
