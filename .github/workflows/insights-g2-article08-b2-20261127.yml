          class Meta(HTMLParser):
           def __init__(self):super().__init__();self.m={};self.l=[]
           def handle_starttag(self,t,attrs):
            a=dict(attrs)
            if t=='meta' and (a.get('property') or a.get('name')):self.m.setdefault(a.get('property') or a.get('name'),[]).append(a.get('content'))
