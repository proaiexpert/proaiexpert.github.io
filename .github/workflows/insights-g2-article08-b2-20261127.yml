          print('G2B2_DELTA_TWO_FILES_TABLE_ROWS_LINKS_IDENTICAL')
          for fragment in ['#comparison-framework','#faq']:
           x=subprocess.run(['git','grep','-n','-F',fragment,reviewed,'--','*.html','*.md','*.yml'],capture_output=True,text=True)
           print('G2B2_INCOMING_FRAGMENT',fragment,x.stdout[:6000] or 'NO_MATCH')
          old=git('show',base+':_data/insights.yml');new=Path('_data/insights.yml').read_text()
          strip=lambda s:re.sub(r'(?ms)^- id: ai-agent-vs-automation\n.*?(?=^- id: |\Z)','',s)
          assert strip(old)==strip(new)
          block=re.search(r'(?ms)^- id: ai-agent-vs-automation\n.*?(?=^- id: |\Z)',new).group()
          assert block.count('date_published: "2026-04-05"')==2 and block.count('date_modified: "2026-11-27"')==2
