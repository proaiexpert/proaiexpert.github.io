           const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
           const res=await p.goto(root+routes[lang],{waitUntil:'load',timeout:45000});
           return {ctx,p,errors,res};
          }
          async function shape(p){return p.evaluate(()=>{
           const tables=[...document.querySelectorAll('.g2__scroll')].map(e=>({cols:e.querySelectorAll('thead th').length,rows:e.querySelectorAll('tbody tr').length,scroll:e.scrollWidth-e.clientWidth,focus:e.tabIndex,right:e.getBoundingClientRect().right,css:getComputedStyle(e).overflowX}));
           return {lang:document.documentElement.lang,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,tables,author:document.querySelector('[data-author-type]')?.dataset.authorType,footer:!!document.querySelector('[data-home-footer-golden-r3]'),chapters:document.querySelectorAll('.insight-v2-rail a').length,signals:document.querySelector('[data-insight-v2-signal]')?.dataset.signalCount,links:[...document.querySelectorAll('.g2 a,.insight-v2-article-cta a')].map(e=>e.getAttribute('href')),lead:document.querySelector('.insight-v2-lead')?.innerText,scrollY:window.scrollY};
           });}
          (async()=>{
           for(const [name,engine] of [['chromium',chromium],['webkit',webkit]]){
           const browser=await engine.launch({headless:true});
           for(const lang of ['en','ru']){
           for(const width of (process.env.PREVIEW_BASE?[390,1440]:widths)){
           const {ctx,p,errors,res}=await load(browser,lang,width);const label=name+'/'+lang+'/'+width;const s=await shape(p);
           check(res?.status()===200,label+' HTTP');
           if(width===390||width===1440){check(s.scrollY===0,label+' initial scroll');await p.screenshot({path:output+'/'+name+'-'+lang+'-'+width+'-initial.png'});}
