          })().catch(e=>{console.error(e);process.exitCode=1});
          BEFORE
          node /tmp/g2-before.cjs
          cat >/tmp/g2-browser.cjs <<'JS'
          const {chromium,webkit}=require('/tmp/g2pw/node_modules/playwright');
          const root=process.env.PREVIEW_BASE||'http://127.0.0.1:8765';
          const routes={en:'/insights/ai-agent-or-automation-what-your-business-actually-needs/',ru:'/ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/'};
          const widths=[320,390,430,844,1440];
          const output='/tmp/g2-evidence';
          let fail=[],checks=0;
          const check=(ok,label,detail='')=>{checks++;if(!ok)fail.push(label+' '+detail);};
          async function load(browser,lang,width,opts={}){
