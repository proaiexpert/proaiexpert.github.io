           assert {x.get('hreflang'):x.get('href') for x in m.l if x.get('hreflang')}=={'en':'https://proai-expert.com'+R['en'],'ru':'https://proai-expert.com'+R['ru'],'x-default':'https://proai-expert.com'+R['en']}
