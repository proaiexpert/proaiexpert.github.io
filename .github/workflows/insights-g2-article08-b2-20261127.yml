          BASE="$(grep '^PREVIEW_BASE=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)"
          for route in /insights/ai-agent-or-automation-what-your-business-actually-needs/ /ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/; do
