name: G2 Article08 source-pinned build browser and immutable preview
on:
  push:
    branches:
      - qa/insights-g2-article08-20261127
    paths:
      - .github/workflows/insights-g2-article08-qa-20261127.yml
permissions:
  contents: write
  checks: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6dc75a5520e49b32bcb219a0688242b63e53919e
          fetch-depth: 0
      - name: Jekyll and scope validators
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          node scripts/verify-proai-cube-integrity-r2.mjs
          python scripts/apply-social-preview-defaults.py --mode source --root .
          jekyll build --source . --destination _site
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site
          python scripts/validate-insights-v2-r1.py --source-root . --site-root _site
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,json,subprocess,xml.etree.ElementTree as ET
          base='af507c748647b0851ff8c4d4fbf0e8cb90070a90'
          head='6dc75a5520e49b32bcb219a0688242b63e53919e'
          R={'en':'/insights/ai-agent-or-automation-what-your-business-actually-needs/','ru':'/ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/'}
          links={'en':['/insights/process-clarity-comes-before-scalable-automation/','/insights/where-automation-delivers-its-first-real-roi/','/insights/how-much-does-a-business-website-cost-in-2026-a-strategic-budget-view/','/ai-systems/','/contact/#project-intake'],'ru':['/ru/insights/arkhitektura-vkhodyashchego-potoka-poryadok-v-zayavkakh/','/ru/insights/gde-avtomatizatsiya-daet-pervuyu-realnuyu-polzu-biznesu/','/ru/insights/ekonomika-proekta-pochemu-otsenka-po-stranitsam-oshibochna/','/ru/ai-systems/','/ru/contact/#project-intake']}
          expected={x.strip('/')+'/index.html' for x in R.values()}|{'_data/insights.yml','sitemap.xml'}
          git=lambda *a:subprocess.check_output(['git',*a],text=True)
          assert git('rev-parse','HEAD').strip()==head
          assert set(git('diff','--name-only',base,head).splitlines())==expected
          subprocess.run(['git','diff','--check',base,head],check=True)
          old=git('show',base+':_data/insights.yml');new=Path('_data/insights.yml').read_text()
          strip=lambda s:re.sub(r'(?ms)^- id: ai-agent-vs-automation\n.*?(?=^- id: |\Z)','',s)
          assert strip(old)==strip(new)
          block=re.search(r'(?ms)^- id: ai-agent-vs-automation\n.*?(?=^- id: |\Z)',new).group()
          assert block.count('date_published: "2026-04-05"')==2 and block.count('date_modified: "2026-11-27"')==2
          assert 'author_ref: proai' in block and 'related_ids: [process-clarity, first-automation-roi]' in block
          old=git('show',base+':sitemap.xml');new=Path('sitemap.xml').read_text()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          def inv(s):return [(el.findtext('s:loc',namespaces=ns),el.findtext('s:lastmod',namespaces=ns)) for el in ET.fromstring(s).findall('s:url',ns)]
          a,b=inv(old),inv(new);assert len(a)==len(b)==46
          assert [u for u,d in a]==[u for u,d in b]
          assert [(u,d) for (u,d),(v,e) in zip(b,a) if d!=e]==[(u,'2026-11-27') for u,d in b if u in ['https://proai-expert.com'+r for r in R.values()]]
          class Meta(HTMLParser):
           def __init__(self):super().__init__();self.m={};self.l=[]
           def handle_starttag(self,t,attrs):
            a=dict(attrs)
            if t=='meta' and (a.get('property') or a.get('name')):self.m.setdefault(a.get('property') or a.get('name'),[]).append(a.get('content'))
            if t=='link':self.l.append(a)
          for lang,route in R.items():
           p=route.strip('/')+'/index.html'
           s=Path(p).read_text();html=Path('_site',p).read_text()
           assert s.startswith('---\nlayout: insight-v2\n') and s.count('<h2 id=')==10 and s.count('  - label:')==3
           assert s.count('<tr><th scope="row">')==16 and s.count('<table')==2
           assert s.count('tabindex="0"')==2 and s.count('<caption>')==2
           assert 'Alderline Appliance Service' in s and ('Fictional example' if lang=='en' else 'вымышленная') in s
           assert 'data-author-type="organization"' in html and 'data-signal-count="3"' in html and 'data-related-count="2"' in html
           assert 'data-related-id="process-clarity"' in html and 'data-related-id="first-automation-roi"' in html
           assert 'data-footer-family="editorial"' in html and 'data-home-footer-golden-r3' in html
           assert '{% include' not in html and 'data-insight-v2-article' in html
           for link in links[lang]:
            assert 'href="'+link+'"' in s, (lang,link)
            assert Path('_site',link.split('#')[0].strip('/'),'index.html').is_file(), ('missing link',link)
           assert 'id="project-intake"' in Path('_site','contact/index.html' if lang=='en' else 'ru/contact/index.html').read_text()
           for url in ['https://www.anthropic.com/research/building-effective-agents','https://www.nist.gov/itl/ai-risk-management-framework/nist-ai-rmf-playbook','https://genai.owasp.org/llm2026/llm032026-excessive-agency/','https://www.ftc.gov/business-guidance/resources/protecting-personal-information-guide-business']:assert url in s
           m=Meta();m.feed(html.split('</head>',1)[0]); og='https://proai-expert.com/assets/social/proai-home-og-'+lang+'-r1-1.png'
           assert m.m['og:image']==[og] and m.m['twitter:image']==[og]
           assert [x.get('href') for x in m.l if x.get('rel')=='canonical']==['https://proai-expert.com'+route]
           assert {x.get('hreflang'):x.get('href') for x in m.l if x.get('hreflang')}=={'en':'https://proai-expert.com'+R['en'],'ru':'https://proai-expert.com'+R['ru'],'x-default':'https://proai-expert.com'+R['en']}
           graph=json.loads(re.search(r'<script type="application/ld\+json">([\s\S]*?)</script>',html).group(1))['@graph']
           article=next(x for x in graph if x['@type']=='Article')
           assert article['author']['@type']=='Organization' and article['author']['name']=='ProAI Expert'
           assert article['datePublished']=='2026-04-05' and article['dateModified']=='2026-11-27' and article['image']['url']==og
           assert any(x['@type']=='BreadcrumbList' for x in graph)
           print('G2_COMPILED_'+lang+'_PASS')
          for p in ['insights/where-automation-delivers-its-first-real-roi/index.html','ru/insights/gde-avtomatizatsiya-daet-pervuyu-realnuyu-polzu-biznesu/index.html']:
           assert Path(p).read_text()==git('show',base+':'+p)
           html=Path('_site',p).read_text();assert 'data-g1-calculator' in html and 'data-home-footer-golden-r3' in html and 'article07-first-automation-roi-hero.webp' in html
          for p in ['insights/index.html','ru/insights/index.html','insights/process-clarity-comes-before-scalable-automation/index.html','insights/ai-search-optimization-for-service-businesses/index.html','insights/why-service-business-websites-fail-to-convert-high-intent-visitors/index.html','insights/how-much-does-a-business-website-cost-in-2026-a-strategic-budget-view/index.html','insights/repair-redesign-or-rebuild-your-business-website/index.html']:
           assert 'data-home-footer-golden-r3' in Path('_site',p).read_text()
          print('G2_SCOPE_4_FILES_SITEMAP_46_PARITY_SCHEMA_LINKS_ARTICLE07_REGRESSION_PASS')
          PY
      - name: Chromium WebKit responsive and accessibility
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/g2pw --no-audit --no-fund --no-save playwright@1.56.1
          npx --prefix /tmp/g2pw playwright install --with-deps chromium webkit
          python -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/g2-server.log 2>&1 &
          mkdir -p /tmp/g2-evidence
          cat >/tmp/g2-browser.cjs <<'JS'
          const {chromium,webkit}=require('/tmp/g2pw/node_modules/playwright');
          const root=process.env.PREVIEW_BASE||'http://127.0.0.1:8765';
          const routes={en:'/insights/ai-agent-or-automation-what-your-business-actually-needs/',ru:'/ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/'};
          const widths=[320,375,390,430,844,932,1280,1440,1600];
          const output='/tmp/g2-evidence';
          let fail=[],checks=0;
          const check=(ok,label,detail='')=>{checks++;if(!ok)fail.push(label+' '+detail);};
          async function load(browser,lang,width,opts={}){
           const height=width<500?844:width<1000?430:900;
           const ctx=await browser.newContext({viewport:{width,height},hasTouch:width<1000,reducedMotion:'reduce',...opts});
           if(!process.env.PREVIEW_BASE)await ctx.route('**/*',r=>r.request().url().startsWith(root+'/')?r.continue():r.abort());
           const p=await ctx.newPage();const errors=[];p.on('pageerror',e=>errors.push(String(e)));
           const res=await p.goto(root+routes[lang],{waitUntil:'load',timeout:45000});
           return {ctx,p,errors,res};
          }
          async function shape(p){return p.evaluate(()=>{
           const tables=[...document.querySelectorAll('.g2__scroll')].map(e=>({cols:e.querySelectorAll('thead th').length,rows:e.querySelectorAll('tbody tr').length,scroll:e.scrollWidth-e.clientWidth,focus:e.tabIndex,right:e.getBoundingClientRect().right,css:getComputedStyle(e).overflowX}));
           return {lang:document.documentElement.lang,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,tables,author:document.querySelector('[data-author-type]')?.dataset.authorType,footer:!!document.querySelector('[data-home-footer-golden-r3]'),chapters:document.querySelectorAll('.insight-v2-rail a').length,signals:document.querySelector('[data-insight-v2-signal]')?.dataset.signalCount,links:[...document.querySelectorAll('.g2 a,.insight-v2-article-cta a')].map(e=>e.getAttribute('href')),lead:document.querySelector('.insight-v2-lead')?.innerText,scrollY:window.scrollY};
           });}
          (async()=>{
           for(const [name,engine] of [['chromium',chromium],['webkit',webkit]]){
           const browser=await engine.launch({headless:true});
           for(const lang of ['en','ru']){
           for(const width of (process.env.PREVIEW_BASE?[390,1440]:widths)){
           const {ctx,p,errors,res}=await load(browser,lang,width);const label=name+'/'+lang+'/'+width;const s=await shape(p);
           check(res?.status()===200,label+' HTTP');
           if(width===390||width===1440){check(s.scrollY===0,label+' initial scroll');await p.screenshot({path:output+'/'+name+'-'+lang+'-'+width+'-initial.png'});}
           check(s.lang===lang&&s.author==='organization'&&s.footer&&s.chapters===10&&s.signals==='3',label+' shell');
           check(s.overflow<=2,label+' document overflow',JSON.stringify(s));
           check(s.tables.length===2&&s.tables[0].rows===11&&s.tables[0].cols===4&&s.tables[1].rows===5&&s.tables[1].cols===3&&s.tables.every(t=>t.focus===0&&t.css==='auto'&&t.right<=width+2),label+' matrix geometry');
           check(errors.length===0,label+' runtime',errors.join('|'));
           if(width<500)check(s.tables.every(t=>t.scroll>100),label+' table scroll area');
           if(width===390){
            for(let i=0;i<2;i++){
             const t=p.locator('.g2__scroll').nth(i);
             await t.focus();check(await t.evaluate(e=>e===document.activeElement),label+' focus '+i);
             await p.keyboard.press('ArrowRight');check(await t.evaluate(e=>e.scrollLeft>0),label+' keyboard '+i);
             await p.keyboard.press('Home');check(await t.evaluate(e=>e.scrollLeft===0),label+' Home '+i);
             await t.screenshot({path:output+'/'+name+'-'+lang+'-390-matrix-'+i+'.png'});
            }
            const t=p.locator('.g2__scroll').first();await t.scrollIntoViewIfNeeded();await t.evaluate(e=>e.scrollLeft=0);
            const box=await t.boundingBox(),x=box.x+box.width*.8,y=Math.max(100,Math.min(700,box.y+40));
            if(name==='chromium'){
              const cd=await ctx.newCDPSession(p);await cd.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y}]});
              for(let i=1;i<=8;i++){await cd.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x-i*18,y}]});await p.waitForTimeout(20);}
              await cd.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await p.waitForTimeout(250);
              check(await t.evaluate(e=>e.scrollLeft>0),label+' native touch gesture');
            }else{
              await p.mouse.move(x,y);await p.mouse.wheel(180,0);await p.waitForTimeout(300);
              check(await t.evaluate(e=>e.scrollLeft>0),label+' WebKit native wheel horizontal scroll');
            }
           }
           await ctx.close();
           }
           if(!process.env.PREVIEW_BASE){
           for(const scale of [1.25,1.5]){
           const {ctx,p}=await load(browser,lang,390);
           await p.evaluate(scale=>{const els=[...document.querySelectorAll('.insight-v2-article h1,.insight-v2-article h2,.insight-v2-article h3,.insight-v2-article p,.insight-v2-article li,.insight-v2-article th,.insight-v2-article td,.insight-v2-article summary')];const sizes=els.map(e=>parseFloat(getComputedStyle(e).fontSize));els.forEach((e,i)=>e.style.setProperty('font-size',sizes[i]*scale+'px','important'));},scale);
           const s=await shape(p);check(s.overflow<=2,name+'/'+lang+' text '+scale,JSON.stringify(s));await ctx.close();
           }
           const {ctx,p,res}=await load(browser,lang,320,{javaScriptEnabled:false});
           const s=await shape(p);check(res?.status()===200&&s.lead&&s.tables.length===2&&s.tables.every(t=>t.scroll>100)&&s.overflow<=2,name+'/'+lang+' no-JS');await ctx.close();
           }
           const ctx=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
           if(!process.env.PREVIEW_BASE)await ctx.route('**/*',r=>r.request().url().startsWith(root+'/')?r.continue():r.abort());
           const p=await ctx.newPage();
           const old=lang==='en'?'/insights/where-automation-delivers-its-first-real-roi/':'/ru/insights/gde-avtomatizatsiya-daet-pervuyu-realnuyu-polzu-biznesu/';
           await p.goto(root+old,{waitUntil:'load'});check(await p.locator('[data-g1-calculator]').count()===1,name+'/'+lang+' Article07 calculator');
           await p.locator('[name="cash"]').fill('450');check((await p.locator('[data-g1-payback]').innerText()).match(/12[.,]0/),name+'/'+lang+' Article07 payback');check(await p.locator('img[src*="article07-first-automation-roi-hero.webp"]').count()===1,name+'/'+lang+' Article07 Hero');await ctx.close();
           }
           await browser.close();
           }
           console.log('G2_BROWSER_QA',checks,'checks',fail.length,'failures');
           if(fail.length){console.error(fail.join('\n'));process.exitCode=1;}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node /tmp/g2-browser.cjs
      - name: Screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-article08-local-browser-evidence
          path: /tmp/g2-evidence/*.png
          if-no-files-found: warn
      - name: Publish immutable compiled only
        shell: bash
        run: |
          set -euo pipefail
          dest='agent/insights-g2-article08-v2-compiled-20261127'
          if git ls-remote --heads origin "refs/heads/$dest" | grep -q .; then echo 'Immutable branch exists; refusing overwrite'; exit 1; fi
          tmp="$(mktemp -d)"
          cp -a _site/. "$tmp/"
          rm -f "$tmp/CNAME"
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > "$tmp/_headers"
          touch "$tmp/.nojekyll"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan "$dest"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$tmp"/. .
          git add -A
          git commit -m 'preview: Article08 compiled Jekyll from 6dc75a5520e49b32bcb219a0688242b63e53919e'
          git push origin "HEAD:refs/heads/$dest"
          echo "G2_COMPILED_SHA=$(git rev-parse HEAD)"
      - name: Confirm live HTTP and resources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, re, json, time, urllib.request
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          repo=os.environ['GITHUB_REPOSITORY']
          base=None
          for i in range(40):
           p=subprocess.run(['gh','api',f'repos/{repo}/commits/{sha}/check-runs'],capture_output=True,text=True)
           if p.returncode==0:
            for c in json.loads(p.stdout).get('check_runs',[]):
             if c['name']=='Cloudflare Pages' and c['conclusion']=='success':
              m=re.search(r'https://[a-f0-9]{8}\.proaiexpert-github-io\.pages\.dev',c.get('output',{}).get('summary',''))
              if m:base=m.group()
           if base:break
           time.sleep(10)
          assert base,'Cloudflare immutable deployment not confirmed'
          print('G2_IMMUTABLE_BASE='+base,flush=True)
          for lang,route in [('en','/insights/ai-agent-or-automation-what-your-business-actually-needs/'),('ru','/ru/insights/ai-agent-ili-avtomatizatsiya-chto-nuzhno-biznesu/')]:
           with urllib.request.urlopen(base+route,timeout=30) as r:
            html=r.read().decode();assert r.status==200 and 'noindex' in r.headers.get('X-Robots-Tag','').lower()
            assert 'data-insight-v2-article' in html and 'g2__scroll' in html and 'data-home-footer-golden-r3' in html and 'dateModified":"2026-11-27' in html
            print('G2_LIVE',lang,r.status,r.headers.get('X-Robots-Tag'),flush=True)
          for path in ['/assets/css/insights-editorial-v2.css','/assets/js/insights-editorial-v2.js','/assets/css/header-system-v1.css','/assets/js/header-system-v1.js','/assets/social/proai-home-og-en-r1-1.png','/assets/social/proai-home-og-ru-r1-1.png','/contact/','/ru/contact/','/ai-systems/','/ru/ai-systems/','/insights/','/ru/insights/']:
           with urllib.request.urlopen(base+path,timeout=30) as r:assert r.status==200;print('G2_LIVE_RESOURCE',r.status,path,flush=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PREVIEW_BASE='+base+'\n')
          PY
      - name: Actual deployed Chromium WebKit visual and interactive QA
        shell: bash
        run: |
          rm -f /tmp/g2-evidence/*.png
          node /tmp/g2-browser.cjs
      - name: Upload live screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-article08-live-browser-evidence
          path: /tmp/g2-evidence/*.png
          if-no-files-found: warn
