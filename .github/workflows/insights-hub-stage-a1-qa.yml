name: Insights Hub Stage A.1 — isolated QA and owner preview
on:
  push:
    branches:
      - agent/insights-hub-stage-a1-quiet-editorial
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Jekyll and browser QA
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium webkit
      - name: Build production-equivalent Jekyll output
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          python scripts/apply-social-preview-defaults.py --mode source --root .
          jekyll build --source . --destination _site
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site
      - name: Check generated Hub and frozen article invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path, lang in [('insights/index.html','en'),('ru/insights/index.html','ru')]:
              h=(Path('_site')/path).read_text(encoding='utf-8')
              assert len(re.findall(r'<h1\b',h))==1,path
              assert h.count('class="insights-v2__ledger-row"')==12,(path,h.count('class="insights-v2__ledger-row"'))
              assert 'class="insights-v2__trace"' not in h,path
              assert 'insights-v2__masthead-axis' not in h,path
              assert 'proai-inner-golden-r1' in h,path
              assert h.count('data-site-footer-canonical="golden-r1"')==1,path
              assert '{%' not in h and '{{' not in h,path
              assert f'<html lang="{lang}">' in h,path
              assert 'rel="canonical"' in h and 'hreflang="ru"' in h and 'hreflang="en"' in h,path
          for path in ['insights/what-happens-after-a-lead-arrives/index.html','ru/insights/chto-proiskhodit-posle-zayavki/index.html']:
              h=(Path('_site')/path).read_text(encoding='utf-8')
              assert 'insight-v2-signal' in h and 'insight-v2-table-wrap' in h,path
              assert 'proai-inner-golden-r1' in h,path
              assert h.count('data-site-footer-canonical="golden-r1"')==1,path
          print('Generated Hub EN/RU: 12/12 records, SEO/HTML/Liquid, Article V2 freeze PASS')
          PY
      - name: Prepare baseline and local browser servers
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          git worktree add --detach /tmp/insights-a1-before bd4b01ed73464615a794038982989b109bfb47db
          jekyll build --source /tmp/insights-a1-before --destination /tmp/insights-a1-before/_site
          python -m http.server 4173 --directory _site >/tmp/hub-a1-after.log 2>&1 &
          python -m http.server 4175 --directory /tmp/insights-a1-before/_site >/tmp/hub-a1-before.log 2>&1 &
          sleep 2
      - name: Chromium and WebKit responsive A/B QA
        shell: bash
        run: |
          mkdir -p qa-artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          cases=[
            ('desktop-1280',1280,850,False),
            ('desktop-1440',1440,900,False),
            ('desktop-1600',1600,960,False),
            ('desktop-1920',1920,1080,False),
            ('portrait-430',430,932,True),
            ('portrait-390',390,844,True),
            ('portrait-375',375,812,True),
            ('portrait-360',360,780,True),
            ('portrait-320',320,690,True),
            ('landscape-844',844,390,True),
            ('landscape-932',932,430,True),
          ]
          routes={'en':'/insights/','ru':'/ru/insights/'}
          out=Path('qa-artifacts')
          results=[];failures=[]
          with sync_playwright() as pw:
              for engine,btype in [('chromium',pw.chromium),('webkit',pw.webkit)]:
                  browser=btype.launch()
                  for label,w,h,touch in cases:
                      for lang,path in routes.items():
                          ctx=browser.new_context(viewport={'width':w,'height':h},is_mobile=touch,has_touch=touch)
                          pg=ctx.new_page()
                          for kind,port in [('after',4173),('before',4175)]:
                              pg.goto(f'http://127.0.0.1:{port}{path}',wait_until='domcontentloaded',timeout=60000)
                              pg.wait_for_timeout(90)
                              data=pg.evaluate("""() => ({
                                 viewport:innerWidth,scroll:document.documentElement.scrollWidth,
                                 h1:document.querySelectorAll('h1').length,
                                 items:document.querySelectorAll('.insights-v2__ledger-row').length,
                                 titleWidth:Math.round(document.querySelector('.insights-v2__masthead h1').getBoundingClientRect().width),
                                 leadTitleFont:getComputedStyle(document.querySelector('.insights-v2__lead-record h3')).fontSize,
                                 supportFont:getComputedStyle(document.querySelector('.insights-v2__support-record h3')).fontSize
                              })""")
                              results.append({'engine':engine,'lang':lang,'case':label,'state':kind,**data})
                              if kind=='after':
                                  if data['scroll']>data['viewport']+1:failures.append(f'{engine}/{lang}/{label} overflow={data["scroll"]-data["viewport"]}')
                                  if data['h1']!=1 or data['items']!=12:failures.append(f'{engine}/{lang}/{label} semantic count')
                              if engine=='chromium' and label in ('desktop-1440','portrait-390','landscape-844') and kind in ('before','after'):
                                  pg.screenshot(path=str(out/f'{lang}-{label}-{kind}.png'),full_page=True)
                          ctx.close()
                  browser.close()
          # No-JS: the complete decision library remains accessible without client scripts.
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              for lang,path in routes.items():
                  context=browser.new_context(viewport={'width':390,'height':844},java_script_enabled=False)
                  page=context.new_page()
                  page.goto('http://127.0.0.1:4173'+path,wait_until='domcontentloaded')
                  count=page.locator('.insights-v2__ledger-row a.insights-v2__ledger-title').count()
                  if count!=12:failures.append(f'noJS {lang} found {count} expected 12')
                  context.close()
              browser.close()
          (out/'report.json').write_text(json.dumps({'results':results,'failures':failures},ensure_ascii=False,indent=2))
          print('A/B QA',len(results),'cases; errors',len(failures),failures[:20])
          if failures:raise SystemExit(1)
          PY
      - name: Publish exact rendered owner preview to isolated branch
        shell: bash
        run: |
          mkdir -p owner-preview/insights-stage-a1
          cp _site/insights/index.html owner-preview/insights-stage-a1/index.html
          cp _site/ru/insights/index.html owner-preview/insights-stage-a1/ru.html
          python - <<'PY'
          from pathlib import Path
          for p in [Path('owner-preview/insights-stage-a1/index.html'),Path('owner-preview/insights-stage-a1/ru.html')]:
              s=p.read_text(encoding='utf-8')
              assert '{%' not in s and '{{' not in s
              assert s.count('class="insights-v2__ledger-row"')==12
          PY
          git add owner-preview/insights-stage-a1/index.html owner-preview/insights-stage-a1/ru.html
          if ! git diff --cached --quiet; then
            git config user.name "proai-stage-a1-qa[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Owner preview: export exact Stage A.1 Jekyll Hub render"
            git push origin HEAD:agent/insights-hub-stage-a1-quiet-editorial
          fi
      - name: Upload A/B QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insights-hub-stage-a1-qa
          path: qa-artifacts/
          if-no-files-found: warn
