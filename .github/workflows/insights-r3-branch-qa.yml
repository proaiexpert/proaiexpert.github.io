name: Insights Editorial V2 R3 Hub Baseline Diagnostic

on:
  push:
    branches:
      - agent/insights-editorial-v2-r3-articles-02-03

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Checkout production baseline
        uses: actions/checkout@v6
        with:
          ref: main
          path: baseline

      - name: Build candidate and baseline
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source candidate --destination _site-candidate
          jekyll build --source baseline --destination _site-baseline

      - name: Install WebKit
        shell: bash
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps webkit

      - name: Compare RU Hub 320 WebKit against current main
        shell: bash
        run: |
          python -m http.server 4174 --directory _site-baseline >/tmp/base.log 2>&1 &
          python -m http.server 4175 --directory _site-candidate >/tmp/candidate.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json,time,urllib.request

          BASE='http://127.0.0.1:4174/ru/insights/'
          CAND='http://127.0.0.1:4175/ru/insights/'
          for u in ('http://127.0.0.1:4174','http://127.0.0.1:4175'):
              for _ in range(40):
                  try:
                      urllib.request.urlopen(u,timeout=1)
                      break
                  except Exception:
                      time.sleep(.2)

          def inspect(page):
              return page.evaluate("""()=>{
                const vw=innerWidth,d=document.documentElement;
                const offenders=[...document.querySelectorAll('body *')].map(e=>{
                  const r=e.getBoundingClientRect();
                  return {tag:e.tagName.toLowerCase(),cls:typeof e.className==='string'?e.className:'',left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1),overflow:+Math.max(0,-r.left,r.right-vw).toFixed(1)}
                }).filter(x=>x.overflow>1).sort((a,b)=>b.overflow-a.overflow).slice(0,10);
                return {overflow:d.scrollWidth-vw,scrollWidth:d.scrollWidth,viewport:vw,offenders};
              }""")

          def run_case(browser,url,block_external):
              ctx=browser.new_context(viewport={'width':320,'height':700},has_touch=True,is_mobile=True)
              page=ctx.new_page()
              if block_external:
                  def route_handler(route):
                      u=route.request.url
                      if u.startswith('http://127.0.0.1:4174') or u.startswith('http://127.0.0.1:4175') or u.startswith('data:') or u.startswith('blob:'):
                          route.continue_()
                      else:
                          route.abort()
                  page.route('**/*',route_handler)
              page.goto(url,wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(250)
              result=inspect(page)
              ctx.close()
              return result

          with sync_playwright() as p:
              browser=p.webkit.launch()
              blocked_base=run_case(browser,BASE,True)
              blocked_cand=run_case(browser,CAND,True)
              try:
                  live_base=run_case(browser,BASE,False)
                  live_cand=run_case(browser,CAND,False)
              except Exception as e:
                  live_base={'error':str(e)}
                  live_cand={'error':str(e)}
              browser.close()

          result={'blocked_fonts':{'baseline':blocked_base,'candidate':blocked_cand},'live_fonts':{'baseline':live_base,'candidate':live_cand}}
          print(json.dumps(result,ensure_ascii=False,indent=2))

          # Regression gate: candidate may not exceed the current main overflow under identical conditions.
          if blocked_cand['overflow'] > blocked_base['overflow'] + 1:
              raise SystemExit(f"RU Hub regression with blocked external fonts: baseline={blocked_base['overflow']} candidate={blocked_cand['overflow']}")
          if 'overflow' in live_base and 'overflow' in live_cand and live_cand['overflow'] > live_base['overflow'] + 1:
              raise SystemExit(f"RU Hub regression with live fonts: baseline={live_base['overflow']} candidate={live_cand['overflow']}")
          print('RU Hub WebKit 320 baseline regression: PASS')
          PY
