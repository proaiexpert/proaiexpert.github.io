name: Insights Editorial V2 R3 Visual Evidence

on:
  push:
    branches:
      - agent/insights-editorial-v2-r3-articles-02-03

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build candidate
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Install Chromium
        shell: bash
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Capture resolved covers and every mobile table right edge
        shell: bash
        run: |
          mkdir -p qa-visual/covers qa-visual/tables
          python -m http.server 4174 --directory _site >/tmp/site.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,time,urllib.request

          SITE='http://127.0.0.1:4174'
          routes={
            'multi_en':'/insights/does-your-service-business-need-a-multilingual-website/',
            'multi_ru':'/ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/',
            'proposal_en':'/insights/how-to-evaluate-a-website-proposal/',
            'proposal_ru':'/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/',
          }
          expected={'multi_en':2,'multi_ru':3,'proposal_en':7,'proposal_ru':7}
          for _ in range(30):
              try:
                  urllib.request.urlopen(SITE,timeout=1); break
              except Exception: time.sleep(.2)

          manifest={'covers':[],'tables':[],'failures':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for key,path in routes.items():
                  for label,w,h,touch in [('desktop-1440',1440,1000,False),('portrait-390',390,844,True),('touch-landscape-844',844,390,True)]:
                      ctx=browser.new_context(viewport={'width':w,'height':h},has_touch=touch,is_mobile=touch,reduced_motion='reduce')
                      page=ctx.new_page()
                      page.goto(SITE+path,wait_until='domcontentloaded',timeout=30000)
                      page.wait_for_timeout(180)
                      state=page.evaluate("""()=>{
                        const h1=document.querySelector('h1'), sig=document.querySelector('.insight-v2-signal');
                        return {overflow:document.documentElement.scrollWidth-innerWidth,h1:h1?getComputedStyle(h1).opacity:null,h1Text:h1?.textContent.trim()||'',signal:!!sig}
                      }""")
                      if state['overflow']>1 or state['h1']!='1' or not state['h1Text'] or not state['signal']:
                          manifest['failures'].append(f"{key}:{label}:{state}")
                      out=f"qa-visual/covers/{key}-{label}.png"
                      page.screenshot(path=out,full_page=False)
                      manifest['covers'].append({'page':key,'viewport':label,'file':out,**state})
                      ctx.close()

                  ctx=browser.new_context(viewport={'width':390,'height':844},has_touch=True,is_mobile=True,reduced_motion='reduce')
                  page=ctx.new_page(); page.goto(SITE+path,wait_until='domcontentloaded',timeout=30000); page.wait_for_timeout(160)
                  wraps=page.locator('.insight-v2-table-wrap')
                  if wraps.count()!=expected[key]:
                      manifest['failures'].append(f"{key}:table-count={wraps.count()} expected={expected[key]}")
                  for i in range(wraps.count()):
                      wrap=wraps.nth(i)
                      wrap.scroll_into_view_if_needed()
                      wrap.evaluate("(el)=>{el.scrollLeft=el.scrollWidth}")
                      page.wait_for_timeout(80)
                      data=wrap.evaluate("""(el)=>({left:el.scrollLeft,max:el.scrollWidth-el.clientWidth,client:el.clientWidth,scroll:el.scrollWidth,pageOverflow:document.documentElement.scrollWidth-innerWidth})""")
                      if data['pageOverflow']>1 or abs(data['left']-data['max'])>2:
                          manifest['failures'].append(f"{key}:table-{i+1}:{data}")
                      out=f"qa-visual/tables/{key}-table-{i+1:02d}-right-edge.png"
                      wrap.screenshot(path=out)
                      manifest['tables'].append({'page':key,'table':i+1,'file':out,**data})
                  ctx.close()
              browser.close()

          Path('qa-visual/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'cover_count':len(manifest['covers']),'table_shots':len(manifest['tables']),'failures':manifest['failures']},ensure_ascii=False,indent=2))
          if manifest['failures']: raise SystemExit(1)
          PY

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insights-r3-visual-evidence
          path: qa-visual/
          if-no-files-found: error
          retention-days: 14
