name: Insights R3.1 Table and Width QA

on:
  push:
    branches:
      - agent/insights-editorial-v2-r3-articles-02-03

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Source completeness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages=[
            Path('insights/does-your-service-business-need-a-multilingual-website/index.html'),
            Path('ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html'),
            Path('insights/how-to-evaluate-a-website-proposal/index.html'),
            Path('ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html'),
          ]
          for p in pages:
              t=p.read_text(encoding='utf-8')
              tables=re.findall(r'<table\b[\s\S]*?</table>',t,re.I)
              empties=sum(len(re.findall(r'<td\b[^>]*>\s*</td>',x,re.I)) for x in tables)
              print(p, 'tables=',len(tables),'empty_td=',empties)
              assert empties==0,(p,empties)
          print('All migrated tables populated: PASS')
          PY

      - name: Build
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site

      - name: Install browsers
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium webkit

      - name: Geometry and screenshot QA
        shell: bash
        run: |
          mkdir -p qa-r31
          python -m http.server 4174 --directory _site >/tmp/site.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,time,urllib.request

          SITE='http://127.0.0.1:4174'
          routes={
            'proposal_en':'/insights/how-to-evaluate-a-website-proposal/',
            'proposal_ru':'/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/',
            'multi_en':'/insights/does-your-service-business-need-a-multilingual-website/',
            'multi_ru':'/ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/',
          }
          for _ in range(30):
              try: urllib.request.urlopen(SITE,timeout=1); break
              except Exception: time.sleep(.2)

          failures=[]; rows=[]
          with sync_playwright() as p:
              for engine_name,btype in [('chromium',p.chromium),('webkit',p.webkit)]:
                  browser=btype.launch()
                  for label,w,h,touch in [
                      ('desktop-1440',1440,1000,False),
                      ('desktop-1600',1600,1000,False),
                      ('desktop-1920',1920,1080,False),
                      ('portrait-390',390,844,True),
                      ('touch-landscape-844',844,390,True),
                  ]:
                      for key,path in routes.items():
                          ctx=browser.new_context(viewport={'width':w,'height':h},has_touch=touch,is_mobile=touch,reduced_motion='reduce')
                          page=ctx.new_page()
                          page.goto(SITE+path,wait_until='domcontentloaded',timeout=30000)
                          page.wait_for_timeout(120)
                          data=page.evaluate("""()=>{
                            const prose=document.querySelector('.insight-v2__prose');
                            const wraps=[...document.querySelectorAll('.insight-v2-table-wrap')];
                            const tables=[...document.querySelectorAll('.insight-v2-decision-table.insight-v2-table--generic')];
                            const first=tables[0]?.querySelector('td:first-child');
                            const long=[...document.querySelectorAll('td:first-child')].find(x=>x.textContent.includes('конфиденциальности')||x.textContent.includes('Privacy/legal'));
                            const longRect=long?.getBoundingClientRect();
                            return {
                              overflow:document.documentElement.scrollWidth-innerWidth,
                              prose:prose?+prose.getBoundingClientRect().width.toFixed(1):null,
                              firstCol:first?+first.getBoundingClientRect().width.toFixed(1):null,
                              tableWrap:wraps[0]?+wraps[0].getBoundingClientRect().width.toFixed(1):null,
                              emptyCells:document.querySelectorAll('td:empty').length,
                              longCellHeight:longRect?+longRect.height.toFixed(1):null,
                              longCellWidth:longRect?+longRect.width.toFixed(1):null,
                            }
                          }""")
                          data.update(engine=engine_name,viewport=label,page=key)
                          rows.append(data)
                          if data['overflow']>1: failures.append(f"{engine_name}:{label}:{key}:overflow={data['overflow']}")
                          if data['emptyCells']!=0: failures.append(f"{engine_name}:{label}:{key}:empty={data['emptyCells']}")
                          if label.startswith('desktop') and data['prose']!=900: failures.append(f"{engine_name}:{label}:{key}:prose={data['prose']}")
                          if data['firstCol'] and abs(data['firstCol']-190)>2: failures.append(f"{engine_name}:{label}:{key}:firstCol={data['firstCol']}")
                          if key=='proposal_ru' and data['longCellWidth'] and data['longCellWidth']>193: failures.append(f"{engine_name}:{label}:{key}:longWidth={data['longCellWidth']}")
                          if engine_name=='chromium' and key=='proposal_ru' and label in ('desktop-1600','portrait-390'):
                              page.screenshot(path=f"qa-r31/{key}-{label}.png",full_page=False)
                          ctx.close()
                  browser.close()

          Path('qa-r31/results.json').write_text(json.dumps({'rows':rows,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'failures':failures,'sample':[r for r in rows if r['page']=='proposal_ru' and r['engine']=='chromium']},ensure_ascii=False,indent=2))
          if failures: raise SystemExit(1)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insights-r31-table-width-qa
          path: qa-r31/
          if-no-files-found: warn
          retention-days: 14
