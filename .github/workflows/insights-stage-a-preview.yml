name: Insights Stage A Owner Preview

on:
  push:
    branches:
      - insights-stage-a-preview
    paths-ignore:
      - 'owner-preview/insights-stage-a/**'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview mirror
        uses: actions/checkout@v6

      - name: Verify ProAI Cube integrity
        run: node scripts/verify-proai-cube-integrity-r2.mjs

      - name: Materialize social preview assets and normalize source
        run: python scripts/apply-social-preview-defaults.py --mode source --root .

      - name: Build Jekyll site
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Normalize and verify generated metadata
        run: |
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site

      - name: Verify canonical Site Shell
        run: python scripts/validate-site-shell-r1.py --source-root . --site-root _site

      - name: Verify Insights Editorial V2
        run: python scripts/validate-insights-v2-r1.py --source-root . --site-root _site

      - name: Materialize owner preview routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          routes = {
              "en-hub": "insights/index.html",
              "ru-hub": "ru/insights/index.html",
              "lead-en": "insights/what-happens-after-a-lead-arrives/index.html",
              "lead-ru": "ru/insights/chto-proiskhodit-posle-zayavki/index.html",
              "multilingual-en": "insights/does-your-service-business-need-a-multilingual-website/index.html",
              "multilingual-ru": "ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html",
              "proposal-en": "insights/how-to-evaluate-a-website-proposal/index.html",
              "proposal-ru": "ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html",
          }

          root = Path("owner-preview/insights-stage-a")
          if root.exists():
              shutil.rmtree(root)
          for name, source in routes.items():
              destination = root / name / "index.html"
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(Path("_site") / source, destination)

          (root / "BUILD_SHA.txt").write_text(
              "implementation_head=4571a638aa8ef4b91b7f4e107e45092c0212a35c\n",
              encoding="utf-8",
          )
          PY

      - name: Commit rendered preview only
        shell: bash
        run: |
          git config user.name "ProAI Preview Bot"
          git config user.email "proai-preview@users.noreply.github.com"
          git add owner-preview/insights-stage-a
          if git diff --cached --quiet; then
            echo "Preview already current."
          else
            git commit -m "Preview: render Insights Stage A owner review"
            git push origin HEAD:insights-stage-a-preview
          fi
