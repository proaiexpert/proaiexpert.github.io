name: Insights Stage A Owner Preview

on:
  push:
    branches:
      - insights-stage-a-preview
    paths-ignore:
      - 'owner-preview/insights-stage-a/**'
      - '.github/workflows/insights-stage-a-preview.yml'
      - '.github/workflows/insights-stage-a-fast-qa.yml'
      - '.github/workflows/insights-stage-a-regression-qa.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview mirror
        uses: actions/checkout@v6

      - name: Remove generated Stage A preview before source build
        shell: bash
        run: rm -rf owner-preview/insights-stage-a

      - name: Verify ProAI Cube integrity
        run: node scripts/verify-proai-cube-integrity-r2.mjs

      - name: Materialize social preview assets and normalize source
        run: python scripts/apply-social-preview-defaults.py --mode source --root .

      - name: Build Jekyll site
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Normalize and verify generated metadata
        run: |
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site

      - name: Verify canonical Site Shell
        run: python scripts/validate-site-shell-r1.py --source-root . --site-root _site

      - name: Verify Insights Editorial V2
        run: python scripts/validate-insights-v2-r1.py --source-root . --site-root _site

      - name: Materialize owner preview routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          routes = {
              "en-hub": "insights/index.html",
              "ru-hub": "ru/insights/index.html",
              "lead-en": "insights/what-happens-after-a-lead-arrives/index.html",
              "lead-ru": "ru/insights/chto-proiskhodit-posle-zayavki/index.html",
              "multilingual-en": "insights/does-your-service-business-need-a-multilingual-website/index.html",
              "multilingual-ru": "ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html",
              "proposal-en": "insights/how-to-evaluate-a-website-proposal/index.html",
              "proposal-ru": "ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html",
          }

          root = Path("owner-preview/insights-stage-a")
          if root.exists():
              shutil.rmtree(root)
          for name, source in routes.items():
              destination = root / name / "index.html"
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(Path("_site") / source, destination)

          (root / "BUILD_SHA.txt").write_text(
              "implementation_head=04a19f1dccadf05b5b8d57106fa1efcad3d07b78\n",
              encoding="utf-8",
          )
          PY

      - name: Browser-responsive QA
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          python -m http.server 4173 --directory _site >/tmp/insights-stage-a-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/insights/ >/dev/null; then break; fi
            sleep 0.2
          done
          export CHROME_BIN
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME_BIN,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const base = 'http://127.0.0.1:4173';
            const routes = [
              ['en-hub', '/insights/'],
              ['ru-hub', '/ru/insights/'],
              ['lead-en', '/insights/what-happens-after-a-lead-arrives/'],
              ['lead-ru', '/ru/insights/chto-proiskhodit-posle-zayavki/'],
              ['multilingual-en', '/insights/does-your-service-business-need-a-multilingual-website/'],
              ['multilingual-ru', '/ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/'],
              ['proposal-en', '/insights/how-to-evaluate-a-website-proposal/'],
              ['proposal-ru', '/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/']
            ];
            const viewports = [
              {name:'desktop-1280', width:1280, height:900},
              {name:'desktop-1366', width:1366, height:900},
              {name:'desktop-1440', width:1440, height:900},
              {name:'desktop-1600', width:1600, height:1000},
              {name:'desktop-1920', width:1920, height:1080},
              {name:'portrait-430', width:430, height:932, touch:true, mobile:true},
              {name:'portrait-390', width:390, height:844, touch:true, mobile:true},
              {name:'portrait-375', width:375, height:812, touch:true, mobile:true},
              {name:'portrait-360', width:360, height:800, touch:true, mobile:true},
              {name:'portrait-320', width:320, height:700, touch:true, mobile:true},
              {name:'landscape-844', width:844, height:390, touch:true, mobile:true},
              {name:'landscape-932', width:932, height:430, touch:true, mobile:true},
              {name:'tablet-portrait', width:768, height:1024, touch:true},
              {name:'tablet-landscape', width:1024, height:768, touch:true}
            ];
            const report = {
              implementation_head: '04a19f1dccadf05b5b8d57106fa1efcad3d07b78',
              browser: {},
              route_viewports: [],
              reading_measure: [],
              accessibility: {},
              failures: []
            };
            report.browser.executable = process.env.CHROME_BIN;
            report.browser.version = await browser.version();

            async function inspect(routeName, path, vp) {
              const context = await browser.newContext({
                viewport: {width: vp.width, height: vp.height},
                hasTouch: !!vp.touch,
                isMobile: !!vp.mobile
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              await page.goto(base + path, {waitUntil: 'domcontentloaded'});
              await page.waitForTimeout(700);
              const first = await page.evaluate(() => {
                const el = document.querySelector('main h1');
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return {left:r.left, top:r.top, width:r.width, height:r.height};
              });
              await page.waitForTimeout(150);
              const metrics = await page.evaluate(() => {
                const root = document.documentElement;
                const h1 = document.querySelector('main h1');
                const h1r = h1 ? h1.getBoundingClientRect() : null;
                const field = document.querySelector('.insight-v2__prose');
                const paragraph = document.querySelector('.insight-v2__prose > section p, .insight-v2__prose > p:not(:first-child)');
                const support = document.querySelector('.insights-v2__supporting');
                const trace = document.querySelector('.insights-v2__trace');
                const signal = document.querySelector('.insight-v2-signal');
                const footer = document.querySelectorAll('.home-footer-golden-r3[data-site-footer-canonical="golden-r1"]').length;
                let chPx = null;
                if (field) {
                  const probe = document.createElement('span');
                  probe.style.cssText = 'position:absolute;visibility:hidden;display:inline-block;width:1ch;padding:0;border:0;';
                  field.appendChild(probe);
                  chPx = probe.getBoundingClientRect().width;
                  probe.remove();
                }
                return {
                  clientWidth: root.clientWidth,
                  scrollWidth: root.scrollWidth,
                  overflowX: root.scrollWidth - root.clientWidth,
                  h1: h1r ? {left:h1r.left,right:h1r.right,top:h1r.top,width:h1r.width,height:h1r.height} : null,
                  fieldWidth: field ? field.getBoundingClientRect().width : null,
                  readingCss: field ? getComputedStyle(field).getPropertyValue('--iv2-reading').trim() : null,
                  paragraphWidth: paragraph ? paragraph.getBoundingClientRect().width : null,
                  paragraphMaxWidth: paragraph ? getComputedStyle(paragraph).maxWidth : null,
                  chPx,
                  supportDisplay: support ? getComputedStyle(support).display : null,
                  supportColumns: support ? getComputedStyle(support).gridTemplateColumns : null,
                  traceBackground: trace ? getComputedStyle(trace).backgroundImage : null,
                  signalBackground: signal ? getComputedStyle(signal).backgroundImage : null,
                  footerCount: footer,
                  signalCount: signal ? signal.querySelectorAll(':scope > div:not(.insight-v2-signal__axis)').length : null,
                  touchCoarse: matchMedia('(any-pointer: coarse)').matches,
                  orientationLandscape: matchMedia('(orientation: landscape)').matches
                };
              });
              const second = metrics.h1;
              const jitter = first && second ? Math.max(
                Math.abs(first.left-second.left),
                Math.abs(first.top-second.top),
                Math.abs(first.width-second.width),
                Math.abs(first.height-second.height)
              ) : 0;
              const result = {route:routeName, viewport:vp.name, width:vp.width, height:vp.height, jitterPx:jitter, pageErrors, ...metrics};
              if (metrics.overflowX > 1) report.failures.push(routeName+'/'+vp.name+': document overflow '+metrics.overflowX+'px');
              if (!metrics.h1 || metrics.h1.left < -1 || metrics.h1.right > metrics.clientWidth + 1) report.failures.push(routeName+'/'+vp.name+': H1 clipped');
              if (jitter > 0.75) report.failures.push(routeName+'/'+vp.name+': post-settle jitter '+jitter+'px');
              if (pageErrors.length) report.failures.push(routeName+'/'+vp.name+': page errors '+pageErrors.join(' | '));
              if (metrics.footerCount !== 1) report.failures.push(routeName+'/'+vp.name+': canonical footer count '+metrics.footerCount);
              if (routeName.includes('hub') && vp.name.startsWith('landscape') && metrics.supportDisplay !== 'block') report.failures.push(routeName+'/'+vp.name+': supporting articles compressed instead of stacked');
              if (routeName.includes('hub') && (vp.name.startsWith('portrait') || vp.name.startsWith('landscape')) && metrics.traceBackground !== 'none') report.failures.push(routeName+'/'+vp.name+': Decision Trace still has panel gradient');
              if (!routeName.includes('hub') && (vp.name.startsWith('portrait') || vp.name.startsWith('landscape')) && metrics.signalBackground !== 'none') report.failures.push(routeName+'/'+vp.name+': Executive Signal still has panel gradient');
              if (!routeName.includes('hub') && metrics.signalCount !== 3) report.failures.push(routeName+'/'+vp.name+': explicit signal count '+metrics.signalCount);
              await context.close();
              return result;
            }

            for (const vp of viewports) {
              for (const [name,path] of routes) {
                report.route_viewports.push(await inspect(name,path,vp));
              }
            }

            for (const width of [1280,1440,1600,1920]) {
              const context = await browser.newContext({viewport:{width:width,height:900}});
              const page = await context.newPage();
              await page.goto(base + '/insights/what-happens-after-a-lead-arrives/', {waitUntil:'domcontentloaded'});
              await page.evaluate(() => document.fonts ? document.fonts.ready : Promise.resolve());
              const m = await page.evaluate(() => {
                const field = document.querySelector('.insight-v2__prose');
                const p = document.querySelector('.insight-v2__prose > section p');
                const probe = document.createElement('span');
                probe.style.cssText='position:absolute;visibility:hidden;display:inline-block;width:1ch';
                field.appendChild(probe);
                const ch = probe.getBoundingClientRect().width;
                probe.remove();
                return {
                  fieldWidth: field.getBoundingClientRect().width,
                  paragraphWidth: p.getBoundingClientRect().width,
                  paragraphMaxWidth: getComputedStyle(p).maxWidth,
                  readingVar: getComputedStyle(field).getPropertyValue('--iv2-reading').trim(),
                  oneChPx: ch,
                  seventyFourChPx: ch*74,
                  fontFamily:getComputedStyle(field).fontFamily,
                  fontSize:getComputedStyle(field).fontSize,
                  interLoaded: document.fonts ? document.fonts.check('18px Inter') : null
                };
              });
              report.reading_measure.push({viewportWidth:width,...m});
              if (Math.abs(m.fieldWidth-900) > 1) report.failures.push('reading '+width+': field '+m.fieldWidth+'px, expected 900px');
              if (m.readingVar !== '74ch') report.failures.push('reading '+width+': reading var '+m.readingVar);
              if (m.paragraphWidth > m.seventyFourChPx + 1.5) report.failures.push('reading '+width+': paragraph exceeds 74ch');
              await context.close();
            }

            {
              const context = await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,reducedMotion:'reduce'});
              const page = await context.newPage();
              await page.goto(base + '/insights/what-happens-after-a-lead-arrives/', {waitUntil:'domcontentloaded'});
              await page.waitForTimeout(100);
              const reduced = await page.evaluate(() => {
                const nodes = [
                  document.querySelector('.insight-v2-cover__spine'),
                  document.querySelector('.insight-v2-signal'),
                  document.querySelector('main h1')
                ].filter(Boolean);
                return {
                  media: matchMedia('(prefers-reduced-motion: reduce)').matches,
                  states: nodes.map(el => ({
                    animation:getComputedStyle(el).animationName,
                    transition:getComputedStyle(el).transitionDuration
                  }))
                };
              });
              report.accessibility.reducedMotion = reduced;
              if (!reduced.media || reduced.states.some(x => x.animation !== 'none' || !/^0s(?:, 0s)*$/.test(x.transition))) report.failures.push('reduced-motion contract not fully disabled');
              await context.close();
            }

            {
              const context = await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,forcedColors:'active'});
              const page = await context.newPage();
              await page.goto(base + '/insights/what-happens-after-a-lead-arrives/', {waitUntil:'domcontentloaded'});
              const forced = await page.evaluate(() => ({
                media: matchMedia('(forced-colors: active)').matches,
                overflowX: document.documentElement.scrollWidth-document.documentElement.clientWidth,
                h1Visible: !!document.querySelector('main h1') && getComputedStyle(document.querySelector('main h1')).display !== 'none'
              }));
              report.accessibility.forcedColors = forced;
              if (!forced.media || forced.overflowX > 1 || !forced.h1Visible) report.failures.push('forced-colors contract failed');
              await context.close();
            }

            {
              const context = await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,javaScriptEnabled:false});
              const page = await context.newPage();
              await page.goto(base + '/insights/what-happens-after-a-lead-arrives/', {waitUntil:'domcontentloaded'});
              const noJs = await page.evaluate(() => ({
                h1: !!document.querySelector('main h1'),
                h2Count: document.querySelectorAll('main h2').length,
                textLength: (document.querySelector('main')?.innerText || '').length,
                footerCount: document.querySelectorAll('.home-footer-golden-r3[data-site-footer-canonical="golden-r1"]').length
              }));
              report.accessibility.noJs = noJs;
              if (!noJs.h1 || noJs.h2Count < 5 || noJs.textLength < 5000 || noJs.footerCount !== 1) report.failures.push('no-JS readability contract failed');
              await context.close();
            }

            await browser.close();
            fs.writeFileSync('owner-preview/insights-stage-a/QA_METRICS.json', JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify({browser:report.browser, reading_measure:report.reading_measure, accessibility:report.accessibility, failures:report.failures},null,2));
            if (report.failures.length) process.exit(1);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit rendered preview only
        shell: bash
        run: |
          git config user.name "ProAI Preview Bot"
          git config user.email "proai-preview@users.noreply.github.com"
          git add owner-preview/insights-stage-a
          if git diff --cached --quiet; then
            echo "Preview already current."
          else
            git commit -m "Preview: render Insights Stage A owner review"
            git push origin HEAD:insights-stage-a-preview
          fi
