name: Insights Stage A Regression QA

on:
  push:
    branches:
      - insights-stage-a-preview
    paths:
      - '.github/workflows/insights-stage-a-regression-qa.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare canonical site
        shell: bash
        run: |
          rm -rf owner-preview/insights-stage-a
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          python scripts/apply-social-preview-defaults.py --mode source --root .
          jekyll build --source . --destination _site
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site
          python scripts/validate-insights-v2-r1.py --source-root . --site-root _site

      - name: Verify final defect closures
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core
          python -m http.server 4173 --directory _site >/tmp/iv2-regression-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/insights/ >/dev/null && break
            sleep 0.2
          done
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          node <<'NODE'
          const {chromium}=require('playwright-core');
          const base='http://127.0.0.1:4173';
          const articles=[
            '/insights/what-happens-after-a-lead-arrives/',
            '/ru/insights/chto-proiskhodit-posle-zayavki/',
            '/insights/does-your-service-business-need-a-multilingual-website/',
            '/ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/',
            '/insights/how-to-evaluate-a-website-proposal/',
            '/ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/'
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const failures=[];
            async function pageFor(width,height,mobile=false){
              const c=await browser.newContext({viewport:{width,height},hasTouch:mobile,isMobile:mobile});
              const p=await c.newPage();
              await p.route('**/*',route=>{
                const u=route.request().url();
                return u.startsWith(base+'/')?route.continue():route.abort();
              });
              return [c,p];
            }
            {
              const [c,p]=await pageFor(1280,900,false);
              await p.goto(base+'/ru/insights/',{waitUntil:'commit',timeout:15000});
              await p.waitForSelector('main h1',{timeout:10000});
              await p.waitForTimeout(1100);
              const a=await p.locator('main h1').boundingBox();
              await p.waitForTimeout(350);
              const b=await p.locator('main h1').boundingBox();
              const jitter=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y),Math.abs(a.width-b.width),Math.abs(a.height-b.height));
              console.log('RU HUB 1280 H1 JITTER',jitter);
              if(jitter>.75)failures.push('RU Hub 1280 H1 jitter '+jitter+'px');
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>1)failures.push('RU Hub 1280 overflow '+overflow+'px');
              await c.close();
            }
            for(const [width,height] of [[844,390],[932,430]]){
              for(const path of articles){
                const [c,p]=await pageFor(width,height,true);
                await p.goto(base+path,{waitUntil:'commit',timeout:15000});
                await p.waitForSelector('.insight-v2-signal',{timeout:10000});
                await p.waitForTimeout(120);
                const m=await p.evaluate(()=> {
                  const root=document.documentElement;
                  const h=document.querySelector('main h1').getBoundingClientRect();
                  const signal=document.querySelector('.insight-v2-signal');
                  return {
                    overflow:root.scrollWidth-root.clientWidth,
                    hLeft:h.left,hRight:h.right,client:root.clientWidth,
                    bg:getComputedStyle(signal).backgroundImage,
                    after:getComputedStyle(signal,'::after').display,
                    footer:document.querySelectorAll('.home-footer-golden-r3[data-site-footer-canonical="golden-r1"]').length,
                    signals:signal.querySelectorAll(':scope > div:not(.insight-v2-signal__axis)').length
                  };
                });
                const key=path+' @ '+width+'x'+height;
                console.log(key,JSON.stringify(m));
                if(m.overflow>1)failures.push(key+' overflow '+m.overflow+'px');
                if(m.hLeft<-1||m.hRight>m.client+1)failures.push(key+' H1 clipped');
                if(m.bg!=='none')failures.push(key+' signal background '+m.bg);
                if(m.after!=='none')failures.push(key+' signal ::after '+m.after);
                if(m.footer!==1)failures.push(key+' footer count '+m.footer);
                if(m.signals!==3)failures.push(key+' signal count '+m.signals);
                await c.close();
              }
            }
            await browser.close();
            if(failures.length){
              failures.forEach(x=>console.error('FAIL',x));
              process.exit(1);
            }
            console.log('REGRESSION PASS — final Stage A defects closed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
