name: Insights Stage C Publish Preview

on:
  push:
    branches:
      - insights-stage-c-preview
    paths:
      - '.github/workflows/insights-stage-c-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and validate Stage C
        shell: bash
        run: |
          rm -rf owner-preview/insights-stage-c
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          python scripts/apply-social-preview-defaults.py --mode source --root .
          jekyll build --source . --destination _site
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site
          python scripts/validate-insights-v2-r1.py --source-root . --site-root _site

      - name: Browser QA — AI-Ready EN/RU
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          python -m http.server 4173 --directory _site >/tmp/iv2-stage-c-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/insights/ai-ready-website-for-business/ >/dev/null && break
            sleep 0.2
          done
          export CHROME_BIN
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const base='http://127.0.0.1:4173';
          const routes=[
            ['en','/insights/ai-ready-website-for-business/'],
            ['ru','/ru/insights/ai-ready-sayt-dlya-biznesa/']
          ];
          const viewports=[
            ['p430',430,932,true,true],
            ['p390',390,844,true,true],
            ['p375',375,812,true,true],
            ['p360',360,800,true,true],
            ['p320',320,700,true,true],
            ['l844',844,390,true,true],
            ['l932',932,430,true,true],
            ['t768',768,1024,true,false],
            ['t1024',1024,768,true,false],
            ['d1280',1280,900,false,false],
            ['d1440',1440,900,false,false],
            ['d1600',1600,1000,false,false],
            ['d1920',1920,1080,false,false]
          ];
          (async()=>{
            const browser=await chromium.launch({
              headless:true,
              executablePath:process.env.CHROME_BIN,
              args:['--no-sandbox','--disable-dev-shm-usage']
            });
            const failures=[];
            for(const [lang,path] of routes){
              for(const [name,width,height,touch,mobile] of viewports){
                const c=await browser.newContext({
                  viewport:{width,height},
                  hasTouch:touch,
                  isMobile:mobile
                });
                const p=await c.newPage();
                const errors=[];
                p.on('pageerror',e=>errors.push(String(e)));
                await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:20000});
                await p.evaluate(()=>document.fonts?document.fonts.ready:Promise.resolve());
                await p.waitForTimeout(180);
                const m=await p.evaluate(()=>{
                  const root=document.documentElement;
                  const stack=document.querySelector('[data-stage-c="readiness-stack"]');
                  const maturity=document.querySelector('[data-stage-c="maturity-model"]');
                  const boundary=document.querySelector('[data-stage-c="readiness-boundary"]');
                  const table=maturity?.querySelector('table');
                  const tableWrap=maturity;
                  const ids=['readiness-stack','maturity-model','readiness-boundary'];
                  const headings=ids.map(id=>document.getElementById(id)).filter(Boolean);
                  const h1=document.querySelector('main h1')?.getBoundingClientRect();
                  const order=headings.map(x=>x.getBoundingClientRect().top + scrollY);
                  const toc=[...document.querySelectorAll('.insight-v2-contents a,.insight-v2-rail a')].map(a=>a.getAttribute('href'));
                  return {
                    overflow:root.scrollWidth-root.clientWidth,
                    stackItems:stack?.querySelectorAll(':scope > li').length||0,
                    maturityRows:table?.querySelectorAll('tbody tr').length||0,
                    maturityHeaders:table?.querySelectorAll('thead th').length||0,
                    boundaryCount:boundary?.querySelectorAll(':scope > .insight-v2-boundary').length||0,
                    idsPresent:ids.every(id=>!!document.getElementById(id)),
                    ordered:order.length===3 && order[0]<order[1] && order[1]<order[2],
                    tocPresent:ids.every(id=>toc.includes('#'+id)),
                    tableScrollable:tableWrap ? tableWrap.scrollWidth >= tableWrap.clientWidth : false,
                    tableOverflow:getComputedStyle(tableWrap).overflowX,
                    footer:document.querySelectorAll('.home-footer-golden-r3[data-site-footer-canonical="golden-r1"]').length,
                    related:document.querySelectorAll('[data-related-decisions]').length,
                    h1:h1?{left:h1.left,right:h1.right}:null
                  };
                });
                const key=lang+'/'+name;
                console.log(key,JSON.stringify(m));
                if(m.overflow>1) failures.push(key+': page overflow '+m.overflow+'px');
                if(m.stackItems!==6) failures.push(key+': stack items '+m.stackItems);
                if(m.maturityRows!==5||m.maturityHeaders!==5) failures.push(key+': maturity geometry '+m.maturityRows+'/'+m.maturityHeaders);
                if(m.boundaryCount!==4) failures.push(key+': boundary count '+m.boundaryCount);
                if(!m.idsPresent||!m.ordered||!m.tocPresent) failures.push(key+': Stage C navigation/order failure');
                if(width<=1024 && m.tableOverflow!=='auto') failures.push(key+': maturity table overflow contract '+m.tableOverflow);
                if(m.footer!==1) failures.push(key+': footer '+m.footer);
                if(m.related!==1) failures.push(key+': Related Decisions '+m.related);
                if(!m.h1||m.h1.left<-1||m.h1.right>width+1) failures.push(key+': H1 clipped');
                if(errors.length) failures.push(key+': JS '+errors.join(' | '));
                await c.close();
              }
            }
            await browser.close();
            if(failures.length){
              failures.forEach(x=>console.error('FAIL',x));
              process.exit(1);
            }
            console.log('STAGE C BROWSER PASS — AI-Ready EN/RU across 13 required viewports');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Materialize owner routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          routes = {
              "ai-ready-en": "insights/ai-ready-website-for-business/index.html",
              "ai-ready-ru": "ru/insights/ai-ready-sayt-dlya-biznesa/index.html",
          }
          root=Path("owner-preview/insights-stage-c")
          root.mkdir(parents=True,exist_ok=True)
          for name,src in routes.items():
              dst=root/name/"index.html"
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(Path("_site")/src,dst)
          (root/"BUILD_SHA.txt").write_text("implementation_head=0db745904d65a9958ec6266929f67e1236891cff\n",encoding="utf-8")
          PY

      - name: Commit final rendered preview
        shell: bash
        run: |
          git config user.name "ProAI Preview Bot"
          git config user.email "proai-preview@users.noreply.github.com"
          git add owner-preview/insights-stage-c
          if git diff --cached --quiet; then
            echo "Final preview already current."
          else
            git commit -m "Preview: publish final Insights Stage C"
            git pull --rebase origin insights-stage-c-preview
            git push origin HEAD:insights-stage-c-preview
          fi
