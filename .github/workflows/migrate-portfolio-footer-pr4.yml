name: Migrate Portfolio Footer PR4

on:
  push:
    branches:
      - agent/footer-system-portfolio-pr4

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preserve pre-migration baseline
        shell: bash
        run: |
          mkdir -p /tmp/portfolio-footer-baseline
          rsync -a --exclude='.git' ./ /tmp/portfolio-footer-baseline/

      - name: Apply isolated Portfolio Footer migration
        shell: bash
        run: python .github/scripts/migrate_portfolio_footer.py

      - name: Install Jekyll
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document

      - name: Build baseline and migrated site
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          jekyll build --source /tmp/portfolio-footer-baseline --destination /tmp/portfolio-footer-baseline-site
          jekyll build --source . --destination _site

      - name: Verify generated Portfolio Footer contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = {
              'case-studies/index.html': ('en', '/ru/case-studies/'),
              'ru/case-studies/index.html': ('ru', '/case-studies/'),
              'case-studies/financial-stream/index.html': ('en', '/ru/case-studies/financial-stream/'),
              'ru/case-studies/financial-stream/index.html': ('ru', '/case-studies/financial-stream/'),
              'case-studies/alina-horb/index.html': ('en', '/ru/case-studies/alina-horb/'),
              'ru/case-studies/alina-horb/index.html': ('ru', '/case-studies/alina-horb/'),
              'case-studies/local-repair-pro/index.html': ('en', '/ru/case-studies/local-repair-pro/'),
              'ru/case-studies/local-repair-pro/index.html': ('ru', '/case-studies/local-repair-pro/'),
          }

          for route, (lang, locale_href) in routes.items():
              text = (Path('_site') / route).read_text(encoding='utf-8')
              assert text.count('data-footer-family="portfolio"') == 1, route
              assert text.count('site-footer__brand-zone') == 1, route
              assert text.count('site-footer__watermark') == 1, route
              assert '{% include footer-system/' not in text, route
              assert '{{ footer_' not in text, route
              assert 'portfolio-footer-compact-v1.css' not in text, route
              assert 'https://github.com/proaiexpert' in text, route
              assert f'href="{locale_href}"' in text, route
              if lang == 'en':
                  assert 'https://t.me/proAiexpert' not in text, route
              else:
                  assert 'https://t.me/proAiexpert' in text, route
          print('Generated Portfolio Footer contract passed for 8 routes.')
          PY

      - name: Install browser QA runtime
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run browser and Header parity QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portfolio-footer-qa
          cp portfolio-footer-migration-report.json portfolio-footer-qa/migration-report.json
          python -m http.server 4173 --directory _site >/tmp/portfolio-head-server.log 2>&1 &
          HEAD_SERVER=$!
          python -m http.server 4174 --directory /tmp/portfolio-footer-baseline-site >/tmp/portfolio-base-server.log 2>&1 &
          BASE_SERVER=$!
          trap 'kill $HEAD_SERVER $BASE_SERVER 2>/dev/null || true' EXIT
          sleep 2

          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright

          routes = {
              '/case-studies/': ('en', '/ru/case-studies/'),
              '/ru/case-studies/': ('ru', '/case-studies/'),
              '/case-studies/financial-stream/': ('en', '/ru/case-studies/financial-stream/'),
              '/ru/case-studies/financial-stream/': ('ru', '/case-studies/financial-stream/'),
              '/case-studies/alina-horb/': ('en', '/ru/case-studies/alina-horb/'),
              '/ru/case-studies/alina-horb/': ('ru', '/case-studies/alina-horb/'),
              '/case-studies/local-repair-pro/': ('en', '/ru/case-studies/local-repair-pro/'),
              '/ru/case-studies/local-repair-pro/': ('ru', '/case-studies/local-repair-pro/'),
          }
          viewports = {
              'laptop': {'width': 1440, 'height': 900},
              'portrait': {'width': 390, 'height': 844},
              'landscape': {'width': 844, 'height': 390},
          }

          def metrics(page):
              return page.evaluate('''() => {
                const rect = (node) => {
                  const r = node.getBoundingClientRect();
                  return {x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,right:r.right,bottom:r.bottom,left:r.left};
                };
                const footer = document.querySelector('[data-footer-family="portfolio"]');
                const main = footer.querySelector('.site-footer__main');
                const brand = footer.querySelector('.site-footer__brand-zone');
                const bottom = footer.querySelector('.site-footer__bottom');
                const header = document.querySelector('[data-global-header], .global-header');
                const hs = header ? getComputedStyle(header) : null;
                return {
                  documentOverflow: document.documentElement.scrollWidth - window.innerWidth,
                  footerOverflow: footer.scrollWidth - footer.clientWidth,
                  footerCount: document.querySelectorAll('[data-footer-family="portfolio"]').length,
                  main: rect(main),
                  brand: rect(brand),
                  bottom: rect(bottom),
                  header: header ? rect(header) : null,
                  headerStyle: hs ? {
                    position: hs.position,
                    height: hs.height,
                    paddingLeft: hs.paddingLeft,
                    paddingRight: hs.paddingRight,
                    backgroundColor: hs.backgroundColor,
                    borderBottomWidth: hs.borderBottomWidth
                  } : null,
                  socialTargets: [...footer.querySelectorAll('.site-footer__socials a, .site-footer__locale a')].map(a => ({
                    text: a.textContent.trim(),
                    href: a.getAttribute('href'),
                    height: a.getBoundingClientRect().height,
                    width: a.getBoundingClientRect().width
                  })),
                  links: [...footer.querySelectorAll('a')].map(a => ({text:a.textContent.trim(), href:a.getAttribute('href')}))
                };
              }''')

          results = []
          failures = []
          out = Path('portfolio-footer-qa')

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for route, (lang, locale_href) in routes.items():
                  for viewport_name, viewport in viewports.items():
                      context = browser.new_context(viewport=viewport, reduced_motion='reduce')
                      head = context.new_page()
                      base = context.new_page()
                      head.goto('http://127.0.0.1:4173' + route, wait_until='domcontentloaded')
                      base.goto('http://127.0.0.1:4174' + route, wait_until='domcontentloaded')
                      head.wait_for_timeout(350)
                      base.wait_for_timeout(350)

                      record = {'route': route, 'viewport': viewport_name, 'lang': lang}
                      try:
                          assert head.locator('[data-footer-family="portfolio"]').count() == 1
                          hm = metrics(head)
                          bm = base.evaluate('''() => {
                            const header = document.querySelector('[data-global-header], .global-header');
                            const r = header.getBoundingClientRect();
                            const s = getComputedStyle(header);
                            return {
                              documentOverflow: document.documentElement.scrollWidth - window.innerWidth,
                              header: {x:r.x,y:r.y,width:r.width,height:r.height},
                              headerStyle: {
                                position:s.position,height:s.height,paddingLeft:s.paddingLeft,
                                paddingRight:s.paddingRight,backgroundColor:s.backgroundColor,
                                borderBottomWidth:s.borderBottomWidth
                              }
                            };
                          }''')

                          assert hm['footerCount'] == 1
                          assert hm['footerOverflow'] <= 1, hm
                          assert hm['documentOverflow'] <= max(1, bm['documentOverflow'] + 1), (hm, bm)
                          assert hm['main']['bottom'] <= hm['brand']['top'] + 1, hm
                          assert hm['brand']['bottom'] <= hm['bottom']['top'] + 1, hm

                          for key in ('x', 'y', 'width', 'height'):
                              assert abs(hm['header'][key] - bm['header'][key]) <= 1, (key, hm, bm)
                          assert hm['headerStyle'] == bm['headerStyle'], (hm, bm)

                          hrefs = {item['href'] for item in hm['links']}
                          assert 'https://github.com/proaiexpert' in hrefs
                          assert locale_href in hrefs
                          if lang == 'en':
                              assert 'https://t.me/proAiexpert' not in hrefs
                          else:
                              assert 'https://t.me/proAiexpert' in hrefs

                          for target in hm['socialTargets']:
                              assert target['height'] >= 43.5, target

                          action = head.locator('.site-footer__primary-action')
                          assert action.count() == 1
                          action.focus()
                          focus_style = action.evaluate('(node) => { const s=getComputedStyle(node); return {outlineStyle:s.outlineStyle, outlineWidth:s.outlineWidth}; }')
                          assert focus_style['outlineStyle'] != 'none', focus_style

                          slug = route.strip('/').replace('/', '-') or 'home'
                          shot = out / f'{slug}-{viewport_name}.png'
                          head.locator('[data-footer-family="portfolio"]').screenshot(path=str(shot))
                          record.update({'status': 'passed', 'head': hm, 'baselineDocumentOverflow': bm['documentOverflow']})
                      except Exception as exc:
                          record.update({'status': 'failed', 'error': repr(exc)})
                          failures.append(record)
                      finally:
                          results.append(record)
                          head.close()
                          base.close()
                          context.close()
              browser.close()

          (out / 'results.json').write_text(json.dumps(results, indent=2, ensure_ascii=False), encoding='utf-8')
          (out / 'summary.json').write_text(json.dumps({'failures': failures, 'count': len(results)}, indent=2, ensure_ascii=False), encoding='utf-8')
          if failures:
              raise SystemExit(f'Portfolio Footer browser QA failed: {len(failures)} combinations')
          print(f'Portfolio Footer browser QA passed: {len(results)} route/viewport combinations.')
          PY

      - name: Verify final file scope
        shell: bash
        run: |
          rm -f portfolio-footer-migration-report.json
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              '.github/workflows/deploy-pages.yml',
              '_data/footer.yml',
              '_includes/footer-system/footer.html',
              '_includes/footer-system/portfolio.html',
              'assets/css/footer-system-v1.css',
              'assets/css/portfolio-footer-compact-v1.css',
              'case-studies/index.html',
              'ru/case-studies/index.html',
              'case-studies/financial-stream/index.html',
              'ru/case-studies/financial-stream/index.html',
              'case-studies/alina-horb/index.html',
              'ru/case-studies/alina-horb/index.html',
              'case-studies/local-repair-pro/index.html',
              'ru/case-studies/local-repair-pro/index.html',
              'ru/case-studies/proai-expert/index.html',
          }
          changed = set(subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines())
          paths = {line[3:] for line in changed}
          unexpected = paths - allowed
          assert not unexpected, f'Unexpected changed files: {sorted(unexpected)}'
          assert not Path('.github/scripts/migrate_portfolio_footer.py').exists()
          assert not Path('.github/workflows/migrate-portfolio-footer-pr4.yml').exists()
          print('Final file scope verified:', sorted(paths))
          PY

      - name: Upload Portfolio Footer QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-footer-pr4-qa
          path: portfolio-footer-qa
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Portfolio pages to Footer System"
          git push origin "HEAD:${GITHUB_REF_NAME}"
