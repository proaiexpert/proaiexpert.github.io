name: Normalize OG and favicon closeout branch

on:
  push:
    branches:
      - audit/og-favicon-final-closeout-20260911

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize source authority
        run: python scripts/apply-social-preview-defaults.py --mode source --root .

      - name: Commit normalized source and approved assets
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize OG/favicon source authority [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
