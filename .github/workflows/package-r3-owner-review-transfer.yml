name: Package R3 Owner Review Transfer

on:
  push:
    branches:
      - agent/hero-r3-owner-review-artifact
    paths-ignore:
      - PROAI_HERO_R3_OWNER_REVIEW.html
      - PROAI_HERO_R3_OWNER_REVIEW.html.gz.b64chunks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package generated HTML into transport chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, base64, textwrap
          src = Path('PROAI_HERO_R3_OWNER_REVIEW.html')
          if not src.exists():
              raise SystemExit('Standalone HTML missing')
          raw = src.read_bytes()
          packed = gzip.compress(raw, compresslevel=9, mtime=0)
          enc = base64.b64encode(packed).decode('ascii')
          lines = textwrap.wrap(enc, 8000)
          Path('PROAI_HERO_R3_OWNER_REVIEW.html.gz.b64chunks').write_text('\n'.join(lines) + '\n', encoding='ascii')
          print('html', len(raw), 'gzip', len(packed), 'b64', len(enc), 'chunks', len(lines))
          PY
      - name: Commit transport chunks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROAI_HERO_R3_OWNER_REVIEW.html.gz.b64chunks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Package R3 owner review transfer chunks'
          git push
