name: Diagnose GitHub Pages publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-deployment-diagnostic.yml

permissions:
  contents: read
  pages: write
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages configuration and request rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          api_base="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          accept_header="Accept: application/vnd.github+json"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          version_header="X-GitHub-Api-Version: 2026-03-10"

          site_file="$(mktemp)"
          request_file="$(mktemp)"
          latest_file="$(mktemp)"

          site_code="$(curl --silent --show-error --location \
            --output "${site_file}" --write-out '%{http_code}' \
            --header "${accept_header}" \
            --header "${auth_header}" \
            --header "${version_header}" \
            "${api_base}/pages" || printf '000')"

          request_code="$(curl --silent --show-error --location \
            --output "${request_file}" --write-out '%{http_code}' \
            --request POST \
            --header "${accept_header}" \
            --header "${auth_header}" \
            --header "${version_header}" \
            "${api_base}/pages/builds" || printf '000')"

          latest_status="unknown"
          latest_commit="unknown"
          latest_code="000"

          for _ in $(seq 1 18); do
            latest_code="$(curl --silent --show-error --location \
              --output "${latest_file}" --write-out '%{http_code}' \
              --header "${accept_header}" \
              --header "${auth_header}" \
              --header "${version_header}" \
              "${api_base}/pages/builds/latest" || printf '000')"

            latest_status="$(jq -r '.status // "unknown"' "${latest_file}" 2>/dev/null || printf 'unknown')"
            latest_commit="$(jq -r 'if (.commit | type) == "string" then .commit elif (.commit | type) == "object" then (.commit.sha // .commit.id // "unknown") else "unknown" end' "${latest_file}" 2>/dev/null || printf 'unknown')"

            if [[ "${latest_status}" == "errored" || "${latest_status}" == "cancelled" ]]; then
              break
            fi

            if [[ "${latest_status}" == "built" && "${latest_commit}" == "${GITHUB_SHA}" ]]; then
              break
            fi

            sleep 5
          done

          build_type="$(jq -r '.build_type // "unknown"' "${site_file}" 2>/dev/null || printf 'unknown')"
          source_branch="$(jq -r '.source.branch // "unknown"' "${site_file}" 2>/dev/null || printf 'unknown')"
          source_path="$(jq -r '.source.path // "unknown"' "${site_file}" 2>/dev/null || printf 'unknown')"
          site_status="$(jq -r '.status // "unknown"' "${site_file}" 2>/dev/null || printf 'unknown')"

          state="pending"
          if [[ "${latest_status}" == "built" && "${latest_commit}" == "${GITHUB_SHA}" ]]; then
            state="success"
          elif [[ "${latest_status}" == "errored" || "${latest_status}" == "cancelled" ]]; then
            state="failure"
          elif [[ "${site_code}" != "200" ]]; then
            state="error"
          fi

          short_commit="${latest_commit:0:12}"
          description="type=${build_type}; request=${request_code}; build=${latest_status}; commit=${short_commit}"
          description="${description:0:140}"

          status_payload="$(jq -n \
            --arg state "${state}" \
            --arg description "${description}" \
            --arg context "pages-publication-diagnostic" \
            '{state: $state, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "${accept_header}" \
            --header "${auth_header}" \
            --header "${version_header}" \
            --header "Content-Type: application/json" \
            "${api_base}/statuses/${GITHUB_SHA}" \
            --data "${status_payload}"

          {
            echo "## GitHub Pages publication diagnostic"
            echo
            echo "- Site API HTTP: ${site_code}"
            echo "- Build type: ${build_type}"
            echo "- Site status: ${site_status}"
            echo "- Source: ${source_branch}${source_path}"
            echo "- Build request HTTP: ${request_code}"
            echo "- Latest build API HTTP: ${latest_code}"
            echo "- Latest build status: ${latest_status}"
            echo "- Latest build commit: ${latest_commit}"
            echo "- Workflow commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
