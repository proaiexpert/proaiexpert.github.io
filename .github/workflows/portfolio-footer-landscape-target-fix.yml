name: Portfolio Footer Landscape Target Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/footer-system-portfolio-pr4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/footer-system-portfolio-pr4
          fetch-depth: 0
      - name: Restore 44px detail-link touch targets in landscape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/footer-system-v1.css')
          text = path.read_text(encoding='utf-8')
          old = '.site-footer__detail-group a { min-height: 40px; font-size: 13px; }'
          new = '.site-footer__detail-group a { min-height: 44px; font-size: 13px; }'
          if text.count(old) != 1:
              raise SystemExit('Expected landscape touch-target rule not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit production CSS correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/footer-system-v1.css
          git commit -m "Keep Portfolio footer touch targets accessible in landscape"
          git push origin HEAD:agent/footer-system-portfolio-pr4
