name: Portfolio Footer PR4 QA Diagnostic

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/footer-system-portfolio-pr4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/footer-system-portfolio-pr4
          fetch-depth: 0
      - name: Build baseline and head
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          git fetch origin main
          git worktree add /tmp/base origin/main
          jekyll build --source /tmp/base --destination /tmp/base-site
          jekyll build --source . --destination /tmp/head-site
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Print representative metrics
        shell: bash
        run: |
          python -m http.server 4173 --directory /tmp/head-site >/tmp/head.log 2>&1 &
          H=$!
          python -m http.server 4174 --directory /tmp/base-site >/tmp/base.log 2>&1 &
          B=$!
          trap 'kill $H $B 2>/dev/null || true' EXIT
          sleep 2
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          with sync_playwright() as p:
              browser = p.chromium.launch()
              for route, viewport in [
                  ('/case-studies/financial-stream/', {'width':390,'height':844}),
                  ('/ru/case-studies/financial-stream/', {'width':390,'height':844}),
                  ('/case-studies/', {'width':1440,'height':900}),
              ]:
                  context = browser.new_context(viewport=viewport, reduced_motion='reduce')
                  head = context.new_page()
                  base = context.new_page()
                  head.goto('http://127.0.0.1:4173' + route, wait_until='domcontentloaded')
                  base.goto('http://127.0.0.1:4174' + route, wait_until='domcontentloaded')
                  head.wait_for_timeout(500)
                  base.wait_for_timeout(500)
                  hm = head.evaluate('''() => {
                    const rect = n => { const r=n.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,bottom:r.bottom}; };
                    const f=document.querySelector('[data-footer-family="portfolio"]');
                    const h=document.querySelector('[data-global-header], .global-header');
                    const s=h ? getComputedStyle(h) : null;
                    return {
                      footerCount:document.querySelectorAll('[data-footer-family="portfolio"]').length,
                      docOverflow:document.documentElement.scrollWidth-window.innerWidth,
                      footerOverflow:f.scrollWidth-f.clientWidth,
                      main:rect(f.querySelector('.site-footer__main')),
                      brand:rect(f.querySelector('.site-footer__brand-zone')),
                      bottom:rect(f.querySelector('.site-footer__bottom')),
                      header:h ? rect(h) : null,
                      headerStyle:s ? {position:s.position,height:s.height,paddingLeft:s.paddingLeft,paddingRight:s.paddingRight,backgroundColor:s.backgroundColor,borderBottomWidth:s.borderBottomWidth} : null,
                      links:[...f.querySelectorAll('a')].map(a=>({text:a.textContent.trim(),attr:a.getAttribute('href'),href:a.href,height:a.getBoundingClientRect().height})),
                      socials:[...f.querySelectorAll('.site-footer__socials a')].map(a=>a.href),
                      primaryCount:f.querySelectorAll('.site-footer__primary-action').length
                    };
                  }''')
                  bm = base.evaluate('''() => {
                    const h=document.querySelector('[data-global-header], .global-header');
                    const r=h.getBoundingClientRect();
                    const s=getComputedStyle(h);
                    return {docOverflow:document.documentElement.scrollWidth-window.innerWidth,header:{x:r.x,y:r.y,width:r.width,height:r.height},headerStyle:{position:s.position,height:s.height,paddingLeft:s.paddingLeft,paddingRight:s.paddingRight,backgroundColor:s.backgroundColor,borderBottomWidth:s.borderBottomWidth}};
                  }''')
                  print('ROUTE', route)
                  print('HEAD', json.dumps(hm, ensure_ascii=False, indent=2))
                  print('BASE', json.dumps(bm, ensure_ascii=False, indent=2))
                  head.close(); base.close(); context.close()
              browser.close()
          PY
