name: Portfolio Footer Script Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/footer-system-portfolio-pr4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/footer-system-portfolio-pr4
          fetch-depth: 0
      - name: Patch footer selector and remove diagnostic helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/migrate_portfolio_footer.py')
          text = path.read_text(encoding='utf-8')
          old = """    footer_matches = list(FOOTER_RE.finditer(source))\n    if len(footer_matches) != 1:\n        raise RuntimeError(f\"{path}: expected exactly one legacy <footer>, found {len(footer_matches)}\")\n"""
          new = """    footer_matches = [\n        match\n        for match in FOOTER_RE.finditer(source)\n        if \"global-footer\" in source[match.start() : source.find(\">\", match.start()) + 1]\n    ]\n    if len(footer_matches) != 1:\n        raise RuntimeError(f\"{path}: expected exactly one visible global footer, found {len(footer_matches)}\")\n"""
          if old not in text:
              raise SystemExit('Expected migration selector block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          for helper in (
              Path('.github/workflows/portfolio-footer-diagnostic.yml'),
              Path('.github/workflows/portfolio-footer-script-fix.yml'),
          ):
              helper.unlink(missing_ok=True)
          PY
      - name: Commit selector correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Target visible Portfolio footer markup"
          git push origin HEAD:agent/footer-system-portfolio-pr4
