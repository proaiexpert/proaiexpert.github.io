name: PR19 Corrected Owner Review Captures

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-pr19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR19 implementation branch
        uses: actions/checkout@v4
        with:
          ref: site-integration-owner-qa-phase-a-v2-clean

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/pr19-server.log 2>&1 &
          echo $! > /tmp/pr19-server.pid
          sleep 3
          curl --fail http://127.0.0.1:4173/ >/dev/null

      - name: Capture corrected owner-review evidence
        run: |
          mkdir -p owner-review/pr19-corrected
          cat > capture-pr19.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const base = 'http://127.0.0.1:4173';
          const out = path.resolve('owner-review/pr19-corrected');
          const results = [];

          async function settle(page) {
            await page.waitForLoadState('networkidle');
            await page.waitForTimeout(900);
          }

          async function shot(browser, name, route, viewport, setup) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            await page.goto(base + route, { waitUntil: 'networkidle' });
            await settle(page);
            if (setup) await setup(page);
            await page.waitForTimeout(700);
            const file = path.join(out, name);
            await page.screenshot({ path: file, fullPage: false });
            const stat = fs.statSync(file);
            results.push({ name, route, viewport, bytes: stat.size });
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            await shot(browser, '01-home-en-header-1440.png', '/', { width: 1440, height: 900 });

            await shot(browser, '02-home-en-menu-open-1024.png', '/', { width: 1024, height: 900 }, async page => {
              await page.click('.mobile-menu-toggle');
              await page.waitForSelector('.site-nav.is-open');
            });

            await shot(browser, '03-home-ru-menu-open-1180.png', '/ru/', { width: 1180, height: 900 }, async page => {
              await page.click('.mobile-menu-toggle');
              await page.waitForSelector('.site-nav.is-open');
            });

            await shot(browser, '04-home-en-financial-stream-cta.png', '/', { width: 1440, height: 900 }, async page => {
              await page.evaluate(() => document.querySelector('#section-trigger')?.scrollIntoView({ block: 'center' }));
              await page.waitForTimeout(1000);
              const labels = await page.locator('.fs-cta-group a').allTextContents();
              if (labels.length !== 3) throw new Error(`EN CTA expected 3 links, got ${labels.length}: ${labels}`);
            });

            await shot(browser, '05-home-ru-financial-stream-cta.png', '/ru/', { width: 1440, height: 900 }, async page => {
              await page.evaluate(() => document.querySelector('#section-trigger')?.scrollIntoView({ block: 'center' }));
              await page.waitForTimeout(1000);
              const labels = await page.locator('.fs-cta-group a').allTextContents();
              if (labels.length !== 3) throw new Error(`RU CTA expected 3 links, got ${labels.length}: ${labels}`);
            });

            const endingSetup = async page => {
              await page.evaluate(() => document.querySelector('.case-cross-nav')?.scrollIntoView({ block: 'center' }));
              await page.waitForTimeout(900);
            };
            await shot(browser, '06-financial-stream-ru-ending.png', '/ru/case-studies/financial-stream/', { width: 1440, height: 1000 }, endingSetup);
            await shot(browser, '07-alina-ru-ending.png', '/ru/case-studies/alina-horb/', { width: 1440, height: 1000 }, endingSetup);
            await shot(browser, '08-local-repair-ru-ending.png', '/ru/case-studies/local-repair-pro/', { width: 1440, height: 1000 }, endingSetup);

            await shot(browser, '09-portfolio-footer-desktop.png', '/case-studies/financial-stream/', { width: 1440, height: 900 }, async page => {
              await page.evaluate(() => document.querySelector('footer.global-footer')?.scrollIntoView({ block: 'start' }));
              await page.waitForTimeout(700);
            });

            await shot(browser, '10-portfolio-footer-mobile-390.png', '/case-studies/financial-stream/', { width: 390, height: 844 }, async page => {
              await page.evaluate(() => document.querySelector('footer.global-footer')?.scrollIntoView({ block: 'start' }));
              await page.waitForTimeout(700);
            });

            const railChecks = [];
            await shot(browser, '11-alina-rail-dark-1600.png', '/ru/case-studies/alina-horb/', { width: 1600, height: 900 }, async page => {
              await page.evaluate(() => document.querySelector('#brief')?.scrollIntoView({ block: 'center' }));
              await page.waitForTimeout(1200);
              const check = await page.evaluate(() => {
                const rail = document.querySelector('.ahv3-progress-rail');
                const section = document.querySelector('#brief');
                const content = section?.querySelector('.ahv3-container');
                return {
                  visible: !!rail && getComputedStyle(rail).display !== 'none' && getComputedStyle(rail).opacity !== '0',
                  ivory: document.body.classList.contains('ivory-active'),
                  rail: rail ? JSON.parse(JSON.stringify(rail.getBoundingClientRect())) : null,
                  content: content ? JSON.parse(JSON.stringify(content.getBoundingClientRect())) : null
                };
              });
              railChecks.push({ state: 'dark', ...check });
              if (!check.visible || check.ivory) throw new Error(`Dark rail state invalid: ${JSON.stringify(check)}`);
            });

            await shot(browser, '12-alina-rail-ivory-1600.png', '/ru/case-studies/alina-horb/', { width: 1600, height: 900 }, async page => {
              await page.evaluate(() => document.querySelector('#template-risk')?.scrollIntoView({ block: 'center' }));
              await page.waitForTimeout(1200);
              const check = await page.evaluate(() => {
                const rail = document.querySelector('.ahv3-progress-rail');
                const section = document.querySelector('#template-risk');
                const text = section?.querySelector('.ahv3-body');
                return {
                  visible: !!rail && getComputedStyle(rail).display !== 'none' && getComputedStyle(rail).opacity !== '0',
                  ivory: document.body.classList.contains('ivory-active'),
                  rail: rail ? JSON.parse(JSON.stringify(rail.getBoundingClientRect())) : null,
                  text: text ? JSON.parse(JSON.stringify(text.getBoundingClientRect())) : null
                };
              });
              railChecks.push({ state: 'ivory', ...check });
              if (!check.visible || !check.ivory) throw new Error(`Ivory rail state invalid: ${JSON.stringify(check)}`);
            });

            await shot(browser, '13-alina-rail-hidden-1366.png', '/ru/case-studies/alina-horb/', { width: 1366, height: 768 }, async page => {
              await page.evaluate(() => document.querySelector('#brief')?.scrollIntoView({ block: 'center' }));
              await page.waitForTimeout(1000);
              const display = await page.locator('.ahv3-progress-rail').evaluate(el => getComputedStyle(el).display);
              if (display !== 'none') throw new Error(`Rail must be hidden at 1366, got ${display}`);
            });

            fs.writeFileSync(path.join(out, 'capture-results.json'), JSON.stringify({ results, railChecks }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          node capture-pr19.js

      - name: Build corrected contact sheet
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import math
          source = Path('owner-review/pr19-corrected')
          files = sorted(p for p in source.glob('[0-9][0-9]-*.png'))
          assert len(files) == 13, len(files)
          tw, th, lh, cols, margin = 480, 300, 54, 3, 24
          rows = math.ceil(len(files)/cols)
          sheet = Image.new('RGB', (margin + cols*(tw+margin), margin + rows*(th+lh+margin)), (18,18,20))
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()
          for i, p in enumerate(files):
              with Image.open(p) as im:
                  im = im.convert('RGB'); im.thumbnail((tw,th), Image.Resampling.LANCZOS)
                  tile = Image.new('RGB',(tw,th),(5,5,6)); tile.paste(im,((tw-im.width)//2,(th-im.height)//2))
              x = margin + (i%cols)*(tw+margin); y = margin + (i//cols)*(th+lh+margin)
              sheet.paste(tile,(x,y)); draw.rectangle((x,y,x+tw-1,y+th-1),outline=(80,80,88)); draw.text((x,y+th+10),p.name,fill=(235,235,240),font=font)
          sheet.save(source/'00-contact-sheet-corrected.png', optimize=True)
          PY

      - name: Upload corrected visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr19-corrected-owner-review
          path: owner-review/pr19-corrected/
          if-no-files-found: error
          retention-days: 3
