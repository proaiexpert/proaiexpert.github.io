name: ProAI Connected System Premium Polish R1 Owner Review
on:
  push:
    branches: [agent/proai-connected-system-premium-polish-r1]
    paths: [.github/workflows/proai-connected-system-premium-polish-r1-owner-review.yml]
permissions:
  contents: read
jobs:
  owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify locks and clean product scope
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=4e8b12e040f1024e8ece5185a8ea02e6bd8d0981
          BASE=0c0613cd40d0f396d9dbf05bf2f8a61658ff4ae0
          ORIGINAL_HEAD=291663b21437b154d8c2f62f72cc05ab62728c07
          MAIN=c945084e1952c05c686494091f7dbca0f7acdf08
          git merge-base --is-ancestor "$BASE" "$PRODUCT"
          test "$(git rev-parse ${PRODUCT}^)" = "$BASE"
          test "$(git diff --name-only "$BASE" "$PRODUCT" | wc -l)" -eq 1
          test "$(git diff --name-only "$BASE" "$PRODUCT")" = 'assets/js/homepage-connected-system-r13.js'
          test "$(git ls-remote origin refs/heads/agent/proai-home-assembly-r1 | cut -f1)" = "$ORIGINAL_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          if git diff --name-only "$PRODUCT" HEAD | grep -Ev '^\.github/workflows/' | grep -q .; then
            echo 'NON_REVIEW_CHANGE_AFTER_PRODUCT'
            git diff --name-only "$PRODUCT" HEAD
            exit 1
          fi
          git diff --quiet "$BASE" "$PRODUCT" -- assets/css/homepage-connected-system-r13.css
          git diff --quiet "$BASE" "$PRODUCT" -- _includes/homepage-connected-system-en.html
          git diff --quiet "$BASE" "$PRODUCT" -- _includes/homepage-connected-system-ru.html
          git diff --quiet "$BASE" "$PRODUCT" -- assets/js/header-system-v1.js
          git diff --quiet "$BASE" "$PRODUCT" -- assets/css/header-footer-logo-r1.css
          git diff --quiet "$BASE" "$PRODUCT" -- assets/css/homepage-hero-signature-r3.css
          node --check assets/js/homepage-connected-system-r13.js
          grep -q 'const firstActive=760;' assets/js/homepage-connected-system-r13.js
          grep -q 'const stageOffset=1900;' assets/js/homepage-connected-system-r13.js
          grep -q 'const transferDuration=620;' assets/js/homepage-connected-system-r13.js
          ! grep -q "addEventListener('wheel'" assets/js/homepage-connected-system-r13.js
          ! grep -q 'mousewheel' assets/js/homepage-connected-system-r13.js

      - name: Build assembled site
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          jekyll build --source . --destination _site >/dev/null
          test "$(grep -o 'data-connected-system' _site/index.html | wc -l)" -eq 1
          test "$(grep -o 'data-connected-system' _site/ru/index.html | wc -l)" -eq 1
          grep -q 'proai-hero-cube-mount' _site/index.html
          grep -q 'proai-hero-cube-mount' _site/ru/index.html
          grep -q 'aria-hidden="true" class="cs-type-specular"' _site/index.html || grep -q 'cs-type-specular' _site/index.html
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/cs-polish-http.log 2>&1 &

      - name: Bounded browser QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          OUT=/tmp/cs-polish-review
          WORK=/tmp/cs-polish-browser
          mkdir -p "$OUT" "$WORK"
          cd "$WORK"
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --silent
          cat > qa.cjs <<'NODE'
          const fs=require('fs');
          const puppeteer=require('puppeteer-core');
          const base='http://127.0.0.1:8080';
          const out='/tmp/cs-polish-review';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fail=m=>{throw new Error(m)};
          let browser;
          const results={timing:null,hoverOverride:null,focusOverride:null,scrollAway:null,wheel:null,mobile:{},reducedMotion:null,responsive:{},accessibility:null,header:null};

          async function pageAt(path='/',w=1366,h=768,{reduced=false}={}){
            const p=await browser.newPage();
            await p.setViewport({width:w,height:h,deviceScaleFactor:1});
            if(reduced)await p.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'reduce'}]);
            await p.setRequestInterception(true);
            p.on('request',req=>{
              const u=req.url();
              if(u.includes('/assets/models/')||u.includes('/assets/vendor/three-r180/')||u.includes('/assets/js/proai-hero-cube-r1/')||u.includes('/assets/brand/proai-logo-r341/live.html'))req.abort();
              else req.continue();
            });
            await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:12000});
            await p.waitForSelector('[data-connected-system]',{timeout:5000});
            await sleep(120);
            return p;
          }

          async function centerSection(p){
            await p.$eval('[data-connected-system]',e=>e.scrollIntoView({block:'center'}));
            await sleep(80);
          }

          const stageState=async p=>p.evaluate(()=>[...document.querySelectorAll('[data-system-stage]')].map((s,i)=>({i,active:s.classList.contains('is-active'),balanced:s.classList.contains('is-balanced'),future:s.classList.contains('is-future'),settled:s.classList.contains('is-settled')})));

          async function timing(){
            const p=await pageAt();
            const before=(await stageState(p)).some(s=>s.active);
            if(before)fail('desktop sequence started before Connected System entry');
            await p.evaluate(()=>{
              window.__csEvents=[];
              const stages=[...document.querySelectorAll('[data-system-stage]')];
              const section=document.querySelector('[data-connected-system]');
              window.__csStart=performance.now();
              const obs=new MutationObserver(()=>{
                const now=performance.now()-window.__csStart;
                stages.forEach((s,i)=>{
                  if(s.classList.contains('is-active')&&!window.__csEvents.some(e=>e.type==='active'&&e.i===i))window.__csEvents.push({type:'active',i,t:now});
                });
                if(stages.every(s=>s.classList.contains('is-balanced'))&&!window.__csEvents.some(e=>e.type==='balanced'))window.__csEvents.push({type:'balanced',t:now});
              });
              obs.observe(section,{subtree:true,attributes:true,attributeFilter:['class']});
              window.__csObs=obs;
            });
            await centerSection(p);
            await sleep(7900);
            const events=await p.evaluate(()=>window.__csEvents);
            const active=events.filter(e=>e.type==='active').sort((a,b)=>a.t-b.t);
            const balanced=events.find(e=>e.type==='balanced');
            const gaps=active.slice(1).map((e,i)=>e.t-active[i].t);
            const pass=active.length===4&&active.map(e=>e.i).join(',')==='0,1,2,3'&&active[0].t>=500&&active[0].t<=1150&&gaps.every(g=>g>=1650&&g<=2200)&&balanced&&balanced.t>=6800&&balanced.t<=8200;
            results.timing={events,firstDelay:active[0]?.t||null,gaps,balancedAt:balanced?.t||null,pass};
            if(!pass)fail('timing '+JSON.stringify(results.timing));
            const countBefore=active.length;
            await p.evaluate(()=>scrollTo(0,0)); await sleep(250); await centerSection(p); await sleep(2700);
            const after=await p.evaluate(()=>window.__csEvents.filter(e=>e.type==='active').length);
            if(after!==countBefore)fail('autoplay repeated on re-entry');
            window.__csObs&&await p.evaluate(()=>window.__csObs?.disconnect());
            await p.close();
          }

          async function hoverOverride(){
            const p=await pageAt(); await centerSection(p); await sleep(1100);
            await p.hover('[data-system-stage]:nth-child(3)'); await sleep(720);
            const active=await p.evaluate(()=>[...document.querySelectorAll('[data-system-stage]')].findIndex(s=>s.classList.contains('is-active')));
            await sleep(2500);
            const still=await p.evaluate(()=>[...document.querySelectorAll('[data-system-stage]')].findIndex(s=>s.classList.contains('is-active')));
            await p.mouse.move(5,5); await sleep(260);
            const balanced=(await stageState(p)).every(s=>s.balanced);
            await sleep(2300);
            const balancedLater=(await stageState(p)).every(s=>s.balanced);
            results.hoverOverride={active,still,balanced,balancedLater,pass:active===2&&still===2&&balanced&&balancedLater};
            if(!results.hoverOverride.pass)fail('hover override '+JSON.stringify(results.hoverOverride));
            await p.close();
          }

          async function focusOverride(){
            const p=await pageAt(); await centerSection(p); await sleep(430);
            await p.$eval('[data-system-stage]:nth-child(2)',e=>e.focus()); await sleep(720);
            const active=await p.evaluate(()=>[...document.querySelectorAll('[data-system-stage]')].findIndex(s=>s.classList.contains('is-active')));
            await p.evaluate(()=>document.activeElement?.blur()); await sleep(260);
            const balanced=(await stageState(p)).every(s=>s.balanced);
            await sleep(2300);
            const balancedLater=(await stageState(p)).every(s=>s.balanced);
            results.focusOverride={active,balanced,balancedLater,pass:active===1&&balanced&&balancedLater};
            if(!results.focusOverride.pass)fail('focus override '+JSON.stringify(results.focusOverride));
            await p.close();
          }

          async function scrollAway(){
            const p=await pageAt(); await centerSection(p); await sleep(1150);
            await p.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight)); await sleep(520);
            const offscreenBalanced=(await stageState(p)).every(s=>s.balanced);
            await centerSection(p); await sleep(2800);
            const replayActive=(await stageState(p)).some(s=>s.active);
            results.scrollAway={offscreenBalanced,replayActive,pass:offscreenBalanced&&!replayActive};
            if(!results.scrollAway.pass)fail('scroll-away '+JSON.stringify(results.scrollAway));
            await p.close();
          }

          async function wheel(){
            const p=await pageAt(); await centerSection(p); await sleep(7800);
            const y0=await p.evaluate(()=>scrollY);
            const state0=await stageState(p);
            await p.mouse.wheel({deltaY:420}); await sleep(260);
            const y1=await p.evaluate(()=>scrollY);
            const state1=await stageState(p);
            const balanced0=state0.every(s=>s.balanced), balanced1=state1.every(s=>s.balanced);
            results.wheel={scrollDelta:y1-y0,balanced0,balanced1,pass:y1-y0>120&&balanced0&&balanced1};
            if(!results.wheel.pass)fail('wheel '+JSON.stringify(results.wheel));
            await p.close();
          }

          async function mobileCase(w,h,label,kind){
            const p=await pageAt('/',w,h);
            const select=async i=>{
              await p.evaluate(i=>{const s=document.querySelectorAll('[data-system-stage]')[i];const r=s.getBoundingClientRect();scrollTo(0,scrollY+r.top+r.height/2-innerHeight*.565);},i);
              await sleep(760);
              return p.evaluate(()=>[...document.querySelectorAll('[data-system-stage]')].findIndex(s=>s.classList.contains('is-active')));
            };
            const a0=await select(0);
            let seq=[];
            if(kind==='slow'){for(let i=1;i<4;i++)seq.push(await select(i));}
            else{seq.push(await select(3));seq.push(await select(1));}
            const stable0=await p.evaluate(()=>[...document.querySelectorAll('[data-system-stage]')].findIndex(s=>s.classList.contains('is-active')));
            await sleep(2300);
            const stable1=await p.evaluate(()=>[...document.querySelectorAll('[data-system-stage]')].findIndex(s=>s.classList.contains('is-active')));
            const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
            const expected=kind==='slow'?'1,2,3':'3,1';
            const pass=a0===0&&seq.join(',')===expected&&stable0===stable1&&overflow<=1;
            results.mobile[label]={a0,seq,stable0,stable1,overflow,pass};
            if(!pass)fail('mobile '+label+' '+JSON.stringify(results.mobile[label]));
            await p.close();
          }

          async function reduced(){
            const p=await pageAt('/',1366,768,{reduced:true}); await centerSection(p); await sleep(2500);
            const r=await p.evaluate(()=>({
              balanced:[...document.querySelectorAll('[data-system-stage]')].every(s=>s.classList.contains('is-balanced')),
              active:[...document.querySelectorAll('[data-system-stage]')].some(s=>s.classList.contains('is-active')),
              motionReady:document.querySelector('[data-connected-system]').classList.contains('cs-motion-ready'),
              opticalAnimations:[...document.querySelectorAll('.cs-spine-catch,.cs-light-carriage,.cs-ambient-catch')].reduce((n,e)=>n+e.getAnimations().length,0)
            }));
            r.pass=r.balanced&&!r.active&&!r.motionReady&&r.opticalAnimations===0;
            results.reducedMotion=r;
            if(!r.pass)fail('reduced '+JSON.stringify(r));
            await p.close();
          }

          async function responsive(path,w,h,label){
            const p=await pageAt(path,w,h);
            const r=await p.evaluate(()=>{
              const rect=e=>{const r=e.getBoundingClientRect();return{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
              const hero=document.querySelector('#hero');const cs=document.querySelector('[data-connected-system]');const cube=document.querySelector('#hero .proai-hero-object-region');
              const buttons=[...document.querySelectorAll('#hero .proai-hero-cta')].map(rect);
              const stages=[...document.querySelectorAll('[data-system-stage]')].map(rect);
              return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,hero:rect(hero),cs:rect(cs),cube:rect(cube),buttons,stages,gap:rect(cs).top-rect(hero).bottom,header:!!document.querySelector('[data-site-header]')};
            });
            const buttonsOk=r.buttons.length===2&&r.buttons.every(b=>b.left>=-2&&b.right<=w+2&&b.width>40);
            const stagesOk=r.stages.length===4&&r.stages.every(s=>s.left>=-4&&s.right<=w+4&&s.width>70);
            r.pass=r.overflow<=1&&r.header&&r.hero.height>300&&r.cs.height>250&&r.cube.left>=-8&&r.cube.right<=w+8&&buttonsOk&&stagesOk&&r.gap>=-3&&r.gap<=8;
            results.responsive[label]=r;
            if(!r.pass)fail('responsive '+label+' '+JSON.stringify(r));
            await p.close();
          }

          async function accessibility(){
            const p=await pageAt();
            const r=await p.evaluate(()=>({
              h3:[...document.querySelectorAll('[data-system-stage] h3')].length,
              specular:[...document.querySelectorAll('.cs-type-specular')].length,
              specularHidden:[...document.querySelectorAll('.cs-type-specular')].every(e=>e.getAttribute('aria-hidden')==='true'),
              specularOverlay:[...document.querySelectorAll('.cs-type-specular')].every(e=>getComputedStyle(e).position==='absolute'),
              focusable:[...document.querySelectorAll('[data-system-stage]')].every(e=>e.tabIndex===0)
            }));
            r.pass=r.h3===4&&r.specular===4&&r.specularHidden&&r.specularOverlay&&r.focusable;
            results.accessibility=r;
            if(!r.pass)fail('accessibility '+JSON.stringify(r));
            await p.close();
          }

          async function headerSanity(){
            const p=await pageAt('/',430,932);
            const hidden=()=>p.$eval('[data-site-header]',e=>e.classList.contains('header-hidden'));
            await centerSection(p);await sleep(250);await p.evaluate(()=>scrollBy(0,260));await sleep(330);const down=await hidden();
            await p.evaluate(()=>scrollBy(0,-180));await sleep(330);const up=!(await hidden());
            await p.click('.site-header__menu-toggle');await sleep(120);const menu=!(await hidden())&&await p.$eval('.site-header__menu-toggle',e=>e.getAttribute('aria-expanded')==='true');
            results.header={down,up,menu,pass:down&&up&&menu};
            if(!results.header.pass)fail('header '+JSON.stringify(results.header));
            await p.close();
          }

          (async()=>{
            browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage','--disable-background-timer-throttling','--disable-backgrounding-occluded-windows','--disable-renderer-backgrounding']});
            await timing();
            await hoverOverride();
            await focusOverride();
            await scrollAway();
            await wheel();
            await mobileCase(430,932,'430x932','slow');
            await mobileCase(390,844,'390x844','fast');
            await mobileCase(360,800,'360x800','fast');
            await mobileCase(932,430,'932x430','fast');
            await reduced();
            for(const v of [['/',1440,900,'1440x900'],['/',1366,768,'1366x768'],['/',1280,800,'1280x800'],['/',1024,768,'1024x768'],['/',430,932,'430x932-layout'],['/',390,844,'390x844-layout'],['/',932,430,'932x430-layout']])await responsive(...v);
            await accessibility();
            await headerSanity();
            fs.writeFileSync(`${out}/QA_RESULTS.json`,JSON.stringify(results,null,2));
            console.log('CS_PREMIUM_POLISH_QA_PASS');
            await browser.close();
          })().catch(async e=>{results.error=String(e.stack||e);fs.writeFileSync(`${out}/QA_RESULTS.json`,JSON.stringify(results,null,2));console.error(e);if(browser)await browser.close();process.exit(1);});
          NODE
          CHROME_BIN="$CHROME_BIN" timeout 150s node qa.cjs

      - name: Publish live owner preview
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/cs-polish-review
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >"$OUT/cloudflared.log" 2>&1 &
          BASE=""
          for i in $(seq 1 60); do
            BASE="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' "$OUT/cloudflared.log" | tail -1 || true)"
            [ -n "$BASE" ] && break
            sleep 2
          done
          test -n "$BASE"
          for i in $(seq 1 25); do
            if curl -fsS --max-time 15 -o /tmp/public-en "$BASE/"; then break; fi
            [ "$i" -eq 25 ] && exit 1
            sleep 3
          done
          curl -fsS --retry 3 --retry-delay 2 --max-time 20 -o /tmp/public-ru "$BASE/ru/"
          for P in /assets/css/homepage-connected-system-r13.css /assets/js/homepage-connected-system-r13.js /assets/js/header-system-v1.js /assets/js/proai-hero-cube-r1/bootstrap.js /assets/models/proai-cube/rubik_39_s_cube_animation.glb; do
            curl -fsS --retry 3 --retry-delay 2 --max-time 20 -o /dev/null "$BASE$P"
          done
          grep -q 'THE CONNECTED SYSTEM' /tmp/public-en
          grep -q 'ЕДИНАЯ СИСТЕМА' /tmp/public-ru
          printf 'EN\n%s/\nRU\n%s/ru/\nEXPECTED LIFETIME\n3 hours from keepalive start\n' "$BASE" "$BASE" | tee "$OUT/OWNER_URLS.txt"
          printf '%s\n' "$BASE" > "$OUT/PUBLIC_BASE_URL.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: proai-connected-system-premium-polish-r1-owner-review
          path: /tmp/cs-polish-review
          retention-days: 3

      - name: Keep owner preview alive
        shell: bash
        run: sleep 10800
