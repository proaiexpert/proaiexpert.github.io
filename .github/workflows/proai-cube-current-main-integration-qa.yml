name: ProAI Cube current-main integration QA

on:
  push:
    branches:
      - release/proai-cube-r2-zero-drift-framing-hotfix

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact transplant and static release gates
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=assets/js/proai-hero-cube-r1/source-materials-r1.js
          MANIFEST=provenance/proai-cube/r1/integrity-manifest.json
          test "$(git rev-parse HEAD:$SOURCE)" = "d6e54d3ee6b13ad3281e89e5e325cd496cec78a4"
          test "$(git rev-parse HEAD:$MANIFEST)" = "e4b940cbbb0d309a27cbfac9c35f058f109a72ed"
          node --check "$SOURCE"
          node --check assets/brand/proai-logo-r341/live-runtime.js
          node scripts/verify-proai-cube-integrity-r2.mjs
          GLB_SHA=$(sha256sum assets/models/proai-cube/proai-cube-r1.glb | awk '{print toupper($1)}')
          echo "GLB_SHA256=$GLB_SHA"
          test "$GLB_SHA" = "2A97D4671F5AED2E23E5688081C53E1E234A525CF145C6A89BA4C9909FB2B480"
          cp "$MANIFEST" /tmp/bad-manifest.json
          python3 - <<'PY'
          import json
          p='/tmp/bad-manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          d['hashes']['assets/models/proai-cube/proai-cube-r1.glb']='0'*64
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2)+'\n')
          PY
          if PROAI_CUBE_MANIFEST=/tmp/bad-manifest.json node scripts/verify-proai-cube-integrity-r2.mjs; then
            echo "NEGATIVE_SHA_TEST=UNEXPECTED_PASS" >&2
            exit 1
          else
            echo "NEGATIVE_SHA_TEST=EXPECTED_FAIL"
          fi
          for row in \
            "assets/js/proai-hero-cube-r1/source-final-motion-r2.js 6ed425cd0cce7134dc4a1b77673b520b7d01a6c6" \
            "assets/js/proai-hero-cube-r1/source-final-motion-r2-touch-auto-45-r1.js 3d6de6755b38639b3f573dc5341cd249daa26f21" \
            "assets/js/proai-hero-cube-r1/bootstrap-golden-r1-2.js c25d9cc40e79f047b61452727b13737311ff7dc5"; do
            set -- $row
            HOT=$(git rev-parse HEAD:"$1")
            echo "FROZEN_BLOB $1 $HOT"
            test "$HOT" = "$2"
          done
          git diff --check 37d63226b27380958348faca5eda051f4b9f3f5a -- "$SOURCE" "$MANIFEST"

      - name: Jekyll production build
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          echo "JEKYLL_BUILD=PASS"

      - name: Prepare isolated framing fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/frame
          PRODUCT_COMMIT=$(git rev-parse HEAD^)
          git archive "$PRODUCT_COMMIT" | tar -x -C /tmp/frame
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/frame/assets/js/proai-hero-cube-r1/source-materials-r1.js')
          s=p.read_text(encoding='utf-8')
          old="const GLB_URL = new URL('./proai-cube-r1.glb?sha=2A97D4671F5A', import.meta.url).href;"
          new="const GLB_URL = new URL('/assets/models/proai-cube/proai-cube-r1.glb?sha=2A97D4671F5A', location.origin).href;"
          if s.count(old)!=1: raise SystemExit('GLB fixture needle mismatch')
          needle="  configureStudioLighting(centerWorld, radius);\n  controls.update();\n}"
          injected="\n".join([
            "  configureStudioLighting(centerWorld, radius);",
            "  controls.update();",
            "  globalThis.__PROAI_FRAMING_AUDIT = {",
            "    boxMin: box.min.toArray(),",
            "    boxMax: box.max.toArray(),",
            "    sphereCenter: sphere.center.toArray(),",
            "    sphereRadius: radius,",
            "    cameraPosition: camera.position.toArray(),",
            "    controlsTarget: controls.target.toArray(),",
            "    fov: camera.fov",
            "  };",
            "}",
          ])
          if s.count(needle)!=1: raise SystemExit('frameCamera fixture needle mismatch')
          p.write_text(s.replace(old,new,1).replace(needle,injected,1),encoding='utf-8',newline='\n')
          html='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607}#cube-canvas{display:block;width:100vw;height:100vh}</style><script type="importmap">{"imports":{"three":"/assets/vendor/three-r180/build/three.module.min.js","three/addons/":"/assets/vendor/three-r180/examples/jsm/"}}</script></head><body><canvas id="cube-canvas"></canvas><span id="runtime-status" hidden></span><script type="module">import '/assets/js/proai-hero-cube-r1/source-materials-r1.js';</script></body></html>'''
          (Path('/tmp/frame')/'qa-framing.html').write_text(html,encoding='utf-8',newline='\n')
          PY

      - name: Current-main EN RU browser integration smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          echo "CHROME=$CHROME"
          test -n "$CHROME"
          python3 -m http.server 8125 --directory "$GITHUB_WORKSPACE/_site" >/tmp/site-http.log 2>&1 &
          python3 -m http.server 8126 --directory /tmp/frame >/tmp/frame-http.log 2>&1 &
          sleep 2
          cat >/tmp/qa/run.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME});
          const allErrors=[];
          async function makePage(viewport={width:1440,height:900}, opts={}){
            const context=await browser.newContext({viewport,deviceScaleFactor:1,reducedMotion:opts.reducedMotion||'no-preference'});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')allErrors.push({url:page.url(),type:'console',text:m.text()})});
            page.on('pageerror',e=>allErrors.push({url:page.url(),type:'pageerror',text:e.message}));
            return {context,page};
          }
          const expected={
            boxMin:[-3.0526497066745715,-3.007,-3.007],
            boxMax:[3.0526497066745715,3.0069999999999997,3.0069999999999997],
            sphereCenter:[0,-2.220446049250313e-16,-2.220446049250313e-16],
            sphereRadius:5.234765346379945,
            cameraPosition:[12.58074783806352,9.169019610792056,14.179995444597019],
            controlsTarget:[0,-2.220446049250313e-16,-2.220446049250313e-16],
            fov:31
          };
          const frame=await makePage();
          await frame.page.goto('http://127.0.0.1:8126/qa-framing.html?capture=1',{waitUntil:'domcontentloaded',timeout:30000});
          await frame.page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true&&window.__PROAI_FRAMING_AUDIT,{timeout:30000});
          const actual=await frame.page.evaluate(()=>window.__PROAI_FRAMING_AUDIT);
          const flat=v=>Array.isArray(v)?v.flat(Infinity):[v];
          let maxFramingDelta=0;
          for(const k of Object.keys(expected)){
            const a=flat(actual[k]), b=flat(expected[k]); assert(a.length===b.length,'framing shape '+k);
            a.forEach((v,i)=>{maxFramingDelta=Math.max(maxFramingDelta,Math.abs(v-b[i]))});
          }
          assert(maxFramingDelta<=1e-10,'framing authority drift '+maxFramingDelta);
          console.log('FRAMING='+JSON.stringify({actual,maxFramingDelta}));
          await frame.context.close();

          async function waitLiveSystem(page,lang){
            const sec=page.locator('#home-system-execution-r2');
            assert(await sec.count()===1,lang+' Live System R2 missing');
            assert(await sec.getAttribute('data-lang')===lang,lang+' Live System language mismatch');
            await sec.scrollIntoViewIfNeeded();
            await page.waitForFunction(()=>{
              const sec=document.querySelector('#home-system-execution-r2');
              if(!sec?.dataset.motionDuration)return false;
              const modes=[...sec.querySelectorAll('[data-hse-mode]')];
              const mode=modes.find(el=>getComputedStyle(el).display!=='none')||modes[0];
              const root=mode?.querySelector('.hse-state')||mode?.querySelector('.scene')||mode;
              return !!root && (root.classList.contains('ready-on')||root.classList.contains('final'));
            },{timeout:12000});
            return await page.evaluate(()=>{
              const sec=document.querySelector('#home-system-execution-r2');
              const modes=[...sec.querySelectorAll('[data-hse-mode]')];
              const mode=modes.find(el=>getComputedStyle(el).display!=='none')||modes[0];
              const root=mode?.querySelector('.hse-state')||mode?.querySelector('.scene')||mode;
              return {motionDuration:sec.dataset.motionDuration,mode:mode?.dataset.hseMode,classes:root?.className};
            });
          }
          async function waitHeader(page){
            await page.waitForTimeout(1200);
            const frames=page.frames().filter(f=>f.url().includes('/assets/brand/proai-logo-r341/live.html'));
            assert(frames.length===1,'Header Living Logo frame count='+frames.length);
            await frames[0].waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,{timeout:30000});
            const d=await frames[0].evaluate(()=>__PROAI_CUBE_R1_2.getDiagnostics());
            assert(d.ready===true,'Header not ready');
            assert(d.ownership?.identity?.status==='pass','Header identity not pass');
            return {frameCount:frames.length,ready:d.ready,motionState:d.motionState,identity:d.ownership.identity.status};
          }
          async function baseHome(path,lang,viewport){
            const cp=await makePage(viewport);
            await cp.page.goto('http://127.0.0.1:8125'+path,{waitUntil:'domcontentloaded',timeout:30000});
            await cp.page.waitForFunction(()=>document.documentElement.dataset.goldenCubeReady==='true'&&window.__PROAI_CUBE_R1_2?.ready===true,{timeout:30000});
            const overflow=await cp.page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            assert(overflow.scrollWidth<=overflow.clientWidth+1,lang+' horizontal overflow '+JSON.stringify(overflow));
            const diag=await cp.page.evaluate(()=>__PROAI_CUBE_R1_2.getDiagnostics());
            assert(diag.ownership?.identity?.status==='pass',lang+' runtime identity fail');
            assert(diag.ownership?.identity?.witnessPresent===true,lang+' hidden witness missing');
            assert(diag.ownership?.microEtch?.attached===true,lang+' micro-etch detached');
            const liveSystem=await waitLiveSystem(cp.page,lang);
            const header=await waitHeader(cp.page);
            return {...cp,diag,overflow,liveSystem,header};
          }

          const en=await baseHome('/','en',{width:1440,height:900});
          const canvas=en.page.locator('#cube-canvas');
          const box=await canvas.boundingBox(); assert(box,'Hero Cube canvas missing');
          const x=box.x+box.width*0.45, y=box.y+box.height*0.45;
          const snap=()=>en.page.evaluate(()=>{const d=__PROAI_CUBE_R1_2.getDiagnostics();return {q:d.presentation.quaternion,req:d.ownership.integrity.requestCount,interaction:d.interaction}});
          const qd=(a,b)=>Math.max(...a.map((v,i)=>Math.abs(v-b[i])));
          const s0=await snap();
          await en.page.mouse.move(x,y); await en.page.waitForTimeout(500); const s1=await snap();
          await en.page.mouse.down(); await en.page.waitForTimeout(500); const s2=await snap();
          await en.page.waitForTimeout(1500); const s3=await snap(); await en.page.mouse.up();
          const beforeSlow=await snap(); await en.page.mouse.move(x-90,y); await en.page.mouse.down(); await en.page.mouse.move(x+90,y,{steps:30}); await en.page.mouse.up(); const afterSlow=await snap();
          const beforeFast=await snap(); await en.page.mouse.move(x-150,y); await en.page.mouse.down(); await en.page.mouse.move(x+150,y,{steps:2}); await en.page.mouse.up(); const afterFast=await snap();
          await en.page.waitForTimeout(700); const afterResume=await snap();
          const pointer={hover:qd(s0.q,s1.q),hold05:qd(s1.q,s2.q),hold20:qd(s2.q,s3.q),slowDrag:qd(beforeSlow.q,afterSlow.q),fastDrag:qd(beforeFast.q,afterFast.q),resumeMotion:qd(afterFast.q,afterResume.q),integrityBefore:s0.req,integrityAfter:afterResume.req,finalInteraction:afterResume.interaction};
          assert(pointer.hover>0,'hover freeze reproduced');
          assert(pointer.hold05>0,'0.5s hold freeze reproduced');
          assert(pointer.hold20>0,'2s hold freeze reproduced');
          assert(pointer.slowDrag>0,'slow drag failed');
          assert(pointer.fastDrag>0,'fast drag failed');
          assert(pointer.resumeMotion>0,'release/resume failed');
          assert(pointer.integrityBefore===1&&pointer.integrityAfter===1,'pointer changed integrity request count '+JSON.stringify(pointer));
          assert(pointer.finalInteraction.interactionActive===false&&pointer.finalInteraction.autonomyBlocked===false,'interaction did not release '+JSON.stringify(pointer.finalInteraction));
          const resources=await en.page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
          const heroGlb=resources.filter(n=>n.includes('/assets/models/proai-cube/proai-cube-r1.glb'));
          assert(heroGlb.length===1,'Hero GLB request count='+heroGlb.length+' '+JSON.stringify(heroGlb));
          const provStatus=await en.page.evaluate(async()=>{const r=await fetch('/provenance/proai-cube/r1/');return r.status});
          assert(provStatus===200,'provenance status '+provStatus);
          console.log('EN='+JSON.stringify({overflow:en.overflow,liveSystem:en.liveSystem,header:en.header,identity:en.diag.ownership.identity.status,witness:en.diag.ownership.identity.witnessPresent,microEtchAttached:en.diag.ownership.microEtch.attached,pointer,heroGlbRequestCount:heroGlb.length,provenanceStatus:provStatus}));
          await en.context.close();

          const ru=await baseHome('/ru/','ru',{width:390,height:844});
          console.log('RU='+JSON.stringify({overflow:ru.overflow,liveSystem:ru.liveSystem,header:ru.header,identity:ru.diag.ownership.identity.status,witness:ru.diag.ownership.identity.witnessPresent,microEtchAttached:ru.diag.ownership.microEtch.attached}));
          await ru.context.close();

          const rm=await makePage({width:390,height:844},{reducedMotion:'reduce'});
          await rm.page.goto('http://127.0.0.1:8125/ru/',{waitUntil:'domcontentloaded',timeout:30000});
          await rm.page.waitForFunction(()=>document.documentElement.dataset.goldenCubeReady==='true'&&window.__PROAI_CUBE_R1_2?.ready===true,{timeout:30000});
          const rmd=await rm.page.evaluate(()=>__PROAI_CUBE_R1_2.getDiagnostics().ownership.microEtch);
          assert(rmd.attached===true,'reduced-motion micro-etch detached');
          assert(rmd.glintEnabled===false&&rmd.reducedMotion===true,'reduced-motion glint gate '+JSON.stringify(rmd));
          console.log('REDUCED_MOTION='+JSON.stringify(rmd));
          await rm.context.close();

          const sourceMismatch=allErrors.filter(e=>e.text.includes('Logo R3.4.1 source mismatch'));
          assert(sourceMismatch.length===0,'Logo R3.4.1 source mismatch '+JSON.stringify(sourceMismatch));
          assert(allErrors.length===0,'console/page errors '+JSON.stringify(allErrors));
          console.log('CONSOLE_ERRORS=0');
          console.log('INTEGRATION_QA=PASS');
          await browser.close();
          JS
          CHROME="$CHROME" node /tmp/qa/run.mjs
