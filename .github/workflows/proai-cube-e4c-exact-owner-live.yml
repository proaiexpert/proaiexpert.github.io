name: PROAI Cube E4C Exact Owner Live Publication
on:
  push:
    branches:
      - agent/proai-cube-r443-semantic-staging-review
    paths:
      - .github/workflows/proai-cube-e4c-exact-owner-live.yml
permissions:
  contents: write
jobs:
  exact-owner-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      PRODUCT_SHA: e4c032cd2e6e521fe5c18109a2992523c650c059
      PRODUCT_DIR: /tmp/proai-e4c-exact-publish
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      FORENSIC_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact refs
        run: |
          set -euo pipefail
          git fetch origin agent/proai-cube-r443-closed-phrase-architecture agent/proai-cube-semantic-brand-face-r4 main --depth=1
          test "$(git rev-parse origin/agent/proai-cube-r443-closed-phrase-architecture)" = "$PRODUCT_SHA"
          test "$(git rev-parse origin/agent/proai-cube-semantic-brand-face-r4)" = "$FORENSIC_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          test "$(git -C "$PRODUCT_DIR" rev-parse HEAD)" = "$PRODUCT_SHA"
      - name: Build exact E4C and syntax smoke
        run: |
          set -euo pipefail
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false
          npm run build-r443 | tee /tmp/e4c-publish-build.log
          node --check main.generated.js
          grep -Fq "architecture:'SEMANTIC_CAPABLE_AUTHORED_SAFE_STATE_GRAPH'" main.generated.js
          grep -Fq 'firstSemanticDelayMs:1600' main.generated.js
          grep -Fq 'maxReadableHoldMs:1600' main.generated.js
          grep -Fq 'semanticVelocityMultiplier: 1.0' main.generated.js
          grep -Fq 'overlayTextRendered:false' main.generated.js
          grep -Fq 'alphaDominantReveal:false' main.generated.js
          grep -Fq 'semanticMotionCoupled:false' main.generated.js
          grep -Fq 'semanticOrientationForcing:false' main.generated.js
          ! grep -Fq 'MASTER_WORD' main.generated.js
          ! grep -Fq 'emissiveIntensity' main.generated.js
          grep -Fq 'coreArchetypeCount: 15' /tmp/e4c-publish-build.log
          grep -Fq 'macroStateCount: 14' /tmp/e4c-publish-build.log
          grep -Fq 'semanticCapableStateCount: 10' /tmp/e4c-publish-build.log
      - name: Local static HTTP and asset smoke
        run: |
          set -euo pipefail
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          nohup python3 -m http.server 4180 --bind 127.0.0.1 --directory dist >/tmp/e4c-publish-http.log 2>&1 &
          echo $! >/tmp/e4c-publish-http.pid
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:4180/ >/tmp/e4c-local-index.html 2>/dev/null; then break; fi
            sleep 1
            test "$i" -lt 30
          done
          CSS=$(sed -n 's/.*href="\([^"]*\.css\)".*/\1/p' /tmp/e4c-local-index.html | head -1)
          JS=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' /tmp/e4c-local-index.html | head -1)
          test -n "$CSS"; test -n "$JS"
          curl -fsS --max-time 10 "http://127.0.0.1:4180$CSS" -o /tmp/e4c-local.css
          curl -fsS --max-time 10 "http://127.0.0.1:4180$JS" -o /tmp/e4c-local.js
          test -s /tmp/e4c-local.css; test -s /tmp/e4c-local.js
          GLB=$(grep -Eo 'rubik_39_s_cube_animation-[A-Za-z0-9_-]+\.glb' /tmp/e4c-local.js | head -1)
          test -n "$GLB"
          curl -fsS --max-time 10 "http://127.0.0.1:4180/assets/$GLB" -o /tmp/e4c-local.glb
          test "$(wc -c </tmp/e4c-local.glb | tr -d ' ')" -eq 279412
          echo "BUILD=PASS"
          echo "STATIC_HTTP=PASS"
          echo "JS=PASS"
          echo "GLB=PASS"
          echo "HEADLESS_SEMANTIC_TIMING_USED_AS_GATE=NO"
      - name: Publish exact E4C and expose owner URL
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 90 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          LOG=/tmp/e4c-cloudflare.log
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4180 >"$LOG" 2>&1 &
          echo $! >/tmp/e4c-tunnel.pid
          REVIEW_URL=''
          for i in $(seq 1 45); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
            if [ -n "$URL" ] && curl -fsSL --max-time 10 "$URL/" >/tmp/e4c-public-index.html 2>/dev/null; then
              REVIEW_URL="$URL"
              break
            fi
            sleep 1
          done
          test -n "$REVIEW_URL"
          CSS=$(sed -n 's/.*href="\([^"]*\.css\)".*/\1/p' /tmp/e4c-public-index.html | head -1)
          JS=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' /tmp/e4c-public-index.html | head -1)
          test -n "$CSS"; test -n "$JS"
          curl -fsSL --max-time 15 "$REVIEW_URL$CSS" -o /tmp/e4c-public.css
          curl -fsSL --max-time 15 "$REVIEW_URL$JS" -o /tmp/e4c-public.js
          test -s /tmp/e4c-public.css; test -s /tmp/e4c-public.js
          GLB=$(grep -Eo 'rubik_39_s_cube_animation-[A-Za-z0-9_-]+\.glb' /tmp/e4c-public.js | head -1)
          test -n "$GLB"
          curl -fsSL --max-time 15 "$REVIEW_URL/assets/$GLB" -o /tmp/e4c-public.glb
          test "$(wc -c </tmp/e4c-public.glb | tr -d ' ')" -eq 279412
          printf '%s\n' "$REVIEW_URL" >/tmp/e4c-live-url.txt
          echo "live_url=$REVIEW_URL" >> "$GITHUB_OUTPUT"
          BODY="PROAI CUBE E4C — EXACT OWNER LIVE READY\n\nExact product: $PRODUCT_SHA\nLIVE_OWNER_URL=$REVIEW_URL\nEXPECTED_LIFETIME=approximately 2 hours\nPUBLIC STATIC CHECK: HTTP PASS / HTML PASS / CSS PASS / JS PASS / GLB PASS\nHEADLESS SEMANTIC TIMING GATE: NO\nNO PRODUCT CHANGE / ATTEMPT 2 UNUSED"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$BODY" >/tmp/e4c-comment.json
          echo "EXACT_PRODUCT_SHA=$PRODUCT_SHA"
          echo "PUBLIC_STATIC_CHECK=HTTP_PASS HTML_PASS CSS_PASS JS_PASS GLB_PASS"
          echo "LIVE_OWNER_URL=$REVIEW_URL"
          echo "EXPECTED_LIFETIME=approximately 2 hours"
          echo "HEADLESS_SEMANTIC_TIMING_USED_AS_GATE=NO"
      - name: Keep owner review alive
        run: |
          set -euo pipefail
          REVIEW_URL='${{ steps.publish.outputs.live_url }}'
          test -n "$REVIEW_URL"
          for i in $(seq 1 240); do
            curl -fsSL --max-time 10 "$REVIEW_URL/" >/dev/null || true
            sleep 30
          done
