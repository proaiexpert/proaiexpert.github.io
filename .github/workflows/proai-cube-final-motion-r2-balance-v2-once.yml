name: ProAI Cube Final Motion R2 Balance V2 Once

on:
  push:
    branches:
      - agent/proai-cube-final-motion-r2
    paths:
      - '.github/workflows/proai-cube-final-motion-r2-balance-v2-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-final-motion-r2
          fetch-depth: 0
      - name: Balance adaptive event classes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/proai-hero-cube-r1/source-final-motion-r2.js')
          s = p.read_text(encoding='utf-8')
          old = '''function eventStarvationBoost(kind, recentEvents) {
            const index = recentEvents.indexOf(kind);
            const gap = index < 0 ? recentEvents.length + 1 : index;
            if (gap >= 4) return kind === 'pair' ? 5.5 : 4.6;
            if (gap >= 3) return kind === 'pair' ? 3.2 : 2.8;
            if (gap >= 2) return 1.65;
            return 1;
          }'''.replace('          ', '')
          new = '''function eventStarvationBoost(kind, recentEvents) {
            const index = recentEvents.indexOf(kind);
            const gap = index < 0 ? recentEvents.length + 1 : index;
            if (gap >= 4) return 3.6;
            if (gap >= 3) return 2.4;
            if (gap >= 2) return 1.5;
            if (gap === 1) return 0.92;
            return 0.68;
          }'''.replace('          ', '')
          old_single = "single: base.single * (0.95 + 0.40 * speed) * (recentMoves.at(-1) === 'single' ? 0.88 : 1),"
          new_single = "single: base.single * (0.95 + 0.40 * speed) * (recentMoves.at(-1) === 'single' ? 0.88 : 1) * eventStarvationBoost('single', recentEvents),"
          if old not in s:
              raise SystemExit('starvation function target missing')
          if old_single not in s:
              raise SystemExit('single weight target missing')
          s = s.replace(old, new, 1).replace(old_single, new_single, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "ProAI Motion Builder"
          git config user.email "proai.expert2026@gmail.com"
          git rm -- .github/workflows/proai-cube-final-motion-r2-balance-v2-once.yml
          git add -- assets/js/proai-hero-cube-r1/source-final-motion-r2.js
          git diff --cached --check
          git commit -m "fix: balance final motion R2 event classes"
          git push origin HEAD:agent/proai-cube-final-motion-r2
