name: ProAI Cube Final Motion R2 Owner Review

on:
  push:
    branches:
      - review/proai-hero-final-motion-r2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proai-cube-final-motion-r2-owner-review
  cancel-in-progress: true

jobs:
  owner-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/proai-hero-final-motion-r2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated static review server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/proai-r2-server.log 2>&1 &
          echo $! > /tmp/proai-r2-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/docs/site-evolution/reviews/proai-hero-final-motion-r2/review.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proai-r2-server.log
          exit 1

      - name: Capture desktop mobile and diagnostics
        id: capture
        continue-on-error: true
        run: node docs/site-evolution/reviews/proai-hero-final-motion-r2/capture.mjs

      - name: Convert review videos and derive evidence stills
        if: always()
        run: |
          set -euo pipefail
          OUT=docs/site-evolution/reviews/proai-hero-final-motion-r2/media
          echo "Evidence files after capture:"
          find "$OUT" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          test -f "$OUT/desktop.webm"
          test -f "$OUT/mobile.webm"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          normalize_video() {
            src="$1"
            dst="$2"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$src")"
            if awk -v d="$duration" 'BEGIN {exit !(d > 29.0)}'; then
              ffmpeg -y -sseof -28 -i "$src" -t 28 -an -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart "$dst"
            else
              ffmpeg -y -i "$src" -an -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart "$dst"
            fi
          }
          still() {
            src="$1"
            at="$2"
            dst="$3"
            ffmpeg -y -ss "$at" -i "$src" -frames:v 1 -an "$dst"
          }
          normalize_video "$OUT/desktop.webm" "$OUT/desktop-final-motion-r2.mp4"
          normalize_video "$OUT/mobile.webm" "$OUT/mobile-final-motion-r2.mp4"
          still "$OUT/desktop-final-motion-r2.mp4" 4 "$OUT/desktop-01.png"
          still "$OUT/desktop-final-motion-r2.mp4" 9 "$OUT/desktop-02.png"
          still "$OUT/desktop-final-motion-r2.mp4" 15 "$OUT/desktop-03-interaction-resume.png"
          still "$OUT/desktop-final-motion-r2.mp4" 23 "$OUT/desktop-04.png"
          still "$OUT/mobile-final-motion-r2.mp4" 4 "$OUT/mobile-01.png"
          still "$OUT/mobile-final-motion-r2.mp4" 9 "$OUT/mobile-02.png"
          still "$OUT/mobile-final-motion-r2.mp4" 15 "$OUT/mobile-03-interaction-resume.png"
          still "$OUT/mobile-final-motion-r2.mp4" 23 "$OUT/mobile-04.png"
          rm -f "$OUT/desktop.webm" "$OUT/mobile.webm"
          rm -rf "$OUT/_video-desktop" "$OUT/_video-mobile"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT/desktop-final-motion-r2.mp4" > "$OUT/desktop-duration.txt"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT/mobile-final-motion-r2.mp4" > "$OUT/mobile-duration.txt"

      - name: Verify evidence inventory
        if: always()
        run: |
          set -euo pipefail
          OUT=docs/site-evolution/reviews/proai-hero-final-motion-r2/media
          test -s "$OUT/motion-audit.json"
          test -s "$OUT/MOTION_DIAGNOSTIC_SUMMARY.md"
          test -s "$OUT/desktop-final-motion-r2.mp4"
          test -s "$OUT/mobile-final-motion-r2.mp4"
          test "$(find "$OUT" -maxdepth 1 -name 'desktop-*.png' | wc -l)" -ge 4
          test "$(find "$OUT" -maxdepth 1 -name 'mobile-*.png' | wc -l)" -ge 4
          awk '($1+0)>=24 && ($1+0)<=30 {ok=1} END {exit !ok}' "$OUT/desktop-duration.txt"
          awk '($1+0)>=24 && ($1+0)<=30 {ok=1} END {exit !ok}' "$OUT/mobile-duration.txt"
          find "$OUT" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit owner-review evidence
        if: always()
        run: |
          set -euo pipefail
          OUT=docs/site-evolution/reviews/proai-hero-final-motion-r2/media
          git config user.name "ProAI Review Bot"
          git config user.email "proai.expert2026@gmail.com"
          git add -- \
            "$OUT/MOTION_DIAGNOSTIC_SUMMARY.md" \
            "$OUT/motion-audit.json" \
            "$OUT/desktop-final-motion-r2.mp4" \
            "$OUT/mobile-final-motion-r2.mp4" \
            "$OUT/desktop-duration.txt" \
            "$OUT/mobile-duration.txt" \
            "$OUT/desktop-01.png" \
            "$OUT/desktop-02.png" \
            "$OUT/desktop-03-interaction-resume.png" \
            "$OUT/desktop-04.png" \
            "$OUT/mobile-01.png" \
            "$OUT/mobile-02.png" \
            "$OUT/mobile-03-interaction-resume.png" \
            "$OUT/mobile-04.png"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "review: add final motion R2 owner evidence"
          git push origin HEAD:review/proai-hero-final-motion-r2

      - name: Enforce automated acceptance gate
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'docs/site-evolution/reviews/proai-hero-final-motion-r2/media/motion-audit.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({pass:report.pass,acceptance:report.acceptance,seeds:report.seeds}, null, 2));
          if (!report.pass) process.exit(2);
          NODE
