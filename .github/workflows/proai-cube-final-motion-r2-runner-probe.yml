name: ProAI Cube Final Motion R2 Runner Probe

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report runner availability
        run: |
          set -euo pipefail
          echo "runner=PASS"
          echo "sha=${GITHUB_SHA}"
          echo "run_id=${GITHUB_RUN_ID}"
