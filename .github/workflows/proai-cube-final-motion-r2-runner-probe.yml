name: ProAI Cube Final Motion R2 Runner Probe

on:
  push:
    branches:
      - review/proai-hero-final-motion-r2
    paths:
      - '.github/workflows/proai-cube-final-motion-r2-runner-probe.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record current owner workflow diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "diagnostic-revision=8"
          api_json="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode "branch=${REF_NAME}" \
            --data-urlencode "per_page=30" \
            "https://api.github.com/repos/${REPO}/actions/runs" \
            -o "$api_json"
          git clone --depth=1 --branch "${REF_NAME}" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" work
          cd work
          git config user.name "ProAI Review Bot"
          git config user.email "proai.expert2026@gmail.com"
          out="docs/site-evolution/reviews/proai-hero-final-motion-r2/ACTIONS_RUNS_DIAGNOSTIC.json"
          python3 - "$api_json" "$out" <<'PY'
          import json, sys
          src, dst = sys.argv[1:]
          data = json.load(open(src, encoding='utf-8'))
          runs=[]
          for r in data.get('workflow_runs', []):
              runs.append({k:r.get(k) for k in ['id','name','path','head_sha','event','status','conclusion','run_number','run_attempt','created_at','updated_at','html_url']})
          json.dump({'runs':runs}, open(dst,'w',encoding='utf-8'), indent=2)
          PY
          git add -- "$out"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: refresh final motion R2 workflow diagnostics"
          git push origin HEAD:"${REF_NAME}"
