name: ProAI Cube Final Motion R2 Runner Probe

on:
  push:
    branches:
      - review/proai-hero-final-motion-r2

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record runner and workflow diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api_json="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode "branch=${REF_NAME}" \
            --data-urlencode "per_page=50" \
            "https://api.github.com/repos/${REPO}/actions/runs" \
            -o "$api_json"

          work="$(mktemp -d)"
          cd "$work"
          git init
          git config user.name "ProAI Review Bot"
          git config user.email "proai.expert2026@gmail.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin "${REF_NAME}"
          git checkout -B "${REF_NAME}" FETCH_HEAD
          out="docs/site-evolution/reviews/proai-hero-final-motion-r2"
          mkdir -p "$out"
          printf 'runner=PASS\ntrigger_sha=%s\nrun_id=%s\n' "$SHA" "$GITHUB_RUN_ID" > "$out/RUNNER_PROBE.txt"
          python3 - "$api_json" "$out/ACTIONS_RUNS_DIAGNOSTIC.json" <<'PY'
          import json, sys
          src, dst = sys.argv[1:]
          data = json.load(open(src, encoding='utf-8'))
          runs = []
          for r in data.get('workflow_runs', []):
              runs.append({
                  'id': r.get('id'),
                  'name': r.get('name'),
                  'path': r.get('path'),
                  'head_sha': r.get('head_sha'),
                  'event': r.get('event'),
                  'status': r.get('status'),
                  'conclusion': r.get('conclusion'),
                  'run_number': r.get('run_number'),
                  'run_attempt': r.get('run_attempt'),
                  'created_at': r.get('created_at'),
                  'updated_at': r.get('updated_at'),
                  'html_url': r.get('html_url'),
              })
          json.dump({'branch': data.get('workflow_runs',[{}])[0].get('head_branch') if data.get('workflow_runs') else None, 'runs': runs}, open(dst,'w',encoding='utf-8'), indent=2)
          PY
          git add "$out/RUNNER_PROBE.txt" "$out/ACTIONS_RUNS_DIAGNOSTIC.json"
          git commit -m "ci: record final motion R2 workflow diagnostics"
          git push origin HEAD:"${REF_NAME}"
