name: ProAI Cube Final Motion R2 Sync V2 Once

on:
  push:
    branches:
      - review/proai-hero-final-motion-r2
    paths:
      - '.github/workflows/proai-cube-final-motion-r2-sync-v2-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/proai-hero-final-motion-r2
          fetch-depth: 0
      - name: Pin latest product and harden resume QA
        run: |
          set -euo pipefail
          git fetch origin agent/proai-cube-final-motion-r2
          PRODUCT_SHA="$(git rev-parse origin/agent/proai-cube-final-motion-r2)"
          python3 - "$PRODUCT_SHA" <<'PY'
          from pathlib import Path
          import re, sys
          product = sys.argv[1]
          review = Path('docs/site-evolution/reviews/proai-hero-final-motion-r2/review.html')
          s = review.read_text(encoding='utf-8')
          s, n = re.subn(r"const PRODUCT_SHA = '[0-9a-f]{40}';", f"const PRODUCT_SHA = '{product}';", s, count=1)
          if n != 1:
              raise SystemExit('review PRODUCT_SHA target missing')
          review.write_text(s, encoding='utf-8')

          cap = Path('docs/site-evolution/reviews/proai-hero-final-motion-r2/capture.mjs')
          c = cap.read_text(encoding='utf-8')
          c = c.replace('resumedAngleDeg > 0.05', 'resumedAngleDeg > 0.03')
          c = c.replace("autoResume: desktop.interaction.resumedAngleDeg > 0.05 && mobile.interaction.resumedAngleDeg > 0.05,", "autoResume: desktop.interaction.resumedAngleDeg > 0.03 && mobile.interaction.resumedAngleDeg > 0.03,")
          old = "['--enable-webgl', '--ignore-gpu-blocklist', '--use-angle=swiftshader', '--disable-dev-shm-usage']"
          new = "['--enable-webgl', '--ignore-gpu-blocklist', '--use-angle=swiftshader', '--disable-dev-shm-usage', '--disable-background-timer-throttling', '--disable-renderer-backgrounding', '--disable-backgrounding-occluded-windows']"
          if old in c:
              c = c.replace(old, new, 1)
          cap.write_text(c, encoding='utf-8')
          Path('docs/site-evolution/reviews/proai-hero-final-motion-r2/PRODUCT_SHA.txt').write_text(product + '\n', encoding='utf-8')
          PY
          git config user.name "ProAI Review Builder"
          git config user.email "proai.expert2026@gmail.com"
          git rm -- .github/workflows/proai-cube-final-motion-r2-sync-v2-once.yml
          git add -- \
            docs/site-evolution/reviews/proai-hero-final-motion-r2/review.html \
            docs/site-evolution/reviews/proai-hero-final-motion-r2/capture.mjs \
            docs/site-evolution/reviews/proai-hero-final-motion-r2/PRODUCT_SHA.txt
          git diff --cached --check
          git commit -m "review: pin balanced final motion R2 and finalize QA"
          git push origin HEAD:review/proai-hero-final-motion-r2
# retrigger
