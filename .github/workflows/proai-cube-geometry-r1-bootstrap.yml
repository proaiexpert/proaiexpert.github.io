name: ProAI Cube Geometry R1 Bootstrap

on:
  push:
    branches:
      - agent/proai-cube-geometry-r1
    paths:
      - '.github/workflows/proai-cube-geometry-r1-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-geometry-r1
          fetch-depth: 0

      - name: Materialize Geometry R1 prototype from frozen Motion R1
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          src = Path('docs/site-evolution/spline/proai-cube-motion-r1')
          dst = Path('docs/site-evolution/spline/proai-cube-geometry-r1')
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst)
          for generated in [dst / 'QA.json', dst / 'REPORT.md']:
              generated.unlink(missing_ok=True)
          if (dst / 'review').exists():
              shutil.rmtree(dst / 'review')
          (dst / 'review').mkdir(parents=True)

          main_path = dst / 'main.js'
          s = main_path.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              "import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';\n",
              "import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';\nimport { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';\n",
              'rounded box import',
          )

          replace_once(
              "const CHOREOGRAPHY = Object.freeze([...PRIMARY_PHRASE, ...RESOLUTION_PHRASE]);\n",
              "const CHOREOGRAPHY = Object.freeze([...PRIMARY_PHRASE, ...RESOLUTION_PHRASE]);\n\nconst GEOMETRY_R1 = Object.freeze({\n  faceOuterSize: 196.8,\n  faceThickness: 3.6,\n  faceCornerRadius: 10.6,\n  faceBevelSize: 2.35,\n  faceBevelThickness: 1.25,\n  faceBevelSegments: 4,\n  faceCurveSegments: 8,\n  coreSize: 198.0,\n  coreRadius: 9.2,\n  coreSegments: 5,\n});\n",
              'geometry config',
          )

          old_visual = """scene.add(new THREE.HemisphereLight(0xe8edf4, 0x11141a, 1.35));
const key = new THREE.DirectionalLight(0xffffff, 3.8);
key.position.set(5.4, 7.5, 6.2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xb8c0cc, 1.7);
fill.position.set(-5.8, 1.8, 3.1);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.25);
rim.position.set(1.8, 3.6, -6.5);
scene.add(rim);

const faceMaterial = new THREE.MeshStandardMaterial({
  color: 0x3b4049,
  metalness: 0.82,
  roughness: 0.235,
  envMapIntensity: 1.0,
});
const coreMaterial = new THREE.MeshStandardMaterial({
  color: 0x11141a,
  metalness: 0.56,
  roughness: 0.39,
  envMapIntensity: 0.72,
});
"""
          new_visual = """// Temporary neutral studio baseline for geometry inspection only.
scene.add(new THREE.HemisphereLight(0xdce3ec, 0x090b0f, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 4.45);
key.position.set(6.4, 8.2, 5.2);
scene.add(key);
const fill = new THREE.DirectionalLight(0xaeb9c8, 1.35);
fill.position.set(-5.6, 2.4, 3.8);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 2.35);
rim.position.set(-2.8, 4.8, -6.8);
scene.add(rim);

const faceMaterial = new THREE.MeshStandardMaterial({
  color: 0x424851,
  metalness: 0.72,
  roughness: 0.295,
  envMapIntensity: 0.95,
});
const coreMaterial = new THREE.MeshStandardMaterial({
  color: 0x090c11,
  metalness: 0.34,
  roughness: 0.46,
  envMapIntensity: 0.58,
});
"""
          replace_once(old_visual, new_visual, 'temporary visual baseline')

          replace_once(
              "let turnSerial = 0;\n",
              "let turnSerial = 0;\nlet geometryStats = null;\n",
              'geometry stats state',
          )
          replace_once(
              "  motionConfig: MOTION,\n",
              "  motionConfig: MOTION,\n  geometryConfig: GEOMETRY_R1,\n  geometry: null,\n",
              'api geometry state',
          )

          anchor = """function classifyReviewMaterial(mesh) {
  if (!mesh.geometry) return faceMaterial;
  mesh.geometry.computeBoundingBox();
  const size = new THREE.Vector3();
  mesh.geometry.boundingBox?.getSize(size);
  const dimensions = [Math.abs(size.x), Math.abs(size.y), Math.abs(size.z)].sort((a, b) => a - b);
  return dimensions[0] < dimensions[2] * 0.12 ? faceMaterial : coreMaterial;
}
"""
          addition = anchor + r'''
function roundedRectShape(width, height, radius) {
  const w = width * 0.5;
  const h = height * 0.5;
  const r = Math.min(radius, w - 0.001, h - 0.001);
  const shape = new THREE.Shape();
  shape.moveTo(-w + r, -h);
  shape.lineTo(w - r, -h);
  shape.quadraticCurveTo(w, -h, w, -h + r);
  shape.lineTo(w, h - r);
  shape.quadraticCurveTo(w, h, w - r, h);
  shape.lineTo(-w + r, h);
  shape.quadraticCurveTo(-w, h, -w, h - r);
  shape.lineTo(-w, -h + r);
  shape.quadraticCurveTo(-w, -h, -w + r, -h);
  return shape;
}

function sourceGeometryMetrics(geometry) {
  geometry.computeBoundingBox();
  const box = geometry.boundingBox.clone();
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const abs = [Math.abs(size.x), Math.abs(size.y), Math.abs(size.z)];
  const thinAxis = abs.indexOf(Math.min(...abs));
  return { box, size, center, thinAxis };
}

function buildPrecisionFaceGeometry(sourceGeometry) {
  const source = sourceGeometryMetrics(sourceGeometry);
  if (source.thinAxis !== 2) {
    throw new Error(`Geometry R1 expected face source thin axis Z; got ${source.thinAxis}`);
  }
  const shape = roundedRectShape(180, 180, GEOMETRY_R1.faceCornerRadius);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.9,
    steps: 1,
    curveSegments: GEOMETRY_R1.faceCurveSegments,
    bevelEnabled: true,
    bevelThickness: GEOMETRY_R1.faceBevelThickness,
    bevelSize: GEOMETRY_R1.faceBevelSize,
    bevelSegments: GEOMETRY_R1.faceBevelSegments,
  });
  geometry.computeBoundingBox();
  let box = geometry.boundingBox.clone();
  let center = box.getCenter(new THREE.Vector3());
  geometry.translate(-center.x, -center.y, -box.max.z);
  geometry.computeBoundingBox();
  box = geometry.boundingBox.clone();
  const size = box.getSize(new THREE.Vector3());
  geometry.scale(
    GEOMETRY_R1.faceOuterSize / size.x,
    GEOMETRY_R1.faceOuterSize / size.y,
    GEOMETRY_R1.faceThickness / size.z,
  );
  // Keep the visible front plane at the exact baked GLB plane; all added thickness is recessed inward.
  geometry.translate(source.center.x, source.center.y, source.center.z);
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
  return geometry;
}

function buildPrecisionCoreGeometry(sourceGeometry) {
  const source = sourceGeometryMetrics(sourceGeometry);
  const geometry = new RoundedBoxGeometry(
    GEOMETRY_R1.coreSize,
    GEOMETRY_R1.coreSize,
    GEOMETRY_R1.coreSize,
    GEOMETRY_R1.coreSegments,
    GEOMETRY_R1.coreRadius,
  );
  geometry.translate(source.center.x, source.center.y, source.center.z);
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
  return geometry;
}

function enhanceRenderGeometry() {
  const cache = new Map();
  const stats = {
    faceMeshes: 0,
    coreMeshes: 0,
    nonPlaneMeshes: 0,
    uniqueEnhancedGeometries: 0,
    faceSourceSizes: [],
    coreSourceSizes: [],
  };

  cubeRoot.traverse((object) => {
    if (!object.isMesh || object.name === 'Plane' || !object.geometry) return;
    stats.nonPlaneMeshes += 1;
    const sourceGeometry = object.geometry;
    const source = sourceGeometryMetrics(sourceGeometry);
    const dims = [Math.abs(source.size.x), Math.abs(source.size.y), Math.abs(source.size.z)].sort((a, b) => a - b);
    const isFace = dims[0] < dims[2] * 0.12;
    const kind = isFace ? 'face' : 'core';
    const cacheKey = `${kind}:${sourceGeometry.uuid}`;
    if (!cache.has(cacheKey)) {
      cache.set(cacheKey, isFace ? buildPrecisionFaceGeometry(sourceGeometry) : buildPrecisionCoreGeometry(sourceGeometry));
      const rounded = source.size.toArray().map((value) => Math.round(value * 1000) / 1000);
      if (isFace) stats.faceSourceSizes.push(rounded);
      else stats.coreSourceSizes.push(rounded);
    }
    object.geometry = cache.get(cacheKey);
    if (isFace) stats.faceMeshes += 1;
    else stats.coreMeshes += 1;
  });

  stats.uniqueEnhancedGeometries = cache.size;
  const pitches = {};
  for (const axis of AXES) {
    const centers = latticeCenters[axis];
    pitches[axis] = ((centers[1] - centers[0]) + (centers[2] - centers[1])) * 0.5;
  }
  const minPitch = Math.min(...Object.values(pitches));
  const maxPitch = Math.max(...Object.values(pitches));
  stats.latticePitches = pitches;
  stats.faceGapRange = {
    min: minPitch - GEOMETRY_R1.faceOuterSize,
    max: maxPitch - GEOMETRY_R1.faceOuterSize,
  };
  stats.coreGapRange = {
    min: minPitch - GEOMETRY_R1.coreSize,
    max: maxPitch - GEOMETRY_R1.coreSize,
  };
  stats.faceOutwardProtrusion = 0;
  stats.pass = stats.faceMeshes === 180
    && stats.coreMeshes === 30
    && stats.nonPlaneMeshes === 210
    && stats.faceGapRange.min > 3
    && stats.coreGapRange.min > 2
    && stats.faceOutwardProtrusion === 0;
  return stats;
}
'''
          replace_once(anchor, addition, 'geometry enhancement functions')

          replace_once(
              "    canonicalError: api.ready ? canonicalTransformError() : null,\n",
              "    canonicalError: api.ready ? canonicalTransformError() : null,\n    geometry: api.geometry,\n    geometryConfig: GEOMETRY_R1,\n",
              'diagnostics geometry',
          )

          old_loader = """    cubeRoot.traverse((object) => {
      if (object.name === 'Plane' || object.isLight) object.visible = false;
      if (object.isMesh && object.name !== 'Plane') {
        object.material = classifyReviewMaterial(object);
        object.castShadow = false;
        object.receiveShadow = false;
      }
    });

    api.hierarchy = hierarchyCheck();
    if (!api.hierarchy.pass) throw new Error('Named right/center/left hierarchy verification failed');
    prepareMechanicalModel();
    frameCamera();
"""
          new_loader = """    cubeRoot.traverse((object) => {
      if (object.name === 'Plane' || object.isLight) object.visible = false;
    });

    api.hierarchy = hierarchyCheck();
    if (!api.hierarchy.pass) throw new Error('Named right/center/left hierarchy verification failed');
    // Freeze Motion R1 logical transforms first; render-geometry replacement happens only after the mechanical model is captured.
    prepareMechanicalModel();
    geometryStats = enhanceRenderGeometry();
    api.geometry = geometryStats;
    if (!geometryStats.pass) throw new Error(`Geometry R1 structural gate failed: ${JSON.stringify(geometryStats)}`);
    cubeRoot.traverse((object) => {
      if (object.isMesh && object.name !== 'Plane') {
        object.material = classifyReviewMaterial(object);
        object.castShadow = false;
        object.receiveShadow = false;
      }
    });
    frameCamera();
"""
          replace_once(old_loader, new_loader, 'loader geometry order')
          replace_once(
              "    status.textContent = 'Three.js GLB loaded. Motion R1 generalized slice engine ready.';\n",
              "    status.textContent = 'Three.js GLB loaded. Motion R1 frozen. Geometry R1 precision mesh ready.';\n",
              'status',
          )
          main_path.write_text(s)

          capture_path = dst / 'capture.mjs'
          c = capture_path.read_text()
          def creplace(old, new, label):
              global c
              if old not in c:
                  raise SystemExit(f'missing capture patch anchor: {label}')
              c = c.replace(old, new, 1)

          creplace("const URL = process.env.PROAI_R1_URL || 'http://127.0.0.1:4173/?capture=1';", "const URL = process.env.PROAI_GEOMETRY_R1_URL || 'http://127.0.0.1:4173/?capture=1';", 'url')
          creplace("const VIDEO_PATH = path.join(REVIEW, 'proai-cube-motion-r1-review-18s.webm');\nconst NATURAL_PATH = path.join(REVIEW, 'proai-cube-motion-r1-natural.png');\nconst PHRASE_PATH = path.join(REVIEW, 'proai-cube-motion-r1-multi-axis.png');", "const VIDEO_PATH = path.join(REVIEW, 'proai-cube-geometry-r1-review-14s.webm');\nconst NATURAL_PATH = path.join(REVIEW, 'proai-cube-geometry-r1-natural.png');\nconst EDGE_PATH = path.join(REVIEW, 'proai-cube-geometry-r1-edge-close.png');\nconst SLICE_PATH = path.join(REVIEW, 'proai-cube-geometry-r1-slice-turn.png');", 'review paths')
          creplace("async function openR1Page(viewport) {", "async function openR1Page(viewport) {", 'open page marker')
          creplace("const mechanicalQA = await qaPage.evaluate(() => window.__PROAI_CUBE_R1.runAutomatedQA());", "const mechanicalQA = await qaPage.evaluate(() => window.__PROAI_CUBE_R1.runAutomatedQA());\nconst geometryDiagnostics = initialDiagnostics.geometry;\nconst frozenMotion = initialDiagnostics.motionConfig;\nconst expectedMotion = {\n  turnDurationRangeMs: [1210, 1490],\n  calmHoldRangeMs: [980, 2400],\n  phraseBreathRangeMs: [520, 680],\n  easing: [0.36, 0, 0.12, 1],\n  orbitDampingFactor: 0.074,\n  orbitRotateSpeed: 0.5,\n  orbitZoomSpeed: 0.48,\n  manualResumeDelayMs: 1850,\n  manualResumeBlendMs: 2400,\n  bodyDrift: { yawDeg: 3.8, pitchDeg: 2.15, rollDeg: 0.65, yawPeriodMs: 12800, pitchPeriodMs: 15200, rollPeriodMs: 10600 },\n};\nconst motionConfigFrozen = JSON.stringify(frozenMotion) === JSON.stringify(expectedMotion);", 'geometry and frozen motion qa')

          old_screens = """const screenshotPage = await openR1Page(SCREENSHOT_VIEWPORT);
await screenshotPage.evaluate(() => window.__PROAI_CUBE_R1.setReviewPresentation(1.6, 1));
await screenshotPage.screenshot({ path: NATURAL_PATH, fullPage: true });
await screenshotPage.evaluate(() => {
  const api = window.__PROAI_CUBE_R1;
  api.beginReviewTurn('X', 1, 1);
  api.setReviewTurnProgress(1);
  api.beginReviewTurn('Y', 0, -1);
  api.setReviewTurnProgress(1);
  api.beginReviewTurn('Z', 1, 1);
  api.setReviewPresentation(5.7, 1);
  api.setReviewTurnProgress(0.56);
});
await screenshotPage.screenshot({ path: PHRASE_PATH, fullPage: true });
await screenshotPage.close();
"""
          new_screens = """const screenshotPage = await openR1Page(SCREENSHOT_VIEWPORT);
await screenshotPage.evaluate(() => window.__PROAI_CUBE_R1.setReviewPresentation(1.6, 1));
await screenshotPage.screenshot({ path: NATURAL_PATH, fullPage: true });

const canvasBoxForClose = await screenshotPage.locator('#cube-canvas').boundingBox();
if (!canvasBoxForClose) throw new Error('Cube canvas box unavailable for close geometry screenshot');
await screenshotPage.mouse.move(canvasBoxForClose.x + canvasBoxForClose.width * 0.5, canvasBoxForClose.y + canvasBoxForClose.height * 0.5);
await screenshotPage.mouse.wheel(0, -680);
for (let i = 0; i < 28; i += 1) await screenshotPage.evaluate(() => window.__PROAI_CUBE_R1.renderReviewFrame());
await screenshotPage.screenshot({ path: EDGE_PATH, fullPage: true });
await screenshotPage.close();

const slicePage = await openR1Page(SCREENSHOT_VIEWPORT);
await slicePage.evaluate(() => {
  const api = window.__PROAI_CUBE_R1;
  api.setReviewPresentation(4.8, 1);
  api.beginReviewTurn('X', 1, 1);
  api.setReviewTurnProgress(0.53);
});
await slicePage.screenshot({ path: SLICE_PATH, fullPage: true });
await slicePage.close();
"""
          creplace(old_screens, new_screens, 'three screenshots')

          start = c.index("await addHold('calm-3q-body-drift'")
          end = c.index("await videoPage.close();", start)
          new_sequence = """await addHold('calm-3q-body-drift', 1.55);\nawait addTurn('primary-x1', 'X', 1, 1, 1.38);\nawait addHold('primary-x1-hold', 1.48);\nawait addTurn('primary-y0', 'Y', 0, -1, 1.32);\nawait addHold('phrase-breath', 0.56);\nawait addTurn('primary-z1', 'Z', 1, 1, 1.24);\nawait addHold('primary-z1-long-settle', 2.05);\nawait addTurn('primary-x-minus1', 'X', -1, -1, 1.49);\nawait addHold('primary-x-minus1-hold', 1.26);\nawait addTurn('primary-z0', 'Z', 0, -1, 1.36);\nawait addHold('closing-breath', 0.80);\n\n"""
          c = c[:start] + new_sequence + c[end:]

          creplace("const videoPass = videoDurationSec != null && videoDurationSec >= 15 && videoDurationSec <= 20.5 && frameBuffers.length >= 360 && videoBytes > 150000;", "const videoPass = videoDurationSec != null && videoDurationSec >= 10 && videoDurationSec <= 15.5 && frameBuffers.length >= 240 && videoBytes > 150000;\nconst geometryPass = Boolean(geometryDiagnostics?.pass)\n  && geometryDiagnostics.faceGapRange.min > 3\n  && geometryDiagnostics.coreGapRange.min > 2\n  && geometryDiagnostics.faceOutwardProtrusion === 0;", 'video and geometry gates')

          qstart = c.index('const qa = {')
          qend = c.index('const overallPass =', qstart)
          new_qa = r'''const qa = {
  generatedAt: new Date().toISOString(),
  source: {
    motionBaselineBranch: 'agent/proai-cube-motion-r1',
    motionBaselineCommit: '023e0aa9d20292a13c04d9061f98f49a6c380e05',
    geometryBranch: 'agent/proai-cube-geometry-r1',
    prototypePath: 'docs/site-evolution/spline/proai-cube-geometry-r1/',
    glbBytes: fs.statSync(GLB_PATH).size,
    glbSha256: sha256(GLB_PATH),
  },
  initialDiagnostics,
  geometry: geometryDiagnostics,
  motionFreeze: {
    expected: expectedMotion,
    actual: frozenMotion,
    pass: motionConfigFrozen,
  },
  mechanicalQA,
  interactionQA: {
    interactionBefore,
    interactionDuringStart,
    interactionDuringEnd,
    interactionAfterEnd,
    cameraBeforePresentationBlend,
    interactionAfterResume,
    cameraMoved,
    presentationStayedFrozen,
    cameraStayedAfterResume,
    maxResumeQuaternionStepRad,
    pass: interactionPass,
  },
  video: {
    path: 'review/proai-cube-geometry-r1-review-14s.webm',
    fps: FPS,
    frameCount: frameBuffers.length,
    expectedDurationSec,
    durationSec: videoDurationSec,
    byteLength: videoBytes,
    segments,
    coverage: {
      calm3q: true,
      xAxisTurn: true,
      yAxisTurn: true,
      zAxisTurn: true,
      longSettle: true,
      mixedState: true,
      slowBodyDrift: true,
    },
  },
  runtime: {
    totalRequests: requests.length,
    forbiddenRequests,
    splineDependency: forbiddenRequests.length === 0 ? 'NONE' : 'FOUND',
    pageErrors,
    consoleErrors,
  },
  acceptance: {
    geometryStructure: geometryPass ? 'PASS' : 'FAIL',
    motionR1Frozen: motionConfigFrozen ? 'PASS' : 'FAIL',
    X: axisPass.X ? 'PASS' : 'FAIL',
    Y: axisPass.Y ? 'PASS' : 'FAIL',
    Z: axisPass.Z ? 'PASS' : 'FAIL',
    layerSupport: layerPass ? 'PASS' : 'FAIL',
    repeatability30: mechanicalQA.repeatability30.pass ? 'PASS' : 'FAIL',
    inverseRestoration: mechanicalQA.inverseRestoration.pass ? 'PASS' : 'FAIL',
    orbitAutonomousInteraction: interactionPass ? 'PASS' : 'FAIL',
    videoCoverage: videoPass ? 'PASS' : 'FAIL',
    runtime: runtimePass ? 'PASS' : 'FAIL',
    splineDependency: forbiddenRequests.length === 0 ? 'NONE' : 'FOUND',
  },
};

'''
          c = c[:qstart] + new_qa + c[qend:]
          creplace("const overallPass = axisPass.X && axisPass.Y && axisPass.Z\n  && layerPass", "const overallPass = geometryPass\n  && motionConfigFrozen\n  && axisPass.X && axisPass.Y && axisPass.Z\n  && layerPass", 'overall gate')

          rstart = c.index("const m = initialDiagnostics.motionConfig;")
          rend = c.index("console.log(JSON.stringify({", rstart)
          new_report = r'''const g = initialDiagnostics.geometryConfig;
const report = `# ProAI Rubik Cube — Geometry R1\n\n## Scope\n\nGeometry-only pass built from frozen Motion R1 commit \`023e0aa9d20292a13c04d9061f98f49a6c380e05\`. X/Y/Z mechanics, logical state, choreography timing, body drift and OrbitControls behavior are preserved. No final materials, final lighting, semantic display, Hero integration, merge or deploy.\n\n## Geometry decision\n\nThe baked GLB hierarchy and transforms remain authoritative. The original render geometry was visually too flat/subtle for a premium object, so Geometry R1 replaces only local mesh BufferGeometry while keeping the exact mesh nodes and cubie transforms. Face meshes remain children of their original cubie parents; no leaf flattening/reparenting is introduced.\n\n## Chosen geometry\n\n- Face outer size: **${g.faceOuterSize}**.\n- Face corner radius: **${g.faceCornerRadius}**.\n- Face recessed thickness: **${g.faceThickness}**.\n- Face bevel: size **${g.faceBevelSize}**, thickness **${g.faceBevelThickness}**, **${g.faceBevelSegments}** segments.\n- Core size: **${g.coreSize}**.\n- Core radius: **${g.coreRadius}**, **${g.coreSegments}** segments.\n- Face gap range from frozen lattice: **${geometryDiagnostics.faceGapRange.min.toFixed(3)}–${geometryDiagnostics.faceGapRange.max.toFixed(3)}**.\n- Core seam range: **${geometryDiagnostics.coreGapRange.min.toFixed(3)}–${geometryDiagnostics.coreGapRange.max.toFixed(3)}**.\n- Added face thickness is recessed inward; outward protrusion into gaps: **${geometryDiagnostics.faceOutwardProtrusion}**.\n\n## Temporary visual baseline\n\nNeutral graphite MeshStandardMaterial plus simple key/fill/rim studio lights are used only to reveal bevel, gaps and silhouette. This is not the Materials / Lighting phase.\n\n## QA\n\n- Geometry structural gate: **${qa.acceptance.geometryStructure}**.\n- Motion R1 config frozen: **${qa.acceptance.motionR1Frozen}**.\n- X / Y / Z: **${qa.acceptance.X} / ${qa.acceptance.Y} / ${qa.acceptance.Z}**.\n- 30 mixed turns: **${qa.acceptance.repeatability30}**; max position error ${mechanicalQA.repeatability30.maxCanonicalPosition}; quaternion ${mechanicalQA.repeatability30.maxCanonicalQuaternionRad}; scale ${mechanicalQA.repeatability30.maxCanonicalScale}.\n- Exact inverse restoration: **${qa.acceptance.inverseRestoration}**.\n- Orbit/autonomous interaction: **${qa.acceptance.orbitAutonomousInteraction}**.\n- Runtime/browser: **${qa.acceptance.runtime}**; Spline dependency **${qa.acceptance.splineDependency}**.\n- Review video: **${videoDurationSec?.toFixed(2)} s @ ${FPS} fps**, ${frameBuffers.length} frames; **${qa.acceptance.videoCoverage}**.\n\n## Review evidence\n\n- \`review/proai-cube-geometry-r1-natural.png\`\n- \`review/proai-cube-geometry-r1-edge-close.png\`\n- \`review/proai-cube-geometry-r1-slice-turn.png\`\n- \`review/proai-cube-geometry-r1-review-14s.webm\`\n- \`QA.json\`\n\n## Gate\n\nAutomated geometry/mechanical/runtime gates: **${overallPass ? 'PASS' : 'FAIL'}**. Visual geometry quality still requires direct screenshot/video QC before owner handoff. Materials / Lighting must not start before owner review.\n`;
fs.writeFileSync(REPORT_PATH, report);

'''
          c = c[:rstart] + new_report + c[rend:]
          creplace("  overall: overallPass ? 'PASS' : 'FAIL',", "  overall: overallPass ? 'PASS' : 'FAIL',\n  geometry: geometryPass,\n  motionR1Frozen: motionConfigFrozen,", 'console geometry')
          capture_path.write_text(c)

          package_path = dst / 'package.json'
          p = package_path.read_text().replace('proai-cube-motion-r1', 'proai-cube-geometry-r1')
          package_path.write_text(p)
