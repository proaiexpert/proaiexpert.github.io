name: ProAI Cube Geometry R1 Bootstrap

on:
  push:
    branches:
      - agent/proai-cube-geometry-r1
    paths:
      - '.github/workflows/proai-cube-geometry-r1-bootstrap.yml'
      - '.github/scripts/proai-cube-geometry-r1-bootstrap.py'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-geometry-r1
          fetch-depth: 0

      - name: Materialize Geometry R1 prototype
        run: python .github/scripts/proai-cube-geometry-r1-bootstrap.py

      - name: Validate syntax
        run: |
          node --check docs/site-evolution/spline/proai-cube-geometry-r1/main.js
          node --check docs/site-evolution/spline/proai-cube-geometry-r1/capture.mjs

      - name: Commit clean Geometry R1 prototype
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/proai-cube-geometry-r1-bootstrap.yml
          git rm .github/scripts/proai-cube-geometry-r1-bootstrap.py
          git add docs/site-evolution/spline/proai-cube-geometry-r1/
          git commit -m 'feat: build ProAI cube Geometry R1 prototype'
          git push origin HEAD:agent/proai-cube-geometry-r1
