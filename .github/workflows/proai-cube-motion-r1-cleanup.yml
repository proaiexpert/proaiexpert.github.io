name: ProAI Cube Motion R1 Cleanup

on:
  push:
    branches:
      - agent/proai-cube-motion-r1
    paths:
      - '.github/workflows/proai-cube-motion-r1-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-motion-r1
          fetch-depth: 0

      - name: Remove generated dependency/build output
        run: |
          ROOT='docs/site-evolution/spline/proai-cube-motion-r1'
          git rm -r --ignore-unmatch "$ROOT/node_modules" "$ROOT/dist"
          cat > "$ROOT/.gitignore" <<'EOF'
          node_modules/
          dist/
          package-lock.json
          EOF
          git add "$ROOT/.gitignore"
          git rm .github/workflows/proai-cube-motion-r1-cleanup.yml

      - name: Commit clean Motion R1 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove Motion R1 generated build dependencies'
          git push origin HEAD:agent/proai-cube-motion-r1
