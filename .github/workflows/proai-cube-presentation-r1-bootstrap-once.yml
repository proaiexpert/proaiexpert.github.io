name: ProAI Cube Presentation Motion R1.1 Bootstrap Once

on:
  push:
    branches:
      - agent/proai-cube-presentation-motion-r1
    paths:
      - '.github/workflows/proai-cube-presentation-r1-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-presentation-motion-r1
          fetch-depth: 0

      - name: Materialize isolated Presentation Motion R1.1 prototype
        run: |
          set -euo pipefail
          python3 .github/tmp/proai-cube-presentation-r1-bootstrap.py
          node --check docs/site-evolution/spline/proai-cube-presentation-motion-r1/main.js
          test -f docs/site-evolution/spline/proai-cube-presentation-motion-r1/rubik_39_s_cube_animation.glb

      - name: Commit prototype and remove bootstrap transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-presentation-motion-r1
          git rm .github/workflows/proai-cube-presentation-r1-bootstrap-once.yml .github/tmp/proai-cube-presentation-r1-bootstrap.py
          git commit -m 'feat: add ProAI cube Presentation Motion R1.1 prototype'
          git push origin HEAD:agent/proai-cube-presentation-motion-r1
