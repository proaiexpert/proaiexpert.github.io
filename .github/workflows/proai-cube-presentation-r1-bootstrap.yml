# Rerun: direct DOM canvas rects avoid Playwright actionability waits.
name: ProAI Cube Presentation Motion R1.1 Bootstrap

on:
  push:
    branches: [agent/proai-cube-presentation-motion-r1]
    paths: ['.github/workflows/proai-cube-presentation-r1-bootstrap.yml']
permissions:
  contents: write
env:
  DIR: docs/site-evolution/spline/proai-cube-presentation-motion-r1
  SRC: docs/site-evolution/spline/proai-cube-geometry-r1
jobs:
  build-qa-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-presentation-motion-r1
          fetch-depth: 0
      - name: Materialize from exact Geometry R1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 73082717909b6f4225841401fe4962d6ff4bbcca)" = "73082717909b6f4225841401fe4962d6ff4bbcca"
          python3 .github/tmp/proai-cube-presentation-r1-bootstrap.py
          cat .github/tmp/proai-cube-presentation-r1-capture.part.00.mjs .github/tmp/proai-cube-presentation-r1-capture.part.01.mjs .github/tmp/proai-cube-presentation-r1-capture.part.02.mjs > "$DIR/capture.mjs"
          python3 .github/tmp/proai-cube-presentation-r1-capture-patch.py
          node --check "$DIR/main.js"
          node --check "$DIR/capture.mjs"
      - name: Prove Geometry R1 and visual baseline frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('docs/site-evolution/spline/proai-cube-geometry-r1/main.js').read_text()
          dst=Path('docs/site-evolution/spline/proai-cube-presentation-motion-r1/main.js').read_text()
          pairs=[
            ('const GEOMETRY_R1 = Object.freeze({','const renderer = new THREE.WebGLRenderer({'),
            ('// Temporary neutral studio baseline for geometry inspection only.','let cubeRoot;'),
            ('function roundedRectShape(width, height, radius) {','function findCubieParents() {'),
          ]
          for a,b in pairs:
            if src[src.index(a):src.index(b)] != dst[dst.index(a):dst.index(b)]: raise SystemExit('freeze mismatch '+a)
          drift="return new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, yaw, roll, 'XYZ'));"
          if drift not in dst: raise SystemExit('micro-drift XYZ freeze mismatch')
          print('Geometry/material/light + micro-drift freeze: PASS')
          PY
          cmp "$SRC/rubik_39_s_cube_animation.glb" "$DIR/rubik_39_s_cube_animation.glb"
          ! grep -niE '@splinetool|prod\.spline\.design|\.splinecode' "$DIR/main.js" "$DIR/index.html" "$DIR/styles.css" "$DIR/package.json"
      - name: Install dependencies and ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd "$DIR"
          npm install --package-lock=false
          npx playwright install chromium
      - name: Build isolated prototype
        run: cd "$DIR" && npm run build
      - name: Start isolated Vite server
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIR"
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/proai-presentation-vite.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/proai-presentation-vite.log; exit 1
      - name: Browser startup diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIR"
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
          const p=await b.newPage({viewport:{width:900,height:1040}});
          p.on('pageerror',e=>console.log('PAGEERROR',String(e)));
          p.on('console',m=>{if(m.type()==='error')console.log('CONSOLE',m.text())});
          await p.goto('http://127.0.0.1:4173/?capture=1',{waitUntil:'networkidle',timeout:60000});
          await p.waitForFunction(()=>window.__PROAI_CUBE_R1?.ready===true,null,{timeout:90000});
          console.log('STARTUP_STATE',JSON.stringify(await p.evaluate(()=>window.__PROAI_CUBE_R1.getDiagnostics())));
          await b.close();
          NODE
      - name: Mechanical presentation interaction QA and owner review capture
        env:
          PROAI_GEOMETRY_CODE_FROZEN: '1'
          PROAI_PRESENTATION_R1_URL: http://127.0.0.1:4173/?capture=1
        run: cd "$DIR" && npm run capture
      - name: Upload owner review artifact
        uses: actions/upload-artifact@v4
        with:
          name: proai-cube-presentation-motion-r1-owner-review
          path: |
            ${{ env.DIR }}/QA.json
            ${{ env.DIR }}/REPORT.md
            ${{ env.DIR }}/review/*.png
            ${{ env.DIR }}/review/*.mp4
            ${{ env.DIR }}/review/*.webm
          if-no-files-found: error
          retention-days: 7
      - name: Commit evidence and remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR"
          git rm .github/workflows/proai-cube-presentation-r1-bootstrap.yml
          git rm .github/tmp/proai-cube-presentation-r1-*
          git commit -m 'feat: add ProAI cube Presentation Motion R1.1'
          git push origin HEAD:agent/proai-cube-presentation-motion-r1
