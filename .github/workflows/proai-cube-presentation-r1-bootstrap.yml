name: ProAI Cube Presentation Motion R1.1 Bootstrap

on:
  push:
    branches:
      - agent/proai-cube-presentation-motion-r1
    paths:
      - '.github/workflows/proai-cube-presentation-r1-bootstrap.yml'

permissions:
  contents: write

env:
  DIR: docs/site-evolution/spline/proai-cube-presentation-motion-r1
  SRC: docs/site-evolution/spline/proai-cube-geometry-r1

jobs:
  build-qa-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-presentation-motion-r1
          fetch-depth: 0

      - name: Materialize Presentation Motion R1.1 from exact Geometry R1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 73082717909b6f4225841401fe4962d6ff4bbcca)" = "73082717909b6f4225841401fe4962d6ff4bbcca"
          mkdir -p /tmp/proai-presentation
          base64 -d .github/tmp/proai-cube-presentation-r1-payload.b64 | tar -xzf - -C /tmp/proai-presentation
          python3 /tmp/proai-presentation/presentation_bootstrap.py
          cp /tmp/proai-presentation/presentation_capture.mjs "$DIR/capture.mjs"
          node --check "$DIR/main.js"
          node --check "$DIR/capture.mjs"

      - name: Prove Geometry R1 code and visual baseline are frozen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('docs/site-evolution/spline/proai-cube-geometry-r1/main.js').read_text()
          dst = Path('docs/site-evolution/spline/proai-cube-presentation-motion-r1/main.js').read_text()
          pairs = [
              ('const GEOMETRY_R1 = Object.freeze({', 'const renderer = new THREE.WebGLRenderer({'),
              ('// Temporary neutral studio baseline for geometry inspection only.', 'let cubeRoot;'),
              ('function roundedRectShape(width, height, radius) {', 'function findCubieParents() {'),
          ]
          for start, end in pairs:
              a = src[src.index(start):src.index(end)]
              b = dst[dst.index(start):dst.index(end)]
              if a != b:
                  raise SystemExit(f'Geometry/material/light freeze mismatch at {start}')
          print('Geometry R1 + temporary material/light code freeze: PASS')
          PY
          cmp "$SRC/rubik_39_s_cube_animation.glb" "$DIR/rubik_39_s_cube_animation.glb"
          ! grep -niE '@splinetool|prod\.spline\.design|\.splinecode' "$DIR/main.js" "$DIR/index.html" "$DIR/styles.css" "$DIR/package.json"

      - name: Install dependencies and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd "$DIR"
          npm install --package-lock=false
          npx playwright install chromium

      - name: Build isolated prototype
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIR"
          npm run build

      - name: Start isolated Vite server
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIR"
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/proai-presentation-vite.log 2>&1 &
          echo $! >/tmp/proai-presentation-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proai-presentation-vite.log
          exit 1

      - name: Mechanical presentation interaction QA and owner review capture
        shell: bash
        env:
          PROAI_GEOMETRY_CODE_FROZEN: '1'
          PROAI_PRESENTATION_R1_URL: http://127.0.0.1:4173/?capture=1
        run: |
          set -euo pipefail
          cd "$DIR"
          npm run capture

      - name: Upload owner review artifact
        uses: actions/upload-artifact@v4
        with:
          name: proai-cube-presentation-motion-r1-owner-review
          path: |
            ${{ env.DIR }}/QA.json
            ${{ env.DIR }}/REPORT.md
            ${{ env.DIR }}/review/*.png
            ${{ env.DIR }}/review/*.mp4
            ${{ env.DIR }}/review/*.webm
          if-no-files-found: error
          retention-days: 7

      - name: Commit Presentation Motion R1.1 evidence and remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR"
          git rm .github/workflows/proai-cube-presentation-r1-bootstrap.yml
          git rm .github/tmp/proai-cube-presentation-r1-payload.b64
          git commit -m 'feat: add ProAI cube Presentation Motion R1.1'
          git push origin HEAD:agent/proai-cube-presentation-motion-r1
