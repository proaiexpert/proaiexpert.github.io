name: ProAI Cube R0 Deterministic API Patch

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-det-api-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0
      - name: Patch capture-only deterministic pose API
        run: |
          echo '' | base64 -d > /tmp/patch-r0-det-api.py
          python /tmp/patch-r0-det-api.py
          node --check docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js
          git rm .github/workflows/proai-cube-r0-det-api-patch.yml
          git rm -f .github/workflows/proai-cube-r0-deterministic-api.yml || true
          git commit -m 'test: add deterministic R0 review pose API'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
