name: ProAI Cube R0 Deterministic Review API Patch

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-deterministic-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0

      - name: Add capture-only deterministic pose API
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js')
          s = p.read_text()

          old_state = "let lastEndpointErrorRad = null;"
          new_state = "let lastEndpointErrorRad = null;\nlet reviewCameraBase = null;"
          if old_state not in s:
              raise SystemExit('state anchor not found')
          s = s.replace(old_state, new_state, 1)

          old_api = "  getDiagnostics,\n  captureFrame() {"
          new_api = "  getDiagnostics,\n  setReviewSliceProgress,\n  setReviewResetProgress,\n  setReviewOrbitProgress,\n  captureFrame() {"
          if old_api not in s:
              raise SystemExit('api anchor not found')
          s = s.replace(old_api, new_api, 1)

          anchor = "function directChildSignature(group) {"
          if anchor not in s:
              raise SystemExit('function insertion anchor not found')

          helpers = r'''
function setReviewSliceProgress(linear = 0, direction = 1) {
  if (!captureMode || !api.ready) return false;
  const progress = THREE.MathUtils.clamp(linear, 0, 1);
  if (progress <= 0 && !slicePivot) {
    setMotionState('rest');
    renderer.render(scene, camera);
    return { linear: progress, eased: 0, angleRad: 0 };
  }
  createSlicePivot();
  const eased = cubicBezierEase(progress);
  const angleRad = direction * Math.PI / 2 * eased;
  slicePivot.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), angleRad);
  slicePivot.updateMatrixWorld(true);
  setMotionState(progress >= 1 ? 'turned' : 'turning');
  renderer.render(scene, camera);
  return { linear: progress, eased, angleRad };
}

function setReviewResetProgress(linear = 0, direction = 1) {
  if (!captureMode || !api.ready) return false;
  const progress = THREE.MathUtils.clamp(linear, 0, 1);
  if (!slicePivot) {
    createSlicePivot();
    slicePivot.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), direction * Math.PI / 2);
  }
  const eased = cubicBezierEase(progress);
  const angleRad = direction * Math.PI / 2 * (1 - eased);
  slicePivot.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), angleRad);
  slicePivot.updateMatrixWorld(true);
  if (progress >= 1) {
    slicePivot.quaternion.identity();
    destroySlicePivotAndRestoreExact();
    setMotionState('rest');
  } else {
    setMotionState('resetting');
  }
  renderer.render(scene, camera);
  return { linear: progress, eased, angleRad };
}

function setReviewOrbitProgress(linear = 0) {
  if (!captureMode || !api.ready) return false;
  if (!reviewCameraBase) {
    reviewCameraBase = {
      target: controls.target.clone(),
      spherical: new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target)),
    };
  }
  const progress = THREE.MathUtils.clamp(linear, 0, 1);
  const eased = progress * progress * (3 - 2 * progress);
  const spherical = reviewCameraBase.spherical.clone();
  spherical.theta -= 0.20 * eased;
  spherical.phi = THREE.MathUtils.clamp(spherical.phi + 0.055 * eased, 0.08, Math.PI - 0.08);
  const offset = new THREE.Vector3().setFromSpherical(spherical);
  controls.enabled = false;
  controls.target.copy(reviewCameraBase.target);
  camera.position.copy(reviewCameraBase.target).add(offset);
  camera.lookAt(reviewCameraBase.target);
  camera.updateMatrixWorld(true);
  renderer.render(scene, camera);
  return { linear: progress, eased };
}

'''
          s = s.replace(anchor, helpers + anchor, 1)
          p.write_text(s)
          PY
          node --check docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js

      - name: Commit patch and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js
          git rm .github/workflows/proai-cube-r0-deterministic-api.yml
          git commit -m 'test: add deterministic R0 review pose API'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
