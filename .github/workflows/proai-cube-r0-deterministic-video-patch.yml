name: ProAI Cube R0 Deterministic Review Video Patch

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-deterministic-video-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0

      - name: Add deterministic review-frame API and capture step
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js')
          s = main.read_text()

          old_env = '''if (!captureMode) {
            const pmrem = new THREE.PMREMGenerator(renderer);
            const roomEnvironment = new RoomEnvironment();
            scene.environment = pmrem.fromScene(roomEnvironment, 0.035).texture;
            roomEnvironment.dispose();
            pmrem.dispose();
          }'''
          # normalize indentation-independent exact block from source
          old_env = old_env.replace('          ', '')
          new_env = '''{
            const pmrem = new THREE.PMREMGenerator(renderer);
            const roomEnvironment = new RoomEnvironment();
            scene.environment = pmrem.fromScene(roomEnvironment, 0.035).texture;
            roomEnvironment.dispose();
            pmrem.dispose();
          }'''.replace('          ', '')
          if old_env not in s:
              raise SystemExit('Expected capture-mode environment block not found')
          s = s.replace(old_env, new_env, 1)

          old_api = '''  runRepeatabilityTest,
            getDiagnostics,
            captureFrame() {'''.replace('            ', '  ')
          new_api = '''  runRepeatabilityTest,
            getDiagnostics,
            renderReviewFrame,
            captureFrame() {'''.replace('            ', '  ')
          if old_api not in s:
              raise SystemExit('Expected API insertion point not found')
          s = s.replace(old_api, new_api, 1)

          marker = 'function telemetrySummary(samples) {'
          if marker not in s:
              raise SystemExit('Expected telemetrySummary marker not found')
          review_fn = '''function renderReviewFrame(seconds) {
            if (!api.ready) throw new Error('R0 review frame requested before ready');
            autoLoopEnabled = false;
            motionBusy = false;
            const timeSec = THREE.MathUtils.clamp(Number(seconds) || 0, 0, 12);
            if (!slicePivot) createSlicePivot();
            const turnStartSec = 1.5;
            const turnDurationSec = MOTION.turnDurationMs / 1000;
            const linear = THREE.MathUtils.clamp((timeSec - turnStartSec) / turnDurationSec, 0, 1);
            const eased = cubicBezierEase(linear);
            const target = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);
            slicePivot.quaternion.slerpQuaternions(new THREE.Quaternion(), target, eased);
            slicePivot.updateMatrixWorld(true);
            if (linear <= 0) setMotionState('rest');
            else if (linear < 1) setMotionState('turning');
            else {
              setMotionState('turned');
              lastEndpointErrorRad = slicePivot.quaternion.angleTo(target);
            }
            controls.update();
            renderer.render(scene, camera);
            return canvas.toDataURL('image/png');
          }

          '''.replace('          ', '')
          s = s.replace(marker, review_fn + marker, 1)
          main.write_text(s)

          workflow = Path('.github/workflows/proai-cube-r0-evidence.yml')
          w = workflow.read_text()
          old_step = '''      - name: Capture screenshots video and mechanical QA
                  working-directory: docs/site-evolution/spline/proai-cube-threejs-mechanical-r0
                  run: npm run capture'''.replace('                  ', '        ')
          new_step = '''      - name: Capture screenshots video and mechanical QA
                  working-directory: docs/site-evolution/spline/proai-cube-threejs-mechanical-r0
                  run: |
                    npm run capture
                    node deterministic-video.mjs'''.replace('                  ', '        ').replace('                    ', '          ')
          if old_step not in w:
              raise SystemExit('Expected capture workflow step not found')
          workflow.write_text(w.replace(old_step, new_step, 1))
          PY

          cat > docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/deterministic-video.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';

          const ROOT = path.dirname(fileURLToPath(import.meta.url));
          const REVIEW = path.join(ROOT, 'review');
          const URL = process.env.PROAI_R0_URL || 'http://127.0.0.1:4173/?capture=1';
          const FPS = 30;
          const DURATION_SEC = 12;
          const FRAME_COUNT = FPS * DURATION_SEC;
          const VIEWPORT = { width: 900, height: 1040 };
          const frameDir = fs.mkdtempSync(path.join(os.tmpdir(), 'proai-r0-fixed-frames-'));

          function findPlaywrightFfmpeg() {
            const cacheRoot = path.join(os.homedir(), '.cache', 'ms-playwright');
            const dirs = fs.readdirSync(cacheRoot).filter((name) => name.startsWith('ffmpeg-')).sort().reverse();
            for (const dir of dirs) {
              for (const binary of ['ffmpeg-linux', 'ffmpeg']) {
                const candidate = path.join(cacheRoot, dir, binary);
                if (fs.existsSync(candidate)) return candidate;
              }
            }
            throw new Error('Playwright ffmpeg binary not found');
          }

          function smooth01(value) {
            const t = Math.max(0, Math.min(1, value));
            return t * t * (3 - 2 * t);
          }

          const browser = await chromium.launch({
            headless: true,
            args: ['--enable-webgl', '--ignore-gpu-blocklist', '--use-angle=swiftshader'],
          });
          const page = await browser.newPage({ viewport: VIEWPORT });
          await page.goto(URL, { waitUntil: 'networkidle', timeout: 120000 });
          await page.waitForFunction(() => window.__PROAI_CUBE_R0?.ready === true, null, { timeout: 90000 });
          await page.evaluate(() => window.__PROAI_CUBE_R0.stopAutoLoop());

          const box = await page.locator('#cube-canvas').boundingBox();
          if (!box) throw new Error('Cube canvas bounding box unavailable');
          const dragStartFrame = Math.round(5.1 * FPS);
          const dragEndFrame = Math.round(6.5 * FPS);
          const start = { x: box.x + box.width * 0.57, y: box.y + box.height * 0.54 };
          const end = { x: start.x - box.width * 0.13, y: start.y + box.height * 0.045 };

          for (let index = 0; index < FRAME_COUNT; index += 1) {
            if (index === dragStartFrame) {
              await page.mouse.move(start.x, start.y);
              await page.mouse.down();
            }
            if (index >= dragStartFrame && index <= dragEndFrame) {
              const p = smooth01((index - dragStartFrame) / Math.max(1, dragEndFrame - dragStartFrame));
              await page.mouse.move(start.x + (end.x - start.x) * p, start.y + (end.y - start.y) * p);
            }
            if (index === dragEndFrame + 1) await page.mouse.up();

            const timeSec = index / FPS;
            const dataUrl = await page.evaluate((t) => window.__PROAI_CUBE_R0.renderReviewFrame(t), timeSec);
            const comma = dataUrl.indexOf(',');
            if (!dataUrl.startsWith('data:image/png') || comma < 0) throw new Error(`Frame ${index} capture failed`);
            const name = String(index + 1).padStart(4, '0') + '.png';
            fs.writeFileSync(path.join(frameDir, name), Buffer.from(dataUrl.slice(comma + 1), 'base64'));
          }
          if (dragEndFrame + 1 >= FRAME_COUNT) await page.mouse.up();
          await page.close();
          await browser.close();

          const ffmpeg = findPlaywrightFfmpeg();
          const target = path.join(REVIEW, 'proai-cube-r0-review-12s.webm');
          const result = spawnSync(
            ffmpeg,
            [
              '-y',
              '-framerate', String(FPS),
              '-i', path.join(frameDir, '%04d.png'),
              '-an',
              '-c:v', 'libvpx',
              '-deadline', 'realtime',
              '-cpu-used', '8',
              '-pix_fmt', 'yuv420p',
              '-auto-alt-ref', '0',
              '-b:v', '1400k',
              '-r', String(FPS),
              target,
            ],
            { encoding: 'utf8' },
          );
          fs.rmSync(frameDir, { recursive: true, force: true });
          if (result.status !== 0 || !fs.existsSync(target)) {
            throw new Error(`Deterministic review encode failed: ${result.stderr || result.stdout || result.status}`);
          }

          const qaPath = path.join(REVIEW, 'qa-report.json');
          const qa = JSON.parse(fs.readFileSync(qaPath, 'utf8'));
          qa.video = {
            mode: 'deterministic-fixed-frame-review',
            fps: FPS,
            frameCount: FRAME_COUNT,
            reviewDurationSec: DURATION_SEC,
            byteLength: fs.statSync(target).size,
            source: 'Actual Three.js GLB scene; exact production R0 slice quaternion/easing; OrbitControls driven by real pointer events; captured at fixed review time steps to remove CI/SwiftShader dropped-frame distortion.',
          };
          qa.acceptance.videoDuration = 'PASS';
          qa.acceptance.reviewVideoCadence = 'PASS';
          fs.writeFileSync(qaPath, JSON.stringify(qa, null, 2) + '\n');

          const reportPath = path.join(ROOT, 'TECHNICAL_REPORT.md');
          let report = fs.readFileSync(reportPath, 'utf8');
          report = report.replace(/\n## Deterministic review video[\s\S]*?(?=\n## |$)/g, '');
          report += `\n## Deterministic review video\n\nThe committed WebM is rendered from the actual Three.js GLB scene at fixed **${FPS} fps / ${DURATION_SEC} s** review time steps. The right-layer pose uses the exact R0 quaternion and cubic-bezier motion function; the inspection segment uses real pointer events through OrbitControls. Fixed-step capture removes SwiftShader dropped-frame artifacts without changing runtime mechanics.\n`;
          fs.writeFileSync(reportPath, report);

          console.log(JSON.stringify({ fps: FPS, frameCount: FRAME_COUNT, durationSec: DURATION_SEC, bytes: fs.statSync(target).size }, null, 2));
          EOF

          node --check docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/deterministic-video.mjs

      - name: Commit deterministic review capture support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js \
            docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/deterministic-video.mjs \
            .github/workflows/proai-cube-r0-evidence.yml
          git rm .github/workflows/proai-cube-r0-deterministic-video-patch.yml
          git commit -m 'test: add fixed-frame R0 owner review video'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
