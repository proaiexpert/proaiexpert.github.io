name: ProAI Cube R0 Targeted Hotfix

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0
      - name: Resolve common parent from actual right hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js')
          s = p.read_text()
          old = "    sceneOne = cubeRoot.getObjectByName('Scene 1') || cubeRoot;"
          new = "    sceneOne = cubeRoot.getObjectByName('right')?.parent || cubeRoot.getObjectByName('Scene 1') || cubeRoot;"
          if old not in s:
              raise SystemExit('Expected sceneOne assignment not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js
          git commit -m 'fix: derive cube scene parent from GLB hierarchy'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
