name: ProAI Cube R0 Targeted Hotfix

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0
      - name: Canonicalize GLTFLoader duplicate-name suffixes for hierarchy QA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js')
          s = p.read_text()
          old = '''function directChildSignature(group) {
  return group.children.map((child) => child.name).filter(Boolean).sort();
}'''
          new = '''function directChildSignature(group) {
  return group.children
    .map((child) => child.name?.replace(/_\\d+$/, ''))
    .filter(Boolean)
    .sort();
}'''
          if old not in s:
              raise SystemExit('Expected directChildSignature function not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/main.js
          git commit -m 'fix: normalize GLTFLoader duplicate names in hierarchy QA'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
