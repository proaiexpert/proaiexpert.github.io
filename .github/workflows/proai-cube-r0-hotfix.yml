name: ProAI Cube R0 Final Capture Hotfix

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0
      - name: Drop alpha for Playwright VP8 normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs')
          s = p.read_text()
          old = "      '-b:v', '1200k',\n      targetVideo,"
          new = "      '-pix_fmt', 'yuv420p',\n      '-auto-alt-ref', '0',\n      '-b:v', '1200k',\n      targetVideo,"
          if old not in s:
              raise SystemExit('Expected VP8 encoder block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs
      - name: Commit final capture fix and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs
          git rm .github/workflows/proai-cube-r0-hotfix.yml
          git commit -m 'fix: finalize R0 VP8 review capture'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
