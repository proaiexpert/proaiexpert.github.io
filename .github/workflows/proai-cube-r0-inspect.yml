name: ProAI Cube R0 GLB Inspect

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - 'docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/inspect-glb-structure.mjs'
      - '.github/workflows/proai-cube-r0-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0
      - name: Inspect clean GLB hierarchy and transforms
        run: node docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/inspect-glb-structure.mjs
      - name: Commit inspection report
        run: |
          REPORT='docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/GLB_STRUCTURE_INSPECTION.json'
          if [ -z "$(git status --porcelain -- "$REPORT")" ]; then
            echo 'Inspection report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'test: record ProAI cube GLB structure'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
