name: ProAI Cube R0 QA Finalize

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-qa-finalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0

      - name: Patch two-pass WebM normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs')
          s = p.read_text()

          start = s.find('function retimeReviewVideo(rawVideo, targetVideo) {')
          end = s.find('\n\nconst telemetry', start)
          if start < 0 or end < 0:
              raise SystemExit('current retimeReviewVideo block not found')

          replacement = r'''function retimeReviewVideo(rawVideo, targetVideo, sourceWallClockDurationSec) {
  const ffmpegPath = findPlaywrightFfmpeg();
  const passOneVideo = `${targetVideo}.pass-one.webm`;

  const encode = (outputPath, timestampScale) => {
    const result = spawnSync(
      ffmpegPath,
      [
        '-y',
        '-itsscale', String(timestampScale),
        '-i', rawVideo,
        '-map', '0:v:0',
        '-an',
        '-c:v', 'libvpx',
        '-deadline', 'realtime',
        '-cpu-used', '8',
        '-pix_fmt', 'yuv420p',
        '-auto-alt-ref', '0',
        '-b:v', '1200k',
        outputPath,
      ],
      { encoding: 'utf8' },
    );
    if (result.status !== 0 || !fs.existsSync(outputPath)) {
      throw new Error(`Playwright ffmpeg VP8 retime failed: ${result.stderr || result.stdout || `exit ${result.status}`}`);
    }
  };

  const initialTimestampScale = TARGET_VIDEO_DURATION_SEC / sourceWallClockDurationSec;
  encode(passOneVideo, initialTimestampScale);
  const firstPassDurationSec = probeWebmDuration(ffmpegPath, passOneVideo);
  if (!firstPassDurationSec || firstPassDurationSec <= 0) {
    throw new Error('Unable to verify first-pass WebM duration');
  }

  const correction = TARGET_VIDEO_DURATION_SEC / firstPassDurationSec;
  const timestampScale = initialTimestampScale * correction;
  encode(targetVideo, timestampScale);
  const outputDurationSec = probeWebmDuration(ffmpegPath, targetVideo);
  fs.rmSync(passOneVideo, { force: true });
  if (outputDurationSec == null) throw new Error('Unable to verify retimed WebM duration');

  const sourceMediaDurationSec = firstPassDurationSec / initialTimestampScale;
  return {
    sourceMediaDurationSec,
    firstPassDurationSec,
    initialTimestampScale,
    correction,
    timestampScale,
    outputDurationSec,
  };
}'''

          s = s[:start] + replacement + s[end:]
          old_call = 'const retime = retimeReviewVideo(rawVideo, targetVideo);'
          new_call = 'const retime = retimeReviewVideo(rawVideo, targetVideo, sourceWallClockDurationSec);'
          if old_call not in s:
              raise SystemExit('retime call site not found')
          s = s.replace(old_call, new_call, 1)

          old_video_meta = '    sourceMediaDurationSec: retime.sourceMediaDurationSec,\n    reviewDurationSec: videoDurationSec,'
          new_video_meta = '    sourceMediaDurationSec: retime.sourceMediaDurationSec,\n    firstPassDurationSec: retime.firstPassDurationSec,\n    reviewDurationSec: videoDurationSec,'
          if old_video_meta in s:
              s = s.replace(old_video_meta, new_video_meta, 1)

          p.write_text(s)
          PY
          node --check docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs

      - name: Commit QA patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs
          git commit -m 'test: normalize R0 WebM evidence in two passes'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
