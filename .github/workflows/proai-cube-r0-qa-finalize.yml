name: ProAI Cube R0 QA Finalize

on:
  push:
    branches:
      - agent/proai-cube-threejs-mechanical-r0
    paths:
      - '.github/workflows/proai-cube-r0-qa-finalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-threejs-mechanical-r0
          fetch-depth: 0

      - name: Make capture QA frame-rate independent and video duration exact
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs')
          s = p.read_text()

          old_fn = re.search(r"function retimeReviewVideo\(rawVideo, targetVideo, sourceDurationSec\) \{.*?\n\}\n\nconst telemetry", s, re.S)
          if not old_fn:
              raise SystemExit('retimeReviewVideo block not found')

          new_fn = r'''function encodeRetimedVideo(ffmpegPath, rawVideo, targetVideo, timestampScale) {
  const result = spawnSync(
    ffmpegPath,
    [
      '-y',
      '-itsscale', String(timestampScale),
      '-i', rawVideo,
      '-map', '0:v:0',
      '-an',
      '-c:v', 'libvpx',
      '-deadline', 'realtime',
      '-cpu-used', '8',
      '-pix_fmt', 'yuv420p',
      '-auto-alt-ref', '0',
      '-b:v', '1200k',
      targetVideo,
    ],
    { encoding: 'utf8' },
  );
  if (result.status !== 0 || !fs.existsSync(targetVideo)) {
    throw new Error(`Playwright ffmpeg VP8 retime failed: ${result.stderr || result.stdout || `exit ${result.status}`}`);
  }
}

function retimeReviewVideo(rawVideo, targetVideo, sourceDurationSec) {
  const ffmpegPath = findPlaywrightFfmpeg();
  const passOneVideo = `${targetVideo}.pass-one.webm`;
  let timestampScale = TARGET_VIDEO_DURATION_SEC / sourceDurationSec;

  encodeRetimedVideo(ffmpegPath, rawVideo, passOneVideo, timestampScale);
  const firstPassDurationSec = probeWebmDuration(ffmpegPath, passOneVideo);
  if (firstPassDurationSec == null || firstPassDurationSec <= 0) {
    throw new Error('Unable to verify first-pass WebM duration');
  }

  timestampScale *= TARGET_VIDEO_DURATION_SEC / firstPassDurationSec;
  encodeRetimedVideo(ffmpegPath, rawVideo, targetVideo, timestampScale);
  const outputDurationSec = probeWebmDuration(ffmpegPath, targetVideo);
  fs.rmSync(passOneVideo, { force: true });
  if (outputDurationSec == null) throw new Error('Unable to verify retimed WebM duration');
  return { ffmpegPath, timestampScale, firstPassDurationSec, outputDurationSec };
}

function cubicBezierProgress(control, x) {
  const [x1, y1, x2, y2] = control;
  const cubic = (a, b, c, t) => 3 * a * (1 - t) ** 2 * t + 3 * b * (1 - t) * t ** 2 + c * t ** 3;
  let low = 0;
  let high = 1;
  let t = x;
  for (let i = 0; i < 28; i += 1) {
    t = (low + high) / 2;
    if (cubic(x1, x2, 1, t) < x) low = t;
    else high = t;
  }
  return cubic(y1, y2, 1, t);
}

function deterministicMotionCurve(config, sampleCount = 240) {
  const angles = [];
  for (let i = 0; i <= sampleCount; i += 1) {
    angles.push((Math.PI / 2) * cubicBezierProgress(config.easing, i / sampleCount));
  }
  const steps = angles.slice(1).map((value, index) => value - angles[index]);
  const monotonic = steps.every((step) => step >= -1e-12);
  const overshoot = angles.some((angle) => angle < -1e-12 || angle > Math.PI / 2 + 1e-12);
  const firstStepRad = Math.abs(steps[0]);
  const lastStepRad = Math.abs(steps.at(-1));
  const maxAbsStepRad = Math.max(...steps.map(Math.abs));
  return {
    sampleCount,
    monotonic,
    overshoot,
    firstStepRad,
    lastStepRad,
    maxAbsStepRad,
    endpointErrorRad: Math.abs(angles.at(-1) - Math.PI / 2),
  };
}

const telemetry'''
          s = s[:old_fn.start()] + new_fn + s[old_fn.end():]

          old_gate = r'''const motionTelemetryPass =
  Boolean(forward) &&
  forward.monotonic === true &&
  forward.overshoot === false &&
  Math.abs(turnedDiagnostics.endpointErrorRad ?? 999) < 1e-8 &&
  (forward.firstStepRad ?? 1) < 0.02 &&
  (forward.lastStepRad ?? 1) < 0.03;'''
          new_gate = r'''const deterministicCurve = deterministicMotionCurve(initialDiagnostics.motionConfig);
const motionTelemetryPass =
  Boolean(forward) &&
  forward.monotonic === true &&
  forward.overshoot === false &&
  deterministicCurve.monotonic === true &&
  deterministicCurve.overshoot === false &&
  deterministicCurve.endpointErrorRad < 1e-12 &&
  deterministicCurve.firstStepRad < 0.001 &&
  deterministicCurve.lastStepRad < 0.001 &&
  deterministicCurve.maxAbsStepRad < 0.025 &&
  Math.abs(turnedDiagnostics.endpointErrorRad ?? 999) < 1e-8;'''
          if old_gate not in s:
              raise SystemExit('motion telemetry gate not found')
          s = s.replace(old_gate, new_gate, 1)

          old_repeat = "  repeatability,\n  video: {"
          new_repeat = "  repeatability,\n  deterministicMotionCurve: deterministicCurve,\n  video: {"
          if old_repeat not in s:
              raise SystemExit('qa insertion point not found')
          s = s.replace(old_repeat, new_repeat, 1)

          old_video = "    timestampScale: retime.timestampScale,\n    byteLength: targetVideoBytes,"
          new_video = "    timestampScale: retime.timestampScale,\n    firstPassDurationSec: retime.firstPassDurationSec,\n    byteLength: targetVideoBytes,"
          if old_video not in s:
              raise SystemExit('video metadata insertion point not found')
          s = s.replace(old_video, new_video, 1)

          old_report = "`- Forward telemetry: ${JSON.stringify(forward)}.\\n` +\n`- Frame-rate-independent boundary gate: first step ${forward?.firstStepRad}, last step ${forward?.lastStepRad}, monotonic ${forward?.monotonic}, overshoot ${forward?.overshoot}.\\n` +"
          new_report = "`- Browser frame telemetry: ${JSON.stringify(forward)}.\\n` +\n`- Deterministic easing gate (240 samples, independent of CI FPS): ${JSON.stringify(deterministicCurve)}.\\nn` +"
          if old_report not in s:
              raise SystemExit('report motion block not found')
          s = s.replace(old_report, new_report, 1)

          old_ci = "`- CI source capture ran ${sourceVideoDurationSec.toFixed(2)} s under SwiftShader; timestamps were normalized by factor ${retime.timestampScale.toFixed(4)} and re-encoded as VP8 to restore a 10–15 s review clip while preserving rendered frame order.\\n\\n` +"
          new_ci = "`- CI source capture ran ${sourceVideoDurationSec.toFixed(2)} s under SwiftShader; first-pass encoded duration was ${retime.firstPassDurationSec.toFixed(2)} s, then timestamps were corrected by factor ${retime.timestampScale.toFixed(4)} and re-encoded as VP8 to restore a 10–15 s review clip while preserving rendered frame order.\\n\\n` +"
          if old_ci not in s:
              raise SystemExit('report video block not found')
          s = s.replace(old_ci, new_ci, 1)

          p.write_text(s)
          PY
          node --check docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs

      - name: Commit QA patch and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-threejs-mechanical-r0/capture.mjs
          git rm .github/workflows/proai-cube-r0-qa-finalize.yml
          git commit -m 'test: make R0 motion and video QA deterministic'
          git push origin HEAD:agent/proai-cube-threejs-mechanical-r0
