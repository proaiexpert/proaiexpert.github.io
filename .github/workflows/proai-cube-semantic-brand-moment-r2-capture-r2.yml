name: ProAI Cube Semantic Brand Moment R2 Capture R2

on:
  push:
    branches:
      - agent/proai-cube-semantic-brand-moment-r2
    paths:
      - '.github/workflows/proai-cube-semantic-brand-moment-r2-capture-r2.yml'

concurrency:
  group: proai-cube-semantic-brand-moment-r2-capture-r2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify and optimize capture
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          python verify-freeze.py
          python optimize-capture.py
          node --check main.js
          node --check capture.mjs
          cmp rubik_39_s_cube_animation.glb ../proai-cube-materials-lighting-r1/rubik_39_s_cube_animation.glb
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = 'dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b'

      - name: Verify production lock
        run: |
          set -euo pipefail
          if git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD -- index.html ru/index.html | grep -q .; then exit 1; fi

      - name: Install dependencies
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Prepare exact baseline fixture
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          python prepare-baseline.py
          node --check baseline-fixture/main.js

      - name: Start Vite
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/proai-r2-capture.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proai-r2-capture.log
          exit 1

      - name: Continuous 1080 owner capture
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        env:
          PROAI_SEMANTIC_R2_URL: http://127.0.0.1:4173/
          PROAI_BASELINE_URL: http://127.0.0.1:4173/baseline-fixture/
        run: timeout 22m npm run capture

      - name: Final evidence gate
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          test "$(node -e "const q=require('./QA.json');process.stdout.write(String(q.allPass))")" = true
          test "$(node -e "const q=require('./QA.json');process.stdout.write(String(q.evidence.video.spliceCount))")" = 0
          test "$(find review -maxdepth 1 -name '*.png' | wc -l)" -le 2
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,avg_frame_rate -of default=nw=1 review/proai-cube-semantic-brand-moment-r2-owner-review.mp4
          rm -rf baseline-fixture dist node_modules

      - name: Commit final isolated package
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R2"
          git rm -r .github/r2-bootstrap .github/workflows/proai-cube-semantic-brand-moment-r2.yml .github/workflows/proai-cube-semantic-brand-moment-r2-finalize.yml .github/workflows/proai-cube-semantic-brand-moment-r2-materialize.yml .github/workflows/proai-cube-semantic-brand-moment-r2-fast-capture.yml .github/workflows/proai-cube-semantic-brand-moment-r2-capture-r2.yml
          git commit -m 'feat: add ProAI Cube semantic brand moment R2'
          git fetch origin agent/proai-cube-semantic-brand-moment-r2
          git rebase origin/agent/proai-cube-semantic-brand-moment-r2
          git push origin HEAD:agent/proai-cube-semantic-brand-moment-r2
