name: ProAI Cube Semantic Brand Moment R2 Materialize

on:
  push:
    branches:
      - agent/proai-cube-semantic-brand-moment-r2
    paths:
      - '.github/workflows/proai-cube-semantic-brand-moment-r2-materialize.yml'

concurrency:
  group: proai-cube-semantic-brand-moment-r2-materialize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconstruct and commit R2 source
        run: |
          set -euo pipefail
          cat .github/r2-bootstrap/part1.txt .github/r2-bootstrap/part2.txt .github/r2-bootstrap/part3.txt .github/r2-bootstrap/part4.txt > /tmp/proai-r2.b64
          base64 -d /tmp/proai-r2.b64 > /tmp/proai-r2.zlib
          python - <<'PY'
          import zlib
          payload=zlib.decompress(open('/tmp/proai-r2.zlib','rb').read()).decode('utf-8')
          exec(compile(payload,'proai-semantic-brand-moment-r2-builder.py','exec'),{'__name__':'__main__'})
          PY
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          node --check "$R2/main.js"
          node --check "$R2/capture.mjs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R2"
          git commit -m 'chore: materialize Semantic Brand Moment R2 source'
          git push origin HEAD:agent/proai-cube-semantic-brand-moment-r2
