name: ProAI Cube Semantic Brand Moment R2

on:
  push:
    branches:
      - agent/proai-cube-semantic-brand-moment-r2
    paths:
      - '.github/r2-bootstrap/**'
      - '.github/workflows/proai-cube-semantic-brand-moment-r2.yml'

concurrency:
  group: proai-cube-semantic-brand-moment-r2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  semantic-brand-moment-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct isolated R2 builder
        run: |
          set -euo pipefail
          cat .github/r2-bootstrap/part1.txt .github/r2-bootstrap/part2.txt .github/r2-bootstrap/part3.txt .github/r2-bootstrap/part4.txt > /tmp/proai-r2.b64
          base64 -d /tmp/proai-r2.b64 > /tmp/proai-r2.zlib
          python - <<'PY'
          import zlib
          payload = zlib.decompress(open('/tmp/proai-r2.zlib','rb').read()).decode('utf-8')
          exec(compile(payload, 'proai-semantic-brand-moment-r2-builder.py', 'exec'), {'__name__':'__main__'})
          PY

      - name: Adapt evidence capture to runner-safe 720p
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/capture.mjs')
          s = p.read_text()
          old_view = 'const VIEWPORT = { width: 1080, height: 1080 };'
          new_view = 'const VIEWPORT = { width: 720, height: 720 };'
          old_probe = '&& Number(stream.width) === 1080 && Number(stream.height) === 1080'
          new_probe = '&& Number(stream.width) === 720 && Number(stream.height) === 720'
          if old_view not in s or old_probe not in s:
            raise SystemExit('720p adaptation anchors missing')
          s = s.replace(old_view, new_view, 1).replace(old_probe, new_probe, 1)
          p.write_text(s)
          PY
          node --check docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/capture.mjs

      - name: Verify isolated scope, syntax, GLB and Spline absence
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          BASE='docs/site-evolution/spline/proai-cube-materials-lighting-r1'
          node --check "$R2/main.js"
          node --check "$R2/capture.mjs"
          cmp "$R2/rubik_39_s_cube_animation.glb" "$BASE/rubik_39_s_cube_animation.glb"
          test "$(sha256sum "$R2/rubik_39_s_cube_animation.glb" | awk '{print $1}')" = 'dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b'
          if grep -niE '@splinetool|prod\.spline\.design|\.splinecode' "$R2/main.js" "$R2/index.html" "$R2/package.json" "$R2/styles.css"; then
            echo 'Forbidden Spline runtime reference found'
            exit 1
          fi
          if git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD -- index.html ru/index.html | grep -q .; then
            echo 'Production root modified'
            exit 1
          fi

      - name: Prove frozen baseline blocks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          base = Path('docs/site-evolution/spline/proai-cube-materials-lighting-r1/main.js').read_text()
          cur = Path('docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/main.js').read_text()
          blocks = {
            'MOTION': r"const MOTION = Object\.freeze\(\{.*?\n\}\);",
            'PRESENTATION_R1_2': r"const PRESENTATION_R1_2 = Object\.freeze\(\{.*?\n\}\);",
            'SLICE_R1_2': r"const SLICE_R1_2 = Object\.freeze\(\{.*?\n\}\);",
            'GEOMETRY_R1': r"const GEOMETRY_R1 = Object\.freeze\(\{.*?\n\}\);",
            'LOOKDEV_R1': r"const LOOKDEV_R1 = Object\.freeze\(\{.*?\n\}\);",
            'studio_environment': r"function createPremiumStudioEnvironment\(pmrem\) \{.*?\n\}",
            'studio_lighting': r"function configureStudioLighting\(centerWorld, radius\) \{.*?\n\}",
            'material_classifier': r"function classifyReviewMaterial\(mesh\) \{.*?\n\}",
            'geometry_builders': r"function buildPrecisionFaceGeometry\(sourceGeometry\) \{.*?\nfunction enhanceRenderGeometry\(\)",
            'turn_math': r"function beginTurn\(axis = 'X'.*?\nfunction presentationAutonomyBlocked\(\)",
          }
          out = {'baseSha':'d17806da42275db617d8a46b231a2d877706a179','blocks':{},'intentionalDeltas':['semantic timeScale gate around unchanged presentation functions','semantic-only slice initiation block preserving scheduler wait state','single local semantic material/typography group']}
          for name, pat in blocks.items():
            bm = re.search(pat, base, re.S); cm = re.search(pat, cur, re.S)
            if not bm or not cm:
              raise SystemExit(f'freeze block missing: {name}')
            b, c = bm.group(0), cm.group(0)
            same = b == c
            out['blocks'][name] = {'same':same,'baselineSha256':hashlib.sha256(b.encode()).hexdigest(),'currentSha256':hashlib.sha256(c.encode()).hexdigest()}
            if not same:
              raise SystemExit(f'frozen block changed: {name}')
          out['pass'] = all(v['same'] for v in out['blocks'].values())
          Path('docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/BASELINE_FREEZE.json').write_text(json.dumps(out, indent=2)+'\n')
          print(json.dumps(out, indent=2))
          PY

      - name: Install R2 dependencies and build
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build

      - name: Install Chromium and ffmpeg
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Create exact Materials R1 baseline fixture
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          BASE='docs/site-evolution/spline/proai-cube-materials-lighting-r1'
          rm -rf "$R2/baseline-fixture"
          cp -a "$BASE" "$R2/baseline-fixture"
          rm -rf "$R2/baseline-fixture/review" "$R2/baseline-fixture/review-internal" "$R2/baseline-fixture/dist"
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/baseline-fixture/main.js')
          s = p.read_text()
          s = s.replace('  getDiagnostics,\n  getInteractionState,\n', '  getDiagnostics,\n  getBaselineComparableState,\n  getInteractionState,\n', 1)
          anchor = 'function getDiagnostics() {\n'
          fn = r'''function getBaselineComparableState() {
            scene.updateMatrixWorld(true);
            return {
              presentationRig: { position: presentationRig.position.toArray(), quaternion: presentationRig.quaternion.toArray(), scale: presentationRig.scale.toArray() },
              cubeRoot: { position: cubeRoot.position.toArray(), quaternion: cubeRoot.quaternion.toArray(), scale: cubeRoot.scale.toArray() },
              logical: snapshotLogicalState(),
              activeTurns: activeTurnList().map((turn) => ({ axis: turn.axis, layer: turn.layer, direction: turn.direction, linear: turn.linear, eased: turn.eased })),
              completedTurns: lastTurnResults.map((turn) => ({ axis: turn.axis, layer: turn.layer, direction: turn.direction })),
              scheduler: { enabled: sliceSchedulerEnabled, running: sliceSchedulerRunning, eventSerial: sliceEventSerial, eventsUntilBreath, seed: sliceSeed },
              camera: { position: camera.position.toArray(), quaternion: camera.quaternion.toArray(), target: controls.target.toArray() },
            };
          }

          '''
          if anchor not in s: raise SystemExit('baseline diagnostics anchor missing')
          s = s.replace(anchor, fn + anchor, 1)
          p.write_text(s)
          PY
          node --check "$R2/baseline-fixture/main.js"

      - name: Start isolated Vite server
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/proai-r2-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proai-r2-vite.log
          exit 1

      - name: Run continuous 720p owner capture and QA
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        env:
          PROAI_SEMANTIC_R2_URL: http://127.0.0.1:4173/
          PROAI_BASELINE_URL: http://127.0.0.1:4173/baseline-fixture/
        run: npm run capture

      - name: Verify final evidence gate
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          test "$(node -e "const q=require('./$R2/QA.json'); process.stdout.write(String(q.allPass))")" = true
          test "$(node -e "const q=require('./$R2/QA.json'); process.stdout.write(String(q.evidence.video.spliceCount))")" = 0
          test "$(find "$R2/review" -maxdepth 1 -name '*.png' | wc -l)" -le 2
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,avg_frame_rate -of default=nw=1 "$R2/review/proai-cube-semantic-brand-moment-r2-owner-review.mp4"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$R2/review/proai-cube-semantic-brand-moment-r2-owner-review.mp4")" = 720
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$R2/review/proai-cube-semantic-brand-moment-r2-owner-review.mp4")" = 720
          rm -rf "$R2/baseline-fixture" "$R2/dist"

      - name: Upload owner-review evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: proai-cube-semantic-brand-moment-r2-owner-review
          path: |
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/REPORT.md
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/QA.json
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/BASELINE_FREEZE.json
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/review/*.png
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/review/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Commit only final isolated R2 prototype and evidence
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          rm -rf "$R2/node_modules" "$R2/baseline-fixture" "$R2/dist"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R2"
          git rm -r .github/r2-bootstrap .github/workflows/proai-cube-semantic-brand-moment-r2.yml
          if git diff --cached --name-only | grep -E '^index\.html$|^ru/index\.html$'; then
            echo 'Production file staged unexpectedly'
            exit 1
          fi
          git commit -m 'feat: add ProAI Cube semantic brand moment R2'
          git fetch origin agent/proai-cube-semantic-brand-moment-r2
          git rebase origin/agent/proai-cube-semantic-brand-moment-r2
          git push origin HEAD:agent/proai-cube-semantic-brand-moment-r2