name: ProAI Cube Semantic Display R1 Evidence

on:
  push:
    branches:
      - agent/proai-cube-semantic-display-r1
    paths:
      - 'docs/site-evolution/spline/build-proai-cube-semantic-display-r1.py'
      - 'docs/site-evolution/spline/proai-cube-semantic-display-r1-config.js'
      - 'docs/site-evolution/spline/proai-cube-semantic-display-r1-functions-*.js'
      - 'docs/site-evolution/spline/proai-cube-semantic-display-r1-capture*.mjs*'
      - 'docs/site-evolution/spline/proai-cube-semantic-display-r1-freeze-check.py'
      - 'docs/site-evolution/spline/proai-cube-semantic-display-r1-finalize.py'
      - '.github/workflows/proai-cube-semantic-display-r1-evidence.yml'

concurrency:
  group: proai-cube-semantic-display-r1-evidence
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  static-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Generate and verify frozen prototype
        run: |
          set -euo pipefail
          python docs/site-evolution/spline/build-proai-cube-semantic-display-r1.py
          cp docs/site-evolution/spline/proai-cube-semantic-display-r1-capture-static.mjs docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-static.mjs
          cp docs/site-evolution/spline/proai-cube-semantic-display-r1-capture-video.mjs docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-video.mjs
          node --check docs/site-evolution/spline/proai-cube-semantic-display-r1/main.js
          node --check docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-static.mjs
          node --check docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-video.mjs
          cmp docs/site-evolution/spline/proai-cube-semantic-display-r1/rubik_39_s_cube_animation.glb docs/site-evolution/spline/proai-cube-materials-lighting-r1/rubik_39_s_cube_animation.glb
          test "$(sha256sum docs/site-evolution/spline/proai-cube-semantic-display-r1/rubik_39_s_cube_animation.glb | awk '{print tolower($1)}')" = 'dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b'
          python docs/site-evolution/spline/proai-cube-semantic-display-r1-freeze-check.py
          if git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD | grep -E '^index\.html$|^ru/index\.html$'; then exit 1; fi
      - name: Install build browser and ffmpeg
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start isolated Vite
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/proai-semantic-static.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/proai-semantic-static.log; exit 1
      - name: Static semantic mechanics interaction and bilingual screenshot QA
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        env:
          PROAI_SEMANTIC_DISPLAY_R1_URL: http://127.0.0.1:4173/
        run: node capture-static.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-r1-static
          path: |
            docs/site-evolution/spline/proai-cube-semantic-display-r1/STATIC_QA.json
            docs/site-evolution/spline/proai-cube-semantic-display-r1/BASELINE_FREEZE.json
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review/*.png
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review-internal/*.png
          if-no-files-found: error
          retention-days: 7

  en-video:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Generate EN video prototype
        run: |
          set -euo pipefail
          python docs/site-evolution/spline/build-proai-cube-semantic-display-r1.py
          cp docs/site-evolution/spline/proai-cube-semantic-display-r1-capture-video.mjs docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-video.mjs
          node --check docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-video.mjs
      - name: Install build browser and ffmpeg
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        run: |
          npm install --package-lock=false
          npm run build
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start isolated Vite
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/proai-semantic-en.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/proai-semantic-en.log; exit 1
      - name: Capture 41 second EN owner review
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        env:
          PROAI_SEMANTIC_DISPLAY_R1_URL: http://127.0.0.1:4173/
          PROAI_VIDEO_LANG: en
        run: node capture-video.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-r1-en-video
          path: |
            docs/site-evolution/spline/proai-cube-semantic-display-r1/EN_VIDEO_QA.json
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review/proai-cube-semantic-display-r1-en-review-41s.mp4
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review/video-contact-sheet-en.png
          if-no-files-found: error
          retention-days: 7

  ru-video:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Generate RU video prototype
        run: |
          set -euo pipefail
          python docs/site-evolution/spline/build-proai-cube-semantic-display-r1.py
          cp docs/site-evolution/spline/proai-cube-semantic-display-r1-capture-video.mjs docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-video.mjs
          node --check docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-video.mjs
      - name: Install build browser and ffmpeg
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        run: |
          npm install --package-lock=false
          npm run build
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start isolated Vite
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/proai-semantic-ru.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/proai-semantic-ru.log; exit 1
      - name: Capture 22 second RU proof
        working-directory: docs/site-evolution/spline/proai-cube-semantic-display-r1
        env:
          PROAI_SEMANTIC_DISPLAY_R1_URL: http://127.0.0.1:4173/
          PROAI_VIDEO_LANG: ru
        run: node capture-video.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-r1-ru-video
          path: |
            docs/site-evolution/spline/proai-cube-semantic-display-r1/RU_VIDEO_QA.json
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review/proai-cube-semantic-display-r1-ru-proof-22s.mp4
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review/video-contact-sheet-ru.png
          if-no-files-found: error
          retention-days: 7

  finalize:
    if: github.actor != 'github-actions[bot]'
    needs: [static-qa, en-video, ru-video]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Generate final isolated prototype
        run: |
          set -euo pipefail
          python docs/site-evolution/spline/build-proai-cube-semantic-display-r1.py
          cp docs/site-evolution/spline/proai-cube-semantic-display-r1-capture-static.mjs docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-static.mjs
          cp docs/site-evolution/spline/proai-cube-semantic-display-r1-capture-video.mjs docs/site-evolution/spline/proai-cube-semantic-display-r1/capture-video.mjs
          python docs/site-evolution/spline/proai-cube-semantic-display-r1-freeze-check.py
      - uses: actions/download-artifact@v4
        with:
          name: semantic-r1-static
          path: /tmp/semantic-static
      - uses: actions/download-artifact@v4
        with:
          name: semantic-r1-en-video
          path: /tmp/semantic-en
      - uses: actions/download-artifact@v4
        with:
          name: semantic-r1-ru-video
          path: /tmp/semantic-ru
      - name: Assemble and finalize QA
        run: |
          set -euo pipefail
          P=docs/site-evolution/spline/proai-cube-semantic-display-r1
          cp -a /tmp/semantic-static/. "$P/"
          cp -a /tmp/semantic-en/. "$P/"
          cp -a /tmp/semantic-ru/. "$P/"
          PROAI_SEMANTIC_PROTOTYPE_DIR="$P" python docs/site-evolution/spline/proai-cube-semantic-display-r1-finalize.py
          if git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD | grep -E '^index\.html$|^ru/index\.html$'; then exit 1; fi
      - name: Upload combined owner review
        uses: actions/upload-artifact@v4
        with:
          name: proai-cube-semantic-display-r1-owner-review
          path: |
            docs/site-evolution/spline/proai-cube-semantic-display-r1/QA.json
            docs/site-evolution/spline/proai-cube-semantic-display-r1/SEMANTIC_QA.json
            docs/site-evolution/spline/proai-cube-semantic-display-r1/BASELINE_FREEZE.json
            docs/site-evolution/spline/proai-cube-semantic-display-r1/REPORT.md
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review/*.png
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review/*.mp4
            docs/site-evolution/spline/proai-cube-semantic-display-r1/review-internal/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Commit final prototype and evidence
        run: |
          set -euo pipefail
          P=docs/site-evolution/spline/proai-cube-semantic-display-r1
          rm -rf "$P/review-internal" "$P/STATIC_QA.json" "$P/EN_VIDEO_QA.json" "$P/RU_VIDEO_QA.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m 'feat: add ProAI cube Semantic Display R1'
          git fetch origin agent/proai-cube-semantic-display-r1
          git rebase origin/agent/proai-cube-semantic-display-r1
          git push origin HEAD:agent/proai-cube-semantic-display-r1
