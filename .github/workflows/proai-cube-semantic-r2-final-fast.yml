name: ProAI Cube Semantic R2 Final Fast

on:
  push:
    branches:
      - agent/proai-cube-semantic-brand-moment-r2
    paths:
      - '.github/workflows/proai-cube-semantic-r2-final-fast.yml'

concurrency:
  group: proai-cube-semantic-brand-moment-r2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify frozen implementation and prepare optimized 720 capture
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          BASE='docs/site-evolution/spline/proai-cube-materials-lighting-r1'
          cd "$R2"
          python verify-freeze.py
          node --check main.js
          node --check capture.mjs
          cmp rubik_39_s_cube_animation.glb ../proai-cube-materials-lighting-r1/rubik_39_s_cube_animation.glb
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = 'dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b'
          python - <<'PY'
          from pathlib import Path
          p = Path('capture.mjs')
          s = p.read_text()
          old_view = 'const VIEWPORT = { width: 1080, height: 1080 };'
          new_view = 'const VIEWPORT = { width: 720, height: 720 };'
          old_probe = '&& Number(stream.width) === 1080 && Number(stream.height) === 1080'
          new_probe = '&& Number(stream.width) === 720 && Number(stream.height) === 720'
          if old_view not in s or old_probe not in s:
              raise SystemExit('720 adaptation anchors missing')
          p.write_text(s.replace(old_view, new_view, 1).replace(old_probe, new_probe, 1))
          PY
          python optimize-capture.py
          node --check capture.mjs
          cd - >/dev/null
          if grep -niE '@splinetool|prod\.spline\.design|\.splinecode' "$R2/main.js" "$R2/index.html" "$R2/package.json" "$R2/styles.css"; then
            echo 'Forbidden Spline runtime reference found'
            exit 1
          fi
          if git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD -- index.html ru/index.html | grep -q .; then
            echo 'Production root modified'
            exit 1
          fi

      - name: Install and build
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Prepare exact baseline fixture
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          python prepare-baseline.py
          node --check baseline-fixture/main.js

      - name: Start Vite
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/proai-r2-final-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proai-r2-final-vite.log
          exit 1

      - name: Continuous optimized 720 owner capture
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2
        env:
          PROAI_SEMANTIC_R2_URL: http://127.0.0.1:4173/
          PROAI_BASELINE_URL: http://127.0.0.1:4173/baseline-fixture/
        run: timeout 20m npm run capture

      - name: Final evidence gate
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          test "$(node -e "const q=require('./$R2/QA.json');process.stdout.write(String(q.allPass))")" = true
          test "$(node -e "const q=require('./$R2/QA.json');process.stdout.write(String(q.evidence.video.spliceCount))")" = 0
          test "$(find "$R2/review" -maxdepth 1 -name '*.png' | wc -l)" -le 2
          VIDEO="$R2/review/proai-cube-semantic-brand-moment-r2-owner-review.mp4"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")" = h264
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO")" = yuv420p
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")" = 720
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")" = 720
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$VIDEO")" = 24/1
          if git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD -- index.html ru/index.html | grep -q .; then exit 1; fi
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,avg_frame_rate -of default=nw=1 "$VIDEO"

      - name: Upload owner evidence
        uses: actions/upload-artifact@v4
        with:
          name: proai-cube-semantic-brand-moment-r2-owner-review
          path: |
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/REPORT.md
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/QA.json
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/BASELINE_FREEZE.json
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/review/*.png
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/review/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Commit final isolated package
        run: |
          set -euo pipefail
          R2='docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2'
          rm -rf "$R2/node_modules" "$R2/baseline-fixture" "$R2/dist"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R2"
          git rm -r .github/r2-bootstrap
          git rm .github/workflows/proai-cube-semantic-brand-moment-r2-capture-r2.yml
          git rm .github/workflows/proai-cube-semantic-brand-moment-r2-fast-capture.yml
          git rm .github/workflows/proai-cube-semantic-brand-moment-r2-finalize.yml
          git rm .github/workflows/proai-cube-semantic-brand-moment-r2-materialize.yml
          git rm .github/workflows/proai-cube-semantic-brand-moment-r2.yml
          git rm .github/workflows/proai-cube-semantic-r2-source-export.yml
          git rm .github/workflows/proai-cube-semantic-r2-final-fast.yml
          if git diff --cached --name-only | grep -E '^index\.html$|^ru/index\.html$'; then
            echo 'Production file staged unexpectedly'
            exit 1
          fi
          git commit -m 'feat: add ProAI Cube semantic brand moment R2'
          git fetch origin agent/proai-cube-semantic-brand-moment-r2
          git rebase origin/agent/proai-cube-semantic-brand-moment-r2
          git push origin HEAD:agent/proai-cube-semantic-brand-moment-r2