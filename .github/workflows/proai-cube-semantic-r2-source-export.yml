name: ProAI Cube Semantic R2 Source Export

on:
  push:
    branches:
      - agent/proai-cube-semantic-brand-moment-r2
    paths:
      - '.github/workflows/proai-cube-semantic-r2-source-export.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconstruct isolated R2 source
        run: |
          set -euo pipefail
          cat .github/r2-bootstrap/part1.txt .github/r2-bootstrap/part2.txt .github/r2-bootstrap/part3.txt .github/r2-bootstrap/part4.txt > /tmp/proai-r2.b64
          base64 -d /tmp/proai-r2.b64 > /tmp/proai-r2.zlib
          python - <<'PY'
          import zlib
          payload = zlib.decompress(open('/tmp/proai-r2.zlib','rb').read()).decode('utf-8')
          exec(compile(payload, 'proai-semantic-brand-moment-r2-builder.py', 'exec'), {'__name__':'__main__'})
          PY
          node --check docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/main.js
          node --check docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/capture.mjs

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: proai-semantic-r2-generated-source
          path: |
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/*.js
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/*.mjs
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/*.html
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/*.css
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/*.json
            docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/*.md
          if-no-files-found: error
          retention-days: 1
