name: ProAI Cube Spatial Motion Recovery R1 Owner Review

on:
  pull_request:
    branches:
      - agent/proai-cube-spatial-motion-recovery-r1-runner
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: write

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CANDIDATE_SHA: 62d93b59a911b5d2957de0d3fd19806bbafcbd52
      SOURCE_FILE: assets/js/proai-hero-cube-r1/source-materials-r1.js
      SOURCE_BLOB: ac81b190617c1894d99e4bbd6517422fbe198ee2
      BOOTSTRAP_BLOB: b46b26164efc000daef8ecb3416039008db7cd79
      HERO_CSS_BLOB: 5dde833560aac0958875842a598f622942597b74
      GLB_SHA256: dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b
      PROOF_DIR: spatial-motion-owner-review-proof
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: 62d93b59a911b5d2957de0d3fd19806bbafcbd52
          fetch-depth: 0
          path: candidate

      - name: Checkout review tooling
        uses: actions/checkout@v6
        with:
          ref: agent/proai-cube-spatial-motion-recovery-r1-runner
          fetch-depth: 1
          path: runner

      - name: Verify exact candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "1af1cce6e98d1f606489dbd3078f7b21515b4191"
          test "$(git hash-object "$SOURCE_FILE")" = "$SOURCE_BLOB"
          test "$(git hash-object assets/js/proai-hero-cube-r1/bootstrap.js)" = "$BOOTSTRAP_BLOB"
          test "$(git hash-object assets/css/homepage-hero-signature-r3.css)" = "$HERO_CSS_BLOB"
          test "$(sha256sum assets/models/proai-cube/rubik_39_s_cube_animation.glb | awk '{print $1}')" = "$GLB_SHA256"
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
          test "$(git diff --name-only HEAD^..HEAD | wc -l)" -eq 1
          test "$(git diff --name-only HEAD^..HEAD)" = "$SOURCE_FILE"
          git diff --check HEAD^..HEAD
          node --check "$SOURCE_FILE"

      - name: Build and serve exact candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          jekyll build --source . --destination _site > "$PROOF_DIR/jekyll-build-owner.log" 2>&1
          test -s _site/index.html; test -s _site/ru/index.html
          nohup python3 -m http.server 4000 --bind 127.0.0.1 --directory _site > "$PROOF_DIR/http-owner.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/ >/dev/null && curl -fsS http://127.0.0.1:4000/ru/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Install Chromium tooling
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p /tmp/proai-spatial-owner; cd /tmp/proai-spatial-owner
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.16.0 >/dev/null

      - name: Deterministic Chromium 0-32s spatial visual gate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH=/tmp/proai-spatial-owner/node_modules node ../runner/tools/spatial_recovery_r1_capture_proof.cjs

      - name: Upload spatial visual proof
        uses: actions/upload-artifact@v4
        with:
          name: proai-cube-spatial-motion-recovery-r1-owner-proof
          path: candidate/spatial-motion-owner-review-proof/
          retention-days: 7

      - name: Start bounded temporary HTTPS review
        id: public
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:4000 --no-autoupdate > "$PROOF_DIR/cloudflared-owner.log" 2>&1 &
          URL=""
          for i in $(seq 1 60); do URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$PROOF_DIR/cloudflared-owner.log" | head -1 || true)"; [ -n "$URL" ] && break; sleep 1; done
          [ -n "$URL" ] || exit 2
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 5 "$URL/" -o /tmp/public-en.html 2>/dev/null && curl -fsS --connect-timeout 5 "$URL/ru/" -o /tmp/public-ru.html 2>/dev/null; then READY=1; break; fi
            sleep 2
          done
          [ "$READY" = 1 ] || exit 3
          test "$(grep -o 'id=\"hero\"' /tmp/public-en.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"hero\"' /tmp/public-ru.html | wc -l)" -eq 1
          curl -fsS "$URL/assets/js/proai-hero-cube-r1/bootstrap.js" >/tmp/public-bootstrap.js
          curl -fsS "$URL/assets/js/proai-hero-cube-r1/source-materials-r1.js" >/tmp/public-source.js
          curl -fsS "$URL/assets/css/homepage-hero-signature-r3.css" >/tmp/public-hero.css
          curl -fsS "$URL/assets/models/proai-cube/rubik_39_s_cube_animation.glb" >/tmp/public-cube.glb
          test "$(sha256sum /tmp/public-cube.glb | awk '{print $1}')" = "$GLB_SHA256"
          test "$(git hash-object /tmp/public-bootstrap.js)" = "$BOOTSTRAP_BLOB"
          test "$(git hash-object /tmp/public-source.js)" = "$SOURCE_BLOB"
          test "$(git hash-object /tmp/public-hero.css)" = "$HERO_CSS_BLOB"
          echo "$URL/" > "$PROOF_DIR/owner-en-url.txt"
          echo "$URL/ru/" > "$PROOF_DIR/owner-ru-url.txt"
          echo "OWNER_URL=$URL" >> "$GITHUB_ENV"

      - name: Public Chromium boot gate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/proai-spatial-owner/public-boot.cjs <<'NODE'
          const fs=require('fs'),puppeteer=require('puppeteer-core');
          const base=process.env.OWNER_URL,result={en:null,ru:null,errors:[],failed:[],pass:false};
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-gpu-blocklist','--enable-webgl','--enable-unsafe-swiftshader','--use-angle=swiftshader']});try{for(const [k,r] of [['en','/'],['ru','/ru/']]){const p=await b.newPage();p.on('pageerror',e=>result.errors.push(`${k}:${e.message}`));p.on('requestfailed',q=>result.failed.push(`${k}:${q.url()}`));const resp=await p.goto(base+r,{waitUntil:'domcontentloaded',timeout:45000});await p.waitForFunction(()=>document.querySelector('.proai-hero-object-slot[data-proai-hero-object]')?.dataset.cubeMounted==='true'&&window.__PROAI_HERO_CUBE_R1?.runtime?.ready===true,{timeout:30000});result[k]=await p.evaluate(status=>({status,hero:document.querySelectorAll('#hero').length,cube:document.querySelectorAll('#cube-canvas').length,ready:window.__PROAI_HERO_CUBE_R1.runtime.ready}),resp.status());await p.close()}result.pass=result.en.status===200&&result.ru.status===200&&result.en.hero===1&&result.ru.hero===1&&result.en.cube===1&&result.ru.cube===1&&result.en.ready&&result.ru.ready&&result.errors.length===0&&!result.failed.some(x=>/\.(js|css|glb)(\?|$)/i.test(x))}finally{await b.close();fs.writeFileSync('spatial-motion-owner-review-proof/PUBLIC_BOOT.json',JSON.stringify(result,null,2))}if(!result.pass)process.exit(2)})();
          NODE
          NODE_PATH=/tmp/proai-spatial-owner/node_modules node /tmp/proai-spatial-owner/public-boot.cjs

      - name: Publish Owner review status and keep live
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"proai/spatial-motion-owner-review\",\"target_url\":\"${OWNER_URL}/\",\"description\":\"Spatial motion Owner review; RU at /ru/\"}" >/dev/null
          echo "OWNER_EN_URL=${OWNER_URL}/"
          echo "OWNER_RU_URL=${OWNER_URL}/ru/"
          sleep 3600
