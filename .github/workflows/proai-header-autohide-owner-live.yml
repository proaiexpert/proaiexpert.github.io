name: ProAI Header Auto-Hide Owner Live
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-autohide-owner-live.yml]
permissions:
  contents: read
jobs:
  owner-live:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify product and production locks
        shell: bash
        run: |
          set -euo pipefail
          BASE=5279084dde5f17c0193bc533f9dc67b45893ee8d
          PRODUCT=20a36a5246ac2fb4507c69858289fc55d0f4a977
          MAIN=c945084e1952c05c686494091f7dbca0f7acdf08
          git merge-base --is-ancestor "$PRODUCT" HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git diff --name-only "$BASE" "$PRODUCT")" = "assets/js/header-system-v1.js"
          git diff --quiet "$BASE" "$PRODUCT" -- assets/brand/proai-logo-r341 _includes/header-system/header.html assets/css/header-footer-logo-r1.css assets/js/header-footer-logo-r1.js assets/css/homepage-hero-signature-r3.css _includes/footer-commercial-v1.html
          node --check assets/js/header-system-v1.js
          grep -q "header-hidden" assets/js/header-system-v1.js
          grep -q "max-width:1080px" assets/js/header-system-v1.js
          grep -q "menu-open" assets/js/header-system-v1.js
      - name: Build and publish owner preview
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          jekyll build --source . --destination _site >/dev/null
          OUT=/tmp/header-autohide-live
          mkdir -p "$OUT"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >"$OUT/http.log" 2>&1 &
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >"$OUT/cloudflared.log" 2>&1 &
          BASE_URL=""
          for i in $(seq 1 60); do
            BASE_URL="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' "$OUT/cloudflared.log" | tail -1 || true)"
            [ -n "$BASE_URL" ] && break
            sleep 2
          done
          test -n "$BASE_URL"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$BASE_URL/" >/dev/null 2>&1; then break; fi
            [ "$i" -eq 30 ] && exit 1
            sleep 3
          done
          for P in / /ru/ /assets/js/header-system-v1.js /assets/css/header-footer-logo-r1.css '/assets/brand/proai-logo-r341/live.html?mode=living&startup=controlled'; do curl -fsS --retry 3 --max-time 20 "$BASE_URL$P" >/dev/null; done
          grep -q 'data-site-header' _site/index.html
          grep -q 'data-site-header' _site/ru/index.html
          printf 'EN\n%s/\nRU\n%s/ru/\nEXPECTED LIFETIME\n4 hours from keepalive start\n' "$BASE_URL" "$BASE_URL" | tee "$OUT/OWNER_URLS.txt"
          printf '%s\n' "$BASE_URL" > "$OUT/PUBLIC_BASE_URL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: proai-header-autohide-owner-live
          path: /tmp/header-autohide-live
          retention-days: 3
      - name: Keep owner preview alive
        shell: bash
        run: sleep 14400