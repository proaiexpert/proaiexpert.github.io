name: ProAI Header Cube R1.1 Perception Gate
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-cube-r11-perception.yml]
permissions:
  contents: read
jobs:
  perception:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Render exact 0s 1s 2s states
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          mkdir -p /tmp/perception
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/perception/http.log 2>&1 &
          cat >/tmp/perception/render.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');
          (async()=>{const b=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});const p=await b.newPage();await p.setViewport({width:40,height:40,deviceScaleFactor:3});await p.goto('http://127.0.0.1:8080/assets/brand/proai-logo-r341/live.html?mode=living&quality=3',{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:90000});const frames=[{t:0,yaw:288,pitch:6.1073256538,roll:.2078050729},{t:1,yaw:296.5,pitch:7.4231365529,roll:.2772465702},{t:2,yaw:305,pitch:8.5000853517,roll:.3311830084}];for(const f of frames){await p.evaluate(f=>{globalThis.__PROAI_HEADER_LOGO_TICK=()=>{};window.__PROAI_CUBE_R1_2.setSignatureEuler(f.yaw,f.pitch,f.roll,true)},f);await p.screenshot({path:`/tmp/perception/t${f.t}.png`})}const s=await p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));a.equal(s.renderer.effectivePixelRatio,3);a.equal(s.renderer.backingWidth,120);fs.writeFileSync('/tmp/perception/states.json',JSON.stringify({frames,renderer:s.renderer},null,2));await b.close();console.log('PERCEPTION_GATE_RENDERED=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/perception/render.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: proai-header-cube-r11-perception
          path: /tmp/perception
          retention-days: 7
