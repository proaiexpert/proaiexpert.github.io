name: ProAI Header Cube R1.1 Visual QA
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-cube-r11-qa.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify immutable scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d147d9675c945dbba1ec5a610f33045e2338ecae
          git merge-base --is-ancestor "$BASE" HEAD
          for P in \
            _includes/footer-commercial-v1.html \
            assets/js/header-footer-logo-r1.js \
            assets/js/header-system-v1.js \
            assets/css/header-footer-logo-r1.css \
            assets/css/homepage-hero-signature-r3.css \
            assets/js/proai-hero-cube-r1/bootstrap.js \
            assets/js/proai-hero-cube-r1/source-materials-r1.js \
            index.html ru/index.html _data/header.yml; do
            test "$(git rev-parse "$BASE:$P")" = "$(git rev-parse "HEAD:$P")" || { echo "IMMUTABLE FILE CHANGED: $P"; exit 1; }
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Install QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          jekyll build --source . --destination _site >/dev/null
      - name: Browser and Retina QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r11qa
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/r11qa/http.log 2>&1 &
          cat > /tmp/r11qa/qa.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');
          const BASE='http://127.0.0.1:8080';
          const out={pass:false,sourceBase:'d147d9675c945dbba1ec5a610f33045e2338ecae',checks:{},samples:{},viewports:{},quality:{}};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});
            async function open(path,{w=1440,h=900,dpr=1}={}){
              const p=await browser.newPage();
              await p.setViewport({width:w,height:h,deviceScaleFactor:dpr,isMobile:w<=900,hasTouch:w<=900});
              const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await p.goto(BASE+path,{waitUntil:'domcontentloaded',timeout:30000});await p.evaluate(()=>document.fonts.ready);return{p,errors};
            }
            async function waitSite(p){await p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:30000});await p.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:30000});}
            async function logoState(p){const frame=p.frames().find(f=>f.url().includes('/assets/brand/proai-logo-r341/live.html'));a.ok(frame,'live logo frame');await frame.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:30000});return{frame,state:await frame.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)))}}
            for(const dpr of [1,2,3]){
              const x=await open('/',{w:1440,h:900,dpr});await waitSite(x.p);const {frame,state}=await logoState(x.p);const shell=await x.p.evaluate(()=>{const l=document.querySelector('.proai-logo-r341--header'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark'),f=l.querySelector('iframe');return{cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),gap:parseFloat(getComputedStyle(w).marginLeft),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,iframeTransform:getComputedStyle(f).transform}});const canvas=await frame.evaluate(()=>{const c=document.querySelector('#cube-canvas'),r=c.getBoundingClientRect();return{cssWidth:r.width,cssHeight:r.height,width:c.width,height:c.height,transform:getComputedStyle(c).transform}});a.equal(Math.round(shell.cube),40);a.equal(Math.round(shell.word),20);a.equal(Math.round(shell.gap),9);a.equal(shell.overflow,0);a.equal(canvas.transform,'none');a.equal(Math.round(canvas.cssWidth),40);a.equal(Math.round(canvas.cssHeight),40);a.equal(canvas.width,160);a.equal(canvas.height,160);a.equal(state.renderer.effectivePixelRatio,4);a.equal(state.captureMode,false);a.equal(state.renderer.antialias,true);a.equal(state.renderer.cssScaleTransform,false);a.equal(state.geometry.pass,true);a.equal(state.sliceChoreography,false);a.equal(state.semanticFace,false);a.equal(state.wordmarkAnimated,false);out.checks['dpr'+dpr]={shell,canvas,renderer:state.renderer};a.equal(x.errors.length,0);await x.p.close();
            }
            const motion=await open('/',{w:1200,h:800,dpr:2});await waitSite(motion.p);let z=await logoState(motion.p);const s0=z.state;const box=await motion.p.$eval('.site-header',e=>{const r=e.getBoundingClientRect();return{x:0,y:0,width:1200,height:Math.ceil(r.height)}});await motion.p.screenshot({path:'/tmp/r11qa/laptop-1200-t0.png',clip:box});await sleep(1000);const s1=await z.frame.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await motion.p.screenshot({path:'/tmp/r11qa/laptop-1200-t1.png',clip:box});await sleep(1000);const s2=await z.frame.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await motion.p.screenshot({path:'/tmp/r11qa/laptop-1200-t2.png',clip:box});const dy1=s1.current.yaw-s0.current.yaw,dy2=s2.current.yaw-s0.current.yaw,dp2=s2.current.pitch-s0.current.pitch;a.ok(dy1>7.4&&dy1<9.6,`1s yaw ${dy1}`);a.ok(dy2>15&&dy2<19.5,`2s yaw ${dy2}`);a.ok(Math.abs(dp2)>.7,`2s pitch ${dp2}`);a.equal(s2.motion.yawSpeed,8.5);a.equal(s2.motion.pitchAmplitude,5);a.equal(s2.motion.rollAmplitude,.75);a.ok(s2.frames-s0.frames>40,'RAF frames within 2s');out.samples.motion={start:s0.current,oneSecond:s1.current,twoSecond:s2.current,yawDelta1s:dy1,yawDelta2s:dy2,pitchDelta2s:dp2,frames2s:s2.frames-s0.frames};out.viewports['1200x800']={pass:true};a.equal(motion.errors.length,0);await motion.p.close();
            const cases=[['1440x900',1440,900,2],['1024',1024,800,2],['390x844',390,844,3],['360',360,800,3],['844x390',844,390,3]];
            for(const [name,w,h,dpr] of cases){const x=await open('/',{w,h,dpr});await waitSite(x.p);const r=await x.p.evaluate(()=>{const logo=document.querySelector('.proai-logo-r341--header'),c=logo.querySelector('.proai-logo-r341__cube'),word=logo.querySelector('.proai-logo-r341__wordmark'),menu=document.querySelector('.site-header__menu-toggle'),acts=[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>{const q=e.getBoundingClientRect();return{top:q.top,left:q.left,right:q.right}});return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(word).fontSize),menu:getComputedStyle(menu).display,heroDir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,heroWrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap,acts}});a.equal(r.overflow,0);a.equal(Math.round(r.cube),40);a.equal(Math.round(r.word),20);if(w<=1260)a.notEqual(r.menu,'none');if(w<=900){a.equal(r.heroDir,'row');a.equal(r.heroWrap,'nowrap');a.ok(Math.abs(r.acts[0].top-r.acts[1].top)<=4)}out.viewports[name]={pass:true,...r};if(name==='390x844'){const lb=await x.p.$eval('.site-header__brand',e=>{const q=e.getBoundingClientRect();return{x:Math.max(0,q.x-4),y:Math.max(0,q.y-8),width:Math.min(innerWidth-q.x+4,q.width+8),height:q.height+16}});await x.p.screenshot({path:'/tmp/r11qa/mobile-390-dpr3-logo.png',clip:lb});await x.p.screenshot({path:'/tmp/r11qa/mobile-390-dpr3-header.png',clip:{x:0,y:0,width:390,height:96}})}a.equal(x.errors.length,0);await x.p.close()}
            const ru=await open('/ru/',{w:390,h:844,dpr:3});await waitSite(ru.p);const rr=await ru.p.evaluate(()=>({title:document.querySelector('.proai-hero-title').textContent.replace(/\s+/g,' ').trim(),dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap,acts:[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>e.getBoundingClientRect().top),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));a.ok(rr.title.includes('результата — одна система.'));a.equal(rr.dir,'row');a.equal(rr.wrap,'nowrap');a.ok(Math.abs(rr.acts[0]-rr.acts[1])<=4);a.equal(rr.overflow,0);out.checks.ruHero=rr;a.equal(ru.errors.length,0);await ru.p.close();
            const foot=await open('/',{w:1440,h:900,dpr:2});await waitSite(foot.p);await foot.p.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));await sleep(300);const fr=await foot.p.evaluate(()=>{const f=document.querySelector('.site-footer'),l=f.querySelector('.proai-logo-r341--footer'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark');return{iframeCount:f.querySelectorAll('iframe').length,cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),staticImg:!!l.querySelector('img.proai-logo-r341__static')}});a.equal(fr.iframeCount,0);a.equal(Math.round(fr.cube),40);a.equal(Math.round(fr.word),22);a.equal(fr.staticImg,true);out.checks.footer=fr;a.equal(foot.errors.length,0);await foot.p.close();
            for(const q of [2,3,4]){const x=await open(`/assets/brand/proai-logo-r341/live.html?mode=living&quality=${q}`,{w:40,h:40,dpr:3});await x.p.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:30000});const st=await x.p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));a.equal(st.renderer.effectivePixelRatio,q);a.equal(st.renderer.backingWidth,40*q);a.equal(st.renderer.backingHeight,40*q);await sleep(300);await x.p.screenshot({path:`/tmp/r11qa/quality-${q}x-dpr3.png`});out.quality[q]={backing:[st.renderer.backingWidth,st.renderer.backingHeight],state:st.current};a.equal(x.errors.length,0);await x.p.close()}
            out.pass=true;fs.writeFileSync('/tmp/r11qa/qa.json',JSON.stringify(out,null,2));await browser.close();console.log('HEADER_CUBE_R11_QA=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/r11qa/qa.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: proai-header-cube-r11-qa
          path: /tmp/r11qa
          retention-days: 7
