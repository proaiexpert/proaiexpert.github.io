name: ProAI Header Cube R1.1 Retina QA R2
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-cube-r11-qa2.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify immutable scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d147d9675c945dbba1ec5a610f33045e2338ecae
          git merge-base --is-ancestor "$BASE" HEAD
          for P in \
            _includes/footer-commercial-v1.html \
            assets/js/header-system-v1.js \
            assets/css/header-footer-logo-r1.css \
            assets/css/homepage-hero-signature-r3.css \
            assets/js/proai-hero-cube-r1/bootstrap.js \
            assets/js/proai-hero-cube-r1/source-materials-r1.js \
            index.html ru/index.html _data/header.yml; do
            test "$(git rev-parse "$BASE:$P")" = "$(git rev-parse "HEAD:$P")" || { echo "IMMUTABLE FILE CHANGED: $P"; exit 1; }
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Install build and browser
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          jekyll build --source . --destination _site >/dev/null
      - name: Retina, motion and regression QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r11qa2
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/r11qa2/http.log 2>&1 &
          cat > /tmp/r11qa2/qa.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');
          const BASE='http://127.0.0.1:8080',sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const R={pass:false,errors:[],standalone:{},dpr:{},motion:{},viewports:{},quality:{},regression:{}};
          (async()=>{
            const browser=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});
            async function open(path,w=1440,h=900,dpr=1){const p=await browser.newPage();await p.setViewport({width:w,height:h,deviceScaleFactor:dpr,isMobile:w<=900,hasTouch:w<=900});const errors=[];p.on('pageerror',e=>errors.push('pageerror '+String(e)));p.on('console',m=>{if(m.type()==='error')errors.push('console '+m.text())});p.on('requestfailed',q=>errors.push('request '+q.url()+' '+(q.failure()?.errorText||'')));await p.goto(BASE+path,{waitUntil:'domcontentloaded',timeout:30000});await p.evaluate(()=>document.fonts.ready);return{p,errors}}
            async function stateIn(p,timeout=90000){await p.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout});return p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)))}
            async function waitSite(p){await p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:90000});await p.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:90000})}
            async function frameState(p){const f=p.frames().find(x=>x.url().includes('/assets/brand/proai-logo-r341/live.html'));a.ok(f,'Header logo iframe');await f.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:90000});return{f,state:await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)))}}

            // Standalone readiness first: isolates Logo runtime from Hero cost.
            {const x=await open('/assets/brand/proai-logo-r341/live.html?mode=living',40,40,3);const st=await stateIn(x.p);const cv=await x.p.evaluate(()=>{const c=document.querySelector('#cube-canvas'),r=c.getBoundingClientRect();return{css:[r.width,r.height],backing:[c.width,c.height],transform:getComputedStyle(c).transform,filter:getComputedStyle(c).filter}});a.equal(st.revision,'HEADER_LIVING_CUBE_R1.1');a.equal(st.captureMode,false);a.equal(st.renderer.effectivePixelRatio,4);a.deepEqual(cv.backing,[160,160]);a.equal(cv.transform,'none');a.equal(cv.filter,'none');a.equal(st.geometry.pass,true);a.equal(st.sliceChoreography,false);a.equal(st.semanticFace,false);a.equal(st.wordmarkAnimated,false);R.standalone={state:st,canvas:cv,errors:x.errors};a.equal(x.errors.length,0);await x.p.screenshot({path:'/tmp/r11qa2/standalone-dpr3-4x.png'});await x.p.close()}

            // Full site effective backing is held at 4x CSS for DPR1/2/3.
            for(const dpr of [1,2,3]){const x=await open('/',1440,900,dpr);await waitSite(x.p);const z=await frameState(x.p);const outer=await x.p.evaluate(()=>{const l=document.querySelector('.proai-logo-r341--header'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark');return{cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),gap:parseFloat(getComputedStyle(w).marginLeft),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,liveSrc:l.querySelector('iframe').getAttribute('src')||''}});const cv=await z.f.evaluate(()=>{const c=document.querySelector('#cube-canvas'),r=c.getBoundingClientRect();return{css:[r.width,r.height],backing:[c.width,c.height],transform:getComputedStyle(c).transform}});a.equal(Math.round(outer.cube),40);a.equal(Math.round(outer.word),20);a.equal(Math.round(outer.gap),9);a.equal(outer.overflow,0);a.ok(!outer.liveSrc.includes('capture=1'));a.deepEqual(cv.backing,[160,160]);a.equal(cv.transform,'none');a.equal(z.state.renderer.effectivePixelRatio,4);a.equal(z.state.captureMode,false);R.dpr[dpr]={outer,canvas:cv,renderer:z.state.renderer,errors:x.errors};a.equal(x.errors.length,0);await x.p.close()}

            // 1200 laptop motion: three actual header captures one second apart.
            {const x=await open('/',1200,800,2);await waitSite(x.p);const z=await frameState(x.p);const s0=z.state;const clip={x:0,y:0,width:1200,height:76};await x.p.screenshot({path:'/tmp/r11qa2/laptop-1200-t0.png',clip});await sleep(1000);const s1=await z.f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await x.p.screenshot({path:'/tmp/r11qa2/laptop-1200-t1.png',clip});await sleep(1000);const s2=await z.f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await x.p.screenshot({path:'/tmp/r11qa2/laptop-1200-t2.png',clip});const dy1=s1.current.yaw-s0.current.yaw,dy2=s2.current.yaw-s0.current.yaw,dp2=s2.current.pitch-s0.current.pitch,dr2=s2.current.roll-s0.current.roll,dt1=s1.elapsedSec-s0.elapsedSec,dt2=s2.elapsedSec-s0.elapsedSec,speed1=dy1/dt1,speed2=dy2/dt2;a.ok(dt1>.65,'1 sec motion sample advances');a.ok(Math.abs(speed1-8.5)<.35,'1 sec normalized yaw 8.5');a.ok(Math.abs(speed2-8.5)<.35,'2 sec normalized yaw 8.5');a.ok(dy1>5.5,'visible 1 sec yaw');a.ok(dy2>12,'visible 2 sec yaw');a.ok(Math.abs(dp2)>.45,'pitch changes visibly over 2 sec');a.equal(s2.motion.pitchAmplitude,5);a.equal(s2.motion.rollAmplitude,.75);a.ok(s2.frames-s0.frames>35,'RAF frames advance');R.motion={start:s0.current,t1:s1.current,t2:s2.current,dy1,dy2,dp2,dr2,dt1,dt2,speed1,speed2,frames:s2.frames-s0.frames};a.equal(x.errors.length,0);await x.p.close()}

            // Required viewport / Hero / mobile menu checks.
            for(const [name,w,h,dpr] of [['1440x900',1440,900,2],['1200x800',1200,800,2],['1024',1024,800,2],['390x844',390,844,3],['360',360,800,3],['844x390',844,390,3]]){const x=await open('/',w,h,dpr);await waitSite(x.p);const v=await x.p.evaluate(()=>{const logo=document.querySelector('.proai-logo-r341--header'),c=logo.querySelector('.proai-logo-r341__cube'),word=logo.querySelector('.proai-logo-r341__wordmark'),menu=document.querySelector('.site-header__menu-toggle'),acts=[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>{const r=e.getBoundingClientRect();return{top:r.top,left:r.left,right:r.right}});return{overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(word).fontSize),gap:parseFloat(getComputedStyle(word).marginLeft),menu:getComputedStyle(menu).display,dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap,acts,headerH:document.querySelector('.site-header').getBoundingClientRect().height}});a.equal(v.overflow,0);a.equal(Math.round(v.cube),40);a.equal(Math.round(v.word),20);a.equal(Math.round(v.gap),9);if(w<=1260)a.notEqual(v.menu,'none');if(w<=900){a.equal(v.dir,'row');a.equal(v.wrap,'nowrap');a.ok(Math.abs(v.acts[0].top-v.acts[1].top)<=4)}R.viewports[name]={...v,errors:x.errors};if(name==='390x844'){await x.p.screenshot({path:'/tmp/r11qa2/mobile-390-dpr3-header.png',clip:{x:0,y:0,width:390,height:96}});await x.p.click('.site-header__menu-toggle');a.equal(await x.p.$eval('.site-header__nav',e=>e.classList.contains('is-open')),true);await x.p.screenshot({path:'/tmp/r11qa2/mobile-390-menu.png'});await x.p.keyboard.press('Escape')}if(name==='360')await x.p.screenshot({path:'/tmp/r11qa2/mobile-360-dpr3-header.png',clip:{x:0,y:0,width:360,height:96}});if(name==='844x390')await x.p.screenshot({path:'/tmp/r11qa2/mobile-844x390-header.png',clip:{x:0,y:0,width:844,height:76}});a.equal(x.errors.length,0);await x.p.close()}

            // RU Hero contract.
            {const x=await open('/ru/',390,844,3);await waitSite(x.p);const q=await x.p.evaluate(()=>({title:document.querySelector('.proai-hero-title').textContent.replace(/\s+/g,' ').trim(),dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap,tops:[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>e.getBoundingClientRect().top),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));a.ok(q.title.includes('результата — одна система.'));a.equal(q.dir,'row');a.equal(q.wrap,'nowrap');a.ok(Math.abs(q.tops[0]-q.tops[1])<=4);a.equal(q.overflow,0);R.regression.ru=q;a.equal(x.errors.length,0);await x.p.close()}

            // Footer remains static 40/22, no WebGL iframe.
            {const x=await open('/',1440,900,2);await waitSite(x.p);await x.p.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));await sleep(250);const q=await x.p.evaluate(()=>{const f=document.querySelector('.site-footer'),l=f.querySelector('.proai-logo-r341--footer'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark');return{iframeCount:f.querySelectorAll('iframe').length,cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),staticNatural:l.querySelector('img')?.naturalWidth||0}});a.equal(q.iframeCount,0);a.equal(Math.round(q.cube),40);a.equal(Math.round(q.word),22);a.ok(q.staticNatural>0);R.regression.footer=q;a.equal(x.errors.length,0);await x.p.close()}

            // Internal pixel-density comparison only.
            for(const q of [2,3,4]){const x=await open(`/assets/brand/proai-logo-r341/live.html?mode=living&quality=${q}`,40,40,3);const st=await stateIn(x.p);a.equal(st.renderer.effectivePixelRatio,q);a.equal(st.renderer.backingWidth,40*q);a.equal(st.renderer.backingHeight,40*q);await sleep(250);await x.p.screenshot({path:`/tmp/r11qa2/quality-${q}x.png`});R.quality[q]={backing:[st.renderer.backingWidth,st.renderer.backingHeight],current:st.current,errors:x.errors};a.equal(x.errors.length,0);await x.p.close()}

            R.pass=true;fs.writeFileSync('/tmp/r11qa2/qa.json',JSON.stringify(R,null,2));await browser.close();console.log('HEADER_CUBE_R11_QA2=PASS');
          })().catch(async e=>{R.errors.push(String(e?.stack||e));fs.writeFileSync('/tmp/r11qa2/qa.json',JSON.stringify(R,null,2));console.error(e);process.exitCode=1});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/r11qa2/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proai-header-cube-r11-qa2
          path: /tmp/r11qa2
          retention-days: 7
