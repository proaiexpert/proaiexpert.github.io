name: ProAI Header Cube R1.1 Diagnostic QA R3
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-cube-r11-qa3.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d147d9675c945dbba1ec5a610f33045e2338ecae
          for P in _includes/footer-commercial-v1.html assets/js/header-system-v1.js assets/css/header-footer-logo-r1.css assets/css/homepage-hero-signature-r3.css assets/js/proai-hero-cube-r1/bootstrap.js assets/js/proai-hero-cube-r1/source-materials-r1.js index.html ru/index.html _data/header.yml; do test "$(git rev-parse "$BASE:$P")" = "$(git rev-parse "HEAD:$P")"; done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Install
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          jekyll build --source . --destination _site >/dev/null
      - name: Fail-fast browser diagnostic
        shell: bash
        run: |
          mkdir -p /tmp/r11qa3
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/r11qa3/http.log 2>&1 &
          cat > /tmp/r11qa3/qa.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');const B='http://127.0.0.1:8080',sleep=ms=>new Promise(r=>setTimeout(r,ms));let browser;const R={pass:false,stage:'start',data:{},errors:[]};
          async function open(path,w,h,dpr){const p=await browser.newPage();await p.setViewport({width:w,height:h,deviceScaleFactor:dpr,isMobile:w<=900,hasTouch:w<=900});const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto(B+path,{waitUntil:'domcontentloaded',timeout:30000});return{p,errors}}
          async function standalone(){R.stage='standalone';const x=await open('/assets/brand/proai-logo-r341/live.html?mode=living',40,40,3);await x.p.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:70000});const st=await x.p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));const cv=await x.p.evaluate(()=>{const c=document.querySelector('#cube-canvas'),r=c.getBoundingClientRect();return{css:[r.width,r.height],backing:[c.width,c.height],transform:getComputedStyle(c).transform}});R.data.standalone={st,cv,errors:x.errors};await x.p.screenshot({path:'/tmp/r11qa3/standalone.png'});a.equal(st.renderer.effectivePixelRatio,4);a.deepEqual(cv.backing,[160,160]);a.equal(cv.transform,'none');a.equal(st.geometry.pass,true);a.equal(x.errors.length,0);await x.p.close()}
          async function full(){R.stage='full';const x=await open('/',1200,800,2);await x.p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:90000});await x.p.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:90000});const outer=await x.p.evaluate(()=>{const l=document.querySelector('.proai-logo-r341--header'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark');return{cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),gap:parseFloat(getComputedStyle(w).marginLeft),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,src:l.querySelector('iframe').src}});const f=x.p.frames().find(q=>q.url().includes('/assets/brand/proai-logo-r341/live.html'));a.ok(f);await f.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:70000});const s0=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await x.p.screenshot({path:'/tmp/r11qa3/laptop-t0.png',clip:{x:0,y:0,width:1200,height:76}});await sleep(1000);const s1=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await x.p.screenshot({path:'/tmp/r11qa3/laptop-t1.png',clip:{x:0,y:0,width:1200,height:76}});await sleep(1000);const s2=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await x.p.screenshot({path:'/tmp/r11qa3/laptop-t2.png',clip:{x:0,y:0,width:1200,height:76}});const dt=s2.elapsedSec-s0.elapsedSec,dy=s2.current.yaw-s0.current.yaw,speed=dy/dt;R.data.full={outer,s0:s0.current,s1:s1.current,s2:s2.current,dt,dy,speed,frames:s2.frames-s0.frames,errors:x.errors};a.equal(Math.round(outer.cube),40);a.equal(Math.round(outer.word),20);a.equal(Math.round(outer.gap),9);a.equal(outer.overflow,0);a.ok(!outer.src.includes('capture=1'));a.equal(s2.renderer.backingWidth,160);a.ok(Math.abs(speed-8.5)<.35);a.ok(s1.current.yaw-s0.current.yaw>5.5);a.ok(dy>12);a.ok(s2.frames-s0.frames>20);a.equal(x.errors.length,0);await x.p.close()}
          async function mobile(){R.stage='mobile';const x=await open('/',390,844,3);await x.p.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:90000});const q=await x.p.evaluate(()=>{const l=document.querySelector('.proai-logo-r341--header'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark');return{cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),gap:parseFloat(getComputedStyle(w).marginLeft),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,menu:getComputedStyle(document.querySelector('.site-header__menu-toggle')).display}});R.data.mobile={q,errors:x.errors};await x.p.screenshot({path:'/tmp/r11qa3/mobile-390.png',clip:{x:0,y:0,width:390,height:96}});a.equal(Math.round(q.cube),40);a.equal(Math.round(q.word),20);a.equal(Math.round(q.gap),9);a.equal(q.overflow,0);a.notEqual(q.menu,'none');a.equal(x.errors.length,0);await x.p.close()}
          (async()=>{browser=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});try{await standalone();await full();await mobile();R.pass=true;R.stage='complete'}catch(e){R.errors.push(String(e?.stack||e));throw e}finally{fs.writeFileSync('/tmp/r11qa3/qa.json',JSON.stringify(R,null,2));if(browser)await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/r11qa3/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proai-header-cube-r11-qa3
          path: /tmp/r11qa3
          retention-days: 7
