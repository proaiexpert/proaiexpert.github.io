name: ProAI Header Cube R1.1 Final Visual QA R4
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-cube-r11-qa4.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify immutable scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=d147d9675c945dbba1ec5a610f33045e2338ecae
          for P in _includes/footer-commercial-v1.html assets/js/header-system-v1.js assets/css/header-footer-logo-r1.css assets/css/homepage-hero-signature-r3.css assets/js/proai-hero-cube-r1/bootstrap.js assets/js/proai-hero-cube-r1/source-materials-r1.js index.html ru/index.html _data/header.yml; do test "$(git rev-parse "$BASE:$P")" = "$(git rev-parse "HEAD:$P")"; done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Install
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          jekyll build --source . --destination _site >/dev/null
      - name: Visual QA
        shell: bash
        run: |
          mkdir -p /tmp/r11qa4
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/r11qa4/http.log 2>&1 &
          cat > /tmp/r11qa4/qa.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');const B='http://127.0.0.1:8080';let browser;const R={pass:false,stage:'start',quality:{},motion:{},mobile:{},regression:{},errors:[]};
          async function page(path,w,h,dpr){const p=await browser.newPage();await p.setViewport({width:w,height:h,deviceScaleFactor:dpr,isMobile:w<=900,hasTouch:w<=900});const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto(B+path,{waitUntil:'domcontentloaded',timeout:30000});return{p,errors}}
          async function logoReady(p,timeout=90000){await p.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout});return p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)))}
          async function fullReady(p){await p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:90000});await p.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:90000});const f=p.frames().find(x=>x.url().includes('/assets/brand/proai-logo-r341/live.html'));a.ok(f);await f.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:90000});return f}
          (async()=>{browser=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});try{
            R.stage='quality';for(const q of [2,3,4]){const x=await page(`/assets/brand/proai-logo-r341/live.html?mode=living&quality=${q}`,40,40,3);const st=await logoReady(x.p);await x.p.screenshot({path:`/tmp/r11qa4/quality-${q}x.png`});R.quality[q]={backing:[st.renderer.backingWidth,st.renderer.backingHeight],effective:st.renderer.effectivePixelRatio,errors:x.errors};a.equal(st.renderer.backingWidth,40*q);a.equal(st.geometry.pass,true);a.equal(x.errors.length,0);await x.p.close()}
            R.stage='motion';{const x=await page('/',1200,800,2);const f=await fullReady(x.p);const s0=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));const base=s0.elapsedSec;await x.p.screenshot({path:'/tmp/r11qa4/laptop-1200-elapsed-0.png',clip:{x:0,y:0,width:1200,height:76}});await f.waitForFunction(b=>window.__PROAI_LOGO_R341_STATE.elapsedSec>=b+1,{},base);const s1=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await x.p.screenshot({path:'/tmp/r11qa4/laptop-1200-elapsed-1.png',clip:{x:0,y:0,width:1200,height:76}});await f.waitForFunction(b=>window.__PROAI_LOGO_R341_STATE.elapsedSec>=b+2,{},base);const s2=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));await x.p.screenshot({path:'/tmp/r11qa4/laptop-1200-elapsed-2.png',clip:{x:0,y:0,width:1200,height:76}});const d1=s1.current.yaw-s0.current.yaw,d2=s2.current.yaw-s0.current.yaw,dt1=s1.elapsedSec-s0.elapsedSec,dt2=s2.elapsedSec-s0.elapsedSec;R.motion={start:s0.current,one:s1.current,two:s2.current,d1,d2,dt1,dt2,speed1:d1/dt1,speed2:d2/dt2,frames:s2.frames-s0.frames};a.ok(d1>=8.3);a.ok(d2>=16.6);a.ok(Math.abs(d1/dt1-8.5)<.05);a.ok(Math.abs(d2/dt2-8.5)<.05);a.ok(Math.abs(s2.current.pitch-s0.current.pitch)>.5);a.equal(s2.motion.pitchAmplitude,5);a.equal(s2.motion.rollAmplitude,.75);a.equal(s2.sliceChoreography,false);a.equal(s2.semanticFace,false);a.equal(s2.wordmarkAnimated,false);a.equal(x.errors.length,0);await x.p.close()}
            R.stage='mobile';{const x=await page('/',390,844,3);const f=await fullReady(x.p);const st=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));const q=await x.p.evaluate(()=>{const l=document.querySelector('.proai-logo-r341--header'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark'),m=document.querySelector('.site-header__menu-toggle'),acts=[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>e.getBoundingClientRect().top);return{cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),gap:parseFloat(getComputedStyle(w).marginLeft),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,menu:getComputedStyle(m).display,acts,dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap}});R.mobile={q,renderer:st.renderer,errors:x.errors};a.equal(Math.round(q.cube),40);a.equal(Math.round(q.word),20);a.equal(Math.round(q.gap),9);a.equal(q.overflow,0);a.equal(q.dir,'row');a.equal(q.wrap,'nowrap');a.ok(Math.abs(q.acts[0]-q.acts[1])<=4);a.equal(st.renderer.backingWidth,160);await x.p.screenshot({path:'/tmp/r11qa4/mobile-390-dpr3.png',clip:{x:0,y:0,width:390,height:96}});await x.p.click('.site-header__menu-toggle');a.equal(await x.p.$eval('.site-header__nav',e=>e.classList.contains('is-open')),true);await x.p.screenshot({path:'/tmp/r11qa4/mobile-390-menu.png'});a.equal(x.errors.length,0);await x.p.close()}
            R.stage='ru-footer';{const x=await page('/ru/',390,844,3);await fullReady(x.p);const q=await x.p.evaluate(()=>({title:document.querySelector('.proai-hero-title').textContent.replace(/\s+/g,' ').trim(),dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap,tops:[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>e.getBoundingClientRect().top),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));a.ok(q.title.includes('результата — одна система.'));a.equal(q.dir,'row');a.equal(q.wrap,'nowrap');a.ok(Math.abs(q.tops[0]-q.tops[1])<=4);a.equal(q.overflow,0);R.regression.ru=q;await x.p.close();const y=await page('/',1440,900,1);await y.p.waitForFunction(()=>document.querySelector('.site-footer'));await y.p.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));const f=await y.p.evaluate(()=>{const el=document.querySelector('.site-footer'),l=el.querySelector('.proai-logo-r341--footer'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark');return{iframes:el.querySelectorAll('iframe').length,cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),img:l.querySelector('img')?.naturalWidth||0}});a.equal(f.iframes,0);a.equal(Math.round(f.cube),40);a.equal(Math.round(f.word),22);a.ok(f.img>0);R.regression.footer=f;await y.p.close()}
            R.pass=true;R.stage='complete';
          }catch(e){R.errors.push(String(e?.stack||e));throw e}finally{fs.writeFileSync('/tmp/r11qa4/qa.json',JSON.stringify(R,null,2));if(browser)await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/r11qa4/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proai-header-cube-r11-qa4
          path: /tmp/r11qa4
          retention-days: 7
