name: ProAI Header Cube R1.1 Corrected Final 3x Gate
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-cube-r11-qa6.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify frozen systems
        shell: bash
        run: |
          set -euo pipefail
          B=d147d9675c945dbba1ec5a610f33045e2338ecae
          for P in _includes/footer-commercial-v1.html assets/js/header-system-v1.js assets/css/header-footer-logo-r1.css assets/css/homepage-hero-signature-r3.css assets/js/proai-hero-cube-r1/bootstrap.js assets/js/proai-hero-cube-r1/source-materials-r1.js index.html ru/index.html _data/header.yml; do
            test "$(git rev-parse "$B:$P")" = "$(git rev-parse "HEAD:$P")" || { echo "IMMUTABLE FILE CHANGED: $P"; exit 1; }
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Install build and browser
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          jekyll build --source . --destination _site >/dev/null
      - name: Final 3x Retina browser gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r11qa6
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/r11qa6/http.log 2>&1 &
          cat > /tmp/r11qa6/qa.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');
          const B='http://127.0.0.1:8080'; let br;
          const R={pass:false,standalone:{},mobile:{},motion:{},ru:{},footer:{},errors:[]};
          async function open(path,w,h,dpr){const p=await br.newPage();await p.setViewport({width:w,height:h,deviceScaleFactor:dpr,isMobile:w<=900,hasTouch:w<=900});const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto(B+path,{waitUntil:'domcontentloaded',timeout:30000});await p.evaluate(()=>document.fonts.ready);return{p,errors}}
          async function standaloneState(p){await p.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:70000});return p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)))}
          async function fullReady(p){await p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:90000});await p.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:90000});const f=p.frames().find(x=>x.url().includes('/assets/brand/proai-logo-r341/live.html'));a.ok(f,'Header Logo iframe');await f.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:70000});return f}
          (async()=>{br=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});try{
            for(const dpr of [1,2,3]){const x=await open('/assets/brand/proai-logo-r341/live.html?mode=living',40,40,dpr);const s=await standaloneState(x.p);a.equal(s.renderer.effectivePixelRatio,3);a.equal(s.renderer.backingWidth,120);a.equal(s.renderer.backingHeight,120);a.equal(s.captureMode,false);a.equal(s.renderer.cssScaleTransform,false);a.equal(s.renderer.antialias,true);a.equal(s.geometry.pass,true);a.equal(s.sliceChoreography,false);a.equal(s.semanticFace,false);a.equal(s.wordmarkAnimated,false);R.standalone[dpr]={renderer:s.renderer,lookdev:s.microLookDev?.name};a.equal(x.errors.length,0);await x.p.close()}
            const m=await open('/',390,844,3);const f=await fullReady(m.p);const s0=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE))),base=s0.elapsedSec;await f.waitForFunction(b=>window.__PROAI_LOGO_R341_STATE.elapsedSec>=b+1,{timeout:90000},base);const s1=await f.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));const outer=await m.p.evaluate(()=>{const l=document.querySelector('.proai-logo-r341--header'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark'),acts=[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>e.getBoundingClientRect().top);return{cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),gap:parseFloat(getComputedStyle(w).marginLeft),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,menu:getComputedStyle(document.querySelector('.site-header__menu-toggle')).display,dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap,acts,src:l.querySelector('iframe').src}});const dy=s1.current.yaw-s0.current.yaw,dt=s1.elapsedSec-s0.elapsedSec;a.equal(s1.renderer.effectivePixelRatio,3);a.equal(s1.renderer.backingWidth,120);a.equal(Math.round(outer.cube),40);a.equal(Math.round(outer.word),20);a.equal(Math.round(outer.gap),9);a.equal(outer.overflow,0);a.notEqual(outer.menu,'none');a.equal(outer.dir,'row');a.equal(outer.wrap,'nowrap');a.ok(Math.abs(outer.acts[0]-outer.acts[1])<=4);a.ok(!outer.src.includes('capture=1'));a.ok(dy>=8.3);a.ok(Math.abs(dy/dt-8.5)<.05);R.mobile={outer,renderer:s1.renderer};R.motion={dy,dt,speed:dy/dt,start:s0.current,oneSecond:s1.current};await m.p.screenshot({path:'/tmp/r11qa6/mobile-390-final-3x.png',clip:{x:0,y:0,width:390,height:96}});await m.p.click('.site-header__menu-toggle');a.equal(await m.p.$eval('.site-header__nav',e=>e.classList.contains('is-open')),true);a.equal(m.errors.length,0);await m.p.close();
            const ru=await open('/ru/',390,844,3);await fullReady(ru.p);const rq=await ru.p.evaluate(()=>({title:document.querySelector('.proai-hero-title').textContent.replace(/\s+/g,' ').trim(),dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap,tops:[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>e.getBoundingClientRect().top),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));a.ok(rq.title.includes('результата — одна система.'));a.equal(rq.dir,'row');a.equal(rq.wrap,'nowrap');a.ok(Math.abs(rq.tops[0]-rq.tops[1])<=4);a.equal(rq.overflow,0);R.ru=rq;a.equal(ru.errors.length,0);await ru.p.close();
            const foot=await open('/',1440,900,1);await foot.p.waitForFunction(()=>document.querySelector('.site-footer'));await foot.p.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));const fq=await foot.p.evaluate(()=>{const f=document.querySelector('.site-footer'),l=f.querySelector('.proai-logo-r341--footer'),c=l.querySelector('.proai-logo-r341__cube'),w=l.querySelector('.proai-logo-r341__wordmark');return{iframes:f.querySelectorAll('iframe').length,cube:c.getBoundingClientRect().width,word:parseFloat(getComputedStyle(w).fontSize),img:l.querySelector('img')?.naturalWidth||0}});a.equal(fq.iframes,0);a.equal(Math.round(fq.cube),40);a.equal(Math.round(fq.word),22);a.ok(fq.img>0);R.footer=fq;await foot.p.close();
            R.pass=true;
          }catch(e){R.errors.push(String(e?.stack||e));throw e}finally{fs.writeFileSync('/tmp/r11qa6/qa.json',JSON.stringify(R,null,2));if(br)await br.close()}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/r11qa6/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proai-header-cube-r11-qa6
          path: /tmp/r11qa6
          retention-days: 7
