name: ProAI Header Cube R1.1 Quality Compare
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
      - name: Capture 2x 3x 4x
        run: |
          set -euo pipefail
          mkdir -p /tmp/q
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/q/http.log 2>&1 &
          cat >/tmp/q/probe.cjs <<'JS'
          const pp=require('puppeteer-core'),fs=require('fs'),a=require('assert').strict;
          (async()=>{const b=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});const out={};for(const q of [2,3,4]){const p=await b.newPage();await p.setViewport({width:40,height:40,deviceScaleFactor:3});const errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto(`http://127.0.0.1:8080/assets/brand/proai-logo-r341/live.html?mode=living&quality=${q}`,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:90000});await new Promise(r=>setTimeout(r,450));const s=await p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_LOGO_R341_STATE)));a.equal(s.renderer.effectivePixelRatio,q);a.equal(s.renderer.backingWidth,40*q);a.equal(s.renderer.backingHeight,40*q);a.equal(errors.length,0);await p.screenshot({path:`/tmp/q/quality-${q}x.png`});out[q]={renderer:s.renderer,current:s.current};await p.close();}fs.writeFileSync('/tmp/q/quality.json',JSON.stringify(out,null,2));await b.close();console.log('QUALITY_COMPARE=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/q/probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proai-header-cube-r11-quality
          path: /tmp/q
          retention-days: 7
