name: ProAI Header Footer R1 Prepare Product
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-footer-r1-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify locks and prepare product assets
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 735982473854c29a6f1eeeb4d87773abbc573b4d HEAD
          test "$(git rev-parse 671186769f5ea88d3a36ef7ce199bddd555a0c3e:assets/css/homepage-hero-signature-r3.css)" = "$(git rev-parse HEAD:assets/css/homepage-hero-signature-r3.css)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
          git fetch origin agent/proai-logo-signature-object-r2 >/dev/null
          mkdir -p assets/fonts/proai-logo-r341 assets/brand/proai-logo-r341
          git show b1500199cebec05b0ce1fc802296471a36d0c060:docs/site-evolution/brand/proai-logo-canonical-cube-r3/assets/instrument-sans-latin-wght-normal-BbzFLZTg.woff2 > assets/fonts/proai-logo-r341/instrument-sans-latin-wght-normal.woff2
          git show b1500199cebec05b0ce1fc802296471a36d0c060:docs/site-evolution/brand/proai-logo-canonical-cube-r3/r341/proai-logo-r341-static-optical-master-2048.png > /tmp/r341-master.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          for p in [Path('index.html'),Path('ru/index.html')]:
              s=p.read_text()
              css='<link rel="stylesheet" href="/assets/css/header-footer-logo-r1.css?v=20260814.1">'
              if css not in s:s=s.replace('<link rel="stylesheet" href="/assets/css/homepage-hero-signature-r3.css?v=20260813.1">','<link rel="stylesheet" href="/assets/css/homepage-hero-signature-r3.css?v=20260813.1">\n'+css,1)
              js='<script src="/assets/js/header-footer-logo-r1.js?v=20260814.1" defer></script>'
              if js not in s:s=s.replace('<script src="/assets/js/header-system-v1.js?v=20260804.1" defer></script>','<script src="/assets/js/header-system-v1.js?v=20260804.1" defer></script>\n'+js,1)
              p.write_text(s)
          hp=Path('_data/header.yml');s=hp.read_text();hp.write_text(s.replace('height: 85','height: 76',1))
          im=Image.open('/tmp/r341-master.png').convert('RGBA');bg=Image.new('RGBA',im.size,(5,6,7,255));mask=ImageChops.difference(im,bg).convert('L').point(lambda v:255 if v>7 else 0);box=mask.getbbox()
          if not box:raise SystemExit('No foreground in approved static master')
          x0,y0,x1,y1=box;side=y1-y0;pad=max(2,int(side*.035));crop=im.crop((max(0,x0-pad),max(0,y0-pad),min(im.width,x0+side+pad),min(im.height,y1+pad)));cw,ch=crop.size;sq=max(cw,ch);out=Image.new('RGBA',(sq,sq),(0,0,0,0));out.alpha_composite(crop,((sq-cw)//2,(sq-ch)//2));px=out.load()
          for y in range(sq):
              for x in range(sq):
                  r,g,b,a=px[x,y]
                  if abs(r-5)<=3 and abs(g-6)<=3 and abs(b-7)<=3:px[x,y]=(r,g,b,0)
          out.resize((320,320),Image.Resampling.LANCZOS).save('assets/brand/proai-logo-r341/proai-logo-r341-static-cube-320.png',optimize=True)
          PY
          echo "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b  assets/models/proai-cube/rubik_39_s_cube_animation.glb" | sha256sum -c -
      - name: Commit product-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProAI Builder"
          git config user.email "proai.expert2026@gmail.com"
          git add index.html ru/index.html _data/header.yml assets/fonts/proai-logo-r341 assets/brand/proai-logo-r341/proai-logo-r341-static-cube-320.png
          git commit -m "feat: add approved R3.4.1 logo assets to Header Footer R1"
          git push origin HEAD:agent/proai-header-footer-logo-r1
