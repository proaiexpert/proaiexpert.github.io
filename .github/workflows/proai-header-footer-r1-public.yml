name: ProAI Header Footer R1 Public Owner Review
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-footer-r1-public.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify product, Hero, Logo and production locks
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 671186769f5ea88d3a36ef7ce199bddd555a0c3e HEAD
          git merge-base --is-ancestor 735982473854c29a6f1eeeb4d87773abbc573b4d HEAD
          test "$(git rev-parse 671186769f5ea88d3a36ef7ce199bddd555a0c3e:assets/css/homepage-hero-signature-r3.css)" = "$(git rev-parse HEAD:assets/css/homepage-hero-signature-r3.css)"
          test "$(git rev-parse 671186769f5ea88d3a36ef7ce199bddd555a0c3e:assets/js/proai-hero-cube-r1/bootstrap.js)" = "$(git rev-parse HEAD:assets/js/proai-hero-cube-r1/bootstrap.js)"
          test "$(git rev-parse 671186769f5ea88d3a36ef7ce199bddd555a0c3e:assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "$(git rev-parse HEAD:assets/js/proai-hero-cube-r1/source-materials-r1.js)"
          echo "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b  assets/models/proai-cube/rubik_39_s_cube_animation.glb" | sha256sum -c -
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Install build, browser and tunnel
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          curl -fsSL --retry 4 --retry-delay 2 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          jekyll build --source . --destination _site >/dev/null
      - name: Start public HTTPS owner review and self-check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hfpublic
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/hfpublic/http.log 2>&1 & echo $! >/tmp/hfpublic/http.pid
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >/tmp/hfpublic/cloudflared.log 2>&1 & echo $! >/tmp/hfpublic/cloudflared.pid
          BASE=""
          for i in $(seq 1 90); do
            BASE="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/hfpublic/cloudflared.log | tail -1 || true)"
            [ -n "$BASE" ] && break
            sleep 2
          done
          test -n "$BASE"
          echo "$BASE" | tee /tmp/hfpublic/PUBLIC_BASE_URL.txt
          for i in $(seq 1 60); do
            if curl -fsS --max-time 12 "$BASE/" >/dev/null 2>&1; then break; fi
            [ "$i" -eq 60 ] && { cat /tmp/hfpublic/cloudflared.log; exit 1; }
            sleep 3
          done
          cat > /tmp/hfpublic/public-qa.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');const BASE=fs.readFileSync('/tmp/hfpublic/PUBLIC_BASE_URL.txt','utf8').trim();const R={pass:false,base:BASE,responses:{},observed:{},pages:{}};
          (async()=>{const b=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});
          async function open(path,w=1440,h=900){const q=await b.newPage();await q.setViewport({width:w,height:h,deviceScaleFactor:1,isMobile:w<=900,hasTouch:w<=900});const errors=[];q.on('pageerror',e=>errors.push(String(e)));q.on('console',m=>{if(m.type()==='error')errors.push(m.text())});q.on('response',r=>{const u=r.url();if(u.startsWith(BASE))R.responses[u.slice(BASE.length)]=r.status()});let last;for(let i=0;i<12;i++){try{await q.goto(BASE+path,{waitUntil:'domcontentloaded',timeout:30000});last=null;break}catch(e){last=e;await new Promise(r=>setTimeout(r,2500))}}if(last)throw last;await q.evaluate(()=>document.fonts.ready);return{q,errors}}
          const en=await open('/');await en.q.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:30000});await en.q.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:30000});const es=await en.q.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,logo:document.querySelector('.proai-logo-r341__wordmark').textContent.trim(),cube:document.querySelector('.proai-logo-r341__cube').getBoundingClientRect().width,headerH:document.querySelector('.site-header').getBoundingClientRect().height,cta:document.querySelector('.site-header__cta').textContent.trim(),locale:document.querySelector('.site-header__locale').textContent.trim(),localeHref:document.querySelector('.site-header__locale').getAttribute('href'),hero:document.querySelector('[data-proai-hero-object]').dataset.cubeMounted}));a.equal(es.overflow,0);a.equal(es.logo,'ProAIExpert');a.equal(Math.round(es.cube),36);a.equal(Math.round(es.headerH),76);a.equal(es.cta,'Discuss Project');a.equal(es.locale,'RU');a.equal(es.localeHref,'/ru/');a.equal(es.hero,'true');const frame=en.q.frames().find(f=>f.url().includes('/assets/brand/proai-logo-r341/live.html'));a.ok(frame);await frame.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:30000});const l1=await frame.evaluate(()=>window.__PROAI_LOGO_R341_STATE);await new Promise(r=>setTimeout(r,2200));const l2=await frame.evaluate(()=>window.__PROAI_LOGO_R341_STATE);const speed=(l2.current.yaw-l1.current.yaw)/(l2.elapsedSec-l1.elapsedSec);a.ok(Math.abs(speed-4.5)<.35);a.equal(l2.geometry.pass,true);a.equal(l2.sliceChoreography,false);a.equal(l2.semanticFace,false);a.equal(l2.wordmarkAnimated,false);a.equal(l2.glbUrl,'/assets/models/proai-cube/rubik_39_s_cube_animation.glb');R.observed.logo={speed,state:l2};await en.q.screenshot({path:'/tmp/hfpublic/public-en.png'});await en.q.evaluate(()=>scrollTo(0,700));await new Promise(r=>setTimeout(r,350));R.observed.scroll=await en.q.evaluate(()=>{const h=document.querySelector('.site-header'),s=getComputedStyle(h);return{active:h.classList.contains('is-scrolled'),background:s.backgroundColor,blur:s.backdropFilter,border:s.borderBottomColor}});a.equal(R.observed.scroll.active,true);a.ok(R.observed.scroll.blur.includes('14px'));await en.q.screenshot({path:'/tmp/hfpublic/public-scroll.png'});await en.q.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));await new Promise(r=>setTimeout(r,500));R.observed.footer=await en.q.evaluate(()=>{const f=document.querySelector('.site-footer'),logo=f.querySelector('.site-footer__logo'),img=logo.querySelector('img'),h=f.querySelector('.site-footer__cta h2');return{background:getComputedStyle(f).backgroundColor,logo:logo.textContent.trim(),img:img.complete&&img.naturalWidth>0,animation:getComputedStyle(h).animationName,filter:getComputedStyle(h).filter}});a.equal(R.observed.footer.img,true);a.equal(R.observed.footer.animation,'none');a.equal(R.observed.footer.filter,'none');await en.q.screenshot({path:'/tmp/hfpublic/public-footer.png'});a.equal(en.errors.length,0);await en.q.close();R.observed.header=true;R.observed.livingLogo=true;R.observed.hero=true;R.observed.scrollState=true;R.observed.footerSeen=true;
          const ru=await open('/ru/');await ru.q.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:30000});const rs=await ru.q.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,cta:document.querySelector('.site-header__cta').textContent.trim(),locale:document.querySelector('.site-header__locale').textContent.trim(),localeHref:document.querySelector('.site-header__locale').getAttribute('href'),title:document.querySelector('.proai-hero-title').textContent.replace(/\s+/g,' ').trim()}));a.equal(rs.overflow,0);a.equal(rs.cta,'Обсудить проект');a.equal(rs.locale,'EN');a.equal(rs.localeHref,'/');a.ok(rs.title.includes('результата — одна система.'));a.equal(ru.errors.length,0);await ru.q.screenshot({path:'/tmp/hfpublic/public-ru.png'});await ru.q.close();
          const mob=await open('/',390,844);await mob.q.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:30000});const ms=await mob.q.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,word:document.querySelector('.proai-logo-r341__wordmark').textContent.trim(),menu:getComputedStyle(document.querySelector('.site-header__menu-toggle')).display,actions:[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>{const r=e.getBoundingClientRect();return{top:r.top,left:r.left,right:r.right}}),dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap}));a.equal(ms.overflow,0);a.equal(ms.word,'ProAIExpert');a.notEqual(ms.menu,'none');a.equal(ms.dir,'row');a.equal(ms.wrap,'nowrap');a.ok(Math.abs(ms.actions[0].top-ms.actions[1].top)<=4);await mob.q.click('.site-header__menu-toggle');a.equal(await mob.q.$eval('.site-header__nav',e=>e.classList.contains('is-open')),true);await mob.q.screenshot({path:'/tmp/hfpublic/public-mobile-menu.png'});await mob.q.keyboard.press('Escape');await mob.q.screenshot({path:'/tmp/hfpublic/public-mobile.png'});a.equal(mob.errors.length,0);await mob.q.close();R.observed.mobile=true;
          for(const [path,key,file,w,h] of [['/docs/site-evolution/brand/proai-header-footer-r1/spec.html','spec','public-spec.png',1440,900],['/docs/site-evolution/brand/proai-header-footer-r1/desktop-header.html','desktop','public-desktop-context.png',1600,1000],['/docs/site-evolution/brand/proai-header-footer-r1/mobile-header.html','mobileContext','public-mobile-context.png',900,1000],['/docs/site-evolution/brand/proai-header-footer-r1/footer-context.html','footerContext','public-footer-context.png',1600,1000],['/docs/site-evolution/brand/proai-header-footer-r1/scroll-state.html','scrollBoard','public-scroll-board.png',1600,850]]){const x=await open(path,w,h);await new Promise(r=>setTimeout(r,2200));a.equal(x.errors.length,0);R.pages[key]=true;await x.q.screenshot({path:'/tmp/hfpublic/'+file,fullPage:true});await x.q.close()}
          for(const key of ['/assets/css/header-footer-logo-r1.css','/assets/js/header-footer-logo-r1.js','/assets/brand/proai-logo-r341/live-runtime.js','/assets/models/proai-cube/rubik_39_s_cube_animation.glb'])a.ok([200,304].includes(R.responses[key]),`${key} response ${R.responses[key]}`);
          R.pass=true;fs.writeFileSync('/tmp/hfpublic/public-qa.json',JSON.stringify(R,null,2));await b.close();console.log('PUBLIC_HEADER_FOOTER_R1=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/hfpublic/public-qa.cjs
          cat > /tmp/hfpublic/OWNER_URLS.txt <<EOF
          1. FULL SITE — EN
          $BASE/
          2. FULL SITE — RU
          $BASE/ru/
          3. HEADER FINAL SPEC BOARD
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/spec.html
          4. DESKTOP HEADER CONTEXT
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/desktop-header.html
          5. MOBILE HEADER CONTEXT
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/mobile-header.html
          6. FOOTER CONTEXT
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/footer-context.html
          7. HEADER SCROLL-STATE COMPARISON
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/scroll-state.html
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: proai-header-footer-r1-public-owner-review
          path: /tmp/hfpublic
          retention-days: 7
      - name: Keep owner review alive
        shell: bash
        run: sleep 12600
