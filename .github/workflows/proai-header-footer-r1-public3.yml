name: ProAI Header Footer R1 Public Owner Review Final
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-footer-r1-public3.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-header-footer-logo-r1
          fetch-depth: 0
      - name: Verify source locks
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 671186769f5ea88d3a36ef7ce199bddd555a0c3e HEAD
          git merge-base --is-ancestor 735982473854c29a6f1eeeb4d87773abbc573b4d HEAD
          test "$(git rev-parse 671186769f5ea88d3a36ef7ce199bddd555a0c3e:assets/css/homepage-hero-signature-r3.css)" = "$(git rev-parse HEAD:assets/css/homepage-hero-signature-r3.css)"
          test "$(git rev-parse 671186769f5ea88d3a36ef7ce199bddd555a0c3e:assets/js/proai-hero-cube-r1/bootstrap.js)" = "$(git rev-parse HEAD:assets/js/proai-hero-cube-r1/bootstrap.js)"
          test "$(git rev-parse 671186769f5ea88d3a36ef7ce199bddd555a0c3e:assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "$(git rev-parse HEAD:assets/js/proai-hero-cube-r1/source-materials-r1.js)"
          echo "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b  assets/models/proai-cube/rubik_39_s_cube_animation.glb" | sha256sum -c -
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Build public review
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          curl -fsSL --retry 4 --retry-delay 2 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          jekyll build --source . --destination _site >/dev/null
      - name: Public browser self-check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hfpublic
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/hfpublic/http.log 2>&1 &
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >/tmp/hfpublic/cloudflared.log 2>&1 &
          BASE=""
          for i in $(seq 1 90); do BASE="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/hfpublic/cloudflared.log | tail -1 || true)"; [ -n "$BASE" ] && break; sleep 2; done
          test -n "$BASE"; echo "$BASE" | tee /tmp/hfpublic/PUBLIC_BASE_URL.txt
          for i in $(seq 1 60); do if curl -fsS --max-time 12 "$BASE/" >/dev/null 2>&1; then break; fi; [ "$i" -eq 60 ] && exit 1; sleep 3; done
          for P in / /ru/ /assets/css/header-footer-logo-r1.css /assets/js/header-footer-logo-r1.js /assets/brand/proai-logo-r341/live-runtime.js /assets/models/proai-cube/rubik_39_s_cube_animation.glb /docs/site-evolution/brand/proai-header-footer-r1/spec.html /docs/site-evolution/brand/proai-header-footer-r1/desktop-header.html /docs/site-evolution/brand/proai-header-footer-r1/mobile-header.html /docs/site-evolution/brand/proai-header-footer-r1/footer-context.html /docs/site-evolution/brand/proai-header-footer-r1/scroll-state.html; do curl -fsS --max-time 20 "$BASE$P" >/dev/null; done
          cat > /tmp/hfpublic/check.cjs <<'JS'
          const pp=require('puppeteer-core'),a=require('assert').strict,fs=require('fs');const B=fs.readFileSync('/tmp/hfpublic/PUBLIC_BASE_URL.txt','utf8').trim(),R={pass:false,base:B,observed:{},pages:{}};
          (async()=>{const br=await pp.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader']});
          async function open(path,w=1440,h=900){const p=await br.newPage();await p.setViewport({width:w,height:h,deviceScaleFactor:1,isMobile:w<=900,hasTouch:w<=900});const errors=[];p.on('pageerror',e=>errors.push(String(e)));let last;for(let i=0;i<15;i++){try{await p.goto(B+path,{waitUntil:'domcontentloaded',timeout:30000});last=null;break}catch(e){last=e;await new Promise(r=>setTimeout(r,2200))}}if(last)throw last;await p.evaluate(()=>document.fonts.ready);return{p,errors}}
          const en=await open('/');await en.p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:30000});await en.p.waitForFunction(()=>document.querySelector('[data-proai-live-logo]')?.dataset.logoState==='live',{timeout:30000});let s=await en.p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,headerH:document.querySelector('.site-header').getBoundingClientRect().height,cube:document.querySelector('.proai-logo-r341__cube').getBoundingClientRect().width,word:document.querySelector('.proai-logo-r341__wordmark').textContent.trim(),cta:document.querySelector('.site-header__cta').textContent.trim(),locale:document.querySelector('.site-header__locale').textContent.trim(),hero:document.querySelector('[data-proai-hero-object]').dataset.cubeMounted,topBg:getComputedStyle(document.querySelector('.site-header')).backgroundColor,topBorder:getComputedStyle(document.querySelector('.site-header')).borderBottomColor}));a.equal(s.overflow,0);a.equal(Math.round(s.headerH),76);a.equal(Math.round(s.cube),36);a.equal(s.word,'ProAIExpert');a.equal(s.cta,'Discuss Project');a.equal(s.locale,'RU');a.equal(s.hero,'true');const f=en.p.frames().find(x=>x.url().includes('/assets/brand/proai-logo-r341/live.html'));a.ok(f);await f.waitForFunction(()=>window.__PROAI_LOGO_R341_STATE?.ready,{timeout:30000});const l1=await f.evaluate(()=>window.__PROAI_LOGO_R341_STATE);await new Promise(r=>setTimeout(r,2200));const l2=await f.evaluate(()=>window.__PROAI_LOGO_R341_STATE),speed=(l2.current.yaw-l1.current.yaw)/(l2.elapsedSec-l1.elapsedSec);a.ok(Math.abs(speed-4.5)<.35);a.equal(l2.geometry.pass,true);a.equal(l2.sliceChoreography,false);a.equal(l2.semanticFace,false);a.equal(l2.wordmarkAnimated,false);R.observed.logo={speed,geometryPass:true,wholeCube:true};await en.p.screenshot({path:'/tmp/hfpublic/public-en.png'});await en.p.evaluate(()=>scrollTo(0,700));await new Promise(r=>setTimeout(r,550));const sc=await en.p.evaluate(()=>{const h=document.querySelector('.site-header'),cs=getComputedStyle(h);return{active:h.classList.contains('is-scrolled'),background:cs.backgroundColor,border:cs.borderBottomColor,blur:cs.backdropFilter||''}});a.equal(sc.active,true);a.notEqual(sc.background,s.topBg);a.notEqual(sc.border,s.topBorder);R.observed.scroll=sc;await en.p.screenshot({path:'/tmp/hfpublic/public-scroll.png'});await en.p.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight));await new Promise(r=>setTimeout(r,550));const foot=await en.p.evaluate(()=>{const f=document.querySelector('.site-footer'),h=f.querySelector('.site-footer__cta h2'),img=f.querySelector('.site-footer__logo img');return{background:getComputedStyle(f).backgroundColor,animation:getComputedStyle(h).animationName,filter:getComputedStyle(h).filter,img:img.complete&&img.naturalWidth>0}});a.equal(foot.animation,'none');a.equal(foot.filter,'none');a.equal(foot.img,true);R.observed.footer=foot;await en.p.screenshot({path:'/tmp/hfpublic/public-footer.png'});a.equal(en.errors.length,0);await en.p.close();R.observed.header=true;R.observed.hero=true;R.observed.livingLogo=true;R.observed.footerSeen=true;
          const ru=await open('/ru/');await ru.p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:30000});s=await ru.p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,cta:document.querySelector('.site-header__cta').textContent.trim(),locale:document.querySelector('.site-header__locale').textContent.trim(),title:document.querySelector('.proai-hero-title').textContent.replace(/\s+/g,' ').trim()}));a.equal(s.overflow,0);a.equal(s.cta,'Обсудить проект');a.equal(s.locale,'EN');a.ok(s.title.includes('результата — одна система.'));a.equal(ru.errors.length,0);await ru.p.screenshot({path:'/tmp/hfpublic/public-ru.png'});await ru.p.close();
          const m=await open('/',390,844);await m.p.waitForFunction(()=>document.querySelector('[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:30000});s=await m.p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,menu:getComputedStyle(document.querySelector('.site-header__menu-toggle')).display,acts:[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>{const r=e.getBoundingClientRect();return{top:r.top,left:r.left,right:r.right}}),dir:getComputedStyle(document.querySelector('.proai-hero-actions')).flexDirection,wrap:getComputedStyle(document.querySelector('.proai-hero-actions')).flexWrap}));a.equal(s.overflow,0);a.notEqual(s.menu,'none');a.equal(s.dir,'row');a.equal(s.wrap,'nowrap');a.ok(Math.abs(s.acts[0].top-s.acts[1].top)<=4);await m.p.click('.site-header__menu-toggle');a.equal(await m.p.$eval('.site-header__nav',e=>e.classList.contains('is-open')),true);await m.p.screenshot({path:'/tmp/hfpublic/public-mobile-menu.png'});await m.p.keyboard.press('Escape');await m.p.screenshot({path:'/tmp/hfpublic/public-mobile.png'});a.equal(m.errors.length,0);await m.p.close();R.observed.mobile=true;
          const pages=[['spec','/docs/site-evolution/brand/proai-header-footer-r1/spec.html','public-spec.png',1440,900],['desktop','/docs/site-evolution/brand/proai-header-footer-r1/desktop-header.html','public-desktop-context.png',1600,1000],['mobile','/docs/site-evolution/brand/proai-header-footer-r1/mobile-header.html','public-mobile-context.png',900,1000],['footer','/docs/site-evolution/brand/proai-header-footer-r1/footer-context.html','public-footer-context.png',1600,1000],['scroll','/docs/site-evolution/brand/proai-header-footer-r1/scroll-state.html','public-scroll-board.png',1600,850]];for(const [k,u,n,w,h] of pages){const x=await open(u,w,h);await new Promise(r=>setTimeout(r,2600));a.equal(x.errors.length,0);await x.p.screenshot({path:'/tmp/hfpublic/'+n,fullPage:true});R.pages[k]=true;await x.p.close()}
          R.pass=true;fs.writeFileSync('/tmp/hfpublic/public-qa.json',JSON.stringify(R,null,2));await br.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/hfpublic/check.cjs
          cat > /tmp/hfpublic/OWNER_URLS.txt <<EOF
          1. FULL SITE — EN
          $BASE/
          2. FULL SITE — RU
          $BASE/ru/
          3. HEADER FINAL SPEC BOARD
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/spec.html
          4. DESKTOP HEADER CONTEXT
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/desktop-header.html
          5. MOBILE HEADER CONTEXT
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/mobile-header.html
          6. FOOTER CONTEXT
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/footer-context.html
          7. HEADER SCROLL-STATE COMPARISON
          $BASE/docs/site-evolution/brand/proai-header-footer-r1/scroll-state.html
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: proai-header-footer-r1-public-owner-review-final
          path: /tmp/hfpublic
          retention-days: 7
      - name: Keep owner review alive
        shell: bash
        run: sleep 12600
