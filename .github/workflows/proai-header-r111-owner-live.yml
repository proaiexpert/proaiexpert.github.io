name: ProAI Header R1.1.1 Stable Owner Live
on:
  push:
    branches: [agent/proai-header-footer-logo-r1]
    paths: [.github/workflows/proai-header-r111-owner-live.yml]
permissions:
  contents: read
jobs:
  owner-live:
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify immutable product and production locks
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=29b06daed210442171093ba7601cf183d02706e0
          R1=d147d9675c945dbba1ec5a610f33045e2338ecae
          git merge-base --is-ancestor "$PRODUCT" HEAD
          PRODUCT_FILES="$(git diff-tree --no-commit-id --name-only -r "$PRODUCT" | sort)"
          EXPECTED=$'_includes/header-system/header.html\nassets/brand/proai-logo-r341/live-runtime.js\nassets/brand/proai-logo-r341/proai-header-r111-static-cube-320.png\nassets/js/header-footer-logo-r1.js'
          test "$PRODUCT_FILES" = "$EXPECTED"
          for P in _includes/footer-commercial-v1.html assets/js/header-system-v1.js assets/css/header-footer-logo-r1.css assets/css/homepage-hero-signature-r3.css assets/js/proai-hero-cube-r1/bootstrap.js assets/js/proai-hero-cube-r1/source-materials-r1.js index.html ru/index.html _data/header.yml; do
            test "$(git rev-parse "$R1:$P")" = "$(git rev-parse "HEAD:$P")"
          done
          echo "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b  assets/models/proai-cube/rubik_39_s_cube_animation.glb" | sha256sum -c -
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
          grep -q 'yawSpeed:8.5' assets/brand/proai-logo-r341/live-runtime.js
          grep -q 'pitchAmplitude:5' assets/brand/proai-logo-r341/live-runtime.js
          grep -q 'rollAmplitude:.75' assets/brand/proai-logo-r341/live-runtime.js
          grep -q "Math.min(4,Math.max(3,window.devicePixelRatio||1))" assets/brand/proai-logo-r341/live-runtime.js
          grep -q 'proai-header-r111-static-cube-320.png' _includes/header-system/header.html
          grep -q 'startup=controlled' _includes/header-system/header.html
      - name: Build actual full site and start public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"; export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          curl -fsSL --retry 4 --retry-delay 2 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          jekyll build --source . --destination _site >/dev/null
          OUT=/tmp/r111-owner-live
          mkdir -p "$OUT"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >"$OUT/http.log" 2>&1 &
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >"$OUT/cloudflared.log" 2>&1 &
          BASE=""
          for i in $(seq 1 90); do BASE="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' "$OUT/cloudflared.log" | tail -1 || true)"; [ -n "$BASE" ] && break; sleep 2; done
          test -n "$BASE"
          for i in $(seq 1 60); do if curl -fsS --max-time 15 "$BASE/" >/dev/null 2>&1; then break; fi; [ "$i" -eq 60 ] && exit 1; sleep 3; done
          for P in / /ru/ /assets/brand/proai-logo-r341/live.html?mode=living\&startup=controlled /assets/brand/proai-logo-r341/live-runtime.js /assets/brand/proai-logo-r341/proai-header-r111-static-cube-320.png; do curl -fsS --retry 5 --retry-delay 2 --max-time 25 "$BASE$P" >/dev/null; done
          printf 'FULL SITE EN\n%s/\nFULL SITE RU\n%s/ru/\nEXPECTED LIFETIME\n3.5 hours from keepalive start\n' "$BASE" "$BASE" | tee "$OUT/OWNER_URLS.txt"
          printf '%s\n' "$BASE" > "$OUT/PUBLIC_BASE_URL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: proai-header-r111-stable-owner-live
          path: /tmp/r111-owner-live
          retention-days: 7
      - name: Keep owner review alive
        shell: bash
        run: sleep 12600
