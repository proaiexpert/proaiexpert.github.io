name: ProAI Home Golden Assembly R1 Final Owner Review

on:
  push:
    branches:
      - agent/proai-home-golden-assembly-r1-final-owner-review

permissions:
  contents: read
  statuses: write

concurrency:
  group: proai-home-golden-assembly-r1-final-owner-review
  cancel-in-progress: false

jobs:
  owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      GOLDEN_PRODUCT_SHA: 9128ce0690062755f1a5e229b44ce3ad98465d69
      GOLDEN_DOC_HEAD: 1af1cce6e98d1f606489dbd3078f7b21515b4191
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      REVIEW_WORKFLOW: .github/workflows/proai-home-golden-assembly-r1-final-owner-review.yml
      SITE_ROOT: /tmp/proai-golden-product
      SITE_DIR: /tmp/proai-golden-product/_site

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Golden lock and exact product worktree
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GOLDEN_DOC_HEAD" HEAD
          test "$(git diff --name-only "$GOLDEN_DOC_HEAD"..HEAD)" = "$REVIEW_WORKFLOW"
          git cat-file -e "$GOLDEN_PRODUCT_SHA^{commit}"
          git merge-base --is-ancestor "$GOLDEN_PRODUCT_SHA" "$GOLDEN_DOC_HEAD"
          test "$(git diff --name-only "$GOLDEN_PRODUCT_SHA".."$GOLDEN_DOC_HEAD")" = "docs/site-evolution/PROAI_HOME_GOLDEN_COMPONENT_MANIFEST.md"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse "$GOLDEN_PRODUCT_SHA:assets/js/proai-hero-cube-r1/bootstrap.js")" = "b46b26164efc000daef8ecb3416039008db7cd79"
          test "$(git rev-parse "$GOLDEN_PRODUCT_SHA:assets/js/proai-hero-cube-r1/source-materials-r1.js")" = "bab6b00e73b20fc2a51aeb00cb7fc08f16129e72"
          test "$(git rev-parse "$GOLDEN_PRODUCT_SHA:assets/models/proai-cube/rubik_39_s_cube_animation.glb")" = "7992019d85304c16244d0ca55a8cf15c13c26190"
          test "$(git rev-parse "$GOLDEN_PRODUCT_SHA:assets/js/homepage-connected-system-r13.js")" = "8fba38d49366bb69b7e06f9527dd4d07d8d05279"
          test "$(git rev-parse "$GOLDEN_PRODUCT_SHA:assets/css/homepage-connected-system-r13.css")" = "b99dfc19739070fee88d47c94c202d60feab7619"
          test "$(git rev-parse "$GOLDEN_PRODUCT_SHA:assets/js/homepage-two-worlds-r22.js")" = "1983ba4bef7816501a7605293a95b828d3748b06"
          test "$(git rev-parse "$GOLDEN_PRODUCT_SHA:assets/css/homepage-two-worlds-r22.css")" = "63e9d73d4ecad2c339ac42a61b0cdf39663894b2"
          rm -rf "$SITE_ROOT"
          git worktree add --detach "$SITE_ROOT" "$GOLDEN_PRODUCT_SHA"
          test "$(git -C "$SITE_ROOT" rev-parse HEAD)" = "$GOLDEN_PRODUCT_SHA"
          test "$(sha256sum "$SITE_ROOT/assets/models/proai-cube/rubik_39_s_cube_animation.glb" | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"

      - name: Build, serve, and install Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          jekyll build --source "$SITE_ROOT" --destination "$SITE_DIR"
          test -s "$SITE_DIR/index.html"
          test -s "$SITE_DIR/ru/index.html"
          python3 -m http.server 4000 --bind 127.0.0.1 --directory "$SITE_DIR" >/tmp/proai-owner-http.log 2>&1 &
          echo $! >/tmp/proai-owner-http.pid
          for i in $(seq 1 30); do
            en=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ || true)
            ru=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ru/ || true)
            if [ "$en" = 200 ] && [ "$ru" = 200 ]; then break; fi
            sleep 1
          done
          test "$en" = 200
          test "$ru" = 200
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p /tmp/proai-owner-review-node
          cd /tmp/proai-owner-review-node
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24.16.0 >/dev/null

      - name: Short local Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/proai-owner-review-node/local.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const base='http://127.0.0.1:4000';
          const fatal=[],failed=[];
          const fatalRe=/GLB load failed|initialization failed|Uncaught|TypeError|ReferenceError|SyntaxError/i;
          function wire(p,l){
            p.on('pageerror',e=>fatal.push(`${l}: ${e.message}`));
            p.on('console',m=>{if(m.type()==='error'&&fatalRe.test(m.text()))fatal.push(`${l}: ${m.text()}`)});
            p.on('requestfailed',r=>{const u=r.url();if(u.startsWith(base)&&/\.(js|css|glb)(\?|$)/i.test(u))failed.push(`${l}: ${u} ${r.failure()?.errorText||''}`)});
            p.on('response',r=>{const u=r.url();if(u.startsWith(base)&&/\.(js|css|glb)(\?|$)/i.test(u)&&r.status()>=400)failed.push(`${l}: HTTP ${r.status()} ${u}`)});
          }
          async function check(b,route,label){
            const p=await b.newPage();wire(p,label);await p.setCacheEnabled(false);await p.setViewport({width:1440,height:900,deviceScaleFactor:1});await p.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'no-preference'}]);
            const r=await p.goto(base+route,{waitUntil:'domcontentloaded',timeout:45000});
            await p.waitForFunction(()=>window.__PROAI_HERO_CUBE_R1?.runtime?.ready===true&&document.querySelector('.proai-hero-object-slot[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:45000});
            const s=await p.evaluate(()=>({header:document.querySelectorAll('header[data-site-header],header.global-header').length,hero:document.querySelectorAll('#hero').length,cube:document.querySelectorAll('#cube-canvas').length,connected:document.querySelectorAll('[data-connected-system]').length,two:document.querySelectorAll('[data-tw-r2]').length,ready:window.__PROAI_HERO_CUBE_R1?.runtime?.ready===true}));
            await p.close();
            if((r?.status()||0)!==200||!s.ready||s.header!==1||s.hero!==1||s.cube!==1||s.connected!==1||s.two!==1)throw new Error(`${label} ${JSON.stringify(s)}`);
          }
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-gpu-blocklist','--enable-webgl','--enable-unsafe-swiftshader','--use-angle=swiftshader']});try{await check(b,'/','EN');await check(b,'/ru/','RU');if(fatal.length||failed.length)throw new Error(`fatal=${JSON.stringify(fatal)} failed=${JSON.stringify(failed)}`);console.log('LOCAL_EN=PASS');console.log('LOCAL_RU=PASS')}finally{await b.close()}})().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/proai-owner-review-node/local.cjs

      - name: Start TryCloudflare tunnel and wait for DNS/HTTP readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          : >/tmp/cloudflared-r2.log
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4000 >/tmp/cloudflared-r2.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          PUBLIC_URL=""
          en=000
          ru=000
          for i in $(seq 1 90); do
            PUBLIC_URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-r2.log | head -n1 || true)
            if [ -n "$PUBLIC_URL" ]; then
              en=$(curl -L -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
              ru=$(curl -L -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/ru/" || true)
              if [ "$en" = 200 ] && [ "$ru" = 200 ]; then break; fi
            fi
            sleep 1
          done
          test -n "$PUBLIC_URL"
          test "$en" = 200
          test "$ru" = 200
          kill -0 "$(cat /tmp/cloudflared.pid)"
          printf '%s\n' "$PUBLIC_URL" >/tmp/OWNER_REVIEW_URL.txt
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
          echo "PUBLIC_EN_HTTP=$en"
          echo "PUBLIC_RU_HTTP=$ru"
          echo "OWNER_REVIEW_EN=$PUBLIC_URL/"
          echo "OWNER_REVIEW_RU=$PUBLIC_URL/ru/"

      - name: Public EN and RU Chromium structural verification
        id: public
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/proai-owner-review-node/public.cjs <<'NODE'
          const puppeteer=require('puppeteer-core');
          const base=process.env.PUBLIC_URL;
          const fatal=[],failed=[];
          const fatalRe=/GLB load failed|initialization failed|Uncaught|TypeError|ReferenceError|SyntaxError/i;
          function wire(p,l){
            p.on('pageerror',e=>fatal.push(`${l}: pageerror: ${e.message}`));
            p.on('console',m=>{if(m.type()==='error'&&fatalRe.test(m.text()))fatal.push(`${l}: console: ${m.text()}`)});
            p.on('requestfailed',r=>{const u=r.url();if(u.startsWith(base)&&/\.(js|css|glb)(\?|$)/i.test(u))failed.push(`${l}: ${u} ${r.failure()?.errorText||''}`)});
            p.on('response',r=>{const u=r.url();if(u.startsWith(base)&&/\.(js|css|glb)(\?|$)/i.test(u)&&r.status()>=400)failed.push(`${l}: HTTP ${r.status()} ${u}`)});
          }
          async function check(b,route,label){
            const p=await b.newPage();wire(p,label);await p.setCacheEnabled(false);await p.setViewport({width:1440,height:900,deviceScaleFactor:1});await p.emulateMediaFeatures([{name:'prefers-reduced-motion',value:'no-preference'}]);
            const r=await p.goto(base+route,{waitUntil:'domcontentloaded',timeout:45000});
            await p.waitForFunction(()=>window.__PROAI_HERO_CUBE_R1?.runtime?.ready===true&&document.querySelector('.proai-hero-object-slot[data-proai-hero-object]')?.dataset.cubeMounted==='true',{timeout:45000});
            const s=await p.evaluate(()=>({
              httpStatus:0,
              header:document.querySelectorAll('header[data-site-header],header.global-header').length,
              hero:document.querySelectorAll('#hero').length,
              cube:document.querySelectorAll('#cube-canvas').length,
              connected:document.querySelectorAll('[data-connected-system]').length,
              two:document.querySelectorAll('[data-tw-r2]').length,
              ready:window.__PROAI_HERO_CUBE_R1?.runtime?.ready===true
            }));
            s.httpStatus=r?.status()||0;
            await p.close();
            if(s.httpStatus!==200||!s.ready||s.header!==1||s.hero!==1||s.cube!==1||s.connected!==1||s.two!==1)throw new Error(`${label} structural ${JSON.stringify(s)}`);
            console.log(`${label}_STATE=${JSON.stringify(s)}`);
            return s;
          }
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--ignore-gpu-blocklist','--enable-webgl','--enable-unsafe-swiftshader','--use-angle=swiftshader']});
            try{
              const en=await check(b,'/','PUBLIC_EN');
              const ru=await check(b,'/ru/','PUBLIC_RU');
              if(fatal.length||failed.length)throw new Error(`fatal=${JSON.stringify(fatal)} failed=${JSON.stringify(failed)}`);
              console.log(`PUBLIC_STRUCTURAL_RESULT=${JSON.stringify({en,ru,fatal,failed})}`);
              console.log('PUBLIC_EN_CHROMIUM_STRUCTURAL=PASS');
              console.log('PUBLIC_RU_CHROMIUM_STRUCTURAL=PASS');
            }finally{await b.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/proai-owner-review-node/public.cjs

      - name: Publish live Owner review URL
        if: ${{ steps.public.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_URL=$(cat /tmp/OWNER_REVIEW_URL.txt)
          echo "OWNER_REVIEW_EN=$PUBLIC_URL/"
          echo "OWNER_REVIEW_RU=$PUBLIC_URL/ru/"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"success\",\"context\":\"proai/final-owner-review-live-r2\",\"description\":\"EN+RU public structural Chromium PASS; 90m Owner review active\",\"target_url\":\"$PUBLIC_URL/\"}" >/dev/null

      - name: Publish failure status
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "{\"state\":\"failure\",\"context\":\"proai/final-owner-review-live-r2\",\"description\":\"PUBLIC TRANSPORT FAILURE\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null

      - name: Keep Owner review tunnel alive for 90 minutes
        if: ${{ steps.public.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          kill -0 "$(cat /tmp/proai-owner-http.pid)"
          kill -0 "$(cat /tmp/cloudflared.pid)"
          echo "OWNER_REVIEW_WINDOW_SECONDS=5400"
          echo "OWNER_REVIEW_URL=$(cat /tmp/OWNER_REVIEW_URL.txt)"
          sleep 5400
