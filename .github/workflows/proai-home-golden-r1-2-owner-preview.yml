name: Golden R1.2 Owner Preview QA Pending

on:
  push:
    branches:
      - agent/proai-home-golden-assembly-r1-2-recovery

permissions:
  contents: write

jobs:
  owner-preview:
    if: ${{ startsWith(github.event.head_commit.message, 'review-preview-run:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated recovery branch
        uses: actions/checkout@v6
        with:
          ref: agent/proai-home-golden-assembly-r1-2-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build immutable Owner preview
        shell: bash
        run: |
          set -Eeuo pipefail
          PRODUCT_SHA='a876dfb178fd3f020c8392b336eae62253f89ae7'
          REVIEW_DIR='docs/site-evolution/reviews/proai-home-golden-assembly-r1-2'
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          PRODUCT_SHA="$PRODUCT_SHA" python "$REVIEW_DIR/generate-owner-preview.py"
          mkdir -p "$REVIEW_DIR/media"
          python3 -m http.server 4174 --directory . >/tmp/golden-owner-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          ok=0
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:4174/$REVIEW_DIR/index.html?lang=en" >/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          REVIEW_BASE="http://127.0.0.1:4174/$REVIEW_DIR/" node "$REVIEW_DIR/smoke-owner-preview.mjs"
          git config user.name 'proai-golden-preview-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            "$REVIEW_DIR/index.html" \
            "$REVIEW_DIR/owner-review-en.html" \
            "$REVIEW_DIR/owner-review-ru.html" \
            "$REVIEW_DIR/owner-preview-smoke.json" \
            "$REVIEW_DIR/media/owner-preview-smoke-en-390x844.png" \
            "$REVIEW_DIR/media/owner-preview-smoke-ru-390x844.png"
          git commit -m 'review-preview: Golden R1.2 immutable Owner preview — QA pending'
          git push origin HEAD:agent/proai-home-golden-assembly-r1-2-recovery
          REVIEW_SHA="$(git rev-parse HEAD)"
          echo "REVIEW_SHA=$REVIEW_SHA" >> "$GITHUB_ENV"
          echo "REVIEW_DIR=$REVIEW_DIR" >> "$GITHUB_ENV"

      - name: Verify immutable GitHub paths
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in index.html owner-review-en.html owner-review-ru.html owner-preview-smoke.json; do
            curl -fsSL "https://raw.githubusercontent.com/proaiexpert/proaiexpert.github.io/${REVIEW_SHA}/${REVIEW_DIR}/${file}" >/tmp/${file//\//_}
          done
          grep -q 'OWNER PREVIEW — QA PENDING' /tmp/owner-review-en.html
          grep -q 'OWNER PREVIEW — QA PENDING' /tmp/owner-review-ru.html
          grep -q 'a876dfb178fd3f020c8392b336eae62253f89ae7' /tmp/owner-review-en.html
          grep -q 'a876dfb178fd3f020c8392b336eae62253f89ae7' /tmp/owner-review-ru.html

      - name: Attempt raw.githack browser self-open
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          BASE="https://raw.githack.com/proaiexpert/proaiexpert.github.io/${REVIEW_SHA}/${REVIEW_DIR}/"
          ok=0
          for i in {1..18}; do
            if curl -fsSL "${BASE}owner-review-en.html" | grep -q 'OWNER PREVIEW — QA PENDING'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          WRITE_REPORT=0 WRITE_SCREENSHOTS=0 REVIEW_BASE="$BASE" node "$REVIEW_DIR/smoke-owner-preview.mjs"
