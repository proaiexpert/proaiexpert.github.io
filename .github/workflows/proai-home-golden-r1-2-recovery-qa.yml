name: ProAI Golden Assembly R1.2 Recovery QA

on:
  push:
    branches:
      - agent/proai-home-golden-assembly-r1-2-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'qa-evidence:') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v6
        with:
          ref: agent/proai-home-golden-assembly-r1-2-recovery
          fetch-depth: 0

      - name: Build real Jekyll product
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium QA runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve real Jekyll output
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/golden-r12-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/golden-r12-http.log
          exit 1

      - name: Run 390x844 forensic mobile gate
        id: mobile
        continue-on-error: true
        shell: bash
        run: node docs/site-evolution/reviews/proai-home-golden-assembly-r1-2/run-mobile-gate.mjs

      - name: Persist mobile diagnostic evidence
        if: always()
        shell: bash
        run: |
          git config user.name "ProAI QA Bot"
          git config user.email "proai.expert2026@gmail.com"
          git add -- docs/site-evolution/reviews/proai-home-golden-assembly-r1-2/mobile-gate.json
          git add -- docs/site-evolution/reviews/proai-home-golden-assembly-r1-2/media/00-mobile-gate-en-390x844.png
          if git diff --cached --quiet; then
            echo "No mobile diagnostic evidence changes."
            exit 0
          fi
          git commit -m "qa-evidence: capture Golden R1.2 mobile gate for $GITHUB_SHA"
          git push origin HEAD:agent/proai-home-golden-assembly-r1-2-recovery

      - name: Upload mobile diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proai-golden-r1-2-mobile-diagnostic-${{ github.sha }}
          path: |
            docs/site-evolution/reviews/proai-home-golden-assembly-r1-2/mobile-gate.json
            docs/site-evolution/reviews/proai-home-golden-assembly-r1-2/media/00-mobile-gate-en-390x844.png
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce mobile gate result
        if: always()
        shell: bash
        run: test "${{ steps.mobile.outcome }}" = "success"
