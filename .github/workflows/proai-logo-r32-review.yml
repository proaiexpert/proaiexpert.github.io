name: ProAI Logo R3.2 Owner Review

on:
  push:
    branches: [agent/proai-logo-signature-object-r2]

permissions:
  contents: read

jobs:
  owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify production safety and canonical Cube
        shell: bash
        run: |
          set -euo pipefail
          R='docs/site-evolution/brand/proai-logo-canonical-cube-r3'
          G="$R/assets/rubik_39_s_cube_animation-DvywXmYB.glb"
          test "$(wc -c < "$G")" -eq 279412
          test "$(sha256sum "$G" | awk '{print $1}')" = 'dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b'
          test "$(git rev-parse origin/main)" = 'c945084e1952c05c686494091f7dbca0f7acdf08'
          test -z "$(git diff --name-only c945084e1952c05c686494091f7dbca0f7acdf08...HEAD -- _includes assets/css index.html ru/index.html favicon.svg favicon.ico site.webmanifest manifest.json)"
          grep -q 'ProAI Expert' "$R/r32-static.html"
          grep -q 'ProAI Expert' "$R/r32-living.html"
          ! grep -qi '#5de2ff' "$R/r32.css"
          ! grep -qi 'text-shadow' "$R/r32.css"

      - name: Install browser and start review server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r32qa /tmp/r32-evidence
          cd /tmp/r32qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory docs/site-evolution/brand/proai-logo-canonical-cube-r3 >/tmp/r32-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/r32-static.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/r32-http.log
          exit 1

      - name: Browser QA and evidence
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/r32qa/qa.cjs <<'NODE'
          const {chromium}=require('/tmp/r32qa/node_modules/playwright');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'];
          const base='http://127.0.0.1:4173/';
          const qdist=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
          (async()=>{const browser=await chromium.launch({headless:true,args});try{
            const ctx=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'no-preference'});
            async function open(path){const p=await ctx.newPage();await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__PROAI_LOGO_R32?.ready===true,null,{timeout:90000});return p}
            const s=await open('r32-static.html?capture');
            const st=await s.evaluate(()=>{const c=document.querySelector('.r32-cube-frame').getBoundingClientRect(),w=document.querySelector('.r32-wordmark').getBoundingClientRect(),cs=getComputedStyle(document.querySelector('.r32-wordmark')),api=window.__PROAI_CUBE_R1_2;return{text:document.querySelector('.r32-wordmark').textContent.trim().replace(/\s+/g,' '),cube:[c.x,c.y,c.width,c.height],word:[w.x,w.y,w.width,w.height],font:cs.fontFamily,weight:cs.fontWeight,transform:cs.textTransform,diag:api.getDiagnostics(),logo:window.__PROAI_LOGO_R32,pose:api.getSemanticPoseAt(50),sample:api.getReviewPresentationSample(50)}});
            assert(st.text==='ProAI Expert','mixed case');assert(st.transform==='none','uppercase transform');assert(st.font.includes('Instrument Sans'),'font');assert(st.weight==='700','weight');assert(st.cube[0]+st.cube[2]<st.word[0],'cube left');assert(st.diag.geometry?.pass===true,'geometry');assert(st.diag.scheduler.enabled===false,'slice scheduler');assert(st.logo.geometryModified===false,'geometry changed');assert(st.logo.home.timeSec===50,'home');
            await s.screenshot({path:'/tmp/r32-evidence/static.png',fullPage:true});await s.close();

            const h=await open('r32-lockup.html?scale=header&capture');
            const hm=await h.evaluate(()=>{const c=document.querySelector('.r32-cube-frame').getBoundingClientRect(),w=document.querySelector('.r32-wordmark').getBoundingClientRect();return{text:document.querySelector('.r32-wordmark').textContent.trim().replace(/\s+/g,' '),cube:c.width,wordHeight:w.height,overflow:document.documentElement.scrollWidth-innerWidth,logo:window.__PROAI_LOGO_R32}});
            assert(hm.text==='ProAI Expert'&&Math.abs(hm.cube-28)<.2&&hm.overflow<=1,'header contract');await h.close();
            const hp=await ctx.newPage();await hp.goto(base+'r32-header.html',{waitUntil:'networkidle',timeout:90000});assert((await hp.evaluate(()=>document.documentElement.scrollWidth-innerWidth))<=1,'desktop overflow');await hp.screenshot({path:'/tmp/r32-evidence/header.png',fullPage:true});await hp.close();

            const cmp=await ctx.newPage();await cmp.goto(base+'r32-compare.html',{waitUntil:'networkidle',timeout:90000});await cmp.screenshot({path:'/tmp/r32-evidence/compare.png',fullPage:true});await cmp.close();
            const card=await open('r32-business-card.html?capture');await card.screenshot({path:'/tmp/r32-evidence/business-card.png',fullPage:true});await card.close();

            const l=await open('r32-living.html?capture');
            const before=await l.evaluate(()=>{const w=document.querySelector('.r32-wordmark').getBoundingClientRect(),api=window.__PROAI_CUBE_R1_2;return{word:[w.x,w.y,w.width,w.height],animations:document.querySelector('.r32-wordmark').getAnimations().length,q:api.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R32_LIVE},logo:window.__PROAI_LOGO_R32,diag:api.getDiagnostics()}});
            await l.waitForTimeout(8000);
            const after=await l.evaluate(()=>{const w=document.querySelector('.r32-wordmark').getBoundingClientRect(),api=window.__PROAI_CUBE_R1_2;return{word:[w.x,w.y,w.width,w.height],animations:document.querySelector('.r32-wordmark').getAnimations().length,q:api.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R32_LIVE}}});
            assert(after.live.frames>before.live.frames&&qdist(after.q,before.q)>.00001,'living motion');assert(after.live.presentationTimeSec>49.20&&after.live.presentationTimeSec<50.80,'bounded envelope');assert(before.animations===0&&after.animations===0&&after.word.every((v,i)=>Math.abs(v-before.word[i])<.02),'wordmark moved');assert(before.logo.living.sliceChoreography===false&&before.logo.living.semanticFace===false&&before.diag.scheduler.enabled===false,'living noise');
            await l.screenshot({path:'/tmp/r32-evidence/living.png',fullPage:true});await l.close();

            const mctx=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,isMobile:true,hasTouch:true});const m=await mctx.newPage();await m.goto(base+'r32-mobile.html',{waitUntil:'networkidle',timeout:90000});const mo=await m.evaluate(()=>document.documentElement.scrollWidth-innerWidth);assert(mo<=1,'mobile overflow');await m.screenshot({path:'/tmp/r32-evidence/mobile.png',fullPage:true});await m.close();await mctx.close();
            fs.writeFileSync('/tmp/r32-evidence/local-qa.json',JSON.stringify({pass:true,st,hm,before,after,mobileOverflow:mo},null,2));
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/r32qa/qa.cjs

      - name: Publish TryCloudflare owner preview
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do LOG="/tmp/r32-tunnel-$attempt.log"; /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!; URL=''; for i in $(seq 1 60); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done; if [ -n "$URL" ]; then for i in $(seq 1 20); do if curl -fsSL --max-time 15 "$URL/r32-living.html?capture" >/dev/null 2>&1; then REVIEW_URL="$URL"; break 2; fi; sleep 2; done; fi; kill "$PID" 2>/dev/null || true; done
          test -n "$REVIEW_URL"
          printf '%s\n' "$REVIEW_URL" >/tmp/r32-evidence/live-base-url.txt
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Public HTTPS self-check
        shell: bash
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          cat >/tmp/r32qa/public.cjs <<'NODE'
          const {chromium}=require('/tmp/r32qa/node_modules/playwright');const fs=require('fs');const A=(v,m)=>{if(!v)throw new Error(m)},args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'],qd=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
          (async()=>{const b=await chromium.launch({headless:true,args});try{const c=await b.newContext({viewport:{width:1440,height:900},reducedMotion:'no-preference'}),p=await c.newPage(),url=process.env.REVIEW_URL+'/r32-living.html?capture';await p.goto(url,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__PROAI_LOGO_R32?.ready===true,null,{timeout:90000});const x=await p.evaluate(()=>{const cb=document.querySelector('.r32-cube-frame').getBoundingClientRect(),w=document.querySelector('.r32-wordmark').getBoundingClientRect(),a=window.__PROAI_CUBE_R1_2;return{text:document.querySelector('.r32-wordmark').textContent.trim().replace(/\s+/g,' '),cr:cb.right,wl:w.x,diag:a.getDiagnostics(),q:a.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R32_LIVE},logo:window.__PROAI_LOGO_R32}});A(x.text==='ProAI Expert'&&x.cr<x.wl,'public lockup');A(x.diag.geometry?.pass===true&&x.diag.scheduler.enabled===false,'public Cube');await p.waitForTimeout(6000);const y=await p.evaluate(()=>({q:window.__PROAI_CUBE_R1_2.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R32_LIVE}}));A(y.live.frames>x.live.frames&&qd(y.q,x.q)>.00001,'public motion');await p.screenshot({path:'/tmp/r32-evidence/public-living.png',fullPage:true});fs.writeFileSync('/tmp/r32-evidence/public-qa.json',JSON.stringify({pass:true,url,text:x.text,canonicalCube:true,geometry:x.diag.geometry,logo:x.logo},null,2));}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/r32qa/public.cjs

      - name: Publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: proai-logo-r32-evidence
          path: /tmp/r32-evidence/
          retention-days: 7

      - name: Save owner URL
        shell: bash
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: printf '%s\n' "$REVIEW_URL" > r32-owner-url.txt

      - uses: actions/upload-artifact@v4
        with:
          name: proai-logo-r32-owner-url
          path: r32-owner-url.txt
          retention-days: 1

      - name: Hold owner preview for three and a half hours
        run: sleep 12600
