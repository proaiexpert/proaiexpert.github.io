name: ProAI Logo R3.3 Owner Review

on:
  push:
    branches: [agent/proai-logo-signature-object-r2]

permissions:
  contents: read

jobs:
  owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable production safety and canonical Cube
        shell: bash
        run: |
          set -euo pipefail
          R='docs/site-evolution/brand/proai-logo-canonical-cube-r3'
          G="$R/assets/rubik_39_s_cube_animation-DvywXmYB.glb"
          test "$(wc -c < "$G")" -eq 279412
          test "$(sha256sum "$G" | awk '{print $1}')" = 'dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b'
          test "$(git rev-parse origin/main)" = 'c945084e1952c05c686494091f7dbca0f7acdf08'
          test -z "$(git diff --name-only c945084e1952c05c686494091f7dbca0f7acdf08...HEAD -- _includes assets/css index.html ru/index.html favicon.svg favicon.ico site.webmanifest manifest.json)"
          ! grep -Eqi 'brightness\(|contrast\(|saturate\(' "$R/r33/r33.css"
          ! grep -qi '#5de2ff' "$R/r33/r33.css"
          ! grep -qi 'text-shadow' "$R/r33/r33.css"
          grep -q 'ProAI Expert' "$R/r33/static.html"
          grep -q 'ProAI Expert' "$R/r33/living.html"

      - name: Install Chromium and start review server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r33qa /tmp/r33-evidence
          cd /tmp/r33qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory docs/site-evolution/brand/proai-logo-canonical-cube-r3 >/tmp/r33-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/r33/living.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/r33-http.log
          exit 1

      - name: Final local browser gate and review evidence
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/r33qa/local.cjs <<'NODE'
          const {chromium}=require('/tmp/r33qa/node_modules/playwright');
          const fs=require('fs');
          const A=(v,m)=>{if(!v)throw new Error(m)};
          const args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'];
          const base='http://127.0.0.1:4173/';
          const qd=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
          (async()=>{const b=await chromium.launch({headless:true,args});try{
            async function context(vp,dsf=1,mobile=false){return b.newContext({viewport:vp,deviceScaleFactor:dsf,isMobile:mobile,hasTouch:mobile,reducedMotion:'no-preference'})}
            async function open(c,path,ready=false){const p=await c.newPage();await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:90000});if(ready)await p.waitForFunction(()=>window.__PROAI_LOGO_R33?.ready===true,null,{timeout:90000});return p}
            const c=await context({width:1440,height:900});
            const s=await open(c,'r33/static.html?capture',true);
            const stat=await s.evaluate(()=>{const api=window.__PROAI_CUBE_R1_2,wm=document.querySelector('.r33-wordmark'),cube=document.querySelector('.r33-cube-frame').getBoundingClientRect(),word=wm.getBoundingClientRect(),canvas=document.querySelector('#cube-canvas'),cs=getComputedStyle(wm);return{text:wm.textContent.trim().replace(/\s+/g,' '),aria:wm.getAttribute('aria-label'),cube:[cube.x,cube.y,cube.width,cube.height],word:[word.x,word.y,word.width,word.height],font:cs.fontFamily,weight:cs.fontWeight,filter:getComputedStyle(canvas).filter,diag:api.getDiagnostics(),logo:window.__PROAI_LOGO_R33,pose:api.getSemanticPoseAt(49.6),overflow:document.documentElement.scrollWidth-innerWidth}});
            A(stat.text==='ProAI Expert'&&stat.aria==='ProAI Expert','exact wordmark');A(stat.font.includes('Instrument Sans')&&stat.weight==='680','typography');A(stat.cube[0]+stat.cube[2]<stat.word[0],'cube left');A(stat.filter==='none','no CSS filter');A(stat.diag.geometry?.pass===true&&stat.diag.scheduler.enabled===false,'canonical geometry/scheduler');A(stat.logo.geometryModified===false&&stat.logo.newSymbol===false,'identity lock');A(stat.overflow<=1,'static overflow');
            await s.screenshot({path:'/tmp/r33-evidence/final-static.png',fullPage:true});await s.close();
            const h=await open(c,'r33/header.html');await h.waitForTimeout(2500);A((await h.evaluate(()=>document.documentElement.scrollWidth-innerWidth))<=1,'desktop header overflow');await h.screenshot({path:'/tmp/r33-evidence/final-desktop-header.png',fullPage:true});await h.close();
            const cmp=await open(c,'r33/compare.html');await cmp.waitForTimeout(3000);const cmpState=await cmp.evaluate(()=>[...document.querySelectorAll('iframe')].map(f=>({outer:[f.clientWidth,f.clientHeight],innerOverflow:f.contentDocument?f.contentDocument.documentElement.scrollWidth-f.contentWindow.innerWidth:999,text:f.contentDocument?.querySelector('.r32-wordmark,.r33-wordmark')?.textContent.trim().replace(/\s+/g,' ')})));A(cmpState.length===2&&cmpState.every(x=>x.innerOverflow<=1&&x.text==='ProAI Expert'),'same-size comparison clipping/text');A(cmpState[0].outer[0]===cmpState[1].outer[0]&&cmpState[0].outer[1]===cmpState[1].outer[1],'comparison canvas parity');await cmp.screenshot({path:'/tmp/r33-evidence/final-comparison.png',fullPage:true});await cmp.close();
            const card=await open(c,'r33/business-card.html?capture',true);await card.screenshot({path:'/tmp/r33-evidence/final-business-card.png',fullPage:true});await card.close();
            const l=await open(c,'r33/living.html?capture',true);const x=await l.evaluate(()=>({q:window.__PROAI_CUBE_R1_2.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R33_LIVE},word:[...document.querySelector('.r33-wordmark').getBoundingClientRect().toJSON?Object.values(document.querySelector('.r33-wordmark').getBoundingClientRect().toJSON()).slice(0,4):[]]}));await l.waitForTimeout(6500);const y=await l.evaluate(()=>({q:window.__PROAI_CUBE_R1_2.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R33_LIVE},animations:document.querySelector('.r33-wordmark').getAnimations().length}));A(y.live.frames>x.live.frames&&qd(y.q,x.q)>.00001,'living motion');A(y.animations===0,'wordmark motion');await l.screenshot({path:'/tmp/r33-evidence/final-living.png',fullPage:true});await l.close();await c.close();
            for(const [w,h,dsf,name] of [[390,844,2,'final-mobile-390'],[320,720,1,'final-mobile-320']]){const mc=await context({width:w,height:h},dsf,true),p=await open(mc,'r33/mobile.html');await p.waitForTimeout(2500);A((await p.evaluate(()=>document.documentElement.scrollWidth-innerWidth))<=1,name+' overflow');await p.screenshot({path:'/tmp/r33-evidence/'+name+'.png',fullPage:true});await p.close();await mc.close()}
            fs.writeFileSync('/tmp/r33-evidence/local-final-qa.json',JSON.stringify({pass:true,stat,cmpState,motion:{before:x.live,after:y.live}},null,2));
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/r33qa/local.cjs

      - name: Publish TryCloudflare owner preview
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r33-tunnel-$attempt.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 60); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 20); do if curl -fsSL --max-time 15 "$URL/r33/living.html?capture" >/dev/null 2>&1; then REVIEW_URL="$URL"; break 2; fi; sleep 2; done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          printf '%s\n' "$REVIEW_URL" >/tmp/r33-evidence/live-base-url.txt
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Public HTTPS Chromium self-check
        shell: bash
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          cat >/tmp/r33qa/public.cjs <<'NODE'
          const {chromium}=require('/tmp/r33qa/node_modules/playwright');const fs=require('fs');const A=(v,m)=>{if(!v)throw new Error(m)},args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'],qd=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
          (async()=>{const b=await chromium.launch({headless:true,args});try{const c=await b.newContext({viewport:{width:1440,height:900},reducedMotion:'no-preference'}),p=await c.newPage(),errs=[];p.on('pageerror',e=>errs.push('page:'+e.message));p.on('console',m=>{if(m.type()==='error')errs.push('console:'+m.text())});const url=process.env.REVIEW_URL+'/r33/living.html?capture';await p.goto(url,{waitUntil:'domcontentloaded',timeout:90000});await p.waitForFunction(()=>window.__PROAI_LOGO_R33?.ready===true,null,{timeout:90000});const x=await p.evaluate(()=>{const api=window.__PROAI_CUBE_R1_2,wm=document.querySelector('.r33-wordmark'),cb=document.querySelector('.r33-cube-frame').getBoundingClientRect(),w=wm.getBoundingClientRect(),res=performance.getEntriesByType('resource').map(r=>r.name);return{text:wm.textContent.trim().replace(/\s+/g,' '),aria:wm.getAttribute('aria-label'),cubeRight:cb.right,wordLeft:w.x,canvas:[document.querySelector('#cube-canvas').width,document.querySelector('#cube-canvas').height],diag:api.getDiagnostics(),q:api.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R33_LIVE},logo:window.__PROAI_LOGO_R33,resources:res}});A(x.text==='ProAI Expert'&&x.aria==='ProAI Expert'&&x.cubeRight<x.wordLeft,'public lockup');A(x.canvas[0]>0&&x.canvas[1]>0,'public canvas');A(x.diag.geometry?.pass===true&&x.diag.scheduler.enabled===false,'public canonical Cube');A(x.resources.some(u=>u.includes('/r33/r33.css')),'public CSS');A(x.resources.some(u=>u.includes('/r33/r33-runtime.js')),'public JS');A(x.resources.some(u=>u.includes('rubik_39_s_cube_animation-DvywXmYB.glb')),'public GLB');await p.waitForTimeout(6500);const y=await p.evaluate(()=>({q:window.__PROAI_CUBE_R1_2.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R33_LIVE},animations:document.querySelector('.r33-wordmark').getAnimations().length}));A(y.live.frames>x.live.frames&&qd(y.q,x.q)>.00001,'public motion');A(y.animations===0,'public wordmark static');A(errs.length===0,'public console errors: '+errs.join(' | '));await p.screenshot({path:'/tmp/r33-evidence/public-final-living.png',fullPage:true});fs.writeFileSync('/tmp/r33-evidence/public-final-qa.json',JSON.stringify({pass:true,url,text:x.text,css:true,js:true,glb:true,geometry:x.diag.geometry,motionObserved:true,errors:errs,resources:x.resources},null,2));await c.close();}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/r33qa/public.cjs

      - name: Upload verified owner-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: proai-logo-r33-owner-review
          path: /tmp/r33-evidence/
          retention-days: 1

      - name: Hold verified owner preview for three and a half hours
        run: sleep 12600
