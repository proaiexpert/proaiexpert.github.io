name: ProAI Logo R3.3 Visual QA

on:
  push:
    branches: [agent/proai-logo-signature-object-r2]

concurrency:
  group: proai-logo-r33-visual-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify safety and canonical Cube
        shell: bash
        run: |
          set -euo pipefail
          R='docs/site-evolution/brand/proai-logo-canonical-cube-r3'
          G="$R/assets/rubik_39_s_cube_animation-DvywXmYB.glb"
          test "$(wc -c < "$G")" -eq 279412
          test "$(sha256sum "$G" | awk '{print $1}')" = 'dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b'
          test "$(git rev-parse origin/main)" = 'c945084e1952c05c686494091f7dbca0f7acdf08'
          test -z "$(git diff --name-only c945084e1952c05c686494091f7dbca0f7acdf08...HEAD -- _includes assets/css index.html ru/index.html favicon.svg favicon.ico site.webmanifest manifest.json)"
          ! grep -Eqi 'brightness\(|contrast\(|saturate\(' "$R/r33/r33.css"
          ! grep -qi '#5de2ff' "$R/r33/r33.css"
          ! grep -qi 'text-shadow' "$R/r33/r33.css"
      - name: Install Chromium and serve review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r33qa /tmp/r33-evidence
          cd /tmp/r33qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory docs/site-evolution/brand/proai-logo-canonical-cube-r3 >/tmp/r33-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/r33/static.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/r33-http.log
          exit 1
      - name: Render QA evidence
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/r33qa/qa.cjs <<'NODE'
          const {chromium}=require('/tmp/r33qa/node_modules/playwright');
          const fs=require('fs');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'];
          const base='http://127.0.0.1:4173/';
          const qdist=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
          (async()=>{const browser=await chromium.launch({headless:true,args});try{
            async function ctx(vp,dsf=1,mobile=false){return await browser.newContext({viewport:vp,deviceScaleFactor:dsf,isMobile:mobile,hasTouch:mobile,reducedMotion:'no-preference'})}
            async function open(c,path,ready=true){const p=await c.newPage();await p.goto(base+path,{waitUntil:'domcontentloaded',timeout:90000});if(ready)await p.waitForFunction(()=>window.__PROAI_LOGO_R33?.ready===true,null,{timeout:90000});return p}
            const desktop=await ctx({width:1440,height:900});
            const s=await open(desktop,'r33/static.html?capture');
            const st=await s.evaluate(()=>{const c=document.querySelector('.r33-cube-frame').getBoundingClientRect(),w=document.querySelector('.r33-wordmark').getBoundingClientRect(),cs=getComputedStyle(document.querySelector('.r33-wordmark')),can=getComputedStyle(document.querySelector('#cube-canvas')),api=window.__PROAI_CUBE_R1_2;return{text:document.querySelector('.r33-wordmark').textContent.trim().replace(/\s+/g,' '),aria:document.querySelector('.r33-wordmark').getAttribute('aria-label'),cube:[c.x,c.y,c.width,c.height],word:[w.x,w.y,w.width,w.height],font:cs.fontFamily,weight:cs.fontWeight,filter:can.filter,overflow:document.documentElement.scrollWidth-innerWidth,diag:api.getDiagnostics(),logo:window.__PROAI_LOGO_R33,pose:api.getSemanticPoseAt(window.__PROAI_LOGO_R33.home.timeSec),sample:api.getReviewPresentationSample(window.__PROAI_LOGO_R33.home.timeSec)}});
            assert(st.text==='ProAI Expert','exact wordmark');assert(st.aria==='ProAI Expert','wordmark aria');assert(st.font.includes('Instrument Sans'),'font');assert(st.weight==='680','weight');assert(st.filter==='none','canvas filter');assert(st.overflow<=1,'static overflow');assert(st.diag.geometry?.pass===true,'geometry');assert(st.diag.scheduler.enabled===false,'scheduler');assert(st.logo.geometryModified===false&&st.logo.newSymbol===false,'identity lock');
            await s.screenshot({path:'/tmp/r33-evidence/static-1x.png',fullPage:true});
            for(const t of [49.0,49.3,49.6,49.9,50.2]){await s.evaluate((t)=>{const api=window.__PROAI_CUBE_R1_2;api.setReviewPresentation(t,1,false);api.clearSemanticReviewState?.();api.renderReviewFrame()},t);await s.locator('.r33-lockup').screenshot({path:`/tmp/r33-evidence/pose-${String(t).replace('.','_')}.png`})}
            await s.evaluate(()=>{const api=window.__PROAI_CUBE_R1_2;api.setReviewPresentation(window.__PROAI_LOGO_R33.home.timeSec,1,false);api.renderReviewFrame()});
            for(const w of [660,680,700]){await s.evaluate((w)=>{const e=document.querySelector('.r33-wordmark');e.style.fontWeight=String(w);e.style.fontVariationSettings=`"wght" ${w}`},w);await s.locator('.r33-lockup').screenshot({path:`/tmp/r33-evidence/weight-${w}.png`})}
            await s.evaluate(()=>{const e=document.querySelector('.r33-wordmark');e.style.fontWeight='';e.style.fontVariationSettings=''});await s.close();
            const d2=await ctx({width:1440,height:900},2);const s2=await open(d2,'r33/static.html?capture');await s2.screenshot({path:'/tmp/r33-evidence/static-2x.png',fullPage:true});await s2.close();await d2.close();
            const hl=await open(desktop,'r33/lockup.html?scale=header&capture');
            const hm=await hl.evaluate(()=>{const c=document.querySelector('.r33-cube-frame').getBoundingClientRect(),w=document.querySelector('.r33-wordmark').getBoundingClientRect();return{text:document.querySelector('.r33-wordmark').textContent.trim().replace(/\s+/g,' '),cube:c.width,word:[w.width,w.height],overflow:document.documentElement.scrollWidth-innerWidth}});assert(hm.text==='ProAI Expert'&&hm.overflow<=1,'header lockup');
            for(const z of [29,30,31]){await hl.evaluate((z)=>document.querySelector('.r33-lockup').style.setProperty('--cube',`${z}px`),z);await hl.locator('.r33-lockup').screenshot({path:`/tmp/r33-evidence/header-cube-${z}.png`})}await hl.close();
            const hp=await open(desktop,'r33/header.html',false);await hp.waitForTimeout(2500);assert((await hp.evaluate(()=>document.documentElement.scrollWidth-innerWidth))<=1,'desktop header overflow');await hp.screenshot({path:'/tmp/r33-evidence/header-context.png',fullPage:true});
            await hp.evaluate(()=>{const f=document.querySelector('iframe'),d=f.contentDocument,l=d?.querySelector('.r33-lockup');if(l)l.style.filter='grayscale(1)'});await hp.screenshot({path:'/tmp/r33-evidence/header-grayscale.png',fullPage:true});
            await hp.evaluate(()=>{const f=document.querySelector('iframe'),d=f.contentDocument,l=d?.querySelector('.r33-lockup');if(l)l.style.filter='grayscale(1) blur(2px)'});await hp.screenshot({path:'/tmp/r33-evidence/header-blur.png',fullPage:true});await hp.close();
            const cmp=await open(desktop,'r33/compare.html',false);await cmp.waitForTimeout(3000);await cmp.screenshot({path:'/tmp/r33-evidence/compare.png',fullPage:true});await cmp.close();
            const card=await open(desktop,'r33/business-card.html?capture');await card.screenshot({path:'/tmp/r33-evidence/business-card.png',fullPage:true});await card.close();
            const light=await open(desktop,'r33/light-sanity.html',false);await light.waitForFunction(()=>document.documentElement.dataset.lightSanity==='ready',null,{timeout:90000});await light.screenshot({path:'/tmp/r33-evidence/light-sanity.png',fullPage:true});await light.close();
            const live=await open(desktop,'r33/living.html?capture');const before=await live.evaluate(()=>{const w=document.querySelector('.r33-wordmark').getBoundingClientRect(),api=window.__PROAI_CUBE_R1_2;return{word:[w.x,w.y,w.width,w.height],animations:document.querySelector('.r33-wordmark').getAnimations().length,q:api.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R33_LIVE},diag:api.getDiagnostics()}});await live.waitForTimeout(8000);const after=await live.evaluate(()=>{const w=document.querySelector('.r33-wordmark').getBoundingClientRect(),api=window.__PROAI_CUBE_R1_2;return{word:[w.x,w.y,w.width,w.height],animations:document.querySelector('.r33-wordmark').getAnimations().length,q:api.getInteractionState().presentationQuaternion,live:{...window.__PROAI_LOGO_R33_LIVE}}});assert(after.live.frames>before.live.frames&&qdist(after.q,before.q)>.00001,'living motion');assert(after.live.presentationTimeSec>48.86&&after.live.presentationTimeSec<50.34,'bounded envelope');assert(before.animations===0&&after.animations===0&&after.word.every((v,i)=>Math.abs(v-before.word[i])<.02),'wordmark motion');await live.screenshot({path:'/tmp/r33-evidence/living.png',fullPage:true});await live.close();await desktop.close();
            for(const [width,height,dsf,name] of [[390,844,2,'mobile-390'],[320,720,1,'mobile-320']]){const mc=await ctx({width,height},dsf,true);const m=await open(mc,'r33/mobile.html',false);await m.waitForTimeout(3000);const mo=await m.evaluate(()=>document.documentElement.scrollWidth-innerWidth);assert(mo<=1,`${name} overflow`);await m.screenshot({path:`/tmp/r33-evidence/${name}.png`,fullPage:true});await m.close();await mc.close()}
            fs.writeFileSync('/tmp/r33-evidence/qa.json',JSON.stringify({pass:true,st,hm,before,after},null,2));
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/r33qa/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proai-logo-r33-visual-qa
          path: /tmp/r33-evidence/
          retention-days: 1
