name: ProAI Logo R3.4.1 System Board Fit R2
on:
  push:
    branches:
      - agent/proai-logo-signature-object-r2
    paths:
      - .github/workflows/proai-logo-r341-board-fix2.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-logo-signature-object-r2
          fetch-depth: 0
      - name: Verify locks and apply board-only optical sizing
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5c04478a5109330d2639c3d3474d28360fffab27 HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('docs/site-evolution/brand/proai-logo-canonical-cube-r3/r341')
          p=root/'r341.css';s=p.read_text();needle='.r341-board-page{';assert needle in s and '.r34-lockup.system{' not in s
          s=s.replace(needle,'.r34-lockup.system{--cube:124px;--word:92px;--gap:18px;--cube-y:-1px;gap:var(--gap)}.r34-lockup.system .r34-cube #cube-canvas{transform:scale(1.15)}'+needle,1);p.write_text(s)
          for name in ['system-static.html','system-living.html']:
              p=root/name;s=p.read_text();assert 'r34-lockup master' in s;s=s.replace('r34-lockup master','r34-lockup system',1);p.write_text(s)
          PY
      - name: Browser validate full system board
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p /tmp/r341-board
          (cd docs/site-evolution/brand/proai-logo-canonical-cube-r3 && python3 -m http.server 4173 >/tmp/r341-board-http.log 2>&1) & HPID=$!; trap 'kill "$HPID" 2>/dev/null || true' EXIT
          node <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1600,height:1000},deviceScaleFactor:1});const errors=[];p.on('pageerror',e=>errors.push(String(e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto('http://127.0.0.1:4173/r341/system-board.html',{waitUntil:'networkidle'});await p.waitForTimeout(1800);const frames=p.frames().filter(f=>f.url().includes('/r341/system-static.html')||f.url().includes('/r341/system-living.html'));if(frames.length!==2)throw Error('frames '+frames.length+' '+JSON.stringify(p.frames().map(f=>f.url())));for(const f of frames){await f.waitForFunction(()=>document.documentElement.dataset.proaiLogoR341Ready==='true',{timeout:45000});const q=await f.evaluate(()=>{const l=document.querySelector('[data-testid=r341-lockup]').getBoundingClientRect(),w=document.querySelector('[data-testid=r341-wordmark]').getBoundingClientRect();return {text:document.querySelector('[data-testid=r341-wordmark]').textContent,left:l.left,right:l.right,vw:innerWidth,wordRight:w.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(q.text!=='ProAI Expert'||q.left<0||q.right>q.vw||q.wordRight>q.vw||q.overflow!==0)throw Error('frame fit '+JSON.stringify(q))}if(errors.length)throw Error(JSON.stringify(errors));await p.screenshot({path:'/tmp/r341-board/system-board-fixed.png',fullPage:true});await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit board correction and clean temporary workflows
        run: |
          git config user.name "ProAI Logo Builder"
          git config user.email "proai.expert2026@gmail.com"
          git add docs/site-evolution/brand/proai-logo-canonical-cube-r3/r341/r341.css docs/site-evolution/brand/proai-logo-canonical-cube-r3/r341/system-static.html docs/site-evolution/brand/proai-logo-canonical-cube-r3/r341/system-living.html
          git rm .github/workflows/proai-logo-r341-board-fix.yml .github/workflows/proai-logo-r341-board-fix2.yml
          git commit -m "fix: fit R3.4.1 static living system board"
          git push origin HEAD:agent/proai-logo-signature-object-r2
          git rev-parse HEAD > /tmp/r341-board/review-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proai-logo-r341-system-board-fixed-r2
          path: /tmp/r341-board
          retention-days: 7
