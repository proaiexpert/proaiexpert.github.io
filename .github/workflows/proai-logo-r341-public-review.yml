name: ProAI Logo R3.4.1 Public Owner Review
on:
  push:
    branches:
      - agent/proai-logo-signature-object-r2
    paths:
      - .github/workflows/proai-logo-r341-public-review.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-logo-signature-object-r2
          fetch-depth: 0
      - name: Verify product and production locks
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5c04478a5109330d2639c3d3474d28360fffab27 HEAD
          git merge-base --is-ancestor fedfaacb3adb156fb5511e77e5a5f48fe8ad79cf HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
          GLB=docs/site-evolution/brand/proai-logo-canonical-cube-r3/assets/rubik_39_s_cube_animation-DvywXmYB.glb
          test "$(stat -c%s "$GLB")" = "279412"
          test "$(sha256sum "$GLB" | cut -d' ' -f1)" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
      - name: Install public-review browser and tunnel
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          curl -L --fail --retry 3 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Start public HTTPS owner review and self-check all pages
        run: |
          set -euo pipefail
          mkdir -p /tmp/r341-public
          ROOT=docs/site-evolution/brand/proai-logo-canonical-cube-r3
          (cd "$ROOT" && python3 -m http.server 4173 >/tmp/r341-public/http.log 2>&1) &
          echo $! > /tmp/r341-public/http.pid
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:4173 --no-autoupdate >/tmp/r341-public/cloudflared.log 2>&1 &
          echo $! > /tmp/r341-public/cloudflared.pid
          BASE=""
          for i in $(seq 1 90); do
            BASE=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/r341-public/cloudflared.log | head -n1 || true)
            if [ -n "$BASE" ]; then break; fi
            sleep 1
          done
          test -n "$BASE"
          printf '%s\n' "$BASE" | tee /tmp/r341-public/base-url.txt
          BASE="$BASE" node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const base=process.env.BASE;
          const paths={living:'/r341/living.html',static:'/r341/static.html',compare:'/r341/compare-static.html',system:'/r341/system-board.html',header:'/r341/header.html',footer:'/r341/footer.html',business:'/r341/business-card.html'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function gotoRetry(page,url){let last;for(let i=0;i<40;i++){try{const r=await page.goto(url,{waitUntil:'networkidle',timeout:60000});if(r&&r.ok())return r;last=new Error('HTTP '+(r?.status?.()??'none'));}catch(e){last=e}await sleep(3000)}throw last}
          (async()=>{
            const browser=await chromium.launch({headless:true});
            // Separate readiness probe so transient TryCloudflare DNS propagation failures are not counted as product errors.
            const probe=await browser.newPage({viewport:{width:1440,height:900}});
            await gotoRetry(probe,base+paths.living);
            await probe.waitForFunction(()=>document.documentElement.dataset.proaiLogoR341Ready==='true',{timeout:45000});
            await probe.close();
            const evidence={base,checkedAt:new Date().toISOString(),pages:{},pass:false};
            async function check(name,path,viewport={width:1440,height:900}){
              const p=await browser.newPage({viewport});const errors=[];const responses=[];
              p.on('pageerror',e=>errors.push(['pageerror',String(e)]));
              p.on('console',m=>{if(m.type()==='error')errors.push(['console',m.text()])});
              p.on('requestfailed',r=>errors.push(['requestfailed',r.url(),r.failure()?.errorText]));
              p.on('response',r=>responses.push([r.url(),r.status()]));
              const response=await gotoRetry(p,base+path);
              if(!response.ok())throw Error(name+' HTTP '+response.status());
              if(['living','static','header','footer','business'].includes(name)) await p.waitForFunction(()=>document.documentElement.dataset.proaiLogoR341Ready==='true',{timeout:45000});
              else await p.waitForTimeout(2000);
              await p.screenshot({path:'/tmp/r341-public/'+name+'.png',fullPage:true});
              evidence.pages[name]={url:base+path,http:response.status(),errors,responses};
              return {p,errors,responses};
            }
            let q=await check('living',paths.living);
            let p=q.p;
            const l1=await p.evaluate(()=>({state:JSON.parse(JSON.stringify(window.__PROAI_R341_STATE)),text:document.querySelector('[data-testid=r341-wordmark]').textContent,filter:getComputedStyle(document.querySelector('canvas')).filter,webgl:!!document.querySelector('canvas').getContext('webgl2'),animations:document.querySelector('[data-testid=r341-wordmark]').getAnimations().length}));
            await p.waitForTimeout(2600);
            const l2=await p.evaluate(()=>JSON.parse(JSON.stringify(window.__PROAI_R341_STATE)));
            const dt=l2.elapsedSec-l1.state.elapsedSec,dy=l2.current.yaw-l1.state.current.yaw,speed=dy/dt;
            if(l1.text!=='ProAI Expert'||l1.filter!=='none'||!l1.webgl||l1.animations!==0||l1.state.sliceChoreography||l1.state.semanticFace||l1.state.wordmarkAnimated||!(dt>0&&speed>4.45&&speed<4.55))throw Error('living gate '+JSON.stringify({l1,dt,dy,speed}));
            if(l1.state.appliedLook.lighting.keyIntensity!==5.2||l1.state.appliedLook.lighting.fillIntensity!==4.35||l1.state.appliedLook.lighting.rimIntensity!==4.85)throw Error('living look changed');
            const livingGlb=q.responses.find(x=>x[0].includes('rubik_39_s_cube_animation-DvywXmYB.glb')&&x[1]===200);const livingJs=q.responses.find(x=>x[0].includes('/assets/r341-cube-runtime.js')&&x[1]===200);const livingCss=q.responses.find(x=>x[0].includes('/r341/r341.css')&&x[1]===200);if(!livingGlb||!livingJs||!livingCss||q.errors.length)throw Error('living network '+JSON.stringify({glb:livingGlb,js:livingJs,css:livingCss,errors:q.errors}));
            evidence.living={speed,wholeCube:true,glb200:true,js200:true,css200:true,webgl:true};await p.close();
            q=await check('static',paths.static);p=q.p;
            const st=await p.evaluate(()=>({state:JSON.parse(JSON.stringify(window.__PROAI_R341_STATE)),text:document.querySelector('[data-testid=r341-wordmark]').textContent,filter:getComputedStyle(document.querySelector('canvas')).filter,webgl:!!document.querySelector('canvas').getContext('webgl2')}));
            if(st.text!=='ProAI Expert'||st.filter!=='none'||!st.webgl||st.state.mode!=='static'||Math.abs(st.state.appliedLook.lighting.keyIntensity-4.75)>.001||Math.abs(st.state.appliedLook.lighting.fillIntensity-5.70)>.001||Math.abs(st.state.appliedLook.lighting.rimIntensity-1.55)>.001||st.state.staticHome.yaw!==288||st.state.staticHome.pitch!==4.5||st.state.staticHome.roll!==-.3||st.state.geometry?.pass!==true||q.errors.length)throw Error('static gate '+JSON.stringify({st,errors:q.errors}));
            evidence.static={preset:'STATIC_OPTICAL_MASTER',webgl:true,key:4.75,fill:5.70,rimBack:1.55,pose:st.state.staticHome};await p.close();
            q=await check('compare',paths.compare,{width:1600,height:1000});if(q.errors.length)throw Error('compare errors '+JSON.stringify(q.errors));await q.p.close();
            q=await check('system',paths.system,{width:1600,height:1000});p=q.p;
            const frames=p.frames().filter(f=>f.url().includes('/r341/system-static.html')||f.url().includes('/r341/system-living.html'));if(frames.length!==2)throw Error('system frames '+frames.length);const system=[];for(const f of frames){await f.waitForFunction(()=>document.documentElement.dataset.proaiLogoR341Ready==='true',{timeout:45000});const m=await f.evaluate(()=>{const w=document.querySelector('[data-testid=r341-wordmark]').getBoundingClientRect();return {text:document.querySelector('[data-testid=r341-wordmark]').textContent,left:w.left,right:w.right,vw:innerWidth,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});system.push(m);if(m.text!=='ProAI Expert'||m.left<0||m.right>m.vw||m.overflow!==0)throw Error('system fit '+JSON.stringify(m))}if(q.errors.length)throw Error('system errors '+JSON.stringify(q.errors));evidence.system=system;await p.close();
            q=await check('header',paths.header);p=q.p;const h=await p.evaluate(()=>({cube:getComputedStyle(document.querySelector('[data-testid=r341-cube]')).width,word:getComputedStyle(document.querySelector('[data-testid=r341-wordmark]')).fontSize,gap:getComputedStyle(document.querySelector('[data-testid=r341-lockup]')).gap,text:document.querySelector('[data-testid=r341-wordmark]').textContent,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));if(h.cube!=='36px'||h.word!=='20px'||h.gap!=='9px'||h.text!=='ProAI Expert'||h.overflow!==0||q.errors.length)throw Error('header '+JSON.stringify({h,errors:q.errors}));evidence.header=h;await p.close();
            q=await check('footer',paths.footer);p=q.p;const f=await p.evaluate(()=>({cube:getComputedStyle(document.querySelector('[data-testid=r341-cube]')).width,word:getComputedStyle(document.querySelector('[data-testid=r341-wordmark]')).fontSize,text:document.querySelector('[data-testid=r341-wordmark]').textContent}));if(f.cube!=='40px'||f.word!=='22px'||f.text!=='ProAI Expert'||q.errors.length)throw Error('footer '+JSON.stringify({f,errors:q.errors}));evidence.footer=f;await p.close();
            q=await check('business',paths.business);p=q.p;const b=await p.evaluate(()=>({mode:window.__PROAI_R341_STATE.mode,text:document.querySelector('[data-testid=r341-wordmark]').textContent,webgl:!!document.querySelector('canvas').getContext('webgl2')}));if(b.mode!=='static'||b.text!=='ProAI Expert'||!b.webgl||q.errors.length)throw Error('business '+JSON.stringify({b,errors:q.errors}));evidence.business=b;await p.close();
            // Exact 2048 master must be publicly retrievable.
            const asset=await browser.newPage();const ar=await gotoRetry(asset,base+'/r341/proai-logo-r341-static-optical-master-2048.png');if(!ar.ok())throw Error('2048 master HTTP '+ar.status());evidence.staticMaster2048={http:ar.status()};await asset.close();
            evidence.pass=true;fs.writeFileSync('/tmp/r341-public/public-qa.json',JSON.stringify(evidence,null,2));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Clean temporary workflow and freeze clean review SHA
        run: |
          set -euo pipefail
          git config user.name "ProAI Logo Builder"
          git config user.email "proai.expert2026@gmail.com"
          git rm .github/workflows/proai-logo-r341-public-review.yml
          git commit -m "chore: clean temporary R3.4.1 owner review workflow"
          git push origin HEAD:agent/proai-logo-signature-object-r2
          git rev-parse HEAD | tee /tmp/r341-public/final-review-sha.txt
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Upload public owner-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: proai-logo-r341-public-owner-review
          path: /tmp/r341-public
          retention-days: 7
      - name: Keep public owner review alive
        run: |
          echo "R3.4.1 owner review remains available for approximately 3.5 hours from this step."
          cat /tmp/r341-public/base-url.txt
          sleep 12600
