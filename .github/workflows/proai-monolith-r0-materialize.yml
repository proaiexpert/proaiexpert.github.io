name: Materialize ProAI Monolith Cube R0 review assets

on:
  push:
    branches:
      - agent/proai-monolith-cube-r0

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-monolith-cube-r0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install pinned render dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 \
            numba==0.65.1 \
            pillow==12.3.0 \
            opencv-python-headless==4.13.0.92

      - name: Materialize the already-defined R0 review package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='docs/site-evolution/spline/proai-monolith-cube-r0'
          python "$ROOT/render_review.py"
          mv "$ROOT/review/01-hero-angle.png" "$ROOT/01-hero-like-angle.png"
          mv "$ROOT/review/02-motion-angle.png" "$ROOT/02-motion-angle.png"
          ffmpeg -y -hide_banner -loglevel error \
            -i "$ROOT/review/03-monolith-motion-12s.mp4" \
            -an -c:v libvpx-vp9 -b:v 0 -crf 38 -deadline good -cpu-used 2 \
            "$ROOT/03-monolith-motion-12s.webm"
          rm -rf "$ROOT/review"
          rm -f .github/workflows/proai-monolith-r0-materialize.yml

      - name: Commit review assets to the experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'materialize ProAI monolith R0 review assets'
          git push origin HEAD:agent/proai-monolith-cube-r0
