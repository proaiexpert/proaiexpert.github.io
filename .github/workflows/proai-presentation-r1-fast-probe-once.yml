name: ProAI Presentation R1.1 Fast Probe Once

on:
  push:
    branches:
      - agent/proai-cube-presentation-motion-r1
    paths:
      - '.github/workflows/proai-presentation-r1-fast-probe-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-presentation-motion-r1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-presentation-motion-r1
          fetch-depth: 0
      - name: Install browser dependencies
        run: |
          npm install --package-lock=false
          npx playwright install chromium
      - name: Start isolated Vite
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/proai-fast-probe-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proai-fast-probe-vite.log
          exit 1
      - name: Probe 360 and interaction metrics
        run: |
          cat > fast-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless:true, args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader'] });
          const page = await browser.newPage({ viewport:{width:900,height:1040} });
          await page.goto('http://127.0.0.1:4173/?qa=1',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(() => window.__PROAI_CUBE_R1?.ready === true,null,{timeout:90000});
          const box = await page.evaluate(() => { const r=document.getElementById('cube-canvas').getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height}; });
          const apiState = () => page.evaluate(() => ({i:window.__PROAI_CUBE_R1.getInteractionState(),d:window.__PROAI_CUBE_R1.getDiagnostics()}));
          await page.evaluate(() => { window.__p=window.__PROAI_CUBE_R1.runPresentationMove('inspection-156'); });
          await page.waitForTimeout(900);
          await page.evaluate(() => { window.__s=window.__PROAI_CUBE_R1.turnSlice({axis:'X',layer:1,direction:1,durationMs:1200,ignoreInteraction:true}); });
          await page.waitForTimeout(250);
          const before=await apiState();
          const x0=box.x+box.width*.52, y0=box.y+box.height*.50;
          await page.mouse.move(x0,y0); await page.mouse.down(); await page.waitForTimeout(60);
          const start=await apiState();
          for(let i=1;i<=9;i++){const p=i/9;await page.mouse.move(x0+132*p,y0-34*Math.sin(Math.PI*p*.75));await page.waitForTimeout(150);}
          const held=await apiState();
          const blocked=await page.evaluate(() => window.__PROAI_CUBE_R1.turnSlice({axis:'Y',layer:0,direction:-1,durationMs:100}));
          await page.mouse.up(); await page.waitForTimeout(100);
          const release=await apiState();
          await page.waitForTimeout(1150); const delay=await apiState();
          const settled=delay.i.cameraPosition;
          await page.waitForTimeout(850);
          const samples=[]; for(let i=0;i<20;i++){await page.waitForTimeout(120);samples.push(await apiState());}
          const after=samples.at(-1);
          const vd=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])**2,0));
          const qa=(a,b)=>{const dot=Math.min(1,Math.abs(a.reduce((s,v,i)=>s+v*b[i],0)));return 2*Math.acos(dot)};
          let maxStep=0;for(let i=1;i<samples.length;i++)maxStep=Math.max(maxStep,qa(samples[i-1].i.presentationQuaternion,samples[i].i.presentationQuaternion));
          console.log('INTERACTION_PROBE='+JSON.stringify({
            before:{activeSlice:before.i.activeSlice,presentation:before.i.presentation.activeMove,camera:before.i.cameraPosition},
            start:{interactionActive:start.i.interactionActive,autonomyBlocked:start.i.autonomyBlocked},
            held:{activeSlice:held.i.activeSlice,lastTurn:held.d.lastTurnResult,presentation:held.i.presentation.activeMove,camera:held.i.cameraPosition},
            blockedNextSlice:blocked,
            release:{blocked:release.i.autonomyBlocked,delay:release.i.resumeDelayRemainingMs},
            delay:{blocked:delay.i.autonomyBlocked,presentation:delay.i.presentation.activeMove,camera:delay.i.cameraPosition},
            after:{blocked:after.i.autonomyBlocked,presentation:after.i.presentation.activeMove,camera:after.i.cameraPosition},
            cameraMoved:vd(before.i.cameraPosition,held.i.cameraPosition),cameraAfterDelta:vd(settled,after.i.cameraPosition),maxResumeQuaternionStepRad:maxStep
          }));
          await page.close();
          const p360=await browser.newPage({viewport:{width:900,height:1040}});
          await p360.goto('http://127.0.0.1:4173/?capture=1',{waitUntil:'networkidle',timeout:120000});
          await p360.waitForFunction(() => window.__PROAI_CUBE_R1?.ready === true,null,{timeout:90000});
          const initial=await p360.evaluate(()=>({p:window.__PROAI_CUBE_R1.getPresentationState(),q:window.__PROAI_CUBE_R1.getInteractionState().presentationQuaternion}));
          const began=await p360.evaluate(()=>window.__PROAI_CUBE_R1.beginReviewPresentationMove('inspection-360'));
          const qs=[];for(let i=0;i<=96;i++){const progress=i/96;await p360.evaluate(({progress})=>window.__PROAI_CUBE_R1.setReviewPresentationMoveProgress(progress,progress*8.8),{progress});qs.push(await p360.evaluate(()=>({p:window.__PROAI_CUBE_R1.getPresentationState(),q:window.__PROAI_CUBE_R1.getInteractionState().presentationQuaternion})));}
          let max360=0;for(let i=1;i<qs.length;i++)max360=Math.max(max360,qa(qs[i-1].q,qs[i].q));
          console.log('FULL360_PROBE='+JSON.stringify({began,yawDelta:qs.at(-1).p.anglesDeg.yaw-initial.p.anglesDeg.yaw,maxQuaternionStepRad:max360,last:qs.at(-1).p.lastMove}));
          await browser.close();
          EOF
          node fast-probe.mjs
          rm fast-probe.mjs
      - name: Remove one-shot workflow
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/proai-presentation-r1-fast-probe-once.yml
          git commit -m 'chore: remove Presentation R1.1 fast probe'
          git push origin HEAD:agent/proai-cube-presentation-motion-r1
