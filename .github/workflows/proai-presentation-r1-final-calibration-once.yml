name: ProAI Presentation R1.1 Final Calibration Once

on:
  push:
    branches:
      - agent/proai-cube-presentation-motion-r1
    paths:
      - '.github/workflows/proai-presentation-r1-final-calibration-once.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-presentation-motion-r1
          fetch-depth: 0
      - name: Apply final presentation calibration
        run: |
          set -euo pipefail
          python3 .github/tmp/proai-presentation-r1-final-calibration.py
          node --check docs/site-evolution/spline/proai-cube-presentation-motion-r1/main.js
          node --check docs/site-evolution/spline/proai-cube-presentation-motion-r1/capture.mjs
      - name: Commit calibration and remove transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-presentation-motion-r1/main.js \
                  docs/site-evolution/spline/proai-cube-presentation-motion-r1/capture.mjs
          git rm .github/tmp/proai-presentation-r1-final-calibration.py \
                 .github/workflows/proai-presentation-r1-final-calibration-once.yml
          git commit -m 'refine: calibrate Presentation Motion R1.1 inertia and QA'
          git push origin HEAD:agent/proai-cube-presentation-motion-r1
