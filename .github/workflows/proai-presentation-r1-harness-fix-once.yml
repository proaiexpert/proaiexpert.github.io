name: ProAI Presentation R1.1 Harness Fix Once

on:
  push:
    branches:
      - agent/proai-cube-presentation-motion-r1
    paths:
      - '.github/workflows/proai-presentation-r1-harness-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-presentation-motion-r1
          fetch-depth: 0
      - name: Apply harness fix
        run: |
          set -euo pipefail
          python3 .github/tmp/proai-presentation-r1-harness-fix.py
          node --check docs/site-evolution/spline/proai-cube-presentation-motion-r1/capture.mjs
      - name: Commit fix and remove transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/site-evolution/spline/proai-cube-presentation-motion-r1/capture.mjs
          git rm .github/tmp/proai-presentation-r1-harness-fix.py .github/workflows/proai-presentation-r1-harness-fix-once.yml
          git commit -m 'test: stabilize Presentation Motion R1.1 browser harness'
          git push origin HEAD:agent/proai-cube-presentation-motion-r1
