name: ProAI Presentation R1.1 Start Probe Once
on:
  push:
    branches: [agent/proai-cube-presentation-motion-r1]
    paths: ['.github/workflows/proai-presentation-r1-start-probe-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-presentation-motion-r1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-presentation-motion-r1
          fetch-depth: 0
      - run: |
          npm install --package-lock=false
          npx playwright install chromium
      - run: |
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/start-probe-vite.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Probe start lifecycle
        run: |
          cat > start-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--use-angle=swiftshader']});
          const p=await b.newPage({viewport:{width:900,height:1040}});
          await p.goto('http://127.0.0.1:4173/?qa=1',{waitUntil:'networkidle',timeout:120000});
          await p.waitForFunction(()=>window.__PROAI_CUBE_R1?.ready===true,null,{timeout:90000});
          const before=await p.evaluate(()=>window.__PROAI_CUBE_R1.getInteractionState());
          const immediate=await p.evaluate(()=>{
            const api=window.__PROAI_CUBE_R1;
            const promise=api.runPresentationMove({id:'start-probe',yawDeg:156,targetPitchDeg:6,targetRollDeg:-.8,pitchWaveDeg:4.8,rollWaveDeg:.65,durationMs:30000,settleMs:1350,easing:[.48,0,.38,1],sliceTrigger:.72});
            window.__probePromise=promise;
            return {state:api.getInteractionState(), promiseType:typeof promise, isPromise:Boolean(promise?.then)};
          });
          await p.waitForTimeout(250);
          const t250=await p.evaluate(()=>window.__PROAI_CUBE_R1.getInteractionState());
          await p.waitForTimeout(1000);
          const t1250=await p.evaluate(()=>window.__PROAI_CUBE_R1.getInteractionState());
          console.log('START_PROBE='+JSON.stringify({before,immediate,t250,t1250}));
          await b.close();
          EOF
          node start-probe.mjs
          rm start-probe.mjs
      - name: Remove probe workflow
        if: always()
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/proai-presentation-r1-start-probe-once.yml
          git commit -m 'chore: remove Presentation R1.1 start probe'
          git push origin HEAD:agent/proai-cube-presentation-motion-r1
