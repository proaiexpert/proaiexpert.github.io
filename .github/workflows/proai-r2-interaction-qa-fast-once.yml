name: ProAI R2 Interaction QA Fast Once

on:
  push:
    branches:
      - review/proai-hero-final-motion-r2-interaction-polish
    paths:
      - '.github/workflows/proai-r2-interaction-qa-fast-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state='pending' -f context='proai/final-motion-r2-interaction-polish-fast' -f description='Parallel interaction QA running' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start review server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/proai-r2-fast-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/docs/site-evolution/reviews/proai-hero-final-motion-r2-interaction-polish/review.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/proai-r2-fast-server.log; exit 1
      - name: Parallelize identical QA contexts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/site-evolution/reviews/proai-hero-final-motion-r2-interaction-polish/qa.mjs')
          s=p.read_text(encoding='utf-8')
          old="""  const core = await coreAudit(browser);
  const seeds = [];
  for (const seed of SEEDS) seeds.push(await seedWatch(browser, seed));
  const desktop = await desktopInteraction(browser);
  const mobile = await mobileInteraction(browser);"""
          new="""  const [core, seeds, desktop, mobile] = await Promise.all([
    coreAudit(browser),
    Promise.all(SEEDS.map((seed) => seedWatch(browser, seed))),
    desktopInteraction(browser),
    mobileInteraction(browser),
  ]);"""
          if s.count(old)!=1: raise SystemExit('QA orchestration target mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Run identical interaction QA
        id: qa_run
        continue-on-error: true
        run: node docs/site-evolution/reviews/proai-hero-final-motion-r2-interaction-polish/qa.mjs
      - name: Verify executable live review
        id: live
        continue-on-error: true
        run: |
          URL="https://raw.githack.com/proaiexpert/proaiexpert.github.io/33f037145be1586527c0043501a27ec8c4acf4cd/docs/site-evolution/reviews/proai-hero-final-motion-r2-interaction-polish/review.html"
          for i in {1..18}; do curl -fsS "$URL" | grep -q '145ca598a1b4e36b5d5bd6e12a9258551690da3e' && { echo "LIVE_REVIEW=PASS"; echo "$URL"; exit 0; }; sleep 5; done
          exit 1
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-motion-r2-interaction-polish-qa-fast-observable
          path: docs/site-evolution/reviews/proai-hero-final-motion-r2-interaction-polish/qa-artifacts/
          if-no-files-found: warn
      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_OUTCOME: ${{ steps.qa_run.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          if [ "$QA_OUTCOME" = success ] && [ "$LIVE_OUTCOME" = success ]; then STATE=success; DESC='Parallel interaction QA and live review PASS'; else STATE=failure; DESC="QA=$QA_OUTCOME; live=$LIVE_OUTCOME"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context='proai/final-motion-r2-interaction-polish-fast' -f description="$DESC" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Enforce final gate
        if: always()
        env:
          QA_OUTCOME: ${{ steps.qa_run.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          test "$QA_OUTCOME" = success
          test "$LIVE_OUTCOME" = success
