name: ProAI Cube R4.4.3 Closed Phrase Rescue Inspect

on:
  push:
    branches: [agent/proai-cube-r443-closed-phrase-rescue-review]

permissions:
  contents: read

jobs:
  inspect-pretransform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_SHA: f616a6b620228c10322bb695b39c6cb3fb07be4a
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      PRODUCT_DIR: /tmp/proai-r443-rescue-product
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact starting product and freeze refs
        run: |
          set -euo pipefail
          git fetch origin main agent/proai-cube-semantic-brand-face-r4 --depth=1
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/agent/proai-cube-semantic-brand-face-r4)" = "$OLD_SHA"
          rm -rf "$PRODUCT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          test "$(git -C "$PRODUCT_DIR" rev-parse HEAD)" = "$PRODUCT_SHA"
      - name: Generate exact pre-closed-phrase stage
        working-directory: /tmp/proai-r443-rescue-product/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          timeout 180s npm install --package-lock=false
          node prepare-r4.mjs
          node clock-r4.mjs
          node material-polish-r4.mjs
          node material-polish-r442-runtime.mjs
          node material-polish-r443-runtime.mjs
          node material-polish-r443-sequence-hotfix.mjs
          node --check main.generated.js
      - name: Prove actual scheduler and diagnostics boundaries
        working-directory: /tmp/proai-r443-rescue-product/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('main.generated.js','utf8');
          const tokens=[
            'async function sliceSchedulerLoop(){',
            'sliceSchedulerRunning=false}',
            'sliceSchedulerRunning = false;',
            'function getSemanticDiagnostics() {',
            'r442Cadence:SEMANTIC_R442_CADENCE,',
            'r443Lifecycle:',
            'r443Motion:',
            'function cubicBezierEase('
          ];
          for(const token of tokens){
            const hits=[];let p=-1;while((p=s.indexOf(token,p+1))>=0)hits.push(p);
            console.log(`BOUNDARY ${JSON.stringify(token)} COUNT=${hits.length} POS=${hits.join(',')||'NONE'}`);
          }
          const ss=s.indexOf('async function sliceSchedulerLoop(){');
          const legacyEnd=s.indexOf('sliceSchedulerRunning=false}',ss);
          const spacedEnd=s.indexOf('sliceSchedulerRunning = false;',ss);
          const diag=s.indexOf('r443Motion:');
          const getSem=s.indexOf('function getSemanticDiagnostics() {');
          console.log(`COMPARISON schedulerStart=${ss} legacyEnd=${legacyEnd} spacedEnd=${spacedEnd} getSemanticDiagnostics=${getSem} r443Motion=${diag}`);
          for(const [name,pos] of [['schedulerStart',ss],['legacyEnd',legacyEnd],['spacedEnd',spacedEnd],['getSemanticDiagnostics',getSem],['r443Motion',diag]]){
            if(pos<0)continue;
            console.log(`SNIP ${name} START`);
            console.log(s.slice(Math.max(0,pos-350),Math.min(s.length,pos+950)));
            console.log(`SNIP ${name} END`);
          }
          if(ss<0||diag<0)throw new Error('required actual source structure missing');
          console.log('BOUNDARY_INSPECT_PASS');
          NODE
