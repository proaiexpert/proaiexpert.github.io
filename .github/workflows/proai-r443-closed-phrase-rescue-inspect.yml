name: ProAI Cube R4.4.3 Closed Phrase Rescue Inspect

on:
  push:
    branches: [agent/proai-cube-r443-closed-phrase-rescue-review]

permissions:
  contents: read

jobs:
  inspect-pretransform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_SHA: f616a6b620228c10322bb695b39c6cb3fb07be4a
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      PRODUCT_DIR: /tmp/proai-r443-rescue-product
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact starting product and freeze refs
        run: |
          set -euo pipefail
          git fetch origin main agent/proai-cube-semantic-brand-face-r4 --depth=1
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/agent/proai-cube-semantic-brand-face-r4)" = "$OLD_SHA"
          rm -rf "$PRODUCT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          test "$(git -C "$PRODUCT_DIR" rev-parse HEAD)" = "$PRODUCT_SHA"
      - name: Generate exact pre-closed-phrase stage
        working-directory: /tmp/proai-r443-rescue-product/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          timeout 180s npm install --package-lock=false
          node prepare-r4.mjs
          node clock-r4.mjs
          node material-polish-r4.mjs
          node material-polish-r442-runtime.mjs
          node material-polish-r443-runtime.mjs
          node material-polish-r443-sequence-hotfix.mjs
          node --check main.generated.js
      - name: Prove actual lifecycle replacement boundary
        working-directory: /tmp/proai-r443-rescue-product/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('main.generated.js','utf8');
          const keys={
            lifecycleStart:'const SEMANTIC_R443_PHASE=Object.freeze(',
            lifecycleEnd:'function semanticR442ReleaseProtection(',
            protectionUpdate:'function semanticR442UpdateProtectionState(){',
            moveIntersection:'function semanticR442MoveIntersection(',
            diagnostics:'function getSemanticDiagnostics() {',
            r443Lifecycle:'r443Lifecycle:',
            r443Motion:'r443Motion:',
            recentWeight:'function semanticR442RecentWeight(move){',
            recordMove:"function semanticR442RecordMove(move,phase='forward'){",
            scheduler:'async function sliceSchedulerLoop(){'
          };
          const pos={};
          for(const [name,token] of Object.entries(keys)){
            const hits=[];let p=-1;while((p=s.indexOf(token,p+1))>=0)hits.push(p);
            pos[name]=hits[0]??-1;
            console.log(`STRUCT ${name} COUNT=${hits.length} POS=${hits.join(',')||'NONE'}`);
          }
          console.log('ORDER '+JSON.stringify(pos));
          const crossesDiagnostics=pos.lifecycleStart>=0&&pos.lifecycleEnd>pos.r443Motion&&pos.lifecycleStart<pos.diagnostics;
          console.log('LIFECYCLE_RANGE_CROSSES_DIAGNOSTICS='+crossesDiagnostics);
          for(const name of ['lifecycleStart','diagnostics','r443Motion','lifecycleEnd','protectionUpdate']){
            const p=pos[name];if(p<0)continue;
            console.log(`SNIP ${name} START`);
            console.log(s.slice(Math.max(0,p-300),Math.min(s.length,p+1000)));
            console.log(`SNIP ${name} END`);
          }
          if(Object.values(pos).some(p=>p<0))throw new Error('required lifecycle inspection token missing');
          if(!crossesDiagnostics)throw new Error('observed lifecycle range did not prove expected crossing');
          console.log('LIFECYCLE_BOUNDARY_PROOF_PASS');
          NODE
