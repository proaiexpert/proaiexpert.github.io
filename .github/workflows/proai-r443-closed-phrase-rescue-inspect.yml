name: ProAI Cube R4.4.3 Closed Phrase Rescue Inspect

on:
  push:
    branches: [agent/proai-cube-r443-closed-phrase-rescue-review]

permissions:
  contents: read

jobs:
  inspect-pretransform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_SHA: f616a6b620228c10322bb695b39c6cb3fb07be4a
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      PRODUCT_DIR: /tmp/proai-r443-rescue-product
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and generate exact pre-transform source
        run: |
          set -euo pipefail
          git fetch origin main agent/proai-cube-semantic-brand-face-r4 --depth=1
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/agent/proai-cube-semantic-brand-face-r4)" = "$OLD_SHA"
          rm -rf "$PRODUCT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          timeout 180s npm install --package-lock=false
          node prepare-r4.mjs
          node clock-r4.mjs
          node material-polish-r4.mjs
          node material-polish-r442-runtime.mjs
          node material-polish-r443-runtime.mjs
          node material-polish-r443-sequence-hotfix.mjs
          node --check main.generated.js
      - name: Locate exact injected R443 lifecycle end and following stable token
        working-directory: /tmp/proai-r443-rescue-product/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('main.generated.js','utf8');
          const start=s.indexOf('const SEMANTIC_R443_PHASE=Object.freeze(');
          const release=s.indexOf("function semanticR443Release(reason='optical-exit')",start);
          if(start<0||release<0)throw new Error(`missing lifecycle start/release ${start}/${release}`);
          console.log(`LIFECYCLE_START=${start} RELEASE_START=${release}`);
          console.log('RELEASE_AND_FOLLOWING_START');
          console.log(s.slice(release,Math.min(s.length,release+6000)));
          console.log('RELEASE_AND_FOLLOWING_END');
          const candidates=[
            'let semanticR442ActiveMaterialFace=',
            'const semanticR442FaceRegistry=',
            'function semanticR442SetActiveMaterialFace(',
            'function semanticR442EvaluateFace(',
            'function semanticR442BestFaceCandidate(',
            'function updateSemanticPhysicalMaterial(',
            'function getSemanticDiagnostics() {'
          ];
          for(const token of candidates){const p=s.indexOf(token,release);console.log(`AFTER ${JSON.stringify(token)} POS=${p}`)}
          console.log('LIFECYCLE_END_INSPECT_PASS');
          NODE
