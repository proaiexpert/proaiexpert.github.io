name: ProAI Cube R4.4.3 Owner Final QA

on:
  push:
    branches: [agent/proai-cube-r443-semantic-staging-review]
    paths: [.github/workflows/proai-r443-owner-final-qa.yml]

permissions:
  contents: read

jobs:
  metrics:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: seed1
            seed: '0x51a7c0de'
          - label: seed2
            seed: '0x6e624eb7'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCT_SHA: 041756079613719f53a898e1e1751a2832d597bb
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      PRODUCT_DIR: /tmp/r443-owner-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify frozen refs and build exact product
        run: |
          set -euo pipefail
          git fetch origin agent/proai-cube-r443-closed-phrase-architecture agent/proai-cube-semantic-brand-face-r4 main
          test "$(git rev-parse origin/agent/proai-cube-r443-closed-phrase-architecture)" = "$PRODUCT_SHA"
          test "$(git rev-parse origin/agent/proai-cube-semantic-brand-face-r4)" = "$OLD_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false
          npm run validate-closed-phrases
          npm run build-r443
          node --check main.generated.js
          grep -Fq '"coreArchetypeCount": 16' <(npm run validate-closed-phrases 2>/dev/null)
          grep -Fq 'firstSemanticDelayMs:3200' main.generated.js
          grep -Fq 'stageTimeoutMs:3800' main.generated.js
          grep -Fq 'maxReadableHoldMs:1600' main.generated.js
          grep -Fq "architecture:'CURATED_VISUAL_SAFE_STATE_RING'" main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js
          grep -Fq 'semanticVelocityMultiplier: 1.0' main.generated.js
          grep -Fq 'semanticOrientationForcing:false' main.generated.js
          grep -Fq 'edgeRoughnessInk:.095' main.generated.js
          grep -Fq 'scaleX:.875,scaleY:.900' main.generated.js
          ! grep -Fq 'const CYCLE_SPECS=' main.generated.js
          ! grep -Fq 'seededUnit()<.58' main.generated.js
          ! grep -Fq 'semanticR443PendingResolutionCount' main.generated.js
          ! grep -Fq "semanticR442RecordMove(inverse,'resolve')" main.generated.js
      - name: Prepare review-only real-time runtime
        working-directory: /tmp/r443-owner-${{ matrix.label }}/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const f='main.generated.js';let s=fs.readFileSync(f,'utf8');const draw='renderer.render(scene, camera);',n=s.split(draw).length-1;if(n<1)throw new Error('no product render calls');s=s.split(draw).join('scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');fs.writeFileSync(f,s);console.log('QA_ONLY_RASTER_DISABLED='+n);
          NODE
          node "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-owner-qa-inject.mjs" main.generated.js
          node --check main.generated.js
          npx vite build
          npm install --no-save playwright-core
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-owner-qa.mjs" ./owner-qa.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start QA runtime
        working-directory: /tmp/r443-owner-${{ matrix.label }}/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-owner-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done; cat /tmp/r443-owner-http.log; exit 1
      - name: Run 50s presentation acceptance
        working-directory: /tmp/r443-owner-${{ matrix.label }}/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        env:
          QA_SEED: ${{ matrix.seed }}
          QA_LABEL: ${{ matrix.label }}
          QA_OUT: review-evidence/${{ matrix.label }}
          SAMPLE_PRESENTATION_MS: '50000'
        run: timeout 75s node owner-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r443-owner-${{ matrix.label }}
          path: /tmp/r443-owner-${{ matrix.label }}/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/${{ matrix.label }}/**
          retention-days: 2

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PRODUCT_SHA: 041756079613719f53a898e1e1751a2832d597bb
      PRODUCT_DIR: /tmp/r443-owner-visual
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build exact product and prepare visual runtime
        run: |
          set -euo pipefail
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false
          npm run build-r443
          node <<'NODE'
          const fs=require('fs');const f='main.generated.js';let s=fs.readFileSync(f,'utf8');const draw='renderer.render(scene, camera);',n=s.split(draw).length-1;if(n<1)throw new Error('no product render calls');s=s.split(draw).join('scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');fs.writeFileSync(f,s);
          NODE
          node "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-owner-qa-inject.mjs" main.generated.js
          node --check main.generated.js
          npx vite build
          npm install --no-save playwright-core
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-owner-visual.mjs" ./owner-visual.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-owner-visual-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; test "$i" -lt 40; done
      - name: Capture real WebGL first-ten-second evidence
        working-directory: /tmp/r443-owner-visual/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        env:
          QA_SEED: '0x51a7c0de'
          QA_OUT: review-evidence/visual
        run: timeout 60s node owner-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r443-owner-visual
          path: /tmp/r443-owner-visual/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/visual/**
          retention-days: 2
