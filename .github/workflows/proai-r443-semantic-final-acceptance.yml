name: ProAI Cube R4.4.3 Semantic Final Acceptance

on:
  push:
    branches: [agent/proai-cube-r443-semantic-staging-review]
    paths: [.github/workflows/proai-r443-semantic-final-acceptance.yml]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_SHA: 30bd716a00aacdd416c596a016076586850d2719
      PRODUCT_BRANCH: agent/proai-cube-r443-closed-phrase-architecture
      OLD_BRANCH: agent/proai-cube-semantic-brand-face-r4
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      PRODUCT_DIR: /tmp/proai-r443-semantic-final
      TARGET_PRESENTATION_MS: '90000'
      MAX_WALL_MS: '95000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact product and frozen refs
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH" "$OLD_BRANCH" main
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_SHA"
          test "$(git rev-parse "origin/$OLD_BRANCH")" = "$OLD_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

      - name: Build exact final product and validate invariants
        run: |
          set -euo pipefail
          rm -rf "$PRODUCT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false
          npm run validate-closed-phrases
          npm run build-r443
          node --check main.generated.js
          grep -Fq 'stageScoreMin:.12' main.generated.js
          grep -Fq 'stageScoreMax:.59' main.generated.js
          grep -Fq 'stageViewMin:.36' main.generated.js
          grep -Fq 'stageAreaMin:.20' main.generated.js
          grep -Fq 'stageBrdfMin:0' main.generated.js
          grep -Fq 'stageAbortScore:0' main.generated.js
          grep -Fq 'stageTimeoutMs:20000' main.generated.js
          grep -Fq 'candidateApproachScore:.58' main.generated.js
          grep -Fq 'enterScore:.64' main.generated.js
          grep -Fq "SEMANTIC_R442_ELIGIBLE_FACES=Object.freeze(['+Z','+X','-X'])" main.generated.js
          grep -Fq 'semanticVelocityMultiplier: 1.0' main.generated.js
          grep -Fq 'semanticOrientationForcing:false' main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js
          grep -Fq "semanticR443Unstage('impending-intersecting-turn')" main.generated.js
          grep -Fq 'function semanticR443ChooseNormalPhrase(){' main.generated.js
          ! grep -Fq 'semanticR443PendingResolutionCount' main.generated.js
          ! grep -Fq "semanticR442RecordMove(inverse,'resolve')" main.generated.js
          grep -Fq 'edgeRoughnessInk:.095' main.generated.js

      - name: Prepare review-only real-time trajectory with one-shot real render
        run: |
          set -euo pipefail
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          node "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semantic-forensic-inject.mjs" main.generated.js
          node <<'NODE'
          const fs=require('fs');const file='main.generated.js';let s=fs.readFileSync(file,'utf8');
          const draw='renderer.render(scene, camera);';const count=s.split(draw).length-1;
          if(count!==2)throw new Error('expected two product render calls before final extension, got '+count);
          s=s.split(draw).join('scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');
          fs.writeFileSync(file,s);
          console.log('QA_ONLY_PRODUCT_RASTER_DRAW_DISABLED count='+count);
          NODE
          node "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semantic-final-extension.mjs" main.generated.js
          node --check main.generated.js
          grep -Fq 'renderOnce(){' main.generated.js
          npx vite build

      - name: Install lightweight browser probe
        working-directory: /tmp/proai-r443-semantic-final/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semantic-final-qa.mjs" ./r443-semantic-final-qa.mjs

      - name: Start exact acceptance runtime
        working-directory: /tmp/proai-r443-semantic-final/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-semantic-final-http.log 2>&1 &
          for i in $(seq 1 45); do if curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/r443-semantic-final-http.log; exit 1

      - name: Run 45-75s presentation acceptance and real readable render
        working-directory: /tmp/proai-r443-semantic-final/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        env:
          QA_URL: http://127.0.0.1:4173/
          QA_OUT: review-evidence/r443-semantic-final
        run: |
          set -euo pipefail
          timeout 135s node r443-semantic-final-qa.mjs

      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r443-semantic-final-acceptance
          path: /tmp/proai-r443-semantic-final/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r443-semantic-final/**
          retention-days: 2
