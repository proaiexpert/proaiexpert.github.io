name: ProAI Cube R4.4.3 Semantic Staging Forensic

on:
  push:
    branches: [agent/proai-cube-r443-semantic-staging-review]
    paths:
      - .github/review/proai-cube-r443-semantic-forensic-inject.mjs
      - .github/review/proai-cube-r443-semantic-forensic-qa.mjs
      - .github/workflows/proai-r443-semantic-forensic.yml

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCT_SHA: f33c27733ca9f4272ca724e3d6ee7a44fbfe37b8
      PRODUCT_BRANCH: agent/proai-cube-r443-closed-phrase-architecture
      OLD_BRANCH: agent/proai-cube-semantic-brand-face-r4
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      PRODUCT_DIR: /tmp/proai-r443-semantic-forensic
      WALL_LIMIT_MS: '150000'
      TARGET_PRESENTATION_MS: '36000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen refs
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH" "$OLD_BRANCH" main
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_SHA"
          test "$(git rev-parse "origin/$OLD_BRANCH")" = "$OLD_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"

      - name: Build exact product and inject review-only forensic hooks
        run: |
          set -euo pipefail
          rm -rf "$PRODUCT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false
          npm run validate-closed-phrases
          npm run build-r443
          node --check main.generated.js
          node "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semantic-forensic-inject.mjs" main.generated.js
          node --check main.generated.js
          npx vite build
          grep -Fq 'R4.4.3 SEMANTIC STAGING FORENSIC REVIEW-ONLY' main.generated.js
          grep -Fq "SEMANTIC_R442_ELIGIBLE_FACES=Object.freeze(['+Z','+X','-X'])" main.generated.js
          grep -Fq 'semanticVelocityMultiplier: 1.0' main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js

      - name: Install browser probe without FFmpeg or video tooling
        working-directory: /tmp/proai-r443-semantic-forensic/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          npm install --no-save playwright-core
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semantic-forensic-qa.mjs" ./r443-semantic-forensic-qa.mjs

      - name: Start exact instrumented product
        working-directory: /tmp/proai-r443-semantic-forensic/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-semantic-http.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r443-semantic-http.log
          exit 1

      - name: Run realistic-clock semantic forensic sample
        working-directory: /tmp/proai-r443-semantic-forensic/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        env:
          QA_URL: http://127.0.0.1:4173/
          QA_OUT: review-evidence/r443-semantic-forensic
        run: |
          set -euo pipefail
          timeout 210s node r443-semantic-forensic-qa.mjs

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r443-semantic-forensic
          path: /tmp/proai-r443-semantic-forensic/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r443-semantic-forensic/**
          retention-days: 2
