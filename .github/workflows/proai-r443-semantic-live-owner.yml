name: ProAI Cube R4.4.3 Semantic Staging Live Owner

on:
  push:
    branches: [agent/proai-cube-r443-semantic-staging-review]
    paths: [.github/workflows/proai-r443-semantic-live-owner.yml]

permissions:
  contents: read

jobs:
  live-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      PRODUCT_SHA: 30bd716a00aacdd416c596a016076586850d2719
      PRODUCT_BRANCH: agent/proai-cube-r443-closed-phrase-architecture
      OLD_BRANCH: agent/proai-cube-semantic-brand-face-r4
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      PRODUCT_DIR: /tmp/proai-r443-semantic-live
      PORT: '4173'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen refs and build exact accepted product
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH" "$OLD_BRANCH" main
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_SHA"
          test "$(git rev-parse "origin/$OLD_BRANCH")" = "$OLD_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          rm -rf "$PRODUCT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          test "$(git -C "$PRODUCT_DIR" rev-parse HEAD)" = "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          timeout 180s npm install --package-lock=false
          timeout 30s npm run validate-closed-phrases >/tmp/r443-semantic-live-library.txt
          timeout 180s npm run build-r443
          node --check main.generated.js
          grep -Fq 'stageScoreMin:.12' main.generated.js
          grep -Fq 'stageBrdfMin:0' main.generated.js
          grep -Fq 'stageAbortScore:0' main.generated.js
          grep -Fq 'stageTimeoutMs:20000' main.generated.js
          grep -Fq 'candidateApproachScore:.58' main.generated.js
          grep -Fq 'enterScore:.64' main.generated.js
          grep -Fq 'function semanticR443ChooseNormalPhrase(){' main.generated.js
          grep -Fq "SEMANTIC_R442_ELIGIBLE_FACES=Object.freeze(['+Z','+X','-X'])" main.generated.js
          grep -Fq 'semanticVelocityMultiplier: 1.0' main.generated.js
          grep -Fq 'semanticOrientationForcing:false' main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js
          ! grep -Fq 'semanticR443PendingResolutionCount' main.generated.js
          ! grep -Fq "semanticR442RecordMove(inverse,'resolve')" main.generated.js

      - name: Start exact product and temporary HTTPS tunnel
        working-directory: /tmp/proai-r443-semantic-live/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          nohup python3 -m http.server "$PORT" --bind 127.0.0.1 --directory dist >/tmp/r443-semantic-live-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS --max-time 3 "http://127.0.0.1:$PORT/" >/dev/null && break; sleep 1; test "$i" -lt 40; done
          curl -fsSL --max-time 90 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2; do
            LOG="/tmp/r443-semantic-cloudflare-${attempt}.log"
            nohup /tmp/cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$PORT" >"$LOG" 2>&1 &
            PID=$!
            for i in $(seq 1 50); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              if [ -n "$URL" ] && curl -fsSL --max-time 10 "$URL/" >/tmp/r443-semantic-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
              sleep 1
            done
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          echo "REVIEW_URL=$REVIEW_URL" >> "$GITHUB_ENV"

      - name: Public static validation
        working-directory: /tmp/proai-r443-semantic-live/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -L -o /tmp/r443-semantic-index.html -w '%{http_code}' --max-time 20 "$REVIEW_URL/")
          test "$HTTP_CODE" = '200'
          CSS=$(sed -n 's/.*href="\([^"]*\.css\)".*/\1/p' /tmp/r443-semantic-index.html | head -1)
          JS=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' /tmp/r443-semantic-index.html | head -1)
          test -n "$CSS"; test -n "$JS"
          curl -fsSL --max-time 20 "$REVIEW_URL$CSS" -o /tmp/r443-semantic-app.css
          curl -fsSL --max-time 20 "$REVIEW_URL$JS" -o /tmp/r443-semantic-app.js
          test -s /tmp/r443-semantic-app.css; test -s /tmp/r443-semantic-app.js
          GLB=$(grep -Eo 'rubik_39_s_cube_animation-[A-Za-z0-9_-]+\.glb' /tmp/r443-semantic-app.js | head -1)
          test -n "$GLB"
          curl -fsSL --max-time 20 "$REVIEW_URL/assets/$GLB" -o /tmp/r443-semantic-cube.glb
          test "$(wc -c </tmp/r443-semantic-cube.glb | tr -d ' ')" -eq 279412
          printf '%s\n' \
            "PRODUCT_SHA=$PRODUCT_SHA" \
            "LIVE_OWNER_URL=$REVIEW_URL" \
            'EXPECTED_LIFETIME=approximately 3 hours' \
            'HTTP=PASS' 'HTML=PASS' 'CSS=PASS' 'JS=PASS' 'Three.js=PASS' 'GLB=PASS' 'VIDEO=NONE' > live-owner-url.txt
          cat live-owner-url.txt

      - name: Upload live Owner URL
        uses: actions/upload-artifact@v4
        with:
          name: r443-semantic-staging-live-owner
          path: /tmp/proai-r443-semantic-live/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/live-owner-url.txt
          retention-days: 1

      - name: Keep temporary review URL alive
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do curl -fsSL --max-time 10 "$REVIEW_URL/" >/dev/null; sleep 60; done
