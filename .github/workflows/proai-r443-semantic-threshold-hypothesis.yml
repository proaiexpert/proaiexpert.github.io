name: ProAI Cube R4.4.3 Semantic Threshold Hypothesis

on:
  push:
    branches: [agent/proai-cube-r443-semantic-staging-review]
    paths: [.github/workflows/proai-r443-semantic-threshold-hypothesis.yml]

permissions:
  contents: read

jobs:
  hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCT_SHA: ff1f6063f19a7076fb0f71b902bff615e7318600
      PRODUCT_BRANCH: agent/proai-cube-r443-closed-phrase-architecture
      OLD_BRANCH: agent/proai-cube-semantic-brand-face-r4
      OLD_SHA: fce017a1a4c83fa4dfeb1d9bd97021f6f92a23ad
      MAIN_SHA: c945084e1952c05c686494091f7dbca0f7acdf08
      PRODUCT_DIR: /tmp/proai-r443-semantic-hypothesis
      WALL_LIMIT_MS: '90000'
      TARGET_PRESENTATION_MS: '76000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen refs
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH" "$OLD_BRANCH" main
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_SHA"
          test "$(git rev-parse "origin/$OLD_BRANCH")" = "$OLD_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
      - name: Build exact product and apply review-only staging hypothesis
        run: |
          set -euo pipefail
          rm -rf "$PRODUCT_DIR"
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false >/dev/null
          npm run validate-closed-phrases >/tmp/r443-hyp-library.txt
          npm run build-r443 >/tmp/r443-hyp-build.txt
          node --check main.generated.js
          node "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semantic-forensic-inject.mjs" main.generated.js
          node <<'NODE'
          const fs=require('fs');const file='main.generated.js';let s=fs.readFileSync(file,'utf8');
          const reps=[
            ['stageScoreMin:.40','stageScoreMin:.12'],
            ['stageBrdfMin:.10','stageBrdfMin:0'],
            ['stageAbortScore:.32','stageAbortScore:0'],
            ['stageTimeoutMs:1500','stageTimeoutMs:20000'],
          ];
          for(const [a,b] of reps){const n=s.split(a).length-1;if(n!==1)throw new Error(a+' count '+n);s=s.replace(a,b)}
          const draw='renderer.render(scene, camera);';const draws=s.split(draw).length-1;if(draws!==2)throw new Error('render count '+draws);
          s=s.split(draw).join('scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');
          fs.writeFileSync(file,s);
          console.log('QA_ONLY_STAGING_HYPOTHESIS scoreMin=.12 brdfMin=0 abort=0 timeout=20000');
          NODE
          node --check main.generated.js
          grep -Fq 'stageScoreMin:.12' main.generated.js
          grep -Fq 'stageBrdfMin:0' main.generated.js
          grep -Fq 'stageAbortScore:0' main.generated.js
          grep -Fq 'stageTimeoutMs:20000' main.generated.js
          grep -Fq 'candidateApproachScore:.58' main.generated.js
          grep -Fq 'enterScore:.64' main.generated.js
          grep -Fq 'semanticVelocityMultiplier: 1.0' main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js
          npx vite build >/tmp/r443-hyp-vite.txt
      - name: Install lightweight browser probe
        working-directory: /tmp/proai-r443-semantic-hypothesis/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          npm install --no-save playwright-core >/dev/null
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semantic-forensic-qa.mjs" ./r443-semantic-forensic-qa.mjs
      - name: Start review-only hypothesis runtime
        working-directory: /tmp/proai-r443-semantic-hypothesis/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-hyp-http.log 2>&1 &
          for i in $(seq 1 45); do if curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/r443-hyp-http.log; exit 1
      - name: Run staging hypothesis trajectory
        working-directory: /tmp/proai-r443-semantic-hypothesis/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
        env:
          QA_URL: http://127.0.0.1:4173/
          QA_OUT: review-evidence/r443-semantic-threshold-hypothesis
        run: |
          set -euo pipefail
          timeout 125s node r443-semantic-forensic-qa.mjs
      - name: Upload hypothesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r443-semantic-threshold-hypothesis
          path: /tmp/proai-r443-semantic-hypothesis/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r443-semantic-threshold-hypothesis/**
          retention-days: 2
