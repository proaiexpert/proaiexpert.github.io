name: PROAI R4.4.3 frozen-optics semantic feasibility
on:
  push:
    branches:
      - agent/proai-cube-r443-semantic-staging-review
    paths:
      - .github/workflows/proai-r443-semcap-feasibility.yml
      - .github/review/proai-cube-r443-semcap-feasibility-qa.mjs
jobs:
  feasibility:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_SHA: e4c032cd2e6e521fe5c18109a2992523c650c059
      PRODUCT_DIR: /tmp/r443-feasibility
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact Attempt 1 with QA-only no-slice optical observation window
        run: |
          set -euo pipefail
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false
          npm run build-r443
          python3 - <<'PY'
          from pathlib import Path
          p=Path('main.generated.js');s=p.read_text();a='await schedulerDelay(4800);';b='await schedulerDelay(12000);';assert s.count(a)==1;s=s.replace(a,b);p.write_text(s)
          PY
          node <<'NODE'
          const fs=require('fs');const f='main.generated.js';let s=fs.readFileSync(f,'utf8');const draw='renderer.render(scene, camera);',n=s.split(draw).length-1;if(n<1)throw new Error('no render');s=s.split(draw).join('scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');fs.writeFileSync(f,s);
          NODE
          node "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semcap-startup-inject.mjs" main.generated.js
          node --check main.generated.js
          npx vite build
          npm install --no-save playwright-core
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-semcap-feasibility-qa.mjs" ./feasibility-qa.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start runtime
        run: |
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-feas-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r443-feas-http.log; exit 1
      - name: Measure frozen-optics feasibility 0-8s
        env:
          QA_OUT: review-evidence/feasibility
        run: |
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          timeout 30s node feasibility-qa.mjs | tee /tmp/feasibility.log
          test -f review-evidence/feasibility/feasibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r443-semcap-feasibility
          path: /tmp/r443-feasibility/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/feasibility/**
          retention-days: 2
