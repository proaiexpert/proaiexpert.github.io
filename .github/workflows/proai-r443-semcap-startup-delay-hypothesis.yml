name: PROAI R4.4.3 semantic startup delay hypothesis
on:
  push:
    branches:
      - agent/proai-cube-r443-semantic-staging-review
    paths:
      - .github/workflows/proai-r443-semcap-startup-delay-hypothesis.yml
jobs:
  delay-hypothesis:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        delay: [2100, 2200, 2300, 2400, 2500]
    env:
      PRODUCT_SHA: e4c032cd2e6e521fe5c18109a2992523c650c059
      PRODUCT_DIR: /tmp/r443-delay-${{ matrix.delay }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact Attempt 1 product and apply QA-only delay
        run: |
          set -euo pipefail
          git worktree add --detach "$PRODUCT_DIR" "$PRODUCT_SHA"
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          npm install --package-lock=false
          npm run build-r443
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('main.generated.js');s=p.read_text();old='firstSemanticDelayMs:1600';new=f"firstSemanticDelayMs:{os.environ['DELAY']}"
          assert s.count(old)==1,(s.count(old),old)
          p.write_text(s.replace(old,new))
          PY
          node <<'NODE'
          const fs=require('fs');const f='main.generated.js';let s=fs.readFileSync(f,'utf8');const draw='renderer.render(scene, camera);',n=s.split(draw).length-1;if(n<1)throw new Error('no product render calls');s=s.split(draw).join('scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');fs.writeFileSync(f,s);
          NODE
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-owner-qa-inject.mjs" /tmp/semcap-delay-inject.mjs
          sed -i "s/CURATED_VISUAL_SAFE_STATE_RING/SEMANTIC_CAPABLE_AUTHORED_SAFE_STATE_GRAPH/g" /tmp/semcap-delay-inject.mjs
          node /tmp/semcap-delay-inject.mjs main.generated.js
          node --check main.generated.js
          npx vite build
          npm install --no-save playwright-core
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-owner-qa.mjs" ./owner-qa.mjs
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
        env:
          DELAY: ${{ matrix.delay }}
      - name: Start runtime
        run: |
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-delay-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r443-delay-http.log; exit 1
      - name: Run 25s real-time hypothesis
        env:
          QA_SEED: '0x51a7c0de'
          QA_LABEL: delay-${{ matrix.delay }}
          QA_OUT: review-evidence/delay-${{ matrix.delay }}
          SAMPLE_PRESENTATION_MS: '25000'
        run: |
          cd "$PRODUCT_DIR/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4"
          timeout 45s node owner-qa.mjs || true
          test -f review-evidence/delay-${{ matrix.delay }}/metrics.json
          cat review-evidence/delay-${{ matrix.delay }}/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r443-semcap-delay-${{ matrix.delay }}
          path: /tmp/r443-delay-${{ matrix.delay }}/docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/delay-${{ matrix.delay }}/**
          retention-days: 2
