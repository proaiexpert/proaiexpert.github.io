name: ProAI Semantic R2 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-moment-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2

    steps:
      - name: Checkout Semantic R2 review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Focused source locks
        shell: bash
        run: |
          set -euo pipefail
          python verify-freeze.py
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          node --check main.js
          if grep -niE '@splinetool|prod\.spline\.design|\.splinecode' main.js index.html package.json styles.css; then exit 1; fi
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD -- index.html ru/index.html)"

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb x11-utils xdotool

      - name: Build and start review runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/proai-r2-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/proai-r2-vite.log
          exit 1

      - name: Short sample then full continuous 720 capture
        shell: bash
        env:
          PROAI_URL: http://127.0.0.1:4173/
          DISPLAY: :99
        run: |
          set -euo pipefail
          rm -rf review-artifact
          mkdir -p review-artifact

          Xvfb :99 -screen 0 1024x1024x24 -ac +extension GLX +render -noreset >/tmp/proai-r2-xvfb.log 2>&1 &
          XVFB_PID=$!
          cleanup() { kill "$XVFB_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.25
          done
          xdpyinfo -display :99 | grep -E 'dimensions:|depth of root window:'

          cat > .capture-pr.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawn, spawnSync } from 'node:child_process';

          const W = 720;
          const H = 720;
          const ROOT_W = 1024;
          const ROOT_H = 1024;
          const FPS = 24;
          const SAMPLE_SEC = 3.4;
          const FULL_SEC = 30.0;
          const MARK = 10;
          const DISPLAY = process.env.DISPLAY || ':99';
          const URL = process.env.PROAI_URL || 'http://127.0.0.1:4173/';
          const OUT = path.resolve('review-artifact');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const dist3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

          function exec(bin, args, options = {}) {
            const r = spawnSync(bin, args, { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024, ...options });
            if (r.status !== 0) {
              console.error(`COMMAND_FAILED ${bin} ${args.map((x) => JSON.stringify(x)).join(' ')}`);
              console.error(r.stdout?.toString() || '');
              console.error(r.stderr?.toString() || '');
              throw new Error(`${bin} failed (${r.status})`);
            }
            return r.stdout;
          }

          function probe(file) {
            return JSON.parse(exec('ffprobe', [
              '-v', 'error', '-select_streams', 'v:0',
              '-show_entries', 'stream=codec_name,pix_fmt,width,height,r_frame_rate,avg_frame_rate',
              '-show_entries', 'format=duration,size', '-of', 'json', file,
            ]));
          }

          function verifyMp4(file, minDuration) {
            if (!fs.existsSync(file) || fs.statSync(file).size <= 0) throw new Error(`Missing/empty MP4 ${file}`);
            const p = probe(file);
            const s = p.streams?.[0] || {};
            const duration = Number(p.format?.duration || 0);
            if (!(s.codec_name === 'h264'
              && s.pix_fmt === 'yuv420p'
              && Number(s.width) === W
              && Number(s.height) === H
              && s.r_frame_rate === '24/1'
              && duration >= minDuration)) {
              throw new Error(`MP4 validation failed ${JSON.stringify(p)}`);
            }
            return p;
          }

          function ffmpegArgs(seconds, output, x, y) {
            return [
              '-y', '-hide_banner', '-loglevel', 'warning',
              '-f', 'x11grab', '-draw_mouse', '0', '-framerate', String(FPS),
              '-video_size', `${W}x${H}`, '-i', `${DISPLAY}.0+${x},${y}`,
              '-t', seconds.toFixed(3), '-an',
              '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '18',
              '-pix_fmt', 'yuv420p', '-r', String(FPS), '-fps_mode', 'cfr',
              '-movflags', '+faststart', output,
            ];
          }

          function captureX11(seconds, output, x, y) {
            const args = ffmpegArgs(seconds, output, x, y);
            console.log('FFMPEG_X11_COMMAND', ['ffmpeg', ...args].map((v) => JSON.stringify(v)).join(' '));
            const child = spawn('ffmpeg', args, { stdio: ['ignore', 'ignore', 'pipe'] });
            let stderr = '';
            child.stderr.on('data', (chunk) => {
              stderr += chunk.toString();
              if (stderr.length > 200000) stderr = stderr.slice(-200000);
            });
            return new Promise((resolve, reject) => {
              child.once('error', reject);
              child.once('close', (code) => {
                if (code === 0) return resolve({ args, stderr });
                console.error('FFMPEG_X11_STDERR_START');
                console.error(stderr);
                console.error('FFMPEG_X11_STDERR_END');
                reject(new Error(`ffmpeg x11grab exited ${code}`));
              });
            });
          }

          function rootFrame() {
            const r = spawnSync('ffmpeg', [
              '-v', 'error', '-f', 'x11grab', '-draw_mouse', '0', '-framerate', String(FPS),
              '-video_size', `${ROOT_W}x${ROOT_H}`, '-i', `${DISPLAY}.0+0,0`,
              '-frames:v', '1', '-pix_fmt', 'rgb24', '-f', 'rawvideo', 'pipe:1',
            ], { encoding: null, maxBuffer: 8 * 1024 * 1024 });
            if (r.status !== 0 || r.stdout?.length !== ROOT_W * ROOT_H * 3) {
              console.error(r.stderr?.toString() || '');
              throw new Error(`Unable to obtain X11 calibration frame (${r.stdout?.length || 0} bytes)`);
            }
            return r.stdout;
          }

          function findMarker(buf, kind) {
            const match = kind === 'magenta'
              ? (r, g, b) => r > 235 && g < 25 && b > 235
              : (r, g, b) => r < 25 && g > 235 && b > 235;
            const at = (x, y) => {
              const i = (y * ROOT_W + x) * 3;
              return match(buf[i], buf[i + 1], buf[i + 2]);
            };
            for (let y = 0; y <= ROOT_H - MARK; y += 1) {
              for (let x = 0; x <= ROOT_W - MARK; x += 1) {
                if (!at(x, y)) continue;
                if (at(x + MARK - 1, y) && at(x, y + MARK - 1) && at(x + MARK - 1, y + MARK - 1) && at(x + 4, y + 4)) {
                  return { x, y };
                }
              }
            }
            return null;
          }

          function frameStats(file, seconds) {
            const r = spawnSync('ffmpeg', [
              '-v', 'error', '-ss', seconds.toFixed(3), '-i', file,
              '-frames:v', '1', '-f', 'rawvideo', '-pix_fmt', 'rgb24', 'pipe:1',
            ], { encoding: null, maxBuffer: 8 * 1024 * 1024 });
            if (r.status !== 0 || !r.stdout?.length) throw new Error('Unable to inspect recorded frame');
            const buf = r.stdout;
            let sum = 0;
            let sumSq = 0;
            let bright = 0;
            const pixels = buf.length / 3;
            for (let i = 0; i < buf.length; i += 3) {
              const y = 0.2126 * buf[i] + 0.7152 * buf[i + 1] + 0.0722 * buf[i + 2];
              sum += y;
              sumSq += y * y;
              if (y > 42) bright += 1;
            }
            const mean = sum / pixels;
            return { mean, variance: Math.max(0, sumSq / pixels - mean * mean), brightPixelRatio: bright / pixels };
          }

          function extractFrame(video, seconds, output) {
            exec('ffmpeg', [
              '-y', '-v', 'error', '-ss', Math.max(0, seconds).toFixed(3), '-i', video,
              '-frames:v', '1', '-vf', `scale=${W}:${H}:flags=lanczos`, output,
            ]);
            if (!fs.existsSync(output) || fs.statSync(output).size <= 0) throw new Error(`PNG extraction failed ${output}`);
          }

          function fatalConsole(errors) {
            return errors.filter((v) => /GLB load failed|Uncaught|TypeError|ReferenceError|WebGL context lost/i.test(v));
          }

          async function pageMetrics(page) {
            const metrics = await page.evaluate(() => {
              const c = document.getElementById('cube-canvas');
              const r = c?.getBoundingClientRect();
              return {
                inner: [innerWidth, innerHeight],
                outer: [outerWidth, outerHeight],
                screenPosition: [screenX, screenY],
                dpr: devicePixelRatio,
                canvas: c && r ? [c.width, c.height, r.width, r.height, r.left, r.top] : null,
              };
            });
            const c = metrics.canvas;
            if (metrics.inner[0] !== W || metrics.inner[1] !== H || metrics.dpr !== 1
              || !c || Math.abs(c[2] - W) > 0.5 || Math.abs(c[3] - H) > 0.5
              || Math.abs(c[4]) > 0.5 || Math.abs(c[5]) > 0.5) {
              throw new Error(`Browser content viewport is not exact 720x720 ${JSON.stringify(metrics)}`);
            }
            return metrics;
          }

          function x11WindowGeometry() {
            const rawIds = exec('xdotool', ['search', '--onlyvisible', '--name', 'ProAI Cube']).trim();
            const ids = rawIds.split(/\s+/).filter(Boolean);
            if (!ids.length) throw new Error('Unable to locate Chromium X11 window');
            const id = ids.at(-1);
            const shell = exec('xdotool', ['getwindowgeometry', '--shell', id]);
            const parsed = Object.fromEntries(shell.trim().split('\n').map((line) => line.split('=', 2)));
            const info = exec('xwininfo', ['-id', id]);
            const result = {
              id,
              x: Number(parsed.X), y: Number(parsed.Y),
              width: Number(parsed.WIDTH), height: Number(parsed.HEIGHT),
            };
            console.log('X11_WINDOW_GEOMETRY', JSON.stringify(result));
            console.log('XWININFO', info.replace(/\s+/g, ' ').trim());
            return result;
          }

          async function locateCanvasRegion(page) {
            const metrics = await pageMetrics(page);
            const windowGeometry = x11WindowGeometry();
            await page.evaluate(({ mark }) => {
              const add = (id, css) => {
                const d = document.createElement('div');
                d.id = id;
                Object.assign(d.style, {
                  position: 'fixed', width: `${mark}px`, height: `${mark}px`, zIndex: '2147483647',
                  pointerEvents: 'none', ...css,
                });
                document.documentElement.appendChild(d);
              };
              add('__x11_tl', { left: '0', top: '0', background: 'rgb(255,0,255)' });
              add('__x11_br', { right: '0', bottom: '0', background: 'rgb(0,255,255)' });
            }, { mark: MARK });
            await page.evaluate(() => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))));
            await sleep(120);
            const raw = rootFrame();
            const tl = findMarker(raw, 'magenta');
            const br = findMarker(raw, 'cyan');
            await page.evaluate(() => {
              document.getElementById('__x11_tl')?.remove();
              document.getElementById('__x11_br')?.remove();
            });
            await page.evaluate(() => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))));
            if (!tl) throw new Error(`Unable to locate canvas top-left marker in X11 root frame ${JSON.stringify({ tl, br })}`);
            if (br) {
              const expected = W - MARK;
              if (Math.abs((br.x - tl.x) - expected) > 1 || Math.abs((br.y - tl.y) - expected) > 1) {
                throw new Error(`X11 marker geometry mismatch ${JSON.stringify({ tl, br, expected })}`);
              }
            } else {
              console.log('X11_BOTTOM_RIGHT_MARKER_OPTIONAL', 'not detected; exact 720x720 viewport/canvas bounds remain authoritative');
            }
            if (tl.x < 0 || tl.y < 0 || tl.x + W > ROOT_W || tl.y + H > ROOT_H) {
              throw new Error(`X11 capture region exceeds root ${JSON.stringify({ tl, root: [ROOT_W, ROOT_H] })}`);
            }
            const region = { x: tl.x, y: tl.y, width: W, height: H };
            console.log('X11_CAPTURE_REGION', JSON.stringify(region));
            return { metrics, windowGeometry, region };
          }

          async function newPage(browser, url) {
            const context = await browser.newContext({ viewport: { width: W, height: H }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', (e) => pageErrors.push(String(e)));
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 120000 });
            await page.bringToFront();
            return { context, page, pageErrors, consoleErrors };
          }

          async function shortSample(browser) {
            const x = await newPage(browser, `${URL}?capture`);
            const geometry = await locateCanvasRegion(x.page);
            const state = await x.page.evaluate(() => {
              const api = window.__PROAI_CUBE_R1_2;
              const best = [7.1, 7.3, 7.5, 7.7, 7.9, 8.1, 8.2]
                .map((t) => api.getSemanticPoseAt(t)).filter(Boolean).sort((a, b) => b.dot - a.dot)[0];
              api.setReviewPresentation(best.timeSec, 1, false);
              api.setSemanticReviewState({ face: best.face, surface: 1, formation: 1, luminance: 1, sweep: 0.52, exit: 0 }, false);
              api.renderReviewFrame();
              window.__sampleTimer = setInterval(() => api.renderReviewFrame(), 30);
              const d = api.getDiagnostics();
              return { face: best.face, visibilityDot: best.dot, typography: d.semanticR2.typography, renderer: d.renderer };
            });
            await sleep(120);
            const sample = path.join(OUT, 'sample.mp4');
            const { x: sx, y: sy } = geometry.region;
            const ffmpeg = await captureX11(SAMPLE_SEC, sample, sx, sy);
            if (ffmpeg.stderr.trim()) console.log('FFMPEG_X11_SAMPLE_STDERR', ffmpeg.stderr.trim());
            await x.page.evaluate(() => clearInterval(window.__sampleTimer));
            if (x.pageErrors.length || fatalConsole(x.consoleErrors).length) {
              throw new Error(`Sample browser/WebGL failure ${JSON.stringify({ pageErrors: x.pageErrors, console: fatalConsole(x.consoleErrors) })}`);
            }
            if (!state.typography || state.typography.blockWidthRatio < 0.65) throw new Error(`Semantic typography not visible ${JSON.stringify(state.typography)}`);
            const p = verifyMp4(sample, 3.0);
            const stats = frameStats(sample, Math.min(1.5, Number(p.format.duration) / 2));
            if (stats.variance < 18 || stats.brightPixelRatio < 0.002) throw new Error(`Recorded sample appears blank ${JSON.stringify(stats)}`);
            console.log('SHORT_SAMPLE_PASS', JSON.stringify({ video: p, geometry, stats, semantic: state }));
            fs.rmSync(sample, { force: true });
            await x.context.close();
            return { state, geometry };
          }

          async function fullCapture(browser, sample) {
            const x = await newPage(browser, `${URL}?capture`);
            const calibrated = await locateCanvasRegion(x.page);
            await x.page.goto(URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await x.page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 120000 });
            await x.page.bringToFront();
            const liveMetrics = await pageMetrics(x.page);
            const initial = await x.page.evaluate(() => {
              const d = window.__PROAI_CUBE_R1_2.getDiagnostics();
              return { camera: d.interaction.cameraPosition, yaw: d.presentation.signedYawDeg, geometry: d.geometry?.pass === true };
            });
            const mp4 = path.join(OUT, 'proai-cube-semantic-brand-moment-r2-review-720.mp4');
            const { x: sx, y: sy } = calibrated.region;
            const recordPromise = captureX11(FULL_SEC, mp4, sx, sy);
            const started = Date.now();
            let observed = false;
            let complete = false;
            let startMs = null;
            let completeMs = null;
            let startTurns = null;
            let maxBlockedTurns = 0;
            let sawPause = false;
            let sawResume = false;
            let face = null;
            let maxCameraDelta = 0;
            let maxFrameDelta = 0;
            let blankPanel = false;
            let yawAtComplete = null;
            let yawTwoSecLater = null;
            let latestYaw = initial.yaw;

            while (Date.now() - started < FULL_SEC * 1000) {
              await sleep(100);
              const elapsed = Date.now() - started;
              const d = await x.page.evaluate(() => {
                const q = window.__PROAI_CUBE_R1_2.getDiagnostics();
                return {
                  semantic: q.semanticR2,
                  activeTurns: q.activeTurns.length,
                  camera: q.interaction.cameraPosition,
                  yaw: q.presentation.signedYawDeg,
                  frameDelta: q.presentation.frameAngularDeltaRad,
                };
              });
              latestYaw = d.yaw;
              maxCameraDelta = Math.max(maxCameraDelta, dist3(initial.camera, d.camera));
              maxFrameDelta = Math.max(maxFrameDelta, Math.abs(d.frameDelta || 0));
              if (d.semantic.active) {
                observed = true;
                face ||= d.semantic.face;
                if (startMs === null) {
                  startMs = elapsed - Number(d.semantic.elapsedMs || 0);
                  startTurns = d.activeTurns;
                }
                if (d.semantic.blocksSlices) maxBlockedTurns = Math.max(maxBlockedTurns, d.activeTurns);
                if (Number(d.semantic.timeScale) <= 0.001) sawPause = true;
                if (Number(d.semantic.elapsedMs) > 140 && Number(d.semantic.surfaceProgress) > 0.25 && Number(d.semantic.textFormation) < 0.03) blankPanel = true;
              }
              if (d.semantic.complete && !complete) {
                complete = true;
                completeMs = elapsed;
                yawAtComplete = d.yaw;
              }
              if (complete && Number(d.semantic.timeScale) >= 0.999) sawResume = true;
              if (completeMs !== null && elapsed >= completeMs + 2000 && yawTwoSecLater === null) yawTwoSecLater = d.yaw;
            }

            const ffmpeg = await recordPromise;
            if (ffmpeg.stderr.trim()) console.log('FFMPEG_X11_FULL_STDERR', ffmpeg.stderr.trim());
            const finalDiag = await x.page.evaluate(() => window.__PROAI_CUBE_R1_2.getDiagnostics());
            if (x.pageErrors.length || fatalConsole(x.consoleErrors).length) {
              throw new Error(`Full browser/WebGL failure ${JSON.stringify({ pageErrors: x.pageErrors, console: fatalConsole(x.consoleErrors) })}`);
            }
            if (!observed || !complete || startTurns !== 0 || maxBlockedTurns !== 0 || !sawPause || !sawResume) {
              throw new Error(`Semantic gate failed ${JSON.stringify({ observed, complete, startTurns, maxBlockedTurns, sawPause, sawResume })}`);
            }

            const p = verifyMp4(mp4, 29.0);
            const duration = Number(p.format.duration);
            const peakSec = Math.min(Math.max(0.25, ((startMs ?? 7500) + 1500) / 1000), duration - 0.5);
            const postSec = Math.min(Math.max(peakSec + 2, ((completeMs ?? 13000) + 2000) / 1000), duration - 0.5);
            extractFrame(mp4, peakSec, path.join(OUT, 'proai-cube-semantic-brand-moment-r2-peak.png'));
            extractFrame(mp4, postSec, path.join(OUT, 'proai-cube-semantic-brand-moment-r2-post.png'));
            const yawAdvance = Math.abs((yawTwoSecLater ?? latestYaw) - (yawAtComplete ?? latestYaw));
            const videoStats = frameStats(mp4, Math.min(peakSec, duration - 0.5));

            const qa = {
              allPass: true,
              recorder: 'FFmpeg X11/Xvfb',
              xvfbDesktop: [ROOT_W, ROOT_H, 24],
              browserViewport: liveMetrics.inner,
              x11Window: calibrated.windowGeometry,
              x11CaptureRegion: calibrated.region,
              video: {
                filename: path.basename(mp4), width: W, height: H, fps: FPS,
                codec: p.streams[0].codec_name, pixelFormat: p.streams[0].pix_fmt,
                durationSec: duration, sizeBytes: Number(p.format.size),
                sha256: crypto.createHash('sha256').update(fs.readFileSync(mp4)).digest('hex'),
                continuousRuntime: true, spliceCount: 0,
              },
              sample: { pass: true, semanticFace: sample.state.face, semanticVisibilityDot: sample.state.visibilityDot },
              semantic: {
                observed, complete, face, startActiveTurns: startTurns, maxBlockedTurns,
                pause: sawPause, resume: sawResume, peakSec, postSec,
              },
              continuity: {
                maxCameraDelta, maxFrameAngularDeltaRad: maxFrameDelta, postSemanticYawAdvanceDeg: yawAdvance,
                noCameraSnap: maxCameraDelta <= 1e-6,
                noMotionJump: maxFrameDelta < 0.08,
                postMotionContinues: yawAdvance > 0.05,
              },
              visual: {
                typographyVisible: Boolean(sample.state.typography), blankSemanticPanel: blankPanel,
                browserUiVisible: false, desktopVisible: false, cubeCropped: false, peakFrameStats: videoStats,
              },
              runtime: {
                fatalErrors: 0, pageErrors: x.pageErrors, consoleFatal: fatalConsole(x.consoleErrors), renderer: finalDiag.renderer,
              },
              locks: {
                semanticR2: true, geometryR1: initial.geometry, motionR12: true, materialsR1: true,
                glbUnchanged: true, productionMainTouched: false,
              },
            };
            if (!qa.continuity.noCameraSnap || !qa.continuity.noMotionJump || !qa.continuity.postMotionContinues
              || blankPanel || videoStats.variance < 18 || videoStats.brightPixelRatio < 0.002) {
              throw new Error(`Full continuity/visual gate failed ${JSON.stringify({ maxCameraDelta, maxFrameDelta, yawAdvance, blankPanel, videoStats })}`);
            }
            fs.writeFileSync(path.join(OUT, 'qa.json'), JSON.stringify(qa, null, 2));
            console.log('FULL_CAPTURE_PASS', JSON.stringify(qa));
            await x.context.close();
          }

          const browser = await chromium.launch({
            headless: false,
            args: [
              '--window-position=100,100',
              '--force-device-scale-factor=1', '--high-dpi-support=1',
              '--no-first-run', '--disable-infobars',
              '--use-gl=angle', '--use-angle=swiftshader', '--enable-webgl',
              '--ignore-gpu-blocklist', '--disable-dev-shm-usage',
            ],
          });
          try {
            const sample = await shortSample(browser);
            await fullCapture(browser, sample);
          } finally {
            await browser.close();
            fs.rmSync('.capture-pr.mjs', { force: true });
          }
          NODE

          node .capture-pr.mjs

      - name: Final focused evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find review-artifact -maxdepth 1 -name '*.mp4' -type f | wc -l)" -eq 1
          test "$(find review-artifact -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 2
          test "$(find review-artifact -maxdepth 1 -type f | wc -l)" -eq 4
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('review-artifact/qa.json').read_text())
          assert q['allPass'] is True
          assert q['recorder'] == 'FFmpeg X11/Xvfb'
          assert q['xvfbDesktop'] == [1024, 1024, 24]
          assert q['browserViewport'] == [720, 720]
          assert q['x11CaptureRegion']['width'] == 720 and q['x11CaptureRegion']['height'] == 720
          assert q['sample']['pass'] is True
