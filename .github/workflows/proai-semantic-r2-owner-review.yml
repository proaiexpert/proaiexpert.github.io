name: ProAI Semantic Face R4 Legacy Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-semantic-face-r4-legacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Release obsolete R4.2 review slot
        run: echo "R4.2 legacy review superseded by R4.3; cleanup run only"
