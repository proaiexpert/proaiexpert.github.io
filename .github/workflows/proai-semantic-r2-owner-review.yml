name: ProAI Semantic Face R4 Live Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-semantic-face-r4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - name: Checkout R4 review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify frozen Cube base
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only 295a67a27df127c95d799c93ea39448afd714793...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2)"
          test -z "$(git diff --name-only 295a67a27df127c95d799c93ea39448afd714793...HEAD -- index.html ru/index.html)"
          test -z "$(git diff --name-only 295a67a27df127c95d799c93ea39448afd714793...HEAD -- docs/site-evolution/spline/proai-cube-geometry-r1 docs/site-evolution/spline/proai-cube-materials-lighting-r1 docs/site-evolution/spline/proai-cube-presentation-motion-r1-2)"
          echo R4_FROZEN_BASE_PASS

      - name: Install and build R4
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm install --no-save playwright@1.54.0
          npx playwright install --with-deps chromium
          npm run build
          node --check main.generated.js
          test "$(wc -c < rubik_39_s_cube_animation.glb)" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "surfaceMaxOpacity: 0.065" main.generated.js
          grep -q "semanticVelocityMultiplier: 0.70" main.generated.js
          grep -q "triggerSearchStartMs: 3200" main.generated.js
          grep -q "triggerSearchEndMs: 4200" main.generated.js
          grep -q "controls.enableZoom = false" main.generated.js
          grep -q "return semanticBlocksSlices;" main.generated.js
          ! grep -q "semanticComplete || interactionActive" main.generated.js
          ! grep -q "concept=A\|concept=B\|concept=C" index.html lab.js main.generated.js
          echo R4_BUILD_AND_STATIC_CONTRACT_PASS

      - name: Start local R4 runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/proai-r4-server.log 2>&1 &
          echo $! >/tmp/proai-r4-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo LOCAL_R4_HTTP_PASS
              exit 0
            fi
            sleep 1
          done
          cat /tmp/proai-r4-server.log
          exit 1

      - name: Run R4 motion and interaction QA
        shell: bash
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: '1'
          PROAI_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          mkdir -p review-evidence
          Xvfb :99 -screen 0 1280x900x24 -ac +extension GLX +render -noreset >/tmp/proai-r4-xvfb.log 2>&1 &
          echo $! >/tmp/proai-r4-xvfb.pid
          for i in $(seq 1 40); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.25
          done

          cat > .qa-r4.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const URL = process.env.PROAI_URL || 'http://127.0.0.1:4173/';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const within = (v, min, max) => Number.isFinite(v) && v >= min && v <= max;

          async function waitFor(page, predicate, timeoutMs = 10000) {
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
              const state = await page.evaluate(() => window.__PROAI_CUBE_R1_2.getSemanticDiagnostics());
              if (predicate(state)) return state;
              await sleep(25);
            }
            throw new Error('R4 semantic wait timeout');
          }

          const browser = await chromium.launch({
            headless: false,
            args: ['--no-first-run','--disable-infobars','--use-gl=desktop','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']
          });
          const context = await browser.newContext({ viewport: { width: 1100, height: 760 }, deviceScaleFactor: 1, hasTouch: true, reducedMotion: 'no-preference' });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(String(error)));
          page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });

          await page.goto(URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 120000 });

          const normal = await waitFor(page, (s) => s.complete === true, 12000);
          const normalDiag = await page.evaluate(() => window.__PROAI_CUBE_R1_2.getDiagnostics());
          const normalPass = within(normal.opportunityPresentationMs, 3150, 4300)
            && within(normal.firstTypographyElapsedMs, 80, 160)
            && within(normal.completedElapsedMs, 2200, 2700)
            && normal.semanticVelocityMultiplier === 0.70
            && normal.surfaceOpacityMax <= 0.08
            && normalDiag.presentation.simTimeMs > normal.entryPresentationMs;

          await page.evaluate(() => window.__PROAI_CUBE_R1_2.stopSliceScheduler());
          const activeSlicePromise = page.evaluate(() => window.__PROAI_CUBE_R1_2.turnSlice({ axis: 'X', layer: 1, direction: 1, durationMs: 1200 }));
          await sleep(120);
          const replayAccepted = await page.evaluate(() => window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());
          const pending = await waitFor(page, (s) => s.pending === true && s.waitedForActiveSlice === true, 1200);
          const turnResult = await activeSlicePromise;
          const afterSlice = await waitFor(page, (s) => s.active === true, 2500);
          const activeSlicePass = replayAccepted === true && pending.opportunityActiveTurns > 0 && turnResult?.endpointErrorRad === 0 && afterSlice.active === true;

          await waitFor(page, (s) => s.complete === true, 5000);
          await page.evaluate(() => window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());
          await waitFor(page, (s) => s.active === true && s.elapsedMs > 320, 2500);
          const canvas = page.locator('#cube-canvas');
          const box = await canvas.boundingBox();
          const cx = box.x + box.width * 0.52;
          const cy = box.y + box.height * 0.48;
          const mouseBefore = await page.evaluate(() => ({ s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(), d: window.__PROAI_CUBE_R1_2.getDiagnostics() }));
          await page.mouse.move(cx, cy);
          await page.mouse.down();
          await page.mouse.move(cx + 72, cy + 24, { steps: 6 });
          await sleep(160);
          await page.mouse.up();
          const mouseAfter = await page.evaluate(() => ({ s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(), d: window.__PROAI_CUBE_R1_2.getDiagnostics(), i: window.__PROAI_CUBE_R1_2.getInteractionState() }));
          const mousePass = mouseAfter.s.elapsedMs > mouseBefore.s.elapsedMs
            && mouseAfter.s.entryPresentationMs === mouseBefore.s.entryPresentationMs
            && mouseAfter.d.presentation.simTimeMs > mouseBefore.d.presentation.simTimeMs
            && mouseAfter.i.resumeDelayRemainingMs === 0
            && mouseAfter.i.sliceResumeDelayRemainingMs === 0;

          await waitFor(page, (s) => s.complete === true, 5000);
          await page.evaluate(() => window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());
          await waitFor(page, (s) => s.active === true && s.elapsedMs > 320, 2500);
          const cdp = await context.newCDPSession(page);
          const touchBefore = await page.evaluate(() => ({ s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(), d: window.__PROAI_CUBE_R1_2.getDiagnostics() }));
          await cdp.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x: cx, y: cy, id: 1, radiusX: 1, radiusY: 1, force: 1 }] });
          await cdp.send('Input.dispatchTouchEvent', { type: 'touchMove', touchPoints: [{ x: cx + 64, y: cy + 20, id: 1, radiusX: 1, radiusY: 1, force: 1 }] });
          await sleep(160);
          await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          const touchAfter = await page.evaluate(() => ({ s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(), d: window.__PROAI_CUBE_R1_2.getDiagnostics(), i: window.__PROAI_CUBE_R1_2.getInteractionState() }));
          const touchPass = touchAfter.s.elapsedMs > touchBefore.s.elapsedMs
            && touchAfter.s.entryPresentationMs === touchBefore.s.entryPresentationMs
            && touchAfter.d.presentation.simTimeMs > touchBefore.d.presentation.simTimeMs
            && touchAfter.i.resumeDelayRemainingMs === 0;

          await waitFor(page, (s) => s.complete === true, 5000);
          await page.evaluate(() => window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());
          await waitFor(page, (s) => s.active === true && s.elapsedMs > 320, 2500);
          const tapBefore = await page.evaluate(() => window.__PROAI_CUBE_R1_2.getSemanticDiagnostics());
          await cdp.send('Input.dispatchTouchEvent', { type: 'touchStart', touchPoints: [{ x: cx, y: cy, id: 2, radiusX: 1, radiusY: 1, force: 1 }] });
          await sleep(35);
          await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });
          await sleep(120);
          const tapAfter = await page.evaluate(() => window.__PROAI_CUBE_R1_2.getSemanticDiagnostics());
          const tapPass = tapAfter.elapsedMs > tapBefore.elapsedMs && tapAfter.entryPresentationMs === tapBefore.entryPresentationMs && (tapAfter.active || tapAfter.complete);

          await page.goto(`${URL}?capture&view=front`, { waitUntil: 'domcontentloaded' });
          await page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 120000 });
          await sleep(500);
          await page.screenshot({ path: 'review-evidence/r4-near-front.png' });
          await page.goto(`${URL}?capture&view=three-quarter`, { waitUntil: 'domcontentloaded' });
          await page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 120000 });
          await sleep(500);
          await page.screenshot({ path: 'review-evidence/r4-three-quarter.png' });

          const metrics = {
            pass: normalPass && activeSlicePass && mousePass && touchPass && tapPass && errors.length === 0,
            normalPass,
            activeSlicePass,
            mousePass,
            touchPass,
            tapPass,
            normal: {
              opportunityPresentationMs: normal.opportunityPresentationMs,
              entryPresentationMs: normal.entryPresentationMs,
              firstSurfaceElapsedMs: normal.firstSurfaceElapsedMs,
              firstTypographyElapsedMs: normal.firstTypographyElapsedMs,
              completedElapsedMs: normal.completedElapsedMs,
              face: normal.face,
              visibilityDot: normal.visibilityDot,
              semanticVelocityMultiplier: normal.semanticVelocityMultiplier,
              sliceBlockTargetMs: normal.sliceBlockTargetMs,
              surfaceOpacityMax: normal.surfaceOpacityMax,
              textMeshCount: normal.textMeshCount
            },
            activeSlice: { pending, turnResult, afterSlice },
            errors
          };
          fs.writeFileSync('review-evidence/r4-qa-metrics.json', JSON.stringify(metrics, null, 2));
          console.log('R4_QA_RESULT', JSON.stringify(metrics));
          await browser.close();
          if (!metrics.pass) process.exit(1);
          NODE

          node .qa-r4.mjs
          echo R4_MOTION_INTERACTION_QA_PASS

      - name: Upload R4 QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: proai-semantic-r4-qa-evidence
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Publish temporary owner review
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/cloudflared-r4.log 2>&1 &
          echo $! >/tmp/cloudflared-r4.pid
          URL=''
          for i in $(seq 1 90); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-r4.log | tail -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ]
          for i in $(seq 1 60); do
            curl -fsSL --max-time 15 "$URL/" >/dev/null && break
            sleep 1
          done
          curl -fsSL --max-time 15 "$URL/" >/dev/null
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$URL" >/tmp/r4-live-url.txt
          echo "R4_LIVE_READY=$URL"
          {
            echo '## SEMANTIC BRAND FACE R4 — LIVE OWNER REVIEW'
            echo
            echo "Base: \`295a67a27df127c95d799c93ea39448afd714793\`"
            echo
            echo "Normal autonomous runtime: $URL/"
            echo "Near-front inspection: $URL/?capture&view=front"
            echo "Natural 3/4 inspection: $URL/?capture&view=three-quarter"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live URL handoff
        uses: actions/upload-artifact@v4
        with:
          name: proai-semantic-r4-live-url
          path: /tmp/r4-live-url.txt
          if-no-files-found: error
          retention-days: 1

      - name: Hold owner preview for 60 minutes
        shell: bash
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          kill -0 "$(cat /tmp/cloudflared-r4.pid)"
          curl -fsSL --max-time 15 "$REVIEW_URL/" >/dev/null
          echo "R4_PREVIEW_HOLDING=$REVIEW_URL"
          sleep 3600
