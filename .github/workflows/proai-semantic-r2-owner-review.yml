name: ProAI Semantic Face R3 Live Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r3'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r3

    steps:
      - name: Checkout R3 review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify frozen Cube base
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only 295a67a27df127c95d799c93ea39448afd714793...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2)"
          test -z "$(git diff --name-only 295a67a27df127c95d799c93ea39448afd714793...HEAD -- index.html ru/index.html)"

      - name: Install and build R3
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run build
          node --check main.generated.js
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Start local R3 runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/proai-r3-server.log 2>&1 &
          echo $! >/tmp/proai-r3-server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo LOCAL_R3_HTTP_PASS
              exit 0
            fi
            sleep 1
          done
          cat /tmp/proai-r3-server.log
          exit 1

      - name: Publish temporary owner review
        shell: bash
        run: |
          set -euo pipefail
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >/tmp/cloudflared-r3.log 2>&1 &
          TUNNEL_PID=$!
          trap 'kill "$TUNNEL_PID" 2>/dev/null || true; kill "$(cat /tmp/proai-r3-server.pid 2>/dev/null)" 2>/dev/null || true' EXIT
          URL=''
          for i in $(seq 1 90); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-r3.log | tail -1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ]
          for i in $(seq 1 60); do
            if curl -fsSL --max-time 15 "$URL/" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSL --max-time 15 "$URL/" >/dev/null
          echo "R3_LIVE_READY=$URL"
          echo "A=$URL/?concept=A"
          echo "B=$URL/?concept=B"
          echo "C=$URL/?concept=C"
          echo "A_FRONT=$URL/?capture&view=front&concept=A"
          echo "B_FRONT=$URL/?capture&view=front&concept=B"
          echo "C_FRONT=$URL/?capture&view=front&concept=C"
          echo "A_3Q=$URL/?capture&view=three-quarter&concept=A"
          echo "B_3Q=$URL/?capture&view=three-quarter&concept=B"
          echo "C_3Q=$URL/?capture&view=three-quarter&concept=C"
          echo "A_MOTION=$URL/?capture&demo=1&concept=A"
          echo "B_MOTION=$URL/?capture&demo=1&concept=B"
          echo "C_MOTION=$URL/?capture&demo=1&concept=C"
          sleep 3600
