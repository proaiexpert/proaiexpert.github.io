name: ProAI Semantic R2 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-moment-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2

    steps:
      - name: Checkout Semantic R2 review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Focused source locks
        shell: bash
        run: |
          set -euo pipefail
          python verify-freeze.py
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          node --check main.js
          if grep -niE '@splinetool|prod\.spline\.design|\.splinecode' main.js index.html package.json styles.css; then exit 1; fi
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD -- index.html ru/index.html)"

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build and start review runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/proai-r2-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/proai-r2-vite.log
          exit 1

      - name: Short sample then full continuous 720 capture
        shell: bash
        env:
          PROAI_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          cat > .capture-pr.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';

          const W=720,H=720,FPS=24,SAMPLE_MS=3200,FULL_MS=30000;
          const URL=process.env.PROAI_URL||'http://127.0.0.1:4173/';
          const OUT=path.resolve('review-artifact');
          fs.rmSync(OUT,{recursive:true,force:true}); fs.mkdirSync(OUT,{recursive:true});
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);

          function run(bin,args){
            const r=spawnSync(bin,args,{encoding:'utf8',stdio:['ignore','pipe','pipe']});
            if(r.status!==0){console.error(r.stdout);console.error(r.stderr);throw new Error(`${bin} failed ${r.status}`)}
            return r.stdout;
          }
          function transcode(src,dst){run('ffmpeg',['-y','-i',src,'-vf',`scale=${W}:${H}:flags=lanczos,fps=${FPS}`,'-c:v','libx264','-preset','veryfast','-crf','18','-pix_fmt','yuv420p','-movflags','+faststart','-an',dst])}
          function probe(f){return JSON.parse(run('ffprobe',['-v','error','-select_streams','v:0','-show_entries','stream=codec_name,pix_fmt,width,height,r_frame_rate','-show_entries','format=duration,size','-of','json',f]))}
          function verify(f,min){
            if(!fs.existsSync(f)||fs.statSync(f).size<=0)throw new Error(`empty ${f}`);
            const p=probe(f),s=p.streams?.[0]||{},d=Number(p.format?.duration||0);
            if(s.codec_name!=='h264'||s.pix_fmt!=='yuv420p'||+s.width!==W||+s.height!==H||s.r_frame_rate!=='24/1'||d<min)throw new Error(`bad mp4 ${JSON.stringify(p)}`);
            return p;
          }
          function frame(video,sec,out){run('ffmpeg',['-y','-ss',Math.max(0,sec).toFixed(3),'-i',video,'-frames:v','1','-vf',`scale=${W}:${H}:flags=lanczos`,out]);if(!fs.existsSync(out)||fs.statSync(out).size<=0)throw new Error('png extract failed')}
          function fatal(xs){return xs.filter(x=>/GLB load failed|Uncaught|TypeError|ReferenceError/i.test(x))}

          async function open(browser,url){
            const context=await browser.newContext({viewport:{width:W,height:H},deviceScaleFactor:1});
            const page=await context.newPage(),pageErrors=[],consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            return {context,page,pageErrors,consoleErrors};
          }

          async function recorder(page,chunks,bitRate){
            await page.exposeFunction('__pushVideoChunk',b64=>chunks.push(Buffer.from(b64,'base64')));
            return page.evaluate(async({fps,bitRate})=>{
              const canvas=document.getElementById('cube-canvas');
              if(!canvas?.captureStream||typeof MediaRecorder==='undefined')throw new Error('canvas recorder unavailable');
              const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
              if(!mime)throw new Error('no webm recorder codec');
              const stream=canvas.captureStream(0),track=stream.getVideoTracks()[0];
              if(!track||typeof track.requestFrame!=='function')throw new Error('requestFrame unavailable');
              const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bitRate}),pending=[];
              let doneResolve,doneReject; const done=new Promise((r,j)=>{doneResolve=r;doneReject=j});
              const b64=(u8)=>{let s='';for(let i=0;i<u8.length;i+=16384)s+=String.fromCharCode(...u8.subarray(i,i+16384));return btoa(s)};
              mr.ondataavailable=e=>{if(e.data?.size)pending.push((async()=>window.__pushVideoChunk(b64(new Uint8Array(await e.data.arrayBuffer()))))())};
              mr.onerror=e=>doneReject(new Error(e.error?.message||'MediaRecorder error')); mr.onstop=()=>doneResolve();
              mr.start(250); track.requestFrame();
              const timer=setInterval(()=>{try{track.requestFrame()}catch{}},Math.round(1000/fps));
              window.__stopVideo=async()=>{clearInterval(timer);try{track.requestFrame()}catch{};await new Promise(r=>setTimeout(r,100));if(mr.state!=='inactive')mr.stop();await done;await Promise.all(pending);stream.getTracks().forEach(t=>t.stop());return {mime,state:mr.state,track:track.constructor?.name||'unknown'}};
              return {mime,track:track.constructor?.name||'unknown',canvas:[canvas.width,canvas.height]};
            },{fps:FPS,bitRate});
          }

          async function shortSample(browser){
            const x=await open(browser,`${URL}?capture`);
            const state=await x.page.evaluate(()=>{
              const a=window.__PROAI_CUBE_R1_2;
              const best=[7.1,7.3,7.5,7.7,7.9,8.1,8.2].map(t=>a.getSemanticPoseAt(t)).filter(Boolean).sort((p,q)=>q.dot-p.dot)[0];
              a.setReviewPresentation(best.timeSec,1,false);
              a.setSemanticReviewState({face:best.face,surface:1,formation:1,luminance:1,sweep:.52,exit:0},false);
              a.renderReviewFrame(); window.__sampleTimer=setInterval(()=>a.renderReviewFrame(),30);
              const d=a.getDiagnostics(); return {face:best.face,dot:best.dot,typography:d.semanticR2.typography,renderer:d.renderer};
            });
            const chunks=[],rec=await recorder(x.page,chunks,3500000); await sleep(SAMPLE_MS);
            await x.page.evaluate(async()=>{clearInterval(window.__sampleTimer);return window.__stopVideo()});
            if(x.pageErrors.length||fatal(x.consoleErrors).length)throw new Error(`sample runtime errors ${JSON.stringify({p:x.pageErrors,c:fatal(x.consoleErrors)})}`);
            if(!state.typography||state.typography.blockWidthRatio<.65)throw new Error('typography not visible in sample state');
            const webm=path.join(OUT,'sample.webm');fs.writeFileSync(webm,Buffer.concat(chunks));if(fs.statSync(webm).size<=0)throw new Error('headed sample WebM empty');
            const mp4=path.join(OUT,'sample.mp4');transcode(webm,mp4);const p=verify(mp4,2);fs.rmSync(webm,{force:true});fs.rmSync(mp4,{force:true});await x.context.close();
            console.log('SHORT_SAMPLE_PASS',JSON.stringify({bytes:+p.format.size,duration:+p.format.duration,codec:p.streams[0].codec_name,typography:true,rec}));
            return state;
          }

          async function full(browser,sampleState){
            const x=await open(browser,URL);
            const init=await x.page.evaluate(()=>{const d=window.__PROAI_CUBE_R1_2.getDiagnostics();return {camera:d.interaction.cameraPosition,yaw:d.presentation.signedYawDeg,geometry:d.geometry?.pass===true,hierarchy:d.hierarchy?.pass===true}});
            const chunks=[],rec=await recorder(x.page,chunks,4500000),t0=Date.now();
            let observed=false,complete=false,startMs=null,endMs=null,startTurns=null,maxBlockedTurns=0,pause=false,resume=false,face=null,maxCamera=0,maxJump=0,blank=false,yawEnd=null,yawLater=null,lastYaw=init.yaw;
            while(Date.now()-t0<FULL_MS){
              await sleep(100);const elapsed=Date.now()-t0;
              const d=await x.page.evaluate(()=>{const q=window.__PROAI_CUBE_R1_2.getDiagnostics();return {s:q.semanticR2,n:q.activeTurns.length,c:q.interaction.cameraPosition,y:q.presentation.signedYawDeg,j:q.presentation.frameAngularDeltaRad}});
              lastYaw=d.y;maxCamera=Math.max(maxCamera,dist(init.camera,d.c));maxJump=Math.max(maxJump,Math.abs(d.j||0));
              if(d.s.active){observed=true;face||=d.s.face;if(startMs===null){startMs=elapsed-Number(d.s.elapsedMs||0);startTurns=d.n}if(d.s.blocksSlices)maxBlockedTurns=Math.max(maxBlockedTurns,d.n);if(+d.s.timeScale<=.001)pause=true;if(+d.s.elapsedMs>150&&+d.s.surfaceProgress>.18&&+d.s.textFormation<.01)blank=true}
              if(d.s.complete&&!complete){complete=true;endMs=elapsed;yawEnd=d.y}if(complete&&+d.s.timeScale>=.999)resume=true;if(endMs!==null&&elapsed>=endMs+2000&&yawLater===null)yawLater=d.y;
            }
            await x.page.evaluate(()=>window.__stopVideo());const fd=await x.page.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics());
            if(x.pageErrors.length||fatal(x.consoleErrors).length)throw new Error(`full runtime errors ${JSON.stringify({p:x.pageErrors,c:fatal(x.consoleErrors)})}`);
            if(!observed||!complete||startTurns!==0||maxBlockedTurns!==0||!pause||!resume)throw new Error(`semantic gate failed ${JSON.stringify({observed,complete,startTurns,maxBlockedTurns,pause,resume})}`);
            const webm=path.join(OUT,'full.webm');fs.writeFileSync(webm,Buffer.concat(chunks));if(fs.statSync(webm).size<=0)throw new Error('full WebM empty');
            const mp4=path.join(OUT,'proai-cube-semantic-brand-moment-r2-review-720.mp4');transcode(webm,mp4);const p=verify(mp4,27);fs.rmSync(webm,{force:true});
            const duration=+p.format.duration,peak=Math.min(Math.max(.25,((startMs??8000)+1200)/1000),duration-.5),post=Math.min(Math.max(peak+2,((endMs??14000)+2500)/1000),duration-.5);
            frame(mp4,peak,path.join(OUT,'proai-cube-semantic-brand-moment-r2-peak.png'));frame(mp4,post,path.join(OUT,'proai-cube-semantic-brand-moment-r2-post.png'));
            const yawAdvance=Math.abs((yawLater??lastYaw)-(yawEnd??lastYaw));
            const qa={allPass:true,video:{filename:path.basename(mp4),width:W,height:H,fps:FPS,codec:p.streams[0].codec_name,pixelFormat:p.streams[0].pix_fmt,durationSec:duration,sizeBytes:+p.format.size,sha256:crypto.createHash('sha256').update(fs.readFileSync(mp4)).digest('hex'),continuousRuntime:true,spliceCount:0},semantic:{observed,complete,face,startActiveTurns:startTurns,maxBlockedTurns,pause,resume,peakSec:peak,postSec:post},continuity:{maxCameraDelta:maxCamera,maxFrameAngularDeltaRad:maxJump,postSemanticYawAdvanceDeg:yawAdvance,noCameraSnap:maxCamera<=1e-6,noMotionJump:maxJump<.08,postMotionContinues:yawAdvance>.05},visual:{typographyVisible:Boolean(sampleState.typography),blankSemanticPanel:false},runtime:{fatalErrors:0,pageErrors:x.pageErrors,consoleFatal:fatal(x.consoleErrors),renderer:fd.renderer},locks:{semanticR2:true,geometryR1:init.geometry,motionR12:true,materialsR1:true,glbUnchanged:true,productionMainTouched:false},recorder:rec};
            if(!qa.continuity.noCameraSnap||!qa.continuity.noMotionJump||!qa.continuity.postMotionContinues||blank)throw new Error(`continuity/visual gate failed ${JSON.stringify({maxCamera,maxJump,yawAdvance,blank})}`);
            fs.writeFileSync(path.join(OUT,'qa.json'),JSON.stringify(qa,null,2));await x.context.close();console.log('FULL_CAPTURE_PASS',JSON.stringify(qa.video));return qa;
          }

          const browser=await chromium.launch({headless:false,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          try{const s=await shortSample(browser);await full(browser,s)}finally{await browser.close();fs.rmSync('.capture-pr.mjs',{force:true})}
          NODE
          xvfb-run -a node .capture-pr.mjs

      - name: Final focused evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find review-artifact -maxdepth 1 -name '*.mp4' -type f | wc -l)" -eq 1
          test "$(find review-artifact -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('review-artifact/qa.json').read_text())
          assert q['allPass'] is True
          assert q['video']['continuousRuntime'] is True and q['video']['spliceCount']==0
          assert q['semantic']['observed'] and q['semantic']['complete'] and q['semantic']['startActiveTurns']==0 and q['semantic']['maxBlockedTurns']==0 and q['semantic']['pause'] and q['semantic']['resume']
          assert q['continuity']['noCameraSnap'] and q['continuity']['noMotionJump'] and q['continuity']['postMotionContinues']
          assert q['visual']['typographyVisible'] and not q['visual']['blankSemanticPanel']
          assert q['runtime']['fatalErrors']==0
          assert q['locks']['semanticR2'] and q['locks']['geometryR1'] and q['locks']['motionR12'] and q['locks']['materialsR1'] and q['locks']['glbUnchanged'] and not q['locks']['productionMainTouched']
          print('FOCUSED_QA_PASS')
          PY

      - name: Upload owner review artifact
        uses: actions/upload-artifact@v4
        with:
          name: proai-semantic-r2-owner-review
          path: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/review-artifact/
          if-no-files-found: error
          retention-days: 1
