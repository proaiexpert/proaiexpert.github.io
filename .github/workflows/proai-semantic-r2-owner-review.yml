name: ProAI Semantic R2 Owner Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  capture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-moment-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2

    steps:
      - name: Checkout Semantic R2 review head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Focused source locks
        shell: bash
        run: |
          set -euo pipefail
          python verify-freeze.py
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          node --check main.js
          if grep -niE '@splinetool|prod\.spline\.design|\.splinecode' main.js index.html package.json styles.css; then
            echo "Forbidden Spline runtime reference found"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          if git diff --name-only d17806da42275db617d8a46b231a2d877706a179...HEAD -- index.html ru/index.html | grep -q .; then
            echo "Production root modified"
            exit 1
          fi

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build and start review runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/proai-semantic-r2-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/proai-semantic-r2-vite.log
          exit 1

      - name: Short sample then full continuous 720 capture
        shell: bash
        env:
          PROAI_URL: http://127.0.0.1:4173/
        run: |
          set -euo pipefail
          cat > .capture-pr.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';

          const W = 720;
          const H = 720;
          const FPS = 24;
          const SAMPLE_MS = 3200;
          const FULL_MS = 30000;
          const URL = process.env.PROAI_URL || 'http://127.0.0.1:4173/';
          const OUT = path.resolve('review-artifact');
          fs.rmSync(OUT, { recursive: true, force: true });
          fs.mkdirSync(OUT, { recursive: true });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const dist3 = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);

          function run(bin, args) {
            const r = spawnSync(bin, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            if (r.status !== 0) {
              console.error(r.stdout);
              console.error(r.stderr);
              throw new Error(`${bin} failed (${r.status})`);
            }
            return r.stdout;
          }

          function transcode(input, output) {
            run('ffmpeg', ['-y','-i',input,'-vf',`scale=${W}:${H}:flags=lanczos,fps=${FPS}`,'-c:v','libx264','-preset','veryfast','-crf','18','-pix_fmt','yuv420p','-movflags','+faststart','-an',output]);
          }

          function probe(file) {
            return JSON.parse(run('ffprobe', ['-v','error','-select_streams','v:0','-show_entries','stream=codec_name,pix_fmt,width,height,r_frame_rate,avg_frame_rate','-show_entries','format=duration,size','-of','json',file]));
          }

          function validateMp4(file, minDuration) {
            if (!fs.existsSync(file) || fs.statSync(file).size <= 0) throw new Error(`Missing/empty MP4 ${file}`);
            const p = probe(file);
            const s = p.streams?.[0] || {};
            const duration = Number(p.format?.duration || 0);
            if (!(s.codec_name === 'h264' && s.pix_fmt === 'yuv420p' && Number(s.width) === W && Number(s.height) === H && s.r_frame_rate === '24/1' && duration >= minDuration)) {
              throw new Error(`MP4 validation failed ${JSON.stringify(p)}`);
            }
            return p;
          }

          function extract(video, sec, output) {
            run('ffmpeg', ['-y','-ss',Math.max(0,sec).toFixed(3),'-i',video,'-frames:v','1','-vf',`scale=${W}:${H}:flags=lanczos`,output]);
            if (!fs.existsSync(output) || fs.statSync(output).size <= 0) throw new Error(`Frame extraction failed ${output}`);
          }

          async function openPage(browser, url) {
            const context = await browser.newContext({ viewport: { width: W, height: H }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', (e) => pageErrors.push(String(e)));
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 120000 });
            return { context, page, pageErrors, consoleErrors };
          }

          async function startRecorder(page, chunks, bitRate) {
            await page.exposeFunction('__proaiPushChunk', (base64) => chunks.push(Buffer.from(base64, 'base64')));
            return page.evaluate(async ({ fps, bitRate }) => {
              const canvas = document.getElementById('cube-canvas');
              if (!canvas?.captureStream) throw new Error('canvas.captureStream unavailable');
              if (typeof MediaRecorder === 'undefined') throw new Error('MediaRecorder unavailable');
              const mimeType = ['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find((x) => MediaRecorder.isTypeSupported(x));
              if (!mimeType) throw new Error('No MediaRecorder WebM codec');

              const stream = canvas.captureStream(0);
              const track = stream.getVideoTracks()[0];
              if (!track || typeof track.requestFrame !== 'function') throw new Error('CanvasCaptureMediaStreamTrack.requestFrame unavailable');
              const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: bitRate });
              const pending = [];
              let stoppedResolve;
              let stoppedReject;
              const stopped = new Promise((resolve, reject) => { stoppedResolve = resolve; stoppedReject = reject; });
              const toB64 = (bytes) => {
                let binary = '';
                const stride = 0x4000;
                for (let i=0; i<bytes.length; i+=stride) binary += String.fromCharCode(...bytes.subarray(i, i+stride));
                return btoa(binary);
              };
              recorder.ondataavailable = (event) => {
                if (!event.data || event.data.size === 0) return;
                pending.push((async () => {
                  const bytes = new Uint8Array(await event.data.arrayBuffer());
                  await window.__proaiPushChunk(toB64(bytes));
                })());
              };
              recorder.onerror = (event) => stoppedReject(new Error(event.error?.message || 'MediaRecorder error'));
              recorder.onstop = () => stoppedResolve();
              recorder.start(250);
              track.requestFrame();
              const cadence = Math.max(16, Math.round(1000 / fps));
              window.__proaiCaptureFrameTimer = setInterval(() => {
                try { track.requestFrame(); } catch (_) {}
              }, cadence);
              window.__proaiStopRecorder = async () => {
                clearInterval(window.__proaiCaptureFrameTimer);
                try { track.requestFrame(); } catch (_) {}
                await new Promise((resolve) => setTimeout(resolve, 80));
                if (recorder.state !== 'inactive') recorder.stop();
                await stopped;
                await Promise.all(pending);
                stream.getTracks().forEach((t) => t.stop());
                return { mimeType, state: recorder.state, trackType: track.constructor?.name || 'unknown' };
              };
              return { mimeType, canvasWidth: canvas.width, canvasHeight: canvas.height, cssWidth: canvas.getBoundingClientRect().width, cssHeight: canvas.getBoundingClientRect().height, trackType: track.constructor?.name || 'unknown' };
            }, { fps: FPS, bitRate });
          }

          function fatalConsole(errors) {
            return errors.filter((v) => /GLB load failed|Uncaught|TypeError|ReferenceError/i.test(v));
          }

          async function sample(browser) {
            const x = await openPage(browser, `${URL}?capture`);
            const state = await x.page.evaluate(() => {
              const api = window.__PROAI_CUBE_R1_2;
              const candidates = [7.1,7.3,7.5,7.7,7.9,8.1,8.2].map((t) => api.getSemanticPoseAt(t)).filter(Boolean).sort((a,b) => b.dot-a.dot);
              const best = candidates[0];
              api.setReviewPresentation(best.timeSec, 1, false);
              api.setSemanticReviewState({ face: best.face, surface: 1, formation: 1, luminance: 1, sweep: 0.52, exit: 0 }, false);
              api.renderReviewFrame();
              window.__sampleRenderTimer = setInterval(() => api.renderReviewFrame(), 32);
              const d = api.getDiagnostics();
              return { face: best.face, visibilityDot: best.dot, typography: d.semanticR2.typography, renderer: d.renderer };
            });
            const chunks = [];
            const recorder = await startRecorder(x.page, chunks, 3500000);
            await sleep(SAMPLE_MS);
            await x.page.evaluate(async () => { clearInterval(window.__sampleRenderTimer); return window.__proaiStopRecorder(); });
            if (x.pageErrors.length) throw new Error(`Sample page errors ${JSON.stringify(x.pageErrors)}`);
            if (fatalConsole(x.consoleErrors).length) throw new Error(`Sample fatal console ${JSON.stringify(fatalConsole(x.consoleErrors))}`);
            if (!state.typography || state.typography.blockWidthRatio < 0.65) throw new Error('Sample typography not ready');
            const webm = path.join(OUT,'sample.webm');
            fs.writeFileSync(webm, Buffer.concat(chunks));
            if (fs.statSync(webm).size <= 0) throw new Error('Sample WebM is empty after explicit requestFrame cadence');
            const mp4 = path.join(OUT,'sample.mp4');
            transcode(webm, mp4);
            const p = validateMp4(mp4, 2.0);
            fs.rmSync(webm,{force:true});
            fs.rmSync(mp4,{force:true});
            await x.context.close();
            return { state, recorder, probe: p };
          }

          async function full(browser) {
            const x = await openPage(browser, URL);
            const initial = await x.page.evaluate(() => {
              const d = window.__PROAI_CUBE_R1_2.getDiagnostics();
              return { camera: d.interaction.cameraPosition, yaw: d.presentation.signedYawDeg, typography: d.semanticR2.typography, geometryPass: d.geometry?.pass === true, hierarchyPass: d.hierarchy?.pass === true };
            });
            const chunks = [];
            const recorder = await startRecorder(x.page, chunks, 4500000);
            const started = Date.now();
            let observed=false, complete=false, startMs=null, completeMs=null, face=null, startTurns=null, maxBlockedTurns=0, sawPause=false, sawResume=false, maxCamera=0, maxFrameDelta=0, blankPanel=false, yawComplete=null, yawLater=null, latestYaw=initial.yaw;
            while (Date.now()-started < FULL_MS) {
              await sleep(100);
              const elapsed = Date.now()-started;
              const d = await x.page.evaluate(() => {
                const q=window.__PROAI_CUBE_R1_2.getDiagnostics();
                return { semantic:q.semanticR2, turns:q.activeTurns.length, camera:q.interaction.cameraPosition, yaw:q.presentation.signedYawDeg, frameDelta:q.presentation.frameAngularDeltaRad };
              });
              latestYaw=d.yaw;
              maxCamera=Math.max(maxCamera,dist3(initial.camera,d.camera));
              maxFrameDelta=Math.max(maxFrameDelta,Math.abs(d.frameDelta||0));
              if (d.semantic.active) {
                observed=true; face ||= d.semantic.face;
                if (startMs===null) { startMs=elapsed-Number(d.semantic.elapsedMs||0); startTurns=d.turns; }
                if (d.semantic.blocksSlices) maxBlockedTurns=Math.max(maxBlockedTurns,d.turns);
                if (Number(d.semantic.timeScale)<=0.001) sawPause=true;
                if (Number(d.semantic.elapsedMs)>150 && Number(d.semantic.surfaceProgress)>0.18 && Number(d.semantic.textFormation)<0.01) blankPanel=true;
              }
              if (d.semantic.complete && !complete) { complete=true; completeMs=elapsed; yawComplete=d.yaw; }
              if (complete && Number(d.semantic.timeScale)>=0.999) sawResume=true;
              if (completeMs!==null && elapsed>=completeMs+2000 && yawLater===null) yawLater=d.yaw;
            }
            await x.page.evaluate(() => window.__proaiStopRecorder());
            const finalDiag = await x.page.evaluate(() => window.__PROAI_CUBE_R1_2.getDiagnostics());
            if (x.pageErrors.length) throw new Error(`Full page errors ${JSON.stringify(x.pageErrors)}`);
            if (fatalConsole(x.consoleErrors).length) throw new Error(`Full fatal console ${JSON.stringify(fatalConsole(x.consoleErrors))}`);
            if (!observed || !complete) throw new Error(`Semantic completion missing observed=${observed} complete=${complete}`);
            if (startTurns!==0) throw new Error(`Semantic started with ${startTurns} active turns`);
            if (maxBlockedTurns!==0) throw new Error(`Slice activity during semantic hold: ${maxBlockedTurns}`);
            if (!sawPause || !sawResume) throw new Error(`Pause/resume incomplete pause=${sawPause} resume=${sawResume}`);

            const webm=path.join(OUT,'full.webm');
            fs.writeFileSync(webm,Buffer.concat(chunks));
            if (fs.statSync(webm).size<=0) throw new Error('Full WebM empty');
            const mp4=path.join(OUT,'proai-cube-semantic-brand-moment-r2-review-720.mp4');
            transcode(webm,mp4);
            const p=validateMp4(mp4,27.0);
            fs.rmSync(webm,{force:true});
            const duration=Number(p.format.duration);
            const peak=Math.min(Math.max(0.25,((startMs??8000)+1200)/1000),duration-0.5);
            const post=Math.min(Math.max(peak+2,((completeMs??14000)+2500)/1000),duration-0.5);
            extract(mp4,peak,path.join(OUT,'proai-cube-semantic-brand-moment-r2-peak.png'));
            extract(mp4,post,path.join(OUT,'proai-cube-semantic-brand-moment-r2-post.png'));
            const postYaw=Math.abs((yawLater??latestYaw)-(yawComplete??latestYaw));
            const qa={
              allPass:true,
              video:{filename:path.basename(mp4),width:W,height:H,fps:FPS,codec:p.streams[0].codec_name,pixelFormat:p.streams[0].pix_fmt,durationSec:duration,sizeBytes:Number(p.format.size),sha256:crypto.createHash('sha256').update(fs.readFileSync(mp4)).digest('hex'),spliceCount:0,continuousRuntime:true},
              semantic:{observed,complete,face,semanticStartActiveTurns:startTurns,maxActiveTurnsWhileBlocked:maxBlockedTurns,sawPause,sawResume,peakVideoSec:peak,postVideoSec:post,postSemanticYawAdvanceDeg:postYaw,final:finalDiag.semanticR2},
              continuity:{maxCameraDelta:maxCamera,maxPresentationFrameDeltaRad:maxFrameDelta,noCameraSnap:maxCamera<=1e-6,noVisibleMotionJump:maxFrameDelta<0.08,postSemanticMotionContinues:postYaw>0.05},
              visual:{blankSemanticPanelViolation:blankPanel,typographyVisible:Boolean(initial.typography)},
              runtime:{pageErrors:x.pageErrors,fatalConsoleErrors:fatalConsole(x.consoleErrors),renderer:finalDiag.renderer},
              locks:{geometry:initial.geometryPass,hierarchy:initial.hierarchyPass,productionMainTouched:false},
              typography:initial.typography,
              recorder
            };
            if (!qa.continuity.postSemanticMotionContinues) throw new Error(`Post-semantic motion missing ${postYaw}`);
            if (!qa.continuity.noCameraSnap) throw new Error(`Camera changed ${maxCamera}`);
            if (!qa.continuity.noVisibleMotionJump) throw new Error(`Motion jump ${maxFrameDelta}`);
            if (blankPanel) throw new Error('Blank semantic panel violation');
            fs.writeFileSync(path.join(OUT,'qa.json'),JSON.stringify(qa,null,2));
            await x.context.close();
            return qa;
          }

          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--disable-dev-shm-usage']});
          try {
            const s=await sample(browser);
            console.log('SHORT_SAMPLE_PASS',JSON.stringify({codec:s.probe.streams[0].codec_name,width:s.probe.streams[0].width,height:s.probe.streams[0].height,fps:s.probe.streams[0].r_frame_rate,typography:Boolean(s.state.typography),track:s.recorder.trackType}));
            const qa=await full(browser);
            console.log('FULL_CAPTURE_PASS',JSON.stringify(qa.video));
          } finally {
            await browser.close();
            fs.rmSync('.capture-pr.mjs',{force:true});
          }
          NODE
          node .capture-pr.mjs

      - name: Final focused evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find review-artifact -maxdepth 1 -type f -name '*.mp4' | wc -l)" -eq 1
          test "$(find review-artifact -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 2
          test -f review-artifact/qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('review-artifact/qa.json').read_text())
          assert q['allPass'] is True
          assert q['video']['spliceCount']==0 and q['video']['continuousRuntime'] is True
          assert q['semantic']['observed'] is True and q['semantic']['complete'] is True
          assert q['semantic']['semanticStartActiveTurns']==0 and q['semantic']['maxActiveTurnsWhileBlocked']==0
          assert q['semantic']['sawPause'] is True and q['semantic']['sawResume'] is True
          assert q['continuity']['postSemanticMotionContinues'] is True
          assert q['continuity']['noCameraSnap'] is True and q['continuity']['noVisibleMotionJump'] is True
          assert q['visual']['blankSemanticPanelViolation'] is False and q['visual']['typographyVisible'] is True
          assert q['runtime']['pageErrors']==[] and q['runtime']['fatalConsoleErrors']==[]
          assert q['locks']['geometry'] is True and q['locks']['productionMainTouched'] is False
          print('FOCUSED_QA_PASS')
          PY

      - name: Upload owner review artifact
        uses: actions/upload-artifact@v4
        with:
          name: proai-semantic-r2-owner-review
          path: docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2/review-artifact/
          if-no-files-found: error
          retention-days: 1
