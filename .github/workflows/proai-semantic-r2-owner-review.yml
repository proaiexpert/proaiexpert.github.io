name: ProAI Semantic Face R4 Legacy Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-semantic-face-r4-legacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4' &&
      false
    runs-on: ubuntu-latest
    steps:
      - name: R4.2 legacy gate disabled for R4.3 owner review
        run: echo "R4.2 legacy 0.70 semantic-motion gate intentionally disabled on R4.3 review branch"
