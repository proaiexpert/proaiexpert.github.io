name: ProAI Semantic R4.3 Public Observer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r43-owner-access-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a
          fetch-depth: 0

      - name: Verify frozen product identity
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne 'f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a') { throw 'wrong frozen product SHA' }
          $blob=(git hash-object material-polish-r4.mjs).Trim()
          if ($blob -ne '6e39c6b93ae710ac4b88a44a453f11bf75f931a5') { throw "material-polish-r4.mjs changed: $blob" }

      - name: Install public observer browser
        shell: pwsh
        run: |
          npm install --package-lock=false
          npm install --no-save playwright
          npx playwright install chromium

      - name: Watch real public R4.3 scene
        shell: pwsh
        env:
          REVIEW_URL: https://independence-hispanic-heard-repairs.trycloudflare.com
        run: |
          @'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.REVIEW_URL;
          const outDir = 'review-evidence/public-observer';
          const videoDir = `${outDir}/video`;
          fs.mkdirSync(videoDir, { recursive: true });

          const fatal = [];
          const responses = [];
          const opportunities = [];
          const samples = [];
          const dist3 = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);

          const browser = await chromium.launch({
            headless: true,
            args: ['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']
          });

          try {
            const context = await browser.newContext({
              viewport: { width: 1170, height: 780 },
              reducedMotion: 'no-preference',
              recordVideo: { dir: videoDir, size: { width: 1170, height: 780 } }
            });
            const page = await context.newPage();
            page.on('pageerror', e => fatal.push(`pageerror:${String(e)}`));
            page.on('console', m => { if (m.type() === 'error') fatal.push(`console:${m.text()}`); });
            page.on('response', r => {
              const type = r.request().resourceType();
              if (['document','stylesheet','script','fetch','xhr','other'].includes(type)) {
                responses.push({ url: r.url(), status: r.status(), type });
              }
            });

            const nav = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 180000 });

            const initial = await page.evaluate(() => ({
              title: document.title,
              canvas: !!document.querySelector('#cube-canvas'),
              webgl: (() => {
                const c = document.querySelector('#cube-canvas');
                if (!c) return false;
                try { return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; }
              })(),
              s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),
              d: window.__PROAI_CUBE_R1_2.getDiagnostics(),
              i: window.__PROAI_CUBE_R1_2.getInteractionState(),
            }));

            const wall0 = Date.now();
            const sim0 = initial.d.presentation.simTimeMs;
            let lastCount = initial.s.naturalOpportunityCount ?? 0;
            let lastSim = sim0;
            let movingSamples = 0;

            while ((Date.now() - wall0) < 60000) {
              await page.waitForTimeout(250);
              const q = await page.evaluate(() => ({
                s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),
                d: window.__PROAI_CUBE_R1_2.getDiagnostics(),
                i: window.__PROAI_CUBE_R1_2.getInteractionState(),
              }));
              const elapsedSec = (Date.now() - wall0) / 1000;
              const simElapsedSec = (q.d.presentation.simTimeMs - sim0) / 1000;
              const alignment = q.s.opticalField?.alignment ?? null;
              const faceView = q.s.opticalField?.faceView ?? null;
              const count = q.s.naturalOpportunityCount ?? lastCount;
              if (q.d.presentation.simTimeMs > lastSim) movingSamples++;
              lastSim = q.d.presentation.simTimeMs;
              samples.push({ elapsedSec, simElapsedSec, alignment, faceView, count });

              if (count > lastCount) {
                for (let n = lastCount + 1; n <= count; n++) {
                  const label = `natural-opportunity-${n}`;
                  const shot = `${outDir}/${label}.png`;
                  await page.locator('#cube-canvas').screenshot({ path: shot, timeout: 120000 });
                  opportunities.push({
                    number: n,
                    elapsedSec,
                    simElapsedSec,
                    alignment,
                    faceView,
                    screenshot: `${label}.png`,
                  });
                }
                lastCount = count;
              }
            }

            const beforePointer = await page.evaluate(() => ({
              s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),
              d: window.__PROAI_CUBE_R1_2.getDiagnostics(),
              i: window.__PROAI_CUBE_R1_2.getInteractionState(),
            }));
            const box = await page.locator('#cube-canvas').boundingBox();
            if (!box) throw new Error('desktop canvas missing');
            const cx = box.x + box.width * .5, cy = box.y + box.height * .5;
            await page.mouse.move(cx, cy);
            await page.mouse.down();
            await page.mouse.move(cx + 240, cy + 90, { steps: 12 });
            await page.mouse.up();
            await page.waitForTimeout(900);
            const afterPointer = await page.evaluate(() => ({
              s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),
              d: window.__PROAI_CUBE_R1_2.getDiagnostics(),
              i: window.__PROAI_CUBE_R1_2.getInteractionState(),
            }));
            await page.locator('#cube-canvas').screenshot({ path: `${outDir}/after-pointer.png`, timeout: 120000 });

            const pointerDelta = dist3(beforePointer.i.cameraPosition, afterPointer.i.cameraPosition);
            const opticalBefore = beforePointer.s.opticalField?.alignment ?? 0;
            const opticalAfter = afterPointer.s.opticalField?.alignment ?? 0;
            const pointerPass = pointerDelta > .01 &&
              afterPointer.d.presentation.simTimeMs > beforePointer.d.presentation.simTimeMs &&
              afterPointer.s.persistentInscription === true &&
              afterPointer.s.physicalEngravedLogicalTileCount === 9 &&
              afterPointer.s.timeScale === 1 &&
              (afterPointer.s.naturalOpportunityCount ?? 0) >= (beforePointer.s.naturalOpportunityCount ?? 0);

            await page.close();
            await context.close();

            const touchContext = await browser.newContext({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 2,
              hasTouch: true,
              isMobile: true,
              reducedMotion: 'no-preference'
            });
            const touchPage = await touchContext.newPage();
            touchPage.on('pageerror', e => fatal.push(`touch-pageerror:${String(e)}`));
            await touchPage.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await touchPage.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 180000 });
            const touchBefore = await touchPage.evaluate(() => ({
              s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),
              d: window.__PROAI_CUBE_R1_2.getDiagnostics(),
            }));
            const tb = await touchPage.locator('#cube-canvas').boundingBox();
            if (!tb) throw new Error('touch canvas missing');
            const tx = tb.x + tb.width * .52, ty = tb.y + tb.height * .48;
            const cdp = await touchContext.newCDPSession(touchPage);
            await cdp.send('Input.dispatchTouchEvent', { type:'touchStart', touchPoints:[{x:tx,y:ty,radiusX:8,radiusY:8,force:.7,id:1}] });
            for (let n=1; n<=7; n++) {
              await cdp.send('Input.dispatchTouchEvent', { type:'touchMove', touchPoints:[{x:tx+n*10,y:ty+n*3,radiusX:8,radiusY:8,force:.7,id:1}] });
            }
            await cdp.send('Input.dispatchTouchEvent', { type:'touchEnd', touchPoints:[] });
            await touchPage.waitForTimeout(900);
            const touchAfter = await touchPage.evaluate(() => ({
              s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),
              d: window.__PROAI_CUBE_R1_2.getDiagnostics(),
            }));
            const touchPass = touchAfter.d.presentation.simTimeMs > touchBefore.d.presentation.simTimeMs &&
              touchAfter.s.persistentInscription === true &&
              touchAfter.s.physicalEngravedLogicalTileCount === 9 &&
              touchAfter.s.timeScale === 1;
            await touchContext.close();

            const htmlPass = nav?.status() === 200 && initial.title.toLowerCase().includes('proai');
            const cssPass = responses.some(r => r.type === 'stylesheet' && r.status >= 200 && r.status < 400);
            const jsPass = responses.some(r => r.type === 'script' && r.status >= 200 && r.status < 400);
            const glbPass = responses.some(r => /\.glb(?:\?|$)/i.test(r.url) && r.status >= 200 && r.status < 400);
            const webglPass = initial.webgl && initial.canvas;
            const cubeVisiblePass = initial.s.physicalCubieMaterial === true && initial.s.physicalEngravedLogicalTileCount === 9;
            const cubeMovingPass = movingSamples > 100 && samples.at(-1)?.simElapsedSec > 45;
            const naturalPass = opportunities.length >= 3;
            const motionScalePass = initial.s.effectiveGlobalMotionScale === 1 && afterPointer.s.effectiveGlobalMotionScale === 1;
            const pass = htmlPass && cssPass && jsPass && glbPass && webglPass && cubeVisiblePass && cubeMovingPass && naturalPass && motionScalePass && pointerPass && touchPass && fatal.length === 0;

            const result = {
              pass,
              url,
              observedSeconds: (Date.now() - wall0) / 1000,
              frozenProductSha: 'f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a',
              materialBlobSha: '6e39c6b93ae710ac4b88a44a453f11bf75f931a5',
              http: nav?.status() === 200,
              html: htmlPass,
              css: cssPass,
              js: jsPass,
              threeRuntime: !!initial.s && !!initial.d,
              glb: glbPass,
              webgl: webglPass,
              cubeVisible: cubeVisiblePass,
              cubeMoving: cubeMovingPass,
              motionScale: initial.s.effectiveGlobalMotionScale,
              movingSamples,
              naturalOpportunityCount: opportunities.length,
              opportunities,
              pointer: {
                pass: pointerPass,
                cameraDelta: pointerDelta,
                opticalAlignmentBefore: opticalBefore,
                opticalAlignmentAfter: opticalAfter,
                opportunityCountBefore: beforePointer.s.naturalOpportunityCount ?? null,
                opportunityCountAfter: afterPointer.s.naturalOpportunityCount ?? null,
                simBefore: beforePointer.d.presentation.simTimeMs,
                simAfter: afterPointer.d.presentation.simTimeMs,
              },
              touch: { pass: touchPass },
              flags: {
                persistentInscription: afterPointer.s.persistentInscription,
                physicalCubieMaterial: afterPointer.s.physicalCubieMaterial,
                physicalEngravedLogicalTileCount: afterPointer.s.physicalEngravedLogicalTileCount,
                overlayTextRendered: afterPointer.s.overlayTextRendered,
                visualDriverTimeline: afterPointer.s.visualDriverTimeline,
                alphaDominantReveal: afterPointer.s.alphaDominantReveal,
                semanticMotionCoupled: afterPointer.s.semanticMotionCoupled,
                semanticOrientationForcing: afterPointer.s.semanticOrientationForcing,
                timeScale: afterPointer.s.timeScale,
                blocksSlices: afterPointer.s.blocksSlices,
                emissive: afterPointer.s.emissive,
                glowHalo: afterPointer.s.glowHalo,
              },
              fatal,
              responses: responses.filter(r => ['document','stylesheet','script'].includes(r.type) || /\.glb(?:\?|$)/i.test(r.url)),
              samples,
            };

            fs.writeFileSync(`${outDir}/observer.json`, JSON.stringify(result, null, 2));
            console.log('R43_PUBLIC_OBSERVER', JSON.stringify({
              pass: result.pass,
              observedSeconds: result.observedSeconds,
              opportunities: result.opportunities,
              pointer: result.pointer,
              touch: result.touch,
              fatal: result.fatal,
            }));
            if (!pass) process.exitCode = 1;
          } finally {
            await browser.close();
          }
          '@ | Set-Content -Path public-observer.mjs -Encoding utf8
          node public-observer.mjs
          Remove-Item public-observer.mjs -Force

      - name: Publish public observer evidence
        uses: actions/upload-artifact@v4
        with:
          name: r43-public-observer
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/public-observer/
          retention-days: 7
