name: ProAI Semantic R4.3 Observer Queue Cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r43-owner-access-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: false
    runs-on: ubuntu-slim
    steps:
      - run: echo "observer queue cleared"
