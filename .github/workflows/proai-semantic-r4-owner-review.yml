name: ProAI Semantic R4.2 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0c9cafc0d7a29879a257f11cd26a0db77bb187e6
          fetch-depth: 0

      - name: Pin exact R4.2 product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0c9cafc0d7a29879a257f11cd26a0db77bb187e6"

      - name: Verify narrow product scope
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only f4037958a3b4ae9ef544ee8a97b2bf0aea60db0e...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2 index.html ru/index.html)"
          test "$(git diff --name-only d4902a151b5f4cc98032c956e3d9e1d0fca94827...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-face-r4 | sort)" = "docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs"

      - name: Build exact R4.2 product
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb)" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "surfaceMaxOpacity: 0.020" main.generated.js
          grep -q "semanticVelocityMultiplier: 0.70" main.generated.js
          grep -q "revealMs: 600" main.generated.js
          grep -q "readableHoldMs: 1250" main.generated.js
          grep -q "exitMs: 520" main.generated.js
          grep -q "SEMANTIC_R4_2_SOFT_SPATIAL_OPTICAL_DISCOVERY" main.generated.js
          grep -q "key RectAreaLight half-vector + broad surface-space lobe" main.generated.js
          grep -q "latticeCenters + GEOMETRY_R1.faceOuterSize" main.generated.js
          grep -q "scanWipeShimmer: false" main.generated.js
          grep -q "letterWordStagger: false" main.generated.js
          grep -q "emissive: false" main.generated.js
          grep -q "glowHalo: false" main.generated.js
          ! grep -q "microHalo" main.generated.js
          ! grep -q "emissiveIntensity" main.generated.js

      - name: Install review browser
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start review runtime
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r4-2-http.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Verify local R4.2 optical and interaction contract
        run: |
          set -euo pipefail
          cat >r4-2-local-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:980,height:760},deviceScaleFactor:1,reducedMotion:'no-preference'});
          const page=await context.newPage();
          const fatal=[];
          page.on('pageerror',e=>fatal.push(String(e)));
          page.on('console',m=>{if(m.type()==='error'&&/GLB load failed|TypeError|ReferenceError|WebGL context lost|Shader Error/i.test(m.text()))fatal.push(m.text())});
          try {
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            await page.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().activeTurns.length===0,null,{timeout:15000});
            const before=await page.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:20000});
            const samples=[];
            let interacted=false;
            const canvas=page.locator('#cube-canvas');
            const box=await canvas.boundingBox();
            if(!box)throw new Error('canvas box missing');
            const x=box.x+box.width*.52,y=box.y+box.height*.48;
            for(let i=0;i<26;i++){
              const s=await page.evaluate(()=>({semantic:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,interaction:window.__PROAI_CUBE_R1_2.getInteractionState()}));
              samples.push(s);
              if(!interacted&&s.semantic.elapsedMs>430){
                await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+66,y+20,{steps:6});await page.waitForTimeout(120);await page.mouse.up();interacted=true;
              }
              if(s.semantic.complete)break;
              await page.waitForTimeout(110);
            }
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().complete===true,null,{timeout:15000});
            const done=await page.evaluate(()=>({semantic:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,interaction:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const active=samples.filter(s=>s.semantic.active);
            const opportunities=active.map(s=>s.semantic.opticalField?.opportunity??0);
            const centers=active.map(s=>s.semantic.opticalField?.fieldCenter||[.5,.5]);
            const peak=Math.max(...opportunities,0),peakIndex=opportunities.indexOf(peak),postPeak=peakIndex>=0?opportunities.slice(peakIndex+1):[];
            const centerSpan=centers.reduce((m,c)=>Math.max(m,Math.hypot(c[0]-centers[0][0],c[1]-centers[0][1])),0);
            const sameEntry=active.length>1&&active.every(s=>s.semantic.entryPresentationMs===active[0].semantic.entryPresentationMs);
            const motionAlive=done.sim>before&&active.every((s,i)=>i===0||s.sim>=active[i-1].sim);
            const flags=done.semantic;
            const pass=active.length>=5&&peak>.50&&peakIndex>=0&&postPeak.some(v=>v<peak*.72)&&centerSpan>.002&&sameEntry&&motionAlive&&interacted&&done.interaction.resumeDelayRemainingMs===0&&done.interaction.sliceResumeDelayRemainingMs===0&&flags.semanticVelocityMultiplier===.70&&flags.seamAwareOcclusion===true&&flags.emissive===false&&flags.glowHalo===false&&flags.scanWipeShimmer===false&&flags.letterWordStagger===false&&fatal.length===0;
            const metrics={pass,interacted,peak,peakIndex,centerSpan,sameEntry,motionAlive,before,done,samples,fatalErrors:fatal};
            fs.mkdirSync('review-evidence',{recursive:true});
            fs.writeFileSync('review-evidence/r4-2-local-metrics.json',JSON.stringify(metrics,null,2));
            console.log('R4_2_LOCAL_QA',JSON.stringify({pass,interacted,peak,peakIndex,centerSpan,sameEntry,motionAlive,fatal}));
            if(!pass)process.exitCode=1;
          } finally { await browser.close(); }
          NODE
          node r4-2-local-qa.mjs
          rm -f r4-2-local-qa.mjs

      - name: Verify touch lifecycle independence
        run: |
          set -euo pipefail
          cat >r4-2-touch-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,hasTouch:true,isMobile:true,reducedMotion:'no-preference'});
          const page=await context.newPage();
          try {
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            await page.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:20000});
            const box=await page.locator('#cube-canvas').boundingBox();if(!box)throw new Error('canvas missing');
            const x=box.x+box.width*.52,y=box.y+box.height*.48;
            const before=await page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs}));
            const cdp=await context.newCDPSession(page);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,radiusX:8,radiusY:8,force:.7,id:1}]});
            for(let i=1;i<=6;i++)await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x+i*9,y:y+i*3,radiusX:8,radiusY:8,force:.7,id:1}]});
            await page.waitForTimeout(150);await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await page.waitForTimeout(150);
            const after=await page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const pass=after.s.entryPresentationMs===before.s.entryPresentationMs&&(after.s.active||after.s.complete)&&after.sim>before.sim&&after.i.resumeDelayRemainingMs===0&&after.i.sliceResumeDelayRemainingMs===0;
            console.log('R4_2_TOUCH_QA',JSON.stringify({pass,before,after}));if(!pass)process.exitCode=1;
          } finally {await browser.close()}
          NODE
          node r4-2-touch-qa.mjs
          rm -f r4-2-touch-qa.mjs

      - name: Publish TryCloudflare owner preview
        id: tunnel
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r4-2-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 &
            PID=$!
            URL=''
            for i in $(seq 1 60); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              [ -n "$URL" ] && break
              sleep 1
            done
            if [ -n "$URL" ]; then
              for i in $(seq 1 18); do
                if curl -fsSL --max-time 12 "$URL/" >/tmp/r4-2-public.html 2>/dev/null; then
                  REVIEW_URL="$URL"
                  break 2
                fi
                sleep 2
              done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r4-2-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r4-2-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Public live Builder observation
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          cat >r4-2-public-observe.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('review-evidence/public-observation',{recursive:true});
          const url=process.env.REVIEW_URL;
          const fatal=[];
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:1170,height:780},deviceScaleFactor:1,reducedMotion:'no-preference'});
          const page=await context.newPage();
          page.on('pageerror',e=>fatal.push(String(e)));
          page.on('console',m=>{if(m.type()==='error'&&/GLB load failed|TypeError|ReferenceError|WebGL context lost|Shader Error/i.test(m.text()))fatal.push(m.text())});
          try {
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            const canvas=page.locator('#cube-canvas');const box=await canvas.boundingBox();if(!box||box.width<100||box.height<100)throw new Error('public Cube canvas missing');
            await page.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            const sim0=await page.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);await page.waitForTimeout(700);const sim1=await page.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);if(!(sim1>sim0))throw new Error('public Cube motion not advancing');
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:20000});
            const samples=[];let peakShot=false,leaveShot=false,interacted=false;const x=box.x+box.width*.52,y=box.y+box.height*.48;
            for(let i=0;i<32;i++){
              const state=await page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs}));samples.push(state);
              const opp=state.s.opticalField?.opportunity??0;
              if(!peakShot&&opp>.72){await canvas.screenshot({path:'review-evidence/public-observation/r4-2-peak.png'});peakShot=true}
              if(peakShot&&!leaveShot&&state.s.elapsedMs>1350&&opp<.55){await canvas.screenshot({path:'review-evidence/public-observation/r4-2-leaving.png'});leaveShot=true}
              if(!interacted&&state.s.elapsedMs>520){await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+74,y+22,{steps:6});await page.waitForTimeout(120);await page.mouse.up();interacted=true}
              if(state.s.complete)break;await page.waitForTimeout(100);
            }
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().complete===true,null,{timeout:15000});
            const done=await page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const active=samples.filter(x=>x.s.active),ops=active.map(x=>x.s.opticalField?.opportunity??0),peak=Math.max(...ops,0),pi=ops.indexOf(peak),center0=active[0]?.s.opticalField?.fieldCenter||[.5,.5],centerSpan=active.reduce((m,x)=>{const c=x.s.opticalField?.fieldCenter||center0;return Math.max(m,Math.hypot(c[0]-center0[0],c[1]-center0[1]))},0);
            const pass=peak>.50&&pi>=0&&ops.slice(pi+1).some(v=>v<peak*.72)&&centerSpan>.002&&interacted&&done.i.resumeDelayRemainingMs===0&&done.i.sliceResumeDelayRemainingMs===0&&done.s.seamAwareOcclusion===true&&done.s.emissive===false&&done.s.glowHalo===false&&done.s.scanWipeShimmer===false&&done.s.letterWordStagger===false&&fatal.length===0;
            const observation={pass,url,peak,peakIndex:pi,centerSpan,interacted,peakShot,leaveShot,done,samples,fatalErrors:fatal};
            fs.writeFileSync('review-evidence/public-observation/r4-2-public-observation.json',JSON.stringify(observation,null,2));
            console.log('R4_2_PUBLIC_BUILDER_OBSERVATION',JSON.stringify({pass,url,peak,pi,centerSpan,interacted,peakShot,leaveShot,fatal}));if(!pass)process.exitCode=1;
          } finally {await browser.close()}
          NODE
          node r4-2-public-observe.mjs
          rm -f r4-2-public-observe.mjs

      - name: Publish Builder visual observation
        uses: actions/upload-artifact@v4
        with:
          name: r4-2-builder-visual-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/public-observation/
          retention-days: 7

      - name: Publish owner URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: r4-2-owner-review-url
          path: r4-2-owner-review-url.txt
          retention-days: 1

      - name: Hold owner preview for approximately 3 hours
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 "$REVIEW_URL/" >/dev/null
          sleep 10800
