name: ProAI Cube R4.4.3 Owner Review Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r443-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner-review:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 731f435c3ee895300d053a83153832cabe65f2ca
          fetch-depth: 0

      - name: Verify exact product ancestry and production freeze
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "731f435c3ee895300d053a83153832cabe65f2ca"
          test "$(git hash-object material-polish-r4.mjs)" = "a5977cccb87056c000f0a60020529bff383f13e4"
          test "$(git hash-object material-polish-r442-runtime.mjs)" = "377b2d3a6aef08ba4bc47981fb31893709c0a1f1"
          test "$(git hash-object material-polish-r443-runtime.mjs)" = "56ba821cdacfd4558740eea7abd5be3d6bcad13f"
          test "$(git hash-object package.json)" = "5038bf3aaa089f9ff001b93ede0df72f9890e89d"
          git cat-file -e 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc^{commit}
          git cat-file -e 5f3d8d4f410070c1d7d1beee44e1e2cd45f1702b^{commit}
          git cat-file -e b0ad92791c00a4ee94df05d87e858c04a783847c^{commit}
          git merge-base --is-ancestor 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc 731f435c3ee895300d053a83153832cabe65f2ca
          git merge-base --is-ancestor 5f3d8d4f410070c1d7d1beee44e1e2cd45f1702b 731f435c3ee895300d053a83153832cabe65f2ca
          git merge-base --is-ancestor b0ad92791c00a4ee94df05d87e858c04a783847c 731f435c3ee895300d053a83153832cabe65f2ca
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"

      - name: Build R4.4.3 and enforce hard locks
        run: |
          set -euo pipefail
          timeout 180s npm install --package-lock=false
          timeout 180s npm run build-r443
          node --check main.generated.js
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -Fq "PROAI_CUBE_R4.4.3" main.generated.js
          grep -Fq "SEMANTIC_R443_SEQUENCE=Object.freeze(['ProAI Expert','TRUST','INQUIRY','RESPONSE','RESULT'])" main.generated.js
          grep -Fq "candidateDwellMs:320" main.generated.js
          grep -Fq "maxReadableMs:2400" main.generated.js
          grep -Fq "dispersalTargetMs:[350,1250]" main.generated.js
          grep -Fq "minAngularTravelDeg:28" main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js
          grep -Fq "R4_4_2_PHYSICAL_MICRO_ENGRAVED_" main.generated.js
          grep -Fq "bumpScale:-.130" main.generated.js
          grep -Fq "roughnessMapInk:.550" main.generated.js
          grep -Fq "tonalInk:.820" main.generated.js
          grep -Fq "pearlEdgeRoughnessInk:.095" main.generated.js
          grep -Fq "r441HorizontalReductionPct:12.5" main.generated.js
          grep -Fq "r441VerticalReductionPct:10" main.generated.js
          grep -Fq "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -Fq "const deltaMs=wallDeltaMs" main.generated.js
          grep -Fq "overlayTextRendered:false" main.generated.js
          grep -Fq "alphaDominantReveal:false" main.generated.js
          grep -Fq "semanticMotionCoupled:false" main.generated.js
          grep -Fq "semanticOrientationForcing:false" main.generated.js
          ! grep -Fq "velocityDegPerSec: -" main.generated.js
          ! grep -Fq "wallDeltaMs * semanticTimeScale" main.generated.js
          ! grep -Fq "SEMANTIC_R4_2_TEXT" main.generated.js
          ! grep -Fq "emissiveIntensity" main.generated.js

      - name: Verify R4.4.2 rollback still builds
        run: |
          set -euo pipefail
          cp material-polish-r443-runtime.mjs /tmp/r443-runtime.mjs
          cp package.json /tmp/r443-package.json
          git show 5f3d8d4f410070c1d7d1beee44e1e2cd45f1702b:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/package.json > package.json
          timeout 180s npm run build-r442 >/dev/null
          node --check main.generated.js
          mv /tmp/r443-runtime.mjs material-polish-r443-runtime.mjs
          mv /tmp/r443-package.json package.json
          timeout 180s npm run build-r443 >/dev/null

      - name: Install bounded browser tooling
        run: |
          set -euo pipefail
          timeout 120s npm install --no-save playwright
          timeout 300s npx playwright install chromium

      - name: Start local runtime
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-http.log 2>&1 &
          echo $! >/tmp/r443-http.pid
          for i in $(seq 1 30); do curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r443-http.log
          exit 1

      - name: Open bounded public owner tunnel
        id: tunnel
        run: |
          set -euo pipefail
          timeout 90s curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2; do
            LOG="/tmp/r443-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 &
            PID=$!
            echo "$PID" >/tmp/r443-tunnel.pid
            for i in $(seq 1 45); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              if [ -n "$URL" ] && curl -fsSL --max-time 10 "$URL/" >/tmp/r443-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
              sleep 1
            done
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r443-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r443-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Native 60s behavioral QA
        run: |
          set -euo pipefail
          mkdir -p review-evidence/r443
          cat > r443-behavior.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const out='review-evidence/r443', browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']}), page=await browser.newPage({viewport:{width:1100,height:720},reducedMotion:'no-preference'}), fatal=[];
          page.on('pageerror',e=>fatal.push(String(e))); page.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
          const res=await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000}); if(!res||res.status()!==200)throw new Error('local navigation failed'); await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:45000});
          const read=()=>page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})), start=await read(), startSim=start.d.presentation.simTimeMs, trace=[];
          for(let i=0;i<120;i++){await page.waitForTimeout(500);const q=await read(),r=q.s.r443Lifecycle||{},m=q.s.r443Motion||{};trace.push({wallSec:(i+1)*.5,presentationMs:q.d.presentation.simTimeMs,phase:r.phase,yawVelocityDegPerSec:m.yawVelocityDegPerSec,signedYawDeg:m.signedYawDeg,timeScale:q.s.timeScale??1});}
          const end=await read(); await page.screenshot({path:out+'/desktop-60s-end.png'}); await browser.close();
          const life=end.s.r443Lifecycle||{},dyn=end.s.r442DynamicFace||{},moves=end.s.r442MoveDiversity||{}, delta=(a,b,k)=>(b?.[k]||0)-(a?.[k]||0), axes=Object.fromEntries(['X','Y','Z'].map(k=>[k,delta(start.s.r442MoveDiversity?.axisCounts,moves.axisCounts,k)])), layers=Object.fromEntries(['-1','0','1'].map(k=>[k,delta(start.s.r442MoveDiversity?.layerCounts,moves.layerCounts,k)])), events=(life.eventLog||[]).filter(x=>x.startMs>=startSim), intervals=(life.opportunityIntervalsMs||[]).map(x=>x/1000), readable=(life.readableDurationsMs||[]).map(x=>x/1000), latencies=(life.dispersalLatenciesMs||[]).map(x=>x/1000), seq=['ProAI Expert','TRUST','INQUIRY','RESPONSE','RESULT'];
          const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}, total=Object.values(axes).reduce((a,b)=>a+b,0), maxAxisShare=total?Math.max(...Object.values(axes))/total:1;
          const checks={sequence:events.length>=5&&events.every((e,i)=>e.message===seq[i%5]),yawPositive:trace.every(x=>x.yawVelocityDegPerSec>0),yawMonotonic:trace.every((x,i)=>i===0||x.signedYawDeg>=trace[i-1].signedYawDeg-1e-5),motionIndependent:trace.every(x=>Math.abs(x.timeScale-1)<1e-9),noTearing:(dyn.unsafeProtectedStarts||0)===0&&(dyn.assemblyViolations||0)===0,noFlash:(life.shortReadableCount||0)===0&&readable.every(x=>x>=.6),dispersal:latencies.length>0&&latencies.every(x=>x>=.20&&x<=2.20)&&latencies.filter(x=>x>=.35&&x<=1.25).length/latencies.length>=.60,cadence:intervals.length>=3&&Math.min(...intervals)>=3.4&&median(intervals)>=4&&median(intervals)<=9&&Math.max(...intervals)<=13,diversity:['X','Y','Z'].every(k=>axes[k]>0)&&['-1','0','1'].every(k=>layers[k]>0)&&maxAxisShare<=.60,multiFace:new Set(events.map(x=>x.face)).size>=2}; checks.pass=Object.values(checks).every(Boolean);
          const metrics={revision:'PROAI CUBE R4.4.3 — OWNER REVIEW CANDIDATE',productSha:'731f435c3ee895300d053a83153832cabe65f2ca',observationSec:60,axisCounts:axes,layerCounts:layers,events,semanticFacesSelected:[...new Set(events.map(x=>x.face))],readableDurationsSec:readable,opportunityIntervalsSec:intervals,dispersalLatenciesSec:latencies,dispersalLatencySummarySec:{min:latencies.length?Math.min(...latencies):null,median:median(latencies),max:latencies.length?Math.max(...latencies):null},orientationTrace:trace,checks,fatal}; fs.writeFileSync(out+'/r443-metrics.json',JSON.stringify(metrics,null,2)); fs.writeFileSync(out+'/r443-summary.txt',JSON.stringify(metrics,null,2)); if(fatal.length)throw new Error('browser errors '+fatal.join(' | ')); if(!checks.pass)throw new Error('behavior gate '+JSON.stringify(checks));
          NODE
          timeout 100s node r443-behavior.mjs

      - name: Desktop native owner clip 24s
        run: |
          set -euo pipefail
          cat > r443-desktop-video.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs'; const out='review-evidence/r443',b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']}),c=await b.newContext({viewport:{width:1280,height:720},recordVideo:{dir:out,size:{width:1280,height:720}},reducedMotion:'no-preference'}),p=await c.newPage(); await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:45000}); const v=p.video(); await p.waitForTimeout(24000); await p.screenshot({path:out+'/desktop-24s.png'}); await c.close(); fs.copyFileSync(await v.path(),out+'/desktop-continuous-24s.webm'); await b.close();
          NODE
          timeout 70s node r443-desktop-video.mjs

      - name: Focused semantic release dispersal clip
        run: |
          set -euo pipefail
          cat > r443-focus-video.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs'; const out='review-evidence/r443',b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']}),c=await b.newContext({viewport:{width:1000,height:650},recordVideo:{dir:out,size:{width:1000,height:650}},reducedMotion:'no-preference'}),p=await c.newPage(); await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:45000}); const v=p.video(),start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs); let release=false,dispersal=false; for(let i=0;i<150;i++){await p.waitForTimeout(100);const log=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().r443Lifecycle?.lifecycleLog||[]); release ||= log.some(x=>x.type==='release'&&x.presentationMs>=start); dispersal ||= release&&log.some(x=>x.type==='dispersal-slice'&&x.presentationMs>=start); if(dispersal){await p.waitForTimeout(1600);break}} await p.screenshot({path:out+'/focused-semantic-release-dispersal.png'}); await c.close(); fs.copyFileSync(await v.path(),out+'/focused-semantic-release-dispersal.webm'); await b.close(); if(!release||!dispersal)throw new Error('focused lifecycle not captured');
          NODE
          timeout 55s node r443-focus-video.mjs

      - name: Mobile native evidence
        run: |
          set -euo pipefail
          cat > r443-mobile.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs'; const out='review-evidence/r443',b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']}),c=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,recordVideo:{dir:out,size:{width:390,height:844}},reducedMotion:'no-preference'}),p=await c.newPage(); await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:45000}); const v=p.video(),a=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs); await p.waitForTimeout(10000); const z=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs),box=await p.locator('#cube-canvas').boundingBox(); await p.screenshot({path:out+'/mobile-390x844.png',fullPage:true}); await c.close(); fs.copyFileSync(await v.path(),out+'/mobile-10s.webm'); await b.close(); if(!(z>a&&box&&box.width>0&&box.x+box.width<=390.5))throw new Error('mobile gate failed');
          NODE
          timeout 55s node r443-mobile.mjs

      - name: Pointer interaction continuity
        run: |
          set -euo pipefail
          cat > r443-interaction.mjs <<'NODE'
          import { chromium } from 'playwright'; const b=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']}),p=await b.newPage({viewport:{width:900,height:600}}); await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:45000}); const box=await p.locator('#cube-canvas').boundingBox(),a=await p.evaluate(()=>({i:window.__PROAI_CUBE_R1_2.getInteractionState(),t:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs})),x=box.x+box.width/2,y=box.y+box.height/2; await p.mouse.move(x,y); await p.mouse.down(); await p.mouse.move(x+100,y-50,{steps:8}); await p.mouse.up(); await p.waitForTimeout(3200); const z=await p.evaluate(()=>({i:window.__PROAI_CUBE_R1_2.getInteractionState(),t:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics()})); await b.close(); const d=Math.hypot(...z.i.cameraPosition.map((v,i)=>v-a.i.cameraPosition[i])); if(!(d>1e-4&&z.t>a.t&&z.s.r443Lifecycle))throw new Error('interaction continuity failed');
          NODE
          timeout 35s node r443-interaction.mjs

      - name: Transcode owner clips to MP4
        run: |
          set -euo pipefail
          for f in review-evidence/r443/*.webm; do [ -e "$f" ] || continue; timeout 45s ffmpeg -y -i "$f" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "${f%.webm}.mp4" >/dev/null 2>&1; done

      - name: Public self-check
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 "$REVIEW_URL/" | grep -q "ProAI Cube"
          printf 'PUBLIC_SELF_CHECK=PASS\nURL=%s\nPRODUCT=731f435c3ee895300d053a83153832cabe65f2ca\n' "$REVIEW_URL" > review-evidence/r443/public-self-check.txt
          cp "$GITHUB_WORKSPACE/r443-owner-review-url.txt" review-evidence/r443/owner-review-url.txt

      - name: Upload owner review evidence
        uses: actions/upload-artifact@v4
        with:
          name: proai-cube-r443-owner-review-candidate
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r443/
          retention-days: 7

      - name: Keep temporary owner URL alive
        run: |
          echo "Owner URL remains live for approximately 20 minutes after QA completion."
          sleep 1200
