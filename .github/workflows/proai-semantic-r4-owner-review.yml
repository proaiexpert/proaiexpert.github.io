name: ProAI Semantic R4.3 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r43-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a
          fetch-depth: 0

      - name: Pin exact R4.3 product
        run: test "$(git rev-parse HEAD)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Build exact R4.3 product
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb)" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "physicalEngravedLogicalTileCount" main.generated.js
          grep -q "semanticMotionCoupled:false" main.generated.js
          grep -q "effectiveGlobalMotionScale:1.0" main.generated.js
          ! grep -q "onBeforeCompile=(shader)" main.generated.js

      - name: Install public verifier browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact product runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r43-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r43-http.log || true
          exit 1

      - name: Publish TryCloudflare owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r43-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 60); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              [ -n "$URL" ] && break
              sleep 1
            done
            if [ -n "$URL" ]; then
              for i in $(seq 1 25); do
                if curl -fsSL --max-time 12 "$URL/" >/tmp/r43-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
                sleep 2
              done
            fi
            cat "$LOG" || true
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r43-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r43-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public WebGL, pointer and touch
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r43-public.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL;
          const args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'];
          const browser=await chromium.launch({headless:true,args});
          const fatal=[];
          const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
          try {
            const c=await browser.newContext({viewport:{width:980,height:760},reducedMotion:'no-preference'});
            const p=await c.newPage();
            p.on('pageerror',e=>fatal.push(String(e))); p.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            await p.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            const before=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            await p.waitForTimeout(900);
            const moving=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const box=await p.locator('#cube-canvas').boundingBox(); if(!box) throw new Error('canvas missing');
            const cx=box.x+box.width*.5,cy=box.y+box.height*.5;
            await p.mouse.move(cx,cy); await p.mouse.down(); await p.mouse.move(cx+240,cy+90,{steps:12}); await p.mouse.up(); await p.waitForTimeout(250);
            const dragged=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const pointerDelta=dist(moving.i.cameraPosition,dragged.i.cameraPosition);
            const publicMotion=moving.d.presentation.simTimeMs>before.d.presentation.simTimeMs;
            const flags=dragged.s;
            const basePass=publicMotion&&pointerDelta>.01&&flags.persistentInscription===true&&flags.physicalCubieMaterial===true&&flags.physicalEngravedLogicalTileCount===9&&flags.overlayTextRendered===false&&flags.visualDriverTimeline===false&&flags.alphaDominantReveal===false&&flags.semanticMotionCoupled===false&&flags.semanticOrientationForcing===false&&flags.timeScale===1&&flags.blocksSlices===false&&flags.seamAwareOcclusion===true&&flags.emissive===false&&flags.glowHalo===false;
            await c.close();

            const tc=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),tp=await tc.newPage();
            await tp.goto(url,{waitUntil:'domcontentloaded',timeout:120000}); await tp.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            const tb=await tp.evaluate(()=>({d:window.__PROAI_CUBE_R1_2.getDiagnostics(),s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics()}));
            const tbox=await tp.locator('#cube-canvas').boundingBox(); if(!tbox) throw new Error('touch canvas missing');
            const tx=tbox.x+tbox.width*.52,ty=tbox.y+tbox.height*.48,cdp=await tc.newCDPSession(tp);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:tx,y:ty,radiusX:8,radiusY:8,force:.7,id:1}]});
            for(let n=1;n<=7;n++) await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:tx+n*10,y:ty+n*3,radiusX:8,radiusY:8,force:.7,id:1}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]}); await tp.waitForTimeout(350);
            const ta=await tp.evaluate(()=>({d:window.__PROAI_CUBE_R1_2.getDiagnostics(),s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics()}));
            const touchPass=ta.d.presentation.simTimeMs>tb.d.presentation.simTimeMs&&ta.s.persistentInscription===true&&ta.s.timeScale===1&&ta.s.physicalEngravedLogicalTileCount===9;
            await tc.close();
            const pass=basePass&&touchPass&&fatal.length===0;
            const result={pass,url,publicMotion,pointerDelta,pointerPass:pointerDelta>.01,touchPass,logicalTiles:flags.physicalEngravedLogicalTileCount,motionScale:flags.effectiveGlobalMotionScale,fatal};
            fs.mkdirSync('review-evidence/public',{recursive:true}); fs.writeFileSync('review-evidence/public/r43-public.json',JSON.stringify(result,null,2));
            console.log('R43_PUBLIC',JSON.stringify(result)); if(!pass) process.exitCode=1;
          } finally {await browser.close()}
          NODE
          node r43-public.mjs
          rm -f r43-public.mjs

      - name: Publish owner URL
        uses: actions/upload-artifact@v4
        with:
          name: r43-owner-review-url
          path: r43-owner-review-url.txt
          retention-days: 1

      - name: Publish public QA
        uses: actions/upload-artifact@v4
        with:
          name: r43-public-qa
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/public/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        run: sleep 10800
