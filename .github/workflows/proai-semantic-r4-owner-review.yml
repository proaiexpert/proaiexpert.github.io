name: ProAI Semantic R4 Material Owner Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f9396923431594262c383327db19e471a9141b8
          fetch-depth: 0

      - name: Pin exact owner-reviewed product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0f9396923431594262c383327db19e471a9141b8"

      - name: Verify frozen product scope
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only f4037958a3b4ae9ef544ee8a97b2bf0aea60db0e...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2 index.html ru/index.html)"
          test "$(git diff --name-only 7ae4bc8f9aa519226aec676ab17d4c9fdafdcc15...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/prepare-r4.mjs docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/lab.js docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/qa-r4.mjs docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/index.html docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/styles.css)" = ""

      - name: Build exact R4 material product
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb)" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "surfaceMaxOpacity: 0.032" main.generated.js
          grep -q "semanticVelocityMultiplier: 0.70" main.generated.js
          grep -q "triggerSearchStartMs: 3200" main.generated.js
          grep -q "triggerSearchEndMs: 4200" main.generated.js
          grep -q "revealMs: 600" main.generated.js
          grep -q "readableHoldMs: 1250" main.generated.js
          grep -q "exitMs: 520" main.generated.js
          grep -q "SEMANTIC_R4_PHYSICAL_PEARL_SILVER_INLAY" main.generated.js
          grep -q "latticeCenters + GEOMETRY_R1.faceOuterSize" main.generated.js
          ! grep -q "microHalo" main.generated.js

      - name: Start review runtime
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r4-http.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Publish TryCloudflare owner preview
        id: tunnel
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r4-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 &
            PID=$!
            URL=''
            for i in $(seq 1 60); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              [ -n "$URL" ] && break
              sleep 1
            done
            if [ -n "$URL" ]; then
              for i in $(seq 1 18); do
                if curl -fsSL --max-time 12 "$URL/" >/tmp/r4-public.html 2>/dev/null; then
                  REVIEW_URL="$URL"
                  break 2
                fi
                sleep 2
              done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r4-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r4-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public WebGL product render
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install chromium
          cat >/tmp/r4-public-verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          const url = process.env.REVIEW_URL;
          const fatal = [];
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--enable-unsafe-swiftshader',
              '--use-gl=swiftshader',
              '--disable-dev-shm-usage',
            ],
          });
          try {
            const context = await browser.newContext({ viewport: { width: 1170, height: 780 }, deviceScaleFactor: 2, reducedMotion: 'no-preference' });
            const page = await context.newPage();
            page.on('pageerror', (error) => fatal.push(String(error)));
            page.on('console', (message) => {
              if (message.type() === 'error' && /GLB load failed|TypeError|ReferenceError|WebGL context lost/i.test(message.text())) fatal.push(message.text());
            });
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout: 120000 });
            const before = await page.evaluate(() => ({
              canvasWidth: document.querySelector('#cube-canvas')?.width || 0,
              canvasHeight: document.querySelector('#cube-canvas')?.height || 0,
              simTimeMs: window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,
            }));
            await page.waitForTimeout(900);
            const after = await page.evaluate(() => ({
              simTimeMs: window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,
              semantic: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),
            }));
            if (before.canvasWidth < 2 || before.canvasHeight < 2) throw new Error('WebGL canvas has no render size');
            if (!(after.simTimeMs > before.simTimeMs)) throw new Error('Presentation render loop is not advancing');
            const replay = await page.evaluate(() => window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());
            if (replay !== true) throw new Error('Semantic replay was not accepted');
            await page.waitForFunction(() => {
              const d = window.__PROAI_CUBE_R1_2.getSemanticDiagnostics();
              return d.pending === true || d.active === true;
            }, null, { timeout: 15000 });
            const semantic = await page.evaluate(() => window.__PROAI_CUBE_R1_2.getSemanticDiagnostics());
            if (semantic.materialModel !== 'MeshPhysicalMaterial / tone-mapped Pearl-Silver inlay') throw new Error(`Unexpected material model: ${semantic.materialModel}`);
            if (semantic.seamAwareOcclusion !== true) throw new Error('Seam-aware occlusion missing');
            if (semantic.surfaceOpacityMax !== 0.032) throw new Error(`Unexpected surface opacity: ${semantic.surfaceOpacityMax}`);
            if (fatal.length) throw new Error(`Fatal browser errors: ${fatal.join(' | ')}`);
            console.log('PUBLIC_WEBGL_PRODUCT_RENDER_PASS', JSON.stringify({ url, before, after, semantic }));
          } finally {
            await browser.close();
          }
          NODE
          node /tmp/r4-public-verify.mjs

      - name: Publish owner URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: r4-owner-review-url
          path: r4-owner-review-url.txt
          retention-days: 1

      - name: Hold owner preview for approximately 3 hours
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 "$REVIEW_URL/" >/dev/null
          sleep 10800
