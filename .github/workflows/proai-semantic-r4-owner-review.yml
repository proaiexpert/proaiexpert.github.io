name: ProAI Semantic R4.4.2 Dynamic Face Multi-Axis Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r442-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5de60f7811727849bbc398f04065c264caedd93
          fetch-depth: 0

      - name: Verify exact R4.4.2 product and production freeze
        run: |
          test "$(git rev-parse HEAD)" = "c5de60f7811727849bbc398f04065c264caedd93"
          test "$(git hash-object material-polish-r4.mjs)" = "a5977cccb87056c000f0a60020529bff383f13e4"
          test "$(git hash-object material-polish-r442-runtime.mjs)" = "a97af5cdc93fc5e8991d9a246dd1677f728cd3d7"
          test "$(git hash-object package.json)" = "1438b8c3f361d72d5084ecc99db8f3af5f83f9ac"
          git cat-file -e 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc^{commit}
          git cat-file -e 428e4c7d4c5fcc7a9fb6d4f75e484b80f623f76c^{commit}
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc c5de60f7811727849bbc398f04065c264caedd93
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"

      - name: Build exact R4.4.2 and enforce hard locks
        run: |
          npm install --package-lock=false
          npm run build-r442
          node --check main.generated.js
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -Fq "function createSemanticR442PlanarFaceGeometry(" main.generated.js
          grep -Fq "function createSemanticR442BevelTile(" main.generated.js
          grep -Fq "function createSemanticR442ToneTile(" main.generated.js
          grep -Fq "R4_4_2_PHYSICAL_MICRO_ENGRAVED_" main.generated.js
          grep -Fq "SEMANTIC_R442_ELIGIBLE_FACES" main.generated.js
          grep -Fq "['+Z','+X','-X']" main.generated.js
          grep -Fq "topFaceEligible:false" main.generated.js
          grep -Fq "approachScore:.58,enterScore:.76,exitScore:.46,minView:.58,exitView:.44" main.generated.js
          grep -Fq "nextEligiblePresentationMs:2600" main.generated.js
          grep -Fq "releaseDebounceMs:180" main.generated.js
          grep -Fq "maxProtectedMs:3200" main.generated.js
          grep -Fq "semanticR442ProjectedAreaQuality" main.generated.js
          grep -Fq "semanticR442RecentFacePenalty" main.generated.js
          grep -Fq "semanticR442RecentWeight" main.generated.js
          grep -Fq "postReleaseParticipationCount" main.generated.js
          grep -Fq "targetFullLoopSec:[20,35]" main.generated.js
          grep -Fq "hardMaxNormalSec:40" main.generated.js
          grep -Fq "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -Fq "const deltaMs=wallDeltaMs" main.generated.js
          grep -Fq "overlayTextRendered:false" main.generated.js
          grep -Fq "alphaDominantReveal:false" main.generated.js
          grep -Fq "semanticMotionCoupled:false" main.generated.js
          grep -Fq "semanticOrientationForcing:false" main.generated.js
          ! grep -Fq "unsafeReturnGuardMs:3000" main.generated.js
          ! grep -Fq "semanticR441UnsafePhraseWindowOpen" main.generated.js
          ! grep -Fq "totalLoopSec:19.0" main.generated.js
          ! grep -Fq "wallDeltaMs * semanticTimeScale" main.generated.js
          ! grep -Fq "SEMANTIC_R4_2_TEXT" main.generated.js
          ! grep -Fq "emissiveIntensity" main.generated.js

      - name: Verify exact R4.4.1 rollback remains executable
        run: |
          cp material-polish-r4.mjs /tmp/r442-product.mjs
          git show 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs > material-polish-r4.mjs
          npm run prepare-r4 >/dev/null
          node clock-r4.mjs >/dev/null
          node material-polish-r4.mjs >/dev/null
          node --check main.generated.js
          npx vite build >/dev/null
          mv /tmp/r442-product.mjs material-polish-r4.mjs
          npm run build-r442 >/dev/null
          test "$(git hash-object material-polish-r4.mjs)" = "a5977cccb87056c000f0a60020529bff383f13e4"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact R4.4.2 runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r442-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Publish public owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r442-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do curl -fsSL --max-time 15 "$URL/" >/tmp/r442-public.html 2>/dev/null && { REVIEW_URL="$URL"; break 2; }; sleep 2; done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r442-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r442-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r442-owner-review-url
          path: r442-owner-review-url.txt
          retention-days: 1

      - name: Public multi-axis dynamic-face zero-tearing gate
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r442-gate.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL,out='review-evidence/r442-final';fs.mkdirSync(out,{recursive:true});
          const fatal=[],responses=[];
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          const ready=async(p,u)=>{const nav=await p.goto(u,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});return nav};
          const read=async p=>p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),title:document.title}));
          const shot=async(p,file)=>{const b=await p.locator('#cube-canvas').boundingBox();if(b)await p.screenshot({path:file,clip:{x:Math.max(0,b.x),y:Math.max(0,b.y),width:b.width,height:b.height},timeout:120000})};
          try{
            const native=await browser.newContext({viewport:{width:800,height:540},deviceScaleFactor:1,reducedMotion:'no-preference',recordVideo:{dir:out,size:{width:800,height:540}}}),np=await native.newPage();
            np.on('pageerror',e=>fatal.push(`native-pageerror:${String(e)}`));np.on('console',m=>{if(m.type()==='error')fatal.push(`native-console:${m.text()}`)});np.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            const nav=await ready(np,url),video=np.video(),n0=await read(np),nStart=n0.d.presentation.simTimeMs;await np.waitForTimeout(7000);const n1=await read(np);await shot(np,`${out}/native-public.png`);await native.close();if(video){const vp=await video.path();fs.copyFileSync(vp,`${out}/r442-native-public.webm`)}
            const nativePass=nav?.status()===200&&n1.d.presentation.simTimeMs>nStart;

            const qa=await browser.newContext({viewport:{width:960,height:640},deviceScaleFactor:1,reducedMotion:'no-preference'}),qp=await qa.newPage();
            qp.on('pageerror',e=>fatal.push(`qa-pageerror:${String(e)}`));qp.on('console',m=>{if(m.type()==='error')fatal.push(`qa-console:${m.text()}`)});await ready(qp,url+'?review=1');await qp.waitForTimeout(650);
            await qp.evaluate(()=>{const realSetTimeout=window.setTimeout.bind(window),realClearTimeout=window.clearTimeout.bind(window);let t=performance.now(),epoch=Date.now()-t,seq=100000;const timers=new Map(),rafs=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>epoch+t;const flush=()=>{let again=true,guard=0;while(again&&guard++<100){again=false;for(const [id,x] of [...timers])if(x.due<=t){timers.delete(id);x.cb(...x.args);again=true}}};window.setTimeout=(cb,ms=0,...args)=>{const id=seq++;timers.set(id,{due:t+Math.max(0,Number(ms)||0),cb,args});return id};window.clearTimeout=id=>timers.delete(id);window.requestAnimationFrame=cb=>{const id=seq++,h=realSetTimeout(()=>{rafs.delete(id);t+=120;flush();cb(t)},0);rafs.set(id,h);return id};window.cancelAnimationFrame=id=>{const h=rafs.get(id);if(h!==undefined){realClearTimeout(h);rafs.delete(id)}};window.__R442_QA_CLOCK=true});
            const q0=await read(qp),start=q0.d.presentation.simTimeMs,samples=[];let lastProtected=false,firstProtection=null,firstRelease=null,rejoinShot=false,guard=0;
            while(true){await qp.waitForTimeout(4);const q=await read(qp),scene=(q.d.presentation.simTimeMs-start)/1000,dyn=q.s.r442DynamicFace||{},moves=q.s.r442MoveDiversity||{},candidate=(dyn.candidates||[]).find(x=>x.face===dyn.protectedFace),x={scene,scale:q.s.timeScale??1,protected:dyn.protected===true,protectedFace:dyn.protectedFace||null,assembled:dyn.protectedFace?candidate?.assembled===true:true,quality:candidate?.rawQuality??0,view:candidate?.viewAlignment??0,releaseCount:dyn.releaseCount||0,protectionCount:dyn.protectionCount||0,postReleaseParticipationCount:dyn.postReleaseParticipationCount||0,unsafeProtectedStarts:dyn.unsafeProtectedStarts||0,assemblyViolations:dyn.assemblyViolations||0};samples.push(x);if(x.protected&&!lastProtected&&firstProtection===null){firstProtection=scene;await shot(qp,`${out}/first-protection-entry.png`)}if(!x.protected&&lastProtected&&firstRelease===null){firstRelease=scene;await shot(qp,`${out}/first-protection-release.png`)}if(!rejoinShot&&x.postReleaseParticipationCount>0){await shot(qp,`${out}/semantic-face-rejoined.png`);rejoinShot=true}lastProtected=x.protected;if(scene>=44)break;if(++guard>900)throw new Error(`R4.4.2 deterministic observation stalled at ${scene}`)}
            const qf=await read(qp);await shot(qp,`${out}/desktop-44s.png`);await qa.close();
            const dyn=qf.s.r442DynamicFace||{},moves=qf.s.r442MoveDiversity||{},material=qf.s.r442Material||{},cadence=qf.s.r442Cadence||{},forward=(moves.moveLog||[]).filter(x=>x.phase==='forward'),rel=x=>(x.presentationMs-start)/1000;
            const axes15=new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=15).map(x=>x.axis)),axes35=new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.axis)),layers35=new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.layer)),selectedFaces=new Set((dyn.faceSelections||[]).map(x=>x.face));
            let maxExactStreak=0,streak=0,prev='';for(const m of forward){const k=`${m.axis}:${m.layer}:${m.direction}`;streak=k===prev?streak+1:1;prev=k;maxExactStreak=Math.max(maxExactStreak,streak)}
            const protectedDur=(dyn.protectedIntervals||[]).map(x=>x.durationSec),maxProtected=protectedDur.length?Math.max(...protectedDur):null,scales=samples.map(x=>x.scale),noTearing=samples.every(x=>!x.protected||x.assembled)&&dyn.unsafeProtectedStarts===0&&dyn.assemblyViolations===0;
            const readableRuns=[];let rs=null;for(const x of samples){const readable=x.protected&&x.quality>=.76&&x.view>=.58;if(readable&&rs===null)rs=x.scene;if(!readable&&rs!==null){readableRuns.push(x.scene-rs);rs=null}}if(rs!==null)readableRuns.push(samples.at(-1).scene-rs);const maxReadable=readableRuns.length?Math.max(...readableRuns):null;
            const eligible=JSON.stringify(dyn.eligibleFaces||[])===JSON.stringify(['+Z','+X','-X']);
            const qualityPass=eligible&&material.topFaceEligible===false&&cadence.topFaceEligible===false&&cadence.targetFullLoopSec?.[0]===20&&cadence.targetFullLoopSec?.[1]===35&&cadence.hardMaxNormalSec===40;
            const choreographyPass=axes15.size>=2&&axes35.size===3&&layers35.size===3&&maxExactStreak<=2&&(moves.selectionCount||0)>=5;
            const protectionPass=firstProtection!==null&&firstProtection>=2.2&&firstProtection<=7.0&&(dyn.releaseCount||0)>0&&(maxProtected===null||maxProtected<=3.25)&&noTearing;
            const readabilityPass=maxReadable!==null&&maxReadable>=1.05&&maxReadable<=2.65;
            const rejoinPass=(dyn.postReleaseParticipationCount||0)>0;
            const selectionPass=(dyn.faceSelections||[]).length>=2&&selectedFaces.size>=2;
            const flagsPass=qf.s.overlayTextRendered===false&&qf.s.alphaDominantReveal===false&&qf.s.semanticMotionCoupled===false&&qf.s.semanticOrientationForcing===false&&qf.s.emissive===false&&qf.s.glowHalo===false&&Math.min(...scales)===1&&Math.max(...scales)===1;

            const ic=await browser.newContext({viewport:{width:900,height:600},deviceScaleFactor:1,reducedMotion:'no-preference'}),ip=await ic.newPage();await ready(ip,url);const box=await ip.locator('#cube-canvas').boundingBox(),before=await ip.evaluate(()=>window.__PROAI_CUBE_R1_2.getInteractionState().cameraPosition);if(box){const cx=box.x+box.width/2,cy=box.y+box.height/2;await ip.mouse.move(cx,cy);await ip.mouse.down();await ip.mouse.move(cx+70,cy-40,{steps:8});await ip.mouse.up();await ip.waitForTimeout(700)}const after=await ip.evaluate(()=>window.__PROAI_CUBE_R1_2.getInteractionState().cameraPosition),pointerDelta=Math.hypot(after[0]-before[0],after[1]-before[1],after[2]-before[2]);await shot(ip,`${out}/interaction-after.png`);await ic.close();
            const mc=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,reducedMotion:'no-preference'}),mp=await mc.newPage();await ready(mp,url);const mobile=await read(mp);await shot(mp,`${out}/mobile.png`);await mc.close();const mobilePass=mobile.s.r442Material?.topFaceEligible===false&&mobile.s.timeScale===1;
            const result={pass:nativePass&&qualityPass&&choreographyPass&&protectionPass&&readabilityPass&&rejoinPass&&selectionPass&&flagsPass&&pointerDelta>.01&&mobilePass&&fatal.length===0,url,nativePass,firstProtection,firstRelease,eligibleFaces:dyn.eligibleFaces,selectedFaces:[...selectedFaces],faceSelections:dyn.faceSelections,protectedIntervals:dyn.protectedIntervals,maxProtected,readableRuns,maxReadable,noTearing,axes15:[...axes15],axes35:[...axes35],layers35:[...layers35],axisCounts:moves.axisCounts,layerCounts:moves.layerCounts,selectionCount:moves.selectionCount,maxExactStreak,postReleaseParticipationCount:dyn.postReleaseParticipationCount,lastPostReleaseParticipation:dyn.lastPostReleaseParticipation,protectionCount:dyn.protectionCount,releaseCount:dyn.releaseCount,unsafeProtectedStarts:dyn.unsafeProtectedStarts,assemblyViolations:dyn.assemblyViolations,motion:{min:Math.min(...scales),max:Math.max(...scales)},pointer:{pass:pointerDelta>.01,cameraDelta:pointerDelta},mobilePass,material,cadence,checks:{qualityPass,choreographyPass,protectionPass,readabilityPass,rejoinPass,selectionPass,flagsPass},fatal};
            fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));fs.writeFileSync(`${out}/timeline-samples.json`,JSON.stringify(samples,null,2));console.log('R442_PUBLIC_WATCH',JSON.stringify(result));if(!result.pass)process.exitCode=1;
          }finally{await browser.close()}
          NODE
          node --check r442-gate.mjs
          node r442-gate.mjs
          rm -f r442-gate.mjs

      - name: Publish live observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r442-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r442-final/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
