name: ProAI Semantic R4.2 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86eb7d5c199336a73d2e959fe6d735a3498c4d40
          fetch-depth: 0

      - name: Pin exact R4.2 product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "86eb7d5c199336a73d2e959fe6d735a3498c4d40"

      - name: Verify narrow product scope
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only f4037958a3b4ae9ef544ee8a97b2bf0aea60db0e...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2 index.html ru/index.html)"
          test "$(git diff --name-only d4902a151b5f4cc98032c956e3d9e1d0fca94827...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-face-r4 | sort)" = "docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs"

      - name: Build exact R4.2 product
        run: |
          set -euo pipefail
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb)" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "surfaceMaxOpacity: 0.020" main.generated.js
          grep -q "semanticVelocityMultiplier: 0.70" main.generated.js
          grep -q "revealMs: 600" main.generated.js
          grep -q "readableHoldMs: 1250" main.generated.js
          grep -q "exitMs: 520" main.generated.js
          grep -q "SEMANTIC_R4_2_SOFT_SPATIAL_OPTICAL_DISCOVERY" main.generated.js
          grep -q "key RectAreaLight half-vector + broad surface-space lobe" main.generated.js
          grep -q "latticeCenters + GEOMETRY_R1.faceOuterSize" main.generated.js
          grep -q "scanWipeShimmer: false" main.generated.js
          grep -q "letterWordStagger: false" main.generated.js
          grep -q "emissive: false" main.generated.js
          grep -q "glowHalo: false" main.generated.js
          ! grep -q "SEMANTIC_R2" main.generated.js
          ! grep -q "microHalo" main.generated.js
          ! grep -q "emissiveIntensity" main.generated.js

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start local review runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r4-2-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Verify natural cycle, mouse and touch
        run: |
          cat >r4-2-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'];
          const browser=await chromium.launch({headless:true,args});
          const fatal=[];
          async function desktop(){
            const context=await browser.newContext({viewport:{width:980,height:760},reducedMotion:'no-preference'}),page=await context.newPage();
            page.on('pageerror',e=>fatal.push(String(e))); page.on('console',m=>{if(m.type()==='error'&&/GLB load failed|TypeError|ReferenceError|WebGL context lost|Shader Error/i.test(m.text()))fatal.push(m.text())});
            const read=()=>page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000}); await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000}); await page.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            const initial=await read(); await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:45000});
            const samples=[]; for(let n=0;n<300;n++){const x=await read();samples.push(x);if(x.s.complete)break;await page.waitForTimeout(100)}
            const done=await read(), active=samples.filter(x=>x.s.active), ops=active.map(x=>x.s.opticalField?.opportunity??0), peak=Math.max(...ops,0), pi=ops.indexOf(peak), c0=active[0]?.s.opticalField?.fieldCenter||[.5,.5], centerSpan=active.reduce((m,x)=>{const c=x.s.opticalField?.fieldCenter||c0;return Math.max(m,Math.hypot(c[0]-c0[0],c[1]-c0[1]))},0);
            const naturalPass=done.s.complete===true&&peak>.45&&pi>=0&&ops.slice(pi+1).some(v=>v<peak*.72)&&centerSpan>.001&&done.sim>initial.sim&&done.s.semanticVelocityMultiplier===.70&&done.s.seamAwareOcclusion===true&&done.s.emissive===false&&done.s.glowHalo===false&&done.s.scanWipeShimmer===false&&done.s.letterWordStagger===false;
            const replay=await page.evaluate(()=>window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment()); if(!replay) throw new Error('desktop replay rejected'); await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:20000}); await page.waitForTimeout(450);
            const b=await read(),box=await page.locator('#cube-canvas').boundingBox();if(!box)throw new Error('desktop canvas missing');const px=box.x+box.width*.52,py=box.y+box.height*.48; await page.mouse.move(px,py);await page.mouse.down();await page.mouse.move(px+68,py+22,{steps:6});await page.waitForTimeout(140);await page.mouse.up();await page.waitForTimeout(500);const a=await read();
            const mousePass=a.s.entryPresentationMs===b.s.entryPresentationMs&&(a.s.active||a.s.complete)&&a.sim>b.sim&&a.i.resumeDelayRemainingMs===0&&a.i.sliceResumeDelayRemainingMs===0; await context.close(); return {naturalPass,mousePass,peak,pi,centerSpan,done};
          }
          async function touch(){
            const context=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),page=await context.newPage(); await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});await page.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:45000});await page.waitForTimeout(450);
            const box=await page.locator('#cube-canvas').boundingBox();if(!box)throw new Error('touch canvas missing');const x=box.x+box.width*.52,y=box.y+box.height*.48,b=await page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs})),cdp=await context.newCDPSession(page);await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,radiusX:8,radiusY:8,force:.7,id:1}]});for(let n=1;n<=6;n++)await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x+n*9,y:y+n*3,radiusX:8,radiusY:8,force:.7,id:1}]});await page.waitForTimeout(150);await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await page.waitForTimeout(500);const a=await page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,i:window.__PROAI_CUBE_R1_2.getInteractionState()}));const pass=a.s.entryPresentationMs===b.s.entryPresentationMs&&(a.s.active||a.s.complete)&&a.sim>b.sim&&a.i.resumeDelayRemainingMs===0&&a.i.sliceResumeDelayRemainingMs===0;await context.close();return pass;
          }
          try{const d=await desktop(),t=await touch(),pass=d.naturalPass&&d.mousePass&&t&&fatal.length===0;fs.mkdirSync('review-evidence',{recursive:true});fs.writeFileSync('review-evidence/r4-2-qa.json',JSON.stringify({pass,desktop:d,touchPass:t,fatal},null,2));console.log('R4_2_QA',JSON.stringify({pass,desktop:d,touchPass:t,fatal}));if(!pass)process.exitCode=1}finally{await browser.close()}
          NODE
          node r4-2-qa.mjs
          rm -f r4-2-qa.mjs

      - name: Publish TryCloudflare owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r4-2-tunnel-${attempt}.log"; /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''; for i in $(seq 1 60); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then for i in $(seq 1 18); do if curl -fsSL --max-time 12 "$URL/" >/tmp/r4-2-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi; sleep 2; done; fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"; grep -q "ProAI Cube" /tmp/r4-2-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r4-2-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Public live Builder observation
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat >r4-2-public.mjs <<'NODE'
          import { chromium } from 'playwright';import fs from 'node:fs';fs.mkdirSync('review-evidence/public',{recursive:true});const url=process.env.REVIEW_URL,args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'],fatal=[],browser=await chromium.launch({headless:true,args}),context=await browser.newContext({viewport:{width:1170,height:780},reducedMotion:'no-preference'}),page=await context.newPage();page.on('pageerror',e=>fatal.push(String(e)));page.on('console',m=>{if(m.type()==='error'&&/GLB load failed|TypeError|ReferenceError|WebGL context lost|Shader Error/i.test(m.text()))fatal.push(m.text())});const read=()=>page.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,i:window.__PROAI_CUBE_R1_2.getInteractionState()}));try{await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});const canvas=page.locator('#cube-canvas'),box=await canvas.boundingBox();if(!box||box.width<100)throw new Error('public canvas missing');const s0=(await read()).sim;await page.waitForTimeout(700);if(!((await read()).sim>s0))throw new Error('public motion stopped');await page.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:45000});const samples=[];let peakShot=false,leaveShot=false;for(let n=0;n<300;n++){const x=await read();samples.push(x);const o=x.s.opticalField?.opportunity??0;if(!peakShot&&o>.68){await canvas.screenshot({path:'review-evidence/public/r4-2-peak.png'});peakShot=true}if(peakShot&&!leaveShot&&x.s.elapsedMs>1250&&o<.55){await canvas.screenshot({path:'review-evidence/public/r4-2-leaving.png'});leaveShot=true}if(x.s.complete)break;await page.waitForTimeout(100)}const done=await read(),active=samples.filter(x=>x.s.active),ops=active.map(x=>x.s.opticalField?.opportunity??0),peak=Math.max(...ops,0),pi=ops.indexOf(peak),c0=active[0]?.s.opticalField?.fieldCenter||[.5,.5],centerSpan=active.reduce((m,x)=>{const c=x.s.opticalField?.fieldCenter||c0;return Math.max(m,Math.hypot(c[0]-c0[0],c[1]-c0[1]))},0),natural=done.s.complete===true&&peak>.45&&pi>=0&&ops.slice(pi+1).some(v=>v<peak*.72)&&centerSpan>.001&&peakShot&&leaveShot;const replay=await page.evaluate(()=>window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());if(!replay)throw new Error('public replay rejected');await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:20000});await page.waitForTimeout(450);const b=await read(),px=box.x+box.width*.52,py=box.y+box.height*.48;await page.mouse.move(px,py);await page.mouse.down();await page.mouse.move(px+72,py+24,{steps:6});await page.waitForTimeout(140);await page.mouse.up();await page.waitForTimeout(500);const a=await read(),mouse=a.s.entryPresentationMs===b.s.entryPresentationMs&&(a.s.active||a.s.complete)&&a.sim>b.sim&&a.i.resumeDelayRemainingMs===0&&a.i.sliceResumeDelayRemainingMs===0,flags=done.s,pass=natural&&mouse&&flags.seamAwareOcclusion===true&&flags.emissive===false&&flags.glowHalo===false&&flags.scanWipeShimmer===false&&flags.letterWordStagger===false&&fatal.length===0;const out={pass,natural,mouse,url,peak,peakIndex:pi,centerSpan,peakShot,leaveShot,done,samples,fatal};fs.writeFileSync('review-evidence/public/r4-2-public.json',JSON.stringify(out,null,2));console.log('R4_2_PUBLIC',JSON.stringify({pass,natural,mouse,url,peak,pi,centerSpan,peakShot,leaveShot,fatal}));if(!pass)process.exitCode=1}finally{await browser.close()}
          NODE
          node r4-2-public.mjs
          rm -f r4-2-public.mjs

      - name: Publish Builder observation
        uses: actions/upload-artifact@v4
        with:
          name: r4-2-builder-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/
          retention-days: 7

      - name: Publish owner URL
        uses: actions/upload-artifact@v4
        with:
          name: r4-2-owner-review-url
          path: r4-2-owner-review-url.txt
          retention-days: 1

      - name: Hold owner preview for approximately 3 hours
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          curl -fsSL --max-time 15 "$REVIEW_URL/" >/dev/null
          sleep 10800
