name: ProAI Semantic R4.3 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: macos-15-intel
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a
          fetch-depth: 0

      - name: Pin exact R4.3 product
        run: test "$(git rev-parse HEAD)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Verify R4.3 product containment
        run: |
          cd "$GITHUB_WORKSPACE"
          test "$(git diff --name-only 86eb7d5c199336a73d2e959fe6d735a3498c4d40...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-face-r4 | sort)" = "docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs"
          test -z "$(git diff --name-only 86eb7d5c199336a73d2e959fe6d735a3498c4d40...HEAD -- index.html ru/index.html docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2)"

      - name: Build exact R4.3 product
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(shasum -a 256 rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "surfaceMaxOpacity: 0.000" main.generated.js
          grep -q "decelerationMs: 0" main.generated.js
          grep -q "accelerationMs: 0" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "SEMANTIC_R4_3_PERSISTENT_PHYSICAL_MICRO_ENGRAVING" main.generated.js
          grep -q "createSemanticRoughnessTile" main.generated.js
          grep -q "physicalEngravedLogicalTileCount" main.generated.js
          grep -q "physicalCubieMaterial:true" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "visualDriverTimeline:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "seamAwareOcclusion:true" main.generated.js
          grep -q "emissive:false" main.generated.js
          grep -q "glowHalo:false" main.generated.js
          grep -q "scanWipeShimmer:false" main.generated.js
          grep -q "letterWordStagger:false" main.generated.js
          ! grep -q "customProgramCacheKey" main.generated.js
          ! grep -q "onBeforeCompile=(shader)" main.generated.js
          ! grep -q "microHalo" main.generated.js
          ! grep -q "emissiveIntensity" main.generated.js

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start local review runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r43-http.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/r43-http.log || true
          exit 1

      - name: Verify local physical engraving and motion independence
        run: |
          cat > r43-local.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true, args: ['--enable-webgl','--ignore-gpu-blocklist'] });
          const fatal = [];
          fs.mkdirSync('review-evidence/local', { recursive: true });
          const wire = p => { p.on('pageerror', e => fatal.push(`pageerror:${String(e)}`)); p.on('console', m => { if (m.type() === 'error') fatal.push(`console:${m.text()}`); }); };
          const read = p => p.evaluate(() => ({ s: window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(), d: window.__PROAI_CUBE_R1_2.getDiagnostics() }));
          const stats = a => a.length ? { min: Math.min(...a), max: Math.max(...a), mean: a.reduce((x,y)=>x+y,0)/a.length, n:a.length } : { min:null,max:null,mean:null,n:0 };
          try {
            const capContext = await browser.newContext({ viewport: { width:1170, height:780 }, reducedMotion:'no-preference' });
            const cap = await capContext.newPage(); wire(cap);
            await cap.goto('http://127.0.0.1:4173/?capture', { waitUntil:'domcontentloaded', timeout:120000 });
            await cap.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready === true, null, { timeout:180000 });
            const sweep = [];
            for (let t=.5; t<=68; t+=1) {
              await cap.evaluate(t => { const a=window.__PROAI_CUBE_R1_2; a.setReviewPresentation(t,1,false); a.clearSemanticReviewState(); a.renderReviewFrame(); }, t);
              await cap.waitForTimeout(30);
              const q = await read(cap);
              sweep.push({ t, alignment:q.s.opticalField?.alignment ?? 0, faceView:q.s.opticalField?.faceView ?? 0 });
            }
            const idle = [...sweep].sort((a,b)=>a.alignment-b.alignment)[0];
            const ranked = [...sweep].sort((a,b)=>b.alignment-a.alignment);
            const chosen=[];
            for (const p of ranked) { if (chosen.every(x=>Math.abs(x.t-p.t)>=3)) { chosen.push(p); if (chosen.length===3) break; } }
            const earlyBest = [...sweep].filter(x=>x.t>=3 && x.t<=6).sort((a,b)=>b.alignment-a.alignment)[0];
            const capture = async (label,t) => {
              await cap.evaluate(t => { const a=window.__PROAI_CUBE_R1_2; a.setReviewPresentation(t,1,false); a.clearSemanticReviewState(); a.renderReviewFrame(); }, t);
              await cap.waitForTimeout(80);
              const q=await read(cap);
              await cap.locator('#cube-canvas').screenshot({ path:`review-evidence/local/${label}.png`, timeout:120000 });
              return { label,t,alignment:q.s.opticalField?.alignment??0,s:q.s };
            };
            const visual=[await capture('r43-idle',idle.t)];
            for(let i=0;i<chosen.length;i++) visual.push(await capture(`r43-opportunity-${i+1}`,chosen[i].t));
            const fixed = visual.every(x => x.s.persistentInscription===true && x.s.physicalCubieMaterial===true && x.s.overlayTextRendered===false && x.s.visualDriverTimeline===false && x.s.alphaDominantReveal===false && x.s.microNormalEngraving===true && x.s.physicalEngravedLogicalTileCount===9 && x.s.physicalEngravedTileMeshCount>=9 && x.s.seamAwareOcclusion===true && x.s.emissive===false && x.s.glowHalo===false && x.s.scanWipeShimmer===false && x.s.letterWordStagger===false && x.s.semanticMotionCoupled===false && x.s.semanticOrientationForcing===false && x.s.effectiveGlobalMotionScale===1);
            const opticalPass = chosen.length===3 && chosen.every(x=>x.alignment>idle.alignment+.04) && earlyBest && earlyBest.alignment>idle.alignment+.04;
            await capContext.close();

            const ctx=await browser.newContext({ viewport:{width:980,height:760}, reducedMotion:'no-preference' });
            const p=await ctx.newPage(); wire(p);
            await p.goto('http://127.0.0.1:4173/', { waitUntil:'domcontentloaded', timeout:120000 });
            await p.waitForFunction(() => window.__PROAI_CUBE_R1_2?.ready===true, null, { timeout:180000 });
            await p.evaluate(() => window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            const preAnchor=(await read(p)).d.presentation.simTimeMs;
            await p.waitForFunction(a=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs>=a+1150, preAnchor, {timeout:240000});
            const replay=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());
            if(!replay) throw new Error('replay rejected');
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:60000});
            const entry=await read(p);
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().complete===true,null,{timeout:240000});
            const complete=await read(p); const completeSim=complete.d.presentation.simTimeMs;
            await p.waitForFunction(a=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs>=a+1150,completeSim,{timeout:240000});
            const after=await read(p); const entrySim=entry.d.presentation.simTimeMs; const trace=after.s.motionTrace||[];
            const before=trace.filter(x=>x.presentationMs>=entrySim-1150&&x.presentationMs<entrySim);
            const during=trace.filter(x=>x.semanticActive);
            const post=trace.filter(x=>x.presentationMs>completeSim&&x.presentationMs<=completeSim+1150);
            const a=stats(before.map(x=>x.scale)), b=stats(during.map(x=>x.scale)), c=stats(post.map(x=>x.scale));
            const inspected=[...before,...during,...post];
            const motionPass=[a,b,c].every(x=>x.n>0&&x.min===1&&x.max===1&&x.mean===1) && inspected.every(x=>Math.abs(x.yawVelocityDegPerSec)>.001) && entry.s.timeScale===1 && after.s.timeScale===1 && entry.s.blocksSlices===false && after.s.blocksSlices===false && entry.s.semanticMotionCoupled===false && after.s.semanticMotionCoupled===false && entry.s.semanticOrientationForcing===false && after.s.semanticOrientationForcing===false;
            await ctx.close();
            const pass=fixed&&opticalPass&&motionPass&&fatal.length===0;
            const result={pass,fixed,opticalPass,idle,chosen,earlyBest,motionScale:{before:a,during:b,after:c},motionPass,fatal,visual:visual.map(x=>({label:x.label,t:x.t,alignment:x.alignment,logicalTiles:x.s.physicalEngravedLogicalTileCount,meshTiles:x.s.physicalEngravedTileMeshCount}))};
            fs.writeFileSync('review-evidence/local/r43-local.json',JSON.stringify(result,null,2));
            console.log('R43_LOCAL',JSON.stringify(result));
            if(!pass) process.exitCode=1;
          } finally { await browser.close(); }
          NODE
          node r43-local.mjs
          rm -f r43-local.mjs

      - name: Publish TryCloudflare owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz -o /tmp/cloudflared.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r43-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 60); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              [ -n "$URL" ] && break
              sleep 1
            done
            if [ -n "$URL" ]; then
              for i in $(seq 1 20); do
                if curl -fsSL --max-time 12 "$URL/" >/tmp/r43-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
                sleep 2
              done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r43-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r43-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public WebGL product
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r43-public.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL;
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist']});
          const fatal=[];
          try {
            const c=await browser.newContext({viewport:{width:1170,height:780},reducedMotion:'no-preference'});
            const p=await c.newPage();
            p.on('pageerror',e=>fatal.push(String(e))); p.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            await p.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            const before=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
            await p.waitForTimeout(900);
            const after=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
            const pass=after.d.presentation.simTimeMs>before.d.presentation.simTimeMs && after.s.persistentInscription===true && after.s.physicalCubieMaterial===true && after.s.physicalEngravedLogicalTileCount===9 && after.s.overlayTextRendered===false && after.s.visualDriverTimeline===false && after.s.alphaDominantReveal===false && after.s.semanticMotionCoupled===false && after.s.semanticOrientationForcing===false && after.s.timeScale===1 && after.s.blocksSlices===false && after.s.seamAwareOcclusion===true && after.s.emissive===false && after.s.glowHalo===false && fatal.length===0;
            const result={pass,url,publicMotion:after.d.presentation.simTimeMs>before.d.presentation.simTimeMs,logicalTiles:after.s.physicalEngravedLogicalTileCount,fatal};
            fs.mkdirSync('review-evidence/public',{recursive:true}); fs.writeFileSync('review-evidence/public/r43-public.json',JSON.stringify(result,null,2));
            console.log('R43_PUBLIC',JSON.stringify(result));
            if(!pass) process.exitCode=1;
            await c.close();
          } finally { await browser.close(); }
          NODE
          node r43-public.mjs
          rm -f r43-public.mjs

      - name: Publish Builder observation
        uses: actions/upload-artifact@v4
        with:
          name: r43-builder-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/
          retention-days: 7

      - name: Publish owner URL
        uses: actions/upload-artifact@v4
        with:
          name: r43-owner-review-url
          path: r43-owner-review-url.txt
          retention-days: 1

      - name: Hold owner preview for approximately 3 hours
        run: sleep 10800
