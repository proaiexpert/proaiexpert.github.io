name: ProAI Semantic R4.4.1 Zero-Tearing Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r441-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc
          fetch-depth: 0

      - name: Verify exact R4.4.1 product, rollback, and production freeze
        run: |
          test "$(git rev-parse HEAD)" = "65adaa0bb3fb356bdc031646fd9eef6ddfb737fc"
          test "$(git hash-object material-polish-r4.mjs)" = "8a2d6eca7a778b1c2c453a2a11ae018da6ea474f"
          git cat-file -e 428e4c7d4c5fcc7a9fb6d4f75e484b80f623f76c^{commit}
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor 428e4c7d4c5fcc7a9fb6d4f75e484b80f623f76c 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"

      - name: Build R4.4.1 and enforce hard invariants
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -Fq "bumpScale:-0.130,roughnessMapInk:0.550,metalnessDelta:0.0,tonalInk:0.820" main.generated.js
          grep -Fq "R4_4_1_PHYSICAL_MICRO_ENGRAVED_" main.generated.js
          grep -Fq "edgeRoughnessInk:.095" main.generated.js
          grep -Fq "r441HorizontalReductionPct:12.5" main.generated.js
          grep -Fq "r441VerticalReductionPct:10" main.generated.js
          grep -Fq "topReflectorIntensity:.92" main.generated.js
          grep -Fq "totalLoopSec:19.0" main.generated.js
          grep -Fq "semanticR441SelectScheduledMove" main.generated.js
          grep -Fq "schedulerPausesGlobally:false" main.generated.js
          grep -Fq "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -Fq "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -Fq "wallDeltaMs * semanticTimeScale" main.generated.js
          grep -Fq "overlayTextRendered:false" main.generated.js
          grep -Fq "alphaDominantReveal:false" main.generated.js
          grep -Fq "semanticMotionCoupled:false" main.generated.js
          grep -Fq "semanticOrientationForcing:false" main.generated.js
          ! grep -Fq "SEMANTIC_R4_2_TEXT" main.generated.js
          ! grep -Fq "emissiveIntensity" main.generated.js

      - name: Verify exact R4.4 rollback remains executable
        run: |
          cp material-polish-r4.mjs /tmp/r441-material.mjs
          git show 428e4c7d4c5fcc7a9fb6d4f75e484b80f623f76c:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs > material-polish-r4.mjs
          npm run prepare-r4 >/dev/null
          node clock-r4.mjs >/dev/null
          node material-polish-r4.mjs >/dev/null
          node --check main.generated.js
          npx vite build >/dev/null
          mv /tmp/r441-material.mjs material-polish-r4.mjs
          npm run prepare-r4 >/dev/null
          node clock-r4.mjs >/dev/null
          node material-polish-r4.mjs >/dev/null
          npx vite build >/dev/null

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact R4.4.1 runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r441-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Publish public owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r441-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do curl -fsSL --max-time 15 "$URL/" >/tmp/r441-public.html 2>/dev/null && { REVIEW_URL="$URL"; break 2; }; sleep 2; done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r441-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r441-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r441-owner-review-url
          path: r441-owner-review-url.txt
          retention-days: 1

      - name: Fast exact-public self-check
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r441-public-self-check.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL,out='review-evidence/r441-final';fs.mkdirSync(out,{recursive:true});
          const fatal=[],responses=[],score=o=>o?.frontFacing===true?Math.max(0,Math.min(1,.64*(o.faceView||0)+.36*(o.alignment||0))):0;
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          const ctx=await browser.newContext({viewport:{width:800,height:540},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await ctx.newPage();
          p.on('pageerror',e=>fatal.push(`pageerror:${String(e)}`));p.on('console',m=>{if(m.type()==='error')fatal.push(`console:${m.text()}`)});p.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
          const qaClock=`(()=>{let t=0,e=Date.now(),id=1,q=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>e+t;window.requestAnimationFrame=(cb)=>{const n=id++;const h=setTimeout(()=>{q.delete(n);t+=320;cb(t)},0);q.set(n,h);return n};window.cancelAnimationFrame=n=>{const h=q.get(n);if(h!==undefined){clearTimeout(h);q.delete(n)}}})();`;await p.addInitScript({content:qaClock});
          const nav=await p.goto(url+'?review=1',{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
          const read=()=>p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),title:document.title,webgl:Boolean(document.getElementById('cube-canvas')?.getContext('webgl2')||document.getElementById('cube-canvas')?.getContext('webgl'))}));
          const q0=await read(),start=q0.d.presentation.simTimeMs,samples=[];let firstMeaningful=null,tearing=false,peak=null;
          for(let i=0;i<70;i++){await p.waitForTimeout(0);const q=await read(),scene=(q.d.presentation.simTimeMs-start)/1000,o=q.s.opticalField||{},safe=q.s.r441SemanticSafeSlice||{},sc=score(o),meaningful=o.frontFacing===true&&(o.faceView||0)>=.84&&sc>=.90;const x={scene,score:sc,faceView:o.faceView||0,meaningful,protected:safe.protected===true,assembled:safe.faceAssembledExact===true,scale:q.s.timeScale??1,safeStarts:safe.safeMoveStarts||0,replacements:safe.replacements||0,unsafeProtectedStarts:safe.unsafeProtectedStarts||0,assemblyViolations:safe.assemblyViolations||0};samples.push(x);if(meaningful&&firstMeaningful===null)firstMeaningful=scene;if((meaningful||x.protected)&&!x.assembled)tearing=true;if(!peak||sc>peak.score)peak=x;if(scene>=9&&firstMeaningful!==null)break}
          const q1=await read(),safe=q1.s.r441SemanticSafeSlice||{},cadence=q1.s.r441Cadence||{},material=q1.s.r441Material||{},typography=q1.s.r441TypographyScale||{},scales=samples.map(x=>x.scale),good=r=>r.status>=200&&r.status<400;
          const box=await p.locator('#cube-canvas').boundingBox();if(box)await p.screenshot({path:`${out}/owner-public-self-check.png`,clip:{x:Math.max(0,box.x),y:Math.max(0,box.y),width:box.width,height:box.height}});
          const result={pass:nav?.status()===200&&q0.webgl&&q1.d.presentation.simTimeMs>start&&firstMeaningful!==null&&firstMeaningful<=5&&!tearing&&safe.unsafeProtectedStarts===0&&safe.assemblyViolations===0&&(safe.safeMoveStarts||0)>0&&(safe.replacements||0)>0&&Math.min(...scales)===1&&Math.max(...scales)===1&&q1.s.overlayTextRendered===false&&q1.s.alphaDominantReveal===false&&q1.s.semanticMotionCoupled===false&&q1.s.semanticOrientationForcing===false&&q1.s.emissive===false&&q1.s.glowHalo===false&&cadence.totalLoopSec===19&&typography.r441?.x===.875&&typography.r441?.y===.9&&material.bumpScale===-.13&&material.roughnessMapInk===.55&&material.tonalInk===.82&&fatal.length===0,url,http:nav?.status()===200,html:q0.title.toLowerCase().includes('proai'),css:responses.some(r=>r.type==='stylesheet'&&good(r)),js:responses.some(r=>r.type==='script'&&good(r)),three:true,glb:responses.some(r=>/\.glb(?:\?|$)/i.test(r.url)&&good(r)),webgl:q0.webgl,cube:true,cubeMoving:q1.d.presentation.simTimeMs>start,firstMeaningful,peak,noTearing:!tearing,slices:(safe.safeMoveStarts||0)>0,motion:{min:Math.min(...scales),max:Math.max(...scales)},safe:{safeMoveStarts:safe.safeMoveStarts,replacements:safe.replacements,unsafeProtectedStarts:safe.unsafeProtectedStarts,assemblyViolations:safe.assemblyViolations,schedulerPausesGlobally:safe.schedulerPausesGlobally},cadence,material,typography,flags:{overlay:q1.s.overlayTextRendered,alpha:q1.s.alphaDominantReveal,semanticMotionCoupled:q1.s.semanticMotionCoupled,orientationForcing:q1.s.semanticOrientationForcing,emissive:q1.s.emissive,glow:q1.s.glowHalo},fatal};
          fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));console.log('R441_PUBLIC_SELF_CHECK',JSON.stringify(result));await ctx.close();await browser.close();if(!result.pass)process.exitCode=1;
          NODE
          node --check r441-public-self-check.mjs
          node r441-public-self-check.mjs
          rm -f r441-public-self-check.mjs

      - name: Publish live observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r441-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r441-final/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
