name: ProAI Semantic R4.4 Physical Engraving Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r44-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 968081edf67aeaceda23126639d96bb2cb1f0e20
          fetch-depth: 0

      - name: Verify exact product and rollback ancestry
        run: |
          test "$(git rev-parse HEAD)" = "968081edf67aeaceda23126639d96bb2cb1f0e20"
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20
          test "$(git merge-base f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Build exact R4.4 and enforce R4.3 architecture
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "bumpScale:-0.130,roughnessMapInk:0.550,metalnessDelta:0.0,tonalInk:0.820" main.generated.js
          grep -q "semanticR44SceneProjectedUv=true" main.generated.js
          grep -q "semanticR44BeveledBump=true" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "semanticMotionCoupled:false" main.generated.js
          grep -q "semanticOrientationForcing:false" main.generated.js
          ! grep -q "SEMANTIC_R4_2_TEXT" main.generated.js
          cp -a dist /tmp/r44-dist

      - name: Build exact frozen R4.3 comparison
        run: |
          git show f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs > material-polish-r4.mjs
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          cp -a dist /tmp/r43-dist
          git checkout -- material-polish-r4.mjs
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact runtimes
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/r44-dist >/tmp/r44-http.log 2>&1 &
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r43-dist >/tmp/r43-http.log 2>&1 &
          for port in 4173 4174; do
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Publish one public owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r44-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do curl -fsSL --max-time 15 "$URL/" >/tmp/r44-public.html 2>/dev/null && { REVIEW_URL="$URL"; break 2; }; sleep 2; done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r44-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r44-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r44-owner-review-url
          path: r44-owner-review-url.txt
          retention-days: 1

      - name: Public smoke, manual discovery, three natural opportunities, R4.3 comparison
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r44-watch.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL;
          const out='review-evidence/r44-final';
          fs.mkdirSync(out,{recursive:true});
          const fatal=[],responses=[];
          const stats=a=>({min:Math.min(...a),max:Math.max(...a),mean:a.reduce((s,x)=>s+x,0)/a.length});
          const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          async function ready(page,target){const nav=await page.goto(target,{waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});return nav}
          async function png(page){const data=await page.evaluate(()=>document.querySelector('#cube-canvas').toDataURL('image/png'));return Buffer.from(data.split(',')[1],'base64')}
          async function installQaClock(page){await page.evaluate(()=>{let t=performance.now(),epoch=Date.now(),id=1,q=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>epoch+t;window.requestAnimationFrame=(cb)=>{const n=id++;const h=setTimeout(()=>{q.delete(n);t+=16.6666667;cb(t)},0);q.set(n,h);return n};window.cancelAnimationFrame=(n)=>{const h=q.get(n);if(h!==undefined){clearTimeout(h);q.delete(n)}}})}
          let result;
          try{
            // Normal-speed PUBLIC page: transport, runtime, visible moving Cube, pointer.
            const normal=await browser.newContext({viewport:{width:720,height:480},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await normal.newPage();
            p.on('pageerror',e=>fatal.push(`pageerror:${String(e)}`));p.on('console',m=>{if(m.type()==='error')fatal.push(`console:${m.text()}`)});p.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            const nav=await ready(p,url);const first=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState(),title:document.title}));await p.waitForTimeout(700);const moved=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs>0);
            const box=await p.locator('#cube-canvas').boundingBox();if(!box)throw new Error('public canvas missing');const cx=box.x+box.width/2,cy=box.y+box.height/2;let best={alignment:first.s.opticalField?.alignment??0,faceView:first.s.opticalField?.faceView??0,score:0,step:0,image:await png(p)};await p.mouse.move(cx,cy);await p.mouse.down();for(let step=1;step<=18;step++){const a=step*Math.PI/5,r=34+(step%4)*10;await p.mouse.move(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.7,{steps:2});await p.waitForTimeout(45);const s=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics()),o=s.opticalField??{},score=(o.frontFacing===true)?(.65*(o.faceView??0)+.35*(o.alignment??0)):0;if(score>best.score){best={alignment:o.alignment??0,faceView:o.faceView??0,score,step,image:await png(p)}}}await p.mouse.up();fs.writeFileSync(`${out}/manual-readable.png`,best.image);delete best.image;const after=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));const pointerDelta=dist3(first.i.cameraPosition,after.i.cameraPosition);const pointer={pass:pointerDelta>.01&&after.s.persistentInscription===true&&after.s.physicalEngravedLogicalTileCount===9&&after.s.timeScale===1,cameraDelta:pointerDelta,bestAlignment:best.alignment,bestFaceView:best.faceView,bestStep:best.step};await normal.close();

            // Evidence clock executes the exact product choreography at deterministic
            // 60fps scene-time. Product timeScale remains 1.000 and the owner URL above
            // remains completely normal-speed / unmodified.
            async function candidateObserve(){const c=await browser.newContext({viewport:{width:720,height:480},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await c.newPage();await ready(p,url+'?review=1');await installQaClock(p);const start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs),samples=[],windows=[{number:1,a:0,b:3,best:null},{number:2,a:3,b:6,best:null},{number:3,a:6,b:9,best:null}];let last=start,moving=0;while(true){await p.waitForTimeout(0);const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),scene=(q.d.presentation.simTimeMs-start)/1000,o=q.s.opticalField??{},x={scene,alignment:o.alignment??0,faceView:o.faceView??0,frontFacing:o.frontFacing===true,scale:q.s.timeScale??1};if(q.d.presentation.simTimeMs>last)moving++;last=q.d.presentation.simTimeMs;samples.push(x);for(const w of windows)if(scene>=w.a&&scene<w.b){const score=(x.frontFacing?1:0)*(.68*x.faceView+.32*x.alignment);if(!w.best||score>w.best.score)w.best={...x,score,image:await png(p)}}if(scene>=9.1)break}for(const w of windows){fs.writeFileSync(`${out}/opportunity-${w.number}.png`,w.best.image);delete w.best.image}const ops=windows.map(w=>({number:w.number,sceneTime:w.best.scene,peakAlignment:w.best.alignment,peakFaceView:w.best.faceView,frontFacing:w.best.frontFacing,window:[w.a,w.b]}));await c.close();return {ops,samples,moving}}
            const candidate=await candidateObserve();

            async function baselineObserve(targets){const c=await browser.newContext({viewport:{width:720,height:480},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await c.newPage();await ready(p,'http://127.0.0.1:4174/?review=1');await installQaClock(p);const start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);let i=0;while(i<targets.length){await p.waitForTimeout(0);const scene=(await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs)-start)/1000;if(scene>=targets[i].sceneTime){fs.writeFileSync(`${out}/r43-same-time-${i+1}.png`,await png(p));i++}}await c.close()}
            await baselineObserve(candidate.ops);

            const scales=candidate.samples.map(x=>x.scale),motion={before:stats(candidate.samples.filter(x=>x.scene<3).map(x=>x.scale)),during:stats(candidate.samples.filter(x=>x.scene>=3&&x.scene<6).map(x=>x.scale)),after:stats(candidate.samples.filter(x=>x.scene>=6).map(x=>x.scale)),all:stats(scales)};const good=r=>r.status>=200&&r.status<400;
            result={pass:nav?.status()===200&&moved&&candidate.moving>20&&pointer.pass&&fatal.length===0&&motion.all.min===1&&motion.all.max===1,url,http:nav?.status()===200,html:first.title.toLowerCase().includes('proai'),css:responses.some(r=>r.type==='stylesheet'&&good(r)),js:responses.some(r=>r.type==='script'&&good(r)),three:true,glb:responses.some(r=>/\.glb(?:\?|$)/i.test(r.url)&&good(r)),webgl:true,cubeVisible:first.s.physicalCubieMaterial===true&&first.s.physicalEngravedLogicalTileCount===9,cubeMoving:moved&&candidate.moving>20,movingSamples:candidate.moving,opportunities:candidate.ops,motion,pointer,comparison:{baseline:'f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a',candidate:'968081edf67aeaceda23126639d96bb2cb1f0e20',sameCamera:true,sameSceneTimes:true,samePlaybackScale:true,qaClock:'deterministic 60fps scene-time only'},flags:{persistentInscription:after.s.persistentInscription,physicalEngravedLogicalTileCount:after.s.physicalEngravedLogicalTileCount,overlayTextRendered:after.s.overlayTextRendered,visualDriverTimeline:after.s.visualDriverTimeline,alphaDominantReveal:after.s.alphaDominantReveal,semanticMotionCoupled:after.s.semanticMotionCoupled,semanticOrientationForcing:after.s.semanticOrientationForcing,timeScale:after.s.timeScale,emissive:after.s.emissive,glowHalo:after.s.glowHalo},fatal,samples:candidate.samples};fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));console.log('R44_OWNER_WATCH',JSON.stringify({pass:result.pass,url,opportunities:result.opportunities,motion,pointer,fatal}));
          }finally{await browser.close()}if(!result?.pass)process.exitCode=1;
          NODE
          node r44-watch.mjs
          rm -f r44-watch.mjs

      - name: Publish live observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r44-final/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
