name: ProAI Semantic R4.2 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86eb7d5c199336a73d2e959fe6d735a3498c4d40
          fetch-depth: 0

      - name: Pin exact R4.2 product
        run: test "$(git rev-parse HEAD)" = "86eb7d5c199336a73d2e959fe6d735a3498c4d40"

      - name: Verify narrow product scope
        run: |
          cd "$GITHUB_WORKSPACE"
          test -z "$(git diff --name-only f4037958a3b4ae9ef544ee8a97b2bf0aea60db0e...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2 index.html ru/index.html)"
          test "$(git diff --name-only d4902a151b5f4cc98032c956e3d9e1d0fca94827...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-face-r4 | sort)" = "docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs"

      - name: Build exact R4.2 product
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb)" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "surfaceMaxOpacity: 0.020" main.generated.js
          grep -q "semanticVelocityMultiplier: 0.70" main.generated.js
          grep -q "revealMs: 600" main.generated.js
          grep -q "readableHoldMs: 1250" main.generated.js
          grep -q "exitMs: 520" main.generated.js
          grep -q "SEMANTIC_R4_2_SOFT_SPATIAL_OPTICAL_DISCOVERY" main.generated.js
          grep -q "key RectAreaLight half-vector + broad surface-space lobe" main.generated.js
          grep -q "latticeCenters + GEOMETRY_R1.faceOuterSize" main.generated.js
          grep -q "scanWipeShimmer: false" main.generated.js
          grep -q "letterWordStagger: false" main.generated.js
          grep -q "emissive: false" main.generated.js
          grep -q "glowHalo: false" main.generated.js
          ! grep -q "SEMANTIC_R2" main.generated.js
          ! grep -q "microHalo" main.generated.js
          ! grep -q "emissiveIntensity" main.generated.js

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start local review runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r4-2-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Verify optical states and touch independence
        run: |
          cat >r4-2-fast-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'];
          const browser=await chromium.launch({headless:true,args});
          fs.mkdirSync('review-evidence/optical',{recursive:true});
          try {
            const c=await browser.newContext({viewport:{width:1170,height:780},reducedMotion:'no-preference'}),p=await c.newPage();
            await p.goto('http://127.0.0.1:4173/?capture',{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            const pose=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticPoseAt(4.0)); if(!pose?.face)throw new Error('capture pose missing');
            const states=[['discovery',4.00,{surface:.70,formation:.78,luminance:.50,exit:0}],['peak',4.42,{surface:.78,formation:1,luminance:1,exit:0}],['leaving',4.84,{surface:.28,formation:1,luminance:.55,exit:0}]],out=[];
            for(const [name,t,state] of states){await p.evaluate(({t,face,state})=>{const api=window.__PROAI_CUBE_R1_2;api.setReviewPresentation(t,1,false);api.setSemanticReviewState({...state,face},true)},{t,face:pose.face,state});await p.waitForTimeout(150);const d=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics());await p.locator('#cube-canvas').screenshot({path:`review-evidence/optical/r4-2-${name}.png`});out.push({name,optical:d.opticalField,flags:{seam:d.seamAwareOcclusion,emissive:d.emissive,glow:d.glowHalo,scan:d.scanWipeShimmer,stagger:d.letterWordStagger}})}
            const centers=out.map(x=>x.optical.fieldCenter),span=Math.max(Math.hypot(centers[1][0]-centers[0][0],centers[1][1]-centers[0][1]),Math.hypot(centers[2][0]-centers[1][0],centers[2][1]-centers[1][1]));
            const opticalPass=out[1].optical.opportunity>out[0].optical.opportunity&&out[1].optical.opportunity>out[2].optical.opportunity&&span>.0005&&out.every(x=>x.flags.seam&&x.flags.emissive===false&&x.flags.glow===false&&x.flags.scan===false&&x.flags.stagger===false);
            await c.close();
            const tc=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),tp=await tc.newPage();
            await tp.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000});await tp.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});await tp.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());const replay=await tp.evaluate(()=>window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());if(!replay)throw new Error('touch replay rejected');await tp.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:30000});await tp.waitForTimeout(350);
            const box=await tp.locator('#cube-canvas').boundingBox();if(!box)throw new Error('touch canvas missing');const x=box.x+box.width*.52,y=box.y+box.height*.48,b=await tp.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs})),cdp=await tc.newCDPSession(tp);await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,radiusX:8,radiusY:8,force:.7,id:1}]});for(let n=1;n<=6;n++)await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x+n*9,y:y+n*3,radiusX:8,radiusY:8,force:.7,id:1}]});await tp.waitForTimeout(150);await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await tp.waitForTimeout(450);const a=await tp.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,i:window.__PROAI_CUBE_R1_2.getInteractionState()}));const touchPass=a.s.entryPresentationMs===b.s.entryPresentationMs&&(a.s.active||a.s.complete)&&a.sim>b.sim&&a.i.resumeDelayRemainingMs===0&&a.i.sliceResumeDelayRemainingMs===0;await tc.close();
            const pass=opticalPass&&touchPass;fs.writeFileSync('review-evidence/r4-2-fast-qa.json',JSON.stringify({pass,opticalPass,touchPass,span,out},null,2));console.log('R4_2_FAST_QA',JSON.stringify({pass,opticalPass,touchPass,span}));if(!pass)process.exitCode=1;
          } finally { await browser.close(); }
          NODE
          node r4-2-fast-qa.mjs
          rm -f r4-2-fast-qa.mjs

      - name: Publish TryCloudflare owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r4-2-tunnel-${attempt}.log"; /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''; for i in $(seq 1 60); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then for i in $(seq 1 18); do if curl -fsSL --max-time 12 "$URL/" >/tmp/r4-2-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi; sleep 2; done; fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"; grep -q "ProAI Cube" /tmp/r4-2-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r4-2-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Public natural lifecycle and Builder observation
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat >r4-2-public.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL,args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'],fatal=[];
          const browser=await chromium.launch({headless:true,args}),c=await browser.newContext({viewport:{width:1170,height:780},reducedMotion:'no-preference'}),p=await c.newPage();
          p.on('pageerror',e=>fatal.push(String(e)));p.on('console',m=>{if(m.type()==='error'&&/GLB load failed|TypeError|ReferenceError|WebGL context lost|Shader Error/i.test(m.text()))fatal.push(m.text())});
          const read=()=>p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),sim:window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs,i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
          try {
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});const canvas=p.locator('#cube-canvas'),box=await canvas.boundingBox();if(!box||box.width<100||box.height<100)throw new Error('public Cube canvas missing');
            const sim0=(await read()).sim;await p.waitForTimeout(700);const sim1=(await read()).sim;if(!(sim1>sim0))throw new Error('public Cube motion not advancing');await p.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            await p.waitForFunction(()=>{const s=window.__PROAI_CUBE_R1_2.getSemanticDiagnostics();return s.active===true||s.complete===true},null,{timeout:240000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().complete===true,null,{timeout:240000});
            const naturalDone=await read();
            const replay=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());if(!replay)throw new Error('public replay rejected');await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:60000});await p.waitForTimeout(350);const b=await read(),x=box.x+box.width*.52,y=box.y+box.height*.48;await p.mouse.move(x,y);await p.mouse.down();await p.mouse.move(x+72,y+24,{steps:6});await p.waitForTimeout(140);await p.mouse.up();await p.waitForTimeout(450);const a=await read();const mousePass=a.s.entryPresentationMs===b.s.entryPresentationMs&&(a.s.active||a.s.complete)&&a.sim>b.sim&&a.i.resumeDelayRemainingMs===0&&a.i.sliceResumeDelayRemainingMs===0;
            fs.mkdirSync('review-evidence/public',{recursive:true});
            const cap=await c.newPage();await cap.goto(url+'?capture',{waitUntil:'domcontentloaded',timeout:120000});await cap.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});const pose=await cap.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticPoseAt(4.0));const phases=[['discovery',4.00,{surface:.70,formation:.78,luminance:.50,exit:0}],['peak',4.42,{surface:.78,formation:1,luminance:1,exit:0}],['leaving',4.84,{surface:.28,formation:1,luminance:.55,exit:0}]],phaseDiag=[];
            for(const [name,t,state] of phases){await cap.evaluate(({t,face,state})=>{const api=window.__PROAI_CUBE_R1_2;api.setReviewPresentation(t,1,false);api.setSemanticReviewState({...state,face},true)},{t,face:pose.face,state});await cap.waitForTimeout(150);phaseDiag.push({name,d:await cap.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics())});await cap.locator('#cube-canvas').screenshot({path:`review-evidence/public/r4-2-public-${name}.png`})}
            const flags=naturalDone.s,pass=naturalDone.s.complete===true&&naturalDone.sim>sim1&&mousePass&&flags.seamAwareOcclusion===true&&flags.emissive===false&&flags.glowHalo===false&&flags.scanWipeShimmer===false&&flags.letterWordStagger===false&&fatal.length===0;
            fs.writeFileSync('review-evidence/public/r4-2-public.json',JSON.stringify({pass,url,sim0,sim1,naturalDone,mousePass,phaseDiag,fatal},null,2));console.log('R4_2_PUBLIC',JSON.stringify({pass,url,naturalComplete:naturalDone.s.complete,mousePass,fatal}));if(!pass)process.exitCode=1;
          } finally { await browser.close(); }
          NODE
          node r4-2-public.mjs
          rm -f r4-2-public.mjs

      - name: Publish Builder observation
        uses: actions/upload-artifact@v4
        with:
          name: r4-2-builder-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/
          retention-days: 7

      - name: Publish owner URL
        uses: actions/upload-artifact@v4
        with:
          name: r4-2-owner-review-url
          path: r4-2-owner-review-url.txt
          retention-days: 1

      - name: Hold owner preview for approximately 3 hours
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          curl -fsSL --max-time 15 "$REVIEW_URL/" >/dev/null
          sleep 10800
