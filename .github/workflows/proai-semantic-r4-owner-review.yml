name: ProAI Semantic R4.4.2 Final Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r442-final-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f3d8d4f410070c1d7d1beee44e1e2cd45f1702b
          fetch-depth: 0

      - name: Verify exact product, ancestry, and production freeze
        run: |
          test "$(git rev-parse HEAD)" = "5f3d8d4f410070c1d7d1beee44e1e2cd45f1702b"
          test "$(git hash-object material-polish-r4.mjs)" = "a5977cccb87056c000f0a60020529bff383f13e4"
          test "$(git hash-object material-polish-r442-runtime.mjs)" = "377b2d3a6aef08ba4bc47981fb31893709c0a1f1"
          test "$(git hash-object package.json)" = "1438b8c3f361d72d5084ecc99db8f3af5f83f9ac"
          git cat-file -e 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc^{commit}
          git cat-file -e 428e4c7d4c5fcc7a9fb6d4f75e484b80f623f76c^{commit}
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc 5f3d8d4f410070c1d7d1beee44e1e2cd45f1702b
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"

      - name: Build exact R4.4.2 and enforce hard locks
        run: |
          npm install --package-lock=false
          npm run build-r442
          node --check main.generated.js
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -Fq "R4_4_2_PHYSICAL_MICRO_ENGRAVED_" main.generated.js
          grep -Fq "['+Z','+X','-X']" main.generated.js
          grep -Fq "topFaceEligible:false" main.generated.js
          grep -Fq "maxProtectedMs:2400" main.generated.js
          grep -Fq "nextEligiblePresentationMs:R44_INITIAL_PRESENTATION_PHASE_MS+3400" main.generated.js
          grep -Fq "rearmScore:.50" main.generated.js
          grep -Fq "faceRearmBlocked" main.generated.js
          grep -Fq "semanticR442ProjectedAreaQuality" main.generated.js
          grep -Fq "semanticR442RecentFacePenalty" main.generated.js
          grep -Fq "w*=2.10" main.generated.js
          grep -Fq "w*=1.85" main.generated.js
          grep -Fq "postReleaseParticipationCount" main.generated.js
          grep -Fq "targetFullLoopSec:[20,35]" main.generated.js
          grep -Fq "hardMaxNormalSec:40" main.generated.js
          grep -Fq "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -Fq "const deltaMs=wallDeltaMs" main.generated.js
          grep -Fq "overlayTextRendered:false" main.generated.js
          grep -Fq "alphaDominantReveal:false" main.generated.js
          grep -Fq "semanticMotionCoupled:false" main.generated.js
          grep -Fq "semanticOrientationForcing:false" main.generated.js
          ! grep -Fq "maxProtectedMs:3200" main.generated.js
          ! grep -Fq "maxProtectedMs:2480" main.generated.js
          ! grep -Fq "unsafeReturnGuardMs:3000" main.generated.js
          ! grep -Fq "semanticR441UnsafePhraseWindowOpen" main.generated.js
          ! grep -Fq "totalLoopSec:19.0" main.generated.js
          ! grep -Fq "wallDeltaMs * semanticTimeScale" main.generated.js
          ! grep -Fq "SEMANTIC_R4_2_TEXT" main.generated.js
          ! grep -Fq "emissiveIntensity" main.generated.js

      - name: Verify exact R4.4.1 rollback remains executable
        run: |
          cp material-polish-r4.mjs /tmp/r442-material.mjs
          git show 65adaa0bb3fb356bdc031646fd9eef6ddfb737fc:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs > material-polish-r4.mjs
          npm run prepare-r4 >/dev/null
          node clock-r4.mjs >/dev/null
          node material-polish-r4.mjs >/dev/null
          node --check main.generated.js
          npx vite build >/dev/null
          mv /tmp/r442-material.mjs material-polish-r4.mjs
          npm run build-r442 >/dev/null
          test "$(git hash-object material-polish-r4.mjs)" = "a5977cccb87056c000f0a60020529bff383f13e4"
          test "$(git hash-object material-polish-r442-runtime.mjs)" = "377b2d3a6aef08ba4bc47981fb31893709c0a1f1"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact R4.4.2 runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r442-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Publish public owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r442-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do curl -fsSL --max-time 15 "$URL/" >/tmp/r442-public.html 2>/dev/null && { REVIEW_URL="$URL"; break 2; }; sleep 2; done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r442-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r442-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r442-owner-review-url
          path: r442-owner-review-url.txt
          retention-days: 1

      - name: Public final R4.4.2 behavioral gate
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r442-final-watch.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL,out='review-evidence/r442-final';fs.mkdirSync(out,{recursive:true});
          const fatal=[],responses=[];
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          const ready=async(p,u)=>{const nav=await p.goto(u,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});return nav};
          const read=async p=>p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),title:document.title}));
          const shot=async(p,file)=>{const b=await p.locator('#cube-canvas').boundingBox();if(b)await p.screenshot({path:file,clip:{x:Math.max(0,b.x),y:Math.max(0,b.y),width:b.width,height:b.height},timeout:120000})};
          try{
            const native=await browser.newContext({viewport:{width:720,height:480},deviceScaleFactor:1,reducedMotion:'no-preference',recordVideo:{dir:out,size:{width:720,height:480}}}),np=await native.newPage();
            np.on('pageerror',e=>fatal.push(`native-pageerror:${String(e)}`));np.on('console',m=>{if(m.type()==='error')fatal.push(`native-console:${m.text()}`)});np.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            const nav=await ready(np,url),video=np.video(),n0=await read(np),ns=n0.d.presentation.simTimeMs;await np.waitForTimeout(1800);const n1=await read(np);await shot(np,`${out}/native-public.png`);await native.close();if(video){const vp=await video.path();fs.copyFileSync(vp,`${out}/r442-native-public.webm`)}const nativePass=nav?.status()===200&&n1.d.presentation.simTimeMs>ns&&n0.s.r442Material?.topFaceEligible===false;

            const qc=await browser.newContext({viewport:{width:240,height:180},deviceScaleFactor:1,reducedMotion:'no-preference'}),qp=await qc.newPage();qp.on('pageerror',e=>fatal.push(`qa-pageerror:${String(e)}`));qp.on('console',m=>{if(m.type()==='error')fatal.push(`qa-console:${m.text()}`)});await ready(qp,url+'?review=1');
            await qp.evaluate(()=>{const c=document.getElementById('cube-canvas');if(c){c.style.width='64px';c.style.height='64px'}window.dispatchEvent(new Event('resize'))});await qp.waitForTimeout(500);
            await qp.evaluate(()=>{const rs=window.setTimeout.bind(window),rc=window.clearTimeout.bind(window);let t=performance.now(),epoch=Date.now()-t,seq=990000;const timers=new Map(),rafs=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>epoch+t;const flush=()=>{let again=true,g=0;while(again&&g++<100){again=false;for(const [id,x] of [...timers])if(x.due<=t){timers.delete(id);x.cb(...x.args);again=true}}};window.setTimeout=(cb,ms=0,...args)=>{const id=seq++;timers.set(id,{due:t+Math.max(0,+ms||0),cb,args});return id};window.clearTimeout=id=>timers.delete(id);window.requestAnimationFrame=cb=>{const id=seq++,h=rs(()=>{rafs.delete(id);t+=80;flush();cb(t)},0);rafs.set(id,h);return id};window.cancelAnimationFrame=id=>{const h=rafs.get(id);if(h!==undefined){rc(h);rafs.delete(id)}}});
            const start=await qp.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs),samples=[];let g=0;
            while(true){await qp.waitForTimeout(1);const q=await read(qp),scene=(q.d.presentation.simTimeMs-start)/1000,d=q.s.r442DynamicFace||{},o=q.s.opticalField||{};samples.push({scene,protected:d.protected===true,face:d.protectedFace||null,opportunity:o.opportunity??0,faceView:o.faceView??0,frontFacing:o.frontFacing===true,unsafe:d.unsafeProtectedStarts||0,violations:d.assemblyViolations||0,scale:q.s.timeScale??1});if(scene>=42)break;if(++g>1200)throw new Error(`R4.4.2 observation stalled at ${scene}`)}
            const qf=await read(qp);await qc.close();const d=qf.s.r442DynamicFace||{},m=qf.s.r442MoveDiversity||{},forward=(m.moveLog||[]).filter(x=>x.phase==='forward'),rel=x=>(x.presentationMs-start)/1000,axes15=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=15).map(x=>x.axis))],axes35=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.axis))],layers35=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.layer))],selectedFaces=[...new Set((d.faceSelections||[]).map(x=>x.face))];
            let first=null,firstEnd=null,last=false,runStart=null,readStart=null,readEnd=null;for(const x of samples){if(x.protected&&!last&&first===null)first=x.scene;if(!x.protected&&last&&firstEnd===null)firstEnd=x.scene;const readable=x.protected&&x.frontFacing&&x.opportunity>=.76&&x.faceView>=.58;if(readable&&runStart===null)runStart=x.scene;if(!readable&&runStart!==null){if(readStart===null||x.scene-runStart>readEnd-readStart){readStart=runStart;readEnd=x.scene}runStart=null}last=x.protected}if(runStart!==null){const end=samples.at(-1).scene;if(readStart===null||end-runStart>readEnd-readStart){readStart=runStart;readEnd=end}}const readableDuration=readStart===null?null:readEnd-readStart,maxProtected=(d.protectedIntervals||[]).length?Math.max(...d.protectedIntervals.map(x=>x.durationSec)):null,noTearing=d.unsafeProtectedStarts===0&&d.assemblyViolations===0,motion=samples.every(x=>x.scale===1),behaviorPass=first!==null&&first>=2.5&&first<=6.5&&readableDuration!==null&&readableDuration>=1.0&&readableDuration<=2.5&&maxProtected!==null&&maxProtected<=2.5&&axes15.length>=2&&axes35.length===3&&layers35.length===3&&selectedFaces.length>=2&&(d.postReleaseParticipationCount||0)>0&&noTearing&&motion;

            const ic=await browser.newContext({viewport:{width:900,height:600},deviceScaleFactor:1,reducedMotion:'no-preference'}),ip=await ic.newPage();await ready(ip,url);const box=await ip.locator('#cube-canvas').boundingBox(),before=await ip.evaluate(()=>window.__PROAI_CUBE_R1_2.getInteractionState().cameraPosition);if(box){const cx=box.x+box.width/2,cy=box.y+box.height/2;await ip.mouse.move(cx,cy);await ip.mouse.down();await ip.mouse.move(cx+70,cy-38,{steps:8});await ip.mouse.up();await ip.waitForTimeout(650)}const after=await ip.evaluate(()=>window.__PROAI_CUBE_R1_2.getInteractionState().cameraPosition),pointerDelta=Math.hypot(after[0]-before[0],after[1]-before[1],after[2]-before[2]);await shot(ip,`${out}/interaction-after.png`);await ic.close();
            const mc=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,reducedMotion:'no-preference'}),mp=await mc.newPage();await ready(mp,url);const mobile=await read(mp);await shot(mp,`${out}/mobile.png`);await mc.close();const mobilePass=mobile.s.r442Material?.topFaceEligible===false&&mobile.s.timeScale===1;
            const flagsPass=qf.s.overlayTextRendered===false&&qf.s.alphaDominantReveal===false&&qf.s.semanticMotionCoupled===false&&qf.s.semanticOrientationForcing===false&&qf.s.emissive===false&&qf.s.glowHalo===false;
            const result={pass:nativePass&&behaviorPass&&flagsPass&&pointerDelta>.01&&mobilePass&&fatal.length===0,url,nativePass,firstProtection:first,firstRelease:firstEnd,readableDuration,maxProtected,noTearing,motion,axes15,axes35,layers35,axisCounts:m.axisCounts,layerCounts:m.layerCounts,selectedFaces,faceSelections:d.faceSelections,protectedIntervals:d.protectedIntervals,postReleaseParticipationCount:d.postReleaseParticipationCount,lastPostReleaseParticipation:d.lastPostReleaseParticipation,unsafeProtectedStarts:d.unsafeProtectedStarts,assemblyViolations:d.assemblyViolations,protectionCount:d.protectionCount,releaseCount:d.releaseCount,pointer:{pass:pointerDelta>.01,cameraDelta:pointerDelta},mobilePass,flagsPass,fatal};
            fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));fs.writeFileSync(`${out}/timeline-samples.json`,JSON.stringify(samples,null,2));console.log('R442_FINAL_PUBLIC_WATCH',JSON.stringify(result));if(!result.pass)process.exitCode=1;
          }finally{await browser.close()}
          NODE
          node --check r442-final-watch.mjs
          node r442-final-watch.mjs
          rm -f r442-final-watch.mjs

      - name: Publish final owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r442-final-owner-evidence
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r442-final/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
