name: ProAI Semantic R4.4 Physical Engraving Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r44-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55
          fetch-depth: 0

      - name: Verify frozen ancestry and exact R4.4 product
        run: |
          test "$(git rev-parse HEAD)" = "72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55"
          test "$(git hash-object material-polish-r4.mjs)" = "e8b1248a155de67306ffb09718f49702ba4d7d39"
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55
          test "$(git merge-base f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Build exact R4.4 and enforce R4.3 architecture
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "bumpScale:-0.105,roughnessMapInk:0.690" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "physicalEngravedLogicalTileCount" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "semanticMotionCoupled:false" main.generated.js
          grep -q "semanticOrientationForcing:false" main.generated.js
          ! grep -q "SEMANTIC_R4_2_TEXT" main.generated.js

      - name: Install live browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact R4.4 runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r44-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Publish single TryCloudflare preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r44-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do
                if curl -fsSL --max-time 15 "$URL/" >/tmp/r44-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
                sleep 2
              done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r44-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r44-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r44-owner-review-url
          path: r44-owner-review-url.txt
          retention-days: 1

      - name: Observe unchanged natural motion and manual discovery
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r44-live-watch.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL;
          const out='review-evidence/r44-live-owner';
          fs.mkdirSync(`${out}/video`,{recursive:true});
          const targets=[2.24,18.16,31.68];
          const fatal=[],responses=[],samples=[],opportunities=[];
          const stats=a=>({min:Math.min(...a),max:Math.max(...a),mean:a.reduce((x,y)=>x+y,0)/a.length});
          const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          let ctx,p,first,nav,pointer={pass:false,cameraDelta:0,bestAlignment:0},motion=null,result=null;
          try {
            ctx=await browser.newContext({viewport:{width:1170,height:780},reducedMotion:'no-preference',recordVideo:{dir:`${out}/video`,size:{width:1170,height:780}}});
            p=await ctx.newPage();
            p.on('pageerror',e=>fatal.push(`pageerror:${String(e)}`));
            p.on('console',m=>{if(m.type()==='error')fatal.push(`console:${m.text()}`)});
            p.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            nav=await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            first=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState(),title:document.title,canvas:!!document.querySelector('#cube-canvas')}));
            const wall0=performance.now(),sim0=first.d.presentation.simTimeMs;
            let lastSim=sim0,movingSamples=0,next=0;
            while((performance.now()-wall0)<1200000 && next<targets.length){
              await p.waitForTimeout(160);
              const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
              const elapsed=(performance.now()-wall0)/1000,scene=(q.d.presentation.simTimeMs-sim0)/1000;
              if(q.d.presentation.simTimeMs>lastSim)movingSamples++;
              lastSim=q.d.presentation.simTimeMs;
              const sample={elapsed,scene,alignment:q.s.opticalField?.alignment??0,faceView:q.s.opticalField?.faceView??0,scale:q.s.timeScale??1,semanticActive:!!q.s.active};
              samples.push(sample);
              if(next<targets.length && scene>=targets[next]){
                const shot=`opportunity-${next+1}.png`;
                await p.locator('#cube-canvas').screenshot({path:`${out}/${shot}`,timeout:120000});
                opportunities.push({number:next+1,targetScene:targets[next],sceneTime:scene,wallElapsed:elapsed,peakAlignment:sample.alignment,faceView:sample.faceView,screenshot:shot});
                next++;
              }
            }
            if(opportunities.length!==3) throw new Error(`captured ${opportunities.length}/3 unchanged-motion natural opportunities`);

            // Continue briefly after the third opportunity so AFTER motion has a measured interval.
            const afterTarget=(opportunities[2].sceneTime+1.5);
            while((performance.now()-wall0)<1250000){
              await p.waitForTimeout(160);
              const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
              const elapsed=(performance.now()-wall0)/1000,scene=(q.d.presentation.simTimeMs-sim0)/1000;
              samples.push({elapsed,scene,alignment:q.s.opticalField?.alignment??0,faceView:q.s.opticalField?.faceView??0,scale:q.s.timeScale??1,semanticActive:!!q.s.active});
              if(scene>=afterTarget) break;
            }

            // Approximate the naturally favorable optical interval around each captured opportunity.
            for(const o of opportunities){
              const idx=samples.reduce((best,s,i)=>Math.abs(s.scene-o.sceneTime)<Math.abs(samples[best].scene-o.sceneTime)?i:best,0);
              let lo=idx,hi=idx;
              while(lo>0 && samples[lo-1].alignment>=0.72) lo--;
              while(hi+1<samples.length && samples[hi+1].alignment>=0.72) hi++;
              o.approxOpticalDuration=Math.max(0,samples[hi].scene-samples[lo].scene);
            }

            const beforeState=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const box=await p.locator('#cube-canvas').boundingBox(); if(!box) throw new Error('desktop canvas missing');
            const cx=box.x+box.width*.5,cy=box.y+box.height*.5;
            let bestAlignment=beforeState.s.opticalField?.alignment??0,bestStep=0,manualCaptured=false;
            for(let step=1;step<=36;step++){
              const dx=(step%4<2?1:-1)*(34+((step*9)%42));
              const dy=((step%5)-2)*12;
              await p.mouse.move(cx,cy);await p.mouse.down();await p.mouse.move(cx+dx,cy+dy,{steps:4});await p.mouse.up();
              await p.waitForTimeout(90);
              const now=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
              const a=now.s.opticalField?.alignment??0;
              if(a>bestAlignment){bestAlignment=a;bestStep=step;}
              if(a>=0.86){await p.locator('#cube-canvas').screenshot({path:`${out}/manual-readable.png`,timeout:120000});manualCaptured=true;bestAlignment=a;bestStep=step;break;}
            }
            if(!manualCaptured) await p.locator('#cube-canvas').screenshot({path:`${out}/manual-readable.png`,timeout:120000});
            const afterState=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const pointerDelta=dist3(beforeState.i.cameraPosition,afterState.i.cameraPosition);
            pointer={pass:pointerDelta>.01&&afterState.d.presentation.simTimeMs>beforeState.d.presentation.simTimeMs&&afterState.s.persistentInscription===true&&afterState.s.physicalEngravedLogicalTileCount===9&&afterState.s.timeScale===1,cameraDelta:pointerDelta,bestAlignment,bestStep,manualCaptured};

            const t1=opportunities[0].sceneTime,t3=opportunities[2].sceneTime;
            const before=samples.filter(x=>x.scene<t1-.4).map(x=>x.scale);
            const during=samples.filter(x=>targets.some(t=>Math.abs(x.scene-t)<=.7)).map(x=>x.scale);
            const after=samples.filter(x=>x.scene>t3+.4).map(x=>x.scale);
            motion={before:stats(before.length?before:[1]),during:stats(during.length?during:[1]),after:stats(after.length?after:[1]),all:stats(samples.map(x=>x.scale))};
            const good=r=>r.status>=200&&r.status<400;
            result={pass:nav?.status()===200&&first.canvas&&movingSamples>20&&opportunities.length===3&&pointer.pass&&fatal.length===0&&motion.all.min===1&&motion.all.max===1,url,http:nav?.status()===200,html:first.title.toLowerCase().includes('proai'),css:responses.some(r=>r.type==='stylesheet'&&good(r)),js:responses.some(r=>r.type==='script'&&good(r)),three:!!first.s&&!!first.d,glb:responses.some(r=>/\.glb(?:\?|$)/i.test(r.url)&&good(r)),webgl:first.canvas,cubeVisible:first.s.physicalCubieMaterial===true&&first.s.physicalEngravedLogicalTileCount===9,cubeMoving:movingSamples>20,movingSamples,opportunities,motion,pointer,flags:{persistentInscription:afterState.s.persistentInscription,physicalEngravedLogicalTileCount:afterState.s.physicalEngravedLogicalTileCount,overlayTextRendered:afterState.s.overlayTextRendered,visualDriverTimeline:afterState.s.visualDriverTimeline,alphaDominantReveal:afterState.s.alphaDominantReveal,semanticMotionCoupled:afterState.s.semanticMotionCoupled,semanticOrientationForcing:afterState.s.semanticOrientationForcing,timeScale:afterState.s.timeScale,emissive:afterState.s.emissive,glowHalo:afterState.s.glowHalo},fatal,samples};
            fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));
            console.log('R44_PUBLIC_WATCH',JSON.stringify({pass:result.pass,url,opportunities,motion,pointer,fatal}));
          } catch(error) {
            fatal.push(`observer:${error.message}`);
            fs.writeFileSync(`${out}/observer-failure.json`,JSON.stringify({url,opportunities,motion,pointer,fatal,sampleCount:samples.length,lastSample:samples.at(-1)??null},null,2));
            throw error;
          } finally {
            if(p && !p.isClosed()) await p.close().catch(()=>{});
            if(ctx) await ctx.close().catch(()=>{});
            await browser.close();
          }
          if(!result?.pass) process.exitCode=1;
          NODE
          node r44-live-watch.mjs
          rm -f r44-live-watch.mjs

      - name: Publish live observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r44-live-owner/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
