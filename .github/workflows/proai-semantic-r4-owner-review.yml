name: ProAI Semantic R4.3 Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 611e01fccf8f33c3940e9eeaf4cb72d168e3d359
          fetch-depth: 0

      - name: Pin exact R4.3 product
        run: test "$(git rev-parse HEAD)" = "611e01fccf8f33c3940e9eeaf4cb72d168e3d359"

      - name: Verify R4.3 product containment
        run: |
          cd "$GITHUB_WORKSPACE"
          test "$(git diff --name-only 86eb7d5c199336a73d2e959fe6d735a3498c4d40...HEAD -- docs/site-evolution/spline/proai-cube-semantic-brand-face-r4 | sort)" = "docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs"
          test -z "$(git diff --name-only 86eb7d5c199336a73d2e959fe6d735a3498c4d40...HEAD -- index.html ru/index.html docs/site-evolution/spline/proai-cube-semantic-brand-moment-r2)"

      - name: Build exact R4.3 product
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb)" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "surfaceMaxOpacity: 0.000" main.generated.js
          grep -q "decelerationMs: 0" main.generated.js
          grep -q "accelerationMs: 0" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "SEMANTIC_R4_3_PERSISTENT_PHYSICAL_MICRO_ENGRAVING" main.generated.js
          grep -q "installPhysicalSemanticEngraving" main.generated.js
          grep -q "physicalCubieMaterial:true" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "visualDriverTimeline:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "seamAwareOcclusion:true" main.generated.js
          grep -q "emissive:false" main.generated.js
          grep -q "glowHalo:false" main.generated.js
          grep -q "scanWipeShimmer:false" main.generated.js
          grep -q "letterWordStagger:false" main.generated.js
          ! grep -q "microHalo" main.generated.js
          ! grep -q "emissiveIntensity" main.generated.js

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start local review runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r43-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Verify local physical material, motion trace, pointer and touch
        run: |
          cat > r43-local.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'];
          const browser=await chromium.launch({headless:true,args});
          const fatal=[]; fs.mkdirSync('review-evidence/local',{recursive:true});
          const read=p=>p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
          const rect=p=>p.evaluate(()=>{const e=document.querySelector('#cube-canvas');if(!e)return null;const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}});
          const stats=a=>a.length?{min:Math.min(...a),max:Math.max(...a),mean:a.reduce((x,y)=>x+y,0)/a.length,n:a.length}:{min:null,max:null,mean:null,n:0};
          try {
            const captureContext=await browser.newContext({viewport:{width:1170,height:780},reducedMotion:'no-preference'});
            const cap=await captureContext.newPage();
            cap.on('pageerror',e=>fatal.push(String(e)));cap.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
            await cap.goto('http://127.0.0.1:4173/?capture',{waitUntil:'domcontentloaded',timeout:120000});
            await cap.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            const samples=[['idle',6.50],['opportunity-1',4.35],['opportunity-2',21.50],['opportunity-3',43.50]],visual=[];
            for(const [name,t] of samples){
              await cap.evaluate(t=>{const a=window.__PROAI_CUBE_R1_2;a.setReviewPresentation(t,1,false);a.clearSemanticReviewState();a.renderReviewFrame()},t);
              await cap.waitForTimeout(120);
              const q=await read(cap);
              await cap.locator('#cube-canvas').screenshot({path:`review-evidence/local/r43-${name}.png`,timeout:120000});
              visual.push({name,t,alignment:q.s.opticalField?.alignment??0,tiles:q.s.physicalEngravedTileMeshCount,flags:q.s});
            }
            const fixed=visual.every(x=>x.flags.persistentInscription===true&&x.flags.physicalCubieMaterial===true&&x.flags.overlayTextRendered===false&&x.flags.visualDriverTimeline===false&&x.flags.alphaDominantReveal===false&&x.flags.microNormalEngraving===true&&x.flags.physicalEngravedTileMeshCount>0&&x.flags.seamAwareOcclusion===true&&x.flags.emissive===false&&x.flags.glowHalo===false&&x.flags.scanWipeShimmer===false&&x.flags.letterWordStagger===false&&x.flags.semanticMotionCoupled===false&&x.flags.semanticOrientationForcing===false&&x.flags.effectiveGlobalMotionScale===1);
            await captureContext.close();

            const c=await browser.newContext({viewport:{width:980,height:760},reducedMotion:'no-preference'}),p=await c.newPage();
            p.on('pageerror',e=>fatal.push(String(e)));p.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
            await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            await p.evaluate(()=>window.__PROAI_CUBE_R1_2.stopSliceScheduler());
            const box=await rect(p); if(!box||box.width<100)throw new Error('desktop canvas missing');
            const cx=box.x+box.width*.52,cy=box.y+box.height*.48,pointer=[]; pointer.push((await read(p)).s.opticalField);
            for(const [dx,dy] of [[95,18],[-130,45],[78,-62]]){await p.mouse.move(cx,cy);await p.mouse.down();await p.mouse.move(cx+dx,cy+dy,{steps:8});await p.mouse.up();await p.waitForTimeout(180);pointer.push((await read(p)).s.opticalField)}
            const align=pointer.map(x=>x?.alignment??0),centers=pointer.map(x=>x?.fieldCenter||[.5,.5]),alignmentSpan=Math.max(...align)-Math.min(...align),centerSpan=Math.max(...centers.map((v,i)=>i?Math.hypot(v[0]-centers[0][0],v[1]-centers[0][1]):0)),pointerDiscovery=alignmentSpan>.015||centerSpan>.004;
            const preAnchor=(await read(p)).d.presentation.simTimeMs;
            await p.waitForFunction(a=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs>=a+1150,preAnchor,{timeout:240000});
            const replay=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.replaySemanticBrandMoment());if(!replay)throw new Error('replay rejected');
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().active===true,null,{timeout:60000});const entry=await read(p);
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().complete===true,null,{timeout:240000});const complete=await read(p),completeSim=complete.d.presentation.simTimeMs;
            await p.waitForFunction(a=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs>=a+1150,completeSim,{timeout:240000});const after=await read(p),entrySim=entry.d.presentation.simTimeMs,afterSim=after.d.presentation.simTimeMs,trace=after.s.motionTrace||[];
            const pre=trace.filter(x=>x.presentationMs>=entrySim-1150&&x.presentationMs<entrySim),during=trace.filter(x=>x.semanticActive),post=trace.filter(x=>x.presentationMs>completeSim&&x.presentationMs<=completeSim+1150),before=stats(pre.map(x=>x.scale)),mid=stats(during.map(x=>x.scale)),afterStats=stats(post.map(x=>x.scale)),coverage={before:entrySim-preAnchor,after:afterSim-completeSim};
            const motionPass=[before,mid,afterStats].every(x=>x.n>0&&x.min===1&&x.max===1&&x.mean===1)&&coverage.before>=1000&&coverage.after>=1000&&[...pre,...during,...post].every(x=>Math.abs(x.yawVelocityDegPerSec)>.001)&&entry.s.timeScale===1&&after.s.timeScale===1&&entry.s.blocksSlices===false&&after.s.blocksSlices===false;
            await c.close();

            const tc=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),tp=await tc.newPage();
            await tp.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:120000});await tp.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});const tb=await read(tp),tbox=await rect(tp);if(!tbox)throw new Error('touch canvas missing');const tx=tbox.x+tbox.width*.52,ty=tbox.y+tbox.height*.48,cdp=await tc.newCDPSession(tp);await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:tx,y:ty,radiusX:8,radiusY:8,force:.7,id:1}]});for(let n=1;n<=7;n++)await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:tx+n*10,y:ty+n*3,radiusX:8,radiusY:8,force:.7,id:1}]});await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await tp.waitForTimeout(350);const ta=await read(tp),touchSafe=ta.d.presentation.simTimeMs>tb.d.presentation.simTimeMs&&ta.s.persistentInscription===true&&ta.s.timeScale===1;await tc.close();

            const pass=fixed&&pointerDiscovery&&motionPass&&touchSafe&&fatal.length===0;
            const result={pass,fixed,visual:visual.map(x=>({name:x.name,t:x.t,alignment:x.alignment,tiles:x.tiles})),pointerDiscovery,alignmentSpan,centerSpan,motionScale:{before,during:mid,after:afterStats},coverageMs:coverage,motionPass,touchSafe,fatal};
            fs.writeFileSync('review-evidence/local/r43-local.json',JSON.stringify(result,null,2));console.log('R43_LOCAL',JSON.stringify(result));if(!pass)process.exitCode=1;
          } finally {await browser.close()}
          NODE
          node r43-local.mjs
          rm -f r43-local.mjs

      - name: Publish TryCloudflare owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r43-tunnel-${attempt}.log"; /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''; for i in $(seq 1 60); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then for i in $(seq 1 20); do if curl -fsSL --max-time 12 "$URL/" >/tmp/r43-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi; sleep 2; done; fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"; grep -q "ProAI Cube" /tmp/r43-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r43-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public URL and three natural optical opportunities
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r43-public.mjs <<'NODE'
          import { chromium } from 'playwright';import fs from 'node:fs';
          const url=process.env.REVIEW_URL,args=['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=swiftshader','--disable-dev-shm-usage'],fatal=[];const browser=await chromium.launch({headless:true,args});fs.mkdirSync('review-evidence/public',{recursive:true});
          const read=p=>p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));const rect=p=>p.evaluate(()=>{const e=document.querySelector('#cube-canvas');if(!e)return null;const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}});
          try {
            const c=await browser.newContext({viewport:{width:1170,height:780},reducedMotion:'no-preference'}),p=await c.newPage();p.on('pageerror',e=>fatal.push(String(e)));p.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});
            const box=await rect(p);if(!box||box.width<100)throw new Error('public canvas missing');const b=await read(p);await p.waitForTimeout(900);const m=await read(p);if(!(m.d.presentation.simTimeMs>b.d.presentation.simTimeMs))throw new Error('public motion stopped');
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().naturalOpportunityCount>=3,null,{timeout:720000});const natural=await read(p);
            const cx=box.x+box.width*.52,cy=box.y+box.height*.48,pre=natural.s.opticalField;await p.mouse.move(cx,cy);await p.mouse.down();await p.mouse.move(cx+110,cy+32,{steps:8});await p.mouse.up();await p.waitForTimeout(250);const afterDrag=await read(p),post=afterDrag.s.opticalField,manualChange=Math.abs((post?.alignment??0)-(pre?.alignment??0))>.012||Math.hypot((post?.fieldCenter?.[0]??.5)-(pre?.fieldCenter?.[0]??.5),(post?.fieldCenter?.[1]??.5)-(pre?.fieldCenter?.[1]??.5))>.003;
            const cap=await c.newPage();await cap.goto(url+'?capture',{waitUntil:'domcontentloaded',timeout:120000});await cap.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:120000});const samples=[['idle',6.50],['opportunity-1',4.35],['opportunity-2',21.50],['opportunity-3',43.50]],observed=[];for(const [name,t] of samples){await cap.evaluate(t=>{const a=window.__PROAI_CUBE_R1_2;a.setReviewPresentation(t,1,false);a.clearSemanticReviewState();a.renderReviewFrame()},t);await cap.waitForTimeout(120);const q=await read(cap);await cap.locator('#cube-canvas').screenshot({path:`review-evidence/public/r43-public-${name}.png`,timeout:120000});observed.push({name,t,alignment:q.s.opticalField?.alignment??0,tiles:q.s.physicalEngravedTileMeshCount})}
            const f=afterDrag.s,pass=manualChange&&natural.s.naturalOpportunityCount>=3&&f.persistentInscription===true&&f.physicalCubieMaterial===true&&f.overlayTextRendered===false&&f.visualDriverTimeline===false&&f.alphaDominantReveal===false&&f.semanticMotionCoupled===false&&f.semanticOrientationForcing===false&&f.timeScale===1&&f.blocksSlices===false&&f.seamAwareOcclusion===true&&f.emissive===false&&f.glowHalo===false&&f.scanWipeShimmer===false&&f.letterWordStagger===false&&fatal.length===0;
            const result={pass,url,publicMotion:true,naturalOpportunityCount:natural.s.naturalOpportunityCount,manualChange,observed,fatal};fs.writeFileSync('review-evidence/public/r43-public.json',JSON.stringify(result,null,2));console.log('R43_PUBLIC',JSON.stringify(result));if(!pass)process.exitCode=1;await c.close();
          } finally {await browser.close()}
          NODE
          node r43-public.mjs
          rm -f r43-public.mjs

      - name: Publish Builder observation
        uses: actions/upload-artifact@v4
        with:
          name: r43-builder-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/
          retention-days: 7

      - name: Publish owner URL
        uses: actions/upload-artifact@v4
        with:
          name: r43-owner-review-url
          path: r43-owner-review-url.txt
          retention-days: 1

      - name: Hold owner preview for approximately 3 hours
        run: sleep 10800
