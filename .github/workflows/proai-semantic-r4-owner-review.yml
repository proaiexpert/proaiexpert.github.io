name: ProAI Semantic R4.4 Physical Engraving Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r44-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 968081edf67aeaceda23126639d96bb2cb1f0e20
          fetch-depth: 0

      - name: Verify rollback ancestry and exact R4.4 product
        run: |
          test "$(git rev-parse HEAD)" = "968081edf67aeaceda23126639d96bb2cb1f0e20"
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20
          test "$(git merge-base f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Build exact R4.4 and enforce R4.3 architecture
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "bumpScale:-0.130,roughnessMapInk:0.550,metalnessDelta:0.0,tonalInk:0.820" main.generated.js
          grep -q "semanticR44SceneProjectedUv=true" main.generated.js
          grep -q "semanticR44BeveledBump=true" main.generated.js
          grep -q "frontFacing:signedFaceView>0" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "physicalEngravedLogicalTileCount" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "semanticMotionCoupled:false" main.generated.js
          grep -q "semanticOrientationForcing:false" main.generated.js
          ! grep -q "SEMANTIC_R4_2_TEXT" main.generated.js
          cp -a dist /tmp/r44-dist

      - name: Build exact frozen R4.3 comparison
        run: |
          git show f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs > material-polish-r4.mjs
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          cp -a dist /tmp/r43-dist
          git checkout -- material-polish-r4.mjs
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"
          rm -rf dist
          cp -a /tmp/r44-dist dist

      - name: Install live browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact R4.4 and R4.3 runtimes
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/r44-dist >/tmp/r44-http.log 2>&1 &
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r43-dist >/tmp/r43-http.log 2>&1 &
          for port in 4173 4174; do
            ok=''
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && { ok=1; break; }; sleep 1; done
            test -n "$ok"
          done

      - name: Publish single TryCloudflare preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r44-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do
                if curl -fsSL --max-time 15 "$URL/" >/tmp/r44-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
                sleep 2
              done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r44-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r44-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r44-owner-review-url
          path: r44-owner-review-url.txt
          retention-days: 1

      - name: Observe natural opportunities, comparison, motion, and manual discovery
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r44-watch.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL,out='review-evidence/r44-final';
          fs.mkdirSync(`${out}/video`,{recursive:true});
          const fatal=[],responses=[],samples=[],opportunities=[];
          const stats=a=>({min:Math.min(...a),max:Math.max(...a),mean:a.reduce((x,y)=>x+y,0)/a.length});
          const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
          async function canvasBox(page){const b=await page.locator('#cube-canvas').boundingBox();if(!b)throw new Error('canvas missing');return b;}
          async function snap(page,path){const b=await canvasBox(page);return page.screenshot({path,clip:{x:b.x,y:b.y,width:b.width,height:b.height},timeout:120000});}
          async function snapBuffer(page){const b=await canvasBox(page);return page.screenshot({clip:{x:b.x,y:b.y,width:b.width,height:b.height},timeout:120000});}
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          let result=null,ctx,p;
          try{
            ctx=await browser.newContext({viewport:{width:900,height:600},reducedMotion:'no-preference',recordVideo:{dir:`${out}/video`,size:{width:900,height:600}}});
            p=await ctx.newPage();
            const page0=performance.now();
            p.on('pageerror',e=>fatal.push(`pageerror:${String(e)}`));
            p.on('console',m=>{if(m.type()==='error')fatal.push(`console:${m.text()}`)});
            p.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            const nav=await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            const readyVideoOffset=(performance.now()-page0)/1000;
            const first=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState(),title:document.title,canvas:!!document.querySelector('#cube-canvas')}));
            const wall0=performance.now(),sim0=first.d.presentation.simTimeMs;
            let lastSim=sim0,movingSamples=0,current=null,lastPeak=-999;
            while((performance.now()-wall0)<1200000 && opportunities.length<3){
              await p.waitForTimeout(120);
              const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
              const scene=(q.d.presentation.simTimeMs-sim0)/1000,elapsed=(performance.now()-wall0)/1000,opt=q.s.opticalField??{},alignment=opt.alignment??0,faceView=opt.faceView??0,front=opt.frontFacing===true,scale=q.s.timeScale??1;
              if(q.d.presentation.simTimeMs>lastSim)movingSamples++;lastSim=q.d.presentation.simTimeMs;
              samples.push({scene,elapsed,alignment,faceView,front,scale});
              const eligible=front&&faceView>=.50&&alignment>=.28;
              if(!current&&eligible&&scene-lastPeak>=3){
                current={number:opportunities.length+1,startScene:scene,peakScene:scene,peakAlignment:alignment,peakFaceView:faceView,peakElapsed:elapsed,peakShot:await snapBuffer(p)};
              }else if(current){
                if(front&&alignment>current.peakAlignment){current.peakAlignment=alignment;current.peakFaceView=faceView;current.peakScene=scene;current.peakElapsed=elapsed;if(alignment>=(current.lastShotAlignment??0)+.06){current.peakShot=await snapBuffer(p);current.lastShotAlignment=alignment;}}
                if(!front||faceView<.42||alignment<.18){current.endScene=scene;current.opticalDuration=Math.max(0,scene-current.startScene);current.peakVideoTime=readyVideoOffset+current.peakElapsed;fs.writeFileSync(`${out}/opportunity-${current.number}.png`,current.peakShot);delete current.peakShot;delete current.lastShotAlignment;opportunities.push(current);lastPeak=current.peakScene;current=null;}
              }
            }
            if(opportunities.length!==3)throw new Error(`observed ${opportunities.length}/3 natural opportunities`);
            const afterTarget=opportunities[2].endScene+1;
            while(true){await p.waitForTimeout(120);const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));const scene=(q.d.presentation.simTimeMs-sim0)/1000,opt=q.s.opticalField??{};samples.push({scene,alignment:opt.alignment??0,faceView:opt.faceView??0,front:opt.frontFacing===true,scale:q.s.timeScale??1});if(scene>=afterTarget)break;}

            const c43=await browser.newContext({viewport:{width:900,height:600},reducedMotion:'no-preference'}),p43=await c43.newPage();
            await p43.goto('http://127.0.0.1:4174/',{waitUntil:'domcontentloaded',timeout:120000});
            await p43.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            const s43=await p43.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);
            for(const o of opportunities){while(true){const now=await p43.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);if((now-s43)/1000>=o.peakScene)break;await p43.waitForTimeout(100);}await snap(p43,`${out}/r43-same-time-${o.number}.png`);}
            await c43.close();

            // Fresh public session for mandatory manual discovery while the physical
            // nine-tile engraving is still assembled in its initial +Z face layout.
            const cm=await browser.newContext({viewport:{width:900,height:600},reducedMotion:'no-preference'}),pm=await cm.newPage();
            await pm.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await pm.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            const mb=await pm.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()})),box=await canvasBox(pm),cx=box.x+box.width*.5,cy=box.y+box.height*.5;
            let bestAlignment=mb.s.opticalField?.alignment??0,bestFaceView=mb.s.opticalField?.faceView??0,bestStep=0,manualCaptured=false,bestShot=await snapBuffer(pm);
            for(let step=1;step<=28;step++){
              const dx=((step%6)<3?1:-1)*(22+((step*11)%42)),dy=((step%7)-3)*8;
              await pm.mouse.move(cx,cy);await pm.mouse.down();await pm.mouse.move(cx+dx,cy+dy,{steps:4});await pm.mouse.up();await pm.waitForTimeout(60);
              const now=await pm.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),opt=now.s.opticalField??{},a=opt.alignment??0,fv=opt.faceView??0,front=opt.frontFacing===true;
              if(front&&(a>.45||fv>bestFaceView)){bestAlignment=Math.max(bestAlignment,a);bestFaceView=Math.max(bestFaceView,fv);bestStep=step;bestShot=await snapBuffer(pm);}
              if(front&&a>=.65&&fv>=.55){manualCaptured=true;bestAlignment=a;bestFaceView=fv;bestStep=step;bestShot=await snapBuffer(pm);break;}
            }
            fs.writeFileSync(`${out}/manual-readable.png`,bestShot);
            const ma=await pm.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()})),pointerDelta=dist3(mb.i.cameraPosition,ma.i.cameraPosition);
            const pointer={pass:pointerDelta>.01&&ma.d.presentation.simTimeMs>mb.d.presentation.simTimeMs&&ma.s.persistentInscription===true&&ma.s.physicalEngravedLogicalTileCount===9&&ma.s.timeScale===1,cameraDelta:pointerDelta,bestAlignment,bestFaceView,bestStep,manualCaptured};
            await cm.close();

            const p1=opportunities[0].peakScene,p3=opportunities[2].peakScene,beforeScale=samples.filter(x=>x.scene<p1-.5).map(x=>x.scale),duringScale=samples.filter(x=>opportunities.some(o=>x.scene>=o.startScene&&x.scene<=o.endScene)).map(x=>x.scale),afterScale=samples.filter(x=>x.scene>p3+.5).map(x=>x.scale),motion={before:stats(beforeScale.length?beforeScale:[1]),during:stats(duringScale.length?duringScale:[1]),after:stats(afterScale.length?afterScale:[1]),all:stats(samples.map(x=>x.scale))};
            const end=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),good=r=>r.status>=200&&r.status<400;
            result={pass:nav?.status()===200&&first.canvas&&movingSamples>20&&opportunities.length===3&&pointer.pass&&fatal.length===0&&motion.all.min===1&&motion.all.max===1,url,http:nav?.status()===200,html:first.title.toLowerCase().includes('proai'),css:responses.some(r=>r.type==='stylesheet'&&good(r)),js:responses.some(r=>r.type==='script'&&good(r)),three:!!first.s&&!!first.d,glb:responses.some(r=>/\.glb(?:\?|$)/i.test(r.url)&&good(r)),webgl:first.canvas,cubeVisible:first.s.physicalCubieMaterial===true&&first.s.physicalEngravedLogicalTileCount===9,cubeMoving:movingSamples>20,movingSamples,readyVideoOffset,opportunities,motion,pointer,comparison:{baseline:'f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a',candidate:'968081edf67aeaceda23126639d96bb2cb1f0e20',sameCamera:true,sameSceneTimes:true,samePlaybackSpeed:true},flags:{persistentInscription:end.s.persistentInscription,physicalEngravedLogicalTileCount:end.s.physicalEngravedLogicalTileCount,overlayTextRendered:end.s.overlayTextRendered,visualDriverTimeline:end.s.visualDriverTimeline,alphaDominantReveal:end.s.alphaDominantReveal,semanticMotionCoupled:end.s.semanticMotionCoupled,semanticOrientationForcing:end.s.semanticOrientationForcing,timeScale:end.s.timeScale,emissive:end.s.emissive,glowHalo:end.s.glowHalo},fatal,samples};
            fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));console.log('R44_PUBLIC_WATCH',JSON.stringify({pass:result.pass,url,opportunities,motion,pointer,fatal}));
          }finally{if(p&&!p.isClosed())await p.close().catch(()=>{});if(ctx)await ctx.close().catch(()=>{});await browser.close();}
          if(!result?.pass)process.exitCode=1;
          NODE
          node r44-watch.mjs
          rm -f r44-watch.mjs

      - name: Publish live observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r44-final/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
