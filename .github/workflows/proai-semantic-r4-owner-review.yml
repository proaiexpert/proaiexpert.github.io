name: ProAI Semantic R4.4 Physical Engraving Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r44-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55
          fetch-depth: 0

      - name: Verify R4.3 rollback ancestry and exact R4.4 product
        run: |
          test "$(git rev-parse HEAD)" = "72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55"
          test "$(git hash-object material-polish-r4.mjs)" = "e8b1248a155de67306ffb09718f49702ba4d7d39"
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55
          test "$(git merge-base f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 72f03b0fbc2ae3f30cdd173b37bb9e6ba24fcd55)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Build exact R4.4 product and enforce R4.3 architecture
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "bumpScale:-0.105,roughnessMapInk:0.690" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "physicalEngravedLogicalTileCount" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "semanticMotionCoupled:false" main.generated.js
          grep -q "semanticOrientationForcing:false" main.generated.js
          ! grep -q "SEMANTIC_R4_2_TEXT" main.generated.js

      - name: Install live browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start R4.4 runtime
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r44-http.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Publish single TryCloudflare R4.4 preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r44-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do
                if curl -fsSL --max-time 15 "$URL/" >/tmp/r44-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
                sleep 2
              done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r44-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r44-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Observe three natural opportunities, motion invariants, and pointer discovery
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r44-live-watch.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL;
          const out='review-evidence/r44-live-owner';
          fs.mkdirSync(`${out}/video`,{recursive:true});
          const fatal=[],responses=[],samples=[],opportunities=[];
          const stats=a=>({min:Math.min(...a),max:Math.max(...a),mean:a.reduce((x,y)=>x+y,0)/a.length});
          const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          try {
            const ctx=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'no-preference',recordVideo:{dir:`${out}/video`,size:{width:1440,height:900}}});
            const p=await ctx.newPage();
            p.on('pageerror',e=>fatal.push(`pageerror:${String(e)}`));
            p.on('console',m=>{if(m.type()==='error')fatal.push(`console:${m.text()}`)});
            p.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            const nav=await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            const first=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState(),title:document.title,canvas:!!document.querySelector('#cube-canvas')}));
            const wall0=performance.now(),sim0=first.d.presentation.simTimeMs;
            let lastSim=sim0,movingSamples=0,armed=true,current=null,lastOpportunityScene=-999;
            while((performance.now()-wall0)<720000 && opportunities.length<3){
              await p.waitForTimeout(160);
              const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
              const elapsed=(performance.now()-wall0)/1000,scene=(q.d.presentation.simTimeMs-sim0)/1000;
              if(q.d.presentation.simTimeMs>lastSim)movingSamples++;
              lastSim=q.d.presentation.simTimeMs;
              const alignment=q.s.opticalField?.alignment??0,faceView=q.s.opticalField?.faceView??0,scale=q.s.timeScale??1;
              samples.push({elapsed,scene,alignment,faceView,scale,semanticActive:!!q.s.active});
              if(!current && armed && alignment>=0.72 && scene-lastOpportunityScene>=4){
                current={number:opportunities.length+1,startScene:scene,peakScene:scene,peakAlignment:alignment,faceView,peakElapsed:elapsed};
                armed=false;
              }
              if(current){
                if(alignment>current.peakAlignment){current.peakAlignment=alignment;current.peakScene=scene;current.faceView=faceView;current.peakElapsed=elapsed}
                if(alignment<=0.58){
                  current.endScene=scene;
                  current.opticalWindow=Math.max(0,current.endScene-current.startScene);
                  const name=`opportunity-${current.number}.png`;
                  await p.locator('#cube-canvas').screenshot({path:`${out}/${name}`,timeout:120000});
                  current.screenshot=name;
                  opportunities.push(current);lastOpportunityScene=current.peakScene;current=null;armed=true;
                }
              }
            }
            if(opportunities.length<3)throw new Error(`only ${opportunities.length} natural optical opportunities observed`);

            const before=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const box=await p.locator('#cube-canvas').boundingBox(); if(!box)throw new Error('desktop canvas missing');
            const cx=box.x+box.width*.5,cy=box.y+box.height*.5;
            let best={alignment:before.s.opticalField?.alignment??0,step:0};
            for(let step=1;step<=18;step++){
              await p.mouse.move(cx,cy);await p.mouse.down();
              await p.mouse.move(cx+42,cy+(step%2?12:-8),{steps:3});await p.mouse.up();
              await p.waitForTimeout(120);
              const now=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
              const a=now.s.opticalField?.alignment??0;
              if(a>best.alignment){best={alignment:a,step,state:now};await p.locator('#cube-canvas').screenshot({path:`${out}/manual-best.png`,timeout:120000});}
              if(a>=0.90)break;
            }
            const after=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const pointerDelta=dist3(before.i.cameraPosition,after.i.cameraPosition);
            const pointerPass=pointerDelta>.01&&after.d.presentation.simTimeMs>before.d.presentation.simTimeMs&&after.s.persistentInscription===true&&after.s.physicalEngravedLogicalTileCount===9&&after.s.timeScale===1;

            const allScales=samples.map(x=>x.scale),activeScales=samples.filter(x=>x.semanticActive).map(x=>x.scale),inactiveScales=samples.filter(x=>!x.semanticActive).map(x=>x.scale);
            const motion={all:stats(allScales),during:stats(activeScales.length?activeScales:[1]),outside:stats(inactiveScales.length?inactiveScales:[1])};
            await p.close();await ctx.close();

            const tc=await browser.newContext({viewport:{width:430,height:932},deviceScaleFactor:2,hasTouch:true,isMobile:true,reducedMotion:'no-preference'}),tp=await tc.newPage();
            tp.on('pageerror',e=>fatal.push(`touch-pageerror:${String(e)}`));
            await tp.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await tp.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            const tb=await tp.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
            const tbox=await tp.locator('#cube-canvas').boundingBox();if(!tbox)throw new Error('touch canvas missing');
            const tx=tbox.x+tbox.width*.52,ty=tbox.y+tbox.height*.48,cdp=await tc.newCDPSession(tp);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:tx,y:ty,radiusX:8,radiusY:8,force:.7,id:1}]});
            for(let n=1;n<=7;n++)await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:tx+n*10,y:ty+n*3,radiusX:8,radiusY:8,force:.7,id:1}]});
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await tp.waitForTimeout(900);
            const ta=await tp.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()}));
            const touchPass=ta.d.presentation.simTimeMs>tb.d.presentation.simTimeMs&&ta.s.persistentInscription===true&&ta.s.physicalEngravedLogicalTileCount===9&&ta.s.timeScale===1;
            await tc.close();
            const good=r=>r.status>=200&&r.status<400;
            const result={pass:nav?.status()===200&&first.canvas&&movingSamples>20&&opportunities.length>=3&&pointerPass&&touchPass&&fatal.length===0&&motion.all.min===1&&motion.all.max===1,url,http:nav?.status()===200,html:first.title.toLowerCase().includes('proai'),css:responses.some(r=>r.type==='stylesheet'&&good(r)),js:responses.some(r=>r.type==='script'&&good(r)),three:!!first.s&&!!first.d,glb:responses.some(r=>/\.glb(?:\?|$)/i.test(r.url)&&good(r)),webgl:first.canvas,cubeVisible:first.s.physicalCubieMaterial===true&&first.s.physicalEngravedLogicalTileCount===9,cubeMoving:movingSamples>20,movingSamples,opportunities,motion,pointer:{pass:pointerPass,cameraDelta:pointerDelta,bestAlignment:best.alignment,bestStep:best.step},touchPass,flags:{persistentInscription:after.s.persistentInscription,physicalEngravedLogicalTileCount:after.s.physicalEngravedLogicalTileCount,overlayTextRendered:after.s.overlayTextRendered,visualDriverTimeline:after.s.visualDriverTimeline,alphaDominantReveal:after.s.alphaDominantReveal,semanticMotionCoupled:after.s.semanticMotionCoupled,semanticOrientationForcing:after.s.semanticOrientationForcing,timeScale:after.s.timeScale,emissive:after.s.emissive,glowHalo:after.s.glowHalo},fatal,samples};
            fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));
            console.log('R44_PUBLIC_WATCH',JSON.stringify({pass:result.pass,url,opportunities,motion,pointer:result.pointer,touchPass,fatal}));
            if(!result.pass)process.exitCode=1;
          } finally {await browser.close();}
          NODE
          node r44-live-watch.mjs
          rm -f r44-live-watch.mjs

      - name: Publish owner URL
        uses: actions/upload-artifact@v4
        with:
          name: r44-owner-review-url
          path: r44-owner-review-url.txt
          retention-days: 1

      - name: Publish live observation
        uses: actions/upload-artifact@v4
        with:
          name: r44-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r44-live-owner/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        run: sleep 10800
