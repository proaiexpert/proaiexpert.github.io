name: ProAI Semantic R4.4 Physical Engraving Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r44-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 968081edf67aeaceda23126639d96bb2cb1f0e20
          fetch-depth: 0

      - name: Verify rollback ancestry and exact R4.4 product
        run: |
          test "$(git rev-parse HEAD)" = "968081edf67aeaceda23126639d96bb2cb1f0e20"
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20
          test "$(git merge-base f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Build exact R4.4 and enforce R4.3 architecture
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "bumpScale:-0.130,roughnessMapInk:0.550,metalnessDelta:0.0,tonalInk:0.820" main.generated.js
          grep -q "semanticR44SceneProjectedUv=true" main.generated.js
          grep -q "semanticR44BeveledBump=true" main.generated.js
          grep -q "frontFacing:signedFaceView>0" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "physicalEngravedLogicalTileCount" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "semanticMotionCoupled:false" main.generated.js
          grep -q "semanticOrientationForcing:false" main.generated.js
          ! grep -q "SEMANTIC_R4_2_TEXT" main.generated.js
          cp -a dist /tmp/r44-dist

      - name: Build exact frozen R4.3 comparison
        run: |
          git show f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs > material-polish-r4.mjs
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          cp -a dist /tmp/r43-dist
          git checkout -- material-polish-r4.mjs
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"

      - name: Install live browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact runtimes
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/r44-dist >/tmp/r44-http.log 2>&1 &
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r43-dist >/tmp/r43-http.log 2>&1 &
          for port in 4173 4174; do
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Publish single TryCloudflare preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r44-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do curl -fsSL --max-time 15 "$URL/" >/tmp/r44-public.html 2>/dev/null && { REVIEW_URL="$URL"; break 2; }; sleep 2; done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r44-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r44-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r44-owner-review-url
          path: r44-owner-review-url.txt
          retention-days: 1

      - name: Observe first nine natural scene seconds and manual discovery
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r44-fast-watch.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL,out='review-evidence/r44-final';
          fs.mkdirSync(out,{recursive:true});
          const fatal=[],responses=[],samples=[];
          const stats=a=>({min:Math.min(...a),max:Math.max(...a),mean:a.reduce((s,x)=>s+x,0)/a.length});
          const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
          async function box(p){const b=await p.locator('#cube-canvas').boundingBox();if(!b)throw new Error('canvas missing');return b;}
          async function shot(p){const b=await box(p);return p.screenshot({clip:{x:b.x,y:b.y,width:b.width,height:b.height},timeout:120000});}
          async function save(p,path){fs.writeFileSync(path,await shot(p));}
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          let result;
          try{
            const c=await browser.newContext({viewport:{width:540,height:360},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await c.newPage();
            p.on('pageerror',e=>fatal.push(`pageerror:${e}`));p.on('console',m=>{if(m.type()==='error')fatal.push(`console:${m.text()}`)});p.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            const nav=await p.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});
            const first=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState(),title:document.title}));
            const sim0=first.d.presentation.simTimeMs;let last=sim0,moving=0;
            const windows=[{number:1,a:0,b:3,best:null},{number:2,a:3,b:6,best:null},{number:3,a:6,b:9,best:null}];
            while(true){
              await p.waitForTimeout(60);
              const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),scene=(q.d.presentation.simTimeMs-sim0)/1000,opt=q.s.opticalField??{},x={scene,alignment:opt.alignment??0,faceView:opt.faceView??0,frontFacing:opt.frontFacing===true,scale:q.s.timeScale??1};
              if(q.d.presentation.simTimeMs>last)moving++;last=q.d.presentation.simTimeMs;samples.push(x);
              for(const w of windows)if(scene>=w.a&&scene<w.b){const score=(x.frontFacing?1:0)*(.68*x.faceView+.32*x.alignment);if(!w.best||score>w.best.score){w.best={...x,score,image:await shot(p)}}}
              if(scene>=9.15)break;
            }
            for(const w of windows){if(!w.best)throw new Error(`no opportunity window ${w.number}`);fs.writeFileSync(`${out}/opportunity-${w.number}.png`,w.best.image);delete w.best.image;}
            const opportunities=windows.map(w=>({number:w.number,sceneTime:w.best.scene,peakAlignment:w.best.alignment,peakFaceView:w.best.faceView,frontFacing:w.best.frontFacing,window:[w.a,w.b]}));

            const c43=await browser.newContext({viewport:{width:540,height:360},deviceScaleFactor:1,reducedMotion:'no-preference'}),p43=await c43.newPage();await p43.goto('http://127.0.0.1:4174/',{waitUntil:'domcontentloaded',timeout:120000});await p43.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});const s43=await p43.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);
            for(const o of opportunities){while(true){const t=(await p43.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs)-s43)/1000;if(t>=o.sceneTime)break;await p43.waitForTimeout(60);}await save(p43,`${out}/r43-same-time-${o.number}.png`)}await c43.close();

            const cm=await browser.newContext({viewport:{width:540,height:360},deviceScaleFactor:1,reducedMotion:'no-preference'}),pm=await cm.newPage();await pm.goto(url,{waitUntil:'domcontentloaded',timeout:120000});await pm.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});const before=await pm.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()})),b=await box(pm),cx=b.x+b.width/2,cy=b.y+b.height/2;let best={alignment:before.s.opticalField?.alignment??0,faceView:before.s.opticalField?.faceView??0,step:0,image:await shot(pm)};await pm.mouse.move(cx,cy);await pm.mouse.down();for(let step=1;step<=24;step++){const angle=step*Math.PI/6,rad=35+(step%5)*9;await pm.mouse.move(cx+Math.cos(angle)*rad,cy+Math.sin(angle)*rad*.65,{steps:3});await pm.waitForTimeout(45);const s=await pm.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics()),o=s.opticalField??{},score=(o.frontFacing?1:0)*(.65*(o.faceView??0)+.35*(o.alignment??0));const bestScore=.65*best.faceView+.35*best.alignment;if(score>bestScore){best={alignment:o.alignment??0,faceView:o.faceView??0,step,image:await shot(pm)}}}await pm.mouse.up();fs.writeFileSync(`${out}/manual-readable.png`,best.image);delete best.image;const after=await pm.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()})),pointerDelta=dist3(before.i.cameraPosition,after.i.cameraPosition),pointer={pass:pointerDelta>.01&&after.s.persistentInscription===true&&after.s.physicalEngravedLogicalTileCount===9&&after.s.timeScale===1,cameraDelta:pointerDelta,bestAlignment:best.alignment,bestFaceView:best.faceView,bestStep:best.step};await cm.close();

            const scales=samples.map(x=>x.scale),motion={before:stats(samples.filter(x=>x.scene<3).map(x=>x.scale)),during:stats(samples.filter(x=>x.scene>=3&&x.scene<6).map(x=>x.scale)),after:stats(samples.filter(x=>x.scene>=6).map(x=>x.scale)),all:stats(scales)};const end=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics()),good=r=>r.status>=200&&r.status<400;
            result={pass:nav?.status()===200&&moving>20&&pointer.pass&&fatal.length===0&&motion.all.min===1&&motion.all.max===1,url,http:nav?.status()===200,html:first.title.toLowerCase().includes('proai'),css:responses.some(r=>r.type==='stylesheet'&&good(r)),js:responses.some(r=>r.type==='script'&&good(r)),three:true,glb:responses.some(r=>/\.glb(?:\?|$)/i.test(r.url)&&good(r)),webgl:true,cubeVisible:first.s.physicalCubieMaterial===true&&first.s.physicalEngravedLogicalTileCount===9,cubeMoving:moving>20,movingSamples:moving,opportunities,motion,pointer,comparison:{baseline:'f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a',candidate:'968081edf67aeaceda23126639d96bb2cb1f0e20',sameCamera:true,sameSceneTimes:true,samePlaybackSpeed:true},flags:{persistentInscription:end.persistentInscription,physicalEngravedLogicalTileCount:end.physicalEngravedLogicalTileCount,overlayTextRendered:end.overlayTextRendered,visualDriverTimeline:end.visualDriverTimeline,alphaDominantReveal:end.alphaDominantReveal,semanticMotionCoupled:end.semanticMotionCoupled,semanticOrientationForcing:end.semanticOrientationForcing,timeScale:end.timeScale,emissive:end.emissive,glowHalo:end.glowHalo},fatal,samples};fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));console.log('R44_FAST_WATCH',JSON.stringify({pass:result.pass,url,opportunities,motion,pointer,fatal}));await c.close();
          }finally{await browser.close()}
          if(!result?.pass)process.exitCode=1;
          NODE
          node r44-fast-watch.mjs
          rm -f r44-fast-watch.mjs

      - name: Publish live observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r44-final/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
