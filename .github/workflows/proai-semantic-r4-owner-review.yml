name: ProAI Semantic R4.4 Physical Engraving Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r44-owner-access-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 968081edf67aeaceda23126639d96bb2cb1f0e20
          fetch-depth: 0

      - name: Verify exact product and rollback ancestry
        run: |
          test "$(git rev-parse HEAD)" = "968081edf67aeaceda23126639d96bb2cb1f0e20"
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"
          git cat-file -e f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a^{commit}
          git merge-base --is-ancestor f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20
          test "$(git merge-base f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a 968081edf67aeaceda23126639d96bb2cb1f0e20)" = "f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a"

      - name: Build exact R4.4 and enforce R4.3 architecture
        run: |
          npm install --package-lock=false
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          test "$(wc -c < rubik_39_s_cube_animation.glb | tr -d ' ')" -eq 279412
          test "$(sha256sum rubik_39_s_cube_animation.glb | awk '{print $1}')" = "dbb7fc4156f8c9ed2481dd76443dffb9a45ecb5493463f99bffb34dd3b59c79b"
          grep -q "bumpScale:-0.130,roughnessMapInk:0.550,metalnessDelta:0.0,tonalInk:0.820" main.generated.js
          grep -q "semanticR44SceneProjectedUv=true" main.generated.js
          grep -q "semanticR44BeveledBump=true" main.generated.js
          grep -q "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -q "const deltaMs=wallDeltaMs" main.generated.js
          ! grep -q "wallDeltaMs \* semanticTimeScale" main.generated.js
          grep -q "overlayTextRendered:false" main.generated.js
          grep -q "alphaDominantReveal:false" main.generated.js
          grep -q "semanticMotionCoupled:false" main.generated.js
          grep -q "semanticOrientationForcing:false" main.generated.js
          ! grep -q "SEMANTIC_R4_2_TEXT" main.generated.js
          cp -a dist /tmp/r44-dist

      - name: Build exact frozen R4.3 comparison
        run: |
          git show f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a:docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/material-polish-r4.mjs > material-polish-r4.mjs
          npm run prepare-r4
          node clock-r4.mjs
          node material-polish-r4.mjs
          node --check main.generated.js
          npx vite build
          cp -a dist /tmp/r43-dist
          git checkout -- material-polish-r4.mjs
          test "$(git hash-object material-polish-r4.mjs)" = "8b7d80be2f36715f7001196b3021556057839dca"

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Start exact runtimes
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/r44-dist >/tmp/r44-http.log 2>&1 &
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/r43-dist >/tmp/r43-http.log 2>&1 &
          for port in 4173 4174; do
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:${port}/" >/dev/null && break; sleep 1; done
            curl -fsS "http://127.0.0.1:${port}/" >/dev/null
          done

      - name: Publish one public owner preview
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2 3; do
            LOG="/tmp/r44-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 & PID=$!
            URL=''
            for i in $(seq 1 75); do URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true); [ -n "$URL" ] && break; sleep 1; done
            if [ -n "$URL" ]; then
              for i in $(seq 1 30); do curl -fsSL --max-time 15 "$URL/" >/tmp/r44-public.html 2>/dev/null && { REVIEW_URL="$URL"; break 2; }; sleep 2; done
            fi
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r44-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r44-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Publish owner URL immediately
        uses: actions/upload-artifact@v4
        with:
          name: r44-owner-review-url
          path: r44-owner-review-url.txt
          retention-days: 1

      - name: Public smoke, manual discovery, three natural opportunities, R4.3 comparison
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          cat > r44-watch.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url=process.env.REVIEW_URL;
          const out='review-evidence/r44-final';
          fs.mkdirSync(out,{recursive:true});
          const fatal=[],responses=[];
          const stats=a=>({min:Math.min(...a),max:Math.max(...a),mean:a.reduce((s,x)=>s+x,0)/a.length});
          const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
          const scoreOf=x=>x.frontFacing?(.68*x.faceView+.32*x.alignment):0;
          // Evidence-only cadence: 20fps scene sampling. Product delta/timeScale logic is untouched;
          // normal public owner URL above runs with the browser's native requestAnimationFrame cadence.
          const qaClock=`(()=>{let t=0,epoch=Date.now(),id=1,q=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>epoch+t;window.requestAnimationFrame=(cb)=>{const n=id++;const h=setTimeout(()=>{q.delete(n);t+=50;cb(t)},0);q.set(n,h);return n};window.cancelAnimationFrame=(n)=>{const h=q.get(n);if(h!==undefined){clearTimeout(h);q.delete(n)}}})();`;
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          async function ready(page,target){const nav=await page.goto(target,{waitUntil:'domcontentloaded',timeout:120000});await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:180000});return nav}
          async function canvasPng(page){return await page.locator('#cube-canvas').screenshot({timeout:120000})}
          async function sampleScene(target,maxScene=14){
            const c=await browser.newContext({viewport:{width:800,height:533},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await c.newPage();
            await p.addInitScript({content:qaClock});await ready(p,target);
            const start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs),samples=[];let last=start,moving=0,guard=0;
            while(true){
              await p.waitForTimeout(0);
              const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),scene=(q.d.presentation.simTimeMs-start)/1000,o=q.s.opticalField??{},x={scene,alignment:o.alignment??0,faceView:o.faceView??0,frontFacing:o.frontFacing===true,scale:q.s.timeScale??1};
              if(q.d.presentation.simTimeMs>last)moving++;last=q.d.presentation.simTimeMs;samples.push(x);
              if(scene>=maxScene)break;if(++guard>1400)throw new Error(`QA clock stalled at ${scene}`);
            }
            await c.close();return {samples,moving};
          }
          function pickThree(samples){
            const candidates=[];
            for(let i=1;i<samples.length-1;i++){
              const x=samples[i],s=scoreOf(x);if(s<.35)continue;
              if(s>=scoreOf(samples[i-1])&&s>=scoreOf(samples[i+1]))candidates.push({...x,score:s});
            }
            candidates.sort((a,b)=>b.score-a.score);
            const chosen=[];
            for(const c of candidates){if(chosen.every(x=>Math.abs(x.scene-c.scene)>=1.1)){chosen.push(c);if(chosen.length===3)break;}}
            if(chosen.length<3){for(const x of samples.slice().sort((a,b)=>scoreOf(b)-scoreOf(a))){const c={...x,score:scoreOf(x)};if(chosen.every(y=>Math.abs(y.scene-c.scene)>=1.1)){chosen.push(c);if(chosen.length===3)break;}}}
            return chosen.sort((a,b)=>a.scene-b.scene).map((x,i)=>({number:i+1,sceneTime:x.scene,peakAlignment:x.alignment,peakFaceView:x.faceView,frontFacing:x.frontFacing,score:x.score}));
          }
          function opticalDuration(samples,peak){
            const threshold=Math.max(.38,peak.score*.80);
            let idx=samples.reduce((best,x,i)=>Math.abs(x.scene-peak.sceneTime)<Math.abs(samples[best].scene-peak.sceneTime)?i:best,0),lo=idx,hi=idx;
            while(lo>0&&scoreOf(samples[lo-1])>=threshold)lo--;
            while(hi<samples.length-1&&scoreOf(samples[hi+1])>=threshold)hi++;
            return Math.max(0,samples[hi].scene-samples[lo].scene);
          }
          async function captureTimes(target,ops,prefix){
            const c=await browser.newContext({viewport:{width:800,height:533},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await c.newPage();
            await p.addInitScript({content:qaClock});await ready(p,target);
            const start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);let oi=0,phase=0,guard=0;const offsets=[-.40,0,.40];
            while(oi<ops.length){
              await p.waitForTimeout(0);
              const scene=(await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs)-start)/1000;
              const targetScene=Math.max(0,ops[oi].sceneTime+offsets[phase]);
              if(scene>=targetScene){fs.writeFileSync(`${out}/${prefix}-${oi+1}-${phase===0?'pre':phase===1?'peak':'post'}.png`,await canvasPng(p));phase++;if(phase===3){phase=0;oi++;}}
              if(++guard>1800)throw new Error(`${prefix} capture stalled at ${scene}`);
            }
            await c.close();
          }
          let result;
          try{
            const normal=await browser.newContext({viewport:{width:800,height:533},deviceScaleFactor:1,reducedMotion:'no-preference'}),p=await normal.newPage();
            p.on('pageerror',e=>fatal.push(`pageerror:${String(e)}`));p.on('console',m=>{if(m.type()==='error')fatal.push(`console:${m.text()}`)});p.on('response',r=>responses.push({url:r.url(),status:r.status(),type:r.request().resourceType()}));
            const nav=await ready(p,url);
            const first=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState(),title:document.title,canvas:!!document.querySelector('#cube-canvas')}));
            await p.waitForTimeout(650);const moved=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs>0);
            const box=await p.locator('#cube-canvas').boundingBox();if(!box)throw new Error('public canvas missing');const cx=box.x+box.width/2,cy=box.y+box.height/2;
            let best={alignment:first.s.opticalField?.alignment??0,faceView:first.s.opticalField?.faceView??0,frontFacing:first.s.opticalField?.frontFacing===true,score:0,step:0,image:await canvasPng(p)};
            await p.mouse.move(cx,cy);await p.mouse.down();
            for(let step=1;step<=14;step++){
              const a=step*Math.PI/5.2,r=44+(step%4)*13;await p.mouse.move(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.72,{steps:3});await p.waitForTimeout(40);
              const s=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getSemanticDiagnostics()),o=s.opticalField??{},candidate={alignment:o.alignment??0,faceView:o.faceView??0,frontFacing:o.frontFacing===true},score=scoreOf(candidate);
              if(score>best.score){best={...candidate,score,step,image:await canvasPng(p)}}
            }
            await p.mouse.up();fs.writeFileSync(`${out}/manual-readable.png`,best.image);delete best.image;
            const after=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics(),i:window.__PROAI_CUBE_R1_2.getInteractionState()}));
            const pointerDelta=dist3(first.i.cameraPosition,after.i.cameraPosition);
            const pointer={pass:pointerDelta>.01&&after.s.persistentInscription===true&&after.s.physicalEngravedLogicalTileCount===9&&after.s.timeScale===1,cameraDelta:pointerDelta,bestAlignment:best.alignment,bestFaceView:best.faceView,bestScore:best.score,bestStep:best.step};
            await normal.close();

            const candidate=await sampleScene(url+'?review=1',14),ops=pickThree(candidate.samples);
            if(ops.length!==3||ops.some(o=>!o.frontFacing))throw new Error(`natural front-facing opportunities ${ops.length}/3`);
            for(const o of ops)o.approxOpticalDuration=opticalDuration(candidate.samples,o);
            await captureTimes(url+'?review=1',ops,'r44-opportunity');
            await captureTimes('http://127.0.0.1:4174/?review=1',ops,'r43-same-time');

            const scales=candidate.samples.map(x=>x.scale),firstPeak=ops[0].sceneTime,lastPeak=ops[2].sceneTime;
            const beforeSamples=candidate.samples.filter(x=>x.scene<firstPeak-.25).map(x=>x.scale),duringSamples=candidate.samples.filter(x=>ops.some(o=>Math.abs(x.scene-o.sceneTime)<=.65)).map(x=>x.scale),afterSamples=candidate.samples.filter(x=>x.scene>lastPeak+.25).map(x=>x.scale);
            const motion={before:stats(beforeSamples.length?beforeSamples:[1]),during:stats(duringSamples.length?duringSamples:[1]),after:stats(afterSamples.length?afterSamples:[1]),all:stats(scales.length?scales:[1])};
            const good=r=>r.status>=200&&r.status<400;
            result={pass:nav?.status()===200&&first.canvas&&moved&&candidate.moving>20&&pointer.pass&&fatal.length===0&&motion.all.min===1&&motion.all.max===1,url,http:nav?.status()===200,html:first.title.toLowerCase().includes('proai'),css:responses.some(r=>r.type==='stylesheet'&&good(r)),js:responses.some(r=>r.type==='script'&&good(r)),three:!!first.s&&!!first.d,glb:responses.some(r=>/\.glb(?:\?|$)/i.test(r.url)&&good(r)),webgl:first.canvas,cubeVisible:first.s.physicalCubieMaterial===true&&first.s.physicalEngravedLogicalTileCount===9,cubeMoving:moved&&candidate.moving>20,movingSamples:candidate.moving,opportunities:ops,motion,pointer,comparison:{baseline:'f4f4bfa34f38eb99b2e99cff941a7f7895e82d9a',candidate:'968081edf67aeaceda23126639d96bb2cb1f0e20',sameCamera:true,sameSceneTimes:true,samePlaybackScale:true,qaCadenceFps:20,ownerUrlNormalCadence:true},flags:{persistentInscription:after.s.persistentInscription,physicalEngravedLogicalTileCount:after.s.physicalEngravedLogicalTileCount,overlayTextRendered:after.s.overlayTextRendered,visualDriverTimeline:after.s.visualDriverTimeline,alphaDominantReveal:after.s.alphaDominantReveal,semanticMotionCoupled:after.s.semanticMotionCoupled,semanticOrientationForcing:after.s.semanticOrientationForcing,timeScale:after.s.timeScale,emissive:after.s.emissive,glowHalo:after.s.glowHalo},fatal,samples:candidate.samples};
            fs.writeFileSync(`${out}/public-watch.json`,JSON.stringify(result,null,2));
            console.log('R44_FINAL_WATCH',JSON.stringify({pass:result.pass,url,opportunities:ops,motion,pointer,fatal}));
            if(!result.pass)process.exitCode=1;
          } finally {await browser.close();}
          NODE
          node r44-watch.mjs
          rm -f r44-watch.mjs

      - name: Publish live observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r44-live-owner-observation
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r44-final/
          retention-days: 7

      - name: Hold owner preview for approximately 3 hours
        if: success()
        run: sleep 10800
