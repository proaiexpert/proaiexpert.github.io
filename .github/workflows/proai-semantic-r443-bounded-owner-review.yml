name: ProAI Cube R4.4.3 Bounded Owner Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r443-bounded-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bounded-owner-review:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 52
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify product isolation and production freeze
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 731f435c3ee895300d053a83153832cabe65f2ca HEAD
          test "$(git hash-object material-polish-r4.mjs)" = "a5977cccb87056c000f0a60020529bff383f13e4"
          test "$(git hash-object material-polish-r442-runtime.mjs)" = "377b2d3a6aef08ba4bc47981fb31893709c0a1f1"
          test "$(git hash-object material-polish-r443-runtime.mjs)" = "56ba821cdacfd4558740eea7abd5be3d6bcad13f"
          test "$(git hash-object package.json)" = "5038bf3aaa089f9ff001b93ede0df72f9890e89d"
          git diff --exit-code 731f435c3ee895300d053a83153832cabe65f2ca -- material-polish-r4.mjs material-polish-r442-runtime.mjs material-polish-r443-runtime.mjs package.json
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"

      - name: Build exact R4.4.3 product
        run: |
          set -euo pipefail
          timeout 180s npm install --package-lock=false
          timeout 180s npm run build-r443
          node --check main.generated.js
          grep -Fq "PROAI_CUBE_R4.4.3" main.generated.js
          grep -Fq "SEMANTIC_R443_SEQUENCE=Object.freeze(['ProAI Expert','TRUST','INQUIRY','RESPONSE','RESULT'])" main.generated.js
          grep -Fq "dispersalTargetMs:[350,1250]" main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js
          grep -Fq "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -Fq "overlayTextRendered:false" main.generated.js
          grep -Fq "alphaDominantReveal:false" main.generated.js
          grep -Fq "semanticMotionCoupled:false" main.generated.js
          grep -Fq "semanticOrientationForcing:false" main.generated.js
          ! grep -Fq "emissiveIntensity" main.generated.js

      - name: Install bounded browser tooling
        run: |
          set -euo pipefail
          timeout 120s npm install --no-save playwright
          timeout 300s npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-owner-review-v2.mjs" ./r443-owner-review.mjs

      - name: Start local runtime and bounded public tunnel
        id: tunnel
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-http.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          timeout 90s curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2; do
            LOG="/tmp/r443-bounded-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 &
            PID=$!
            for i in $(seq 1 45); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              if [ -n "$URL" ] && curl -fsSL --max-time 10 "$URL/" >/tmp/r443-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
              sleep 1
            done
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          grep -q "ProAI Cube" /tmp/r443-public.html
          printf '%s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r443-owner-review-url.txt"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Run 60s native behavior QA and capture evidence
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          timeout 300s node r443-owner-review.mjs

      - name: Transcode bounded owner clips
        if: always()
        run: |
          set -euo pipefail
          mkdir -p review-evidence/r443/mp4
          FFMPEG=$(find "$HOME/.cache/ms-playwright" -type f -name ffmpeg-linux -print -quit || true)
          if [ -z "$FFMPEG" ]; then echo "Playwright ffmpeg unavailable; WEBM evidence retained"; exit 0; fi
          if [ -s review-evidence/r443/desktop-observation-60s.webm ]; then timeout 90s "$FFMPEG" -y -loglevel error -i review-evidence/r443/desktop-observation-60s.webm -t 26 -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -movflags +faststart review-evidence/r443/mp4/desktop-continuous-26s.mp4 || true; fi
          if [ -s review-evidence/r443/focused-semantic-release-dispersal.webm ]; then timeout 90s "$FFMPEG" -y -loglevel error -i review-evidence/r443/focused-semantic-release-dispersal.webm -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -movflags +faststart review-evidence/r443/mp4/focused-semantic-release-dispersal.mp4 || true; fi
          if [ -s review-evidence/r443/mobile-12s.webm ]; then timeout 90s "$FFMPEG" -y -loglevel error -i review-evidence/r443/mobile-12s.webm -c:v libx264 -preset veryfast -crf 22 -pix_fmt yuv420p -movflags +faststart review-evidence/r443/mp4/mobile-12s.mp4 || true; fi

      - name: Public self-check
        if: always()
        env:
          REVIEW_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 "$REVIEW_URL/" >/tmp/r443-public-final.html
          grep -q "ProAI Cube" /tmp/r443-public-final.html
          printf 'PASS %s\n' "$REVIEW_URL" > "$GITHUB_WORKSPACE/r443-public-self-check.txt"

      - name: Upload R4.4.3 owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r443-bounded-owner-review
          path: |
            r443-owner-review-url.txt
            r443-public-self-check.txt
            docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r443/**
          retention-days: 2

      - name: Keep owner URL alive for bounded review window
        if: success()
        run: |
          echo "Temporary owner URL remains live during this bounded hold."
          timeout 2400s sleep 2400 || true
