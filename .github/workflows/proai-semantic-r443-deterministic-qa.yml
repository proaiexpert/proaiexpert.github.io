name: ProAI Cube R4.4.3 Natural Choreography QA

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: proai-r443-natural-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  natural-choreography-qa:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2201f2ff5b40be8ea57c5538f55a07ededf2528
          fetch-depth: 0
      - name: Verify exact product and main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e2201f2ff5b40be8ea57c5538f55a07ededf2528"
          git merge-base --is-ancestor a4e93f645188fa92087121da4aa8c5bb839a3719 HEAD
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Build exact product
        run: |
          set -euo pipefail
          timeout 180s npm install --package-lock=false
          timeout 180s npm run build-r443
          node --check main.generated.js
          grep -Fq 'semanticR443VisibleMoveHistory' main.generated.js
          grep -Fq 'semanticR443ChooseBridge' main.generated.js
          grep -Fq 'w*=8' main.generated.js
          grep -Fq 'w*=12' main.generated.js
          ! grep -Fq 'w*=24' main.generated.js
          ! grep -Fq 'w*=32' main.generated.js
          grep -Fq 'semanticVelocityMultiplier: 1.0' main.generated.js
          grep -Fq "yawDirectionPolicy:'continuous-positive'" main.generated.js
          ! grep -Fq 'emissiveIntensity' main.generated.js
      - name: Prepare fast numerical build
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const p='main.generated.js';let s=fs.readFileSync(p,'utf8');const re=/renderer\.render\(scene,\s*camera\);/g;const n=[...s.matchAll(re)].length;if(n!==2)throw new Error('render calls '+n);s=s.replace(re,'scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');fs.writeFileSync(p,s);
          NODE
          timeout 120s npx vite build
      - name: Install Playwright package only
        run: timeout 120s npm install --no-save playwright
      - name: Start numerical runtime
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-natural-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run deterministic 45s choreography QA
        run: |
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-deterministic-qa.mjs" ./r443-natural-qa.mjs
          timeout 100s node r443-natural-qa.mjs
      - name: Upload choreography metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r443-natural-choreography-qa
          path: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r443-natural-choreography/**
          retention-days: 2
