name: ProAI Cube R4.4.3 Live Owner Review Only

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: proai-r443-live-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-owner-review:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4e93f645188fa92087121da4aa8c5bb839a3719
          fetch-depth: 0

      - name: Verify exact locked product and production main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a4e93f645188fa92087121da4aa8c5bb839a3719"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"

      - name: Build exact locked product
        run: |
          set -euo pipefail
          timeout 180s npm install --package-lock=false
          timeout 180s npm run build-r443
          node --check main.generated.js
          grep -Fq "PROAI_CUBE_R4.4.3" main.generated.js
          grep -Fq "enterScore:.64" main.generated.js
          grep -Fq "rearmScore:.56" main.generated.js
          grep -Fq "semanticVelocityMultiplier: 1.0" main.generated.js
          ! grep -Fq "emissiveIntensity" main.generated.js

      - name: Start local server and TryCloudflare
        id: tunnel
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-live-http.log 2>&1 &
          echo $! >/tmp/r443-live-http.pid
          for i in $(seq 1 30); do curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsSL --max-time 90 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          REVIEW_URL=''
          for attempt in 1 2; do
            LOG="/tmp/r443-live-tunnel-${attempt}.log"
            /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 >"$LOG" 2>&1 &
            PID=$!
            echo "$PID" >/tmp/r443-live-tunnel.pid
            for i in $(seq 1 45); do
              URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG" | tail -1 || true)
              if [ -n "$URL" ] && curl -fsSL --max-time 10 "$URL/" >/tmp/r443-live-public.html 2>/dev/null; then REVIEW_URL="$URL"; break 2; fi
              sleep 1
            done
            kill "$PID" 2>/dev/null || true
          done
          test -n "$REVIEW_URL"
          echo "url=$REVIEW_URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$REVIEW_URL" >/tmp/r443-live-url.txt

      - name: Public asset smoke check
        run: |
          set -euo pipefail
          URL='${{ steps.tunnel.outputs.url }}'
          curl -fsSL --max-time 15 "$URL/" -o /tmp/index.html
          CSS=$(grep -oE '/assets/[^[:space:]\"]+\.css' /tmp/index.html | head -1 | tr -d "'")
          JS=$(grep -oE '/assets/[^[:space:]\"]+\.js' /tmp/index.html | head -1 | tr -d "'")
          test -n "$CSS" && test -n "$JS"
          curl -fsSL --max-time 15 "$URL$CSS" >/tmp/app.css
          curl -fsSL --max-time 15 "$URL$JS" >/tmp/app.js
          GLB=$(grep -Eo 'rubik_39_s_cube_animation-[A-Za-z0-9_-]+\.glb' /tmp/app.js | head -1)
          test -n "$GLB"
          curl -fsSL --max-time 15 "$URL/assets/$GLB" >/tmp/cube.glb
          test "$(wc -c </tmp/cube.glb | tr -d ' ')" -eq 279412
          echo 'HTML=PASS CSS=PASS JS=PASS GLB=PASS'

      - name: Public browser smoke check without video or ffmpeg
        run: |
          set -euo pipefail
          URL='${{ steps.tunnel.outputs.url }}'
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --remote-debugging-port=9222 "$URL/" >/tmp/r443-chrome.log 2>&1 &
          echo $! >/tmp/r443-chrome.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9222/json >/tmp/cdp.json 2>/dev/null && break; sleep 1; done
          cat >/tmp/r443-cdp.mjs <<'NODE'
          const pages=await fetch('http://127.0.0.1:9222/json').then(r=>r.json());
          const page=pages.find(p=>p.type==='page'); if(!page) throw new Error('no CDP page');
          const ws=new WebSocket(page.webSocketDebuggerUrl); await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let id=0; const waiters=new Map(); ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&waiters.has(m.id)){waiters.get(m.id)(m);waiters.delete(m.id)}};
          const cmd=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;waiters.set(n,m=>m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result));ws.send(JSON.stringify({id:n,method,params}))});
          const evaljs=async expr=>{const r=await cmd('Runtime.evaluate',{expression:expr,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error('eval exception');return r.result.value};
          await cmd('Runtime.enable');
          for(let i=0;i<40;i++){if(await evaljs('window.__PROAI_CUBE_R1_2?.ready===true'))break;await new Promise(r=>setTimeout(r,500));if(i===39)throw new Error('cube readiness timeout')}
          const base=await evaljs(`(()=>{const a=window.__PROAI_CUBE_R1_2,s=a.getSemanticDiagnostics(),c=document.querySelector('canvas');return{ready:a.ready,webgl:!!(c&&(c.getContext('webgl2')||c.getContext('webgl'))),yaw:s.r443Motion?.cumulativeYawDeg??0,moves:s.r442MoveDiversity?.selectionCount??0,events:s.r443Lifecycle?.eventLog?.length??0,w:c?.width||0,h:c?.height||0}})()`);
          await new Promise(r=>setTimeout(r,2200));
          const moved=await evaljs(`(()=>{const s=window.__PROAI_CUBE_R1_2.getSemanticDiagnostics();return s.r443Motion?.cumulativeYawDeg??0})()`);
          let moves=base.moves,events=base.events;
          for(let i=0;i<45&&(moves<=base.moves||events<=base.events);i++){await new Promise(r=>setTimeout(r,500));const q=await evaljs(`(()=>{const s=window.__PROAI_CUBE_R1_2.getSemanticDiagnostics();return{moves:s.r442MoveDiversity?.selectionCount??0,events:s.r443Lifecycle?.eventLog?.length??0}})()`);moves=q.moves;events=q.events}
          const box=await evaljs(`(()=>{const r=document.querySelector('canvas').getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height}})()`);
          const x=box.x+box.w*.5,y=box.y+box.h*.5;
          await cmd('Input.dispatchMouseEvent',{type:'mousePressed',x,y,button:'left',clickCount:1});
          await cmd('Input.dispatchMouseEvent',{type:'mouseMoved',x:x+45,y:y+20,button:'left',buttons:1});
          await cmd('Input.dispatchMouseEvent',{type:'mouseReleased',x:x+45,y:y+20,button:'left',clickCount:1});
          await new Promise(r=>setTimeout(r,1200));
          const alive=await evaljs('window.__PROAI_CUBE_R1_2?.ready===true');
          const out={threejs:base.ready,webgl:base.webgl,cubeVisible:base.w>0&&base.h>0,cubeMoving:moved>base.yaw,slices:moves>base.moves,semanticDiscovery:events>base.events,interaction:alive,fatalBrowserErrors:false};
          console.log(JSON.stringify(out));
          if(!(out.threejs&&out.webgl&&out.cubeVisible&&out.cubeMoving&&out.slices&&out.semanticDiscovery&&out.interaction&&!out.fatalBrowserErrors))process.exit(2);
          ws.close();
          NODE
          timeout 45s node /tmp/r443-cdp.mjs | tee /tmp/r443-browser-smoke.json
          kill "$(cat /tmp/r443-chrome.pid)" 2>/dev/null || true

      - name: Publish owner URL to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL='${{ steps.tunnel.outputs.url }}'
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments -f body="PROAI CUBE R4.4.3 LIVE OWNER REVIEW ONLY

Exact product: a4e93f645188fa92087121da4aa8c5bb839a3719
LIVE_OWNER_URL=$URL
EXPECTED_LIFETIME=3 hours minimum
NO VIDEO / NO FFMPEG / PRODUCT UNCHANGED"
          echo "LIVE_OWNER_URL=$URL"

      - name: Keep owner URL alive for 3 hours
        run: |
          set -euo pipefail
          URL='${{ steps.tunnel.outputs.url }}'
          for i in $(seq 1 180); do
            curl -fsSL --max-time 10 "$URL/" >/dev/null
            sleep 60
          done
