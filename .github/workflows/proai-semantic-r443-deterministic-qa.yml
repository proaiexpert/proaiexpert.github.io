name: ProAI Cube R4.4.3 Deterministic QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: proai-r443-deterministic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic-qa:
    if: github.event.pull_request.head.ref == 'agent/proai-cube-semantic-brand-face-r4'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact product and main freeze
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a4e93f645188fa92087121da4aa8c5bb839a3719 HEAD
          test "$(git hash-object material-polish-r443-runtime.mjs)" = "56ba821cdacfd4558740eea7abd5be3d6bcad13f"
          test "$(git hash-object material-polish-r443-sequence-hotfix.mjs)" = "6cd3f0ce59f45aa1bbebd74c7989d2cb89855c97"
          test "$(git hash-object material-polish-r443-scheduler-hotfix.mjs)" = "713b911284cb065df341665a71e2ea906f6de1ee"
          test "$(git hash-object material-polish-r443-choreography-hotfix.mjs)" = "b9b5c7058018972b3fbee829132d537d255cd021"
          test "$(git hash-object material-polish-r443-candidate-dispersal-hotfix.mjs)" = "4dd2486ae48c5765e3f0bdf008bad2d207c71fe0"
          test "$(git hash-object package.json)" = "cb5c03020fc87115550ce070fa7260fd4872caf7"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "c945084e1952c05c686494091f7dbca0f7acdf08"
      - name: Build exact product first
        run: |
          set -euo pipefail
          timeout 180s npm install --package-lock=false
          timeout 180s npm run build-r443
          node --check main.generated.js
          grep -Fq "PROAI_CUBE_R4.4.3" main.generated.js
          grep -Fq "enterScore:.64" main.generated.js
          grep -Fq "rearmScore:.56" main.generated.js
          grep -Fq "function semanticR443FaceClearOfActiveTurns(face)" main.generated.js
          grep -Fq "semanticR443PendingResolutionCount===0" main.generated.js
          grep -Fq "activeTurns.values()" main.generated.js
          grep -Fq "requestedLength=semanticR443State.phase===SEMANTIC_R443_PHASE.READABLE_LOCK?1" main.generated.js
          grep -Fq "semanticR443PendingResolutionCount=Math.max(0,semanticR443PendingResolutionCount-1)" main.generated.js
          grep -Fq "semanticVelocityMultiplier: 1.0" main.generated.js
          grep -Fq "const deltaMs=wallDeltaMs" main.generated.js
          grep -Fq "overlayTextRendered:false" main.generated.js
          grep -Fq "alphaDominantReveal:false" main.generated.js
          grep -Fq "semanticMotionCoupled:false" main.generated.js
          grep -Fq "semanticOrientationForcing:false" main.generated.js
          ! grep -Fq "semanticR443ResetCandidate('active-slice')" main.generated.js
          ! grep -Fq "if(activeTurns.size>0)return;" main.generated.js
          ! grep -Fq "wallDeltaMs * semanticTimeScale" main.generated.js
          ! grep -Fq "SEMANTIC_R4_2_TEXT" main.generated.js
          ! grep -Fq "emissiveIntensity" main.generated.js
      - name: Prepare no-raster numerical QA build only
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='main.generated.js';
          let s=fs.readFileSync(p,'utf8');
          const re=/renderer\.render\(scene,\s*camera\);/g;
          const matches=[...s.matchAll(re)];
          if(matches.length!==2) throw new Error(`expected exactly two render calls, got ${matches.length}`);
          s=s.replace(re,'scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);');
          fs.writeFileSync(p,s);
          NODE
          test "$(grep -Foc 'scene.updateMatrixWorld(true); camera.updateMatrixWorld(true);' main.generated.js)" -eq 2
          ! grep -Eq 'renderer\.render\(scene,[[:space:]]*camera\);' main.generated.js
          timeout 120s npx vite build
          printf '%s\n' 'DETERMINISTIC_QA_ONLY: both raster calls suppressed; world matrices preserved' > review-evidence-r443-no-raster.txt
      - name: Install browser tooling
        run: |
          set -euo pipefail
          timeout 120s npm install --no-save playwright
          timeout 300s npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/.github/review/proai-cube-r443-deterministic-qa.mjs" ./r443-deterministic-qa.mjs
      - name: Start local numerical runtime
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/r443-det-http.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS --max-time 3 http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/r443-det-http.log
          exit 1
      - name: Run deterministic 60s simulation QA
        run: |
          set -euo pipefail
          timeout 120s node r443-deterministic-qa.mjs
      - name: Stamp current product SHA into deterministic evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -d review-evidence/r443-deterministic ]; then
            find review-evidence/r443-deterministic -type f \( -name '*.json' -o -name '*.txt' \) -print0 | xargs -0 -r sed -i 's/b5fdd9b53389c734ea85051fbd9fa16cd547e11b/a4e93f645188fa92087121da4aa8c5bb839a3719/g'
          fi
      - name: Upload deterministic metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r443-deterministic-qa
          path: |
            docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence/r443-deterministic/**
            docs/site-evolution/spline/proai-cube-semantic-brand-face-r4/review-evidence-r443-no-raster.txt
          retention-days: 2
