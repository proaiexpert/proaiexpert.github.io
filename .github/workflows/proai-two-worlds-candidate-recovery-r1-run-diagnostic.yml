name: ProAI Two Worlds Candidate Recovery R1 Run Diagnostic

on:
  push:
    branches:
      - agent/proai-two-worlds-candidate-recovery-r1
    paths:
      - .github/workflows/proai-two-worlds-candidate-recovery-r1-run-diagnostic.yml

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Publish hardened gallery run state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fproai-two-worlds-candidate-recovery-r1&per_page=30" >/tmp/runs.json
          python3 - <<'PY' >/tmp/diag.json
          import json
          d=json.load(open('/tmp/runs.json'))
          runs=[r for r in d.get('workflow_runs',[]) if r.get('name')=='ProAI Two Worlds Historical Candidate Recovery R1 Run']
          if not runs:
              out={'state':'error','target_url':'https://github.com/proaiexpert/proaiexpert.github.io/actions','description':'Hardened gallery run not found','context':'two-worlds-recovery-r1-run-diagnostic'}
          else:
              r=runs[0]; st=r.get('status'); co=r.get('conclusion'); state='pending' if st!='completed' else ('success' if co=='success' else 'error')
              out={'state':state,'target_url':r.get('html_url'),'description':f"run {r.get('id')} {st}/{co or '-'}"[:140],'context':'two-worlds-recovery-r1-run-diagnostic'}
          print(json.dumps(out))
          PY
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/diag.json >/dev/null
