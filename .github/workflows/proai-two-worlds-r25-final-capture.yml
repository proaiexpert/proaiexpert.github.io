name: ProAI Two Worlds R2.5 Final Controlled Capture

on:
  push:
    branches:
      - agent/proai-two-worlds-r25-final-capture
    paths:
      - '.github/workflows/proai-two-worlds-r25-final-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm --silent --no-save install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build exact R2.5 review harness
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const out='docs/site-evolution/two-worlds-bimetal-fold-r2/review';
          fs.mkdirSync(out,{recursive:true});
          const css=fs.readFileSync('assets/css/homepage-two-worlds-r25.css','utf8');
          const js=fs.readFileSync('assets/js/homepage-two-worlds-r25.js','utf8');
          function page(lang){
            const ru=lang==='ru';
            const markup=fs.readFileSync(`_includes/homepage-two-worlds-r2-${ru?'ru':'en'}.html`,'utf8');
            return `<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>R2.5 ${lang.toUpperCase()}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><style>html{scroll-behavior:auto;background:#020304}body{margin:0;background:#020304;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}${css}</style></head><body class="${ru?'lang-ru':'lang-en'}">${markup}<script>${js}<\/script></body></html>`;
          }
          fs.writeFileSync(path.join(out,'live.html'),page('en'));
          fs.writeFileSync(path.join(out,'live-ru.html'),page('ru'));
          NODE
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/r25-http.log 2>&1 &
          sleep 2
      - name: QA and real JPEG captures
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),{chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const base='http://127.0.0.1:4173/docs/site-evolution/two-worlds-bimetal-fold-r2/review';
            const out=path.resolve('docs/site-evolution/two-worlds-bimetal-fold-r2/review/captures-r25');
            fs.mkdirSync(out,{recursive:true});
            const errors=[],results=[];
            async function open(lang,w,h){
              const ctx=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1,reducedMotion:'no-preference'});
              const page=await ctx.newPage(),consoleErrors=[];
              page.on('console',m=>{ if(m.type()==='error'||/ResizeObserver loop/i.test(m.text())) consoleErrors.push(m.text()); });
              page.on('pageerror',e=>consoleErrors.push(String(e)));
              await page.goto(`${base}/${lang==='ru'?'live-ru':'live'}.html`,{waitUntil:'load'});
              await page.evaluate(()=>document.fonts&&document.fonts.ready);
              await page.waitForTimeout(300);
              return {ctx,page,consoleErrors};
            }
            async function expInfo(page){
              return page.evaluate(()=>{const e=document.querySelector('[data-tw-experience]');return {top:e.offsetTop,travel:Math.max(1,e.offsetHeight-innerHeight)};});
            }
            async function mobileProgress(page,p){
              const x=await expInfo(page); await page.evaluate(({y})=>scrollTo(0,y),{y:x.top+x.travel*p}); await page.waitForTimeout(360);
            }
            async function desktopState(page,state){
              const box=await page.locator('[data-tw-viewport]').boundingBox();
              await page.locator('[data-tw-experience]').scrollIntoViewIfNeeded();
              const b=await page.locator('[data-tw-viewport]').boundingBox();
              const pct=state==='ai'?.24:(state==='web'?.76:.50);
              await page.mouse.move(b.x+b.width*pct,b.y+b.height*.48);
              await page.waitForTimeout(state==='neutral'?700:1300);
            }
            async function metric(page,label){
              return page.evaluate(label=>{
                const s=document.querySelector('[data-tw-r2]'),vp=s.querySelector('[data-tw-viewport]');
                const ai=s.querySelector('.tw-r2__content--ai'),web=s.querySelector('.tw-r2__content--web');
                const aie=s.querySelector('.tw-r2__inscription--ai'),webe=s.querySelector('.tw-r2__inscription--web');
                function v(n){const c=getComputedStyle(n);return {op:+c.opacity,tr:c.transform,rect:n.getBoundingClientRect().toJSON()};}
                return {label,dpr:devicePixelRatio,zoom:visualViewport?visualViewport.scale:1,sw:document.documentElement.scrollWidth,iw:innerWidth,ih:innerHeight,focus:s.dataset.focus,progress:+(getComputedStyle(s).getPropertyValue('--tw-mobile-progress')||0),ai:v(ai),web:v(web),aie:v(aie),webe:v(webe)};
              },label);
            }
            // Full QA matrix.
            for(const lang of ['en','ru']){
              for(const [w,h] of [[1280,800],[1440,900],[1728,1117]]){
                for(const st of ['neutral','ai','web']){
                  const {ctx,page,consoleErrors}=await open(lang,w,h); await desktopState(page,st); const m=await metric(page,`${lang}-${w}x${h}-${st}`); results.push(m);
                  if(m.dpr!==1||Math.abs(m.zoom-1)>.001) errors.push(`${m.label}: scale`);
                  if(m.sw>w+1) errors.push(`${m.label}: overflow ${m.sw}`);
                  const titles=await page.locator('.tw-r2__world-title').evaluateAll(ns=>ns.map(n=>[...n.querySelectorAll('.tw-r2__title-line')].map(x=>x.getClientRects().length)));
                  if(titles.some(t=>t.length!==2||t.some(n=>n!==1))) errors.push(`${m.label}: title wrap`);
                  if(consoleErrors.length) errors.push(`${m.label}: console ${consoleErrors.join('|')}`);
                  await ctx.close();
                }
              }
              for(const [w,h] of [[390,844],[430,932],[844,390],[932,430]]){
                for(const [name,p] of [['ai',0],['release',.18],['turn',.50],['arrival',.83],['web',1]]){
                  const {ctx,page,consoleErrors}=await open(lang,w,h); await mobileProgress(page,p); const m=await metric(page,`${lang}-${w}x${h}-${name}`); results.push(m);
                  if(m.dpr!==1||Math.abs(m.zoom-1)>.001) errors.push(`${m.label}: scale`);
                  if(m.sw>w+1) errors.push(`${m.label}: overflow ${m.sw}`);
                  if(name==='turn'&&(m.ai.op>.02||m.web.op>.02||m.aie.op>.02||m.webe.op>.02)) errors.push(`${m.label}: text visible in pure turn`);
                  if(name==='release'&&m.ai.op>0&&/matrix3d/.test(m.ai.tr)) errors.push(`${m.label}: AI text perspective squeeze`);
                  if(name==='arrival'&&m.web.op>0&&/matrix3d/.test(m.web.tr)) errors.push(`${m.label}: Web text perspective squeeze`);
                  if(consoleErrors.length) errors.push(`${m.label}: console ${consoleErrors.join('|')}`);
                  await ctx.close();
                }
              }
            }
            // Required controlled screenshots, EN to keep one directly comparable set; live RU/EN remain available.
            for(const [n,st] of [['01-laptop-neutral-1440x900.jpg','neutral'],['02-laptop-ai-active-1440x900.jpg','ai'],['03-laptop-web-active-1440x900.jpg','web']]){
              const {ctx,page}=await open('en',1440,900); await desktopState(page,st); await page.screenshot({path:path.join(out,n),type:'jpeg',quality:90,fullPage:false}); await ctx.close();
            }
            const seq=[['04-portrait-ai-settled-390x844.jpg',0],['05-portrait-ai-release-390x844.jpg',.18],['06-portrait-pure-material-turn-390x844.jpg',.50],['07-portrait-web-arrival-390x844.jpg',.83],['08-portrait-web-settled-390x844.jpg',1]];
            for(const [n,p] of seq){const {ctx,page}=await open('en',390,844);await mobileProgress(page,p);await page.screenshot({path:path.join(out,n),type:'jpeg',quality:90,fullPage:false});await ctx.close();}
            for(const [n,p] of [['09-landscape-ai-844x390.jpg',0],['10-landscape-web-844x390.jpg',1]]){const {ctx,page}=await open('en',844,390);await mobileProgress(page,p);await page.screenshot({path:path.join(out,n),type:'jpeg',quality:90,fullPage:false});await ctx.close();}
            const report={status:errors.length?'FAIL':'PASS',browserZoom:'100%',deviceScaleFactor:1,errors,observerAudit:{mutationObservers:0,resizeObservers:0,globalScrollHandlers:1,pointerMoveHandlers:1,pointerLeaveHandlers:1},results};
            fs.writeFileSync(path.join(out,'qa-r25.json'),JSON.stringify(report,null,2));
            const shots=[
              ['LAPTOP — 01 Neutral 50/50','01-laptop-neutral-1440x900.jpg','1440 × 900'],['LAPTOP — 02 AI Active','02-laptop-ai-active-1440x900.jpg','1440 × 900 · settled'],['LAPTOP — 03 Web Active','03-laptop-web-active-1440x900.jpg','1440 × 900 · settled'],
              ['PORTRAIT — 04 AI Settled','04-portrait-ai-settled-390x844.jpg','390 × 844'],['PORTRAIT — 05 AI Content Release','05-portrait-ai-release-390x844.jpg','390 × 844'],['PORTRAIT — 06 Pure Material Turn','06-portrait-pure-material-turn-390x844.jpg','390 × 844 · no readable text'],['PORTRAIT — 07 Web Content Arrival','07-portrait-web-arrival-390x844.jpg','390 × 844'],['PORTRAIT — 08 Web Settled','08-portrait-web-settled-390x844.jpg','390 × 844'],
              ['LANDSCAPE — 09 AI','09-landscape-ai-844x390.jpg','844 × 390'],['LANDSCAPE — 10 Web','10-landscape-web-844x390.jpg','844 × 390']
            ];
            const cards=shots.map(([t,n,s])=>`<figure class="shot ${n.includes('portrait')?'portrait':n.includes('landscape')?'landscape':''}"><figcaption><b>${t}</b><span>${s}</span></figcaption><img src="captures-r25/${n}" alt="${t}"></figure>`).join('');
            fs.writeFileSync('docs/site-evolution/two-worlds-bimetal-fold-r2/review/index.html',`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R2.5 Owner Review</title><style>*{box-sizing:border-box}:root{color-scheme:dark}html,body{margin:0;background:#030405;color:#f2f0eb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{width:min(calc(100% - 24px),1480px);margin:auto;padding:36px 0 82px}.k{color:#747c84;font:700 10px/1.4 ui-monospace,monospace;letter-spacing:.16em}h1{margin:10px 0 16px;font-size:clamp(38px,6vw,72px);line-height:.95;letter-spacing:-.052em;font-weight:620}.lede{max-width:900px;color:#969da4;line-height:1.6;margin-bottom:42px}.shot{margin:0 0 46px}.shot figcaption{display:flex;justify-content:space-between;gap:16px;margin-bottom:10px;color:#b8bec3;font:700 10px/1.3 ui-monospace,monospace;letter-spacing:.06em}.shot img{display:block;width:100%;height:auto;border:1px solid #1b2126;background:#050607}.portrait img{width:min(100%,390px);margin:auto}.landscape img{width:min(100%,844px);margin:auto}.a{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}.a a{display:flex;min-height:54px;align-items:center;justify-content:center;border:1px solid #343b42;color:#fff;text-decoration:none;font-weight:700}@media(max-width:700px){.shot figcaption{display:block}.shot figcaption span{display:block;margin-top:4px}.a{grid-template-columns:1fr}}</style></head><body><main class="w"><p class="k">PROAI EXPERT / TWO WORLDS / BIMETAL FOLD R2.5</p><h1>Clean motion recovery.</h1><p class="lede">Authoritative single-layer runtime. Real Chromium captures · browser zoom 100% · deviceScaleFactor 1 · QA ${report.status}. Portrait sequence proves: text releases → pure material turns → text arrives.</p>${cards}<div class="a"><a href="live-ru.html">LIVE RU →</a><a href="live.html">LIVE EN →</a></div></main></body></html>`);
            await browser.close(); if(errors.length){console.error(errors.join('\n'));process.exit(1);}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit generated review proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/site-evolution/two-worlds-bimetal-fold-r2/review
          git commit -m "review: generated R2.5 final controlled proof"
          git push origin HEAD:agent/proai-two-worlds-r25-final-capture
