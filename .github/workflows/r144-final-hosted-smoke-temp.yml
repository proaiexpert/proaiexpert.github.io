name: R1.4.4 FINAL Hosted Smoke Temporary

on:
  push:
    branches:
      - connected-system-preview
    paths:
      - .github/workflows/r144-final-hosted-smoke-temp.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Run calibrated hosted Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r144-final/snapshots
          cd /tmp/r144-final
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          export CHROME
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'fs';
          import crypto from 'crypto';

          const host='https://connected-system-preview.proaiexpert-github-io.pages.dev';
          const urls={en:`${host}/owner-preview/connected-system-r142/`,ru:`${host}/owner-preview/connected-system-r142/ru/`};
          const expected={js:'75329523b30c19dd3ef01d7ab147e6a0436afddf',css:'1ce5b058785ab0e5831860a1f11e25045640270c'};
          const viewports=[[390,844],[360,800],[844,390]];
          const report={assets:{},routes:{},cases:[],failures:[]};
          const fail=m=>{report.failures.push(m);console.error('FAIL',m)};
          const check=(v,m)=>{if(!v)fail(m);return !!v};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function gitBlobSha(buf){return crypto.createHash('sha1').update(Buffer.from(`blob ${buf.length}\0`)).update(buf).digest('hex')}
          async function fetchText(url){const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(12000)});return {status:r.status,text:await r.text()}}
          async function fetchBlob(path){const r=await fetch(`${host}${path}?qa=${Date.now()}`,{cache:'no-store',signal:AbortSignal.timeout(12000)});const b=Buffer.from(await r.arrayBuffer());return {status:r.status,sha:gitBlobSha(b),bytes:b.length}}

          try{
            report.assets.js=await fetchBlob('/assets/js/homepage-connected-system-r142.js');
            report.assets.css=await fetchBlob('/assets/css/homepage-connected-system-r142.css');
            check(report.assets.js.status===200,'hosted JS HTTP != 200');
            check(report.assets.css.status===200,'hosted CSS HTTP != 200');
            check(report.assets.js.sha===expected.js,`hosted JS blob mismatch ${report.assets.js.sha}`);
            check(report.assets.css.sha===expected.css,`hosted CSS blob mismatch ${report.assets.css.sha}`);
            for(const [lang,url] of Object.entries(urls)){
              const r=await fetchText(`${url}?qa=${Date.now()}`);
              report.routes[lang]={status:r.status,r144:/R1\.4\.4 Full-page Review/i.test(r.text),hero:r.text.includes('id="hero"'),connected:r.text.includes('id="connected-system-next"'),two:r.text.includes('id="two-worlds-golden-r1"'),adapter:r.text.includes('full-preview-r144')};
              check(r.status===200,`${lang} HTTPS HTTP ${r.status}`);
              check(report.routes[lang].r144&&report.routes[lang].adapter,`${lang} hosted adapter not R1.4.4`);
              check(report.routes[lang].hero&&report.routes[lang].connected&&report.routes[lang].two,`${lang} full-page sequence missing`);
            }
          }catch(e){fail(`hosted fetch exception ${e.stack||e}`)}

          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-gpu']});

          async function geom(page){return page.evaluate(()=>{
            const root=document.querySelector('[data-connected-next]'),artifact=root?.querySelector('[data-context-artifact]'),plate=root?.querySelector('.ledger-plate.is-active');
            const r=plate?.getBoundingClientRect(),vv=window.visualViewport,top0=vv?vv.offsetTop:0,vh=vv?vv.height:innerHeight;
            const low=matchMedia('(max-height:520px) and (min-width:701px)').matches,portrait=matchMedia('(max-width:700px)').matches;
            let band;if(low)band={top:top0+8,bottom:top0+vh-10};else if(portrait){const ab=artifact.getBoundingClientRect().bottom,gt=Math.min(top0+vh*.58,ab+8);band={top:Math.max(top0+8,gt),bottom:top0+vh-16}}else band={top:top0,bottom:top0+vh};
            const d=plate?.querySelector('.ledger-detail')?.getBoundingClientRect(),c=plate?.querySelector('.ledger-components')?.getBoundingClientRect(),inside=x=>!x||(x.top>=band.top-.5&&x.bottom<=band.bottom+.5);
            const full=!!r&&r.top>=band.top-.5&&r.bottom<=band.bottom+.5&&inside(d)&&inside(c);
            const az=root?.querySelector('.artifact-zone'),lz=root?.querySelector('.ledger-zone');
            return {state:Number(root?.dataset.activeStage),reading:root?.dataset.readingWindow||'',plateau:root?.classList.contains('is-result-plateau'),gesture:root?.dataset.gestureSession||null,full,band,plate:r?{top:r.top,bottom:r.bottom,left:r.left,right:r.right,height:r.height}:null,scrollY,inner:{w:innerWidth,h:innerHeight},z:{artifact:Number(getComputedStyle(az).zIndex)||0,ledger:Number(getComputedStyle(lz).zIndex)||0}};
          })}

          async function structure(page){return page.evaluate(()=>{
            const h=document.querySelector('#hero'),c=document.querySelector('#connected-system-next'),t=document.querySelector('#two-worlds-golden-r1');const top=e=>scrollY+e.getBoundingClientRect().top,bottom=e=>scrollY+e.getBoundingClientRect().bottom;
            return {heroBottom:bottom(h),connectedTop:top(c),connectedBottom:bottom(c),twoTop:top(t),gapHC:top(c)-bottom(h),gapCT:top(t)-bottom(c)};
          })}

          async function overflowInfo(page){return page.evaluate(()=>{
            const doc=document.documentElement,root=document.querySelector('[data-connected-next]');
            const all=[...document.querySelectorAll('body *')].map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {e,r,s}}).filter(x=>x.s.display!=='none'&&x.s.visibility!=='hidden'&&x.r.width>1&&x.r.height>1&&(x.r.right>innerWidth+1||x.r.left<-1));
            const fmt=x=>({tag:x.e.tagName.toLowerCase(),id:x.e.id||'',cls:String(x.e.className||'').slice(0,120),left:Math.round(x.r.left*10)/10,right:Math.round(x.r.right*10)/10,inConnected:!!x.e.closest?.('[data-connected-next]')});
            return {documentOverflow:doc.scrollWidth-doc.clientWidth,rootScrollOverflow:root.scrollWidth-root.clientWidth,connectedOffenders:all.filter(x=>x.e.closest?.('[data-connected-next]')).slice(0,12).map(fmt),allOffenders:all.slice(0,12).map(fmt)};
          })}

          async function centerStage(page,state){
            await page.evaluate(s=>{const b=document.querySelector(`[data-stage-button="${s}"]`);b?.click();b?.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'})},state);
            await sleep(180);
            for(let i=0;i<5;i++){
              const g=await geom(page);if(g.full)return g;
              if(!g.plate)break;
              let delta=0;if(g.plate.top<g.band.top)delta=-(g.band.top-g.plate.top+14);else if(g.plate.bottom>g.band.bottom)delta=g.plate.bottom-g.band.bottom+14;
              if(!delta)break;
              await page.evaluate(d=>scrollBy(0,d),delta);await sleep(70);
            }
            return geom(page);
          }

          async function minNeed(page,state){return page.evaluate(s=>{const low=matchMedia('(max-height:520px) and (min-width:701px)').matches,portrait=matchMedia('(max-width:700px)').matches,vv=window.visualViewport,h=vv?vv.height:innerHeight,w=vv?vv.width:innerWidth,cl=(v,a,b)=>Math.max(a,Math.min(b,v));if(low)return cl(w*(s===1?.22:s===4?.20:.19),138,210);if(portrait)return cl(h*(s===1?.27:s===4?.24:.23),150,245);return 0},state)}

          async function beginTrack(page){await page.evaluate(()=>{const root=document.querySelector('[data-connected-next]');window.__r144T=[];window.__r144O?.disconnect?.();window.__r144O=new MutationObserver(()=>window.__r144T.push(Number(root.dataset.activeStage)));window.__r144O.observe(root,{attributes:true,attributeFilter:['data-active-stage']});window.dispatchEvent(new Event('touchstart'))})}
          async function endTrack(page,dir){await page.evaluate(d=>{window.dispatchEvent(new Event('touchend'));scrollBy(0,d*72)},dir);await sleep(130);const mid=await geom(page);await sleep(420);const transitions=await page.evaluate(()=>window.__r144T||[]);return {mid,end:await geom(page),transitions:[...new Set(transitions)]}}

          async function forwardTransition(page,state){
            const start=await centerStage(page,state);await sleep(950);const need=await minNeed(page,state);await beginTrack(page);
            await page.evaluate(()=>scrollBy(0,2));await sleep(45);const anchor=await geom(page);let changed=null;
            for(let i=0;i<100;i++){await page.evaluate(()=>scrollBy(0,24));await sleep(18);const g=await geom(page);if(g.state===state+1){changed=g;break}}
            if(changed){for(let i=0;i<8;i++){await page.evaluate(()=>scrollBy(0,30));await sleep(14)}}
            const held=await geom(page),tail=await endTrack(page,1),travel=changed?changed.scrollY-anchor.scrollY:null;
            return {start,need,anchor,changed,travel,held,...tail};
          }

          async function reverseTransition(page){
            const start=await centerStage(page,4);await sleep(950);await beginTrack(page);await page.evaluate(()=>scrollBy(0,-2));await sleep(45);let changed=null;
            for(let i=0;i<100;i++){await page.evaluate(()=>scrollBy(0,-24));await sleep(18);const g=await geom(page);if(g.state===3){changed=g;break}}
            if(changed){for(let i=0;i<8;i++){await page.evaluate(()=>scrollBy(0,-30));await sleep(14)}}
            const held=await geom(page),tail=await endTrack(page,-1);return {start,changed,held,...tail};
          }

          async function plateau(page){const start=await centerStage(page,4);await sleep(950);await page.evaluate(()=>{window.dispatchEvent(new Event('touchstart'));scrollBy(0,2)});await sleep(60);await page.evaluate(()=>scrollBy(0,Math.round(innerHeight*.10)));await sleep(100);const mid=await geom(page);await page.evaluate(()=>window.dispatchEvent(new Event('touchend')));await sleep(430);return {start,mid,end:await geom(page)}}

          async function handoff(page){await page.evaluate(()=>{const t=document.querySelector('#two-worlds-golden-r1');scrollTo(0,scrollY+t.getBoundingClientRect().top+2)});await sleep(120);return page.evaluate(()=>{const c=document.querySelector('#connected-system-next').getBoundingClientRect(),st=document.querySelector('.connected-next__sticky-stage').getBoundingClientRect(),t=document.querySelector('#two-worlds-golden-r1').getBoundingClientRect();return {connectedBottom:c.bottom,stickyTop:st.top,stickyBottom:st.bottom,twoTop:t.top,overlap:Math.max(0,Math.min(st.bottom,t.bottom)-Math.max(st.top,t.top))}})}

          for(const [lang,url] of Object.entries(urls))for(const [w,h] of viewports){
            const context=await browser.newContext({viewport:{width:w,height:h},isMobile:false,hasTouch:true,deviceScaleFactor:1});const page=await context.newPage();page.setDefaultTimeout(5000);const errors=[];page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});page.on('pageerror',e=>errors.push(`page:${e}`));
            const c={lang,w,h,forward:[],errors};report.cases.push(c);
            try{
              const r=await page.goto(`${url}?qa=cal-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:15000});await page.waitForSelector('[data-connected-next]');await page.evaluate(()=>document.fonts?.ready);await sleep(900);
              c.http=r?.status();c.title=await page.title();c.structure=await structure(page);c.overflow=await overflowInfo(page);
              check(c.http===200,`${lang} ${w}x${h} browser HTTP ${c.http}`);check(/R1\.4\.4 Full-page Review/i.test(c.title),`${lang} ${w}x${h} wrong title`);check(Math.abs(c.structure.gapHC)<1.1,`${lang} ${w}x${h} Hero→Connected gap ${c.structure.gapHC}`);check(Math.abs(c.structure.gapCT)<1.1,`${lang} ${w}x${h} Connected→Two gap ${c.structure.gapCT}`);
              check(c.overflow.connectedOffenders.length===0,`${lang} ${w}x${h} Connected viewport overflow offenders ${JSON.stringify(c.overflow.connectedOffenders)}`);

              for(const state of [1,2,3]){
                const t=await forwardTransition(page,state);c.forward.push({state,...t});
                check(t.start.full,`${lang} ${w}x${h} Stage0${state} not fully readable before advance ${JSON.stringify(t.start)}`);
                check(!!t.changed&&t.changed.state===state+1,`${lang} ${w}x${h} Stage${state} did not advance adjacent to ${state+1}`);
                check(t.travel!=null&&t.travel>=t.need-3,`${lang} ${w}x${h} Stage${state} advanced before physical travel need=${t.need} actual=${t.travel}`);
                check(t.held.state===state+1,`${lang} ${w}x${h} same-touch continuation advanced past ${state+1}`);
                check(t.mid.state===state+1,`${lang} ${w}x${h} immediate post-touch continuation advanced past ${state+1}`);
                check(t.transitions.length<=1&&t.transitions[0]===state+1,`${lang} ${w}x${h} one gesture transitions ${JSON.stringify(t.transitions)}`);
                const arrived=await centerStage(page,state+1);check(arrived.full,`${lang} ${w}x${h} Stage0${state+1} full read window unavailable ${JSON.stringify(arrived)}`);
              }

              c.plateau=await plateau(page);check(c.plateau.start.full,`${lang} ${w}x${h} Stage04 not fully readable`);check(c.plateau.mid.state===4&&c.plateau.mid.full,`${lang} ${w}x${h} RESULT final dwell lost`);check(c.plateau.mid.plateau,`${lang} ${w}x${h} RESULT plateau missing`);check(c.plateau.mid.z.ledger>c.plateau.mid.z.artifact,`${lang} ${w}x${h} RESULT under-artifact occlusion risk ${JSON.stringify(c.plateau.mid.z)}`);
              c.reverse=await reverseTransition(page);check(c.reverse.start.full,`${lang} ${w}x${h} reverse Stage04 unreadable`);check(c.reverse.changed?.state===3,`${lang} ${w}x${h} reverse did not reach adjacent Stage03`);check(c.reverse.held.state===3&&c.reverse.mid.state===3,`${lang} ${w}x${h} reverse chatter/skip`);check(c.reverse.transitions.length<=1&&c.reverse.transitions[0]===3,`${lang} ${w}x${h} reverse transitions ${JSON.stringify(c.reverse.transitions)}`);

              for(const s of [1,3,4]){const g=await centerStage(page,s);check(g.full,`${lang} ${w}x${h} screenshot Stage${s} not full`);await page.screenshot({path:`snapshots/${lang}-${w}x${h}-s${s}.png`})}
              c.handoff=await handoff(page);check(c.handoff.overlap<1,`${lang} ${w}x${h} sticky overlaps Two Worlds ${JSON.stringify(c.handoff)}`);check(errors.length===0,`${lang} ${w}x${h} console/page errors ${JSON.stringify(errors)}`);
            }catch(e){fail(`${lang} ${w}x${h} verifier exception ${e.stack||e}`)}
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('qa-result.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          if(report.failures.length){console.error(`R1.4.4 CALIBRATED HOSTED SMOKE FAIL count=${report.failures.length}`);process.exit(1)}
          console.log('R1.4.4 CALIBRATED HOSTED SMOKE PASS');
          NODE
          node smoke.mjs

      - name: Upload hosted smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r144-final-hosted-smoke-evidence-calibrated
          path: |
            /tmp/r144-final/qa-result.json
            /tmp/r144-final/snapshots/*.png
          if-no-files-found: warn
          retention-days: 3
