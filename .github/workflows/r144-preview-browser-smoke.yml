name: R1.4.4 Preview Browser Smoke
on:
  push:
    branches: [connected-system-preview]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Diagnose hosted Chromium mobile smoke
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/r144-smoke && cd /tmp/r144-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          export CHROME
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core'; import fs from 'fs';
          const urls={en:'https://connected-system-preview.proaiexpert-github-io.pages.dev/owner-preview/connected-system-r142/',ru:'https://connected-system-preview.proaiexpert-github-io.pages.dev/owner-preview/connected-system-r142/ru/'};const V=[[390,844],[360,800],[844,390]],out=[];
          if(!process.env.CHROME){fs.writeFileSync('result.txt','HARNESS_FAIL no chrome\n');process.exit(0)}
          const b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          async function select(p,s){await p.evaluate(s=>document.querySelector(`[data-stage-button="${s}"]`)?.click(),s);await p.waitForTimeout(450)}
          async function swipe(p,w,h,d){const c=await p.context().newCDPSession(p),x=Math.round(w*.5),a=d==='up'?Math.round(h*.8):Math.round(h*.2),z=d==='up'?Math.round(h*.2):Math.round(h*.8);await c.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y:a}]});for(let i=1;i<=7;i++){await c.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y:Math.round(a+(z-a)*i/7)}]});await p.waitForTimeout(24)}await c.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await p.waitForTimeout(850)}
          for(const [lang,url] of Object.entries(urls))for(const [w,h]of V){const c=await b.newContext({viewport:{width:w,height:h},isMobile:true,hasTouch:true,deviceScaleFactor:1}),p=await c.newPage(),errs=[];p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});p.on('pageerror',e=>errs.push(String(e)));try{const r=await p.goto(url,{waitUntil:'domcontentloaded',timeout:25000});await p.waitForSelector('[data-connected-next]');out.push(`${lang} ${w}x${h} HTTP ${r?.status()}`);for(const s of [1,2,3,4]){await select(p,s);out.push(`${lang} ${w}x${h} S${s} `+JSON.stringify(await p.evaluate(()=>{const q=document.querySelector('.ledger-plate.is-active')?.getBoundingClientRect();return{state:+document.querySelector('[data-connected-next]').dataset.activeStage,top:q?.top,bottom:q?.bottom,h:innerHeight,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}})))}await select(p,1);await p.waitForTimeout(1500);await swipe(p,w,h,'up');const f=+await p.locator('[data-connected-next]').getAttribute('data-active-stage');await select(p,4);await p.waitForTimeout(1500);await swipe(p,w,h,'down');const rv=+await p.locator('[data-connected-next]').getAttribute('data-active-stage');await select(p,4);await p.waitForTimeout(1500);await p.evaluate(()=>scrollBy(0,Math.round(innerHeight*.10)));await p.waitForTimeout(300);const pl=await p.evaluate(()=>{const q=document.querySelector('.ledger-plate.is-active')?.getBoundingClientRect();return{state:+document.querySelector('[data-connected-next]').dataset.activeStage,top:q?.top,bottom:q?.bottom,h:innerHeight}});out.push(`${lang} ${w}x${h} FWD=${f} REV=${rv} PLATEAU=${JSON.stringify(pl)} ERRORS=${JSON.stringify(errs)}`)}catch(e){out.push(`${lang} ${w}x${h} EXCEPTION ${e.stack||e}`)}await c.close()}await b.close();fs.writeFileSync('result.txt',out.join('\n')+'\n');
          NODE
          node smoke.mjs || true
          cat result.txt
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r144-smoke-result
          path: /tmp/r144-smoke/result.txt
          if-no-files-found: error
