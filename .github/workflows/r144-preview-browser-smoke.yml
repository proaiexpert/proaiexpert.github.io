name: R1.4.4 Preview Browser Smoke
on:
  push:
    branches: [connected-system-preview]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Hosted Chromium mobile smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r144-smoke && cd /tmp/r144-smoke
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          export CHROME
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          const urls={en:'https://connected-system-preview.proaiexpert-github-io.pages.dev/owner-preview/connected-system-r142/',ru:'https://connected-system-preview.proaiexpert-github-io.pages.dev/owner-preview/connected-system-r142/ru/'};
          const viewports=[[390,844],[360,800],[844,390]];
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const failures=[];
          async function select(page,s){await page.evaluate(s=>document.querySelector(`[data-stage-button="${s}"]`)?.click(),s);await page.waitForTimeout(450)}
          async function swipe(page,w,h,dir){const c=await page.context().newCDPSession(page);const x=Math.round(w*.5),a=dir==='up'?Math.round(h*.80):Math.round(h*.20),b=dir==='up'?Math.round(h*.20):Math.round(h*.80);await c.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y:a}]});for(let i=1;i<=7;i++){await c.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y:Math.round(a+(b-a)*i/7)}]});await page.waitForTimeout(24)}await c.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await page.waitForTimeout(850)}
          for(const [lang,url] of Object.entries(urls)) for(const [w,h] of viewports){const ctx=await browser.newContext({viewport:{width:w,height:h},isMobile:true,hasTouch:true,deviceScaleFactor:1});const page=await ctx.newPage();const errs=[];page.on('console',m=>{if(m.type()==='error')errs.push(m.text())});page.on('pageerror',e=>errs.push(String(e)));try{const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});await page.waitForSelector('[data-connected-next]');if(r?.status()!==200)throw Error(`HTTP ${r?.status()}`);for(const s of [1,2,3,4]){await select(page,s);const g=await page.evaluate(()=>{const a=document.querySelector('.ledger-plate.is-active')?.getBoundingClientRect();return{state:+document.querySelector('[data-connected-next]').dataset.activeStage,top:a?.top,bottom:a?.bottom,h:innerHeight,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(g.state!==s||g.overflow!==0||g.top< -1||g.bottom>g.h+1)throw Error(`stage${s} ${JSON.stringify(g)}`)}await select(page,1);await page.waitForTimeout(1500);await swipe(page,w,h,'up');const fwd=+await page.locator('[data-connected-next]').getAttribute('data-active-stage');if(fwd>2)throw Error(`forward skipped ${fwd}`);await select(page,4);await page.waitForTimeout(1500);await swipe(page,w,h,'down');const rev=+await page.locator('[data-connected-next]').getAttribute('data-active-stage');if(rev<3)throw Error(`reverse skipped ${rev}`);await select(page,4);await page.waitForTimeout(1500);await page.evaluate(()=>scrollBy(0,Math.round(innerHeight*.10)));await page.waitForTimeout(300);const p=await page.evaluate(()=>{const a=document.querySelector('.ledger-plate.is-active')?.getBoundingClientRect();return{state:+document.querySelector('[data-connected-next]').dataset.activeStage,top:a?.top,bottom:a?.bottom,h:innerHeight}});if(p.state!==4||p.top< -1||p.bottom>p.h+1)throw Error(`plateau ${JSON.stringify(p)}`);if(errs.length)throw Error(`console ${errs.join(' | ')}`);console.log(`PASS ${lang} ${w}x${h} fwd=${fwd} rev=${rev}`)}catch(e){failures.push(`${lang} ${w}x${h}: ${e.message}`)}await ctx.close()}
          await browser.close();if(failures.length){console.error(failures.join('\n'));process.exit(1)}console.log('R1.4.4 HOSTED MOBILE SMOKE PASS');
          NODE
          node smoke.mjs
