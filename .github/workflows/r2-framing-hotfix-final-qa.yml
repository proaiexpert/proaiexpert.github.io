name: R2 framing hotfix final QA

on:
  push:
    branches:
      - agent/proai-cube-r2-zero-drift-framing-hotfix

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Static protection and source-identity gates
        shell: bash
        run: |
          node --check assets/js/proai-hero-cube-r1/source-materials-r1.js
          node --check assets/brand/proai-logo-r341/live-runtime.js
          node scripts/verify-proai-cube-integrity-r2.mjs
          GLB_SHA=$(sha256sum assets/models/proai-cube/proai-cube-r1.glb | awk '{print toupper($1)}')
          echo "GLB_SHA256=$GLB_SHA"
          test "$GLB_SHA" = "2A97D4671F5AED2E23E5688081C53E1E234A525CF145C6A89BA4C9909FB2B480"
          cp provenance/proai-cube/r1/integrity-manifest.json /tmp/bad-manifest.json
          python3 - <<'PY'
          import json
          p='/tmp/bad-manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          d['hashes']['assets/models/proai-cube/proai-cube-r1.glb']='0'*64
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2)+'\n')
          PY
          if PROAI_CUBE_MANIFEST=/tmp/bad-manifest.json node scripts/verify-proai-cube-integrity-r2.mjs; then
            echo "NEGATIVE_SHA_TEST=UNEXPECTED_PASS" >&2
            exit 1
          else
            echo "NEGATIVE_SHA_TEST=EXPECTED_FAIL"
          fi
          for f in \
            assets/js/proai-hero-cube-r1/source-final-motion-r2.js \
            assets/js/proai-hero-cube-r1/source-final-motion-r2-touch-auto-45-r1.js \
            assets/js/proai-hero-cube-r1/bootstrap-golden-r1-2.js; do
            BASE=$(git rev-parse a4d222dd16adc736677a30ef5f4f38dd367cea1c:"$f")
            HOT=$(git hash-object "$f")
            echo "FROZEN_BLOB $f BASE=$BASE HOTFIX=$HOT"
            test "$BASE" = "$HOT"
          done
          grep -F "activeAutoInfluence: 0.45" assets/js/proai-hero-cube-r1/source-final-motion-r2-touch-auto-45-r1.js
          grep -F "resumeGraceMs: 0" assets/js/proai-hero-cube-r1/source-final-motion-r2-touch-auto-45-r1.js

      - name: Build clean hotfix and R2 sites
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          git worktree add --detach /tmp/pre 1da26bb71052f3b51e68ba69726ca72a4f0f5e8f
          git worktree add --detach /tmp/r2 a4d222dd16adc736677a30ef5f4f38dd367cea1c
          mkdir -p /tmp/hot
          git archive HEAD | tar -x -C /tmp/hot
          jekyll build --source /tmp/r2 --destination /tmp/r2-clean-site
          jekyll build --source /tmp/hot --destination /tmp/hot-clean-site
          echo "JEKYLL_R2_HOTFIX=PASS"

      - name: Prepare direct frameCamera fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots=[Path('/tmp/pre'),Path('/tmp/r2'),Path('/tmp/hot')]
          old_glb="const GLB_URL = new URL('./proai-cube-r1.glb?sha=2A97D4671F5A', import.meta.url).href;"
          new_glb="const GLB_URL = new URL('/assets/models/proai-cube/proai-cube-r1.glb?sha=2A97D4671F5A', location.origin).href;"
          needle="  configureStudioLighting(centerWorld, radius);\n  controls.update();\n}"
          injected="\n".join([
            "  configureStudioLighting(centerWorld, radius);",
            "  controls.update();",
            "  globalThis.__PROAI_FRAMING_AUDIT = {",
            "    boxMin: box.min.toArray(),",
            "    boxMax: box.max.toArray(),",
            "    sphereCenter: sphere.center.toArray(),",
            "    sphereRadius: radius,",
            "    cameraPosition: camera.position.toArray(),",
            "    controlsTarget: controls.target.toArray(),",
            "    fov: camera.fov",
            "  };",
            "}",
          ])
          html='''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607}#cube-canvas{display:block;width:100vw;height:100vh}</style><script type="importmap">{"imports":{"three":"/assets/vendor/three-r180/build/three.module.min.js","three/addons/":"/assets/vendor/three-r180/examples/jsm/"}}</script></head><body><canvas id="cube-canvas"></canvas><span id="runtime-status" hidden></span><script type="module">import '/assets/js/proai-hero-cube-r1/source-materials-r1.js';</script></body></html>'''
          for root in roots:
            p=root/'assets/js/proai-hero-cube-r1/source-materials-r1.js'
            s=p.read_text(encoding='utf-8')
            if old_glb not in s: raise SystemExit(f'GLB needle missing {p}')
            if s.count(needle)!=1: raise SystemExit(f'frameCamera needle mismatch {p}: {s.count(needle)}')
            s=s.replace(old_glb,new_glb,1).replace(needle,injected,1)
            p.write_text(s,encoding='utf-8',newline='\n')
            (root/'qa-framing.html').write_text(html,encoding='utf-8',newline='\n')
          # Separate HOTFIX visual fixture with the protection pixels removed entirely.
          import shutil
          shutil.copytree('/tmp/hot','/tmp/hot-noetch')
          hp=Path('/tmp/hot-noetch/assets/js/proai-hero-cube-r1/source-materials-r1.js')
          hs=hp.read_text(encoding='utf-8')
          seq="    setupOwnershipNodes();\n    frameCamera();\n    setupMicroEtch();\n    resize();"
          repl="    setupOwnershipNodes();\n    frameCamera();\n    /* QA-only micro-etch mask */\n    resize();"
          if hs.count(seq)!=1: raise SystemExit('HOTFIX no-etch mask sequence mismatch')
          hp.write_text(hs.replace(seq,repl,1),encoding='utf-8',newline='\n')
          PY

      - name: Run framing visual interaction Header and reduced-motion QA
        shell: bash
        run: |
          mkdir -p /tmp/qa && cd /tmp/qa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0 pngjs@7.0.0 pixelmatch@7.1.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          echo "CHROME=$CHROME"
          test -n "$CHROME"
          python3 -m http.server 8121 --directory /tmp/pre >/tmp/pre-http.log 2>&1 &
          python3 -m http.server 8122 --directory /tmp/r2 >/tmp/r2-http.log 2>&1 &
          python3 -m http.server 8123 --directory /tmp/hot >/tmp/hot-http.log 2>&1 &
          python3 -m http.server 8124 --directory /tmp/hot-noetch >/tmp/hot-noetch-http.log 2>&1 &
          python3 -m http.server 8125 --directory /tmp/hot-clean-site >/tmp/hot-clean-http.log 2>&1 &
          python3 -m http.server 8126 --directory /tmp/r2-clean-site >/tmp/r2-clean-http.log 2>&1 &
          sleep 2
          cat >/tmp/qa/run.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import { PNG } from 'pngjs';
          import pixelmatch from 'pixelmatch';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME});
          const errors=[];
          async function contextPage(viewport={width:1440,height:900},opts={}){
            const context=await browser.newContext({viewport,deviceScaleFactor:1,reducedMotion:opts.reducedMotion||'no-preference'});
            const page=await context.newPage();
            page.on('console',m=>{if(m.type()==='error')errors.push({url:page.url(),type:'console',text:m.text()})});
            page.on('pageerror',e=>errors.push({url:page.url(),type:'pageerror',text:e.message}));
            return {context,page};
          }
          async function directFraming(port){
            const {context,page}=await contextPage();
            await page.goto(`http://127.0.0.1:${port}/qa-framing.html?capture=1`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true&&window.__PROAI_FRAMING_AUDIT,{timeout:30000});
            const result=await page.evaluate(()=>window.__PROAI_FRAMING_AUDIT);
            await context.close();
            return result;
          }
          const framing={pre:await directFraming(8121),r2:await directFraming(8122),hot:await directFraming(8123)};
          console.log('FRAMING_PRE='+JSON.stringify(framing.pre));
          console.log('FRAMING_R2='+JSON.stringify(framing.r2));
          console.log('FRAMING_HOT='+JSON.stringify(framing.hot));
          const flatten=v=>Array.isArray(v)?v.flat(Infinity):[v];
          const fields=['boxMin','boxMax','sphereCenter','sphereRadius','cameraPosition','controlsTarget','fov'];
          let maxFramingDelta=0;
          for(const key of fields){const a=flatten(framing.pre[key]),b=flatten(framing.hot[key]);if(a.length!==b.length)throw new Error('framing shape '+key);a.forEach((v,i)=>maxFramingDelta=Math.max(maxFramingDelta,Math.abs(v-b[i])))}
          if(maxFramingDelta>1e-8)throw new Error('HOTFIX framing != PRE-R2 maxDelta='+maxFramingDelta);

          const pixelResults=[];
          for(const [width,height] of [[1440,900],[1280,800],[390,844],[320,844],[844,390]]){
            const A=await contextPage({width,height});
            const B=await contextPage({width,height});
            await A.page.goto('http://127.0.0.1:8121/qa-framing.html?capture=1',{waitUntil:'domcontentloaded',timeout:30000});
            await B.page.goto('http://127.0.0.1:8124/qa-framing.html?capture=1',{waitUntil:'domcontentloaded',timeout:30000});
            await A.page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,{timeout:30000});
            await B.page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,{timeout:30000});
            const ac=A.page.locator('#cube-canvas'),bc=B.page.locator('#cube-canvas');
            const ab=await ac.boundingBox(),bb=await bc.boundingBox();
            const canvasDelta=Math.max(...['x','y','width','height'].map(k=>Math.abs(ab[k]-bb[k])));
            const ai=PNG.sync.read(await ac.screenshot()),bi=PNG.sync.read(await bc.screenshot());
            const diff=new PNG({width:ai.width,height:ai.height});
            const changed=pixelmatch(ai.data,bi.data,diff.data,ai.width,ai.height,{threshold:0.05});
            const ratio=changed/(ai.width*ai.height);
            const row={viewport:[width,height],changed,total:ai.width*ai.height,ratio,canvasDelta};
            pixelResults.push(row); console.log(`PIXEL_${width}x${height}=`+JSON.stringify(row));
            if(canvasDelta>1e-8||ratio>0.001)throw new Error('visual zero-drift gate failed '+JSON.stringify(row));
            await A.context.close(); await B.context.close();
          }

          async function cleanReview(port,query='?capture=1',opts={}){
            const cp=await contextPage(opts.viewport||{width:1440,height:900},opts);
            await cp.page.goto(`http://127.0.0.1:${port}/docs/site-evolution/reviews/proai-cube-ownership-fingerprint-r1/review.html${query}`,{waitUntil:'domcontentloaded',timeout:30000});
            await cp.page.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,{timeout:30000});
            return cp;
          }
          const r2c=await cleanReview(8126);
          const hotc=await cleanReview(8125);
          const r2d=await r2c.page.evaluate(()=>__PROAI_CUBE_R1_2.getDiagnostics());
          const hotd=await hotc.page.evaluate(()=>__PROAI_CUBE_R1_2.getDiagnostics());
          for(const key of ['nodeId','attached','targetCubie','targetFace','face','bounds','hostName','material']){
            if(JSON.stringify(r2d.ownership.microEtch[key])!==JSON.stringify(hotd.ownership.microEtch[key]))throw new Error('micro-etch drift '+key);
          }
          if(hotd.ownership.identity.status!=='pass'||!hotd.ownership.identity.witnessPresent)throw new Error('identity/witness failed '+JSON.stringify(hotd.ownership.identity));
          console.log('MICRO_ETCH='+JSON.stringify(hotd.ownership.microEtch));
          console.log('IDENTITY='+JSON.stringify(hotd.ownership.identity));
          await r2c.context.close(); await hotc.context.close();

          const live=await cleanReview(8125,'?autoplay=1');
          const canvas=live.page.locator('#cube-canvas'); const box=await canvas.boundingBox(); const x=box.x+box.width*0.45,y=box.y+box.height*0.45;
          const snap=()=>live.page.evaluate(()=>({q:__PROAI_CUBE_R1_2.getDiagnostics().presentation.quaternion,req:__PROAI_CUBE_R1_2.getDiagnostics().ownership.integrity.requestCount,interaction:__PROAI_CUBE_R1_2.getDiagnostics().interaction}));
          const s0=await snap(); await live.page.mouse.move(x,y); await live.page.waitForTimeout(500); const s1=await snap();
          await live.page.mouse.down(); await live.page.waitForTimeout(500); const s2=await snap(); await live.page.waitForTimeout(1500); const s3=await snap(); await live.page.mouse.up();
          await live.page.mouse.move(x-70,y); await live.page.mouse.down(); await live.page.mouse.move(x+70,y,{steps:24}); await live.page.mouse.up();
          await live.page.mouse.move(x-140,y); await live.page.mouse.down(); await live.page.mouse.move(x+140,y,{steps:2}); await live.page.mouse.up();
          for(let i=0;i<3;i++){await live.page.mouse.move(x-35,y+i*8);await live.page.mouse.down();await live.page.mouse.move(x+35,y+i*8,{steps:6});await live.page.mouse.up()}
          await live.page.waitForTimeout(300); const s4=await snap();
          const qd=(a,b)=>Math.max(...a.map((v,i)=>Math.abs(v-b[i])));
          const pointer={hoverMotion:qd(s0.q,s1.q),hold05Motion:qd(s1.q,s2.q),hold20Motion:qd(s2.q,s3.q),integrityBefore:s0.req,integrityAfter:s4.req,finalInteraction:s4.interaction};
          if(pointer.hoverMotion===0||pointer.hold05Motion===0||pointer.hold20Motion===0)throw new Error('hesitation/freeze reproduced '+JSON.stringify(pointer));
          if(pointer.integrityBefore!==1||pointer.integrityAfter!==1)throw new Error('pointer triggered integrity '+JSON.stringify(pointer));
          const resources=await live.page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name));
          const heroGlb=resources.filter(n=>n.includes('proai-cube-r1.glb'));
          if(heroGlb.length!==1)throw new Error('standalone Hero GLB request count='+heroGlb.length+' '+JSON.stringify(heroGlb));
          console.log('POINTER='+JSON.stringify(pointer));
          console.log('HERO_GLB_REQUESTS='+JSON.stringify(heroGlb));
          await live.context.close();

          const rm=await cleanReview(8125,'?capture=1',{reducedMotion:'reduce',viewport:{width:390,height:844}});
          const rmd=await rm.page.evaluate(()=>__PROAI_CUBE_R1_2.getDiagnostics().ownership.microEtch);
          if(rmd.glintEnabled!==false||rmd.reducedMotion!==true||!rmd.attached)throw new Error('reduced-motion gate '+JSON.stringify(rmd));
          console.log('REDUCED_MOTION='+JSON.stringify(rmd)); await rm.context.close();

          const home=await contextPage({width:1440,height:900});
          await home.page.goto('http://127.0.0.1:8125/',{waitUntil:'domcontentloaded',timeout:30000});
          await home.page.waitForFunction(()=>document.documentElement.dataset.goldenCubeReady==='true',{timeout:30000});
          await home.page.waitForTimeout(1500);
          const headerFrames=home.page.frames().filter(f=>f.url().includes('/assets/brand/proai-logo-r341/live.html'));
          if(headerFrames.length!==1)throw new Error('Header Living Logo frame count='+headerFrames.length);
          await headerFrames[0].waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,{timeout:30000});
          const hd=await headerFrames[0].evaluate(()=>__PROAI_CUBE_R1_2.getDiagnostics());
          console.log('HEADER='+JSON.stringify({frameCount:headerFrames.length,ready:hd.ready,motionState:hd.motionState,identity:hd.ownership.identity.status}));
          await home.context.close();

          const ru=await contextPage({width:390,height:844});
          await ru.page.goto('http://127.0.0.1:8125/ru/',{waitUntil:'domcontentloaded',timeout:30000});
          await ru.page.waitForFunction(()=>document.documentElement.dataset.goldenCubeReady==='true',{timeout:30000});
          const provStatus=await ru.page.evaluate(async()=>{const r=await fetch('/provenance/proai-cube/r1/');return r.status});
          if(provStatus!==200)throw new Error('provenance HTTP '+provStatus);
          await ru.context.close();

          const sourceMismatch=errors.filter(e=>e.text.includes('Logo R3.4.1 source mismatch'));
          if(sourceMismatch.length)throw new Error('Header source mismatch '+JSON.stringify(sourceMismatch));
          if(errors.length)throw new Error('console/page errors '+JSON.stringify(errors));
          const report={framing,maxFramingDelta,r2VsPreSphereRadiusDelta:framing.r2.sphereRadius-framing.pre.sphereRadius,pixelResults,pointer,heroGlbRequestCount:heroGlb.length,microEtch:hotd.ownership.microEtch,identity:hotd.ownership.identity,reducedMotion:{glintEnabled:rmd.glintEnabled,attached:rmd.attached},header:{frameCount:headerFrames.length,ready:hd.ready,motionState:hd.motionState},provenanceStatus:provStatus,consoleErrors:errors};
          console.log('PROAI_HOTFIX_QA_REPORT='+JSON.stringify(report));
          await browser.close();
          JS
          CHROME="$CHROME" node /tmp/qa/run.mjs
