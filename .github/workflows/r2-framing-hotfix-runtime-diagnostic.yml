name: R2 framing hotfix runtime diagnostic

on:
  push:
    branches:
      - agent/proai-cube-r2-zero-drift-framing-hotfix

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build site
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination /tmp/site
      - name: Diagnose hotfix runtime
        shell: bash
        run: |
          mkdir -p /tmp/diag && cd /tmp/diag
          npm init -y >/dev/null 2>&1
          npm install --silent playwright-core@1.55.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          echo "CHROME=$CHROME"
          test -n "$CHROME"
          python3 -m http.server 8123 --directory /tmp/site >/tmp/http.log 2>&1 &
          sleep 2
          cat > /tmp/diag/run.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME});
          async function probe(url,label){
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await context.newPage();
            const events=[];
            page.on('console',m=>events.push({type:'console-'+m.type(),text:m.text()}));
            page.on('pageerror',e=>events.push({type:'pageerror',text:e.message}));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(18000);
            const state=await page.evaluate(()=>({
              golden:document.documentElement.dataset.goldenCubeReady||null,
              status:document.getElementById('runtime-status')?.textContent||null,
              r12:window.__PROAI_CUBE_R1_2?{ready:window.__PROAI_CUBE_R1_2.ready,motionState:window.__PROAI_CUBE_R1_2.motionState}:null,
              final:window.__PROAI_CUBE_FINAL_MOTION_R2?{ready:window.__PROAI_CUBE_FINAL_MOTION_R2.ready,motionState:window.__PROAI_CUBE_FINAL_MOTION_R2.motionState}:null,
              touch:window.__PROAI_CUBE_TOUCH_AUTO_45_R1?{ready:window.__PROAI_CUBE_TOUCH_AUTO_45_R1.ready,motionState:window.__PROAI_CUBE_TOUCH_AUTO_45_R1.motionState}:null,
              scripts:[...document.scripts].map(s=>s.src).filter(Boolean)
            }));
            console.log(label+'_STATE='+JSON.stringify(state));
            console.log(label+'_EVENTS='+JSON.stringify(events));
            await context.close();
          }
          await probe('http://127.0.0.1:8123/?capture=1','HOME');
          await probe('http://127.0.0.1:8123/docs/site-evolution/reviews/proai-cube-ownership-fingerprint-r1/review.html?capture=1','REVIEW');
          await browser.close();
          JS
          CHROME="$CHROME" node /tmp/diag/run.mjs
