name: R442 Runtime Diagnostic
on:
  push:
    branches: [agent/proai-r442-runtime-diag-temp-6]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5de60f7811727849bbc398f04065c264caedd93
          fetch-depth: 0
      - run: |
          npm install --package-lock=false
          npm run build-r442
          node --check main.generated.js
          grep -Fq "approachScore:.58,enterScore:.76,exitScore:.46,minView:.58,exitView:.44" main.generated.js
          grep -Fq "nextEligiblePresentationMs:2600" main.generated.js
          npm install --no-save playwright
          npx playwright install chromium
      - run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          const p=await browser.newPage({viewport:{width:800,height:540}});
          p.on('pageerror',e=>console.log('PAGEERROR',String(e),e?.stack||''));
          p.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR',m.text())});
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
          try{await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:30000})}catch{}
          console.log('FINAL',await p.evaluate(()=>({ready:window.__PROAI_CUBE_R1_2?.ready,semantic:window.__PROAI_CUBE_R1_2?.ready?window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().r442DynamicFace:null,moves:window.__PROAI_CUBE_R1_2?.ready?window.__PROAI_CUBE_R1_2.getSemanticDiagnostics().r442MoveDiversity:null})));
          if(!(await p.evaluate(()=>window.__PROAI_CUBE_R1_2?.ready===true)))process.exitCode=1;
          await browser.close();
          NODE
          node diag.mjs
