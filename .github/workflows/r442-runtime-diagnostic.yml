name: R442 Runtime Diagnostic
on:
  push:
    branches: [agent/proai-r442-runtime-diag-temp-6]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5f3d8d4f410070c1d7d1beee44e1e2cd45f1702b
          fetch-depth: 0
      - run: |
          npm install --package-lock=false
          npm run build-r442
          node --check main.generated.js
          grep -Fq "maxProtectedMs:2400" main.generated.js
          ! grep -Fq "maxProtectedMs:2480" main.generated.js
          npm install --no-save playwright
          npx playwright install chromium
      - run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          const p=await browser.newPage({viewport:{width:240,height:180}});const fatal=[];p.on('pageerror',e=>fatal.push(String(e)));p.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:30000});
          await p.evaluate(()=>{const c=document.getElementById('cube-canvas');if(c){c.style.width='64px';c.style.height='64px'}window.dispatchEvent(new Event('resize'))});await p.waitForTimeout(500);
          await p.evaluate(()=>{const rs=window.setTimeout.bind(window),rc=window.clearTimeout.bind(window);let t=performance.now(),epoch=Date.now()-t,seq=950000;const timers=new Map(),rafs=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>epoch+t;const flush=()=>{let again=true,g=0;while(again&&g++<100){again=false;for(const [id,x] of [...timers])if(x.due<=t){timers.delete(id);x.cb(...x.args);again=true}}};window.setTimeout=(cb,ms=0,...args)=>{const id=seq++;timers.set(id,{due:t+Math.max(0,+ms||0),cb,args});return id};window.clearTimeout=id=>timers.delete(id);window.requestAnimationFrame=cb=>{const id=seq++,h=rs(()=>{rafs.delete(id);t+=80;flush();cb(t)},0);rafs.set(id,h);return id};window.cancelAnimationFrame=id=>{const h=rafs.get(id);if(h!==undefined){rc(h);rafs.delete(id)}}});
          const start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs),samples=[];let g=0;
          while(true){await p.waitForTimeout(1);const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),scene=(q.d.presentation.simTimeMs-start)/1000,d=q.s.r442DynamicFace||{},o=q.s.opticalField||{};samples.push({scene,protected:d.protected===true,face:d.protectedFace||null,opportunity:o.opportunity??0,faceView:o.faceView??0,frontFacing:o.frontFacing===true,unsafe:d.unsafeProtectedStarts||0,violations:d.assemblyViolations||0,scale:q.s.timeScale??1});if(scene>=42)break;if(++g>1200)throw new Error('stalled '+scene)}
          const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),d=q.s.r442DynamicFace||{},m=q.s.r442MoveDiversity||{},forward=(m.moveLog||[]).filter(x=>x.phase==='forward'),rel=x=>(x.presentationMs-start)/1000,axes15=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=15).map(x=>x.axis))],axes35=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.axis))],layers35=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.layer))],selectedFaces=[...new Set((d.faceSelections||[]).map(x=>x.face))];
          let first=null,firstEnd=null,last=false,runStart=null,readStart=null,readEnd=null;for(const x of samples){if(x.protected&&!last&&first===null)first=x.scene;if(!x.protected&&last&&firstEnd===null)firstEnd=x.scene;const readable=x.protected&&x.frontFacing&&x.opportunity>=.76&&x.faceView>=.58;if(readable&&runStart===null)runStart=x.scene;if(!readable&&runStart!==null){if(readStart===null||x.scene-runStart>readEnd-readStart){readStart=runStart;readEnd=x.scene}runStart=null}last=x.protected}if(runStart!==null){const end=samples.at(-1).scene;if(readStart===null||end-runStart>readEnd-readStart){readStart=runStart;readEnd=end}}const readableDuration=readStart===null?null:readEnd-readStart,maxProtected=(d.protectedIntervals||[]).length?Math.max(...d.protectedIntervals.map(x=>x.durationSec)):null,noTearing=samples.every(x=>!x.protected||((x.unsafe||0)===0&&(x.violations||0)===0))&&d.unsafeProtectedStarts===0&&d.assemblyViolations===0,motion=samples.every(x=>x.scale===1),pass=first!==null&&first>=2.5&&first<=6.5&&readableDuration!==null&&readableDuration>=1.0&&readableDuration<=2.5&&maxProtected!==null&&maxProtected<=2.5&&axes15.length>=2&&axes35.length===3&&layers35.length===3&&selectedFaces.length>=2&&(d.postReleaseParticipationCount||0)>0&&noTearing&&motion&&fatal.length===0;
          console.log('FINAL_BEHAVIOR',JSON.stringify({pass,first,firstEnd,readableDuration,maxProtected,axes15,axes35,layers35,axisCounts:m.axisCounts,layerCounts:m.layerCounts,selectedFaces,faceSelections:d.faceSelections,protectedIntervals:d.protectedIntervals,postReleaseParticipationCount:d.postReleaseParticipationCount,lastPostReleaseParticipation:d.lastPostReleaseParticipation,unsafeProtectedStarts:d.unsafeProtectedStarts,assemblyViolations:d.assemblyViolations,protectionCount:d.protectionCount,releaseCount:d.releaseCount,noTearing,motion,fatal}));if(!pass)process.exitCode=1;await browser.close();
          NODE
          node diag.mjs