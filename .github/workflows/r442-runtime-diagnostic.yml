name: R442 Runtime Diagnostic
on:
  push:
    branches: [agent/proai-r442-runtime-diag-temp-6]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5de60f7811727849bbc398f04065c264caedd93
          fetch-depth: 0
      - run: |
          npm install --package-lock=false
          npm run build-r442
          npm install --no-save playwright
          npx playwright install chromium
      - run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          const p=await browser.newPage({viewport:{width:240,height:180}});
          p.on('pageerror',e=>console.log('PAGEERROR',String(e),e?.stack||''));
          p.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR',m.text())});
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:30000});
          await p.evaluate(()=>{const c=document.getElementById('cube-canvas');if(c){c.style.width='64px';c.style.height='64px';}window.dispatchEvent(new Event('resize'))});
          await p.waitForTimeout(500);
          await p.evaluate(()=>{const realSetTimeout=window.setTimeout.bind(window),realClearTimeout=window.clearTimeout.bind(window);let t=performance.now(),epoch=Date.now()-t,seq=500000;const timers=new Map(),rafs=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>epoch+t;const flush=()=>{let again=true,g=0;while(again&&g++<100){again=false;for(const [id,x] of [...timers])if(x.due<=t){timers.delete(id);x.cb(...x.args);again=true}}};window.setTimeout=(cb,ms=0,...args)=>{const id=seq++;timers.set(id,{due:t+Math.max(0,Number(ms)||0),cb,args});return id};window.clearTimeout=id=>timers.delete(id);window.requestAnimationFrame=cb=>{const id=seq++,h=realSetTimeout(()=>{rafs.delete(id);t+=80;flush();cb(t)},0);rafs.set(id,h);return id};window.cancelAnimationFrame=id=>{const h=rafs.get(id);if(h!==undefined){realClearTimeout(h);rafs.delete(id)}}});
          const start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs);let first=null,release=null,last=false,g=0;
          while(true){await p.waitForTimeout(1);const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),scene=(q.d.presentation.simTimeMs-start)/1000,d=q.s.r442DynamicFace||{};if(d.protected&&!last&&first===null)first=scene;if(!d.protected&&last&&release===null)release=scene;last=d.protected;if(scene>=42)break;if(++g>1200)throw new Error('stalled '+scene)}
          const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),d=q.s.r442DynamicFace||{},m=q.s.r442MoveDiversity||{},forward=(m.moveLog||[]).filter(x=>x.phase==='forward'),rel=x=>(x.presentationMs-start)/1000,axes15=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=15).map(x=>x.axis))],axes35=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.axis))],layers35=[...new Set(forward.filter(x=>rel(x)>=0&&rel(x)<=35).map(x=>x.layer))];
          console.log('BEHAVIOR',JSON.stringify({first,release,axes15,axes35,layers35,axisCounts:m.axisCounts,layerCounts:m.layerCounts,selections:d.faceSelections,protectedIntervals:d.protectedIntervals,postReleaseParticipationCount:d.postReleaseParticipationCount,lastPostReleaseParticipation:d.lastPostReleaseParticipation,unsafeProtectedStarts:d.unsafeProtectedStarts,assemblyViolations:d.assemblyViolations,protectionCount:d.protectionCount,releaseCount:d.releaseCount,timeScale:q.s.timeScale}));
          await browser.close();
          NODE
          node diag.mjs
