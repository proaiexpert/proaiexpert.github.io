name: R442 Runtime Diagnostic
on:
  push:
    branches: [agent/proai-r442-runtime-diag-temp-6]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site-evolution/spline/proai-cube-semantic-brand-face-r4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35420978ea47ef25c763093538f114bbb5d91219
          fetch-depth: 0
      - run: |
          npm install --package-lock=false
          npm run build-r442
          node --check main.generated.js
          npm install --no-save playwright
          npx playwright install chromium
      - run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > diag.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
          const p=await browser.newPage({viewport:{width:240,height:180}});
          const fatal=[];p.on('pageerror',e=>fatal.push(String(e)));p.on('console',m=>{if(m.type()==='error')fatal.push(m.text())});
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:60000});
          await p.waitForFunction(()=>window.__PROAI_CUBE_R1_2?.ready===true,null,{timeout:30000});
          await p.evaluate(()=>{const c=document.getElementById('cube-canvas');if(c){c.style.width='64px';c.style.height='64px';}window.dispatchEvent(new Event('resize'))});
          await p.waitForTimeout(500);
          await p.evaluate(()=>{const realSetTimeout=window.setTimeout.bind(window),realClearTimeout=window.clearTimeout.bind(window);let t=performance.now(),epoch=Date.now()-t,seq=700000;const timers=new Map(),rafs=new Map();Object.defineProperty(performance,'now',{configurable:true,value:()=>t});Date.now=()=>epoch+t;const flush=()=>{let again=true,g=0;while(again&&g++<100){again=false;for(const [id,x] of [...timers])if(x.due<=t){timers.delete(id);x.cb(...x.args);again=true}}};window.setTimeout=(cb,ms=0,...args)=>{const id=seq++;timers.set(id,{due:t+Math.max(0,Number(ms)||0),cb,args});return id};window.clearTimeout=id=>timers.delete(id);window.requestAnimationFrame=cb=>{const id=seq++,h=realSetTimeout(()=>{rafs.delete(id);t+=80;flush();cb(t)},0);rafs.set(id,h);return id};window.cancelAnimationFrame=id=>{const h=rafs.get(id);if(h!==undefined){realClearTimeout(h);rafs.delete(id)}}});
          const start=await p.evaluate(()=>window.__PROAI_CUBE_R1_2.getDiagnostics().presentation.simTimeMs),samples=[];let g=0;
          while(true){await p.waitForTimeout(1);const q=await p.evaluate(()=>({s:window.__PROAI_CUBE_R1_2.getSemanticDiagnostics(),d:window.__PROAI_CUBE_R1_2.getDiagnostics()})),scene=(q.d.presentation.simTimeMs-start)/1000,d=q.s.r442DynamicFace||{},candidate=(d.candidates||[]).find(x=>x.face===d.protectedFace);samples.push({scene,protected:d.protected===true,face:d.protectedFace||null,quality:candidate?.rawQuality??0,view:candidate?.viewAlignment??0,area:candidate?.projectedAreaQuality??0,brdf:candidate?.brdfQuality??0,assembled:d.protectedFace?candidate?.assembled===true:true,unsafe:d.unsafeProtectedStarts||0,violations:d.assemblyViolations||0,scale:q.s.timeScale??1});if(scene>=8.2)break;if(++g>400)throw new Error('stalled '+scene)}
          let protectionStart=null,protectionEnd=null,readStart=null,readEnd=null,runStart=null,maxQuality=0,maxView=0;for(const x of samples){if(x.protected&&protectionStart===null)protectionStart=x.scene;if(protectionStart!==null&&!x.protected&&protectionEnd===null)protectionEnd=x.scene;const readable=x.protected&&x.quality>=.76&&x.view>=.58;if(readable&&runStart===null)runStart=x.scene;if(!readable&&runStart!==null){const dur=x.scene-runStart;if(readStart===null||dur>(readEnd-readStart)){readStart=runStart;readEnd=x.scene}runStart=null}maxQuality=Math.max(maxQuality,x.quality);maxView=Math.max(maxView,x.view)}if(runStart!==null){const end=samples.at(-1).scene;if(readStart===null||end-runStart>(readEnd-readStart)){readStart=runStart;readEnd=end}}const readableDuration=readStart===null?null:readEnd-readStart,noTearing=samples.every(x=>!x.protected||x.assembled)&&Math.max(...samples.map(x=>x.unsafe))===0&&Math.max(...samples.map(x=>x.violations))===0,motion=samples.every(x=>x.scale===1),pass=protectionStart!==null&&protectionStart>=2.5&&protectionStart<=6.5&&readableDuration!==null&&readableDuration>=1.0&&readableDuration<=2.6&&noTearing&&motion&&fatal.length===0;console.log('READABILITY',JSON.stringify({pass,protectionStart,protectionEnd,protectedDuration:protectionEnd===null?null:protectionEnd-protectionStart,readStart,readEnd,readableDuration,maxQuality,maxView,noTearing,motion,fatal}));if(!pass)process.exitCode=1;await browser.close();
          NODE
          node diag.mjs