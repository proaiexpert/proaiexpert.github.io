name: R1C Original Material Diagnostics
on:
  push:
    branches:
      - agent/ai-systems-hero-reactive-orb-material-r1c
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native scene material-layer visual probe
        run: node scripts/qa-reactive-orb-material-r1c.mjs
      - name: Preserve original and variant canvas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-r1c-material-evidence
          path: artifacts/orb-r1c/
          if-no-files-found: error
