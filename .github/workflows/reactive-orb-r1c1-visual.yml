name: R1C.1 Real WebGPU Material Visual QA
on:
  push:
    branches:
      - agent/ai-systems-hero-reactive-orb-r1c1-visual-qa-repair
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Native 250-clone Spline WebGPU A-B-A proof, fail-closed
        run: node scripts/qa-reactive-orb-r1c1-visual.mjs
      - name: Save screenshots and JSON even on HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-r1c1-visual-evidence
          path: artifacts/orb-r1c1/
          if-no-files-found: warn
