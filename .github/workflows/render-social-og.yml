name: Render exact production social OG previews

on:
  push:
    branches:
      - og-preview-exact-assets-r1
    paths:
      - .github/workflows/render-social-og.yml
      - tools/social-og/preview.html
      - scripts/render-social-og.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/proai-og-server.log 2>&1 &
          echo $! > /tmp/proai-og-server.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/tools/social-og/preview.html > /dev/null

      - name: Render cube framing candidates
        run: node scripts/render-social-og.mjs

      - name: Validate PNG dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          files = sorted(Path('assets/social').glob('proai-og-frame-*.png'))
          if len(files) != 5:
              raise SystemExit(f'expected 5 framing candidates, found {len(files)}')
          for p in files:
              data = p.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{p.name}: not PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1200, 630):
                  raise SystemExit(f'{p.name}: wrong dimensions {width}x{height}')
              print(f'{p.name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: proai-social-og-frame-review
          path: assets/social/proai-og-frame-*.png
          if-no-files-found: error
          retention-days: 7
