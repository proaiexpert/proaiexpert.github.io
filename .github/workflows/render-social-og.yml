name: Render exact production social OG previews

on:
  push:
    branches:
      - og-preview-exact-assets-r1
    paths:
      - .github/workflows/render-social-og.yml
      - tools/social-og/preview.html
      - tools/social-campaign/preview.html
      - scripts/render-social-og.mjs
      - scripts/render-social-campaign.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/proai-og-server.log 2>&1 &
          echo $! > /tmp/proai-og-server.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/tools/social-og/preview.html > /dev/null
          curl --fail http://127.0.0.1:4173/tools/social-campaign/preview.html > /dev/null

      - name: Render OG and social campaign candidates
        run: |
          node scripts/render-social-og.mjs
          node scripts/render-social-campaign.mjs

      - name: Validate PNG dimensions
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          names = (
              'proai-home-og-en-r1.png',
              'proai-home-og-ru-r1.png',
              'proai-social-en-r1.png',
              'proai-social-ru-r1.png',
          )
          for name in names:
              p = Path('assets/social') / name
              data = p.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1200, 630):
                  raise SystemExit(f'{name}: wrong dimensions {width}x{height}')
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Upload approval assets
        uses: actions/upload-artifact@v4
        with:
          name: proai-social-campaign-opposite-layout-r1
          path: |
            assets/social/proai-social-en-r1.png
            assets/social/proai-social-ru-r1.png
          if-no-files-found: error
          retention-days: 7
