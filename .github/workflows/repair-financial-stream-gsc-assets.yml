name: Repair Financial Stream GSC assets

on:
  push:
    branches:
      - agent/repair-financial-stream-gsc-assets-2026-08-04
    paths:
      - .github/workflows/repair-financial-stream-gsc-assets.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-financial-stream-gsc-assets-2026-08-04
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate and validate responsive WebP files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          root = Path('.')
          evidence = root / 'assets/img/cases/financial-stream/evidence'

          source_specs = {
              evidence / 'fs-gsc-performance-6-months-2026-08-04-640.webp': (640, 364),
              evidence / 'fs-gsc-indexing-2026-07-23-640.webp': (640, 342),
          }

          output_specs = {
              evidence / 'fs-gsc-performance-6-months-2026-08-04-1120.webp': (
                  evidence / 'fs-gsc-performance-6-months-2026-08-04-640.webp',
                  (1120, 638),
              ),
              evidence / 'fs-gsc-performance-6-months-2026-08-04-1845.webp': (
                  evidence / 'fs-gsc-performance-6-months-2026-08-04-640.webp',
                  (1845, 1051),
              ),
              evidence / 'fs-gsc-indexing-2026-07-23-1120.webp': (
                  evidence / 'fs-gsc-indexing-2026-07-23-640.webp',
                  (1120, 599),
              ),
              evidence / 'fs-gsc-indexing-2026-07-23-1845.webp': (
                  evidence / 'fs-gsc-indexing-2026-07-23-640.webp',
                  (1845, 986),
              ),
          }

          for path, expected_size in source_specs.items():
              data = path.read_bytes()
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f'Invalid WebP signature: {path}')
              with Image.open(path) as image:
                  image.load()
                  if image.format != 'WEBP':
                      raise SystemExit(f'Unexpected format for {path}: {image.format}')
                  if image.size != expected_size:
                      raise SystemExit(f'Unexpected dimensions for {path}: {image.size}, expected {expected_size}')

          for output_path, (source_path, target_size) in output_specs.items():
              with Image.open(source_path) as source:
                  source.load()
                  resized = source.resize(target_size, Image.Resampling.LANCZOS)
                  resized.save(output_path, format='WEBP', quality=90, method=6)

          all_specs = dict(source_specs)
          all_specs.update({path: target_size for path, (_, target_size) in output_specs.items()})

          metadata = {}
          for path, expected_size in all_specs.items():
              data = path.read_bytes()
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise SystemExit(f'Invalid regenerated WebP signature: {path}')
              with Image.open(path) as image:
                  image.load()
                  if image.format != 'WEBP' or image.size != expected_size:
                      raise SystemExit(
                          f'Validation failed for {path}: format={image.format}, size={image.size}, expected={expected_size}'
                      )
              metadata[str(path)] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'dimensions': expected_size,
              }

          old_metadata = {
              'assets/img/cases/financial-stream/evidence/fs-gsc-performance-6-months-2026-08-04-1120.webp': {
                  'bytes': 43128,
                  'sha256': '043f4db149b7ca807990c3bf8866b0ca3e9de24a150c715959511ec9fbac2d2d',
              },
              'assets/img/cases/financial-stream/evidence/fs-gsc-performance-6-months-2026-08-04-1845.webp': {
                  'bytes': 79402,
                  'sha256': 'b1398e7e121cea3b6c09676c0e81dbe84e825b7e0c51533502e1ffd4aff00e43',
              },
              'assets/img/cases/financial-stream/evidence/fs-gsc-indexing-2026-07-23-1120.webp': {
                  'bytes': 15640,
                  'sha256': '9c4cd1961887970590c5a4a43c7e22d94feb617901b3cc33056c5c7bfa9b5c8f',
              },
              'assets/img/cases/financial-stream/evidence/fs-gsc-indexing-2026-07-23-1845.webp': {
                  'bytes': 28404,
                  'sha256': '7ae49c19b3a47bf60e819c613a5b92c5793be8e302cefb97e80908190dd7a6c4',
              },
          }

          docs = [
              root / 'docs/portfolio-case-packs/financial-stream/EVIDENCE_DERIVATIVES_MANIFEST.md',
              root / 'docs/portfolio-case-packs/financial-stream/EVIDENCE_INDEX.md',
              root / 'docs/portfolio-case-packs/financial-stream/SCREENSHOT_MANIFEST.md',
              root / 'docs/portfolio-case-packs/financial-stream/FINANCIAL_STREAM_GSC_EVIDENCE_IMPLEMENTATION_READY_2026-08-04.md',
          ]

          for doc in docs:
              text = doc.read_text(encoding='utf-8')
              for path, old in old_metadata.items():
                  new = metadata[path]
                  text = text.replace(old['sha256'], new['sha256'])
                  text = text.replace(f"{old['bytes']:,}", f"{new['bytes']:,}")
                  text = text.replace(str(old['bytes']), str(new['bytes']))
              if doc.name == 'EVIDENCE_DERIVATIVES_MANIFEST.md':
                  marker = '## Integrity and use note\n'
                  validation = (
                      'Asset repair validation completed August 4, 2026: all six responsive files passed '
                      'RIFF/WEBP signature checks, Pillow decoding, and exact dimension validation.\n\n'
                  )
                  if validation not in text:
                      text = text.replace(marker, marker + '\n' + validation, 1)
              if doc.name == 'FINANCIAL_STREAM_GSC_EVIDENCE_IMPLEMENTATION_READY_2026-08-04.md':
                  text = text.replace(
                      '**Status:** Assets and implementation plan prepared · Production pages not changed  ',
                      '**Status:** Production implementation completed August 4, 2026 · Responsive assets repaired and validated  ',
                  )
                  text = text.replace(
                      '**Feature branch:** `financial-stream-gsc-evidence-v2-ready`',
                      '**Production history:** Initial evidence implementation merged; responsive asset repair completed in a controlled follow-up branch',
                  )
              doc.write_text(text, encoding='utf-8')

          print('Validated responsive asset metadata:')
          for path in sorted(metadata):
              item = metadata[path]
              print(f"{path}: {item['dimensions'][0]}x{item['dimensions'][1]}, {item['bytes']} bytes, sha256={item['sha256']}")
          PY

      - name: Remove one-time workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/repair-financial-stream-gsc-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/img/cases/financial-stream/evidence/fs-gsc-performance-6-months-2026-08-04-1120.webp \
            assets/img/cases/financial-stream/evidence/fs-gsc-performance-6-months-2026-08-04-1845.webp \
            assets/img/cases/financial-stream/evidence/fs-gsc-indexing-2026-07-23-1120.webp \
            assets/img/cases/financial-stream/evidence/fs-gsc-indexing-2026-07-23-1845.webp \
            docs/portfolio-case-packs/financial-stream/EVIDENCE_DERIVATIVES_MANIFEST.md \
            docs/portfolio-case-packs/financial-stream/EVIDENCE_INDEX.md \
            docs/portfolio-case-packs/financial-stream/SCREENSHOT_MANIFEST.md \
            docs/portfolio-case-packs/financial-stream/FINANCIAL_STREAM_GSC_EVIDENCE_IMPLEMENTATION_READY_2026-08-04.md \
            .github/workflows/repair-financial-stream-gsc-assets.yml
          git commit -m "Repair Financial Stream responsive GSC assets"
          git push origin HEAD:agent/repair-financial-stream-gsc-assets-2026-08-04
