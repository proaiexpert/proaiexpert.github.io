name: Selected Thinking R1.5 Caption Air QA

on:
  push:
    branches:
      - qa/selected-thinking-r15-caption-air-r1

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      PRODUCT_SHA: 0323965a3431b4a2e202d5d34cc5a5428274053a
      BASE_SHA: 1c934802a20e8410246b73e36dbaa3023f7ed8db
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v6
        with:
          ref: qa/selected-thinking-r15-caption-air-r1
          fetch-depth: 0

      - name: Verify scoped product correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_SHA"
          test "$(git rev-parse ${PRODUCT_SHA}^)" = "$BASE_SHA"
          test "$(git diff --name-only ${BASE_SHA} ${PRODUCT_SHA})" = "assets/css/home-selected-thinking-r1-5-micro-polish.css"
          grep -q 'margin-top: 32px;' assets/css/home-selected-thinking-r1-5-micro-polish.css
          grep -q 'margin-top: 24px;' assets/css/home-selected-thinking-r1-5-micro-polish.css

      - name: Build integrated site
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          test -f _site/index.html
          test -f _site/ru/index.html
          python3 -m http.server 4173 --directory _site >/tmp/st-air-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4173/ru/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/st-air-http.log
          exit 1

      - name: Install browser runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify spacing matrix and capture desktop evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/st-air-qa.cjs" <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const cases = [
            ['1440x900',1440,900],['1280x800',1280,800],['1024x768',1024,768],
            ['852x393',852,393],['430x932',430,932],['390x844',390,844],
            ['375x812',375,812],['360x800',360,800],['320x700',320,700]
          ];
          const langs = { en:{route:'/',caption:'READ THE FRAMEWORK'}, ru:{route:'/ru/',caption:'РАЗОБРАТЬ СИСТЕМУ'} };
          const report={pass:false,checks:[],failures:[],metrics:{}};
          const check=(ok,label,details={})=>{(ok?report.checks:report.failures).push({label,details});};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for (const [lang,exp] of Object.entries(langs)) {
                report.metrics[lang]={};
                for (const [name,width,height] of cases) {
                  const context=await browser.newContext({viewport:{width,height},isMobile:width<=430,hasTouch:width<=430,reducedMotion:'reduce'});
                  const page=await context.newPage();
                  await page.goto('http://127.0.0.1:4173'+exp.route,{waitUntil:'domcontentloaded',timeout:30000});
                  await page.evaluate(()=>document.fonts&&document.fonts.ready).catch(()=>{});
                  const section=page.locator('#selected-thinking-r1');
                  await section.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(100);
                  const d=await page.evaluate(()=>{
                    const s=document.querySelector('#selected-thinking-r1');
                    const read=s.querySelector('.selected-thinking-r1__lead > .selected-thinking-r1__read');
                    const fw=s.querySelector('.selected-thinking-r1__framework--lead');
                    const spans=[...fw.querySelectorAll(':scope > span')];
                    const rr=read.getBoundingClientRect();
                    const fr=fw.getBoundingClientRect();
                    const spanBottom=Math.max(...spans.map(x=>x.getBoundingClientRect().bottom));
                    const cs=getComputedStyle(read);
                    return {
                      caption:read.textContent.replace('→','').trim(),
                      marginTop:parseFloat(cs.marginTop),
                      position:cs.position,
                      frameworkBottom:fr.bottom,
                      visibleStepBottom:spanBottom,
                      captionTop:rr.top,
                      boxGap:rr.top-fr.bottom,
                      visualGap:rr.top-spanBottom,
                      overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                      intersects:!(rr.bottom<=fr.top||rr.top>=fr.bottom||rr.right<=fr.left||rr.left>=fr.right)
                    };
                  });
                  report.metrics[lang][name]=d;
                  const expected=(width<=620||((width>=621&&width<=932)&&height<=500))?24:32;
                  const p=`${lang} ${name}`;
                  check(d.caption===exp.caption,`${p}: caption exact`,d);
                  check(d.position==='static',`${p}: normal flow`,d);
                  check(Math.abs(d.marginTop-expected)<0.6,`${p}: intended breathing-room margin`,d);
                  check(d.boxGap>=expected-1,`${p}: caption separated from framework box`,d);
                  check(d.visualGap>=expected,`${p}: visible step-to-caption air`,d);
                  check(!d.intersects,`${p}: no overlap`,d);
                  check(d.overflow<=1,`${p}: no horizontal overflow`,d);
                  if(name==='1440x900'){
                    await page.evaluate(()=>{const s=document.querySelector('#selected-thinking-r1');window.scrollTo(0,Math.max(0,s.getBoundingClientRect().top+scrollY-70));});
                    await page.waitForTimeout(80);
                    const cdp=await context.newCDPSession(page);
                    const shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
                    fs.writeFileSync(`${lang}-1440-caption-air.png`,Buffer.from(shot.data,'base64'));
                  }
                  await context.close();
                }
              }
            } finally { await browser.close(); }
            report.pass=report.failures.length===0;
            fs.writeFileSync('qa-results.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify({pass:report.pass,checks:report.checks.length,failures:report.failures.length,desktopRu:report.metrics.ru['1440x900'],desktopEn:report.metrics.en['1440x900']},null,2));
            process.exit(report.pass?0:1);
          })().catch(e=>{report.failures.push({label:'unhandled',details:{message:String(e),stack:e&&e.stack}});fs.writeFileSync('qa-results.json',JSON.stringify(report,null,2));console.error(e);process.exit(1);});
          JS
          node "$GITHUB_WORKSPACE/st-air-qa.cjs"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r15-caption-air-r1-evidence
          path: |
            qa-results.json
            en-1440-caption-air.png
            ru-1440-caption-air.png
          if-no-files-found: error
          retention-days: 14

      - name: Enforce semantic result
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('qa-results.json','utf8'));console.log('pass='+r.pass+' checks='+r.checks.length+' failures='+r.failures.length);process.exit(r.pass===true?0:1)"
