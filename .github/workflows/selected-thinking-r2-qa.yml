name: Selected Thinking R2 Isolated Browser QA

on:
  push:
    branches:
      - agent/proai-home-selected-thinking-decision-aperture-r2

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify scoped candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only origin/main...HEAD | sort > /tmp/r2-files.txt
          cat /tmp/r2-files.txt
          grep -qx '_includes/home-selected-thinking-r2-en.html' /tmp/r2-files.txt
          grep -qx '_includes/home-selected-thinking-r2-ru.html' /tmp/r2-files.txt
          grep -qx 'assets/css/home-selected-thinking-r2.css' /tmp/r2-files.txt
          grep -qx 'assets/js/home-selected-thinking-r2.js' /tmp/r2-files.txt
          grep -qx 'index.html' /tmp/r2-files.txt
          grep -qx 'ru/index.html' /tmp/r2-files.txt
          grep -qx 'owner-preview/selected-thinking-r2/index.html' /tmp/r2-files.txt
          grep -qx 'owner-preview/selected-thinking-r2/ru.html' /tmp/r2-files.txt
          ! git diff --name-only origin/main...HEAD | grep -E '^(_includes/home-selected-thinking-r1-|assets/(css|js)/home-selected-thinking-r1|_includes/home-system-execution|_includes/home-selected-work|assets/(css|js)/home-system-execution|assets/(css|js)/home-selected-work)'
          grep -q 'home-selected-thinking-r2.css' index.html
          grep -q 'home-selected-thinking-r2.js' index.html
          grep -q 'home-selected-thinking-r2-en.html' index.html
          grep -q 'home-selected-thinking-r2-ru.html' ru/index.html
          ! grep -q 'home-selected-thinking-r1.css' index.html
          ! grep -q 'home-selected-thinking-r1-5.js' index.html

      - name: Build main and candidate
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document

          git worktree add /tmp/proai-main origin/main
          jekyll build --source /tmp/proai-main --destination /tmp/site-main
          jekyll build --source . --destination /tmp/site-r2

          test -f /tmp/site-main/index.html
          test -f /tmp/site-main/ru/index.html
          test -f /tmp/site-r2/index.html
          test -f /tmp/site-r2/ru/index.html
          test -f /tmp/site-r2/owner-preview/selected-thinking-r2/index.html
          test -f /tmp/site-r2/owner-preview/selected-thinking-r2/ru.html

          python3 -m http.server 4173 --directory /tmp/site-main >/tmp/main-http.log 2>&1 &
          echo $! >/tmp/main-http.pid
          python3 -m http.server 4174 --directory /tmp/site-r2 >/tmp/r2-http.log 2>&1 &
          echo $! >/tmp/r2-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/main-http.log
          cat /tmp/r2-http.log
          exit 1

      - name: Install Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive A/B browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2-qa/ab
          cat > "$GITHUB_WORKSPACE/r2-qa.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const BASE='http://127.0.0.1:4173';
          const R2='http://127.0.0.1:4174';
          const OUT='/tmp/r2-qa';
          const viewports=[
            ['1920x1080',1920,1080,'desktop'],
            ['1440x900',1440,900,'desktop'],
            ['1366x768',1366,768,'desktop'],
            ['1280x720',1280,720,'desktop'],
            ['430x932',430,932,'portrait'],
            ['390x844',390,844,'portrait'],
            ['375x812',375,812,'portrait'],
            ['844x390',844,390,'landscape'],
            ['896x414',896,414,'landscape'],
            ['932x430',932,430,'landscape']
          ];
          const langs={
            en:{route:'/',baseline:'#selected-thinking-r1',candidate:'#selected-thinking-r2'},
            ru:{route:'/ru/',baseline:'#selected-thinking-r1',candidate:'#selected-thinking-r2'}
          };

          const report={
            candidateSha:process.env.GITHUB_SHA,
            baseSha:null,
            pass:false,
            checks:[],
            failures:[],
            matrix:{},
            static:{},
            motion:{},
            reduced:{},
            accessibility:{},
            screenshotCount:0
          };
          const check=(ok,label,details={})=>{
            (ok?report.checks:report.failures).push({label,details});
            return !!ok;
          };
          const safeName=s=>s.replace(/[^a-z0-9_-]+/gi,'-');

          const browser=await chromium.launch({headless:true,args:['--disable-background-timer-throttling','--disable-backgrounding-occluded-windows','--disable-renderer-backgrounding']});

          async function pageFor(base,lang,w,h,kind,reduced='reduce',javaScriptEnabled=true){
            const touch=kind!=='desktop';
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              isMobile:touch,
              hasTouch:touch,
              reducedMotion:reduced,
              javaScriptEnabled
            });
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.goto(base+langs[lang].route,{waitUntil:'domcontentloaded',timeout:60000});
            return {context,page};
          }

          async function settleAt(page,selector){
            const loc=page.locator(selector);
            await loc.waitFor({state:'attached',timeout:10000});
            await page.evaluate(sel=>{
              const s=document.querySelector(sel);
              const r=s.getBoundingClientRect();
              window.scrollTo(0,Math.max(0,window.scrollY+r.top-22));
            },selector);
            await page.waitForTimeout(90);
            return loc;
          }

          async function metrics(page,selector,kind){
            return page.evaluate(({selector,kind})=>{
              const s=document.querySelector(selector);
              const lead=s.querySelector('.st-r2__lead');
              const supports=s.querySelector('.st-r2__supports');
              const trace=s.querySelector('.st-r2__trace--lead');
              const aperture=s.querySelector('.st-r2__aperture');
              const leadTitle=s.querySelector('.st-r2__lead-title');
              const supportTitle=s.querySelector('.st-r2__support-record h3');
              const summary=s.querySelector('.st-r2__summary');
              const leadSummary=s.querySelector('.st-r2__lead-summary');
              const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
              const sr=rect(s), lr=rect(lead), tr=rect(trace), ar=rect(aperture), rr=s.querySelector('.st-r2__read')?.getBoundingClientRect();
              const all=[...s.querySelectorAll('h2,h3,p,a,li')].map(el=>{
                const r=el.getBoundingClientRect();
                return {tag:el.tagName,text:(el.textContent||'').trim().slice(0,80),left:r.left,right:r.right,top:r.top,bottom:r.bottom};
              });
              const clip=all.filter(x=>x.right>innerWidth+2||x.left<-2);
              const intersects=!(ar.right<tr.x||ar.x>tr.right||ar.bottom<tr.y||ar.y>tr.bottom);
              const fs=e=>e?parseFloat(getComputedStyle(e).fontSize):0;
              return {
                section:sr,lead:lr,trace:tr,aperture:ar,
                viewport:{w:innerWidth,h:innerHeight},
                sectionViewportRatio:sr.height/innerHeight,
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                clip,
                apertureTraceIntersection:intersects,
                leadTitleSize:fs(leadTitle),
                supportTitleSize:fs(supportTitle),
                summarySize:fs(summary),
                leadSummarySize:fs(leadSummary),
                leadVsSupports: supports ? lr.width / supports.getBoundingClientRect().width : null,
                traceLeadRatio:tr.width/lr.width,
                readBelowTrace:rr ? rr.top>=tr.bottom-1 : false,
                traceDirection:kind==='portrait' ? (tr.height>tr.width?'vertical':'not-vertical') : (tr.width>tr.height?'horizontal':'not-horizontal'),
                entered:s.dataset.stR2Entered||'',
                calm:s.classList.contains('st-r2-calm')
              };
            },{selector,kind});
          }

          for(const lang of Object.keys(langs)){
            report.matrix[lang]={};
            for(const [name,w,h,kind] of viewports){
              const key=lang+'-'+name;
              report.matrix[lang][name]={};
              for(const [label,base,selector] of [
                ['current',BASE,langs[lang].baseline],
                ['r2',R2,langs[lang].candidate]
              ]){
                const {context,page}=await pageFor(base,lang,w,h,kind,'reduce',false);
                await settleAt(page,selector);
                if(label==='r2') await page.waitForTimeout(80);
                const dir=path.join(OUT,'ab',lang);
                fs.mkdirSync(dir,{recursive:true});
                const shot=path.join(dir, safeName(name+'-'+label)+'.png');
                await page.screenshot({path:shot,fullPage:false,animations:'disabled',timeout:12000});
                report.screenshotCount++;
                if(label==='r2'){
                  const m=await metrics(page,selector,kind);
                  report.matrix[lang][name].r2=m;
                  check(m.overflow<=1, key+': no horizontal overflow',m.overflow);
                  check(m.clip.length===0, key+': no viewport clipping',m.clip);
                  check(m.apertureTraceIntersection, key+': Aperture intersects Decision Trace', {aperture:m.aperture,trace:m.trace});
                  check(m.readBelowTrace, key+': lead CTA remains below trace', {trace:m.trace});
                  check(m.leadTitleSize>m.supportTitleSize*1.35, key+': lead title materially dominates support title', {lead:m.leadTitleSize,support:m.supportTitleSize});
                  check(m.traceDirection===(kind==='portrait'?'vertical':'horizontal'), key+': authored trace topology', m.traceDirection);
                  check(m.summarySize>=10.5, key+': secondary summary readable',m.summarySize);
                  check(m.leadSummarySize>=10.7, key+': lead summary readable',m.leadSummarySize);
                  if(kind==='desktop') {
                    check(m.traceLeadRatio>=.68, key+': lead trace uses substantial width',m.traceLeadRatio);
                    check(m.sectionViewportRatio<=1.24, key+': desktop chapter height controlled',m.sectionViewportRatio);
                  }
                  if(kind==='portrait') {
                    check(m.sectionViewportRatio<=1.50, key+': portrait chapter height controlled',m.sectionViewportRatio);
                  }
                  if(kind==='landscape') {
                    check(m.leadTitleSize>=22, key+': landscape lead type not tiny',m.leadTitleSize);
                    check(m.supportTitleSize>=14, key+': landscape support type not tiny',m.supportTitleSize);
                  }
                } else {
                  const s=await page.evaluate(sel=>{
                    const e=document.querySelector(sel),r=e.getBoundingClientRect();
                    return {height:r.height,width:r.width,ratio:r.height/innerHeight,overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth};
                  },selector);
                  report.matrix[lang][name].current=s;
                  check(s.overflow<=1,key+': current baseline no horizontal overflow',s.overflow);
                }
                await context.close();
              }
            }
          }

          // Motion gates on representative desktop / portrait / landscape in both languages.
          for(const lang of Object.keys(langs)){
            report.motion[lang]={};
            for(const [name,w,h,kind] of [['1440x900',1440,900,'desktop'],['390x844',390,844,'portrait'],['844x390',844,390,'landscape']]){
              const {context,page}=await pageFor(R2,lang,w,h,kind,'no-preference');
              const selector=langs[lang].candidate;
              const loc=await settleAt(page,selector);
              await page.waitForFunction(sel=>document.querySelector(sel)?.dataset.stR2Entered==='true',selector);
              await page.waitForTimeout(470);
              const mid=await page.evaluate(sel=>({
                running:document.getAnimations().filter(a=>a.playState==='running'&&String(a.animationName||'').startsWith('st-r2-')).map(a=>a.animationName),
                calm:document.querySelector(sel)?.classList.contains('st-r2-calm')
              }),selector);
              await page.waitForTimeout(950);
              const end=await page.evaluate(sel=>({
                running:document.getAnimations().filter(a=>a.playState==='running'&&String(a.animationName||'').startsWith('st-r2-')).map(a=>a.animationName),
                calm:document.querySelector(sel)?.classList.contains('st-r2-calm')
              }),selector);
              report.motion[lang][name]={mid,end};
              check(mid.running.length>0,lang+' '+name+': authored motion actually runs',mid);
              check(end.calm===true&&end.running.length===0,lang+' '+name+': absolute calm after entry',end);
              await context.close();
            }
          }

          // Reduced motion + focus + no-JS static authority.
          for(const lang of Object.keys(langs)){
            const {context,page}=await pageFor(R2,lang,390,844,'portrait','reduce');
            const selector=langs[lang].candidate;
            await settleAt(page,selector);
            await page.waitForTimeout(120);
            const reduced=await page.evaluate(sel=>({
              reduce:matchMedia('(prefers-reduced-motion: reduce)').matches,
              running:document.getAnimations().filter(a=>a.playState==='running'&&String(a.animationName||'').startsWith('st-r2-')).map(a=>a.animationName),
              opacity:getComputedStyle(document.querySelector(sel)).opacity,
              text:document.querySelector(sel)?.innerText||''
            }),selector);
            report.reduced[lang]=reduced;
            check(reduced.reduce&&reduced.running.length===0,lang+': reduced motion is immediate/static',reduced);
            check(reduced.text.includes(lang==='en'?'CAPTURE':'ЗАФИКСИРОВАТЬ'),lang+': framework text remains present',reduced.text.slice(0,240));

            const focus=await page.evaluate(sel=>{
              const s=document.querySelector(sel);
              const a=s.querySelector('.st-r2__lead-title a');
              a.focus();
              const cs=getComputedStyle(a);
              return {outlineStyle:cs.outlineStyle,outlineWidth:cs.outlineWidth,active:document.activeElement===a};
            },selector);
            report.accessibility[lang]=focus;
            check(focus.active&&focus.outlineStyle!=='none'&&parseFloat(focus.outlineWidth)>=2,lang+': keyboard focus visible',focus);

            await page.evaluate(()=>{document.body.style.zoom='2';});
            await page.waitForTimeout(80);
            const zoomOverflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth);
            check(zoomOverflow<=2,lang+': 200% CSS zoom remains horizontally functional',zoomOverflow);
            await context.close();

            const context2=await browser.newContext({viewport:{width:390,height:844},javaScriptEnabled:false});
            const page2=await context2.newPage();
            await page2.goto(R2+langs[lang].route,{waitUntil:'load',timeout:60000});
            const nojs=await page2.evaluate(sel=>{
              const s=document.querySelector(sel);
              return {exists:!!s,text:s?.innerText||'',display:s?getComputedStyle(s).display:'none'};
            },selector);
            check(nojs.exists&&nojs.display!=='none'&&nojs.text.includes(lang==='en'?'FOLLOW UP':'ПРОДОЛЖИТЬ'),lang+': essential R2 content survives without JS',nojs.text.slice(0,260));
            await context2.close();
          }

          report.pass=report.failures.length===0;
          fs.writeFileSync(path.join(OUT,'qa-results.json'),JSON.stringify(report,null,2));
          console.log(JSON.stringify({pass:report.pass,checks:report.checks.length,failures:report.failures.length,screenshots:report.screenshotCount,failuresDetail:report.failures},null,2));
          await browser.close();
          process.exit(report.pass?0:1);
          JS
          node "$GITHUB_WORKSPACE/r2-qa.mjs"

      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r2-ab-browser-qa
          path: /tmp/r2-qa
          if-no-files-found: error
          retention-days: 14
