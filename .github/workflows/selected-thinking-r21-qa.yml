name: Selected Thinking R2.1 Final Flagship QA

on:
  push:
    branches:
      - agent/proai-home-selected-thinking-r2-1-final-polish

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout R2.1 candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify narrow correction scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only e04bbbb90735d7dcc8228bbd4d61fc38242705b8...HEAD | sort | tee /tmp/r21-scope.txt
          grep -qx 'assets/css/home-selected-thinking-r2.css' /tmp/r21-scope.txt
          grep -qx 'assets/js/home-selected-thinking-r2.js' /tmp/r21-scope.txt
          grep -qx '.github/workflows/selected-thinking-r21-qa.yml' /tmp/r21-scope.txt
          ! grep -E '^(_includes/|index.html$|ru/index.html$|assets/(css|js)/home-selected-thinking-r1|assets/(css|js)/home-system|assets/(css|js)/home-selected-work)' /tmp/r21-scope.txt

      - name: Build production, accepted R2, and R2.1
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document

          git fetch origin main
          git worktree add /tmp/proai-main origin/main
          git worktree add /tmp/proai-r2 e04bbbb90735d7dcc8228bbd4d61fc38242705b8

          jekyll build --source /tmp/proai-main --destination /tmp/site-main
          jekyll build --source /tmp/proai-r2 --destination /tmp/site-r2
          jekyll build --source . --destination /tmp/site-r21

          python3 -m http.server 4173 --directory /tmp/site-main >/tmp/main-http.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/site-r2 >/tmp/r2-http.log 2>&1 &
          python3 -m http.server 4175 --directory /tmp/site-r21 >/tmp/r21-http.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null \
              && curl -fsS http://127.0.0.1:4174/ >/dev/null \
              && curl -fsS http://127.0.0.1:4175/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Install Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R2.1 browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r21-qa/static /tmp/r21-qa/motion
          cat > "$GITHUB_WORKSPACE/r21-qa.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const MAIN='http://127.0.0.1:4173';
          const R2='http://127.0.0.1:4174';
          const R21='http://127.0.0.1:4175';
          const OUT='/tmp/r21-qa';

          const viewports=[
            ['1920x1080',1920,1080,'desktop'],
            ['1440x900',1440,900,'desktop'],
            ['1366x768',1366,768,'desktop'],
            ['1280x720',1280,720,'desktop'],
            ['430x932',430,932,'portrait'],
            ['390x844',390,844,'portrait'],
            ['375x812',375,812,'portrait'],
            ['844x390',844,390,'landscape'],
            ['896x414',896,414,'landscape'],
            ['932x430',932,430,'landscape']
          ];

          const langs={
            en:{route:'/',main:'#selected-thinking-r1',r2:'#selected-thinking-r2',r21:'#selected-thinking-r2'},
            ru:{route:'/ru/',main:'#selected-thinking-r1',r2:'#selected-thinking-r2',r21:'#selected-thinking-r2'}
          };

          const report={pass:false,checks:[],failures:[],matrix:{},motion:{},staticShots:0,motionShots:0};
          const check=(ok,label,details={})=>{
            (ok?report.checks:report.failures).push({label,details});
            return !!ok;
          };
          const browser=await chromium.launch({headless:true,args:['--disable-background-timer-throttling','--disable-backgrounding-occluded-windows','--disable-renderer-backgrounding']});

          async function contextPage(base,route,w,h,kind,{reduce='reduce',runtime=false,js=true}={}){
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              isMobile:kind!=='desktop',
              hasTouch:kind!=='desktop',
              reducedMotion:reduce,
              javaScriptEnabled:js
            });
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            if(js){
              await page.route('**/*.js*',routeObj=>{
                const u=routeObj.request().url();
                if(runtime && base===R21 && u.includes('/assets/js/home-selected-thinking-r2.js')) return routeObj.continue();
                return routeObj.fulfill({status:200,contentType:'application/javascript',body:'/* QA: unrelated runtime suppressed */'});
              });
            }
            await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});
            return {context,page};
          }

          async function isolate(page,selector){
            await page.locator(selector).waitFor({state:'attached',timeout:10000});
            await page.evaluate(sel=>{
              const source=document.querySelector(sel);
              const clone=source.cloneNode(true);
              document.body.innerHTML='';
              document.body.style.margin='0';
              document.body.appendChild(clone);
              window.scrollTo(0,0);
            },selector);
            await page.waitForTimeout(40);
          }

          async function metrics(page,selector,kind){
            return page.evaluate(({selector,kind})=>{
              const s=document.querySelector(selector);
              const lead=s.querySelector('.st-r2__lead');
              const supports=s.querySelector('.st-r2__supports');
              const trace=s.querySelector('.st-r2__trace--lead');
              const aperture=s.querySelector('.st-r2__aperture');
              const leadTitle=s.querySelector('.st-r2__lead-title');
              const supportTitle=s.querySelector('.st-r2__support-record h3');
              const summary=s.querySelector('.st-r2__summary');
              const leadSummary=s.querySelector('.st-r2__lead-summary');
              const rect=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
              const sr=rect(s), lr=rect(lead), tr=rect(trace), ar=rect(aperture);
              const all=[...s.querySelectorAll('h2,h3,p,a,li')].map(el=>{
                const r=el.getBoundingClientRect();
                return {text:(el.textContent||'').trim().slice(0,70),left:r.left,right:r.right};
              });
              const items=[...trace.querySelectorAll('li')];
              const first=items[0].getBoundingClientRect(), last=items[items.length-1].getBoundingClientRect();
              const dx=Math.abs((last.left+last.width/2)-(first.left+first.width/2));
              const dy=Math.abs((last.top+last.height/2)-(first.top+first.height/2));
              const fs=e=>e?parseFloat(getComputedStyle(e).fontSize):0;
              return {
                ratio:sr.height/innerHeight,
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                clip:all.filter(x=>x.right>innerWidth+2||x.left<-2),
                traceDirection:dy>dx?'vertical':'horizontal',
                apertureTrace:!(ar.right<tr.x||ar.x>tr.right||ar.bottom<tr.y||ar.y>tr.bottom),
                leadTitleSize:fs(leadTitle),
                supportTitleSize:fs(supportTitle),
                summarySize:fs(summary),
                leadSummarySize:fs(leadSummary),
                traceLeadRatio:tr.width/lr.width,
                leadVsSupports:supports?lr.width/supports.getBoundingClientRect().width:null
              };
            },{selector,kind});
          }

          // A/B/C static matrix: production vs accepted R2 vs R2.1.
          for(const lang of Object.keys(langs)){
            report.matrix[lang]={};
            for(const [name,w,h,kind] of viewports){
              report.matrix[lang][name]={};
              for(const [label,base,selector] of [
                ['main',MAIN,langs[lang].main],
                ['r2',R2,langs[lang].r2],
                ['r21',R21,langs[lang].r21]
              ]){
                const {context,page}=await contextPage(base,langs[lang].route,w,h,kind,{reduce:'reduce',runtime:false,js:true});
                await isolate(page,selector);
                const dir=path.join(OUT,'static',lang);
                fs.mkdirSync(dir,{recursive:true});
                await page.screenshot({path:path.join(dir,`${name}-${label}.png`),fullPage:false,animations:'disabled'});
                report.staticShots++;
                if(label==='r21'){
                  const m=await metrics(page,selector,kind);
                  report.matrix[lang][name]=m;
                  check(m.overflow<=1,`${lang} ${name}: R2.1 no overflow`,m.overflow);
                  check(m.clip.length===0,`${lang} ${name}: R2.1 no clipping`,m.clip);
                  check(m.apertureTrace,`${lang} ${name}: Aperture intersects Trace`,{});
                  check(m.traceDirection===(kind==='portrait'?'vertical':'horizontal'),`${lang} ${name}: authored topology`,m.traceDirection);
                  check(m.leadTitleSize>m.supportTitleSize*1.35,`${lang} ${name}: lead authority`,{lead:m.leadTitleSize,support:m.supportTitleSize});
                  check(m.summarySize>=10.5,`${lang} ${name}: support copy readable`,m.summarySize);
                  check(m.leadSummarySize>=10.7,`${lang} ${name}: lead summary readable`,m.leadSummarySize);
                  if(kind==='desktop'){
                    check(m.traceLeadRatio>=.68,`${lang} ${name}: trace authoritative width`,m.traceLeadRatio);
                    check(m.ratio<=1.24,`${lang} ${name}: desktop chapter height controlled`,m.ratio);
                  }
                  if(kind==='portrait') check(m.ratio<=1.50,`${lang} ${name}: portrait height controlled`,m.ratio);
                  if(kind==='landscape'){
                    check(m.leadTitleSize>=22,`${lang} ${name}: landscape lead readable`,m.leadTitleSize);
                    check(m.supportTitleSize>=14,`${lang} ${name}: landscape support readable`,m.supportTitleSize);
                  }
                }
                await context.close();
              }
            }
          }

          async function setupMotion(lang,w,h,kind){
            const {context,page}=await contextPage(R21,langs[lang].route,w,h,kind,{reduce:'no-preference',runtime:true,js:true});
            const selector=langs[lang].r21;
            await page.locator(selector).waitFor({state:'attached'});
            await page.evaluate(sel=>{
              const s=document.querySelector(sel);
              window.__r21Events=[];
              ['st:r21-eligible','st:r21-start','st:r21-calm'].forEach(type=>{
                s.addEventListener(type,()=>window.__r21Events.push({type,t:performance.now()}));
              });
            },selector);
            return {context,page,selector};
          }

          async function centerTrace(page,selector){
            await page.evaluate(sel=>{
              const t=document.querySelector(sel).querySelector('.st-r2__trace-zone');
              const r=t.getBoundingClientRect();
              const y=window.scrollY+r.top-(window.innerHeight*.52);
              window.scrollTo(0,Math.max(0,y));
            },selector);
          }

          async function stageState(page,selector){
            return page.evaluate(sel=>{
              const s=document.querySelector(sel);
              const labels=[...s.querySelectorAll('.st-r2__trace--lead li')].map(x=>Number(getComputedStyle(x).opacity));
              return {
                labels,
                entered:s.dataset.stR2Entered||'',
                eligible:s.classList.contains('st-r21-eligible'),
                calm:s.classList.contains('st-r2-calm'),
                events:window.__r21Events||[],
                running:document.getAnimations().filter(a=>a.playState==='running'&&String(a.animationName||'').startsWith('st-r2-')).map(a=>a.animationName)
              };
            },selector);
          }

          // Attention timing and human-perceivable stage progression.
          const motionCases=[
            ['en','1440x900',1440,900,'desktop'],
            ['en','390x844',390,844,'portrait'],
            ['en','844x390',844,390,'landscape'],
            ['ru','390x844',390,844,'portrait']
          ];

          for(const [lang,name,w,h,kind] of motionCases){
            report.motion[`${lang}-${name}`]={};
            const {context,page,selector}=await setupMotion(lang,w,h,kind);

            // Header can enter without firing the important sequence.
            await page.evaluate(sel=>{
              const s=document.querySelector(sel);
              const r=s.getBoundingClientRect();
              window.scrollTo(0,Math.max(0,window.scrollY+r.top-window.innerHeight*.78));
            },selector);
            await page.waitForTimeout(620);
            const headerState=await stageState(page,selector);
            check(headerState.entered!=='true',`${lang} ${name}: no premature signature while chapter header arrives`,headerState);

            // Put the Trace in the authored attention window.
            await centerTrace(page,selector);
            await page.waitForFunction(sel=>document.querySelector(sel).classList.contains('st-r21-eligible'),selector,{timeout:3000});
            const eligibleAt=await page.evaluate(()=>window.__r21Events.find(e=>e.type==='st:r21-eligible')?.t||0);
            await page.waitForTimeout(kind==='landscape'?120:150);
            const preStart=await stageState(page,selector);
            check(preStart.entered!=='true',`${lang} ${name}: orientation pause is real`,preStart);

            await page.waitForFunction(sel=>document.querySelector(sel).dataset.stR2Entered==='true',selector,{timeout:3000});
            const startAt=await page.evaluate(()=>window.__r21Events.find(e=>e.type==='st:r21-start')?.t||0);
            const delay=startAt-eligibleAt;
            const minDelay=kind==='landscape'?220:(kind==='portrait'?320:280);
            const maxDelay=430;
            check(delay>=minDelay&&delay<=maxDelay,`${lang} ${name}: attention delay in authored window`,delay);

            const motionDir=path.join(OUT,'motion',lang,name);
            fs.mkdirSync(motionDir,{recursive:true});
            await page.screenshot({path:path.join(motionDir,'00-start.png'),fullPage:false});
            report.motionShots++;

            const sampleTimes=kind==='landscape'
              ? [390,690,980,1270]
              : kind==='portrait'
                ? [520,900,1280,1660]
                : [500,840,1180,1520];

            const states=[];
            let elapsed=0;
            for(let i=0;i<sampleTimes.length;i++){
              const wait=sampleTimes[i]-elapsed;
              await page.waitForTimeout(wait);
              elapsed=sampleTimes[i];
              const st=await stageState(page,selector);
              states.push(st);
              await page.screenshot({path:path.join(motionDir,`0${i+1}-stage.png`),fullPage:false});
              report.motionShots++;
            }

            // Stage progression must be visually ordered rather than simultaneous.
            for(let i=0;i<states.length;i++){
              const current=states[i].labels[i];
              const next=i<3?states[i].labels[i+1]:0;
              if(i<3) check(current>=next+0.08,`${lang} ${name}: stage ${i+1} resolves before stage ${i+2}`,{current,next,labels:states[i].labels});
              else check(current>=0.72,`${lang} ${name}: final stage visibly resolves`,states[i].labels);
            }

            const settleTarget=kind==='landscape'?2050:(kind==='portrait'?2360:2280);
            if(elapsed<settleTarget) await page.waitForTimeout(settleTarget-elapsed);
            const end=await stageState(page,selector);
            await page.screenshot({path:path.join(motionDir,'05-calm.png'),fullPage:false});
            report.motionShots++;
            check(end.calm===true&&end.running.length===0,`${lang} ${name}: absolute calm after signature`,end);
            report.motion[`${lang}-${name}`]={delay,states,end};
            await context.close();
          }

          // Fast-scroll landing: no early completion, then signature becomes visible after orientation delay.
          for(const [lang,w,h,kind] of [['en',1440,900,'desktop'],['en',390,844,'portrait']]){
            const {context,page,selector}=await setupMotion(lang,w,h,kind);
            await centerTrace(page,selector);
            await page.waitForTimeout(120);
            const early=await stageState(page,selector);
            check(early.entered!=='true',`${lang} ${w}x${h}: fast landing does not instantly consume signature`,early);
            await page.waitForTimeout(420);
            const started=await stageState(page,selector);
            check(started.entered==='true'&&!started.calm,`${lang} ${w}x${h}: fast landing retains visible signature`,started);
            await context.close();
          }

          // Reduced motion, no-JS and focus.
          for(const lang of Object.keys(langs)){
            {
              const {context,page}=await contextPage(R21,langs[lang].route,390,844,'portrait',{reduce:'reduce',runtime:true,js:true});
              const sel=langs[lang].r21;
              await page.locator(sel).waitFor({state:'attached'});
              await page.waitForTimeout(120);
              const reduced=await stageState(page,sel);
              check(reduced.calm===true&&reduced.running.length===0,`${lang}: reduced motion is immediate calm`,reduced);
              const focus=await page.evaluate(sel=>{
                const a=document.querySelector(sel).querySelector('.st-r2__lead-title a');
                a.focus();
                const cs=getComputedStyle(a);
                return {active:document.activeElement===a,style:cs.outlineStyle,width:parseFloat(cs.outlineWidth)};
              },sel);
              check(focus.active&&focus.style!=='none'&&focus.width>=2,`${lang}: visible keyboard focus`,focus);
              await context.close();
            }
            {
              const {context,page}=await contextPage(R21,langs[lang].route,390,844,'portrait',{js:false});
              const sel=langs[lang].r21;
              const nojs=await page.evaluate(sel=>{
                const s=document.querySelector(sel);
                return {exists:!!s,text:s?.innerText||'',display:s?getComputedStyle(s).display:'none'};
              },sel);
              check(nojs.exists&&nojs.display!=='none'&&nojs.text.includes(lang==='en'?'FOLLOW UP':'ПРОДОЛЖИТЬ'),`${lang}: no-JS final content intact`,nojs.text.slice(0,220));
              await context.close();
            }
          }

          report.pass=report.failures.length===0;
          fs.writeFileSync(path.join(OUT,'qa-results.json'),JSON.stringify(report,null,2));
          console.log(JSON.stringify({pass:report.pass,checks:report.checks.length,failures:report.failures.length,staticShots:report.staticShots,motionShots:report.motionShots,failuresDetail:report.failures},null,2));
          await browser.close();
          process.exit(report.pass?0:1);
          JS
          node "$GITHUB_WORKSPACE/r21-qa.mjs"

      - name: Upload R2.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r21-final-qa
          path: /tmp/r21-qa
          if-no-files-found: error
          retention-days: 14
