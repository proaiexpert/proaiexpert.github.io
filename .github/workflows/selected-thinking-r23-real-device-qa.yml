name: Selected Thinking R2.3 Real Device Landscape QA

on:
  push:
    branches:
      - hotfix/selected-thinking-r23-real-device-landscape-r1

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify narrow scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 5806283a258ddd86da8897d3fe32e16925259596...HEAD | sort | tee /tmp/scope.txt
          grep -qx 'assets/css/home-selected-thinking-r2.css' /tmp/scope.txt
          grep -qx 'index.html' /tmp/scope.txt
          grep -qx 'ru/index.html' /tmp/scope.txt
          grep -qx '.github/workflows/selected-thinking-r23-real-device-qa.yml' /tmp/scope.txt
          test "$(wc -l < /tmp/scope.txt)" -eq 4

      - name: Build and verify fresh asset key
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination /tmp/site
          V='decision-aperture-r23-real-device-r1'
          for f in /tmp/site/index.html /tmp/site/ru/index.html; do
            grep -q "home-selected-thinking-r2.css?v=$V" "$f"
            grep -q "home-selected-thinking-r2.js?v=$V" "$f"
          done
          grep -Fq 'display: flex;' /tmp/site/assets/css/home-selected-thinking-r2.css
          grep -Fq 'justify-content: space-between;' /tmp/site/assets/css/home-selected-thinking-r2.css
          grep -Fq 'width: max-content;' /tmp/site/assets/css/home-selected-thinking-r2.css
          python3 -m http.server 4178 --directory /tmp/site >/tmp/http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4178/ru/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/http.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium and WebKit
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run real-device resilience QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r23-qa
          cat > r23-qa.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const BASE='http://127.0.0.1:4178';
          const OUT='/tmp/r23-qa';
          const failures=[],checks=[];
          const check=(ok,label,details={})=>(ok?checks:failures).push({label,details});

          async function open(browserType,lang,w,h,{reduce='reduce'}={}){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              screen:{width:w,height:h},
              isMobile:w<1000,
              hasTouch:w<1000,
              reducedMotion:reduce
            });
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.route('**/*.js*',r=>{
              const u=r.request().url();
              if(u.includes('/assets/js/home-selected-thinking-r2.js')) return r.continue();
              return r.fulfill({status:200,contentType:'application/javascript',body:'/* QA: unrelated runtime suppressed */'});
            });
            await page.goto(BASE+(lang==='ru'?'/ru/':'/'),{waitUntil:'domcontentloaded',timeout:60000});
            return {browser,context,page};
          }

          async function metrics(page){
            return await page.evaluate(()=>{
              const s=document.querySelector('#selected-thinking-r2');
              const trace=s?.querySelector('.st-r2__trace--lead');
              if(!s||!trace) return {missing:true};
              const items=[...trace.querySelectorAll('li')];
              const rects=items.map(li=>{
                const range=document.createRange(); range.selectNodeContents(li);
                const r=range.getBoundingClientRect(), b=li.getBoundingClientRect(), cs=getComputedStyle(li);
                return {
                  text:(li.textContent||'').trim(),
                  left:r.left,right:r.right,width:r.width,
                  cellLeft:b.left,cellRight:b.right,cellWidth:b.width,
                  clientWidth:li.clientWidth,scrollWidth:li.scrollWidth,
                  fontSize:parseFloat(cs.fontSize),whiteSpace:cs.whiteSpace,
                  flex:cs.flex,display:cs.display
                };
              });
              const gaps=rects.slice(0,-1).map((x,i)=>rects[i+1].left-x.right);
              const tr=trace.getBoundingClientRect();
              const first=items[0].getBoundingClientRect(),last=items.at(-1).getBoundingClientRect();
              const dx=Math.abs((last.left+last.width/2)-(first.left+first.width/2));
              const dy=Math.abs((last.top+last.height/2)-(first.top+first.height/2));
              return {
                missing:false,rects,gaps,
                trace:{clientWidth:trace.clientWidth,scrollWidth:trace.scrollWidth,width:tr.width,display:getComputedStyle(trace).display},
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                direction:dy>dx?'vertical':'horizontal',
                sectionHeight:s.getBoundingClientRect().height/innerHeight
              };
            });
          }

          const landscapeSizes=[[760,390],[844,390],[896,414],[932,430]];
          for(const [engine,browserType] of [['chromium',chromium],['webkit',webkit]]){
            for(const lang of ['ru','en']){
              for(const [w,h] of landscapeSizes){
                const {browser,context,page}=await open(browserType,lang,w,h);
                await page.locator('#selected-thinking-r2').scrollIntoViewIfNeeded();
                await page.waitForTimeout(100);
                let m=await metrics(page);
                const key=`${engine} ${lang} ${w}x${h}`;
                check(!m.missing,key+': component exists',m);
                check(m.overflow<=1,key+': no viewport overflow',m.overflow);
                check(m.direction==='horizontal',key+': landscape topology horizontal',m.direction);
                check(m.trace.scrollWidth<=m.trace.clientWidth+1,key+': lead trace itself does not overflow',m.trace);
                check(m.gaps.every(g=>g>=8),key+': adjacent text gap >=8px',m.gaps);
                check(m.rects.every(x=>x.scrollWidth<=x.clientWidth+1),key+': every label owns enough width',m.rects);

                if(lang==='ru'){
                  check(m.trace.display==='flex',key+': RU uses natural-width flex trace',m.trace.display);
                  check(m.rects.every(x=>x.whiteSpace==='nowrap'),key+': RU labels stay one line',m.rects.map(x=>x.whiteSpace));
                  check(m.rects.every(x=>x.fontSize>=8),key+': RU labels remain legible',m.rects.map(x=>x.fontSize));

                  // Font-metric stress: simulate a real-device Cyrillic font roughly 25% wider.
                  await page.addStyleTag({content:`
                    @media (min-width:760px) and (max-width:950px) and (max-height:500px){
                      .selected-thinking-r2--ru .st-r2__trace--lead{
                        font-size:10.2px !important;
                        letter-spacing:.02em !important;
                      }
                    }`
                  });
                  await page.waitForTimeout(40);
                  const stress=await metrics(page);
                  check(stress.trace.scrollWidth<=stress.trace.clientWidth+1,key+': 25% font-width stress still fits trace',stress.trace);
                  check(stress.gaps.every(g=>g>=8),key+': 25% font-width stress keeps >=8px gaps',stress.gaps);
                }

                const dir=path.join(OUT,engine,lang);
                fs.mkdirSync(dir,{recursive:true});
                await page.screenshot({path:path.join(dir,`${w}x${h}.png`),fullPage:false,animations:'disabled'});
                await context.close(); await browser.close();
              }
            }
          }

          // Laptop + portrait regression.
          for(const lang of ['ru','en']){
            for(const [w,h,kind] of [
              [1280,720,'desktop'],[1366,768,'desktop'],[1440,900,'desktop'],[1920,1080,'desktop'],
              [390,844,'portrait'],[430,932,'portrait']
            ]){
              const {browser,context,page}=await open(chromium,lang,w,h);
              const m=await metrics(page);
              const key=`regression ${lang} ${w}x${h}`;
              check(m.overflow<=1,key+': no overflow',m.overflow);
              check(m.direction===(kind==='portrait'?'vertical':'horizontal'),key+': topology preserved',m.direction);
              check(kind==='portrait'?m.sectionHeight<=1.50:m.sectionHeight<=1.24,key+': section height preserved',m.sectionHeight);
              await context.close(); await browser.close();
            }
          }

          // Ensure landscape motion still settles correctly after the display-mode change.
          {
            const {browser,context,page}=await open(chromium,'ru',844,390,{reduce:'no-preference'});
            await page.evaluate(()=>{
              document.documentElement.style.scrollBehavior='auto';
              const s=document.querySelector('#selected-thinking-r2');
              const t=s.querySelector('.st-r2__trace-zone'),r=t.getBoundingClientRect();
              window.scrollTo({top:Math.max(0,window.scrollY+r.top-window.innerHeight*.52),behavior:'instant'});
            });
            await page.waitForFunction(()=>document.querySelector('#selected-thinking-r2').dataset.stR2Entered==='true',{timeout:3000});
            await page.waitForFunction(()=>document.querySelector('#selected-thinking-r2').classList.contains('st-r2-calm'),{timeout:4000});
            const calm=await page.evaluate(()=>({
              calm:document.querySelector('#selected-thinking-r2').classList.contains('st-r2-calm'),
              running:document.getAnimations().filter(a=>a.playState==='running'&&String(a.animationName||'').startsWith('st-r2-')).length
            }));
            check(calm.calm&&calm.running===0,'RU landscape motion remains absolute calm',calm);
            await context.close(); await browser.close();
          }

          const report={pass:failures.length===0,checks:checks.length,failures,details:checks};
          fs.writeFileSync(path.join(OUT,'qa-results.json'),JSON.stringify(report,null,2));
          console.log(JSON.stringify({pass:report.pass,checks:report.checks,failures:report.failures},null,2));
          process.exit(report.pass?0:1);
          JS
          node r23-qa.mjs

      - name: Upload R2.3 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r23-real-device-qa
          path: /tmp/r23-qa
          if-no-files-found: error
          retention-days: 14
