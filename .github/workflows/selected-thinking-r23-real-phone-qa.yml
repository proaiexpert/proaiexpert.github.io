name: Selected Thinking R2.3 Real Phone Breakpoint QA

on:
  push:
    branches:
      - hotfix/selected-thinking-r23-landscape-authority-r2

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination /tmp/site
          python3 -m http.server 4180 --directory /tmp/site >/tmp/http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4180/ru/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browsers
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run real-phone landscape QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r23-real-phone
          cat > qa.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const BASE='http://127.0.0.1:4180';
          const OUT='/tmp/r23-real-phone';
          const failures=[],checks=[];
          const check=(ok,label,details={})=>(ok?checks:failures).push({label,details});

          async function open(browserType,lang,w,h){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              screen:{width:w,height:h},
              isMobile:true,hasTouch:true,reducedMotion:'reduce'
            });
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.goto(BASE+(lang==='ru'?'/ru/':'/'),{waitUntil:'domcontentloaded',timeout:60000});
            return {browser,context,page};
          }

          async function measure(page){
            return await page.evaluate(()=>{
              const s=document.querySelector('#selected-thinking-r2');
              const stage=s.querySelector('.st-r2__stage');
              const lead=s.querySelector('.st-r2__lead');
              const supports=s.querySelector('.st-r2__supports');
              const trace=s.querySelector('.st-r2__trace--lead');
              const items=[...trace.querySelectorAll('li')];
              const r=x=>x.getBoundingClientRect();
              const sr=r(stage),lr=r(lead),rr=r(supports);
              const labels=items.map(li=>{
                const range=document.createRange(); range.selectNodeContents(li);
                const tr=range.getBoundingClientRect(), br=li.getBoundingClientRect(), cs=getComputedStyle(li);
                return {text:li.textContent.trim(),left:tr.left,right:tr.right,width:tr.width,boxWidth:br.width,clientWidth:li.clientWidth,scrollWidth:li.scrollWidth,fontSize:parseFloat(cs.fontSize),whiteSpace:cs.whiteSpace};
              });
              const gaps=labels.slice(0,-1).map((x,i)=>labels[i+1].left-x.right);
              return {
                innerWidth,innerHeight,
                leadShare:lr.width/sr.width,
                supportShare:rr.width/sr.width,
                labels,gaps,
                traceDisplay:getComputedStyle(trace).display,
                traceOverflow:trace.scrollWidth-trace.clientWidth,
                pageOverflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth
              };
            });
          }

          const sizes=[[844,390],[896,414],[932,430],[956,440],[960,440],[1024,500]];
          for(const [engine,browserType] of [['chromium',chromium],['webkit',webkit]]){
            for(const lang of ['ru','en']){
              for(const [w,h] of sizes){
                const {browser,context,page}=await open(browserType,lang,w,h);
                await page.locator('#selected-thinking-r2').scrollIntoViewIfNeeded();
                await page.waitForTimeout(80);
                const m=await measure(page);
                const key=`${engine} ${lang} ${w}x${h}`;
                check(m.pageOverflow<=1,key+': no page overflow',m.pageOverflow);
                check(m.leadShare>=.665&&m.leadShare<=.695,key+': lead share ~68%',m.leadShare);
                check(m.supportShare>=.305&&m.supportShare<=.335,key+': support share ~32%',m.supportShare);
                check(m.traceOverflow<=1,key+': trace no overflow',m.traceOverflow);
                check(m.labels.every(x=>x.scrollWidth<=x.clientWidth+1),key+': labels fit boxes',m.labels);
                check(m.gaps.every(g=>g>=10),key+': label gaps >=10px',m.gaps);
                if(lang==='ru'){
                  check(m.traceDisplay==='flex',key+': RU natural-width flex active',m.traceDisplay);
                  check(m.labels.every(x=>x.whiteSpace==='nowrap'),key+': RU single-line labels',m.labels.map(x=>x.whiteSpace));
                }
                const dir=path.join(OUT,engine,lang); fs.mkdirSync(dir,{recursive:true});
                await page.screenshot({path:path.join(dir,`${w}x${h}.png`),fullPage:false,animations:'disabled'});
                await context.close(); await browser.close();
              }
            }
          }

          const report={pass:failures.length===0,checks:checks.length,failures,details:checks};
          fs.writeFileSync(path.join(OUT,'qa-results.json'),JSON.stringify(report,null,2));
          console.log(JSON.stringify({pass:report.pass,checks:report.checks,failures:report.failures},null,2));
          process.exit(report.pass?0:1);
          JS
          node qa.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r23-real-phone-qa
          path: /tmp/r23-real-phone
          if-no-files-found: error
          retention-days: 14
