name: Selected Thinking R2.4 Landscape Topology QA

on:
  push:
    branches:
      - agent/selected-thinking-r24-landscape-topology

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify narrow scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only bf5da6011d22644bd8e1d7d4d97e6f4a91d97342...HEAD | sort | tee /tmp/scope.txt
          grep -qx 'assets/css/home-selected-thinking-r2.css' /tmp/scope.txt
          grep -qx 'assets/js/home-selected-thinking-r2.js' /tmp/scope.txt
          grep -qx 'index.html' /tmp/scope.txt
          grep -qx 'ru/index.html' /tmp/scope.txt
          grep -qx '.github/workflows/selected-thinking-r24-landscape-topology-qa.yml' /tmp/scope.txt
          test "$(wc -l < /tmp/scope.txt)" -eq 5

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination /tmp/site
          V='decision-aperture-r24-landscape-topology-r1'
          for f in /tmp/site/index.html /tmp/site/ru/index.html; do
            grep -q "home-selected-thinking-r2.css?v=$V" "$f"
            grep -q "home-selected-thinking-r2.js?v=$V" "$f"
          done
          python3 -m http.server 4181 --directory /tmp/site >/tmp/http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4181/ru/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium and WebKit
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run topology QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r24
          cat > qa.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const BASE='http://127.0.0.1:4181';
          const OUT='/tmp/r24';
          const failures=[],checks=[];
          const check=(ok,label,details={})=>(ok?checks:failures).push({label,details});

          async function open(browserType,lang,w,h,reduce='reduce'){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              screen:{width:w,height:h},
              isMobile:w<1150,
              hasTouch:w<1150,
              reducedMotion:reduce
            });
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.route('**/*.js*',r=>{
              const u=r.request().url();
              if(u.includes('/assets/js/home-selected-thinking-r2.js')) return r.continue();
              return r.fulfill({status:200,contentType:'application/javascript',body:'/* QA unrelated runtime suppressed */'});
            });
            await page.goto(BASE+(lang==='ru'?'/ru/':'/'),{waitUntil:'domcontentloaded',timeout:60000});
            return {browser,context,page};
          }

          async function m(page){
            return await page.evaluate(()=>{
              const s=document.querySelector('#selected-thinking-r2');
              const stage=s.querySelector('.st-r2__stage');
              const lead=s.querySelector('.st-r2__lead');
              const supports=s.querySelector('.st-r2__supports');
              const records=[...supports.querySelectorAll('.st-r2__support-record')];
              const trace=s.querySelector('.st-r2__trace--lead');
              const items=[...trace.querySelectorAll('li')];
              const rect=x=>{const r=x.getBoundingClientRect();return{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
              const sr=rect(stage),lr=rect(lead),pr=rect(supports),rr=records.map(rect);
              const labels=items.map(li=>{
                const range=document.createRange();range.selectNodeContents(li);
                const tr=range.getBoundingClientRect(),br=li.getBoundingClientRect(),cs=getComputedStyle(li);
                return {text:li.textContent.trim(),left:tr.left,right:tr.right,width:tr.width,cellWidth:br.width,scrollWidth:li.scrollWidth,clientWidth:li.clientWidth,fontSize:parseFloat(cs.fontSize),whiteSpace:cs.whiteSpace};
              });
              const gaps=labels.slice(0,-1).map((x,i)=>labels[i+1].left-x.right);
              const title=s.querySelector('.st-r2__lead-title');
              const supportTitle=s.querySelector('.st-r2__support-record h3');
              return {
                stage:sr,lead:lr,supports:pr,records:rr,labels,gaps,
                stageDisplay:getComputedStyle(stage).display,
                supportsDisplay:getComputedStyle(supports).display,
                leadShare:lr.width/sr.width,
                supportEqual:rr.length===2?Math.abs(rr[0].width-rr[1].width):999,
                supportsBelow:pr.top>=lr.bottom-1,
                supportSideBySide:rr.length===2&&Math.abs(rr[0].top-rr[1].top)<2&&rr[1].left>rr[0].left,
                traceOverflow:trace.scrollWidth-trace.clientWidth,
                pageOverflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                leadTitleSize:parseFloat(getComputedStyle(title).fontSize),
                supportTitleSize:parseFloat(getComputedStyle(supportTitle).fontSize),
                sectionHeight:s.getBoundingClientRect().height/innerHeight
              };
            });
          }

          const landscape=[[844,390],[896,414],[932,430],[956,440],[1024,500],[1100,600]];
          for(const [engine,browserType] of [['chromium',chromium],['webkit',webkit]]){
            for(const lang of ['ru','en']){
              for(const [w,h] of landscape){
                const {browser,context,page}=await open(browserType,lang,w,h);
                await page.locator('#selected-thinking-r2').scrollIntoViewIfNeeded();
                await page.waitForTimeout(80);
                const x=await m(page), key=`${engine} ${lang} ${w}x${h}`;
                check(x.stageDisplay==='block',key+': stage uses full-width lead topology',x.stageDisplay);
                check(x.leadShare>=.985,key+': Lead 01 owns full stage width',x.leadShare);
                check(x.supportsBelow,key+': supporting row is below Lead 01',{lead:x.lead,supports:x.supports});
                check(x.supportSideBySide,key+': 02/03 are side-by-side',x.records);
                check(x.supportEqual<=2,key+': 02/03 are equal width',x.supportEqual);
                check(x.traceOverflow<=1,key+': lead trace does not overflow',x.traceOverflow);
                check(x.labels.every(v=>v.scrollWidth<=v.clientWidth+1),key+': all lead labels own enough width',x.labels);
                check(x.gaps.every(g=>g>=14),key+': lead labels keep >=14px visual gap',x.gaps);
                check(x.pageOverflow<=1,key+': no page overflow',x.pageOverflow);
                check(x.leadTitleSize>x.supportTitleSize*1.45,key+': Lead 01 keeps editorial authority',{lead:x.leadTitleSize,support:x.supportTitleSize});
                const dir=path.join(OUT,engine,lang);fs.mkdirSync(dir,{recursive:true});
                await page.screenshot({path:path.join(dir,`${w}x${h}.png`),fullPage:false,animations:'disabled'});
                await context.close();await browser.close();
              }
            }
          }

          // Desktop and portrait must remain their existing topologies.
          for(const [lang,w,h,expected] of [
            ['ru',1280,720,'grid'],['en',1280,720,'grid'],
            ['ru',1440,900,'grid'],['en',1440,900,'grid'],
            ['ru',390,844,'block'],['en',390,844,'block'],
            ['ru',430,932,'block'],['en',430,932,'block']
          ]){
            const {browser,context,page}=await open(chromium,lang,w,h);
            const x=await m(page), key=`regression ${lang} ${w}x${h}`;
            check(x.stageDisplay===expected,key+': existing topology preserved',{display:x.stageDisplay,expected});
            check(x.pageOverflow<=1,key+': no page overflow',x.pageOverflow);
            await context.close();await browser.close();
          }

          // Landscape motion remains one-shot and calm.
          {
            const {browser,context,page}=await open(chromium,'ru',956,440,'no-preference');
            await page.evaluate(()=>{
              document.documentElement.style.scrollBehavior='auto';
              const s=document.querySelector('#selected-thinking-r2');
              const t=s.querySelector('.st-r2__trace-zone'),r=t.getBoundingClientRect();
              window.scrollTo({top:Math.max(0,window.scrollY+r.top-window.innerHeight*.52),behavior:'instant'});
            });
            await page.waitForFunction(()=>document.querySelector('#selected-thinking-r2').dataset.stR2Entered==='true',{timeout:3000});
            await page.waitForFunction(()=>document.querySelector('#selected-thinking-r2').classList.contains('st-r2-calm'),{timeout:4000});
            const calm=await page.evaluate(()=>({
              calm:document.querySelector('#selected-thinking-r2').classList.contains('st-r2-calm'),
              running:document.getAnimations().filter(a=>a.playState==='running'&&String(a.animationName||'').startsWith('st-r2-')).length
            }));
            check(calm.calm&&calm.running===0,'RU 956x440 motion reaches absolute calm',calm);
            await context.close();await browser.close();
          }

          const report={pass:failures.length===0,checks:checks.length,failures,details:checks};
          fs.writeFileSync(path.join(OUT,'qa-results.json'),JSON.stringify(report,null,2));
          console.log(JSON.stringify({pass:report.pass,checks:report.checks,failures:report.failures},null,2));
          process.exit(report.pass?0:1);
          JS
          node qa.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r24-landscape-topology-qa
          path: /tmp/r24
          if-no-files-found: error
          retention-days: 14
