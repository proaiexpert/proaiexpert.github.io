name: Selected Thinking R2.4 Touch Landscape QA

on:
  push:
    branches:
      - agent/selected-thinking-r24-landscape-topology

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination /tmp/site
          V='decision-aperture-r24-touch-landscape-r2'
          grep -q "home-selected-thinking-r2.css?v=$V" /tmp/site/ru/index.html
          grep -q "home-selected-thinking-r2.js?v=$V" /tmp/site/ru/index.html
          python3 -m http.server 4182 --directory /tmp/site >/tmp/http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4182/ru/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browsers
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Run touch-landscape QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r24touch
          cat > qa.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const BASE='http://127.0.0.1:4182';
          const OUT='/tmp/r24touch';
          const failures=[],checks=[];
          const check=(ok,label,details={})=>(ok?checks:failures).push({label,details});

          async function open(browserType,lang,w,h,{touch=true,reduce='reduce'}={}){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:w,height:h},
              screen:{width:w,height:h},
              isMobile:touch,
              hasTouch:touch,
              reducedMotion:reduce
            });
            const page=await context.newPage();
            await page.route('https://fonts.googleapis.com/**',r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await page.route('https://fonts.gstatic.com/**',r=>r.abort());
            await page.goto(BASE+(lang==='ru'?'/ru/':'/'),{waitUntil:'domcontentloaded',timeout:60000});
            return {browser,context,page};
          }

          async function measure(page){
            return await page.evaluate(()=>{
              const s=document.querySelector('#selected-thinking-r2');
              const stage=s.querySelector('.st-r2__stage');
              const lead=s.querySelector('.st-r2__lead');
              const supports=s.querySelector('.st-r2__supports');
              const records=[...supports.querySelectorAll('.st-r2__support-record')];
              const trace=s.querySelector('.st-r2__trace--lead');
              const items=[...trace.querySelectorAll('li')];
              const r=x=>x.getBoundingClientRect();
              const sr=r(stage),lr=r(lead),pr=r(supports),rr=records.map(r);
              const labels=items.map(li=>{
                const range=document.createRange();range.selectNodeContents(li);
                const tr=range.getBoundingClientRect(),br=li.getBoundingClientRect(),cs=getComputedStyle(li);
                return {text:li.textContent.trim(),left:tr.left,right:tr.right,width:tr.width,boxWidth:br.width,scrollWidth:li.scrollWidth,clientWidth:li.clientWidth,whiteSpace:cs.whiteSpace};
              });
              return {
                mediaTouchLandscape:matchMedia('(orientation: landscape) and (any-pointer: coarse)').matches,
                stageDisplay:getComputedStyle(stage).display,
                supportsDisplay:getComputedStyle(supports).display,
                leadShare:lr.width/sr.width,
                supportsBelow:pr.top>=lr.bottom-1,
                supportEqual:rr.length===2?Math.abs(rr[0].width-rr[1].width):999,
                supportSideBySide:rr.length===2&&Math.abs(rr[0].top-rr[1].top)<2&&rr[1].left>rr[0].left,
                gaps:labels.slice(0,-1).map((x,i)=>labels[i+1].left-x.right),
                labels,
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth
              };
            });
          }

          const touchSizes=[[844,390],[956,440],[1100,650],[1200,700]];
          for(const [engine,browserType] of [['chromium',chromium],['webkit',webkit]]){
            for(const lang of ['ru','en']){
              for(const [w,h] of touchSizes){
                const {browser,context,page}=await open(browserType,lang,w,h,{touch:true});
                await page.locator('#selected-thinking-r2').scrollIntoViewIfNeeded();
                await page.waitForTimeout(80);
                const m=await measure(page), key=`${engine} touch ${lang} ${w}x${h}`;
                check(m.mediaTouchLandscape,key+': coarse landscape media matches',m);
                check(m.stageDisplay==='block',key+': R2.4 full-row stage active',m.stageDisplay);
                check(m.leadShare>=.985,key+': Lead owns full width',m.leadShare);
                check(m.supportsBelow,key+': supports below Lead',{});
                check(m.supportSideBySide,key+': 02/03 side-by-side',m.supportSideBySide);
                check(m.supportEqual<=2,key+': 02/03 equal width',m.supportEqual);
                check(m.gaps.every(g=>g>=14),key+': lead labels keep >=14px gap',m.gaps);
                check(m.labels.every(x=>x.scrollWidth<=x.clientWidth+1),key+': labels fit',m.labels);
                check(m.overflow<=1,key+': no viewport overflow',m.overflow);
                const dir=path.join(OUT,engine,lang);fs.mkdirSync(dir,{recursive:true});
                await page.screenshot({path:path.join(dir,`${w}x${h}.png`),fullPage:false,animations:'disabled'});
                await context.close();await browser.close();
              }
            }
          }

          // Mouse desktop must retain the production desktop composition.
          for(const [w,h] of [[1280,720],[1440,900]]){
            const {browser,context,page}=await open(chromium,'ru',w,h,{touch:false});
            const m=await measure(page), key=`desktop mouse ${w}x${h}`;
            check(!m.mediaTouchLandscape,key+': touch landscape media does not match',m.mediaTouchLandscape);
            check(m.stageDisplay==='grid',key+': desktop grid preserved',m.stageDisplay);
            check(m.overflow<=1,key+': no overflow',m.overflow);
            await context.close();await browser.close();
          }

          // Portrait touch must retain authored vertical topology.
          {
            const {browser,context,page}=await open(chromium,'ru',430,932,{touch:true});
            const m=await measure(page);
            check(!m.mediaTouchLandscape,'portrait: touch landscape media does not match',m.mediaTouchLandscape);
            check(m.stageDisplay==='block','portrait: vertical stage preserved',m.stageDisplay);
            check(m.supportsDisplay==='block','portrait: supports remain vertical',m.supportsDisplay);
            await context.close();await browser.close();
          }

          const report={pass:failures.length===0,checks:checks.length,failures,details:checks};
          fs.writeFileSync(path.join(OUT,'qa-results.json'),JSON.stringify(report,null,2));
          console.log(JSON.stringify({pass:report.pass,checks:report.checks,failures:report.failures},null,2));
          process.exit(report.pass?0:1);
          JS
          node qa.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r24-touch-landscape-qa
          path: /tmp/r24touch
          if-no-files-found: error
          retention-days: 14
