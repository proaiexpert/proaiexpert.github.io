name: Selected Thinking R3.2 — Cloudflare Owner Preview HTTP proof
on:
  push:
    branches: [qa/selected-thinking-r32-cloudflare-proof-r1]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Real served Jekyll HTML, updated CSS, AB evidence and noindex
        shell: bash
        run: |
          set -euo pipefail
          REPO="proaiexpert/proaiexpert.github.io"
          REF="preview/selected-thinking-r32-jekyll-rendered-fast1"
          HOST=""
          for i in $(seq 1 85); do
            SHA=$(curl -fsSL --connect-timeout 6 --max-time 14 "https://api.github.com/repos/$REPO/git/ref/heads/$REF" 2>/dev/null | jq -r '.object.sha // empty' || true)
            if [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
              CHECKS=$(curl -fsSL --connect-timeout 6 --max-time 14 "https://api.github.com/repos/$REPO/commits/$SHA/check-runs" || true)
              HOST=$(printf '%s' "$CHECKS" | jq -r '.check_runs[]? | select(.name=="Cloudflare Pages" and .conclusion=="success") | .output.summary' | grep -Eo 'https://[0-9a-f]{8}\.proaiexpert-github-io\.pages\.dev' | head -1 || true)
              if [ -n "$HOST" ]; then break; fi
            fi
            sleep 10
          done
          [ -n "$HOST" ] || { echo "Cloudflare immutable deployment not proven"; exit 1; }
          echo "IMMUTABLE_DEPLOYMENT=$HOST"
          BASE="$HOST/owner-preview/selected-thinking-r32-final"
          for PATH in home-ru.html home-en.html hub-ru.html article-v2-ru.html; do
            PAGE="$BASE/$PATH"
            curl -fLsS --connect-timeout 8 --max-time 22 "$PAGE" -o "/tmp/$PATH"
            curl -fsSI --max-time 12 "$PAGE" > "/tmp/$PATH.headers"
            ! grep -Fq '{%' "/tmp/$PATH"
            ! grep -Fq '{{' "/tmp/$PATH"
            grep -Fq 'data-home-footer-golden-r3' "/tmp/$PATH"
            grep -Eiq '^x-robots-tag: *noindex' "/tmp/$PATH.headers"
            if [[ "$PATH" == home* ]];then
              grep -Fq 'home-selected-thinking-r2.css?v=editorial-density-r32' "/tmp/$PATH"
              grep -Fq 'id="selected-thinking-r2"' "/tmp/$PATH"
            fi
            echo "LIVE_PAGE_PASS $PAGE"
          done
          curl -fLsS --max-time 22 "$HOST/assets/css/home-selected-thinking-r2.css" -o /tmp/r32.css
          grep -Fq -- '--st3-folio-line' /tmp/r32.css
          grep -Fq 'transparent;-webkit-text-stroke' /tmp/r32.css
          curl -fLsS --max-time 22 "$HOST/assets/css/insights-editorial-v2.css" -o /tmp/r32-insights.css
          grep -Fq 'color:transparent;-webkit-text-stroke:.85px' /tmp/r32-insights.css
          curl -fLsS --max-time 22 "$BASE/benchmark.json" -o /tmp/r32-benchmark.json
          jq -e '.heights | length >= 3' /tmp/r32-benchmark.json >/dev/null
          for SHOT in r31-home_ru-desktop-1440.png r32-home_ru-desktop-1440.png r31-home_en-desktop-1440.png r32-home_en-desktop-1440.png r31-home_ru-desktop-1600.png r32-home_ru-desktop-1600.png r32-home_ru-portrait-390.png r32-home_ru-landscape-844.png r32-hub_ru-desktop-1440.png r32-article_ru-desktop-1440.png; do
            curl -fLsS --max-time 30 "$BASE/screenshots/$SHOT" -o "/tmp/$SHOT"
            file "/tmp/$SHOT" | grep -Fq 'PNG image data'
            echo "LIVE_SCREENSHOT_PASS $SHOT"
          done
          for FRAME in 0000 0200 0600 1300;do
            curl -fLsS --max-time 25 "$BASE/frames/r32-motion-$FRAME.png" -o "/tmp/$FRAME.png"
            file "/tmp/$FRAME.png" | grep -Fq 'PNG image data'
          done
          echo 'R32 CLOUDFLARE OWNER PREVIEW LIVE: PASS'
