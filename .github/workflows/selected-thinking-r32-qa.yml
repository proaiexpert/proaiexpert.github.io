name: Selected Thinking R3.2 — Premium Editorial Density and Folio QA
on:
  push:
    branches: [qa/selected-thinking-r32-owner-review-r1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build original R3.1 and new R3.2 with Jekyll
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          git worktree add --detach "$RUNNER_TEMP/st-r31-base" 71146647bc68c045e8d789f475d2f16f6324f20d
          node scripts/verify-proai-cube-integrity-r2.mjs
          python scripts/apply-social-preview-defaults.py --mode source --root .
          jekyll build --source . --destination _site
          jekyll build --source "$RUNNER_TEMP/st-r31-base" --destination "$RUNNER_TEMP/st-r31-site"
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site
          python scripts/validate-insights-v2-r1.py --source-root . --site-root _site
          python - <<'PY'
          from pathlib import Path
          base=Path('_site')
          for name in ('index.html','ru/index.html','insights/index.html','ru/insights/index.html','ru/insights/what-happens-after-a-lead-arrives/index.html'):
              s=(base/name).read_text()
              assert '{%' not in s and '{{' not in s,name
              assert s.count('<link rel="canonical"')==1,name
              assert 'hreflang="en"' in s and 'hreflang="ru"' in s,name
              assert 'data-home-footer-golden-r3' in s,name
          for name in ('index.html','ru/index.html'):
              text=(base/name).read_text()
              assert 'home-selected-thinking-r2.css?v=editorial-density-r32' in text,name
              assert text.count('id="selected-thinking-r2"')==1,name
          assert 'selected-thinking-r2' in (Path('_site/assets/css/home-selected-thinking-r2.css')).read_text()
          assert 'insights-v2--hub' in (Path('_site/assets/css/insights-editorial-v2.css')).read_text()
          print('R32 JEKYLL, SEO, SITE SHELL, INSIGHTS SOURCE + GENERATED CONTRACT PASS')
          PY
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Live A/B desktop heights, 2-engine responsive, folio and motion QA
        shell: bash
        run: |
          python -m http.server 4177 --directory _site > /tmp/r32-final.log 2>&1 &
          python -m http.server 4178 --directory "$RUNNER_TEMP/st-r31-site" > /tmp/r31-base.log 2>&1 &
          python scripts/qa/selected-thinking-r32-browser.py
      - name: Publish four Jekyll-rendered owner-review pages, evidence and preview noindex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p owner-preview/selected-thinking-r32/screenshots owner-preview/selected-thinking-r32/frames
          cp _site/index.html owner-preview/selected-thinking-r32/home-en.html
          cp _site/ru/index.html owner-preview/selected-thinking-r32/home-ru.html
          cp _site/ru/insights/index.html owner-preview/selected-thinking-r32/hub-ru.html
          cp _site/ru/insights/what-happens-after-a-lead-arrives/index.html owner-preview/selected-thinking-r32/article-v2-ru.html
          cp qa-r32/screenshots/*.png owner-preview/selected-thinking-r32/screenshots/
          cp qa-r32/frames/*.png owner-preview/selected-thinking-r32/frames/
          cp qa-r32/report.json owner-preview/selected-thinking-r32/benchmark.json
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _headers
          python - <<'PY'
          from pathlib import Path
          folder=Path('owner-preview/selected-thinking-r32')
          for name in ('home-en.html','home-ru.html','hub-ru.html','article-v2-ru.html'):
              page=(folder/name).read_text()
              assert '{%' not in page and '{{' not in page,name
              assert 'data-home-footer-golden-r3' in page,name
              assert '/assets/css/' in page,name
          assert len(list((folder/'screenshots').glob('*.png')))>=11
          assert len(list((folder/'frames').glob('*.png')))==4
          print('R32 JEKYLL-RENDERED OWNER PREVIEW CONTRACT PASS')
          PY
          git config user.name "proai-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B preview/selected-thinking-r32-jekyll-rendered-r1
          git add _headers owner-preview/selected-thinking-r32
          git commit -m "QA-only: rendered R3.2 A/B Owner preview, measured heights, folio and motion evidence"
          git push origin HEAD:refs/heads/preview/selected-thinking-r32-jekyll-rendered-r1
      - name: Upload QA data and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r32-owner-review-qa
          path: qa-r32/
          if-no-files-found: warn
          retention-days: 21
