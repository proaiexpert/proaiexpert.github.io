name: Selected Thinking R3.2 quick verified height benchmark
on:
  push:
    branches: [qa/selected-thinking-r32-measurement-r1]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate both real Jekyll sites
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')";export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          git worktree add --detach "$RUNNER_TEMP/st-r31" 71146647bc68c045e8d789f475d2f16f6324f20d
          jekyll build --source . --destination _site
          jekyll build --source "$RUNNER_TEMP/st-r31" --destination "$RUNNER_TEMP/st-r31-site"
      - name: Chromium measurements (no screenshot wait)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 4180 --directory _site > /tmp/final.log 2>&1 &
          python -m http.server 4181 --directory "$RUNNER_TEMP/st-r31-site" > /tmp/baseline.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json,time,urllib.request
          for port in (4180,4181):
              for _ in range(50):
                  try:urllib.request.urlopen(f'http://127.0.0.1:{port}',timeout=1);break
                  except:time.sleep(.2)
          vals=[];errs=[]
          with sync_playwright() as p:
              b=p.chromium.launch()
              for w,h in ((1280,800),(1440,900),(1600,900),(1920,1080)):
                  for lang,path in (('ru','/ru/'),('en','/')):
                      pair={}
                      for label,port in (('R3.1',4181),('R3.2',4180)):
                          c=b.new_context(viewport={'width':w,'height':h},reduced_motion='reduce')
                          page=c.new_page();page.goto(f'http://127.0.0.1:{port}{path}',wait_until='domcontentloaded',timeout=25000)
                          page.wait_for_timeout(180)
                          d=page.evaluate("""()=>{
                            let s=document.querySelector('#selected-thinking-r2'),f=s.querySelector('.st-r2__folio');
                            return {height:s.getBoundingClientRect().height,overflow:document.documentElement.scrollWidth-innerWidth,
                              titleFont:parseFloat(getComputedStyle(s.querySelector('.st-r2__lead-title')).fontSize),
                              folioStroke:getComputedStyle(f).webkitTextStrokeWidth}
                          }""")
                          pair[label]=d;c.close()
                      a=pair['R3.1']['height'];z=pair['R3.2']['height']
                      vals.append({'width':w,'lang':lang,'before':round(a,1),'after':round(z,1),'reduction':round(100*(a-z)/a,1),'font':pair['R3.2']['titleFont'],'overflow':pair['R3.2']['overflow']})
              b.close()
          print('R32_VERIFIED_HEIGHTS='+json.dumps(vals,ensure_ascii=False))
          if any(q['overflow']>1 or q['after']>=q['before'] for q in vals):raise SystemExit(1)
          PY
