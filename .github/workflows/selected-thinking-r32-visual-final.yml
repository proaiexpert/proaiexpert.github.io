name: Selected Thinking R3.2 — final targeted visual qualification
on:
  push:
    branches: [qa/selected-thinking-r32-visual-final-r1]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build both Jekyll versions and validate canonical site shell
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')";export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          git worktree add --detach "$RUNNER_TEMP/selected-r31" 71146647bc68c045e8d789f475d2f16f6324f20d
          node scripts/verify-proai-cube-integrity-r2.mjs
          python scripts/apply-social-preview-defaults.py --mode source --root .
          jekyll build --source . --destination _site
          jekyll build --source "$RUNNER_TEMP/selected-r31" --destination "$RUNNER_TEMP/selected-r31-site"
          python scripts/apply-social-preview-defaults.py --mode site --root _site
          python scripts/apply-social-preview-defaults.py --mode check --root _site
          python scripts/validate-site-shell-r1.py --source-root . --site-root _site
          python scripts/validate-insights-v2-r1.py --source-root . --site-root _site
          python - <<'PY'
          from pathlib import Path
          root=Path('_site')
          pages=['index.html','ru/index.html','insights/index.html','ru/insights/index.html','ru/insights/chto-proiskhodit-posle-zayavki/index.html']
          for p in pages:
              s=(root/p).read_text()
              assert '{%' not in s and '{{' not in s,p
              assert s.count('<link rel="canonical"')==1,p
              assert 'hreflang="en"' in s and 'hreflang="ru"' in s,p
              assert 'data-home-footer-golden-r3' in s,p
          for p in ('index.html','ru/index.html'):
              s=(root/p).read_text()
              assert s.count('id="selected-thinking-r2"')==1
              assert 'home-selected-thinking-r2.css?v=editorial-density-r32' in s,p
          for p in ('ru/insights/index.html','ru/insights/chto-proiskhodit-posle-zayavki/index.html'):
              assert 'insights-editorial-v2.css?v=folio-standard-r1' in (root/p).read_text(),p
          print('R3.2 JEKYLL, SEO, SHELL, INSIGHTS AND CACHE CONTRACT PASS')
          PY
      - name: Install Chromium and WebKit
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Real responsive 2-engine QA, A/B screenshots, temporal frames and no-JS
        shell: bash
        run: |
          python -m http.server 4177 --directory _site > /tmp/r32-fast.log 2>&1 &
          python -m http.server 4178 --directory "$RUNNER_TEMP/selected-r31-site" > /tmp/r31-fast.log 2>&1 &
          python scripts/qa/selected-thinking-r32-visual-final.py
      - name: Publish isolated rendered Cloudflare Owner Review, real screenshots and noindex
        shell: bash
        run: |
          set -euo pipefail
          DEST=owner-preview/selected-thinking-r32-final
          mkdir -p "$DEST/screenshots" "$DEST/frames"
          cp _site/index.html "$DEST/home-en.html"
          cp _site/ru/index.html "$DEST/home-ru.html"
          cp _site/ru/insights/index.html "$DEST/hub-ru.html"
          cp _site/ru/insights/chto-proiskhodit-posle-zayavki/index.html "$DEST/article-v2-ru.html"
          cp qa-r32-fast/screenshots/*.png "$DEST/screenshots/"
          cp qa-r32-fast/frames/*.png "$DEST/frames/"
          cp qa-r32-fast/qa.json "$DEST/benchmark.json"
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _headers
          python - <<'PY'
          from pathlib import Path
          d=Path('owner-preview/selected-thinking-r32-final')
          for file in ('home-ru.html','home-en.html','hub-ru.html','article-v2-ru.html'):
              s=(d/file).read_text()
              assert '{%' not in s and '{{' not in s,file
              assert 'data-home-footer-golden-r3' in s,file
              assert '/assets/css/' in s,file
          assert len(list((d/'screenshots').glob('*.png')))>=10
          assert len(list((d/'frames').glob('*.png')))==4
          print('RENDERED FOUR-PAGE OWNER PREVIEW PASS')
          PY
          git config user.name "proai-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B preview/selected-thinking-r32-jekyll-rendered-fast1
          git add _headers owner-preview/selected-thinking-r32-final
          git commit -m "QA only: R3.2 real Jekyll, A/B visual evidence, folio comparison and motion frames"
          git push origin HEAD:refs/heads/preview/selected-thinking-r32-jekyll-rendered-fast1
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-thinking-r32-final-visual-qa
          path: qa-r32-fast/
          retention-days: 21
          if-no-files-found: warn
