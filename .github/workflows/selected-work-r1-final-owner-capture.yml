name: Selected Work R1 final owner capture

on:
  pull_request:
    branches:
      - tmp/proai-home-selected-work-r1-capture-pr-base

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout temporary PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Build exact frozen product
        shell: bash
        run: |
          set -Eeuo pipefail
          PRODUCT=301166f1dd0251143f3dd5dfa468fb33e5a67b08
          git worktree add --detach /tmp/proai-product "$PRODUCT"
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source /tmp/proai-product --destination /tmp/proai-product/_site
          test -s /tmp/proai-product/_site/index.html
          test -s /tmp/proai-product/_site/ru/index.html
          mkdir -p capture-output review-output

      - name: Materialize static owner preview from built HTML
        shell: bash
        run: |
          set -Eeuo pipefail
          PRODUCT=301166f1dd0251143f3dd5dfa468fb33e5a67b08
          python3 - <<'PY'
          from pathlib import Path
          PRODUCT='301166f1dd0251143f3dd5dfa468fb33e5a67b08'
          out=Path('review-output')
          out.mkdir(exist_ok=True)
          for lang,src in [('en',Path('/tmp/proai-product/_site/index.html')),('ru',Path('/tmp/proai-product/_site/ru/index.html'))]:
              s=src.read_text(encoding='utf-8')
              s=s.replace('<html ', f'<html data-product-sha="{PRODUCT}" ', 1)
              s=s.replace('"/assets/', '"../../../../assets/')
              for f in ['favicon.svg','favicon-32x32.png','favicon-16x16.png','favicon.ico','apple-touch-icon.png']:
                  s=s.replace(f'"/{f}"', f'"../../../../{f}"')
              (out/f'owner-review-{lang}.html').write_text(s,encoding='utf-8')
          index=f'''<!doctype html><html data-product-sha="{PRODUCT}" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProAI Golden R1.2 Final Owner Evidence</title><style>html{{font-family:Inter,system-ui,sans-serif;background:#05070a;color:#f2f0eb}}body{{margin:0;min-height:100vh;display:grid;place-items:center}}main{{padding:32px;text-align:center}}a{{color:inherit;margin:0 12px}}</style></head><body><main><h1>ProAI Golden R1.2</h1><p>Static Jekyll-built owner review · {PRODUCT[:12]}</p><p><a href="owner-review-en.html">EN</a><a href="owner-review-ru.html">RU</a></p></main></body></html>'''
          (out/'index.html').write_text(index,encoding='utf-8')
          PY
          grep -q "data-product-sha=\"$PRODUCT\"" review-output/owner-review-en.html
          grep -q "data-product-sha=\"$PRODUCT\"" review-output/owner-review-ru.html
          ! grep -q 'preview-runtime.js' review-output/owner-review-en.html
          ! grep -q 'preview-runtime.js' review-output/owner-review-ru.html

      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture EN and bounded smoke QA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4174 --directory /tmp/proai-product/_site >/tmp/proai-new.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
          cat >capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='capture-output';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report={product:'301166f1dd0251143f3dd5dfa468fb33e5a67b08',baseline:'c945084e1952c05c686494091f7dbca0f7acdf08',jekyllBuild:'PASS',captureMotionPreference:'reduce',checks:{},consoleErrors:[]};
          async function open(url,viewport){
            const page=await browser.newPage({viewport,reducedMotion:'reduce'});
            page.setDefaultTimeout(20000);
            page.on('pageerror',e=>report.consoleErrors.push({url,type:'pageerror',message:String(e)}));
            page.on('console',m=>{if(m.type()==='error')report.consoleErrors.push({url,type:'console',message:m.text()})});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('body',{state:'attached'});
            await page.waitForTimeout(2200);
            return page;
          }

          const en=await open('http://127.0.0.1:4174/',{width:1440,height:900});
          await en.evaluate(async()=>{
            const imgs=[...document.querySelectorAll('.home-fs-showcase-r11__stage img')];
            await Promise.all(imgs.map(async img=>{try{await img.decode()}catch{}}));
          });
          await en.waitForTimeout(800);
          const enData=await en.evaluate(()=>{
            const fsRoot=document.querySelector('[data-fs-showcase-r11]');
            const thinking=document.querySelector('[data-selected-thinking-r1]');
            const fsImg=document.querySelector('.home-fs-showcase-r11__primary img');
            const r=fsImg?.getBoundingClientRect();
            let uniqueColors=0;
            if(fsImg?.naturalWidth){
              const c=document.createElement('canvas'); c.width=96; c.height=67;
              const ctx=c.getContext('2d',{willReadFrequently:true});
              ctx.drawImage(fsImg,0,0,c.width,c.height);
              const d=ctx.getImageData(0,0,c.width,c.height).data;
              const colors=new Set();
              for(let y=3;y<c.height;y+=8){for(let x=3;x<c.width;x+=8){const i=(y*c.width+x)*4;colors.add(`${Math.round(d[i]/16)}-${Math.round(d[i+1]/16)}-${Math.round(d[i+2]/16)}`)}}
              uniqueColors=colors.size;
            }
            return {
              viewport:{width:innerWidth,height:innerHeight},
              reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches,
              selectedWorkCount:document.querySelectorAll('[data-selected-work-r1]').length,
              footerCount:document.querySelectorAll('[data-home-footer-golden-r3]').length,
              fsIsLive:Boolean(fsRoot?.classList.contains('is-live')),
              selectedThinkingVisible:Boolean(thinking?.classList.contains('st-r1-visible')),
              fsNaturalWidth:fsImg?.naturalWidth||0,
              fsNaturalHeight:fsImg?.naturalHeight||0,
              fsRenderedWidth:r?.width||0,
              fsRenderedHeight:r?.height||0,
              fsOpacity:fsImg?Number(getComputedStyle(fsImg).opacity):0,
              fsDecoded:fsImg?.complete&&fsImg?.naturalWidth>0,
              fsSourceUniqueColorBins:uniqueColors
            };
          });
          report.checks.en1440Loads=true;
          report.checks.enViewport=enData.viewport;
          report.checks.reducedMotionActive=enData.reducedMotion;
          report.checks.selectedWorkExactlyOnce=enData.selectedWorkCount===1;
          report.checks.footerExactlyOnce=enData.footerCount===1;
          report.checks.financialStreamRevealLive=enData.fsIsLive;
          report.checks.selectedThinkingRevealVisible=enData.selectedThinkingVisible;
          report.checks.financialStreamImageNaturalWidth=enData.fsNaturalWidth;
          report.checks.financialStreamImageDecoded=enData.fsDecoded;
          report.checks.financialStreamSourceUniqueColorBins=enData.fsSourceUniqueColorBins;
          report.checks.financialStreamImageVisible=enData.fsNaturalWidth>0&&enData.fsNaturalHeight>0&&enData.fsRenderedWidth>0&&enData.fsRenderedHeight>0&&enData.fsOpacity>0&&enData.fsDecoded&&enData.fsSourceUniqueColorBins>4;
          const screenshotPath=`${out}/02-new-golden-candidate-en-full.png`;
          await en.screenshot({path:screenshotPath,fullPage:true,timeout:120000,animations:'disabled'});
          const png=fs.readFileSync(screenshotPath);
          report.checks.enScreenshotWidth=png.readUInt32BE(16);
          report.checks.enScreenshotHeight=png.readUInt32BE(20);
          await en.close();

          const ru=await open('http://127.0.0.1:4174/ru/',{width:1440,height:900});
          report.checks.ru1440Loads=(await ru.locator('body').count())===1&&(await ru.evaluate(()=>innerWidth))===1440;
          await ru.close();

          const mobile=await open('http://127.0.0.1:4174/',{width:390,height:844});
          report.checks.en390Loads=(await mobile.locator('body').count())===1&&(await mobile.evaluate(()=>innerWidth))===390;
          report.checks.horizontalOverflow390=await mobile.evaluate(()=>Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth));
          await mobile.close();

          report.checks.noObviousFatalConsoleErrors=!report.consoleErrors.some(e=>/Uncaught|ReferenceError|SyntaxError|TypeError|ERR_MODULE|Failed to fetch dynamically imported module/i.test(e.message));
          report.pass=report.checks.en1440Loads&&report.checks.enViewport.width===1440&&report.checks.enViewport.height===900&&report.checks.reducedMotionActive&&report.checks.enScreenshotWidth===1440&&report.checks.ru1440Loads&&report.checks.en390Loads&&report.checks.horizontalOverflow390===0&&report.checks.financialStreamRevealLive&&report.checks.selectedThinkingRevealVisible&&report.checks.financialStreamImageVisible&&report.checks.selectedWorkExactlyOnce&&report.checks.footerExactlyOnce&&report.checks.noObviousFatalConsoleErrors;
          fs.writeFileSync(`${out}/qa-report.json`,JSON.stringify(report,null,2));
          await browser.close();
          if(!report.pass){console.error(JSON.stringify(report,null,2));process.exit(1)}
          NODE
          node capture.mjs
          test -s capture-output/02-new-golden-candidate-en-full.png
          test -s capture-output/qa-report.json

      - name: Commit evidence and static preview to temporary head
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'proai-owner-capture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add capture-output review-output
          if ! git diff --cached --quiet; then
            git commit -m 'capture-evidence: complete Golden R1.2 final owner evidence'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-r1-2-final-owner-evidence
          path: |
            capture-output
            review-output
          if-no-files-found: warn
          retention-days: 14
