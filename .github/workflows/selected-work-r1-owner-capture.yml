name: Selected Work R1 bounded owner capture

on:
  push:
    branches:
      - tmp/proai-home-selected-work-r1-capture

permissions:
  contents: write

jobs:
  capture:
    if: ${{ startsWith(github.event.head_commit.message, 'chore: run bounded Selected Work R1 owner capture v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build exact old and new Jekyll sites
        shell: bash
        run: |
          set -Eeuo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site
          git worktree add --detach /tmp/proai-old c945084e1952c05c686494091f7dbca0f7acdf08
          jekyll build --source /tmp/proai-old --destination /tmp/proai-old-site
          mkdir -p capture-output
          cp _site/index.html capture-output/compiled-en.html
          cp _site/ru/index.html capture-output/compiled-ru.html

      - name: Install bounded browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run practical smoke QA and screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4174 --directory _site >/tmp/proai-new.log 2>&1 &
          NEW_PID=$!
          python3 -m http.server 4175 --directory /tmp/proai-old-site >/tmp/proai-old.log 2>&1 &
          OLD_PID=$!
          trap 'kill $NEW_PID $OLD_PID 2>/dev/null || true' EXIT
          for port in 4174 4175; do
            ok=0
            for i in {1..20}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            test "$ok" = 1
          done
          cat >/tmp/capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='capture-output';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report={product:'301166f1dd0251143f3dd5dfa468fb33e5a67b08',baseline:'c945084e1952c05c686494091f7dbca0f7acdf08',checks:[],viewports:{},errors:[]};
          const required=['header.site-header','#hero','.connected-system','#two-worlds-golden-r1','.home-tech-r2','.home-fs-showcase-r14','#selected-thinking-r1','.selected-work-r1','.home-footer-golden-r3'];
          const obsolete=['.proai-golden-r12-downstream','.home-footer-watermark-r2'];
          async function pageFor(url,viewport){
            const page=await browser.newPage({viewportSize:viewport});
            page.on('pageerror',e=>report.errors.push({url,type:'pageerror',message:String(e)}));
            page.on('console',m=>{if(m.type()==='error')report.errors.push({url,type:'console',message:m.text()})});
            await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1250);
            return page;
          }
          async function waitCube(page){
            try{await page.waitForFunction(()=>['true','error'].includes(document.documentElement.dataset.goldenCubeReady),null,{timeout:18000})}catch{}
            return page.evaluate(()=>document.documentElement.dataset.goldenCubeReady||'unknown');
          }
          async function smoke(viewport,label,url='http://127.0.0.1:4174/'){
            const page=await pageFor(url,viewport);
            const data=await page.evaluate(({required,obsolete})=>{
              const missing=required.filter(s=>!document.querySelector(s));
              const order=required.map(s=>{const el=document.querySelector(s);return el?Math.round(el.getBoundingClientRect().top+scrollY):null});
              const orderPass=order.every((v,i)=>i===0||v===null||order[i-1]===null||v>=order[i-1]);
              const overflow=document.documentElement.scrollWidth-document.documentElement.clientWidth;
              const titles=[...document.querySelectorAll('.selected-work-r1 h3')].map(x=>x.textContent.trim());
              const statuses=[...document.querySelectorAll('.selected-work-r1__status')].map(x=>x.textContent.trim());
              const fs=document.querySelector('.home-fs-showcase-r11__primary img');
              const r=fs?.getBoundingClientRect();
              return {missing,order,orderPass,overflow,obsoletePresent:obsolete.filter(s=>document.querySelector(s)),selectedWork:Boolean(document.querySelector('.selected-work-r1')),titles,statuses,fsImage:fs?{naturalWidth:fs.naturalWidth,naturalHeight:fs.naturalHeight,renderedWidth:r.width,renderedHeight:r.height}:null};
            },{required,obsolete});
            data.cube=await waitCube(page);
            report.viewports[label]=data;
            await page.close();
          }
          const old=await pageFor('http://127.0.0.1:4175/',{width:1440,height:900});
          await old.waitForTimeout(1800);
          await old.screenshot({path:`${out}/01-old-production-homepage-en-full.png`,fullPage:true});
          await old.close();
          const fresh=await pageFor('http://127.0.0.1:4174/',{width:1440,height:900});
          await waitCube(fresh);await fresh.waitForTimeout(900);
          await fresh.screenshot({path:`${out}/02-new-golden-candidate-en-full.png`,fullPage:true});
          await fresh.close();
          const ru=await pageFor('http://127.0.0.1:4174/ru/',{width:1440,height:900});
          await waitCube(ru);await ru.waitForTimeout(900);
          await ru.screenshot({path:`${out}/03-new-golden-candidate-ru-full.png`,fullPage:true});
          await ru.close();
          const mobile=await pageFor('http://127.0.0.1:4174/',{width:390,height:844});
          await mobile.waitForTimeout(800);
          await mobile.screenshot({path:`${out}/04-new-golden-candidate-390x844-en.png`,fullPage:true});
          await mobile.close();
          for(const [w,h] of [[1440,900],[1366,768],[1024,768],[390,844],[320,568],[844,390]]) await smoke({width:w,height:h},`${w}x${h}`);
          await smoke({width:390,height:844},'ru-390x844','http://127.0.0.1:4174/ru/');
          const critical=[];
          for(const [k,v] of Object.entries(report.viewports)){
            critical.push([k+' required',v.missing.length===0,v.missing]);
            critical.push([k+' order',v.orderPass,v.order]);
            critical.push([k+' overflow',v.overflow<=1,v.overflow]);
            critical.push([k+' obsolete',v.obsoletePresent.length===0,v.obsoletePresent]);
            critical.push([k+' selected work',v.selectedWork,true]);
          }
          const canonical=report.viewports['1440x900'];
          critical.push(['selected work titles',JSON.stringify(canonical.titles)===JSON.stringify(['Financial Stream','Alina Horb','Local Repair Pro']),canonical.titles]);
          critical.push(['selected work statuses',JSON.stringify(canonical.statuses)===JSON.stringify(['LIVE CLIENT · EN/RU','LIVE CLIENT · UA/RU','WEBSITE CONCEPT · LIVE DEMO']),canonical.statuses]);
          critical.push(['financial stream image',Boolean(canonical.fsImage&&canonical.fsImage.naturalWidth>0&&canonical.fsImage.naturalHeight>0&&canonical.fsImage.renderedWidth>0&&canonical.fsImage.renderedHeight>0),canonical.fsImage]);
          report.checks=critical.map(([name,pass,detail])=>({name,pass,detail}));
          report.pass=report.checks.every(x=>x.pass);
          report.cubeState=canonical.cube;
          fs.writeFileSync(`${out}/qa-report.json`,JSON.stringify(report,null,2));
          await browser.close();
          if(!report.pass){console.error(JSON.stringify(report.checks.filter(x=>!x.pass),null,2));process.exit(1)}
          NODE
          node /tmp/capture.mjs

      - name: Publish capture evidence to temporary branch
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d capture-output ] && [ -n "$(find capture-output -type f -maxdepth 1 -print -quit)" ]; then
            git config user.name 'proai-owner-capture-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add capture-output
            if ! git diff --cached --quiet; then
              git commit -m 'capture-evidence: Selected Work R1 bounded owner preview'
              git push origin HEAD:tmp/proai-home-selected-work-r1-capture
            fi
          fi

      - name: Upload bounded owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-work-r1-owner-capture-v2
          path: capture-output
          if-no-files-found: warn
          retention-days: 14
