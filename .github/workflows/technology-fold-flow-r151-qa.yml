name: Technology Fold Flow R1.5.1 Browser QA

on:
  push:
    branches:
      - agent/proai-home-technology-fold-flow-r1-5-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout R1.5.1 candidate
        uses: actions/checkout@v6

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static preview server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/r151-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/owner-preview/technology-fold-flow-r1-5-1/?lang=en >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/r151-server.log
          exit 1

      - name: Run Chromium maker and regression QA
        shell: bash
        run: |
          mkdir -p qa-r151/screens qa-r151/compare qa-r151/videos
          cat > qa-r151/run.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const root='http://127.0.0.1:4173';
          const oldBase=root+'/owner-preview/technology-fold-flow-r1-5/';
          const newBase=root+'/owner-preview/technology-fold-flow-r1-5-1/';
          const viewports=[
            {name:'1920x1080',w:1920,h:1080,kind:'desktop'},
            {name:'1440x900',w:1440,h:900,kind:'laptop'},
            {name:'1366x768',w:1366,h:768,kind:'laptop'},
            {name:'1280x720',w:1280,h:720,kind:'laptop'},
            {name:'430x932',w:430,h:932,kind:'portrait'},
            {name:'390x844',w:390,h:844,kind:'portrait'},
            {name:'375x812',w:375,h:812,kind:'portrait'},
            {name:'844x390',w:844,h:390,kind:'landscape'},
            {name:'896x414',w:896,h:414,kind:'landscape'},
            {name:'932x430',w:932,h:430,kind:'landscape'}
          ];
          const states=[
            {name:'communicate',p:.54},
            {name:'deliver',p:.72},
            {name:'final',p:.91}
          ];
          const langs=['en','ru'];
          const report={candidate:'R1.5.1',generatedAt:new Date().toISOString(),checks:[],failures:[],motionChecks:[]};
          const browser=await chromium.launch({headless:true});

          async function setState(page,p){
            await page.evaluate((progress)=>{
              const section=document.querySelector('[data-home-tech-fold-flow]');
              const story=section.querySelector('[data-ff-story]');
              const sticky=section.querySelector('.home-tech-ff__sticky');
              const top=window.scrollY+story.getBoundingClientRect().top;
              const travel=Math.max(1,story.getBoundingClientRect().height-sticky.getBoundingClientRect().height);
              window.scrollTo(0,top+travel*progress);
              const api=window.__PROAI_FOLD_FLOW_R151__||window.__PROAI_FOLD_FLOW_R15__;
              if(api&&api.setProgress)api.setProgress(section,progress);
            },p);
            await page.waitForTimeout(540);
          }

          async function inspect(page,meta){
            return await page.evaluate((m)=>{
              const sec=document.querySelector('[data-home-tech-fold-flow]');
              const visible=(el)=>{if(!el)return false;const cs=getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&parseFloat(cs.opacity||'1')>.02&&r.width>0&&r.height>0};
              const rect=(el)=>{const r=el.getBoundingClientRect();return {l:r.left,r:r.right,t:r.top,b:r.bottom,w:r.width,h:r.height}};
              const overlap=(a,b,pad=0)=>a&&b&&a.l<b.r-pad&&a.r>b.l+pad&&a.t<b.b-pad&&a.b>b.t+pad;
              const stage=sec.getAttribute('data-ff-stage');
              const expected=m.state==='final'?'resolved':m.state;
              const active=stage==='resolved'?sec.querySelector('[data-ff-panel="resolved"]'):sec.querySelector('[data-ff-panel="'+stage+'"]');
              const maker=sec.querySelector('.home-tech-ff__maker');
              const makerImg=maker?.querySelector('img');
              const makerStrong=maker?.querySelector('strong');
              const makerSmall=maker?.querySelector('small');
              const payoff=sec.querySelector('.home-tech-ff__resolution h3');
              const impl=sec.querySelector('.home-tech-ff__implementation');
              const cap=active?.querySelector('.home-tech-ff__capability-line');
              const vendors=[...(active?.querySelectorAll('.home-tech-ff__vendor')||[])].filter(visible);
              const path=sec.querySelector('[data-ff-path]');
              const mr=visible(maker)?rect(maker):null, pr=visible(payoff)?rect(payoff):null, ir=visible(impl)?rect(impl):null, cr=visible(cap)?rect(cap):null;
              let carrierMakerCollision=false,carrierCapCollision=false;
              if(path&&path.getScreenCTM()){
                const ctm=path.getScreenCTM(),len=path.getTotalLength();
                for(let i=0;i<=140;i++){
                  const p=path.getPointAtLength(len*i/140);
                  const q=new DOMPoint(p.x,p.y).matrixTransform(ctm);
                  if(mr&&q.x>=mr.l-4&&q.x<=mr.r+4&&q.y>=mr.t-4&&q.y<=mr.b+4)carrierMakerCollision=true;
                  if(cr&&q.x>=cr.l-3&&q.x<=cr.r+3&&q.y>=cr.t-3&&q.y<=cr.b+3)carrierCapCollision=true;
                }
              }
              const makerImgRect=visible(makerImg)?rect(makerImg):null;
              const makerWordSize=makerStrong?parseFloat(getComputedStyle(makerStrong).fontSize):0;
              const makerDescSize=makerSmall?parseFloat(getComputedStyle(makerSmall).fontSize):0;
              const vendorRects=vendors.map(rect);
              const vendorOverlaps=[];
              for(let i=0;i<vendorRects.length;i++)for(let j=i+1;j<vendorRects.length;j++)if(overlap(vendorRects[i],vendorRects[j]))vendorOverlaps.push([i,j]);
              const minCube=m.kind==='desktop'?50:m.kind==='laptop'?(m.w>=1366?46:44):m.kind==='landscape'?38:(m.w<=390?35:36);
              const minWord=m.kind==='desktop'?23:m.kind==='laptop'?(m.w>=1366?21:20):m.kind==='landscape'?18:(m.w<=390?17.4:18);
              const minDesc=m.kind==='desktop'?10.4:m.kind==='laptop'?9.4:m.kind==='landscape'?8.9:(m.w<=390?8.9:9.1);
              return {
                ...m,actualStage:stage,stageCorrect:stage===expected,
                noHorizontalOverflow:document.documentElement.scrollWidth<=innerWidth+1,
                makerVisible:visible(maker),
                makerInside:!mr||(mr.l>=-1&&mr.r<=innerWidth+1&&mr.t>=-1&&mr.b<=innerHeight+1),
                makerCube:makerImgRect?.w||0,makerWordSize,makerDescSize,
                makerCubePass:m.state!=='final'||(makerImgRect&&makerImgRect.w>=minCube-.6),
                makerWordPass:m.state!=='final'||makerWordSize>=minWord-.2,
                makerDescPass:m.state!=='final'||makerDescSize>=minDesc-.15,
                payoffMakerSafe:!mr||!pr||!overlap(mr,pr,4),
                implementationMakerSafe:!mr||!ir||!overlap(mr,ir,3),
                carrierMakerCollision,
                carrierCapabilityCollision:carrierCapCollision,
                vendorOverlaps,
                vendorsInside:vendorRects.every(r=>r.l>=-1&&r.r<=innerWidth+1)
              };
            },meta);
          }

          for(const vp of viewports){
            for(const lang of langs){
              const context=await browser.newContext({viewport:{width:vp.w,height:vp.h},deviceScaleFactor:1});
              const page=await context.newPage();
              await page.goto(newBase+'?lang='+lang,{waitUntil:'networkidle'});
              for(const st of states){
                if(vp.kind==='portrait'&&st.name==='deliver')continue;
                const meta={viewport:vp.name,w:vp.w,h:vp.h,kind:vp.kind,lang,state:st.name};
                await setState(page,st.p);
                const result=await inspect(page,meta);
                report.checks.push(result);
                const bad=[];
                if(!result.stageCorrect)bad.push('stage');
                if(!result.noHorizontalOverflow)bad.push('overflow');
                if(st.name==='final'&&!result.makerVisible)bad.push('maker-hidden');
                if(st.name==='final'&&!result.makerInside)bad.push('maker-bounds');
                if(!result.makerCubePass)bad.push('maker-cube-small');
                if(!result.makerWordPass)bad.push('maker-word-small');
                if(!result.makerDescPass)bad.push('maker-desc-small');
                if(st.name==='final'&&!result.payoffMakerSafe)bad.push('payoff-maker');
                if(st.name==='final'&&!result.implementationMakerSafe)bad.push('implementation-maker');
                if(st.name==='final'&&result.carrierMakerCollision)bad.push('carrier-maker');
                if(result.carrierCapabilityCollision)bad.push('carrier-capability');
                if(result.vendorOverlaps.length)bad.push('vendor-overlap');
                if(!result.vendorsInside)bad.push('vendor-bounds');
                if(bad.length)report.failures.push({...meta,bad,metrics:{cube:result.makerCube,word:result.makerWordSize,desc:result.makerDescSize}});
                await page.screenshot({path:`qa-r151/screens/${vp.name}-${lang}-${st.name}.png`,fullPage:false});
              }
              await context.close();
            }
          }

          const compareTargets=[
            {name:'1366x768',w:1366,h:768,lang:'ru'},
            {name:'1366x768-en',w:1366,h:768,lang:'en'},
            {name:'896x414',w:896,h:414,lang:'ru'},
            {name:'896x414-en',w:896,h:414,lang:'en'},
            {name:'390x844',w:390,h:844,lang:'ru'},
            {name:'390x844-en',w:390,h:844,lang:'en'}
          ];
          for(const t of compareTargets){
            for(const [label,url] of [['before',oldBase],['after',newBase]]){
              const context=await browser.newContext({viewport:{width:t.w,height:t.h},deviceScaleFactor:1});
              const page=await context.newPage();
              await page.goto(url+'?lang='+t.lang,{waitUntil:'networkidle'});
              await setState(page,.91);
              await page.screenshot({path:`qa-r151/compare/${t.name}-${label}-final.png`,fullPage:false});
              await context.close();
            }
          }

          async function motionCheck(name,w,h){
            const context=await browser.newContext({viewport:{width:w,height:h}});
            const page=await context.newPage();
            await page.goto(newBase+'?lang=en',{waitUntil:'networkidle'});
            const order={handoff:0,understand:1,orchestrate:2,communicate:3,deliver:4,resolved:5};
            const forward=[],reverse=[];
            for(let i=0;i<=50;i++){await setState(page,i/50);forward.push(await page.evaluate(()=>document.querySelector('[data-home-tech-fold-flow]').getAttribute('data-ff-stage')))}
            for(let i=50;i>=0;i--){await setState(page,i/50);reverse.push(await page.evaluate(()=>document.querySelector('[data-home-tech-fold-flow]').getAttribute('data-ff-stage')))}
            const f=forward.every((s,i)=>i===0||order[s]>=order[forward[i-1]]);
            const r=reverse.every((s,i)=>i===0||order[s]<=order[reverse[i-1]]);
            report.motionChecks.push({name,forwardStable:f,reverseStable:r});
            if(!f||!r)report.failures.push({viewport:name,lang:'en',state:'motion',bad:['state-chatter']});
            await context.close();
          }
          await motionCheck('1366x768',1366,768);
          await motionCheck('390x844',390,844);
          await motionCheck('896x414',896,414);

          await browser.close();
          fs.writeFileSync('qa-r151/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({checks:report.checks.length,motionChecks:report.motionChecks,failures:report.failures},null,2));
          if(report.failures.length)process.exit(2);
          NODE
          node qa-r151/run.mjs

      - name: Upload R1.5.1 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technology-fold-flow-r151-browser-qa
          path: qa-r151/
          if-no-files-found: error
          retention-days: 14
