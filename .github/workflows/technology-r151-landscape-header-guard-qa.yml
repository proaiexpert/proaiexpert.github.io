name: Technology R1.5.1 Landscape Header Guard QA

on:
  push:
    branches:
      - hotfix/proai-tech-r151-landscape-header-guard-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build real Jekyll homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site --bind 127.0.0.1 > /tmp/tech-header-guard.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ru/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tech-header-guard.log
          exit 1

      - name: Run landscape reverse-scroll and portrait regression QA
        shell: bash
        run: |
          mkdir -p qa-header-guard/screens
          cat > qa-header-guard/run.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const report={checks:[],failures:[]};

          async function load(w,h,path){
            const context=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});
            const page=await context.newPage();
            page.setDefaultNavigationTimeout(10000);
            await page.route('**/*',async route=>{
              const url=new URL(route.request().url());
              if(url.hostname==='127.0.0.1')await route.continue();
              else await route.abort();
            });
            await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(700);
            return {context,page};
          }

          async function metrics(page){
            return await page.evaluate(()=>{
              const header=document.querySelector('[data-site-header]');
              const tech=document.querySelector('[data-home-tech-fold-flow]');
              const sticky=tech?.querySelector('.home-tech-ff__sticky');
              const fs=document.querySelector('[data-fs-showcase-r11]');
              const hr=header?.getBoundingClientRect();
              const sr=sticky?.getBoundingClientRect();
              return {
                headerGuarded:header?.classList.contains('header-guarded')||false,
                headerHidden:header?.classList.contains('header-hidden')||false,
                headerBottom:hr?.bottom??999,
                guardAttr:sticky?.getAttribute('data-header-autohide-guard')||'',
                stickyTop:sr?.top??999,
                stickyBottom:sr?.bottom??-999,
                techTop:tech?.offsetTop||0,
                techHeight:tech?.offsetHeight||0,
                fsTop:fs?.offsetTop||0,
                scrollY:window.scrollY,
                overflow:document.documentElement.scrollWidth-window.innerWidth
              };
            });
          }

          async function move(page,y,wait=360){
            await page.evaluate(v=>window.scrollTo(0,v),y);
            await page.waitForTimeout(wait);
            return await metrics(page);
          }

          const landscapes=[
            {name:'844x390',w:844,h:390},
            {name:'896x414',w:896,h:414},
            {name:'932x430',w:932,h:430}
          ];

          for(const vp of landscapes){
            for(const lang of [{name:'en',path:'/'},{name:'ru',path:'/ru/'}]){
              const {context,page}=await load(vp.w,vp.h,lang.path);
              const base=await metrics(page);
              const travel=Math.max(1,base.techHeight-vp.h);
              const top=base.techTop;
              const seq=[
                {name:'forward-20',p:.20},
                {name:'forward-55',p:.55},
                {name:'forward-88',p:.88},
                {name:'reverse-70',p:.70},
                {name:'reverse-42',p:.42},
                {name:'reverse-12',p:.12}
              ];
              for(const s of seq){
                const m=await move(page,top+travel*s.p);
                const bad=[];
                if(m.guardAttr!=='technology-landscape')bad.push('guard-attr-missing');
                if(!m.headerGuarded)bad.push('header-not-guarded');
                if(!m.headerHidden)bad.push('header-not-hidden');
                if(m.headerBottom>2)bad.push('header-visible-in-viewport');
                if(m.overflow>1)bad.push('horizontal-overflow');
                if(Math.abs(m.stickyTop)>9||m.stickyBottom<vp.h-9)bad.push('sticky-not-owning-viewport');
                if(bad.length)report.failures.push({viewport:vp.name,lang:lang.name,state:s.name,bad,metrics:m});
                report.checks.push({viewport:vp.name,lang:lang.name,state:s.name,bad,metrics:m});
              }
              await page.screenshot({path:`qa-header-guard/screens/${vp.name}-${lang.name}-reverse-tech.png`,fullPage:false});

              const above1=await move(page,Math.max(0,top-vp.h*.35),160);
              const above2=await move(page,Math.max(0,top-vp.h*.85),380);
              const badAbove=[];
              if(above2.headerGuarded)badAbove.push('guard-not-released-above');
              if(above2.guardAttr!=='technology-landscape')badAbove.push('guard-attr-should-remain-declared');
              if(above2.headerBottom<=1)badAbove.push('header-not-restored-above');
              if(badAbove.length)report.failures.push({viewport:vp.name,lang:lang.name,state:'exit-above',bad:badAbove,metrics:above2});
              report.checks.push({viewport:vp.name,lang:lang.name,state:'exit-above',bad:badAbove,metrics:above2});

              const below=await move(page,base.fsTop+Math.min(80,vp.h*.15),420);
              const badBelow=[];
              if(below.headerGuarded)badBelow.push('guard-not-released-below');
              if(badBelow.length)report.failures.push({viewport:vp.name,lang:lang.name,state:'exit-below',bad:badBelow,metrics:below});
              report.checks.push({viewport:vp.name,lang:lang.name,state:'exit-below',bad:badBelow,metrics:below});

              await context.close();
            }
          }

          for(const lang of [{name:'en',path:'/'},{name:'ru',path:'/ru/'}]){
            const {context,page}=await load(390,844,lang.path);
            const base=await metrics(page);
            const travel=Math.max(1,base.techHeight-844);
            const m=await move(page,base.techTop+travel*.50);
            const bad=[];
            if(m.guardAttr)bad.push('portrait-guard-should-be-absent');
            if(m.headerGuarded)bad.push('portrait-header-should-not-be-guarded');
            if(m.overflow>1)bad.push('portrait-overflow');
            if(bad.length)report.failures.push({viewport:'390x844',lang:lang.name,state:'portrait-mid',bad,metrics:m});
            report.checks.push({viewport:'390x844',lang:lang.name,state:'portrait-mid',bad,metrics:m});
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('qa-header-guard/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({checks:report.checks.length,failures:report.failures},null,2));
          if(report.failures.length)process.exit(2);
          NODE
          node qa-header-guard/run.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technology-r151-landscape-header-guard-qa
          path: qa-header-guard/
          if-no-files-found: error
          retention-days: 10
