name: Technology R1.5.1 Landscape Header Guard QA

on:
  push:
    branches:
      - hotfix/proai-tech-r151-landscape-header-guard-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build real Jekyll homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Extract exact production header and Technology into focused QA page
        shell: bash
        run: |
          rm -rf qa-site
          mkdir -p qa-site
          cp -a _site/. qa-site/
          python3 - <<'PY'
          import re
          from pathlib import Path
          src=Path('qa-site/index.html').read_text(encoding='utf-8')
          header=re.search(r'(<header\b[^>]*data-site-header[^>]*>.*?</header>)',src,re.S)
          tech=re.search(r'(<section\b[^>]*data-home-tech-fold-flow[^>]*>.*?</section>)',src,re.S)
          if not header or not tech:
              raise SystemExit('Could not extract production header/Technology')
          html=f'''<!doctype html><html><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <link rel="stylesheet" href="/assets/css/header-system-v1.css?v=qa">
          <link rel="stylesheet" href="/assets/css/header-footer-logo-r1.css?v=qa">
          <link rel="stylesheet" href="/assets/css/home-technology-fold-flow-r1-5-1.css?v=qa">
          <style>html,body{{margin:0;background:#020304;color:#fff;overflow-x:hidden}}.qa-spacer{{height:100svh;background:#020304}}</style>
          </head><body>
          {header.group(1)}
          <div class="qa-spacer"></div>
          {tech.group(1)}
          <div class="qa-spacer"></div>
          <script src="/assets/js/home-technology-fold-flow-r1-5-1.js?v=qa" defer></script>
          <script src="/assets/js/header-system-v1.js?v=qa" defer></script>
          </body></html>'''
          Path('qa-site/qa-tech-header.html').write_text(html,encoding='utf-8')
          print('Focused QA page created')
          PY

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory qa-site --bind 127.0.0.1 >/tmp/qa-header.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/qa-tech-header.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/qa-header.log
          exit 1

      - name: Verify landscape forward/reverse ownership and portrait regression
        shell: bash
        run: |
          mkdir -p qa-header-guard/screens
          cat > qa-header-guard/run.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report={checks:[],failures:[]};

          async function open(w,h){
            const context=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/qa-tech-header.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(350);
            return {context,page};
          }
          async function read(page){
            return page.evaluate(()=>{
              const header=document.querySelector('[data-site-header]');
              const tech=document.querySelector('[data-home-tech-fold-flow]');
              const sticky=tech.querySelector('.home-tech-ff__sticky');
              const hr=header.getBoundingClientRect(),sr=sticky.getBoundingClientRect(),tr=tech.getBoundingClientRect();
              return {
                guarded:header.classList.contains('header-guarded'),
                hidden:header.classList.contains('header-hidden'),
                headerBottom:hr.bottom,
                attr:tech.getAttribute('data-header-autohide-guard')||'',
                stickyTop:sr.top,stickyBottom:sr.bottom,
                sectionTop:tr.top,sectionBottom:tr.bottom,
                techTop:tech.offsetTop,techHeight:tech.offsetHeight,
                overflow:document.documentElement.scrollWidth-innerWidth
              };
            });
          }
          async function scroll(page,y,ms=180){
            await page.evaluate(v=>scrollTo(0,v),y);
            await page.waitForTimeout(ms);
            return read(page);
          }

          for(const vp of [{n:'844x390',w:844,h:390},{n:'896x414',w:896,h:414},{n:'932x430',w:932,h:430}]){
            const {context,page}=await open(vp.w,vp.h);
            const base=await read(page);
            const travel=Math.max(1,base.techHeight-vp.h);
            const points=[.15,.48,.82,.68,.38,.10];
            for(let i=0;i<points.length;i++){
              const m=await scroll(page,base.techTop+travel*points[i]);
              const state=i<3?'forward':'reverse';
              const bad=[];
              if(m.attr!=='technology-landscape')bad.push('guard-attr');
              if(!m.guarded)bad.push('not-guarded');
              if(m.headerBottom>2)bad.push('header-visible');
              if(m.sectionTop>9||m.sectionBottom<vp.h-9)bad.push('section-not-owning-viewport');
              if(m.overflow>1)bad.push('overflow');
              report.checks.push({viewport:vp.n,state,p:points[i],bad,m});
              if(bad.length)report.failures.push({viewport:vp.n,state,p:points[i],bad,m});
            }
            await page.screenshot({path:`qa-header-guard/screens/${vp.n}-reverse.png`});

            await scroll(page,Math.max(0,base.techTop-vp.h*.25),100);
            const above=await scroll(page,Math.max(0,base.techTop-vp.h*.75),260);
            const badAbove=[];
            if(above.guarded)badAbove.push('guard-not-released');
            if(above.headerBottom<=1)badAbove.push('header-not-restored');
            report.checks.push({viewport:vp.n,state:'above',bad:badAbove,m:above});
            if(badAbove.length)report.failures.push({viewport:vp.n,state:'above',bad:badAbove,m:above});

            const below=await scroll(page,base.techTop+base.techHeight+40,260);
            const badBelow=[];
            if(below.guarded)badBelow.push('guard-not-released-below');
            report.checks.push({viewport:vp.n,state:'below',bad:badBelow,m:below});
            if(badBelow.length)report.failures.push({viewport:vp.n,state:'below',bad:badBelow,m:below});
            await context.close();
          }

          const {context,page}=await open(390,844);
          const base=await read(page),travel=Math.max(1,base.techHeight-844);
          const portrait=await scroll(page,base.techTop+travel*.5,250);
          const bad=[];
          if(portrait.attr)bad.push('portrait-guard-attr');
          if(portrait.guarded)bad.push('portrait-guarded');
          if(portrait.overflow>1)bad.push('portrait-overflow');
          report.checks.push({viewport:'390x844',state:'portrait',bad,m:portrait});
          if(bad.length)report.failures.push({viewport:'390x844',state:'portrait',bad,m:portrait});
          await context.close();

          await browser.close();
          fs.writeFileSync('qa-header-guard/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({checks:report.checks.length,failures:report.failures},null,2));
          if(report.failures.length)process.exit(2);
          NODE
          node qa-header-guard/run.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technology-r151-landscape-header-guard-qa
          path: qa-header-guard/
          if-no-files-found: error
          retention-days: 10
