name: Technology R1.6 Browser QA
on:
  push:
    branches:
      - agent/proai-home-technology-fold-flow-r1-6-signature-depth
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/technology-r16-server.log 2>&1 &
      - run: node scripts/qa/technology-r16-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technology-r16-browser-results
          path: r16-qa-artifacts/
          if-no-files-found: warn
