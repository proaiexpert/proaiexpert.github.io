name: TEMP Hero R3 Owner Review 3H

on:
  push:
    branches:
      - agent/proai-home-hero-signature-r3
    paths:
      - .github/workflows/temporary-hero-r3-owner-review-3h.yml

permissions:
  contents: read
  statuses: write

jobs:
  owner-review:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Checkout exact product
        uses: actions/checkout@v6
        with:
          ref: 735982473854c29a6f1eeeb4d87773abbc573b4d

      - name: Verify exact product and frozen Cube
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "735982473854c29a6f1eeeb4d87773abbc573b4d"
          test "$(git hash-object assets/js/proai-hero-cube-r1/bootstrap.js)" = "b46b26164efc000daef8ecb3416039008db7cd79"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "bab6b00e73b20fc2a51aeb00cb7fc08f16129e72"
          test "$(stat -c%s assets/models/proai-cube/rubik_39_s_cube_animation.glb)" = 279412
          echo "DBB7FC4156F8C9ED2481DD76443DFFB9A45ECB5493463F99BFFB34DD3B59C79B  assets/models/proai-cube/rubik_39_s_cube_animation.glb" | sha256sum -c -
          grep -q 'max-width: clamp(455px, 34vw, 500px);' assets/css/homepage-hero-signature-r3.css
          grep -q 'flex-flow: row nowrap;' assets/css/homepage-hero-signature-r3.css

      - name: Build and serve exact product
        shell: bash
        run: |
          set -euo pipefail
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/dev/null
          gem install --user-install webrick --no-document >/dev/null
          jekyll build --source . --destination _site >/dev/null
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site >/tmp/hero-r3-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && curl -fsS http://127.0.0.1:8080/ru/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'From first impression to result — one system.'
          curl -fsS http://127.0.0.1:8080/ru/ | grep -q 'От первого впечатления до результата — одна система.'

      - name: Browser correction QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          cat > hero-r3-micro-qa.cjs <<'JS'
          const p=require('puppeteer-core'),a=require('assert').strict;
          const B='http://127.0.0.1:8080';
          (async()=>{
            const b=await p.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            const q=await b.newPage();
            async function load(path,w,h){
              await q.setViewport({width:w,height:h,deviceScaleFactor:1,isMobile:w<=932,hasTouch:w<=932});
              await q.goto(B+path,{waitUntil:'domcontentloaded'});
              await q.evaluate(()=>document.fonts.ready);
            }
            async function state(){return q.evaluate(()=>{
              const title=document.querySelector('.proai-hero-title');
              const text=title.firstChild,raw=text.textContent,tokens=[];let re=/\S+/g,m;
              while((m=re.exec(raw))){const r=document.createRange();r.setStart(text,m.index);r.setEnd(text,m.index+m[0].length);const box=r.getBoundingClientRect();tokens.push({t:m[0],top:Math.round(box.top),left:Math.round(box.left)});}
              const grouped=[];for(const x of tokens){let row=grouped.find(g=>Math.abs(g.top-x.top)<=2);if(!row){row={top:x.top,words:[]};grouped.push(row)}row.words.push(x)}
              const lines=grouped.sort((x,y)=>x.top-y.top).map(g=>g.words.sort((x,y)=>x.left-y.left).map(x=>x.t).join(' '));
              const acts=[...document.querySelectorAll('.proai-hero-actions>a')].map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{top:r.top,left:r.left,right:r.right,w:r.width,h:r.height,border:s.borderTopWidth,bg:s.backgroundImage}});
              const v=document.querySelector('.hero-visual').getBoundingClientRect(),as=getComputedStyle(document.querySelector('.proai-hero-actions'));
              return{lines,acts,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,wrap:as.flexWrap,dir:as.flexDirection,cubeW:v.width,font:getComputedStyle(title).fontFamily};
            })}
            async function ruBreak(w,h){await load('/ru/',w,h);const s=await state();console.log('RU_BREAK',w,h,JSON.stringify(s.lines),s.font);a.equal(s.overflow,0);a.equal(s.lines.at(-2),'результата —');a.equal(s.lines.at(-1),'одна система.');}
            async function row(path,label,w,h){await load(path,w,h);const s=await state();console.log('CTA_ROW',label,w,h,JSON.stringify(s));a.equal(s.overflow,0);a.equal(s.dir,'row');a.equal(s.wrap,'nowrap');a.equal(s.acts.length,2);a.ok(Math.abs(s.acts[0].top-s.acts[1].top)<=4);a.equal(s.acts[1].border,'0px');a.equal(s.acts[1].bg,'none');a.ok(s.acts[0].right+4<=s.acts[1].left);a.ok(s.cubeW>=Math.min(w*.48,358));}
            await ruBreak(1440,900);await ruBreak(1200,800);
            await row('/','portrait-en',390,844);await row('/ru/','portrait-ru',390,844);
            await row('/','landscape-en',844,390);await row('/ru/','landscape-ru',844,390);
            console.log('MICRO_CORRECTION_QA=PASS');await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node hero-r3-micro-qa.cjs | tee /tmp/hero-r3-micro-qa.log

      - name: Start and verify public TryCloudflare preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >/tmp/hero-r3-cloudflared.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/hero-r3-cloudflared.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ] || { cat /tmp/hero-r3-cloudflared.log; exit 1; }
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 5 "$URL/" -o /tmp/public-en.html 2>/dev/null && curl -fsS --connect-timeout 5 "$URL/ru/" -o /tmp/public-ru.html 2>/dev/null; then
              if grep -q 'From first impression to result — one system.' /tmp/public-en.html && grep -q 'От первого впечатления до результата — одна система.' /tmp/public-ru.html; then READY=1; break; fi
            fi
            sleep 2
          done
          [ "$READY" = 1 ] || { cat /tmp/hero-r3-cloudflared.log; exit 1; }
          curl -fsS "$URL/assets/css/homepage-hero-signature-r3.css" -o /tmp/public-hero-r3.css
          grep -q 'max-width: clamp(455px, 34vw, 500px);' /tmp/public-hero-r3.css
          grep -q 'flex-flow: row nowrap;' /tmp/public-hero-r3.css
          echo "LIVE_EN=$URL/" >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_RU=$URL/ru/" >> "$GITHUB_STEP_SUMMARY"
          echo "PRODUCT_SHA=735982473854c29a6f1eeeb4d87773abbc573b4d" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,sys; print(json.dumps({"state":"success","target_url":sys.argv[1],"description":"Hero R3 micro correction owner review","context":"hero-r3-micro-correction-owner"}))' "$URL" >/tmp/status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null

      - name: Keep preview alive for owner review
        shell: bash
        run: sleep 10800
