name: TEMP Hero Signature R3 Builder
on:
  push:
    branches: [agent/proai-home-hero-signature-r3]
    paths: [.github/workflows/temporary-hero-signature-r3-builder.yml]
permissions:
  contents: write
jobs:
  build-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/proai-home-hero-signature-r3
          fetch-depth: 0
      - name: Apply final Hero R3 product changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(pattern, replacement, text, label, flags=re.S):
              out, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          def patch_home(path, lang):
              p = Path(path)
              s = p.read_text()
              s = s.replace('/assets/css/homepage-hero-shell-r2.css?v=20260812.2', '/assets/css/homepage-hero-signature-r3.css?v=20260813.1')
              s, n = re.subn(r'\n<style id="homepage-mobile-hero-cta-hotfix-v1">.*?</style>', '', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{path}: Hero hotfix removal failed')
              if lang == 'en':
                  copy = '''{% capture new_hero_copy %}<span class="hero-label">AI-FIRST BUSINESS SYSTEMS</span>
          <h1 class="proai-hero-title">From first impression to result — one system.</h1>
          <p class="proai-hero-support">We connect AI, automation, integrations, premium websites and design into one business system.</p>{% endcapture %}'''
                  actions = '''{% capture new_hero_actions %}<div class="hero-cta-group proai-hero-actions">
          <a class="proai-hero-cta proai-hero-cta--primary" href="/contact/">Request a Review</a>
          <a class="proai-hero-cta proai-hero-cta--secondary" href="/case-studies/">View Work <span aria-hidden="true">→</span></a>
          </div>{% endcapture %}'''
              else:
                  copy = '''{% capture new_hero_copy %}<span class="hero-label">AI-СИСТЕМЫ ДЛЯ БИЗНЕСА</span>
          <h1 class="proai-hero-title">От первого впечатления до результата — одна система.</h1>
          <p class="proai-hero-support">Мы объединяем AI, автоматизацию, интеграции, премиальные сайты и дизайн в единую систему для бизнеса.</p>{% endcapture %}'''
                  actions = '''{% capture new_hero_actions %}<div class="hero-cta-group proai-hero-actions">
          <a class="proai-hero-cta proai-hero-cta--primary" href="/ru/contact/">Запросить разбор</a>
          <a class="proai-hero-cta proai-hero-cta--secondary" href="/ru/case-studies/">Смотреть проекты <span aria-hidden="true">→</span></a>
          </div>{% endcapture %}'''
              s = one(r'{% capture new_hero_copy %}.*?{% endcapture %}', copy, s, f'{path}: copy')
              s = one(r'{% capture new_hero_actions %}.*?{% endcapture %}', actions, s, f'{path}: actions')
              p.write_text(s)

          patch_home('index.html', 'en')
          patch_home('ru/index.html', 'ru')

          css = r'''/* ProAI Expert Homepage Hero — Signature System Narrative R3
             Single responsive authority for the Homepage Hero. The stable Cube runtime is
             mounted into the object slot without camera, geometry, materials, lighting,
             or interaction changes. */

          #hero {
            --proai-hero-void: #020304;
            --proai-hero-page: #050607;
            --proai-hero-surface: #090b0e;
            --proai-hero-panel: #0e1217;
            --proai-hero-elevated: #171c22;
            --proai-hero-pearl: #e7e5df;
            --proai-hero-silver: #c9cdd1;
            --proai-hero-body: #a6abb1;
            --proai-hero-muted: #858a90;
            --proai-hero-header-h: 85px;
            position: relative;
            isolation: isolate;
            min-height: 100svh;
            padding: calc(var(--proai-hero-header-h) + clamp(28px, 4.2vh, 46px)) 0 clamp(44px, 6vh, 70px);
            overflow: clip;
            background:
              radial-gradient(ellipse 42% 54% at 79% 43%, rgba(217,220,222,.05) 0%, rgba(134,139,144,.022) 34%, transparent 73%),
              radial-gradient(ellipse 72% 68% at 58% 44%, var(--proai-hero-surface) 0%, rgba(9,11,14,.46) 32%, transparent 72%),
              linear-gradient(180deg, var(--proai-hero-void) 0%, var(--proai-hero-page) 18%, var(--proai-hero-page) 80%, var(--proai-hero-void) 100%);
          }

          #hero::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
              radial-gradient(ellipse 31% 40% at 82% 38%, rgba(241,242,242,.021), transparent 72%),
              linear-gradient(104deg, transparent 0%, transparent 55%, rgba(255,255,255,.007) 68%, transparent 88%);
          }

          #hero .hero-content {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(0, 1.04fr) minmax(0, .96fr);
            align-items: center;
            gap: clamp(30px, 4vw, 66px);
            width: min(100%, 1500px);
            min-height: calc(100svh - var(--proai-hero-header-h) - clamp(94px, 13vh, 136px));
            margin: 0 auto;
            padding: 0 clamp(28px, 4vw, 58px);
          }

          #hero .hero-left {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 760px;
            opacity: 1;
            transform: none;
            pointer-events: auto;
            transition: none;
          }

          body.scrolled #hero .hero-left {
            opacity: 1;
            transform: none;
            pointer-events: auto;
          }

          #hero .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 22px;
            color: #c0c3c6;
            font-family: var(--font);
            font-size: clamp(11px, .8vw, 13px);
            font-weight: 650;
            line-height: 1.35;
            letter-spacing: .155em;
            text-transform: uppercase;
          }

          #hero .hero-label::before {
            content: "";
            width: 30px;
            height: 1px;
            flex: 0 0 30px;
            background: linear-gradient(90deg, rgba(201,205,209,.72), rgba(201,205,209,.08));
          }

          #hero .proai-hero-title {
            max-width: 760px;
            margin: 0;
            color: var(--proai-hero-pearl);
            font-family: var(--font);
            font-size: clamp(68px, 5.15vw, 76px);
            font-weight: 500;
            line-height: .97;
            letter-spacing: -.052em;
            text-wrap: balance;
            background: linear-gradient(180deg, #f4f2ed 0%, #e7e5df 58%, #d2d6da 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
          }

          body.lang-ru #hero .proai-hero-title {
            max-width: 760px;
            font-size: clamp(62px, 4.75vw, 70px);
            line-height: .985;
            letter-spacing: -.043em;
          }

          #hero .proai-hero-support {
            max-width: 650px;
            margin: 26px 0 0;
            color: var(--proai-hero-body);
            font-family: var(--font);
            font-size: clamp(17px, 1.2vw, 19px);
            font-weight: 400;
            line-height: 1.55;
            text-wrap: pretty;
          }

          #hero .hero-cta-group.proai-hero-actions {
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            gap: 18px;
            margin: 32px 0 0;
          }

          #hero .proai-hero-cta {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 650;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
          }

          #hero .proai-hero-cta--primary {
            min-width: 164px;
            padding: 0 24px;
            overflow: hidden;
            border: 1px solid rgba(218,221,224,.19);
            border-radius: 9px;
            color: #f0eee8;
            background:
              linear-gradient(180deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.012) 22%, rgba(0,0,0,.10) 100%),
              linear-gradient(180deg, #171c22 0%, #11161c 48%, #0e1217 100%);
            box-shadow:
              inset 0 1px 0 rgba(245,246,246,.17),
              inset 0 -1px 0 rgba(0,0,0,.72),
              inset 0 -8px 18px rgba(0,0,0,.16),
              0 13px 30px rgba(0,0,0,.30),
              0 1px 0 rgba(255,255,255,.025);
            transition: transform 160ms ease, border-color 180ms ease, box-shadow 180ms ease, filter 180ms ease;
          }

          #hero .proai-hero-cta--primary::before {
            content: "";
            position: absolute;
            left: 12%;
            top: 0;
            width: 58%;
            height: 1px;
            pointer-events: none;
            background: linear-gradient(90deg, transparent 0%, rgba(231,229,223,.18) 18%, rgba(231,229,223,.58) 52%, rgba(201,205,209,.18) 84%, transparent 100%);
          }

          #hero .proai-hero-cta--primary::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 7px;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.018);
          }

          #hero .proai-hero-cta--primary:hover {
            transform: translateY(-1px);
            border-color: rgba(218,221,224,.27);
            box-shadow:
              inset 0 1px 0 rgba(245,246,246,.23),
              inset 0 -1px 0 rgba(0,0,0,.76),
              inset 0 -8px 18px rgba(0,0,0,.14),
              0 15px 34px rgba(0,0,0,.35),
              0 1px 0 rgba(255,255,255,.03);
          }

          #hero .proai-hero-cta--primary:active {
            transform: translateY(1px);
            box-shadow:
              inset 0 2px 5px rgba(0,0,0,.52),
              inset 0 1px 0 rgba(255,255,255,.08),
              0 7px 18px rgba(0,0,0,.26);
          }

          #hero .proai-hero-cta--secondary {
            gap: 6px;
            min-height: 44px;
            padding: 0 2px;
            color: #c9cdd1;
            border: 0;
            border-radius: 0;
            background: none;
            box-shadow: none;
            opacity: .82;
            transition: color 160ms ease, opacity 160ms ease;
          }

          #hero .proai-hero-cta--secondary span {
            display: inline-block;
            transition: transform 160ms ease;
          }

          #hero .proai-hero-cta--secondary:hover {
            color: #f0eee8;
            opacity: 1;
          }

          #hero .proai-hero-cta--secondary:hover span {
            transform: translateX(3px);
          }

          #hero .proai-hero-cta:focus-visible {
            outline: 2px solid rgba(218,221,224,.82);
            outline-offset: 4px;
          }

          #hero .proai-hero-cta--primary:focus-visible {
            box-shadow:
              inset 0 1px 0 rgba(245,246,246,.22),
              inset 0 -1px 0 rgba(0,0,0,.74),
              0 0 0 1px #050607,
              0 0 0 5px rgba(201,205,209,.17),
              0 14px 32px rgba(0,0,0,.33);
          }

          #hero .hero-visual.proai-hero-object-region {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(100%, 720px);
            justify-self: end;
            align-self: center;
            margin: 0;
            transform: none;
            overflow: visible;
            isolation: isolate;
          }

          #hero .hero-visual.proai-hero-object-region::before,
          #hero .hero-visual.proai-hero-object-region::after {
            content: "";
            position: absolute;
            pointer-events: none;
            z-index: 0;
          }

          #hero .hero-visual.proai-hero-object-region::before {
            inset: 5% -4% 4% 1%;
            background: radial-gradient(ellipse at 56% 42%, rgba(218,221,223,.048) 0%, rgba(112,118,124,.019) 36%, transparent 72%);
            filter: blur(18px);
          }

          #hero .hero-visual.proai-hero-object-region::after {
            top: 15%;
            right: 4%;
            width: 68%;
            height: 60%;
            background: linear-gradient(134deg, transparent 6%, rgba(235,237,238,.014) 48%, rgba(129,136,143,.01) 63%, transparent 86%);
            filter: blur(10px);
          }

          #hero .proai-hero-object-slot {
            position: relative;
            z-index: 1;
            width: 100%;
            aspect-ratio: 1;
            overflow: visible;
            isolation: isolate;
          }

          #hero .proai-hero-cube-mount {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 260ms ease, visibility 0s linear 260ms;
          }

          #hero .proai-hero-object-slot[data-cube-mounted="true"] .proai-hero-cube-mount {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 260ms ease, visibility 0s linear 0s;
          }

          #hero .proai-hero-cube-mount canvas {
            display: block;
            width: 100%;
            height: 100%;
          }

          @media (max-width: 1260px) and (min-width: 901px) {
            #hero .hero-content {
              grid-template-columns: minmax(0, 1.03fr) minmax(0, .97fr);
              gap: clamp(24px, 3vw, 38px);
              padding-inline: 34px;
            }

            #hero .proai-hero-title {
              font-size: clamp(56px, 5vw, 64px);
            }

            body.lang-ru #hero .proai-hero-title {
              font-size: clamp(52px, 4.6vw, 59px);
            }

            #hero .proai-hero-support {
              font-size: 17px;
            }
          }

          @media (max-width: 900px) {
            #hero {
              min-height: auto;
              padding: calc(var(--proai-hero-header-h) + 26px) 0 42px;
            }

            #hero .hero-content {
              display: flex;
              min-height: 0;
              flex-direction: column;
              align-items: stretch;
              gap: 30px;
              padding-inline: clamp(20px, 5vw, 38px);
            }

            #hero .hero-left {
              max-width: 760px;
            }

            #hero .proai-hero-title,
            body.lang-ru #hero .proai-hero-title {
              max-width: 760px;
              font-size: clamp(44px, 8.8vw, 58px);
              line-height: .99;
            }

            body.lang-ru #hero .proai-hero-title {
              font-size: clamp(42px, 8.1vw, 54px);
              letter-spacing: -.038em;
            }

            #hero .proai-hero-support {
              max-width: 680px;
              margin-top: 22px;
              font-size: 16.5px;
              line-height: 1.55;
            }

            #hero .hero-cta-group.proai-hero-actions {
              margin-top: 26px;
            }

            #hero .hero-visual.proai-hero-object-region {
              order: 2;
              width: min(92vw, 560px);
              max-width: 100%;
              align-self: center;
              justify-self: auto;
            }

            #hero .proai-hero-object-slot[data-cube-mounted="false"] {
              min-height: 88px;
              aspect-ratio: auto;
            }

            #hero .proai-hero-object-slot[data-cube-mounted="true"] {
              min-height: 0;
              aspect-ratio: 1;
            }
          }

          @media (max-width: 640px) {
            #hero {
              --proai-hero-header-h: 84px;
              padding: calc(var(--proai-hero-header-h) + 20px) 0 32px;
            }

            #hero .hero-content {
              gap: 24px;
              padding-inline: 18px;
            }

            #hero .hero-label {
              gap: 8px;
              margin-bottom: 16px;
              font-size: 10px;
              line-height: 1.45;
              letter-spacing: .13em;
            }

            #hero .hero-label::before {
              width: 22px;
              flex-basis: 22px;
            }

            #hero .proai-hero-title {
              font-size: clamp(42px, 11.2vw, 49px);
              line-height: .995;
              letter-spacing: -.043em;
            }

            body.lang-ru #hero .proai-hero-title {
              font-size: clamp(40px, 10.45vw, 46px);
              letter-spacing: -.034em;
            }

            #hero .proai-hero-support {
              margin-top: 20px;
              font-size: 16px;
              line-height: 1.52;
            }

            #hero .hero-cta-group.proai-hero-actions {
              gap: 15px;
              margin-top: 24px;
            }

            #hero .proai-hero-cta--primary {
              min-height: 50px;
              padding-inline: 20px;
            }

            #hero .hero-visual.proai-hero-object-region {
              width: min(92vw, 520px);
            }
          }

          @media (max-width: 380px) {
            #hero .hero-content {
              padding-inline: 16px;
            }

            #hero .proai-hero-title {
              font-size: 41px;
            }

            body.lang-ru #hero .proai-hero-title {
              font-size: 39px;
            }
          }

          @media (max-width: 1000px) and (max-height: 540px) and (orientation: landscape) {
            #hero {
              --proai-hero-header-h: 68px;
              min-height: auto;
              padding: calc(var(--proai-hero-header-h) + 20px) 0 38px;
            }

            #hero .hero-content {
              display: flex;
              min-height: 0;
              flex-direction: column;
              align-items: stretch;
              gap: 34px;
              width: min(100%, 980px);
              padding-inline: clamp(24px, 5vw, 48px);
            }

            #hero .hero-left {
              width: 100%;
              max-width: 820px;
              padding: 0;
            }

            #hero .hero-label {
              margin-bottom: 16px;
              font-size: 10px;
            }

            #hero .proai-hero-title {
              max-width: 820px;
              font-size: clamp(48px, 6.2vw, 58px);
              line-height: .98;
            }

            body.lang-ru #hero .proai-hero-title {
              max-width: 840px;
              font-size: clamp(46px, 5.7vw, 54px);
              line-height: .99;
            }

            #hero .proai-hero-support {
              max-width: 760px;
              margin-top: 18px;
              font-size: 16px;
              line-height: 1.5;
            }

            #hero .hero-cta-group.proai-hero-actions {
              margin-top: 22px;
            }

            #hero .hero-visual.proai-hero-object-region {
              width: clamp(360px, 50vw, 520px);
              max-width: calc(100vw - 48px);
              align-self: center;
              justify-self: auto;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            #hero .proai-hero-cta,
            #hero .proai-hero-cta--secondary span,
            #hero .proai-hero-cube-mount {
              transition: none;
            }

            #hero .proai-hero-cta:hover,
            #hero .proai-hero-cta:active,
            #hero .proai-hero-cta--secondary:hover span {
              transform: none;
            }
          }
          '''
          css = re.sub(r'^          ', '', css, flags=re.M)
          Path('assets/css/homepage-hero-signature-r3.css').write_text(css)

          p = Path('mobile-pass-v141.css')
          m = p.read_text()
          m = m.replace('body.page-home .hero-left h1 .hero-accent,\n', '')
          m = re.sub(r'body\.page-home \.hero-left h1 \.hero-accent \{[^}]*\}\n', '', m, count=1)
          m = m.replace('  body.page-home .hero-label,\n', '')
          m = m.replace('  body.page-home #hero,\n', '')
          m = one(r'\n  body\.page-home #hero \{.*?\n  body\.page-home \.scene \{.*?\}\n\n', '\n', m, 'mobile portrait Home Hero rules')
          m = one(r'\n/\*\n \* Home page only:.*?\n\}\n\n/\* Smaller type \+ padding on narrow viewports \*/', '\n/* Smaller type + padding on narrow viewports */', m, 'mobile portrait CTA legacy')
          m = one(r'(@media \(max-width: 1100px\) and \(orientation: landscape\), \(max-height: 540px\) \{\n)  body\.page-home #hero \{.*?\n\n(  body\.page-about)', r'\1\2', m, 'mobile landscape Home Hero rules')
          legacy = re.findall(r'body(?:\.lang-ru)?\.page-home\s+(?:#hero|\.hero-|\.scene)', m)
          if legacy:
              raise SystemExit(f'legacy Home Hero selectors remain: {legacy[:8]}')
          p.write_text(m)

          # Product-scope assertions.
          en = Path('index.html').read_text()
          ru = Path('ru/index.html').read_text()
          required = [
              (en, 'AI-FIRST BUSINESS SYSTEMS'),
              (en, 'From first impression to result — one system.'),
              (en, 'We connect AI, automation, integrations, premium websites and design into one business system.'),
              (en, 'Request a Review'),
              (en, 'View Work <span aria-hidden="true">→</span>'),
              (ru, 'AI-СИСТЕМЫ ДЛЯ БИЗНЕСА'),
              (ru, 'От первого впечатления до результата — одна система.'),
              (ru, 'Мы объединяем AI, автоматизацию, интеграции, премиальные сайты и дизайн в единую систему для бизнеса.'),
              (ru, 'Запросить разбор'),
              (ru, 'Смотреть проекты <span aria-hidden="true">→</span>'),
          ]
          for text, needle in required:
              if needle not in text:
                  raise SystemExit(f'missing required copy: {needle}')
          for obsolete in ['proai-hero-microcopy', 'proai-hero-accountability', 'proai-hero-stage-rail']:
              if obsolete in en or obsolete in ru:
                  raise SystemExit(f'obsolete Hero architecture remains: {obsolete}')
          if 'homepage-hero-shell-r2.css' in en or 'homepage-hero-shell-r2.css' in ru:
              raise SystemExit('R2 Hero authority still active')
          if '!important' in css:
              raise SystemExit('R3 authority must not use !important')
          print('Hero R3 product patch assertions: PASS')
          PY
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name "ProAI Hero Builder"
          git config user.email "proai.expert2026@gmail.com"
          git add index.html ru/index.html assets/css/homepage-hero-signature-r3.css mobile-pass-v141.css
          git diff --cached --check
          git commit -m "feat: implement Hero R3 signature system narrative"
          git push origin HEAD:agent/proai-home-hero-signature-r3
