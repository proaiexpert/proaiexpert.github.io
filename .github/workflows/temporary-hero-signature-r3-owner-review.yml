name: TEMP Hero Signature R3 Cleanup
on:
  push:
    branches: [agent/proai-home-hero-signature-r3]
    paths: [.github/workflows/temporary-hero-signature-r3-owner-review.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/proai-home-hero-signature-r3
          fetch-depth: 0
      - name: Remove temporary review workflow
        run: |
          set -euo pipefail
          git config user.name "ProAI Hero Builder"
          git config user.email "proai.expert2026@gmail.com"
          git rm .github/workflows/temporary-hero-signature-r3-owner-review.yml
          git commit -m "chore: remove temporary Hero R3 review workflow"
          git push origin HEAD:agent/proai-home-hero-signature-r3
