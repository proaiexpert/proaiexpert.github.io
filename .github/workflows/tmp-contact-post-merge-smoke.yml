name: One-time Contact post-merge smoke

on:
  push:
    branches:
      - agent/contact-post-merge-smoke

permissions:
  contents: write
  actions: read

jobs:
  verify-live-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: 7bcc09ae28388f8e4a5e6e5a715aa5ba7b3fbf50
      REPOSITORY: proaiexpert/proaiexpert.github.io
      SITE_ORIGIN: https://proai-expert.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contact-post-merge-smoke
          fetch-depth: 0

      - name: Verify Pages deployment run
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['MERGE_SHA']
          token = os.environ['GH_TOKEN']
          endpoint = f'https://api.github.com/repos/{repo}/actions/runs?' + urllib.parse.urlencode({
              'head_sha': sha,
              'event': 'push',
              'per_page': 20,
          })
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'proai-contact-post-merge-smoke',
          }

          selected = None
          for _ in range(36):
              request = urllib.request.Request(endpoint, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              candidates = [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('head_sha') == sha
                  and run.get('head_branch') == 'main'
                  and run.get('event') == 'push'
                  and (
                      str(run.get('path', '')).startswith('.github/workflows/deploy-pages.yml')
                      or run.get('name') == 'Deploy Jekyll site to GitHub Pages'
                  )
              ]
              if candidates:
                  selected = sorted(candidates, key=lambda run: run.get('created_at', ''), reverse=True)[0]
                  if selected.get('status') == 'completed':
                      break
              time.sleep(10)

          if not selected:
              raise SystemExit('No Pages deployment workflow run found for merge SHA')
          if selected.get('status') != 'completed' or selected.get('conclusion') != 'success':
              raise SystemExit(f"Pages run not successful: status={selected.get('status')} conclusion={selected.get('conclusion')} url={selected.get('html_url')}")

          evidence = {
              'run_id': selected.get('id'),
              'run_number': selected.get('run_number'),
              'status': selected.get('status'),
              'conclusion': selected.get('conclusion'),
              'html_url': selected.get('html_url'),
              'created_at': selected.get('created_at'),
              'updated_at': selected.get('updated_at'),
              'head_sha': selected.get('head_sha'),
          }
          with open('/tmp/pages-run.json', 'w', encoding='utf-8') as fh:
              json.dump(evidence, fh, indent=2)
          print(json.dumps(evidence, indent=2))
          PY

      - name: Verify deployed live source
        run: |
          python - <<'PY'
          import os, time, urllib.parse, urllib.request

          origin = os.environ['SITE_ORIGIN']
          sha = os.environ['MERGE_SHA']
          checks = {
              '/contact/': ['containsUnsafeUrlSyntax', 'privateReviewContext', 'Request a Private Review', 'name="language" type="hidden" value="en"'],
              '/ru/contact/': ['containsUnsafeUrlSyntax', 'privateReviewContext', 'Запросить первичный разбор', 'name="language" type="hidden" value="ru"'],
          }
          results = {}
          for path, markers in checks.items():
              last_missing = markers
              for attempt in range(36):
                  query = urllib.parse.urlencode({'_verify': f'{sha}-{int(time.time())}-{attempt}'})
                  url = origin + path + '?' + query
                  request = urllib.request.Request(url, headers={
                      'User-Agent': 'proai-contact-post-merge-smoke',
                      'Cache-Control': 'no-cache',
                      'Pragma': 'no-cache',
                  })
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode('utf-8', errors='replace')
                      status = response.status
                  missing = [marker for marker in markers if marker not in body]
                  if status == 200 and not missing:
                      results[path] = {'status': status, 'bytes': len(body), 'url': url}
                      break
                  last_missing = missing
                  time.sleep(10)
              else:
                  raise SystemExit(f'{path}: deployed markers missing after polling: {last_missing}')
          with open('/tmp/live-source.txt', 'w', encoding='utf-8') as fh:
              for path, result in results.items():
                  fh.write(f"{path}: HTTP {result['status']}, {result['bytes']} bytes\n")
          print(results)
          PY

      - name: Verify live direct and Private Review behavior
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          import os
          from urllib.parse import urlencode
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          origin = os.environ['SITE_ORIGIN']
          sha = os.environ['MERGE_SHA']
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=390,844')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 20)

          def field(name):
              return driver.find_element(By.ID, name).get_attribute('value')

          lines = []
          try:
              for route, lang in [('/contact/', 'en'), ('/ru/contact/', 'ru')]:
                  direct = origin + route + '?' + urlencode({'_verify': sha})
                  driver.get(direct)
                  wait.until(EC.presence_of_element_located((By.ID, 'contactForm')))
                  assert field('intent') == 'project_inquiry'
                  assert field('source_page') == 'contact'
                  assert field('source_cta') == 'direct_contact'
                  assert field('selected_direction') == 'not_sure'
                  assert field('language') == lang
                  panel = driver.find_element(By.ID, 'privateReviewContext')
                  assert panel.get_attribute('aria-hidden') == 'true'
                  assert driver.execute_script('return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1')
                  lines.append(f'{route} direct: PASS')

                  query = urlencode({
                      'intent': 'private_review',
                      'source_page': 'homepage',
                      'source_cta': 'homepage_hero',
                      'selected_direction': 'both',
                      'referring_url': origin + '/',
                      '_verify': sha,
                  })
                  private_url = origin + route + '?' + query + '#project-intake'
                  driver.get(private_url)
                  wait.until(EC.presence_of_element_located((By.ID, 'contactForm')))
                  assert field('intent') == 'private_review'
                  assert field('source_page') == 'homepage'
                  assert field('source_cta') == 'homepage_hero'
                  assert field('selected_direction') == 'both'
                  assert field('language') == lang
                  assert field('referring_url').startswith(origin + '/')
                  panel = driver.find_element(By.ID, 'privateReviewContext')
                  assert panel.get_attribute('aria-hidden') == 'false'
                  assert 'is-visible' in panel.get_attribute('class')
                  lines.append(f'{route} private review: PASS')

                  unsafe = origin + route + '?' + urlencode({
                      'intent': 'private_review',
                      'source_page': 'homepage',
                      'source_cta': 'homepage_hero',
                      'referring_url': '<svg onload=alert(1)>',
                      '_verify': sha,
                  })
                  driver.get(unsafe)
                  wait.until(EC.presence_of_element_located((By.ID, 'contactForm')))
                  assert field('referring_url') == ''
                  lines.append(f'{route} unsafe referring_url rejection: PASS')
          finally:
              driver.quit()

          with open('/tmp/browser-smoke.txt', 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Record evidence and clean one-time workflow
        run: |
          RUN_ID=$(python -c "import json; print(json.load(open('/tmp/pages-run.json'))['run_id'])")
          RUN_URL=$(python -c "import json; print(json.load(open('/tmp/pages-run.json'))['html_url'])")
          UPDATED=$(python -c "import json; print(json.load(open('/tmp/pages-run.json'))['updated_at'])")
          cat > CONTACT_POST_MERGE_SMOKE_REPORT.md <<EOF
          # Contact PR #98 post-merge smoke report

          - Merge commit: \`$MERGE_SHA\`
          - Pages workflow run ID: \`$RUN_ID\`
          - Pages workflow conclusion: \`success\`
          - Pages workflow updated: \`$UPDATED\`
          - Pages workflow URL: $RUN_URL
          - EN live source markers: PASS
          - RU live source markers: PASS
          - EN direct Contact: PASS
          - RU direct Contact: PASS
          - EN Private Review URL: PASS
          - RU Private Review URL: PASS
          - Unsafe \`referring_url\` rejection on live EN/RU: PASS
          - Live Formspree submission: NOT RUN

          ## Live-source evidence

          \`\`\`
          $(cat /tmp/live-source.txt)
          \`\`\`

          ## Browser evidence

          \`\`\`
          $(cat /tmp/browser-smoke.txt)
          \`\`\`
          EOF
          rm -f .github/workflows/tmp-contact-post-merge-smoke.yml tmp-post-merge-smoke-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTACT_POST_MERGE_SMOKE_REPORT.md .github/workflows/tmp-contact-post-merge-smoke.yml tmp-post-merge-smoke-trigger.txt
          git commit -m "Record Contact post-merge smoke verification"
          git push origin HEAD:agent/contact-post-merge-smoke
