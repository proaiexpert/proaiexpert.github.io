name: Temporary Contact private review patch

on:
  push:
    branches:
      - agent/contact-private-review-prerequisite

permissions:
  contents: write

jobs:
  patch-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contact-private-review-prerequisite
          fetch-depth: 0

      - name: Patch EN and RU Contact pages
        run: python tools/tmp_patch_contact_private_review.py

      - name: Remove temporary implementation helpers
        run: rm -f tools/tmp_patch_contact_private_review.py tmp-contact-source-links.md

      - name: Commit Contact prerequisite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact/index.html ru/contact/index.html tools/tmp_patch_contact_private_review.py tmp-contact-source-links.md
          git commit -m "Prepare EN and RU Contact for private review context"
          git push origin HEAD:agent/contact-private-review-prerequisite
