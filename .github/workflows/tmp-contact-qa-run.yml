name: One-time Contact QA run

on:
  push:
    branches:
      - agent/contact-private-review-prerequisite

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contact-private-review-prerequisite
          fetch-depth: 0

      - name: Record QA start
        run: |
          printf '# Contact QA state\n\n- Status: RUNNING\n- Source SHA: `%s`\n' "$GITHUB_SHA" > tmp-contact-qa-state.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-contact-qa-state.md
          git commit -m "Mark Contact QA run started"
          git push origin HEAD:agent/contact-private-review-prerequisite

      - name: Run checks and record final result
        shell: bash
        run: |
          set +e
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document >/tmp/install.log 2>&1
          I1=$?
          gem install --user-install webrick --no-document >>/tmp/install.log 2>&1
          I2=$?
          jekyll build --source . --destination _site >/tmp/build.log 2>&1
          B=$?

          python - <<'PY' >/tmp/static.log 2>&1
          from pathlib import Path
          for path, lang, title in [
              ('_site/contact/index.html','en','Request a Private Review'),
              ('_site/ru/contact/index.html','ru','Запросить первичный разбор'),
          ]:
              text=Path(path).read_text(encoding='utf-8')
              assert text.count('https://formspree.io/f/xbdakqoz') == 1
              assert title in text
              assert 'innerHTML' not in text
              for name in ['intent','selected_direction','source_page','source_cta','source_context','referring_url','language']:
                  assert f'name="{name}"' in text
              assert f'name="language" type="hidden" value="{lang}"' in text
              for value in ['private_review','project_inquiry','ai_systems_automation','websites_branding','both','not_sure','homepage_hero','homepage_ways_to_start','homepage_final','direct_contact']:
                  assert value in text
              assert text.count('name="company_website"') == 1
              assert text.count('name="form_started_at"') == 1
          print('PASS')
          PY
          S=$?

          python -m pip install --quiet selenium >/tmp/selenium.log 2>&1
          SI=$?
          python -m http.server 8000 --directory _site >/tmp/server.log 2>&1 &
          PID=$!
          sleep 2
          python - <<'PY' >/tmp/browser.log 2>&1
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          options=Options()
          for arg in ['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size=390,844']:
              options.add_argument(arg)
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,10)
          def val(name): return driver.find_element(By.ID,name).get_attribute('value')
          try:
              for route,lang in [('/contact/','en'),('/ru/contact/','ru')]:
                  driver.get('http://127.0.0.1:8000'+route)
                  wait.until(EC.presence_of_element_located((By.ID,'contactForm')))
                  assert (val('intent'),val('source_page'),val('source_cta'),val('selected_direction'),val('language')) == ('project_inquiry','contact','direct_contact','not_sure',lang)
                  assert driver.find_element(By.ID,'privateReviewContext').get_attribute('aria-hidden') == 'true'
                  driver.find_element(By.CSS_SELECTOR,'[data-value="websites_branding"]').click()
                  assert val('selected_direction') == 'websites_branding'
                  driver.get('http://127.0.0.1:8000'+route+'?intent=private_review&source_page=homepage&source_cta=homepage_final&selected_direction=both&source_context=financial_stream&referring_url=https%3A%2F%2Fproai-expert.com%2F#project-intake')
                  wait.until(EC.presence_of_element_located((By.ID,'contactForm')))
                  assert (val('intent'),val('source_page'),val('source_cta'),val('selected_direction')) == ('private_review','homepage','homepage_final','both')
                  assert val('source_context') == 'financial_stream'
                  assert val('referring_url').startswith('https://proai-expert.com/')
                  assert driver.find_element(By.ID,'privateReviewContext').get_attribute('aria-hidden') == 'false'
                  driver.get('http://127.0.0.1:8000'+route+'?intent=x&source_page=x&source_cta=x&selected_direction=x&source_context=%3Cscript%3E&referring_url=javascript%3Aalert(1)')
                  wait.until(EC.presence_of_element_located((By.ID,'contactForm')))
                  assert (val('intent'),val('source_page'),val('source_cta'),val('selected_direction'),val('source_context'),val('referring_url')) == ('project_inquiry','contact','direct_contact','not_sure','','')
              print('PASS')
          finally:
              driver.quit()
          PY
          C=$?
          kill "$PID" >/dev/null 2>&1

          word(){ [ "$1" -eq 0 ] && echo PASS || echo FAIL; }
          {
            echo '# Contact QA state'
            echo
            echo '- Status: COMPLETE'
            echo "- Jekyll install: $(word "$I1")"
            echo "- Webrick install: $(word "$I2")"
            echo "- Jekyll build: $(word "$B")"
            echo "- Static generated-output checks: $(word "$S")"
            echo "- Selenium install: $(word "$SI")"
            echo "- Headless Chrome behavior checks: $(word "$C")"
            echo '- Live Formspree submission: NOT RUN'
            echo
            echo '## Build tail'
            echo '```text'; tail -n 20 /tmp/build.log; echo '```'
            echo '## Static tail'
            echo '```text'; tail -n 20 /tmp/static.log; echo '```'
            echo '## Browser tail'
            echo '```text'; tail -n 40 /tmp/browser.log; echo '```'
          } > tmp-contact-qa-state.md
          git add tmp-contact-qa-state.md
          git commit -m "Record Contact QA result"
          git push origin HEAD:agent/contact-private-review-prerequisite
          [ "$I1" -eq 0 ] && [ "$I2" -eq 0 ] && [ "$B" -eq 0 ] && [ "$S" -eq 0 ] && [ "$SI" -eq 0 ] && [ "$C" -eq 0 ]
