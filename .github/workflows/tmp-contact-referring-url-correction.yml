name: Apply Contact referring URL correction

on:
  push:
    branches:
      - agent/contact-private-review-prerequisite

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contact-private-review-prerequisite
          fetch-depth: 0

      - name: Patch EN and RU Contact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "function boundedUrl(value,maxLength){if(!value||value.length>maxLength){return '';}try{const parsed=new URL(value,window.location.origin);return parsed.protocol==='http:'||parsed.protocol==='https:'?parsed.href:'';}catch(error){return '';}}"
          new = "function containsUnsafeUrlSyntax(value){let probe=value;for(let depth=0;depth<3;depth+=1){if(/[\\u0000-\\u001F\\u007F-\\u009F<>]/.test(probe)){return true;}let decoded;try{decoded=decodeURIComponent(probe);}catch(error){break;}if(decoded===probe){break;}probe=decoded;}return /[\\u0000-\\u001F\\u007F-\\u009F<>]/.test(probe);}\nfunction boundedUrl(value,maxLength){if(!value||value.length>maxLength||containsUnsafeUrlSyntax(value)||!/^https?:\\/\\//i.test(value)){return '';}try{const parsed=new URL(value);if((parsed.protocol!=='http:'&&parsed.protocol!=='https:')||parsed.username||parsed.password){return '';}const normalized=parsed.href;return normalized.length<=maxLength&&!containsUnsafeUrlSyntax(normalized)?normalized:'';}catch(error){return '';}}"

          for filename in ('contact/index.html', 'ru/contact/index.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: old function not found exactly once')
              path.write_text(text.replace(old, new), encoding='utf-8')
              updated = path.read_text(encoding='utf-8')
              assert 'new URL(value,window.location.origin)' not in updated
              assert 'const parsed=new URL(value)' in updated
              assert 'parsed.username||parsed.password' in updated
              assert 'normalized.length<=maxLength' in updated
          PY

      - name: Commit correction
        shell: bash
        run: |
          rm -f .github/workflows/tmp-contact-referring-url-correction.yml
          rm -f tmp-contact-correction-trigger.txt
          printf '%s\n' '# Contact referring URL correction' '' '- Two-file symmetric patch applied: PASS' > tmp-contact-referring-url-qa.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact/index.html ru/contact/index.html tmp-contact-referring-url-qa.md .github/workflows/tmp-contact-referring-url-correction.yml tmp-contact-correction-trigger.txt
          git commit -m "Harden Contact referring URL validation"
          git push origin HEAD:agent/contact-private-review-prerequisite
