name: Verify Contact referring URL correction

on:
  push:
    branches:
      - agent/contact-private-review-prerequisite

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contact-private-review-prerequisite
          fetch-depth: 0

      - name: Build with Jekyll
        shell: bash
        run: |
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          export PATH="$GEM_HOME/bin:$PATH"
          gem install --user-install jekyll -v 4.3.4 --no-document
          gem install --user-install webrick --no-document
          jekyll build --source . --destination _site

      - name: Static source and generated-output verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_paths = [Path('contact/index.html'), Path('ru/contact/index.html')]
          generated_paths = [Path('_site/contact/index.html'), Path('_site/ru/contact/index.html')]
          sanitizer_blocks = []

          for path in source_paths:
              text = path.read_text(encoding='utf-8')
              assert text.count('https://formspree.io/f/xbdakqoz') == 1, path
              assert 'new URL(value,window.location.origin)' not in text, path
              assert 'const parsed=new URL(value)' in text, path
              assert 'parsed.username||parsed.password' in text, path
              assert 'normalized.length<=maxLength' in text, path
              assert 'containsUnsafeUrlSyntax' in text, path
              assert 'innerHTML' not in text, path
              assert 'name="intent" type="hidden" value="project_inquiry"' in text, path
              assert 'name="selected_direction" type="hidden" value="not_sure"' in text, path
              assert 'name="source_page" type="hidden" value="contact"' in text, path
              assert 'name="source_cta" type="hidden" value="direct_contact"' in text, path
              match = re.search(
                  r'function containsUnsafeUrlSyntax\(value\)\{.*?\}\nfunction boundedUrl\(value,maxLength\)\{.*?\}\nfunction setDirection',
                  text,
                  re.S,
              )
              assert match, path
              sanitizer_blocks.append(match.group(0).rsplit('\nfunction setDirection', 1)[0])

          assert sanitizer_blocks[0] == sanitizer_blocks[1], 'EN/RU sanitizer mismatch'

          for path in generated_paths:
              text = path.read_text(encoding='utf-8')
              assert 'new URL(value,window.location.origin)' not in text, path
              assert 'const parsed=new URL(value)' in text, path
              assert 'parsed.username||parsed.password' in text, path
              assert 'footer-system/footer.html' not in text, path

          print('STATIC_PASS')
          PY

      - name: Run headless browser safety and responsive matrix
        shell: bash
        run: |
          python -m pip install --quiet selenium
          python -m http.server 8000 --directory _site >/tmp/contact-url-qa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from urllib.parse import quote

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 10)
          origin = 'http://127.0.0.1:8000'

          def field_value(field_id):
              return driver.find_element(By.ID, field_id).get_attribute('value')

          def load(route, params='', fragment='project-intake'):
              url = origin + route
              if params:
                  url += '?' + params
              if fragment:
                  url += '#' + fragment
              driver.get(url)
              wait.until(EC.presence_of_element_located((By.ID, 'contactForm')))

          def private_params(referring_url=None, raw_suffix=''):
              params = 'intent=private_review&source_page=homepage&source_cta=homepage_hero'
              if referring_url is not None:
                  params += '&referring_url=' + quote(referring_url, safe='')
              if raw_suffix:
                  params += '&' + raw_suffix
              return params

          valid_urls = [
              ('https://proai-expert.com/case-studies/financial-stream/', 'https://proai-expert.com/case-studies/financial-stream/'),
              ('http://example.com/path?q=1', 'http://example.com/path?q=1'),
              ('https://example.com/100%25-ready', 'https://example.com/100%25-ready'),
          ]

          rejected_urls = [
              '/relative/path',
              'relative/path',
              'javascript:alert(1)',
              'data:text/html,<svg onload=alert(1)>',
              'https://user:pass@example.com/path',
              '<svg onload=alert(1)>',
              '%3Csvg%20onload%3Dalert(1)%3E',
              '%253Csvg%2520onload%253Dalert(1)%253E',
              'https://example.com/path\nnext',
              'https://example.com/path\rnext',
              'https://example.com/' + ('a' * 520),
              'https://example.com/' + ('é' * 240),
          ]

          sizes = [(320, 844), (360, 800), (375, 812), (390, 844), (430, 932), (844, 390)]
          routes = [('/contact/', 'en'), ('/ru/contact/', 'ru')]

          try:
              for width, height in sizes:
                  driver.set_window_size(width, height)
                  for route, language in routes:
                      load(route, fragment='')
                      assert field_value('intent') == 'project_inquiry'
                      assert field_value('source_page') == 'contact'
                      assert field_value('source_cta') == 'direct_contact'
                      assert field_value('selected_direction') == 'not_sure'
                      assert field_value('language') == language
                      assert driver.execute_script(
                          'return document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1'
                      ), (width, height, route, 'overflow')

                      for raw, expected in valid_urls:
                          load(route, private_params(raw))
                          actual = field_value('referring_url')
                          assert actual.startswith(expected), (route, raw, actual)

                      for raw in rejected_urls:
                          load(route, private_params(raw))
                          actual = field_value('referring_url')
                          assert actual == '', (route, raw, actual)

                      load(route, private_params(raw_suffix='referring_url=%3Csvg%20onload%3Dalert(1)%3E'))
                      assert field_value('referring_url') == ''
                      load(route, private_params(raw_suffix='referring_url=%253Csvg%2520onload%253Dalert(1)%253E'))
                      assert field_value('referring_url') == ''

                      load(route, private_params('https://example.com/source'))
                      panel = driver.find_element(By.ID, 'privateReviewContext')
                      assert panel.get_attribute('aria-hidden') == 'false'
                      assert 'is-visible' in panel.get_attribute('class')

                      header_height = driver.execute_script(
                          "return document.querySelector('header').getBoundingClientRect().height"
                      )
                      intake_top = driver.execute_script(
                          "return document.getElementById('project-intake').getBoundingClientRect().top"
                      )
                      assert intake_top >= header_height - 8, (width, height, route, intake_top, header_height)

                      direction_button = driver.find_element(By.CSS_SELECTOR, '[data-value="ai_systems_automation"]')
                      driver.execute_script('arguments[0].click()', direction_button)
                      assert field_value('selected_direction') == 'ai_systems_automation'
                      assert direction_button.get_attribute('aria-pressed') == 'true'

              driver.set_window_size(390, 844)
              load('/contact/', private_params('https://example.com/back-forward'))
              assert field_value('intent') == 'private_review'
              driver.get(origin + '/contact/')
              driver.back()
              wait.until(EC.presence_of_element_located((By.ID, 'contactForm')))
              assert field_value('intent') == 'private_review'
              assert field_value('referring_url').startswith('https://example.com/back-forward')

              print('BROWSER_PASS')
          finally:
              driver.quit()
          PY

      - name: Record successful QA and clean temporary runner
        shell: bash
        run: |
          cat > tmp-contact-referring-url-qa.md <<'EOF'
          # Contact referring URL targeted correction QA

          - Symmetric EN/RU sanitizer: PASS
          - Absolute HTTPS URL: PASS
          - Absolute HTTP URL: PASS
          - Harmless percent-encoded URL: PASS
          - Relative path rejection: PASS
          - `javascript:` rejection: PASS
          - `data:` rejection: PASS
          - URL credentials rejection: PASS
          - Raw markup rejection: PASS
          - Once-encoded markup rejection: PASS
          - Double-encoded markup rejection: PASS
          - C0/C1 control-character rejection: PASS
          - Raw input over 500 characters: PASS
          - Normalized URL over 500 characters: PASS
          - Jekyll 4.3.4 build: PASS
          - Generated EN/RU output: PASS
          - Direct EN/RU defaults: PASS
          - Private Review context: PASS
          - Direction interaction and `aria-pressed`: PASS
          - Mobile widths 320/360/375/390/430: PASS
          - Short-phone landscape 844x390: PASS
          - Horizontal overflow assertion: PASS
          - Fixed-header anchor clearance: PASS
          - Browser back/forward context restoration: PASS
          - Live Formspree submission: NOT RUN
          EOF
          rm -f .github/workflows/tmp-contact-referring-url-qa.yml
          rm -f tmp-contact-referring-url-qa-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-contact-referring-url-qa.md .github/workflows/tmp-contact-referring-url-qa.yml tmp-contact-referring-url-qa-trigger.txt
          git commit -m "Verify Contact referring URL correction"
          git push origin HEAD:agent/contact-private-review-prerequisite
