name: Temporary ProAI Cube R1.2 A/B builder v2

on:
  pull_request:
    branches:
      - agent/tmp-proai-cube-r12-builder-base

permissions:
  contents: write

jobs:
  build-candidates:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r12-builder-trigger-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-resend-spatial-motion-r1
          fetch-depth: 0

      - name: Verify exact R1.1 start
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5e1ac4fbcbad31d263e5fd95e6fbbb3f95ed226a"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "d04ee7a356e4e3297d62693e5c20222f00e68eef"

      - name: Build Candidate A
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/js/proai-hero-cube-r1/source-materials-r1.js')
          s = p.read_text(encoding='utf-8')

          def sub1(pattern, repl, label, flags=0):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s = s2

          sub1(
              r"let interactionActive = false;\nlet manualResumeAt = 0;\nlet sliceResumeAt = 0;\nlet presentationResumeStart = 0;\nlet presentationResumeFrom = new THREE\.Quaternion\(\);\nlet frozenPresentationQuaternion = new THREE\.Quaternion\(\);",
              "let interactionActive = false;\nlet frozenPresentationQuaternion = new THREE.Quaternion();",
              'interaction state')

          sub1(
              r"function presentationAutonomyBlocked\(\) \{\n  return interactionActive \|\| performance\.now\(\) < manualResumeAt;\n\}\n\nfunction sliceAutonomyBlocked\(\) \{\n  return interactionActive \|\| performance\.now\(\) < sliceResumeAt;\n\}",
              "function presentationAutonomyBlocked() {\n  return false;\n}\n\nfunction sliceAutonomyBlocked() {\n  return false;\n}",
              'autonomy gates')

          sub1(
              r"\n  if \(presentationAutonomyBlocked\(\)\) \{\n.*?\n  \}\n\n  presentationSimTimeMs \+= deltaMs;",
              "\n  presentationSimTimeMs += deltaMs;",
              'presentation freeze path',
              re.S)

          sub1(
              r"  if \(presentationResumeStart > 0 && now < presentationResumeStart \+ MOTION\.manualResumeBlendMs\) \{.*?\n  \}\n  presentationFrameDeltaRad = before\.angleTo\(presentationRig\.quaternion\);",
              "  presentationRig.quaternion.copy(presentationTargetQuaternion);\n  presentationFrameDeltaRad = before.angleTo(presentationRig.quaternion);",
              'resume blend path',
              re.S)

          replacement = """function getInteractionState() {
            return {
              interactionActive,
              autonomyBlocked: false,
              sliceAutonomyBlocked: false,
              resumeDelayRemainingMs: 0,
              sliceResumeDelayRemainingMs: 0,
              presentationResumeActive: false,
              presentationSimTimeMs,
              sliceEventSerial,
              activeTurnCount: activeTurns.size,
              activeTurnProgress: activeTurnList().map((turn) => ({ id: turn.id, linear: turn.linear, eased: turn.eased })),
              cameraPosition: camera.position.toArray(),
              presentationQuaternion: presentationRig.quaternion.toArray(),
            };
          }

          controls.addEventListener('start', () => {
            interactionActive = true;
            frozenPresentationQuaternion.copy(presentationRig.quaternion);
          });

          controls.addEventListener('end', () => {
            interactionActive = false;
          });

          function beginReviewTurn"""
          sub1(
              r"function getInteractionState\(\) \{.*?\n\}\n\ncontrols\.addEventListener\('start'.*?\n\}\);\n\ncontrols\.addEventListener\('end'.*?\n\}\);\n\nfunction beginReviewTurn",
              replacement,
              'interaction listeners',
              re.S)

          forbidden = ['manualResumeAt', 'sliceResumeAt', 'presentationResumeStart', 'presentationResumeFrom', 'Infinity;']
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'Candidate A obsolete interaction token remains: {token}')
          if s.count("controls.addEventListener('start'") != 1 or s.count("controls.addEventListener('end'") != 1:
              raise SystemExit('Candidate A must have one Orbit listener pair')
          p.write_text(s, encoding='utf-8')

          bp = Path('assets/js/proai-hero-cube-r1/bootstrap.js')
          lines = bp.read_text(encoding='utf-8').splitlines()
          kept = [line for line in lines if "'non-blocking autonomy']" not in line and "'Orbit start/end']" not in line]
          if len(lines) - len(kept) != 2:
              raise SystemExit('bootstrap interaction patch cleanup mismatch')
          bp.write_text('\n'.join(kept) + '\n', encoding='utf-8')

          rp = Path('docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html')
          r = rp.read_text(encoding='utf-8')
          r = r.replace('<title>ProAI Cube — Resend-like Spatial Motion R1</title>', '<title>ProAI Cube — R1.2 Candidate A · Interaction Fix</title>', 1)
          r = r.replace('<div id="review-label">ProAI Cube · Spatial Motion R1</div>', '<div id="review-label">ProAI Cube · R1.2 Candidate A · Interaction Fix</div>', 1)
          if 'Candidate A' not in r:
              raise SystemExit('Candidate A review label update failed')
          rp.write_text(r, encoding='utf-8')
          PY
          node --check assets/js/proai-hero-cube-r1/source-materials-r1.js
          node --check assets/js/proai-hero-cube-r1/bootstrap.js
          git diff --check
          git config user.name "ProAI Cube Motion QA"
          git config user.email "proai.expert2026@gmail.com"
          git add assets/js/proai-hero-cube-r1/source-materials-r1.js assets/js/proai-hero-cube-r1/bootstrap.js docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html
          git commit -m "Fix Cube live Orbit interaction R1.2 candidate A"
          echo "A_SHA=$(git rev-parse HEAD)" | tee /tmp/r12-a
          echo "A_BLOB=$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" | tee -a /tmp/r12-a

      - name: Build Candidate B
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/js/proai-hero-cube-r1/source-materials-r1.js')
          s = p.read_text(encoding='utf-8')

          pattern = r"// Retained only as immutable Hero freeze-sentinel data; not a runtime presentation authority\.\nconst PRESENTATION_SPATIAL_R1_1 = Object\.freeze\(\{.*?\n\}\);\n\nconst SLICE_R1_2"
          new = """// Runtime whole-object presentation authority — R1.2 premium editorial spatial motion.
          const PRESENTATION_SPATIAL_R1_2 = Object.freeze({
            cycleMs: 66000,
            motionAuthority: 'quaternion-editorial-spatial-r1.2-premium',
            keyframes: Object.freeze([
              Object.freeze({ timeMs: 0, poseDeg: Object.freeze([0, 0, 0]), motion: 'sweep', label: 'natural-3q' }),
              Object.freeze({ timeMs: 5600, poseDeg: Object.freeze([24, 58, -23]), motion: 'breath', label: 'top-side-3q' }),
              Object.freeze({ timeMs: 8200, poseDeg: Object.freeze([22, 64, -21]), motion: 'sweep', label: 'top-side-breath' }),
              Object.freeze({ timeMs: 13900, poseDeg: Object.freeze([-42, 38, -23]), motion: 'breath', label: 'lower-side-inspection' }),
              Object.freeze({ timeMs: 16400, poseDeg: Object.freeze([-40, 45, -21]), motion: 'sweep', label: 'lower-side-breath' }),
              Object.freeze({ timeMs: 22000, poseDeg: Object.freeze([9, 87, 6]), motion: 'breath', label: 'opposite-3q-a' }),
              Object.freeze({ timeMs: 24700, poseDeg: Object.freeze([7, 94, 8]), motion: 'sweep', label: 'opposite-3q-a-breath' }),
              Object.freeze({ timeMs: 30900, poseDeg: Object.freeze([-18, 178, -16]), motion: 'breath', label: 'deep-opposite-3q' }),
              Object.freeze({ timeMs: 33700, poseDeg: Object.freeze([-16, 184, -14]), motion: 'sweep', label: 'deep-opposite-breath' }),
              Object.freeze({ timeMs: 38600, poseDeg: Object.freeze([24, 138, 23]), motion: 'breath', label: 'high-opposite-return' }),
              Object.freeze({ timeMs: 41200, poseDeg: Object.freeze([22, 144, 21]), motion: 'sweep', label: 'high-opposite-breath' }),
              Object.freeze({ timeMs: 46900, poseDeg: Object.freeze([-27, 96, 31]), motion: 'breath', label: 'diagonal-return-inspection' }),
              Object.freeze({ timeMs: 49400, poseDeg: Object.freeze([-24, 102, 29]), motion: 'sweep', label: 'diagonal-return-breath' }),
              Object.freeze({ timeMs: 55500, poseDeg: Object.freeze([19, 42, -14]), motion: 'breath', label: 'front-side-3q' }),
              Object.freeze({ timeMs: 58100, poseDeg: Object.freeze([17, 48, -12]), motion: 'sweep', label: 'front-side-breath' }),
              Object.freeze({ timeMs: 66000, poseDeg: Object.freeze([0, 0, 0]), motion: 'sweep', label: 'natural-3q-loop' }),
            ]),
            easing: Object.freeze({ sweepLinearWeight: 0.14, breathLinearWeight: 0.72, sweepSettleBias: 0.075 }),
            targetBreathSpeedDegPerSec: Object.freeze([2, 6]),
          });

          const SLICE_R1_2"""
          s2, n = re.subn(pattern, new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Candidate B config replacement count={n}')
          s = s2.replace('PRESENTATION_SPATIAL_R1_1', 'PRESENTATION_SPATIAL_R1_2')

          ease_pattern = r"function presentationEditorialEase\(progress, phase\) \{.*?\n\}\n\nfunction presentationEditorialEaseDerivative\(progress, phase\) \{.*?\n\}"
          ease_new = """function presentationEditorialEase(progress, phase) {
            const p = THREE.MathUtils.clamp(progress, 0, 1);
            const linearWeight = phase === 'breath'
              ? PRESENTATION_SPATIAL_R1_2.easing.breathLinearWeight
              : PRESENTATION_SPATIAL_R1_2.easing.sweepLinearWeight;
            if (phase === 'breath') return THREE.MathUtils.lerp(smoothstep(p), p, linearWeight);
            const biased = THREE.MathUtils.clamp(
              p + PRESENTATION_SPATIAL_R1_2.easing.sweepSettleBias * Math.sin(Math.PI * p),
              0,
              1,
            );
            return THREE.MathUtils.lerp(smoothstep(biased), biased, linearWeight);
          }

          function presentationEditorialEaseDerivative(progress, phase) {
            const p = THREE.MathUtils.clamp(progress, 0, 1);
            const epsilon = 0.001;
            const lo = Math.max(0, p - epsilon);
            const hi = Math.min(1, p + epsilon);
            if (hi <= lo) return 0;
            return (presentationEditorialEase(hi, phase) - presentationEditorialEase(lo, phase)) / (hi - lo);
          }"""
          s2, n = re.subn(ease_pattern, ease_new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Candidate B easing replacement count={n}')
          s = s2

          alias = "window.__PROAI_CUBE_SPATIAL_R1_1 = api;"
          if s.count(alias) != 1:
              raise SystemExit('Candidate B compatibility alias missing')
          s = s.replace(alias, alias + "\nwindow.__PROAI_CUBE_SPATIAL_R1_2 = api;", 1)

          if 'manualResumeAt' in s or 'sliceResumeAt' in s or 'presentationResumeStart' in s or 'presentationResumeFrom' in s:
              raise SystemExit('Candidate B reintroduced pause ownership')
          if s.count("controls.addEventListener('start'") != 1 or s.count("controls.addEventListener('end'") != 1:
              raise SystemExit('Candidate B duplicate Orbit authority')
          p.write_text(s, encoding='utf-8')

          rp = Path('docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html')
          r = rp.read_text(encoding='utf-8')
          r = r.replace('<title>ProAI Cube — R1.2 Candidate A · Interaction Fix</title>', '<title>ProAI Cube — R1.2 Candidate B · Premium Motion</title>', 1)
          r = r.replace('<div id="review-label">ProAI Cube · R1.2 Candidate A · Interaction Fix</div>', '<div id="review-label">ProAI Cube · R1.2 Candidate B · Premium Motion</div>', 1)
          if 'Candidate B' not in r:
              raise SystemExit('Candidate B review label update failed')
          rp.write_text(r, encoding='utf-8')
          PY
          node --check assets/js/proai-hero-cube-r1/source-materials-r1.js
          node --check assets/js/proai-hero-cube-r1/bootstrap.js
          git diff --check
          grep -q "quaternion-editorial-spatial-r1.2-premium" assets/js/proai-hero-cube-r1/source-materials-r1.js
          grep -q "diagonal-return-inspection" assets/js/proai-hero-cube-r1/source-materials-r1.js
          git add assets/js/proai-hero-cube-r1/source-materials-r1.js docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html
          git commit -m "Polish Cube premium spatial motion R1.2 candidate B"
          echo "B_SHA=$(git rev-parse HEAD)" | tee /tmp/r12-b
          echo "B_BLOB=$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" | tee -a /tmp/r12-b

      - name: Push A/B chain
        run: |
          set -euo pipefail
          cat /tmp/r12-a
          cat /tmp/r12-b
          git log --oneline -3
          git push origin HEAD:agent/proai-cube-resend-spatial-motion-r1
