name: Temporary ProAI Cube R1.2 A/B builder

on:
  pull_request:
    branches:
      - agent/tmp-proai-cube-r12-builder-base

permissions:
  contents: write

jobs:
  build-candidates:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r12-builder-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/proai-cube-resend-spatial-motion-r1
          fetch-depth: 0

      - name: Verify exact R1.1 start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5e1ac4fbcbad31d263e5fd95e6fbbb3f95ed226a"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "d04ee7a356e4e3297d62693e5c20222f00e68eef"

      - name: Build Candidate A interaction-live fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('assets/js/proai-hero-cube-r1/source-materials-r1.js')
          source = source_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          source = replace_once(source,
          """let interactionActive = false;
          let manualResumeAt = 0;
          let sliceResumeAt = 0;
          let presentationResumeStart = 0;
          let presentationResumeFrom = new THREE.Quaternion();
          let frozenPresentationQuaternion = new THREE.Quaternion();""",
          """let interactionActive = false;
          let frozenPresentationQuaternion = new THREE.Quaternion();""",
          'interaction state ownership')

          source = replace_once(source,
          """function presentationAutonomyBlocked() {
            return interactionActive || performance.now() < manualResumeAt;
          }

          function sliceAutonomyBlocked() {
            return interactionActive || performance.now() < sliceResumeAt;
          }""",
          """function presentationAutonomyBlocked() {
            return false;
          }

          function sliceAutonomyBlocked() {
            return false;
          }""",
          'autonomy ownership')

          source = replace_once(source,
          """  if (presentationAutonomyBlocked()) {
            presentationFrameDeltaRad = 0;
            lastPresentationQuaternion.copy(presentationRig.quaternion);
            return;
          }

          """,
          "",
          'presentation interaction block')

          source = replace_once(source,
          """  if (presentationResumeStart > 0 && now < presentationResumeStart + MOTION.manualResumeBlendMs) {
            const progress = smoothstep((now - presentationResumeStart) / MOTION.manualResumeBlendMs);
            presentationRig.quaternion.slerpQuaternions(presentationResumeFrom, presentationTargetQuaternion, progress).normalize();
          } else {
            presentationRig.quaternion.copy(presentationTargetQuaternion);
            if (presentationResumeStart > 0) presentationResumeStart = 0;
          }""",
          """  presentationRig.quaternion.copy(presentationTargetQuaternion);""",
          'presentation resume authority')

          source = replace_once(source,
          """function getInteractionState() {
            const now = performance.now();
            return {
              interactionActive,
              autonomyBlocked: presentationAutonomyBlocked(),
              sliceAutonomyBlocked: sliceAutonomyBlocked(),
              resumeDelayRemainingMs: Math.max(0, manualResumeAt - now),
              sliceResumeDelayRemainingMs: Math.max(0, sliceResumeAt - now),
              presentationResumeActive: presentationResumeStart > 0 && now >= presentationResumeStart && now < presentationResumeStart + MOTION.manualResumeBlendMs,
              cameraPosition: camera.position.toArray(),
              presentationQuaternion: presentationRig.quaternion.toArray(),
            };
          }

          controls.addEventListener('start', () => {
            interactionActive = true;
            frozenPresentationQuaternion.copy(presentationRig.quaternion);
            presentationResumeFrom.copy(presentationRig.quaternion);
            manualResumeAt = Infinity;
            sliceResumeAt = Infinity;
            presentationResumeStart = 0;
          });

          controls.addEventListener('end', () => {
            interactionActive = false;
            const now = performance.now();
            manualResumeAt = now + MOTION.manualResumeDelayMs;
            sliceResumeAt = manualResumeAt + MOTION.sliceResumeStaggerMs;
            presentationResumeStart = manualResumeAt;
            presentationResumeFrom.copy(presentationRig.quaternion);
          });""",
          """function getInteractionState() {
            return {
              interactionActive,
              autonomyBlocked: false,
              sliceAutonomyBlocked: false,
              resumeDelayRemainingMs: 0,
              sliceResumeDelayRemainingMs: 0,
              presentationResumeActive: false,
              presentationSimTimeMs,
              sliceEventSerial,
              activeTurnCount: activeTurns.size,
              activeTurnProgress: activeTurnList().map((turn) => ({ id: turn.id, linear: turn.linear, eased: turn.eased })),
              cameraPosition: camera.position.toArray(),
              presentationQuaternion: presentationRig.quaternion.toArray(),
            };
          }

          controls.addEventListener('start', () => {
            interactionActive = true;
            frozenPresentationQuaternion.copy(presentationRig.quaternion);
          });

          controls.addEventListener('end', () => {
            interactionActive = false;
          });""",
          'Orbit live interaction listeners')

          if 'manualResumeAt' in source or 'sliceResumeAt' in source or 'presentationResumeStart' in source or 'presentationResumeFrom' in source:
              raise SystemExit('obsolete interaction resume authority remains in Candidate A source')
          if source.count("controls.addEventListener('start'") != 1 or source.count("controls.addEventListener('end'") != 1:
              raise SystemExit('Candidate A must have exactly one Orbit start/end authority')

          source_path.write_text(source, encoding='utf-8')

          bootstrap_path = Path('assets/js/proai-hero-cube-r1/bootstrap.js')
          bootstrap_lines = bootstrap_path.read_text(encoding='utf-8').splitlines()
          filtered = [line for line in bootstrap_lines if "'non-blocking autonomy']" not in line and "'Orbit start/end']" not in line]
          if len(bootstrap_lines) - len(filtered) != 2:
              raise SystemExit('expected to remove exactly two obsolete Hero interaction adaptation patches')
          bootstrap_path.write_text('\n'.join(filtered) + '\n', encoding='utf-8')

          review_path = Path('docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html')
          review = review_path.read_text(encoding='utf-8')
          review = replace_once(review, '<title>ProAI Cube — Resend-like Spatial Motion R1</title>', '<title>ProAI Cube — R1.2 Candidate A · Interaction Fix</title>', 'Candidate A title')
          review = replace_once(review, '<div id="review-label">ProAI Cube · Spatial Motion R1</div>', '<div id="review-label">ProAI Cube · R1.2 Candidate A · Interaction Fix</div>', 'Candidate A label')
          review_path.write_text(review, encoding='utf-8')
          PY

          node --check assets/js/proai-hero-cube-r1/source-materials-r1.js
          node --check assets/js/proai-hero-cube-r1/bootstrap.js
          git diff --check
          git diff -- assets/js/proai-hero-cube-r1/source-materials-r1.js | grep -q 'return false;'
          git diff -- assets/js/proai-hero-cube-r1/source-materials-r1.js | grep -q 'presentationSimTimeMs'

          git config user.name "ProAI Cube Motion QA"
          git config user.email "proai.expert2026@gmail.com"
          git add assets/js/proai-hero-cube-r1/source-materials-r1.js assets/js/proai-hero-cube-r1/bootstrap.js docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html
          git commit -m "Fix Cube live Orbit interaction R1.2 candidate A"
          echo "CANDIDATE_A_SHA=$(git rev-parse HEAD)" | tee /tmp/candidate-a.txt
          echo "CANDIDATE_A_BLOB=$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" | tee -a /tmp/candidate-a.txt

      - name: Build Candidate B premium motion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('assets/js/proai-hero-cube-r1/source-materials-r1.js')
          source = source_path.read_text(encoding='utf-8')

          old_block_match = re.search(r"// Retained only as immutable Hero freeze-sentinel data; not a runtime presentation authority\.\nconst PRESENTATION_SPATIAL_R1_1 = Object\.freeze\(\{.*?\n\}\);\n\nconst SLICE_R1_2", source, flags=re.S)
          if not old_block_match:
              raise SystemExit('R1.1 presentation config block not found')

          new_block = """// Runtime whole-object presentation authority — R1.2 premium editorial spatial motion.
          const PRESENTATION_SPATIAL_R1_2 = Object.freeze({
            cycleMs: 66000,
            motionAuthority: 'quaternion-editorial-spatial-r1.2-premium',
            keyframes: Object.freeze([
              Object.freeze({ timeMs: 0, poseDeg: Object.freeze([0, 0, 0]), motion: 'sweep', label: 'natural-3q' }),
              Object.freeze({ timeMs: 5600, poseDeg: Object.freeze([24, 58, -23]), motion: 'breath', label: 'top-side-3q' }),
              Object.freeze({ timeMs: 8200, poseDeg: Object.freeze([22, 64, -21]), motion: 'sweep', label: 'top-side-breath' }),
              Object.freeze({ timeMs: 13900, poseDeg: Object.freeze([-42, 38, -23]), motion: 'breath', label: 'lower-side-inspection' }),
              Object.freeze({ timeMs: 16400, poseDeg: Object.freeze([-40, 45, -21]), motion: 'sweep', label: 'lower-side-breath' }),
              Object.freeze({ timeMs: 22000, poseDeg: Object.freeze([9, 87, 6]), motion: 'breath', label: 'opposite-3q-a' }),
              Object.freeze({ timeMs: 24700, poseDeg: Object.freeze([7, 94, 8]), motion: 'sweep', label: 'opposite-3q-a-breath' }),
              Object.freeze({ timeMs: 30900, poseDeg: Object.freeze([-18, 178, -16]), motion: 'breath', label: 'deep-opposite-3q' }),
              Object.freeze({ timeMs: 33700, poseDeg: Object.freeze([-16, 184, -14]), motion: 'sweep', label: 'deep-opposite-breath' }),
              Object.freeze({ timeMs: 38600, poseDeg: Object.freeze([24, 138, 23]), motion: 'breath', label: 'high-opposite-return' }),
              Object.freeze({ timeMs: 41200, poseDeg: Object.freeze([22, 144, 21]), motion: 'sweep', label: 'high-opposite-breath' }),
              Object.freeze({ timeMs: 46900, poseDeg: Object.freeze([-27, 96, 31]), motion: 'breath', label: 'diagonal-return-inspection' }),
              Object.freeze({ timeMs: 49400, poseDeg: Object.freeze([-24, 102, 29]), motion: 'sweep', label: 'diagonal-return-breath' }),
              Object.freeze({ timeMs: 55500, poseDeg: Object.freeze([19, 42, -14]), motion: 'breath', label: 'front-side-3q' }),
              Object.freeze({ timeMs: 58100, poseDeg: Object.freeze([17, 48, -12]), motion: 'sweep', label: 'front-side-breath' }),
              Object.freeze({ timeMs: 66000, poseDeg: Object.freeze([0, 0, 0]), motion: 'sweep', label: 'natural-3q-loop' }),
            ]),
            easing: Object.freeze({ sweepLinearWeight: 0.14, breathLinearWeight: 0.72, sweepSettleBias: 0.075 }),
            targetBreathSpeedDegPerSec: Object.freeze([2, 6]),
          });

          const SLICE_R1_2"""

          source = source[:old_block_match.start()] + new_block + source[old_block_match.end():]
          source = source.replace('PRESENTATION_SPATIAL_R1_1', 'PRESENTATION_SPATIAL_R1_2')

          old_ease = """function presentationEditorialEase(progress, phase) {
            const p = THREE.MathUtils.clamp(progress, 0, 1);
            const linearWeight = phase === 'breath'
              ? PRESENTATION_SPATIAL_R1_2.easing.breathLinearWeight
              : PRESENTATION_SPATIAL_R1_2.easing.sweepLinearWeight;
            return THREE.MathUtils.lerp(smoothstep(p), p, linearWeight);
          }

          function presentationEditorialEaseDerivative(progress, phase) {
            const p = THREE.MathUtils.clamp(progress, 0, 1);
            const linearWeight = phase === 'breath'
              ? PRESENTATION_SPATIAL_R1_2.easing.breathLinearWeight
              : PRESENTATION_SPATIAL_R1_2.easing.sweepLinearWeight;
            const smoothDerivative = 6 * p * (1 - p);
            return linearWeight + (1 - linearWeight) * smoothDerivative;
          }"""

          new_ease = """function presentationEditorialEase(progress, phase) {
            const p = THREE.MathUtils.clamp(progress, 0, 1);
            const linearWeight = phase === 'breath'
              ? PRESENTATION_SPATIAL_R1_2.easing.breathLinearWeight
              : PRESENTATION_SPATIAL_R1_2.easing.sweepLinearWeight;
            if (phase === 'breath') return THREE.MathUtils.lerp(smoothstep(p), p, linearWeight);
            const biased = THREE.MathUtils.clamp(
              p + PRESENTATION_SPATIAL_R1_2.easing.sweepSettleBias * Math.sin(Math.PI * p),
              0,
              1,
            );
            return THREE.MathUtils.lerp(smoothstep(biased), biased, linearWeight);
          }

          function presentationEditorialEaseDerivative(progress, phase) {
            const p = THREE.MathUtils.clamp(progress, 0, 1);
            const epsilon = 0.001;
            const lo = Math.max(0, p - epsilon);
            const hi = Math.min(1, p + epsilon);
            if (hi <= lo) return 0;
            return (presentationEditorialEase(hi, phase) - presentationEditorialEase(lo, phase)) / (hi - lo);
          }"""

          if source.count(old_ease) != 1:
              raise SystemExit(f'premium easing block match count={source.count(old_ease)}')
          source = source.replace(old_ease, new_ease, 1)

          alias = "window.__PROAI_CUBE_SPATIAL_R1_1 = api;"
          if source.count(alias) != 1:
              raise SystemExit('R1.1 compatibility alias not found exactly once')
          source = source.replace(alias, alias + "\nwindow.__PROAI_CUBE_SPATIAL_R1_2 = api;", 1)

          if 'PRESENTATION_SPATIAL_R1_1' in source:
              raise SystemExit('stale R1.1 presentation authority remains in Candidate B')
          if source.count("controls.addEventListener('start'") != 1 or source.count("controls.addEventListener('end'") != 1:
              raise SystemExit('Candidate B interaction authority duplication')
          if 'manualResumeAt' in source or 'sliceResumeAt' in source:
              raise SystemExit('Candidate B reintroduced interaction blocking')

          source_path.write_text(source, encoding='utf-8')

          review_path = Path('docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html')
          review = review_path.read_text(encoding='utf-8')
          review = review.replace('<title>ProAI Cube — R1.2 Candidate A · Interaction Fix</title>', '<title>ProAI Cube — R1.2 Candidate B · Premium Motion</title>', 1)
          review = review.replace('<div id="review-label">ProAI Cube · R1.2 Candidate A · Interaction Fix</div>', '<div id="review-label">ProAI Cube · R1.2 Candidate B · Premium Motion</div>', 1)
          review_path.write_text(review, encoding='utf-8')
          PY

          node --check assets/js/proai-hero-cube-r1/source-materials-r1.js
          node --check assets/js/proai-hero-cube-r1/bootstrap.js
          git diff --check
          grep -q "quaternion-editorial-spatial-r1.2-premium" assets/js/proai-hero-cube-r1/source-materials-r1.js
          grep -q "diagonal-return-inspection" assets/js/proai-hero-cube-r1/source-materials-r1.js
          grep -q "sweepSettleBias: 0.075" assets/js/proai-hero-cube-r1/source-materials-r1.js

          git add assets/js/proai-hero-cube-r1/source-materials-r1.js docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html
          git commit -m "Polish Cube premium spatial motion R1.2 candidate B"
          echo "CANDIDATE_B_SHA=$(git rev-parse HEAD)" | tee /tmp/candidate-b.txt
          echo "CANDIDATE_B_BLOB=$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" | tee -a /tmp/candidate-b.txt

      - name: Push exact A/B chain
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/candidate-a.txt
          cat /tmp/candidate-b.txt
          git log --oneline -3
          git push origin HEAD:agent/proai-cube-resend-spatial-motion-r1
