name: Temporary ProAI Cube R1.4 final live QA
on:
  pull_request:
    branches: [agent/tmp-proai-cube-r12-qa-base]
permissions: {contents: read}

jobs:
  desktop-observe-75s:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r14-qa-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'cffbdaac3627efff272570b15f264c3e8c3e0706', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Exact candidate gate
        run: |
          test "$(git rev-parse HEAD)" = "cffbdaac3627efff272570b15f264c3e8c3e0706"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "f9298b0b00feaae4123eb5a7161f24f669ae0eca"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-continuous-flow-r1-3.js)" = "14b2d657d5d07369fd708b37135216b76c722db4"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-confidence-flow-r1-4.js)" = "535982f6c3efa5a4166e928d41db230eb3ea57c9"
      - name: Start desktop Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8121 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          xvfb-run -a -s '-screen 0 1440x900x24' "$CHROME" --no-sandbox --disable-dev-shm-usage --window-size=1440,900 --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9261 --remote-allow-origins='*' --user-data-dir=/tmp/r14-observe-desktop about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 160); do curl -fsS http://127.0.0.1:9261/json/version >/tmp/version.json 2>/dev/null && break || true; sleep .2; done
          test -s /tmp/version.json
          for i in $(seq 1 80); do curl -fsS -X PUT 'http://127.0.0.1:9261/json/new?about:blank' >/tmp/page.json 2>/dev/null && grep -q webSocketDebuggerUrl /tmp/page.json && break || true; sleep .2; done
          grep -q webSocketDebuggerUrl /tmp/page.json
      - name: Observe live desktop for 75 seconds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r14-desktop-observe
          timeout 115s python3 - <<'PY'
          import json,time
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          OUT=Path('qa-r14-desktop-observe');page=json.load(open('/tmp/page.json'));ws=create_connection(page['webSocketDebuggerUrl'],timeout=15,origin='http://localhost');seq=0
          def call(method,params=None,timeout=30):
              global seq;seq+=1;i=seq;ws.send(json.dumps({'id':i,'method':method,'params':params or {}}));end=time.monotonic()+timeout
              while time.monotonic()<end:
                  try:ws.settimeout(max(.2,end-time.monotonic()));x=json.loads(ws.recv())
                  except WebSocketTimeoutException:continue
                  if x.get('id')==i:
                      if 'error'in x:raise RuntimeError((method,x['error']))
                      return x.get('result',{})
              raise TimeoutError(method)
          def ev(expr,timeout=30):return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'userGesture':True},timeout).get('result',{}).get('value')
          def js(expr,timeout=30):return json.loads(ev('JSON.stringify('+expr+')',timeout))
          def ready():
              end=time.monotonic()+40
              while time.monotonic()<end:
                  try:
                      if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',8):return
                  except Exception:pass
                  time.sleep(.1)
              raise RuntimeError('ready timeout')
          def diag():return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,x=a.getDiagnostics(),i=a.getInteractionState();return{i,p:x.presentation,s:x.scheduler,lastSerial:x.lastTurnResult?.serial||0,state:a.motionState}})()")
          call('Page.enable');call('Runtime.enable');call('Emulation.setDeviceMetricsOverride',{'width':1440,'height':900,'deviceScaleFactor':1,'mobile':False})
          call('Page.navigate',{'url':'http://127.0.0.1:8121/docs/site-evolution/spline/proai-cube-spatial-confidence-r1-4/review.html'});ready();d0=diag();assert d0['p']['engine']=='quaternion-confidence-flow-r1.4'
          start=time.monotonic();marks=[25,50];samples=[{'wallSec':0,'diag':d0}]
          for mark in marks:
              while time.monotonic()-start<mark:time.sleep(.2)
              samples.append({'wallSec':mark,'diag':diag()})
          while time.monotonic()-start<75:time.sleep(.2)
          d75=diag();samples.append({'wallSec':75,'diag':d75})
          report={'samples':samples,'presentationSimDeltaMs':d75['i']['presentationSimTimeMs']-d0['i']['presentationSimTimeMs'],'sliceEventDelta':d75['i']['sliceEventSerial']-d0['i']['sliceEventSerial'],'turnSerialDelta':d75['lastSerial']-d0['lastSerial']}
          (OUT/'report.json').write_text(json.dumps(report,indent=2))
          assert d75['s']['running'] and report['presentationSimDeltaMs']>0 and report['sliceEventDelta']>0 and report['turnSerialDelta']>0
          print('R14_DESKTOP_75S_PASS',json.dumps(report),flush=True);ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: proai-cube-r14-desktop-observe-final, path: qa-r14-desktop-observe/, if-no-files-found: warn}

  mobile-observe-75s:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r14-qa-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'cffbdaac3627efff272570b15f264c3e8c3e0706', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Start mobile Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8122 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          xvfb-run -a -s '-screen 0 390x844x24' "$CHROME" --no-sandbox --disable-dev-shm-usage --window-size=390,844 --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9262 --remote-allow-origins='*' --user-data-dir=/tmp/r14-observe-mobile about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 160); do curl -fsS http://127.0.0.1:9262/json/version >/tmp/version.json 2>/dev/null && break || true; sleep .2; done
          test -s /tmp/version.json
          for i in $(seq 1 80); do curl -fsS -X PUT 'http://127.0.0.1:9262/json/new?about:blank' >/tmp/page.json 2>/dev/null && grep -q webSocketDebuggerUrl /tmp/page.json && break || true; sleep .2; done
          grep -q webSocketDebuggerUrl /tmp/page.json
      - name: Observe live mobile for 75 seconds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r14-mobile-observe
          timeout 115s python3 - <<'PY'
          import json,time
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          OUT=Path('qa-r14-mobile-observe');page=json.load(open('/tmp/page.json'));ws=create_connection(page['webSocketDebuggerUrl'],timeout=15,origin='http://localhost');seq=0
          def call(method,params=None,timeout=30):
              global seq;seq+=1;i=seq;ws.send(json.dumps({'id':i,'method':method,'params':params or {}}));end=time.monotonic()+timeout
              while time.monotonic()<end:
                  try:ws.settimeout(max(.2,end-time.monotonic()));x=json.loads(ws.recv())
                  except WebSocketTimeoutException:continue
                  if x.get('id')==i:
                      if 'error'in x:raise RuntimeError((method,x['error']))
                      return x.get('result',{})
              raise TimeoutError(method)
          def ev(expr,timeout=30):return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'userGesture':True},timeout).get('result',{}).get('value')
          def js(expr,timeout=30):return json.loads(ev('JSON.stringify('+expr+')',timeout))
          def ready():
              end=time.monotonic()+40
              while time.monotonic()<end:
                  try:
                      if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',8):return
                  except Exception:pass
                  time.sleep(.1)
              raise RuntimeError('ready timeout')
          def diag():return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,x=a.getDiagnostics(),i=a.getInteractionState();return{i,p:x.presentation,s:x.scheduler,lastSerial:x.lastTurnResult?.serial||0}})()")
          call('Page.enable');call('Runtime.enable');call('Emulation.setDeviceMetricsOverride',{'width':390,'height':844,'deviceScaleFactor':1,'mobile':True})
          call('Page.navigate',{'url':'http://127.0.0.1:8122/docs/site-evolution/spline/proai-cube-spatial-confidence-r1-4/review.html'});ready();d0=diag();assert d0['p']['engine']=='quaternion-confidence-flow-r1.4'
          start=time.monotonic();samples=[{'wallSec':0,'diag':d0}]
          for mark in [25,50]:
              while time.monotonic()-start<mark:time.sleep(.2)
              samples.append({'wallSec':mark,'diag':diag()})
          while time.monotonic()-start<75:time.sleep(.2)
          d75=diag();samples.append({'wallSec':75,'diag':d75})
          report={'samples':samples,'presentationSimDeltaMs':d75['i']['presentationSimTimeMs']-d0['i']['presentationSimTimeMs'],'sliceEventDelta':d75['i']['sliceEventSerial']-d0['i']['sliceEventSerial'],'turnSerialDelta':d75['lastSerial']-d0['lastSerial']}
          (OUT/'report.json').write_text(json.dumps(report,indent=2))
          assert d75['s']['running'] and report['presentationSimDeltaMs']>0 and report['sliceEventDelta']>0 and report['turnSerialDelta']>0
          print('R14_MOBILE_75S_PASS',json.dumps(report),flush=True);ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: proai-cube-r14-mobile-observe-final, path: qa-r14-mobile-observe/, if-no-files-found: warn}

  held-orbit-repeat:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r14-qa-trigger'
    strategy:
      fail-fast: false
      matrix: {repeat: [1, 2, 3]}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 'cffbdaac3627efff272570b15f264c3e8c3e0706', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Start interaction Chrome
        shell: bash
        run: |
          set -euo pipefail
          PORT=$((8130 + ${{ matrix.repeat }})); DEBUG=$((9270 + ${{ matrix.repeat }})); echo "$PORT" >/tmp/http-port; echo "$DEBUG" >/tmp/debug-port
          python3 -m http.server "$PORT" --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          xvfb-run -a -s '-screen 0 1440x900x24' "$CHROME" --no-sandbox --disable-dev-shm-usage --window-size=1440,900 --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port="$DEBUG" --remote-allow-origins='*' --user-data-dir="/tmp/r14-interaction-${{ matrix.repeat }}" about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 160); do curl -fsS "http://127.0.0.1:$DEBUG/json/version" >/tmp/version.json 2>/dev/null && break || true; sleep .2; done
          test -s /tmp/version.json
          for i in $(seq 1 80); do curl -fsS -X PUT "http://127.0.0.1:$DEBUG/json/new?about:blank" >/tmp/page.json 2>/dev/null && grep -q webSocketDebuggerUrl /tmp/page.json && break || true; sleep .2; done
          grep -q webSocketDebuggerUrl /tmp/page.json
      - name: Hold Orbit for 12 seconds and release
        shell: bash
        env: {REPEAT: '${{ matrix.repeat }}'}
        run: |
          set -euo pipefail
          mkdir -p "qa-r14-interaction-$REPEAT"
          timeout 75s python3 - <<'PY'
          import json,math,os,time
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          rep=int(os.environ['REPEAT']);OUT=Path(f'qa-r14-interaction-{rep}');page=json.load(open('/tmp/page.json'));ws=create_connection(page['webSocketDebuggerUrl'],timeout=15,origin='http://localhost');seq=0;port=int(Path('/tmp/http-port').read_text())
          def call(method,params=None,timeout=30):
              global seq;seq+=1;i=seq;ws.send(json.dumps({'id':i,'method':method,'params':params or {}}));end=time.monotonic()+timeout
              while time.monotonic()<end:
                  try:ws.settimeout(max(.2,end-time.monotonic()));x=json.loads(ws.recv())
                  except WebSocketTimeoutException:continue
                  if x.get('id')==i:
                      if 'error'in x:raise RuntimeError((method,x['error']))
                      return x.get('result',{})
              raise TimeoutError(method)
          def ev(expr,timeout=30):return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'userGesture':True},timeout).get('result',{}).get('value')
          def js(expr,timeout=30):return json.loads(ev('JSON.stringify('+expr+')',timeout))
          def ready():
              end=time.monotonic()+40
              while time.monotonic()<end:
                  try:
                      if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',8):return
                  except Exception:pass
                  time.sleep(.1)
              raise RuntimeError('ready timeout')
          def diag():return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,x=a.getDiagnostics(),i=a.getInteractionState();return{i,p:x.presentation,s:x.scheduler,lastSerial:x.lastTurnResult?.serial||0}})()")
          def dist(a,b):return math.sqrt(sum((x-y)**2 for x,y in zip(a,b)))
          def qang(a,b):
              d=min(1,max(-1,abs(sum(x*y for x,y in zip(a,b)))));return 2*math.acos(d)
          def mouse(kind,x,y,buttons=0):call('Input.dispatchMouseEvent',{'type':kind,'x':x,'y':y,'button':'left' if kind!='mouseMoved' else 'none','buttons':buttons,'clickCount':1},12)
          call('Page.enable');call('Runtime.enable');call('Emulation.setDeviceMetricsOverride',{'width':1440,'height':900,'deviceScaleFactor':1,'mobile':False})
          call('Page.navigate',{'url':f'http://127.0.0.1:{port}/docs/site-evolution/spline/proai-cube-spatial-confidence-r1-4/review.html'});ready();b=diag();assert b['p']['engine']=='quaternion-confidence-flow-r1.4'
          rect=js("document.getElementById('cube-canvas').getBoundingClientRect().toJSON()");cx=rect['x']+rect['width']/2;cy=rect['y']+rect['height']/2
          mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1);st=time.monotonic();k=0
          while time.monotonic()-st<12:
              call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+(64 if k%2==0 else -48)+(k%5)*3,'y':cy+(22 if k%3==0 else -16),'button':'left','buttons':1},12);k+=1;time.sleep(.25)
          h=diag();held={'simDeltaMs':h['i']['presentationSimTimeMs']-b['i']['presentationSimTimeMs'],'sliceEventDelta':h['i']['sliceEventSerial']-b['i']['sliceEventSerial'],'turnSerialDelta':h['lastSerial']-b['lastSerial'],'cameraDelta':dist(b['i']['cameraPosition'],h['i']['cameraPosition']),'presentationQuatDeltaRad':qang(b['i']['presentationQuaternion'],h['i']['presentationQuaternion'])}
          assert h['i']['interactionActive'] and not h['i']['sliceAutonomyBlocked'] and h['s']['running'] and held['simDeltaMs']>0 and held['sliceEventDelta']>0 and held['turnSerialDelta']>0 and held['cameraDelta']>.02 and held['presentationQuatDeltaRad']>.002
          qpre=h['i']['presentationQuaternion'];spre=h['i']['presentationSimTimeMs'];mouse('mouseReleased',cx,cy,0);time.sleep(.25);rel=diag();release={'quatDeltaRad':qang(qpre,rel['i']['presentationQuaternion']),'simDeltaMs':rel['i']['presentationSimTimeMs']-spre,'interactionActive':rel['i']['interactionActive'],'sliceBlocked':rel['i']['sliceAutonomyBlocked']}
          assert not release['interactionActive'] and not release['sliceBlocked'] and release['quatDeltaRad']<.2 and 0<=release['simDeltaMs']<=500
          report={'repeat':rep,'held':held,'release':release};(OUT/'report.json').write_text(json.dumps(report,indent=2));print('R14_HELD_ORBIT_PASS',json.dumps(report),flush=True);ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'proai-cube-r14-held-orbit-${{ matrix.repeat }}', path: 'qa-r14-interaction-${{ matrix.repeat }}/', if-no-files-found: warn}
