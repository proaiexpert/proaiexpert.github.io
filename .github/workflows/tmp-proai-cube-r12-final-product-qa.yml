name: Temporary ProAI Cube R1.3 continuous-flow QA
on:
  pull_request:
    branches: [agent/tmp-proai-cube-r12-qa-base]
permissions: {contents: read}

jobs:
  trajectory-interaction:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r13-qa-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '2eaec83dbac4645befca792f4f80a66cef4ad7fd', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Exact-source gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2eaec83dbac4645befca792f4f80a66cef4ad7fd"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-materials-r1.js)" = "f9298b0b00feaae4123eb5a7161f24f669ae0eca"
          test "$(git hash-object assets/js/proai-hero-cube-r1/source-continuous-flow-r1-3.js)" = "14b2d657d5d07369fd708b37135216b76c722db4"
          cp assets/js/proai-hero-cube-r1/source-continuous-flow-r1-3.js /tmp/r13.mjs
          node --check /tmp/r13.mjs
      - name: Start headed Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8098 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          xvfb-run -a -s '-screen 0 960x600x24' "$CHROME" --no-sandbox --disable-dev-shm-usage --window-size=960,600 --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9238 --remote-allow-origins='*' --user-data-dir=/tmp/xvfb-r13 about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:9238/json/version >/tmp/version.json 2>/dev/null && break || true; sleep .2; done
          test -s /tmp/version.json
          for i in $(seq 1 50); do curl -fsS -X PUT 'http://127.0.0.1:9238/json/new?about:blank' >/tmp/page.json 2>/dev/null && grep -q webSocketDebuggerUrl /tmp/page.json && break || true; sleep .2; done
          grep -q webSocketDebuggerUrl /tmp/page.json
      - name: 0-75s trajectory, seam and held Orbit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r13-trajectory
          timeout 135s python3 - <<'PY'
          import json,math,time
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          OUT=Path('qa-r13-trajectory'); page=json.load(open('/tmp/page.json')); ws=create_connection(page['webSocketDebuggerUrl'],timeout=15,origin='http://localhost'); seq=0
          def call(method,params=None,timeout=25):
              global seq
              seq+=1; i=seq; ws.send(json.dumps({'id':i,'method':method,'params':params or {}})); end=time.monotonic()+timeout
              while time.monotonic()<end:
                  try: ws.settimeout(max(.2,end-time.monotonic())); x=json.loads(ws.recv())
                  except WebSocketTimeoutException: continue
                  if x.get('id')==i:
                      if 'error' in x: raise RuntimeError((method,x['error']))
                      return x.get('result',{})
              raise TimeoutError(method)
          def ev(expr,timeout=25):
              r=call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'userGesture':True},timeout)
              if 'exceptionDetails' in r: raise RuntimeError(r['exceptionDetails'])
              return r.get('result',{}).get('value')
          def js(expr,timeout=25): return json.loads(ev('JSON.stringify('+expr+')',timeout))
          def ready():
              end=time.monotonic()+35
              while time.monotonic()<end:
                  try:
                      if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',8): return
                  except Exception: pass
                  time.sleep(.1)
              raise RuntimeError('ready timeout')
          def diag(): return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,x=a.getDiagnostics(),i=a.getInteractionState();return{i,p:x.presentation,s:x.scheduler,last:x.lastTurnResults.length,cfg:a.presentationConfig,slice:a.sliceConfig,state:a.motionState}})()")
          def qang(a,b):
              dot=min(1,max(-1,abs(sum(x*y for x,y in zip(a,b))))); return 2*math.acos(dot)
          def dist(a,b): return math.sqrt(sum((x-y)**2 for x,y in zip(a,b)))
          def mouse(kind,x,y,buttons=0): call('Input.dispatchMouseEvent',{'type':kind,'x':x,'y':y,'button':'left' if kind!='mouseMoved' else 'none','buttons':buttons,'clickCount':1},10)
          call('Page.enable'); call('Runtime.enable'); call('Log.enable'); call('Emulation.setDeviceMetricsOverride',{'width':960,'height':600,'deviceScaleFactor':1,'mobile':False})
          base='http://127.0.0.1:8098/docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html'
          call('Page.navigate',{'url':base+'?capture'}); ready(); boot=diag()
          assert boot['p']['engine']=='quaternion-continuous-flow-r1.3' and boot['cfg']['cycleMs']==66000
          assert boot['slice']['seed']==0x51a7c0de and boot['slice']['eventPattern']==['single','pair','single','single','phrase','single','pair','single','single','phrase']
          metrics=js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW;let min=Infinity,max=-Infinity,sum=0,n=0,dom=new Set();for(let i=0;i<=6600;i++){const s=a.getReviewPresentationSample(i/100);min=Math.min(min,s.velocityDegPerSec);max=Math.max(max,s.velocityDegPerSec);sum+=s.velocityDegPerSec;n++;dom.add(s.dominantAxis)}let first=null;for(let i=2200;i<=3000;i++){const s=a.getReviewPresentationSample(i/100);if(s.angularTravelDeg>=360){first=i/100;break}}return{min,avg:sum/n,max,dominantAxes:[...dom].sort(),travel20:a.getReviewPresentationSample(20).angularTravelDeg,travel25:a.getReviewPresentationSample(25).angularTravelDeg,travel30:a.getReviewPresentationSample(30).angularTravelDeg,first360:first,axisSamples:[0,6,12,18,24,30,36,42,48,54,60,66,72,75].map(t=>a.getReviewPresentationSample(t))}})()",40)
          assert metrics['min']>=8 and 13<=metrics['avg']<=17 and metrics['max']<=25 and 22<=metrics['first360']<=30 and set(metrics['dominantAxes'])=={'X','Y','Z'}
          seam=js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW;const get=t=>{const r=a.setReviewPresentation(t,1,false);return{sample:a.getReviewPresentationSample(t),q:r.quaternion}};return{pre:get(65.999),zero:get(66),post:get(66.001)}})()",25)
          seam['orientationDeltaDeg']=math.degrees(qang(seam['pre']['q'],seam['post']['q'])); seam['speedDelta']=abs(seam['pre']['sample']['velocityDegPerSec']-seam['post']['sample']['velocityDegPerSec']); assert seam['orientationDeltaDeg']<0.1 and seam['speedDelta']<0.05
          # Normal mode: live autonomous presentation + slices while Orbit is physically held.
          call('Page.navigate',{'url':base}); ready(); h0=diag(); rect=js("document.getElementById('cube-canvas').getBoundingClientRect().toJSON()"); cx=rect['x']+rect['width']/2; cy=rect['y']+rect['height']/2
          mouse('mouseMoved',cx,cy); mouse('mousePressed',cx,cy,1); start=time.monotonic(); k=0
          while time.monotonic()-start<10:
              call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+(50 if k%2==0 else -36)+(k%4)*4,'y':cy+(16 if k%3==0 else -12),'button':'left','buttons':1},10); k+=1; time.sleep(.25)
          h1=diag(); held={'simDelta':h1['i']['presentationSimTimeMs']-h0['i']['presentationSimTimeMs'],'eventDelta':h1['i']['sliceEventSerial']-h0['i']['sliceEventSerial'],'completedSliceDelta':h1['last']-h0['last'],'cameraDelta':dist(h0['i']['cameraPosition'],h1['i']['cameraPosition']),'quatDelta':qang(h0['i']['presentationQuaternion'],h1['i']['presentationQuaternion'])}
          assert h1['i']['interactionActive'] and h1['i']['sliceAutonomyBlocked'] is False and h1['s']['running'] and held['simDelta']>0 and held['eventDelta']>0 and held['completedSliceDelta']>0 and held['cameraDelta']>.02 and held['quatDelta']>.002
          qpre=h1['i']['presentationQuaternion']; mouse('mouseReleased',cx,cy,0); time.sleep(.25); rel=diag(); release={'quatDelta':qang(qpre,rel['i']['presentationQuaternion']),'active':rel['i']['interactionActive'],'blocked':rel['i']['sliceAutonomyBlocked']}; assert not release['active'] and not release['blocked'] and release['quatDelta']<.2
          report={'metrics':metrics,'seam':seam,'held10':held,'release':release}; (OUT/'report.json').write_text(json.dumps(report,indent=2)); print('R13_TRAJECTORY_QA_REPORT',json.dumps(report),flush=True); print('R13_TRAJECTORY_INTERACTION_PASS',flush=True); ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: proai-cube-r13-trajectory-qa, path: qa-r13-trajectory/, if-no-files-found: warn}

  visual-frame:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r13-qa-trigger'
    strategy:
      fail-fast: false
      matrix:
        time: [0, 48, 65, 66, 67, 75]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '2eaec83dbac4645befca792f4f80a66cef4ad7fd', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Start capture Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8100 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          xvfb-run -a -s '-screen 0 720x450x24' "$CHROME" --no-sandbox --disable-dev-shm-usage --window-size=720,450 --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9240 --remote-allow-origins='*' --user-data-dir=/tmp/xvfb-r13-${{ matrix.time }} about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:9240/json/version >/tmp/version.json 2>/dev/null && break || true; sleep .2; done
          test -s /tmp/version.json
          for i in $(seq 1 50); do curl -fsS -X PUT 'http://127.0.0.1:9240/json/new?about:blank' >/tmp/page.json 2>/dev/null && grep -q webSocketDebuggerUrl /tmp/page.json && break || true; sleep .2; done
          grep -q webSocketDebuggerUrl /tmp/page.json
      - name: Render exact review time
        shell: bash
        env: {REVIEW_TIME: '${{ matrix.time }}'}
        run: |
          set -euo pipefail
          mkdir -p qa-r13-visual
          timeout 120s python3 - <<'PY'
          import base64,json,os,time
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          t=float(os.environ['REVIEW_TIME']); out=Path('qa-r13-visual'); page=json.load(open('/tmp/page.json')); ws=create_connection(page['webSocketDebuggerUrl'],timeout=15,origin='http://localhost'); seq=0
          def call(method,params=None,timeout=70):
              global seq
              seq+=1; i=seq; ws.send(json.dumps({'id':i,'method':method,'params':params or {}})); end=time.monotonic()+timeout
              while time.monotonic()<end:
                  try: ws.settimeout(max(.2,end-time.monotonic())); x=json.loads(ws.recv())
                  except WebSocketTimeoutException: continue
                  if x.get('id')==i:
                      if 'error' in x: raise RuntimeError((method,x['error']))
                      return x.get('result',{})
              raise TimeoutError(method)
          def ev(expr,timeout=70): return call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'userGesture':True},timeout).get('result',{}).get('value')
          call('Page.enable'); call('Runtime.enable'); call('Emulation.setDeviceMetricsOverride',{'width':720,'height':450,'deviceScaleFactor':1,'mobile':False})
          url='http://127.0.0.1:8100/docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html?capture'; call('Page.navigate',{'url':url}); end=time.monotonic()+40
          while time.monotonic()<end:
              try:
                  if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',10): break
              except Exception: pass
              time.sleep(.1)
          else: raise RuntimeError('ready timeout')
          ev(f"window.__PROAI_CUBE_OWNER_REVIEW.setReviewPresentation({t},1,false); window.__PROAI_CUBE_OWNER_REVIEW.renderReviewFrame(); true",80)
          data=call('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False},60)['data']; (out/f't{int(t):02d}.png').write_bytes(base64.b64decode(data)); print('R13_VISUAL_FRAME_PASS',t,flush=True); ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'proai-cube-r13-visual-t${{ matrix.time }}', path: qa-r13-visual/, if-no-files-found: warn}
