name: Temporary ProAI Cube R1.2 live interaction QA v2

on:
  pull_request:
    branches: [agent/tmp-proai-cube-r12-qa-base]
permissions:
  contents: read
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r12-qa-trigger-v2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: candidate-a, sha: 0d662e29a0a6bb47b89ac6d3028fc460e443bb94, engine: quaternion-editorial-spatial-r1.1, cycle: 64000}
          - {name: candidate-b, sha: be68d6ecdac6c3486d97cbb52f4a614ad78d4cc3, engine: quaternion-editorial-spatial-r1.2-premium, cycle: 66000}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ matrix.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Start exact candidate
        run: |
          set -euo pipefail
          python3 -m http.server 8085 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9225 --remote-allow-origins='*' --user-data-dir=/tmp/${{ matrix.name }} about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:9225/json/version >/tmp/version.json && break || true; sleep .25; done
          test -s /tmp/version.json
      - name: Execute live interaction assertions
        env:
          CANDIDATE: '${{ matrix.name }}'
          ENGINE: '${{ matrix.engine }}'
          CYCLE: '${{ matrix.cycle }}'
        run: |
          set -euo pipefail
          mkdir -p qa-r12-v2
          timeout 150s python3 - <<'PY'
          import json,math,os,time,urllib.request
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          C=os.environ['CANDIDATE']; E=os.environ['ENGINE']; CYCLE=int(os.environ['CYCLE']); OUT=Path('qa-r12-v2')
          target=next(x for x in json.load(urllib.request.urlopen('http://127.0.0.1:9225/json/list')) if x['type']=='page')
          ws=create_connection(target['webSocketDebuggerUrl'],timeout=12,origin='http://localhost'); seq=0; events=[]
          def call(method,params=None,timeout=15):
              global seq
              seq+=1; i=seq; ws.send(json.dumps({'id':i,'method':method,'params':params or {}})); end=time.monotonic()+timeout
              while time.monotonic()<end:
                  try:
                      ws.settimeout(max(.2,end-time.monotonic())); m=json.loads(ws.recv())
                  except WebSocketTimeoutException: continue
                  if m.get('id')==i:
                      if 'error' in m: raise RuntimeError((method,m['error']))
                      return m.get('result',{})
                  events.append(m)
              raise TimeoutError(method)
          def ev(expr,awaitp=False,timeout=15):
              r=call('Runtime.evaluate',{'expression':expr,'returnByValue':True,'awaitPromise':awaitp,'userGesture':True},timeout)
              if 'exceptionDetails' in r: raise RuntimeError(r['exceptionDetails'])
              return r.get('result',{}).get('value')
          def js(expr,timeout=15): return json.loads(ev('JSON.stringify('+expr+')',False,timeout))
          def ready():
              end=time.monotonic()+30
              while time.monotonic()<end:
                  try:
                      if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',timeout=8): return
                  except Exception: pass
                  time.sleep(.2)
              raise RuntimeError('ready timeout')
          def diag(): return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,d=a.getDiagnostics(),i=a.getInteractionState();return{i,p:d.presentation,s:d.scheduler,turns:d.activeTurns,last:d.lastTurnResults.length,ready:a.ready,state:a.motionState}})()",20)
          def qang(a,b):
              dot=min(1,max(-1,abs(sum(x*y for x,y in zip(a,b))))); return 2*math.acos(dot)
          def dist(a,b): return math.sqrt(sum((x-y)**2 for x,y in zip(a,b)))
          def mouse(t,x,y,buttons=0): call('Input.dispatchMouseEvent',{'type':t,'x':x,'y':y,'button':'left' if t!='mouseMoved' else 'none','buttons':buttons,'clickCount':1},10)
          call('Page.enable'); call('Runtime.enable'); call('Log.enable'); call('Emulation.setDeviceMetricsOverride',{'width':1440,'height':900,'deviceScaleFactor':1,'mobile':False})
          url='http://127.0.0.1:8085/docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html'; call('Page.navigate',{'url':url}); ready(); b=diag()
          assert b['ready'] and b['state']!='error' and b['p']['engine']==E
          assert js('window.__PROAI_CUBE_OWNER_REVIEW.presentationConfig')['cycleMs']==CYCLE
          assert b['s']['enabled'] and b['s']['running'] and b['i']['sliceAutonomyBlocked'] is False and b['i']['autonomyBlocked'] is False
          rect=js("document.getElementById('cube-canvas').getBoundingClientRect().toJSON()",20); cx=rect['x']+rect['width']/2; cy=rect['y']+rect['height']/2

          # 10 s continuous held Orbit drag.
          d0=diag(); sim0=d0['i']['presentationSimTimeMs']; ser0=d0['i']['sliceEventSerial']; last0=d0['last']; cam0=d0['i']['cameraPosition']; q0=d0['i']['presentationQuaternion']
          mouse('mouseMoved',cx,cy); mouse('mousePressed',cx,cy,1); samples=[]; prev={}; progressed=False
          for k in range(20):
              call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+(62 if k%2==0 else -48)+(k%4)*7,'y':cy+(22 if k%3==0 else -17),'button':'left','buttons':1},10); time.sleep(.5)
              d=diag(); samples.append(d); assert d['i']['interactionActive'] is True and d['i']['sliceAutonomyBlocked'] is False and d['s']['enabled'] and d['s']['running']
              for t in d['i']['activeTurnProgress']:
                  if t['id'] in prev and t['linear']>prev[t['id']]+.015: progressed=True
                  prev[t['id']]=t['linear']
          d1=diag(); qpre=d1['i']['presentationQuaternion']; simpre=d1['i']['presentationSimTimeMs']
          assert d1['i']['presentationSimTimeMs']-sim0>7000
          assert d1['i']['sliceEventSerial']>ser0 or d1['last']>last0
          assert dist(cam0,d1['i']['cameraPosition'])>.05 and qang(q0,qpre)>.02 and progressed
          mouse('mouseReleased',cx+70,cy+18,0); time.sleep(.2); rel=diag()
          assert rel['i']['interactionActive'] is False and rel['i']['sliceAutonomyBlocked'] is False and rel['i']['autonomyBlocked'] is False
          assert rel['i']['presentationSimTimeMs']-simpre<750 and qang(qpre,rel['i']['presentationQuaternion'])<.2
          time.sleep(.5); rel2=diag(); assert rel2['i']['presentationSimTimeMs']>rel['i']['presentationSimTimeMs'] and rel2['s']['running']

          # 15 s held/intermittent drag.
          l0=diag(); mouse('mouseMoved',cx,cy); mouse('mousePressed',cx,cy,1)
          for k in range(20):
              call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+((k%5)-2)*26,'y':cy+((k%3)-1)*20,'button':'left','buttons':1},10); time.sleep(.75)
          l1=diag(); assert l1['i']['interactionActive'] is True and l1['i']['presentationSimTimeMs']-l0['i']['presentationSimTimeMs']>10500 and l1['i']['sliceEventSerial']>l0['i']['sliceEventSerial'] and l1['i']['sliceAutonomyBlocked'] is False and l1['s']['running']
          mouse('mouseReleased',cx,cy,0); time.sleep(.2); lr=diag(); assert lr['i']['interactionActive'] is False and lr['i']['sliceAutonomyBlocked'] is False

          # 3 repeated interactions.
          r0=diag()
          for n in range(3):
              mouse('mouseMoved',cx,cy); mouse('mousePressed',cx,cy,1)
              for k in range(5): call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+40+k*6,'y':cy-16+k*3,'button':'left','buttons':1},10); time.sleep(.35)
              mid=diag(); assert mid['i']['interactionActive'] and mid['i']['sliceAutonomyBlocked'] is False
              mouse('mouseReleased',cx+65,cy,0); time.sleep(.4); rr=diag(); assert not rr['i']['interactionActive'] and rr['i']['presentationSimTimeMs']>mid['i']['presentationSimTimeMs'] and rr['s']['running']
          r1=diag(); assert r1['i']['presentationSimTimeMs']>r0['i']['presentationSimTimeMs']

          # Mechanical/canonical regression in capture mode.
          call('Page.navigate',{'url':url+'?capture'}); ready(); qa=json.loads(ev("(async()=>JSON.stringify(await window.__PROAI_CUBE_OWNER_REVIEW.runAutomatedQA()))()",True,40))
          assert all(qa['axisSupport'][a]['restoredAfterPair'] for a in 'XYZ') and qa['repeatability30']['pass'] and qa['inverseRestoration']['pass'] and qa['pairedTurnQA']['pass']
          sample_times=[0,6,14,22,31,39,47,56,64 if CYCLE==64000 else 65]
          motion=[js(f'window.__PROAI_CUBE_OWNER_REVIEW.getReviewPresentationSample({t})') for t in sample_times]

          # Mobile 390x844 touch hold.
          call('Emulation.setDeviceMetricsOverride',{'width':390,'height':844,'deviceScaleFactor':2,'mobile':True,'screenWidth':390,'screenHeight':844}); call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':1}); call('Page.navigate',{'url':url}); ready(); m0=diag(); x=195;y=422
          call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':x,'y':y,'radiusX':2,'radiusY':2,'force':1}]}); seen=False
          for k in range(12):
              call('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':x+min(88,k*8),'y':y+18*math.sin(k*.5),'radiusX':2,'radiusY':2,'force':1}]}); time.sleep(.5); md=diag(); seen=seen or md['i']['interactionActive']; assert md['i']['sliceAutonomyBlocked'] is False and md['s']['running']
          m1=diag(); call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]}); time.sleep(.2); mr=diag()
          assert seen and m1['i']['presentationSimTimeMs']-m0['i']['presentationSimTimeMs']>4000 and (m1['i']['sliceEventSerial']>m0['i']['sliceEventSerial'] or m1['last']>m0['last']) and mr['i']['sliceAutonomyBlocked'] is False

          fatal=[e for e in events if e.get('method')=='Runtime.exceptionThrown' or (e.get('method')=='Log.entryAdded' and e.get('params',{}).get('entry',{}).get('level')=='error')]; assert not fatal
          report={'candidate':C,'held10':{'simDelta':d1['i']['presentationSimTimeMs']-sim0,'eventDelta':d1['i']['sliceEventSerial']-ser0,'lastDelta':d1['last']-last0,'activeProgress':progressed,'cameraDelta':dist(cam0,d1['i']['cameraPosition']),'releaseQuatDeltaRad':qang(qpre,rel['i']['presentationQuaternion']),'releaseSimDelta':rel['i']['presentationSimTimeMs']-simpre},'long15':{'simDelta':l1['i']['presentationSimTimeMs']-l0['i']['presentationSimTimeMs'],'eventDelta':l1['i']['sliceEventSerial']-l0['i']['sliceEventSerial']},'repeat':{'simDelta':r1['i']['presentationSimTimeMs']-r0['i']['presentationSimTimeMs']},'mobile':{'simDelta':m1['i']['presentationSimTimeMs']-m0['i']['presentationSimTimeMs'],'eventDelta':m1['i']['sliceEventSerial']-m0['i']['sliceEventSerial'],'touchActive':seen},'motionSamples':motion,'mechanics':qa,'fatal':fatal}
          (OUT/f'{C}-report.json').write_text(json.dumps(report,indent=2)); print('R12_QA_PASS',C); print(json.dumps({k:report[k] for k in ('held10','long15','repeat','mobile')},indent=2)); ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proai-cube-r12-${{ matrix.name }}-qa-v2
          path: qa-r12-v2/
          if-no-files-found: warn
