name: Temporary ProAI Cube R1.2 live interaction QA v4
on:
  pull_request:
    branches: [agent/tmp-proai-cube-r12-qa-base]
permissions: {contents: read}
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r12-qa-trigger-v4'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: candidate-a, sha: 0d662e29a0a6bb47b89ac6d3028fc460e443bb94, engine: quaternion-editorial-spatial-r1.1, cycle: 64000}
          - {name: candidate-b, sha: be68d6ecdac6c3486d97cbb52f4a614ad78d4cc3, engine: quaternion-editorial-spatial-r1.2-premium, cycle: 66000}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ matrix.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Start exact candidate
        run: |
          python3 -m http.server 8087 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9227 --remote-allow-origins='*' --user-data-dir=/tmp/${{ matrix.name }} about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:9227/json/version >/tmp/version.json && break || true; sleep .2; done
          test -s /tmp/version.json
      - name: Browser-side held interaction proof
        env: {CANDIDATE: '${{ matrix.name }}', ENGINE: '${{ matrix.engine }}', CYCLE: '${{ matrix.cycle }}'}
        run: |
          set -euo pipefail
          mkdir -p qa-r12-v4
          timeout 170s python3 - <<'PY'
          import json,math,os,time,urllib.request
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          C=os.environ['CANDIDATE']; E=os.environ['ENGINE']; CYCLE=int(os.environ['CYCLE']); OUT=Path('qa-r12-v4')
          page=next(x for x in json.load(urllib.request.urlopen('http://127.0.0.1:9227/json/list')) if x['type']=='page'); ws=create_connection(page['webSocketDebuggerUrl'],timeout=15,origin='http://localhost'); n=0; events=[]
          def call(m,p=None,t=25):
              global n
              n+=1;i=n;ws.send(json.dumps({'id':i,'method':m,'params':p or {}}));end=time.monotonic()+t
              while time.monotonic()<end:
                  try: ws.settimeout(max(.2,end-time.monotonic()));x=json.loads(ws.recv())
                  except WebSocketTimeoutException: continue
                  if x.get('id')==i:
                      if 'error' in x: raise RuntimeError((m,x['error']))
                      return x.get('result',{})
                  events.append(x)
              raise TimeoutError(m)
          def ev(x,awaitp=False,t=25):
              r=call('Runtime.evaluate',{'expression':x,'returnByValue':True,'awaitPromise':awaitp,'userGesture':True},t)
              if 'exceptionDetails' in r: raise RuntimeError(r['exceptionDetails'])
              return r.get('result',{}).get('value')
          def js(x,t=25): return json.loads(ev('JSON.stringify('+x+')',False,t))
          def ready():
              end=time.monotonic()+40
              while time.monotonic()<end:
                  try:
                      if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',t=12): return
                  except Exception: pass
                  time.sleep(.15)
              raise RuntimeError('ready timeout')
          def d(): return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,x=a.getDiagnostics(),i=a.getInteractionState();return{i,p:x.presentation,s:x.scheduler,last:x.lastTurnResults.length,state:a.motionState}})()",30)
          def dist(a,b): return math.sqrt(sum((x-y)**2 for x,y in zip(a,b)))
          def qang(a,b):
              dot=min(1,max(-1,abs(sum(x*y for x,y in zip(a,b)))));return 2*math.acos(dot)
          def mouse(t,x,y,buttons=0): call('Input.dispatchMouseEvent',{'type':t,'x':x,'y':y,'button':'left' if t!='mouseMoved' else 'none','buttons':buttons,'clickCount':1},15)
          def start_probe(name):
              ev(f"""(()=>{{
                const a=window.__PROAI_CUBE_OWNER_REVIEW;
                const p=window['__{name}']={{samples:0,simStart:a.getInteractionState().presentationSimTimeMs,simLast:a.getInteractionState().presentationSimTimeMs,simAdvances:0,serialStart:a.getInteractionState().sliceEventSerial,serialLast:a.getInteractionState().sliceEventSerial,lastStart:a.getDiagnostics().lastTurnResults.length,lastLast:a.getDiagnostics().lastTurnResults.length,activeSeen:false,turnProgress:false,turnCompletedWhileHeld:false,blockedSeen:false,schedulerStopped:false,ids:{{}}}};
                p.timer=setInterval(()=>{{
                  const i=a.getInteractionState(), d=a.getDiagnostics(); p.samples++;
                  if(i.presentationSimTimeMs>p.simLast) p.simAdvances++; p.simLast=i.presentationSimTimeMs;
                  p.serialLast=i.sliceEventSerial; p.lastLast=d.lastTurnResults.length;
                  if(i.sliceAutonomyBlocked||i.autonomyBlocked) p.blockedSeen=true;
                  if(!d.scheduler.enabled||!d.scheduler.running) p.schedulerStopped=true;
                  for(const t of i.activeTurnProgress){{
                    p.activeSeen=true; const old=p.ids[t.id];
                    if(old!==undefined && t.linear>old+0.001) p.turnProgress=true;
                    p.ids[t.id]=t.linear;
                  }}
                  for(const id of Object.keys(p.ids)){{
                    if(!i.activeTurnProgress.some(t=>t.id===id) && p.ids[id]<0.999 && d.lastTurnResults.some(r=>r.id===id)) p.turnCompletedWhileHeld=true;
                  }}
                }},75);
              }})()""",t=15)
          def stop_probe(name):
              return js(f"(()=>{{const p=window['__{name}'];clearInterval(p.timer);delete p.timer;return p;}})()",25)

          call('Page.enable');call('Runtime.enable');call('Log.enable');call('Emulation.setDeviceMetricsOverride',{'width':1440,'height':900,'deviceScaleFactor':1,'mobile':False})
          url='http://127.0.0.1:8087/docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html';call('Page.navigate',{'url':url});ready();boot=d();assert boot['state']!='error' and boot['p']['engine']==E and boot['s']['enabled'] and boot['s']['running'] and boot['i']['sliceAutonomyBlocked'] is False and boot['i']['autonomyBlocked'] is False;assert js('window.__PROAI_CUBE_OWNER_REVIEW.presentationConfig')['cycleMs']==CYCLE
          rect=js("document.getElementById('cube-canvas').getBoundingClientRect().toJSON()");cx=rect['x']+rect['width']/2;cy=rect['y']+rect['height']/2

          # 10-second held desktop Orbit.
          h0=d();start_probe('heldProbe');mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1)
          for k in range(40): call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+(62 if k%2==0 else -48)+(k%5)*5,'y':cy+(22 if k%3==0 else -18),'button':'left','buttons':1},15);time.sleep(.25)
          h1=d();probe=stop_probe('heldProbe');held={'probe':probe,'cameraDelta':dist(h0['i']['cameraPosition'],h1['i']['cameraPosition']),'cubeQuatDelta':qang(h0['i']['presentationQuaternion'],h1['i']['presentationQuaternion'])};print('HELD',json.dumps(held),flush=True)
          assert h1['i']['interactionActive'] and probe['samples']>5 and probe['simLast']>probe['simStart'] and probe['simAdvances']>1 and (probe['serialLast']>probe['serialStart'] or probe['lastLast']>probe['lastStart']) and probe['activeSeen'] and (probe['turnProgress'] or probe['turnCompletedWhileHeld']) and not probe['blockedSeen'] and not probe['schedulerStopped'] and held['cameraDelta']>.03 and held['cubeQuatDelta']>.005
          qpre=h1['i']['presentationQuaternion'];spre=h1['i']['presentationSimTimeMs'];mouse('mouseReleased',cx+70,cy+20,0);time.sleep(.25);rel=d();release={'quatDelta':qang(qpre,rel['i']['presentationQuaternion']),'simDelta':rel['i']['presentationSimTimeMs']-spre};print('RELEASE',release,flush=True);assert not rel['i']['interactionActive'] and rel['i']['sliceAutonomyBlocked'] is False and rel['i']['autonomyBlocked'] is False and release['simDelta']>=0 and release['quatDelta']<.25

          # 15-second held/intermittent drag.
          l0=d();start_probe('longProbe');mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1)
          for k in range(30):call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+((k%5)-2)*26,'y':cy+((k%3)-1)*20,'button':'left','buttons':1},15);time.sleep(.5)
          l1=d();lp=stop_probe('longProbe');long={'probe':lp,'cameraDelta':dist(l0['i']['cameraPosition'],l1['i']['cameraPosition'])};print('LONG',json.dumps(long),flush=True);assert l1['i']['interactionActive'] and lp['simLast']>lp['simStart'] and lp['simAdvances']>1 and lp['serialLast']>lp['serialStart'] and lp['activeSeen'] and (lp['turnProgress'] or lp['turnCompletedWhileHeld']) and not lp['blockedSeen'] and not lp['schedulerStopped'];mouse('mouseReleased',cx,cy,0);time.sleep(.25);assert d()['i']['sliceAutonomyBlocked'] is False

          # Three repeated Orbit interactions.
          rr0=d()
          for z in range(3):
              mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1)
              for k in range(6):call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+42+k*6,'y':cy-15+k*3,'button':'left','buttons':1},15);time.sleep(.25)
              mid=d();assert mid['i']['interactionActive'] and mid['i']['sliceAutonomyBlocked'] is False;mouse('mouseReleased',cx+65,cy,0);time.sleep(.35);aft=d();assert not aft['i']['interactionActive'] and aft['s']['running'] and aft['i']['sliceAutonomyBlocked'] is False
          rr1=d();repeat={'simDelta':rr1['i']['presentationSimTimeMs']-rr0['i']['presentationSimTimeMs'],'eventDelta':rr1['i']['sliceEventSerial']-rr0['i']['sliceEventSerial']};assert repeat['simDelta']>0

          # Canonical X/Y/Z slice mechanics.
          call('Page.navigate',{'url':url+'?capture'});ready();mechanics=json.loads(ev("(async()=>JSON.stringify(await window.__PROAI_CUBE_OWNER_REVIEW.runAutomatedQA()))()",True,50));assert all(mechanics['axisSupport'][a]['restoredAfterPair'] for a in 'XYZ') and mechanics['repeatability30']['pass'] and mechanics['inverseRestoration']['pass'] and mechanics['pairedTurnQA']['pass'];samples=[js(f'window.__PROAI_CUBE_OWNER_REVIEW.getReviewPresentationSample({t})') for t in ([0,6,14,22,31,39,47,56,64] if CYCLE==64000 else [0,6,14,22,31,39,47,56,65])]

          # Mobile 390x844 touch hold with browser-side probe.
          call('Emulation.setDeviceMetricsOverride',{'width':390,'height':844,'deviceScaleFactor':2,'mobile':True,'screenWidth':390,'screenHeight':844});call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':1});call('Page.navigate',{'url':url});ready();m0=d();start_probe('mobileProbe');x=195;y=422;call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':x,'y':y,'radiusX':2,'radiusY':2,'force':1}]})
          for k in range(24):call('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':x+min(88,k*4),'y':y+18*math.sin(k*.35),'radiusX':2,'radiusY':2,'force':1}]});time.sleep(.25)
          m1=d();mp=stop_probe('mobileProbe');call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]});time.sleep(.25);mr=d();mobile={'probe':mp,'interactionAtHeldEnd':m1['i']['interactionActive']};print('MOBILE',json.dumps(mobile),flush=True);assert mp['simLast']>mp['simStart'] and mp['simAdvances']>1 and (mp['serialLast']>mp['serialStart'] or mp['lastLast']>mp['lastStart']) and not mp['blockedSeen'] and not mp['schedulerStopped'] and mr['i']['sliceAutonomyBlocked'] is False
          fatal=[x for x in events if x.get('method')=='Runtime.exceptionThrown' or (x.get('method')=='Log.entryAdded' and x.get('params',{}).get('entry',{}).get('level')=='error')];assert not fatal
          report={'candidate':C,'held10':held,'release':release,'long15':long,'repeat':repeat,'mobile':mobile,'samples':samples,'mechanics':mechanics};(OUT/f'{C}-report.json').write_text(json.dumps(report,indent=2));print('R12_BROWSER_SIDE_QA_PASS',C,flush=True);ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'proai-cube-r12-${{ matrix.name }}-qa-v4', path: 'qa-r12-v4/', if-no-files-found: warn}
