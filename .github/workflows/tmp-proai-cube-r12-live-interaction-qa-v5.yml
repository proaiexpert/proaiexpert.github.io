name: Temporary ProAI Cube R1.2 direct-turn live QA
on:
  pull_request:
    branches: [agent/tmp-proai-cube-r12-qa-base]
permissions: {contents: read}
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r12-qa-trigger-v5'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: candidate-a, sha: 0d662e29a0a6bb47b89ac6d3028fc460e443bb94, engine: quaternion-editorial-spatial-r1.1, cycle: 64000}
          - {name: candidate-b, sha: be68d6ecdac6c3486d97cbb52f4a614ad78d4cc3, engine: quaternion-editorial-spatial-r1.2-premium, cycle: 66000}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ matrix.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Start candidate
        run: |
          python3 -m http.server 8088 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9228 --remote-allow-origins='*' --user-data-dir=/tmp/${{ matrix.name }} about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:9228/json/version >/tmp/version.json && break || true; sleep .2; done
          test -s /tmp/version.json
      - name: Direct held-drag interaction gate
        env: {CANDIDATE: '${{ matrix.name }}', ENGINE: '${{ matrix.engine }}', CYCLE: '${{ matrix.cycle }}'}
        run: |
          set -euo pipefail
          mkdir -p qa-r12-v5
          timeout 150s python3 - <<'PY'
          import json,math,os,time,urllib.request
          from pathlib import Path
          from websocket import create_connection,WebSocketTimeoutException
          C=os.environ['CANDIDATE'];E=os.environ['ENGINE'];CYCLE=int(os.environ['CYCLE']);OUT=Path('qa-r12-v5')
          page=next(x for x in json.load(urllib.request.urlopen('http://127.0.0.1:9228/json/list')) if x['type']=='page');ws=create_connection(page['webSocketDebuggerUrl'],timeout=15,origin='http://localhost');n=0;events=[]
          def call(m,p=None,t=25):
            global n
            n+=1;i=n;ws.send(json.dumps({'id':i,'method':m,'params':p or {}}));end=time.monotonic()+t
            while time.monotonic()<end:
              try:ws.settimeout(max(.2,end-time.monotonic()));x=json.loads(ws.recv())
              except WebSocketTimeoutException:continue
              if x.get('id')==i:
                if 'error'in x:raise RuntimeError((m,x['error']))
                return x.get('result',{})
              events.append(x)
            raise TimeoutError(m)
          def ev(x,awaitp=False,t=25):
            r=call('Runtime.evaluate',{'expression':x,'returnByValue':True,'awaitPromise':awaitp,'userGesture':True},t)
            if 'exceptionDetails'in r:raise RuntimeError(r['exceptionDetails'])
            return r.get('result',{}).get('value')
          def js(x,t=25):return json.loads(ev('JSON.stringify('+x+')',False,t))
          def ready():
            end=time.monotonic()+40
            while time.monotonic()<end:
              try:
                if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',t=12):return
              except Exception:pass
              time.sleep(.15)
            raise RuntimeError('ready timeout')
          def d():return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,x=a.getDiagnostics(),i=a.getInteractionState();return{i,p:x.presentation,s:x.scheduler,last:x.lastTurnResults.length,state:a.motionState}})()",30)
          def dist(a,b):return math.sqrt(sum((x-y)**2 for x,y in zip(a,b)))
          def qang(a,b):
            dot=min(1,max(-1,abs(sum(x*y for x,y in zip(a,b)))));return 2*math.acos(dot)
          def mouse(t,x,y,buttons=0):call('Input.dispatchMouseEvent',{'type':t,'x':x,'y':y,'button':'left' if t!='mouseMoved' else 'none','buttons':buttons,'clickCount':1},15)
          call('Page.enable');call('Runtime.enable');call('Log.enable');call('Emulation.setDeviceMetricsOverride',{'width':1440,'height':900,'deviceScaleFactor':1,'mobile':False})
          url='http://127.0.0.1:8088/docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html';call('Page.navigate',{'url':url});ready();boot=d();assert boot['state']!='error' and boot['p']['engine']==E and boot['s']['enabled'] and boot['s']['running'] and boot['i']['sliceAutonomyBlocked'] is False and boot['i']['autonomyBlocked'] is False;assert js('window.__PROAI_CUBE_OWNER_REVIEW.presentationConfig')['cycleMs']==CYCLE
          r=js("document.getElementById('cube-canvas').getBoundingClientRect().toJSON()");cx=r['x']+r['width']/2;cy=r['y']+r['height']/2

          # TEST 1: held 10s. Start a long safe slice while mouse remains physically down and inspect its linear progress in-browser.
          h0=d();mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1)
          for k in range(8):call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+35+k*5,'y':cy-12+k*2,'button':'left','buttons':1},12);time.sleep(.25)
          direct=json.loads(ev("""(async()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,sleep=ms=>new Promise(r=>setTimeout(r,ms));for(let attempt=0;attempt<30;attempt++){const before=a.getDiagnostics().activeTurns;if(before.length>=2){await sleep(80);continue;}let axis='X',layer=0;if(before.length===1){axis=before[0].axis;layer=[-1,0,1].find(v=>v!==before[0].layer);}const ids=new Set(before.map(t=>t.id));a.turnSlice({axis,layer,direction:1,durationMs:8000});await sleep(120);let turns=a.getInteractionState().activeTurnProgress;let t=turns.find(v=>!ids.has(v.id));if(!t){await sleep(80);continue;}const id=t.id,l1=t.linear;await sleep(700);turns=a.getInteractionState().activeTurnProgress;t=turns.find(v=>v.id===id);const l2=t?t.linear:null;const completed=a.getDiagnostics().lastTurnResults.some(v=>v.id===id);return JSON.stringify({started:true,id,l1,l2,completed,interaction:a.getInteractionState().interactionActive,blocked:a.getInteractionState().sliceAutonomyBlocked});}return JSON.stringify({started:false});})()""",True,25));print('DIRECT',direct,flush=True);assert direct['started'] and direct['interaction'] and direct['blocked'] is False and ((direct['l2'] is not None and direct['l2']>direct['l1']) or direct['completed'])
          for k in range(16):call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+(60 if k%2==0 else -45)+(k%4)*7,'y':cy+(20 if k%3==0 else -16),'button':'left','buttons':1},12);time.sleep(.5)
          h1=d();held={'simDelta':h1['i']['presentationSimTimeMs']-h0['i']['presentationSimTimeMs'],'eventDelta':h1['i']['sliceEventSerial']-h0['i']['sliceEventSerial'],'lastDelta':h1['last']-h0['last'],'cameraDelta':dist(h0['i']['cameraPosition'],h1['i']['cameraPosition']),'cubeQuatDelta':qang(h0['i']['presentationQuaternion'],h1['i']['presentationQuaternion']),'direct':direct};print('HELD',held,flush=True);assert h1['i']['interactionActive'] and h1['i']['sliceAutonomyBlocked'] is False and h1['s']['enabled'] and h1['s']['running'] and held['simDelta']>0 and held['eventDelta']>0 and held['cameraDelta']>.03 and held['cubeQuatDelta']>.005
          qpre=h1['i']['presentationQuaternion'];spre=h1['i']['presentationSimTimeMs'];mouse('mouseReleased',cx+70,cy+18,0);time.sleep(.25);rel=d();release={'quatDelta':qang(qpre,rel['i']['presentationQuaternion']),'simDelta':rel['i']['presentationSimTimeMs']-spre};print('RELEASE',release,flush=True);assert not rel['i']['interactionActive'] and rel['i']['sliceAutonomyBlocked'] is False and rel['i']['autonomyBlocked'] is False and release['simDelta']>=0 and release['quatDelta']<.25

          # TEST 2: long 15s held/intermittent drag.
          l0=d();mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1)
          for k in range(30):call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+((k%5)-2)*26,'y':cy+((k%3)-1)*20,'button':'left','buttons':1},12);time.sleep(.5)
          l1=d();long={'simDelta':l1['i']['presentationSimTimeMs']-l0['i']['presentationSimTimeMs'],'eventDelta':l1['i']['sliceEventSerial']-l0['i']['sliceEventSerial']};print('LONG',long,flush=True);assert l1['i']['interactionActive'] and l1['i']['sliceAutonomyBlocked'] is False and l1['s']['running'] and long['simDelta']>0 and long['eventDelta']>0;mouse('mouseReleased',cx,cy,0);time.sleep(.25);assert d()['i']['sliceAutonomyBlocked'] is False

          # TEST 3/4: three drag-release repetitions.
          rr0=d()
          for z in range(3):
            mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1)
            for k in range(6):call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+42+k*6,'y':cy-15+k*3,'button':'left','buttons':1},12);time.sleep(.25)
            mid=d();assert mid['i']['interactionActive'] and mid['i']['sliceAutonomyBlocked'] is False;mouse('mouseReleased',cx+65,cy,0);time.sleep(.35);aft=d();assert not aft['i']['interactionActive'] and aft['s']['running'] and aft['i']['sliceAutonomyBlocked'] is False
          rr1=d();repeat={'simDelta':rr1['i']['presentationSimTimeMs']-rr0['i']['presentationSimTimeMs'],'eventDelta':rr1['i']['sliceEventSerial']-rr0['i']['sliceEventSerial']};assert repeat['simDelta']>0

          # X/Y/Z canonical mechanics and deterministic motion samples.
          call('Page.navigate',{'url':url+'?capture'});ready();mechanics=json.loads(ev("(async()=>JSON.stringify(await window.__PROAI_CUBE_OWNER_REVIEW.runAutomatedQA()))()",True,50));assert all(mechanics['axisSupport'][a]['restoredAfterPair'] for a in 'XYZ') and mechanics['repeatability30']['pass'] and mechanics['inverseRestoration']['pass'] and mechanics['pairedTurnQA']['pass'];samples=[js(f'window.__PROAI_CUBE_OWNER_REVIEW.getReviewPresentationSample({t})') for t in ([0,6,14,22,31,39,47,56,64] if CYCLE==64000 else [0,6,14,22,31,39,47,56,65])]

          # Mobile 390x844 touch regression.
          call('Emulation.setDeviceMetricsOverride',{'width':390,'height':844,'deviceScaleFactor':2,'mobile':True,'screenWidth':390,'screenHeight':844});call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':1});call('Page.navigate',{'url':url});ready();m0=d();x=195;y=422;call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':x,'y':y,'radiusX':2,'radiusY':2,'force':1}]})
          for k in range(24):call('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':x+min(88,k*4),'y':y+18*math.sin(k*.35),'radiusX':2,'radiusY':2,'force':1}]});time.sleep(.25)
          m1=d();call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]});time.sleep(.25);mr=d();mobile={'simDelta':m1['i']['presentationSimTimeMs']-m0['i']['presentationSimTimeMs'],'eventDelta':m1['i']['sliceEventSerial']-m0['i']['sliceEventSerial'],'lastDelta':m1['last']-m0['last']};print('MOBILE',mobile,flush=True);assert m1['i']['sliceAutonomyBlocked'] is False and m1['s']['running'] and mobile['simDelta']>0 and (mobile['eventDelta']>0 or mobile['lastDelta']>0) and mr['i']['sliceAutonomyBlocked'] is False
          fatal=[x for x in events if x.get('method')=='Runtime.exceptionThrown' or (x.get('method')=='Log.entryAdded' and x.get('params',{}).get('entry',{}).get('level')=='error')];assert not fatal
          report={'candidate':C,'held10':held,'release':release,'long15':long,'repeat':repeat,'mobile':mobile,'samples':samples,'mechanics':mechanics};(OUT/f'{C}-report.json').write_text(json.dumps(report,indent=2));print('R12_DIRECT_QA_PASS',C,flush=True);ws.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'proai-cube-r12-${{ matrix.name }}-qa-v5', path: 'qa-r12-v5/', if-no-files-found: warn}
