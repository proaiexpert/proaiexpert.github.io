name: Temporary ProAI Cube R1.2 repeat mobile QA
on:
  pull_request:
    branches: [agent/tmp-proai-cube-r12-qa-base]
permissions: {contents: read}
jobs:
  qa:
    if: github.event.pull_request.head.ref == 'agent/tmp-proai-cube-r12-qa-trigger-v10'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: candidate-a, sha: 0d662e29a0a6bb47b89ac6d3028fc460e443bb94, engine: quaternion-editorial-spatial-r1.1}
          - {name: candidate-b, sha: be68d6ecdac6c3486d97cbb52f4a614ad78d4cc3, engine: quaternion-editorial-spatial-r1.2-premium}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ matrix.sha }}', fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet websocket-client
      - name: Start explicit headed Chrome page
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8093 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          xvfb-run -a -s '-screen 0 1440x900x24' "$CHROME" --no-sandbox --disable-dev-shm-usage --window-size=1440,900 --enable-webgl --use-gl=angle --use-angle=swiftshader --remote-debugging-port=9233 --remote-allow-origins='*' --user-data-dir=/tmp/xvfb-${{ matrix.name }} >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:9233/json/version >/tmp/version.json 2>/dev/null && break || true; sleep .2; done
          test -s /tmp/version.json
          for i in $(seq 1 40); do curl -fsS -X PUT 'http://127.0.0.1:9233/json/new?about:blank' >/tmp/page.json 2>/dev/null && grep -q webSocketDebuggerUrl /tmp/page.json && break || true; sleep .2; done
          grep -q webSocketDebuggerUrl /tmp/page.json
      - name: Repeat desktop and mobile touch gates
        env: {CANDIDATE: '${{ matrix.name }}', ENGINE: '${{ matrix.engine }}'}
        shell: bash
        run: |
          set -euo pipefail
          timeout 65s python3 - <<'PY'
          import json,math,os,time
          from websocket import create_connection,WebSocketTimeoutException
          C=os.environ['CANDIDATE'];E=os.environ['ENGINE'];page=json.load(open('/tmp/page.json'));ws=create_connection(page['webSocketDebuggerUrl'],timeout=12,origin='http://localhost');seq=0
          def call(m,p=None,t=15):
            global seq
            seq+=1;i=seq;ws.send(json.dumps({'id':i,'method':m,'params':p or {}}));end=time.monotonic()+t
            while time.monotonic()<end:
              try:ws.settimeout(max(.2,end-time.monotonic()));x=json.loads(ws.recv())
              except WebSocketTimeoutException:continue
              if x.get('id')==i:
                if 'error'in x:raise RuntimeError(x['error'])
                return x.get('result',{})
            raise TimeoutError(m)
          def ev(x,t=15):return call('Runtime.evaluate',{'expression':x,'returnByValue':True,'userGesture':True},t).get('result',{}).get('value')
          def js(x,t=15):return json.loads(ev('JSON.stringify('+x+')',t))
          def ready():
            end=time.monotonic()+30
            while time.monotonic()<end:
              try:
                if ev('Boolean(window.__PROAI_CUBE_OWNER_REVIEW?.ready)',8):return
              except Exception:pass
              time.sleep(.1)
            raise RuntimeError('ready timeout')
          def d():return js("(()=>{const a=window.__PROAI_CUBE_OWNER_REVIEW,x=a.getDiagnostics(),i=a.getInteractionState();return{i,p:x.presentation,s:x.scheduler,last:x.lastTurnResults.length}})()")
          def mouse(t,x,y,buttons=0):call('Input.dispatchMouseEvent',{'type':t,'x':x,'y':y,'button':'left' if t!='mouseMoved' else 'none','buttons':buttons,'clickCount':1},10)
          call('Page.enable');call('Runtime.enable');url='http://127.0.0.1:8093/docs/site-evolution/spline/proai-cube-resend-spatial-motion-r1/review.html';call('Emulation.setDeviceMetricsOverride',{'width':1440,'height':900,'deviceScaleFactor':1,'mobile':False});call('Page.navigate',{'url':url});ready();b=d();assert b['p']['engine']==E
          r=js("document.getElementById('cube-canvas').getBoundingClientRect().toJSON()");cx=r['x']+r['width']/2;cy=r['y']+r['height']/2;rep0=d()
          for z in range(3):
            mouse('mouseMoved',cx,cy);mouse('mousePressed',cx,cy,1)
            for j in range(7):call('Input.dispatchMouseEvent',{'type':'mouseMoved','x':cx+35+j*6,'y':cy-12+j*3,'button':'left','buttons':1},10);time.sleep(.18)
            mid=d();assert mid['i']['interactionActive'] and mid['i']['sliceAutonomyBlocked'] is False and mid['s']['running'];mouse('mouseReleased',cx+60,cy,0);time.sleep(.25);aft=d();assert not aft['i']['interactionActive'] and aft['i']['sliceAutonomyBlocked'] is False and aft['s']['running']
          rep1=d();repeat={'simDelta':rep1['i']['presentationSimTimeMs']-rep0['i']['presentationSimTimeMs'],'eventDelta':rep1['i']['sliceEventSerial']-rep0['i']['sliceEventSerial']};print('REPEAT3',repeat,flush=True);assert repeat['simDelta']>0
          call('Emulation.setDeviceMetricsOverride',{'width':390,'height':844,'deviceScaleFactor':2,'mobile':True,'screenWidth':390,'screenHeight':844});call('Emulation.setTouchEmulationEnabled',{'enabled':True,'maxTouchPoints':1});call('Page.navigate',{'url':url});ready();m0=d();x=195;y=422;call('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':x,'y':y,'radiusX':2,'radiusY':2,'force':1}]})
          for j in range(30):call('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':x+min(90,j*4),'y':y+16*math.sin(j*.35),'radiusX':2,'radiusY':2,'force':1}]});time.sleep(.18)
          m1=d();call('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]});time.sleep(.2);mr=d();mobile={'simDelta':m1['i']['presentationSimTimeMs']-m0['i']['presentationSimTimeMs'],'eventDelta':m1['i']['sliceEventSerial']-m0['i']['sliceEventSerial'],'completedDelta':m1['last']-m0['last']};print('MOBILE',mobile,flush=True);assert m1['i']['sliceAutonomyBlocked'] is False and m1['s']['running'] and mobile['simDelta']>0 and (mobile['eventDelta']>0 or mobile['completedDelta']>0) and mr['i']['sliceAutonomyBlocked'] is False
          print('R12_REPEAT_MOBILE_PASS',C,flush=True);ws.close()
          PY
