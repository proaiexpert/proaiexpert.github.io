name: Trigger article refinement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'premium-article-linking-visual-refinement-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-article-linking-visual-refinement-v1
          fetch-depth: 0

      - name: Execute scoped transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-article-linking-visual-refinement.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate refinement"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          script = script.replace('data-module="portfolio-evidence"', 'data-module="evidence-taxonomy"')
          Path('/tmp/refine.py').write_text(script + '\n', encoding='utf-8')
          PY
          python3 /tmp/refine.py

      - name: Validate and commit clean result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          required = {
            'ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html': ['/ru/websites-branding/', '/ru/insights/chto-proiskhodit-posle-zayavki/', '/ru/case-studies/', 'premium-related-insights'],
            'insights/how-to-evaluate-a-website-proposal/index.html': ['/websites-branding/', '/insights/what-happens-after-a-lead-arrives/', '/case-studies/', 'premium-related-insights'],
            'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html': ['/ru/websites-branding/', '/ru/case-studies/financial-stream/'],
            'insights/does-your-service-business-need-a-multilingual-website/index.html': ['/websites-branding/', '/case-studies/financial-stream/'],
          }
          for path, needles in required.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text, (path, needle)
          css = Path('assets/css/premium-article-hotfix-v1.css').read_text(encoding='utf-8')
          assert 'Editorial linking + visual refinement v1' in css
          print('Refinement validation passed.')
          PY
          git config user.name "ProAI Expert Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-article-linking-visual-refinement.yml .github/workflows/trigger-article-refinement-pr.yml
          git add assets/css/premium-article-hotfix-v1.css \
            insights/how-to-evaluate-a-website-proposal/index.html \
            ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html \
            insights/does-your-service-business-need-a-multilingual-website/index.html \
            ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html
          git commit -m "refine: strengthen article linking and editorial hierarchy"
          git push origin HEAD:premium-article-linking-visual-refinement-v1
