name: Trigger premium article hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'premium-articles-mobile-author-hotfix-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: premium-articles-mobile-author-hotfix-v1
          fetch-depth: 0

      - name: Extract and execute scoped transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-premium-article-hotfix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate syntax and scoped output"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-premium-article-hotfix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-premium-article-hotfix.py

      - name: Validate transformed files
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/premium-article-hotfix-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          files = [
            'insights/does-your-service-business-need-a-multilingual-website/index.html',
            'ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html',
            'insights/how-to-evaluate-a-website-proposal/index.html',
            'ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html',
          ]
          for file in files:
            text = Path(file).read_text(encoding='utf-8')
            schemas = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', text, flags=re.S)
            if len(schemas) != 1:
              raise SystemExit(f'{file}: JSON-LD block count {len(schemas)}')
            schema = json.loads(schemas[0])
            assert schema['author']['@type'] == 'Person', file
            assert schema['publisher']['@type'] == 'Organization', file
            assert text.count('premium-author-byline') == 1, file
            assert text.count('premium-article-hotfix-v1.css') == 1, file
            assert text.count('premium-article-hotfix-v1.js') == 1, file
            assert '<main id="main-content" tabindex="-1"' in text, file
          assert Path('assets/css/premium-article-hotfix-v1.css').stat().st_size > 5000
          assert Path('assets/js/premium-article-hotfix-v1.js').stat().st_size > 2000
          print('Scoped hotfix validation passed.')
          PY

      - name: Commit clean hotfix result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProAI Expert Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-premium-article-hotfix.yml .github/workflows/trigger-premium-article-hotfix-pr.yml
          git add assets/css/premium-article-hotfix-v1.css assets/js/premium-article-hotfix-v1.js \
            insights/does-your-service-business-need-a-multilingual-website/index.html \
            ru/insights/sayt-dlya-russkoyazychnogo-biznesa-v-ssha/index.html \
            insights/how-to-evaluate-a-website-proposal/index.html \
            ru/insights/kak-proverit-predlozhenie-na-sayt-v-ssha/index.html
          git commit -m "fix: repair premium article mobile layouts and author identity"
          git push origin HEAD:premium-articles-mobile-author-hotfix-v1
