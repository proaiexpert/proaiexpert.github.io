# inspect safe-persistence final committed V3 Owner filmstrip verification
name: Two Worlds R2 Run Diagnostic

on:
  push:
    branches:
      - tmp/proai-two-worlds-r2-run-diagnostic
    paths:
      - .github/workflows/tw-r2-run-diagnostic.yml

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect target workflow run
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=agent%2Fproai-two-worlds-product-resurrection-r2&per_page=50")
          printf '%s' "$json" > /tmp/runs.json
          python3 -c 'import json; d=json.load(open("/tmp/runs.json")); runs=[r for r in d.get("workflow_runs",[]) if r.get("name")=="ProAI Two Worlds Product Resurrection R2 V3 Finalize V2"]; assert runs, "no finalizer V2 run"; r=runs[0]; print(r["id"]); print(r["status"]); print(r.get("conclusion") or ""); print(r["html_url"])' >/tmp/result.txt
          run_id=$(sed -n '1p' /tmp/result.txt); status=$(sed -n '2p' /tmp/result.txt); conclusion=$(sed -n '3p' /tmp/result.txt); url=$(sed -n '4p' /tmp/result.txt)
          state=pending; [ "$status" = completed ] && state=success; [ "$status" = completed ] && [ "$conclusion" != success ] && state=error
          curl -fsS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} -d "{\"state\":\"$state\",\"context\":\"tw-r2-v3-final-v2-diagnostic\",\"description\":\"run $run_id $status $conclusion\",\"target_url\":\"$url\"}" >/dev/null
