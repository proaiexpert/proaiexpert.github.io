name: Visual QA v2 — Financial Stream live evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/visual-qa-financial-stream-v2.yml
      - .github/scripts/financial-stream-visual-qa.mjs

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run live visual QA
        env:
          QA_OUT: financial-stream-visual-qa
          QA_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/financial-stream-visual-qa.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-stream-live-visual-qa-v2
          path: financial-stream-visual-qa
          if-no-files-found: error
          retention-days: 14
