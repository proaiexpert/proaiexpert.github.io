<div class="hero-r43__bridge"></div>
<div class="hero-r43__ambient"></div>

<!-- R4.5 uses the exact canonical grounded R2 scene payload as the source for every depth plane.
     The repeated planes are registered identically and masked to real rear metal, internal
     glass/intelligence volume, or foreground metal geometry. No Core regeneration. -->
<div class="hero-r45__desktop-stack" aria-hidden="true">
  <div class="hero-r45__registration">
    <div class="hero-r45__scene-plane hero-r45__scene-plane--back" data-r45-back>
      {% include hero-c-shape-r2/environment-r2.html %}
    </div>

    <div class="hero-r43__physical-scene hero-r45__scene-plane hero-r45__scene-plane--base" data-r45-base>
      <div class="hero-r43__base-picture hero-r45__scene-picture">
        {% include hero-c-shape-r2/environment-r2.html %}
      </div>
      <div class="hero-r43__material-response hero-r43__material-response--cyan hero-r45__material-plane" data-r45-cyan-response>
        {% include hero-c-shape-r2/environment-r2.html %}
      </div>
      <div class="hero-r43__material-response hero-r43__material-response--warm hero-r45__material-plane" data-r45-warm-response>
        {% include hero-c-shape-r2/environment-r2.html %}
      </div>
      <div class="hero-r45__route-neutralizer"></div>
    </div>

    <div class="hero-r45__scene-plane hero-r45__scene-plane--glass" data-r45-glass>
      {% include hero-c-shape-r2/environment-r2.html %}
    </div>

    <div class="hero-r45__energy" data-r45-energy>
      <div class="hero-r45__entry-volume" data-r45-entry-volume></div>
      <i class="hero-r45__impulse hero-r45__impulse--0" data-r45-input="0"></i>
      <i class="hero-r45__impulse hero-r45__impulse--1" data-r45-input="1"></i>
      <i class="hero-r45__impulse hero-r45__impulse--2" data-r45-input="2"></i>
      <div class="hero-r45__ingress" data-r45-ingress></div>
      <i class="hero-r45__depth-packet" data-r45-depth-packet></i>

      <div class="hero-r45__chamber hero-r45__chamber--top" data-r45-chamber="0"></div>
      <div class="hero-r45__chamber hero-r45__chamber--mid" data-r45-chamber="1"></div>
      <div class="hero-r45__chamber hero-r45__chamber--deep" data-r45-chamber="2"></div>
      <div class="hero-r45__chamber hero-r45__chamber--lower" data-r45-chamber="3"></div>

      <i class="hero-r45__microstream hero-r45__microstream--0" data-r45-micro="0"></i>
      <i class="hero-r45__microstream hero-r45__microstream--1" data-r45-micro="1"></i>
      <i class="hero-r45__microstream hero-r45__microstream--2" data-r45-micro="2"></i>

      <div class="hero-r45__collector" data-r45-collector></div>
      <div class="hero-r45__output-field" data-r45-output-field></div>
      <div class="hero-r45__output hero-r45__output--0" data-r45-output="0"><i></i><b></b></div>
      <div class="hero-r45__output hero-r45__output--1" data-r45-output="1"><i></i><b></b></div>
      <div class="hero-r45__output hero-r45__output--2" data-r45-output="2"><i></i><b></b></div>
      <div class="hero-r45__output hero-r45__output--3" data-r45-output="3"><i></i><b></b></div>
    </div>

    <div class="hero-r43__floor" data-r45-floor></div>
    <div class="hero-r43__reflection" data-r45-reflection></div>
    <div class="hero-r43__volumetric" data-r45-volumetric></div>

    <div class="hero-r45__scene-plane hero-r45__scene-plane--front" data-r45-front>
      {% include hero-c-shape-r2/environment-r2.html %}
    </div>

    <div class="hero-r45__specular-response" data-r45-specular>
      <i class="hero-r45__edge-light hero-r45__edge-light--a" data-r45-edge="0"></i>
      <i class="hero-r45__edge-light hero-r45__edge-light--b" data-r45-edge="1"></i>
      <i class="hero-r45__edge-light hero-r45__edge-light--c" data-r45-edge="2"></i>
    </div>
  </div>
</div>

<picture class="hero-r45__mobile-master" aria-hidden="true">
  <source srcset="/assets/img/hero-c-shape/scene-r4-1-integrated-mobile.avif" type="image/avif" width="820" height="860">
  <img src="/assets/img/hero-c-shape/scene-r4-1-integrated-mobile.avif" width="820" height="860" alt="" decoding="async">
</picture>

<div class="hero-r43__grain" aria-hidden="true"></div>
