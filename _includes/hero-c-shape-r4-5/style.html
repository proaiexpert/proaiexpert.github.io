<style>
/* R4.5 — Layered 2.5D compositor correction.
   R4.4 remains the static/UI/material base. This layer removes the visible SVG-route language
   and separates rear architecture, internal glass/energy, foreground metal, specular response,
   and floor/reflection into source-registered depth planes. */

:root{
  --r45-entry:.08;
  --r45-glass:.055;
  --r45-field:.04;
  --r45-collector:.10;
  --r45-edge:.05;
}

/* Whole-raster card rotation is explicitly disabled in R4.5. Depth comes from registered layers. */

  z-index:2;
  transform:none;
  transition:none;
}

.hero-r45__source-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  transform-origin:58% 52%;
  will-change:transform,opacity;
}
.hero-r45__source-layer .hero-cshape__scene-picture,
.hero-r45__source-layer .hero-cshape__scene-picture img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
.hero-r45__source-layer .hero-cshape__scene-picture img{
  object-fit:contain;
  object-position:center;
  filter:saturate(.93) contrast(1.045) brightness(.975);
}

/* Rear architecture: darker, slower plane. Mask is registered to actual upper/lower rear masses. */
.hero-r45__source-layer--back{
  z-index:1;
  opacity:.74;
  filter:brightness(.86) saturate(.88);
  -webkit-mask-image:
    radial-gradient(ellipse 28% 19% at 57% 39%,#000 0 52%,rgba(0,0,0,.82) 67%,transparent 86%),

    radial-gradient(ellipse 29% 19% at 59% 60%,#000 0 48%,rgba(0,0,0,.76) 66%,transparent 86%);
}

/* Internal glass/tunnel layer: only the real open/intelligence zone can brighten. */
.hero-r45__source-layer--glass{
  z-index:3;

  mix-blend-mode:screen;

    radial-gradient(ellipse 26% 17% at 59% 48%,#000 0 36%,rgba(0,0,0,.84) 56%,transparent 84%),

}

html.hero-r45-static .hero-r45__output-field,

}

@media (prefers-reduced-motion:reduce){
  .hero-r45__impulse,.hero-r45__depth-packet,.hero-r45__microstream,.hero-r45__chamber{display:none!important}
  .hero-r45__source-layer,.hero-r43__physical-scene,.hero-r43__floor,.hero-r43__reflection{transform:none!important;transition:none!important}
}
