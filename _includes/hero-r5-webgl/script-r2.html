<script>
(() => {
'use strict';
const canvas=document.querySelector('[data-r5-canvas]'),wrap=document.querySelector('[data-r5-canvas-wrap]'),rail=[...document.querySelectorAll('[data-r5-rail]')];if(!canvas||!wrap)return;
const gl=canvas.getContext('webgl2',{antialias:false,alpha:true,premultipliedAlpha:false,powerPreference:'high-performance'});if(!gl){wrap.dataset.error='webgl2-unavailable';return;}
const params=new URLSearchParams(location.search),fixed=params.has('frame')?Number(params.get('frame')):null,reduced=matchMedia?.('(prefers-reduced-motion: reduce)').matches,staticMode=Number.isFinite(fixed)||params.get('mode')==='static'||reduced;
const vert=`#version 300 es
in vec2 aPosition;void main(){gl_Position=vec4(aPosition,0.,1.);}`;
const frag=`#version 300 es
precision highp float;out vec4 outColor;uniform vec2 uResolution;uniform float uTime;uniform vec2 uMouse;
#define MAX_STEPS 104
#define FAR 16.0
#define EPS .0013
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}float hash21(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash21(i.xy+i.z*17.);float b=hash21(i.xy+vec2(1,0)+i.z*17.);float c=hash21(i.xy+vec2(0,1)+i.z*17.);float d=hash21(i.xy+vec2(1,1)+i.z*17.);return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float rb(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return min(max(q.x,max(q.y,q.z)),0.)+length(max(q,0.))-r;}
float ring3(vec3 p,float R,float w,float z){float d2=abs(length(p.xy)-R)-w;vec2 q=vec2(d2,abs(p.z)-z);return min(max(q.x,q.y),0.)+length(max(q,0.));}
vec2 pk(vec2 a,vec2 b){return a.x<b.x?a:b;}vec3 os(vec3 p){p.xz=rot(-.31)*p.xz;p.yz=rot(.075)*p.yz;p.x+=.10;return p;}
vec2 mapS(vec3 p){vec3 q=os(p);vec2 r=vec2(99.,0.);float cut=rb(q-vec3(1.25,0,0),vec3(.93,.50,.74),.11);float outer=max(ring3(q,1.26,.34,.50),-cut);r=pk(r,vec2(outer,1.));float innerCut=rb(q-vec3(1.15,0,0),vec3(.86,.58,.60),.10);float glass=max(ring3(q,0.82,.105,.31),-innerCut);r=pk(r,vec2(glass,2.));float chamber=rb(q-vec3(.02,0,.0),vec3(.33,.47,.28),.16);r=pk(r,vec2(chamber,2.));float emit=max(ring3(q,0.82,.032,.13),-innerCut);r=pk(r,vec2(emit,3.));float slitA=rb(q-vec3(.99,.74,.49),vec3(.34,.028,.018),.012);float slitB=rb(q-vec3(.99,-.74,.49),vec3(.34,.028,.018),.012);r=pk(r,vec2(slitA,5.));r=pk(r,vec2(slitB,5.));float floorD=p.y+1.82;r=pk(r,vec2(floorD,4.));return r;}
vec3 nor(vec3 p){vec2 e=vec2(EPS,0);float d=mapS(p).x;return normalize(vec3(mapS(p+e.xyy).x-d,mapS(p+e.yxy).x-d,mapS(p+e.yyx).x-d));}vec2 march(vec3 ro,vec3 rd){float t=0.,id=0.;for(int i=0;i<MAX_STEPS;i++){vec2 h=mapS(ro+rd*t);if(h.x<EPS||t>FAR){id=h.y;break;}t+=max(h.x*.76,.005);}return vec2(t,id);}float shadow(vec3 ro,vec3 rd,float maxT){float res=1.,t=.025;for(int i=0;i<38;i++){float h=mapS(ro+rd*t).x;res=min(res,14.*h/t);t+=clamp(h,.018,.16);if(h<EPS||t>maxT)break;}return clamp(res,0.,1.);}float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=0;i<5;i++){float h=.04+.11*float(i);o+=(h-mapS(p+n*h).x)*s;s*=.66;}return clamp(1.-o*1.5,0.,1.);}vec3 env(vec3 rd){float v=.5+.5*rd.y;vec3 c=mix(vec3(.008,.012,.014),vec3(.030,.047,.052),pow(v,1.25));c+=vec3(.022,.065,.072)*pow(max(dot(rd,normalize(vec3(-.25,.10,-1.))),0.),9.);return c;}
vec3 metal(vec3 p,vec3 n,vec3 ro){vec3 base=vec3(.055,.071,.075)*(1.+(n3(p*7.5)-.5)*.13);vec3 l=normalize(vec3(-2.2,5.0,4.5)-p),f=normalize(vec3(4.0,.4,2.5)-p),w=normalize(vec3(-3.,1.5,-2.)-p),v=normalize(ro-p),h=normalize(l+v);float sh=shadow(p+n*.014,l,8.),A=ao(p,n),nd=max(dot(n,l),0.),nf=max(dot(n,f),0.);float s1=pow(max(dot(n,h),0.),82.)*.88+pow(max(dot(n,h),0.),22.)*.12;float fres=pow(1.-max(dot(n,v),0.),4.);return base*(.20+nd*.76*sh+nf*.22)*A+vec3(.80,.94,.96)*s1*sh+vec3(.10,.48,.54)*fres*.15+vec3(.32,.19,.10)*max(dot(n,w),0.)*.12;}
float pulse(float t,float c,float w){return exp(-pow((t-c)/w,2.));}float rp(vec3 ro,vec3 rd,vec3 p,float rad,float maxT){float t=dot(p-ro,rd);if(t<0.||t>maxT)return 0.;float d=length(ro+rd*t-p);return exp(-d*d/(rad*rad));}
vec3 shade(vec3 ro,vec3 rd,float t,float id){vec3 p=ro+rd*t,n=nor(p);if(id<1.5)return metal(p,n,ro);if(id<2.5){vec3 v=normalize(ro-p);float fr=pow(1.-abs(dot(n,v)),3.);float ph=.5+.5*sin(uTime*1.4+p.x*2.8+p.y*1.6);return mix(env(rd),vec3(.027,.14,.17),.28)+vec3(.13,.65,.72)*(fr*.16+ph*.025);}if(id<3.5){return vec3(.10,.66,.75)+vec3(.25,.82,.88)*(.18+.12*sin(uTime*2.+p.x*4.));}if(id<4.5){float f=exp(-length(p.xz)*.23);return mix(env(rd),vec3(.010,.016,.018)+vec3(.022,.070,.077)*f,f*.45);}return vec3(.11,.45,.49)+vec3(.28,.75,.80)*pow(max(dot(n,normalize(ro-p)),0.),10.)*.24;}
void main(){vec2 uv=(gl_FragCoord.xy*2.-uResolution.xy)/uResolution.y;vec2 m=(uMouse-.5)*2.;float dx=.012*sin(uTime*.17)+m.x*.018,dy=.009*sin(uTime*.13+1.1)+m.y*.012;vec3 ro=vec3(3.75+dx,1.20+dy,5.05),ta=vec3(.02,-.02,0.);vec3 ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);vec3 rd=normalize(uu*uv.x+vv*uv.y+ww*1.78);vec2 hit=march(ro,rd);float th=min(hit.x,FAR);vec3 col=env(rd);if(hit.x<FAR)col=shade(ro,rd,hit.x,hit.y);float tt=mod(uTime,12.8),proc=pulse(tt,4.6,1.15)+pulse(tt,5.55,.70)*.8;vec3 cy=vec3(.16,.82,.91);
float p0=clamp((tt-1.95)/3.3,0.,1.),p1=clamp((tt-2.15)/3.25,0.,1.),p2=clamp((tt-2.34)/3.25,0.,1.);vec3 a0=vec3(-1.72,.08,.20)+vec3(1.72,-.02,-.15)*p0;vec3 a1=vec3(-1.88,-.16,-.05)+vec3(1.93,.14,.11)*p1;vec3 a2=vec3(-1.78,.25,.02)+vec3(1.83,-.24,.06)*p2;col+=cy*(rp(ro,rd,a0,.072,th+.4)+rp(ro,rd,a1,.066,th+.4)+rp(ro,rd,a2,.060,th+.4))*(.10+.18*proc);
for(int i=0;i<5;i++){float fi=float(i);float ang=uTime*(.55+.07*fi)+fi*1.37;vec3 pp=vec3(.02+cos(ang)*(.25+.025*fi),sin(ang)*(.28+.018*fi),sin(ang*1.7)*.18);col+=cy*rp(ro,rd,pp,.052,th+.55)*proc*.20;}
float ch=rp(ro,rd,vec3(.02,0,0),.48,th+.65);col+=vec3(.04,.30,.34)*ch*.08*proc;float ob=6.15;for(int i=0;i<4;i++){float yi=.42-float(i)*.28,pv=pulse(tt,ob+float(i)*.36,.19);vec3 op=vec3(1.57,yi,.02);col+=cy*rp(ro,rd,op,.063,th+.2)*pv*.55;}
float floorGlow=exp(-abs(uv.y+.67)*10.)*exp(-pow((uv.x+.02)*.66,2.));col+=vec3(.022,.115,.13)*floorGlow*(.17+.28*proc);float vig=1.-smoothstep(.58,1.48,length(uv*vec2(.72,1.)));col*=.72+.28*vig;col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);col=pow(max(col,0.),vec3(.93));outColor=vec4(col,1.);}`;
function comp(t,s){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh)||'shader');return sh;}let pr;try{pr=gl.createProgram();gl.attachShader(pr,comp(gl.VERTEX_SHADER,vert));gl.attachShader(pr,comp(gl.FRAGMENT_SHADER,frag));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr)||'link');}catch(e){console.error(e);wrap.dataset.error='shader';return;}const vao=gl.createVertexArray();gl.bindVertexArray(vao);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const al=gl.getAttribLocation(pr,'aPosition');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);const ur=gl.getUniformLocation(pr,'uResolution'),ut=gl.getUniformLocation(pr,'uTime'),um=gl.getUniformLocation(pr,'uMouse');const mouse={x:.5,y:.5};let manual=null,start=performance.now();
function resize(){const r=canvas.getBoundingClientRect(),q=innerWidth<900?.72:.84,d=Math.min(devicePixelRatio||1,1.2)*q,w=Math.max(2,Math.round(r.width*d)),h=Math.max(2,Math.round(r.height*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}
function rs(t){const tt=((t%12.8)+12.8)%12.8;rail.forEach((e,i)=>{e.classList.remove('is-active','is-resolved');const s=6.15+i*.36;if(tt>=s&&tt<s+.5)e.classList.add('is-active');else if(tt>=s+.43&&tt<10.8)e.classList.add('is-resolved');});}
function render(t){resize();gl.useProgram(pr);gl.bindVertexArray(vao);gl.uniform2f(ur,canvas.width,canvas.height);gl.uniform1f(ut,t);gl.uniform2f(um,mouse.x,mouse.y);gl.drawArrays(gl.TRIANGLES,0,3);rs(t);}function loop(now){const t=manual!==null?manual:(staticMode?(Number.isFinite(fixed)?fixed:5.2):(now-start)/1000);render(t);if(manual===null&&!staticMode)requestAnimationFrame(loop);}window.__r5SetTime=t=>{manual=Number(t)||0;render(manual);};window.__r5Ready=true;if(matchMedia?.('(pointer:fine)').matches)addEventListener('pointermove',e=>{mouse.x=e.clientX/innerWidth;mouse.y=1-e.clientY/innerHeight;},{passive:true});requestAnimationFrame(()=>{render(staticMode?(Number.isFinite(fixed)?fixed:5.2):0);wrap.classList.add('is-ready');document.documentElement.classList.add('hero-r5-ready');requestAnimationFrame(loop);});
})();
</script>
