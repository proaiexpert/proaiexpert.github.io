<style>
:root{--r5-bg:#050607;--r5-cyan:#78eaff;--r5-muted:rgba(225,234,237,.66)}
html{background:var(--r5-bg);color-scheme:dark}
body.hero-r5-page{margin:0;min-width:0;min-height:100%;overflow-x:clip;background:radial-gradient(ellipse at 71% 54%,rgba(43,104,116,.055),transparent 45%),var(--r5-bg);color:#f7f9fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hero-r5-page *{box-sizing:border-box}
.hero-r5{position:relative;min-height:100svh;overflow:hidden;padding:clamp(124px,10vh,142px) clamp(30px,4vw,58px) 42px;isolation:isolate}
.hero-r5::before{content:"";position:absolute;z-index:-2;inset:0;background:radial-gradient(ellipse 58% 58% at 72% 55%,rgba(73,190,207,.055),rgba(28,72,81,.022) 43%,transparent 74%)}
.hero-r5__shell{position:relative;display:grid;grid-template-columns:minmax(0,.82fr) minmax(660px,1.18fr);align-items:center;gap:clamp(8px,1.4vw,22px);width:min(100%,1450px);min-height:calc(100svh - 184px);margin:0 auto}
.hero-r5__copy{position:relative;z-index:5;max-width:590px;padding-left:clamp(0px,.45vw,7px)}
.hero-r5__eyebrow{margin:0 0 19px;color:rgba(119,230,247,.84);font-size:13.2px;line-height:1.4;font-weight:650;letter-spacing:.058em;text-transform:uppercase}
.hero-r5__eyebrow::before{content:"";display:inline-block;width:25px;height:1px;margin:0 10px 4px 0;background:linear-gradient(90deg,rgba(119,230,247,.88),rgba(119,230,247,.12))}
.hero-r5__title{max-width:605px;margin:0;color:#f8fafb;font-size:clamp(46px,3.52vw,52px);line-height:1.012;font-weight:500;letter-spacing:-.051em;text-wrap:balance}
.hero-r5__title span{display:block}.hero-r5__title span+span{margin-top:.075em}
.hero-r5__lead{max-width:545px;margin:24px 0 0;color:var(--r5-muted);font-size:15.1px;line-height:1.7;letter-spacing:-.004em}
.hero-r5__actions{display:flex;align-items:flex-start;gap:18px 22px;margin-top:28px}.hero-r5__primary{width:min(100%,314px)}
.hero-r5__btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:54px;color:#fff;font-size:13px;font-weight:700;text-decoration:none}.hero-r5__btn--primary{width:100%;justify-content:space-between;gap:15px;padding:0 14px 0 19px;border:1px solid rgba(113,222,237,.48);border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.006) 60%,rgba(0,0,0,.06)),rgba(8,11,13,.84);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 16px 38px rgba(0,0,0,.27)}
.hero-r5__arrow{display:grid;place-items:center;width:28px;height:28px;border:1px solid rgba(116,225,239,.25);border-radius:50%;color:rgba(130,232,244,.92)}
.hero-r5__expect{max-width:308px;margin:10px 0 0;color:rgba(221,231,234,.65);font-size:12.3px;line-height:1.48}.hero-r5__btn--secondary{gap:9px;padding:0 3px;color:rgba(241,246,247,.72);white-space:nowrap}.hero-r5__account{margin:24px 0 0;color:rgba(222,232,235,.58);font-size:11.8px;line-height:1.5;letter-spacing:.018em}
.hero-r5__visual{position:relative;z-index:2;width:min(65vw,950px);justify-self:end;isolation:isolate;aspect-ratio:1160/900;transform:translateX(clamp(66px,5.5vw,88px))}
.hero-r5__visual::before{content:"";position:absolute;z-index:-2;inset:8% -7% 2% -17%;background:radial-gradient(ellipse at 56% 55%,rgba(74,177,193,.07),rgba(27,73,83,.026) 42%,transparent 73%);filter:blur(34px)}
.hero-r5__visual::after{content:"";position:absolute;z-index:-1;left:15%;right:4%;bottom:3%;height:19%;background:radial-gradient(ellipse at center,rgba(77,191,207,.10),rgba(37,87,97,.035) 42%,transparent 73%);filter:blur(24px)}
.hero-r5__canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hero-r5__canvas-wrap{position:absolute;inset:0;overflow:visible;opacity:0;transition:opacity .18s ease}.hero-r5__canvas-wrap.is-ready{opacity:1}
.hero-r5__rail{position:absolute;z-index:5;top:34.5%;right:-.8%;width:220px;display:grid;gap:13px;margin:0;padding:0;list-style:none}.hero-r5__rail-item{position:relative;display:grid;grid-template-columns:35px 1fr;gap:12px;align-items:center;min-height:58px;padding:8px 8px 8px 17px;color:rgba(232,240,243,.56);font-size:11px;letter-spacing:.06em;transition:color .24s ease,text-shadow .24s ease,transform .24s ease}.hero-r5__rail-item span{color:rgba(119,222,236,.67);font-size:14.5px;font-weight:590;letter-spacing:.015em}.hero-r5__rail-item strong{font-weight:610}.hero-r5__rail-item::before{content:"";position:absolute;left:-8px;top:50%;width:5px;height:5px;border-radius:50%;transform:translateY(-50%);background:rgba(120,226,239,.28);transition:.24s ease}.hero-r5__rail-item::after{content:"";position:absolute;left:-3px;top:50%;width:20px;height:1px;background:linear-gradient(90deg,rgba(113,222,236,.18),transparent)}
.hero-r5__rail-item.is-active{color:rgba(250,253,254,.98);text-shadow:0 0 12px rgba(107,231,255,.09);transform:translateX(2px)}.hero-r5__rail-item.is-active::before{background:rgba(165,248,255,.98);box-shadow:0 0 11px rgba(107,231,255,.5);transform:translateY(-50%) scale(1.15)}.hero-r5__rail-item.is-resolved{color:rgba(238,245,247,.78)}
.hero-r5__status{position:absolute;left:7%;bottom:6%;z-index:4;color:rgba(198,218,222,.34);font-size:9px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}
@media(max-width:900px){.hero-r5{padding:106px 22px 26px}.hero-r5__shell{display:block;min-height:auto}.hero-r5__copy{max-width:none}.hero-r5__title{font-size:clamp(38px,11.7vw,46px)}.hero-r5__lead{font-size:14.6px;line-height:1.62}.hero-r5__actions{gap:14px}.hero-r5__visual{width:118vw;aspect-ratio:1/1;margin:20px 0 -18vw -18vw;transform:none}.hero-r5__rail{display:none}.hero-r5__status{display:none}.hero-r5__account{margin-top:19px}}
@media(prefers-reduced-motion:reduce){.hero-r5__canvas-wrap{transition:none}}
</style>
