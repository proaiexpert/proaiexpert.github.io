<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orchestration Prism Array</title>
<style>
:root{
  --bg:#03060b;
  --panel:#07111a;
  --panel2:#0b1521;
  --cyan:rgba(130,228,255,.92);
  --cyanSoft:rgba(130,228,255,.28);
  --ice:rgba(233,247,255,.96);
  --amber:rgba(236,188,119,.92);
  --amberSoft:rgba(236,188,119,.20);
  --line:rgba(173,225,255,.20);
  --lineSoft:rgba(173,225,255,.10);
  --text:#edf6ff;
  --muted:rgba(209,226,240,.58);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background: transparent;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background: transparent;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;}
.stage-wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:0; background:transparent;}
.stage{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%, rgba(91,190,255,.10), transparent 34%),radial-gradient(circle at 62% 54%, rgba(248,184,104,.05), transparent 44%);mix-blend-mode:screen;opacity:.42;}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,.012), transparent 22%, transparent 78%, rgba(255,255,255,.015));opacity:.7;}
canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.vignette{position:absolute; inset:0; pointer-events:none; border-radius:0; box-shadow: inset 0 0 140px rgba(0,0,0,.42)}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="vignette"></div>
  </div>
</div>
<script>

const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
const pointer = {x:0, y:0, tx:0, ty:0};
const TAU = Math.PI * 2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a + (b-a)*t;
const mix = (a,b,t)=>({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t), z:lerp(a.z,b.z,t)});
function resize(){
  const r = stage.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();
stage.addEventListener('pointermove', e=>{
  const r = stage.getBoundingClientRect();
  pointer.tx = ((e.clientX - r.left) / r.width - .5) * 2;
  pointer.ty = ((e.clientY - r.top) / r.height - .5) * 2;
});
stage.addEventListener('pointerleave', ()=>{pointer.tx=0; pointer.ty=0;});
function vec(x=0,y=0,z=0){ return {x,y,z}; }
function add(a,b){ return {x:a.x+b.x, y:a.y+b.y, z:a.z+b.z}; }
function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y, z:a.z-b.z}; }
function mul(a,s){ return {x:a.x*s, y:a.y*s, z:a.z*s}; }
function rotX(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x, y:p.y*c-p.z*s, z:p.y*s+p.z*c}; }
function rotY(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c+p.z*s, y:p.y, z:-p.x*s+p.z*c}; }
function rotZ(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c-p.y*s, y:p.x*s+p.y*c, z:p.z}; }
function project(p, dist=660, scale=1){
  const z = dist / (dist + p.z);
  return {x:W*0.5 + p.x*z*scale, y:H*0.5 + p.y*z*scale, z:p.z, s:z};
}
function roundedQuad(points, radius){
  const [a,b,c,d] = points;
  ctx.beginPath();
  const pts = [a,b,c,d];
  for(let i=0;i<4;i++){
    const prev = pts[(i+3)%4], cur = pts[i], next = pts[(i+1)%4];
    const v1 = {x:cur.x-prev.x, y:cur.y-prev.y};
    const v2 = {x:cur.x-next.x, y:cur.y-next.y};
    const l1 = Math.hypot(v1.x,v1.y)||1, l2=Math.hypot(v2.x,v2.y)||1;
    const r = Math.min(radius, l1*.35, l2*.35);
    const p1 = {x:cur.x - v1.x/l1*r, y:cur.y - v1.y/l1*r};
    const p2 = {x:cur.x - v2.x/l2*r, y:cur.y - v2.y/l2*r};
    if(i===0) ctx.moveTo(p1.x,p1.y); else ctx.lineTo(p1.x,p1.y);
    ctx.quadraticCurveTo(cur.x,cur.y,p2.x,p2.y);
  }
  ctx.closePath();
}
function strokeLine(a,b,color,w,blur){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  if(blur){ ctx.shadowBlur=blur; ctx.shadowColor=color; }
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
}
function fillCircle(p,r,color,blur=0){
  ctx.save(); ctx.fillStyle=color; if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill(); ctx.restore();
}
function drawGrid(alpha=.08){
  ctx.save();
  ctx.strokeStyle='rgba(122,184,223,'+alpha+')';
  ctx.lineWidth=1;
  for(let x=40;x<W;x+=44){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=34;y<H;y+=44){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}
function bezier(a,b,c,d,t){
  const mt = 1-t;
  return {
    x: mt*mt*mt*a.x + 3*mt*mt*t*b.x + 3*mt*t*t*c.x + t*t*t*d.x,
    y: mt*mt*mt*a.y + 3*mt*mt*t*b.y + 3*mt*t*t*c.y + t*t*t*d.y
  };
}
function linePath(points, color, width, blur=0){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
  if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke(); ctx.restore();
}
function glowText(text,x,y,color){
  ctx.save(); ctx.font='600 10px Inter, sans-serif'; ctx.letterSpacing='2px';
  ctx.fillStyle=color; ctx.shadowBlur=12; ctx.shadowColor=color; ctx.fillText(text,x,y); ctx.restore();
}

const nodes = [
  vec(-160,-118,-70), vec(0,-148,-30), vec(168,-116,-65),
  vec(-198,10,18), vec(-58,-24,72), vec(74,-18,92), vec(208,12,14),
  vec(-148,128,-46), vec(0,148,-4), vec(146,126,-38)
];
const routes = [[0,1],[1,2],[0,4],[1,4],[1,5],[2,5],[3,4],[4,5],[5,6],[3,7],[4,8],[5,8],[6,9],[7,8],[8,9],[4,5],[0,3],[2,6]];
const dust = Array.from({length:36}, (_,i)=>([
  Math.random()*2-1,
  Math.random()*2-1,
  Math.random()*2-1,
  Math.random()*TAU
]));
function panelQuad(cx,cy,w,h,skew,depth){
  return [
    vec(cx-w*0.5+skew, cy-h*0.5, depth),
    vec(cx+w*0.5+skew, cy-h*0.5, depth),
    vec(cx+w*0.5-skew, cy+h*0.5, depth),
    vec(cx-w*0.5-skew, cy+h*0.5, depth)
  ];
}
const slabs = [
  {q:panelQuad(0,0,186,138,20,6), tint:'rgba(12,25,42,.46)', edge:'rgba(226,244,255,.42)'},
  {q:panelQuad(0,0,124,88,16,34), tint:'rgba(19,50,80,.32)', edge:'rgba(150,234,255,.58)'}
];
function render(t){
  requestAnimationFrame(render);
  pointer.x = lerp(pointer.x, pointer.tx, .05);
  pointer.y = lerp(pointer.y, pointer.ty, .05);
  ctx.clearRect(0,0,W,H);
  drawGrid(.038);
  const time = t*0.001;
  const swayX = pointer.x*18;
  const swayY = pointer.y*14;

  ctx.save();
  const glow = ctx.createRadialGradient(W*0.54, H*0.48, 20, W*0.54, H*0.48, W*0.34);
  glow.addColorStop(0,'rgba(104,210,255,.16)');
  glow.addColorStop(.55,'rgba(38,107,156,.08)');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  const camRX = -0.34 + pointer.y*0.06;
  const camRY = 0.54 + Math.sin(time*0.22)*0.12 + pointer.x*0.10;
  const camRZ = Math.sin(time*0.16)*0.03;
  function xf(p){
    let q = add(p, vec(swayX, swayY + Math.sin(time*0.6 + p.x*.01)*2.5, 0));
    q = rotX(q, camRX); q = rotY(q, camRY); q = rotZ(q, camRZ);
    return project(q, 690, 0.82);
  }

  slabs.forEach((slab, i)=>{
    const drift = Math.sin(time*0.42 + i*1.2)*7;
    const lifted = slab.q.map(p=> add(p, vec(Math.sin(time*0.5+i)*7, drift, Math.cos(time*0.4+i)*6)));
    const pts = lifted.map(xf);
    roundedQuad(pts, 14);
    ctx.save();
    const g = ctx.createLinearGradient(pts[0].x,pts[0].y,pts[2].x,pts[2].y);
    g.addColorStop(0, slab.tint);
    g.addColorStop(.45, 'rgba(12,20,33,.16)');
    g.addColorStop(1, 'rgba(0,0,0,.08)');
    ctx.fillStyle = g;
    ctx.shadowBlur = 36;
    ctx.shadowColor = 'rgba(36,112,164,.18)';
    ctx.fill();
    ctx.restore();
    roundedQuad(pts, 14);
    ctx.strokeStyle = slab.edge;
    ctx.lineWidth = i===0?1.4:1.1;
    ctx.shadowBlur = 18; ctx.shadowColor = slab.edge;
    ctx.stroke(); ctx.shadowBlur = 0;
    linePath([mix(pts[0],pts[1],.18), mix(pts[0],pts[3],.18), mix(pts[2],pts[3],.52)], 'rgba(255,255,255,.06)', .8);
  });

  const projected = nodes.map((p,i)=> xf(add(p, vec(Math.sin(time*0.4+i)*4, Math.cos(time*0.36+i*1.4)*4, Math.sin(time*0.25+i)*10))));
  routes.forEach((r,idx)=>{
    const a = projected[r[0]], b = projected[r[1]];
    const m = {x:(a.x+b.x)*.5 + Math.sin(time*0.42+idx)*12, y:(a.y+b.y)*.5 + Math.cos(time*0.36+idx*1.2)*8};
    const c1 = {x:lerp(a.x,m.x,.55), y:lerp(a.y,m.y,.62)};
    const c2 = {x:lerp(b.x,m.x,.55), y:lerp(b.y,m.y,.62)};
    ctx.save();
    ctx.strokeStyle='rgba(122,202,245,.18)'; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,b.x,b.y); ctx.stroke();
    const tt = (time*0.06 + idx*0.11)%1;
    const p = bezier(a,c1,c2,b,tt);
    fillCircle(p, 2.1, 'rgba(178,241,255,.82)', 12);
    ctx.restore();
  });

  projected.forEach((p,i)=>{
    const flick = 0.55 + 0.45*Math.max(0, Math.sin(time*0.8 + i*2.2));
    fillCircle(p, 4.6, 'rgba(12,23,34,.78)');
    fillCircle(p, 3.2, 'rgba(160,228,255,'+(0.46+flick*0.3)+')', 12);
    fillCircle(p, 1.3, 'rgba(245,251,255,'+(0.7+flick*0.25)+')');
  });

  for(let i=0;i<dust.length;i++){
    const d = dust[i];
    const p = xf(vec(d[0]*235, d[1]*150, d[2]*140 + Math.sin(time*0.2+d[3])*18));
    fillCircle(p, 0.8 + (i%3)*0.2, 'rgba(185,231,255,'+(0.06 + 0.08*Math.sin(time*0.3+d[3])**2)+')', 4);
  }

  const spine = [xf(vec(0,-116,-8)), xf(vec(0,0,14)), xf(vec(0,116,-8))];
  linePath(spine, 'rgba(210,243,255,.22)', 1.1, 8);
  fillCircle(spine[1], 5, 'rgba(178,235,255,.54)', 18);
}
requestAnimationFrame(render);

</script>
</body>
</html>
