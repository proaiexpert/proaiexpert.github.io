<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Routed Mesh Nucleus</title>
<style>
:root{
  --bg:#03060b;
  --panel:#07111a;
  --panel2:#0b1521;
  --cyan:rgba(130,228,255,.92);
  --cyanSoft:rgba(130,228,255,.28);
  --ice:rgba(233,247,255,.96);
  --amber:rgba(236,188,119,.92);
  --amberSoft:rgba(236,188,119,.20);
  --line:rgba(173,225,255,.20);
  --lineSoft:rgba(173,225,255,.10);
  --text:#edf6ff;
  --muted:rgba(209,226,240,.58);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background: transparent;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background: transparent;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;}
.stage-wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:18px; background:transparent;}
.stage{
  position:relative;
  width:min(100%, 720px);
  aspect-ratio: 16 / 11;
  overflow:hidden;
  border-radius:32px;
  background:
    radial-gradient(140% 120% at 50% 18%, rgba(15,31,50,.84), rgba(7,12,21,.92) 46%, rgba(2,4,8,.98) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.065),
    inset 0 0 0 1px rgba(145,188,220,.11),
    inset 0 -80px 150px rgba(0,0,0,.58),
    0 44px 130px rgba(0,0,0,.62);
}
.stage::before{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 42%, rgba(91,190,255,.11), transparent 28%),
    radial-gradient(circle at 50% 58%, rgba(248,184,104,.055), transparent 52%),
    linear-gradient(145deg, rgba(255,255,255,.07), transparent 18%, transparent 78%, rgba(255,255,255,.03));
  mix-blend-mode:screen;
  opacity:.55;
  pointer-events:none;
}
.stage::after{
  content:"";
  position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.02), transparent 24%, transparent 78%, rgba(255,255,255,.025)),
    radial-gradient(80% 120% at 50% -8%, rgba(255,255,255,.05), transparent 54%);
  pointer-events:none;
}
canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.vignette{position:absolute; inset:-10%; pointer-events:none; border-radius:38px; box-shadow: inset 0 0 190px rgba(0,0,0,.58)}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="vignette"></div>
  </div>
</div>
<script>

const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
const pointer = {x:0, y:0, tx:0, ty:0};
const TAU = Math.PI * 2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a + (b-a)*t;
const mix = (a,b,t)=>({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t), z:lerp(a.z,b.z,t)});
function resize(){
  const r = stage.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();
stage.addEventListener('pointermove', e=>{
  const r = stage.getBoundingClientRect();
  pointer.tx = ((e.clientX - r.left) / r.width - .5) * 2;
  pointer.ty = ((e.clientY - r.top) / r.height - .5) * 2;
});
stage.addEventListener('pointerleave', ()=>{pointer.tx=0; pointer.ty=0;});
function vec(x=0,y=0,z=0){ return {x,y,z}; }
function add(a,b){ return {x:a.x+b.x, y:a.y+b.y, z:a.z+b.z}; }
function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y, z:a.z-b.z}; }
function mul(a,s){ return {x:a.x*s, y:a.y*s, z:a.z*s}; }
function rotX(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x, y:p.y*c-p.z*s, z:p.y*s+p.z*c}; }
function rotY(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c+p.z*s, y:p.y, z:-p.x*s+p.z*c}; }
function rotZ(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c-p.y*s, y:p.x*s+p.y*c, z:p.z}; }
function project(p, dist=660, scale=1){
  const z = dist / (dist + p.z);
  return {x:W*0.5 + p.x*z*scale, y:H*0.5 + p.y*z*scale, z:p.z, s:z};
}
function roundedQuad(points, radius){
  const [a,b,c,d] = points;
  ctx.beginPath();
  const pts = [a,b,c,d];
  for(let i=0;i<4;i++){
    const prev = pts[(i+3)%4], cur = pts[i], next = pts[(i+1)%4];
    const v1 = {x:cur.x-prev.x, y:cur.y-prev.y};
    const v2 = {x:cur.x-next.x, y:cur.y-next.y};
    const l1 = Math.hypot(v1.x,v1.y)||1, l2=Math.hypot(v2.x,v2.y)||1;
    const r = Math.min(radius, l1*.35, l2*.35);
    const p1 = {x:cur.x - v1.x/l1*r, y:cur.y - v1.y/l1*r};
    const p2 = {x:cur.x - v2.x/l2*r, y:cur.y - v2.y/l2*r};
    if(i===0) ctx.moveTo(p1.x,p1.y); else ctx.lineTo(p1.x,p1.y);
    ctx.quadraticCurveTo(cur.x,cur.y,p2.x,p2.y);
  }
  ctx.closePath();
}
function strokeLine(a,b,color,w,blur){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  if(blur){ ctx.shadowBlur=blur; ctx.shadowColor=color; }
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
}
function fillCircle(p,r,color,blur=0){
  ctx.save(); ctx.fillStyle=color; if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill(); ctx.restore();
}
function drawGrid(alpha=.08){
  ctx.save();
  ctx.strokeStyle='rgba(122,184,223,'+alpha+')';
  ctx.lineWidth=1;
  for(let x=40;x<W;x+=44){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=34;y<H;y+=44){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}
function bezier(a,b,c,d,t){
  const mt = 1-t;
  return {
    x: mt*mt*mt*a.x + 3*mt*mt*t*b.x + 3*mt*t*t*c.x + t*t*t*d.x,
    y: mt*mt*mt*a.y + 3*mt*mt*t*b.y + 3*mt*t*t*c.y + t*t*t*d.y
  };
}
function linePath(points, color, width, blur=0){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
  if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke(); ctx.restore();
}
function glowText(text,x,y,color){
  ctx.save(); ctx.font='600 10px Inter, sans-serif'; ctx.letterSpacing='2px';
  ctx.fillStyle=color; ctx.shadowBlur=12; ctx.shadowColor=color; ctx.fillText(text,x,y); ctx.restore();
}

const anchors = [];
for(let ring=0; ring<3; ring++){
  const count = 8 + ring*2;
  for(let i=0;i<count;i++){
    const a = TAU * i / count + ring*0.18;
    const r = 96 + ring*48;
    anchors.push(vec(Math.cos(a)*r, Math.sin(a)*(48+ring*24), Math.sin(a*2.1)*38 + (ring-1)*30));
  }
}
const mesh = [];
for(let i=0;i<anchors.length;i++){
  for(let j=i+1;j<anchors.length;j++){
    const dx = anchors[i].x-anchors[j].x, dy = anchors[i].y-anchors[j].y, dz = anchors[i].z-anchors[j].z;
    const d = Math.hypot(dx,dy,dz);
    if(d < 92) mesh.push([i,j,d]);
  }
}
const nucleus = [
  vec(-54,-36,-28), vec(0,-60,10), vec(56,-34,-18), vec(74,12,18), vec(32,62,40),
  vec(-28,70,22), vec(-72,18,-8), vec(0,8,-62)
];
const facets = [[0,1,7],[1,2,7],[2,3,7],[3,4,7],[4,5,7],[5,6,7],[6,0,7],[0,1,2],[2,3,4],[4,5,6],[6,0,5]];
const dust = Array.from({length:58}, (_,i)=>({a:Math.random()*TAU, r:120+Math.random()*95, y:(Math.random()-.5)*160, s:Math.random()*0.9+.2}));
function render(t){
  requestAnimationFrame(render);
  pointer.x = lerp(pointer.x, pointer.tx, .05);
  pointer.y = lerp(pointer.y, pointer.ty, .05);
  ctx.clearRect(0,0,W,H);
  drawGrid(.03);
  const time = t*0.001;
  ctx.save();
  const g = ctx.createRadialGradient(W*0.52,H*0.48,20,W*0.52,H*0.48,W*.33);
  g.addColorStop(0,'rgba(110,224,255,.14)'); g.addColorStop(.42,'rgba(40,120,164,.08)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H); ctx.restore();

  const camRX = -0.5 + pointer.y*0.05;
  const camRY = 0.75 + Math.sin(time*0.18)*0.12 + pointer.x*0.08;
  const camRZ = Math.sin(time*0.11)*0.02;
  function xf(p){
    let q = rotY(p, camRY); q = rotX(q, camRX); q = rotZ(q, camRZ);
    q = add(q, vec(pointer.x*15, pointer.y*12, 0));
    return project(q, 720, 1);
  }

  const nPts = nucleus.map((p,i)=>xf(add(p, vec(Math.sin(time*0.4+i)*2.8, Math.cos(time*0.34+i)*2.8, Math.sin(time*0.3+i)*5.5))));
  const facetDepth = facets.map((f,idx)=>({f, idx, z:(nPts[f[0]].z+nPts[f[1]].z+nPts[f[2]].z)/3})).sort((a,b)=>a.z-b.z);
  facetDepth.forEach(({f,idx})=>{
    ctx.save();
    ctx.beginPath(); ctx.moveTo(nPts[f[0]].x,nPts[f[0]].y); ctx.lineTo(nPts[f[1]].x,nPts[f[1]].y); ctx.lineTo(nPts[f[2]].x,nPts[f[2]].y); ctx.closePath();
    const gr = ctx.createLinearGradient(nPts[f[0]].x,nPts[f[0]].y,nPts[f[2]].x,nPts[f[2]].y);
    gr.addColorStop(0,'rgba(12,24,37,.58)'); gr.addColorStop(.55, idx%2 ? 'rgba(18,53,76,.20)' : 'rgba(10,34,52,.26)'); gr.addColorStop(1,'rgba(4,8,14,.10)');
    ctx.fillStyle = gr; ctx.shadowBlur = 22; ctx.shadowColor = 'rgba(53,135,184,.12)'; ctx.fill();
    ctx.strokeStyle = idx%3===0 ? 'rgba(202,238,255,.22)' : 'rgba(129,215,246,.22)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  });

  const projected = anchors.map((p,i)=>xf(add(p, vec(Math.sin(time*0.21+i*.31)*3, Math.cos(time*0.18+i*.41)*3, Math.sin(time*0.14+i)*7))));
  mesh.forEach((m, idx)=>{
    const a = projected[m[0]], b = projected[m[1]];
    const strength = clamp(1 - m[2] / 92, 0, 1);
    strokeLine(a,b,'rgba(132,213,244,'+(0.07+strength*0.11)+')', .7+strength*.6, 0);
    if(idx % 7 === 0){
      const tt = (time*0.05 + idx*0.03)%1;
      const x = lerp(a.x,b.x,tt), y = lerp(a.y,b.y,tt);
      fillCircle({x,y}, 1.5, 'rgba(202,244,255,.62)', 10);
    }
  });

  const hubRoutes = [0,5,10,15,20,25].filter(i=>i<projected.length);
  hubRoutes.forEach((idx,k)=>{
    const a = projected[idx], b = nPts[k%nPts.length];
    const c1 = {x:lerp(a.x, W*.5, .42)+Math.sin(time*.6+k)*16, y:lerp(a.y, H*.5, .22)};
    const c2 = {x:lerp(b.x, W*.5, .45), y:lerp(b.y, H*.5, .45)+Math.cos(time*.5+k)*12};
    ctx.save();
    ctx.strokeStyle='rgba(177,233,255,.19)'; ctx.lineWidth=1.05;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,b.x,b.y); ctx.stroke();
    const tt = (time*0.08 + k*.16)%1; const p = bezier(a,c1,c2,b,tt);
    fillCircle(p, 2.1, 'rgba(196,242,255,.86)', 12); ctx.restore();
  });

  projected.forEach((p,i)=>{
    const core = i%5===0;
    fillCircle(p, core?2.8:1.9, core?'rgba(149,229,255,.55)':'rgba(132,202,228,.34)', core?12:8);
    fillCircle(p, .95, 'rgba(244,251,255,.78)');
  });

  for(const d of dust){
    const p3 = vec(Math.cos(d.a + time*0.03*d.s)*d.r, d.y + Math.sin(time*0.2+d.a)*8, Math.sin(d.a + time*0.03*d.s)*d.r*0.35);
    const p = xf(p3);
    fillCircle(p, d.s, 'rgba(200,236,252,.08)', 4);
  }

  const halo = ctx.createRadialGradient(W*.5,H*.5,18,W*.5,H*.5,110);
  halo.addColorStop(0,'rgba(161,233,255,.20)'); halo.addColorStop(.58,'rgba(36,118,158,.06)'); halo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(W*.5,H*.5,118,0,TAU); ctx.fill();
}
requestAnimationFrame(render);

</script>
</body>
</html>
