<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Editorial Surface Lattice</title>
<style>
:root{
  --bg:#03060b;
  --panel:#07111a;
  --panel2:#0b1521;
  --cyan:rgba(130,228,255,.92);
  --cyanSoft:rgba(130,228,255,.28);
  --ice:rgba(233,247,255,.96);
  --amber:rgba(236,188,119,.92);
  --amberSoft:rgba(236,188,119,.20);
  --line:rgba(173,225,255,.20);
  --lineSoft:rgba(173,225,255,.10);
  --text:#edf6ff;
  --muted:rgba(209,226,240,.58);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background: transparent;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background: transparent;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;}
.stage-wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:0; background:transparent;}
.stage{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:0;
  background:transparent;
  box-shadow:none;
}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%, rgba(91,190,255,.10), transparent 34%),radial-gradient(circle at 62% 54%, rgba(248,184,104,.05), transparent 44%);mix-blend-mode:screen;opacity:.42;}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg, rgba(255,255,255,.012), transparent 22%, transparent 78%, rgba(255,255,255,.015));opacity:.7;}
canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.vignette{position:absolute; inset:0; pointer-events:none; border-radius:0; box-shadow: inset 0 0 140px rgba(0,0,0,.42)}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="vignette"></div>
  </div>
</div>
<script>

const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
const pointer = {x:0, y:0, tx:0, ty:0};
const TAU = Math.PI * 2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a + (b-a)*t;
const mix = (a,b,t)=>({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t), z:lerp(a.z,b.z,t)});
function resize(){
  const r = stage.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();
stage.addEventListener('pointermove', e=>{
  const r = stage.getBoundingClientRect();
  pointer.tx = ((e.clientX - r.left) / r.width - .5) * 2;
  pointer.ty = ((e.clientY - r.top) / r.height - .5) * 2;
});
stage.addEventListener('pointerleave', ()=>{pointer.tx=0; pointer.ty=0;});
function vec(x=0,y=0,z=0){ return {x,y,z}; }
function add(a,b){ return {x:a.x+b.x, y:a.y+b.y, z:a.z+b.z}; }
function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y, z:a.z-b.z}; }
function mul(a,s){ return {x:a.x*s, y:a.y*s, z:a.z*s}; }
function rotX(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x, y:p.y*c-p.z*s, z:p.y*s+p.z*c}; }
function rotY(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c+p.z*s, y:p.y, z:-p.x*s+p.z*c}; }
function rotZ(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c-p.y*s, y:p.x*s+p.y*c, z:p.z}; }
function project(p, dist=660, scale=1){
  const z = dist / (dist + p.z);
  return {x:W*0.5 + p.x*z*scale, y:H*0.5 + p.y*z*scale, z:p.z, s:z};
}
function roundedQuad(points, radius){
  const [a,b,c,d] = points;
  ctx.beginPath();
  const pts = [a,b,c,d];
  for(let i=0;i<4;i++){
    const prev = pts[(i+3)%4], cur = pts[i], next = pts[(i+1)%4];
    const v1 = {x:cur.x-prev.x, y:cur.y-prev.y};
    const v2 = {x:cur.x-next.x, y:cur.y-next.y};
    const l1 = Math.hypot(v1.x,v1.y)||1, l2=Math.hypot(v2.x,v2.y)||1;
    const r = Math.min(radius, l1*.35, l2*.35);
    const p1 = {x:cur.x - v1.x/l1*r, y:cur.y - v1.y/l1*r};
    const p2 = {x:cur.x - v2.x/l2*r, y:cur.y - v2.y/l2*r};
    if(i===0) ctx.moveTo(p1.x,p1.y); else ctx.lineTo(p1.x,p1.y);
    ctx.quadraticCurveTo(cur.x,cur.y,p2.x,p2.y);
  }
  ctx.closePath();
}
function strokeLine(a,b,color,w,blur){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  if(blur){ ctx.shadowBlur=blur; ctx.shadowColor=color; }
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
}
function fillCircle(p,r,color,blur=0){
  ctx.save(); ctx.fillStyle=color; if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill(); ctx.restore();
}
function drawGrid(alpha=.08){
  ctx.save();
  ctx.strokeStyle='rgba(122,184,223,'+alpha+')';
  ctx.lineWidth=1;
  for(let x=40;x<W;x+=44){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=34;y<H;y+=44){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}
function bezier(a,b,c,d,t){
  const mt = 1-t;
  return {
    x: mt*mt*mt*a.x + 3*mt*mt*t*b.x + 3*mt*t*t*c.x + t*t*t*d.x,
    y: mt*mt*mt*a.y + 3*mt*mt*t*b.y + 3*mt*t*t*c.y + t*t*t*d.y
  };
}
function linePath(points, color, width, blur=0){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
  if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke(); ctx.restore();
}
function glowText(text,x,y,color){
  ctx.save(); ctx.font='600 10px Inter, sans-serif'; ctx.letterSpacing='2px';
  ctx.fillStyle=color; ctx.shadowBlur=12; ctx.shadowColor=color; ctx.fillText(text,x,y); ctx.restore();
}

const panels = [
  {cx:-78, cy:-18, w:210, h:132, z:-22, sk:12},
  {cx:64, cy:-34, w:182, h:118, z:6, sk:10},
  {cx:-18, cy:54, w:244, h:126, z:26, sk:8}
];
const modules = [
  {x:-136,y:-46,w:68,h:44,z:18,t:'cyan'}, {x:-48,y:-46,w:104,h:18,z:18,t:'line'}, {x:74,y:-46,w:72,h:30,z:18,t:'amber'},
  {x:-136,y:4,w:88,h:18,z:18,t:'line'}, {x:-32,y:4,w:168,h:18,z:18,t:'line'},
  {x:-136,y:36,w:52,h:46,z:18,t:'cyan'}, {x:-70,y:36,w:106,h:46,z:18,t:'glass'}, {x:48,y:36,w:88,h:22,z:18,t:'amber'}
];
const lattice = [];
for(let x=-136;x<=136;x+=34) lattice.push([vec(x,-78,8), vec(x,86,8)]);
for(let y=-78;y<=86;y+=32) lattice.push([vec(-136,y,8), vec(136,y,8)]);
function quad(cx,cy,w,h,sk,z){ return [vec(cx-w*.5+sk,cy-h*.5,z), vec(cx+w*.5+sk,cy-h*.5,z), vec(cx+w*.5-sk,cy+h*.5,z), vec(cx-w*.5-sk,cy+h*.5,z)]; }
function render(t){
  requestAnimationFrame(render);
  pointer.x = lerp(pointer.x, pointer.tx, .05);
  pointer.y = lerp(pointer.y, pointer.ty, .05);
  ctx.clearRect(0,0,W,H);
  drawGrid(.022);
  const time = t*0.001;
  const glow = ctx.createRadialGradient(W*.54,H*.48,18,W*.54,H*.48,W*.34);
  glow.addColorStop(0,'rgba(101,214,255,.07)'); glow.addColorStop(.4,'rgba(237,190,122,.04)'); glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

  const camRX = -0.2 + pointer.y*0.03;
  const camRY = -0.2 + pointer.x*0.05 + Math.sin(time*0.1)*0.04;
  const camRZ = Math.sin(time*0.08)*0.008;
  function xf(p){
    let q = add(p, vec(Math.sin(time*0.12+p.y*.01)*1.6, Math.cos(time*0.14+p.x*.008)*1.6, 0));
    q = rotX(q, camRX); q = rotY(q, camRY); q = rotZ(q, camRZ);
    q = add(q, vec(pointer.x*8, pointer.y*7, 0));
    return project(q, 760, 1);
  }

  panels.forEach((p,idx)=>{
    const q = quad(p.cx + Math.sin(time*0.18+idx)*6, p.cy + Math.cos(time*0.21+idx)*5, p.w, p.h, p.sk, p.z + Math.sin(time*0.16+idx)*6);
    const pts = q.map(xf);
    roundedQuad(pts, 14);
    const grad = ctx.createLinearGradient(pts[0].x,pts[0].y,pts[2].x,pts[2].y);
    grad.addColorStop(0,'rgba(9,18,28,.46)'); grad.addColorStop(.55, idx===1?'rgba(19,28,38,.18)':'rgba(13,24,37,.18)'); grad.addColorStop(1,'rgba(255,255,255,.02)');
    ctx.fillStyle = grad; ctx.shadowBlur = 26; ctx.shadowColor = 'rgba(0,0,0,.24)'; ctx.fill();
    roundedQuad(pts, 14); ctx.strokeStyle = idx===1?'rgba(236,189,122,.22)':'rgba(128,214,245,.24)'; ctx.lineWidth=1.05; ctx.shadowBlur=14; ctx.shadowColor=ctx.strokeStyle; ctx.stroke(); ctx.shadowBlur=0;
  });

  lattice.forEach((seg, idx)=>{
    const a = xf(seg[0]), b = xf(seg[1]);
    strokeLine(a,b, idx<9?'rgba(128,214,245,.08)':'rgba(236,189,122,.05)', .85);
    if(idx % 5 === 0){
      const tt = (time*0.04 + idx*0.07)%1; fillCircle({x:lerp(a.x,b.x,tt), y:lerp(a.y,b.y,tt)}, 1.5, 'rgba(224,244,255,.42)', 8);
    }
  });

  modules.forEach((m, idx)=>{
    const q = quad(m.x + Math.sin(time*0.14+idx)*1.8, m.y + Math.cos(time*0.18+idx)*1.4, m.w, m.h, 4, m.z + Math.sin(time*0.12+idx)*3);
    const pts = q.map(xf);
    roundedQuad(pts, 8);
    let c0='rgba(255,255,255,.04)', c1='rgba(255,255,255,.02)', border='rgba(255,255,255,.05)';
    if(m.t==='cyan'){ c0='rgba(126,214,244,.17)'; c1='rgba(255,255,255,.03)'; border='rgba(135,226,255,.30)'; }
    if(m.t==='amber'){ c0='rgba(236,188,119,.16)'; c1='rgba(255,255,255,.03)'; border='rgba(236,188,119,.24)'; }
    if(m.t==='glass'){ c0='rgba(16,23,33,.18)'; c1='rgba(255,255,255,.02)'; border='rgba(210,234,247,.10)'; }
    const grad = ctx.createLinearGradient(pts[0].x,pts[0].y,pts[2].x,pts[2].y);
    grad.addColorStop(0,c0); grad.addColorStop(1,c1);
    ctx.fillStyle = grad; ctx.fill();
    roundedQuad(pts,8); ctx.strokeStyle=border; ctx.lineWidth=.9; ctx.stroke();
  });

  const guides = [
    [xf(vec(-136,-94,20)), xf(vec(-136,102,20)), xf(vec(156,102,20))],
    [xf(vec(156,-94,20)), xf(vec(156,102,20)), xf(vec(-136,102,20))]
  ];
  guides.forEach((g,idx)=>linePath(g, idx===0?'rgba(128,214,245,.08)':'rgba(236,189,122,.06)', .9));
  const softPass = (time*0.04)%1;
  const passA = {x:lerp(guides[0][0].x,guides[0][1].x,softPass), y:lerp(guides[0][0].y,guides[0][1].y,softPass)};
  fillCircle(passA, 2.1, 'rgba(216,246,255,.48)', 10);
}
requestAnimationFrame(render);

</script>
</body>
</html>
