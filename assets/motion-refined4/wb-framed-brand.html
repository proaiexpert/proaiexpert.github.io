<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Framed Brand Architecture</title>
<style>
:root{
  --bg:#03060b;
  --panel:#07111a;
  --panel2:#0b1521;
  --cyan:rgba(130,228,255,.92);
  --cyanSoft:rgba(130,228,255,.28);
  --ice:rgba(233,247,255,.96);
  --amber:rgba(236,188,119,.92);
  --amberSoft:rgba(236,188,119,.20);
  --line:rgba(173,225,255,.20);
  --lineSoft:rgba(173,225,255,.10);
  --text:#edf6ff;
  --muted:rgba(209,226,240,.58);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background: transparent;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background: transparent;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;}
.stage-wrap{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:10px; background:transparent;}
.stage{
  position:relative;
  width:min(100%, 720px);
  aspect-ratio: 16 / 11;
  overflow:hidden;
  border-radius:32px;
  background:
    radial-gradient(140% 120% at 50% 18%, rgba(15,31,50,.84), rgba(7,12,21,.92) 46%, rgba(2,4,8,.98) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.065),
    inset 0 0 0 1px rgba(145,188,220,.11),
    inset 0 -80px 150px rgba(0,0,0,.58),
    0 44px 130px rgba(0,0,0,.62);
}
.stage::before{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 42%, rgba(91,190,255,.11), transparent 28%),
    radial-gradient(circle at 50% 58%, rgba(248,184,104,.055), transparent 52%),
    linear-gradient(145deg, rgba(255,255,255,.07), transparent 18%, transparent 78%, rgba(255,255,255,.03));
  mix-blend-mode:screen;
  opacity:.55;
  pointer-events:none;
}
.stage::after{
  content:"";
  position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(255,255,255,.02), transparent 24%, transparent 78%, rgba(255,255,255,.025)),
    radial-gradient(80% 120% at 50% -8%, rgba(255,255,255,.05), transparent 54%);
  pointer-events:none;
}
canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.hud{position:absolute; left:22px; top:18px; z-index:2; display:flex; flex-direction:column; gap:8px; pointer-events:none}
.kicker{
  font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(180,224,247,.78);
  display:flex; align-items:center; gap:12px;
}
.kicker::before{
  content:""; width:34px; height:1px;
  background:linear-gradient(90deg, rgba(113,198,255,.95), rgba(113,198,255,0));
  box-shadow:0 0 14px rgba(113,198,255,.36);
}
.title{font-size:15px; font-weight:600; letter-spacing:.02em; color:rgba(244,248,252,.92)}
.note{
  position:absolute; right:18px; bottom:16px; z-index:2; pointer-events:none;
  font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(172,208,230,.38);
}
.badge{
  position:absolute; left:22px; bottom:18px; z-index:2; pointer-events:none;
  padding:8px 12px; border-radius:999px; font-size:10px; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(214,234,247,.62); border:1px solid rgba(145,188,220,.12);
  background:linear-gradient(180deg, rgba(9,18,28,.58), rgba(7,14,23,.22));
  backdrop-filter: blur(10px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.18);
}
.vignette{position:absolute; inset:-10%; pointer-events:none; border-radius:38px; box-shadow: inset 0 0 190px rgba(0,0,0,.58)}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="title">Framed Brand Architecture</div>
    </div>
    <canvas id="canvas"></canvas>
    <div class="vignette"></div>
  </div>
</div>
<script>

const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
const pointer = {x:0, y:0, tx:0, ty:0};
const TAU = Math.PI * 2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a + (b-a)*t;
const mix = (a,b,t)=>({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t), z:lerp(a.z,b.z,t)});
function resize(){
  const r = stage.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();
stage.addEventListener('pointermove', e=>{
  const r = stage.getBoundingClientRect();
  pointer.tx = ((e.clientX - r.left) / r.width - .5) * 2;
  pointer.ty = ((e.clientY - r.top) / r.height - .5) * 2;
});
stage.addEventListener('pointerleave', ()=>{pointer.tx=0; pointer.ty=0;});
function vec(x=0,y=0,z=0){ return {x,y,z}; }
function add(a,b){ return {x:a.x+b.x, y:a.y+b.y, z:a.z+b.z}; }
function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y, z:a.z-b.z}; }
function mul(a,s){ return {x:a.x*s, y:a.y*s, z:a.z*s}; }
function rotX(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x, y:p.y*c-p.z*s, z:p.y*s+p.z*c}; }
function rotY(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c+p.z*s, y:p.y, z:-p.x*s+p.z*c}; }
function rotZ(p,a){ const c=Math.cos(a), s=Math.sin(a); return {x:p.x*c-p.y*s, y:p.x*s+p.y*c, z:p.z}; }
function project(p, dist=660, scale=1){
  const z = dist / (dist + p.z);
  return {x:W*0.5 + p.x*z*scale, y:H*0.5 + p.y*z*scale, z:p.z, s:z};
}
function roundedQuad(points, radius){
  const [a,b,c,d] = points;
  ctx.beginPath();
  const pts = [a,b,c,d];
  for(let i=0;i<4;i++){
    const prev = pts[(i+3)%4], cur = pts[i], next = pts[(i+1)%4];
    const v1 = {x:cur.x-prev.x, y:cur.y-prev.y};
    const v2 = {x:cur.x-next.x, y:cur.y-next.y};
    const l1 = Math.hypot(v1.x,v1.y)||1, l2=Math.hypot(v2.x,v2.y)||1;
    const r = Math.min(radius, l1*.35, l2*.35);
    const p1 = {x:cur.x - v1.x/l1*r, y:cur.y - v1.y/l1*r};
    const p2 = {x:cur.x - v2.x/l2*r, y:cur.y - v2.y/l2*r};
    if(i===0) ctx.moveTo(p1.x,p1.y); else ctx.lineTo(p1.x,p1.y);
    ctx.quadraticCurveTo(cur.x,cur.y,p2.x,p2.y);
  }
  ctx.closePath();
}
function strokeLine(a,b,color,w,blur){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  if(blur){ ctx.shadowBlur=blur; ctx.shadowColor=color; }
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.restore();
}
function fillCircle(p,r,color,blur=0){
  ctx.save(); ctx.fillStyle=color; if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill(); ctx.restore();
}
function drawGrid(alpha=.08){
  ctx.save();
  ctx.strokeStyle='rgba(122,184,223,'+alpha+')';
  ctx.lineWidth=1;
  for(let x=40;x<W;x+=44){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=34;y<H;y+=44){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
}
function bezier(a,b,c,d,t){
  const mt = 1-t;
  return {
    x: mt*mt*mt*a.x + 3*mt*mt*t*b.x + 3*mt*t*t*c.x + t*t*t*d.x,
    y: mt*mt*mt*a.y + 3*mt*mt*t*b.y + 3*mt*t*t*c.y + t*t*t*d.y
  };
}
function linePath(points, color, width, blur=0){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round';
  if(blur){ctx.shadowBlur=blur; ctx.shadowColor=color;}
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke(); ctx.restore();
}
function glowText(text,x,y,color){
  ctx.save(); ctx.font='600 10px Inter, sans-serif'; ctx.letterSpacing='2px';
  ctx.fillStyle=color; ctx.shadowBlur=12; ctx.shadowColor=color; ctx.fillText(text,x,y); ctx.restore();
}

const frames = [
  {w:332,h:212,z:-22,sk:18,dx:-16,dy:8, border:'rgba(118,213,246,.34)', fillA:'rgba(8,16,25,.42)', fillB:'rgba(18,34,50,.12)'},
  {w:276,h:176,z:12,sk:14,dx:8,dy:-10, border:'rgba(228,240,251,.32)', fillA:'rgba(10,18,28,.46)', fillB:'rgba(19,30,41,.10)'},
  {w:218,h:132,z:44,sk:10,dx:26,dy:-24, border:'rgba(230,186,122,.28)', fillA:'rgba(12,23,34,.40)', fillB:'rgba(25,37,49,.10)'}
];
const rails = [
  {x:-112,y:-52,w:120,h:10,z:28,c:'rgba(127,218,246,.20)'},
  {x:34,y:-12,w:90,h:12,z:34,c:'rgba(230,186,122,.18)'},
  {x:-24,y:46,w:136,h:14,z:18,c:'rgba(230,243,252,.14)'},
  {x:-148,y:78,w:72,h:10,z:8,c:'rgba(127,218,246,.16)'}
];
const guideDots = Array.from({length:24}, (_,i)=>({a:i/24*TAU, r:136 + (i%3)*22, y:(i%2?1:-1)*(20 + (i%5)*8)}));
function quad(cx,cy,w,h,sk,z){
  return [vec(cx-w*.5+sk, cy-h*.5, z), vec(cx+w*.5+sk, cy-h*.5, z), vec(cx+w*.5-sk, cy+h*.5, z), vec(cx-w*.5-sk, cy+h*.5, z)];
}
function render(t){
  requestAnimationFrame(render);
  pointer.x = lerp(pointer.x, pointer.tx, .05);
  pointer.y = lerp(pointer.y, pointer.ty, .05);
  ctx.clearRect(0,0,W,H);
  drawGrid(.026);
  const time = t*0.001;

  const haze = ctx.createRadialGradient(W*0.52,H*0.48,12,W*0.52,H*0.48, W*.36);
  haze.addColorStop(0,'rgba(102,214,255,.08)'); haze.addColorStop(.4,'rgba(235,184,112,.045)'); haze.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = haze; ctx.fillRect(0,0,W,H);

  const camRX = -0.22 + pointer.y*0.03;
  const camRY = -0.38 + pointer.x*0.06 + Math.sin(time*0.14)*0.06;
  const camRZ = Math.sin(time*0.12)*0.01;
  function xf(p){
    let q = add(p, vec(Math.sin(time*0.18+p.y*.01)*1.5, Math.cos(time*0.16+p.x*.008)*1.4, 0));
    q = rotX(q, camRX); q = rotY(q, camRY); q = rotZ(q, camRZ);
    q = add(q, vec(pointer.x*10, pointer.y*8, 0));
    return project(q, 720, 1);
  }

  frames.forEach((f, idx)=>{
    const breathe = Math.sin(time*0.26 + idx*.9)*8;
    const q = quad(f.dx + (idx===1?12:0), f.dy + breathe*.25, f.w, f.h, f.sk, f.z + Math.sin(time*0.3+idx)*6);
    const pts = q.map(xf);
    roundedQuad(pts, 16);
    const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[2].x, pts[2].y);
    grad.addColorStop(0, f.fillA); grad.addColorStop(.5, 'rgba(255,255,255,.02)'); grad.addColorStop(1, f.fillB);
    ctx.fillStyle = grad; ctx.shadowBlur = 28; ctx.shadowColor = 'rgba(0,0,0,.26)'; ctx.fill();
    roundedQuad(pts, 16);
    ctx.strokeStyle = f.border; ctx.lineWidth = idx===0?1.35:1.1; ctx.shadowBlur = 16; ctx.shadowColor=f.border; ctx.stroke(); ctx.shadowBlur = 0;
    const inner = [mix(pts[0],pts[1],.18), mix(pts[1],pts[2],.18), mix(pts[2],pts[3],.18), mix(pts[3],pts[0],.18)];
    roundedQuad(inner, 12); ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=.8; ctx.stroke();
    const glintT = (time*0.045 + idx*.18)%1;
    const gx = lerp(pts[0].x, pts[1].x, glintT); const gy = lerp(pts[0].y, pts[1].y, glintT);
    strokeLine({x:gx-26,y:gy-1},{x:gx+26,y:gy+1}, idx===2?'rgba(237,191,122,.36)':'rgba(203,242,255,.30)', 1.2, 10);
  });

  rails.forEach((r, idx)=>{
    const q = quad(r.x + Math.sin(time*0.22+idx)*4, r.y + Math.cos(time*0.28+idx)*3, r.w, r.h, 4, r.z + Math.sin(time*0.4+idx)*4);
    const pts = q.map(xf);
    roundedQuad(pts, 7);
    const grad = ctx.createLinearGradient(pts[0].x,pts[0].y,pts[2].x,pts[2].y);
    grad.addColorStop(0,r.c); grad.addColorStop(1,'rgba(255,255,255,.03)');
    ctx.fillStyle = grad; ctx.fill();
    roundedQuad(pts, 7); ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=.8; ctx.stroke();
  });

  const scaffold = [xf(vec(-168,-92,-20)), xf(vec(154,-104,-4)), xf(vec(128,94,26)), xf(vec(-132,104,18))];
  linePath([scaffold[0], scaffold[1], scaffold[2], scaffold[3], scaffold[0]], 'rgba(120,207,242,.10)', 1);
  strokeLine(scaffold[0], scaffold[2], 'rgba(236,188,119,.08)', .8);
  strokeLine(scaffold[1], scaffold[3], 'rgba(120,207,242,.07)', .8);

  guideDots.forEach((d, idx)=>{
    const p = xf(vec(Math.cos(d.a + time*0.03)*d.r, Math.sin(d.a + time*0.03)*22 + d.y, Math.sin(d.a)*42));
    if(idx % 4 === 0) fillCircle(p, 1.6, 'rgba(237,190,122,.18)', 8);
    else fillCircle(p, 1.2, 'rgba(170,226,247,.10)', 5);
  });
}
requestAnimationFrame(render);

</script>
</body>
</html>
