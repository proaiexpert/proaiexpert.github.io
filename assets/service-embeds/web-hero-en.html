<!DOCTYPE html>






<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root{
        --bg-0:#050506;
        --bg-1:#070809;
        --bg-2:#0A0D12;

        --cyan:#5DE2FF;
        --cyan-soft:#86C8FF;
        --blue:#2970FF;
        --blue-soft:#2D6BFF;

        --white-92:rgba(238,246,255,0.92);
        --white-76:rgba(255,255,255,0.76);
        --white-60:rgba(255,255,255,0.60);
        --white-42:rgba(255,255,255,0.42);
        --white-20:rgba(255,255,255,0.20);
        --white-12:rgba(255,255,255,0.12);
        --white-08:rgba(255,255,255,0.08);
        --white-06:rgba(255,255,255,0.06);
        --white-04:rgba(255,255,255,0.04);

        --panel-border:rgba(255,255,255,0.10);

        --glass-main:
            linear-gradient(180deg, rgba(255,255,255,0.038) 0%, rgba(255,255,255,0.013) 22%, rgba(255,255,255,0.017) 100%),
            radial-gradient(145% 115% at 0% 0%, rgba(255,255,255,0.068), transparent 34%),
            radial-gradient(124% 112% at 100% 100%, rgba(41,112,255,0.10), transparent 38%),
            linear-gradient(145deg, rgba(20,23,30,0.84) 0%, rgba(8,10,14,0.938) 48%, rgba(4,6,10,0.989) 100%);

        --glass-side:
            linear-gradient(180deg, rgba(255,255,255,0.028) 0%, rgba(255,255,255,0.008) 100%),
            radial-gradient(140% 120% at 0% 0%, rgba(255,255,255,0.046), transparent 34%),
            linear-gradient(155deg, rgba(255,255,255,0.024) 0%, rgba(255,255,255,0.010) 52%, rgba(255,255,255,0.018) 100%);
    }

    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-family:'Inter',sans-serif;
        -webkit-font-smoothing:antialiased;
        text-rendering:optimizeLegibility;
    }

    html,body{
        width:100%;
        height:100%;
        overflow:hidden;
        background:transparent;
        color:#fff;
    }

    body{
        perspective:2000px;
    }

    .hero-shell{
        position:relative;
        width:100vw;
        height:100vh;
        overflow:hidden;
        isolation:isolate;
    }

    .environment,
    .field-lines,
    .halo-layer,
    .particles,
    .ribbon-stage{
        position:absolute;
        inset:0;
        pointer-events:none;
    }

    .environment{ z-index:1; }

    .field-lines{
        z-index:2;
        opacity:0.14;
        background:
            linear-gradient(90deg, transparent 0, transparent 22%, rgba(255,255,255,0.010) 28%, transparent 35%, transparent 100%),
            linear-gradient(180deg, transparent 0, transparent 22%, rgba(255,255,255,0.009) 29%, transparent 35%, transparent 100%);
        mask-image: radial-gradient(circle at 78% 50%, rgba(0,0,0,1) 0 48%, transparent 80%);
    }

    .field-lines::before,
    .field-lines::after{
        content:"";
        position:absolute;
        border-radius:50%;
        border:1px solid rgba(255,255,255,0.026);
        opacity:0.20;
    }

    .field-lines::before{
        width:760px;
        height:760px;
        right:5vw;
        top:calc(50% - 380px);
        transform:rotate(-10deg);
    }

    .field-lines::after{
        width:980px;
        height:620px;
        right:0vw;
        top:calc(50% - 310px);
        transform:rotate(10deg);
        opacity:0.10;
    }

    .glow{
        position:absolute;
        border-radius:50%;
        filter:blur(140px);
        opacity:0.15;
        mix-blend-mode:screen;
        transition:transform 0.12s ease-out;
    }

    .glow-a{
        width:520px;
        height:450px;
        left:64%;
        top:14%;
        background:radial-gradient(circle at center, rgba(93,226,255,0.22) 0%, rgba(93,226,255,0.078) 34%, transparent 72%);
        animation:glowPulse 9s ease-in-out infinite;
    }

    .glow-b{
        width:580px;
        height:450px;
        left:76%;
        top:46%;
        background:radial-gradient(circle at center, rgba(45,107,255,0.20) 0%, rgba(45,107,255,0.070) 34%, transparent 74%);
    }

    .glow-c{
        width:260px;
        height:220px;
        left:71%;
        top:54%;
        background:radial-gradient(circle at center, rgba(255,255,255,0.060) 0%, rgba(255,255,255,0.018) 42%, transparent 78%);
        filter:blur(92px);
        opacity:0.10;
    }

    @keyframes glowPulse{
        0%,100%{ opacity:0.11; transform:scale(1); }
        50%{ opacity:0.145; transform:scale(1.035); }
    }

    .halo-layer{
        z-index:3;
        overflow:hidden;
    }

    .halo{
        position:absolute;
        border:1px solid rgba(255,255,255,0.032);
        border-radius:999px;
        opacity:0.20;
        transition:transform 0.12s ease-out;
    }

    .halo.h1{
        width:660px;
        height:430px;
        right:8vw;
        top:24vh;
        transform:rotate(-7deg);
    }

    .halo.h2{
        width:560px;
        height:320px;
        right:14vw;
        top:36vh;
        opacity:0.10;
        transform:rotate(13deg);
    }

    .halo.h3{
        width:420px;
        height:240px;
        right:22vw;
        top:20vh;
        opacity:0.06;
        transform:rotate(-18deg);
    }

    .ribbon-stage{
        z-index:4;
        overflow:hidden;
    }

    .ribbon-layer{
        position:absolute;
        inset:-8%;
        transition:transform 0.12s ease-out, opacity 1.8s ease-in-out;
    }

    .ribbon-layer svg{
        width:100%;
        height:100%;
    }

    .ribbon-layer.front{
        z-index:2;
        opacity:0.78;
        animation:ribbonDriftFront 21s ease-in-out infinite alternate, ribbonBreathFront 9s ease-in-out infinite;
    }
    .ribbon-layer.back{
        z-index:1;
        opacity:0.44;
        animation:ribbonDriftBack 24s ease-in-out infinite alternate, ribbonBreathBack 12s ease-in-out infinite;
    }
    .ribbon-layer.soft{
        z-index:0;
        opacity:0.32;
        filter:blur(8px);
        animation:ribbonDriftSoft 27s ease-in-out infinite alternate, ribbonBreathSoft 14s ease-in-out infinite;
    }

    @keyframes ribbonDriftFront{
        0%{transform:translate3d(0,0,0) scale(1);}
        100%{transform:translate3d(1.1%, -0.9%, 0) scale(1.012);}
    }
    @keyframes ribbonDriftBack{
        0%{transform:translate3d(0,0,0) scale(1);}
        100%{transform:translate3d(1.8%, -1.1%, 0) scale(1.018);}
    }
    @keyframes ribbonDriftSoft{
        0%{transform:translate3d(0,0,0) scale(1);}
        100%{transform:translate3d(2.4%, -1.4%, 0) scale(1.02);}
    }

    @keyframes ribbonBreathFront{
        0%,100%{ opacity:0.74; }
        50%{ opacity:0.80; }
    }
    @keyframes ribbonBreathBack{
        0%,100%{ opacity:0.40; }
        50%{ opacity:0.46; }
    }
    @keyframes ribbonBreathSoft{
        0%,100%{ opacity:0.28; }
        50%{ opacity:0.34; }
    }

    .particles{
        z-index:5;
    }

    .particle{
        position:absolute;
        width:3px;
        height:3px;
        border-radius:50%;
        background:rgba(238,246,255,0.52);
        box-shadow:0 0 8px rgba(93,226,255,0.16);
        opacity:0.045;
        animation:particleFloat linear infinite;
    }

    .particle:nth-child(1){left:70%; top:21%; animation-duration:13s; animation-delay:-2s;}
    .particle:nth-child(2){left:78%; top:30%; animation-duration:16s; animation-delay:-6s;}
    .particle:nth-child(3){left:83%; top:42%; animation-duration:15s; animation-delay:-1s;}
    .particle:nth-child(4){left:74%; top:60%; animation-duration:18s; animation-delay:-4s;}

    @keyframes particleFloat{
        0%{transform:translate3d(0,0,0) scale(0.85); opacity:0.012;}
        18%{opacity:0.05;}
        50%{transform:translate3d(14px,-18px,0) scale(1);}
        100%{transform:translate3d(-8px,-34px,0) scale(0.82); opacity:0.010;}
    }

    .dust-cluster{
        position:absolute;
        border-radius:50%;
        filter:blur(34px);
        pointer-events:none;
        z-index:5;
        opacity:0.045;
        mix-blend-mode:screen;
    }

    .dust-1{
        width:120px;
        height:84px;
        left:72%;
        top:35%;
        background:radial-gradient(circle at 35% 45%, rgba(255,255,255,0.16) 0%, rgba(134,200,255,0.05) 40%, transparent 75%);
    }

    .dust-2{
        width:104px;
        height:76px;
        left:82%;
        top:55%;
        background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12) 0%, rgba(93,226,255,0.04) 42%, transparent 78%);
    }

    .art-stage{
        position:absolute;
        top:50%;
        right:0.2vw;
        width:min(72vw, 1200px);
        height:min(80vh, 780px);
        transform:translateY(-50%);
        z-index:10;
        display:flex;
        align-items:center;
        justify-content:center;
        pointer-events:none;
        overflow:visible;
    }

    .depth-haze{
        position:absolute;
        width:700px;
        height:370px;
        left:58%;
        top:44%;
        transform:translate(-18%, -50%);
        border-radius:50%;
        background:
            radial-gradient(circle at 50% 50%, rgba(255,255,255,0.034) 0%, rgba(93,226,255,0.028) 20%, rgba(41,112,255,0.022) 42%, transparent 74%);
        filter:blur(74px);
        opacity:0.16;
        z-index:1;
        pointer-events:none;
    }

    .scene{
        position:relative;
        width:100%;
        height:100%;
        transform-style:preserve-3d;
        pointer-events:auto;
        transform:translate3d(-11%, 0.5%, 0) scale(1.28);
        transform-origin:center center;
    }

    .ribbon-wrap{
        position:absolute;
        inset:0;
        pointer-events:none;
        mix-blend-mode:screen;
        transition:transform 0.12s ease-out, opacity 1.6s ease-in-out;
    }

    .ribbon-wrap svg{
        width:100%;
        height:100%;
    }

    .ribbon-wrap.back-wrap{
        z-index:5;
        opacity:0.58;
        animation:wrapBreathBack 12s ease-in-out infinite;
    }
    .ribbon-wrap.front-wrap{
        z-index:8;
        opacity:0.78;
        animation:wrapBreathFront 9s ease-in-out infinite;
    }

    @keyframes wrapBreathBack{
        0%,100%{ opacity:0.54; }
        50%{ opacity:0.60; }
    }
    @keyframes wrapBreathFront{
        0%,100%{ opacity:0.74; }
        50%{ opacity:0.80; }
    }

    .ribbon-travel{
        position:absolute;
        inset:0;
        pointer-events:none;
        z-index:9;
        mix-blend-mode:screen;
        opacity:0.38;
    }

    .ribbon-travel svg{
        width:100%;
        height:100%;
    }

    .ribbon-travel path{
        stroke-dasharray: 16 260;
        stroke-dashoffset: 0;
        animation:ribbonTravel 9.5s linear infinite;
    }

    @keyframes ribbonTravel{
        0%{ stroke-dashoffset: 0; opacity:0.22; }
        50%{ opacity:0.42; }
        100%{ stroke-dashoffset: -420; opacity:0.22; }
    }

    .panel,
    .micro-surface{
        position:absolute;
        overflow:hidden;
        transform-style:preserve-3d;
        border:1px solid rgba(255,255,255,0.018);
        box-shadow:0 38px 94px rgba(0,0,0,0.60), 0 12px 24px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.08);
        backdrop-filter:blur(32px) saturate(132%);
        -webkit-backdrop-filter:blur(32px) saturate(132%);
    }

    .panel::before,
    .micro-surface::before{
        content:"";
        position:absolute;
        inset:0;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 12%, transparent 28%),
            radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,0.10), transparent 36%),
            linear-gradient(160deg, rgba(255,255,255,0.035), transparent 42%, rgba(255,255,255,0.018) 100%);
        pointer-events:none;
        z-index:1;
    }

    .panel::after,
    .micro-surface::after{
        content:"";
        position:absolute;
        inset:1px;
        border-radius:inherit;
        border:1px solid transparent;
        pointer-events:none;
        z-index:2;
        opacity:0;
    }

    .panel{
        border-radius:30px;
    }

    .panel-main{
        border-color: rgba(255,255,255,0.018);
        width:660px;
        height:432px;
        left:50%;
        top:50%;
        margin-left:-330px;
        margin-top:-216px;
        z-index:6;
        background:var(--glass-main);
        box-shadow:
            0 88px 172px rgba(0,0,0,0.92),
            0 32px 56px rgba(0,0,0,0.58),
            0 10px 20px rgba(0,0,0,0.26),
            inset 0 1px 0 rgba(255,255,255,0.10),
            inset 0 -30px 52px rgba(0,0,0,0.22);
    }

    .panel-side{
        width:292px;
        height:346px;
        z-index:4;
        background: linear-gradient(180deg, rgba(255,255,255,0.020) 0%, rgba(255,255,255,0.006) 100%), linear-gradient(155deg, rgba(255,255,255,0.018) 0%, rgba(255,255,255,0.006) 52%, rgba(255,255,255,0.014) 100%);
    }

    .panel-front{
        z-index:7;
        box-shadow:
            0 52px 118px rgba(0,0,0,0.72),
            0 18px 32px rgba(0,0,0,0.40),
            0 4px 10px rgba(0,0,0,0.12),
            inset 0 1px 0 rgba(255,255,255,0.14);
    }

    #panelRight{
        width:372px;
        height:236px;
        border-radius:28px;
    }

    .panel-main::after{ border-color: transparent; opacity:0; }

    .main-edge-glow,
    .main-thickness,
    .main-rim{
        display:none;
    }

    #panelRight::after{ opacity:0 !important; border-color:transparent !important; }
    #panelRight{ border-color: rgba(255,255,255,0.012) !important; }

    .panel-rear{
        z-index:4;
        opacity:0.34;
        filter:saturate(0.74) brightness(0.74);
        box-shadow:
            0 16px 34px rgba(0,0,0,0.22),
            0 6px 12px rgba(0,0,0,0.12),
            inset 0 1px 0 rgba(255,255,255,0.03);
        border-color: rgba(255,255,255,0.018);
    }

    .micro-surface{
        border-radius:24px;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.020) 0%, rgba(255,255,255,0.008) 100%),
            linear-gradient(155deg, rgba(255,255,255,0.028) 0%, rgba(255,255,255,0.010) 52%, rgba(255,255,255,0.020) 100%);
        box-shadow:0 28px 74px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.10);
        z-index:2;
        backdrop-filter:blur(28px) saturate(126%);
        -webkit-backdrop-filter:blur(28px) saturate(126%);
    }

    .surface-a{ width:156px; height:104px; }
    .surface-b{ width:118px; height:220px; }

    .reflection{
        position:absolute;
        inset:-24%;
        z-index:11;
        pointer-events:none;
        opacity:0.95;
        transition:background 0.1s ease-out;
        mix-blend-mode:screen;
    }

    .glass-sheen{
        position:absolute;
        inset:0;
        z-index:5;
        pointer-events:none;
        background:
            linear-gradient(125deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 14%, transparent 28%),
            linear-gradient(180deg, rgba(255,255,255,0.05), transparent 18%);
        opacity:0.44;
    }

    .panel-rear .glass-sheen{
        opacity:0.13;
    }

    .main-refraction{
        position:absolute;
        inset:0;
        z-index:6;
        pointer-events:none;
        border-radius:inherit;
        background:
            linear-gradient(90deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.015) 6%, transparent 13%, transparent 88%, rgba(134,200,255,0.080) 96%, rgba(255,255,255,0.03) 100%),
            linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.018) 10%, transparent 16%, transparent 84%, rgba(255,255,255,0.045) 100%),
            radial-gradient(140% 100% at 0% 50%, rgba(134,200,255,0.030), transparent 22%),
            radial-gradient(140% 100% at 100% 50%, rgba(93,226,255,0.040), transparent 22%);
        opacity:0.76;
        mix-blend-mode:screen;
    }

    .main-edge-glow{
        position:absolute;
        inset:0;
        z-index:7;
        pointer-events:none;
        border-radius:inherit;
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.22),
            inset 1px 0 0 rgba(255,255,255,0.13),
            inset -1px 0 0 rgba(134,200,255,0.06),
            inset 0 0 0 1px rgba(255,255,255,0.06),
            inset 0 18px 28px rgba(255,255,255,0.020),
            inset 0 -2px 0 rgba(255,255,255,0.025);
    }

    .main-thickness{
        position:absolute;
        inset:0;
        z-index:7;
        pointer-events:none;
        border-radius:inherit;
        background:
            linear-gradient(180deg, rgba(255,255,255,0.06), transparent 5%, transparent 95%, rgba(0,0,0,0.10)),
            linear-gradient(90deg, rgba(255,255,255,0.07), transparent 6%, transparent 94%, rgba(134,200,255,0.03));
        opacity:0.72;
        mix-blend-mode:screen;
    }

    .main-rim{
        position:absolute;
        inset:0;
        z-index:8;
        pointer-events:none;
        border-radius:inherit;
        box-shadow:
            inset 0 0 0 0.6px rgba(255,255,255,0.05),
            inset 0 0.5px 0 rgba(255,255,255,0.11),
            inset 0.8px 0 0 rgba(255,255,255,0.07),
            inset -0.8px 0 0 rgba(134,200,255,0.05),
            inset 0 -0.6px 0 rgba(41,112,255,0.03);
        opacity:0.90;
    }

    .precision-cue{
        position:absolute;
        z-index:8;
        pointer-events:none;
        opacity:0.22;
    }

    .precision-cue.p1{
        top:18px;
        right:68px;
        width:22px;
        height:22px;
        border-top:1px solid rgba(255,255,255,0.07);
        border-right:1px solid rgba(134,200,255,0.07);
    }

    .precision-cue.p2{
        left:22px;
        bottom:24px;
        width:28px;
        height:1px;
        background:linear-gradient(90deg, rgba(93,226,255,0.14), transparent);
    }

    .studio-sweep{
        position:absolute;
        inset:-18%;
        z-index:10;
        pointer-events:none;
        mix-blend-mode:screen;
        opacity:0.14;
        background:
            linear-gradient(108deg,
                transparent 36%,
                rgba(255,255,255,0.018) 45%,
                rgba(238,246,255,0.032) 48%,
                rgba(134,200,255,0.022) 51%,
                transparent 60%);
        animation:studioSweep 14s ease-in-out infinite;
    }

    @keyframes studioSweep{
        0%,100%{ transform:translateX(-5%) translateY(0); opacity:0.08; }
        50%{ transform:translateX(5%) translateY(-0.4%); opacity:0.16; }
    }

    .panel-edge{
        position:absolute;
        inset:auto 18px 14px 18px;
        height:1px;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
        z-index:8;
    }

    .main-contact-shadow{
        position:absolute;
        left:50%;
        top:50%;
        width:620px;
        height:108px;
        transform:translate(-50%, 178px);
        border-radius:50%;
        background:radial-gradient(ellipse at center, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.18) 44%, transparent 76%);
        filter:blur(18px);
        opacity:0.90;
        z-index:2;
        pointer-events:none;
    }

    .left-contact-shadow{
        position:absolute;
        width:240px;
        height:58px;
        border-radius:50%;
        background:radial-gradient(ellipse at center, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0.12) 44%, transparent 78%);
        filter:blur(13px);
        opacity:0.75;
        z-index:2;
        pointer-events:none;
    }

    .main-content,
    .side-content{
        position:relative;
        z-index:9;
        width:100%;
        height:100%;
        padding:30px 32px;
        display:flex;
        flex-direction:column;
    }

    .side-content{
        padding:22px 22px 20px;
        justify-content:space-between;
    }

    #panelRight .side-content{
        padding:18px 20px 16px;
    }

    .micro-top{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:18px;
        margin-bottom:24px;
    }

    .micro-kicker{
        font-size:10px;
        font-weight:600;
        letter-spacing:0.22em;
        text-transform:uppercase;
        color:rgba(255,255,255,0.56);
    }

    .micro-dots{
        display:flex;
        align-items:center;
        gap:7px;
    }

    .micro-dots span{
        width:6px;
        height:6px;
        border-radius:50%;
        background:rgba(255,255,255,0.14);
    }

    .micro-dots span:first-child{
        background:rgba(93,226,255,0.78);
        box-shadow:0 0 18px rgba(93,226,255,0.34);
    }

    .main-grid{
        display:grid;
        grid-template-columns:1.22fr 0.78fr;
        gap:22px;
        flex:1;
        min-height:0;
    }

    .editorial-left{
        display:flex;
        flex-direction:column;
        justify-content:space-between;
    }

    .support-line{
        display:flex;
        align-items:center;
        gap:12px;
        margin-bottom:18px;
        color:rgba(255,255,255,0.52);
        font-size:11px;
        letter-spacing:0.14em;
        text-transform:uppercase;
    }

    .support-line::before{
        content:"";
        width:42px;
        height:1px;
        background:linear-gradient(90deg, rgba(93,226,255,0.74), rgba(255,255,255,0.06));
    }

    .editorial-title{
        font-size:64px;

.svc-motion-card {
    position: relative;

}
.svc-motion-frame {
    position: relative;
    aspect-ratio: 1.18 / 0.88;
    min-height: 272px;
    padding: 0;

        radial-gradient(circle at 75% 18%, rgba(155,215,255,0.08), transparent 36%),

}

    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 22%, transparent 78%, rgba(255,255,255,0.025));
    pointer-events: none;
    transform: scale(0.88);
    transform-origin: center center;
}

    width: 100%;

    border: 0;

    const ribbonFront = document.getElementById('ribbonFront');
    const ribbonSoft = document.getElementById('ribbonSoft');
    const ribbonWrapBack = document.getElementById('ribbonWrapBack');
    const ribbonWrapFront = document.getElementById('ribbonWrapFront');
    const ribbonTravel = document.getElementById('ribbonTravel');

    const glowA = document.getElementById('glowA');
    const glowB = document.getElementById('glowB');
    const glowC = document.getElementById('glowC');

    const halo1 = document.getElementById('halo1');
    const halo2 = document.getElementById('halo2');
    const halo3 = document.getElementById('halo3');
    const depthHaze = document.getElementById('depthHaze');
    const mainContactShadow = document.getElementById('mainContactShadow');
    const leftContactShadow = document.getElementById('leftContactShadow');
    const mainEdgeGlow = document.getElementById('mainEdgeGlow');

    const state = {
        tx: 0,
        ty: 0,
        x: 0,
        y: 0
    };

    document.addEventListener('mousemove', (e) => {
        state.tx = (e.clientX / window.innerWidth - 0.5) * 2;
        state.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    document.addEventListener('mouseleave', () => {
        state.tx = 0;
        state.ty = 0;
    });

    function setReflection(el, intensity, spread, angleOffset = 0, xShift = 0){
        const pos = 50 + state.x * 18 + xShift;
        const angle = 112 + state.y * 10 + angleOffset;
        el.style.background = `
            linear-gradient(
                ${angle}deg,
                transparent ${pos - spread}%,
                rgba(255,255,255,${intensity}) ${pos}%,
                rgba(238,246,255,${intensity * 0.55}) ${pos + spread * 0.35}%,
                transparent ${pos + spread}%
            )
        `;
    }

    function animate(now){
        const t = now * 0.001;

        state.x += (state.tx - state.x) * 0.07;
        state.y += (state.ty - state.y) * 0.07;

        const mx = state.x;
        const my = state.y;

        const floatMain = Math.sin(t * 0.85) * 6;
        const floatLeft = Math.sin(t * 0.92 + 1.2) * 8;
        const floatRight = Math.sin(t * 0.72 + 2.1) * 5;
        const floatA = Math.sin(t * 1.06 + 0.5) * 6;
        const floatB = Math.sin(t * 0.82 + 2.6) * 7;

        panelMain.style.transform = `
            translate3d(${124 + mx * 14}px, ${-18 + floatMain - my * 10}px, 42px)
            rotateX(${-my * 5.2 - 1.0}deg)
            rotateY(${mx * 9.2 - 10.2}deg)
            rotateZ(${mx * 0.62}deg)
        `;

        panelLeft.style.transform = `
            translate3d(${-72 + mx * 18}px, ${122 + floatLeft + my * 8}px, 132px)
            rotateX(${3.6 - my * 3.2}deg)
            rotateY(${16 + mx * 5.6}deg)
            rotateZ(${-5.0 + my * 0.9}deg)
        `;

        panelRight.style.transform = `
            translate3d(${156 + mx * 6}px, ${-134 + floatRight + my * 3}px, -118px)
            rotateX(${10 - my * 1.4}deg)
            rotateY(${-11 + mx * 3.8}deg)
            rotateZ(${1.8 - mx * 0.3}deg)
            scale(0.955)
        `;

        surfaceA.style.transform = `
            translate3d(${12 + mx * 4}px, ${-126 + floatA + my * 2}px, -72px)
            rotateX(${7 - my * 2.0}deg)
            rotateY(${-7 + mx * 2.6}deg)
            rotateZ(${-4 - mx * 0.35}deg)
        `;

        surfaceB.style.transform = `
            translate3d(${286 + mx * 5}px, ${126 + floatB + my * 3}px, -92px)
            rotateX(${-2 - my * 1.4}deg)
            rotateY(${-18 + mx * 4.4}deg)
            rotateZ(${12 + my * 0.7}deg)
        `;

        ribbonFront.style.transform = `translate3d(${74 + mx * -12}px, ${my * -8}px, 0)`;
        ribbonBack.style.transform  = `translate3d(${118 + mx * -14}px, ${my * -10}px, 0)`;
        ribbonSoft.style.transform  = `translate3d(${138 + mx * -16}px, ${my * -12}px, 0)`;

        ribbonWrapBack.style.transform = `translate3d(${82 + mx * -6}px, ${my * -3}px, 0)`;
        ribbonWrapFront.style.transform = `translate3d(${64 + mx * -8}px, ${my * -4}px, 0)`;
        ribbonTravel.style.transform = `translate3d(${66 + mx * -10}px, ${my * -4}px, 0)`;

        ribbonTravel.style.opacity = `${0.28 + Math.abs(mx) * 0.08}`;

        glowA.style.transform = `translate3d(${mx * 10}px, ${my * 6}px, 0)`;
        glowB.style.transform = `translate3d(${mx * -6}px, ${my * -4}px, 0)`;
        glowC.style.transform = `translate3d(${mx * 4}px, ${my * -3}px, 0)`;

        halo1.style.transform = `translate3d(${mx * -6}px, ${my * 4}px, 0) rotate(-7deg)`;
        halo2.style.transform = `translate3d(${mx * -4}px, ${my * 3}px, 0) rotate(13deg)`;
        halo3.style.transform = `translate3d(${mx * -2}px, ${my * 2}px, 0) rotate(-18deg)`;

        depthHaze.style.transform = `translate(calc(-18% + ${mx * -5}px), calc(-50% + ${my * 3}px)) scale(${1 + Math.abs(mx) * 0.012})`;

        mainContactShadow.style.transform = `translate(calc(-50% + ${mx * 4}px), calc(178px + ${my * 2}px)) scale(${1 + Math.abs(mx) * 0.01})`;
        leftContactShadow.style.transform = `translate3d(${148 + mx * 6}px, ${470 + my * 2}px, 0) scale(${1 + Math.abs(mx) * 0.01})`;

        mainEdgeGlow.style.opacity = `${0.88 + Math.abs(mx) * 0.06}`;

        setReflection(reflMain, 0.142, 15, 0, 0);
        setReflection(reflLeft, 0.084, 18, 3, -3);
        setReflection(reflRight, 0.052, 17, -2, 3);
        setReflection(reflSurfaceA, 0.070, 20, 6, -6);
        setReflection(reflSurfaceB, 0.060, 18, -6, 8);

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
</script>

<script id="mobile-header-global-fix-script">
(function(){
  const header = document.querySelector('header');
  const siteNav = document.querySelector('.site-nav');
  const menuToggle = document.querySelector('.mobile-menu-toggle');
  if (!header) return;

  const mobileQuery = window.matchMedia('(max-width: 1100px), ((max-height: 540px) and (orientation: landscape))');
  let lastY = window.scrollY || 0;
  let ticking = false;
  const threshold = 10;

  function syncHeaderVisibility(force){
    if (!mobileQuery.matches) {
      header.classList.remove('header-hidden');
      lastY = window.scrollY || 0;
      return;
    }

    const currentY = window.scrollY || 0;
    const delta = currentY - lastY;
    const menuOpen = !!(siteNav && siteNav.classList.contains('is-open'));

    if (force || menuOpen || currentY < 20) {
      header.classList.remove('header-hidden');
      lastY = currentY;
      return;
    }

    if (delta > threshold) {
      header.classList.add('header-hidden');
    } else if (delta < -threshold) {
      header.classList.remove('header-hidden');
    }

    lastY = currentY;
  }

  function onScroll(){
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(function(){
        syncHeaderVisibility(false);
        ticking = false;
      });
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('touchmove', onScroll, { passive: true });
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ syncHeaderVisibility(true); }, 120); });
  window.addEventListener('resize', function(){ syncHeaderVisibility(true); });

  if (menuToggle) {
    menuToggle.addEventListener('click', function(){
      setTimeout(function(){ syncHeaderVisibility(true); }, 0);
    });
  }

  if (siteNav) {
    siteNav.querySelectorAll('a').forEach(function(link){
      link.addEventListener('click', function(){
        setTimeout(function(){ syncHeaderVisibility(true); }, 0);
      });
    });
  }

  syncHeaderVisibility(true);
})();
</script>
