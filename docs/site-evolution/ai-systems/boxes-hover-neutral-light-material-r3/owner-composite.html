<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Boxes Hover · Golden vs Neutral Light Material R3</title>
  <style>
    :root { color-scheme: dark; background: #020304; color: #f2f0eb; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #020304; }
    h1 { margin: 0 0 18px; font-size: 18px; letter-spacing: .04em; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; border: 1px solid #1a2027; background: #07090b; }
    figcaption { padding: 9px 12px; color: #c9cdd1; font: 12px/1.2 ui-monospace, monospace; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Boxes Hover · Golden vs Neutral Light Material R3</h1>
  <div class="grid">
    <figure><figcaption>Golden · Rest</figcaption><img src="runtime-qa/golden-rest.png" alt="Golden rest"></figure>
    <figure><figcaption>R3 · Rest</figcaption><img src="runtime-qa/r3-final-rest.png" alt="R3 rest"></figure>
    <figure><figcaption>Golden · Center Hover</figcaption><img src="runtime-qa/golden-center-hover.png" alt="Golden center hover"></figure>
    <figure><figcaption>R3 · Center Hover</figcaption><img src="runtime-qa/r3-final-center-hover.png" alt="R3 center hover"></figure>
  </div>
</body>
</html>
