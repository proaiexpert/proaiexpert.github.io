<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boxes Hover no-op runtime QA</title>
  <style>
    :root { color-scheme: dark; background: #020304; color: #f2f0eb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #020304; }
    body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { padding: 18px 24px; border-bottom: 1px solid #1a2027; }
    h1 { margin: 0 0 6px; font-size: 16px; }
    p { margin: 0; color: #8c949d; font-size: 11px; line-height: 1.5; white-space: pre-wrap; }
    main { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1a2027; }
    section { min-width: 0; min-height: 0; position: relative; background: #020304; }
    section h2 { position: absolute; z-index: 2; top: 14px; left: 16px; margin: 0; font-size: 11px; color: #a8b0ff; letter-spacing: .08em; }
    canvas { display: block; width: 100%; height: 100%; min-height: 560px; outline: none; }
    body[data-single] main { grid-template-columns: 1fr; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } canvas { min-height: 420px; } }
  </style>
</head>
<body>
  <header>
    <h1>Boxes Hover · safe no-op runtime QA</h1>
    <p data-status>Loading Golden and byte-identical no-op copy…</p>
  </header>
  <main>
    <section><h2>GOLDEN PAYLOAD</h2><canvas data-scene="golden" aria-label="Golden Boxes Hover runtime"></canvas></section>
    <section><h2>NO-OP ROUND-TRIP COPY</h2><canvas data-scene="noop" aria-label="No-op Boxes Hover runtime"></canvas></section>
  </main>
  <script type="module" src="./runtime-qa.js"></script>
</body>
</html>
