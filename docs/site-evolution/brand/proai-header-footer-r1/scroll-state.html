<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Header Scroll State Comparison</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#020304;color:#858B91;font:11px Arial}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cell{position:relative;overflow:hidden;border:1px solid rgba(232,231,226,.08);border-radius:14px;background:#050607;min-height:350px}.label{position:absolute;z-index:3;top:10px;right:12px;padding:5px 8px;border-radius:5px;background:rgba(2,3,4,.82);letter-spacing:.08em}.viewport{position:absolute;inset:0;overflow:hidden}.viewport iframe{position:absolute;left:0;top:0;width:1440px;height:700px;border:0;transform-origin:0 0}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="grid"><div class="cell"><span class="label">TOP · 1440</span><div class="viewport"><iframe id="t" src="/" title="Header top state"></iframe></div></div><div class="cell"><span class="label">SCROLLED · 1440</span><div class="viewport"><iframe id="s" src="/" title="Header scrolled state"></iframe></div></div></div><script>const cells=[...document.querySelectorAll('.cell')];function fit(){for(const cell of cells){const f=cell.querySelector('iframe'),scale=cell.clientWidth/1440;f.style.transform=`scale(${scale})`;cell.style.height=`${Math.round(700*scale)}px`}}addEventListener('resize',fit,{passive:true});fit();s.addEventListener('load',()=>setTimeout(()=>s.contentWindow.scrollTo(0,650),900));</script></body></html>
