<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Header Scroll State Comparison</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#020304;color:#858B91;font:11px Arial}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cell{position:relative;height:520px;overflow:hidden;border:1px solid rgba(232,231,226,.08);border-radius:14px;background:#050607}.label{position:absolute;z-index:3;top:10px;right:12px;padding:5px 8px;border-radius:5px;background:rgba(2,3,4,.78);letter-spacing:.08em}iframe{display:block;width:100%;height:100%;border:0}@media(max-width:820px){.grid{grid-template-columns:1fr}.cell{height:430px}}</style></head><body><div class="grid"><div class="cell"><span class="label">TOP</span><iframe src="/" title="Header top state"></iframe></div><div class="cell"><span class="label">SCROLLED</span><iframe id="s" src="/" title="Header scrolled state"></iframe></div></div><script>s.addEventListener('load',()=>setTimeout(()=>s.contentWindow.scrollTo(0,650),800))</script></body></html>
