<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ProAI Logo R3.2 — Canonical Premium Lockup</title>
  <link rel="stylesheet" href="assets/index-Dn0Nmh8Z.css">
  <link rel="stylesheet" href="r32.css">
</head>
<body data-r32-mode="static">
  <main class="r32-stage">
    <div class="r32-lockup" data-scale="large" data-testid="r32-lockup" aria-label="ProAI Expert">
      <div class="r32-cube-frame" data-testid="r32-cube-frame" aria-hidden="true">
        <canvas id="cube-canvas" aria-label="Canonical ProAI 3D Cube"></canvas>
        <p id="runtime-status" class="status">Loading canonical ProAI Cube…</p>
        <div class="review-controls r32-hidden"><button id="replay-brand">Replay</button><span class="review-links"></span></div>
      </div>
      <div class="r32-wordmark" data-testid="r32-wordmark" aria-label="ProAI Expert"><span class="proai">ProAI</span> <span class="expert">Expert</span></div>
    </div>
  </main>
  <script>
    const q=new URLSearchParams(location.search);
    const scale=['master','large','header'].includes(q.get('scale'))?q.get('scale'):'large';
    const mode=q.get('mode')==='living'?'living':'static';
    document.body.dataset.r32Mode=mode;
    document.querySelector('.r32-lockup').dataset.scale=scale;
  </script>
  <script type="module" src="r32-runtime.js"></script>
</body>
</html>
