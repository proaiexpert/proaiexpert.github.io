<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>ProAI Logo R2 — recommended detail board</title><defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0efe9"/><stop offset=".3" stop-color="#aab0b5"/><stop offset="1" stop-color="#30373e"/></linearGradient><linearGradient id="left" x2="1" y2="1"><stop stop-color="#333a42"/><stop offset="1" stop-color="#090c0f"/></linearGradient><linearGradient id="edge"><stop stop-color="#e8e9e6"/><stop offset="1" stop-color="#8996ff"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#f1f0eb}.m{font-family:Inter,Arial,sans-serif;fill:#9aa2aa}.k{font-family:Inter,Arial,sans-serif;fill:#aeb8ff;letter-spacing:2px}.wm{font-family:Inter,Arial,sans-serif;font-weight:650;letter-spacing:-1.3px}.ex{font-weight:420;opacity:.68}</style><symbol id="A" viewBox="0 0 512 512"><path d="M256 46 436 150 369 189 256 124 143 189 76 150Z" fill="url(#top)"/><path d="M76 150 143 189v137l113 65v75L76 362Z" fill="url(#left)"/><path d="m436 150-67 39v70l-28 17v50l-85 49v91l180-104Z" fill="#080b0f"/><path d="m369 189 67-39v52l-42 24-25-14Z" fill="#050607"/><path d="m256 124 76-44 84 48" stroke="url(#edge)" stroke-width="5" stroke-linecap="round"/></symbol></defs><rect width="1440" height="900" fill="#050607"/><text class="k" x="72" y="68" font-size="16">RECOMMENDED / CONCEPT A / SIGNATURE CORNER</text><text class="t" x="72" y="118" font-size="42" font-weight="650">A cube memory, not a cube icon.</text><text class="m" x="72" y="154" font-size="18">The identity comes from an open core + one missing machined corner.</text><use href="#A" x="80" y="210" width="500" height="500"/><g transform="translate(680 250)"><text class="k" x="0" y="0" font-size="13">STATIC MASTER LOCKUP</text><use href="#A" x="0" y="34" width="116" height="116"/><text class="wm t" x="142" y="107" font-size="51">ProAI <tspan class="ex">Expert</tspan></text><line x1="0" y1="180" x2="620" y2="180" stroke="#fff" stroke-opacity=".1"/><text class="t" x="0" y="230" font-size="20" font-weight="650">Why it wins R2</text><text class="m" x="0" y="268" font-size="17">01  Ownable silhouette at large and 28–32px scale.</text><text class="m" x="0" y="302" font-size="17">02  Strongest relationship to the Hero Cube without copying it.</text><text class="m" x="0" y="336" font-size="17">03  Asymmetry creates a repeatable signature, not a stock icon.</text><text class="m" x="0" y="370" font-size="17">04  Pearl/Ice exists only as optical response, never neon fill.</text><text class="m" x="0" y="404" font-size="17">05  Natural candidate for slow digital orientation drift.</text><text class="t" x="0" y="468" font-size="19" font-weight="650">Primary weakness</text><text class="m" x="0" y="504" font-size="17">At 16px, material nuances must collapse to three tone values.</text></g><text class="m" x="80" y="820" font-size="15">Owner gate: approve the object language first. Typography and production optical tuning follow only after direction selection.</text></svg>