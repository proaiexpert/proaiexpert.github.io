<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>ProAI Logo R2 — motion companion board</title><defs><style>.t{font-family:Inter,Arial,sans-serif;fill:#f1f0eb}.m{font-family:Inter,Arial,sans-serif;fill:#9aa2aa}.k{font-family:Inter,Arial,sans-serif;fill:#aeb8ff;letter-spacing:2px}.cell{fill:#090c10;stroke:#fff;stroke-opacity:.08}.wm{font-family:Inter,Arial,sans-serif;font-weight:650}.ex{font-weight:420;opacity:.68}</style><symbol id="A" viewBox="0 0 512 512"><path d="M256 46 436 150 369 189 256 124 143 189 76 150Z" fill="#8e959b"/><path d="M76 150 143 189v137l113 65v75L76 362Z" fill="#20272d"/><path d="m436 150-67 39v70l-28 17v50l-85 49v91l180-104Z" fill="#080b0e"/><path d="m369 189 67-39v52l-42 24-25-14Z" fill="#050607"/><path d="m256 124 76-44 84 48" stroke="#aeb8ff" stroke-width="5"/></symbol></defs><rect width="1440" height="900" fill="#050607"/><text class="k" x="72" y="68" font-size="16">DIGITAL MOTION COMPANION / CONCEPT A</text><text class="t" x="72" y="118" font-size="42" font-weight="650">Quiet orientation drift, not a spinning logo.</text><text class="m" x="72" y="154" font-size="18">Static identity remains complete. Motion is optional digital presence.</text><g transform="translate(72 220)"><rect class="cell" width="400" height="300" rx="18"/><text class="k" x="24" y="34" font-size="12">00.0s / HOME ANGLE</text><g transform="translate(98 62) rotate(-4 102 102)"><use href="#A" width="204" height="204"/></g></g><g transform="translate(520 220)"><rect class="cell" width="400" height="300" rx="18"/><text class="k" x="24" y="34" font-size="12">06.0s / +4° INSPECTION</text><g transform="translate(98 62) rotate(3 102 102)"><use href="#A" width="204" height="204"/></g></g><g transform="translate(968 220)"><rect class="cell" width="400" height="300" rx="18"/><text class="k" x="24" y="34" font-size="12">12.0s / RETURN</text><g transform="translate(98 62) rotate(-1 102 102)"><use href="#A" width="204" height="204"/></g></g><g transform="translate(72 570)"><rect class="cell" width="1296" height="180" rx="18"/><text class="k" x="24" y="34" font-size="12">WEBSITE HEADER COMPANION</text><use href="#A" x="28" y="58" width="70" height="70"/><text class="wm t" x="118" y="104" font-size="31">ProAI <tspan class="ex">Expert</tspan></text><text class="m" x="720" y="92" font-size="16">18s loop · max ±4° · no full rotation · no glow</text><text class="m" x="720" y="120" font-size="16">Reduced motion = static home angle</text></g><text class="m" x="72" y="824" font-size="15">Optional Pearl/Ice edge response may cross one bevel once per loop; it must never read as a lamp turning on.</text></svg>