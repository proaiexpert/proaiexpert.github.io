 DELIVERY</text><line x1="22" y1="3990" x2="298" y2="3990" stroke="#777"/><rect x="22" y="4011" width="276" height="70" rx="6" class="p"/><text x="32" y="4038" class="c" text-anchor="start">1. Разобрать контекст</text><rect x="22" y="4091" width="276" height="70" rx="6" class="p"/><text x="32" y="4118" class="c" text-anchor="start">2. Определить границы</text><rect x="22" y="4171" width="276" height="70" rx="6" class="p"/><text x="32" y="4198" class="c" text-anchor="start">3. Создать систему</text><rect x="22" y="4251" width="276" height="70" rx="6" class="p"/><text x="32" y="4278" class="c" text-anchor="start">4. Запустить и проверить</text><rect x="22" y="4331" width="276" height="70" rx="6" class="p"/><text x="32" y="4358" class="c" text-anchor="start">5. Улучшать по данным</text><rect x="10" y="4470" width="300" height="300" rx="8" class="b"/><text x="22" y="4495" class="c" text-anchor="start">07  FOUNDER</text><line x1="22" y1="4504" x2="298" y2="4504" stroke="#777"/><rect x="22" y="4528" width="95" height="125" rx="6" class="q"/><text x="69" y="4595" class="s" text-anchor="middle">PHOTO</text><rect x="130" y="4528" width="178" height="125" rx="6" class="p"/><text x="142" y="4558" class="s" text-anchor="start">Accountability copy</text><rect x="10" y="4784" width="300" height="988" rx="8" class="b"/><text x="22" y="4809" class="c" text-anchor="start">08  SELECTED WORK</text><line x1="22" y1="4818" x2="298" y2="4818" stroke="#777"/><rect x="22" y="4839" width="276" height="450" rx="6" class="p"/><rect x="32" y="4857" width="256" height="120" rx="6" class="q"/><text x="160.0" y="4921" class="s" text-anchor="middle">PROJECT IMAGE</text><text x="32" y="5004" class="c" text-anchor="start">ALINA HORB</text><rect x="32" y="5023" width="256" height="58" rx="6" class="q"/><text x="40" y="5046" class="s"><tspan x="40" dy="0">ДЕЙСТВУЮЩИЙ ПРОЕКТ, СВЯЗАННЫЙ</tspan><tspan x="40" dy="14">С ОСНОВАТЕЛЕМ · UA/RU</tspan></text><rect x="32" y="5099" width="256" height="120" rx="6"