<svg xmlns="http://www.w3.org/2000/svg" width="320" height="6428" viewBox="0 0 320 6428"><style>.b{fill:#fafafa;stroke:#555}.p{fill:#eee;stroke:#777}.q{fill:#ddd;stroke:#666}.n{fill:#fff;stroke:#999;stroke-dasharray:4 3}.t{font:12px Arial;fill:#222}.s{font:10px Arial;fill:#444}.h{font:bold 20px Arial;fill:#111}.c{font:bold 9px Arial;letter-spacing:.8px;fill:#333}.r{fill:#ddd;stroke:#555}.f{stroke:#c33;stroke-dasharray:6 4}</style><rect x="3" y="3" width="314" height="6900" rx="7" class="b"/><rect x="10" y="12" width="300" height="46" rx="6" class="q"/><text x="20" y="40" class="c" text-anchor="start">LOCKED HEADER</text><rect x="10" y="70" width="300" height="790" rx="8" class="b"/><text x="22" y="95" class="c" text-anchor="start">01  HERO — FULL ACCEPTED RU COPY</text><line x1="22" y1="104" x2="298" y2="104" stroke="#777"/><text x="22" y="132" class="c"><tspan x="22" dy="0">AI-СИСТЕМЫ, АВТОМАТИЗАЦИЯ И</tspan><tspan x="22" dy="14">ПРЕМИАЛЬНЫЕ САЙТЫ ДЛЯ</tspan><tspan x="22" dy="14">СЕРВИСНОГО БИЗНЕСА</tspan></text><text x="22" y="187" class="h"><tspan x="22" dy="0">Выстраиваем доверие.</tspan><tspan x="22" dy="27">Наводим порядок</tspan><tspan x="22" dy="27">в обращениях.</tspan><tspan x="22" dy="27">Сокращаем ручную работу.</tspan></text><text x="22" y="309" class="s"><tspan x="22" dy="0">ProAI Expert объединяет премиальный сайт,</tspan><tspan x="22" dy="15">практическую автоматизацию и AI с проверкой</tspan><tspan x="22" dy="15">человеком, чтобы клиент быстрее понимал</tspan><tspan x="22" dy="15">ценность бизнеса, оставлял полезный контекст,</tspan><tspan x="22" dy="15">а каждое обращение переходило к понятному</tspan><tspan x="22" dy="15">следующему шагу.</tspan></text><rect x="22" y="417" width="276" height="42" rx="20" class="r"/><text x="160.0" y="443" class="s" text-anchor="middle">Запросить первичный разбор</text><rect x="22" y="473" width="276" height="64" rx="6" class="n"/><text x="32" y="493" class="s"><tspan x="32" dy="0">Коротко опишите бизнес и основную проблему.</tspan><tspan x="32" dy="14">Мы оценим соответствие, определим приоритет</tspan><tspan x="32" dy="14">и предложим следующий полезный шаг.</tspan></text><rect x="22" y="549" width="276" height="38" rx="19" class="n"/><text x="160.0" y="573" class="s" text-anchor="middle">Смотреть клиентские проекты</text><text x="22" y="611" class="s"><tspan x="22" dy="0">Штат Вашингтон · Работаем по всей территории США</tspan><tspan x="22" dy="14">EN / RU / UA</tspan></text><rect x="22" y="654" width="276" height="48" rx="6" class="p"/><text x="160.0" y="683" class="s" text-anchor="middle">Доверие · Обращение · Ответ · Связь</text><line x1="4" y1="640" x2="316" y2="640" class="f"/><text x="312" y="636" class="s" text-anchor="end">640px FOLD</text><rect x="10" y="874" width="300" height="920" rx="8" class="b"/><text x="22" y="899" class="c" text-anchor="start">02  CONNECTED JOURNEY</text><line x1="22" y1="908" x2="298" y2="908" stroke="#777"/><text x="22" y="936" class="s"><tspan x="22" dy="0">Путь клиента не заканчивается после отправки формы.</tspan><tspan x="22" dy="15">Один путь соединяет сайт, запрос и ответ.</tspan></text><rect x="22" y="1001" width="276" height="55" rx="6" class="p"/><text x="32" y="1025" class="c" text-anchor="start">Недостаток доверия</text><rect x="22" y="1066" width="276" height="55" rx="6" class="p"/><text x="32" y="1090" class="c" text-anchor="start">Неясное обращение</text><rect x="22" y="1131" width="276" height="55" rx="6" class="p"/><text x="32" y="1155" class="c" text-anchor="start">Сбои в работе</text><rect x="22" y="1206" width="276" height="72" rx="6" class="b"/><text x="32" y="1232" class="c" text-anchor="start">1. Понять и доверять</text><rect x="22" y="1288" width="276" height="72" rx="6" class="b"/><text x="32" y="1314" class="c" text-anchor="start">2. Оставить понятный запрос</text><rect x="22" y="1370" width="276" height="72" rx="6" class="b"/><text x="32" y="1396" class="c" text-anchor="start">3. Направить и ответить</text><rect x="22" y="1452" width="276" height="72" rx="6" class="b"/><text x="32" y="1478" class="c" text-anchor="start">4. Продолжить и улучшить</text><rect x="22" y="1534" width="276" height="100" rx="6" class="n"/><text x="32" y="1558" class="c" text-anchor="start">ЗАКЛЮЧЕНИЕ</text><text x="32" y="1582" class="s"><tspan x="32" dy="0">Сайт формирует решение до обращения.</tspan><tspan x="32" dy="14">Автоматизация защищает процесс после обращения.</tspan><tspan x="32" dy="14">Лучше всего они работают как единая система.</tspan></text><rect x="10" y="1808" width="300" height="400" rx="8" class="b"/><text x="22" y="1833" class="c" text-anchor="start">03  TWO CORE DIRECTIONS</text><line x1="22" y1="1842" x2="298" y2="1842" stroke="#777"/><rect x="22" y="1866" width="276" height="145" rx="6" class="p"/><text x="32" y="1896" class="c" text-anchor="start">AI-СИСТЕМЫ И АВТОМАТИЗАЦИЯ</text><rect x="22" y="2026" width="276" height="145" rx="6" class="p"/><text x="32" y="2056" class="c" text-anchor="start">ПРЕМИАЛЬНЫЕ САЙТЫ И БРЕНДИНГ</text><rect x="10" y="2222" width="300" height="620" rx="8" class="b"/><text x="22" y="2247" class="c" text-anchor="start">04  FINANCIAL STREAM</text><line x1="22" y1="2256" x2="298" y2="2256" stroke="#777"/><rect x="22" y="2280" width="276" height="230" rx="6" class="q"/><text x="160.0" y="2402" class="s" text-anchor="middle">PRIMARY PROOF IMAGE</text><rect x="22" y="2527" width="276" height="42" rx="6" class="q"/><text x="32" y="2553" class="s" text-anchor="start">ДЕЙСТВУЮЩИЙ КЛИЕНТСКИЙ ПРОЕКТ · EN/RU</text><rect x="22" y="2652" width="276" height="70" rx="6" class="n"/><text x="32" y="2676" class="c" text-anchor="start">CLAIM BOUNDARY</text><rect x="10" y="2856" width="300" height="1086" rx="8" class="b"/><text x="22" y="2881" class="c" text-anchor="start">05  WAYS TO START</text><line x1="22" y1="2890" x2="298" y2="2890" stroke="#777"/><rect x="22" y="2911" width="276" height="310" rx="6" class="p"/><text x="32" y="2936" class="c" text-anchor="start"