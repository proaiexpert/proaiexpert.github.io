<svg xmlns="http://www.w3.org/2000/svg" width="844" height="4564" viewBox="0 0 844 4564"><style>.b{fill:#fafafa;stroke:#555}.p{fill:#eee;stroke:#777}.q{fill:#ddd;stroke:#666}.n{fill:#fff;stroke:#999;stroke-dasharray:4 3}.t{font:12px Arial;fill:#222}.s{font:10px Arial;fill:#444}.h{font:bold 20px Arial;fill:#111}.c{font:bold 9px Arial;letter-spacing:.8px;fill:#333}.r{fill:#ddd;stroke:#555}.f{stroke:#c33;stroke-dasharray:6 4}</style><rect x="3" y="3" width="838" height="5000" rx="7" class="b"/><rect x="14" y="12" width="816" height="44" rx="6" class="q"/><text x="26" y="39" class="c" text-anchor="start">LOCKED HEADER</text><rect x="14" y="68" width="816" height="430" rx="8" class="b"/><text x="26" y="93" class="c" text-anchor="start">01  HERO — FULL ACCEPTED RU COPY</text><line x1="26" y1="102" x2="818" y2="102" stroke="#777"/><text x="28" y="130" class="c" text-anchor="start">AI-СИСТЕМЫ, АВТОМАТИЗАЦИЯ И ПРЕМИАЛЬНЫЕ САЙТЫ ДЛЯ СЕРВИСНОГО БИЗНЕСА</text><text x="28" y="168" class="h"><tspan x="28" dy="0">Выстраиваем доверие. Наводим порядок в обращениях.</tspan><tspan x="28" dy="27">Сокращаем ручную работу.</tspan></text><text x="28" y="233" class="s"><tspan x="28" dy="0">ProAI Expert объединяет премиальный сайт, практическую автоматизацию и AI с проверкой человеком,</tspan><tspan x="28" dy="15">чтобы клиент быстрее понимал ценность бизнеса, оставлял полезный контекст,</tspan><tspan x="28" dy="15">а каждое обращение переходило к понятному следующему шагу.</tspan></text><rect x="28" y="300" width="250" height="36" rx="18" class="r"/><text x="153" y="323" class="s" text-anchor="middle">Запросить первичный разбор</text><rect x="300" y="286" width="515" height="58" rx="6" class="n"/><text x="312" y="307" class="s"><tspan x="312" dy="0">Коротко опишите бизнес и основную проблему. Мы оценим соответствие,</tspan><tspan x="312" dy="14">определим приоритет и предложим следующий полезный шаг.</tspan></text><rect x="28" y="354" width="230" height="32" rx="16" class="n"/><text x="143" y="375" class="s" text-anchor="middle">Смотреть клиентские проекты</text><text x="280" y="375" class="s" text-anchor="start">Штат Вашингтон · Работаем по всей территории США · EN / RU / UA</text><rect x="28" y="403" width="787" height="48" rx="6" class="p"/><text x="422" y="433" class="s" text-anchor="middle">Доверие · Обращение · Ответ · Связь</text><line x1="4" y1="390" x2="840" y2="390" class="f"/><text x="836" y="386" class="s" text-anchor="end">FIRST 390px VIEWPORT</text><rect x="14" y="512" width="816" height="650" rx="8" class="b"/><text x="26" y="537" class="c" text-anchor="start">02  CONNECTED JOURNEY — CONTAINED</text><line x1="26" y1="546" x2="818" y2="546" stroke="#777"/><text x="28" y="574" class="s"><tspan x="28" dy="0">Путь клиента не заканчивается после отправки формы.</tspan><tspan x="28" dy="15">Один путь соединяет сайт, запрос, ответ и дальнейшую связь.</tspan></text><rect x="28" y="622" width="250" height="64" rx="6" class="p"/><text x="40" y="649" class="c" text-anchor="start">Недостаток доверия</text><rect x="294" y="622" width="250" height="64" rx="6" class="p"/><text x="306" y="649" class="c" text-anchor="start">Неясное обращение</text><rect x="560" y="622" width="250" height="64" rx="6" class="p"/><text x="572" y="649" class="c" text-anchor="start">Сбои в работе</text><rect x="28" y="707" width="787" height="62" rx="6" class="b"/><text x="40" y="733" class="c" text-anchor="start">1. Понять и доверять</text><rect x="28" y="779" width="787" height="62" rx="6" class="b"/><text x="40" y="805" class="c" text-anchor="start">2. Оставить понятный запрос</text><rect x="28" y="851" width="787" height="62" rx="6" class="b"/><text x="40" y="877" class="c" text-anchor="start">3. Направить и ответить</text><rect x="28" y="923" width="787" height="62" rx="6" class="b"/><text x="40" y="949" class="c" text-anchor="start">4. Продолжить и улучшить</text><rect x="28" y="995" width="787" height="92" rx="6" class="n"/><text x="40" y="1019" class="c" text-anchor="start">ЗАКЛЮЧЕНИЕ</text><text x="40" y="1043" class="s"><tspan x="40" dy="0">Сайт формирует решение до обращения. Автоматизация защищает процесс после обращения.</tspan><tspan x="40" dy="14">Лучше всего они работают как единая система.</tspan></text><rect x="14" y="1176" width="816" height="350" rx="8" class="b"/><text x="26" y="1201" class="c" text-anchor="start">03  TWO CORE DIRECTIONS</text><line x1="26" y1="1210" x2="818" y2="1210" stroke="#777"/><rect x="28" y="1234" width="380" height="235" rx="6" class="p"/><rect x="436" y="1234" width="380" height="235" rx="6" class="p"/><text x="42" y="1264" class="c" text-anchor="start">AI-СИСТЕМЫ И АВТОМАТИЗАЦИЯ</text><text x="450" y="1264" class="c" text-anchor="start">ПРЕМИАЛЬНЫЕ САЙТЫ И БРЕНДИНГ</text><rect x="14" y="1540" width="816" height="500" rx="8" class="b"/><text x="26" y="1565" class="c" text-anchor="start">04  FINANCIAL STREAM</text><line x1="26" y1="1574" x2="818" y2="1574" stroke="#777"/><rect x="28" y="1598" width="500" height="365" rx="6" class="q"/><text x="278" y="1790" class="t" text-anchor="middle">PRIMARY PROOF IMAGE</text><rect x="548" y="1598" width="268" height="365" rx="6" class="p"/><text x="562" y="1628" class="c" text-anchor="start">LIVE CLIENT · EN/RU</text><rect x="562" y="1780" width="240" height="70" rx="6" class="n"/><text x="574" y="1805" class="c" text-anchor="start">CLAIM BOUNDARY</text><rect x="14" y="2054" width="816" height="700" rx="8" class="b"/><text x="26" y="2079" class="c" text-anchor="start">05  WAYS TO START — REVIEW CTA + SERVICE LINKS</text><line x1="26" y1="2088" x2="818" y2="2088" stroke="#777"/><rect x="28" y="2109" width="788" height="190" rx="6" class="p"/><text x="42" y="2137" class="c" text-anchor="start">01 WEBSITE &amp; TRUST</text><text x="42" y="2171" class="s"><tspan x="42" dy="0">BEST WHEN</tspan><tspan x="42" dy="32">FIRST OBJECTIVE</tspan><tspan x="42" dy="32">NOT IMPLIED</tspan></text><rect x="500" y="2151" width="280" height="34" rx="17" class="r"/><text