="315" class="display">Наводим порядок</text><text x="20" y="366" class="display">в обращениях.</text><text x="20" y="417" class="display">Сокращаем ручную</text><text x="20" y="468" class="display">работу.</text><text x="20" y="553" class="body"><tspan x="20" dy="0">ProAI Expert объединяет премиальный сайт,</tspan><tspan x="20" dy="20">практическую автоматизацию и AI с проверкой</tspan><tspan x="20" dy="20">человеком, чтобы клиент быстрее понимал</tspan><tspan x="20" dy="20">ценность бизнеса, оставлял полезный</tspan><tspan x="20" dy="20">контекст, а каждое обращение переходило к</tspan><tspan x="20" dy="20">понятному следующему шагу.</tspan></text><rect x="20" y="718" width="350" height="50" rx="12" fill="#66E3FF"/><text x="195" y="749" class="button" text-anchor="middle" style="fill:#06080B">Запросить первичный разбор</text><rect x="20" y="784" width="350" height="82" rx="12" fill="#131B23" stroke="#24313D"/><text x="34" y="812" class="small"><tspan x="34" dy="0">Коротко опишите бизнес и основную проблему. Мы</tspan><tspan x="34" dy="16">оценим соответствие, определим приоритет и</tspan><tspan x="34" dy="16">предложим следующий полезный шаг.</tspan></text><text x="20" y="908" class="small">Штат Вашингтон · Работаем по всей территории США · EN / RU / UA</text><rect x="0" y="948" width="390" height="900" fill="#0E1319"/><text x="20" y="986" class="eyebrow">02</text><text x="58" y="986" class="sectionTitle">CONNECTED JOURNEY</text><line x1="20" y1="1002" x2="370" y2="1002" stroke="#24313D"/><rect x="20" y="1038" width="350" height="56" rx="12" fill="#131B23" stroke="#24313D"/><text x="34" y="1072" class="status">НЕДОСТАТОК ДОВЕРИЯ</text><rect x="20" y="1110" width="350" height="56" rx="12" fill="#131B23" stroke="#24313D"/><text x="34" y="1144" class="status">НЕЯСНОЕ ОБРАЩЕНИЕ</text><rect x="20" y="1182" width="350" height="56" rx="12" fill="#131B23" stroke="#24313D"/><text x="34" y="1216" class="status">СБОИ В РАБОТЕ</text><rect x="20" y="1278" width="350" height="7