<!doctype html>
<html lang="en">
<head>

  <title>ProAI Expert — Selected Thinking R1.1 Owner Review</title>
  <link rel="stylesheet" href="../../../../assets/css/homepage-materials-editorial-v2.css">

  <style>
    :root{--bg:#050506;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;background:#050506;color:#fff;font-family:var(--font)}body{min-width:0;overflow-x:hidden}
    .review-context{display:none;background:#060607}.review-context.is-visible{display:block}.review-context__shell{width:min(calc(100% - 80px),1400px);margin:auto}
    .review-founder{padding:72px 0 76px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}.review-founder__grid{display:grid;grid-template-columns:220px minmax(0,680px);gap:56px;align-items:center}.review-founder__portrait{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:center;border:1px solid rgba(255,255,255,.1);background:#0b0b0d}
    .review-kicker{margin:0 0 14px;color:#9c96be;font:700 10px/1.4 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.review-founder h2,.review-work h2{margin:0;color:#f1f0ec;font-size:clamp(34px,4vw,58px);line-height:1;letter-spacing:-.045em;font-weight:620;max-width:15ch}.review-founder__scope{margin:18px 0 0;color:rgba(255,255,255,.72);font-size:13px}.review-founder__body{margin:16px 0 0;color:rgba(255,255,255,.56);font-size:15px;line-height:1.65;max-width:64ch}.review-founder__links{display:flex;gap:24px;margin-top:22px}.review-founder__links a,.review-work a{color:#dedbe7;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .review-work{padding:76px 0 90px;border-top:1px solid rgba(255,255,255,.08)}.review-work__head{display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:end}.review-work__intro{margin:0;color:rgba(255,255,255,.56);font-size:15px;line-height:1.6;max-width:54ch}.review-work__list{list-style:none;margin:42px 0 0;padding:0;border-top:1px solid rgba(255,255,255,.13)}.review-work__list li{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);min-height:74px;gap:20px}.review-work__case{display:flex;align-items:baseline;gap:14px}.review-work__case strong{font-size:20px;font-weight:560;letter-spacing:-.02em}.review-work__case small{color:rgba(255,255,255,.42);font:700 8px/1.3 ui-monospace,monospace;letter-spacing:.09em}.review-work__live{color:rgba(255,255,255,.55)!important}
    #component-slot{min-height:1px}#qa-metrics{display:none}.review-error{padding:80px 30px;color:#fff;font:600 16px/1.5 var(--font)}
    @media(max-width:700px){.review-context__shell{width:calc(100% - 34px)}.review-founder{padding:46px 0 50px}.review-founder__grid{grid-template-columns:1fr;gap:22px}.review-founder__portrait{width:96px}.review-founder h2,.review-work h2{font-size:32px}.review-founder__scope{font-size:11px}.review-founder__body{font-size:12px;line-height:1.55}.review-founder__links{gap:18px;margin-top:18px}.review-founder__links a,.review-work a{font-size:9px}.review-work{padding:50px 0 62px}.review-work__head{grid-template-columns:1fr;gap:13px}.review-work__intro{font-size:12px;line-height:1.5}.review-work__list{margin-top:25px}.review-work__list li{min-height:62px}.review-work__case{display:grid;gap:4px}.review-work__case strong{font-size:16px}.review-work__case small,.review-work__live{font-size:7px!important}}
  </style>
</head>
<body>
  <div id="context-before" class="review-context" aria-hidden="true"></div>
  <main id="component-slot"></main>
  <div id="context-after" class="review-context" aria-hidden="true"></div>
  <pre id="qa-metrics"></pre>

  <template id="founder-en"><section class="review-founder"><div class="review-context__shell"><div class="review-founder__grid"><img class="review-founder__portrait" src="../../../../ru/about/ProAI_Founder_Portrait_2x3.webp" alt="Ihor Horb, founder of ProAI Expert"><div><p class="review-kicker">FOUNDER, PROAI EXPERT</p><h2>Strategy, systems, and delivery stay connected.</h2><p class="review-founder__scope">Strategy · AI Systems · Automation · Website Architecture</p><p class="review-founder__body">I founded ProAI Expert to connect strategy, AI systems, automation, and website architecture into one working system for service businesses. Based in Washington, USA, I work in English, Russian, and Ukrainian.</p><div class="review-founder__links"><a href="/about/">My approach →</a><a href="https://www.linkedin.com/in/ihorhorb">LinkedIn ↗</a></div></div></div></div></section></template>
  <template id="founder-ru"><section class="review-founder"><div class="review-context__shell"><div class="review-founder__grid"><img class="review-founder__portrait" src="../../../../ru/about/ProAI_Founder_Portrait_2x3.webp" alt="Игорь Горб, основатель ProAI Expert"><div><p class="review-kicker">ОСНОВАТЕЛЬ PROAI EXPERT</p><h2>Стратегия, система и реализация остаются связанными.</h2><p class="review-founder__scope">Стратегия · AI-системы · Автоматизация · Архитектура сайтов</p><p class="review-founder__body">Я основал ProAI Expert, чтобы соединять стратегию, AI-системы, автоматизацию и архитектуру сайтов в одну рабочую систему для сервисного бизнеса.</p><div class="review-founder__links"><a href="/ru/about/">Мой подход →</a><a href="https://www.linkedin.com/in/ihorhorb">LinkedIn ↗</a></div></div></div></div></section></template>
  <template id="work-en"><section class="review-work"><div class="review-context__shell"><div class="review-work__head"><div><p class="review-kicker">SELECTED WORK</p><h2>Website systems built around different trust problems.</h2></div><p class="review-work__intro">See how strategy, UX, bilingual content and production change across financial services, personal expertise and local-service journeys.</p></div><ul class="review-work__list"><li><a class="review-work__case" href="/case-studies/financial-stream/"><strong>Financial Stream</strong><small>LIVE CLIENT · EN/RU</small></a><a class="review-work__live" href="https://financialstreamllc.com/">Live website ↗</a></li><li><a class="review-work__case" href="/case-studies/alina-horb/"><strong>Alina Horb</strong><small>LIVE CLIENT · UA/RU</small></a><a class="review-work__live" href="https://alinahorb.com/">Live website ↗</a></li><li><a class="review-work__case" href="/case-studies/local-repair-pro/"><strong>Local Repair Pro</strong><small>WEBSITE CONCEPT · LIVE DEMO</small></a><a class="review-work__live" href="/handyman-vancouver-portland-demo/">Live demo ↗</a></li></ul></div></section></template>
  <template id="work-ru"><section class="review-work"><div class="review-context__shell"><div class="review-work__head"><div><p class="review-kicker">ИЗБРАННЫЕ РАБОТЫ</p><h2>Системы сайта для разных задач доверия.</h2></div><p class="review-work__intro">Посмотрите, как стратегия, UX, двуязычный контент и разработка меняются для финансовых услуг, личной экспертности и локального сервиса.</p></div><ul class="review-work__list"><li><a class="review-work__case" href="/ru/case-studies/financial-stream/"><strong>Financial Stream</strong><small>КЛИЕНТСКИЙ ПРОЕКТ · EN/RU</small></a><a class="review-work__live" href="https://financialstreamllc.com/">Живой сайт ↗</a></li><li><a class="review-work__case" href="/ru/case-studies/alina-horb/"><strong>Алина Горб</strong><small>КЛИЕНТСКИЙ ПРОЕКТ · UA/RU</small></a><a class="review-work__live" href="https://alinahorb.com/">Живой сайт ↗</a></li><li><a class="review-work__case" href="/ru/case-studies/local-repair-pro/"><strong>Local Repair Pro</strong><small>КОНЦЕПТ САЙТА · LIVE DEMO</small></a><a class="review-work__live" href="/handyman-vancouver-portland-demo/">Live demo ↗</a></li></ul></div></section></template>

  <script>
  (function(){
    var p=new URLSearchParams(location.search),lang=p.get('lang')==='ru'?'ru':'en',version=p.get('version')==='r1'?'r1':'r11',context=p.get('context')==='1';
    document.documentElement.lang=lang;document.title='ProAI Expert — Selected Thinking '+(version==='r1'?'R1':'R1.1')+' Owner Review';
    document.getElementById('r11-css').disabled=version==='r1';
    var before=document.getElementById('context-before'),after=document.getElementById('context-after'),slot=document.getElementById('component-slot');
    if(context){before.innerHTML=document.getElementById('founder-'+lang).innerHTML;after.innerHTML=document.getElementById('work-'+lang).innerHTML;before.classList.add('is-visible');after.classList.add('is-visible');before.setAttribute('aria-hidden','false');after.setAttribute('aria-hidden','false');}
    function metrics(){var s=document.querySelector('#selected-thinking-r1');if(!s)return;var r=s.getBoundingClientRect();document.getElementById('qa-metrics').textContent=JSON.stringify({lang:lang,version:version,width:innerWidth,height:innerHeight,sectionHeight:Math.round(r.height),viewportHeights:+(r.height/innerHeight).toFixed(3),horizontalOverflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),runningAnimations:document.getAnimations().filter(function(a){return a.playState==='running'}).length});}
    fetch('../../../../_includes/home-selected-thinking-r1-'+lang+'.html').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(html){slot.innerHTML=html;var s=document.createElement('script');s.src='../../../../assets/js/home-selected-thinking-r1.js';s.onload=function(){setTimeout(metrics,1850);};document.body.appendChild(s);}).catch(function(err){slot.innerHTML='<div class="review-error">Component load failed: '+String(err)+'</div>';});
  })();
  </script>
</body>
</html>
