<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProAI Expert — Financial Stream Verified System R1 Owner Review</title>
<link rel="stylesheet" href="../../../../assets/css/home-technology-ecosystem-r1.css">
<link rel="stylesheet" href="../../../../assets/css/home-work-proof-financial-stream-r1.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#f2f5f6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.review-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(3,4,5,.94);backdrop-filter:blur(14px)}.review-bar strong{font:750 9px/1.4 ui-monospace,monospace;letter-spacing:.13em}.review-actions{display:flex;gap:6px}.review-actions button{min-height:34px;padding:0 13px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.03);color:#f2f5f6;font:750 9px/1 ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}.review-actions button[aria-pressed="true"]{background:#f1f5f6;color:#071016}.review-tech-shell{background:#050607}.review-exit{min-height:52vh;display:grid;place-items:center;padding:64px 24px;background:linear-gradient(180deg,#090c0f,#030405)}.review-exit div{width:min(100%,1520px);padding-top:28px;border-top:1px solid rgba(255,255,255,.08)}.review-exit p{margin:0;color:rgba(242,245,246,.35);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}.review-exit h2{max-width:12ch;margin:16px 0 0;color:rgba(242,245,246,.18);font-size:clamp(42px,7vw,96px);font-weight:560;line-height:.9;letter-spacing:-.055em}.review-loading{min-height:70vh;display:grid;place-items:center;color:rgba(255,255,255,.5);font:700 10px/1.4 ui-monospace,monospace;letter-spacing:.13em}@media(max-width:640px){.review-bar{align-items:flex-start}.review-bar strong{max-width:22ch}}
</style>
</head>
<body>
<div class="review-bar"><strong>WORK / PROOF — FINANCIAL STREAM VERIFIED SYSTEM R1</strong><div class="review-actions" role="group" aria-label="Review language"><button type="button" data-review-switch="en" aria-pressed="true">EN</button><button type="button" data-review-switch="ru" aria-pressed="false">RU</button></div></div>
<div class="review-tech-shell"><section class="home-tech-r1" data-home-tech-r1 aria-labelledby="review-tech-title"><div class="home-tech-r1__shell"><header class="home-tech-r1__heading"><p class="home-tech-r1__eyebrow" data-tech-eyebrow>04 / TECHNOLOGY ECOSYSTEM</p><h2 id="review-tech-title" data-tech-title>SELECTED PLATFORMS &amp; INTEGRATIONS</h2></header><ul class="home-tech-r1__register" aria-label="Selected ProAI Expert platforms and integrations"><li data-brand="openai"><img src="../../../../assets/brand/platforms/openai-mark.svg" alt="OpenAI"></li><li data-brand="claude"><img src="../../../../assets/brand/platforms/claude-mark.svg" alt="Claude"></li><li data-brand="gemini"><img src="../../../../assets/brand/platforms/gemini-mark.svg" alt="Gemini"></li><li data-brand="n8n"><img src="../../../../assets/brand/platforms/n8n-wordmark.svg" alt="n8n"></li><li data-brand="make"><img src="../../../../assets/brand/platforms/make-wordmark.svg" alt="Make"></li><li data-brand="twilio"><img src="../../../../assets/brand/platforms/twilio-mark.svg" alt="Twilio"></li><li data-brand="vercel"><img src="../../../../assets/brand/platforms/vercel-wordmark.svg" alt="Vercel"></li><li data-brand="gmail"><img src="../../../../assets/brand/platforms/gmail-mark.svg" alt="Gmail"></li><li data-brand="zapier"><img src="../../../../assets/brand/platforms/zapier-mark.svg" alt="Zapier"></li><li data-brand="github"><img src="../../../../assets/brand/platforms/github-wordmark.svg" alt="GitHub"></li></ul></div></section></div>
<main id="proof-review"><div class="review-loading">LOADING VERIFIED SYSTEM…</div></main>
<section class="review-exit"><div><p data-exit-label>06 / NEXT HOMEPAGE BLOCK · CONTEXT ONLY</p><h2 data-exit-title>Return to the ProAI system.</h2></div></section>
<script src="../../../../assets/js/home-technology-ecosystem-r1.js"></script>
<script>
(async()=>{
const host=document.querySelector('#proof-review'),buttons=[...document.querySelectorAll('[data-review-switch]')],techEye=document.querySelector('[data-tech-eyebrow]'),techTitle=document.querySelector('[data-tech-title]'),exitLabel=document.querySelector('[data-exit-label]'),exitTitle=document.querySelector('[data-exit-title]');
const copy={en:{eye:'04 / TECHNOLOGY ECOSYSTEM',title:'SELECTED PLATFORMS & INTEGRATIONS',exit:'06 / NEXT HOMEPAGE BLOCK · CONTEXT ONLY',exitTitle:'Return to the ProAI system.'},ru:{eye:'04 / ТЕХНОЛОГИЧЕСКАЯ ЭКОСИСТЕМА',title:'ИЗБРАННЫЕ ПЛАТФОРМЫ И ИНТЕГРАЦИИ',exit:'06 / СЛЕДУЮЩИЙ БЛОК · ТОЛЬКО КОНТЕКСТ',exitTitle:'Возврат в систему ProAI.'}};
async function setLang(lang){
  const file=lang==='ru'?'home-work-proof-financial-stream-r1-ru.html':'home-work-proof-financial-stream-r1-en.html';
  buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.reviewSwitch===lang)));
  techEye.textContent=copy[lang].eye;techTitle.textContent=copy[lang].title;exitLabel.textContent=copy[lang].exit;exitTitle.textContent=copy[lang].exitTitle;document.documentElement.lang=lang;
  const res=await fetch(`../../../../_includes/${file}`,{cache:'no-store'});if(!res.ok)throw new Error(`include ${res.status}`);let html=await res.text();html=html.replaceAll('/assets/','../../../../assets/');host.innerHTML=html;
  const old=document.querySelector('#proof-runtime');if(old)old.remove();const s=document.createElement('script');s.id='proof-runtime';s.src='../../../../assets/js/home-work-proof-financial-stream-r1.js';document.body.appendChild(s);
  const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);window.scrollTo(0,0);
}
buttons.forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.reviewSwitch)));
try{await setLang(new URLSearchParams(location.search).get('lang')==='ru'?'ru':'en')}catch(e){host.innerHTML='<div class="review-loading">REVIEW LOAD FAILED</div>';console.error(e)}
})();
</script>
</body>
</html>
