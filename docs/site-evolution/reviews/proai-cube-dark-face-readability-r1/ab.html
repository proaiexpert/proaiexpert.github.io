<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ProAI Cube Dark-Face A/B</title><style>html,body{margin:0;width:100%;height:100%;background:#050506;color:#fff;font:13px/1.2 Inter,system-ui,sans-serif;overflow:hidden}.stage{position:fixed;inset:0}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050506;transition:opacity .12s linear}.frame[data-active="false"]{opacity:0;pointer-events:none}.bar{position:fixed;z-index:10;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(5,6,7,.78);backdrop-filter:blur(12px)}button{border:0;border-radius:999px;padding:8px 13px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}button[aria-pressed="true"]{background:rgba(255,255,255,.2)}</style></head><body><div class="stage"><iframe id="a" class="frame" data-active="true" title="Baseline A"></iframe><iframe id="b" class="frame" data-active="false" title="Candidate B"></iframe></div><div class="bar"><button id="showA" aria-pressed="true">A baseline</button><button id="showB" aria-pressed="false">B polish</button><button id="reload">Sync reload</button></div><script>const p=new URLSearchParams(location.search),seed=p.get('motionSeed')||'142857',a=document.getElementById('a'),b=document.getElementById('b');function load(){a.src=`./review.html?variant=A&motionSeed=${encodeURIComponent(seed)}`;b.src=`./review.html?variant=B&motionSeed=${encodeURIComponent(seed)}`;}function show(v){const isA=v==='A';a.dataset.active=String(isA);b.dataset.active=String(!isA);showA.setAttribute('aria-pressed',String(isA));showB.setAttribute('aria-pressed',String(!isA));}showA.onclick=()=>show('A');showB.onclick=()=>show('B');reload.onclick=load;load();</script></body></html>
