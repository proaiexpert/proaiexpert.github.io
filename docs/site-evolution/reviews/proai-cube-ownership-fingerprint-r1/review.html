<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PROAI CUBE — R1.1 Micro-Etch Owner Review</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; }
    @font-face { font-family: "Instrument Sans Variable"; src: url("/assets/fonts/proai-logo-r341/instrument-sans-latin-wght-normal.woff2") format("woff2"); font-style: normal; font-weight: 100 900; }
    html, body { margin: 0; min-height: 100%; background: #050607; color: #e8edf2; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 100vh; }
    #cube-canvas { display: block; width: 100%; height: 100vh; min-height: 390px; background: #050607; }
    aside { box-sizing: border-box; padding: 22px 18px; border-left: 1px solid #222932; background: #0a0d11; overflow: auto; }
    h1 { margin: 0 0 5px; font-size: 18px; letter-spacing: .02em; }
    p { margin: 0 0 16px; color: #9aa6b2; }
    button { display: block; width: 100%; margin: 8px 0; padding: 10px 12px; border: 1px solid #35414e; border-radius: 6px; background: #111820; color: #e8edf2; text-align: left; cursor: pointer; }
    button:hover { border-color: #8ba4bd; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; color: #a9d8df; font-size: 11px; }
    [data-status="pass"] { color: #9de3bd; }
    [data-status="fail"] { color: #f1a5a5; }
    @media (max-width: 760px) { body { display: block; } #cube-canvas { height: 68vh; } aside { min-height: 32vh; border-left: 0; border-top: 1px solid #222932; } }
  </style>
  <script type="importmap">{"imports":{"three":"/assets/vendor/three-r180/build/three.module.min.js","three/addons/":"/assets/vendor/three-r180/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="cube-canvas" data-proai-asset-id="PAI-CUBE-0001" aria-label="Interactive PROAI CUBE"></canvas>
  <aside>
    <h1>PROAI CUBE · R1.1</h1>
    <p>Golden 7b recovery. Existing cube motion plus one modular optical micro-etch.</p>
    <p id="ready" data-status="pending">Loading canonical runtime…</p>
    <button id="qa">Run mechanics QA</button>
    <button id="golden">Golden 7b reference</button>
    <button id="off">Micro-Etch OFF</button>
    <button id="whisper">A — Whisper</button>
    <button id="signature">B — Signature</button>
    <button id="reference">C — Reference</button>
    <button id="rest-pose">Rest pose</button>
    <button id="glint-pose">Glint pose</button>
    <button id="opposite-pose">Opposite-side pose</button>
    <button id="active-slice">Active slice 50%</button>
    <button id="turn">Run existing slice turn</button>
    <button id="rest">Return to rest</button>
    <button id="forensic">Toggle forensic witness inspection</button>
    <pre id="diagnostics">Waiting for runtime…</pre>
  </aside>
  <span id="runtime-status" hidden></span>
  <script type="module">
    import '/assets/js/proai-hero-cube-r1/source-final-motion-r2-touch-auto-45-r1.js?owner-review-r1d';

    const runtime = window.__PROAI_CUBE_R1_2;
    const query = new URLSearchParams(location.search);
    const keepAutoplayRunning = query.has('autoplay');
    let qaReport = null;
    const ready = document.getElementById('ready');
    const diagnostics = document.getElementById('diagnostics');
    const render = () => {
      if (!runtime?.ready) return;
      const report = runtime.getDiagnostics();
      ready.textContent = report.ownership.goldenReferenceMode
        ? 'READY · GOLDEN 7b REFERENCE · Micro-Etch OFF'
        : `READY · ${report.ownership.publicName} · ${report.ownership.revision} · ${report.ownership.microEtch.label}`;
      ready.dataset.status = 'pass';
      diagnostics.textContent = JSON.stringify({
        ownership: report.ownership,
        hierarchy: report.hierarchy,
        mechanics: report.mechanics,
        geometry: report.geometry,
        presentation: report.presentation,
        interaction: report.interaction,
        scheduler: report.scheduler,
        renderer: report.renderer,
        canonicalError: report.canonicalError,
        automatedQA: qaReport,
      }, null, 2);
      document.documentElement.dataset.proaiCubeReady = 'true';
      document.documentElement.dataset.proaiAssetId = report.ownership.assetId;
    };
    const waitForReady = async () => {
      const startedAt = performance.now();
      while (!runtime?.ready && performance.now() - startedAt < 15000) await new Promise((resolve) => setTimeout(resolve, 50));
      if (!keepAutoplayRunning) runtime?.stopChoreography?.();
      runtime?.renderReviewFrame?.();
      render();
    };
    const runReviewQA = async () => {
      runtime.stopChoreography?.();
      const axisSupport = {};
      for (const [axis, layer] of [['X', 1], ['Y', 0], ['Z', -1]]) {
        const forward = await runtime.turnSlice({ axis, layer, direction: 1, instant: true, ignoreInteraction: true });
        const inverse = await runtime.turnSlice({ axis, layer, direction: -1, instant: true, ignoreInteraction: true });
        axisSupport[axis] = {
          forwardEndpointErrorRad: forward?.endpointErrorRad ?? null,
          inverseEndpointErrorRad: inverse?.endpointErrorRad ?? null,
          pass: forward?.endpointErrorRad === 0 && inverse?.endpointErrorRad === 0,
        };
      }
      const pairedTurnQA = await runtime.runPairedTurnQA();
      const report = runtime.getDiagnostics();
      return {
        axisSupport,
        pairedTurnQA,
        canonicalError: report.canonicalError,
        pass: Object.values(axisSupport).every((entry) => entry.pass)
          && pairedTurnQA.memberObjectIntersectionCount === 0
          && pairedTurnQA.restorationLogical.coordinateMismatch === 0
          && pairedTurnQA.restorationLogical.orientationMismatch === 0
          && report.canonicalError.maxPosition < 1e-6
          && report.canonicalError.maxQuaternionRad < 1e-6
          && report.canonicalError.maxScale < 1e-8,
      };
    };
    document.getElementById('qa').addEventListener('click', async () => {
      if (!runtime?.ready) return;
      qaReport = await runReviewQA();
      render();
    });
    document.getElementById('turn').addEventListener('click', async () => {
      if (!runtime?.ready) return;
      runtime.startChoreography?.();
      await runtime.turnSlice({ axis: 'X', layer: 1, direction: 1, durationMs: 1180, ignoreInteraction: true });
      runtime.stopChoreography?.();
      render();
    });
    document.getElementById('rest').addEventListener('click', () => {
      runtime?.stopChoreography?.();
      runtime?.setMicroEtchVariant?.(new URLSearchParams(location.search).get('etch') || 'signature');
      runtime?.renderReviewFrame?.();
      render();
    });
    document.getElementById('forensic').addEventListener('click', () => {
      const enabled = runtime?.setForensicInspection?.(true);
      diagnostics.textContent += `\n\nForensic inspection visible: ${enabled}`;
      render();
    });
    const switchMode = (mode) => {
      const next = new URL(location.href);
      next.searchParams.set('capture', '1');
      next.searchParams.set('review', '1');
      next.searchParams.delete('golden-reference');
      next.searchParams.delete('etch');
      if (mode === 'golden') next.searchParams.set('golden-reference', '1');
      else if (mode !== 'off') next.searchParams.set('etch', mode);
      location.assign(next.href);
    };
    document.getElementById('golden').addEventListener('click', () => switchMode('golden'));
    document.getElementById('off').addEventListener('click', () => switchMode('off'));
    document.getElementById('whisper').addEventListener('click', () => switchMode('whisper'));
    document.getElementById('signature').addEventListener('click', () => switchMode('signature'));
    document.getElementById('reference').addEventListener('click', () => switchMode('reference'));
    const setPose = (timeSec) => {
      runtime?.stopChoreography?.();
      runtime?.setReviewPresentation?.(timeSec, 1, true);
      render();
    };
    document.getElementById('rest-pose').addEventListener('click', () => setPose(0));
    document.getElementById('glint-pose').addEventListener('click', () => setPose(5.6));
    document.getElementById('opposite-pose').addEventListener('click', () => setPose(30.9));
    document.getElementById('active-slice').addEventListener('click', () => {
      runtime?.stopChoreography?.();
      const turn = runtime?.beginReviewTurn?.('X', 1, 1);
      if (turn) runtime.setReviewTurnProgress?.(turn.id, 0.5, true);
      render();
    });
    await waitForReady();
    window.setInterval(render, 250);
  </script>
</body>
</html>
