<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ProAI Cube — Touch Living-Auto 30% vs 45%</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506;color:#fff;font:13px/1.2 Inter,system-ui,sans-serif}.stage{position:fixed;inset:0}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050506;transition:opacity .12s linear}.frame[data-active="false"]{opacity:0;pointer-events:none}.bar{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(5,6,7,.82);backdrop-filter:blur(12px)}button{border:0;border-radius:999px;padding:8px 13px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}button[aria-pressed="true"]{background:rgba(255,255,255,.22)}</style></head><body><div class="stage"><iframe id="a" class="frame" data-active="true" title="30 percent baseline"></iframe><iframe id="b" class="frame" data-active="false" title="45 percent candidate"></iframe></div><div class="bar"><button id="showA" aria-pressed="true">A · 30%</button><button id="showB" aria-pressed="false">B · 45%</button><button id="reload">Sync reload</button></div><script>const p=new URLSearchParams(location.search);const seed=p.get('motionSeed')||'142857';const a=document.getElementById('a'),b=document.getElementById('b');function src(v){return `./review.html?variant=${v}&motionSeed=${encodeURIComponent(seed)}`;}function load(){a.src=src('A');b.src=src('B');}function show(v){const isA=v==='A';a.dataset.active=String(isA);b.dataset.active=String(!isA);showA.setAttribute('aria-pressed',String(isA));showB.setAttribute('aria-pressed',String(!isA));}showA.onclick=()=>show('A');showB.onclick=()=>show('B');reload.onclick=load;load();</script></body></html>
