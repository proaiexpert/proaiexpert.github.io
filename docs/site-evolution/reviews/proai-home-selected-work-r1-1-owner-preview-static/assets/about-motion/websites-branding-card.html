<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Websites and Branding Motion Card</title>
<style>
:root{--cyan:#4DEEEA;--gold:#DDAA55;--surface:rgba(14,14,16,.86);--edge:rgba(255,255,255,.08);--edge-strong:rgba(255,255,255,.15);--ghost:rgba(255,255,255,.15);--ease:cubic-bezier(.2,.8,.2,1)}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.viewport{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:transparent}
.arch{position:relative;width:min(100%,520px);height:min(100%,300px);transform-style:preserve-3d;transform:rotateY(-20deg) rotateX(11deg) rotateZ(-1deg);animation:sway 18s ease-in-out infinite alternate}
.layer{position:absolute;top:50%;left:50%;transform-style:preserve-3d;box-sizing:border-box}
.foundation{width:330px;height:220px;margin:-110px -165px;transform:translateZ(-96px);background:var(--surface);border:1px solid rgba(255,255,255,.03);box-shadow:0 44px 90px rgba(0,0,0,.78);overflow:hidden}
.foundation:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:18px 18px;opacity:.42}
.logic{width:276px;height:184px;margin:-92px -62px;transform:translateZ(-2px);background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.005));backdrop-filter:blur(14px) saturate(120%);border:1px solid var(--edge);border-top:1px solid var(--edge-strong);box-shadow:0 24px 50px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden}
.logic-glow{position:absolute;bottom:10%;right:8%;width:96px;height:96px;border-radius:50%;background:var(--gold);filter:blur(52px);opacity:.12;animation:glow 15s ease-in-out infinite alternate}
.presentation{width:228px;height:154px;margin:-77px -154px;transform:translateZ(88px);background:linear-gradient(120deg,rgba(255,255,255,.065),transparent 62%,rgba(255,255,255,.03));backdrop-filter:blur(8px);border:1px solid var(--edge);border-left:1px solid var(--edge-strong);box-shadow:-12px 22px 42px rgba(0,0,0,.38)}
.presentation:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 18%,rgba(255,255,255,.05) 43%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 57%,transparent 84%);background-size:250% 250%;animation:sweep 10s var(--ease) infinite;pointer-events:none}
.strut{position:absolute;background:rgba(255,255,255,.12);transform-style:preserve-3d;width:66px;height:1px;top:116px;left:-22px;transform:translateZ(-34px) rotateY(-90deg);transform-origin:left}
.bracket{position:absolute;width:12px;height:12px;border:1px solid var(--ghost)}
.bracket.tl{top:14px;left:14px;border-right:none;border-bottom:none}
.bracket.br{bottom:14px;right:14px;border-left:none;border-top:none}
.tick-x{position:absolute;bottom:0;left:36px;width:1px;height:7px;background:var(--ghost)}
.tick-y{position:absolute;right:0;top:38px;width:7px;height:1px;background:var(--ghost)}
.crosshair{position:absolute;top:39%;left:29%;width:11px;height:11px}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.22)}
.crosshair:before{top:5px;left:0;width:11px;height:1px}
.crosshair:after{top:0;left:5px;width:1px;height:11px}
.status{position:absolute;top:18px;right:18px;width:4px;height:4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px 2px rgba(77,238,234,.4)}
.logic-track{position:absolute;top:0;left:56px;width:1px;height:100%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.05) 20%,rgba(255,255,255,.05) 80%,transparent)}
.logic-line{position:absolute;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.055) 22%,rgba(255,255,255,.055) 78%,transparent)}
.logic-line.one{top:34%}.logic-line.two{top:68%}
@keyframes sway{0%{transform:rotateY(-18deg) rotateX(8deg) rotateZ(-1deg) translateY(-4px)}100%{transform:rotateY(-25deg) rotateX(15deg) rotateZ(1deg) translateY(4px)}}
@keyframes glow{0%{transform:translate(0,0) scale(.92);opacity:.09}100%{transform:translate(-22px,-46px) scale(1.16);opacity:.17}}
@keyframes sweep{0%,18%{background-position:250% 250%}82%,100%{background-position:-150% -150%}}
</style>
</head>
<body>
<div class="viewport"><div class="arch"><div class="layer strut"></div><div class="layer foundation"></div><div class="layer logic"><div class="logic-glow"></div><div class="logic-track"></div><div class="logic-line one"></div><div class="logic-line two"></div></div><div class="layer presentation"><div class="bracket tl"></div><div class="bracket br"></div><div class="tick-x"></div><div class="tick-y"></div><div class="crosshair"></div><div class="status"></div></div></div></div>
</body>
</html>
