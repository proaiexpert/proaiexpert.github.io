<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProAI Expert — Footer Signature R4 Owner Review</title>
<style>
html,body{margin:0;min-height:100%;background:#050506;color:#f2f0eb;font:14px/1.5 Inter,system-ui,sans-serif}
#review-loading{min-height:100vh;display:grid;place-items:center;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,240,235,.55)}
#review-error{max-width:680px;padding:32px;color:#f2f0eb}
</style>
</head>
<body>
<div id="review-loading">Loading integrated Owner preview…</div>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'ru' ? 'ru' : 'en';
  var source = lang === 'ru' ? './owner-review-ru.html' : './owner-review-en.html';

  fetch(source, { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) throw new Error('Preview source failed: ' + response.status);
      return response.text();
    })
    .then(function (html) {
      var injection = [
        '<link rel="stylesheet" href="./assets/css/home-footer-signature-r4.css?v=20260824.1">',
        '<script src="./assets/js/home-footer-signature-r4.js?v=20260824.1" defer><\/script>'
      ].join('\n');

      /* Review-only path correction: the static harness contains root-relative
         1120w Financial Stream srcset candidates. Retina/mobile browsers prefer
         those candidates, but /assets resolves outside this immutable review
         directory. Keep production markup untouched and make only the copied
         review assets self-contained. The copied home-hero blobs are separately
         SHA-verified against the product authority. */
      html = html
        .replace('/assets/img/cases/financial-stream/delivery-v2/en/fs-en-01-home-hero-1120.webp', './assets/img/cases/financial-stream/delivery-v2/en/fs-en-01-home-hero-1120.webp')
        .replace('/assets/img/cases/financial-stream/delivery-v2/ru/fs-ru-01-home-hero-1120.webp', './assets/img/cases/financial-stream/delivery-v2/ru/fs-ru-01-home-hero-1120.webp');

      if (html.indexOf('</body>') === -1) throw new Error('Preview source has no closing body tag.');
      html = html.replace('</body>', injection + '\n</body>');

      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (error) {
      document.body.innerHTML = '<div id="review-error"><strong>Owner preview failed to load.</strong><br>' + String(error.message || error) + '</div>';
    });
}());
</script>
</body>
</html>
