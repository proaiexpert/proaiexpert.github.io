<style>
html{scroll-behavior:auto;background:#050506}body{margin:0;background:#050506;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.review-nav{position:fixed;right:12px;bottom:12px;z-index:99999;display:flex;gap:6px}.review-nav a{padding:9px 11px;border:1px solid rgba(255,255,255,.14);background:rgba(2,3,4,.88);color:#c9cdd1;text-decoration:none;font:700 9px/1.2 ui-monospace,monospace;letter-spacing:.12em}.review-error{padding:40px;color:#f2f0eb}.review-freeze .tw-r2__face,.review-freeze .tw-r2__fold,.review-freeze .tw-r2__material::after,.review-freeze .tw-r2__content,.review-freeze .tw-r2__inscription,.review-freeze .tw-r2__registers,.review-freeze .tw-r2__thesis,.review-freeze .tw-r2__cta{transition:none!important}.review-next-shell{position:relative;z-index:3} @media(max-width:600px){.review-nav{display:none}}

<body class="lang-ru">
<div class="review-nav"><a href="index.html">REVIEW</a><a href="live.html">EN</a></div>
<div id="connected-mount"></div>
<main id="r2-mount"></main>
<div id="next-mount" class="review-next-shell"></div>
<script>
(function(){
  'use strict';
  var root='../../../../';
  function rewriteAssets(scope){scope.querySelectorAll('[src^="/assets/"]').forEach(function(el){el.setAttribute('src',root+el.getAttribute('src').slice(1));});}
  function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s);});}
  function applyReviewState(){
    var mode=new URLSearchParams(location.search).get('review');
    if(!mode)return;
    document.documentElement.classList.add('review-freeze');
    var section=document.querySelector('[data-tw-r2]'); if(!section)return;
    var states={
      'mobile-ai':['ai','0%','-3deg','0px','82%','72deg','-110px','105%'],
      'mobile-turn':['turn','-41%','-37.5deg','-55px','41%','37.5deg','-55px','50%'],
      'mobile-web':['web','-82%','-72deg','-110px','0%','3deg','0px','-5%']
    };
    if(mode==='neutral'||mode==='ai'||mode==='web')section.setAttribute('data-focus',mode);
    if(states[mode]){var v=states[mode];section.setAttribute('data-focus',v[0]);section.style.setProperty('--tw-mobile-ai-x',v[1]);section.style.setProperty('--tw-mobile-ai-ry',v[2]);section.style.setProperty('--tw-mobile-ai-z',v[3]);section.style.setProperty('--tw-mobile-web-x',v[4]);section.style.setProperty('--tw-mobile-web-ry',v[5]);section.style.setProperty('--tw-mobile-web-z',v[6]);section.style.setProperty('--tw-mobile-fold-x',v[7]);}
  }
  Promise.all([
    fetch(root+'_includes/homepage-connected-system-ru.html').then(function(r){if(!r.ok)throw new Error('Connected System '+r.status);return r.text();}),
    fetch(root+'_includes/homepage-two-worlds-r2-ru.html').then(function(r){if(!r.ok)throw new Error('R2 '+r.status);return r.text();}),
    fetch(root+'_includes/homepage-current-ru.html').then(function(r){if(!r.ok)throw new Error('Homepage '+r.status);return r.text();})
  ]).then(function(parts){
    document.getElementById('connected-mount').innerHTML=parts[0];
    document.getElementById('r2-mount').innerHTML=parts[1];
    var exp=document.querySelector('[data-tw-experience]');if(exp)exp.id='mobile-scene';
    rewriteAssets(document.getElementById('r2-mount'));
    var parsed=new DOMParser().parseFromString(parts[2],'text/html');
    var methodology=parsed.querySelector('#methodology');
    if(methodology){var clone=methodology.cloneNode(true);rewriteAssets(clone);document.getElementById('next-mount').appendChild(clone);}
    return loadScript(root+'assets/js/homepage-connected-system-r13.js?v=20260815.1').then(function(){return loadScript(root+'assets/js/homepage-two-worlds-r2.js?v=20260817.1');});
  }).then(function(){requestAnimationFrame(function(){requestAnimationFrame(applyReviewState);});}).catch(function(err){document.body.insertAdjacentHTML('beforeend','<pre class="review-error">'+String(err)+'</pre>');});
}());
</script>
</body>
</html>
