<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boxes Hover — Native Material Layer Lab R1</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020304;color:#F2F0EB}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#020304}
    body{overflow:hidden}
    .lab-stage{position:fixed;inset:0;background:#020304}
    .lab-stage canvas{display:block;width:100%;height:100%;outline:none}
    .lab-panel{position:fixed;z-index:2;top:18px;left:18px;max-width:min(620px,calc(100vw - 36px));padding:16px 18px;border:1px solid rgba(242,240,235,.18);border-radius:9px;background:linear-gradient(180deg,rgba(21,26,32,.94),rgba(7,9,11,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 16px 42px rgba(0,0,0,.35)}
    .lab-kicker{margin:0 0 6px;color:#A8B0FF;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
    .lab-title{margin:0;font-size:18px;line-height:1.15;font-weight:650}
    .lab-status{margin:9px 0 12px;color:#8C949D;font:500 11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
    .lab-controls{display:flex;flex-wrap:wrap;gap:8px}
    .lab-controls button{min-height:34px;padding:0 11px;border:1px solid rgba(242,240,235,.25);border-radius:7px;color:#F2F0EB;background:#11151A;font:650 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;cursor:pointer}
    .lab-controls button:hover,.lab-controls button:focus-visible{border-color:#A8B0FF;background:#1A2027;outline:2px solid #A8B0FF;outline-offset:3px}
    .lab-controls button:active{transform:translateY(1px)}
    .lab-controls button:disabled{opacity:.42;cursor:not-allowed}
    .lab-diagnostics{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(242,240,235,.12)}
    .lab-diagnostics summary{color:#8C949D;font:600 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
    .lab-diagnostics .lab-controls{margin-top:9px}
    html[data-material-lab-qa="1"] .lab-diagnostics{display:block}
    @media (max-width:700px){.lab-panel{top:10px;left:10px;max-width:calc(100vw - 20px);padding:13px}.lab-title{font-size:16px}.lab-status{max-height:90px;overflow:auto}}
  </style>
</head>
<body>
  <div class="lab-stage"><canvas data-material-lab-canvas data-payload-url="./assets/3d/boxes-hover/public-original-inline-scene-payload.bin" data-payload-sha="c3bcabd43c232045b059704e8d4be57634314b7da2fcfa5ebbd448ee40a16798" aria-label="Original Boxes Hover material layer laboratory"></canvas></div>
  <section class="lab-panel" aria-label="Native material layer lab controls">
    <p class="lab-kicker">Golden donor · native layer lab R1</p>
    <h1 class="lab-title">Boxes Hover material layer laboratory</h1>
    <p class="lab-status" data-material-lab-status>Loading exact payload…</p>
    <div class="lab-controls">
      <button type="button" data-material-mode="native">NATIVE</button>
      <button type="button" data-material-mode="black" disabled aria-disabled="true" title="Disabled after pattern fidelity blocker">A · BLACK CHROME</button>
      <button type="button" data-material-mode="champagne" disabled aria-disabled="true" title="Disabled after pattern fidelity blocker">B · CHAMPAGNE</button>
      <button type="button" data-material-mode="violet" disabled aria-disabled="true" title="Disabled after pattern fidelity blocker">C · VIOLET / INDIGO</button>
    </div>
    <details class="lab-diagnostics">
      <summary>QA diagnostics</summary>
      <div class="lab-controls">
        <button type="button" data-material-test="diagnostic-red-green">RED / GREEN</button>
        <button type="button" data-material-test="diagnostic-swap">SWAP</button>
        <button type="button" data-material-test="one-black">ONE A</button>
        <button type="button" data-material-test="one-champagne">ONE B</button>
        <button type="button" data-material-test="one-violet">ONE C</button>
        <button type="button" data-material-test="three-black">THREE A</button>
        <button type="button" data-material-test="three-champagne">THREE B</button>
        <button type="button" data-material-test="three-violet">THREE C</button>
        <button type="button" data-material-test="cluster-black">CLUSTER A</button>
        <button type="button" data-material-test="cluster-champagne">CLUSTER B</button>
        <button type="button" data-material-test="cluster-violet">CLUSTER C</button>
        <button type="button" data-material-test="restore-all">RESTORE ALL</button>
      </div>
    </details>
  </section>
  <script>if(new URLSearchParams(location.search).get('qa')==='1')document.documentElement.dataset.materialLabQa='1';</script>
  <script type="module" src="./assets/boxes-hover-material-layer-lab-r1.js?r13=lab11"></script>
</body>
</html>
