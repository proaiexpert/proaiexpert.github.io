<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Selected Thinking R2 — RU Owner Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/assets/css/home-system-execution-r2.css?v=20260903.1">
<link rel="stylesheet" href="/assets/css/home-system-execution-r2-ready-readability-r1.css?v=20260903.1">
<link rel="stylesheet" href="/assets/css/home-selected-thinking-r2.css?v=decision-aperture-r2">
<link rel="stylesheet" href="/assets/css/home-selected-work-curated-evidence-r1.css?v=20260905.1">
<style>
html,body{margin:0;background:#07080a;color:#f2f1ed;font-family:Inter,system-ui,sans-serif}
body{overflow-x:hidden}
.preview-load{display:grid;min-height:100vh;place-items:center;color:rgba(242,241,237,.56);font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
.preview-debug{position:fixed;z-index:9999;right:10px;bottom:10px;display:none;gap:7px;align-items:center;padding:7px 9px;border:1px solid rgba(242,241,237,.18);background:rgba(7,8,10,.88);color:#f2f1ed;font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.preview-debug a{color:inherit}
.preview-debug.is-on{display:flex}
</style>
</head>
<body>
<main id="preview-root"><div class="preview-load">ЗАГРУЗКА КОНТЕКСТА R2</div></main>
<div class="preview-debug" id="preview-debug"><span>R2 / RU</span><a href="/owner-preview/selected-thinking-r2/">EN</a></div>
<script>
(async function(){
  const root=document.getElementById('preview-root');
  const paths=[
    '/_includes/home-system-execution-r2-ru.html',
    '/_includes/home-selected-thinking-r2-ru.html',
    '/_includes/home-selected-work-r1-ru.html'
  ];
  try{
    const html=await Promise.all(paths.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error(p+' '+r.status);
      return r.text();
    }));
    root.innerHTML=html.join('\n');
    for(const src of [
      '/assets/js/home-system-execution-r2.js?v=20260903.1',
      '/assets/js/home-selected-thinking-r2.js?v=decision-aperture-r2',
      '/assets/js/home-selected-work-curated-evidence-r1.js?v=20260905.1'
    ]){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src=src;
        s.onload=resolve;
        s.onerror=reject;
        document.body.appendChild(s);
      });
    }
    if(new URLSearchParams(location.search).get('debug')==='1'){
      document.getElementById('preview-debug').classList.add('is-on');
    }
  }catch(error){
    root.innerHTML='<div class="preview-load">ОШИБКА PREVIEW<br>'+String(error)+'</div>';
  }
})();
</script>
</body>
</html>
