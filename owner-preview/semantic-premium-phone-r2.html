<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020304">
  <link rel="icon" href="data:,">
  <title>Semantic Premium R2 — Phone Review</title>
  <style>
    :root{color-scheme:dark;background:#020304}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#020304;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .scene{position:fixed;inset:0;background:#020304}
    [data-premium-canvas]{display:block;width:100%;height:100%}
    .top{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;pointer-events:none;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .tag,.status{border:1px solid rgba(201,205,209,.18);background:rgba(2,3,4,.76);backdrop-filter:blur(12px);padding:8px 10px;color:#8c949d;font-size:10px;line-height:1.2;letter-spacing:.11em;text-transform:uppercase}
    .status{max-width:62%;text-align:right;color:#c9cdd1}
    .guide{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));pointer-events:none;text-align:center;color:#8c949d;font-size:10px;line-height:1.35;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 8px #020304}
    .guide b{font-weight:800}.indigo{color:#a8b0ff}.silver{color:#d8dce0}.pearl{color:#f2f0eb}
    .controls{position:fixed;z-index:30;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:6px;border:1px solid rgba(201,205,209,.18);background:rgba(2,3,4,.88);backdrop-filter:blur(14px)}
    .controls a{min-width:0;padding:12px 2px;text-align:center;text-decoration:none;border:1px solid rgba(201,205,209,.16);background:#07090b;color:#8c949d;font-size:11px;font-weight:750;letter-spacing:.06em}
    .controls a[aria-current="page"]{color:#f2f0eb;border-color:#676bff;background:#11151a;box-shadow:inset 0 0 0 1px rgba(103,107,255,.45)}
    @media (orientation:landscape) and (max-height:520px){.guide{bottom:60px;font-size:9px}.controls a{padding:9px 2px}.tag,.status{padding:6px 8px;font-size:9px}}
  </style>
</head>
<body>
  <main class="scene"><canvas data-premium-canvas aria-label="Semantic Premium Boxes Hover field"></canvas></main>
  <div class="top"><div class="tag">R2 · PHONE REVIEW</div><div class="status" data-premium-status>LOADING</div></div>
  <div class="guide"><b class="indigo">INDIGO</b> = active · <b class="silver">SILVER</b> = resolved · <b class="pearl">PEARL</b> = decision gate</div>
  <nav class="controls" aria-label="Semantic state review">
    <a href="?lang=en&state=base" data-state-link="base">BASE</a>
    <a href="?lang=en&state=agent" data-state-link="agent">1</a>
    <a href="?lang=en&state=automation" data-state-link="automation">2</a>
    <a href="?lang=en&state=api" data-state-link="api">3</a>
    <a href="?lang=en&state=custom-code" data-state-link="custom-code">4</a>
    <a href="?lang=en&state=gate" data-state-link="gate">GATE</a>
  </nav>
  <script type="module" src="./assets/semantic-premium-r2.js"></script>
</body>
</html>
