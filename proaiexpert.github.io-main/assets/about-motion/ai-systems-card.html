<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Systems Motion Card</title>
<style>
:root{--bg:#030304;--cyan:#4DEEEA;--cyan-ghost:rgba(77,238,234,.15);--ice:#E2F1F8;--silver:rgba(226,241,248,.08);--silver-ghost:rgba(255,255,255,.03)}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.viewport{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:transparent}
.stage{position:relative;width:min(100%,520px);height:min(100%,280px);transform-style:preserve-3d;animation:drift 18s ease-in-out infinite alternate}
.core{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d}
.core-pin{position:absolute;top:-3px;left:-3px;width:6px;height:6px;border-radius:50%;background:var(--ice);box-shadow:0 0 18px 2px var(--cyan),0 0 34px 10px rgba(77,238,234,.15);animation:core 9s ease-in-out infinite alternate}
.core-field{position:absolute;top:-34px;left:-34px;width:68px;height:68px;border-radius:22px;border:1px solid var(--cyan-ghost);transform:rotate(45deg) rotateX(68deg);opacity:.7;animation:field 8s ease-in-out infinite alternate}
.arch{position:absolute;inset:0;transform-style:preserve-3d;animation:global 140s linear infinite}
.ring{position:absolute;top:50%;left:50%;border-radius:26px;transform-style:preserve-3d}
 .ring.alpha{width:300px;height:220px;margin:-110px -150px;border:1px solid rgba(255,255,255,.04);border-right-color:rgba(77,238,234,.28);border-top-color:rgba(226,241,248,.10);transform:rotateX(68deg) rotateY(14deg) rotateZ(8deg);animation:orbitA 54s linear infinite}
.ring.beta{width:360px;height:260px;margin:-130px -180px;border:1px dashed rgba(255,255,255,.035);border-left-color:rgba(77,238,234,.12);border-bottom-color:rgba(226,241,248,.08);transform:rotateX(-52deg) rotateY(-22deg) rotateZ(-8deg);animation:orbitB 76s linear infinite reverse}
.ring.gamma{width:220px;height:160px;margin:-80px -110px;border:1px solid transparent;border-top:1px solid rgba(226,241,248,.16);border-right:1px solid rgba(77,238,234,.12);background:radial-gradient(circle at 74% 24%, var(--silver-ghost) 0, transparent 52%);transform:rotateX(80deg) rotateZ(34deg);animation:orbitC 42s linear infinite}
.facet-shell{position:absolute;top:50%;left:50%;transform-style:preserve-3d;animation:shell 140s linear infinite reverse}
.facet{position:absolute;width:118px;height:118px;margin:-59px;background:linear-gradient(135deg,rgba(255,255,255,.018),transparent 78%);border:1px solid rgba(255,255,255,.024);backdrop-filter:blur(1px);transform-style:preserve-3d}
.facet:before,.facet:after{content:"";position:absolute}
.facet:before{top:-1px;left:-1px;width:8px;height:8px;border-top:1px solid var(--cyan);border-left:1px solid var(--cyan);opacity:.55}
.facet:after{bottom:-1px;right:-1px;width:5px;height:5px;border-bottom:1px solid rgba(255,255,255,.22);border-right:1px solid rgba(255,255,255,.22)}
.node{position:absolute;border-radius:50%;background:var(--ice);box-shadow:0 0 10px var(--cyan)}
.node.one{width:4px;height:4px;top:0;left:50%;transform:translate(-50%,-50%);opacity:.92}
.node.two{width:3px;height:3px;bottom:18%;right:12%;background:var(--cyan);opacity:.72;animation:twinkle 5.8s ease-in-out infinite}
.node.three{width:3px;height:3px;top:26%;left:20%;background:var(--ice);opacity:.62;animation:twinkle 6.5s ease-in-out infinite 1.6s}
.route{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(77,238,234,.35),rgba(255,255,255,.14),transparent);opacity:.34;transform-origin:left center}
.route.one{width:140px;top:46%;left:30%;transform:rotate(14deg);animation:route 7s ease-in-out infinite}
.route.two{width:118px;top:59%;left:38%;transform:rotate(-18deg);animation:route 8.5s ease-in-out infinite 1.7s}
.route.three{width:96px;top:34%;left:42%;transform:rotate(68deg);animation:route 9s ease-in-out infinite 2.4s}
.dust{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,255,255,.78);box-shadow:0 0 8px rgba(77,238,234,.22);opacity:.16;animation:dust 9s ease-in-out infinite alternate}
@keyframes drift{0%{transform:rotateY(-5deg) rotateX(2deg) translateY(-6px)}100%{transform:rotateY(5deg) rotateX(-2deg) translateY(6px)}}
@keyframes global{0%{transform:rotateY(0) rotateX(0) rotateZ(0)}100%{transform:rotateY(360deg) rotateX(120deg) rotateZ(60deg)}}
@keyframes shell{0%{transform:rotateY(0) rotateZ(0)}100%{transform:rotateY(360deg) rotateZ(-150deg)}}
@keyframes orbitA{0%{transform:rotateX(68deg) rotateY(14deg) rotateZ(8deg)}100%{transform:rotateX(68deg) rotateY(14deg) rotateZ(368deg)}}
@keyframes orbitB{0%{transform:rotateX(-52deg) rotateY(-22deg) rotateZ(-8deg)}100%{transform:rotateX(-52deg) rotateY(-22deg) rotateZ(352deg)}}
@keyframes orbitC{0%{transform:rotateX(80deg) rotateZ(34deg)}100%{transform:rotateX(80deg) rotateZ(394deg)}}
@keyframes core{0%{transform:scale(.95);opacity:.82}100%{transform:scale(1.06);opacity:1}}
@keyframes field{0%{transform:rotate(45deg) rotateX(68deg) scale(.92);opacity:.34}100%{transform:rotate(45deg) rotateX(68deg) scale(1.08);opacity:.78;border-color:rgba(77,238,234,.34)}}
@keyframes twinkle{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}}
@keyframes route{0%,100%{opacity:.18}50%{opacity:.44}}
@keyframes dust{0%{transform:translate3d(0,0,0);opacity:.08}100%{transform:translate3d(8px,-10px,0);opacity:.2}}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage"><div class="arch"><div class="ring alpha"><div class="node one"></div></div><div class="ring beta"><div class="node two"></div></div><div class="ring gamma"><div class="node three"></div></div></div><div class="facet-shell" id="facetShell"></div><div class="route one"></div><div class="route two"></div><div class="route three"></div><div class="core"><div class="core-field"></div><div class="core-pin"></div></div></div></div>
<script>
const shell=document.getElementById('facetShell');
const radius=82;
for(let i=0;i<6;i++){const p=document.createElement('div');p.className='facet';const ry=i*(360/6);const rx=i%2===0?32:-32;p.style.transform=`rotateY(${ry}deg) rotateX(${rx}deg) translateZ(${radius}px)`;shell.appendChild(p);} 
const stage=document.getElementById('stage');
for(let i=0;i<12;i++){const d=document.createElement('div');d.className='dust';d.style.left=(12+Math.random()*76)+'%';d.style.top=(12+Math.random()*76)+'%';d.style.animationDelay=(Math.random()*6).toFixed(2)+'s';stage.appendChild(d);} 
</script>
</body>
</html>
