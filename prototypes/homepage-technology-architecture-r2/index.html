<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ProAI Expert — Technology Architecture R2</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
<section class="ta2" data-ta2 aria-labelledby="ta2-title-en">
  <div class="ta2__shell">
    <header class="ta2__intro">
      <p class="ta2__eyebrow">04 / TECHNOLOGY ARCHITECTURE</p>
      <h1 id="ta2-title-en">The system determines the tools.</h1>
      <p class="ta2__support">We choose models, automation, communication and infrastructure around the workflow — not the other way around.</p>
    </header>

    <div class="ta2__stage" aria-label="ProAI technology composition object">
      <div class="ta2__object" data-ta2-object>
        <div class="ta2__aura" aria-hidden="true"></div>
        <div class="ta2__depth" aria-hidden="true"></div>

        <div class="ta2__spine" aria-hidden="true">
          <span class="ta2__spine-cap ta2__spine-cap--top"></span>
          <span class="ta2__spine-core"></span>
          <span class="ta2__spine-cap ta2__spine-cap--bottom"></span>
          <span class="ta2__fit-label"><b>SYSTEM FIT</b><small>requirements shape the stack</small></span>
        </div>

        <div class="ta2__assembly" aria-label="Technology families and available platforms">
          <button class="ta2__plate ta2__plate--models" type="button" data-family="models" aria-pressed="false">
            <span class="ta2__plate-material" aria-hidden="true"></span>
            <span class="ta2__register" aria-hidden="true"></span>
            <span class="ta2__family">MODELS</span>
            <span class="ta2__vendors">
              <span class="ta2__vendor"><img src="/assets/brand/platforms/openai-mark.svg" alt=""><span>OpenAI</span></span>
              <span class="ta2__vendor"><img src="/assets/brand/platforms/claude-mark.svg" alt=""><span>Claude</span></span>
              <span class="ta2__vendor"><img src="/assets/brand/platforms/gemini-mark.svg" alt=""><span>Gemini</span></span>
            </span>
          </button>

          <button class="ta2__plate ta2__plate--automation" type="button" data-family="automation" aria-pressed="false">
            <span class="ta2__plate-material" aria-hidden="true"></span>
            <span class="ta2__register" aria-hidden="true"></span>
            <span class="ta2__family">AUTOMATION</span>
            <span class="ta2__vendors">
              <span class="ta2__vendor"><img src="/assets/brand/platforms/n8n-mark.svg" alt=""><span>n8n</span></span>
              <span class="ta2__vendor"><img src="/assets/brand/platforms/make-mark.svg" alt=""><span>Make</span></span>
              <span class="ta2__vendor"><img src="/assets/brand/platforms/zapier-mark.svg" alt=""><span>Zapier</span></span>
            </span>
          </button>

          <button class="ta2__plate ta2__plate--communication" type="button" data-family="communication" aria-pressed="false">
            <span class="ta2__plate-material" aria-hidden="true"></span>
            <span class="ta2__register" aria-hidden="true"></span>
            <span class="ta2__family">COMMUNICATION</span>
            <span class="ta2__vendors">
              <span class="ta2__vendor"><img src="/assets/brand/platforms/twilio-mark.svg" alt=""><span>Twilio</span></span>
              <span class="ta2__vendor"><img src="/assets/brand/platforms/gmail-mark.svg" alt=""><span>Gmail</span></span>
            </span>
          </button>

          <button class="ta2__plate ta2__plate--delivery" type="button" data-family="delivery" aria-pressed="false">
            <span class="ta2__plate-material" aria-hidden="true"></span>
            <span class="ta2__register" aria-hidden="true"></span>
            <span class="ta2__family">BUILD / DELIVERY</span>
            <span class="ta2__vendors">
              <span class="ta2__vendor"><img src="/assets/brand/platforms/vercel-mark.svg" alt=""><span>Vercel</span></span>
              <span class="ta2__vendor"><img src="/assets/brand/platforms/github-mark.svg" alt=""><span>GitHub</span></span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<script src="./motion.js" defer></script>
</body>
</html>
