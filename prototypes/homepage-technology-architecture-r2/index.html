<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ProAI Expert — Technology Architecture R2</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
<section class="taa" data-taa aria-labelledby="taa-title-en">
  <div class="taa__shell">
    <header class="taa__intro">
      <p class="taa__eyebrow">04 / TECHNOLOGY ARCHITECTURE</p>
      <h1 id="taa-title-en">The system determines the tools.</h1>
      <p class="taa__support">We choose models, automation, communication and infrastructure around the workflow — not the other way around.</p>
    </header>

    <div class="taa__stage">
      <div class="taa__object" data-taa-object aria-label="Technology composition object: system fit shapes four technology families and their available platforms">
        <span class="taa__object-shadow" aria-hidden="true"></span>
        <div class="taa__assembly">
          <span class="taa__backplane" aria-hidden="true"></span>

          <button class="taa__plate taa__plate--models" type="button" data-family="models" aria-pressed="false">
            <span class="taa__plate-surface" aria-hidden="true"></span>
            <span class="taa__family">MODELS</span>
            <span class="taa__vendors">
              <span class="taa__vendor"><img src="/assets/brand/platforms/openai-mark.svg" alt=""><span>OpenAI</span></span>
              <span class="taa__vendor"><img src="/assets/brand/platforms/claude-mark.svg" alt=""><span>Claude</span></span>
              <span class="taa__vendor"><img src="/assets/brand/platforms/gemini-mark.svg" alt=""><span>Gemini</span></span>
            </span>
          </button>

          <button class="taa__plate taa__plate--automation" type="button" data-family="automation" aria-pressed="false">
            <span class="taa__plate-surface" aria-hidden="true"></span>
            <span class="taa__family">AUTOMATION</span>
            <span class="taa__vendors">
              <span class="taa__vendor"><img src="/assets/brand/platforms/n8n-mark.svg" alt=""><span>n8n</span></span>
              <span class="taa__vendor"><img src="/assets/brand/platforms/make-mark.svg" alt=""><span>Make</span></span>
              <span class="taa__vendor"><img src="/assets/brand/platforms/zapier-mark.svg" alt=""><span>Zapier</span></span>
            </span>
          </button>

          <button class="taa__plate taa__plate--communication" type="button" data-family="communication" aria-pressed="false">
            <span class="taa__plate-surface" aria-hidden="true"></span>
            <span class="taa__family">COMMUNICATION</span>
            <span class="taa__vendors">
              <span class="taa__vendor"><img src="/assets/brand/platforms/twilio-mark.svg" alt=""><span>Twilio</span></span>
              <span class="taa__vendor"><img src="/assets/brand/platforms/gmail-mark.svg" alt=""><span>Gmail</span></span>
            </span>
          </button>

          <button class="taa__plate taa__plate--delivery" type="button" data-family="delivery" aria-pressed="false">
            <span class="taa__plate-surface" aria-hidden="true"></span>
            <span class="taa__family">BUILD / DELIVERY</span>
            <span class="taa__vendors">
              <span class="taa__vendor"><img src="/assets/brand/platforms/vercel-mark.svg" alt=""><span>Vercel</span></span>
              <span class="taa__vendor"><img src="/assets/brand/platforms/github-mark.svg" alt=""><span>GitHub</span></span>
            </span>
          </button>

          <div class="taa__fit-key" aria-hidden="true">
            <span class="taa__fit-edge"></span>
            <span class="taa__fit-copy"><small>SYSTEM</small><b>FIT</b><i>requirements shape the stack</i></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<script src="./motion.js" defer></script>
</body>
</html>
