<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ProAI Expert — Технологическая архитектура R3</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main>
<section class="tas3 tas3--ru" data-tas3 aria-labelledby="tas3-title-ru">
  <div class="tas3__shell">
    <header class="tas3__intro">
      <p class="tas3__eyebrow">04 / ТЕХНОЛОГИЧЕСКАЯ АРХИТЕКТУРА</p>
      <h1 id="tas3-title-ru">Система определяет инструменты.</h1>
      <p class="tas3__support">Мы подбираем модели, автоматизацию, коммуникации и инфраструктуру под реальный процесс — а не строим процесс вокруг конкретного сервиса.</p>
    </header>

    <div class="tas3__stage">
      <div class="tas3__object" data-tas3-object aria-label="Единый адаптивный технологический объект, форму которого задают требования системы">
        <span class="tas3__object-shadow" aria-hidden="true"></span>

        <div class="tas3__body">
<svg class="tas3__form" viewBox="0 0 900 460" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="tas3-base" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3a424b"/>
                <stop offset=".23" stop-color="#171c22"/>
                <stop offset=".56" stop-color="#080b0f"/>
                <stop offset=".82" stop-color="#111820"/>
                <stop offset="1" stop-color="#2c343c"/>
              </linearGradient>
              <linearGradient id="tas3-depth" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#171d24"/>
                <stop offset="1" stop-color="#020304"/>
              </linearGradient>
              <linearGradient id="tas3-facet-a" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#dbe0e3" stop-opacity=".11"/>
                <stop offset=".55" stop-color="#7c8790" stop-opacity=".035"/>
                <stop offset="1" stop-color="#000" stop-opacity=".13"/>
              </linearGradient>
              <linearGradient id="tas3-facet-b" x1="1" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#bec7cd" stop-opacity=".085"/>
                <stop offset=".45" stop-color="#726c83" stop-opacity=".035"/>
                <stop offset="1" stop-color="#000" stop-opacity=".16"/>
              </linearGradient>
              <linearGradient id="tas3-ridge" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f4f4f0" stop-opacity=".18"/>
                <stop offset=".22" stop-color="#9fa9b0" stop-opacity=".12"/>
                <stop offset=".52" stop-color="#242b32" stop-opacity=".8"/>
                <stop offset=".82" stop-color="#a4afb6" stop-opacity=".11"/>
                <stop offset="1" stop-color="#f4f4f0" stop-opacity=".05"/>
              </linearGradient>
              <filter id="tas3-blur-soft"><feGaussianBlur stdDeviation="12"/></filter>
              <clipPath id="tas3-shell-clip"><path d="M58 232C50 153 103 86 180 54C251 24 326 31 382 50C414 61 426 92 456 96C493 100 515 66 546 53C603 30 683 47 744 82C812 121 852 177 848 236C844 314 801 374 729 409C649 448 559 444 476 432C391 420 302 447 218 428C139 410 86 365 66 309C57 284 53 258 58 232Z"/></clipPath>

            <path class="tas3__form-depth" d="M58 232C50 153 103 86 180 54C251 24 326 31 382 50C414 61 426 92 456 96C493 100 515 66 546 53C603 30 683 47 744 82C812 121 852 177 848 236C844 314 801 374 729 409C649 448 559 444 476 432C391 420 302 447 218 428C139 410 86 365 66 309C57 284 53 258 58 232Z"/>

              <polygon class="tas3__facet tas3__facet--models" points="25,224 171,29 390,28 457,234 249,253 62,390"/>
              <polygon class="tas3__facet tas3__facet--automation" points="457,234 536,25 764,62 886,228 658,251"/>

              <path class="tas3__crease tas3__crease--b" d="M456 235C585 232 704 246 824 264"/>
            </g>
            <path class="tas3__form-edge" d="M58 232C50 153 103 86 180 54C251 24 326 31 382 50C414 61 426 92 456 96C493 100 515 66 546 53C603 30 683 47 744 82C812 121 852 177 848 236C844 314 801 374 729 409C649 448 559 444 476 432C391 420 302 447 218 428C139 410 86 365 66 309C57 284 53 258 58 232Z"/>

          <span class="tas3__focus-light" aria-hidden="true"></span>
          <span class="tas3__fit" aria-hidden="true"><small>СИСТЕМА</small><b>FIT</b><i>требования формируют состав</i></span>

          <button class="tas3__sector tas3__sector--models" type="button" data-family="models" aria-pressed="false">
            <span class="tas3__family">МОДЕЛИ</span>
            <span class="tas3__vendors">
              <span class="tas3__vendor"><img src="/assets/brand/platforms/openai-mark.svg" alt=""><span>OpenAI</span></span>
              <span class="tas3__vendor"><img src="/assets/brand/platforms/claude-mark.svg" alt=""><span>Claude</span></span>
              <span class="tas3__vendor"><img src="/assets/brand/platforms/gemini-mark.svg" alt=""><span>Gemini</span></span>
            </span>
          </button>

          <button class="tas3__sector tas3__sector--automation" type="button" data-family="automation" aria-pressed="false">
            <span class="tas3__family">АВТОМАТИЗАЦИЯ</span>
            <span class="tas3__vendors">
              <span class="tas3__vendor"><img src="/assets/brand/platforms/n8n-mark.svg" alt=""><span>n8n</span></span>
              <span class="tas3__vendor"><img src="/assets/brand/platforms/make-mark.svg" alt=""><span>Make</span></span>
              <span class="tas3__vendor"><img src="/assets/brand/platforms/zapier-mark.svg" alt=""><span>Zapier</span></span>
            </span>
          </button>

          <button class="tas3__sector tas3__sector--communication" type="button" data-family="communication" aria-pressed="false">
            <span class="tas3__family">КОММУНИКАЦИИ</span>
            <span class="tas3__vendors">
              <span class="tas3__vendor"><img src="/assets/brand/platforms/twilio-mark.svg" alt=""><span>Twilio</span></span>
              <span class="tas3__vendor"><img src="/assets/brand/platforms/gmail-mark.svg" alt=""><span>Gmail</span></span>
            </span>
          </button>

          <button class="tas3__sector tas3__sector--delivery" type="button" data-family="delivery" aria-pressed="false">
            <span class="tas3__family">РАЗРАБОТКА / ЗАПУСК</span>
            <span class="tas3__vendors">
              <span class="tas3__vendor"><img src="/assets/brand/platforms/vercel-mark.svg" alt=""><span>Vercel</span></span>
              <span class="tas3__vendor"><img src="/assets/brand/platforms/github-mark.svg" alt=""><span>GitHub</span></span>
            </span>
          </button>

        </div>
      </div>
    </div>
  </div>
</section>
</main>
<script src="./motion.js" defer></script>
</body>
</html>
