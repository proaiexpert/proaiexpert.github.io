<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ProAI Expert — Technology Selection Instrument R1</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <section class="tsi" data-tsi aria-labelledby="tsi-title-en">
      <div class="tsi__shell">
        <header class="tsi__intro">
          <p class="tsi__eyebrow">04 / TECHNOLOGY ARCHITECTURE</p>
          <h1 id="tsi-title-en">The system determines the tools.</h1>
          <p class="tsi__support">We choose models, automation, communication and infrastructure around the workflow — not the other way around.</p>
        </header>

        <div class="tsi__stage" aria-label="Technology selection calibration instrument">
          <div class="tsi__instrument" data-tsi-instrument>
            <span class="tsi__serial" aria-hidden="true">PROAI / SELECTION R1</span>
            <span class="tsi__edge tsi__edge--a" aria-hidden="true"></span>
            <span class="tsi__edge tsi__edge--b" aria-hidden="true"></span>

            <div class="tsi__criterion tsi__criterion--process"><span>PROCESS FIT</span></div>
            <div class="tsi__criterion tsi__criterion--context"><span>CONTEXT</span></div>
            <div class="tsi__criterion tsi__criterion--control"><span>CONTROL</span></div>
            <div class="tsi__criterion tsi__criterion--integration"><span>INTEGRATION</span></div>

            <div class="tsi__optics" aria-hidden="true">
              <span class="tsi__lens tsi__lens--models"></span>
              <span class="tsi__lens tsi__lens--automation"></span>
              <span class="tsi__lens tsi__lens--communication"></span>
              <span class="tsi__lens tsi__lens--delivery"></span>
              <span class="tsi__reticle tsi__reticle--h"></span>
              <span class="tsi__reticle tsi__reticle--v"></span>
              <span class="tsi__fit-core"><b>SYSTEM FIT</b><small>requirements first</small></span>
            </div>

            <div class="tsi__families" aria-label="Technology families and available choices">
              <button class="tsi__family tsi__family--models" type="button" data-family="models" aria-pressed="false">
                <span class="tsi__family-label">MODELS</span>
                <span class="tsi__vendors">
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/openai-mark.svg" alt=""><span>OpenAI</span></span>
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/claude-mark.svg" alt=""><span>Claude</span></span>
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/gemini-mark.svg" alt=""><span>Gemini</span></span>
                </span>
              </button>

              <button class="tsi__family tsi__family--automation" type="button" data-family="automation" aria-pressed="false">
                <span class="tsi__family-label">AUTOMATION</span>
                <span class="tsi__vendors">
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/n8n-mark.svg" alt=""><span>n8n</span></span>
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/make-mark.svg" alt=""><span>Make</span></span>
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/zapier-mark.svg" alt=""><span>Zapier</span></span>
                </span>
              </button>

              <button class="tsi__family tsi__family--communication" type="button" data-family="communication" aria-pressed="false">
                <span class="tsi__family-label">COMMUNICATION</span>
                <span class="tsi__vendors">
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/twilio-mark.svg" alt=""><span>Twilio</span></span>
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/gmail-mark.svg" alt=""><span>Gmail</span></span>
                </span>
              </button>

              <button class="tsi__family tsi__family--delivery" type="button" data-family="delivery" aria-pressed="false">
                <span class="tsi__family-label">BUILD / DELIVERY</span>
                <span class="tsi__vendors">
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/vercel-mark.svg" alt=""><span>Vercel</span></span>
                  <span class="tsi__vendor"><img src="/assets/brand/platforms/github-mark.svg" alt=""><span>GitHub</span></span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="./motion.js" defer></script>
</body>
</html>
